abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a set of methods, headers and resource types that define the calendaring and scheduling extension to the WebDAV protocol. The new protocol elements are intended to make WebDAV-based calendaring an intereropable standard that supports single-user calendar access, calendar sharing, and calendar publishing.</p>"
