abstract:
- language: en
  script: Latn
  content: "<p>Stream Control Transmission Protocol (SCTP) provides a realiable communication
    channel between two end-hosts in may way similar to TCP.  This document describes
    how to express media transport over SCTP using the Session Description Protocol
    (SDP).  It defines the SDP 'SCTP' protocol identifier.</p>"
