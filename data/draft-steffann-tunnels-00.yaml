abstract:
- language: en
  script: Latn
  content: "<p>This document provides an overview of various ways to to tunnel IPv6
    packets over IPv4 networks. It covers mechanisms in contemporary use, touches
    on several mechanisms that are now only of historic interest, and discusses some
    newer tunneling mechanisms that are not (yet) widely used at the time of publication.</p>"
