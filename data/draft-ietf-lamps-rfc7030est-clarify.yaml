title:
- language: en
  script: Latn
  content: 'Clarification of Enrollment over Secure Transport (EST): Transfer Encodings
    and ASN.1'
  format: text/plain
docidentifier:
- content: draft-ietf-lamps-rfc7030est-clarify
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: '<p>This document updates RFC 7030: Enrollment over Secure Transport to
    resolve some errata that were reported and that have proven to cause interoperability
    issues when RFC 7030 was extended. This document deprecates the specification
    of "Content-Transfer-Encoding" headers for Enrollment over Secure Transport (EST)
    endpoints. This document fixes some syntactical errors in ASN.1 that were present.</p>'
  format: text/html
