abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Principal Agent Protocol (PAP), a cryptographic
    protocol for human-controlled agent-to-agent transactions. PAP establishes a trust
    model rooted in human principals, defines hierarchical delegation through signed
    mandates, enforces context minimization through selective disclosure at the protocol
    level, and provides session ephemerality as a structural guarantee. The protocol
    uses no novel cryptographic primitives and requires no central registry, token
    economy, or trusted third party.</p>"
