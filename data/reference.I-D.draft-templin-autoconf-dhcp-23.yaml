abstract:
- language: en
  script: Latn
  content: "<p>Enterprise networks connect routers over various link types, and may
    also connect to provider networks and/or the global Internet.  Nodes in enterprise
    networks must have a way to automatically provision IP addresses/prefixes and
    other information, and must also support post- autoconfiguration operations even
    for highly-dynamic networks.  This document specifies a Virtual Enterprise Traversal
    (VET) abstraction for autoconfiguration and operation of nodes in enterprise networks.</p>"
