abstract:
- language: en
  script: Latn
  content: <p>This document defines extensions to the Reply-To header field for MESSAGE
    so that it can be used to specify multiple addresses as the target of reply MESSAGE.
    These extensions include the use of pointers to Uniform Resource Identifier (URI)-lists
    in the Reply-To header field and the "multiple-reply" SIP option-tag.</p>
