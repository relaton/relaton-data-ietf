abstract:
- language: en
  script: Latn
  content: "<p>This memo describes a framework for composing and aggregating metrics
    (both in time and in space) defined by RFC 2330 and developed by the IPPM working
    group. The framework describes the generic composition and aggregation mechanisms.
    It provides a basis for additional documents that implement this framework for
    detailed, and practically useful, compositions and aggregations of metrics.</p>"
