- language: en
  script: Latn
  content: "<p>This draft describes using additional site-costs and preference related
    metrics to influence the SPF and using Flexible Algorithms to indicate the constraints.
    The purpose is to differentiate multiple paths with similar routing distance to
    one destination in 5G Local Data Network (LDN)to achieve optimal performance.</p>"
