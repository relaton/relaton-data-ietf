- language: en
  script: Latn
  content: "<p>This document describes the requirements for using the Generic \nAssociated
    Channel Label (GAL) in Pseudowires (PWs) in MPLS-TP \nnetworks, and provides an
    update to the description of GAL usage in \n[RFC5586] by removing the restriction
    that is imposed on using GAL \nfor PWs especially in MPLS-TP environments. \n\n.</p>"
