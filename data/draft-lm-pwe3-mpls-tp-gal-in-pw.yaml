- language: en
  script: Latn
  content: "<p>This document describes the requirements for using the Generic Associated
    Channel Label (GAL) in Pseudowires (PWs) in MPLS-TP networks, and provides an
    update to the description of GAL usage in [RFC5586] by removing the restriction
    that is imposed on using GAL for PWs especially in MPLS-TP environments..</p>"
