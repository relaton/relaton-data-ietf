abstract:
- language: en
  script: Latn
  content: "<p>As an important technical mean to detect network state, network measurement
    has attracted more and more attention in the development of networks. However,
    the current network measurement technology has the problem that the measurement
    method and the measurement purpose are not well matched. To solve this problem,
    this memo introduces network measurement intent, presents a process of scheduling
    the network resources and measurement tasks to meet the user or network operator's
    needs. And it can be seen as a specific use case of intent based network.</p>"
