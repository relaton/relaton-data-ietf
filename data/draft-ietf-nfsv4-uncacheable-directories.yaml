title:
- language: en
  script: Latn
  content: Adding an Uncacheable Dirent Metadata Attribute to NFSv4.2
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-nfsv4-uncacheable-directories-11
