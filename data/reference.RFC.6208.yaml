abstract:
- language: en
  script: Latn
  content: "<p>This document describes several Internet media types defined for the
    Cloud Data Management Interface (CDMI) by the Storage Networking Industry Association
    (SNIA).  The media types are:</p>"
- language: en
  script: Latn
  content: "<p>o  application/cdmi-object</p>"
- language: en
  script: Latn
  content: "<p>o  application/cdmi-container</p>"
- language: en
  script: Latn
  content: "<p>o  application/cdmi-domain</p>"
- language: en
  script: Latn
  content: "<p>o  application/cdmi-capability</p>"
- language: en
  script: Latn
  content: "<p>o  application/cdmi-queue</p>"
- language: en
  script: Latn
