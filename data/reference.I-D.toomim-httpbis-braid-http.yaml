abstract:
- language: en
  script: Latn
  content: "<p>Braid is a set of extensions that generalize HTTP from a state *transfer*
    protocol into a state *synchronization* protocol.  Braid puts the power of Operational
    Transform and CRDTs on the web, improving network performance and enabling natively
    peer-to-peer, collaboratively-editable, offline-first web applications.  Braid
    is composed of four extensions to HTTP:</p>"
