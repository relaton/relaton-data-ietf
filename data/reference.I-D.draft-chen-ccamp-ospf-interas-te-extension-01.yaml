abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to the OSPF protocol to support
    Multiprotocol Label Switching (MPLS) and Generalized MPLS (GMPLS) Traffic Engineering
    (TE) for multiple Autonomous Systems (ASes). It defines OSPF extensions for the
    flooding of inter-AS links which can be used to perform inter-AS path computation.</p>"
