abstract:
- language: en
  script: Latn
  content: |-
    <p>DNS records for the mail services POP3, POP3S, IMAP and IMAPS do
    not currently provide failover switching as do the DNS MX records
    for SMTP.  This document looks at the issues involved and
    recommends a solution using SRV records.</p>
