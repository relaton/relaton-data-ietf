abstract:
- language: en
  script: Latn
  content: "<p>This document defines requirements and use cases for the discovery
    problem in the More Instant Messaging Interoperability (MIMI) working group. The
    discovery problem refers to the process by which a message sender can identify
    the provider(s) associated with a desired messaging recipient, who is normally
    identified by an email address or phone number.</p>"
