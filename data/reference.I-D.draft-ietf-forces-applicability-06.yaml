abstract:
- language: en
  script: Latn
  content: "<p>The ForCES protocol defines a standard framework and mechanism for
    the interconnection between Control Elements and Forwarding Elements in IP routers
    and similar devices.  In this document we describe the applicability of the ForCES
    model and protocol.  We provide example deployment scenarios and functionality,
    as well as document applications that would be inappropriate for ForCES.</p>"
