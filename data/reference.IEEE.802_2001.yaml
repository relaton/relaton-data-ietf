abstract:
- language: en
  script: Latn
  content: "<p>IEEE Std 802-2001, IEEE Standards for Local and Metropolitan Area Networks:
    Overview and Architecture, provides an overview to the family of IEEE 802 Standards.
    It definescompliance with the family of IEEE 802 Standards; it describes the relationship
    of the IEEE 802Standards to the Open Systems Interconnection Basic Reference Model
    [ISO/IEC 7498-1:1994]and explains the relationship of these standards to the higher
    layer protocols; it provides a standard for the structure of LAN MAC addresses;
    and it provides a standard for identification of public, private, and standard
    protocols.</p>"
