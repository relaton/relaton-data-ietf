abstract:
- language: en
  script: Latn
  content: "<p>This framework describes a methodology for measuring end-to-end TCP
    throughput performance in a managed IP network. The intention is to provide a
    practical methodology to validate TCP layer performance. The goal is to provide
    a better indication of the user experience. In this framework, various TCP and
    IP parameters are identified and should be tested as part of a managed IP network.</p>"
