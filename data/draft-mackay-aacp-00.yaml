abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Agent Action Compression Protocol (AACP), a
       pipe-delimited coordination format for agent-to-agent communication
       in multi-agent large language model (LLM) systems.  AACP replaces
       verbose natural language instructions exchanged between autonomous
       agents with a compact, structured, machine-parseable packet format.

       Measured against live API tokenisation on Claude Sonnet 4.5 and GPT-
       4o, AACP reduces coordination token usage by approximately 23 percent
       versus equivalent natural language instructions across a four-hop
       payroll workflow benchmark.

       AACP operates above transport protocols such as the Model Context
       Protocol (MCP) and Agent-to-Agent Protocol (A2A), compressing message
       payload content rather than addressing routing or delivery.  The
       protocol is transport-agnostic, model-agnostic, and designed to
       complement rather than replace existing agent coordination
       infrastructure.</p>
