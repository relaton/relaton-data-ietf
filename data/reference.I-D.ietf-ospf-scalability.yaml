abstract:
- language: en
  script: Latn
  content: "<p>This document recommends methods that are intended to improve the scalability
    and stability of large networks using OSPF (Open Shortest Path First) Version
    2 protocol. The methods include processing OSPF Hellos and LSA (Link State Advertisement)
    Acknowledgments at a higher priority compared to other OSPF packets, and other
    congestion avoidance procedures.</p>"
