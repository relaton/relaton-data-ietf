abstract:
- language: en
  script: Latn
  content: "<p>This document describes the conventions for using the SHAKE family
    of hash functions in the Internet X.509 as one-way hash functions with the RSA
    and ECDSA signature algorithms; the conventions for the associated subject public
    keys are also described. Digital signatures are used to sign messages, certificates
    and CRLs (Certificate Revocation Lists).</p>"
