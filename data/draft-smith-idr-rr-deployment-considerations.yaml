abstract:
- language: en
  script: Latn
  content: "<p>In BGP networks, Route Reflectors (RRs) help to simplify IBGP control\n   plane provisioning as well as mitigate the session scale challenges\n   associated with an IBGP full mesh between border routers.  Given\n   these operational benefits, RRs are widely deployed in modern BGP\n   network architectures.  This document describes common RR deployment\n   models, including their respective trade-offs, and provides best\n   practice suggestions based on years of industry experience.\n   Operators of BGP networks should consider and/or adopt these best\n   practices, as BGP control plane stability is critical to overall\n   network stability.</p>"
