abstract:
- language: en
  script: Latn
  content: "<p>This document extends the notification mechanism defined in the conference
    event package [2] to suit the specific needs of the XCON framework [1] and the
    XCON data model [3]. The document registers a new MIME-subtype for this purpose.
    Support for this new data format may be negotiated using Accept header semantics
    (as defined in RFC 3261).</p>"
