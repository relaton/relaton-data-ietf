abstract:
- language: en
  script: Latn
  content: "<p>This document describes a PTP Profile for the use of the Precision
    Time Protocol in an IPv4 or IPv6 Enterprise information system environment. The
    PTP Profile uses the End-to-End delay measurement mechanism, allows both multicast
    and unicast Delay Request and Delay Response messages.</p>"
