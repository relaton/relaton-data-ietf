date:
- type: published
  at: '2010-10-25'
abstract:
- language: en
  script: Latn
  content: "<p>This document provides a new mechanism for caching DNS resolvers.\nWhen all the authoritative name servers for a zone fail, and the\nrequest can't be found in the cache, during a period of time the\ncaching DNS resolvers won't query the authoritative name servers, but\ndirectly return a SERVFAIL to the clients to reduce the recursive\nname server load and the network load.</p>"
