  script: Latn
  content: "<p>This memo presents an amendment to the DomainKeys Identified Mail (DKIM)
    specification to allow public keys for verification to include a reporting address
    to be used to report verification issues, and an Internet Message format to be
    followed when generating such reports.</p>"
