abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends RPC-with-TLS, as described in [RFC9289], so
       that a client's x.509 certificate may carry instructions to the RPC
       server to execute all RPC transactions from that client as a single
       user identity.</p>
