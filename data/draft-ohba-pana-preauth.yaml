- language: en
  script: Latn
  content: "<p>This document defines an extension to the PANA protocol used for proactively
    establishing a PANA SA (Security Association) between a PaC in an access network
    and a PAA in another access network to which the PaC may move. The proposed method
    operates across multiple administrative domains.</p>"
