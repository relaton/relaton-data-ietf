- language: en
  script: Latn
  content: "<p>This specification defines a profile of OAuth 2.0 Rich Authorization
    Requests in Cedar policy format within the authorization_details JSON object.
    Authorization servers and resource servers from different vendors can leverage
    this profile to distribute and recieve relevant Cedar policy sets in an interoperable
    manner.</p>"
