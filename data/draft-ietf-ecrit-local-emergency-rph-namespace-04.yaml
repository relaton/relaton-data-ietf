- language: en
  script: Latn
  content: "<p>This document creates the new Session Initiation Protocol (SIP) \nResource
    Priority header field namespace \"esnet\" for local emergency\nusage to a public
    safety answering point (PSAP), between PSAPs, and \nbetween a PSAP and first responders
    and their organizations, and \nplaces this namespace in the IANA registry.</p>"
