abstract:
- language: en
  script: Latn
  content: "<p>The Automatic Extended Route Optimization (AERO) and Overlay Multilink
    Network (OMNI) Interface functional specifications have reached a level of maturity
    ready for advancement in the RFC publication process. Updates to the base specifications
    are documented in this first amendment and any additional future amendments as
    necessary.</p>"
