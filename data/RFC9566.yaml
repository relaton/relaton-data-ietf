abstract:
- language: en
  script: Latn
  content: "<p>This document describes how the DetNet IP data plane can support the
    Packet Replication, Elimination, and Ordering Functions (PREOF) built on the existing
    MPLS PREOF solution defined for the DetNet MPLS data plane and the mechanisms
    defined by MPLS-over-UDP technology.</p>"
