abstract:
- language: en
  script: Latn
  content: "<p>This document describes the problems associated with extending existing
    VPN that interconnects Enterprise customers' multiple sites to dynamic workloads
    instantiated in cloud data centers. This document further describes a set of requirements
    that a solution would need to fulfill to address the problems discussed herein.</p>"
