abstract:
- language: en
  script: Latn
  content: <p>"S-PMSI Join" messages are used in PIM-based MVPN procedures to bind
    particular multicast flows to particular tunnels through a core network.  This
    document specifies extensions to the S-PMSI Join mechanism that allow S-PMSI Join
    messages to specify IPv6 multicast flows, that allow S-PMSI Join messages to specify
    MPLS tunnels, and that allow a single UDP datagram to contain multiple S-PMSI
    Join messages.  It also specifies how to send PIM IPv6 control messages over a
    PIM/IPv4 tunnel.</p>
