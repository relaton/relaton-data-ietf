abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv6 Support for Dual Stack Hosts and Routers allows the mobile
    node to maintain connectivity for its IPv6 home address while attached to the
    IPv4-only home link. This document specifies how a mobile node can maintain connectivity
    for its IPv4 home address while attached to an IPv6-only home link.</p>"
