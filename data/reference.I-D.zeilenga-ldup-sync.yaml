abstract:
- language: en
  script: Latn
  content: "<p>This specification describes the LDAP (Lightweight Directory Access
    Protocol) Content Synchronization operation. The operation allows a client to
    maintain a shadow copy of a fragment of directory information tree. It supports
    both polling for changes and listening for changes. The operation is defined as
    an extension of the LDAP Search operation.</p>"
