abstract:
- language: en
  script: Latn
  content: "<p>This document presents a design for a nameserver control protocol (NSCP).
    \ A common data model for describing the configuration and operation of a basic,
    but usable, generic name server is defined.  This is expressed in a formal modeling
    language (YANG) and can be used as the basis of a set of NETCONF operations and
    capabilities.  The data model described is extensible and will allow for the creation
    of additional capabilities, ensuring that the protocol can support all the features
    of a name server.</p>"
