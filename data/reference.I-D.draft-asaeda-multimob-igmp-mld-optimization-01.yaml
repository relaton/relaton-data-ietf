abstract:
- language: en
  script: Latn
  content: "<p>IGMP and MLD are the protocols used by hosts to report their IP multicast
    group memberships to neighboring multicast routers.  This document describes the
    ways of IGMPv3 and MLDv2 protocol optimization for mobility.  The optimization
    includes a query timer tuning and an explicit membership notification operation.</p>"
