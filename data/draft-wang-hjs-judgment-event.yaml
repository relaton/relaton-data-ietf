abstract:
- language: en
  script: Latn
  content: "<p>This document defines HJS, a specialized protocol for judgment\n   attribution — determining who is responsible for AI decisions, when,\n   and under what authority — and enables portable, verifiable judgment\n   transfer across heterogeneous AI systems.\n\n   HJS addresses one specific problem that complementary systems do\n   not: binding decisions to accountable actors, tracking how\n   responsibility transfers over time, and providing cryptographic\n   credentials that allow AI agents to prove decision authority to\n   external systems without requiring prior trust relationships. It\n   works alongside provenance frameworks (VAP), security protocols\n   (SEAT), monitoring platforms (Arize, WhyLabs), and governance\n   systems (Fiddler), providing the attribution layer these systems\n   complement.\n\n   HJS contributes standardized judgment events, portable cryptographic\n   Receipts that serve as verifiable credentials for cross-system\n   delegation, and flexible verification modes for diverse deployment\n   scenarios.</p>"
