- language: en
  script: Latn
  content: "<p>This document describes the goals of having remote hubs and documents
    the experiences of organising remote hubs in India. It documents the experiences
    and suggest a possible framework for organising remote hubs in India. Remote participation
    has become easier with jabber rooms and audio streaming initially to now real-time
    video interaction.</p>"
