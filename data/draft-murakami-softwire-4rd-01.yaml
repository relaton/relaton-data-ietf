- language: en
  script: Latn
  content: "<p>This document specifies an automatic tunneling mechanism for providing
    IPv4 connectivity service to end users over a service provider's IPv6 network.
    Key aspects include stateless operation, sharing of IPv4 addresses, and an algorithmic
    mapping between IPv4 addresses and IPv6 tunnel endpoints.</p>"
