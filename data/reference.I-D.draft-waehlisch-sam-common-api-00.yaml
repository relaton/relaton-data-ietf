abstract:
- language: en
  script: Latn
  content: "<p>Group communication services are most efficiently implemented on the
    lowest layer available.  This document describes a common multicast API that serves
    the requirements of data distribution and maintenance for multicast and broadcast
    on a middleware abstraction layer, suitable for transparent underlay and overlay
    communication. Additionally, it describes the application of this API in current
    Internet multicast routing protocols.</p>"
