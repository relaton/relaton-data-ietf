abstract:
- language: en
  script: Latn
  content: "<p>This document describes mechanisms for linear protection of Multi-
    Protocol Label Switching Transport Profile (MPLS-TP) Label Switched Paths (LSP)
    and Pseudowires (PW) on multiple layers.  Linear protection provides a fast and
    simple protection switching mechanism, that is especially optimized for a mesh
    topology.  It provides a clear indication of the protection status.  The mechanisms
    are described both at the architectural level as well as providing a protocol
    that is used to control and coordinate the protection switching.</p>"
