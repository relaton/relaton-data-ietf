abstract:
- language: en
  script: Latn
  content: "<p>This document describes an OAM framework for Computing-Aware Traffic
    Steering (CATS). The proposed OAM framework enables the fault and the performance
    management of end-to-end connections from clients to networks and finally to computing
    instances. In the following sections, the major components of the framework, the
    functionalities, and the deployment considerations are elaborated in detail.</p>"
