abstract:
- language: en
  script: Latn
  content: "<p>This document defines a URI-based name form for objects intended to\nbe used for information-centric networking and more generally.  The\nname form defined here allows for the various forms of hash-based\nbinding between the name and the named-object, as well as supporting\nhuman-readable and hierarchical names.</p>"
