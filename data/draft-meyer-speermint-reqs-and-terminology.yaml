- language: en
  script: Latn
  content: "<p>This document outlines the solutions space requirements and defines
    the terminology that is to be used by the Session PEERing for Multimedia INTerconnect
    Working Group (SPEERMINT). It has as its primary objective to focus the working
    group during its discussions, and when writing requirements, gap analysis and
    other solutions oriented documents.</p>"
