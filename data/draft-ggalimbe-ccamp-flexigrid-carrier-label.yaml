title:
- language: en
  script: Latn
  content: Signaling extensions for Media Channel sub-carriers configuration in Spectrum
    Switched Optical Networks (SSON) in Lambda Switch Capable (LSC) Optical Line Systems.
  format: text/plain
docidentifier:
- content: draft-ggalimbe-ccamp-flexigrid-carrier-label
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This memo defines the signaling extensions for managing Spectrum Switched
    Optical Network (SSON) parameters shared between the Client and the Network and
    inside the Network in accordance to the model described in RFC7698. The extensions
    are in accordance and extending the parameters defined in ITU-T Recommendation
    G.694.1 and its extensions and G.872.</p>"
  format: text/html
