abstract:
- language: en
  script: Latn
  content: "<p>This document describes UDP Speedy Transmission Protocol Secure\n   (USTPS), an experimental transport built directly on UDP for low-\n   latency and loss-tolerant applications.  USTPS provides authenticated\n   encryption for DATA packets, readable plaintext control records\n   authenticated by HMAC where applicable, binary UPACK DATA framing,\n   selective retransmission, out-of-order acceptance, adaptive\n   retransmission timeout, optional congestion control, and application-\n   visible stream position metadata.  USTPS is intentionally unordered\n   at the transport layer and is designed to avoid transport-level Head-\n   of-Line blocking.</p>"
