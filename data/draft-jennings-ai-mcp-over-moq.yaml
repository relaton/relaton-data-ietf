abstract:
- language: en
  script: Latn
  content: "<p>This document defines how to use Media over QUIC Transport (MOQT) as\n   the underlying transport protocol for the Model Context Protocol\n   (MCP).  MCP is a protocol that enables seamless integration between\n   language model applications and external data sources and tools.\n   MOQT provides efficient, low-latency, publish-subscribe media\n   delivery over QUIC and WebTransport.\n\n   This specification describes the mapping of MCP messages onto MOQT\n   objects and defines the procedures for establishing and maintaining\n   MCP sessions over MOQT.  It covers transport of MCP's core primitives\n   including resources, tools, prompts, and notifications through\n   dedicated MOQT tracks with appropriate priority management and\n   delivery guarantees.\n\n   A key focus of this document is the delivery and execution of Agent\n   Skills - composed instructions that extend AI capabilities beyond\n   atomic tool operations.  Skills use progressive loading (metadata,\n   instructions, resources) that aligns naturally with MOQT's object-\n   based delivery, enabling efficient bandwidth utilization and\n   aggressive caching strategies.\n\n   The specification also describes relay support for scalable MCP\n   deployments, including subscription aggregation, content caching, and\n   multi-hop architectures that enable global distribution of MCP\n   services with optimized performance.</p>"
