  content: |-
    <p>This specification documents implementation issues with TLS 1.3
       session tickets, and provides guidance to correct the problems.
       Problems related to PQC is also discussed in relation to TLS-based
       EAP methods.  A partial solution to those issues is also proposed.</p>
