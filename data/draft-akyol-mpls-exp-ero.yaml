- language: en
  script: Latn
  content: "<p>This document expands the Explicit Route Object (ERO) defined in [RSVP-TE].
    The primary reason for the expansion of the ERO is to simplify the processing
    of abstract nodes and loose routes as well as to specify globally unique interface
    identifiers in case of unnumbered interfaces.</p>"
