abstract:
- language: en
  script: Latn
  content: "<p>This document explores the central problem of the GAIA (Global Access
    to the Internet for All) IRTF research group. It discusses several possible approaches
    or tools that can be used to increase the number of people with access to the
    Internet. Specifically we discuss how these tools can improve reach, reduce cost,
    and improve the quality of the Internet, especially in underserved areas.</p>"
