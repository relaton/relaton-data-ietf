abstract:
- language: en
  script: Latn
  content: "<p>Industrial Internet of Things is an attractive application area for
    Constrained Application Protocol (CoAP). OPC Unified Architecture (OPC UA) defines
    a semantic-based information model for industrial control system that can satisfy
    the requirements of Industry 4.0 based on semantic information exchange. This
    document analyses requirements for OPC UA transmission over CoAP.</p>"
