abstract:
- language: en
  script: Latn
  content: |-
    <p>This note discusses how to extend the DNS with new data, for a new
        application.  A discussion which too often circulate around reuse of
        the TXT record.  It lists different mechanisms to accomplish the
        extension to DNS, and comes to the conclusion use of a new RR Type is
        the best solution.</p>
