- language: en
  script: Latn
  content: "<p>This draft describes the issues that must be addressed in developing
    signaling mechanisms for automated establishment and restoration of paths in optical
    mesh networks. This draft is the first attempt at developing a framework for RSVP
    or CR-LDP-based signaling for interconnected optical networks.</p>"
