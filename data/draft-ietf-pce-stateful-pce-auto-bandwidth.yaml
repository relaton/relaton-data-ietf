  content: Path Computation Element Communication Protocol (PCEP) Extensions for MPLS-TE
    Label Switched Path (LSP) Auto-Bandwidth Adjustment with Stateful PCE
  format: text/plain
docidentifier:
- content: draft-ietf-pce-stateful-pce-auto-bandwidth
