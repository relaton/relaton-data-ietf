abstract:
- language: en
  script: Latn
  content: "<p>This document is the specification of the 'tn3270' Uniform Resource
    Identifier (URI) scheme, that is used to designate the access to the resources
    available via Telnet 3270 mode (TN3270) and Telnet 3270 Enchanted mode (TN3270E).
    \ It updates RFC 1041 and RFC 2355, that specify these protocols, and RFC 1738,
    that firstly mentioned this URI scheme, giving no definition of its syntax or
    semantics.</p>"
