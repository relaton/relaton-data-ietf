abstract:
- language: en
  script: Latn
  content: "<p>This document establishes an architectural pattern whereby Attestation
    Results could be produced for a complete set of benchmarks or controls that are
    defined and grouped by an external entity, eliminating the need to convey individual
    Evidence items for each item within a benchmark or control framework. This document
    establishes a pattern to list sets of benchmarks and controls within CWT and JWT
    formats for use as an Entity Attestation Token (EAT). While the discussion below
    pertains mostly to TPM, other Roots of Trust such as TCG DICE and non-TCG defined
    components will also be included.</p>"
