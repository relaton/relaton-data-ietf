abstract:
- language: en
  script: Latn
  content: "<p>A recent IAB report identified issues that have been raised with Internationalized
    Domain Names (IDNs) some of which require tuning of the existing protocols and
    the tables on which they depend. Based on intensive discussion by an informal
    design team, this document further explains some of the issues that have been
    encountered and provides explanatory material for some of the proposals that are
    being made.</p>"
