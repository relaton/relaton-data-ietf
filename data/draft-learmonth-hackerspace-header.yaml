- language: en
  script: Latn
  content: "<p>This memo presents a new Internet message header that allows the sender
    of Internet messages to provide hackerspace affiliation information to the recipients.
    Recipients of Internet messages can use this header to look up the hackerspace
    affiliation of the sender of the message.</p>"
