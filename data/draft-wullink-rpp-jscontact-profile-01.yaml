abstract:
- language: en
  script: Latn
  content: "<p>This document defines a JSContact usage profile, conforming to the
    rules described in [I-D.ietf-calext-jscontact-profiles], for the RESTful Provisioning
    Protocol (RPP). The JSContact Profile for RPP specifies how the JSContact format
    defined in [RFC9982] can be used as a standardized representation of contact information
    within RPP operations, enabling interoperability and consistency across RPP implementations
    that manage contact data.</p>"
