abstract:
- language: en
  script: Latn
  content: "<p>The interior gateway routing protocols OSPFv2 [RFC2328], IS-IS [ISO]
    [RFC1195] and RIP [RFC2453] currently define clear text and MD5 [RFC1321] algorithms
    for authenticating their protocol packets. There have recently been documents
    adding support of the Secure Hash Algorithm (SHA) family of hash functions for
    authenticating routing protocol packets for RIP [RFC4822], IS-IS and OSPF.  To
    ensure interoperability between disparate implementations, it is imperative that
    we specify a set of mandatory-to-implement algorithms thereby ensuring that there
    is at least one algorithm that all implementations will have available.  This
    document defines the current set of mandatory-to-implement algorithms to be used
    for the cryptographic authentication of these routing protocols as well as specifying
    the algorithms that should be implemented because they may be promoted to mandatory
    at some future time.</p>"
