abstract:
- language: en
  script: Latn
  content: "<p>This document defines extension to the Domain Name System to support
    Default Protocol. Default Protocol extension allows owners of the resources to
    determine which are preferred protocols to be used with their Services (i.e. https
    protocol to be preferred instead of http for specific servers).</p>"
