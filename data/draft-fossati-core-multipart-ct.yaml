- language: en
  script: Latn
  content: "<p>This memo defines application/multipart-core, an application- independent
    media-type that can be used to combine representations of several different media
    types into a single CoAP message-body with minimal framing overhead, each along
    with a CoAP Content-Format identifier.</p>"
