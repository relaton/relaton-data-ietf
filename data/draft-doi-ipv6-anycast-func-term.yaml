- language: en
  script: Latn
  content: "<p>The purpose of this document is to clarify the usage of terms for IPv6
    Anycast and help increase its popularity. This document discusses not only Anycasting's
    terminology but also its categorization and clarifies its outline. In this document,
    we focus on network-layer Anycast, which is defined in IPv6 specifications.</p>"
