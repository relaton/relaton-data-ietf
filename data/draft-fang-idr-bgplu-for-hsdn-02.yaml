abstract:
- language: en
  script: Latn
  content: "<p>This document describes modifications of BGP Labeled Unicast (BGP-LU)
    procedures for label distribution in a partitioned network. Specifically, these
    procedures are suitable for building the Hierarchical SDN (HSDN) control plane
    for the hyper-scale Data Center (DC) and cloud networks.</p>"
