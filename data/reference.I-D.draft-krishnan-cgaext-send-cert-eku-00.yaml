abstract:
- language: en
  script: Latn
  content: "<p>Secure Neighbor Discovery (SEND) Utilizes X.509v3 certificates for
    performing router authorization.  The certificates that are currently recommended
    can be used for any purpose.  This document specifies the extended key usage values
    for such certificates which explicitly states the purpose for which these certificates
    are used.</p>"
