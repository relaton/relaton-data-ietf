abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Simplified Multicast Forwarding (SMF) protocol.
    SMF provides a basic IP multicast forwarding capability suitable for mobile ad-hoc
    networks (MANET). SMF applicability is limited to providing multicast forwarding
    within MANET routing regions. SMF specifies mechanisms to provide temporally unique
    multicast packet identification for the purpose of enabling MANET- specific duplicate
    packet detection (DPD). SMF also specifies the operation of DPD maintenance and
    checking for both sequence-based and hash-based methods. For IPv6, a hop-by-hop
    option header is specified that assists in the overall DPD process. The optional
    operation of intermediate devices, called taggers, is also specified and relates
    to potential use with multiple border routers. SMF is designed to take advantage
    of reduced relay sets for efficient MANET multicast forwarding and the document
    describes use and interaction with a number of approaches. Pseudocode and additional
    educed relay set discussion is provided in the Appendices. Basic issues relating
    to the operation of multicast MANET border routers are discussed but ongoing work
    in this area remains and is beyond the scope of this document.</p>"
