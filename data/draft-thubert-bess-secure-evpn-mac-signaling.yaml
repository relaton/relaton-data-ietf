abstract:
- language: en
  script: Latn
  content: "<p>This specification adds attributes to EVPN to carry IPv6 address metadata
    learned from RFC 8505 and RFC 8928 so as to maintain a synchronized copy of the
    6LoWPAN ND registrar at each EVPN router and perform locally a unicast IPv6 ND
    service for address lookup and duplicate address detection.</p>"
