abstract:
- language: en
  script: Latn
  content: "<p>Path Computation Elements (PCEs) require an accurate and timely Traffic
    Engineering Database (TED). Traditionally this TED has been obtained from a link
    state routing protocol supporting traffic engineering extensions. This document
    discusses possible alternatives and enhancements to such an approach and their
    potential impacts on network nodes, routing protocols, and PCEs.</p>"
