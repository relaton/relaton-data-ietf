abstract:
- language: en
  script: Latn
  content: "<p>Point-to-point link model requires unique prefixes to be assigned to
    each interface of the mobile nodes.  In NEMO, home agents need to assign unique
    prefixes to mobile routers.  Prefix management in point-to-point links and in
    NEMO will be facilitated if AAA servers can delegate prefixes.  This document
    identifies the following use cases where Diameter prefix delegation application
    is needed.  In 16NG, prefix delegation only occurs between an Access Router and
    a mobile node, and there is no discussion about how an Access Router acquires
    prefix from an external entity.  NEMO deals with synchronization of Mobile Network
    prefixes between a Mobile Router and a Home Agent, while the method is agnostic
    to the way that a Home Agent gets prefix from back end servers.  In Proxy Mobile
    IPv6, Proxy Binding Update and Proxy Binding Acknowledgement message pair is used
    to allocate prefix from a Local Mobile Anchor for a Mobile Node's interface but
    how a Local Mobile Anchor gets prefixes from external server is currently left
    open.  Next, the document identifies requirements on a AAA-based prefix delegation
    application.</p>"
