abstract:
- language: en
  script: Latn
  content: <p>This memo defines semantics that allow for signaling decoding dependency
    of different media descriptions with the same media type in the Session Description
    Protocol (SDP). This is required, for example, if media data is separated and
    transported in different network streams as a result of the use of a layered media
    coding process. A new grouping type "DDP" -- decoding dependency -- is defined,
    to be used in conjunction with RFC 3388 entitled "Grouping of Media Lines in the
    Session Description Protocol". In addition, an attribute is specified describing
    the relationship of the media streams in a "DDP" group. Finally, this memo defines
    SDP semantics indicating SSRC multiplexing for media sessions in case RTP is used
    as the protocol for media transport.</p>
