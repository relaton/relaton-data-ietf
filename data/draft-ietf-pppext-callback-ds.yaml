abstract:
- language: en
  script: Latn
  content: "<p>The Point-to-Point Protocol (PPP) [RFC-1661] provides a standard      \n
    \  method for transporting multi-protocol datagrams over point-to-point\n   links.
    \ PPP defines an extensible Link Control Protocol (LCP) for\n   establishing,
    configuring, and testing the data-link connection.      \n   This document defines
    the CallBack option.</p>"
