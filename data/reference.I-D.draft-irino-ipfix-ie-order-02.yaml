abstract:
- language: en
  script: Latn
  content: "<p>This draft describes guidelines for the order of Information Elements
    of the IPFIX protocol for the creation of Templates. It aims to improve the efficiency
    of the Collecting Process on the assumption that multiple Exporting Processes
    send Flow Records containing the same Information Elements to a Collecting Process.
    Exporters can make (almost) the same Template from the same combination of Information
    Elements by applying the order rule defined in this draft. Furthermore, some Templates
    will have a suitable data structure for hardware processing if the rule is applied
    because the rule defines that fixed-length Information Elements and other Information
    Elements are separated in position.</p>"
