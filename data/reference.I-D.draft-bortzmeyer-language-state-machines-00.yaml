abstract:
- language: en
  script: Latn
  content: "<p>Several RFC contain a state machines to describe a protocol. There
    is no standard way of describing such a machine, the most common way being an
    ASCII-art diagram. This document specifies an other solution: a domain-specific
    language for finite state machines. It allows state machine descriptions to be
    automatically checked and translated to other formats. Its purpose is to provide
    a stable reference for RFC which use this mini-language.</p>"
