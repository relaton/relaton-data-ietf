abstract:
- language: en
  script: Latn
  content: "<p>Over the last two decades many efforts have been devoted to developing
    solutions for mobility support over the global Internet, which resulted in a variety
    of proposed solutions.  In this draft we conducted a systematic survey of the
    previous efforts to gain an overall understanding on the solution space of mobility
    support. This draft reports our finding and identifies remaining issues in providing
    ubiquitous and efficient global scale mobility support.</p>"
