abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of the SEED block cipher algorithm
    in the Secure Real-time Transport Protocol (SRTP) for providing confidentiality
    for Real-time Transport Protocol (RTP) traffic and for the control traffic for
    RTP, the Real-time Transport Control Protocol (RTCP).  [STANDARDS-TRACK]</p>"
