abstract:
- language: en
  script: Latn
  content: <p>This document specifies how to use DNS (Domain Name Service) SRV RRs
    (Resource Records) to locate services for the AFS distributed file system and
    how the priority and weight values of the SRV RR should be interpreted in the
    server ranking system used by AFS.  It deprecates use of the AFSDB RR to locate
    AFS cell database servers and provides guidance for backward compatibility.  Internet
    Draft Comments  Comments are solicited.  Please include the AFS Standardization
    mailing list at afs3-standardization@openafs.org as a recipient of any comments.  Status
    of this Memo  This Internet-Draft is submitted to IETF in full conformance with
    the provisions of BCP 78 and BCP 79.  Internet-Drafts are working documents of
    the Internet Engineering Task Force (IETF), its areas, and its working groups.  Note
    that other groups may also distribute working documents as Internet- Drafts.  Internet-Drafts
    are draft documents valid for a maximum of six months and may be updated, replaced,
    or obsoleted by other documents at any time.  It is inappropriate to use Internet-Drafts
