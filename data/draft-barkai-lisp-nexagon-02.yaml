abstract:
- language: en
  script: Latn
  content: "<p>This document specifies combined use of H3 and LISP for mobility-networks:
    - Enabling real-time tile-by-tile localized-annotation of road-conditions - Sharing
    of road annotations: hazards, blockages, maintenance, furniture - Between MobilityClients,
    which produce-consume road-tile state information - Using formal in-network-state
    addressable-indexed-maintained by H3Servers.</p>"
