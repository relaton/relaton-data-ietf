abstract:
- language: en
  script: Latn
  content: "<p>This memo concerns dropping or marking packets using active queue management
    (AQM) such as random early detection (RED) or pre- congestion notification (PCN).
    \ We give two strong recommendations: (1) packet size should not be taken into
    account when transports read congestion indications, not when network equipment
    writes them, and (2) byte-mode packet drop variant of AQM algorithms, such as
    RED, should not be used to drop fewer small packets.</p>"
