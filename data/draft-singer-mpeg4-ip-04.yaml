- language: en
  script: Latn
  content: "<p>This document forms an umbrella specification for the carriage and
    operation of MPEG-4 multimedia sessions over IP-based protocols, including RTP,
    RTSP, and HTTP, among others. It addresses IP Multicast as well. It also serves
    to document the standard MIME types associated with MPEG-4 files.</p>"
