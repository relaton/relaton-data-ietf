abstract:
- language: en
  script: Latn
  content: "<p>This is a working document intended to trigger discussion and develop
    draft language for the CoAP protocol specification in the area of group communication
    (including multicast functionality).  Engineering tradeoffs become more challenging
    in constrained environments, therefore group communication is considered within
    the context of adjacent topics that may impact or be impacted by design choices
    in the subject area.</p>"
