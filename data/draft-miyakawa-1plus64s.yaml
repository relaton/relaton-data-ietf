- language: en
  script: Latn
  content: <p>This document proposes the "standard" address assignment scheme for
    IPv6 access network which uses RA or DHCPv6 to assign an global IPv6 address to
    the WAN interface of the CPE and DHCPv6 PD on the upstream link of CPE to delegate
    one or more /64 prefixes to the CPE.</p>
