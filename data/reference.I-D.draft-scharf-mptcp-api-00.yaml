abstract:
- language: en
  script: Latn
  content: "<p>Multipath TCP (MPTCP) adds the capability of using multiple paths to
    a regular TCP session.  Even though it is designed to be totally backward compatible,
    the data transport differs to the existing TCP, and there are several additional
    degrees of freedom that affect applications.  This document summarizes the impact
    that MPTCP may have on applications, such as changes in performance.  Furthermore,
    it describes an optional extended application interface that provides access to
    multipath information and enables control of some aspects of the MPTCP implementation's
    behaviour.</p>"
