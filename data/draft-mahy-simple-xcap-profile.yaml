abstract:
- language: en
  script: Latn
  content: "<p>This document describes a profile of XCAP (XML Configuration Access
    Protocol) for manipulating SIMPLE resource lists and common policy rule sets.
    While XCAP allows access to arbitrary XML document subtrees, most XCAP implementations
    only need access to documents at the specific points in the XML schema described
    by this profile.</p>"
