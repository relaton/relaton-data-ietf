- language: en
  script: Latn
  content: "<p>The Constrained Application Protocol (CoAP) has become the base of
    applications both inside of the constrained devices space it originally aimed
    for and outside. This document gives an overview of applications that are, can,
    may, and would better not be implemented on top of CoAP.</p>"
