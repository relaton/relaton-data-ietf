abstract:
- language: en
  script: Latn
  content: "<p>This specification defines an extension to IPv6 Neighbor Discovery
    Protocol, which allows management of IPv6 traffic offloading to IPv4 and moving
    IPv4 traffic away from a specific interface.  The specification updates the source
    and destination algorithms described in RFC 3484bis.</p>"
