abstract:
- language: en
  script: Latn
  content: "<p>In this document we propose a solution using the existing mechanisms
    of the directory [1] itself. We present a naming scheme for naming schema objects
    and a meta-schema for storing schema objects in the directory. This memo defines
    an Experimental Protocol for the Internet community.</p>"
