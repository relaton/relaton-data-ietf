abstract:
- language: en
  script: Latn
  content: "<p>This document defines the overall architecture of a COMS based network
    slicing system.  COMS works on the top level network slice orchestrator which
    directly communicates with the network slice provider and enables the technology-independent
    network slice management.</p>"
