abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a return routability check for use in context
    of the Connection ID (CID) construct for the Datagram Transport Layer Security
    (DTLS) protocol versions 1.2 and 1.3. Implementations offering the CID functionality
    described in RFC 9146 and RFC 9147 are encouraged to also provide the return routability
    check functionality described in this document. For this reason, this document
    updates RFC 9146 and RFC 9147.</p>"
