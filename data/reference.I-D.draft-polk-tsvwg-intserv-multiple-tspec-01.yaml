abstract:
- language: en
  script: Latn
  content: "<p>This document defines how Integrated Services (IntServ) includes multiple
    TSPECs and RSPECs in the same Resource Reservation Protocol (RSVPv1) reservation
    message exchange. This ability to send multiple TSPECs during reservation set-up
    helps optimize an agreeable bandwidth through a network between endpoints in a
    single round trip.</p>"
