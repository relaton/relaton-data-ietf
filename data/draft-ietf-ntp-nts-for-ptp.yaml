abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an automatic key management service for the
    integrated security mechanism (prong A) of IEEE Std 1588™-2019 (PTPv2.1) described
    there in Annex P. This key management follows the immediate security processing
    approach of prong A and extends the NTS Key Establishment protocol defined in
    IETF RFC 8915 for securing NTPv4. The resulting NTS for PTP (NTS4PTP) protocol
    provides a security solution for all PTP modes and operates completely independent
    of NTPv4.</p>"
