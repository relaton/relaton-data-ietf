- language: en
  script: Latn
  content: "<p>This memo defines the signaling extensions for managing Spectrum Switched
    Optical Network (SSON) parameters shared between the Client and the Network and
    inside the Network. This document extends the GMPLS Lambda label format in accordance
    and extending the parameters defined in ITU-T Recommendation G.694.1.[ITU.G694.1]
    and its extensions.</p>"
