abstract:
- language: en
  script: Latn
  content: "<p>This document proposes UDT, or UDP based Data Transfer protocol, as
    an alternative data transfer protocol for the situation when TCP does not work
    well. One of the most common cases, and also the original motivation of UDT, is
    to overcome TCP's inefficiency in high bandwidth-delay product (BDP) networks.
    Another important target use scenario is to allow networking researchers, students,
    and application developers to easily implement and deploy new data transfer algorithms
    and protocols.</p>"
