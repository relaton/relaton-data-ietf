abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of the KCipher-2 stream cipher with
    Poly1305 in Transport Layer Security (TLS) protocols version 1.2 and Datagram
    Transport Layer Security (DTLS) protocols. KCipher-2 is a stream cipher with a
    128-bit key and a 128-bit initialization vector, which provides fast, efficient
    encryption and decryption.</p>"
