abstract:
- language: en
  script: Latn
  content: "<p>In Neighbor Discover Protocol, routers and hosts record the neighbor
    information in the local Neighbor Cache database. It is vulnerable by malicious
    attacks. This document analyzes these security threats and proposes a solution,
    mainly using reverse detection mechanism, to prevent the potential damage.</p>"
