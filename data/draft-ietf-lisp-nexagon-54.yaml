abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of IETF Locator/ID Separation Protocol
    (LISP) to enable near real-time understanding of dynamic conditions across large
    areas, including both on-road and off-road environments. The system is designed
    to function during routine operations as well as recovery scenarios. It leverages
    imagery feeds from various mobile sources, including low Earth orbit satellites,
    UAVs, drones, and vehicle cameras. By dividing geographic regions into high-resolution</p>"
