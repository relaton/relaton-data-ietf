abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Simple Certificate Enrollment Protocol,
    a PKI communication protocol which leverages existing technology by using PKCS#7
    and PKCS#10. SCEP is the evolution of the enrollment protocol developed by Verisign,
    Inc. for Cisco Systems, Inc. It now enjoys wide support in both client and CA
    implementations.</p>"
