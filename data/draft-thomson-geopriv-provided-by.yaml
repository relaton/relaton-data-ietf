abstract:
- language: en
  script: Latn
  content: <p>The "provided-by" element in PIDF-LO is a container designed to carry
    information about the source of location information. This document defines an
    XML structure that can be used within the "provided-by" element to convey basic
    information about the information provider in the form of a URI.</p>
