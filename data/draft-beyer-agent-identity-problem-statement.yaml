abstract:
- language: en
  script: Latn
  content: "<p>Software agents now act on behalf of people across communication,\n   automation, and decision-making contexts.  These agents increasingly\n   initiate actions, delegate tasks, and interact with other agents\n   without a clear, durable, or verifiable connection to the human who\n   authorized them.  Existing identity systems authenticate software,\n   but they do not provide a model for human anchoring, scoped\n   delegation, or provenance across agent ecosystems.\n\n   This document describes the problem space for human-anchored agent\n   identity.  It outlines the gaps in current identity mechanisms, the\n   risks created by uncontrolled replication and impersonation, and the\n   need for a consistent architectural model that preserves human\n   authority, supports explicit delegation, and maintains verifiable\n   provenance across contexts.\n\n   This document does not define a protocol.  It defines the problem\n   that an architectural model must address in order to support safe,\n   accountable, and interoperable agent ecosystems.</p>"
