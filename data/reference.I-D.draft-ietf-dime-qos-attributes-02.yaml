abstract:
- language: en
  script: Latn
  content: "<p>This document extends the QoSFilterRule AVP functionality of the Diameter
    Base protocol and the functionality of the QoS-Filter-Rule AVP defined in RFC
    4005. The ability to convey Quality of Service information is made available to
    the Diameter Network Access Server Application, the Diameter Credit Control Application
    and the Diameter Extensible Authentication Protocol (EAP) Application. Future
    Diameter applications can easily integrate Quality of Service support in addition
    to packet filtering.</p>"
