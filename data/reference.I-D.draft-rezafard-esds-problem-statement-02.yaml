abstract:
- language: en
  script: Latn
  content: <p>This document discusses the requirements of an application layer protocol
    which can meet the needs of today's complex and dynamic supply chains.  Currently,
    supply chain communication traffic travels over the Internet using existing Internet
    protocols, such as FTP, SMTP, and DNS.  This is a temporary solution for a growing
    niche. This document elaborates on issues that would arise if this trend continues.  Also,
    this document outlines a set of design concerns that an application layer protocol
    needs to address in order to be deployable in a real-world supply chain.  This
    document obsoletes "Extensible Supply-chain Discovery Service Problem Statement
    draft-rezafard-esds-problem-statement-01".  Comments are solicited and should
    be addressed to the mailing list at esds@ietf.org and/or the author(s).</p>
