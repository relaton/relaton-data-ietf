abstract:
- language: en
  script: Latn
  content: |-
    <p>The goal of this draft is to go over the technical aspects of SRv6
       Inter Domain routing in the context of IP VPN and EVPN overlays and
       seamlessly stitching the overlays across inter domain boundaries.
       This draft goes over the SRv6 Design and Operational technical
       caveats regarding SRv6 Inter Domain routing in detail.</p>
