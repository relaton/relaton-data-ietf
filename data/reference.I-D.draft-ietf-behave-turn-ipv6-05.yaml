abstract:
- language: en
  script: Latn
  content: "<p>This document defines the REQUESTED-ADDRESS-TYPE attribute for Traversal
    Using Relays around NAT (TURN).  The REQUESTED-ADDRESS-TYPE attribute allows a
    client to explicitly request the address type the TURN server will allocate (e.g.,
    an IPv4-only node may request the TURN server to allocate an IPv6 address).  Additionally,
    this document also defines a new error response code with the value 440 (Address
    Family not Supported).</p>"
