abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides the extended specification of SOCKS Version 5
       which enable to use multiple firewalls traversal.  In this protocol,
       client does subnegotiation with all servers on the communication
       path, and each server relays the connection after subnegotiation.</p>
