abstract:
- language: en
  script: Latn
  content: "<p>This document describes an improvement to unicast based rapid acquisition
    of multicast RTP sessions (RAMS) described in [I- D.ietf-avt-rapid-acquisition-for-rtp].
    \ The improved method allows a receiver to simultaneously request a unicast burst
    stream and join the multicast group, and then select one of the two streams to
    be first processed.</p>"
