abstract:
- language: en
  script: Latn
  content: "<p>Simple Network Management Protocol (SNMP) is a widely deployed application
    protocol for network management and data retrieval.  In this document we describe
    the applicability of SNMP for 6LoWPANs.  We discuss the implementation considerations
    of SNMP Agent and SNMP Manager followed by the deployment considerations of the
    SNMP protocol.  Our discussion also covers the applicability of MIB modules for
    6LoWPAN devices.</p>"
