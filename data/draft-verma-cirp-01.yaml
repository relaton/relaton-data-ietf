abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a transport-layer protocol for routing\n   capability-oriented intent between cryptographically identified\n   endpoints across heterogeneous trust domains.  The protocol defines\n   capability identifiers with mandatory versioning, scoped discovery\n   across five visibility levels, ticket-based session authorization,\n   negotiated cryptographic suites including hybrid post-quantum key\n   establishment, encrypted peer-to-peer session establishment, and\n   mutually attested invocation receipts with hash-chained integrity.\n   Payload semantics are opaque to the transport layer.\n\n   This revision clarifies session-level capability binding semantics,\n   aligns discovery behavior with deployed FIND_EX wire formats, and\n   refines session teardown security properties.</p>"
