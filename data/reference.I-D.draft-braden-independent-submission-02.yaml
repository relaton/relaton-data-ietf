abstract:
- language: en
  script: Latn
  content: <p>This document specifies the procedures by which authors of RFC Independent
    Stream documents grant the community "incoming" rights for copying and using the
    text.  It also specifies the "outgoing" rights the community grants to readers
    and users of those documents, and it requests that the IETF Trust manage the outgoing
    rights to effect this result.  Status of this Memo  This Internet-Draft is submitted
    to IETF in full conformance with the provisions of BCP 78 and BCP 79.  Internet-Drafts
    are working documents of the Internet Engineering Task Force (IETF), its areas,
    and its working groups.  Note that other groups may also distribute working documents
    as Internet- Drafts.  Internet-Drafts are draft documents valid for a maximum
    of six months and may be updated, replaced, or obsoleted by other documents at
    any time.  It is inappropriate to use Internet-Drafts as reference material or
    to cite them other than as "work in progress."  The list of current Internet-Drafts
    can be accessed at http://www.ietf.org/ietf/1id-abstracts.txt.  The list of Internet-Draft
    Shadow Directories can be accessed at http://www.ietf.org/shadow.html.  This Internet-Draft
    will expire on May 13, 2010.  Copyright Notice  Copyright (c) 2009 IETF Trust
