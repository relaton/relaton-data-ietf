    - language: en
      script: Latn
      content: '<p>This document is fifth in a series that is completely specified
        in "Dynamic Delegation Discovery System (DDDS) Part One: The Comprehensive
        DDDS" (RFC 3401).  It is very important to note that it is impossible to read
        and understand any document in this series without reading the others.  This
        document specifies an Internet Best Current Practices for the Internet Community,
        and requests discussion and suggestions for improvements.</p>'
