    - language: en
      script: Latn
      content: "<p>The goal of this document is to explain the need for congestion
        control in the Internet, and to discuss what constitutes correct congestion
        control.  This document specifies an Internet Best Current Practices for the
        Internet Community, and requests discussion and suggestions for improvements.</p>"
