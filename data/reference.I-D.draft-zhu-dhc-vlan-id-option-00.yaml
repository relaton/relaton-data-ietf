- language: en
  script: Latn
  content: "<p>This document defines a new option for the Dynamic Host Configuration
    Protocol for IPv4 and IPv6.  This option can be used by the DHCP server to carry
    the VLAN identifier to the DHCP client to distinguish different connections in
    the access network.</p>"
