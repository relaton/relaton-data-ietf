abstract:
- language: en
  script: Latn
  content: "<p>IPFIX Aggregation describes a methodology for reducing the amount of
    measurement data exchanged between monitoring devices (IPFIX exporters) and analyzers
    (IPFIX collectors). Using aggregation techniques, measurement information of multiple
    similar flows is aggregated into one compound flow aggregate. Subsets of flows
    eligible for aggregation, as well as the degree of similarity, can be customized
    using aggregation rules. To ensure efficient communication of both aggregated
    flows and the aggregation rules used, the IPFIX Protocol and IPFIX Information
    Model are slightly extended to allow for two new abstract data types and a new
    type of template set.</p>"
