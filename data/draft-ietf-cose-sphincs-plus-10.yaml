abstract:
- language: en
  script: Latn
  content: "<p>Digital signatures are used within JSON Object Signing and Encryption
    (JOSE) and CBOR Object Signing and Encryption (COSE) to protect the integrity
    and authenticity of messages, such as JSON Web Signatures and signed COSE structures.
    This document specifies JOSE and COSE serializations for the Stateless Hash-Based
    Digital Signature Standard (SLH-DSA), a Post-Quantum Cryptography (PQC) digital
    signature scheme defined in US NIST FIPS 205. The conventions for the associated
    algorithm identifiers, signatures, public keys, and private keys are also specified.</p>"
