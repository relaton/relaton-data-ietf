- language: en
  script: Latn
  content: |-
    <p>This document describes how to proxy UDP over HTTP.  Similar to how
       the CONNECT method allows proxying TCP over HTTP, this document
       defines a new mechanism to proxy UDP.  It is built using HTTP
       Extended CONNECT.</p>
