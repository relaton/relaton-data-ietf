title:
- language: en
  script: Latn
  content: Update to the Automatic Bandwidth Adjustment Procedure for MPLS-TE and
    SR-TE LSPs with a Stateful PCE
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-pce-stateful-pce-autobw-update-09
docidentifier:
- content: draft-ietf-pce-stateful-pce-autobw-update
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-11-27'
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends the automatic bandwidth adjustment procedure in
       RFC 8733 to SR-TE LSPs using SR-MPLS and SRv6, and to multipath LSPs
       using the PCEP extensions in RFC 10066.  For multipath LSPs, it
       defines per-path list signaling for Requested Bandwidth.  It also
       updates RFC 8733 to define how an all-zero AUTO-BANDWIDTH-ATTRIBUTES
       sub-TLV value restores a default or removes an attribute.</p>
