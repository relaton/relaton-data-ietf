abstract:
- language: en
  script: Latn
  content: "<p>This document describes plans for support of route aggregation, as
    specified in the descriptions of Classless Inter-Domain Routing (CIDR) [1] and
    the BGP-4 protocol [2], by the NSFNET Backbone Network Service. This memo provides
    information for the Internet community.  It does not specify an Internet standard.</p>"
