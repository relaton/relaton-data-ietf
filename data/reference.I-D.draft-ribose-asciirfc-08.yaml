abstract:
- language: en
  script: Latn
  content: "<p>This document describes an AsciiDoc syntax extension called AsciiRFC,
    designed for authoring IETF Internet-Drafts and RFCs.</p>"
- language: en
  script: Latn
  content: "<p>AsciiDoc is a human readable document markup language which affords
    more granular control over markup than comparable schemes such as Markdown.</p>"
- language: en
  script: Latn
  content: "<p>The AsciiRFC syntax is designed to allow the author to entirely focus
    on text, providing the full power of the resulting RFC XML through the AsciiDoc
    language, while abstracting away the need to manually edit XML, including references.</p>"
