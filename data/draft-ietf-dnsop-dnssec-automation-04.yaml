abstract:
- language: en
  script: Latn
  content: "<p>This document describes an algorithm and protocol to automate the setup,
    operations, and decommissioning of Multi-Signer DNSSEC [RFC8901] configurations.
    To accomplish this, it employs Model 2 of the multi-signer specification (where
    each operator has their own distinct KSK and ZSK sets, or CSK sets), management
    of DS records from the parent via CDS/CDNSKEY [RFC8078], and Child-to-Parent Synchronization
    in DNS [RFC7477].</p>"
