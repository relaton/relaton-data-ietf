abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 (PMIPv6) supports multihoming where a mobile node
    can connect to a PMIPv6 domain through multiple interfaces for simultaneous access.
    \ However, for an inter-technology handoff, PMIPv6 does not allow simultaneous
    access since all the home network prefixes associated with one interface are associated
    with another interface of a mobile node.  In this document, we propose a hybrid
    home network prefix assignment (HHNPA) scheme where both the static prefix model
    and the dynamic prefix model are used for simultaneous access.  The static prefix
    model is used within the general PMIPv6 domain.  On the other hand, the dynamic
    prefix model is employed for inter-technology handoff.  That is, for IP session
    continuity during inter-technology handoff, a dynamic prefix model is used on
    both interfaces.</p>"
