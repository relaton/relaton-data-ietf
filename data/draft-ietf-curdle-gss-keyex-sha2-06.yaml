- language: en
  script: Latn
  content: "<p>This document specifies additions and amendments to RFC4462. It defines
    a new key exchange method that uses SHA-2 for integrity and deprecates weak DH
    groups. The purpose of this specification is to modernize the cryptographic primitives
    used by GSS Key Exchanges.</p>"
