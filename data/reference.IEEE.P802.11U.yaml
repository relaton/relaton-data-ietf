abstract:
- language: en
  script: Latn
  content: "<p>This amendment specifies enhancements to the 802.11 MAC that support
    WLAN Interworking with External Networks. It enables higher layer functionalities
    to provide overall end-to-end solutions. The main goals of 802.1 lu are aiding
    network discovery and selection, enabling information transfer from external networks,
    enabling emergency services, and interfacing Subscription Service Provider Networks
    (SSPN) to 802.11 Networks that support Interworking with External Networks.</p>"
