abstract:
- language: en
  script: Latn
  content: "<p>This document defines how to use Media over QUIC Transport (MOQT) as
    the underlying transport protocol for the Model Context Protocol (MCP). MCP enables
    integration between language model applications and external data sources and
    tools. MOQT provides publish-subscribe delivery over QUIC and WebTransport with
    native prioritization, relay caching, and multiplexing. This specification maps
    MCP messages onto MOQT objects and defines procedures for session establishment,
    capability discovery, and ongoing communication. It covers MCP's core primitives
    (resources, tools, prompts, sampling, and notifications) through dedicated MOQT
    tracks. The document also describes Agent Skills -- composed instructions that
    extend AI capabilities beyond atomic tool operations -- using progressive loading
    aligned with MOQT's object-based delivery.</p>"
