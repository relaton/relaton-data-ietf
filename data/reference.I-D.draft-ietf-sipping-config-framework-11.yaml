abstract:
- language: en
  script: Latn
  content: "<p>This document defines a framework to enable configuration of Session
    Initiation Protocol (SIP) User Agents in SIP deployments. The framework provides
    a means to deliver profile data that User Agents need to be functional, automatically
    and with minimal (preferably none) User and Administrative intervention. The framework
    describes how SIP User Agents can discover sources, request profiles and receive
    notifications related to profile modifications. As part of this framework, a new
    SIP event package is defined for notification of profile changes. The framework
    provides for multiple data retrieval options, without requiring or defining retrieval
    protocols. The framework does not include specification of the profile data within
    its scope.</p>"
