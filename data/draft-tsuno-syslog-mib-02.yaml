abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB),
       the Syslog MIB, for use with network management protocols in the
       Internet community.  In particular, the Syslog MIB will be used to
       monitor and control syslog applications.</p>
