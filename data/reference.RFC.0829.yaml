abstract:
- language: en
  script: Latn
  content: "<p>This RFC describes briefly the packet satellite technology developed
    by the Defense Advanced Research Projects Agency and several other participating
    organizations in the U.K. and Norway and provides a bibliography of relevant papers
    for researchers interested in experimental and operational experience with this
    dynamic satellite-sharing technique.</p>"
