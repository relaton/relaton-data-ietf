abstract:
- language: en
  script: Latn
  content: "<p>This document describes the access control model for the Lightweight
    Directory Application Protocol V3 (LDAPv3) directory service. It includes a description
    of the model, the schema for the model, and the LDAP control to the LDAP protocol.
    The current LDAP APIs are sufficient for the access control operations. A separate
    requirements document for access control exists [REQTS].</p>"
