abstract:
- language: en
  script: Latn
  content: "<p>The Centralized Conferencing Manipulation Protocol (CCMP) can create,
    retrieve, change and delete objects describing a centralized conference, such
    as state and capabilities of the conference, participants, and their roles.  The
    conference information is contained in XML documents and fragments conforming
    to the centralized conferencing data model schema.  CCMP is a state-less client-server
    protocol based on a request/response model. Conferencing clients send requests
    to conference servers, which respond to the client with the conference information.
    \ This document also discusses options for using existing notification protocols
    to inform conference client about the changes in the state of a conference during
    its entire lifetime.</p>"
