abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Network Mobility (NEMO) Basic Support protocol
    that enables mobile networks to attach to different points in the Internet. The
    protocol is an extension of Mobile IPv6 and allows for session continuity for
    every node in the mobile network as the network moves. It also allows every node
    in the mobile network to be reachable while moving around. The Mobile Router,
    which connects the network to the Internet, runs the NEMO Basic Support protocol
    with its Home Agent. The protocol is designed in such a way that network mobility
    is transparent to the nodes inside the mobile network.</p>"
