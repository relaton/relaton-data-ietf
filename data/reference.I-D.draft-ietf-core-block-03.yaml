abstract:
- language: en
  script: Latn
  content: "<p>CoAP is a RESTful transfer protocol for constrained nodes and networks.
    \ CoAP is based on datagram transport, which limits the maximum size of resource
    representations that can be transferred without too much fragmentation.  The Block
    options provide a minimal way to transfer larger representations in a block-wise
    fashion.</p>"
