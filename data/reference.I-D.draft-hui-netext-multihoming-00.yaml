abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 is standardized to provide network-based mobility
    management for a regular IPv6 mobile node. This document introduces an extension
    to Proxy Mobile IPv6 for multihoming MN. Through extending the binding relationship
    between HNP and MAG in BCE, and synchronizing this information between LMA and
    MAGs, LMA can deliver data having the same HNP through multiple MAGs. Thus the
    MN attaching in a PMIPv6 domain can receive data packets with the same destination
    through its multiple network interfaces attaching to different MAGs simultaneously.</p>"
