abstract:
- language: en
  script: Latn
  content: "<p>Source address validation (SAV) helps routers check the validity of
    packets. Networks can use the SAV capability to enhance threat awareness. This
    document proposes proactive defense network where routers can directly identify
    threats through SAV. The proactive threat awareness feature is helpful for satisfying
    the threat awareness requirement of ISPs.</p>"
