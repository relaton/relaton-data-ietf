- language: en
  script: Latn
  content: "<p>As in IPv4 network, PPP (PPPoE) will still be an important mechanism
    to provide access services to broadband subscribers of IPv6 or dual- stack. This
    document describes problems the ISPs faced when deploying IPv6 in broadband access
    network over PPP, particularly, the capabilities lacked in IPv6CP.</p>"
