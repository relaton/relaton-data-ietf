abstract:
- language: en
  script: Latn
  content: "<p>At present the purge packet does not contain information of source
    router generating purge packets, so under the circumstance of route oscillation,
    it is difficult to locate the router closest to the point of failure that receives
    the LSP.  In this draft, it is proposed to add a new TLV for purge packet in which
    the system ID of source router is included. The TLVs are not changed in purge
    packets sent by other routers. When there is a network failure and purge packets
    are sent by routers, it is easy to locate the point of failure.</p>"
