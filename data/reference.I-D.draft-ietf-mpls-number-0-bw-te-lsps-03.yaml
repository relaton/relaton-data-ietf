abstract:
- language: en
  script: Latn
  content: "<p>Several Link-type sub-TLVs have been defined for OSPF and ISIS in the
    context of Multiprotocol Label Switching (MPLS) Traffic Engineering (TE) in order
    to advertise some link characteristics such as the available bandwidth, traffic
    engineering metric, administrative group and so on. By making statistical assumption
    on the aggregated traffic carried onto a set of TE Label Switched Paths (LSPs)
    signalled with zero bandwdith (referred to as unconstrained TE LSP in this document),
    and with the knowledge of the number of unconstrained TE LSPs signalled across
    a link, algorithms can be designed to load balance (existing or newly configured)
    unconstrained TE LSP across a set of equal cost paths. This requires the knowledge
    of the number of unconstrained TE LSPs signalled across a link. This document
    specifies a new Link-type Traffic Engineering sub-TLV used to advertise the number
    of unconstrained TE LSP(s) signalled across a link.</p>"
