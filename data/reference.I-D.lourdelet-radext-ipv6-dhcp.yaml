- language: en
  script: Latn
  content: "<p>This document specifies RADIUS [RFC2865] attributes supporting IPv6
    network access to complement [RFC3162] in DHCP environments.  It addresses the
    need to dynamically advertise DNS Server addresses and one or multiple IPv6 addresses
    via DHCPv6.</p>"
