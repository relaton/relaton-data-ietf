abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism whereby a subscriber's Internet\n   service provider may signal in BGP the ability of the subscriber\n   network to receive content using multicast connectivity.  This\n   mechanism is called Multicast Distribution Reachability Signaling\n   (MDRS).</p>"
