abstract:
- language: en
  script: Latn
  content: "<p>This document proposes two new DHCPv4 options which allow IPv6 hosts
    to obtain configuration information (e.g., DNS servers). The DHCPv6 Server Option
    in DHCPv4 provides the IPv6 address of DHCPv6 server to the 6rd CPE. In result
    the 6rd CPE can relay DHCPv6 requests to DHCPv6 servers. As an alternative, the
    IPv6 DNS Server Option is used in the scenario where hosts only need the information
    of IPv6 DNS servers.</p>"
