abstract:
- language: en
  script: Latn
  content: "<p>This memo provides guidelines and Best Current Practice for operating
    DNS in a world where queries and responses are carried in a mixed environment
    of IPv4 and IPv6 networks.  This document specifies an Internet Best Current Practices
    for the Internet Community, and requests discussion and suggestions for improvements.</p>"
