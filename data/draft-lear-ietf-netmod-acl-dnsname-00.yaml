abstract:
- language: en
  script: Latn
  content: "<p>End points are commonly referenced by higher level functions through
    the DNS. This is especially the case in cloud-based functions, which might have
    hundreds of IP addresses for the same name. This brief memo extends the IETF-ACL
    model to allow access-control via domain names.</p>"
