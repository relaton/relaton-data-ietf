abstract:
- language: en
  script: Latn
  content: "<p>The Geopriv Location Object introduced by the Presence Information
    Data Format - Location Object (PIDF-LO), RFC 4119, defines a basic XML format
    for carrying geographical information of a presentity. The PIDF-LO specification
    made a subset of the functionality offered by the Geography Markup Language (GML)
    standard 3.0 mandatory to implement.  This document defines child elements to
    the &lt;location- info&gt; element specified in RFC 4119 to carry temporal feature
    elements useful for tracking moving objects.  Elements are defined that enable
    expression of speed, heading, acceleration and facing of the presentity.</p>"
