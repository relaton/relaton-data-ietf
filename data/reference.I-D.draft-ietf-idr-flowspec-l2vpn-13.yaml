abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Border Gateway Protocol (BGP) Flow-spec extension
    to disseminate Ethernet Layer 2 (L2) and Layer 2 Virtual Private Network (L2VPN)
    traffic filtering rules either by themselves or in conjunction with L3 Flow-specs.
    \ AFI/SAFI 6/133 and 25/134 are used for these purposes.  New component types
    and an extended community also are defined.</p>"
