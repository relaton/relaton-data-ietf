abstract:
- language: en
  script: Latn
  content: "<p>Audit receipts for automated data access attest to what a gateway recorded.
    Two questions remain outside their reach: what was changed in the data before
    it was disclosed, and whether the set of receipts is complete with respect to
    the data source's own accounting of activity. This document defines two evidence
    structures that answer those questions: Transformation Evidence, a per-disclosure
    statement of which classes of values were transformed and how, carrying counts
    and class names but never values; and Coverage Reconciliation, a procedure and
    result statement that compares a source's own activity counters against a receipt
    set over a time window and classifies what the comparison establishes. The reconciliation
    result distinguishes what was matched under a declared correspondence from what
    was observed without a receipt, receipted without a corresponding observation,
    excluded before comparison, or left indeterminate; it does not report a bare pass.
    Both structures are designed to be registered as Signed Statements on a Transparency
    Service as described in the SCITT architecture. This document defines evidence
    payloads; it does not define a new receipt format, a new transparency mechanism,
    or a new signature format.</p>"
