abstract:
- language: en
  script: Latn
  content: "<p>Flow selection is the process of selecting a subset of flows from all
    flows observed at an observation point.  The objective of flow selection is to
    reduce the effort of post-processing flow data and transferring flow records.
    \ The flow selection process can be enabled at different stages of the measurement
    process.  It can be applied either directly after classification or at recording/exporting
    time by limiting the number of flows to be stored and/or exported to the collecting
    process.  This document describes motivations for flow selection and presents
    flow selection techniques.  It furthermore provides an information model for configuring
    flow selection techniques and discusses what information about a flow selection
    process is worth exporting through a suitable information model.</p>"
