- language: en
  script: Latn
  content: "<p>The mobile wireless access networks are converging towards IP-based
    architecture that enables interconnect of different layer 2 radio access systems.
    IP-based local (or micro) mobility management (LMM) solution is the key to unify
    the different layer 2 mobility management solutions in the new architecture.</p>"
