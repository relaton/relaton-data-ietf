abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies improvements to Customer Edge Routers that
       help mitigate the problems that may arise when network configuration
       information becomes invalid, without any explicit signaling of that
       condition to the local nodes.  This document updates RFC7084.</p>
