abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the way that is to make policy based point
    to multipoint (p2mp) LSP using BGP. BGP update message is used to notify to consult
    which is a p2mp LSP's ingress, branch, egress LSRs, and indicate upstream node
    of LSP with MPLS label information from downstream LSR.</p>"
