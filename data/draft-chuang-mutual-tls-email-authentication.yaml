abstract:
- language: en
  script: Latn
  content: "<p>Valid client and server TLS certificates authenticate the traffic\n   coming from the SMTP sending and receiving servers.  Domain owners\n   can delegate email sending and receiving to servers using Mail\n   eXchange (MX) DNS resource records.  This enables transitive\n   authentication of mail traffic from sending and receiving domains of\n   envelope sender much like Sender Policy Framework and the envelope\n   recipient.  This document also proposes an Automatic Certificate\n   Management Environment responder using these DNS records to automate\n   TLS certificate issuance.</p>"
