abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how the Verified Commerce for Agent Protocols\n   (VCAP) settlement layer binds to the Agent Payments Protocol (AP2)\n   developed by Google and its coalition partners.  AP2 defines payment\n   intents, mandates, and verifiable digital credentials (VDCs) for\n   agent-initiated transactions.  VCAP defines escrow state machines,\n   verification callbacks, and cryptographic proof bindings for verified\n   delivery settlement.  AP2's `PaymentIntent` supports `captureType:\n   \"escrow_release\"` with `releaseCondition: \"delivery-confirmation\"`,\n   but the AP2 specification does not define what constitutes a delivery\n   confirmation, how it is cryptographically verified, or how the\n   verification result triggers fund capture.  This binding document\n   fills that gap.</p>"
