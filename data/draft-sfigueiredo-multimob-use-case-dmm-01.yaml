abstract:
- language: en
  script: Latn
  content: "<p>As mobile networks are moving towards distributed mobility management,
    the application of IP multicast is needed to provide efficient content delivery
    on the network. This document describes use cases when IP multicast is applied
    on PMIPv6-based DMM, and analyzes problems focused on user plane issues.</p>"
