title:
- language: en
  script: Latn
  content: Extending the Opening of Files in NFSv4.2
  format: text/plain
docidentifier:
- content: draft-ietf-nfsv4-delstid
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>The Network File System v4 (NFSv4) allows a client to both open a file
    and be granted a delegation of that file. This delegation provides the client
    the right to authoritatively cache metadata on the file locally. This document
    presents several extensions for both the opening and delegating of the file to
    the client. This document extends NFSv4.2 (see RFC7863).</p>"
  format: text/html
