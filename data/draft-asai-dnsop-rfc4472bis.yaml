abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the three-stage IPv6 transition of Domain
       Name Systems (DNS) transport.  The scope of this document is only the
       transport between authoritative servers and recursive servers, but
       does not include the transport of recursive servers for DNS clients.</p>
