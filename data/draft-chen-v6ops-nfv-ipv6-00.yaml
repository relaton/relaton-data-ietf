abstract:
- language: en
  script: Latn
  content: "<p>NFV adoption is gaining significant momentum, driven largely by the
    need to improve service agility and reduce operational cost. IPv6 is a fundamental
    feature should be enabled. This memo desribes the layered NFV components and typical
    implementations. The IPv6 considerations have been elaborated to each component
    in order to consoliate IPv6 demands across entire NFV system.</p>"
