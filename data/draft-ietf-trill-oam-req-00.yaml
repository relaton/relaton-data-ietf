abstract:
- language: en
  script: Latn
  content: "<p>OAM (Operations, Administration and Maintenance) is a general term
    used to identify functions and toolsets to troubleshoot and monitor networks.
    This document presents, OAM Requirements applicable to TRILL. Also presented in
    this document is the proposed frame structure for TRILL OAM messages.</p>"
