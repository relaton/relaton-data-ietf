- language: en
  script: Latn
  content: "<p>This memo identifies a set of requirements for the reliable delivery
    of messages over the Internet. It defines what is meant by reliable delivery between
    two software agents and what requirements this places on an inter-agent protocol
    to ensure reliable message delivery between them.</p>"
