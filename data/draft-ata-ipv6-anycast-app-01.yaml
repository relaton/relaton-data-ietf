- language: en
  script: Latn
  content: "<p>This document describes the applications and characteristics of Anycast,
    which is network addressing and routing scheme that routes data through the best
    destination. The primary purpose of this document is to describe the many advantages
    and applications of Anycast and hopefully, to motivate you to consider new applications
    of Anycast.</p>"
