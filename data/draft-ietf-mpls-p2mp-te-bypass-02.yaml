abstract:
- language: en
  script: Latn
  content: "<p>This document defines procedures for fast reroute protection of  \n
    \  Point-To-MultiPoint (P2MP) Traffic Engineering Label Switched Paths  \n   (TE-LSP)
    in  MultiProtocol Label Switching (MPLS) networks, based  \n   upon Point-To-MultiPoint
    Bypass Tunnels. The motivation for using   \n   P2MP Bypass Tunnels is to avoid
    potentially expensive data   \n   duplication along the backup path that could
    occur if Point-To-Point  \n   Bypass Tunnels were used, i.e., to optimize the
    bandwidth usage,  \n   during fast reroute protection of a link or a node. During
    link or  \n   node failure the traffic carried onto a protected P2MP TE-LSP is
    \ \n   tunnelled within one or several P2MP Bypass Tunnels towards a set of  \n
    \  Merge Points. To avoid data duplication, backup labels (i.e., inner  \n   labels)
    are assigned by the Point of Local Repair (PLR) according to      \n   the RSVP-TE
    upstream label assignment procedure.</p>"
