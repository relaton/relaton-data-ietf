abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Kinetic Identity Documents (KIDs) and Capability
    Manifests, a higher-layer identity and service-discovery model for the Kinetic
    Network Protocol. A Kinetic name is a transferable human-readable alias. A KID
    is a persistent cryptographic identity. A Capability Manifest, signed by the KID,
    describes the services currently offered by that identity. This separation prevents
    applications from confusing a name with an identity and allows names to resolve
    to websites, APIs, messaging endpoints, storage systems, agents, and future services
    without changing the underlying naming protocol.</p>"
