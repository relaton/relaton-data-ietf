abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Kinetic Identity Documents (KIDs) and\n   Capability Manifests, a higher-layer identity and service-discovery\n   model for the Kinetic Network Protocol.  A Kinetic name is a\n   transferable human-readable alias.  A KID is a persistent\n   cryptographic identity.  A Capability Manifest, signed by the KID,\n   describes the services currently offered by that identity.  This\n   separation prevents applications from confusing a name with an\n   identity and allows names to resolve to websites, APIs, messaging\n   endpoints, storage systems, agents, and future services without\n   changing the underlying naming protocol.</p>"
