abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a general channel mechanism for sending messages,
    such as OAM (Operations, Administration, and Maintenance) messages, between RBridges
    (Routing Bridges) and between RBridges and end stations in an RBridge campus through
    extensions to the TRILL (TRansparent Interconnection of Lots of Links) protocol.</p>"
