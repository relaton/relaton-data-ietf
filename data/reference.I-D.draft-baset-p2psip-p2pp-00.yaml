abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Peer-to-Peer Protocol (P2PP), an application-layer
    protocol, for creating and maintaining an overlay of participant nodes. The overlay
    can be created using various structured and unstructured peer-to-peer protocols
    such as Chord, Pastry, Kademlia, Gnutella, and Gia.</p>"
