---
id: draftietfsuitmanifest
schema_version: v1.5.6
title:
- language: en
  script: Latn
  content: A Concise Binary Object Representation (CBOR)-based Serialization Format
    for the Software Updates for Internet of Things (SUIT) Manifest
  format: text/plain
docidentifier:
- content: draft-ietf-suit-manifest
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This specification describes the format of a manifest. A manifest is
    a bundle of metadata about code/data obtained by a recipient (chiefly the firmware
    for an Internet of Things (IoT) device), where to find the code/data, the devices
    to which it applies, and cryptographic information protecting the manifest. Software
    updates and Trusted Invocation both tend to use sequences of common operations,
    so the manifest encodes those sequences of operations, rather than declaring the
    metadata.</p>"
  format: text/html
