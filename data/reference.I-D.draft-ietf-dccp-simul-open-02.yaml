abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an update to the Datagram Congestion Control
    Protocol (DCCP), a connection-oriented and datagram-based transport protocol.
    \ The update adds a packet type, DCCP-Listen, which assists DCCP applications
    that need to communicate through one or more middleboxes (e.g.  Network Address
    Translators, NATs, or firewalls), where establishing necessary middlebox state
    requires peering endpoints to initiate communication in a near-simultaneous manner.</p>"
