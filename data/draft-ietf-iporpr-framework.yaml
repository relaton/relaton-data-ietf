abstract:
- language: en
  script: Latn
  content: "<p>This document discusses technical issues and requirements of running
    \nIP over Resilient Packet Rings. It is the intent of this document to \nproduce
    a coherent description of all significant approaches, which \nwere and are being
    considered by the IPORPR working group. Selections \nof specific approaches, making
    choices regarding engineering \ntradeoffs, and detailed protocol specification,
    are outside of the \nscope of this framework document.</p>"
