abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an experimental post-quantum cryptographic
       protection profile for the OPC Unified Architecture Secure
       Conversation protocol (OPC UA UASC) carried over the opc.tcp
       transport.  The profile uses ML-KEM-768 for SecureChannel key
       establishment, ML-DSA for asymmetric signatures, HKDF-SHA-256 for key
       derivation, and AES-256-GCM for symmetric message protection.  It
       defines the profile identifiers, nonce encoding, key schedule,
       authenticated-encryption inputs, certificate and public-key binding
       requirements, token rollover behavior, and implementation and
       interoperability requirements.

       The profile is derived from an experimental open62541 implementation
       and is intended to support interoperability experiments and review in
       the IOT Operations Working Group.  The identifiers and wire behavior
       in this document are provisional.  This document does not assign an
       official OPC UA SecurityPolicy identifier and does not claim
       conformance with an OPC Foundation specification.</p>
