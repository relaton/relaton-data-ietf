abstract:
- language: en
  script: Latn
  content: "<p>This document defines RFC-OOP-C, a standard for object-oriented programming
    in pure C. It specifies naming conventions, class structure macros, method macros,
    validation macros, memory allocation patterns, lifecycle management, build-level
    configuration, struct versioning, Doxygen documentation requirements, and a conformance
    checker interface (the RFC-OOP-C Conformance Checker, RFC_Checker). The standard
    targets C11 (ISO/IEC 9899:2011) and is applicable to any C project on any microcontroller
    or platform whose toolchain supports C11. Supplementary guidance is provided for
    embedded systems including thread-safety and memory allocation strategies compatible
    with bare-metal, FreeRTOS and embOS.</p>"
