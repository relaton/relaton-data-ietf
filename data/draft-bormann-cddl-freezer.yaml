- language: en
  script: Latn
  content: "<p>In defining the Concise Data Definition Language (CDDL), some features
    have turned up that would be nice to have. In the interest of completing this
    specification in a timely manner, the present document collects nice-to-have features
    that did not make it into the first RFC for CDDL.</p>"
