abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Transport Mapping Security Model (TMSM) extension
    for the Simple Network Management Protocol (SNMP) architecture defined in RFC
    3411. This document identifies and discusses some key aspects that need to be
    considered for any transport-mapping-based security model for SNMP.</p>"
