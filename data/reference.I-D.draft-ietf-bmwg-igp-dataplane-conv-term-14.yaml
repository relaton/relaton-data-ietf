abstract:
- language: en
  script: Latn
  content: "<p>This document describes the terminology for benchmarking Interior Gateway
    Protocol (IGP) Route Convergence.   The terminology is to be used for benchmarking
    IGP convergence time through externally observable (black box) data plane measurements.
    \ The terminology can be applied to any link-state IGP, such as ISIS and OSPF.</p>"
