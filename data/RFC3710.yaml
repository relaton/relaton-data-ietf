abstract:
- language: en
  script: Latn
  content: "<p>This memo provides a charter for the Internet Engineering Steering
    Group (IESG), a management function of the Internet Engineering Task Force (IETF).
    It is meant to document the charter of the IESG as it is presently understood.
    This memo provides information for the Internet community.</p>"
