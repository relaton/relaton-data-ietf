abstract:
- language: en
  script: Latn
  content: "<p>The base BGP specification specifies a mechanism to include optional
    parameters with the OPEN message. Optional parameters are identified by a type
    code. However, no IANA registry exists for this type code. This document requests
    IANA to create such a registry.</p>"
