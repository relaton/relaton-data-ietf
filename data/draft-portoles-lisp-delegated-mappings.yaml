- language: en
  script: Latn
  content: "<p>The LISP protocol with its inherent decoupling of control-plane and
    data-plane, offers the flexibility to support modern networking paradigms. This
    document specifies how to use the LISP protocol to enable centralized onboarding
    and management of EIDs within a network from an external controller or orchestration
    system. Requirements Notation</p>"
