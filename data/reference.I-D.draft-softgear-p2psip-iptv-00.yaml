abstract:
- language: en
  script: Latn
  content: "<p>This document defines a distributed IPTV Usage for Resource Location
    And Discovery (RELOAD). The IPTV Usage provides lookup service for IPTV channel
    information and IPTV metadata stored in the overlay. The Attach method is used
    to establish a direct connection between a distributed channel manager and a viewer.
    IPTV control messages are exchanged through this connection.</p>"
