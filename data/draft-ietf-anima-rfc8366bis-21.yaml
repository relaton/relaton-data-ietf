abstract:
- language: en
  script: Latn
  content: '<p>This document defines a strategy to securely assign a Pledge to an
    Owner using an artifact signed, directly or indirectly, by the Pledge''s manufacturer.
    This artifact is known as a "Voucher". This document defines an artifact format
    as a YANG-defined JSON or CBOR document that has been signed using a variety of
    cryptographic systems. The Voucher Artifact is normally generated by the Pledge''s
    manufacturer (i.e., the Manufacturer Authorized Signing Authority (MASA)). This
    document updates RFC8366: it includes a number of desired extensions into the
    YANG module. The Voucher Request YANG module defined in RFC8995 is also updated
    and now included in this document, as well as other YANG extensions needed for
    variants of BRSKI/ RFC8995.</p>'
