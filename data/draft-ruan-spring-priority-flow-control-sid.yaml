abstract:
- language: en
  script: Latn
  content: "<p>In the wake of the continuous emergence of novel AI technologies,\n   including collaborative training, distributed inference and the like,\n   the scenario in which different data centers communicate via the RDMA\n   (Remote Direct Memory Access) protocol has emerged as a new\n   requirement. similar to data center networks, wide area networks\n   (WANs) should also be equipped with certain flow control\n   capabilities, nodes in the wide area network (WAN) need to quickly\n   and accurately notify upstream traffic nodes of their congestion\n   status.  Upon receiving the congestion notification, upstream nodes\n   can take responsive actions to mitigate network congestion.  By\n   extending SRv6[RFC 8986] technology, specific services can be carried\n   over SRv6 policies, which enables the precise delivery and response\n   of congestion signals.\n\n   For traffic carried over SRv6 policies, the service traffic path is\n   explicitly orchestrated via the Segment List in the SRH header.  By\n   parsing the sequence of the Segment List, downstream nodes or\n   controllers can accurately identify the upstream nodes and interfaces\n   corresponding to the current traffic, thus enabling the rapid\n   notification of congestion information to the upstream.  Since each\n   SID in the Segment List is a 128-bit IPv6 address that represents a\n   specific behaviour (e.g., End, End.X), extending existing behaviours\n   to mark their capability to receive and process congestion signals\n   allows flexible control over the delivery mode of congestion signals\n   in the WAN.\n\n   The specific packet formats and contents of congestion signals vary\n   in various ways and are continuously being updated.  This document\n   takes the most commonly used PFC backpressure notification mechanism\n   as an example to elaborate on the overall workflow of WAN congestion\n   information notification and the extensions to the SRv6 protocol.\n   PFC technology is widely deployed in RoCEv2 networks within data\n   centers to report congestion signals.  By leveraging SRv6 and NRP\n   technologies, it is possible to effectively control the propagation\n   range and path of PFC backpressure signals in wide area networks,\n   thereby avoiding issues such as deadlocks and the excessive\n   propagation of congestion scope.</p>"
