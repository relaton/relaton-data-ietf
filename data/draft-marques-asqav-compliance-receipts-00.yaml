abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a compliance profile of the signed action
       receipt format used by AI agents to record machine-readable evidence
       of access-control decisions.  The profile binds receipt fields to the
       operational record-keeping obligations of Articles 12 and 26 of
       Regulation (EU) 2024/1689 (the EU AI Act) and to the ICT-related
       incident management requirements of Article 17 of Regulation (EU)
       2022/2554 (DORA).  It does not redefine the wire format, the
       canonicalization rule, or the signing algorithms of the underlying
       receipt format.  It tightens a subset of the OPTIONAL fields to
       REQUIRED, imposes a retention floor, mandates two-anchor
       timestamping, and adds two extension fields.</p>
