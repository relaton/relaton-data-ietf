abstract:
- language: en
  script: Latn
  content: "<p>This memo defines two IPCP (IP Configuration Protocol, [RFC1332]) Options
    to be used in the context of Port Range solutions.  IPCP is the configuration
    protocol used when PPP (Point-to-Point Protocol, [RFC1661]) is deployed.</p>"
