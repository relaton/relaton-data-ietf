abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Fault Management solution for network virtualization
    overlay networks. Methods in this document follow the IEEE 802.1 CFM framework
    and reuse OAM tools where possible. Additional messages and TLVs are defined for
    IETF overlay OAM specific applications or where extensions beyond IEEE 802.1 CFM
    are required.</p>"
