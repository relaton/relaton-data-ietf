abstract:
- language: en
  script: Latn
  content: "<p>One possible deployment strategy for BGP origin validation based on
    the Resource Public Key Infrastructure (RPKI) is the construction of islands of
    trust.  This document describes the authors' experience deploying and maintaining
    a BGP origin validation island of trust in Ecuador.</p>"
