abstract:
- language: en
  script: Latn
  content: "<p>Mtrace version 2 traces an IP multicast path by walking from a last-
    hop router or rendezvous point toward the source. That model is efficient for
    a single receiver path, but it does not directly answer the operational question
    of where a multicast source fans out downstream without issuing separate traces
    from many receiver-side locations.</p>"
