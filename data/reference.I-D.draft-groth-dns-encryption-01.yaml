abstract:
- language: en
  script: Latn
  content: "<p>This document requests IANA registration of a new DNS OpCode and ErrorCode
    type in facilitating encryption of DNS requests and replies and feed back to the
    client if plain text requests are not acceptable. Once this OpCode is seen the
    DNS server attempts to decrypt the request using it's private OpenPGP key. Inside
    the encrypted packet will be an AES key which the client expects to be used when
    the server encrypts a response. A server can advertise that it is capable of DNS
    encryption by returning OpenPGP fingerprints via PKA information in TXT records
    and the full pubic keys can be stored as CERT records against the host names of
    NS records.</p>"
