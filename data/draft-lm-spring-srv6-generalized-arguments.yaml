- language: en
  script: Latn
  content: "<p>This document analyzes the challenges of Arguments of SRv6 SID, and
    the chance of using Arguments of SRv6 SID to reduce the length of the IPv6 extension
    header. According to these analysis, this document specifies a kind of generalized
    and structured Arguments for SRv6 SID, which can carry multiple Arguments parts
    for a SRv6 SID.</p>"
