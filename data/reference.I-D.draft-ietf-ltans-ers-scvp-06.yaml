abstract:
- language: en
  script: Latn
  content: "<p>The Simple Certificate Validation Protocol (SCVP) defines an extensible
    means of delegating the development and validation of certification paths to a
    server.  It can be used to support the development and validation of certification
    paths well after the expiration of the certificates in the path by specifying
    a time of interest in the past.  The Evidence Record Syntax (ERS) defines structures,
    called evidence records, to support non-repudiation of existence of data.  Evidence
    records can be used to preserve materials that comprise a certification path such
    that trust in the certificates can be established after the expiration of the
    certificates in the path and after the cryptographic algorithms used to sign the
    certificates in the path are no longer secure.  This document describes an application
    of SCVP to serve this purpose using the WantBack feature of SCVP to convey evidence
    records.</p>"
