abstract:
- language: en
  script: Latn
  content: "<p>The simultaneous usage of multiple interfaces in a host may cause the
    interface change.  This document discusses how to solve the problems of interface
    change in a host and proposes a virtual interface which hides the change of network
    interface from the host IP stack to support simultaneous usage of multiple interfaces
    in a host.</p>"
