- language: en
  script: Latn
  content: "<p>Mobile devices place an importance of geo-location. Based upon a user's
    spatial location, certain applications and servers may differ as compared to other
    locations. This draft attempts to list some location service scenarios and their
    impact upon any architecture which serves location based services.</p>"
