id: draftietftlsextendedkeyupdate
schema_version: v1.5.6
formattedref:
  content: draft-ietf-tls-extended-key-update
title:
- language: en
  script: Latn
  content: Extended Key Update for Transport Layer Security (TLS) 1.3
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-tls-extended-key-update-13
docidentifier:
- content: draft-ietf-tls-extended-key-update
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-07-04'
abstract:
- language: en
  script: Latn
  content: "<p>TLS 1.3 ensures forward secrecy by performing an ephemeral Diffie-\n   Hellman key exchange during the initial handshake, protecting past\n   communications even if a party's long-term keys (typically a private\n   key with a corresponding certificate) are later compromised.\n\n   While the built-in KeyUpdate mechanism allows application traffic\n   keys to be refreshed during a session, it does not incorporate fresh\n   entropy from a new key exchange and therefore does not provide post-\n   compromise security.  This limitation can pose a security risk in\n   long-lived sessions, such as those found in industrial IoT or\n   telecommunications environments.\n\n   To address this, this specification defines an extended key update\n   mechanism that performs a fresh execution of the key exchange\n   negotiated during the initial handshake within an active session,\n   thereby ensuring post-compromise security.\n\n   By forcing attackers to exfiltrate new key material repeatedly, this\n   approach mitigates the risks associated with static key compromise.\n   Regular renewal of session keys helps contain the impact of such\n   compromises.  The extension is applicable to both TLS 1.3 and DTLS\n   1.3.</p>"
