abstract:
- language: en
  script: Latn
  content: "<p>Network Reachability information in the Internet is curretly\nexchanged through the use of the BGP-4 protocol[1].  BGP Speakers\nrequire an Autonomous System (AS) number in order to peer.  The AS\nnumber is used to identify sets of routes sharing a common\nadministrative policy.</p>"
