abstract:
- language: en
  script: Latn
  content: "<p>TCP-Friendly Rate Control (TFRC) is a congestion control mechanism
    for unicast flows operating in a best-effort Internet environment [RFC3448]. This
    document introduces Faster Restart, an optional mechanism for safely improving
    the behavior of interactive flows that use TFRC. Faster Restart is proposed for
    use with both the default TFRC and with the small packet variant of TFRC [TFRCSP].
    We present Faster Restart in general terms as a congestion control mechanism,
    and further describe how to implement Faster Restart in Datagram Congestion Control
    Protocol (DCCP) Congestion Control IDs 3 and 4 [RFC4342], [CCID4].</p>"
