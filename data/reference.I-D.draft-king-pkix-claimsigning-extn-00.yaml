abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies an Extended Key Usage (EKU) X.509 certificate extension
    which indicates that the certificate holder is authorized to sign security tokens
    to assert claims, or attributes, about a principal.  When an owner of a certificate
    that asserts the claimSigning EKU signs a claim, the owner is asserting that a
    statement about the principal is true. For example, a IdP secure token service
    (STS) would use an X.509 certificate containing the claimSigning EKU to sign SAML
    assertions containing an identifier and attributes about a user.</p>"
