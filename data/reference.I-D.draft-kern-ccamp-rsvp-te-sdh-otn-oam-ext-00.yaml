abstract:
- language: en
  script: Latn
  content: "<p>GMPLS has been extended to support connection establishment in both
    SONET/SDH [RFC4606] and OTN [RFC4328] networks.  These documents do not support
    the configuration of the supervision functions.  Both SONET/SDH and OTN implement
    supervision functions to qualify the transported signals.  [GMPLS-OAM-FWK] defines
    a technology-agnostic framework for GMPLS to support the establishment and configuration
    of pro-active OAM monitoring of signalled connections.  This document defines
    extensions to RSVP-TE for SONET/SDH and OTN OAM configuration.</p>"
