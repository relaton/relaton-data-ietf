abstract:
- language: en
  script: Latn
  content: "<p>This document presents a problem statement and gap analysis of the
    technical challenges faced by the GeneRic Autonomic Signaling Protocol (GRASP)
    [RFC8990] when it is used, within the Autonomic Networking Infrastructure (ANI)
    defined by the ANIMA Working Group [RFC8993], to support enhanced Autonomic Service
    Agents that incorporate Large Language Model (LLM) capabilities, referred to in
    this document as AI-ASAs.</p>"
