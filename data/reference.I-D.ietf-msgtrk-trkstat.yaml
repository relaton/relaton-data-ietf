abstract:
- language: en
  script: Latn
  content: "<p>Message Tracking is expected to be used to determine the status of
    undelivered e-mail upon request. Tracking is used in conjunction with Delivery
    Status Notifications [RFC-DSN-SMTP] and Message Disposition Notifications [RFC-MDN];
    generally, a message tracking request will be issued only when a DSN or MDN has
    not been received within a reasonable timeout period. This memo defines a MIME
    [RFC-MIME] content-type for message tracking status in the same spirit as RFC
    1894, 'An Extensible Message Format for Delivery Status Notifications' [RFC-DSN-STAT].
    It is to be issued upon a request as described in 'Message Tracking Query Protocol'
    [DRAFT-MTRK-MTQP]. This memo defines only the format of the status information.
    An extension to SMTP [RFC-ESMTP] to label messages for further tracking and request
    tracking status is defined in a separate memo [DRAFT-MTRK-SMTPEXT].</p>"
