abstract:
- language: en
  script: Latn
  content: "<p>The Blocks Extensible Exchange Protocol (BEEP) provides a protocol
    framework for the development of application protocols.  This document describes
    a BEEP feature that enables asynchrony for individual channels.  This memo defines
    an Experimental Protocol for  the Internet community.</p>"
