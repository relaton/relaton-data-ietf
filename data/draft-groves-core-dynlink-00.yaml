abstract:
- language: en
  script: Latn
  content: "<p>For CoAP [RFC7252] Dynamic linking of state updates between resources,
    either on an endpoint or between endpoints, is defined with the concept of Link
    Bindings. This document defines conditional observation attributes that work with
    Link Bindings or with simple CoAP Observe [RFC7641].</p>"
