abstract:
- language: en
  script: Latn
  content: "<p>Every action an AI agent takes is a decision.  Right now, none of\n   those decisions are signed.\n\n   AI agents operating in automated workflows take actions without any\n   normative mechanism for expressing why those actions are being taken.\n   Access tokens declare what an agent is permitted to do; no existing\n   standard declares what the agent believes it is doing, on what\n   reasoning basis, and with what level of confidence, at the moment of\n   action.  This document defines the Intent Declaration Primitive\n   (IDP): a structured per-transition declaration submitted by an AI\n   agent to the Governing Enforcement Component (GEC) at each action\n   step of an execution loop.  The IDP is committed to a tamper-evident\n   Event Log before the action executes, enabling post-hoc review of\n   agent reasoning, richer authorization policy evaluation, and enriched\n   denial responses that guide agent behaviour.  The IDP also provides\n   the technical basis for compliance with EU AI Act Article 12 logging\n   requirements for high-risk AI systems.  This document adds the IDP\n   Commitment Verification mechanism, by which the GEC verifies at each\n   state transition that the agent's actual action matches its declared\n   intent.  This document also adds the RETRY_CONTINUATION reasoning\n   basis type and the prior_denial_count Cedar context attribute, which\n   together address computational inefficiency arising from uninformed\n   agent retry loops.  This document further defines, in Section 5.6,\n   the schemas of the outcome Event Log entries (STATE_TRANSITIONED,\n   CEDAR_DENY_RECORDED, and ACTION_RESULT_RECORDED) that record the\n   result of each governed transition, completing the pre-action/post-\n   action audit pair that gives the IDP its full auditability property.\n   This document renames the Governing Kernel role to Governing\n   Enforcement Component (GEC) to accommodate application-layer,\n   isolated-process, and kernel-level implementations under a common\n   conformance model.  A Conformance Levels section (Section 9) defines\n   three implementation profiles (Application, Isolated, and Kernel)\n   with graduated non-suppressibility guarantees.  A data_residency\n   field is added to the IDP structure (Section 4.1) governing analytics\n   tier eligibility.  Section 3.5 states the Event Log as Operational\n   Intelligence design intent.</p>"
