abstract:
- language: en
  script: Latn
  content: "<p>DECADE is an in-network storage infrastructure which is under discussions
    and constructions.  It can be integrated into Peer-to- Peer (P2P) applications
    to achieve more efficient content distributions.  This document represents a detailed
    example of how to integrate DECADE into P2P live streaming (a popular P2P application).
    Specifically, it describes mainly about: 1) a preliminary DECADE client API; 2)
    a P2P live streaming integration with DECADE; 3) a testing on our DECADE integrarion
    and 4) an application performance analysis from the test.</p>"
