abstract:
- language: en
  script: Latn
  content: <p>This document updates the "draft-ke-ccamp-gmpls-odu0-00.txt".  It describes
    the extensions of GMPLS signaling to control Optical Transport Networks (OTN)
    including ODU0, ODU1, ODU2, ODU2e, ODU3, ODU3e1, ODU3e2, ODU4 and ODUflex.  It
    also covers the interworking of control plane between pre-G.709 controlling and
    G.709 Amendment3 controlling.</p>
