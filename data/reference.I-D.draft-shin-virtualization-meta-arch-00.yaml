abstract:
- language: en
  script: Latn
  content: "<p>The today's Internet architecture is under serious reconsideration
    and people started thinking about alternatives.  Redefining Internet architecture
    requires many challenged works and a lot of new heterogeneous architectures suited
    to the future of the Internet would be considered.  It is necessary to support
    a variety of the new different architectures to accommodate the heterogeneity
    of Future Internet.  So, a common means should be provided to accommodate the
    new heterogeneous architectures.  This document presents Meta- Architecture to
    accommodate heterogeneous and diverse multiple network architecture and user services,
    for example, heterogeneous wireless, mobile, sensor, vehicular and/or ad-hoc architectures
    and services.</p>"
