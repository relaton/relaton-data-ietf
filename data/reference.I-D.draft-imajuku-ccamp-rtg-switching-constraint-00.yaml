abstract:
- language: en
  script: Latn
  content: "<p>This document proposes routing extensions in support of carrying switching
    constraint information in corresponding link state information for Generalized
    Multi-Protocol Label Switching (GMPLS). With the proposed extension, GMPLS routing
    protocols can handle the network elements with some blocking constraints.</p>"
