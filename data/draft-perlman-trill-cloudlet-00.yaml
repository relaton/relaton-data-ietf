abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft addresses the problems of nickname exhaustion, size of
       endnode learning table in access RBs, and the size of the core TRILL
       network.  It does this by creating an invisible level of hierarchy at
       the edge that we refer to as a "cloudlet".</p>
