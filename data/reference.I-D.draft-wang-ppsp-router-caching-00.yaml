abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a practical work for accelerating the delivery
    of streaming media based on router caching, which was proposed by [2]. In this
    document, it introduces some key problems in router caching scheme for video streaming.
    Then it gives a brief introduction on this scheme and especially discusses the
    streaming protocol and cooperative router caching protocol in detail.</p>"
