abstract:
- language: en
  script: Latn
  content: "<p>This document is intended to illustrate and remediate the impedance
    mismatch of terms related to remote attestation procedures used in different domains
    today.  New terms defined by this document provide a consolidated basis to support
    future work on attestation procedures in the IETF and beyond.</p>"
