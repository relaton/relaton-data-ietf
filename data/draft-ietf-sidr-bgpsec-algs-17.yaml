abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the algorithms, algorithm parameters, asymmetric
    key formats, asymmetric key size and signature format used in BGPsec (Border Gateway
    Protocol Security). This document updates the Profile for Algorithms and Key Sizes
    for Use in the Resource Public Key Infrastructure (RFC 7935). This document also
    includes example BGPsec Update messages as well as the private keys used to generate
    the messages and the certificates necessary to validate those signatures.</p>"
