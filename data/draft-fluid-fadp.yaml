abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Fluid Agentic DeFi Protocol (FADP), version\n   1.0.  FADP is an application-layer protocol layered atop HTTP that\n   enables autonomous AI agents to pay for access to web resources using\n   on-chain cryptocurrency transfers, with cryptographic proof of\n   payment embedded directly in HTTP headers.\n\n   FADP extends HTTP 402 (Payment Required) with two new header fields:\n   X-FADP-Required, which a server uses to communicate payment terms to\n   an agent, and X-FADP-Proof, which an agent uses to supply a\n   verifiable on-chain payment receipt.  A nonce-challenge mechanism\n   prevents proof replay.  An optional verification endpoint allows\n   third-party on-chain confirmation without requiring the verifying\n   party to run blockchain infrastructure.\n\n   FADP is designed for agent-to-server and agent-to-agent payment flows\n   operating at sub-dollar granularity (micropayments), where credit-\n   card or OAuth-based billing is impractical.  The reference\n   implementation targets USDC on Base (an Ethereum Layer 2), though the\n   protocol is token- and chain-agnostic.</p>"
