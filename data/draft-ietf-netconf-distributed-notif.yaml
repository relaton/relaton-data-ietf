  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to the YANG notifications subscription
    to allow metrics being published directly from processors on line cards to target
    receivers, while subscription is still maintained at the route processor in a
    distributed forwarding system of a network node.</p>"
  format: text/html
