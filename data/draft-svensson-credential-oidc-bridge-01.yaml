abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for conveying digital credential
    claims via OpenID Connect (OIDC). It specifies how an OpenID Provider (OP) that
    collects credentials from a wallet can expose those claims to Relying Parties
    as standard OIDC claims, enabling existing OIDC deployments to consume digital
    credentials without implementing any wallet-facing presentation protocol. Discussion
    Venues This note is to be removed before publishing as an RFC. Source for this
    draft and an issue tracker can be found at https://github.com/masv3971/rfc_credential_oidc_bridge.</p>"
