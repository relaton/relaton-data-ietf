- language: en
  script: Latn
  content: "<p>This document defines few additional common data types and groupings
    in YANG data modeling language to be imported by modules that model Traffic Engineering
    (TE) configuration and state capabilities. This document updates RFC 8776 with
    a new revision of the module ietf-te-types.</p>"
