abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to the Real-time Transport Control
    Protocol (RTCP) to use unicast feedback to a multicast sender. The proposed extension
    is useful for single-source multicast not available or not desired. In addition,
    it can be applied to any group that might benefit from a sender-controlled summarized
    reporting mechanism.  Ott et al.  Internet Draft - Expires Sept 2009  [page 2]
    \ RTCP with Unicast Feedback</p>"
