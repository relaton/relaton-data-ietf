abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses benefits and issues that arise when allowing RTCP
    packets to be transmitted with reduced size.  The size can be reduced if the rules
    on how to create compound packets outlined in RFC3550 are removed or changed.
    \ Based on that analysis this memo defines certain changes to the rules to allow
    feedback messages to be sent as reduced-size RTCP packets under certain conditions
    when using the RTP AVPF profile (RFC 4585).  This document updates [RFC3550],
    [RFC3711] and [RFC4585].</p>"
