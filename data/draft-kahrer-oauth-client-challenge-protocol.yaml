abstract:
- language: en
  script: Latn
  content: "<p>This document extends the OAuth 2.0 token endpoint error response\n   (RFC 6749) with a new error code that indicates to the client that it\n   must provide additional input for the authorization server to\n   authorize it and accept its request.\n\n   This mechanism enables just-in-time authorization flows in which the\n   authorization server dynamically challenges the client during a\n   request and the client tries to satisfy it.  For example, the\n   authorization server can ask the client mid-flow to provide an\n   assertion, a verifiable presentation, or other proof-of-possession\n   material.</p>"
