abstract:
- language: en
  script: Latn
  content: "<p>In BGP networks, Route Reflectors (RRs) help to simplify IBGP control
    plane provisioning as well as mitigate the session scale challenges associated
    with an IBGP full mesh between border routers. Given these operational benefits,
    RRs are widely deployed in modern BGP network architectures. This document describes
    common RR deployment models, including their respective trade-offs, and provides
    best practice suggestions based on years of industry experience. Operators of
    BGP networks should consider and/or adopt these best practices, as BGP control
    plane stability is critical to overall network stability.</p>"
