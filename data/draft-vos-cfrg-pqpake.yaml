abstract:
- language: en
  script: Latn
  content: "<p>This document describes the CPaceOQUAKE+ protocol, a hybrid asymmetric
    password-authenticated key exchange (aPAKE) that supports mutual authentication
    in a client-server setting secure against quantum-capable attackers. CPaceOQUAKE+
    is composed of two stages — CPace and OQUAKE+ — that run sequentially, with the
    output of CPace feeding as the secret_context into OQUAKE+. OQUAKE+ is an augmented
    variant of OQUAKE that adds password confirmation. This document also describes
    standalone OQUAKE+, a post-quantum aPAKE, and CPaceOQUAKE, the hybrid symmetric
    PAKE composed of the CPace and OQUAKE stages. This document recommends configurations
    for CPaceOQUAKE+.</p>"
