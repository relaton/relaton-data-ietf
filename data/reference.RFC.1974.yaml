abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of the Stac LZS data compression algorithm,
    with single or multiple compression histories, for compressing PPP encapsulated
    packets.  This memo provides information for the Internet community.  This memo
    does not specify an Internet standard of any kind.</p>"
