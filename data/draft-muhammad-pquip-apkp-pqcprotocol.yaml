- language: en
  script: Latn
  content: "<p>The Abdelaziz Pure Key Protocol, a.k.a. APKP, was designed to protect
    systems with pure post-quantum mechanics and transition to full PQC in the future.
    It is used in high-security environments to protect against quantum attacks. This
    doxument replaces and supersedes draft-muhammad-apkp-pqcprotocol and draft-muhammad-ahkp-pqcprotocol.</p>"
