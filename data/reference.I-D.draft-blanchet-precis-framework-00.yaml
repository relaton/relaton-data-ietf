abstract:
- language: en
  script: Latn
  content: "<p>Using Unicode codepoints in protocol strings requires preparation of
    the string.  This document describes the Precis Protocol Framework that prepares
    various classes of strings used in protocol elements. A protocol specification
    chooses a class of strings and then implements the corresponding preparation steps
    described in this document.  This document is based on the IDNAbis approach.  It
    obsoletes the Stringprep algorithm.</p>"
