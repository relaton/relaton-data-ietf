- language: en
  script: Latn
  content: "<p>This document specifies a new Dynamic Host Configuration Protocol for
    IPv6, DHCPv6, option which can be used to exchange information about a DHCPv6
    client's fully-qualified domain name and about responsibility for updating DNS
    RRs related to the client's address assignments.</p>"
