abstract:
- language: en
  script: Latn
  content: "<p>This document presents the source address validation solution for for
    IP based Satellite Access. This mechanism transfers user states through end network
    collaboration to solve the impact of dynamic handover of satellite-ground links
    on native SAVI. This document mainly describes the operations involved in overcoming
    the dynamics of the access link.</p>"
