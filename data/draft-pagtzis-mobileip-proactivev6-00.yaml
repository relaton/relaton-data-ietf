abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a scheme to provide support for proactive mobility
    for IPv6. It encompasses a novel approach for seamless handoff and proactive roaming
    context transfer. The latter establishes a generic method for proactive context
    transfer and manipulation of different classes of context relating to the state
    of IP connectivity for a mobile node.</p>"
