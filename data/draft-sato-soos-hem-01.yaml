abstract:
- language: en
  script: Latn
  content: "<p>AI agents operating autonomously encounter situations where their\n   authorized action space is insufficient for the task at hand, where\n   policy mandates human judgment regardless of agent capability, or\n   where the agent itself assesses that human oversight is required.\n   No existing standard specifies the kernel-level contract that governs\n   what happens in these moments: what triggers escalation, what a human\n   principal may decide, how the system behaves while awaiting that\n   decision, and what happens when the designated human is unreachable.\n\n   This document defines the Human Escalation Mechanism (HEM): a\n   normative protocol in which a governing OS kernel places an agent\n   session into a formally defined HEM_PENDING state, routes a\n   structured escalation request to one or more designated human\n   principals, enforces a prohibition on state transitions until a\n   human decision is received, and processes five defined human decision\n   types. HEM is a first-class kernel session state, not an\n   application-layer confirmation protocol. This document also defines\n   the Policy Rationale Declaration (PRD), which links Cedar policies\n   that route to HEM with machine-readable rationale, and the Decision\n   Rationale Record (DRR), which captures the human principal's\n   reasoning for high-consequence decisions. HEM provides the technical\n   specification for human oversight of agentic AI systems required by\n   EU AI Act Article 14.</p>"
