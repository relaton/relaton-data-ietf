abstract:
- language: en
  script: Latn
  content: "<p>This document defines basic terminology for describing different types
    of carrier-grade Network Address Translation (NAT) behavior when handling Unicast
    UDP, TCP and ICMP.  Developing carrier-grade NATs that meet this set of requirements
    increase transparency of data between carrier networks.</p>"
