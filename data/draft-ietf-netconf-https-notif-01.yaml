- language: en
  script: Latn
  content: "<p>This document defines a YANG data module for configuring HTTPS based
    configured subscription, as defined in Subscribed Notifications (RFC8639). The
    use of HTTPS maximizes transport-level interoperability, while allowing for encoding
    selection from text, e.g. XML or JSON, to binary.</p>"
