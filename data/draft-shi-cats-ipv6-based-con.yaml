  content: "<p>This document describes the scenarios, requirements and technologies\n   for IPv6-based Cloud-oriented Networking.\n\nDiscussion Venues\n\n   This note is to be removed before publishing as an RFC.\n\n   Discussion of this document takes place on the Computing-Aware\n   Traffic Steering Working Group mailing list (cats@ietf.org), which is\n   archived at https://mailarchive.ietf.org/arch/browse/cats/.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/VMatrix1900/draft-cats-ipv6-based-con.</p>"
