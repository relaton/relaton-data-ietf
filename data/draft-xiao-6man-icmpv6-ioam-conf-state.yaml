abstract:
- language: en
  script: Latn
  content: "<p>This document describes the IPv6 Node IOAM Information Query functionality,
    which uses the IPv6 Node Information messages, allowing the IOAM encapsulating
    node to discover the enabled IOAM capabilities of each IOAM transit and decapsulating
    node. This document updates RFCs 4620 and 4884.</p>"
