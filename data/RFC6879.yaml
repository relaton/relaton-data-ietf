abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes events that cause renumbering and describes
    the current renumbering methods. These are described in three categories: those
    applicable during network design, those applicable during preparation for renumbering,
    and those applicable during the renumbering operation.</p>"
