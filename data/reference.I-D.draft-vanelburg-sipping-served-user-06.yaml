abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the SIP P-Served-User P-header.  This header
    field addresses an issue that was found in the 3rd-Generation Partnership Project
    (3GPP) IMS (IP Multimedia Subsystem) between an S-CSCF (Serving Call Session Control
    Function) and an AS (Application Server) on the ISC (IMS Subsystem Service Control)
    interface.  This header field conveys the identity of the served user and the
    session case that applies to this particular communication session and application
    invocation.</p>"
