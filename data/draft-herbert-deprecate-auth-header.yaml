abstract:
- language: en
  script: Latn
  content: "<p>This document deprecates the IP Authentication Header. The motivations
    are that authentication without confidentiality is not compelling, the Authentication
    Header is incompatible with some commonly deployed protocols, and there is likely
    no deployment of Authentication Header.</p>"
