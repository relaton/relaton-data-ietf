abstract:
- language: en
  script: Latn
  content: "<p>The IAOC has responsibility for arranging IETF plenary meeting Venue
    selection and operation.  This document details the IETF's Meeting Venue Selection
    Process from the perspective of its goals, criteria and thought processes.  It
    points to additional process documents on the IAOC Web Site that go into further
    detail and are subject to change with experience.</p>"
