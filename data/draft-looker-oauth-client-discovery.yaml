abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a mechanism for an authorization server to\n   obtain the metadata of a client, including its endpoint locations and\n   capabilities without the need for a registration process.\n\nDiscussion Venues\n\n   This note is to be removed before publishing as an RFC.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/mattrglobal/draft-looker-oauth-client-discovery.</p>"
