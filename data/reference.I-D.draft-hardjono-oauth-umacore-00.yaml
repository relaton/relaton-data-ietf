abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the User-Managed Access (UMA) core protocol.
    \ This protocol provides a method for users to control access to their protected
    resources, residing on any number of host sites, through an authorization manager
    that governs access decisions based on user policy.  This document is an approved
    Report of the User-Managed Access Work Group of the Kantara Initiative.  The User-Managed
    Access Work Group operates under Kantara IPR Policy - Option Patent and Copyright:
    Reciprocal Royalty Free with Opt-Out to Reasonable And Non discriminatory (RAND)
    and the publication of this document is governed by the policies outlined in this
    option.</p>"
