abstract:
- language: en
  script: Latn
  content: "<p>Mobility of an IP-based node affects routing paths, and as a result,
    can have a significant effect on the protocol operation and state management.
    \ This draft discusses the effects mobility can cause to the NSIS protocol suite,
    and how the protocols operate in different scenarios, with mobility management
    protocols.</p>"
