abstract:
- language: en
  script: Latn
  content: |-
    <p>The Agent Transfer Protocol (AGTP) defines a core method vocabulary
       (Tier 1) of twelve intent-based methods covering the most common
       agent operations.  This document defines the Tier 2 Standard Extended
       Method Vocabulary: methods registered in the IANA AGTP Method
       Registry that are available for use in any AGTP implementation but
       are not required for baseline compliance.  Methods are organized into
       six categories reflecting the full operational range of AI agent
       systems: ACQUIRE, COMPUTE, TRANSACT, INTEGRATE, COMMUNICATE, and
       ORCHESTRATE.  This document also specifies the QUOTE method
       referenced in the AGTP core specification for pre-flight resource
       cost estimation.  The six-category taxonomy is aligned with the
       ACTION framework described in [AGENTIC-API].

       All methods defined in this document conform to the Agentic Grammar
       and Interface Specification (AGIS) [AGIS].  Each method satisfies the
       AGIS action-intent semantic class requirement and syntactic rules.
       This document serves as a reference vocabulary of AGIS-conformant
       methods for organizations seeking maximum cross-system
       interoperability.  Organizations requiring domain-specific
       vocabularies not covered here may define their own AGIS-conformant
       methods without IANA registration using the Tier 4 grammar-based
       validation pathway defined in [AGTP].</p>
