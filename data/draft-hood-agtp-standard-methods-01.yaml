abstract:
- language: en
  script: Latn
  content: "<p>The Agent Transfer Protocol (AGTP) defines a core method vocabulary\n   (Tier 1) of twelve intent-based methods covering the most common\n   agent operations.  This document defines the Tier 2 Standard Extended\n   Method Vocabulary: methods registered in the IANA AGTP Method\n   Registry that are available for use in any AGTP implementation but\n   are not required for baseline compliance.  Methods are organized into\n   six categories reflecting the full operational range of AI agent\n   systems: ACQUIRE, COMPUTE, TRANSACT, INTEGRATE, COMMUNICATE, and\n   ORCHESTRATE.  This document also specifies the QUOTE method\n   referenced in the AGTP core specification for pre-flight resource\n   cost estimation.  The six-category taxonomy is aligned with the\n   ACTION framework described in [AGENTIC-API].\n\n   All methods defined in this document conform to the Agentic Grammar\n   and Interface Specification (AGIS) [AGIS].  Each method satisfies the\n   AGIS action-intent semantic class requirement and syntactic rules.\n   This document serves as a reference vocabulary of AGIS-conformant\n   methods for organizations seeking maximum cross-system\n   interoperability.  Organizations requiring domain-specific\n   vocabularies not covered here may define their own AGIS-conformant\n   methods without IANA registration using the Tier 4 grammar-based\n   validation pathway defined in [AGTP].</p>"
