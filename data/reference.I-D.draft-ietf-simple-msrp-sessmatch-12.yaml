abstract:
- language: en
  script: Latn
  content: "<p>This document defines an MSRP extension, Alternative Connection Establishment
    (ACE).  Support of the extension is optional.  MSRP endpoints can implement the
    extension in order to allow MSRP communication in networks where SIP Application
    Layer Gateways (ALGs) anchor the MSRP connection, without the need for the ALGs
    to enable MSRP B2BUA functionality.  The document also defines a Session Description
    Protocol (SDP) [RFC4566] attribute, a=msrp-ace, that can be used by MSRP endpoints
    to indicate support of the ACE extension.</p>"
