abstract:
- language: en
  script: Latn
  content: <p>Sieve defines an email filtering language that can, in principle, plug
    into any point in the processing of an email message.  As defined in the base
    specification, it plugs into mail delivery.  This document defines how Sieve can
    plug into points in the IMAP protocol where messages are created or changed, adding
    the option of user- defined or installation-defined filtering (or, with Sieve
    extensions, features such as notifications).Note  While this document defines
    extensions to IMAP and Sieve, it is the work of the Lemonade Working Group (Enhancements
    to Internet email to support diverse service environments), and discussion of
    it is on the lemonade mailing list at mailto:lemonade@ietf.org.  Subscription
    requests can be sent to mailto:lemonade-request@ietf.org?body=subscribe (send
    an email message with the word "subscribe" in the body).  A WWW archive of back
    messages is available at http://www.ietf.org/mail-archive/web/lemonade/index.html</p>
