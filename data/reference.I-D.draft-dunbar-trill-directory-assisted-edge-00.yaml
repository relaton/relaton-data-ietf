abstract:
- language: en
  script: Latn
  content: "<p>RBridge edge nodes currently learn the mapping between MAC address
    and its corresponding RBridge edge node address by observing the data packets
    traversed through.  This document describes why and how directory assisted RBridge
    edge nodes can improve TRILL network scalability in data center environment.</p>"
