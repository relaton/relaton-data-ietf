abstract:
- language: en
  script: Latn
  content: "<p>This document presents the source address dependent routing from the
    host perspective. Multihomed hosts and hosts with multiple interfaces are considered.
    Different architectures are introduced and with their help, why source address
    selection and next hop resolution in view of source address dependent routing
    is needed is explained. The document concludes with an informative guidelines
    on the different solution approaches.</p>"
