abstract:
- language: en
  script: Latn
  content: <p>This document discusses the use of the Domain Name System (DNS) for
    the storage of E.164 numbers, and for resolving them into URIs that can be used
    for (for example) telephony call setup.  This document also describes how the
    DNS can be used to identify the services associated with an E.164 number.  This
    document obsoletes RFC 3761.  Status of This Memo  This Internet-Draft is submitted
    to IETF in full conformance with the provisions of BCP 78 and BCP 79.  Internet-Drafts
    are working documents of the Internet Engineering Task Force (IETF), its areas,
    and its working groups. Note that other groups may also distribute working documents
