abstract:
- language: en
  script: Latn
  content: "<p>This document describes a solution that adheres to the Computing- Aware
    Traffic Steering (CATS) framework. The solution uses anycast IP addresses as the
    CATS service identifiers and Segment Routing (SR) as the data plane encapsulation
    to achieve computing-aware traffic steering among multiple services instances.</p>"
