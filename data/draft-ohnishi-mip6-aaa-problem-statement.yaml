abstract:
- language: en
  script: Latn
  content: "<p>Mobile IP achieves that Mobile Node(MN) moves from one subnet to another.
    If MN moves across different administrative domains in a commercial network, Mobile
    IPv6 requires AAA's support. This document describes the problem statement to
    use AAA functions in Mobile IPv6.</p>"
