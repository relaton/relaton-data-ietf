abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 5378 to clarify that only IETF Documents
    may contain legal limitations on derivative works. About This Document This note
    is to be removed before publishing as an RFC. Status information for this document
    may be found at https://datatracker.ietf.org/doc/draft-sayre-gendispatch-derivative/.
    Discussion of this document takes place on the ipr-wg Working Group mailing list
    (mailto:ipr-wg@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/ipr-wg/.
    Subscribe at https://www.ietf.org/mailman/listinfo/ipr-wg/.</p>"
