abstract:
- language: en
  script: Latn
  content: "<p>The Web Real Time Communications (WebRTC) family of protocols defines
    mechanism for direct interactive rich communication using audio, video, and data
    between two peers' web browsers.  With in the WebRTC framework, the Session Description
    Protocol (SDP) is used for negotiating session capabilities between the peers.
    \ Such a negotiation happens based on the SDP offer/answer exchange mechanism</p>"
- language: en
  script: Latn
  content: "<p>This document provides an informational reference in describing the
    role of SDP and the offer/answer exchange mechanism for the most common WebRTC
    use cases.</p>"
- language: en
  script: Latn
  content: "<p>This document makes no changes to the SDP offer/answer exchange mechanism.</p>"
