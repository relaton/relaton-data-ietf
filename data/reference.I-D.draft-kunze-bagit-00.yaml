abstract:
- language: en
  script: Latn
  content: <p>This document specifies BagIt, a hierarchical file package format for
    the exchange of generalized digital content.  A "bag" has just enough structure
    to safely enclose a brief "tag" and a payload but does not require any knowledge
    of the payload's internal semantics.  This BagIt format should be suitable for
    disk-based or network-based file package transfer.  One important use case is
    the possibility of eventual safe return of a received bag.  Tag information consists
    of a small number of top-level reserved file names, checksums for transfer validation,
    and optional small metadata blocks.</p>
