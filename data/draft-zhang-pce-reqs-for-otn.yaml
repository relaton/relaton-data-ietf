abstract:
- language: en
  script: Latn
  content: "<p>This document describes specific requirements for applying Path Computation
    Element (PCE) in Optical Transport Networks (OTN). Lightpath provisioning in OTN
    needs the pre-consideration of the Optical Data Unit (ODUk) cross connection because
    of the additional optical impairments constraints on the Optical Channel (OCh)
    lightpath available for use.</p>"
