abstract:
- language: en
  script: Latn
  content: "<p>DHCPv6 is a protocol that is used to provide addressing and configuration
    information to IPv6 hosts. This document described the privacy issues associated
    with the use of DHCPv6 by the Internet users. It is intended to be an analysis
    of the present situation and doe not propose any solutions.</p>"
