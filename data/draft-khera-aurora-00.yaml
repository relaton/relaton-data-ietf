abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Agent Unification, Runtime, and
       Operational Responsibility Attestation (AURORA) protocol, a dual-
       layer security framework for the machine-to-machine (M2M) ecosystem.
       The core architectural mandate of this protocol is that an agent
       should be able to prove its authority, scope, and runtime integrity.

       Existing agent protocols enable communication syntax and identity
       propagation; however, they fail to provide a standardized mechanism
       for proving that a network transaction or payload was generated and
       transmitted by a software agent executing within a verified,
       hardware-attested runtime environment, nor do they map clear
       boundaries of principal attribution.  AURORA solves this by unifying
       hardware-enclave-backed Runtime Integrity Attestation with scoped,
       cryptographically bound Authority Delegation.</p>
