abstract:
- language: en
  script: Latn
  content: "<p>A scheme to defend against cache poisoning attacks against the Domain
    Name System (DNS) by predicting the ID and source port number of outgoing queries
    is described in this draft. It proposes a new resource record to provide a mechanism
    to introduce additional entropy into DNS queries.</p>"
