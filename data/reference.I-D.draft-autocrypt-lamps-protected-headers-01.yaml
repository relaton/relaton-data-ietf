abstract:
- language: en
  script: Latn
  content: "<p>This document describes a common strategy to extend the end-to-end
    cryptographic protections provided by PGP/MIME, etc. to protect message headers
    in addition to message bodies.  In addition to protecting the authenticity and
    integrity of headers via signatures, it also describes how to preserve the confidentiality
    of the Subject header.</p>"
