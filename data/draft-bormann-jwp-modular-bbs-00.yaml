abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a digital credential format that uses JSON Web
       Proofs (JWP) as its container format and Blind BBS Signatures as its
       signature scheme combined with a modular framework for attaching
       zero-knowledge sub-proofs to signed but undisclosed attributes that
       allow a Holder to reveal some attributes directly while proving
       predicates such as range or equality over the ones they keeps hidden.
       A credential can additionally be bound to an ECDSA P-256 device key.
       The credential metadata and type model follow SD-JWT VC
       [I-D.ietf-oauth-sd-jwt-vc].</p>
