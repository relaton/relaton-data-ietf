abstract:
- language: en
  script: Latn
  content: |-
    <p>OAuth 2.0 Rich Authorization Requests (RAR) [RFC9396], standardizes
       the exchange and processing of authorization details but does not
       define metadata to describe authorization details types.

       The document addresses a practical interoperability challenge
       regarding metadata of authorization details types, allowing clients
       tp dynamically discover metadata instead of relying on out-of-band
       agreements.  It also standardizes error signaling, in case
       insufficient RAR was provided and offers structured ways of
       remediation.</p>
