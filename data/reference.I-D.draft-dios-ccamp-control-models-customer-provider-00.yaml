abstract:
- language: en
  script: Latn
  content: "<p>Different kinds of relationships can be established among interconnected
    Traffic Engineered Networks.  In particular, this document focuses on the case
    where there is a customer-provider relation between the network domains.  The
    domain interconnection is a policy and administrative boundary.  This informational
    document collects current terminology and provides a taxonomy for the posible
    control plane based operation models.  Each control model defines, on the one
    hand, the level of information that the domain acting as customer receives by
    control plane means from the domain acting as provider and, on the other hand,
    the control model will determine what can be requested from the customer domain
    to the provider domain.</p>"
