abstract:
- language: en
  script: Latn
  content: "<p>This document describes the current practices for dynamically disconnecting
    a user session on the NAS. The protocol uses RADIUS messages to send the disconnect
    request, but unlike RADIUS, the NAS in this case acts as a server and listens
    on a UDP port for requests originating from a client.</p>"
