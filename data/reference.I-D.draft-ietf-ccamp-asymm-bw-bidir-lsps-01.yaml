abstract:
- language: en
  script: Latn
  content: "<p>This document defines a method for the support of GMPLS Asymmetric
    Bandwidth Bidirectional Label Switched Paths (LSPs).  The presented approach is
    applicable to any switching technology and builds on the original RSVP model for
    the transport of traffic related parameters. The procedures described in this
    document are experimental.</p>"
