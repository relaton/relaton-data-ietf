abstract:
- language: en
  script: Latn
  content: "<p>This document describes the architecture for supporting SPIRITS services,
    which are those originating in the PSTN (Public Switched Telephone Network)and
    necessitating the interactions between the PSTN and the Internet. This memo provides
    information for the Internet community.</p>"
