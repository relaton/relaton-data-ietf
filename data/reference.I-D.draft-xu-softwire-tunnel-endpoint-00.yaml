abstract:
- language: en
  script: Latn
  content: "<p>The Softwire Mesh Framework [RFC5565] provides a solution for intra-
    AS softwires, but not inter-AS softwires.  The ability to provide inter-AS softwires
    extends the benefits of softwires to a larger scale.  Indeed, [RFC5565] discusses
    the possibility of inter-AS softwires, but does not provide a solution.  This
    document defines a specific Extended Community attribute called the Tunnel Endpoint
    attribute, which allows for inter-AS softwires.</p>"
