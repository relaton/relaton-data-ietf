- language: en
  script: Latn
  content: "<p>In advanced filtering rule sets, it is useful to keep state or con­
    figuration details across rules. This extension adds an action to store data in
    variables, an action to retrieve the current time, changes the interpolation of
    strings, and supplies a new test so that the value of a string can be examined.</p>"
