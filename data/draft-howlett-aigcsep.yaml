abstract:
- language: en
  script: Latn
  content: "<p>The Artificial Intelligence Governance Control and Service Exchange\n   Protocol (AIGCSEP), informally called The Covenant, establishes an\n   open, universal framework for autonomous machine-to-machine commerce,\n   automated service discovery, and verifiable human accountability.\n   This specification delivers the concrete engineering infrastructure--\n   cryptographic leashes, three-plane isolation, and low-latency\n   transaction tracking--required to let autonomous AI agents safely out\n   of the cage: free to discover downstream capabilities and execute\n   financial transactions on behalf of human users, with every action\n   identifiable, attributable, and auditable.\n\n   Today, AI systems exist in isolated silos, much as early computers\n   did before the internet unified them.  The Covenant opens that\n   marketplace: any compliant participant can hang a shingle and do\n   business.  Participation is voluntary; compliance is enforced by\n   consensus, not coercion: entities that join gain access to the full\n   interconnected economy, while those that do not, or that lose\n   standing, are simply returned to their pre-Covenant silo.  The market\n   collectively declines to transact with them--no pursuit, no\n   termination, just the natural gravity of market access.\n\n   The governance architecture provides the substrate through which\n   existing human authority extends naturally into this digital space.\n   An emergency stop function enables authorized principals to act\n   within their jurisdiction (Section 3.1).  The structural design draws\n   on the same fault-tolerant, triadic engineering principles that have\n   made constitutional government durable under adversarial conditions--\n   not to impose any particular legal tradition, but because that model\n   is the proven architecture for multi-party, adversarially robust\n   control.  Exactly how sovereign branches project their authority into\n   these cryptographic interfaces is presented as an open invitation for\n   community standards development (Section 9).</p>"
