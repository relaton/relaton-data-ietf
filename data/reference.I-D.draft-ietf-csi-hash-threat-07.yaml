abstract:
- language: en
  script: Latn
  content: "<p>This document analysis the use of hashes in SEND, possible threats
    and the impact of recent attacks on hash functions used by SEND. Current SEND
    specification [rfc3971] uses the SHA-1 [sha-1] hash algorithm and X.509 certificates
    [rfc5280] and does not provide support for the hash algorithm agility.  The purpose
    of the document is to provide analysis of possible hash threats and to decide
    how to encode the hash agility support in SEND.</p>"
