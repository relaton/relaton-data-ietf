abstract:
- language: en
  script: Latn
  content: "<p>464XLAT ([RFC6877]) defines an architecture for providing IPv4 connectivity
    across an IPv6-only network. The solution contains two key elements: provider-side
    translator (PLAT) and customer-side translator (CLAT). This document provides
    recommendations on when a node shall enable or disable CLAT.</p>"
