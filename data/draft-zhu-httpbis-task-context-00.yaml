abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Task-Context HTTP field for propagating task
    execution context from an authorized workflow worker to downstream HTTP services.
    The field carries a compact, base64url- encoded JSON object that identifies the
    authorization mode, workflow type, and either task-based requestor and approver
    context or role- based execution context. The field is not a bearer credential
    and does not replace HTTP client authentication, service-to-service authorization,
    or resource-local policy checks. Its purpose is to let downstream services correlate
    requests with workflow task context and make service-local authorization and audit
    decisions using that context.</p>"
