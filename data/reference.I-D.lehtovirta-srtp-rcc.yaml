abstract:
- language: en
  script: Latn
  content: "<p>This document defines an integrity transform for SRTP [RFC3711], which
    allows the roll-over counter (ROC) to be transmitted in SRTP packets as part of
    the authentication tag. The need for sending the ROC in SRTP packets arises in
    situations where the receiver joins an ongoing SRTP session, and needs to quickly
    and robustly synchronize. The mechanism also enhances SRTP operation in cases
    where there is a risk of loosing sender-receiver synchronization.</p>"
