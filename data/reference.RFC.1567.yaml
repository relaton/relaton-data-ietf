abstract:
- language: en
  script: Latn
  content: "<p>This document defines a portion of the Management Information Base
    (MIB).  It defines the MIB for monitoring Directory System Agents (DSA), a component
    of the OSI Directory. This MIB will be used in conjunction with the APPLICATION-MIB
    for monitoring DSAs. [STANDARDS-TRACK]</p>"
