abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an architecture for the storage and retrieval of
    the digital representations for books, journals, photographic images, etc., which
    are collected in a large organized digital library.  This memo provides information
    for the Internet community.  This memo does not specify an Internet standard of
    any kind.</p>"
