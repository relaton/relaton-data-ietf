abstract:
- language: en
  script: Latn
  content: "<p>Feature referral allows for an application to make a high level\nrequest to a User Agent to perform an action or \"feature\", and let\nthe the User Agent actually execute the feature as it sees fit.\nFeature referral uses the SIP REFER method with a Refer-To header\nfield containing a URN.</p>"
