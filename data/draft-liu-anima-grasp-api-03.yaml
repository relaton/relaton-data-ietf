abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the application programming interface (API)
       of the Generic Autonomic Signaling Protocol (GRASP).  The API is used
       for Autonomic Service Agents (ASA) calling the GRASP protocol module
       to exchange autonomic network messages with other ASAs.</p>
