abstract:
- language: en
  script: Latn
  content: "<p>This document provides new cryptographic algorithms to be used with
    HIP.  The Edwards Elliptic Curve and the Keccak sponge functions are the main
    focus.  The HIP parameters and processing instructions impacted by these algorithms
    are defined.</p>"
