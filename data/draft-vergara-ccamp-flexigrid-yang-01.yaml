abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG model for managing flexi-grid DWDM Networks.
    The model described in this document is composed of two submodels: one to define
    an flex-grid traffic engineering database, and other one to describe the flex-grid
    paths or media channels.</p>"
