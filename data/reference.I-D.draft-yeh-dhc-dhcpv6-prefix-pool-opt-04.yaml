abstract:
- language: en
  script: Latn
  content: "<p>The Prefix Pool option provides an automatic mechanism based on the
    DHCPv6-PD, allowing the DHCPv6 server to notify the DHCPv6 relay agent implemented
    only on the Provider Edge (PE) router about the information of prefix pools.  The
    information of prefix pools can be used to enforce IPv6 route aggregation on the
    PE router by adding or removing the aggregated routes per the status of the prefix
    pools. The advertising of the aggregated routes in the routing protocol enabled
    on the network-facing interface of PE router will dramatically decreases the number
    of the routes entries in the ISP network.</p>"
