abstract:
- language: en
  script: Latn
  content: "<p>When a DNS server filters a query, the response conveys no detailed
    explanation of why that query was blocked, leading thus to end-user confusion.
    A solution is needed to enhance the user experience. This document defines a method
    to return an URI that explains the reason why a DNS query was filtered.</p>"
