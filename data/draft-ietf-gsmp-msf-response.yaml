- language: en
  script: Latn
  content: "<p>This document is the IETF GSMP Working Group response to 'Service Control
    Interface Requirements' submitted by the Multiservice Switching Forum Switch Control
    Working Group as &lt;draft-mceachern- gsmp-scireq-00.txt&gt;. This document compares
    the capabilities of the GSMPv3 against the MSF SCI requirements. It also invites
    contributions from individuals of MSF on meeting any unresolved requirements.</p>"
