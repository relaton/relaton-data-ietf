abstract:
- language: en
  script: Latn
  content: "<p>This memo utilizes IPPM metrics that are applicable to both complete
    paths and sub-paths, and defines relationships to compose a complete path metric
    from the sub-path metrics with some accuracy w.r.t. the actual metrics. This is
    called Spatial Composition in RFC 2330. The memo refers to the Framework for Metric
    Composition, and provides background and motivation for combining metrics to derive
    others. The descriptions of several composed metrics and statistics follow.</p>"
