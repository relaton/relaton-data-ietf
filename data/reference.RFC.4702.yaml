abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Dynamic Host Configuration Protocol for IPv4
    (DHCPv4) option that can be used to exchange information about a DHCPv4 client's
    fully qualified domain name and about responsibility for updating the DNS RR related
    to the client's address assignment.  [STANDARDS-TRACK]</p>"
