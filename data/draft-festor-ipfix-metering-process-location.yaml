- language: en
  script: Latn
  content: "<p>This document defines a set of Information Elements for the IP Flow
    Information Export (IPFIX) protocol for exporting location information of any
    device (both fixed and mobile) that acts as an IPFIX Flow Exporter. The specified
    Information Elements support both geospatial and civic location data.</p>"
