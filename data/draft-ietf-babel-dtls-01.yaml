abstract:
- language: en
  script: Latn
  content: "<p>The Babel Routing Protocol does not contain any means to authenticate
    neighbours or protect messages sent between them. This documents describes a mechanism
    to ensure these properties, using Datagram Transport Layer Security (DTLS). This
    document updates RFC 6126bis.</p>"
