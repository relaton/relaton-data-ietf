abstract:
- language: en
  script: Latn
  content: "<p>This document describes optional extensions to Simple Two-way Active
    Measurement Protocol (STAMP) that enable measurement of performance metrics, in
    addition to ones supported by the STAMP base specification. The document also
    defines a STAMP Test Session Identifier and thus updates RFC 8762.</p>"
