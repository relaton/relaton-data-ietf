abstract:
- language: en
  script: Latn
  content: "<p>With (U)SIM support, PCP authentication could leverage the credentials
    stored in (U)SIM.  The document details PCP authentication considerations based
    on (U)SIM support.  The authentication procedures in EAP and GBA framework have
    been specifically elaborated.  In order to complete the process, new code and
    option are also proposed.</p>"
