abstract:
- language: en
  script: Latn
  content: "<p>This document describes a keyed-MD5 transform to be used in conjunction
    with the IP Authentication Header [RFC-1826]. The particular transform is based
    on [HMAC-MD5].  An option is also specified to guard against replay attacks.  [STANDARDS-TRACK]</p>"
