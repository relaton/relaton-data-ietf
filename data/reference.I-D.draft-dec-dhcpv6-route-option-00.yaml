abstract:
- language: en
  script: Latn
  content: "<p>This document describes the DHCPv6 Route Option for communicating IPv6
    routes to a DHCP client.  This improves the ability of an operator to influence
    the a client host to pick an appropriate route to a destination when the client
    is multi-homed or where other means of route configuration may be impractical.</p>"
