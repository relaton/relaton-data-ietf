- language: en
  script: Latn
  content: "<p>This document specifies a YANG data model for the Performance Management
    (PM) Collection function requirements defined in ITU-T G.7710, which processes
    raw performance data measured at a network node and delivers the resulting data
    to clients using the IETF push- based streaming model.</p>"
