abstract:
- language: en
  script: Latn
  content: "<p>This document presents a transport protocol-Labelcast, especially for
    IPTV data transmission.  Labelcast has the functions of point-to- multipoint distribution
    and video quality monitoring.  This document describes why Labelcast protocol
    is needed in IPTV service.  The header format is defined, and the processing requirements
    of the protocol are specified.  Impact on protocol stack is considered in this
    document Labelcast is a protocol intended for IPTV data distribution and can be
    deployed in an incremental manner.</p>"
