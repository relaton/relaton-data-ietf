abstract:
- language: en
  script: Latn
  content: "<p>This document discusses potential future extensions on the current
    work plan of recently approved WG MultiMob (Multicast Mobility). MultiMob charter
    explicitly states that scope of work will be limited to mobility protocols Proxy
    Mobile IPv6, and multicast group management in terms of IGMPv3/MLDv2 protocols.
    \ Furthermore only listener mobility will be dealt with and any modification to
    these existing protocols and to multicast routing protocols are out of scope.</p>"
