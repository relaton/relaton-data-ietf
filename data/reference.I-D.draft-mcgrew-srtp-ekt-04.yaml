abstract:
- language: en
  script: Latn
  content: "<p>SRTP Encrypted Key Transport (EKT) is an extension to SRTP that provides
    for the secure transport of SRTP master keys, Rollover Counters, and other information,
    within SRTCP.  This facility enables SRTP to work for decentralized conferences
    with minimal control, and to handle situations caused by SIP forking and early
    media.</p>"
