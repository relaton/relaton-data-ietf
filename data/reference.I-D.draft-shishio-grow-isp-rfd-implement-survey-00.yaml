abstract:
- language: en
  script: Latn
  content: "<p>Route Flap Damping RFC2439 is a mecanism for BGProute improve the stability
    and reduce the load of CPU of the core routers.  But it has side-effect,so RIPE
    has not recommended use of Route Flap Damping on RIPE-378 since May 2006.  On
    the other hand,there are some reserch reports to improve RFC2439 such as draft-ymbk-rfd-usable.
    \ This documentation describes the survey of current service provider Route Flap
    Damping implementation.</p>"
