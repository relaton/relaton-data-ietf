abstract:
- language: en
  script: Latn
  content: "<p>This document specifies additional ways for discovering and emitting
    Manufacturer Usage Descriptions (MUD), especially in constrained environments,
    utilizing the Constrained Application Protocol (CoAP), CoRE Resource Discovery,
    and CBOR Web Tokens. About This Document This note is to be removed before publishing
    as an RFC. Status information for this document may be found at https://datatracker.ietf.org/doc/draft-romann-mud-constrained/.
    Source for this draft and an issue tracker can be found at https://github.com/namib-project/draft-coap-mud.</p>"
