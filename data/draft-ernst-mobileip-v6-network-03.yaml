abstract:
- language: en
  script: Latn
  content: "<p>This draft addresses the problems of routing datagrams to nodes located
    behind the mobile router (MR) that connects a mobile network (MONET) to the Internet,
    in IPv6. Mobile IPv6 [MIPv6], the solution to support host mobility, is unable
    to support an entire network that changes its point of attachment.</p>"
