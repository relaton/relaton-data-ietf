abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this document is to specify extensions to ANCP (Access
    Node Control Protocol) (RFC6320) to support PON as described in RFC6934 and some
    other DSL Technologies including G.fast.  This document updates RFC6320 by modifications
    to terminologies, flows and specifying new TLV types.</p>"
