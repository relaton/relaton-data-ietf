abstract:
- language: en
  script: Latn
  content: "<p>This document describes how link metrics may be added, in a relatively
    straightforward manner, to the specification of OLSRv2, in order to allow routing
    by other than minimum hop count routes. In addition to metric signaling and use,
    the most significant change is a separation of the routing and flooding functions
    of MPRs.</p>"
