abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies the 'news' and 'nntp' Uniform Resource Identifier
    (URI) schemes that were originally defined in RFC 1738. The purpose of this document
    is to allow RFC 1738 to be made obsolete while keeping the information about these
    schemes on standards track.Editorial note In the collected ABNF (Appendix A) the
    NEWS in RFC NEWS should be replaced by the RFC number for [I-D.ietf-usefor-usefor],
    and the ABNF in RFC ABNF should be replaced by the RFC number for [I-D.crocker-rfc4234bis].
    In Section 8 RFCXXXX is a placeholder for this memo. This editorial note and the
    document history (Appendix C) should be removed before publication.</p>"
