abstract:
- language: en
  script: Latn
  content: "<p>It is highly desirable for VPN customers to be able to establish their
    MPLS TE LSPs in the context of a BGP/MPLS IP-VPN. In such a scenario, it is necessary
    that RSVP control messages, such as Path messages and Resv messages, are appropriately
    handled by the PE routers. This document defines new object types in SESSION,
    SENDER_TEMPLATE and FILTERSPEC object to establish a customer MPLS TE LSP in the
    context of BGP/IP-VPNs and describes a procedure of RSVP control messages including
    the new object types.</p>"
