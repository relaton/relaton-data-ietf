abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a set of extensions to PCEP to support PCE-
    initiated IP Tunnel to satisfy the requirement which is introduced in [I-D.li-spring-tunnel-segment].
    The extensions include the setup, maintenance and teardown of PCE-initiated IP
    Tunnels, without the need for local configuration on the PCC.</p>"
