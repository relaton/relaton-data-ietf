abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Agent Directory (AD), a service where agents
    register their identity, capabilities, and reachable endpoints and where clients
    discover them by capability. The AD adapts the Constrained RESTful Environments
    (CoRE) Resource Directory (RFC 9176) from constrained IoT devices to software
    agents, reusing its registration, lookup, and soft-state lifecycle model. The
    AD uses HTTP and JSON. MCP and A2A define how agents interact; this document defines
    how they are found.</p>"
