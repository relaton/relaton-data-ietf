abstract:
- language: en
  script: Latn
  content: "<p>This draft specifies the mapping rules for translating YANG data models
    into Document Schema Definition Languages (DSDL), a coordinated set of XML schema
    languages standardized as ISO 19757. The following DSDL schema languages are used
    by the mapping: RELAX NG, Schematron and DSRL.  The mapping takes one or more
    YANG modules and produces a set of DSDL schemas for a selected target document
    type - datastore content, NETCONF PDU etc.  Procedures for schema- based validation
    of such documents are also discussed.</p>"
