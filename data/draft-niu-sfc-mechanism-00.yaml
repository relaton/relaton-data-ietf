abstract:
- language: en
  script: Latn
  content: "<p>This document describes a service chaining mechanism in the forwarding
    plane, by which data packets can be forwarded to multiple Service Processing Entities
    and processed by them in a preset order. This document also describes a lightweight
    service chaining header to facilitate packet forwarding in service function chains.</p>"
