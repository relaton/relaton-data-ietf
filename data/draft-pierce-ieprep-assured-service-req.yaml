- language: en
  script: Latn
  content: "<p>Assured Service refers to the set of capabilities used to ensure \nthat
    critical communications are setup and remain connected. This \nmemo describes
    the requirements for such capabilities in support of \nspecific networks such
    as those used by government agencies, but \nthey could also be applied in commercial
    environments.</p>"
