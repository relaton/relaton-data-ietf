title:
- language: en
  script: Latn
  content: Triggering ND Address Resolution on Receiving DAD-NS
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-halpern-6man-nd-pre-resolve-addr-00
docidentifier:
- content: draft-halpern-6man-nd-pre-resolve-addr
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2014-01-10'
abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes a new optional event to trigger address\n   resolution using IPv6 Neighbor Discovery.  This helps optimize router\n   performance, and can help mitigate certain potential ND-related\n   denial-of-service attacks.  Upon receiving a DAD-NS message, the\n   neighbor solicitation message used to detect duplicate addresses, if\n   the target address encoded in the DAD-NS is not a duplicate address,\n   the receiving device responds by triggering address resolution for\n   the target address in the DAD-NS, in preparation for expectant future\n   communication with the sending device.</p>"
