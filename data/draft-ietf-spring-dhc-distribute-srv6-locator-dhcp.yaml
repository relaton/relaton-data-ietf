abstract:
- language: en
  script: Latn
  content: "<p>In an SRv6 network, each SRv6 Segment Endpoint Node must be assigned
    an SRv6 Locator, and segment identifiers (SIDs) are generated within the address
    space of this SRv6 Locator. This document describes a method for assigning SRv6
    Locators to SRv6 Segment Endpoint Nodes through Dynamic Host Configuration Protocol
    for IPv6 (DHCPv6).</p>"
