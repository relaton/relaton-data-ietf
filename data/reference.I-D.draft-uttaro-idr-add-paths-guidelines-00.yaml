abstract:
- language: en
  script: Latn
  content: "<p>ADD-PATH is a BGP enhancement that allows a BGP router to advertise
    multiple distinct paths for the same prefix/NLRI. This provides a number of potential
    benefits, including reduced routing churn, faster convergence, better loadsharing
    and a mechanism for graceful maintenance. This document describes implementation
    and operational best practices for ADD-PATH in order to facilitate the introduction
    of ADD-PATH to existing networks and to ensure interoperability.</p>"
