abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 6153 by correcting IANA allocations made
    for DHCPv4 and DHCPv6 options for Access Network Discovery and Selection Function
    (ANDSF) Discovery.  This document assigns a code for DHCPv6 option for ANDSF and
    withdraws an already assigned DHCPv4 option code.</p>"
