abstract:
- language: en
  script: Latn
  content: "<p>The current specification of DTLS over SCTP is outdated and does not
    fulfill the requirements of 3GPP. This Internet Draft documents the requirements
    of 3GPP for securing SCTP based communications using DTLS. It is a result of a
    design team in TSVWG and reflects the current of its work. Therefore, this document
    is expected to change over time.</p>"
