abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a mechanism to define a unique Message key
    for a YANG to Message Broker integration and a topic addressing scheme based on
    YANG-Push subscription type and YANG Schema Node Identifier. This enables YANG
    data consumption of a subset of subscribed YANG data, either per specific YANG
    data node, identifier or telemetry message type, by indexing and organizing in
    Message Broker topics. It helps to index the information by using data taxonomy
    and organizes data in partitions and shards of Message Brokers and time series
    databases.</p>"
