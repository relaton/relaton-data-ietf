- language: en
  script: Latn
  content: "<p>This document describes an architecture that satisfies the requirements
    for Human Friendly Identifiers as specified in [HFI-REQ]. Specifically it describes
    the URI scheme 'go' as an HFI encoding mechanism, a protocol for the resolution
    of HFIs, and a scalable and open infrastructure for resolving those HFIs.</p>"
