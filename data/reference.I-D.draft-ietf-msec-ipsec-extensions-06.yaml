abstract:
- language: en
  script: Latn
  content: "<p>The Security Architecture for the Internet Protocol [RFC4301] describes
    security services for traffic at the IP layer. That architecture primarily defines
    services for Internet Protocol (IP) unicast packets. It also defines services
    for manually keyed Security Associations (SAs) matching IP multicast traffic selectors.
    This document further defines the security services for manually and dynamically
    keyed SAs matching IP multicast traffic selectors within that Security Architecture.</p>"
