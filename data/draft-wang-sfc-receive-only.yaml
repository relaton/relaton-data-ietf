abstract:
- language: en
  script: Latn
  content: "<p>A category of services such as Intrusion Detection Service and Packet\n   Capture operates in \"receive-only\" mode.  They are \"packet sinks\"\n   which consume all packets sent to them.  This document describes the\n   proposals for such service to be part of the Service Function\n   Chaining framework.</p>"
