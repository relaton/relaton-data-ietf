abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification provides a mechanism for an access-controlled HTTP
       resource to indicate which OAuth authorization server it uses.  This
       allows the use of OAuth 2.0 authorization by clients that do not have
       prior knowledge about the resource server's configuration.</p>
