abstract:
- language: en
  script: Latn
  content: <p>This document defines a new ORF-type, called the "Covering Prefixes
    ORF (CP-ORF)".  The CP-ORF is applicable in the context of a Virtual Hub-and-Spoke
    VPN.  It may also be applicable in other BGP/MPLS VPN environments.</p>
