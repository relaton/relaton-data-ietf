abstract:
- language: en
  script: Latn
  content: "<p>The More Instant Messaging Interoperability (MIMI) working group is
    chartered to use Messaging Layer Security (MLS) [RFC9420] for its encryption/security
    layers. This document implements the architecture described by [I-D.barnes-mimi-arch],
    detailing the components required to achieve MLS-secured messaging interoperability.</p>"
