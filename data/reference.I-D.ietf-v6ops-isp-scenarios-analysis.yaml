abstract:
- language: en
  script: Latn
  content: "<p>This document first describes different scenarios for the introduction
    of IPv6 into an existing IPv4 ISP network without disrupting the IPv4 service.
    Then, this document analyses these scenarios and evaluates the suitability of
    the already defined transition mechanisms in this context. Known challenges are
    also identified.</p>"
