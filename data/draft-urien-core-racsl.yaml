abstract:
- language: en
  script: Latn
  content: "<p>The Remote APDU Call Lite protocol (RACSL) is a lightweight version\n   of the Remote APDU Call Secure protocol (RACS). RACS is designed for\n   Grids of Secure Elements (GoSE), where servers host Secure Elements\n   (SEs), i.e., tamper-resistant chips providing secure storage and\n   cryptographic capabilities. It supports commands for GoSE inventory\n   and data exchange with secure elements. RACSL targets environments\n   hosting a limited number of secure element-typically one-within an\n   IoT device managed by a microcontroller. It provides commands for\n   data exchange with secure elements, in particular for managing their\n   embedded applications. These commands are transported over TLS 1.3\n   pre-shared key (PSK) sessions, which MAY be secured using a TLS\n   Identity Module (TLS-IM) application hosted within a secure element.\n   RACSL can be used to update TLS-IM applications or to remotely\n   access computing and storage resources hosted in secure elements.</p>"
