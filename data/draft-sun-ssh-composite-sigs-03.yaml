abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the use of PQ/T composite signatures for the
       Secure Shell (SSH) protocol.  The composite signatures described
       combine ML-DSA as the post-quantum part and the elliptic curve
       signature schemes ECDSA, Ed25519 and Ed448 as the traditional part.</p>
