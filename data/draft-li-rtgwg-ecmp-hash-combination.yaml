abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a combined hash mechanism for load balancing\n   in Equal-Cost Multi-Path (ECMP) and Link Aggregation Group (LAG)\n   environments.  When processing tunneled traffic, traditional hash\n   methods that operate on either outer or inner packet fields may\n   result in uneven traffic distribution (polarization).  This\n   specification defines a method to extend effective hash entropy by\n   combining multiple independently computed hash values, enabling\n   network devices to consider multi-layer packet information for path\n   selection, thereby improving traffic distribution uniformity.  This\n   mechanism is compatible with existing hash computation architectures\n   and does not require packet format modifications or new protocol\n   field definitions.</p>"
