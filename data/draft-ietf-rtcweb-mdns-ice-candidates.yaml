title:
- language: en
  script: Latn
  content: Using Multicast DNS to protect privacy when exposing ICE candidates
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-rtcweb-mdns-ice-candidates-04
docidentifier:
- content: draft-ietf-rtcweb-mdns-ice-candidates
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2019-10-16'
abstract:
- language: en
  script: Latn
  content: "<p>WebRTC applications collect ICE candidates as part of the process of\n   creating peer-to-peer connections.  To maximize the probability of a\n   direct peer-to-peer connection, client private IP addresses are\n   included in this candidate collection.  However, disclosure of these\n   addresses has privacy implications.  This document describes a way to\n   share local IP addresses with other clients while preserving client\n   privacy.  This is achieved by concealing IP addresses with\n   dynamically generated Multicast DNS (mDNS) names.</p>"
