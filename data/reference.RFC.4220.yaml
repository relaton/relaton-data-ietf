abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes managed objects for modeling TE links as described in the Link Bundling
    in MPLS Traffic Engineering (TE) document.  [STANDARDS-TRACK]</p>"
