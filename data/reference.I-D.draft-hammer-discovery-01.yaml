abstract:
- language: en
  script: Latn
  content: "<p>This memo describes an HTTP-based process for obtaining information
    about a resource identified by a URI.  The 'information about a resource' - a
    resource descriptor - typically provides machine- readable information that aims
    to assist and enhance the interaction with the resource.  This memo only defines
    the process for locating and obtaining the descriptor, but leaves the descriptor
    format and its interpretation out of scope.</p>"
