abstract:
- language: en
  script: Latn
  content: <p>The current document defines some the "advanced" features of the sockets
    API that are required for applications to take advantage of additional features
    of IPv6.  This memo provides information for the Internet community.  It does
    not specify an Internet standard of any kind.</p>
