abstract:
- language: en
  script: Latn
  content: "<p>This document describes the applicability of RSVP along with the Integrated
    Services protocols and other components of resource reservation and offers guidelines
    for deployment of resource reservation at this time. This memo provides information
    for the Internet community. It does not specify an Internet standard of any kind.</p>"
