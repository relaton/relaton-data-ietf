abstract:
- language: en
  script: Latn
  content: "<p>This document describes a password-based low-infrastructure GSS-API
    mechanism based on the Secure Remote Password protocol (SRP) and the existing
    Simple Public Key Mechanism (SPKM). This mechanism is suitable for establishing
    a secure context between two entities that have established a shared secret as
    per the SRP protocol.</p>"
