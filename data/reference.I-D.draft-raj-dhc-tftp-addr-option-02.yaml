abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a new DHCP option for passing the TFTP Server IP
    address information between the DHCP client and the DHCP server. The option number
    currently in use is 150. This memo documents the current usage of the option in
    agreement with [6] , which declares that any pre-existing usages of option numbers
    in the range 128 - 223 should be documented and the working group will try to
    officially assign those numbers to those options.</p>"
