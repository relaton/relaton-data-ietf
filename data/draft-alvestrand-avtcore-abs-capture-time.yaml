abstract:
- language: en
  script: Latn
  content: "<p>This document describes an RTP header extension that can be used to\n   carry information about the capture time of a video frame / audio\n   sample, and include information that allows the capture time to be\n   estimated by the receiver when the frame may have passed over\n   multiple hops before reaching the receiver.</p>"
