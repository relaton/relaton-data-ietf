- language: en
  script: Latn
  content: "<p>This document describes an RTP header extension that can be used to
    carry information about the capture time of a video frame / audio sample, and
    include information that allows the capture time to be estimated by the receiver
    when the frame may have passed over multiple hops before reaching the receiver.</p>"
