abstract:
- language: en
  script: Latn
  content: "<p>This document provides an initial discussion of Bootstrapping of Remote
    Secure key infrastructures (BRSKI) when the device being bootstrapped speaks CoAP.
    The HTTPS REST methods leveraged by BRSKI are mapped to CoAP methods. Fragmentation
    management of large messages during EST certificate enrollment is addressed.</p>"
