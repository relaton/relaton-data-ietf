abstract:
- language: en
  script: Latn
  content: "<p>LSP-Ping and BFD for MPLS are existing and widely deployment OAM mechanisms
    for MPLS LSPs.  This document describes how LSP-Ping and BFD for MPLS can be used
    to perform OAM on MPLS-TP LSPs.  This document describes extensions to LSP-Ping
    when IP addressing is not in use, in a MPLS-TP deployment scenario.  These extensions
    are also meant to be applicable when it is desirable to avoid the use of IP encapsulation
    for exchanging LSP-Ping OAM messages.  This document also clarifies the use of
    BFD for MPLS-TP LSPs when IP addressing may not be available and/or it may not
    be desirable to encapsulate BFD packets in IP.</p>"
