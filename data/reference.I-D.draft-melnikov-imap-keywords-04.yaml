abstract:
- language: en
  script: Latn
  content: "<p>The aim of this document is to establishe a new IANA registry for IMAP
    keywords and to define a procedure for keyword registration, in order to improve
    interoperability between different IMAP clients.Note  A revised version of this
    draft document will be submitted to the RFC editor as a Proposed Standard for
    the Internet Community.  Discussion and suggestions for improvement are requested,
    and should be sent to morg@ietf.org.</p>"
