- language: en
  script: Latn
  content: "<p>This document will describe how provider’s edge router can reduce the
    over-provisioning of resources and in some cases do away with the range configuration
    so that new sites can be added to an existing VPN topologies without incurring
    configuration changes to other provider’s edge routers in the VPN.</p>"
