schema_version: v1.5.6
formattedref:
  content: draft-ietf-calext-jscalendarbis
title:
- language: en
  script: Latn
  content: 'JSCalendar 2.0: A JSON Representation of Calendar Data'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-calext-jscalendarbis-20
docidentifier:
- content: draft-ietf-calext-jscalendarbis
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-09-14'
abstract:
- language: en
  script: Latn
  content: "<p>This specification defines version \"2.0\" of JSCalendar, a data model\n   and JSON representation of calendar data that can be used for storage\n   and data exchange in a calendaring and scheduling environment.  This\n   document obsoletes RFC 8984, also referred to as version \"1.0\" in\n   this document.  The newly defined version \"2.0\" aims to improve\n   interoperability with existing iCalendar-based systems.  It also\n   aligns its definitions with JSContact, such as the IANA registry\n   policy, validation requirements, and versioning scheme.</p>"
