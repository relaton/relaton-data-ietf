abstract:
- language: en
  script: Latn
  content: "<p>This RFC specifies a standard for the Internet community.  Hosts on
    the Internet that exchange terminal type information within the Telnet protocol
    are expected to adopt and implement this standard. This standard supersedes RFC
    930.  A change is made to permit cycling through a list of possible terminal types
    and selecting the most appropriate</p>"
