abstract:
- language: en
  script: Latn
  content: |-
    <p>Zstandard, or "zstd" (pronounced "zee standard"), is a data
       compression mechanism.  This document describes the mechanism, and
       registers a media type to be used when transporting zstd-compressed
       via Multipurpose Internet Mail Extensions (MIME).</p>
