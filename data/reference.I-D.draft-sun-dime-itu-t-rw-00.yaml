abstract:
- language: en
  script: Latn
  content: "<p>This document describes the need for a new pair of IANA Diameter Command
    Codes and a new vendor-specific Application ID to be used in a vendor-specific
    new application, namely for the ITU-T Rec. Q.3303.3 - Rw interface used to send
    a request/responses for controlling the policy enforcement in a network element,
    as one of the recommendations of the International Telecommunication Union - Telecommunication
    Standardization Sector (ITU-T).</p>"
