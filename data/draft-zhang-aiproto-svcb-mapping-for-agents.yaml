abstract:
- language: en
  script: Latn
  content: "<p>With the continuous introduction of intelligent agent communication\n   and interaction protocols, the current DNS cannot adequately meet the\n   requirements for agent service resolution.  This document defines a\n   new DNS resource record type, AGENT, which is a SVCB-compatible RR\n   type, and specifies the mapping specifications.</p>"
