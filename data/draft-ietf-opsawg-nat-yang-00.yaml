abstract:
- language: en
  script: Latn
  content: "<p>For the sake of network automation and the need for programming Network
    Address Translation (NAT) function in particular, a data model for configuring
    and managing the NAT is essential. This document defines a YANG data model for
    the NAT function. NAT44, NAT64, and NPTv6 are covered in this document.</p>"
