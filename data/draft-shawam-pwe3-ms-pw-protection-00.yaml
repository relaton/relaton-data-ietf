abstract:
- language: en
  script: Latn
  content: "<p>In RFC 6378 'MPLS Transport Profile (MPLS-TP) Linear Protection', as
    well as in the later updates of this RFC, the Protection State Coordiantion (PSC)
    protocol was defined for MPLS LSPs only. This draft extends RFC 6378 to be applicable
    for pseudowires as well.</p>"
