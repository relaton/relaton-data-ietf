abstract:
- language: en
  script: Latn
  content: "<p>This document describes new Connectivity Verification (CV) types for
    using Bi-directional Forwarding Detection (BFD) with Virtual Circuit Connectivity
    Verification (VCCV).  VCCV provides a control channel that is associated with
    a Pseudowire (PW), as well as the corresponding operations and management functions
    such as connectivity verification to be used over that control channel.</p>"
