title:
- language: en
  script: Latn
  content: Reusing Transport Layer Connections in Session Initiation Protocol (SIP)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-jain-dispatch-sip-transport-connection-reuse-00
