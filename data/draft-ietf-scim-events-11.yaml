abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a set of SCIM (System for Cross-domain
       Identity Management, RFC7643 and RFC7644) Security Events using the
       Security Event Token Specification (RFC8417) to enable the
       asynchronous exchange of messages between SCIM Service Providers and
       receivers.  SCIM Security Events are typically used for: asynchronous
       request completion, resource replication, and provisioning co-
       ordination.

       This draft updates Section 5, of RFC7643 defining additional
       attributes for
       urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig schema.
       This draft updates RFC7644 with the optional new Asynchronous SCIM
       Request capability.</p>
