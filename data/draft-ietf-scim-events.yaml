abstract:
- language: en
  script: Latn
  content: <p>This specification defines a set of System for Cross-domain Identity
    Management (SCIM) Security Events using the Security Event Token Specification
    to enable the asynchronous exchange of messages between SCIM Service Providers
    and receivers. This draft updates RFC7643 defining additional attributes for "urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig"
    schema and updates RFC7644 with optional new Asynchronous SCIM Request capability.</p>
  format: text/html
