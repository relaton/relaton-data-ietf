abstract:
- language: en
  script: Latn
  content: "<p>This document proposes updates to the robots.txt standard to\n   accommodate AI-specific crawlers, introducing a syntax for user-agent\n   identification and policy differentiation.  It aims to enhance the\n   management of web content access by AI systems, distinguishing\n   between training and inference activities.</p>"
