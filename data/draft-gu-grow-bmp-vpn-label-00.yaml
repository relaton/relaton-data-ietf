- language: en
  script: Latn
  content: "<p>The BGP Monitoring Protocol (BMP) is designed to monitor BGP running
    status, such as BGP peer relationship establishment and termination and route
    updates. This document provides a method of collecting the VPN label using BMP,
    as well as an implementation example.</p>"
