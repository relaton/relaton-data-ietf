abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a simple extension to LDP-VPLS to optimise Ethernet
    Multicast/Broadcast traffic within a carrier's network. It allows the use of unidirectional
    point-to-multipoint PseudoWires to minimise payload frame duplication on physical
    links.</p>"
