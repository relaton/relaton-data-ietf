abstract:
- language: en
  script: Latn
  content: "<p>DTL (Dyadic Typed Layer) defines a single, minimal primitive: a\n   typed, directed relationship between two agents that the controller\n   of each agent has confirmed, together with the lifecycle of that\n   relationship.  The name describes the primitive: Dyadic (it concerns\n   one pair of parties), Typed (the relationship carries exactly one\n   kind), and Layer (it sits above an identity substrate, not inside\n   it).\n\n   Agent ecosystems have built out several coordination layers: identity\n   (who an agent is), reputation and attestation (what is asserted about\n   an agent), and discovery and messaging (how agents find and talk to\n   each other).  One primitive is comparatively underserved, the\n   relationship: a standing, acknowledged, directed connection between\n   two specific agents, recording that they are related and in what\n   capacity.  No existing standard, to the author's knowledge, provides\n   exactly this primitive in this form.  DTL specifies it and nothing\n   more.  It is normative about the mechanism (a typed, directed, two-\n   party, controller-confirmed edge and its lifecycle) and deliberately\n   silent about substrate, transport, storage, and the open vocabulary\n   of relationship types.  An informative binding to ERC-8004 is\n   provided as the first anchoring substrate.</p>"
