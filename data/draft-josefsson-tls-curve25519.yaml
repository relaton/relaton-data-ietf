- language: en
  script: Latn
  content: "<p>This document specifies the use of Curve25519 for ephemeral key exchange
    in the Transport Layer Security (TLS) protocol, as well as its DTLS variant. It
    updates RFC 5246 (TLS 1.2) and RFC 4492 (Elliptic Curve Cryptography for TLS).</p>"
