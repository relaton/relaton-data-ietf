abstract:
- language: en
  script: Latn
  content: "<p>This document specify the password-based key derivation function scrypt.
    \ The function is used to derive one or more secret keys from a secret string.
    \ It is based on memory-hard functions which offers some added protection against
    attacks using custom hardware.  The document also provide an ASN.1 schema.</p>"
