abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new BGP Opaque Extended Community to carry
    local route flap damping state information in BGP UPDATE messages. The community
    allows BGP speakers to expose the current damping penalty and configuration parameters
    associated with a route for visibility and troubleshooting purposes.</p>"
