abstract:
- language: en
  script: Latn
  content: "<p>The canonical link relation, developed from [RFC5988] which indicates
    relationships between Internet links, specifies the preferred URI from a set of
    identical or vastly similar content accessible on multiple URIs.  Editorial Note
    (To be removed by RFC Editor)  Distribution of this document is unlimited.  Comments
    should be sent to the IETF Apps-Discuss mailing list (see &lt;https://www.ietf.org/mailman/listinfo/apps-discuss&gt;).</p>"
