abstract:
- language: en
  script: Latn
  content: "<p>This specification defines how the Uniform Resource Name namespace
    reserved for GSMA (Global Sstandard for Mobiles Association) identities and its
    sub namespace for the IMEI (International Mobile station Equipment Identity) can
    be used as an instance-id as specified in RFC 5626 [1] and also as used by RFC
    5627 [2].</p>"
