abstract:
- language: en
  script: Latn
  content: "<p>Mobile nodes that require global Internet access must have a way to
    automatically configure globally routable and unique IP addresses that remain
    stable across localized mobility events. This document specifies mechanisms for
    address autoconfiguration (AUTOCONF) and network localized mobility management
    (NETLMM) based on the Dynamic Host Configuration Protocol (DHCP). Solutions for
    both IPv4 and IPv6 are given.</p>"
