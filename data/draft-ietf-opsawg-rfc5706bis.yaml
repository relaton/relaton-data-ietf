id: draftietfopsawgrfc5706bis
schema_version: v1.5.6
formattedref:
  content: draft-ietf-opsawg-rfc5706bis
title:
- language: en
  script: Latn
  content: Guidelines for Considering Operations and Management in IETF Specifications
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-opsawg-rfc5706bis-07
docidentifier:
- content: draft-ietf-opsawg-rfc5706bis
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-09-07'
abstract:
- language: en
  script: Latn
  content: "<p>New Protocols and Protocol Extensions are best designed with due\n   consideration of the functionality needed to operate and manage them.\n   Retrofitting operations and management considerations is suboptimal.\n   The purpose of this document is to provide guidance to authors and\n   reviewers on what operational and management aspects should be\n   addressed when writing documents in the IETF Stream that document a\n   specification for New Protocols or Protocol Extensions or describe\n   their use.\n\n   This document obsoletes RFC 5706, replacing it completely and\n   updating it with new operational and management techniques and\n   mechanisms.  It also updates RFC 2360 to obsolete mandatory MIB\n   creation.  Finally, it introduces a requirement to include an\n   \"Operational Considerations\" section in new RFCs in the IETF Stream\n   that define New Protocols or Protocol Extensions or describe their\n   use (including relevant YANG Models), while providing an escape\n   clause if no new considerations are identified.</p>"
