abstract:
- language: en
  script: Latn
  content: "<p>IPv4 and IPv6 are expected to coexist for a long period.  Currently,
    there are many IPv4/IPv6 transition/coexistence techniques, which can be roughly
    divided into two categories: tunneling and translation. Both tunneling and translation
    have restricted application scopes, and translation has some technical limitations.
    \ To maximize the benifits and reduce the costs, we may need to use both tunneling
    and translation in some scenarios.  Besides, there may be multiple network devices
    capable of performing translation/tunneling along the end-to-end path.  It's important
    to choose the appropriate device(devices) to execute translation/tunneling.  This
    draft brings up the method of choosing the appropriate translation spot to avoid
    the limitations of translation. Furthermore, this draft presents an IPv4-IPv6
    transition/coexistence framework named PET (short for Prefixing, Encapsulation
    and Translation).  PET integrates tunneling and translation to support both traversing
    and IPv4-IPv6 interconnection, and uses tunneling and translation properly to
    constitute communication modes in different scenarios.  When executing translation,
    PET achieves translation spot negotiation through signaling process between PET
    devices.  PET framework covers most network transition scenarios.  It is a generic
    solution framework for IPv4-IPv6 coexistence.</p>"
