abstract:
- language: en
  script: Latn
  content: "<p>This document provides a YANG data model for uCPE management (VYSM)
    and definition of the uCPE equipment. The YANG Model serves as a base framework
    for managing an universal Customer-Premises Equipment (uCPE) subsystem. The model
    can be used by a Network Orchestrator.</p>"
