abstract:
- language: en
  script: Latn
  content: "<p>This document defines the method for transmission of IP Version 6 packets
    over PPP links as well as the Network Control Protocol (NCP) for establishing
    and configuring the IPv6 over PPP. It also specifies the method of forming IPv6
    link-local addresses on PPP links.  [STANDARDS-TRACK]</p>"
