abstract:
- language: en
  script: Latn
  content: "<p>The NETCONF protocol describes the lock and unlock operations that
    (un)lock an entire configuration datastore. In some situations it is needed to
    lock only a part of a configuration datastore. This draft proposes a capability
    based extension to the NETCONF protocol to allow this.</p>"
