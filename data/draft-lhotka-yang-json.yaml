abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines rules for mapping data models expressed in YANG
       to configuration and operational state data encoded as JSON text.  It
       does so by specifying a procedure for translating the subset of YANG-
       compatible XML documents to JSON text, and vice versa.</p>
