  script: Latn
  content: "<p>This document defines the CHILD_PFS_INFO Notify Message Status Type
    Payload for the Internet Key Exchange Protocol Version 2 (IKEv2) to support exchanging
    the policy settings for the Perfect Forward Secrecy (PFS) and which Key Exchange
    (KE) method(s) setting of the initial Child SA that are expected to be used during
    Child SA rekey.</p>"
