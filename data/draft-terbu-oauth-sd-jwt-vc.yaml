- language: en
  script: Latn
  content: "<p>This specification describes data formats as well as validation and
    processing rules to express Verifiable Credentials with JSON payloads based on
    the Selective Disclosure for JWTs (SD-JWT) [I-D.ietf-oauth-selective-disclosure-jwt]
    format. It can be used when there are no selective disclosable claims, too.</p>"
