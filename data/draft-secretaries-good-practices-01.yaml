abstract:
- language: en
  script: Latn
  content: "<p>This document is primarily intended for Working Group Secretaries,
    the role of whom is defined in RFC 2418, but also for Working Group Chairs to
    better apprehend the value of Working Group Secretaries. This document complements
    the succinct description of Working Group Secretaries' role by providing a compilation
    of good practices and some general guidelines regarding the fulfillment of the
    role.</p>"
