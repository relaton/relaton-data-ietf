abstract:
- language: en
  script: Latn
  content: "<p>AI agents are discovered and identified through independent sources
    — registries, name services, DID methods, catalogs. A single source can misrepresent
    an agent by omission (withholding a record it holds) or equivocation (serving
    different answers to different observers); no signature on a served artifact defends
    against either. This document specifies a corroboration procedure: how one source's
    claim about one agent, observed from one network vantage, is classified; how a
    claim is reduced to a comparable view; how claims are diffed into findings with
    deterministic attribution; how legitimate propagation delay is distinguished from
    persistent disagreement; and a signed Corroboration Record emitted on every sweep
    — agreement included — that other evidence formats can bind by digest. The procedure
    is source-, format-, and layer-agnostic, requires no cooperation from or modification
    of any source, and is verifiable from recorded bytes.</p>"
