abstract:
- language: en
  script: Latn
  content: "<p>For placing a call, it is often useful to know the whether a Callee
    is in favorable state or not.  This document defines an optional tag continue
    and a header field Continue which provides this information.  The Continue header
    field is to confirm the session continuity with the Callee after an option for
    session continuity is placed by the Caller.  This functionality is needed to resolve
    the unwillingness of the Callee to receive any call.  An option is given to the
    Callee by the Service Provider or by the Handset Manufacturer to establish this
    requirement.</p>"
