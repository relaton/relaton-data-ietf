abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Segment Routing IPv6-Prefix-SID sub-TLV.
    This new sub-TLV allows to specify which of the prefixes advertised by a node
    are to be used as Segment Routing Identifiers (SID) for the IPv6 data plane.</p>"
