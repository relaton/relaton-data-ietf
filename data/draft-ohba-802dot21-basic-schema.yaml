abstract:
- language: en
  script: Latn
  content: "<p>This document describes an RDF (Resource Description Framework)\nschema defined in IEEE 802.21 as the basic schema for Media-\nIndependent Information Service where the schema uses OWL (Web\nOntology Language) constructs.  This document serves as the\nSpecification required by the IANA to maintain a global registry for\nstoring the RDF schema.\n\nStatus of this Memo\n\nThis Internet-Draft is submitted to IETF in full conformance with the\nprovisions of BCP 78 and BCP 79.\n\nInternet-Drafts are working documents of the Internet Engineering\nTask Force (IETF), its areas, and its working groups.  Note that\nother groups may also distribute working documents as Internet-\nDrafts.\n\nInternet-Drafts are draft documents valid for a maximum of six months\nand may be updated, replaced, or obsoleted by other documents at any\ntime.  It is inappropriate to use Internet-Drafts as reference\nmaterial or to cite them other than as \"work in progress.\"\n\nThe list of current Internet-Drafts can be accessed at\nhttp://www.ietf.org/ietf/1id-abstracts.txt.\n\nThe list of Internet-Draft Shadow Directories can be accessed at\nhttp://www.ietf.org/shadow.html.\n\nThis Internet-Draft will expire on June 18, 2010.\n\nCopyright Notice\n\nCopyright (c) 2009 IETF Trust and the persons identified as the\ndocument authors.  All rights reserved.\nThis document is subject to BCP 78 and the IETF Trust's Legal\nProvisions Relating to IETF Documents\n(http://trustee.ietf.org/license-info) in effect on the date of\npublication of this document.  Please review these documents\ncarefully, as they describe your rights and restrictions with respect\nto this document.  Code Components extracted from this document must\ninclude Simplified BSD License text as described in Section 4.e of\nthe Trust Legal Provisions and are provided without warranty as\ndescribed in the BSD License.</p>"
