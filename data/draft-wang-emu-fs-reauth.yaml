abstract:
- language: en
  script: Latn
  content: <p>This draft specifies an update to RFC 9678, "Forward Secrecy Extension
    to the Improved Extensible Authentication Protocol Method for Authentication and
    Key Agreement (EAP-AKA' FS)". This update enables forward security of the Transient
    EAP Keys (TEKs) for protecting EAP packets, which are not in EAP-AKA' FS. Based
    on this extension, the executions of reauthentication after a full authentication
    will be unlinkable to each other and then the privacy of end users is enhanced.
    This update is also applicableto the successors of RFC 9678, with post-quantum
    key encapsulation mechanisms (KEMs) or hybrid KEMs.</p>
