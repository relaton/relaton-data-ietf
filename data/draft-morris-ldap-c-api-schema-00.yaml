- language: en
  script: Latn
  content: "<p>The following defines a standard API to ease the reading and modifying
    of Schema using the LDAP C API [CLDAP], a work in progress. It abstracts finding,
    reading, parsing, and modifying of schema definitions in an LDAP directory. Comparable
    functionality exists in the LDAP Java API [JLDAP], also a work in progress.</p>"
