abstract:
- language: en
  script: Latn
  content: "<p>The specification for the File Transfer Protocol does not include methods
    to obtain cryptographic hashes of files.  Cryptographic hashes can be used to
    identify files and verify intregrity. Unfortunately, because of the desire for
    this feature, multiple commands that are not formally specified have been implemented
    in FTP applications leading to non-interoperability and confusion.  This specification
    documents an optional command where FTP clients can request the cryptographic
    hash of a file from a FTP server.</p>"
