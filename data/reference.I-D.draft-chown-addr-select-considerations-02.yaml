abstract:
- language: en
  script: Latn
  content: "<p>RFC 3484 (IPv6 Default Address Selection) [RFC3484] defines mechanisms
    for nodes to perform source and destination address selection choices when faced
    with multiple addresses to choose between when initiating a communication.  While
    RFC3484 recognised the need for implementations to be able to change the policy
    table, a requirement has now also emerged for administrators to be able to dynamically
    change the policy tables from a central control point, and for nomadic hosts to
    be able to obtain the policy for the network that they are currently attached
    to without manual user intervention. This text discusses considerations for such
    policy changes, including examples of cases where a change of policy is required,
    and the likely frequency of such policy changes.  This text also includes some
    discussion on the need to also update RFC3484, where default policies are currently
    defined.</p>"
