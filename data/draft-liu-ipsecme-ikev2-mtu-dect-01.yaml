abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Internet Key Exchange Version 2 (IKEv2) allowed
    Maximum Transmission Unit (MTU) extension that enables to automatically detect
    MTU allowed on forwarding path of each IKEv2 session to prevent Encapsulating
    Security Payload (ESP) packets from being fragmented.</p>"
