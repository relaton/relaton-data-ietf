abstract:
- language: en
  script: Latn
  content: "<p>Rserpool is an architecture and set of protocols for the management
    and access to server pools supporting highly reliable applications and for client
    access mechanisms to a server pool. This Internet draft describes security threats
    to the Rserpool architecture and presents requirements for security to thwart
    these threats.</p>"
