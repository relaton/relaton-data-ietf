abstract:
- language: en
  script: Latn
  content: |-
    <p>Current source address validation (SAV) on an AS's provider
       interfaces mainly relies on loose uRPF, which cannot defend against
       IP spoofing using routable prefixes and is ineffective when a default
       route is present.  This document describes a *framework* for provider
       interface source address validation against spoofing of customer cone
       source prefixes (PI-SAV for CC).  Two architectural approaches are
       presented:

       *  *PI-SAV for Standalone CC*: a static solution that builds a
          blocklist based on topology information from BGP RIBs, RPKI ASPA,
          and local configuration (SLURM) etc.  It requires no inter-AS
          communication.

       *  *PI-SAV for Standalone+ CC*: an enhanced solution that uses
          lightweight query-response coordination between the top AS and
          member ASes to identify sub-cones that do not actually cause
          traffic detours, thereby enlarging the effective blocklist.

       This document is *informational* and provides only the framework,
       conceptual procedures, and requirements for future protocol
       specifications.  Detailed wire protocols (e.g., for partial transit
       information provisioning or for query-response messaging) are out of
       scope and will be defined in separate documents.</p>
