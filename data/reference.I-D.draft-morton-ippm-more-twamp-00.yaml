abstract:
- language: en
  script: Latn
  content: "<p>The IETF IP Performance Metrics Working Group is completing its work
    on TWAMP - the Two-Way Active Measurement Protocol.  This memo describes additional
    features for TWAMP, such as the ability to use different security modes in the
    TWAMP-Control and TWAMP-Test protocols.</p>"
