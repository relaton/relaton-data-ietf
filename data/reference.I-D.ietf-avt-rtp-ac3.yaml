abstract:
- language: en
  script: Latn
  content: "<p>This document describes an RTP payload format for transporting AC-3
    encoded audio data. AC-3 is a high quality, multichannel audio coding system used
    in US HDTV, DVD, cable and satellite television and other media. The RTP payload
    format as presented in this document includes support for data fragmentation.</p>"
