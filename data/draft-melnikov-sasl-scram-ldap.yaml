  script: Latn
  content: <p>This memo describes how the "authPassword" Lightweight Directory Access
    Protocol (LDAP) attribute can be used for storing secrets used by the Salted Challenge
    Response Authentication Message (SCRAM) mechanism in the Simple Authentication
    and Security Layer (SASL) framework. This document is not an Internet Standards
    Track specification; it is published for informational purposes.</p>
