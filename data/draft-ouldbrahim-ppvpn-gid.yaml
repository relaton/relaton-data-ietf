abstract:
- language: en
  script: Latn
  content: "<p>The existing VPN solutions [VR, 2547, L2VPN-Kompella] use in their
    \ncontrol plane globally unique identifiers. This document describes \nthe format
    of these identifiers (called GIDs). If any future VPN \nsolutions require globally
    unique identifiers, they can re-use the \nformat described in this document.</p>"
