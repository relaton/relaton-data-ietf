abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Preferred Path Routing (PPR), a routing protocol
    extension to simplify the path description on the packet for Segment Routing (SR)
    deployments and beyond.  PPR aims to mitigate the MTU and data plane processing
    issues that may result from SR packet overhead; and also supports further extensions
    along the paths.</p>"
