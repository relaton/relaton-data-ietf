abstract:
- language: en
  script: Latn
  content: "<p>The dual-stack lite mechanism provide an IPv4 access method over IPv6
    ISP network for end users.  Dual-Stack Lite enables an IPv6 provider to share
    IPv4 addresses among customers by combining IPv4-in-IPv6 tunnel and Carrier Grade
    NAT.  However, in dual-stack lite, CGN has to maintain active NAT sessions, which
    could become the performance bottom-neck due to high dynamic s of NAT entries,
    memory cost and log issue.  This document propose the lightweight 4over6 mechanism
    which moves the translation function from tunnel concentrator (AFTR) to initiators
    (B4s), and hence reduce the mapping scale on the concentrator to per-customer
    level.  For NAT44 translation usage, the mechanism will allocate port restricted
    IPv4 addresses to initiators in a flexible way independent of IPv6 network in
    the middle.</p>"
