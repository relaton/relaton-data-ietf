abstract:
- language: en
  script: Latn
  content: <p>This document defines a YANG data model that extends the network topology
    data model (RFC 8345) to map network topologies with inventories. The data model
    introduces the "inventory-topology" network type and augmentations for physical
    entity mappings and capabilities, which may be used by any overlay network topology
    for service provisioning validation, network maintenance, and capacity planning.</p>
