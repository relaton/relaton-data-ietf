abstract:
- language: en
  script: Latn
  content: "<p>This document describes how the concept of URI signing supports the
    content access control requirements of CDNI and proposes a candidate URI signing
    scheme.  The proposed URI signing method specifies the information needed to be
    included in the URI and the algorithm used to authorize and to validate access
    request for the content referenced by the URI.</p>"
