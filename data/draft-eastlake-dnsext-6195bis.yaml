abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Internet Assigned Number Authority (IANA) parameter
    assignment considerations are specified for the allocation of Domain Name System
    (DNS) resource record types, CLASSes, operation codes, error codes, DNS protocol
    message header bits, and AFSDB resource record subtypes. It obsoletes RFC 6195.</p>"
