abstract:
- language: en
  script: Latn
  content: "<p>Digital Credentials are frequently modeled on documents, forms, and
    messages that enable a holder to prove they have attributes that are acceptable
    to a verifier. This document provides guidance to verifiers enabling them to describe
    their requirements such that they can be translated into digital credential profiles.</p>"
