abstract:
- language: en
  script: Latn
  content: "<p>The Secured Digital Lifecycle Protocol (SDLP) defines a unified framework
    for representing, identifying, and tracking digital objects across their entire
    lifecycle. This document specifies the SDLP transformation model, which describes
    how digital objects change, evolve, or produce descendants through normative and
    verifiable processes. A transformation is any operation that produces a new digital
    object from an existing one. This document defines the transformation model, the
    required identity and lineage extensions, the invariants that must be preserved,
    and the logging requirements needed to ensure integrity, accountability, and tamper-evidence.
    These rules apply uniformly across all SDLP object types and lifecycle states.
    This specification is a core component of the SDLP architecture and is intended
    to be used alongside the SDLP Overview, Identity, Object Format, Lineage, Lifecycle,
    and Security Architecture documents.</p>"
