abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the conventions for using MAC-authenticated
    encryption with the Cryptographic Message Syntax (CMS) authenticated- enveloped-data
    content type.  This mirrors the use of a MAC combined with an encryption algorithm
    that's already employed in IPsec, SSL/ TLS, and SSH, which is widely supported
    in existing crypto libraries and hardware, and has been extensively analysed by
    the crypto community.</p>"
