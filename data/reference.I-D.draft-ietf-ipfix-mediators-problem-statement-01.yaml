abstract:
- language: en
  script: Latn
  content: "<p>Flow-based measurement is currently a popular method for various network
    monitoring usages.  The sharing of flow-based information among orthogonal monitoring
    applications raises open issues in terms of scalability, reliability and flexibility
    that IPFIX Mediation may help resolve.  IPFIX Mediation reroutes, replicates,
    filters, aggregates, correlates or modifies Flow Records or Packet Reports, or
    changes a transport protocol.  This document describes the applicability of IPFIX
    Mediation and the problems that IPFIX Mediation might encounter.</p>"
