abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to the Remote Authentication Dial-In
    User Service (RADIUS) protocol that enables service providers to charge for prepaid
    services.  The supported charging models supported are volume-based, duration-based,
    and based on one-time events.</p>"
