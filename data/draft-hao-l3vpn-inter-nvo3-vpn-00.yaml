abstract:
- language: en
  script: Latn
  content: "<p>This draft describes option-B inter-as connection between NVO3 network
    and MPLS/IP VPN network. Comparing to traditional Option-B inter-as connection
    defined in [RFC 4364], this draft provides enhancement for heterogeneous network
    multi-as connection, the control plane and data plane procedures in NVO3 network
    are newly designed.</p>"
