abstract:
- language: en
  script: Latn
  content: "<p>This document shows the need and list the requirements to logically
    correlate an existing SIP dialog, or even multi SIP transactions sent outside
    of a dialog, with a new SIP dialog.  This mechanism can be used to implement applications
    using multiple SIP sessions but also in peer-to-peer call control environments.</p>"
