abstract:
- language: en
  script: Latn
  content: "<p>Virtual Subnet is a BGP/MPLS IP VPN-based subnet extension solution
    which is intended for building Layer3 network virtualization overlays within and/or
    between data centers. This document describes a mechanism for reducing the FIB
    size of PE routers in the Virtual Subnet context.</p>"
