abstract:
- language: en
  script: Latn
  content: "<p>This document defines the HONK protocol, a simple application-layer\n   protocol operating over TCP.  A HONK client submits a stream of UTF-8\n   encoded text terminated by a CRLF sequence, and the HONK server\n   responds with a sequence of HONK tokens.  The token count equals\n   twice the number of whitespace-delimited words detected in the input.\n   If no words are detected, the server responds with exactly three HONK\n   tokens.  The protocol includes an optional Privacy Mode in which\n   message content is obfuscated using single-byte XOR with the fixed\n   key value 0x48 (the ASCII code point for the letter H).  This\n   document requests that IANA assign TCP port 24565 to the HONK\n   service.\n\n   This document is an individual submission.  It is NOT an April Fools\n   Day publication.  The author requests serious technical consideration\n   from the IETF community.</p>"
