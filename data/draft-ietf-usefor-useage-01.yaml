- language: en
  script: Latn
  content: <p>This Draft is intended to become a "Best Current Practice" RFC. Its
    purpose is to set out how software should behave and conventions which users should
    observe, in order that Netnews in general, and Usenet in particular, should provide
    the most effective service to its users.</p>
