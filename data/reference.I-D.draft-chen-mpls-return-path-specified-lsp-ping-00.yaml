abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to LSP Ping [RFC 4379] to enable the
    return path(s) of an echo reply message, so that it can be specified when sending
    an echo request message to perform LSP failure detection, and the echo reply message
    is extended to detect the return path(s). This capability could improve the reliability
    of echo reply and allows failure detection of a Bidirectional LSP or two unidirectional
    LSPs being performed by one message, resulting in operational saving.</p>"
