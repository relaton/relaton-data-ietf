abstract:
- language: en
  script: Latn
  content: "<p>SMTP [RFC5321] uses opportunistic TLS to optionally protect transport
    sessions. Secure SMTP uses mandatory TLS on all connections. It also provides
    a method for SMTP clients to locate Secure SMTP servers.</p>"
