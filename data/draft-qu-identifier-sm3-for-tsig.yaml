abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how to use a newly added message digest
       algorithm "SM3" in the TSIG protocol. It can be used to calculate
       the digest for the TSIG key by using a hash function. This document
       details the supplementation of the SM3 algorithm in TSIG.</p>
