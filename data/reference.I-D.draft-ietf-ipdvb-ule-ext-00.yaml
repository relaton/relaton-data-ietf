abstract:
- language: en
  script: Latn
  content: "<p>This document describes a set of Extension Headers for the Unidirectional
    Link Encapsulation (ULE) [RFC4236]. The Extension Header formats defined in this
    document define new extensions that are common extensions to both ULE and the
    Generic Stream Encapsulation (GSE) [GSE] defined by the second generation framing
    structure DVB-S2 standard [S2].</p>"
