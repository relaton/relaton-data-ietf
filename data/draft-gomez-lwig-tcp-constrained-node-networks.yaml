- language: en
  script: Latn
  content: |-
    <p>This document provides a profile for the Transmission Control
       Protocol (TCP) over Constrained-Node Networks (CNNs).  The
       overarching goal is to offer simple measures to allow for lightweight
       TCP implementation and suitable operation in such environments.</p>
