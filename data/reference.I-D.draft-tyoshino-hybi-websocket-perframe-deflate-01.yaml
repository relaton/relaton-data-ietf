abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a per-frame DEFLATE compression extension
    for the WebSocket protocol.  This extension enables compressing only the Application
    Data part of WebSocket frames using DEFLATE compression while leaving the other
    parts such as opcode, payload length, the Extension Data part untouched.</p>"
