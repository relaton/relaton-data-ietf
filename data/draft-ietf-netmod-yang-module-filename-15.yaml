abstract:
- language: en
  script: Latn
  content: "<p>This document defines the YANG module file name convention. The convention
    extends the YANG module file name using revision-date, with the YANG semantic
    version extension. The YANG semantic version extension allows for an informative
    version to be associated with a particular YANG module revision. This document
    updates RFCs 6020, 7950, and 9907.</p>"
