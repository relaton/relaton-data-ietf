abstract:
- language: en
  script: Latn
  content: "<p>Future networks will consist of photonic switches, optical \ncrossconnects,
    and routers that may be configured with control \nchannels, links, and bundled
    links.  This draft specifies a link \nmanagement protocol (LMP) that runs between
    neighboring nodes and is \nused to manage traffic engineering (TE) links.</p>"
