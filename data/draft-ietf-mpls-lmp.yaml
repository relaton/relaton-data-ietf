abstract:
- language: en
  script: Latn
  content: "<p>Future networks will consist of photonic switches, optical crossconnects,
    and routers that may be configured with control channels, links, and bundled links.
    This draft specifies a link management protocol (LMP) that runs between neighboring
    nodes and is used to manage traffic engineering (TE) links.</p>"
