title:
- language: en
  script: Latn
  content: RTP Payload Format for ISO/IEC 21122 (JPEG XS)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-avtcore-rtp-jpegxs-3ed-07
docidentifier:
- content: draft-ietf-avtcore-rtp-jpegxs-3ed
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-09-14'
abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a Real-Time Transport Protocol (RTP) payload\n   format for transport of a video signal encoded with JPEG XS (ISO/IEC\n   21122).  JPEG XS is a low-latency and low-complexity video coding\n   system.  Employing this format allows achieving encoding-decoding\n   latencies confined to a fraction of a video frame.\n\n   This document revises RFC 9134 to incorporate support for new\n   features introduced in the third edition of JPEG XS.  Most notably,\n   it contains the necessary provisions to support the TDC coding mode.\n   This document obsoletes RFC 9134; however, the revised payload format\n   is designed to ensure that existing conforming implementations of RFC\n   9134 remain valid under the updated specification.  Additionally,\n   this document consolidates the errata of RFC 9134 and includes\n   improvements and clarifications for implementers and users.</p>"
