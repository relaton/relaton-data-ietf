- language: en
  script: Latn
  content: "<p>This document defines a new BGP message type, the BGP UPDATE-v2 message
    that organizes the attribute encodings and the NLRI sections in a better manner.
    This is especially useful in light of the many new AFI/SAFIs that have been proposed
    in the recent years and the reliability and robustness of the BGP Protocol.</p>"
