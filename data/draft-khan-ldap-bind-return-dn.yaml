- language: en
  script: Latn
  content: "<p>This document proposes an extension to the LDAP Bind operation to optionally
    return the authenticated subject’s Distinguished Name (DN) and selected attributes.
    The goal is to reduce the number of client- server round trips required to obtain
    user identity information after authentication.</p>"
