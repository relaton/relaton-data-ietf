abstract:
- language: en
  script: Latn
  content: "<p>This document provides an overview of MANET and NEMO characteristics.
    It is claimed that MANET suits small mobile network topologies, providing optimal
    paths for communication within a MANET cloud. It is also claimed that NEMO suits
    small, mobile networks, providing sub-optimal paths to all Internet connected
    nodes. MANET and NEMO technology shortcoming are described, to be addressed in
    the MANET and NEMO workgroups or elsewhere within the IETF.</p>"
