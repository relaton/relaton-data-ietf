abstract:
- language: en
  script: Latn
  content: "<p>This document defines P2P streaming Tracker Protocol, including functional
    entities and architecture, components, syntax and semantics.  This Tracker protocol
    is an application-level protocol for peers to register, publish/request content
    and provide peer status to Trackers.  It is also for trackers to provide peer
    lists to peers, send control/manage messages and communicate with other trackers.
    Tracker protocol can serve live media and VoD applications, as well as file sharing.</p>"
