abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a new top-level TLV in IS-IS to carry a checksum
    over the LSP IDs and sequence numbers of all self-originated LSP fragments. A
    receiving node uses this value to validate the integrity of the originator's Link
    State Database (LSDB).</p>"
