abstract:
- language: en
  script: Latn
  content: "<p>This document discusses IAB concerns that ongoing research is needed
    to further the evolution of the Internet infrastructure, and that consistent,
    sufficient non-commercial funding is needed to enable such research.  This memo
    provides information for the Internet community.</p>"
