abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an enhancement to the LDP graceful restart procedures
    defined in RFC 3478. The proposed extension allows operators to apply graceful
    restart only when the restart is planned (as oppossed to both planned and unplanned
    restart).</p>"
