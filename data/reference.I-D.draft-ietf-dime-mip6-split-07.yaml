abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv6 deployments may want to bootstrap their operations dynamically
    based on an interaction between the Home Agent and the Diameter server of the
    Mobile Service Provider (MSP).  This document specifies the interaction between
    a Mobile IP Home Agent and that Diameter server.  Several different mechanisms
    for authenticating a Mobile Node are supported.  The usage of the Internet Key
    Exchange v2 (IKEv2) protocol allows different mechanisms, such as the Extensible
    Authentication Protocol (EAP), certificates and pre-shared secrets to be used.
    \ Furthermore, another method makes use of the Mobile IPv6 Authentication protocol.
    \ In addition to authentication and authorization, the configuration of Mobile
    IPv6 specific parameters and accounting is specified in this document.</p>"
