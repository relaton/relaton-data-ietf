abstract:
- language: en
  script: Latn
  content: "<p>The Agent Transfer Protocol (AGTP) base specification defines AGTP\n   semantics independently of any specific transport.  This document\n   specifies the AGTP transport bindings for TCP with TLS 1.3 and for\n   QUIC, defining how AGTP requests and responses are carried over each\n   transport, how TLS mutual authentication composes with AGTP identity,\n   and how connection lifecycle events map to AGTP session semantics.\n\n   A central concern for the QUIC binding is replay safety.  QUIC\n   supports 0-RTT early data, which is replayable by design.  AGTP\n   requests carry authority-scoped actions; a replayed action method\n   could re-trigger authorized work without the requesting agent's\n   intent.  This document defines an AGTP-specific replay-safety\n   profile: early data is permitted only for safe idempotent methods\n   (QUERY, DISCOVER) and *MUST NOT* be used for action methods (EXECUTE,\n   DELEGATE, PURCHASE, TRANSACT, and the lifecycle methods).\n\n   This document follows the pattern established by HTTP: protocol\n   semantics defined independently of transport ([RFC9110] for HTTP),\n   with transport-specific bindings in separate documents.  AGTP\n   semantics are defined in [AGTP]; this document defines the transport\n   mechanics.</p>"
