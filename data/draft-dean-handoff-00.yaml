abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a method of signaling call handoff using SIP.
    Call handoff is the process of moving one end of an active call
    without creating a new logical call.  Handoff is an important
    primitive for providing advanced telephony services.</p>
