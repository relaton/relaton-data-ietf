- language: en
  script: Latn
  content: "<p>This document presents use cases and protocol requirements for provisioning
    ENUM-SIP addressing servers.  The provisioned data is used by an addressing server
    to return part of the session establishment data to SIP entities so that they
    can route SIP sessions to the target destinations.</p>"
