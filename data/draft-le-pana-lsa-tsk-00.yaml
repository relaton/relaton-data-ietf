abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism to set up a Local Security Association
    (LSA) between a user and the local network where the user is attaching to the
    Internet. It defines all the required related functionalities such as the key
    generation, distribution and update procedures; it also describes the reasons
    and the benefits of the adoption of such LSA.</p>"
