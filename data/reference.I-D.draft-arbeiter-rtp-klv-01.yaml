abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism for carriage of KLV (Key-Length-
    Value) Encoded Data, as defined by the Society of Motion Picture and Television
    Engineers (SMPTE) in SMPTE 336M.  One payload format is described for transmitting
    KLV Encoded Data on a separate RTP session dedicated for the transmission of KLV
    Encoded Data.</p>"
