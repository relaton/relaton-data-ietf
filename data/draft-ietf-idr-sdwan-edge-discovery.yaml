abstract:
- language: en
  script: Latn
  content: "<p>The document describes the BGP mechanisms for SD-WAN (Software Defined
    Wide Area Network) edge node attribute discovery. These mechanisms include a new
    tunnel type and sub-TLVs for the BGP Tunnel- Encapsulation Attribute (RFC9012)
    and set of NLRI (network layer reachability information) for SD-WAN underlay information.</p>"
