abstract:
- language: en
  script: Latn
  content: "<p>RFC 3484 defines two algorithms for default source and destination
    address selection, but it has several shortcomings as specified in RFC 5220.  RFC
    5221 lists some requirements for any attempts to update the original RFC.  This
    document specifies an alternate address selection algorithm to fulfill those requirements.</p>"
