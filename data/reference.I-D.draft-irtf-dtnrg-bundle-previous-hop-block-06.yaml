abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension block that may be used with the
    Bundle Protocol [refs.DTNBP] within the context of a Delay-Tolerant Network architecture
    [refs.DTNarch].  This Previous Hop Insertion Block is designed to be inserted
    by a forwarding node to provide its endpoint ID (EID) to the next-hop receiving
    node.  Knowledge of the EID of a previous-hop node may be required in some circumstances
    to support certain routing protocols (e.g., flood routing).  The Previous Hop
    Insertion block is always removed from the bundle by the receiving node so that
    it's duration within the bundle lasts for exactly one hop.  This document defines
    the format and processing of this Previous Hop Insertion Block.</p>"
