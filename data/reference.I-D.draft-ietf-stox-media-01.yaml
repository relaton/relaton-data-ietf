abstract:
- language: en
  script: Latn
  content: "<p>This document defines a bi-directional protocol mapping for use by
    gateways that enable the exchange of media signalling messages between systems
    that implement the Jingle extensions to the Extensible Messaging and Presence
    Protocol (XMPP) and those that implement the Session Initiation Protocol (SIP).</p>"
