- language: en
  script: Latn
  content: "<p>This document defines protocol extensions and procedures for BGP PE-CE
    router iteration in BGP/MPLS IP VPN [RFC4364] networks. These have the objective
    of making the usage of the BGP/MPLS IP VPN transparent to the customer network,
    as far as routing information is concerned.</p>"
