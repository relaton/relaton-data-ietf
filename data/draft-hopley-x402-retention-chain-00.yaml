abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a cryptographic construction, the Retention
    Chain Reference (retention_chain_ref), that enables self-verifiable audit chains
    linking payment receipts without requiring external infrastructure. Each receipt
    in a sequence carries a chain reference computed as the SHA-256 digest of the
    JSON Canonicalization Scheme (JCS, RFC 8785) canonical form of a fixed four-field
    preimage. Any party holding any contiguous or non-contiguous subset of receipts
    can independently verify chain integrity by recomputing the reference from locally
    held data. No AlgoVoi infrastructure, no registry lookup, and no network access
    are required. The construction satisfies the transaction recording and audit trail
    obligations of MiCA Article 80, DORA Article 14, and AMLR Article 56.</p>"
