abstract:
- language: en
  script: Latn
  content: "<p>This document defines architectural considerations and problem statement
    for authenticating the user before entering into a multicast group using the multicast
    listener discover protocol version 2 (MLDv2). The issues regarding identifying
    multiple users, authenticating the channel, accounting, mobile multicast and security
    are identified.</p>"
