abstract:
- language: en
  script: Latn
  content: '<p>This document specifies Metalink/HTTP: Mirrors and Checksums in HTTP
    Headers, a different way to get information that is usually contained in the Metalink
    XML-based download description format.  Metalink/HTTP describes multiple download
    locations (mirrors), Peer-to-Peer, checksums, digital signatures, and other information
    using existing standards for HTTP headers.  Clients can transparently use this
    information to make file transfers more robust and reliable.  Status of this Memo  This
    Internet-Draft is submitted to IETF in full conformance with the provisions of
    BCP 78 and BCP 79.  Internet-Drafts are working documents of the Internet Engineering
    Task Force (IETF), its areas, and its working groups.  Note that other groups
    may also distribute working documents as Internet- Drafts.  Internet-Drafts are
    draft documents valid for a maximum of six months and may be updated, replaced,
    or obsoleted by other documents at any time.  It is inappropriate to use Internet-Drafts
