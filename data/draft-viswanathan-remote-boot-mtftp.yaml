- language: en
  script: Latn
  content: "<p>This document defines a protocol, Multicast Trivial File Transfer Protocol
    (MTFTP), which allows several clients to simultaneously receive a file multicast
    by a TFTP server as implemented in Intel's Universal Network Boot (PXE [1]) which
    is part of Intel's Wired for Management Initiative [2].</p>"
