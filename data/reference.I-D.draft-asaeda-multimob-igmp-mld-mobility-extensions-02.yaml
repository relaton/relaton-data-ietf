abstract:
- language: en
  script: Latn
  content: <p>This document describes IGMP and MLD protocol extensions for mobile
    hosts and routers.  IGMP and MLD are necessary protocols for hosts to request
    join or leave multicast sessions.  While the regular IGMP and MLD protocols support
    communication between mobile hosts and routers over wireless networks, this document
    discusses the conditions how mobile hosts and routers use IGMP and MLD in their
    communication more effectively.  Aside from a modified protocol semantic, optional
    "Notification function" and "Listener Hold function" for the IGMP and MLD protocols
    are introduced.</p>
