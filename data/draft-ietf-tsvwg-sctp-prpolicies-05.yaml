abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines two additional policies for the Partial
       Reliability Extension of the Stream Control Transmission Protocol
       (PR-SCTP) allowing to limit the number of retransmissions or to
       prioritize user messages for more efficient send buffer usage.</p>
