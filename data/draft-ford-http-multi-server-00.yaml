- language: en
  script: Latn
  content: "<p>This document describes an extension to HTTP by which servers can automatically
    inform clients of mirrors of resources. Clients can then simultaneously request
    segments of the resource from different servers, enhancing both network and server
    utilisation, download speeds, and thus user experience.</p>"
