abstract:
- language: en
  script: Latn
  content: "<p>This document describes an optional method for encoding explicit packet
    Sensitivity Labels on IPv6 packets.  It is intended for use only within Multi-Level
    Secure (MLS) networking environments that are both trusted and trustworthy.  This
    memo provides  information for the Internet community.</p>"
