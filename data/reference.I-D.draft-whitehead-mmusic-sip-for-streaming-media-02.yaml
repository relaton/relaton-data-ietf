abstract:
- language: en
  script: Latn
  content: "<p>This draft summarizes a set of use-cases and their associated requirements
    that suggest a convergence between the Session Initiation Protocol (SIP) [2] and
    the Real Time Streaming Protocol (RTSP and RTSP v2) [3] and [4] that may be beneficial
    for streaming media applications. This benefit is especially apparent in the context
    of converged/blended media services.</p>"
