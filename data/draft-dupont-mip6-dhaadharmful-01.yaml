  script: Latn
  content: |-
    <p>Dynamic Home Agent Address Discovery (DHAAD) mechanism of Mobile IPv6
       is nearly impossible to make secure.  As the service itself is
       useful, this document shows the security problems of the current
       mechanism and promotes an alternative solution.</p>
