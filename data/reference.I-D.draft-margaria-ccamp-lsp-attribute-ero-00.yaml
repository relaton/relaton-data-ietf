  script: Latn
  content: "<p>LSP attributes can be specified or recorded for whole path, but they
    cannot be specified as part of an Explicit Route Object (ERO).  This document
    extend the semantic for RSVP ERO object with a new subobject to carry LSP attributes.</p>"
