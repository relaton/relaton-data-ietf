abstract:
- language: en
  script: Latn
  content: "<p>This document defines requirements and an external conformance framework
    for sovereign Machine Entity Comprehension (MEC) systems operating in Internet-connected
    or Internet-capable environments. MEC is defined as an externally observable capability.
    A conforming system preserves entity identity across changing contexts, distinguishes
    similar but separate entities, determines relevant relationships and constraints,
    responds appropriately to material changes, handles contradictory assertions,
    and produces repeatable outcomes under equivalent declared conditions. The framework
    evaluates behavior through controlled inputs, pre- registered reference outcomes,
    declared system state, and observable outputs. It does not prescribe or disclose
    internal representations, implementation algorithms, source code, deployment architecture,
    confidential operational methods, or other implementation-specific mechanisms.
    The document also defines operational-sovereignty requirements for systems intended
    to remain under operator control and retain declared core capabilities without
    dependence on an external intelligence service. A minimal, implementation-neutral
    conformance record supports comparable reporting across heterogeneous systems.</p>"
