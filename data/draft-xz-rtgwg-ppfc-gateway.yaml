abstract:
- language: en
  script: Latn
  content: "<p>This document proposes Precise Priority-based Flow Control (PPFC)\n   mechanism implemented at the network gateway, it designed to\n   efficiently manage congestion in scenarios where multiple flows\n   converge toward a common destination.  By enabling fast, per-flow\n   congestion control at the network gateway, PPFC allows incoming\n   traffic destined for a congested bottleneck to be paused or rate-\n   limited before entering the network.  This approach decouples the\n   congestion feedback loop from the end-to-end data path, significantly\n   reducing reaction time and improving the effectiveness of congestion\n   management.</p>"
