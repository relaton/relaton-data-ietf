abstract:
- language: en
  script: Latn
  content: '<p>This document defines two CBOR serializations: "preferred-plus serialization"
    and "deterministic serialization." It also introduces the term "general serialization"
    to name the complete set of all serializations defined in RFC 8949. Together,
    these three form a set of serializations that cover the majority of CBOR serialization
    use cases. These serializations are largely compatible with those widely implemented
    by the CBOR community.</p>'
