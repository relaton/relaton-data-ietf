- language: en
  script: Latn
  content: "<p>This document describes a method to evaluate the Quality of Experience
    (QoE) of real-time video delivered over HTTP Adaptive Streaming (HAS) technology.
    Not only the end points but also the content providers and network operators can
    acquire the QoE of HAS by implementing this method.</p>"
