- language: en
  script: Latn
  content: "<p>This document defines the IKEv2 IPv4 Downstream Fragmentation Notification
    Extension which enables a receiving security gateway to notify the sending receiving
    gateway that downstream fragmentation is ongoing. The sending gateway MAY take
    action to avoid such fragmentation to occur.</p>"
