abstract:
- language: en
  script: Latn
  content: "<p>This draft defines a new Outbound Route Filter (ORF) type, called the
    VPN Prefix ORF. The described VPN Prefix ORF mechanism is applicable when the
    VPN routes from different VRFs are exchanged via one shared BGP session (e.g.,
    routers in a single-domain connect via Route Reflector).</p>"
