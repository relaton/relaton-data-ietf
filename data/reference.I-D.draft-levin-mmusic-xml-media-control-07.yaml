abstract:
- language: en
  script: Latn
  content: "<p>This document defines an XML Schema for video fast update in a tightly
    controlled environment. This document describes a method that has been deployed
    in SIP based systems for over the last three years and being used across real-time
    interactive applications from different vendors in interoperable manner. New implementations
    must not use the method described in the drafts and are required to use the new
    full intra request command in the RTCP channel.</p>"
