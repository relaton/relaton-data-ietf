abstract:
- language: en
  script: Latn
  content: "<p>Multicast VPN, based on the Virtual Router model using PIM with GRE
    tunnels, has been in operation in production networks for several years. This
    document describes some of the experiences gained from implementation and deployment
    of such Multicast VPNs. Further it describes the practices used by such deployments
    based on the experience.</p>"
