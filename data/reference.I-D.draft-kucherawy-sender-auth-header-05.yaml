abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a new message header for use with electronic mail
    messages to indicate the results of sender authentication efforts. Mail user agents
    (MUAs) may use this message header to relay that information in a convenient way
    to users or to make sorting and filtering decisions.</p>"
