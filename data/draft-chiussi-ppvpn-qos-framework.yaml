abstract:
- language: en
  script: Latn
  content: "<p>This document defines the QoS framework for Layer 2 and Layer 3 provider-provisioned
    VPNs. The scope of this document includes MPLS, IPSec, GRE, and L2TP VPNs. This
    document focuses on the QoS aspects that are specific of PPVPNs, and discusses
    issues pertaining to Service Level Agreements, provisioning, resource allocation,
    signaling, and protection/restoration. Both non-hierarchical and hierarchical
    VPN’s are addressed</p>"
