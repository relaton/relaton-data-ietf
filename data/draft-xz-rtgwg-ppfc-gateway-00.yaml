abstract:
- language: en
  script: Latn
  content: "<p>This document proposes Precise Priority-based Flow Control (PPFC) mechanism
    implemented at the network gateway, it designed to efficiently manage congestion
    in scenarios where multiple flows converge toward a common destination. By enabling
    fast, per-flow congestion control at the network gateway, PPFC allows incoming
    traffic destined for a congested bottleneck to be paused or rate- limited before
    entering the network. This approach decouples the congestion feedback loop from
    the end-to-end data path, significantly reducing reaction time and improving the
    effectiveness of congestion management.</p>"
