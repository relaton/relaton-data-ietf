- language: en
  script: Latn
  content: "<p>This document describes a method by which a receiving MTA may insert
    Brand Indicators for Message Identification (BIMI) headers into a message in such
    a way that a third party MUA can not only use the information in those headers
    but also validate that the headers were inserted by the MTA.</p>"
