abstract:
- language: en
  script: Latn
  content: "<p>Given the ever-increasing complexity of the configuration tasks required
    for the dynamic provisioning of IP networks and services, this document aims at
    listing the requirements to drive the specification of an automated configuration
    management framework, including the requirements for a protocol to convey configuration
    information towards the managed entities.</p>"
