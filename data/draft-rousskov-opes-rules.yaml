abstract:
- language: en
  script: Latn
  content: "<p>P is a simple configuration language designed for efficient and\ncompact specification of message processing instructions at\napplication proxies. P can be used to instruct an intermediary how to\nmanipulate the application message being proxied. Such instructions\nneeded in an Open Pluggable Edge Services (OPES) context.</p>"
