- language: en
  script: Latn
  content: "<p>COPS [COPS] is a Policy Transport protocol that can be used for exchanging
    resource allocation commands between PDP and PEP [COPSFRAME]. This memo defines
    COPS messages and objects for supporting Traffic Engineering and resource management
    functionality at network edge routers.</p>"
