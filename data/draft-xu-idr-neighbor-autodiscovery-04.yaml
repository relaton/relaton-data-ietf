abstract:
- language: en
  script: Latn
  content: "<p>BGP has been used as the underlay routing protocol in many hyper- scale
    data centers. This document proposes a BGP neighbor autodiscovery mechanism that
    greatly simplifies BGP deployments. This mechanism is very useful for those hyper-scale
    data centers where BGP is used as the underlay routing protocol.</p>"
