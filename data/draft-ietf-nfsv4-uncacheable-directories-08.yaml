abstract:
- language: en
  script: Latn
  content: "<p>Network File System version 4.2 (NFSv4.2) clients may cache the file
    attributes returned by READDIR alongside each directory entry. This caching is
    inherently best-effort: those attributes belong to the underlying files and change
    when the files are written, which the directory's change attribute does not track.
    In some deployments the rate of file writes by other clients makes such caching
    produce incorrect size and timestamp values often enough to be a deployment problem.
    This document introduces an uncacheable dirent metadata attribute for NFSv4.2
    that allows a server to identify a directory for which an honoring client is required
    to retrieve directory-entry metadata from the server on each READDIR rather than
    serving the response from a local cache.</p>"
