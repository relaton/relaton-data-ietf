abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of DES-CBC for confidentiality plus
    DES Message Authentication Code (MAC) for integrity, in the IP Encapsulating Security
    Payload (ESP). The use of the DES algorithm for both purposes may serve useful
    in environments where hardware acceleration is available.</p>"
