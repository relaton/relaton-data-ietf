abstract:
- language: en
  script: Latn
  content: "<p>Autonomous and agentic systems now take consequential, often\n   irreversible actions -- moving money, changing records, routing\n   benefits, releasing effects -- at machine speed, while the evidence\n   systems that establish accountability were built for the speed of\n   humans taking those actions.  Across regulation, audit, and insurance\n   the same requirement recurs and the same artifact is missing:\n   portable, offline-verifiable proof that a named, accountable human\n   authorized a specific action before it executed, checkable by a third\n   party without trusting the operator that produced it.\n\n   This document is the architectural overview of the EMILIA Protocol\n   (EP): a human-authorization and oversight evidence layer for agentic\n   and autonomous systems.  It defines the layer's position relative to\n   agent identity, delegation, policy, and transparency work; states the\n   design invariants; and ties together the component specifications --\n   the authorization receipt, multi-party quorum, the enforcement point,\n   the authorization evidence chain, long-term evidence-record renewal,\n   authorization-posture advisories, and the human-oversight profile.\n   EP composes with the other layers rather than replacing them; its\n   contribution is the human- accountability apex and the composition\n   seam that binds the layers' artifacts into one verifiable record.\n\n   EP proves authorization -- that a named human (or quorum) approved\n   the exact action.  It does not prove the action was understood,\n   lawful, wise, or proportional.  It is a necessary, not sufficient,\n   condition for accountable autonomy, and this document is explicit\n   about that boundary.</p>"
