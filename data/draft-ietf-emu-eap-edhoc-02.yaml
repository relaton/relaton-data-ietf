abstract:
- language: en
  script: Latn
  content: |-
    <p>The Extensible Authentication Protocol (EAP), defined in RFC 3748,
       provides a standard mechanism for support of multiple authentication
       methods.  This document specifies the EAP authentication method EAP-
       EDHOC, based on Ephemeral Diffie-Hellman Over COSE (EDHOC).  EDHOC
       provides a lightweight authenticated Diffie-Hellman key exchange with
       ephemeral keys, using COSE to provide security services efficiently
       encoded in CBOR.  This document also provides guidance on
       authentication and authorization for EAP-EDHOC.</p>
