abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an additional CoAP binding attribute that
       allows binding attributes to be scoped to an item (sub-resource) in a
       collection resource.  This allows synchronisation of multiple
       resources in a collection based on the value of one resource.</p>
