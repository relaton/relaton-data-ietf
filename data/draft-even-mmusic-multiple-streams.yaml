- language: en
  script: Latn
  content: "<p>This document describes issues when describing multiple RTP streams\n   in a single RTP session using SDP and considers the different RTP\n   topologies that should be supported.  The document looks at current\n   solutions and provides paths toward addressing the issues.</p>"
