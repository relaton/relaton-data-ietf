abstract:
- language: en
  script: Latn
  content: "<p>The Routing Protocol for Low Power and Lossy Networks (RPL) defines
    a generic Distance Vector protocol for Low Power and Lossy Networks (LLNs).  RPL
    is instantiated to honor a particular routing objective/ constraint by the adding
    a specific Objective Function (OF) that is designed to solve that problem.  This
    specification defines a basic OF, OF0, that uses only the abstract properties
    exposed in RPL messages to maximize connectivity.</p>"
