abstract:
- language: en
  script: Latn
  content: "<p>In large IS-IS networks it is useful to quickly verify whether the
    link-state databases on all routers have synchronized properly and to derive a
    rough metric of flooding diffusion behavior. This document proposes a lightweight
    database fingerprinting mechanism for IS-IS along with YANG model extensions providing
    easy access to such information.</p>"
