abstract:
- language: en
  script: Latn
  content: "<p>This document provides implementation and operational considerations
    for using TLS-PSK with RADIUS/TLS (RFC6614) and RADIUS/DTLS (RFC7360). The purpose
    of the document is to help smooth the operational transition from the use of the
    RADIUS/UDP to RADIUS/TLS.</p>"
