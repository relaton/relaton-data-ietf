abstract:
- language: en
  script: Latn
  content: "<p>In the present Internet architecture, packet transparency is lost \ndue
    to the introduction of Middle Boxes that either modifies the \ncontents of the
    IP packet, or drops it (Ref [RFC2775]). \nThis draft presents in the context of
    the MIDCOM workgroup framework \nseveral Middle Boxes network deployment scenarios
    that needs       \nto be considered.</p>"
