abstract:
- language: en
  script: Latn
  content: "<p>Because of retargeting of a Session Initiation Protocol (SIP) dialog-
    forming request (changing the value of the Request-URI), the User Agent Server
    (UAS) can have a different identity from that in the To header field. This document
    provides a means for that User Agent (UA) to supply its identity to the peer UA
    by means of a request in the reverse direction and for that identity to be signed
    by an Authentication Service. The same mechanism can be used to indicate a change
    of identity during a dialog, e.g., because of some action in the Public Switched
    Telephone Network (PSTN) behind a gateway. This document normatively updates RFC
    3261 (SIP).</p>"
