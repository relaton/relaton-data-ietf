abstract:
- language: en
  script: Latn
  content: "<p>This document describes a rate control mechanism for Segment Routing
    over IPv6 (SRv6) network slices. It addresses the challenge of balancing resource
    utilization and congestion avoidance in over- committed slice deployments. The
    mechanism leverages a token-based scheduler to differentiate between Committed
    Information Rate (CIR) and Peak Information Rate (PIR) traffic, and defines procedures
    for calculating initial PIR values and dynamically adjusting them based on network
    conditions. Dynamic rate adjustments are triggered by localized congestion or
    underutilization, enabling proactive rate control and efficient bandwidth sharing
    among slices sharing common physical links.</p>"
