abstract:
- language: en
  script: Latn
  content: "<p>This document describes four services that top-level certification
    authorities (TLCAs) may provide in support of Internet Privacy-Enhanced Mail:
    notary certificate-signing services, co-issuer certificate-signing and certificate
    revocation list (CRL)-signing services, CRL-storing services, and CRL-retrieving
    services.</p>"
