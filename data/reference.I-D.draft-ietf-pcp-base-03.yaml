  script: Latn
  content: "<p>Port Control Protocol allows a host to control how incoming IPv6 or
    IPv4 packets are translated and forwarded by a network address translator (NAT)
    or simple firewall to an IPv6 or IPv4 host, and also allows a host to optimize
    its NAT keepalive messages.</p>"
