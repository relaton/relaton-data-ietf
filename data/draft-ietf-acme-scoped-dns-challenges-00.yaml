abstract:
- language: en
  script: Latn
  content: "<p>This document outlines a new challenge for the ACME protocol, enabling
    an ACME client to answer a domain control validation challenge from an ACME server
    using a DNS resource linked to the ACME Account ID. This allows multiple systems
    or environments to handle challenge-solving for a single domain.</p>"
