- language: en
  script: Latn
  content: "<p>The Hypertext Transfer Protocol (HTTP) is an application-level protocol
    for distributed, collaborative, hypertext information systems.  This document
    defines requirements on HTTP caches and the associated header fields that control
    cache behavior or indicate cacheable response messages.</p>"
