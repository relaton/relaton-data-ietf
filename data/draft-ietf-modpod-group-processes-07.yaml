abstract:
- language: en
  script: Latn
  content: |-
    <p>The IETF will treat people with kindness and grace, but not endless
       patience.

       This memo describes the creation of a moderator team for all the
       IETF's various contribution channels.  Without removing existing
       responsibilities for working group management, this team enables a
       uniform approach to moderation of disruptive participation across all
       mailing lists and other methods of IETF collaboration.</p>
