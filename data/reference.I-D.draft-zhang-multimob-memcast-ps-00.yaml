abstract:
- language: en
  script: Latn
  content: "<p>Mobile multicast is a research hotspot and gets more and more study
    recently. But the current mobility management specifications can not provide effective
    multicast packets transmission, and existing mobile multicast schemes are not
    generally accepted. In this memo, we discuss the problems arising from mobile
    multicast and address the solutions of MIPv6 extensions to support mobile multicast
    services.</p>"
