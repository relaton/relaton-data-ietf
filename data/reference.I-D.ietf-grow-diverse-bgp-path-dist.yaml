abstract:
- language: en
  script: Latn
  content: "<p>The BGP4 protocol specifies the selection and propagation of a single
    best path for each prefix.  As defined and widely deployed today BGP has no mechanisms
    to distribute alternate paths which are not considered best path between its speakers.
    \ This behaviour results in number of disadvantages for new applications and services.
    \ The main objective of this document is to observe that by simply adding new
    session between route reflector and it's client Nth best path can be distributed.
    \ Document also compares existing solutions and proposed ideas that enable distribution
    of more paths than just the best path.  This proposal does not specify any changes
    to the BGP protocol definition.  It does not require software upgrade of provider
    edge routers acting as route reflector clients.</p>"
