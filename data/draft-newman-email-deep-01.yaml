abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a set of requirements and facilities designed
    to improve email privacy. The focus of this proposal is to provide mechanisms
    intended to increase use of already deployed Transport Layer Security (TLS) technology
    and enable deployment and use of stronger cipher suites for email protocols.</p>"
