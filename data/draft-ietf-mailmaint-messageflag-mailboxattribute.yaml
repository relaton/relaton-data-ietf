abstract:
- language: en
  script: Latn
  content: "<p>This document defines a number of keywords and mailbox name attributes
    that have been in use across different server and client implementations. It defines
    the intended use of these keywords and mailbox name attributes. This document
    registers all of these with IANA to avoid name collisions.</p>"
