abstract:
- language: en
  script: Latn
  content: "<p>This document describes the algorithms and test vectors of Camellia
    block cipher algorithm in Counter (CTR) mode and Counter with Cipher Block Chaining
    MAC (CCM) Mode.  The purpose of this document is to make the Camellia-CTR and
    Camellia-CCM algorithm conveniently available to the Internet Community.</p>"
