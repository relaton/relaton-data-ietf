abstract:
- language: en
  script: Latn
  content: "<p>Consequential agent actions can produce heterogeneous identity, delegation,
    policy, permit, approval, transparency, capability, and execution artifacts. Each
    artifact can verify under its own specification while still referring to a different
    action, filling a different evidentiary role, or failing a relying party's freshness,
    status, or inter-artifact binding requirement. This document defines the Authorization
    Evidence Chain (EP-AEC): a transport-agnostic composition object and a fail-closed
    evaluation algorithm that preserves native verification, establishes exact material-action
    matching, and evaluates a relying-party-pinned evidence requirement. AEC produces
    SATISFIED or UNSATISFIED and a replayable evaluation record. SATISFIED means only
    that the presented evidence filled the relying party's named evidence requirement
    at the stated verification time. It is not a universal authorization decision,
    a policy language for the protected application, or proof of execution or outcome.
    The executor makes the separate local AUTHORIZED decision and controls consumption,
    invocation, and effect handling. Qualification evidence can fill a named evidence
    role but cannot authorize an action by itself. AEC introduces no new component
    receipt type and does not replace any native verifier.</p>"
  format: text/html
