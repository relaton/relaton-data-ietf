abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the ZI2 Certified Email Server Attestation\n   Protocol, a mechanism for cryptographic attestation of email origin\n   at the mail server level.  Unlike existing email authentication\n   protocols (SPF, DKIM, DMARC), which operate at the domain level, ZI2\n   Certified operates at the server-instance level, enabling definitive\n   identification of the specific server that dispatched a given email\n   message.  The protocol introduces two custom mail headers\n   (X-ZI2-Certified and X-ZI2-Verified), a DNS TXT record publication\n   format, a graduated trust model with four levels, and an integration\n   interface for AI-based email classification systems.  The protocol\n   operates complementarily to existing email authentication\n   infrastructure and does not require modification of SPF, DKIM, or\n   DMARC.</p>"
