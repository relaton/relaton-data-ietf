  script: Latn
  content: "<p>This document is a summary of the style conventions and editorial policies
    that apply to the RFC document series. It captures the RFC Editor's fundamental
    requirements and offers guidance regarding the format and structure of an RFC.
    While in Internet-Draft format, it should be considered for discussion purposes
    only. Guidance provided by this document will not be applied until published as
    an RFC. Please send your comments to rfc-interest@rfc-editor.org.</p>"
