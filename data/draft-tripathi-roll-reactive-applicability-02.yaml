- language: en
  script: Latn
  content: "<p>This document describes serious issues and shortcomings regarding the
    use of reactive routing protocols in low power and lossy networks (LLNs). Routing
    requirements for various LLN deployments are discussed in order to judge how reactive
    routing may or may not adhere to the necessary criteria.</p>"
