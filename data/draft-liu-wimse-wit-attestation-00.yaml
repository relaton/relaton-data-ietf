abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how Remote Attestation evidence, as defined\n   by the IETF RATS architecture, can be conveyed within a Workload\n   Identity Token (WIT) as used in the WIMSE (Workload Identity for\n   Micro-Services Environments) framework.  The WIT includes attestation\n   measurements that enable fast-path policy evaluation without\n   requiring immediate access to full evidence.  The WIT is bound to the\n   HTTP request using OAuth 2.0 Demonstrating Proof-of-Possession\n   (DPoP), ensuring that attestation claims are protected against replay\n   and token theft.\n\n   This specification defines a two-tier verification model: lightweight\n   verification using embedded measurements for common scenarios, and\n   deep verification using externalized evidence for high-assurance\n   requirements.  This enables secure, cross-domain verification of\n   workload integrity without requiring direct access to platform-\n   specific reference values, while enabling efficient deployments.</p>"
