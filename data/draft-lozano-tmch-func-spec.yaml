- language: en
  script: Latn
  content: "<p>This document describes the requirements, the architecture and the
    interfaces between the Trademark Clearing House (TMCH) and Domain Name Registries
    as well as between the TMCH and Domain Name Registrars for the provisioning and
    management of domain names during Sunrise and Trademark Claims Periods.</p>"
