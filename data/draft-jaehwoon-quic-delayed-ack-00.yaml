abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft defines a frame type called delayed ack timer. Packet
       transmission time and retransmission time-out (RTO) timer setup
       value are included in the frame. The sender can send the frame
       with the non real-time stream frame within an packet.</p>
