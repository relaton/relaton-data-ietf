  content: |-
    <p>This document describes the ExtendedPartialResponse, an element of
    LDAP v3 protocol which allows multiple responses to LDAP v3 extended
    requests.  Extended partial responses are backward compatible with
    the existing LDAP v3 Extended Operation defined in [LDAPv3].</p>
