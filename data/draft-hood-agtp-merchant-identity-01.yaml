abstract:
- language: en
  script: Latn
  content: "<p>The Agent Transfer Protocol (AGTP) specifies the sending side of an\n   agentic transaction: agent identity, Authority-Scope enforcement,\n   Budget- Limit declaration, and a signed Attribution-Record on every\n   method invocation.  The receiving side of a PURCHASE transaction --\n   the merchant or service provider -- has no equivalent protocol-level\n   identity or verification mechanism.  This is the merchant identity\n   gap.\n\n   This document specifies the AGTP Merchant Identity and Agentic\n   Commerce Binding.  It defines the Merchant Manifest Document, a\n   signed identity record structurally parallel to the Agent Manifest\n   Document; the Merchant Genesis, the origin document from which a\n   merchant's canonical identifier is derived; Merchant Trust Tiers\n   aligned with AGTP Trust Tier semantics; and the protocol integration\n   points at which merchant identity is verified.  These include the\n   PURCHASE method handshake, the DISCOVER method result surface, and\n   the Attribution-Record.  This document also defines the Intent-\n   Assertion header for portable, detached principal- authorized intent,\n   the Cart-Digest mechanism for multi-line-item transactions, and the\n   455 Counterparty Unverified status code.  Together these mechanisms\n   close the verification loop between agent and merchant within AGTP's\n   governance model.\n\n   Version 01 aligns the merchant identity model with AGTP v05.\n   Merchant Trust Tier 1 now supports three equivalent verification\n   paths (dns- anchored, log-anchored, hybrid) matching the base AGTP\n   verification paths, replacing v00's DNS-only Tier 1 requirement.\n   Version 01 also adopts the Agent Genesis taxonomy introduced in\n   [AGTP-LOG]: the merchant origin document is the Merchant Genesis,\n   superseding the \"Merchant Birth Certificate\" terminology in v00.</p>"
