abstract:
- language: en
  script: Latn
  content: "<p>The control word negotiation mechanism specified in RFC4447 has a problem
    when a PE changes the preference for the use of the control word from NOT PREFERRED
    to PREFERRED.  This document updates RFC4447 and RFC6073 by adding the Label Request
    message to resolve this control word negotiation issue for single-segment and
    multi-segment pseudowires.</p>"
