abstract:
- language: en
  script: Latn
  content: "<p>This document details security requirements for 6tisch nodes that use
    6top in an industrial settings. Layer-2 and a layer-4 authentication and authorization
    requirements and assumptions are identified. Two approaches to accomplishing these
    requirements are outlined, with the goal of eventually picking one. This internet-draft
    is intended for later inclusion into the 6tisch architecture document.</p>"
