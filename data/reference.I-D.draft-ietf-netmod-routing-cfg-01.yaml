abstract:
- language: en
  script: Latn
  content: "<p>This document contains a specification of three YANG modules that together
    provide a data model for essential configuration of a routing subsystem.  It is
    expected that this module will serve as a basis for further development of data
    models for individual routing protocols and other related functions.  The present
    data model defines the common building blocks for such configurations - router
    instances, routes, routing tables, routing protocols and route filters.</p>"
