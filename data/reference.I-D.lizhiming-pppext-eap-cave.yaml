abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an Extensible Authentication Protocol (EAP)
    mechanism for authentication and session key distribution using the cdma Universal
    Identity Module (UIM). The mechanism includes network authentication, user anonymity
    support and a re-authentication procedure.</p>"
