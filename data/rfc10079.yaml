abstract:
- language: en
  script: Latn
  content: <p>This document addresses two omissions in the Secure Frame (SFrame) protocol
    specification. First, the definition of the IANA "SFrame Cipher Suites" registry
    in RFC 9605 omits several important fields. This document updates the IANA registry
    by adding those fields and defining the contents of those fields for current entries.
    Second, the Authenticated Encryption with Associated Data (AEAD) construction
    based on AES-CTR and HMAC is defined only for the 128-bit security level. This
    document registers parallel constructions at the 256-bit security level.</p>
