title:
- language: en
  script: Latn
  content: 'Identity Pronouns: A Client-Side Shorthand for ~handle References and
    the Rule That Keeps It Off the Wire'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-morrison-identity-pronouns-06
