  script: Latn
  content: <p>This document describes procedures for Ethernet VPN (EVPN), a BGP MPLS-based
    solution which addresses the requirements specified in the corresponding RFC -
    "Requirements for Ethernet VPN (EVPN)". This document obsoletes RFC7432 (BGP MPLS-Based
    Ethernet VPN) and updates RFC8214 (Virtual Private Wire Service Support in Ethernet
    VPN).</p>
