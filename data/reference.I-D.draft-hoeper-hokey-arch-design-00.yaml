abstract:
- language: en
  script: Latn
  content: "<p>This document describes deployment scenarios of HOKEY architectures
    in the wireless environment.  The design objectives and main components of HOKEY
    architecture are identified, and examples of how the EAP Re-authentication Protocol
    (ERP) can be integrated into a HOKEY architecture are discussed.</p>"
