abstract:
- language: en
  script: Latn
  content: "<p>This document specifies authorization extensions to the Transport Layer
    Security (TLS) Handshake Protocol.  Extensions carried in the client and server
    hello messages to confirm that both parties support the desired authorization
    data types.  Then, if supported by both the client and the server, authorization
    information is exchanged in the supplemental data handshake message.</p>"
