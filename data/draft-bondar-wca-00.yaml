abstract:
- language: en
  script: Latn
  content: "<p>Large Language Model (LLM)-based agent systems increasingly invoke\n   external tools and data sources, yet the epistemic provenance of\n   consumed data remains architecturally unregulated.  Data crossing\n   tool-call boundaries acquires the apparent trustworthiness of the\n   interface rather than reflecting the institutional standing of its\n   actual source -- a phenomenon termed \"semantic laundering.\"\n\n   This document specifies the Warrant Certificate Authority (WCA): an\n   end-to-end cryptographic attestation infrastructure that certifies\n   data sources, not data content.  WCA introduces a provenance layer\n   satisfying reference monitor properties (complete mediation,\n   tamperproofness, verifiability) for all agent-to-tool interactions.\n   The architecture draws on the PKI trust model, OS provenance\n   paradigms (IMA, CamFlow, LPM), and supply-chain security frameworks\n   (SLSA, in-toto).\n\n   This document defines data structures for tool-call attestation,\n   warrant certificates, and a trust hierarchy of certificate\n   authorities.  It specifies the provenance-layer protocol and\n   introduces Warrant Attestation Levels (WAL-0 through WAL-3) as a\n   graduated adoption framework analogous to SLSA build levels.</p>"
