abstract:
- language: en
  script: Latn
  content: "<p>This document defines mechanisms that provide an asynchronous message
    notification delivery service for the Network Configuration protocol (NETCONF).
    \ This is an optional capability built on top of the base NETCONF definition.
    \ This document defines the capabilities and operations necessary to support this
    service.  [STANDARDS-TRACK]</p>"
