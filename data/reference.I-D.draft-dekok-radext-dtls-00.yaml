abstract:
- language: en
  script: Latn
  content: <p>The RADIUS protocol [RFC2865] has limited support for protocol level
    authentication and encryption. RADIUS packets contain attributes sent "in the
    clear", although some attributes can have "hidden" content. Packets may be replayed
    verbatim by an attacker, and the client-server authentication could be better.
    This document proposes DTLS as the solution to these problems, and details how
    this proposal is backwards-compatible wih existing RADIUS solutions.</p>
