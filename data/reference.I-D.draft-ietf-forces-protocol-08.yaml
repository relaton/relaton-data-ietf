abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Forwarding and Control Element Separation
    (ForCES) protocol. ForCES protocol is used for communications between Control
    Elements(CEs) and Forwarding Elements (FEs) in a ForCES Network Element (ForCES
    NE). This specification is intended to meet the ForCES protocol requirements defined
    in RFC3654. Besides the ForCES protocol messages, the specification also defines
    the framework, the mechanisms, and the Transport Mapping Layer (TML) requirements
    for ForCES protocol.</p>"
