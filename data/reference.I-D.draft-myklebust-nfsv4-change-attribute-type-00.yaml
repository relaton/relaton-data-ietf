abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to the NFSv4 protocol that allows
    the server to share information about the implementation of its change attribute
    with the client.  The aim is to improve the client's ability to determine the
    order in which parallel updates to the same file were processed.Keywords</p>"
