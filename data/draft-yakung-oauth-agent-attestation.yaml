abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Agent Credential Attestation Protocol\n   (ACAP), a cryptographic credentialing protocol for autonomous AI\n   agent pipelines.  An ACAP credential is a short-lived JSON Web Token\n   (JWT) signed with RS256 that carries scope-limited permissions\n   together with a SHA-256 hash of the original human instruction that\n   initiated the task.  Credentials may be delegated to child agents;\n   each delegation narrows scope, cannot outlive its parent, increments\n   a delegation depth counter, and extends a tamper-evident chain of\n   token identifiers.  Every lifecycle event is recorded in an append-\n   only, hash-chained audit log.\n\n   This document specifies the credential format, issuance rules,\n   delegation rules, verification algorithm, revocation semantics,\n   human-in-the-loop approval protocol, and audit log structure.</p>"
