abstract:
- language: en
  script: Latn
  content: "<p>It is desirable to operate a server behind a device that does not normally
    permit operating a server, such as a carrier's NAT64, a carrier's NAT44 (including
    the AFTR element described in Dual-Stack Lite).  This document proposes an application-level
    protocol to allow a host to request opening a port in such an upstream device.</p>"
