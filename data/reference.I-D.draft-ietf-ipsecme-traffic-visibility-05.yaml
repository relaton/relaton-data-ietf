abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Wrapped Encapsulating Security Payload
    (WESP) protocol, which builds on top of Encapsulating Security Payload (ESP) [RFC4303]
    and is designed to allow intermediate devices to ascertain if ESP-NULL [RFC2410]
    is being employed and hence inspect the IPsec packets for network monitoring and
    access control functions.  Currently in the IPsec standard, there is no way to
    differentiate between ESP encryption and ESP NULL encryption by simply examining
    a packet. This poses certain challenges to the intermediate devices that need
    to deep inspect the packet before making a decision on what should be done with
    that packet (Inspect and/or Allow/Drop). The mechanism described in this document
    can be used to easily disambiguate ESP-NULL from ESP encrypted packets, without
    compromising on the security provided by ESP.</p>"
