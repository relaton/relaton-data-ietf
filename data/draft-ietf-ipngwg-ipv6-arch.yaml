- language: en
  script: Latn
  content: "<p>This specification defines the addressing architecture of the IP Version
    6 protocol [IPV6]. The document includes the IPv6 addressing model, text representations
    of IPv6 addresses, definition of IPv6 unicast addresses, anycast addresses, and
    multicast addresses, and an IPv6 nodes required addresses.</p>"
