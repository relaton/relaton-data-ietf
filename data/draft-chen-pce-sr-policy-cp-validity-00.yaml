  script: Latn
  content: "<p>[I-D.chen-spring-sr-policy-cp-validity]supplemented candidate path
    validity criterion in [RFC9256]. It defines three validity control parameters
    under candidate Path to control the validity judgment of candidate Path. This
    document defines PCEP extensions for signaling the validity control parameters
    of a candidate path for an SR Policy.</p>"
