abstract:
- language: en
  script: Latn
  content: "<p>An important task of network management is to collect and analyze \nMIB
    information of various object combinations based on the\nSimple Network Management
    Protocol (SNMP) with proper frequency.\nThe purpose of this document is to propose
    two algorithms to retrieve\nMIB information for a large (up to exponential) number
    of managed \nobjects using SNMP in Next Generation Internet (NGI).</p>"
