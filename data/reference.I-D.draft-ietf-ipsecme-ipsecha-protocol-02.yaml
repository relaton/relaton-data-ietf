abstract:
- language: en
  script: Latn
  content: <p>The IPsec protocol suite is widely used for the deployment of virtual
    private networks (VPNs).  In order to make such VPNs highly available, more scalable
    and failure-resistant, these VPNs are implemented as IPsec High Availability (HA)
    clusters.  However there are many issues in IPsec HA clustering, and in particular
    in IKEv2 clustering.  An earlier document, "IPsec Cluster Problem Statement",
    enumerates the issues encountered in the IKEv2/IPsec HA cluster environment.  This
    document attempts to resolve these issues with the least possible change to the
    protocol.  This document proposes an extension to the IKEv2 protocol to solve
    the main issues of "IPsec Cluster Problem Statement" in the commonly deployed
    hot-standby cluster, and provides implementation advice for other issues.  The
    main issues to be solved are the synchronization of IKEv2 Message ID counters,
    and of IPsec Replay Counters.</p>
