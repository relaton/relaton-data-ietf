abstract:
- language: en
  script: Latn
  content: "<p>This document presents the overall framework and key method for Large-scale
    Deterministic Network (LDN). LDN can provide bounded latency and delay variation
    (jitter) without requiring precise time synchronization among nodes, or per-flow
    state in transit nodes.</p>"
