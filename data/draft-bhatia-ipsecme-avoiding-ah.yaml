abstract:
- language: en
  script: Latn
  content: "<p>This document recommends retiring Authentication Header (AH) and discusses
    the reasons for doing so. It recommends that AH must not be used for new applications
    and protocols, since Encapsulating Security Payload (ESP) using NULL encryption
    algorithm provides the same level of security in most real deployments.</p>"
