abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a method and its architecture for proxy DRM
    application based on the PKI environment with X.509 certificate [X.509].  It can
    be a common solution for the proxy DRM application regardless the specific DRM
    standard that is implemented on the interface between the Client Device and Service
    Server.</p>"
