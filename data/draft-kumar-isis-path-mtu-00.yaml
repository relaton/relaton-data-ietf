abstract:
- language: en
  script: Latn
  content: "<p>This draft defines a method for calculating the PMTU for each IPv6
    destinations using ISIS routing protocol. By doing so the overhead incurred in
    the existing path maximum transferable unit discovery mechanism is reduced and
    the same solution can be extended to other link state routing protocols as well.</p>"
