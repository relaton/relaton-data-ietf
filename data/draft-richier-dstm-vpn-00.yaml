abstract:
- language: en
  script: Latn
  content: "<p>In an implicit manner, the specification of DSTM focuses on a scenario
    where DSTM nodes are inside an IPv6-only intranet. This document describes a new
    usage for DSTM in which DSTM nodes are located outside the intranet: the VPN scenario.</p>"
