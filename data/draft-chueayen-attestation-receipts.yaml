abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a compact JSON attestation receipt for an AI
    inference decision. A receipt binds an outcome to a request hash under a published
    Ed25519 public key, so a party that does not trust the issuer's infrastructure
    can still verify offline what the issuer's signing key attested was decided. The
    format is intentionally small and version-selected, so independent verifiers stay
    easy to implement and audit. It is intended for settings where an operator-controlled
    log is not, on its own, sufficient evidence of the decision.</p>"
