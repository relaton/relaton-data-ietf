abstract:
- language: en
  script: Latn
  content: "<p>This document extends RFC 3544 (which extended its predecessor, RFC
    2509) by specifying additional negotiation options to PPP Control Protocols for
    IPv4 and IPv6 (see RFC 1332, RFC 2472). The negotiation options specified in RFC
    2509 defined an all-or-nothing strategy for applying header compression: peers
    were assumed to support compression for any combination of headers. RFC 3544 refined
    that strategy to make it possible to negotiate header compression for only TCP
    or only non-TCP packets. The current document further refines the strategy by
    also making it possible to negotiate header compression for only particular combinations
    of headers or header types.</p>"
