abstract:
- language: en
  script: Latn
  content: "<p>This document defines an authorization policy language for controling
    access to location information. It extends the Common Policy authorization framework
    to provide location-specific access control. More specifically, this document
    defines condition elements specific to location information in order to restrict
    access based on the current location of the Target. Furthermore, it offers location-
    specific transformation elements to reduce the granularity of the returned location
    information.</p>"
