abstract:
- language: en
  script: Latn
  content: "<p>MPLS Network Action (MNA) allows MPLS packet to carry instruction and\n   data for in-network services and functions in an MPLS network.  This\n   document describes the FEC-based optimized operations on the MPLS\n   label stack when the network is mixed with LSRs which are capable or\n   incapable of processing MNAs.</p>"
