abstract:
- language: en
  script: Latn
  content: "<p>The Border Gateway Protocol (BGP) routes traffic solely based on\n   destination IP prefixes.  Source Selective BGP (SSB) introduces an\n   architecture combining BGP and Resource Public Key Infrastructure\n   (RPKI) extensions, which allows prefix holders to cryptographically\n   signal RPKI source authorization policies for their advertised\n   reachability.\n\n   SSB distributes references to these policies via a new BGP path\n   attribute, allowing routing systems to incorporate source-based\n   constraints into local forwarding policies.  Crucially, SSB does not\n   define a source address validation mechanism, mandate packet\n   filtering behavior, or alter fundamental destination-based routing;\n   interpretation remains a matter of local operator policy.  This\n   document provides the overall architectural context and deployment\n   rationale for the SSB protocol suite.</p>"
