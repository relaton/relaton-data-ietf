abstract:
- language: en
  script: Latn
  content: "<p>The Border Gateway Protocol (BGP) routes traffic solely based on destination
    IP prefixes. Source Selective BGP (SSB) introduces an architecture combining BGP
    and Resource Public Key Infrastructure (RPKI) extensions, which allows prefix
    holders to cryptographically signal RPKI source authorization policies for their
    advertised reachability. SSB distributes references to these policies via a new
    BGP path attribute, allowing routing systems to incorporate source-based constraints
    into local forwarding policies. Crucially, SSB does not define a source address
    validation mechanism, mandate packet filtering behavior, or alter fundamental
    destination-based routing; interpretation remains a matter of local operator policy.
    This document provides the overall architectural context and deployment rationale
    for the SSB protocol suite.</p>"
