abstract:
- language: en
  script: Latn
  content: "<p>This document describes a protocol for controlling middleboxes such
    as firewalls and network address translators. It is a fully compliant implementation
    of the MIDCOM semantics described in [RFC3989]. Compared to earlier experimental
    versions of the SIMCO protocol, this version 3 uses binary message encodings in
    order to reduce resource requirements.</p>"
