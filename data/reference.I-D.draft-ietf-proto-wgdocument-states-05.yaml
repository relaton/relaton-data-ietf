abstract:
- language: en
  script: Latn
  content: "<p>The IETF Datatracker tool will be enhanced to make it possible for
    working group chairs to provide more transparency into the status and progression
    of working group documents to authors and other members of the IETF community.
    \ This document defines the states that may be used to describe the status of
    an Internet-Draft (I-D) that is associated with an IETF working group (WG).  The
    first state can be used to describe an I-D that is being considered for adoption
    by a working group, and the last state describes an I-D that has been submitted
    to the IESG.  Appendix A describes states currently used to indicate the status
    of an I-D after it has been sent to the IESG for publication.</p>"
