abstract:
- language: en
  script: Latn
  content: "<p>Packet switching network usually contains links with variable bandwidth,
    e.g., copper, radio, etc. The bandwidth of such link is sensitive to external
    environment. Availability is typically used for describing the link during network
    planning. This document describes an extension for RSVP-TE signaling for setting
    up a LSP in a PSN network which contains variable bandwidth link by introducing
    an optional availability field in RSVP-TE signaling.</p>"
