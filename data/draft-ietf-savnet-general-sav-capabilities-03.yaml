abstract:
- language: en
  script: Latn
  content: "<p>The SAV rules of existing source address validation (SAV) mechanisms
    are derived from other core data structures (e.g., FIB-based uRPF) that are not
    dedicatedly designed for source filtering. Consequently, these mechanisms have
    limitations in deployable scenarios and traffic handling policies. To overcome
    these limitations, this document introduces general SAV capabilities from a data
    plane perspective. How to implement the capabilities and how to generate SAV rules
    are not in the scope of this document.</p>"
