abstract:
- language: en
  script: Latn
  content: "<p>The Datagram Congestion Control Protocol (DCCP) is a transport protocol
    that allows the transmission of congestion-controlled, unreliable datagrams. It
    is intended for applications such as streaming media, Internet telephony, and
    on-line games. In DCCP, an application has a choice of congestion control mechanisms,
    each specified by a Congestion Control Identifier (CCID). This document specifies
    a framework for the use of the Experimental Quick-Start mechanism by DCCP, and
    specific procedures for the use of Quick- Start with DCCP CCID-2 and CCID-3.</p>"
