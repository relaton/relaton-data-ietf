- language: en
  script: Latn
  content: "<p>This document argues for moving away from specific language conventions
    used by RFC authors and RFC Editors in order to encourage inclusive terminology
    in the ongoing RFC series. The document also provides examples of inclusive terminology
    as precise alternatives for these conventions.</p>"
