abstract:
- language: en
  script: Latn
  content: "<p>This document defines a governance framework for systems that use\n   artificial intelligence (AI) services, specifically large language\n   models (LLMs), to autonomously detect, diagnose, and remediate\n   operational anomalies on network devices.  As AI-driven automation\n   moves from advisory tooling to closed-loop autonomous operation on\n   production infrastructure, the industry lacks a common set of\n   principles governing what such systems may and may not do.\n\n   This framework establishes thirteen governance areas covering\n   human authority, harm prevention, management plane protection,\n   minimum necessary action, bounded autonomy, transparency,\n   reversibility, graceful degradation, escalation, AI-specific\n   constraints, startup safety, absolute prohibitions, and review\n   processes.  It is intended to serve as a reference architecture\n   for implementers building AI-mediated network management systems\n   and for operators evaluating the safety properties of such systems.</p>"
