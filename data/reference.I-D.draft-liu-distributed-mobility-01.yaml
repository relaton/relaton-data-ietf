abstract:
- language: en
  script: Latn
  content: "<p>Current mobility solutions normally introduce an anchor point in the
    network, eg HA in MIPv6, LMA in PMIPv6, GGSN in 3GPP.  The anchor point is used
    to maintain the mapping between the stable IP address (eg Home address in MIPv6)
    and the current routable IP address (eg CoA in MIPv6).  In the hierarchical architecture,
    since the anchor point normally locates in the top of the hierarchical architecture,
    there will no scalability issue.  But in the more flat architecture, the anchor
    point will be much lower compared with hierarchical architecture; this will introduce
    some issues if traditionally mobility protocol is used.</p>"
