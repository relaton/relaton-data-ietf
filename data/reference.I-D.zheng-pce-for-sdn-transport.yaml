abstract:
- language: en
  script: Latn
  content: "<p>This draft describes PCE architecture and protocol in SDN-based transport
    network. It is demonstrated that PCE can fit in the transport SDN architecture
    and complete corresponding requests. The PCE and its protocol can satisfy the
    functional requirement in several transport SDN applications.</p>"
