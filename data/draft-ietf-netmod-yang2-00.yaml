abstract:
- language: en
  script: Latn
  content: "<p>YANG is a data modeling language used to model configuration data,
    state data, Remote Procedure Calls, and notifications for network management protocols.
    This document describes the syntax and semantics of version 2.0 of the YANG language.
    YANG version 2.0 is a major release of the YANG language, addressing issues found
    in the original specification.</p>"
