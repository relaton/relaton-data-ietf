abstract:
- language: en
  script: Latn
  content: "<p>This document updates the session matching procedure defined in sections
    5.4 and 7.3 of RFC 4975, so that an Message Session Relay Protocol (MSRP) User
    Agent (UA) only uses the session-id part of the MSRP URI in order to perform the
    consistency checks.  The update allows intermediaries, Application Layer Gateways
    (ALGs), to modify the address information in the MSRP URI of the Session Description
    Protocol (SDP) a=path attribute, without the need for the intermediaries to terminate
    and do the correlating modifications in the associated MSRP messages.</p>"
