abstract:
- language: en
  script: Latn
  content: "<p>It is useful for routers in an IS-IS domain to know of the capabilities
    of their neighbors, and/or of other routers in the domain. This draft proposes
    extensions to IS-IS for advertising optional router capabilities. In particular
    it defines an optional Router Capability TLV for IS-IS.</p>"
