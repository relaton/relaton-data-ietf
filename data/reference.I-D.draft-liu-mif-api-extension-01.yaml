abstract:
- language: en
  script: Latn
  content: "<p>The Socket API is the de facto standard of network API for many UNIX-
    like and non-UNIX OSes. Many APIs that are exported to the user space is either
    direct use or encapsulates the Socket API. The Socket API has been extended to
    support IPv6. Recently, multiple interfaces or multiple connection capable devices
    become more and more common. But due to the limitation of the default route of
    the host and other issues such as DNS selection etc prevent the utilization of
    multiple interfaces/connections benefit. Moreover, there is no API level support
    for the application developer to utilize the benefit of the host's multiple interfaces/connections.
    Starting with the requirement of MIF API extension, this document introduces a
    new set of APIs to support multiple interfaces/connections.</p>"
