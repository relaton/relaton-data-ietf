- language: en
  script: Latn
  content: "<p>This document describes the conventions for using ChaCha20-Poly1305
    Authenticated Encryption in the Cryptographic Message Syntax (CMS). ChaCha20-Poly1305
    is an authenticated encryption algorithm constructed of the ChaCha stream cipher
    and Poly1305 authenticator.</p>"
