abstract:
- language: en
  script: Latn
  content: "<p>This draft describes requirements to measure end-to-end qualities of
    tunnels passively and to monitor them via Simple Network Management Protocol (SNMP)
    [1]. This feature is necessary for Service Providers (SPs), especially, who provide
    transports to users using tunnels. In addition, the draft shows an example to
    measure Generic Routing Encapsulation (GRE) [2] [3] tunnels.</p>"
