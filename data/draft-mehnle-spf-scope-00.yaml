  script: Latn
  content: <p>This document defines a new modifier for the SPF e-mail authentication
    protocol allowing the SPF record for a domain to be declared as being applicable
    to message identities other than the MAIL FROM identity, such as the "From" or
    "Sender" message header identities.</p>
