abstract:
- language: en
  script: Latn
  content: |-
    <p>The assurances provided by Oblivious HTTP depend on the client's
       ability to verify that it is using the same Request Resource and
       KeyConfig as many other users.  This specification defines a protocol
       to enable this verification.</p>
