abstract:
- language: en
  script: Latn
  content: "<p>It is the consensus of the IETF that IETF protocols be designed to
    avoid privacy violations to the extent possible.  This document establishes a
    number of protocol design choices as Best Current Practices for the purpose of
    avoiding such violations.</p>"
