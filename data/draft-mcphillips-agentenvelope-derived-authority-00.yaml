abstract:
- language: en
  script: Latn
  content: "<p>AgentEnvelope defines a deterministic derived-authority model for autonomous
    and action-performing systems. Instead of issuing bearer credentials or authorization
    envelopes from a central authority, AgentEnvelope derives scoped action capabilities
    from customer-held custody material and canonical action envelopes. A verifier
    can check an action signature against a public action record without receiving
    roots, seeds, private keys, or hosted service access. This document specifies
    the v1 derivation model, signing domains, public record structure, mint delegation
    flow, verification rules, and security considerations.</p>"
