abstract:
- language: en
  script: Latn
  content: "<p>It is a common practice for multiple interfaces terminals to leverage
    on a connection manager to perform provisioning domain selection. Problem statement
    document highlighted that lack of standardized behavior for connection managers
    can bring specific issues in a MIF context.  To address this issue, this document
    proposes a set of functional requirements for a generic MIF connection manager.</p>"
