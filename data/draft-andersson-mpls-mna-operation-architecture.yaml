abstract:
- language: en
  script: Latn
  content: "<p>MPLS Network Action (MNA) allows MPLS packet to carry instruction and\n   data for in-network services and functions in an MPLS network.  This\n   document describes the network operations to support MNAs and what\n   actions an MNA capable Label Switching Router (LSR) takes when MNA is\n   present or absent in an packet.</p>"
