abstract:
- language: en
  script: Latn
  content: <p>[I-D.draft-ietf-dnsop-domain-verification-techniques] describes best
    practices for using the DNS to verify ownership or control of a domain, a process
    generally referred to as "Domain Control Validation". This document is a companion
    survey that catalogs the DNS-based Domain Control Validation techniques in use
    today across a range of Application Service Providers and protocols.</p>
