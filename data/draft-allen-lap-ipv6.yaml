abstract:
- language: en
  script: Latn
  content: "<p>This document discusses how Large Access Providers (LAP) could use
    \nIPv6 to solve current technical challenges.  In particular, IPv6’s \nlarge address
    space and optional header mechanism can be used to \nprovide scalable and manageable
    broadband Internet access and \nVirtual Private Network (VPN) services.  A new
    optional header to \nsupport forwarding-plane based VPNs is proposed.</p>"
