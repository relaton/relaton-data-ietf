abstract:
- language: en
  script: Latn
  content: "<p>This document describes two(2) an extension to the current diameter
    routing scheme. The first extension describes a strict source routing mechanism
    that MAY be employed by Diameter nodes to allow stateful Diameter proxies to remain
    in the path of all messages exchanges constituting a Diameter session. The second
    extension describes the a realm based redirection scheme as an alternative to
    host based redirection descrbied in [RFC3588].</p>"
