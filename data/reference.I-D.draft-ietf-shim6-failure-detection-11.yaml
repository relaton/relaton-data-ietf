abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how the level 3 multihoming shim protocol (SHIM6)
    detects failures between two communicating hosts.  It also specifies an exploration
    protocol for switching to another pair of interfaces and/or addresses between
    the same hosts if a failure occurs and an operational pair can be found.</p>"
