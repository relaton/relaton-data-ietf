abstract:
- language: en
  script: Latn
  content: "<p>BGP specification [RFC4271] prescribes 'BGP next-hop reachability'
    as one of the key 'Route Resolvability Condition' that must be satisfied before
    the BGP bestpath candidate selection. This condition, however, may not be sufficient
    (as explained in the Appendix section) and desire further granularity.</p>"
