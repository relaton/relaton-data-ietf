abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension to the DHCP protocols that allows
    a relay agent to use any available source port for upstream communications, and
    to include a DHCP option that can be used to statelessly route responses back
    to the appropriate source port on downstream communications.</p>"
