abstract:
- language: en
  script: Latn
  content: "<p>The Prefix Pool option provides an automatic mechanism for the information
    exchange between DHCPv6 server and DHCPv6 Relay Agent. The information about Prefix
    Pools maintained on DHCPv6 server can be transferred from server to relay agent
    through this DHCPv6 option to support the necessary route aggregation on the provide
    edge router, which has a huge number of routes pointing to the customer networks
    before the aggregation.</p>"
