- language: en
  script: Latn
  content: "<p>This memo proposes a supplement to existing draft, RTP payload Format
    for SVC Video. One new application, Multi-Screen is added. SVC is very suitable
    for Multi-Screen application, which has some different characteristics from the
    existing applications in the current draft. This proposal provides a paradigm
