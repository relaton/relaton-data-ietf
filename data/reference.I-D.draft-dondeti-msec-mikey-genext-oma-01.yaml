abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new General Extension payload type for use
    in the Open Mobile Alliance's (OMA) Browser and Content (BAC) Broadcast (BCAST)
    group. OMA BCAST's service and content protection specification uses short term
    key message (STKM) and long term key message (LTKM) payloads that in certain broadcast
    distribution systems (BDS) are carried in the IETF MIKEY protocol [1]. A new MIKEY
    General Extension payload specified in this document will be used for that purpose.</p>"
