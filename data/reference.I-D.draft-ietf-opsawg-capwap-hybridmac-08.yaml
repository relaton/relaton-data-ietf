abstract:
- language: en
  script: Latn
  content: "<p>The CAPWAP protocol binding for IEEE 802.11 defines two MAC (Medium
    Access Control) modes for IEEE 802.11 WTP (Wireless Transmission Point): Split
    and Local MAC.  In the Split MAC mode, the partitioning of encryption/decryption
    functions are not clearly defined.  In the Split MAC mode description, IEEE 802.11
    encryption is specified as located in either the AC (Access Controller) or the
    WTP, with no clear way for the AC to inform the WTP of where the encryption functionality
    should be located.  This leads to interoperability issues, especially when the
    AC and WTP come from different vendors. To prevent interoperability issues, this
    specification defines an IEEE 802.11 MAC profile message element in which each
    profile specifies an unambiguous division of encryption functionality between
    the WTP and AC.</p>"
