abstract:
- language: en
  script: Latn
  content: "<p>The IPv6 addressing architecture specifies global and local-use unicast
    addressing schemes. Recent consensus call in the IPng working group has deprecated
    site-local addressing due in part to its inherent ambiguity. This document outlines
    requirements for use in evaluating candidate proposals for a replacement scheme.</p>"
