- language: en
  script: Latn
  content: "<p>This document provides a framework for Service Level Specification
    and Usage. It provides the terminology used within this context and gives an architectural
    description of how and where Service Levels can be negotiated. It further provides
    a introductory section on known efforts in research and industry on building a
    service framework on the grounds of a diffserv enabled network.</p>"
