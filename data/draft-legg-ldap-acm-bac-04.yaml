- language: en
  script: Latn
  content: |-
    <p>An access control scheme describes the means by which access to
       directory information, and potentially to access rights themselves,
       may be controlled.  This document adapts the X.500 directory Basic
       Access Control and Simplied Access Control schemes for use by the
       Lightweight Directory Access Protocol (LDAP).</p>
