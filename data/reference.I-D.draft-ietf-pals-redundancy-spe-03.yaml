abstract:
- language: en
  script: Latn
  content: "<p>This document describes Multi-Segment Pseudowire (MS-PW) protection
    scenarios in which the pseudowire redundancy is provided on the Switching Provider
    Edge (S-PE) defined in RFC 5659.  Operations of the S-PEs which provide PW redundancy
    are specified in this document. Signaling of the Preferential Forwarding status
    as defined in RFC 6870 and RFC 6478 is reused.  This document does not require
    any change to the Terminating Provider Edges (T-PEs) of MS-PW.</p>"
