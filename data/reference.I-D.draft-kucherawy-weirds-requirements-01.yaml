abstract:
- language: en
  script: Latn
  content: "<p>This document enumerates a base set of requirements that should be
    included in any system that provides registration information for Internet entities,
    be they network assignments or domain name assignments.  Some of these, in turn,
    will define requirements for registrars; this, however, is an issue outside of
    the scope of this document.</p>"
