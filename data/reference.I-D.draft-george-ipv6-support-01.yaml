abstract:
- language: en
  script: Latn
  content: "<p>This document recommends that IETF formally require its standards work
    to be IP version agnostic or to explicitly include support for IPv6, with some
    exceptions.  It recommends that future IPv4 work be limited to solving documented
    operational problems identified through deployment experience.</p>"
