abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Network Time Security (NTS) protocol that
    enables secure time synchronization with time servers using Network Time Protocol
    (NTP) or Precision Time Protocol (PTP). Its design considers the special requirements
    of precise timekeeping, which are described in Security Requirements of Time Protocols
    in Packet Switched Networks [RFC7384].</p>"
