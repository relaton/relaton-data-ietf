abstract:
- language: en
  script: Latn
  content: "<p>The Routing Protocol for Low-Power and Lossy Networks (RPL) (RFC 6550)
    enables data packet routing along a Destination-Oriented Directed Acyclic Graph
    (DODAG).  However, the default route establishment mechanism relies on hop-by-hop
    forwarding along the DODAG, which may not always provide optimal routing efficiency.
    \ This document introduces the concept of Destination Advertisement Object (DAO)
    Projection, a mechanism that allows a RPL Root or an external controller to install
    optimized routes within the RPL domain.  DAO Projections enable the creation of
    optimized unicast or multicast routes that do not strictly follow the DODAG structure,
    thereby improving routing efficiency, reliability, availability, and resource
    utilization in the RPL domain.  This document specifies two types of Projected
    Routes (P-Routes) -- Storing Mode and Non-Storing Mode -- and outlines the signaling
    procedures necessary to establish, maintain, and remove these routes.  This document
    updates RFCs 6550, 6553, and 8138.</p>"
