abstract:
- language: en
  script: Latn
  content: "<p>This document analyses the main issues related to IPv4 Internet access
    in the context of public IPv4 address exhaustion.  It would be valuable to assess
    IPv4 address shortage solutions with all these issues, to check to what degree
    they are concerned, how they handle each issue, and to what extent they resolve
    the pending problems.</p>"
