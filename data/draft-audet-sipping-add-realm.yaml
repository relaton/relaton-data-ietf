abstract:
- language: en
  script: Latn
  content: "<p>This draft describes the use of an explicit addressing identifier \nSDP
    attribute to assist in the process of choosing which addresses \nshall be used
    by SIP User Agents (UAs) when multiple IP addresses \nare known (STUN-derived,
    local, etc.). This draft complements the \nInteractive Connectivity Establishment
    (ICE) draft.</p>"
