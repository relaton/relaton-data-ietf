abstract:
- language: en
  script: Latn
  content: "<p>The Mobile IPv6 bootstrapping problem statement describes two main
    scenarios. In the first scenario (i.e. the split scenario), the mobile node's
    mobility service is authorized by a different service authorizer than the basic
    network access authorizer. In the second scenario (i.e. the integrated scenario),
    the mobile node's mobility service is authorized by the same service authorizer
    as the basic network access service authorizer. This document defines a method
    for home agent information discovery for the integrated scenario.</p>"
