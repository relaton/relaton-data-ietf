abstract:
- language: en
  script: Latn
  content: "<p>This document defines updates to the Session Initiation Protocol (SIP)
    to add mutual authentication to proxy authentication.  The Proxy-Authentication-Info
    header, which allows a UA to authenticate a proxy when challenged, is not defined
    in SIP ([RFC 3261]). Supporting mutual proxy authentication in SIP would mitigate
    certain risks in using SIP Digest proxy authentication.</p>"
