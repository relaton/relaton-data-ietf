abstract:
- language: en
  script: Latn
  content: "<p>In order to provide an end-to-end MPLS TE LSP between customer sites
    within a BGP/MPLS IP-VPN, it is highly desirable for a Path Computation Element
    (PCE) to be able to dynamically discover a set of Path Computation Elements (PCEs)
    that know VPN routes. In BGP/MPLS IP-VPNs, it is advantageous to use BGP to distribute
    PCE information. This document defines a new attribute and describes how PCE information
    can be carried using BGP.</p>"
