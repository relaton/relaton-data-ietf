abstract:
- language: en
  script: Latn
  content: "<p>As DDoS attack evolves rapidly in the aspect of volume and sophistication,
    cooperation among operators for sharing the capacity of the protection system
    to cope with it becomes very necessary. This document describes some possible
    solutions to the cooperative inter-domain DOTS problems.</p>"
