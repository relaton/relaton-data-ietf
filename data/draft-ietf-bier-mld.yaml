title:
- language: en
  script: Latn
  content: BIER Ingress Multicast Flow Overlay using Multicast Listener Discovery Protocols
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-bier-mld-08
docidentifier:
- content: draft-ietf-bier-mld
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2023-07-02'
abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the ingress part of a multicast flow overlay\n   for BIER networks.  Using existing multicast listener discovery\n   protocols, it enables multicast membership information sharing from\n   egress routers, acting as listeners, toward ingress routers, acting\n   as queriers.  Ingress routers keep per-egress-router state, used to\n   construct the BIER bit mask associated with IP multicast packets\n   entering the BIER domain.</p>"
