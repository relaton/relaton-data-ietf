abstract:
- language: en
  script: Latn
  content: "<p>This memo addresses cookies security by introduction of an additional
    constraints, web application designer may impose on cookie availability for localhost
    applications components. Here proposed new cookie attribute attempts to provide
    that missing functionality while retaining all currently known use scenarios of
    cookies. However, this new attribute is designed to be more useful for banking
    applications, then for social media networks.</p>"
