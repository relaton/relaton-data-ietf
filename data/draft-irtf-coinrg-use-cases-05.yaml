abstract:
- language: en
  script: Latn
  content: "<p>Computing in the Network (COIN) comes with the prospect of deploying
    processing functionality on networking devices, such as switches and network interface
    cards. While such functionality can be beneficial, it has to be carefully placed
    into the context of the general Internet communication and it needs to be clearly
    identified where and how those benefits apply. This document presents some use
    cases to demonstrate how a number of salient COIN-related applications can benefit
    from COIN. Furthermore, to guide research on COIN, it further identifies essential
    research questions and outlines desirable capabilities that COIN systems addressing
    the use cases may need to support. It is a product of the Computing in the Network
    Research Group (COINRG). It is not an IETF product and it is not a standard.</p>"
  format: text/html
