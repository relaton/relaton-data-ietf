abstract:
- language: en
  script: Latn
  content: "<p>DNSSEC hardens the DNS from the root server to the recursive resolver.
    \ It does not secure the communications between the stub resolver and the recursive
    resolver.  This document specifies the mechanism which deals with securing the
    communications between them.</p>"
