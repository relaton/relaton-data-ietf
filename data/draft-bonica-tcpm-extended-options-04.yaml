abstract:
- language: en
  script: Latn
  content: |-
    <p>A TCP header accommodates only 40 octets of TCP options.  In the
       future, applications may require more than 40 octets of TCP options.
       For example, an application may require a TCP Authentication Option
       (TCP-AO) with a 384-bit MAC.  This option requires 52 octets of
       option space.

       This document defines a TCP extension that accommodates up to 1,016
       octets of TCP options while maintaining backward compatibility with
       legacy implementations.</p>
