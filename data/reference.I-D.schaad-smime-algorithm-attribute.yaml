abstract:
- language: en
  script: Latn
  content: "<p>The Cryptographic Message Syntax (CMS) unlike X.509/PKIX certificates,
    are venerable to algorithm substitution attacks.  In an algorithm substitution
    attack, the attacker changes either the algorithm being used or parameters of
    the algorithm in order to change the result of a signature verification process.
    \ In X.509 certificates, the signature algorithm is protected because it is duplicated
    in the TBSCertificate.signature field with the proviso that the validater is to
    compare both fields as part of the signature validation process.  This document
    defines a new attribute that contains a copy of the relevant algorithm identifiers
    so that they are protected by the signature or authentication process.</p>"
