abstract:
- language: en
  script: Latn
  content: "<p>This document presents a network coding approach that allows coding
    decisions to be based on the instantaneous conditions at the network nodes.  It
    uses dynamic rates and coefficients to constantly adapt to local conditions and
    to allow for provider and application differentiation.</p>"
