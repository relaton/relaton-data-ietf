abstract:
- language: en
  script: Latn
  content: "<p>Mobile Ad-hoc Networks (MANETs) connect routers on links with asymmetric
    reachability characteristics, and may also connect to other networks including
    the Internet.  Routers in MANETs must have a way to automatically provision IP
    addresses/prefixes and other information.  This document specifies a Virtual Ethernet
    (VET) abstraction for autoconfiguration of routers in MANETs.</p>"
