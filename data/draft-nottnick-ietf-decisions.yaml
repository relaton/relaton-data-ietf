  content: "<p>This document specifies Best Current Practice for making decisions in\n   IETF Working Groups.\n\n   It updates Section 3.3 of [RFC2418].\n\nAbout This Document\n\n   This note is to be removed before publishing as an RFC.\n\n   Status information for this document may be found at\n   https://datatracker.ietf.org/doc/draft-nottnick-ietf-decisions/.\n\n   information can be found at https://projects.mnot.net/I-D/.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/mnot/I-D/labels/ietf-decisions.</p>"
