abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism for a root node to discover the
    leaf nodes of an mLDP based P2MP/MP2MP LSP.  Such kind of function can then be
    used for multiplexing/aggregating various applications relying on mLDP as the
    P2MP/MP2MP LSP setup.  Examples of such applications are P2MP PW [I-D.draft-martini-pwe3-p2mp-pw],
    VPLS multicast [I-D.draft-ietf-l2vpn-vpls-mcast], L3VPN multicast [I-D.draft-ietf-l3vpn-2547bis-mcast].</p>"
