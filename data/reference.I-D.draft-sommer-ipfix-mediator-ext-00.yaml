abstract:
- language: en
  script: Latn
  content: "<p>IPFIX supports the concept of an Mediator, a device that receives,
    transforms, and exports data streams using IPFIX.  One of the most important requirements
    is the reduction of the volume of IPFIX traffic by discarding and aggregating
    received information.  This document introduces a number of extensions to the
    IPFIX Protocol and IPFIX Information Model that support the export of aggregated
    IPFIX data.  In particular, techniques are introduced that optimize the transport
    of descriptive information.  Thus, more information can be preserved in the transmission
    while further reducing both the number and the size of IPFIX messages.  All the
    proposed extensions are directly applicable to the IPFIX Mediator but can be used
    in many different applications as well.</p>"
