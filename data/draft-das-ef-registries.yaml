title:
- language: en
  script: Latn
  content: 'Illustrative Codes Are Not a Namespace: Registries for Execution-Finality Consequence Classes, Sink Types, Act Types, Failure Codes, Profiles, and Media Types'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-das-ef-registries-00
