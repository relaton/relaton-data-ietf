abstract:
- language: en
  script: Latn
  content: "<p>[RFC7854], [RFC8671] and [I-D.ietf-grow-bmp-bgp-rib-stats] define different
    BGP Monitoring Protocol (BMP) statistics message types to observe events that
    occur on a monitored router. This document defines some additional statistics
    type to monitor BMP Adj-RIB-In, Loc-RIB and Adj-RIB-Out Routing Information Bases
    (RIBs).</p>"
