abstract:
- language: en
  script: Latn
  content: <p>This document introduces a simple mechanism which enables a host using
    IPv6 cryptographically generated address to delegate the task of secure neighbor
    discovery proxying to another node by means of establishing a "symbiotic" relationship
    with that node.</p>
