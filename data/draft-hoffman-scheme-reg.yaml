- language: en
  script: Latn
  content: "<p>This document revises the registration procedures given in RFC 2717
    based on five years of experience. It simplifies the requirements for getting
    a scheme listed by IANA by removing the technical review and allowing multiple
    registrants to share a scheme name.</p>"
