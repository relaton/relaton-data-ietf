abstract:
- language: en
  script: Latn
  content: "<p>This document provides advice to network operators about deployment
    of two techniques for automatic tunneling of IPv6 over IPv4, namely 6to4 and Teredo.
    \ It is principally addressed to Internet Service Providers, including those that
    do not yet support IPv6, and to Content Providers.  The intention of the advice
    is to minimise both user dissatisfaction and help desk calls.</p>"
