abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Network Hiding Protocol (NHP) Extensions\n   for 5G/6G Service-Based Architectures (NHP-SBA), a normative protocol\n   for zero-trust control-plane communication in autonomous 5G/6G\n   network infrastructures.  NHP-SBA defines a cryptographically\n   authenticated control-plane signaling framework that enforces an\n   Authenticated-before-Connect principle: no network endpoint shall be\n   reachable, discoverable, or accessible until the requesting entity\n   has been cryptographically authenticated and its operational intent\n   has been explicitly authorized.  The protocol integrates the Network\n   infrastructure Hiding Protocol (NHP) as its primary knock-and-tunnel\n   mechanism, leveraging the Noise Protocol Framework with Curve25519\n   Diffie-Hellman key exchange, ChaCha20-Poly1305 AEAD encryption, and\n   HKDF-SHA-256 key derivation to establish ephemeral, intent-scoped\n   micro-tunnels between authenticated agents and authorized network\n   services.\n\n   NHP-SBA introduces NHP-NRS as an intent-driven naming resolution\n   service that replaces conventional DNS lookups with FlatBuffers-\n   serialized query tuples, binding resolution responses to\n   authenticated intent declarations rather than returning raw IP\n   addresses.  NHP-NRS queries carry explicit intent classification,\n   impact scope declarations, and operational context, enabling the\n   resolution infrastructure to enforce policy-driven access control at\n   the naming layer itself.  Interoperability with 3GPP Service-Based\n   Architecture (SBA) is achieved through HTTP/2 Custom Frame\n   Extensions, where NHP-SBA Policy Enforcement Points transfer binary\n   FlatBuffers tokens to mediate Network Function invocations.\n\n   This revised specification includes a comprehensive scientific review\n   identifying architectural weaknesses, protocol gaps, and missing\n   validation methodology.  It adds mandatory sections on threat\n   modeling, security analysis, formal verification considerations,\n   performance evaluation methodology, and an experimental validation\n   framework for FR3 (7-24 GHz) phase-coherent SDR platforms using USRP\n   X440 and TMYTEK UD Box 0630 hardware.  The document also introduces\n   deployment models and a future standardization roadmap, addressing\n   interoperability readiness and providing implementation guidance for\n   5G/6G vendors and operators.</p>"
