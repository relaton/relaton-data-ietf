- language: en
  script: Latn
  content: "<p>The Extensible Authentication Protocol (EAP) is a PPP extension that
    provides support for additional authentication methods within PPP. This document
    describes how EAP can be carried within the DIAMETER protocol to provide end to
    end authentication.</p>"
