abstract:
- language: en
  script: Latn
  content: "<p>This document describes the scenarios, simulation and suggestions for
    PCE in native IP network, which integrates the merit of distributed protocols
    (IGP/BGP), and the power of centrally control technologies (PCE/SDN) to provide
    one feasible traffic engineering solution in various complex scenarios for the
    service provider.</p>"
