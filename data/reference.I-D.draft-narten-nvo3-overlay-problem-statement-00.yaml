abstract:
- language: en
  script: Latn
  content: "<p>This document lays out the case for developing L3 overlays to provide
    network virtualization.  In addition, the document describes what issues need
    to be resolved in order to produce an interoperable standard.  The goal is lead
    to scalable, interoperable implementations of virtualization overlays based on
    standardized encapsulation methods and control plane approaches.</p>"
