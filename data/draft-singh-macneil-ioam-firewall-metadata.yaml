abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new IOAM Namespace and associated Data Fields\n   for carrying firewall and security-related metadata within the In-\n   situ Operations, Administration, and Maintenance (IOAM) framework\n   (RFC 9197).  The mechanism allows each security Enforcement Point on\n   a path to attach a verifiable attestation of the action it took on a\n   packet.  This lets downstream Enforcement Points and other nodes\n   confirm that security policy was actually executed on the data path\n   -- detecting policy bypasses and detecting divergence between\n   Enforcement Points that are expected to agree -- while each\n   Enforcement Point continues to apply its own policy independently\n   rather than delegating enforcement.  This validation of execution\n   complements the management plane's validation of intent.  The\n   metadata also enables real-time signaling of policer states for DDoS\n   mitigation.  To ensure the authenticity and integrity of this\n   information, this document leverages the integrity protection\n   mechanisms defined in the IOAM data integrity specification (draft-\n   ietf-ippm-ioam-data-integrity).</p>"
