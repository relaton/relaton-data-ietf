abstract:
- language: en
  script: Latn
  content: "<p>Cellular data networks which are based on 3GPP standards use the concept
    of Access Point Name.  A mobile node which attaches via a 3GPP access network
    indicates thru layer 2 signaling the access point name to which connectivity is
    desired.  This document specifies a DHCP option which enables the mobile node
    to request the access point name in DHCP messages.  A mobile node whose mobility
    is managed by the network using Proxy Mobile IPv6 protocol may perform a handover
    from one access technology to another.  A DHCP option which enables the host to
    indicate if the attachment via the new interface is a handover or another connction
    is also specified.</p>"
