abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Transport Layer Security (TLS) extension
    for negotiating application-layer protocol settings (ALPS) within the TLS handshake.
    Any application-layer protocol operating over TLS can use this mechanism to indicate
    its settings to the peer in parallel with the TLS handshake completion.</p>"
