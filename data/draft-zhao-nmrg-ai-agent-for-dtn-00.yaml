abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an AI agent architecture for Digital Twin Network
    (DTN) that integrates AI agents with digital twin technology. The architecture
    extends the traditional DTN architecture by incorporating autonomous AI agents
    at each component level, enabling more intelligent and adaptive network management
    capabilities.</p>"
