  script: Latn
  content: "<p>This document describes a procedure for the configuration of the pseudowire
    (PW) virtual circuit connectivity verification (VCCV) Bidirectional Forwarding
    Detection (BFD) OAM mechanism through LDP extensions.  As the other MPLS-TP PW
    OAM functionalities develop, the procedure may be changed to cover them.</p>"
