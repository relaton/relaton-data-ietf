abstract:
- language: en
  script: Latn
  content: "<p>This document defines simple additions to the Link Management Protocol
    (LMP) to provide a control plane tool that can assist in the location of stranded
    resources by allowing adjacent Label- Switching Routers (LSRs) to confirm data
    channel statuses, and provides triggers for notifying the management plane if
    any discrepancies are found. As LMP is already used to verify data plane  Li  Expires
    June 2010  [page 1]  draft-ietf-ccamp-confirm-data-channel-status-09.txt  December
    2009  connectivity, it is considered to be an appropriate candidate to support
    this feature.</p>"
