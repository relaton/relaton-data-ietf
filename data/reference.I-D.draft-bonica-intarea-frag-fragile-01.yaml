abstract:
- language: en
  script: Latn
  content: "<p>This document provides an overview of IP fragmentation.  It explains
    how IP fragmentation works and why it is required.  As part of that explanation,
    this document also explains how IP fragmentation reduces the reliability of Internet
    communication.  This document also proposes alternatives to IP fragmentation.
    Finally, it provides recommendations for application developers and network operators.</p>"
