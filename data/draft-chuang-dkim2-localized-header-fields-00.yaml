abstract:
- language: en
  script: Latn
  content: "<p>The DKIM2 specification authenticates email messages with digital signatures,
    with additional metadata to recover the signature even when the message is forwarded
    and modified. This draft builds upon DKIM2 to support hashing and authentication
    of domain specific headers even when the message is forwarded and modified. Other
    trace-like headers may be supported as well. Authentication-Result header fields
    support documentation of authentication results as seen by receivers during the
    forwarding path. Receivers often delete older copies of Authentication-Results
    even though they may have forensic value. This draft provides a means to preserve
    those header fields despite those receiver actions.</p>"
