abstract:
- language: en
  script: Latn
  content: "<p>The DKIM2 specification authenticates email messages with digital\n   signatures, with additional metadata to recover the signature even\n   when the message is forwarded and modified.  This draft builds upon\n   DKIM2 to support hashing and authentication of domain specific\n   headers even when the message is forwarded and modified.  Other\n   trace-like headers may be supported as well.  Authentication-Result\n   header fields support documentation of authentication results as seen\n   by receivers during the forwarding path.  Receivers often delete\n   older copies of Authentication-Results even though they may have\n   forensic value.  This draft provides a means to preserve those header\n   fields despite those receiver actions.</p>"
