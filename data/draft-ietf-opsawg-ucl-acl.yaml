  content: draft-ietf-opsawg-ucl-acl
title:
- language: en
  script: Latn
  content: A YANG Data Model and RADIUS Extension for Policy-Based Network Access Control
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-opsawg-ucl-acl-15
docidentifier:
- content: draft-ietf-opsawg-ucl-acl
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-04-01'
abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model for policy-based network\n   access control, which provides enforcement of network access control\n   policies based on group identity.  This YANG data model extends\n   Access Control Lists (ACLs) with date and time parameters to support\n   schedule-aware policy enforcement.\n\n   Specifically in scenarios where network access is triggered by user\n   authentication, this document defines a mechanism to ease the\n   maintenance of the mapping between a user group identifier and a set\n   of packet header fields to enforce policy-based network access\n   control.  Moreover, the document defines a Remote Authentication\n   Dial-in User Service (RADIUS) attribute that is used to communicate\n   the user group identifier as part of identification and authorization\n   information.</p>"
