abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Cognition-Oriented Emergence (COE)\n   protocol, a lightweight, minimalist, narrow-waist cognitive\n   interaction protocol.  COE provides a unified \"cognitive interaction\n   layer\" for the fragmented ecosystem of world models.  Through four\n   core primitives -- Judge (J), Delegate (D), Terminate (T), and\n   Verify (V) -- COE enables heterogeneous world models and AI agents\n   to reach verifiable consensus on shared world states within a\n   traceable, auditable, and evolvable framework.\n\n   Unlike JEP, which focuses on \"accountability tracing\" (post-hoc\n   audit), COE focuses on \"cognitive consensus\" (ex-ante / in-situ\n   collaboration).  COE does not depend on any specific world model\n   implementation; instead, it serves as a common \"trust operating\n   system\" and \"collaboration grammar\" for them.  JEP answers \"who is\n   responsible,\" and COE answers \"what the world is\" -- both share the\n   J/D/T/V primitive gene, forming a complete \"cognition‑accountability\"\n   dual-loop architecture.</p>"
