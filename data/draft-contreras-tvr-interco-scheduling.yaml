abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the applicability of Time-Variant Routing\n   (TVR) information in interconnection scenarios.  In particular, it\n   discusses how scheduled changes affecting BGP sessions, routing\n   policies, and effective interconnection capacity between\n   administrative domains can be applied.</p>"
