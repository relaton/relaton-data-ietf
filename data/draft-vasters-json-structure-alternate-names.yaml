abstract:
- language: en
  script: Latn
  content: "<p>This document is an extension to JSON Structure Core.  It defines\n   three annotation keywords, altnames, altenums, and descriptions,\n   which allow schema authors to provide alternative identifiers,\n   display names, and multi-variant descriptions for types, properties,\n   and enumeration values.</p>"
