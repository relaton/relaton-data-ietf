abstract:
- language: en
  script: Latn
  content: "<p>This document extends the Incident Object Description Exchange Format
    (IODEF) defined in RFC5070 to support the reporting of phishing, fraud, other
    types of electronic crime.  The extensions also support the exchange on information
    about widespread spam incidents.  These extensions are flexible enough to support
    information gleaned from activities throughout the entire electronic fraud or
    spam cycle. Both simple reporting and complete forensic reporting are possible,
    as is consolidating multiple incidents .  The extensions defined in this document
    are used to generate two different types of reports: a fraud report and a wide-spread
    spam report.  Although similar in structure, each report has different required
    objects and intentions.RFC 2129 Keywords</p>"
