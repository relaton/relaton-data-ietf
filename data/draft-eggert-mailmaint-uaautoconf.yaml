abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an automatic configuration mechanism for\n   email, calendar, and contact user agent applications.  Service\n   providers publish standardized configuration information that user\n   agent applications retrieve and use to simplify server setup\n   procedures.</p>"
