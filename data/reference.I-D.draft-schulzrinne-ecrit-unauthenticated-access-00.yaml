abstract:
- language: en
  script: Latn
  content: "<p>The IETF emergency services architecture assumes that access to a network
    has already happened using the traditional network access authentication procedures
    or that no authentication for network access is needed (e.g., in case of public
    hotspots). Subsequent protocol interactions, such as obtaining location information,
    learning the address of the Public Safety Answering Point (PSAP) and the emergency
    call itself are largely decoupled from the underlying network access procedures.
    There are, however, cases where a device is not in possession of credentials for
    network access, does not have a VoIP provider, or where the credentials are available
    but became invalid due to various reasons (e.g., credit exhaustion, expired accounts,
    etc.). This document provides a problem statement, introduces terminology and
    describes an extension for the base IETF emergency services architecture.</p>"
