- language: en
  script: Latn
  content: |-
    <p>This document defines extensions to the RTCP XR extended report
       packet type blocks to support Voice over IP (VoIP) monitoring
       for services that require higher resolution or more detailed
       metrics than those supported by RFC3611 [13].</p>
