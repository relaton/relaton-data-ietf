abstract:
- language: en
  script: Latn
  content: <p>This document describes a syntax which can be used to bind a generic  document
    (or any set of data, not necessarily protected by means of  cryptographic techniques)
    to one or more time-stamp tokens obtained  for that document, where "time-stamp
    token" has the meaning defined  in RFC 3161. Additional types of temporal evidence
    are also  supported.  Santoni  Expires September 14, 2008  [page 1]  Internet-Draft  timestampeddata  March
    2008  This document proposes a simple syntax based on the Cryptographic  Message
    Syntax (RFC 3852).</p>
