abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the usage of Fast Mobile IPv6 (FMIPv6) when
    Proxy Mobile IPv6 is used as the mobility management protocol. Necessary extensions
    are specified for FMIPv6 to support the scenario when the mobile node does not
    have IP mobility functionality and hence is not involved with either MIPv6 or
    FMIPv6 operations.</p>"
