abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to TCP [RFC0793] which permits
    a small, mostly constant data payload to be carried in the SYN+ACK frame of the
    3-way handshake.  This new behaviour is enabled by an option in the SYN packet
    to ensure backwards compatibility.  We should how this has latency benefits, specifically
    for cryptographic applications.</p>"
