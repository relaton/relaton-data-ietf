abstract:
- language: en
  script: Latn
  content: "<p>A suite of protocols is being developed in the IETF to allow \nnetworks
    consisting of photonic switches (PXCs), optical \ncrossconnects (OXCs), routers,
    switches, DWDM optical line systems \n(OLSs), and optical add-drop multiplexors
    (OADMs) to use an MPLS-\nbased control plane to dynamically provision resources
    and to \nprovide network survivability using protection and restoration \ntechniques.</p>"
