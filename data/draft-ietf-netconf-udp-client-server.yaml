- language: en
  script: Latn
  content: <p>This document defines two YANG 1.1 modules with reusable groupings for
    managing UDP clients and UDP servers. Notes to the RFC editor This note is to
    be removed before publishing as an RFC. Please replace "RFC XXXX" with the assigned
    RFC number prior to publication. Note that there are also several occurrences
    of "RFC XXXX" in the YANG modules.</p>
