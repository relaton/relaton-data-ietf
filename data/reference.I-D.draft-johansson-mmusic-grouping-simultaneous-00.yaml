abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension to the grouping framework [RFC3388bis].
    \ The extension identifies media descriptions that contain different representations
    of identical content.  An examples of this is an endpoint and sends both a high-resolution
    and a low- resolution video sequence to a conferencing server.</p>"
