- language: en
  script: Latn
  content: "<p>Researchers have discovered that the authenticated encryption portion
    of the current SSH Transport Protocol is vulnerable to several attacks.</p>"
- language: en
  script: Latn
  content: "<p>This document describes new symmetric encryption methods for the Secure
