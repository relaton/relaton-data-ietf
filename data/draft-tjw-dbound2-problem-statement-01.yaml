- language: en
  script: Latn
  content: "<p>Internet clients attempt to make inferences about the administrative
    relationship based on domain names. Currently it is not possible to confirm organizational
    boundaries in the DNS. Current mitigation strategies have there own issues. This
    memo attempts to outline these issues.</p>"
