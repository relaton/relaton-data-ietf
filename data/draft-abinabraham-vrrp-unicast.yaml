abstract:
- language: en
  script: Latn
  content: "<p>The Virtual Router Redundancy Protocol (VRRP) Version 3 as specified
    in RFC 9568 assumes multicast operation on a shared LAN. Some deployments require
    the VRRP first-hop redundancy function but cannot use multicast delivery for VRRP
    advertisements. This document updates RFC 9568 by defining an optional configured
    unicast mode for VRRP Version 3 in which advertisements are sent to configured
    peer addresses rather than to the VRRP multicast group. The VRRP packet format,
    state machine, protocol number, virtual IP semantics, and Virtual Router MAC behavior
    remain unchanged from RFC 9568.</p>"
