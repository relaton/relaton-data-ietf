abstract:
- language: en
  script: Latn
  content: "<p>This document defines a framework for providing Energy Management for
    devices within or connected to communication networks.  The framework defines
    a domain of Energy Management devices that is a logical unit of Energy Management.
    Within a domain each device is identified, classified and given context. Devices
    can be monitored and/or controlled with respect to power, power state, energy,
    demand, electrical quality, and battery.  Additionally the framework models relationships
    and capabilities between devices in a domain.</p>"
