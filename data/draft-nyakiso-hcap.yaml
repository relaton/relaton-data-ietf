abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the HTTP Compliance Authorization Protocol\n   (HCAP), an extension to the HTTP authentication framework that allows\n   resource providers to require demonstrable evidence of caller\n   compliance with declared policies before granting access to protected\n   resources.  Callers obtain signed compliance credentials from a\n   compliance registry by presenting evidence of their controls.\n   Credentials are conveyed at the HTTP layer and verified offline by\n   the provider.\n\n   HCAP operates alongside existing authentication schemes (OAuth 2.0,\n   mTLS) and does not replace identity authentication.  It addresses the\n   distinct question of \"does the caller meet declared policy\n   requirements\" rather than \"who is the caller\".</p>"
