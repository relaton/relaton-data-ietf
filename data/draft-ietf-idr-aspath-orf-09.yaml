- language: en
  script: Latn
  content: <p>This document defines a new Outbound Router Filter type for BGP, termed
    "Aspath Outbound Route Filter", that can be used to perform aspath based route
    filtering. This ORF-type supports aspath based route filtering as well as regular
    expression based matching, for address groups.</p>
