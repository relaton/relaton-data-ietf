abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a document format for the media properties
    of Session Initiation Protocol (SIP) sessions such as codecs or media types used.
    This format is based on XML and extends the Schema for SIP User Agent Profile
    Data Sets. It can be used to describe the media properties of a specific SIP session
    and to express media- related policies that can be applied to different SIP sessions.</p>"
