title:
- language: en
  script: Latn
  content: "Request Header Integrity in SIP and HTTP Digest using\nPredictive Nonces\n"
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-rosenberg-sip-http-pnonce-00
