- language: en
  script: Latn
  content: "<p>This document describes how to use the Service Location Protocol (SLP)
    to locate Internet telephony gateways. It defines the 'service:iptel-gw:' template
    for the Internet telephony gateway service, and discusses the different usage
    scenarios and the applicability of SLP for the Internet telephony gateway location.</p>"
