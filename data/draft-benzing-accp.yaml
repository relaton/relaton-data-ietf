abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Agent Context Compression Protocol\n   (ACCP), a semantic encoding and context management protocol for\n   communication between AI agents within agentic harnesses.  ACCP\n   defines a compact message format, intent ontology, state compression\n   strategy, and codec interface that collectively reduce token\n   consumption by 60-90% compared to natural language or standard JSON\n   messaging.  ACCP is designed to complement existing protocols (MCP,\n   A2A) and is transport-agnostic.</p>"
