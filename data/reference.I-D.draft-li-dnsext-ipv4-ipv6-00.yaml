abstract:
- language: en
  script: Latn
  content: "<p>There are two kinds of TYPE for host IP address: one is A, the other
    is AAAA, which records IPv4 and IPv6 addresses respectively. This document defines
    a new TYPE, which is mainly used in queries in order to get both IPv4 and IPv6
    addresses.</p>"
