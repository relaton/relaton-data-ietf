abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Solenoid Remote Procedure Call (sRPC)\n   protocol and requests registration of a new HTTP method, RUN.\n\n   sRPC is action-oriented.  A client targets a stable endpoint URI and\n   identifies the procedure to execute through a query parameter\n   containing a procedure path.  The RUN method provides explicit\n   protocol semantics for function invocation, distinguishing RPC\n   execution from resource-oriented REST interactions.</p>"
