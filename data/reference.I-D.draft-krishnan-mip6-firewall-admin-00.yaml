abstract:
- language: en
  script: Latn
  content: "<p>This document presents some recommendations for firewall administrators
    to help them configure their firewalls in a way that allows Mobile IPv6 signaling
    and data messags to pass through. This document assumes that the firewalls in
    question include some kind of stateful packet filtering capability.</p>"
