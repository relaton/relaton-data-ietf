abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 [RFC5213] requires all the mobile access gateways
    to use a fixed link-local and link-layer addresses on any of its access links
    that it shares with the mobile nodes.  This was intended to ensure a mobile node
    does not detect any change with respect to its layer-3 attachment even after it
    roams from one mobile access gateway to another.  In the absence of any reserved
    addresses for this use, it requires coordination across vendors and the manual
    configuration of these addresses on all the mobility elements in a Proxy Mobile
    IPv6 domain.  This document attempts to simplify this operational requirement
    by making reservation for special addresses that can be used for this purpose
    and it also updates RFC 5213.</p>"
