abstract:
- language: en
  script: Latn
  content: "<p>This specification describes extensions to OpenID Connect that defines
    how OpenID Providers issue credentials for client applications and how client
    applications and relying parties handle the credentials, typically over protocols
    that use passwords for authentication without changing existing client applications.</p>"
