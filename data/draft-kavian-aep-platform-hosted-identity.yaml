abstract:
- language: en
  script: Latn
  content: "<p>This document defines interoperable hosted identity behavior for\n   Agent Enrollment Protocol (AEP) Platforms.  It lets a Platform\n   provision Service-scoped Agent did:web identities, publish DID\n   documents, custody signing keys, and produce AEP client assertion\n   JWTs through delegated signing operations.</p>"
