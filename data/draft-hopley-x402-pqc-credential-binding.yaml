abstract:
- language: en
  script: Latn
  content: "<p>This document defines how Falcon-1024 (NIST FIPS 206 / FN-DSA) and
    ML-DSA-65 (NIST FIPS 204) credentials bind to x402 agentic payment authorization.
    It specifies the credential envelope format, the JCS canonicalization discipline
    applied to signed payloads, the gateway verification procedure, and the session
    token binding that replaces per-request API key authentication for credentialed
    agents. This is the first Internet-Draft in the agentic payments space to anchor
    credential binding to the NIST post-quantum cryptography standards (FIPS 203/204/206).</p>"
