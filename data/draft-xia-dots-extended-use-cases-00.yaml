abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes two extended use cases which illustrate more scenarios
    and multiple ways of implementation within the existing DOTS work scope. One is
    the data mining and SDN based centralized Anti-DDoS use case, the other is the
    NFV based distributed DDoS mitigation use case.</p>"
