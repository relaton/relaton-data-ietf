abstract:
- language: en
  script: Latn
  content: "<p>The specification for the Extensible Authentication Protocol (EAP) [2]\nomits a state machine description.  This omission has led to ambiguity\nin the specification and potential security problems in EAP\nimplementations.  This document outlines a state machine to be\nintegrated into the next revision of the EAP RFC.</p>"
