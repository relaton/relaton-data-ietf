abstract:
- language: en
  script: Latn
  content: "<p>This document register the media types application/dns and text/dns,
    in accordance with RFC 2048 [3]. The application/dns media type is used to identify
    data on the detached Domain Name System (DNS) format described in RFC 2540 [4].
    The text/dns media type is used to identify master files as described in RFC 1035
    [2].</p>"
