abstract:
- language: en
  script: Latn
  content: "<p>TRILL protocol provides multicast data forwarding based on IS-IS link
    state routing. Distribution trees are computed based on the link state information
    through Shortest Path First calculation. When a link on the distribution tree
    fails, a campus-wide reconvergence of this distribution tree will take place,
    which can be time consuming and may cause considerable disruption to the ongoing
    multicast service. This document specifies how to build backup distribution trees
    to protect links on the primary distribution tree. Since the backup distribution
    tree is built up ahead of the link failure, when a link on the primary distribution
    tree fails, the pre-installed backup forwarding table will be utilized to deliver
    multicast packets without waiting for the campus-wide reconvergence. This minimizes
    the service disruption. This document updates RFC 6325.</p>"
