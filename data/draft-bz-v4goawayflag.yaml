abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a Router Advertisement Flag to indicate to
    end nodes that IPv4 support must be disabled on this link. In addition this document
    presents a policy and a timeline on how to deal with this flag and the going-away
    of IPv4. This document updates RFC5175.</p>"
