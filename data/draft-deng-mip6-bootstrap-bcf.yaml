- language: en
  script: Latn
  content: "<p>This document specifies a mechanism for Mobile IPv6 bootstrap procedure.
    By making a extension of MIP6 specification and using IKE to guarantee its security,
    this mechanism bring into a new component BCF(Bootstrap Control Function) to handle
    MN¡¯s bootstrap procedure between MN and multiple HAs. Two new bootstrap messages
    Init and Ack has been defined to support bootstrap procedure.</p>"
