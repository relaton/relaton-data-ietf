- language: en
  script: Latn
  content: |-
    <p>This specification defines a protocol for a lightweight HTTP- and
       JSON- based Security Token Service (STS) by defining how to request
       and obtain security tokens from OAuth 2.0 authorization servers,
       including security tokens employing impersonation and delegation.</p>
