- language: en
  script: Latn
  content: "<p>Centralised deployment models for Internet services and Internet business
    consolidation are well-known Internet trends, at least when it comes to popular
    and user-visible service. This memo discusses the impacts of similar trends within
    the Internet infrastructure, on functions such as DNS resolution.</p>"
