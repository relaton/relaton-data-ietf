  script: Latn
  content: "<p>DomainKeys Identified Mail (DKIM) allows an administrative mail domain
    (ADMD) to assume some responsibility for a message.  Based on deployment experience
    with DKIM, this Best Current Practices document provides guidance for the use
    of DKIM with scenarios that include Mailing List Managers (MLMs). {DKIM 12}</p>"
