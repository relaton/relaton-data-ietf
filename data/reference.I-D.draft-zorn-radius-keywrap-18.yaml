abstract:
- language: en
  script: Latn
  content: "<p>This document defines a set of vendor specific RADIUS Attributes designed
    to allow both the secure transmission of cryptographic keying material and strong
    authentication of any RADIUS message. This attributes have been allocated from
    the Cisco vendor specific space and have been implemented by multiple vendors.</p>"
