abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to the Bidirectional Forwarding\nDetection (BFD) protocol for its use in multipoint and multicast\nnetworks.  Comments on this draft should be directed to rtg-\nbfd@ietf.org.\n\n\nConventions used in this document\n\nThe key words \"MUST\", \"MUST NOT\", \"REQUIRED\", \"SHALL\", \"SHALL NOT\",\n\"SHOULD\", \"SHOULD NOT\", \"RECOMMENDED\",  \"MAY\", and \"OPTIONAL\" in this\ndocument are to be interpreted as described in RFC-2119 [KEYWORDS].</p>"
