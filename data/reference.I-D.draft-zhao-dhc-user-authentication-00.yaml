abstract:
- language: en
  script: Latn
  content: "<p>This document defines an authentication mechanism to provide an authentication
    for a user in an access network by means of dhcp. The authentication mechanism
    described here couples DHCP to an authentication, authorization and accounting
    system (AAA), thus enabling users to supply user credentials for AAA via DHCP.</p>"
