abstract:
- language: en
  script: Latn
  content: "<p>Existing specifications as regards route preference are not explicit\n   when applied to IP/IPv6 Extended Reachability TLVs.  There are also\n   inconsistencies in the definition of how the up/down bit applies to\n   route preference when the prefix advertisement appears in Level 2\n   LSPs.  This document addresses these issues.</p>"
