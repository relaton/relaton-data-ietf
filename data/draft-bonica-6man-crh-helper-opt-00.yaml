abstract:
- language: en
  script: Latn
  content: "<p>This document defines the IPv6 CRH Helper option. When an SRm6 ingress
    node originates a packet, it can use the IPv6 CRH Helper option to provide SID
    Forwarding Information Base (SFIB) information to downstream nodes that do not
    maintain a complete SFIB.</p>"
