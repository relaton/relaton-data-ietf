abstract:
- language: en
  script: Latn
  content: "<p>This document defines a transport mechanism between an Uncrewed Aircraft
    System (UAS) and its UAS Service Supplier (USS) for Network Remote ID (Net-RID)
    messages. Either the Broadcast Remote ID (B-RID) messages, or alternatively, appropriate
    MAVLink Messages can be sent directly over UDP or via a more functional protocol
    using CoAP/CBOR for the Net-RID messaging. This is secured via either HIP/ESP
    or DTLS. HIP/ESP or DTLS secure messaging Command-and-Control (C2) for is also
    described.</p>"
  format: text/html
