abstract:
- language: en
  script: Latn
  content: "<p>This document describes how devices joining an autonomic control plane
    as defined in RFC 8994 may use the bootstrapping mechanism defined in RFC 8995
    even if they cannot use a manufacturer-installed X.509 certificate. Instead, such
    devices may generate a self-signed certificate embedding a unique token selected
    from a one-time pad.</p>"
