abstract:
- language: en
  script: Latn
  content: "<p>This document defines a standard algorithm to back-off link-state IGP
    SPF computations. Having one standard algorithm improves interoperability by reducing
    the probability and/or duration of transient forwarding loops during the IGP convergence
    when the IGP reacts to multiple proximate IGP events.</p>"
