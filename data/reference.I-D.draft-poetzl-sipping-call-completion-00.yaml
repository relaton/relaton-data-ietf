abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the extensions to the Session Initiation Protocol
    (SIP) for the call completion simulation services provided in the context of ETSI
    Next Generation Networks (NGN). This document describes two SIP event packages
    that enable monitoring of queues. These event packages are intended for the limited
    use of Completion of Calls to Busy Subscribers (CCBS) and Completion of Calls
    on No Reply (CCNR).</p>"
