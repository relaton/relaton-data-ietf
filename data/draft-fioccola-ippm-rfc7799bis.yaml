abstract:
- language: en
  script: Latn
  content: "<p>This memo provides clear definitions for Active, Passive and Hybrid\n   performance assessment.  The construction of Metrics and Methods can\n   be described as either \"Active\" or \"Passive\".  Some methods use a\n   subset of both Active and Passive attributes, and they can be\n   referred to as \"Hybrid\".  This memo also describes multiple\n   dimensions to help evaluate new methods as they emerge.\n\n   This memo obsoletes RFC 7799.</p>"
