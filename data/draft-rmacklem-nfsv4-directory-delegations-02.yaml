abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the addition of bit flags to be used in the
       request by a client for the GET_DIR_DELEGATION operation to allow the
       client to specify detailed behavior of CB_NOTIFYs the server will
       perform on the client.  Early implementation experience with
       directory delegations has demonstrated that clients may not need the
       full information specified in [RFC8881] for CB_NOTIFYs and may not
       require the recall of the directory delegation to be done
       synchronously.  Limiting the CB_NOTIFY's requirements can simplify
       server implementation of directory delegations.  These additional bit
       flags allow the client to request desired behavior.  The server's
       reply will then specify what behavior the client can expect.</p>
