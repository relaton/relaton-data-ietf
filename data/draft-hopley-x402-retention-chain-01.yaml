abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a cryptographic construction, the Retention\n   Chain Reference (retention_chain_ref), that enables self-verifiable\n   audit chains linking payment receipts without requiring external\n   infrastructure.  Each receipt in a sequence carries a chain reference\n   computed as the SHA-256 digest of the JSON Canonicalization Scheme\n   (JCS, RFC 8785) canonical form of a fixed four-field preimage.  Any\n   party holding any contiguous or non-contiguous subset of receipts can\n   independently verify chain integrity by recomputing the reference\n   from locally held data.  No AlgoVoi infrastructure, no registry\n   lookup, and no network access are required.  The construction\n   satisfies the transaction recording and audit trail obligations of\n   MiCA Article 80, DORA Article 14, and AMLR Article 56.</p>"
