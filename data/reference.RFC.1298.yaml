- language: en
  script: Latn
  content: "<p>This memo defines a convention for encapsulating Simple Network Management
    Protocol (SNMP) packets over the transport mechanism provided via the Internetwork
    Packet Exchange (IPX) protocol.  This memo provides information for the Internet
    community.  It does not specify an Internet standard.</p>"
