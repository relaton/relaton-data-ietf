abstract:
- language: en
  script: Latn
  content: "<p>Route Optimization is a very useful feature in Mobile IPv6. Mobile
    node can communicate with correspondent node without the involvement of the home
    agent by Route Optimization. But there are some limitations to this feature. One
    problem is that the mobile node and the correspondent node must be capable for
    Route Optimization. This document introduces an extension mechanism used for Route
    Optimization and this extension mechanism can enable Route Optimization be used
    between mobile node and simple IP node. In the extension solution, the MAG can
    reflect the RO-related signal messages and fulfill the Route Optimization procedure
    on behalf of the simple IP node.</p>"
