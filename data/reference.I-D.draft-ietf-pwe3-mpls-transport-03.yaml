abstract:
- language: en
  script: Latn
  content: "<p>A requirement has been identified by the operator community for the
    transparent carriage of the MPLS(-TP) network of one party over the MPLS(-TP)
    network of another party.  This document describes a method of satisfying this
    need using the existing PWE3 Ethernet pseudowire standard RFC4448.</p>"
