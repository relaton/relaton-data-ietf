abstract:
- language: en
  script: Latn
  content: "<p>The Model Context Protocol (MCP) defines a standard interface for AI\n   agents to connect to external tools and services. However, no\n   standard mechanism exists for an AI agent to autonomously discover\n   which web domains expose an MCP server.\n\n   This document defines:\n\n   (1) the \"mcp\" URI scheme, a machine-to-machine identifier for\n       publicly reachable MCP servers;\n\n   (2) a two-mode discovery mechanism: a well-known URI\n       (/.well-known/mcp-server) for universal compatibility,\n       and a DNS TXT record format for DNS-native fast discovery;\n\n   (3) an optional manifest integrity mechanism using JSON Web\n       Signatures (JWS, [RFC7515]) with keys published via DNS;\n\n   (4) a security capability negotiation mechanism through which the\n       manifest declares trust class, authentication requirements,\n       compliance frameworks, and logging policy before connection.\n\n   This specification does not define the MCP protocol itself, nor\n   authentication between agent and server. Those are covered by the\n   MCP specification and OAuth 2.1 respectively.</p>"
