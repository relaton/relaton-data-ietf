abstract:
- language: en
  script: Latn
  content: "<p>DUDE is a reversible transformation from a sequence of nonnegative\ninteger values to a sequence of letters, digits, and hyphens (LDH\ncharacters).  DUDE provides a simple and efficient ASCII-Compatible\nEncoding (ACE) of Unicode strings [UNICODE] for use with\nInternationalized Domain Names [IDN] [IDNA].</p>"
