- language: en
  script: Latn
  content: "<p>This document presents an alternative port mapping solution that allows
    RTP receivers to choose their own ports for an auxiliary unicast session in RTP
    applications using both unicast and multicast services (almost) without the need
    for retrieving pre-authorization.</p>"
