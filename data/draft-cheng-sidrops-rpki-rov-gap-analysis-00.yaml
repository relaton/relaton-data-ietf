abstract:
- language: en
  script: Latn
  content: "<p>The Resource Public Key Infrastructure (RPKI) and Route Origin\n   Validation (ROV) have made significant progress.  Over 60% of IPv4\n   routes now have ROAs, and more than 70% of Internet traffic flows to\n   ROA-covered prefixes.  A growing number of large transit providers\n   actively reject RPKI-invalid routes.  Despite these achievements,\n   however, thousands of RPKI-invalid routes persistently appear in the\n   global routing table, and their count has not shown a sustained\n   downward trend over the years.\n\n   More importantly, the deployment of strict ROV drop policies is\n   highly uneven.  While large transit providers have largely embraced\n   dropping invalids, the long tail - tens of thousands of stub ASes and\n   small regional ISPs - remains on the sidelines, often keeping ROV in\n   monitor-only mode or not deploying it at all.\n\n   This document analyzes the root causes behind these persistent gaps:\n   (1) inherent *synchronization asymmetry* between the RPKI management\n   plane and router control planes, and (2) the inevitable possibility\n   of *errors on both planes* (ROA configuration and router origin\n   configuration).  These causes lead to a fundamental *information\n   asymmetry*: downstream routers cannot distinguish self-inflicted\n   invalids (due to sync delays or misconfigurations) from true prefix\n   hijacks.\n\n   We examine the operational harms of this asymmetry - unnecessary\n   blackholes, path shifts, global route churn, and long-lived\n   connectivity loss - and explain why the long tail remains reluctant\n   to deploy ROV.  We then identify the informational requirements that\n   any enhanced system would need to meet: source-side cross-validation\n   to prevent self-inflicted invalids, and downstream consistency\n   information to reconcile local ROV outcomes with the origin's intent.\n   The goal is to enable more confident and widespread deployment of\n   strict ROV policies while preserving the existing RPKI-ROV\n   architecture.\n\n   This document does not propose a specific protocol solution.  It\n   defines the problem space and information needs, providing a\n   foundation for future work.</p>"
