  script: Latn
  content: "<p>The purpose of a referral is to enable a given entity in a multiparty
    Internet application to pass information to another party. It enables a communication
    initiator to be aware of relevant information of its destination entity before
    launching the communication. This memo discusses the problems involved in referral
    scenarios.</p>"
