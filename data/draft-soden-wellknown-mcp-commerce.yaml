abstract:
- language: en
  script: Latn
  content: "<p>This document defines an informational profile for the Server Card
    document retrieved from the /.well-known/mcp.json Well-Known URI defined by the
    Model Context Protocol (MCP) project. The profile adds an optional commerce extension
    to the Server Card, carried in the Server Card's _meta object under the reverse-DNS
    key com.beaconspec/commerce, for commercial businesses operating MCP servers.
    The extension carries business identity, geographic location, industry classification,
    offering type, and advertised capability categories. The purpose of the profile
    is to give AI agents enough machine-readable information about a commercial MCP
    server to filter, select, and bootstrap an interaction without first opening an
    MCP session against every candidate server.</p>"
