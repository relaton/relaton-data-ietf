abstract:
- language: en
  script: Latn
  content: |-
    <p>The document defines an algorithm by which, given an e-mail message,
       one can extract the identity of the party that appears to have most
       proximately caused that message to be delivered.  This identity is
       called the "Purported Responsible Address" (PRA).</p>
