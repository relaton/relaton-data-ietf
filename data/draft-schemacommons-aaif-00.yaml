abstract:
- language: en
  script: Latn
  content: |-
    <p>The Autonomous Agent Interchange Format (AAIF) is an open, vendor-
       neutral specification for the portable definition of artificial
       intelligence agents.  An AAIF document encapsulates an agent's
       identity, goal, system instructions, large language model (LLM)
       provider preferences and fallback routing, multi-agent orchestration
       topology (sequential pipeline, parallel swarm, dynamic routing, and
       mid-run handoff), tool catalogue (supporting function, MCP, HTTP, and
       OpenAPI protocols with structured authentication), memory
       configuration, runtime policy, OpenTelemetry telemetry settings, LLM-
       as-judge evaluation criteria, and compliance controls including data
       residency and human-in-the-loop approval.

       An agent defined in AAIF can be validated offline, committed to
       version control, and imported into any conforming runtime regardless
       of the original authoring environment.  This document describes the
       AAIF data model, field semantics, conformance levels, capability
       negotiation protocol, and the companion Agent State checkpoint schema
       that enables cross-platform live migration of running agents.</p>
