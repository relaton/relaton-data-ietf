abstract:
- language: en
  script: Latn
  content: "<p>An important Operation, Administration and Maintenance requirement
    of the MPLS Transport Profile (MPLS-TP) is the ability to estimate/ measure the
    throughput (i.e. bandwidth) of an MPLS-TP connection which could be an MPLS-TP
    LSP, PW or Section.  This document specifies the OAM packets and procedures for
    both one-way and two-way throughput estimation/measurement in MPLS-TP.</p>"
