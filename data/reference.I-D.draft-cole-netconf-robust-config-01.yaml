abstract:
- language: en
  script: Latn
  content: "<p>This document extends the capabilities of the NETCONF configuration
    management protocol to validate the configuration on servers and to perform a
    set of active tests (i.e., verification) against the server's running configuration
    over a period of time to afford the client and server a more robust and resilient
    configuration management capability.  This is of value to commercial enterprise
    and public networks as well as wireless emergency and military networks. We propose
    an initial new NETCONF capability.  We also explore the future alternatives for
    developing these capabilities within the context of the existing NETCONF protocol,
    the YANG modeling language and existing related IETF, IEEE and ITU-T standards.</p>"
