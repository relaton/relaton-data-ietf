abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension to RSVP-TE to distribute VC \nlabels
    required by L2 circuit over MPLS encapsulation proposed by \nMartini et. al.  The
    distribution of VC labels is piggybacked on \nsignaling of LSP tunnels using two
    new RSVP objects.</p>"
