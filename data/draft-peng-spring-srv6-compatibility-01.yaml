abstract:
- language: en
  script: Latn
  content: "<p>When deploying SRv6 on legacy devices, there are some compatibility
    challenges such as the support of SRH processing. This document identifies some
    of the major challenges, and provides solutions that are able to mitigate those
    challenges and smooth the migration towards SRv6 deployment.</p>"
