abstract:
- language: en
  script: Latn
  content: |-
    <p>TCP does not have a mechanism for specifying message boundaries in
    a stream. This I-D describes a new TCP option and a new way of
    using the TCP urgent field to specify message boundaries in the
    stream.</p>
