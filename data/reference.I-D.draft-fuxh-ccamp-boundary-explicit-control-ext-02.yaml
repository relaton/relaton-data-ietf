abstract:
- language: en
  script: Latn
  content: "<p>[RFC5212] defines a Multi-Region and Multi-Layer Networks (MRN/MLN).
    [RFC4206] introduces a region boundary determination algorithm and a Hierarchy
    LSP (H-LSP) creation method.  However, in some scenarios, some attributes have
    to be attached with the boundary nodes in order to explicit control the hierarchy
    LSP creation.  This document extends GMPLS signaling protocol for the requirement
    of explicit control the hierarchy LSP creation.</p>"
