abstract:
- language: en
  script: Latn
  content: "<p>This document defines a MIME media type for representing and exchanging
    calendaring and scheduling information such as events, to- dos, journal entries
    and free/busy information. The definition of the text/calendar media type, known
    as iCalendar, is independent of any particular calendar service or protocol.</p>"
