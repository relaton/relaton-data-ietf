abstract:
- language: en
  script: Latn
  content: "<p>This draft provides framework and requirements for Layer 2 Virtual
    Private Networks (L2VPN) Operation, Administration and Maintenance (OAM). The
    OAM framework is intended to provide OAM layering across L2VPN services, Pseudo
    Wires (PWs) and Packet Switched Network (PSN) tunnels. The requirements are intended
    to identify OAM requirement for L2VPN services (i.e. VPLS, VPWS, and IPLS). Furthermore,
    if L2VPN services OAM requirements impose specific requirements on PW OAM and/or
    PSN OAM, those specific PW and/or PSN OAM requirements are also identified.</p>"
