abstract:
- language: en
  script: Latn
  content: |-
    <p>Digital emblems allow an issuer to signal that an asset should be
       protected or treated in a specific way, using some normative
       framework.  This document lists the requirements and use cases that
       an architecture for digital emblems must accommodate.</p>
