abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Multicast Protocol for Low power and Lossy
    Networks (MPL) that provides IPv6 multicast forwarding in constrained networks.
    \ MPL avoids the need to construct or maintain any multicast forwarding topology,
    disseminating messages to all MPL Forwarders in a MPL Domain.  MPL has two modes
    of operation.  One mode uses the Trickle algorithm to manage control- and data-plane
    message transmissions, and is applicable for deployments with few multicast sources.
    \ The other mode uses classic flooding.  By providing both modes and parameterization
    of the Trickle algorithm, a MPL implementation can be used in a variety of multicast
    deployments and can trade between dissemination latency and transmission efficiency.</p>"
