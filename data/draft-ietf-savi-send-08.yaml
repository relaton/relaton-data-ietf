- language: en
  script: Latn
  content: "<p>This memo describes SEND SAVI, a mechanism to provide source address
    validation using the SEND protocol. The proposed mechanism is intended to complement
    ingress filtering techniques to provide a finer granularity on the control of
    the source addresses used.</p>"
