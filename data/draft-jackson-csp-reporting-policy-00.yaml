abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a mechanism by which a domain operator can\n   publish a Content Security Policy reporting endpoint policy in the\n   Domain Name System.  The mechanism allows user agents and reporting\n   processors to discover one or more domain-authorised endpoints for\n   receiving Content Security Policy violation reports, independently of\n   the HTTP response that triggered the report.\n\n   The mechanism is intended to improve administrative consistency\n   across distributed web estates where the domain operator controls DNS\n   but does not consistently control every web server, content\n   management system, proxy, application stack, or hosting platform\n   serving content beneath the domain.\n\n   This document does not define DNS-based CSP enforcement.  It defines\n   only DNS-published reporting endpoint policy.  User agents MUST NOT\n   treat this mechanism as a replacement for the Content-Security-Policy\n   or Content-Security-Policy-Report-Only HTTP response header fields.</p>"
