abstract:
- language: en
  script: Latn
  content: "<p>Intent-based requests enable users, applications, and agents to\n   express goals and constraints without specifying step-by-step\n   procedures.  Such intents are commonly translated into executable\n   directives and propagated across multiple entities (clients, agents,\n   authorization components, orchestration functions, and execution\n   endpoints).  This multi-hop processing expands the attack surface for\n   tampering, privilege escalation, constraint bypass, and intent drift.\n   In addition, at the point where an intent enters the system, a forged\n   or unauthorized origin may cause actions to be taken without valid\n   consent.\n\n   This document provides a solution-agnostic security analysis for\n   intent-based requests across agentic systems.  It presents attack\n   scenarios, a threat model, security requirements, and per-scenario\n   mitigation considerations, supported by a reference model.  The\n   document is Informational: it does not define a protocol, message\n   format, or registry, and concrete mechanisms are left to companion\n   specifications.  It emphasizes origin authentication and admission\n   control, constraint validation, invocation validation, multi-hop\n   chain-of-custody, enforcement placement across hops, and policy-\n   driven responses to drift, while remaining independent of any\n   specific deployment domain.</p>"
