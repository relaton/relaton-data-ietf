abstract:
- language: en
  script: Latn
  content: "<p>This document is intended to be a source of information about the Russian
    Federal standard for electronic encryption, decryption, and MAC algorithms (GOST
    28147-89) [GOST28147], which is one of the official standards in the cryptography
    used in Russian algorithms (GOST algorithms). Recently, Russian cryptography started
    to be used in applications intended to work with the OpenSSL cryptographic library.
    Therefore, this document has been created as information for users of Russian
    cryptography.  V.Dolmatov  Expires June 3, 2010  [page 1]</p>"
