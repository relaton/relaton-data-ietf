abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes the scalability of presence sharing between
    domains that federate using the Extensible Messaging and Presence Protocol (XMPP).
    This analysis is provided as a source of comparison with a similar analysis being
    performed regarding the presence extensions to the Session Initiation Protocol
    (SIP).</p>"
