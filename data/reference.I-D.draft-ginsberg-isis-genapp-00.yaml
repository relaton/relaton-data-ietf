- language: en
  script: Latn
  content: "<p>This draft describes the manner in which generic application information
    (i.e. information not directly related to the operation of the IS-IS protocol)
    SHOULD be advertised in IS-IS LSPs and defines guidelines which SHOULD be used
    when flooding such information.</p>"
