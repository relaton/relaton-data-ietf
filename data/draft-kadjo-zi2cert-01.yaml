abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the ZI2 Certified Email Server Attestation\n   Protocol, a mechanism for cryptographic attestation of email origin\n   at the mail server level.  Unlike existing email authentication\n   protocols (SPF, DKIM, DMARC), which operate at the domain level, ZI2\n   Certified operates at the server-instance level, enabling definitive\n   identification of the specific server that dispatched a given email\n   message.  The protocol introduces two custom mail headers, a DNS TXT\n   record publication format, a graduated trust model with four levels,\n   and an integration interface for AI-based email classification\n   systems.  The protocol operates complementarily to existing email\n   authentication infrastructure and introduces an ARC-Delegated Trust\n   mechanism to preserve origin attestation across legitimate transit\n   modifications.</p>"
