abstract:
- language: en
  script: Latn
  content: "<p>The Host Identity Protocol (HIP) provides a new namespace that can
    be used for uniquely identifying hosts.  Existing HIP experimental specifications
    do not specify protocol operations across Network Address Translators (NATs).
    \ This document specifies NAT traversal extensions for HIP.  The HIP shim layer
    is located between the network and transport layer, the extensions can also provide
    a more general-purpose NAT traversal support for higher-layer networking applications.
    \ The extensions are based on the use of the The Interactive Connectivity Establishment
    (ICE) methodology to discover a working path between two end-hosts. Using the
    specified extensions, two HIP-capable hosts are able to communicate with each
    other even when both nodes are behind NATs or firewalls.</p>"
