abstract:
- language: en
  script: Latn
  content: "<p>This document defines a number of Dynamic Host Configuration Protocol
    (DHCPv4 and DHCPv6) options that contain a list of domain names or IP addresses
    that can be mapped to servers providing IEEE 802.21 type of Mobility Services
    [MSFD]. These Mobility Services are used to assist an MN in handover preparation
    (network discovery) and handover decision (network selection). The services addressed
    in this document are the Media Independent Handover Services defined in [IEEE802.21].</p>"
