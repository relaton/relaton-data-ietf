abstract:
- language: en
  script: Latn
  content: "<p>The Lemonade Command Extensions defines extensions to the IMAPv4 Rev1
    \n   protocol [RFC3501] for optimization in a mobile setting, aimed at \n   delivering
    extended functionality for mobile devices with limited \n   resources.  It proposes
    extensions for message delivery, and \n   maintaining up-to-date personal information.
    Bindings to specific \n   transport are explicitly defined.</p>"
