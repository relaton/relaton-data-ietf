abstract:
- language: en
  script: Latn
  content: "<p>This document defines YANG data models to describe the topology and
    tunnel information of a fine grain Optical Transport Network. The YANG data models
    defined in this document are designed to meet the requirements for efficient transmission
    of sub-1Gbit/s client signals in transport network.</p>"
