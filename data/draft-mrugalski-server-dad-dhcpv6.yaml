abstract:
- language: en
  script: Latn
  content: "<p>This document defines new way of performing DAD procedure.  DHCPv6\nmaintain small pool of unique addresses.  DHCPv6 server performs DAD\nprocedure for each address, before populating this uniqueness\nverified pool.  Client may ask for an address that already passed DAD\ntest, thus speeding up client configuration process.</p>"
