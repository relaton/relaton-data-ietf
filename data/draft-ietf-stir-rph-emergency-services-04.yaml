- language: en
  script: Latn
  content: <p>This document adds new assertion values for a Resource Priority Header
    ("rph") claim and a new SIP Priority Header claim ("sph") for protection of the
    "psap-callback" value as part of the "rph" PASSporT extension, in support of the
    security of Emergency Services Networks for emergency call origination and callback.</p>
