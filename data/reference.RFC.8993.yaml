abstract:
- language: en
  script: Latn
  content: "<p>This document describes a reference model for Autonomic Networking
    for managed networks. It defines the behavior of an autonomic node, how the various
    elements in an autonomic context work together, and how autonomic services can
    use the infrastructure.</p>"
