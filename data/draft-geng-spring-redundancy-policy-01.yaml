abstract:
- language: en
  script: Latn
  content: "<p>Redundancy protection is a method of service protection by sending
    copies of the same packets of one flow over multiple paths, which includes packet
    replicaiton, elimination and ordering. This document defines redundancy policy
    as an extension to the current SR policy to support redundancy protection.</p>"
