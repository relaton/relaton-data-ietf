abstract:
- language: en
  script: Latn
  content: "<p>This document describes the DHCPv6 Route Options for provisioning IPv6
    routes on a DHCPv6 client.  This is expected to improve the ability of an operator
    to configure and influence a client's ability to pick an appropriate route to
    a destination when this client is multi-homed and where other means of route configuration
    may be impractical.  The options are primarily envisaged for configuring a broadband
    Residential Gateway (RG) router, but are generic enough to be used by other types
    of DHCPv6 clients that have basic host routing capabilities.</p>"
