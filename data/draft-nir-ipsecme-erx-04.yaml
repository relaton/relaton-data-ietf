- language: en
  script: Latn
  content: "<p>This document describes an extension to the IKEv2 protocol that allows
    an IKE Security Association (SA) to be created and authenticated using the EAP
    Re-authentication Protocol extension as described in RFC 5296bis. NOTE TO RFC
    EDITOR: Replace 5296bis in the previous paragraph with the RFC number assigned
