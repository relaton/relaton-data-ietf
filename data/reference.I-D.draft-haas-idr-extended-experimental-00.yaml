abstract:
- language: en
  script: Latn
  content: "<p>BGP's primary feature extension mechanism, Optional-Transitive Path
    Attributes, has proven to be a successful mechanism to permit BGP to be extended.
    \ In order to ease various issues during the development of new BGP features,
    this document proposes an extended experimental path attribute to carry prototype
    features.</p>"
