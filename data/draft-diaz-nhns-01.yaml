abstract:
- language: en
  script: Latn
  content: "<p>This document is focused on and describes one of the projects supported
    and carried out by the RIPE NetNews Working Group. NHNS is a system and service
    based on a DNS-like structure that has been discussed, developed and deployed
    under the umbrella of the RIPE NetNews Working Group. This is an update on the
    draft version published in October 2000.</p>"
