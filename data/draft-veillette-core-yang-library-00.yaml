abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a YANG library that provides information
       about all the YANG modules used by a constrained network management
       server (e.g., a CoAP Management Interface (CoMI) server).  Simple
       caching mechanisms are provided to allow clients to minimize
       retrieval of this information.</p>
