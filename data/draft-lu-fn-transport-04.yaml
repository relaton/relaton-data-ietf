abstract:
- language: en
  script: Latn
  content: "<p>This document specifies mechanisms for fast and light-weight dissemination
    of event notifications. The purpose is to enable dataplane dissemination of Fast
    Notifications (FNs). The draft discusses the design goals, the message container
    and options for delivering the notifications to all routers within a routing area.</p>"
