abstract:
- language: en
  script: Latn
  content: "<p>The Agent Internet Protocol (AIP) provides best-effort, name-based\n   datagram delivery between autonomous AI agents identified by agent://\n   URIs.  The Agent Invocation Transport Protocol (AITP) is a message-\n   framed invocation and streaming transport above AIP.\n\n   Unlike traditional host-to-host transports (TCP, QUIC) that operate\n   on socket endpoints and byte streams, AITP is natively message-\n   framed, method-aware, and association-aware: its header carries a\n   method name as a first-class field, and its protocol data units are\n   discrete requests, responses, stream chunks, and control segments\n   exchanged between named agents.  AITP is not a byte-stream transport;\n   it is an agent-native invocation and streaming transport that carries\n   method names, request/response correlation, flow control, and session\n   semantics natively in its header — so that upper-layer agent\n   protocols need not reinvent them.  AITP intentionally includes a\n   minimal generic invocation outcome space (four dispatch- level status\n   codes); richer application semantics belong in the response body or\n   upper-layer protocols.\n\n   Unlike transport bindings that adapt existing agent protocols to\n   HTTP, gRPC, or MOQT, AITP defines a common invocation substrate\n   directly above AIP, with association state, request-concurrency flow\n   control, and method-aware framing as first-class transport concerns.\n\n   AITP is best understood as a common invocation substrate above AIP,\n   not as a byte-stream transport analogue.\n\n   This document specifies the AITP segment format, segment types,\n   status codes, flag bits, TLV options, association state machine,\n   reliability engine, flow control, circuit-breaker mechanism,\n   streaming, orderly close and abort, and interfaces to AIP below and\n   application protocols above.</p>"
