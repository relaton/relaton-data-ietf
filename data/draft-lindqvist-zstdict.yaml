abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new HTTP content coding, "zstdict", which
       enables Zstandard compression with a pre-shared dictionary.  The
       dictionary is identified by a SHA-256 hash and negotiated via the
       Content-Dict response header.</p>
