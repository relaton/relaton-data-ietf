abstract:
- language: en
  script: Latn
  content: "<p>This specification describes how the LISP architecture and protocols
    can be used in a LTE/5G mobile network to support session survivable EID mobility.
    A recommendation is provided to SDOs on how to integrate LISP into the mobile
    network.</p>"
