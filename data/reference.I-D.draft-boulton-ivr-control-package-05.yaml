abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Session Initiation (SIP) Control Package for
    basic Interactive Voice Response (IVR) interaction.  The control of Media Servers
    and their related resources in decomposed network architectures plays an important
    role in various Next Generation Networks.  This Control Package provides IVR functionality
    using the SIP Control Framework.</p>"
