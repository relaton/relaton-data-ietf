abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new DNS resource record type, Agent Entity
    Discovery (AED), to publish agent-specific trust anchors or direct match constraints
    for verifying an agent's certificate or token. This enables the cross-domain users
    or agents to authenticate, and establish secure, end-to-end connections directly
    with a private- domain agent entity.</p>"
