abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new DHCP option for delivering configuration\ninformation
    to hosts utilizing the Compatibility Mode Driver (CMD)\nprovided with Novell’s
    NetWare 5. This option is passed from the DHCP \nserver to the DHCP Client to
    provide the addresses of one or more \nMigration Agents along with their CMD network
    number.</p>"
