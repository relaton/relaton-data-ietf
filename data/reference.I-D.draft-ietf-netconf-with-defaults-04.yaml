abstract:
- language: en
  script: Latn
  content: "<p>The NETCONF protocol defines ways to read configuration data from a
    NETCONF server.  Part of this data is not set by the NETCONF client, but rather
    a default value is used.  In many situations the NETCONF client has a priori knowledge
    about default data, so the NETCONF server does not need to send it to the client.
    \ In other situations the NETCONF client will need this data as part of the NETCONF
    &lt;rpc- reply&gt; messages.  This document defines a capability-based extension
    to the NETCONF protocol that allows the NETCONF client to control whether default
    values are part of NETCONF &lt;rpc-reply&gt; messages or &lt;copy-config&gt; output
    to the target URL.</p>"
