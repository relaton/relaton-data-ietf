abstract:
- language: en
  script: Latn
  content: |-
    <p>RTCWEB have selected SCTP over DTLS over UDP with ICE for peer-to-
       peer data channels.  There is some debate over the best way to
       negotiate channels.  This proposal is a nose-to-tail description of
       an alternative to existing proposals.</p>
