abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism to control Service Function access
    to the Network Service Header (NSH). It addresses the Service Function trust issue
    and provide a method to enforce predefined access control lists to limit Service
    Function access to Service Function Chain information in the NSH in NSH-based
    Service Chaining.</p>"
