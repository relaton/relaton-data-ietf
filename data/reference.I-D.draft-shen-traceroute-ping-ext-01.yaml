abstract:
- language: en
  script: Latn
  content: "<p>This document specifies extensions to traceroute and ping techniques
    to enable their (probes) authentication, and to include requests for node specific
    information that the probe sender is interested in receiving from one or more
    nodes via the traceroute and ping replies. These extensions support UDP, TCP and
    ICMP types of traceroute and ping probes.</p>"
