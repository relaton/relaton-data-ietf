abstract:
- language: en
  script: Latn
  content: "<p>This specification allows Anycast-RP (Rendezvous Point) to be used
    inside a domain that runs Protocol Independent Multicast (PIM) only. There are
    no other multicast protocols required to support Anycast- RP, such as MSDP, which
    has been used traditionally to solve this problem.</p>"
