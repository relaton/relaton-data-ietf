abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines multipart/core, an application-independent media-
       type that can be used to combine (even recursively) several different
       media types into a single CoAP message-body with minimal framing
       overhead, along with a CoAP Content-Format identifier.</p>
