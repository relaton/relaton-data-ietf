- language: en
  script: Latn
  content: "<p>This document describes the implementation of a signaling protocol
    based on the two protocol layer concept of NSIS. The implementation of the transport
    layer is based on the CASP proposal and is discussed in this document. The design
    of a client layer for QoS signaling is detailed in a separate document.</p>"
