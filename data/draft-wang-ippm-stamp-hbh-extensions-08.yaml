abstract:
- language: en
  script: Latn
  content: "<p>This document defines optional TLVs which are carried in Simple Two-
    way Active Measurement Protocol (STAMP) test packets to enhance the STAMP based
    functions. Such extensions to STAMP enable performance measurement and collection
    at every node and link along a STAMP test packet's delivery path. It enables Hop-By-Hop
    measurements in addition to the Edge-To-Edge measurements.</p>"
