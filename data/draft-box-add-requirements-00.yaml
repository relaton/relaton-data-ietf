abstract:
- language: en
  script: Latn
  content: "<p>Adaptive DNS Discovery is chartered to define mechanisms that allow
    clients to discover and select encrypted DNS resolvers. This document describes
    several use cases for discovering DNS resolvers that support encrypted transports,
    and lists requirements that any proposed discovery and selection mechanisms should
    address. Discussion Venues This note is to be removed before publishing as an
    RFC. Source for this draft and an issue tracker can be found at https://github.com/ietf-wg-add/draft-add-requirements.</p>"
