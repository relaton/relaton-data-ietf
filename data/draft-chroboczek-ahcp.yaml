abstract:
- language: en
  script: Latn
  content: "<p>The Ad Hoc Configuration Protocol is a protocol for automatically configuring
    nodes in a multihop mesh network. It is designed to replace DHCPv4, DHCPv6 and
    IPv6 Router Advertisements in networks where these protocols are difficult or
    impossible to deploy.</p>"
