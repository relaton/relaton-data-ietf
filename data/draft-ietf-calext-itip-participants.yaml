abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines updates to RFC5546 iTip which allow
       scheduling using the "PARTICIPANT" calendar components specified in
       RFC9073.

       New properties are also defined for use within the "PARTICIPANT"
       calendar component.</p>
