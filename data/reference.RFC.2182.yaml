abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the selection of secondary servers for DNS
    zones.The number of servers appropriate for a zone is also discussed, and some
    general secondary server maintenance issues considered.  This memo provides information
    for the Internet community.  This memo does not specify an Internet standard of
    any kind.</p>"
