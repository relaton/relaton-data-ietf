- language: en
  script: Latn
  content: |-
    <p>This document specify algorithm identifiers and ASN.1 encoding
       formats for EdDSA digital signatures and subject public keys used in
       the Internet X.509 Public Key Infrastructure (PKIX) for Certificates
       and CRLs.  Parameters for Ed25519 are defined.</p>
