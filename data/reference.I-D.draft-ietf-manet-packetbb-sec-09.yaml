abstract:
- language: en
  script: Latn
  content: "<p>This document describes general and flexible TLVs for representing
    cryptographic integrity check values (ICV) (i.e. digital signatures or MACs) as
    well as timestamps, using the generalized MANET packet/ message format defined
    in RFC 5444.  It defines two Packet TLVs, two Message TLVs, and two Address Block
    TLVs, for affixing ICVs and timestamps to a packet, message and address, respectively.</p>"
