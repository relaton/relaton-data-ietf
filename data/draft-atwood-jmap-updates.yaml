title:
- language: en
  script: Latn
  content: 'Updates to JMAP: Localized Display Text, Text Handling, URIs, and Problem
    Details'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-atwood-jmap-updates-00
