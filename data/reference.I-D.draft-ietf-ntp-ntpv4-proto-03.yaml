abstract:
- language: en
  script: Latn
  content: "<p>The Network Time Protocol (NTP) is widely used to synchronize computer
    clocks in the Internet. This memorandum describes Version 4 of the NTP (NTPv4),
    introducing several changes from Version 3 of NTP (NTPv3) described in RFC 1305,
    including the introduction of a modified protocol header to accomodate Internet
    Protocol Version 6. NTPv4 also includes optional extensions to the NTPv3 protocol,including
    a dynamic server discovery mechanism.</p>"
