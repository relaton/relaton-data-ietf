abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Uniform Resource Name (URN) namespace for
    the Society of Motion Picture and Television Engineers (SMPTE) for naming persistent
    resources that SMPTE produces or manages.  A subnamespace for Universal Labels
    is specifically described.  This memo provides information for the Internet community.</p>"
