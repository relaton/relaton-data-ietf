abstract:
- language: en
  script: Latn
  content: "<p>This document describes how EVPN can be used as an NVO solution and
    explores the various tunnel encapsulation options over IP and their impact on
    the EVPN control-plane and procedures. In particular, the following encapsulation
    options are analyzed: MPLS over GRE, VXLAN, and NVGRE.</p>"
