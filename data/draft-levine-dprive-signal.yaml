abstract:
- language: en
  script: Latn
  content: |-
    <p>DNS resolvers that wish to use DNS over TLS to authoritative servers
       (ADoT) need some way to tell whether server offers DoT.  This
       document describes some ways that a server might signal that it uses
       DoT.</p>
