abstract:
- language: en
  script: Latn
  content: "<p>Bit Index Explicit Replication (BIER) is a multicast technology with
    a new encapsulation and forwarding paradigm. BIER encapsulation is specified in
    RFC8296, and this document specifies extension headers used with BIER encapsulation
    header.</p>"
