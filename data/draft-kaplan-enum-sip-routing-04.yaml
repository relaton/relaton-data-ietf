abstract:
- language: en
  script: Latn
  content: <p>A common ENUM use-case is for hop-by-hop or domain-by-domain "routing"
    of SIP requests, using private DNS trees and servers. This document describes
    this use-case, and a mechanism for a source- based query/answer mechanism for
    such.</p>
