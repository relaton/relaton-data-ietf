abstract:
- language: en
  script: Latn
  content: |-
    <p>BMP Loc-RIB lets a BMP publisher set the Peer Address value of a path
       information to zero.  This document introduces the option to
       communicate the actual peer from which a path was received when
       advertising that path with BMP Loc-RIB.</p>
