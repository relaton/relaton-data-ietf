abstract:
- language: en
  script: Latn
  content: "<p>The document defines a new type of Intra-AS I-PMSI A-D route to advertise
    the role and corresponding primary/backup state for Multicast in MPLS/BGP IP VPNs.
    The role-based state advertisement can help optimization of process in MPLS/BGP
    Multicast VPN to reduce unnecessary traffic replication and facilitate service
    provision.</p>"
