abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension for Bidirectional Forwarding Detection
    (BFD) to support Graceful Restart, in complementing Graceful Restart support of
    the underlying protocol.This would work consistently, irrespective of the bfd
    mode or protocol or the type of restart and, most importantly, the vendors design
    and implementation. This document describes in detail the challenges to BFD in
    surviving a graceful restart, and a generic solution to such challenges.</p>"
