abstract:
- language: en
  script: Latn
  content: "<p>This memo describes two protocols used in the Secure Internet Live
    Conferencing (SILC) protocol, specified in the Secure Internet Live Conferencing,
    Protocol Specification [SILC1]. The SILC Key Exchange (SKE) protocol provides
    secure key exchange between two parties resulting into shared secret key material.
    The protocol is based on Diffie-Hellman key exchange algorithm and its functionality
    is derived from several key exchange protocols. SKE use best parts of the SSH2
    Key Exchange protocol, Station-To-Station (STS) protocol and the OAKLEY Key Determination
    protocol [OAKLEY]. The second protocol, SILC Connection Authentication protocol
    provides user level authentication used when creating connections in SILC network.
    The protocol is transparent to the authentication data which means that it can
    be used to authenticate the user with, for example, passphrase (pre-shared secret)
    or public key (and certificate) based on digital signatures.</p>"
