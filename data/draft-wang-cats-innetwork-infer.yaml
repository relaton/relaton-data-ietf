abstract:
- language: en
  script: Latn
  content: "<p>Large Language Model (LLM) inference is increasingly deployed as a\n   networked service, yet existing deployments rely primarily on\n   centralized infrastructure and trusted operators.  Such designs limit\n   openness, concentrate resource ownership, and constrain scalability\n   to the capacity of individual providers.  At the same time, LLM\n   inference introduces execution characteristics (e.g., strict\n   sequential dependencies, large intermediate activations, and tight\n   latency requirements) that are not well supported by existing\n   network, transport, or coordination mechanisms in open environments.\n\n   This document specifies an open, decentralized, and scalable\n   framework for executing LLM inference across independently operated\n   and mutually untrusted participants.  The framework treats inference\n   as a distributed, layer-wise execution process subject to explicit\n   deadlines, rather than as a monolithic computation or best-effort\n   service.  It combines layer-aware activation transport and routing,\n   decentralized coordination among heterogeneous compute resources, and\n   security mechanisms that provide accountability and correctness\n   without assuming trusted execution.\n\n   This document focuses on the architectural framework, design\n   rationale, problem definition, challenges, and solution space of the\n   Open, Decentralized, and Scalable Inference framework (ODSI).  It\n   does not specify concrete wire protocols, message formats, or\n   protocol state machines.  Such protocol-level specifications are to\n   be defined in separate documents that build upon the framework\n   described herein.</p>"
