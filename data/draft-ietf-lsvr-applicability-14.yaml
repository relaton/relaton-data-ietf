  content: |-
    <p>This document discusses the usage and applicability of Link State
       Vector Routing (LSVR) extensions in data center networks utilizing
       Clos or Fat-Tree topologies.  The document is intended to provide a
       simplified guide for the deployment of LSVR extensions.</p>
