title:
- language: en
  script: Latn
  content: A Routing Protocol for Low-Power and Lossy Networks (RPL) Destination-Oriented
    Directed Acyclic Graph (DODAG) Configuration Option for the 6LoWPAN Routing Header
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-roll-turnon-rfc8138-18
