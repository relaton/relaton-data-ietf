abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a framework how the current IPv4 address structure
    can be extended towards a similar hierarchical numbering structure as used in
    the Public Switched Telephone Network and bring a new level of hierarchy to the
    routing architecture of Internet. The hierarchical IPv4 framework is backwards
    compatible with the current IPv4 framework; it will also discuss a method to decouple
    the location and identifier functions, future applications can make use of the
    separation. The framework requires extensions to the existing Domain Name System
    architecture, the existing IPv4 stack of the endpoints and to routers in the Internet.
    The framework can be implemented incrementally to the endpoints, databases, and
    routers.</p>"
