abstract:
- language: en
  script: Latn
  content: "<p>Connection Verification (CV) and Continuity Check (CC) are important
    Operations, Administration, and Management (OAM)functions of MPLS Transport Profile
    (MPLS-TP). This document specifies methods for CV and CC for MPLS-TP Label Switched
    Path (LSP) using Bidirectional Forwarding Detection (BFD).</p>"
