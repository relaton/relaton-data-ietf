abstract:
- language: en
  script: Latn
  content: <p>The precise syntax allowed in top-level domain name labels has been
    the subject to some debate.  RFC 1123, for example, makes the statement that top-level
    domain names are "alphabetic".  This document updates the definition of allowable
    top-level domain names in order to support internationalized domain names (IDNs),
    as encoded by the IDNA protocols.  This document focuses narrowly on the issue
    of IDNs and does not make any other changes or clarifications to existing domain
    name syntax rules.</p>
