abstract:
- language: en
  script: Latn
  content: "<p>The purpose of the NEXT-HOP attribute is for one border gateway A to
    tell another border gateway B which border gateway C (where C might equal A) should
    be used as the next hop on the path to the destinations advertised in the UPDATE
    containing the NEXT-HOP attribute.</p>"
