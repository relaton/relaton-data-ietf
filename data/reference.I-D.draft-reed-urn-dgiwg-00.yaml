abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Namespace Identifier (NID) for Uniform
    Resource Namespace (URN) resources published by the Defence Geospatial Information
    Working Group (DGIWG). DGIWG defines and manages resources that utilize this URN
    name model.  Management activities for these and other resource types are provided
    by the Defence Geospatial Information Working Group (DGIWG) Registry System (NRS).
    \ For the processes that DGIWG uses to manage this and other registries, see the
    DGIWG Concept of Operations.</p>"
