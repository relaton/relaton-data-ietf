abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new BGP SAFI, Encapsulation SAFI. A BGP update
    message of this SAFI contains an NLRI which uniquely identifies the BGP speaker
    that originated the update. The purpose of such an update is to carry attributes
    that define how encapsulated packets need to be delivered to the sender. For instance,
    if one BGP speaker needs to use an IP-based encapsulation in order to deliver
    traffic to a second, the second BGP speaker can use this SAFI to specify information
    about the encapsulation header that it expects. A BGP tunnel encapsulation attribute
    is specified for this purpose. Other attributes, including communities and/or
    extended communities, can also be included.</p>"
