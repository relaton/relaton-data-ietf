abstract:
- language: en
  script: Latn
  content: "<p>This document define a new response code, 4XX(BLOCKED), for a Session
    Initiation Protocol(SIP).This response code can used by User Agent Client(UAC)that
    it intensely does not want to have session with an incoming request with particular
    SIP services from particular domain. For example, UAC do not want to establish
    a session with an incoming request for video conference from particular domain.
    The existing mechanism in SIP do not provide any such facility to refuse a request
    based request URI, SIP application, media type and other SIP services.</p>"
