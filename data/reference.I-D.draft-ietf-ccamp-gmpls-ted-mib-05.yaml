abstract:
- language: en
  script: Latn
  content: "<p>This memo defines the Management Information Base (MIB) objects in
    order to manage traffic engineering database (TED) information with extension
    in support of Multi-Protocol Label Switching (MPLS) with traffic engineering (TE)
    as well as Generalized MPLS (GMPLS) for use with network management protocols.</p>"
