abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 enables network-based mobility for a regular IPv6
    mobile node without requiring its participation in any mobility- related signaling.
    This document introduces extensions to Proxy Mobile IPv6 that allows network dynamically
    binding each service flow to the mobile node, respectively. Therefore, multiple
    service flows of the mobile node can be separately controlled based on the service
    flow identifier in the Proxy Binding Update and Acknowledge messages.</p>"
