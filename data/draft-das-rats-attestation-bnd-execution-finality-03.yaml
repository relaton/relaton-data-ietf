abstract:
- language: en
  script: Latn
  content: "<p>Remote attestation can establish that a CPU, confidential virtual\n   machine, GPU, AI accelerator, DPU, or SmartNIC is running expected\n   firmware and software in an expected configuration.  As AI workloads\n   move onto confidential accelerator infrastructure and become agentic,\n   they increasingly emit consequential operations: API invocations,\n   storage mutations, network and infrastructure-control commands,\n   financial instructions, and cross-workload requests.  An acceptable\n   Attestation Result establishes that the environment is trustworthy;\n   it does not, by itself, decide whether a specific operation emitted\n   by that environment may take effect.\n\n   This document describes an attestation-bound execution-finality\n   architecture.  A consequential operation first exists as a Candidate\n   Act in a non-effective state.  An Execution-Finality Validator binds\n   the act's security-relevant parameters to validation context,\n   including Attestation Results, workload identity, policy,\n   authorization scope, and freshness, and issues an act-bound, single-\n   use Execution Handle.  A Finality Sink verifies that binding at the\n   boundary where the act would first acquire external effect.  The\n   result separates appraisal of the execution environment from\n   authorization of a concrete operation.\n\n   Existing mechanisms each answer part of this question.  TEE and\n   accelerator attestation establish what is running, but an acceptable\n   Attestation Result describes the environment and remains the same for\n   every later operation the attested workload emits, including\n   operations produced through prompt injection or model error.  OAuth\n   access tokens, transaction tokens, and workload credentials establish\n   which caller may access which resources, but they typically authorize\n   by scope and by possession of a credential rather than by the exact\n   content of one operation, and they do not require that the protected\n   effect be unreachable except through a verifying boundary.  This\n   document addresses the gap between them: binding one specific act to\n   its authorization and enforcing that binding where the act takes\n   effect.  The document is intentionally long.  It is explanatory\n   rather than a protocol specification, and its technical FAQ\n   (Appendix C) addresses anticipated critical questions from RATS,\n   WIMSE, OAuth, confidential-computing, accelerator, and DPU\n   perspectives.\n\n   The document is addressed in particular to GPU, CPU, DPU, and\n   SmartNIC vendors and to operators of confidential AI infrastructure,\n   including platforms such as NVIDIA confidential-computing GPUs and\n   BlueField DPUs, Arm Confidential Compute Architecture (CCA), AMD SEV-\n   SNP, and Intel TDX.  It requires no changes to silicon, firmware,\n   drivers, or accelerator programming models.  It consumes the\n   Attestation Results these platforms already produce, identifies DPUs\n   and SmartNICs as candidate enforcement points, and states the limits\n   of that placement, including where end-to-end encryption prevents a\n   DPU from observing the act.\n\n   Vendor platforms are discussed on the basis of public documentation\n   only.  The accompanying reference implementation uses a software-only\n   attester; it has not been run on any vendor's confidential-computing\n   hardware and does not consume any vendor-issued attestation token.\n   This document is vendor-neutral and neither claims nor implies\n   review, adoption, endorsement, or affiliation by any named vendor.\n   It complements, rather than replaces, RATS, the Entity Attestation\n   Token (EAT), workload-identity systems, and existing authorization\n   mechanisms.</p>"
