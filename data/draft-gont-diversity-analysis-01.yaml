- language: en
  script: Latn
  content: "<p>This document discusses a number of structural issues that currently
    hinders diversity and inclusiveness in the IETF. The issues discussed in this
    document are non-exhaustive, but still provide a good starting point for the IETF
    to establish a more comprehensive agenda to foster diversity and inclusiveness.</p>"
