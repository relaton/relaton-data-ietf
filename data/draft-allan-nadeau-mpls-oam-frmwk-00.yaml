abstract:
- language: en
  script: Latn
  content: "<p>This document is a framework for how data plane OAM functions can be
    applied to operations and maintenance procedures. The document is structured to
    outline how OAM functionality can be used to assist in fault management, configuration,
    accounting, performance management and security, commonly known by the acronym
    FCAPS.</p>"
