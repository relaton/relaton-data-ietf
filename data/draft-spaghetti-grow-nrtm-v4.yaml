- language: en
  script: Latn
  content: "<p>This document specifies a one-way synchronization protocol for Internet
    Routing Registry (IRR) records. The protocol allows instances of IRR database
    servers to mirror IRR records, specified in in the Routing Policy Specification
    Language (RPSL), between each other.</p>"
