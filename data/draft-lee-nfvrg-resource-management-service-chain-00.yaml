- language: en
  script: Latn
  content: "<p>This document specifies problem definition and use cases of dynamic
    service chain adaptation for traffic optimization, failover, load balancing, etc.
    It further describes design considerations and relevant framework for the resource
    management capability that dynamically creates and updates network forwarding
    paths (NFPs) considering resource state of VNF instances.</p>"
