abstract:
- language: en
  script: Latn
  content: "<p>This document discusses security and privacy concerns related to the
    distribution of location information over the Internet.  We clarify how privacy
    rules can be enforced by a location server, and how privacy rules should be interpreted
    in store and forward networks. We also describe general mechanisms for providing
    end-to-end assurances about a location object.</p>"
