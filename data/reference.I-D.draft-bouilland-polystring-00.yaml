abstract:
- language: en
  script: Latn
  content: "<p>Managing multi-languages support for a service with different parts
    can be complex.  Having its internal parts be polyglot, and coalece to end-user's
    language only when necessary is one solution.  In this paper we discuss a format
    to store, exchange, and consume multi-language strings to this goal.</p>"
