abstract:
- language: en
  script: Latn
  content: "<p>This memo provides application-specific PCEP requirements and protocol
    enhancements for the support of Wavelength Switched Optical Networks (WSON). Lightpath
    provisioning in WSONs requires a routing and wavelength assignment (RWA) process.
    Different computational architectures for the RWA process are given and the PCEP
    extensions needed to support these architectures are defined.</p>"
