abstract:
- language: en
  script: Latn
  content: "<p>This document specifies TIBET TAT, a Touch-and-Transfer protocol for
    moving sealed continuity-bearing objects across proximity, relay, and local-network
    handoff lanes. TAT defines a consent-bound handoff model, a seed exchange for
    tunnel establishment, encrypted chunk streaming, and mutual transfer anchoring
    between sender and receiver. TAT does not define identity truth, semantic class,
    or sealed object class by itself. Instead, it defines the wire and handoff layer
    that carries such objects once sender and receiver have agreed to transfer. TAT
    is intended to sit between the Continuity Envelope Protocol (CEP) and higher-level
    application profiles such as IDDrop.</p>"
