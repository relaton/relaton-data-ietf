abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes Open Shortest Path First (OSPF) v2 and OSPFv3
       encodings to advertise the router-id of the originator of inter-area
       prefixes for OSPFv2 and OSPFv3 Link-State Advertisement (LSA), which
       are needed in several use cases in multi-area OSPF use cases.</p>
