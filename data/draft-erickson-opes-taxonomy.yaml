abstract:
- language: en
  script: Latn
  content: "<p>This document presents the different models for deployment of OPES
    boxes. This document will attempt to clarify the different owners/users of an
    OPES box in order to provide a framework for discussing our observed services,
    trust relationships and working environments. Hopefully, this document will give
    a common framework for discussing and defining policy issues for networks using
    OPES boxes.</p>"
