abstract:
- language: en
  script: Latn
  content: <p>This memo describes how the "authPassword" LDAP attribute can be used
    for storing secrets used by the Salted Challenge Response (SCRAM) mechanism in
    the Simple Authentication and Security Layer (SASL) framework.  Note  A revised
    version of this draft document will be submitted to the RFC editor as a Proposed
    Standard for the Internet Community.  Discussion and suggestions for improvement
    are requested, and should be sent to sasl@ietf.org mailing list.</p>
