- language: en
  script: Latn
  content: "<p>This document is a report of implementations based on [IDR-SLA]. [IDR-SLA]
    introduces a new BGP attribute to exchange QoS SLA parameters between BGP peers.
    Current status of the implementation report covers Cisco implementation on 2 different
    OS, ExaBGP implementation and inter-operability results between them.</p>"
