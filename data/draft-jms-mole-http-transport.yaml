abstract:
- language: en
  script: Latn
  content: "<p>MoLE targets browser deployments, so Clients, Anchors, and Moderators
    need an HTTP transport for the protocol flows defined by the architecture. This
    document defines the Mole HTTP authentication scheme, which carries challenges
    and presentations for the endorsement and credential flows, and the headers used
    to return credential material. The grant exchanges with the Anchor are defined
    per protocol in [PROTOCOLS].</p>"
