abstract:
- language: en
  script: Latn
  content: "<p>This document describes the issues surrounding the timing of events
    in the rolling of a key in a DNSSEC-secured zone.  It presents timelines for the
    key rollover and explicitly identifies the relationships between the various parameters
    affecting the process.</p>"
