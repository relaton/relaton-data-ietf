abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a TCP extension that enables TCP endpoints
    in data center networks or similarly controlled administrative domains to use
    packet trimming information when it is available. When switch buffers exceed a
    threshold, rather than silently dropping a packet, the switch trims the payload
    and forwards the header. This allows the destination to issue a deterministic
    Negative Acknowledgment (NACK), enabling faster, more deterministic loss recovery.</p>"
