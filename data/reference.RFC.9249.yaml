abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model that can be used to configure
    and manage Network Time Protocol (NTP) version 4.  It can also be used to configure
    and manage version 3.  The data model includes configuration data and state data.</p>"
