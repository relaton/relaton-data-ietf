date:
- type: published
  at: '2026-08-14'
abstract:
- language: en
  script: Latn
  content: "<p>The Domain Name System (DNS) allows a query with QTYPE=RRSIG.  Such a\n   query has no useful answer.  RRSIG resource records are meaningful\n   only together with the resource records they cover, so a response can\n   carry no more than an arbitrary subset of the signatures present at\n   the query name.  This document specifies that DNS responders refuse\n   queries with QTYPE=RRSIG, and that DNS requestors do not send them.\n   It supplies the guidance that [RFC8482] left unspecified.</p>"
