- language: en
  script: Latn
  content: |-
    <p>This specification defines the application/merge-patch media type and
       it's intended use with the HTTP PATCH method defined by RFC 5789; as
       well as the "application/json+merge-patch" variation that defines the
       "Merge Patch" semantics for JSON documents.</p>
