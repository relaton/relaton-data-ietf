abstract:
- language: en
  script: Latn
  content: "<p>The internet was designed for human actors.  Its discovery\n   infrastructure — search engines, directories, and hyperlinked\n   documents — assumes a human reading and navigating.  Autonomous\n   agents (bots) operating on the internet today face a structural gap:\n   there is no machine-native, globally accessible index of services\n   they can consume.\n\n   This document defines the core infrastructure of the *API Index\n   (APIX)*: a HATEOAS-based, globally accessible, commercially\n   sustainable service discovery infrastructure designed for autonomous\n   agents as its primary consumers.  It specifies the governance model,\n   the three-dimensional trust model, the APIX Manifest (APM) base\n   format, commercial onboarding and sanctions compliance, the supply-\n   side funding model, and the base Index API.  These elements are\n   shared across all APIX service types.\n\n   Profile documents extend this core for specific service categories:\n   the APIX Services Profile (draft-rehfeld-apix-services-02) defines\n   the web API and bot service profile; the APIX IoT Device Profile\n   (draft-rehfeld-apix-iot-02) defines the IoT device profile.</p>"
