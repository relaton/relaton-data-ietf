- language: en
  script: Latn
  content: "<p>This document discusses architectural considerations for emergency
    \ncontext routing of Internet technologies.  The purpose of this \ndocument is
    to provide a systemic view of emergency context routing,\ndiscuss unresolved issues,
    and explain the relationship of some of \nthe proposals to these issues, while
    discussing potential directions \nthat might be still be necessary for the working
    group to \ninvestigate.</p>"
