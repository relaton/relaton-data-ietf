abstract:
- language: en
  script: Latn
  content: "<p>This document describes the role of link indications within the Internet
    Architecture. While the judicious use of link indications can provide performance
    benefits, inappropriate use can degrade both robustness and performance. This
    document summarizes current proposals, describes the architectural issues and
    provides examples of appropriate and inappropriate uses of link layer indications.</p>"
