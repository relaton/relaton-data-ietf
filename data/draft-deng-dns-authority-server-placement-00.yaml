- language: en
  script: Latn
  content: "<p>The geographical distribution of DNS authority servers highly affects
    the DNS query latency and financial costs. This document proposes an approach
    on optimizing the geographical placement of DNS authority servers so that the
    DNS query latency is highly reduced while the financial cost is within its budget.</p>"
