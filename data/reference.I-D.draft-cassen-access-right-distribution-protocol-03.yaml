- language: en
  script: Latn
  content: "<p>This document describes a protocol to securely distribute service access
    rights to IPTV customers using multicast over a national backbone. The protocol
    typically runs on any piece of equipments to locally store owned customers TV
    service access right. This design provides access control at edge level.</p>"
