abstract:
- language: en
  script: Latn
  content: "<p>This document defines the underlying data processing operations used
    by Session Initiation Protocol (SIP) for Instant Messaging Leveraging Presence
    Extensions (SIMPLE) presence agents and presence user agents. The data processing
    operations described here include composition, privacy filtering, and watcher
    filtering.</p>"
