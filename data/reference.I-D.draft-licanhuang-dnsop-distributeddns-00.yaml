abstract:
- language: en
  script: Latn
  content: "<p>This file is a proposal for P2P based DNS query stratagy in IpV6. The
    DNS servers construct n-tuple overlay virtual hierarchical overlay network.With
    cached addresses of DNS servers, the overload of traffic in tree structure can
    be avoided. This strategy may use for DNS query in IpV6 for a large number of
    domain names.</p>"
