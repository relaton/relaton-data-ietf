abstract:
- language: en
  script: Latn
  content: "<p>Bidirectional Forwarding Detection (BFD) is expected to monitor bi-
    directional paths.  When a BFD session monitors an explicit routed path there
    is a need to be able to direct egress BFD peer to use specific path for the reverse
    direction of the BFD session.</p>"
