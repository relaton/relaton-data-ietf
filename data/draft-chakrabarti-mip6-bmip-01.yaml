- language: en
  script: Latn
  content: "<p>This document defines an easy mechanism of boot-strapping Mobile IPv6
    service. The boot-strapping mechanism includes locating a home agent, dynamic
    home-address allocation and setting up initial security association with the home-agent
    using IKE version 2 and EAP.</p>"
