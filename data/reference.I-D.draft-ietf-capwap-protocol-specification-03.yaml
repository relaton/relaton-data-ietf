abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the Control And Provisioning of Wireless
    Access Points (CAPWAP) Protocol. The CAPWAP protocol meets the IETF CAPWAP working
    group protocol requirements. The CAPWAP protocol is designed to be flexible, allowing
    it to be used for a variety of wireless technologies. This document describes
    the base CAPWAP protocol. The CAPWAP protocol binding which defines extensions
    for use with the IEEE 802.11 wireless LAN protocol is available in [11]. Extensions
    are expected to be defined to enable use of the CAPWAP protocol with additional
    wireless technologies.</p>"
