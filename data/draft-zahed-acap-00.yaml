abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Agent Capability Advertisement Protocol
    (ACAP), a REST-like protocol built on HTTP/3 that defines a structured registry
    and exchange format for Agent Capability Documents (ACDs). ACAP enables the discovery
    of AI agents deployed across different administrative domains on the Internet.
    Each agent exposes an ACAP endpoint, hosted at a well-known URI, that serves ACDs
    describing the capabilities, authentication requirements, and operational metadata
    for agents within that domain. ACAP supports three core operations: retrieval,
    registration, and capability-based search. In deployments where multiple agent
    operators share hosting infrastructure, ACDs are cryptographically signed to enable
    secure, decentralized agent discovery.</p>"
