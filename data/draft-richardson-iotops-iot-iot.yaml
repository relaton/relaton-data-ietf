abstract:
- language: en
  script: Latn
  content: "<p>This document details a problem statement relating to ownership of
    IoT devices. The problem details is that of changing ownership or possession of
    a device when against the consent or knowledge of the device and/or manufacturer.
    Examples relating to outer door control are used to illustrate the problem statement
    in an intuitive scope.</p>"
