abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this memo is to describe a new IOAM Node Data Field
    type, called Flex Field, for In-Situ Operations, Administration, and Maintenance
    (IOAM). This option type, under IOAM Trace Option-Types will allow one to append
    variable length node data in an IOAM packet, along a network path.</p>"
