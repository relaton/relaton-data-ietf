abstract:
- language: en
  script: Latn
  content: "<p>This memo provides for an extension to RFC 8520 (Manufacturer Usage
    Description Specification, MUD) that allows MUD file authors to specify ownership
    and licensing of MUD files themselves. This memo updates RFC 8520. However, it
    can also be used for purposes outside of MUD, and the grouping is structured as
    such.</p>"
