abstract:
- language: en
  script: Latn
  content: "<p>This document is the result of a survey that gathered new or updated
    descriptions of currently available implementations of X.500, including commercial
    products and openly available offerings. This document is a revision of RFC 1292.
    This memo provides information for the Internet community. This memo does not
