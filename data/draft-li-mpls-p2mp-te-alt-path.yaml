- language: en
  script: Latn
  content: "<p>The document proposes a solution to be able to set up the alternative
    path for specific leaf nodes of a P2MP TE LSP. Corresponding RSVP-TE protocol
    extension is also defined. The solution is used to cope with the issue that in
    some scenarios traffic loss happens even if there exists possible path for the
    leaf nodes.</p>"
