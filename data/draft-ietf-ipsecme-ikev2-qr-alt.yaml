title:
- language: en
  script: Latn
  content: Mixing Preshared Keys in the IKE_INTERMEDIATE and in the CREATE_CHILD_SA
    Exchanges of IKEv2 for Post-quantum Security
  format: text/plain
docidentifier:
- content: draft-ietf-ipsecme-ikev2-qr-alt
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2025-05-23'
abstract:
- language: en
  script: Latn
  content: "<p>An Internet Key Exchange protocol version 2 (IKEv2) extension defined
    in RFC8784 allows IPsec traffic to be protected against someone storing VPN communications
    today and decrypting them later, when (and if) a Cryptographically Relevant Quantum
    Computer (CRQC) is available. The protection is achieved by means of a Post-quantum
    Preshared Key (PPK) which is mixed into the session keys calculation. However,
    this protection does not cover an initial IKEv2 Security Association (SA), which
    might be unacceptable in some scenarios. This specification defines an alternative
    way to provide protection against quantum computers, which is similar to the solution
    defined in RFC8784, but also protects the initial IKEv2 SA. RFC8784 assumes that
    PPKs are static and thus they are only used when an initial IKEv2 SA is created.
    If a fresh PPK is available before the IKE SA expired, then the only way to use
    it is to delete the current IKE SA and create a new one from scratch, which is
    inefficient. This specification defines a way to use PPKs in active IKEv2 SAs
    for creating additional IPsec SAs and rekey operations.</p>"
