abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a linear protection switching mechanism for
    MPLS-TP. This mechanism supports 1+1 unidirectional/bidirectional protection switching
    and 1:1 bidirectional protection switching. It is purely supported by MPLS-TP
    data plane, and can work without any control plane. This document is a product
    of a joint Internet Engineering Task Force (IETF) / International Telecommunications
    Union Telecommunications Standardization Sector (ITU-T) effort to include an MPLS
    Transport Profile within the IETF MPLS and PWE3 architectures to support the capabilities
    and functionalities of a packet transport network as defined by the ITU-T.</p>"
