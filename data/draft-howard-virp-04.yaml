abstract:
- language: en
  script: Latn
  content: "<p>The Verified Infrastructure Response Protocol (VIRP) defines a\n   cryptographic trust framework for agentic AI systems operating on\n   live network infrastructure.  As AI agents gain the capability to\n   autonomously configure, audit, and remediate production systems, the\n   absence of a verifiable chain of custody for observations and actions\n   introduces fundamental risks: fabricated telemetry, unauthorized\n   state changes, and the inability to distinguish legitimate AI-\n   initiated operations from compromise.\n\n   VIRP addresses this through seven trust primitives that collectively\n   enforce observation integrity, intent separation, action\n   authorization, outcome verification, baseline memory, multi-vendor\n   normalization, and agent process containment.  Observations are\n   cryptographically signed at collection time using Ed25519 asymmetric\n   signatures.  A two-channel architecture separates read-only\n   Observation from write-intent Intent, with intent gating enforced at\n   the protocol layer.  Trust tiers (GREEN/YELLOW/RED/BLACK) govern\n   action authorization with human-in-the-loop controls for elevated\n   operations.\n\n   This paper presents the protocol specification, a live multi-vendor\n   implementation (IronClaw) tested against 35 Cisco IOS routers, a\n   FortiGate 200G firewall, and Cisco 3850 switching infrastructure,\n   adversarial red team findings produced by the AI agent itself, and a\n   two-VM containment architecture derived from agent-identified\n   security gaps.  Results demonstrate that VIRP enables mathematically\n   verifiable infrastructure audit trails and that properly contained AI\n   agents exhibit self-reinforcing safety behavior when operating within\n   the protocol boundaries.</p>"
