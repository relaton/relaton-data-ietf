abstract:
- language: en
  script: Latn
  content: "<p>This draft specifies a Border Gateway Protocol Network Layer Reachability
    Information (BGP NLRI) encoding format for flow specifications (RFC 5575bis) that
    can match on a variety of tunneled traffic. In addition, flow specification components
    are specified for certain tunneling header fields.</p>"
