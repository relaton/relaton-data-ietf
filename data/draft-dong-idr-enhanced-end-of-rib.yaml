abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an enhanced BGP End-of-RIB marker which can
    facilitate fine granular BGP route convergence for various BGP based network services.
    A new BGP capability to negotiate the usage of the enhanced End-of-RIB marker
    is also specified.</p>"
