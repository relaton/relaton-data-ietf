abstract:
- language: en
  script: Latn
  content: "<p>Network stratum and application stratum form a federation to faciliate
    user's access.  Network operator acts as Identity Provider (IdP), and application
    reuses underlying network's security capabilities to simlify application's access.
    \ This document is to introduce such federated cross-layer access use case and
    message flows.</p>"
