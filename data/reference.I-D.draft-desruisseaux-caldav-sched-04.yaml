abstract:
- language: en
  script: Latn
  content: <p>This document defines extensions to the Web Distributed Authoring and
    Versioning (WebDAV) protocol to specify a standard way of exchanging and processing
    scheduling messages based on the iCalendar Transport- Independent Interoperability
    Protocol (iTIP).  This document defines the "calendar-schedule" feature of CalDAV.</p>
