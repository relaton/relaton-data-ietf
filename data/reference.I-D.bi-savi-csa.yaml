abstract:
- language: en
  script: Latn
  content: <p>This document describes a method to authorize and authenticate the address
    of a node in an IPv6 network.  Except for "Host Change", this method satisfies
    all the requirements in the Charter of SAVI.  The modification on a host can be
    regarded as the extension of SEND and IPSec.</p>
