abstract:
- language: en
  script: Latn
  content: "<p>This document defines the usage of the BGP Prefix Origin Validation
    State Extended Community [I-D.ietf-sidr-origin-validation-signaling] to signal
    prefix origin validation results from a route-server to its peers. Upon reception
    of prefix origin validation results peers can use this information in their local
    routing decision process.</p>"
