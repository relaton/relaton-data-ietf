abstract:
- language: en
  script: Latn
  content: "<p>BGP FlowSpec Extensions for Routing Policy Distribution (RPD) has provided
    a mechanism to use BGP Flowspec address family as routing- policy distribution
    protocol. This document provides an implementation report for RPD mechanism on
    inbound-traffic and outbound-traffic adjustment scenarios. What's more, it gives
    some details and consideration for exceptions during development and verification.</p>"
