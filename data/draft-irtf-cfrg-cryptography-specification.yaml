- language: en
  script: Latn
  content: "<p>This document provides guidelines and best practices for writing technical
    specifications for cryptography protocols and primitives, targeting the needs
    of implementers, researchers, and protocol designers. It highlights the importance
    of technical specifications and discusses strategies for creating high-quality
    specifications that cater to the needs of each community, including guidance on
    representing mathematical operations, security definitions, and threat models.</p>"
