abstract:
- language: en
  script: Latn
  content: '<p>This document defines a YANG 1.1 data model for configuring global
    sets of X.509 certificates and SSH host-keys that can be referenced by other data
    models for trust. While the SSH host-keys are uniquely for the SSH protocol, the
    X.509 certificates may have multiple uses, including authenticating protocol peers
    and verifying signatures. Editorial Note (To be removed by RFC Editor) This draft
    contains many placeholder values that need to be replaced with finalized values
    at the time of publication. This note summarizes all of the substitutions that
    are needed. No other RFC Editor instructions are specified elsewhere in this document.
    Artwork in this document contains shorthand references to drafts in progress.
    Please apply the following replacements: o "XXXX" --&gt; the assigned RFC value
    for this draft o "YYYY" --&gt; the assigned RFC value for draft-ietf-netconf-crypto-
    types Artwork in this document contains placeholder values for the date of publication
    of this draft. Please apply the following replacement: o "2019-04-29" --&gt; the
    publication date of this draft The following Appendix section is to be removed
    prior to publication: o Appendix A. Change Log</p>'
