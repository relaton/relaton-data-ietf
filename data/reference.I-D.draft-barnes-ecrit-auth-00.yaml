abstract:
- language: en
  script: Latn
  content: "<p>In order to prevent abuse of emergency calling resources for non- emergency
    purposes, operators of SIP proxies require a capability to distinguish emergency
    calls from non-emergency calls. This document describes several mechanisms by
    which the entities participating in a call can include in SIP headers a verifiable
    assertion that the signaled call is an emergency call.</p>"
