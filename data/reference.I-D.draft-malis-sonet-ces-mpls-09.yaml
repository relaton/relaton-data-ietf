abstract:
- language: en
  script: Latn
  content: "<p>This document describes a historical method for encapsulating SONET/SDH
    Path signals for transport across packet-switched networks (PSNs).  The PSNs explicitly
    supported by this document include MPLS and IP. Note that [RFC4842] describes
    the standards-track protocol for this functionality, and new implementations must
    use [RFC4842] rather than this document except when interoperability with older
    implementations is desired.</p>"
