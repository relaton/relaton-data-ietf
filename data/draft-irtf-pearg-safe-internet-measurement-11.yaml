abstract:
- language: en
  script: Latn
  content: "<p>Internet measurement is important to researchers from industry, academia
    and civil society. While measurement of the internet can give insight into the
    functioning and usage of the internet, it can present risks to user privacy and
    safety. This document describes briefly those risks and proposes guidelines for
    ensuring that internet measurements can be carried out safely, with examples.</p>"
