abstract:
- language: en
  script: Latn
  content: "<p>This specification defines HPACK, a compression format for efficiently
    representing HTTP header fields in the context of HTTP/2. Editorial Note (To be
    removed by RFC Editor) Discussion of this draft takes place on the HTTPBIS working
    group mailing list (ietf-http-wg@w3.org), which is archived at [1]. Working Group
    information and related documents can be found at [2] (Wiki) and [3] (source code
    and issues tracker). The changes in this draft are summarized in Appendix A.1.</p>"
