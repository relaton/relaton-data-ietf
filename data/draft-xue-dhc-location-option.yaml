abstract:
- language: en
  script: Latn
  content: "<p>This document introduces WTP information transported using DHCPv4/v6.
    In this procedure, DHCPv4/v6 snooping is deployed on the WTP node or AC node.
    Then the WTP information can be inserted into the extension option of DHCPv4/v6
    message. GW obtain the WTP information of the subscriber through which the subscriber
    accesses network.</p>"
