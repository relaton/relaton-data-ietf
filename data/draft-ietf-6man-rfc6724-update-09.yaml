abstract:
- language: en
  script: Latn
  content: "<p>When RFC 6724 was published it defined an address selection algorithm\n   along with a default policy table, and noted a number of examples\n   where that policy table might benefit from adjustment for specific\n   scenarios.  It also noted that it is important for implementations to\n   provide a way to change the default policies as more experience is\n   gained.  This update draws on several years of such operational\n   experience to refine RFC 6724, with emphasis on preference for the\n   use of ULA addresses over IPv4 addresses and the addition of\n   mandatory support for Rule 5.5.  It also defines the concept of\n   \"known-local\" ULA prefixes and the means by which nodes can identify\n   them and insert them into their policy table such that local ULA-to-\n   ULA communications become preferred over GUA-to-GUA for local use.\n   The update also demotes the preference for 6to4 addresses.  These\n   changes to default behavior improve supportability of common use\n   cases, including automatic / unmanaged scenarios.  It is recognized\n   that some less common deployment scenarios may require explicit\n   configuration or custom changes to achieve desired operational\n   parameters.</p>"
