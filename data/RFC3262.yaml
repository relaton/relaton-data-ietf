abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to the Session Initiation Protocol
    (SIP) providing reliable provisional response messages. This extension uses the
    option tag 100rel and defines the Provisional Response ACKnowledgement (PRACK)
    method. [STANDARDS-TRACK]</p>"
