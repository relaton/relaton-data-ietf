abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Dynamic Mesh-based overlay Multicast Protocol
    (DMMP) to support multicast data delivery applications without relying on classic
    IP multicast, including multicast group management, overlay hierarchy establishment,
    multicast tree construction and data forwarding scheme from the source to a number
    of receivers. The DMMP framework builds on control plane functions which dynamically
    manage an overlay core and a multicast tree layer. The key idea is a small number
    of selected end hosts self-organizing into an overlay mesh, and dynamically maintaining
    such a mesh. Based on the constructed mesh, some core-based clusters are built
    with capacity-aware trees inside. Then, a multicast tree consists of DMMP-aware
    end hosts (and/or specific routers) is built on the top of the overlay core for
    efficient delivery of the multicast data.</p>"
