abstract:
- language: en
  script: Latn
  content: "<p>This document describes identity-anchored bearer handover: a method\n   for keeping a live, authenticated real-time media session (such as a\n   voice call) running uninterrupted while the underlying network bearer\n   changes - for example a device moving from Wi-Fi to cellular.  The\n   session is bound to a cryptographic identity and a media-encryption\n   key, never to an IP address.  When the bearer changes, the endpoint\n   detects the new local address and emits an authenticated re-anchor\n   over a stable control channel; the media path is re-established to\n   the same cryptographic context, so the far end can relearn the new\n   transport source without exposing the session to source-substitution\n   (latching) attacks.  No central media relay is required: a default-\n   routed media anchor plus an authenticated re-anchor is sufficient.\n   Each handover MAY emit a signed transport-rebind event for an\n   auditable trail.  Human-facing names, dial strings, or aliases may\n   select a policy surface, but they are not the cryptographic anchor\n   and not the transport binding.  This protocol is transport-agnostic\n   and complements JIS [JIS], the MUX Status Frame [MUX], the Semantic\n   Surface Manifest [SSM], and TIBET provenance [TIBET].</p>"
