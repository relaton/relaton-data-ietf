  script: Latn
  content: PCE Communication Protocol (PCEP) Extensions for Label Switched Path (LSP)
    Scheduling with Stateful PCE
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-pce-stateful-pce-lsp-scheduling-27
