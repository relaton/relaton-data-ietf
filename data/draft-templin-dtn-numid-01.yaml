abstract:
- language: en
  script: Latn
  content: "<p>The Delay Tolerant Network (DTN) Bundle Protocol (BP) uses Uniform
    Resource Identifiers (URIs) as the basis for Endpoint and Node IDs. IDs that are
    encoded as alphanumeric strings can consume excessive precious bandwidth over
    constrained links, leading to a desire for a short numeric ID format. This document
    discusses alternatives for a DTN numeric node ID format.</p>"
