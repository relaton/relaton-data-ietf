abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Social Architecture Diagnostic Profile\n   (SADP), a JSON-based format for exchanging diagnostic descriptions of\n   socio-technical environments.  A profile records the object under\n   review, the evidence used, the diagnostic dimensions applied,\n   identified breaks or tensions, limitations, confidence levels, and\n   human-review requirements.  The format is intended for research\n   tools, educational systems, expert-review workflows, case\n   repositories, and other systems that need portable and inspectable\n   diagnostic descriptions.\n\n   This document does not define a scoring standard, certification\n   procedure, legal assessment process, psychological assessment\n   process, or automated consequential decision process.</p>"
