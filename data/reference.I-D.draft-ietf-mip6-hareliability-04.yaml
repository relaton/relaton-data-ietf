abstract:
- language: en
  script: Latn
  content: "<p>The home agent can be a single point of failure when Mobile IPv6 is
    operated in a system.  It is critical to provide home agent reliability in the
    event of a home agent crashing or becoming unavailable.  This would allow another
    home agent to take over and continue providing service to the mobile nodes.  This
    document describes the problem scope briefly and provides a mechanism of home
    agent failure detection, home agent state transfer, and home agent switching for
    home agent redundancy and reliability.</p>"
