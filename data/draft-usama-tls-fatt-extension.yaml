abstract:
- language: en
  script: Latn
  content: "<p>This document applies only to non-trivial extensions of TLS, which
    require formal analysis. FATT process has successfully discovered CVEs of *CVSS
    7.5* and most recently expected *CVSS 9.1* in the *production* implementations
    of the drafts proposed for adoption in the TLS WG. To achieve high cryptographic
    assurances, this document proposes the drafts specify a clear threat model and
    informal security goals in the Security Considerations section, as well as motivation
    and a protocol diagram in the draft.</p>"
