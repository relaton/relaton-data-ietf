abstract:
- language: en
  script: Latn
  content: "<p>This document creates a Dynamic Host Configuration Protocol (DHCP)
    Option for the downloading of a Location Uniform Resource Identifier (URI) of
    a client, to be dereferenced in a separate transaction. Once the location URI
    is received by an endpoint, it can be dereferenced by the client to learn its
    geographic location, or sent to another entity to learn this client's location.</p>"
