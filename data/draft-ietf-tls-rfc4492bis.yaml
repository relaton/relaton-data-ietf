title:
- language: en
  script: Latn
  content: Elliptic Curve Cryptography (ECC) Cipher Suites for Transport Layer Security
    (TLS) Versions 1.2 and Earlier
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-tls-rfc4492bis-17
