abstract:
- language: en
  script: Latn
  content: "<p>Generalized Multi-Protocol Label Switching (GMPLS) is applicable to
    Ethernet switches supporting Provider Backbone Bridge Traffic Engineering (PBB-TE)
    networks. The GMPLS controlled PBB-TE network not only automates creation and
    deletion of Eth-LSPs, but also provides sophisticated Eth-LSP recovery mechanisms
    such as protection and restoration of an Eth-LSP. This document describes the
    requirements for the set of solutions of GMPLS controlled PBB-TE networks.</p>"
