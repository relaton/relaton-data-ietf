abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes a service affinity solution between client and
    server based on Transport Layer Security (TLS). An extension to Transport Layer
    Security (TLS) 1.3 to enable session migration. This mechanism is designed for
    network architectures, particularly for multi-homed servers that possess multiple
    network interfaces and IP addresses. This document also introduces a Reliable
    Framing Layer that operates above the TLS record layer to provide message framing,
    sequence numbering, acknowledgment tracking, and automatic retransmission. The
    Framing Layer ensures zero application data loss during TLS session migration
    by buffering unacknowledged data frames and retransmitting them to the new server
    endpoint after migration completes.</p>"
