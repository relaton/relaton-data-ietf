- language: en
  script: Latn
  content: |-
    <p>This document specifies an extension to Mobile IPv4 UDP encapsulation
    (RFC 3519) which enables optimization of overhead when UDP
    encapsulation is used, and most of the mobile node's data traffic is
    destined to one particular correspondent node.</p>
