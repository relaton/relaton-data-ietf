- language: en
  script: Latn
  content: "<p>This draft discusses the applicability of the COPS protocol as the
    MIDCOM protocol, in the context of the current protocol evaluations within the
    MIDCOM working group. It discusses the architectural similarities between COPS
    and Midcom and how COPS meets most of the MIDCOM protocol requirements.</p>"
