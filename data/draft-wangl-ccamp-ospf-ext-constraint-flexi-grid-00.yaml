abstract:
- language: en
  script: Latn
  content: "<p>In Flexible-Grid networks, network elements and links may impose additional
    routing constraints, which cannot be ignored in Routing and Spectrum Assignment
    (RSA) process. This document describes the requirements of such constraints, and
    then provides efficient encodings to specify how the information is carried.</p>"
