- language: en
  script: Latn
  content: "<p>This draft compares different IPv6 prefix formats that can be used
    by IPv6-IPv4 translator to represent IPv4 addresses in the IPv6 Internet. The
    goal of the draft is asses the benefits and problems of each proposed format and
    make a recommendation about which prefix to use in the different scenarios considered.</p>"
