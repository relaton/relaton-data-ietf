abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Entity Attestation Token (EAT) Attestation
    Result (EAR) profile for the composite attestation of Intel® Trust Domain Extensions
    (TDX)–based Confidential Virtual Machines (CVMs) together with confidential NVIDIA
    GPUs (C-GPUs) deployed in Microsoft Azure. The profile outlines claims that enable
    relying parties to establish trust in the integrity and confidentiality of the
    combined confidential computing environment. Developed collaboratively by Microsoft,
    Intel, and NVIDIA, this work is intended to foster interoperable composite attestation
    across heterogeneous Trusted Execution Environments (TEEs) and confidential accelerators,
    while encouraging adoption and extension by verifier providers across the confidential
    computing ecosystem.</p>"
