abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism that helps to minimize the\nnegative effects on MPLS traffic caused by LSR's control plane\nrestart, and specifically by the restart of its RSVP-TE component, on\nLSRs that are capable of preserving the MPLS forwarding component\nacross the restart.</p>"
