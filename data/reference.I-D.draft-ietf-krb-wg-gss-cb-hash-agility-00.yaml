abstract:
- language: en
  script: Latn
  content: "<p>Currently, the Kerberos Version 5 Generic Security Services Application
    Programming Interface (GSS-API) mechanism (RFC4121) does not have the ability
    to utilize better hash algorithms used to generate channel binding identities.
    The current mechanism for doing this is hard coded to use MD5 only. The purpose
    of this document is to outline changes required to update the protocol so that
    more secure algorithms can be used to create channel binding identities. The extensibility
    of this solution also provides an eventual replacement of identities based solely
    on hash algorithms.</p>"
