abstract:
- language: en
  script: Latn
  content: "<p>RFC 4601 mandates the use of IPsec to ensure authentication of the
    link-local messages in the Protocol Independent Multicast - Sparse Mode (PIM-SM)
    routing protocol.  This document specifies mechanisms to authenticate the PIM-SM
    link local messages using the IP security (IPsec) Authentication Header (AH) or
    Encapsulating Security Payload (ESP).  It specifies optional mechanisms to provide
    confidentiality using the ESP.  Manual keying is specified as the mandatory and
    default group key management solution.  To deal with issues of scalability and
    security that exist with manual keying, an optional automated group key management
    mechanism is specified.</p>"
