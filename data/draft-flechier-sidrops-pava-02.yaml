abstract:
- language: en
  script: Latn
  content: "<p>This document defines PAth VAlidation (PAVA), a scheme for validating
    the Border Gateway Protocol (BGP) AS_PATH field based on the AS relationships.
    Validation involves sending queries to the ASes along the path and each query
    specifies information about the prefix and the relevant path segment. In this
    draft, for the decentralized distribution system that ASes on a path need for
    distributing the information, we propose to use the Domain Name System (DNS) and
    DNSSEC.</p>"
