abstract:
- language: en
  script: Latn
  content: "<p>This document specify a mechanism to allow IPv6 stack implementation
    to parse upcoming IPv6 extension header by reserving a small range of protocol
    number code-points for well defined IPv6 extension headers. IPv6 stack implementors
    can code these range into their network stack a priori.  These reserved code-points
    provide an guarantee that a given next header is a well formed extension header
    and not a next layer protocol.</p>"
