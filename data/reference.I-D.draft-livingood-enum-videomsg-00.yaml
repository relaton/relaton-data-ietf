abstract:
- language: en
  script: Latn
  content: <p>This document registers the Enumservice type "videomsg" and subtype
    "sip" using the URI scheme sip, as well as the subtype "tel" using the URI scheme
    'tel' as per the IANA registration process defined in the ENUM specification,
    RFC 3761. This Enumservice is used to facilitate the real-time routing of video
    communications to a video messaging system.</p>
