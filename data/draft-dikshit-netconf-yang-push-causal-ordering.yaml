abstract:
- language: en
  script: Latn
  content: |-
    <p>In YANG Push version 2, each publisher numbers its own
       notifications, and the numbers of two publishers are not
       comparable. When data moves from one publisher to another, a
       receiver cannot tell from the sequence numbers which update is
       newer. This document proposes carrying a Hybrid Logical Clock
       (HLC), a timestamp plus a small tie-breaking counter, in the
       notification envelope. It gives one order across publishers with
       constant state at the receiver and does not wrap in practice.</p>
