abstract:
- language: en
  script: Latn
  content: "<p>This document describes a simple procedure that allows \"legacy\" BGP\nspeakers to exchange route target membership information in BGP\nwithout using mechanisms specified in RFC 4684.  The intention of the\nproposed technique is to help in partial deployment scenarios and is\nnot meant to replace RFC 4684.</p>"
