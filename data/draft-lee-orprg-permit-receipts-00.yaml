abstract:
- language: en
  script: Latn
  content: "<p>This document defines requirements and an abstract data model for PermitReceipts
    used in permit-before-commit authorization of AI-agent and workload external effects.
    A verifier evaluates a canonicalized effect request, action digest, policy epoch,
    validity interval, scope, issuer evidence, revocation status, and anti-replay
    state before a protected effect is committed at an effect boundary. The document
    specifies verifier behavior, failure semantics, conformance expectations, and
    candidate interoperability registries for discussion. It is intended to enable
    IETF discussion about the appropriate home, scope, and wire-profile split for
    this work.</p>"
