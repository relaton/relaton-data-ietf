abstract:
- language: en
  script: Latn
  content: "<p>This specification defines an authorization details type for including
    authorization evidence and audit trail information in OAuth 2.0 access tokens
    using the Rich Authorization Requests (RAR) framework. When an Authorization Server
    processes user consent, it enriches the authorization details with cryptographic
    proof of user confirmation, supporting accountability, compliance, and dispute
    resolution in scenarios where autonomous agents act on behalf of users.</p>"
