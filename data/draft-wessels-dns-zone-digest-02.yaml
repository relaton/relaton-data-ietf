abstract:
- language: en
  script: Latn
  content: "<p>This document describes a protocol and DNS Resource Record used to
    provide a message digest over DNS zone data. In particular, it describes how to
    compute, sign, represent, and use the message digest to verify the contents of
    a zone for accuracy and completeness. The ZONEMD Resource Record type is introduced
    for conveying the message digest data.</p>"
