abstract:
- language: en
  script: Latn
  content: "<p>We define a RELOAD Usage for Application Layer Multicast as well as
    extensions to RELOAD message layer to support ALM.  The ALM Usage is intended
    to support a variety of ALM control algorithms in an overlay-independent way.
    \ Scribe is defined as an example algorithm.</p>"
