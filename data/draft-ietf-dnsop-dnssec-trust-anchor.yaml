  content: "<p>This document recommends a preferred format for specifying trust anchors
    in DNSSEC validating security-aware resolvers and describes how such a resolver
    should initialize trust anchors for use. This document also describes different
    mechanisms for keeping trust anchors up to date over time.</p>"
