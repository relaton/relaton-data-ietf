abstract:
- language: en
  script: Latn
  content: "<p>This memo defines two new Multi Topology Routing Identifiers (MT IDs)
    in OSPFv3 [RFC2740]).  These new MT-OSPFv3 [I-D.ietf-ospf-mt-ospfv3] topologies
    are meant to convey routing information which is restricted to IPv4-mapped IPv6
    addresses [I-D.ietf-behave-address-format].  The goal of running separate instances
    for IPv4-mapped IPv6 routes is to isolate the IPv6 routing table from the IPv4
    routing table, and to avoid any overload due to the population of the table by
    IPv4-inferred routes.  This isolation is motivated also from an operational perspective
    to enforce specific routing policies for each topology.</p>"
