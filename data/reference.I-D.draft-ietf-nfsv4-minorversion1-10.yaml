abstract:
- language: en
  script: Latn
  content: "<p>This Internet-Draft describes NFSv4 minor version one, including features
    retained from the base protocol and protocol extensions made subsequently. The
    current draft includes description of the major extensions, Sessions, Directory
    Delegations, and parallel NFS (pNFS). This Internet-Draft is an active work item
    of the NFSv4 working group. Active and resolved issues may be found in the issue
    tracker at: http://www.nfsv4-editor.org/cgi-bin/roundup/nfsv4. New issues related
    to this document should be raised with the NFSv4 Working Group nfsv4@ietf.org
    and logged in the issue tracker.</p>"
