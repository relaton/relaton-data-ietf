abstract:
- language: en
  script: Latn
  content: "<p>The Multi-Vantage Path Synchrony (MVPS) framework\n   (draft-melegassi-ippm-mvps-bundle-00) defines a three-axis\n   coherence measurement framework for network observability.  Its\n   informational axis C_2 uses Jensen-Shannon Divergence over a\n   discrete label alphabet, and its topological axis C_3 uses Jaccard\n   similarity on touched-object sets.  Both constructions are optimal\n   when the alphabet carries no metric structure.\n\n   This document extends the MVPS framework to three domains where the\n   metric structure of the observation space is non-trivial and\n   operationally significant:\n\n   (A) Semantic coherence for language-model serving: replaces C_2 with\n       the 2-Wasserstein distance on embedding-weighted token measures\n       (C_2^W2), replaces C_3 with Centered Kernel Alignment on\n       attention matrices (C_3^CKA), introduces a fourth axis C_4\n       (falsifiability coherence via perturbation stability), and a\n       lateral phase label COHERENT_BUT_FALSE (CBF) for hallucination\n       consensus detection.\n\n   (B) Byzantine-robust coherence: replaces the arithmetic-mean\n       centroid with the geometric median (C_2^gm), introduces minimax\n       coherence C^mm(f), a minimum-covariance-determinant phase\n       distance Phi_D^byz, a fifth phase label SUSPECTED_BYZANTINE, and\n       a cascade-time model tau_C for detection-window quantification\n       under BGP hijack.\n\n   (C) Infrastructure-Cognitive coupling: defines the joint coherence\n       vector z(t) in [0,1]^6, the cross-surface correlation matrix\n       R_cross, the drift transfer function from network routing\n       perturbations to semantic drift, and a five-phase IC phase\n       diagram that detects coupled failure modes invisible to either\n       standalone monitor.\n\n   All constructions are proved or formally stated to the same\n   evidential standard as the MVPS math companion (v1.1), with explicit\n   status labels (THEOREM / CONJECTURE / HYPOTHESIS / DEFINITION) and\n   honest caveats for each claim.\n\n   NOTE ON DATA PROVENANCE.  Worked examples in Sections 9 and 16\n   use synthetic data generated under controlled conditions.\n   Validation against operational LM-serving traces or BGP\n   monitoring feeds is identified as required future work.\n\n   EVIDENCE UPDATE (v5.0 unified proof, 2026-05-22).  Three real-data\n   experiments have been performed since this draft was first\n   produced; their results are summarised here for the reviewer's\n   convenience.  Full disclosure with SHA-256 receipts is in\n   docs/MVPS_V5_UNIFIED_PROOF.txt of the reference implementation\n   bundle (available on request from the author; a public\n   reference implementation is planned but not yet released).\n\n      *  R5 (T_CBF / CONJ-A, semantic axis).  200 LM calls against\n         a local Ollama backend (qwen2.5:3b, 3.1B Q4_K_M), 10 BAU +\n         10 CBF prompts x 5 vantages x 2 perturbations.  Mann-\n         Whitney U on CBF vs BAU:  D^2 AUC = 0.900, CBF_score AUC =\n         0.800; C_2, C_3, C_4 all collapse from mean 1.000 (BAU) to\n         mean 0.41/0.26/0.35 (CBF), yielding AUC = 0.000 (anti-\n         direction = perfect separator via 1 - metric).  This is\n         empirical real-world evidence for the signature\n         CBF_signal := { D^2 high, C_2 low, C_4 low } as a\n         sufficient indicator of coherent fabrication.\n\n         CAVEAT (generalisation).  R5 was measured on ONE model\n         family (qwen2.5:3b, n_models = 1, n_calls = 200, single\n         prompt domain).  CONJ-A is therefore established\n         empirically on a single point in (model, prompt-domain,\n         decoding-temperature) space.  Multi-model and multi-\n         domain replication is open question AI9.7 (Section 26);\n         the protocol required for CONJ-A to be considered\n         broadly supported is n_models &gt;= 3 (mixing open- and\n         closed-weight families), n_calls &gt;= 1000 per (model,\n         domain) cell, and &gt;= 2 prompt domains.\n\n      *  R6 (T_DDoS, BGP routing axis).  RIPE Stat BGP updates,\n         5 anycast DNS prefixes (Google, Cloudflare, Quad9, OpenDNS,\n         Level3), 30 days, baseline counts spanning 9x.  Alarms\n         fire on RELATIVE D^2 spike (peak-to-baseline ratio up to\n         14.2x for Google DNS) and NOT on absolute volume:\n         Cloudflare 0 alarms despite high baseline; Quad9 +\n         OpenDNS alarm despite low baseline.\n\n      *  R7 (tau_C SIR cascade, Section 15).  12 BGP alarm events\n         retrieved at day granularity (R2 + R6 union).  All 12\n         events localise within &lt;= 2 days (mean burst width 1.33\n         days), confirming the SIR macroscopic prediction.\n         Three of the 12 events were retrieved at minute resolution\n         from RIPE Stat; Gaussian pulse fit yields tau_C in\n         [11.8, 29.4] minutes, consistent with the BGP propagation\n         literature.\n\n   These results are reproducible via scripts/v5_numerical_receipts.py\n   in the reference implementation and do not change any normative\n   construction of this draft; they validate empirically what was\n   previously labelled CONJECTURE.</p>"
