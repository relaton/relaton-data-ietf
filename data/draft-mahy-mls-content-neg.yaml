abstract:
- language: en
  script: Latn
  content: "<p>This document describes a default mechanism for the negotiation of\n   content inside an MLS group.  It defines two new extensions to the\n   MLS (Messaging Layer Security) Protocol to allow for negotiation of\n   media types exchanged among members of an MLS group, and a minimal\n   framing format.</p>"
