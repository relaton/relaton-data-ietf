- language: en
  script: Latn
  content: "<p>This document describes a default mechanism for the negotiation of
    content inside an MLS group. It defines two new extensions to the MLS (Messaging
    Layer Security) Protocol to allow for negotiation of media types exchanged among
    members of an MLS group, and a minimal framing format.</p>"
