title:
- language: en
  script: Latn
  content: Source Address Validation Using Source Origin Authorizations (SOAs)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ren-sidrops-soa-usage-03
docidentifier:
- content: draft-ren-sidrops-soa-usage
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-06-23'
abstract:
- language: en
  script: Latn
  content: "<p>Given that an AS collaboration scheme for inter-domain source address\n   validation requires an information-sharing platform, this document\n   proposes a two-tier approach.  In the first tier, Resource Public Key\n   Infrastructure (RPKI) is used for service discovery, identity\n   authentication, and transmission of the minimum bootstrap information\n   needed to establish a private channel.  Source Origin Authorization\n   (SOA) is a newly defined cryptographically signed AS-level service-\n   profile object for that purpose.  Subscribers and providers each\n   publish their own SOA profiles; a concrete service relation exists\n   only after discovery, bilateral request validation, and provider\n   acceptance.  In the second tier, the legitimate predecessor AS\n   information and its subsequent updates are exchanged over the\n   authenticated private channel, by default using TLS[RFC8446] carrying\n   CBOR[RFC8949]-encoded logical messages, enabling other ASes to\n   collaboratively filter spoofed traffic while avoiding frequent\n   routing-driven updates to RPKI and reducing exposure of subscriber-\n   specific routing data.  This revision also describes a logical\n   synchronization state model, evidence-tagged authorization state, and\n   fail-open handling for unavailable synchronized state, while leaving\n   private-channel wire encoding to future specifications or bilateral\n   deployment profiles.</p>"
