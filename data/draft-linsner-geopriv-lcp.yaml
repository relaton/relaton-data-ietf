abstract:
- language: en
  script: Latn
  content: "<p>Location Configuration Protocol provides a host with physical location
    \nbased on its IP address.  This document describes the communication \nprotocol
    and mechanism for an IP host to discovery the physical location \nassociated with
    its own IP address by communicating with a Location \nInformation Server.  This
    document describes the overall protocol and \ncommunication architecture.</p>"
