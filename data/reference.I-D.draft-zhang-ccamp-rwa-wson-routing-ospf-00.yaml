abstract:
- language: en
  script: Latn
  content: <p>Wavelength switched optical networks (WSONs) are based on Wavelength
    Division Multiplexing (WDM) in which user traffic is carried by data channels
    of different optical wavelengths. In traditional WDM Networks, each wavelength
    path is statically configured. With the  deployment of Reconfigurable Optical
    Add-Drop Multiplexers (ROADMs), photonic cross-connects (PXCs), and tunable laser,
    WSONs have become more dynamic, and operators can flexibly set up wavelength paths
    to carry user traffic.  In WSONs where there are no or a limited number of switches
    capable of wavelength conversion paths must be set up subject to the "wavelength
    continuity" constraint. This leads to a path computation problem known as routing
    and wavelength assignment (RWA). In order to perform such computations, it is
    necessary to collect information about the available wavelengths within the network.  This
    document describes OSPF routing protocols extensions to support Wavelength Switched
    Optical Networks (WSON) under the control of Generalized MPLS (GMPLS).</p>
