abstract:
- language: en
  script: Latn
  content: "<p>All domain names used in examples throughout this document use\n   \".test\" in accordance with RFC 2606.  In actual deployments, \".utxo\"\n   is used.\n\n   This document specifies the UTXO Domain Name System (UTXO6-DNS), a\n   decentralized naming protocol that maps .utxo domain names to\n   blockchain UTXO (Unspent Transaction Output) endpoints and generates\n   verifiable IPv6 Interface Identifiers (IIDs) using Verifiable Random\n   Functions (VRFs).  The base protocol defines a new DNS RR type (UTXO,\n   code 260), an EDNS0 option for capability discovery, and fallback\n   mechanisms to coexist with legacy DNS, updating RFC 1034, RFC 1035,\n   and RFC 7217.\n\n   Additionally, this document defines an optional compliance overlay\n   --- the Penetrating Regulation Node (PRN) extensions --- that can be\n   deployed by regulated financial institutions to meet AML/CFT\n   requirements, provide audit trails, and verify legal entity\n   identities using GLEIF vLEI credentials.  The PRN extensions include\n   optional regulatory attributes in UTXO RRs, a new PRNAUDIT RR type\n   for daily audit summaries, a RESTful API (PRN-API) for regulatory\n   dashboards, a 2-of-3 MPC threshold signature framework for audit\n   integrity, and native vLEI integration.  This document also describes\n   a transaction lifecycle compliance enforcement model (AnteHandler)\n   and an application-layer policy format (AgentPolicyEnvelope) for\n   declarative authorization.\n\n   The PRN extensions are privacy-preserving (only Merkle roots and\n   aggregated statistics are shared), decentralized (no central\n   authority), and verifiable (audit summaries are jointly signed by\n   independent auditing firms).\n\n   *This document is published as an Experimental specification.* It is\n   not an IETF standard and does not represent IETF consensus.  It is\n   intended for informational purposes, to facilitate implementation\n   experience, and to support early discussion within the DNSOP working\n   group.  See Section 1 for details.\n\n   *Note:* The AgentPolicyEnvelope JSON Schema (Appendix I) and the\n   AnteHandler compliance enforcement model (Section 4) are application-\n   layer constructs provided as informative examples.  They are not on\n   the IETF standards track and are not subject to IETF consensus.\n   Their inclusion in this document is intended to facilitate\n   interoperability of experimental deployments.</p>"
