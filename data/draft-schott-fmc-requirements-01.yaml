abstract:
- language: en
  script: Latn
  content: "<p>This document provides a brief overview of the FMC (Fixed Mobile Convergence)
    architecture and related works. The purpose of the document is to sketch a big
    picture for the FMC activity to ease identifying whether specification effort
    is required within IETF. This document identifies and analyzes some of issues
    that have arisen so far and elaborates a set of requirements for the FMC system.</p>"
