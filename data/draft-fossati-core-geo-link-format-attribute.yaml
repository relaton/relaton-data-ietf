abstract:
- language: en
  script: Latn
  content: <p>This memo proposes a new CoAP link format attribute, "geo", that can
    be used to associate positioning metadata to a CoAP resource. An extension to
    the link format query syntax is also defined to allow the discovery of resources
    based on their geo location.</p>
