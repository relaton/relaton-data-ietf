abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new Service Parameter Key (SvcParamKey),\n   \"oots\" (\"Opportunistic Operator-led Transport Signal\"), for use in\n   Service Binding (SVCB) and HTTPS resource records as defined in RFC\n   9460.  The \"oots\" parameter allows the operator of an authoritative\n   DNS nameserver to advertise, per DNS transport protocol (such as DNS\n   over UDP/TCP, DNS over TLS, DNS over HTTPS, and DNS over QUIC), the\n   operator's own assessment of the share of the nameserver's total\n   query load that it is confident it can serve over that transport.\n   The per-transport values are independent capability estimates rather\n   than a distribution of queries across transports; they are\n   opportunistic hints that a resolver MAY use to inform transport\n   selection and MAY ignore entirely.  This document provides the\n   specification required by Section 14.3.1 of RFC 9460 for registration\n   of the \"oots\" SvcParamKey in the IANA \"Service Parameter Keys\n   (SvcParamKeys)\" registry.</p>"
