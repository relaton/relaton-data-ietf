abstract:
- language: en
  script: Latn
  content: "<p>This document describes how a DNS client can use a domain name to authenticate
    a DNS server that uses Transport Layer Security (TLS) and Datagram TLS (DTLS).
    Additionally, it defines (D)TLS profiles for DNS clients and servers implementing
    DNS-over-TLS and DNS-over- DTLS.</p>"
