abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework and a process for developing performance
    metrics for IP-based applications that operate over reliable or datagram transport
    protocols, and that can be used to characterize traffic on live networks and services.
    \ The framework refers to a Performance Metrics Entity, or PM Entity, which may
    in future be a working group or directorate or a combination of these two.</p>"
