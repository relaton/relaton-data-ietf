abstract:
- language: en
  script: Latn
  content: <p>This specification defines an extension to Web Distributed Authoring
    and Versioning (WebDAV) that allows efficient synchronization of the contents
    of a WebDAV collection.  Editorial Note (To be removed by RFC Editor before publication)  Please
    send comments to the Distributed Authoring and Versioning (WebDAV) working group
    at &lt;mailto:w3c-dist-auth@w3.org&gt;, which may be joined by sending a message
    with subject "subscribe" to &lt;mailto:w3c-dist-auth-request@w3.org&gt;.  Discussions
    of the WEBDAV working group are archived at &lt;http://lists.w3.org/Archives/Public/w3c-dist-auth/&gt;.</p>
