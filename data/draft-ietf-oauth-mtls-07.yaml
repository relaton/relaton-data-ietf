abstract:
- language: en
  script: Latn
  content: "<p>This document describes Transport Layer Security (TLS) mutual authentication
    using X.509 certificates as a mechanism for OAuth client authentication to the
    authorization sever as well as for certificate bound sender constrained access
    tokens as a method for a protected resource to ensure that an access token presented
    to it by a given client was issued to that client by the authorization server.</p>"
