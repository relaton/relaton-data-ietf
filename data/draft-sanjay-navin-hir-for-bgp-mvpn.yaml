abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Hierarchical Ingress Replication (HIR), a scalable
    multicast forwarding mechanism for BGP Multicast VPN (MVPN) services over hierarchical
    IP-MPLS transport networks. HIR introduces packet replication at hierarchical
    inline BGP Route Reflectors (RRs) located at Access, Pre-Aggregation, Aggregation,
    and Core transport layers. By combining control-plane route reflection with data-plane
    packet replication, HIR significantly reduces ingress router replication overhead,
    optimizes bandwidth utilization, minimizes multicast state, and improves scalability
    for large-scale multicast VPN deployments in service provider and 5G transport
    networks.</p>"
