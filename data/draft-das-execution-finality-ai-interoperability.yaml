abstract:
- language: en
  script: Latn
  content: "<p>The Apple-Siri interoperability debate under the EU Digital Markets
    Act\nexposes a difficult technical question: how can third-party AI assistants
    gain meaningful\naccess to device functions without forcing the platform to surrender
    privacy, security, or control over consequential actions?     This paper proposes
    an execution-finality architecture in which an AI assistant may request an action,
    but the request itself has no power to make\nthat action effective. Each consequential
    operation remains in a Non-Effective State\nuntil protected infrastructure validates
    the requester, resource, destination, user intent where required, freshness, revocation
    state, and policy conditions.     Only then is narrowly scoped, non-bearer execution
    authority created. At the Finality Sink - the first boundary where the\naction
    can become externally effective - the system independently verifies that the real\noperation
    still matches what was authorized. Any mismatch, replay, substitution, expiry,\nor
    revocation causes fail-closed denial. The key principle is simple: \n   Interoperability
    should grant participation, not uncontrolled execution\nauthority. \n   This offers
    a possible technical path through the DMA deadlock: third-party\nassistants could
    participate meaningfully without requiring broad reusable\npermissions, while
    platforms retain strong privacy, security, revocation,\nanti-replay, and final-effect
    controls.  Execution-Finality Governance therefore\nreframes the problem from
    closed versus open to open participation with bounded,\nverifiable authority.</p>"
