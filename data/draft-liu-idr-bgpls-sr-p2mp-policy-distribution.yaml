abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the extensions to BGP Link State (BGP-LS) to
    distribute SR P2MP Policies and state. This allows operators to establish a consistent
    view of the underlying multicast network state, providing an efficient mechanism
    for the advertisement and synchronization of SR P2MP policies.</p>"
