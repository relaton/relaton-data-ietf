abstract:
- language: en
  script: Latn
  content: "<p>This document describes a new routing and addressing architecture,
    which is based on identifier/locator split idea. This architecture introduces
    a hierarchical routing mechanism to support routing across multiple independent
    address spaces, besides, it also adopts a hierarchical host identifier to ease
    the management of a global identifier/locator mapping system.</p>"
