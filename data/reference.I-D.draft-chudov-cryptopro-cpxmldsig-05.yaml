abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how to use Russian national cryptographic standards
    GOST 28147-89, GOST R 34.10-2001 and GOST R 34.11-94 with XML Signatures, XML
    Encryption, WS-SecureConversation, WS- SecurityPolicy and WS-Trust.  A number
    of Uniform Resource Identifiers (URIs) and XML elements are defined.</p>"
