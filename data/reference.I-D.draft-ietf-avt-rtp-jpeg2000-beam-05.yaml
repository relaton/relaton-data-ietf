abstract:
- language: en
  script: Latn
  content: '<p>This memo describes extended uses for payload header in RFC document:
    "RTP Payload Format for JPEG 2000 Video Streams." For better support of JPEG 2000
    features such as scalability and includes a main header recovery method. This
    memo MUST be accompanied with a complete implementation of "RTP Payload Format
    for JPEG 2000 Video Streams." That document is a complete description of the payload
    header and signaling, this document only describes additional processing for the
    payload header. There is an additional media type and SDP marker signaling for
    implementations of this document.</p>'
