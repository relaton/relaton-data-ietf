  script: Latn
  content: "<p>(Backus-Naur Form (BNF) is used hereinafter.) This document describes
    an enhancing of symbolic name way of character references in HTML by adding to
    a character symbolic name an optional character property in the following manner:
    BNF: '&amp;&lt;character symbolic name&gt;[&lt;separator&gt;&lt;character property&gt;];'.</p>"
