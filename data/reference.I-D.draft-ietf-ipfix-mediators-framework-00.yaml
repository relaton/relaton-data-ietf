abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework for an IPFIX Mediation.  An IPFIX
    Mediation device (IPFIX Mediator) is an intermediate device between IPFIX Exporters
    and IPFIX Collectors.  This framework describes an architecture model, the components
    of the architecture, and guidelines for the IPFIX protocol specifications for
    the IPFIX Mediators.  In addition, this document describes applicable examples
    for IPFIX Mediation.</p>"
