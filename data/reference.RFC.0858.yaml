abstract:
- language: en
  script: Latn
  content: "<p>This Telnet Option disables the exchange of go-ahead signals between
    \   the Telnet modules.  This RFC specifies a standard for the ARPA    Internet
    community.  Hosts on the ARPA Internet are expected to adopt    and implement
    this standard.  Obsoletes NIC 15392.</p>"
