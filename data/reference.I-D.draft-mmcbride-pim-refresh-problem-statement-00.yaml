abstract:
- language: en
  script: Latn
  content: "<p>The PIM Working Group has a charter item to provide solutions to reduce
    the effects of periodic join/prune processing in PIM. The L3VPN Working Group
    identified the periodic messaging of PIM as a potential future scaling problem
    for PIM based MVPNs. This document identifies the issues we are trying to solve
    with PIM refresh reduction.</p>"
