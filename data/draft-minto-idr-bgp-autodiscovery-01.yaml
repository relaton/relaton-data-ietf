abstract:
- language: en
  script: Latn
  content: "<p>This document describes a layer 3 protocol (Service advertisement)
    to help bgp to advertise service availability and local configurations. This enables
    bgp speakers to discover bgp peers transport endpoints and peer's configuration
    within link. With Service advertisement, receivers could successfully bring up
    bgp protocol session without mundane configurations.</p>"
