abstract:
- language: en
  script: Latn
  content: "<p>Both IPFIX and PSAMP need methods whereby vendors can add proprietary\ninformation elements (IEs) to data flowsets. This draft proposes two\npossible methods of providing vendor specific IEs.  The extension of\nthese methods to provide vendor specific scope and options is also\ndescribed.</p>"
