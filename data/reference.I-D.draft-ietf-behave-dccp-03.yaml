abstract:
- language: en
  script: Latn
  content: "<p>This document defines a set of requirements for NATs handling the Datagram
    Congestion Control Protocol (DCCP).  Those allow DCCP applications, such as streaming
    applications to operate consistently. These requirements are very similar to the
    TCP requirements for NATs already published by the IETF Behavior Engineering for
    Hindrance Avoidance (BEHAVE) working group.  Developing NATs that meet this set
    of requirements will greatly increase the likelihood that applications using DCCP
    will function properly.</p>"
