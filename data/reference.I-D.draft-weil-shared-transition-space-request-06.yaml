abstract:
- language: en
  script: Latn
  content: "<p>This document requests that an IPv4 /10 be reserved as Shared CGN Space
    solely to facilitate deployment of IPv4 Carrier Grade NAT (CGN) technologies after
    IPv4 exhaustion.  This document updates RFC 1918 and RFC 5735 to reserve an additional
    special-use address range for use between a CGN and home router.</p>"
