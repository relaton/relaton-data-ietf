abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a series of metrics for connectivity between a pair
    of Internet hosts.  It builds on notions introduced and discussed in RFC 2330,
    the IPPM framework document.  This memo defines an Experimental Protocol for the
    Internet community.</p>"
