abstract:
- language: en
  script: Latn
  content: "<p>This document has two objectives. First, we identify signaling requirements
    for setting up and maintaining Optical Switched Paths (OSPs) in mesh-connected
    optical networks. We then propose extensions to RSVP to satisfy some of these
    requirements within the context of MPLS-based traffic engineering framework.</p>"
