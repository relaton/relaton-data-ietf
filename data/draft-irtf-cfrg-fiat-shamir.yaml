abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Fiat-Shamir transformation, which allows
    making a public-coin protocol non-interactive by means of a cryptographic hash
    function. It specifies how the hash function is employed, how prover messages
    are encoded as hash-function input, and how verifier messages are decoded from
    the hash function's output, as well as the serialization and deserialization of
    the non-interactive argument string.</p>"
