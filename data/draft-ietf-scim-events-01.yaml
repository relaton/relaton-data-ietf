abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a set of Security Event types using the
    Security Event Token format (RFC8417). These events can be used across domains
    by SCIM Service Providers and receivers to exchange security event signals used
    for: request confirmations, replication, provisioning co-ordination, and security
    signals.</p>"
