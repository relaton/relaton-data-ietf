abstract:
- language: en
  script: Latn
  content: "<p>The DHCP options for Vendor Class and Vendor-Specific Information can\nbe ambiguous when a DHCP client represents multiple vendors.  This\ndocument defines two new options, modeled on the IPv6 options for\nvendor class and vendor-specific information, which contain\nEnterprise Numbers to remove ambiguity.</p>"
