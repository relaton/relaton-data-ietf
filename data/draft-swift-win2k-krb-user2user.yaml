abstract:
- language: en
  script: Latn
  content: "<p>This draft documents a simple extension to the Kerberos GSS-API mechanism
    to support user to user authentication both in the case where the client application
    explicitly requests user to user authentication and when it does not know whether
    the server supports user to user authentication.</p>"
