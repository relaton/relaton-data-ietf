abstract:
- language: en
  script: Latn
  content: "<p>The Simple Network Management Protocol (SNMP) version three (SNMPv3)
    requires that an SNMP manager knows the identity (snmpEngineID) of the SNMP engine
    used by a remote SNMP agent in order to retrieve or manipulate objects maintained
    on the remote SNMP agent. This document introduces a well-known localEngineID
    and a discovery mechanism which can be used to learn the snmpEngineID of a remote
    SNMP protocol engine. The proposed mechanism is independent of the features provided
    by SNMP security models and may also be used by other protocol interfaces providing
    access to managed objects.</p>"
