abstract:
- language: en
  script: Latn
  content: <p>This memo provides clear definitions for Active, Passive and Hybrid
    performance assessment. The construction of Metrics and Methods can be described
    as either "Active" or "Passive". Some methods use a subset of both Active and
    Passive attributes, and they can be referred to as "Hybrid". This memo also describes
    multiple dimensions to help evaluate new methods as they emerge. This memo obsoletes
    RFC 7799.</p>
