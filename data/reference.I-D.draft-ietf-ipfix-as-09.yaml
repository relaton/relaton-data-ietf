abstract:
- language: en
  script: Latn
  content: "<p>This document describes the applicability of the IP Flow Information
    Export (IPFIX) protocol for a variety of applications. It shows how applications
    can use IPFIX, describes the relevant information elements (IEs) and shows opportunities
    and limitations of the protocol. The document furthermore describes relations
    of the IPFIX framework to other architectures and frameworks.</p>"
