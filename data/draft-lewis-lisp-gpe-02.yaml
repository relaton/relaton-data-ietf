abstract:
- language: en
  script: Latn
  content: "<p>This draft describes extending the Locator/ID Separation Protocol (LISP)
    [RFC6830], via changes to the LISP header, with three new capabilities: support
    for multi-protocol encapsulation, operations, administration and management (OAM)
    signaling, and explicit versioning.</p>"
