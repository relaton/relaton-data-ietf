abstract:
- language: en
  script: Latn
  content: "<p>The Lowest Common Denominator Protocol (LCDP) is a message-oriented,\n   peer-to-peer wire format consisting of UTF-8 encoded JSON arrays of\n   externally tagged objects with object payloads transported over\n   datagrams. LCDP provides perpetual compatibility by extension rather\n   than versioning: unknown message types and fields are ignored. This\n   document describes the wire format, core message types for peer\n   discovery and anti-spoofing, and the design rationale. Security,\n   reliability, and congestion control are delegated to optional\n   messages or higher layers.</p>"
