abstract:
- language: en
  script: Latn
  content: "<p>The Internet Routing Overlay Network (IRON) [draft-templin-iron] and
    Routing and Addressing in Networks with Global Enterprise Recursion (RANGER) [RFC5720]
    provide an architectural framework for scalable routing and addressing.  Together,
    these architectures provide for scalability, provider independence, mobility,
    multihoming and security for the next generation Internet.  This document describes
    a series of operational use case scenarios in order to showcase the architectural
    capabilities.  It further shows how IRON and RANGER restore the network-within-network
    principles originally intended for the sustained growth of the Internet.</p>"
