abstract:
- language: en
  script: Latn
  content: "<p>The Context Relay Protocol (CRP) defines a structured, language-\n   agnostic protocol for managing AI context, safety governance, and\n   compliance evidence in deployed large language model (LLM) systems.\n   CRP operates as an HTTP-compatible sidecar protocol, enriching every\n   AI request/response cycle with standardised headers carrying context\n   quality, hallucination risk, provenance integrity, and regulatory\n   classification metadata.\n\n   This document defines the foundational axioms, request/response\n   model, sidecar architecture, and the normative relationship between\n   CRP's subsystems: the Context Envelope, Contextual Knowledge Fabric\n   (CKF), Decision Provenance Engine (DPE), and the Audit Chain.</p>"
