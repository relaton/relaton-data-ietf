abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a Path Computation Element (PCE)-based procedure
    to compute inter-domain constrained shortest Traffic Engineering (TE) Label Switched
    Paths (LSPs) in Multiprotocol Label Switching (MPLS) and Generalized MPLS (GMPLS)
    networks. In this document a domain is referred to as a collection of network
    elements within a common sphere of address management or path computational responsibility
    such as IGP areas and Autonomous Systems.</p>"
