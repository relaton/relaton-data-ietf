abstract:
- language: en
  script: Latn
  content: "<p>The distribution of clients of L2 domain across extended networks leveraging
    overlay fabric needs to deal with synchronizing the Client Binding Database. The
    'Client IP Binding' indicates the IP, MAC and VLAN details of the clients that
    are learnt by security protocols. Since learning the 'Client IP Binding database'
    is a last mile solution, this information stays local to the end point switch
    to which clients are connected. When networks are extended across geographies,
    both at layer 2 and layer 3, the 'Client IP Binding Database' in end point switches
    of remote fabrics should be in sync. This document aligns the synchronization
    of the 'Client IP Binding Database' through an extension to BGP control plane
    constructs, as BGP is a typical control plane protocol configured to communicate
    across network boundaries.</p>"
  format: text/html
