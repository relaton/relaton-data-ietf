abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a distributed network topology service framework
    for operators to collect network topologies from the physical heterogeneous network,
    analyses and stores the topology information, and provides the path computing
    and topology information inquiring ability to applications (including network
    applications like OSS, and third-party applications).</p>"
