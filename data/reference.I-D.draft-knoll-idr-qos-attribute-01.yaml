abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a simple signalling mechanism for inter- domain
    QoS marking using several instances of a new BGP Extended Community Attribute.
    \ Class based packet marking and forwarding is currently performed independently
    within ASes.  The new QoS marking attribute makes the QoS class marking within
    the IP prefix advertising AS known to all access and transit ASes.  This enables
    individual (re-)marking and possibly forwarding treatment adaptation to the original
    QoS class setup of the respective originating AS. The attribute provides the means
    to signal QoS markings on different layers, which are linked together in QoS Class
    Sets.  It provides inter-domain and cross-layer insight into the QoS class mapping
    of the source AS with minimal signalling traffic.</p>"
