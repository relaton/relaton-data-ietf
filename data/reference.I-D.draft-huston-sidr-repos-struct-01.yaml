abstract:
- language: en
  script: Latn
  content: "<p>This document defines a profile for the structure of repositories that
    contain X.509 / PKIX Resource Certificates, Certificate Revocation Lists and signed
    objects.  This profile contains the proposed object naming scheme for the contents
    of Resource Certificate Repositories and the proposed internal structure of a
    Repository Cache that is intended to facilitate synchronization across a distributed
    collection of repositories and facilitate certificate path construction.</p>"
