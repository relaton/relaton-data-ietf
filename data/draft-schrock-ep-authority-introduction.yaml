abstract:
- language: en
  script: Latn
  content: "<p>Signature verification answers whether a key produced an artifact.
    It does not answer why a relying party accepts that key, or whether the key holder
    had authority for the action. This document specifies two composable artifacts.
    An Authority Document introduces and rotates an organization's evidence-issuing
    keys through a signed, hash-chained sequence. A Scoped Authority Proof records
    the authority held by a subject at a registry snapshot, including role, action
    scope, material limits, policy binding, validity, and revocation status. A relying
    party evaluates both artifacts under its own pinned trust inputs and policy. The
    design does not make a self-presented key authoritative, does not turn log inclusion
    or domain control into automatic trust, and does not equate a valid signature
    with permission to act. It also defines a source- resolution boundary: signing
    a statement does not give its underlying source data finer freshness or precision
    than that source actually provides.</p>"
