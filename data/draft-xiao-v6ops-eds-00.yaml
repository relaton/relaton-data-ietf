abstract:
- language: en
  script: Latn
  content: "<p>This document describes Enhanced Dual Stack (EDS), a host-side\n   framework intended to reduce the operational risk and workload of\n   IPv6 deployment.\n\n   Today, many applications select IPv6 or IPv4 using\n   static address-selection rules.  These rules provide a useful\n   baseline, but they are not live measurements of current reachability\n   or performance.  If IPv6 is selected when it is broken or degraded,\n   users may experience failures or delays.  This creates a need for\n   extensive upfront IPv6 validation before deployment.\n\n   Happy Eyeballs (HE) reduces this risk for applications that implement\n   it, but it does not automatically help existing applications that\n   continue to use traditional APIs such as getaddrinfo(), socket(), and\n   connect().\n\n   EDS aims to make IPv6/IPv4 selection performance-informed for both\n   new and existing applications.  It does this through three\n   enhancements:</p>"
