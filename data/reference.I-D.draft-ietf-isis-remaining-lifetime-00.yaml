abstract:
- language: en
  script: Latn
  content: "<p>Corruption of the Remainining Lifetime Field in a Link State PDU can
    go undetected.  In certain scenarios this may cause or exacerbate flooding storms.
    \ It is also a possible denial of service attack vector.  This document defines
    a backwards compatible solution to this problem.</p>"
