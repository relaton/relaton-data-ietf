- language: en
  script: Latn
  content: "<p>This proposal introduces a LSP flooding optimization mechanism for
    the Non-SPF Calculation-based LSP. The Non-SPF Calculation-based LSP is forwarded
    through the interfaces belonging to a distribution tree rather than all the adjacencies
    interfaces of the IS. There is no backward compatibility issue for this solution.</p>"
