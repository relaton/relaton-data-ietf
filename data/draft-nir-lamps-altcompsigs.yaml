abstract:
- language: en
  script: Latn
  content: "<p>This document presents an alternative scheme of composing classic and\n   post-quantum signature algorithms with different security properties.\n   This scheme produces signatures with strong non-separability (SNS) at\n   the cost of breaking backward compatibility with legacy cryptographic\n   hardware.</p>"
