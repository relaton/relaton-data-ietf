title:
- language: en
  script: Latn
  content: Convergence of Congestion Control from Retained State
  format: text/plain
docidentifier:
- content: draft-ietf-tsvwg-careful-resume
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: <p>This document specifies a cautious method for Internet transports that
    enables fast startup of congestion control for a wide range of connections, known
    as "Careful Resume". It reuses a set of computed congestion control parameters
    that are based on previously observed path characteristics between the same pair
    of transport endpoints. These parameters are saved, allowing them to be later
    used to modify the congestion control behaviour of a subsequent connection. It
    describes assumptions and defines requirements for how a sender utilises these
    parameters to provide opportunities for a connection to more rapidly get up to
    speed and rapidly utilise available capacity. It discusses how use of this method
    impacts the capacity at a shared network bottleneck and the safe response that
    is needed after any indication that the new rate is inappropriate.</p>
  format: text/html
