abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses the reasons for IETF work on topics that cross
    area boundaries. Such cross-area work presents challenges for the organization
    of the IETF as well as on how interested parties can participate the work. The
    memo also provides some suggestions on managing these challenges.</p>"
