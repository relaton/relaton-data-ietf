- language: en
  script: Latn
  content: |-
    <p>This document describes a set of network-related issues presented by
       the desire to support seamless Virtual Machine mobility in the data
       center and between data centers. In particular, it looks at the
       implications of meeting the requirements for "seamless mobility".</p>
