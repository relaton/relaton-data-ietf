abstract:
- language: en
  script: Latn
  content: "<p>This document defines ZRTP, a protocol for media path Diffie-Hellman
    exchange to agree on a session key and parameters for establishing Secure Real-time
    Transport Protocol (SRTP) sessions. The ZRTP protocol is media path keying because
    it is multiplexed on the same port as RTP and does not require support in the
    signaling protocol. ZRTP does not assume a Public Key Infrastructure (PKI) infrastructure
    or require the complexity of certificates in end devices. For the media session,
    ZRTP provides confidentiality, protection against Man in the Middle (MITM) attacks,
    and, in cases where a secret is available from the signaling protocol, authentication.
    ZRTP can utilize two Session Description Protocol (SDP) attributes to provide
    discovery and authentication through the signaling channel. To provide best effort
    SRTP, ZRTP utilizes normal RTP/AVP profiles.</p>"
