abstract:
- language: en
  script: Latn
  content: "<p>The IP header is not covered by the MAC in the cryptographic authentication
    scheme as described in RFC 2328 and RFC 5709, and an attack can be made to exploit
    this omission.  This draft proposes a simple change in how the authentication
    is computed to eliminate most of such attacks.</p>"
