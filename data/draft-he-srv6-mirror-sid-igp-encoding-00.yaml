abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the IGP protocol extensions required to
       support SRv6 path egress protection using the Mirror SID (End.M)
       mechanism.  It defines new sub-TLVs within IS-IS and OSPFv3 for
       advertising the Mirror SID and the set of protected locators,
       enabling a backup egress node (protector) to signal its capability to
       protect a primary egress node within a single link-state IGP area.

       This document is a companion to
       [I-D.ietf-rtgwg-srv6-egress-protection], which specifies the overall
       SRv6 path egress protection mechanism and the End.M behavior.  The
       IGP encoding defined herein provides the signaling substrate for that
       mechanism.</p>
