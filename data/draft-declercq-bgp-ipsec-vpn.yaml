abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a method by which a Service Provider may  use
    an  IP  backbone  to  provide  VPNs for its customers. In this method
    IPsec tunnels are deployed through the backbone, and  the  forwarding
    of  packets over the backbone relies on normal IP forwarding.</p>
