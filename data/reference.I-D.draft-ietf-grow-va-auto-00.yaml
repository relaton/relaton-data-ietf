abstract:
- language: en
  script: Latn
  content: "<p>Virtual Aggregation as specified in [I-D.ietf-grow-va] requires a certain
    amount of configuration, namely virtual prefixes (VP), a VP list, type of tunnel,
    and popular prefixes.  This draft proposes optional approaches to auto-configuration
    of popular prefixes and the VP list, and discusses the pros and cons of each.
    \ If these proposals are accepted, they will be incorporated into [I-D.ietf-grow-va].</p>"
