abstract:
- language: en
  script: Latn
  content: "<p>This document describes an architecture for human meetings and dating
    websites using other Social Networking Internet resources. Document proposes a
    modular design for dating websites and similar application on Internet. Architecture
    proposes application specific search as well as required privacy for the members.
    Main objective of the architecture is to provide required contact details for
    searching person without breaching privacy of the registered members. It also
    proposes an architecture to utilize member profiles from legacy databases and
    websites as well as other implementations of this architecture.</p>"
