- language: en
  script: Latn
  content: "<p>This document describes a usage of the Extensible Markup Language (XML)
    Configuration Access Protocol (XCAP) for manipulating lists of presentities (also
    known as buddy lists or rosters). It does so by specifying an XML Schema that
    contains a list of presentities that a user is interested in watching.</p>"
