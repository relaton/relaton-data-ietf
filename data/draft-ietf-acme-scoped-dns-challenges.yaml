abstract:
- language: en
  script: Latn
  content: "<p>This document outlines a new challenge for the ACME protocol,\n   enabling an ACME client to answer a domain control validation\n   challenge from an ACME server using a DNS resource linked to the ACME\n   Account ID.  This allows multiple systems or environments to handle\n   challenge-solving for a single domain.</p>"
