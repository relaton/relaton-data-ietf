abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a SAMLv2 lightweight Web Browser Single Sign-On
    Profile. This profile is modeled on the OASIS SAMLv2 Web Browser SSO profile,
    adding various constraints, and using a new lightweight SAMLv2 HTTP POST binding
    which does not rely on XML Digital Signature -- relying on a more simple-to-implement
    signature approach instead.</p>"
