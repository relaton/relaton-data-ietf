abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines Centrally allocated IPv6 Unique Local
       addresses.  These addresses are globally unique and are intended for
       local communications, usually inside of a site.  They are not
       expected to be routable on the global Internet.</p>
