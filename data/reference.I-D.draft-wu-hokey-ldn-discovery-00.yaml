abstract:
- language: en
  script: Latn
  content: "<p>As described in [RFC5296], the local domain name can be learnt by the
    peer though the ERP exchange or via lower-layer announcement. However lower-layer
    announcement for local domain name is not specified. This document specifies one
    local domain name discovery mechanism based on DHCP extension.</p>"
