abstract:
- language: en
  script: Latn
  content: "<p>Network Resource Partition (NRP), which is a subset of the resources
    and associated policies in the underlay network. In networks with multiple NRPs,
    an SR Policy can be associated with a particular NRP. This document describes
    how the SR Policy extension for associated NRP and the operational mechanisms
    function together.</p>"
