- language: en
  script: Latn
  content: "<p>This document defines a SIP extension header, References, to be used
    within SIP messages to signify that the message (and the dialog containing it)
    is related to one or more other dialogs.  It is expected to be used largely for
    diagnostic purposes.</p>"
