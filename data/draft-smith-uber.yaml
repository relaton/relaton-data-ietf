abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Universal Basic Element Representation\n   (ÜBER), a language-independent, lightweight, text-based serialization\n   format designed for the portable representation, transmission, and\n   storage of structured data.\n\n   ÜBER employs a unified node architecture in which each node serves\n   simultaneously as a value-carrier and a structural container.  This\n   recursive model allows any element to encapsulate a discrete data\n   payload while concurrently functioning as a parent to nested members.\n   The same structure also provides the granularity needed by\n   implementations that target high-concurrency access patterns with\n   localized, low-contention updates.\n\n   A top-level ÜBER profile consists of either an explicit root object\n   or a sequence of members and directives.  To prioritize human-centric\n   design and authoring ergonomics, the grammar supports comments,\n   flexible arbitrary-length key-value separators, optional commas, and\n   dotted member names.\n\n   The ÜBER type system is defined by recursive containers and scalar\n   forms.  Associative arrays ({}) and collections ([]) support\n   arbitrary nesting, while concrete ordering behavior remains\n   implementation-dependent.  Scalar forms include deterministic numbers\n   with arbitrary-precision integer syntax and Java-aligned unsuffixed\n   floating-point lexical forms, automatic magnitude-based fitting and\n   promotion, versatile string representations including text blocks,\n   flexible boolean literals, and both explicit and omitted null states.\n\n   This specification defines the lexical and syntactic grammar of ÜBER.\n   It does not define implementation-specific runtime facilities except\n   where a grammar element, such as directives, requires a brief\n   statement of purpose.</p>"
