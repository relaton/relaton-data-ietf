abstract:
- language: en
  script: Latn
  content: "<p>As agents evolve from auxiliary analysis toward autonomous decision-
    making and task execution, their operation involves multiple dynamic factors,
    including models, knowledges, metrics, tools, permissions, behaviors, and collaborative
    relationships. Traditional management methods are no longer sufficient to ensure
    their secure and stable operation. This draft proposes an agent lifecycle management
    requirement covering registration and publication, deployment and operation, continuous
    operations, capability evolution, deactivation, and retirement. It analyzes key
    management requirements related to assets, capabilities, knowledge, tools, identity
    and authorization, operational evaluation, auditing, and version evolution and
    retirement, providing the unified management, continuous governance, and large-scale
    deployment of agents.</p>"
