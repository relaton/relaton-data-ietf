abstract:
- language: en
  script: Latn
  content: "<p>The Enhanced Deterministic Networking (EDN) is required to provide
    the enhancement of flow identification and packet treatment for Deterministic
    Networking (DetNet) to achieve the DetNet QoS in scaling networks. This document
    proposes the enhancement of the framework to support the functions and metadata
    for enhanced DetNet data plane.</p>"
