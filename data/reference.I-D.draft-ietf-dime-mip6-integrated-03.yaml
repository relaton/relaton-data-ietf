abstract:
- language: en
  script: Latn
  content: "<p>A Mobile IPv6 node requires a Home Agent address, a home address, and
    a security association with its Home Agent before it can start utilizing Mobile
    IPv6. RFC 3775 requires that some or all of these parameters are statically configured.
    Ongoing Mobile IPv6 bootstrapping work aims to make this information dynamically
    available to the Mobile Node. An important aspect of the Mobile IPv6 bootstrapping
    solution is to support interworking with existing authentication, authorization
    and accounting infrastructure. This document describes the MIPv6 bootstrapping
    using the Diameter Network Access Server (NAS) &lt;-&gt; home Authentication,
    Authorization and Accounting server (HAAA) interface.</p>"
