  content: 'RFC 3535, 20 Years Later: An Update of Operators Requirements on Network
    Management Protocols and Modelling'
  format: text/plain
docidentifier:
- content: draft-boucadair-nmop-rfc3535-20years-later
  type: Internet-Draft
