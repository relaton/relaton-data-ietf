- language: en
  script: Latn
  content: "<p>An attribute is defined for Session Traversal Utilities for NAT (STUN)
    that allows for declarations of bandwidth limits on the negotiated flow. The application
    of this attribute to reducing denial of service attacks from internet telephony
    systems. Other applications include negotiation of bandwidth at packet relays.</p>"
