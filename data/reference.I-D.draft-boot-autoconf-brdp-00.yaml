abstract:
- language: en
  script: Latn
  content: "<p>Mobile Ad hoc Networks may be attached to a fixed infrastructure network,
    like the Internet.  This document specifies a mechanism for Border Router discovery
    and utilization in such a subordinate, possibly multi-homed, MANET.  It provides
    facilities for choosing the best Border Router and configuring IP addresses needed
    for communication between MANET nodes and nodes in the fixed infrastructure via
    the selected Border Router.</p>"
