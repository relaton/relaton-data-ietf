abstract:
- language: en
  script: Latn
  content: "<p>The rise of spam and other anti-social behavior on the Internet has
    led to the creation of shared blacklists and whitelists of IP addresses or domains.
    \ This memo discusses guidelines for management of public DNS blacklists (DNSBLs).
    \ The document will seek BCP status.  Comments and discussion of this document
    should be addressed to the asrg@ietf.org mailing list.</p>"
