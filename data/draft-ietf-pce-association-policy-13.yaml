abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a simple mechanism to associate policies to
    a group of Label Switched Paths (LSPs) via an extension to the Path Computation
    Element (PCE) Communication Protocol (PCEP). The extension allows a PCEP speaker
    to advertise to a PCEP peer that a particular LSP belongs to a particular Policy
    Association Group.</p>"
