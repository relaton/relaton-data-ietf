abstract:
- language: en
  script: Latn
  content: "<p>A logical interface is used to hide the change of network interface
    from the upper host IP layer and it also can be used for a multiple interfaces
    mobile node in PMIPv6 domain.  If a LMA assigns multiple home network prefixes
    to a multiple interfaces mobile node with a logical interface, a logical interface
    has various usages of the multiple home network prefixes.  As following general
    PMIPv6 operations described in RFC 5213, all multiple home network prefixes are
    shown to host IP layer.  Also, the logical interface hides the existence of multiple
    home network prefixes and shows only one home network prefix to host IP layer.
    \ In this internet draft, we describe various scenarios of the usage of multiple
    home network prefixes on a logical interface.</p>"
