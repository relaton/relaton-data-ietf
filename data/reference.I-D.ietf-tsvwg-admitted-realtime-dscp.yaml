abstract:
- language: en
  script: Latn
  content: <p>This document requests one Differentiated Services Code Point (DSCP)
    from the Internet Assigned Numbers Authority (IANA) for a class of real-time traffic.  This
    class conforms to the Expedited Forwarding Per Hop Behavior.  It is also admitted
    using a CAC procedure involving authentication, authorization, and capacity admission.
    This differs from a real-time traffic class conforming to the Expedited Forwarding
    Per Hop Behavior but not subject to capacity admission or subject to very coarse
    capacity admission.  Legal  This documents and the information contained therein
    are provided on an "AS IS" basis and THE CONTRIBUTOR, THE ORGANIZATION HE/SHE
    REPRESENTS OR IS SPONSORED BY (IF ANY), THE INTERNET SOCIETY, THE IETF TRUST AND
