abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the Sunset HTTP response header field, which
    indicates that a URI is likely to become unresponsive at a specified point in
    the future. It also defines a sunset link relation type that allows linking to
    resources providing information about an upcoming resource or service sunset.
    Note to Readers This draft should be discussed on the ART mailing list (&lt;https://www.ietf.org/mailman/listinfo/art&gt;).
    Online access to all versions and files is available on GitHub (&lt;https://github.com/dret/I-D/tree/master/sunset-header&gt;).</p>"
