abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for new functionality to be added
    to the Datatracker tool to make it possible for IETF working group chairs and/or
    their delegates to indicate and update the status of working group documents.
    \ It also describes additional functions to enable IETF chairs and others to more
    easily follow the progression of working group documents from their earliest stages.</p>"
