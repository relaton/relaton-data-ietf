- language: en
  script: Latn
  content: "<p>This document describes simple requirement for softswitch, which use
    ENUM DNS to route a call on VoIP service. This requirement is one of interim solution
    to maintain stability of on-going commercial softswitch system while initial stage
    of ENUM service that does not have sufficient data.</p>"
