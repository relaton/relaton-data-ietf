abstract:
- language: en
  script: Latn
  content: <p>This document defines a new BGP Cease NOTIFICATION message subcode,
    "Maximum Number of Paths Reached", used when a BGP speaker terminates a peering
    because the number of paths received from a neighbor, as permitted by BGP ADD-PATH,
    exceeds a locally configured upper bound.</p>
