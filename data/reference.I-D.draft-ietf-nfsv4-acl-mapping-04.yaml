abstract:
- language: en
  script: Latn
  content: "<p>A number of filesystems and applications support ACLs based on a withdrawn
    POSIX draft [2]. Those ACLs differ significantly from NFS version 4 (NFSv4) ACLs
    [1]. We describe how to translate between the two types of ACLs.</p>"
