abstract:
- language: en
  script: Latn
  content: "<p>Today no standard method is defined to monitor the NETCONF protocol,
    including items such as sessions and subscription information.  As NETCONF adds
    these and increasing capabilities which can impact configuration management, monitoring
    becomes increasingly important. This document defines NETCONF content via XML
    Schema to be used to monitor the Netconf protocol.  It includes information about
    Netconf sessions, locks, and subscriptions and is intended to facilitate management
    of a NETCONF server.  In addition this memo defines a mechanism to be able to
    discover all possible data models (XML Schemas) from a NETCONF server.  This mechanism
    provides explicit references to supported schema versions and can be performed
    dynamically throughout a session, unlike capabilities exchange which is performed
    during session setup only.</p>"
