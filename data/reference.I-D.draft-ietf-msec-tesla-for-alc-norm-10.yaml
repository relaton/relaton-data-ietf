abstract:
- language: en
  script: Latn
  content: "<p>This document details the TESLA packet source authentication and packet
    integrity verification protocol and its integration within the ALC and NORM content
    delivery protocols.  This document only considers the authentication/integrity
    verification of the packets generated by the session's sender.  The authentication
    and integrity verification of the packets sent by receivers, if any, is out of
    the scope of this document.</p>"
