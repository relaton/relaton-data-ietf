abstract:
- language: en
  script: Latn
  content: "<p>This document defined IANA considerations for Network Block Transfer\nProtocol (NETBLT). This protocol uses several values that are to be\nassigned by IANA, but no appropriate registries have been created so\nfar. This document serves as a foundation for such registries. It\nupdates RFC 998.</p>"
