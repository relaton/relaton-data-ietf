abstract:
- language: en
  script: Latn
  content: "<p>This document defines ROHC-FN (RObust Header Compression - Formal Notation):
    a formal notation to specify field encodings for compressed formats when defining
    new profiles within the ROHC framework. ROHC-FN offers a library of encoding methods
    that are often used in ROHC profiles and can thereby help simplifying future profile
    development work.</p>"
