abstract:
- language: en
  script: Latn
  content: "<p>The Governed Action Protocol (GAP) is an open wire protocol for a Universal
    Action Coordination Fabric. GAP defines a four-phase lifecycle (Declare, Grant,
    Invoke, Receipt) that governs every action an AI agent, smart device, industrial
    controller, or automated pipeline may take. Every gate decision produces a content-addressed,
    immutable receipt; receipts are signed at L2+ (Ed25519) and L4 (hybrid ML-DSA-65).
    The protocol is designed to be language- and platform-neutral, applicable across
    enterprise AI agent pipelines, consumer smart home devices, medical equipment,
    industrial control systems, and game engines. This document specifies the wire
    format, object model, grant evaluation rules, HTTP API surface, workflow semantics,
    revocation mechanisms, and conformance tiers for GAP version 1.0.</p>"
