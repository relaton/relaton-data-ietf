abstract:
- language: en
  script: Latn
  content: "<p>This document details the challenges with building an Autonomic Control
    Plane on Campus/Enterprise networks which are built out of layer-two (Ethernet)
    switched technologies.  This document does not propose a specific solution as
    yet, but details a number of possibilities, and what it would take to standardize
    each possibility.</p>"
