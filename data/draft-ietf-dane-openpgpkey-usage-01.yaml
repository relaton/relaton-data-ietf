  script: Latn
  content: <p>The OPENPGPKEY DNS Resource Record can be used to match an email address
    to an OpenPGP key. This document specifies a Best Common Practise ("BCP") for
    email clients, MUA's and MTA's for using the OPENPGPKEY DNS Resource Record.</p>
