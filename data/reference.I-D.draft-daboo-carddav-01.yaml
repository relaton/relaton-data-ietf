abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a set of methods, headers and resource types
    that define an extension to the WebDAV protocol to support vCard data stored as
    address books on the server. The new protocol elements are intended to make WebDAV-based
    address book management an interoperable standard that supports address book access,
    address book sharing, and address book publishing.</p>"
