abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to IKEv2 that allows an endpoint
    to prove to a security gateway that it was already authenticated by another trusted
    security gateway, thereby allowing the authentication of the endpoint without
    user intervention. This is accomplished using a Short Term Credential that the
    endpoint requests from the authenticating security gateway. This credential is
    a certificate issued by the authenticating gateway for a short period of time,
    and it can be used to authenticate the user with IKE signature based authentication.</p>"
