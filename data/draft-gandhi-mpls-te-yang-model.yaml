abstract:
- language: en
  script: Latn
  content: "<p>This document defines YANG data model for the management of Multi-\n   Protocol Label Switching Traffic Engineering (MPLS-TE) tunnels, Label\n   Switched Paths (LSPs) and links.  The data model covers configuration\n   data, operational state data, RPC execution commands and event\n   notifications.</p>"
