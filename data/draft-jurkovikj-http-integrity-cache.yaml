title:
- language: en
  script: Latn
  content: Maintaining HTTP Integrity Fields in Cached and Cache-Generated Responses
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-jurkovikj-http-integrity-cache-00
docidentifier:
- content: draft-jurkovikj-http-integrity-cache
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-08-20'
abstract:
- language: en
  script: Latn
  content: "<p>HTTP caches update stored response fields, combine partial responses,\n   and construct responses from stored state.  Those operations can move\n   an Integrity field value onto content or representation data\n   different from the data to which the value originally applied.\n\n   This document updates RFC 9111 by defining field-specific maintenance\n   rules for Content-Digest, Repr-Digest, and Unencoded-Digest.  A cache\n   either preserves the association between each retained or emitted\n   dictionary member and its defined input, recomputes the member over\n   the resulting input, or removes the member.  The rules cover stored-\n   field updates, 304 and HEAD freshening, partial-response combination,\n   cache-generated 304, HEAD, and 206 responses, and content-coding\n   transformations.  No new HTTP field, status code, cache directive,\n   validator, or digest algorithm is defined.</p>"
