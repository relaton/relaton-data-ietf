abstract:
- language: en
  script: Latn
  content: "<p>This document is the final Internet-Draft update for Formal SignWriting.
    Formal SignWriting is the plain-text technical model used by Sutton SignWriting
    resources for FSW, SWU, signboxes, grammar, search, layout, rendering, styling,
    and implementation practice. The maintained reference publication is now the Formal
    SignWriting series, version 1.0.0, published through Zenodo, GitHub, and the author's
    website. This Internet-Draft is retained as a historical IETF-facing bridge and
    cross-reference. It is not an IETF standard, does not request IETF standardization,
    and should not be cited as the current reference specification for Formal SignWriting.</p>"
