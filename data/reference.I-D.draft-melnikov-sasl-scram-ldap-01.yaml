  script: Latn
  content: "<p>This memo describes how authPassword LDAP attribute can be used for
    storing secrets used by Salted Challenge Response (SCRAM) Simple Authentication
    and Security Layer (SASL) Mechanism.  Note  A revised version of this draft document
    will be submitted to the RFC editor as a Proposed Standard for the Internet Community.
    \ Discussion and suggestions for improvement are requested, and should be sent
    to ietf-sasl@imc.org.</p>"
