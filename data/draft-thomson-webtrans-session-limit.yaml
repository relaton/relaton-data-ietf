abstract:
- language: en
  script: Latn
  content: "<p>Limits to how a WebTransport session uses QUIC resources like streams\n   or data can help reduce the effect that one WebTransport session has\n   on other uses of the same HTTP/3 connection.  This describes\n   mechanisms for limiting the number of streams and quantity of data\n   that can be consumed by each WebTransport session.</p>"
