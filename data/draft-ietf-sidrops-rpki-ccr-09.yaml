abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a Canonical Cache Representation (CCR) content
    type for use with the Resource Public Key Infrastructure (RPKI). CCR is a Distinguished
    Encoding Rules (DER) encoded data interchange format which can be used to represent
    various aspects of the state of a validated RPKI cache at a particular point in
    time. The CCR profile is a compact and versatile format, well-suited for a variety
    of applications, for example, audit trails, analytics pipelines, and validated
    payload dissemination.</p>"
