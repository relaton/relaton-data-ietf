abstract:
- language: en
  script: Latn
  content: "<p>This document describes the applicability of IPv6 over constrained
    node networks (6lo) and provides practical deployment examples. In addition to
    IEEE 802.15.4, various link layer technologies such as ITU-T G.9959 (Z-Wave),
    BLE, DECT-ULE, MS/TP, NFC, PLC (IEEE 1901.2), and IEEE 802.15.4e (6tisch) are
    used as examples. The document targets an audience who like to understand and
    evaluate running end- to-end IPv6 over the constrained link layer networks connecting
    devices to each other or to each cloud.</p>"
