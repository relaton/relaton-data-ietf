abstract:
- language: en
  script: Latn
  content: "<p>Ogg Skeleton defines a logical bitstream that provides structuring\n   information for multitrack Ogg files.  It provides clues for\n   synchronization and content negotiation including language selection.\n   It also provides keypoint indices for optimal seeking over high-\n   latency connections or in time-critical scenarios.</p>"
