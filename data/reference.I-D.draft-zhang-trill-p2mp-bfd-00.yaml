abstract:
- language: en
  script: Latn
  content: "<p>Point to multipoint (P2MP) BFD is designed to verify multipoint connectivity.
    \ This document specifies the support of P2MP BFD in TRILL.  Similar as TRILL
    point to point BFD, BFD Control packets in TRILL P2MP BFD are also transmitted
    using an extended RBridge Channel.</p>"
