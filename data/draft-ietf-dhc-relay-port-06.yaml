abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes an extension to the DHCP protocols that allows
       a relay agent to receive packets from a server or an upstream relay
       agent on any UDP port, not just the default port 67 for IPv4 or
       default port 547 for IPv6.</p>
