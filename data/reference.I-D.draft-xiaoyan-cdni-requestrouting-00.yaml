abstract:
- language: en
  script: Latn
  content: "<p>This document describes recursive request routing procedures for CDN
    interconnection, it also describes content acquisition procedure using the HTTP
    protocol when cache miss occurs. The goal of the present document is to spur discussion
    about these procedures and to achieve a consensus on request routing procedures
    of CDNI.</p>"
