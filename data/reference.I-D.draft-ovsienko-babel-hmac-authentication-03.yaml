abstract:
- language: en
  script: Latn
  content: "<p>This document describes a cryptographic authentication mechanism for
    Babel routing protocol, updating, but not superceding RFC 6126.  The mechanism
    allocates two new TLV types for the authentication data, uses HMAC and is both
    optional and backward compatible.</p>"
