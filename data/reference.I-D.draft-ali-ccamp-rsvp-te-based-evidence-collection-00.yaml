abstract:
- language: en
  script: Latn
  content: "<p>The problem of quality analysis and advanced fault detection of  a
    pure light-path in a Dense Wavelength Division Multiplexing  (DWDM) optical network
    requires the transmission of optical  evidence related parameters along the provisioned
    route. In  this draft we propose an RSVP-TE based mechanism to collect and  evaluate
    optical evidence measured over optical nodes along the  light-path.</p>"
