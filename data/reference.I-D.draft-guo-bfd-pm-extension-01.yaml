abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to the Bidirectional Forwarding
    Detection (BFD) protocol to support Performance Measurement for IP/MPLS network.
    Specifically, it defines BFD extensions for measuring packet loss, delay and delay
    variation for arbitrary paths between systems.</p>"
