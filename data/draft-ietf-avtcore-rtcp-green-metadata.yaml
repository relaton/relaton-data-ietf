abstract:
- language: en
  script: Latn
  content: "<p>The RTCP messages specified in this document enable receivers to provide
    feedback to the senders and thus allow for short-term adaptation and feedback-based
    energy efficient mechanisms to be implemented. The messages have broad applicability
    in point-to-point real-time video communication services. Specifically, the messages
    can be used to convey the video decoder feedback metadata to the encoder to adapte
    the decoder energy consumption as defined in the ISO/IEC International Standard
    23001-11, known as Energy Efficient Media Consumption (Green metadata), developed
    by the ISO/IEC JTC 1/SC29/WG3 MPEG Systems.</p>"
