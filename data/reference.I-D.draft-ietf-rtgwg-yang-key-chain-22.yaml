abstract:
- language: en
  script: Latn
  content: "<p>This document describes the key chain YANG data model.  Key chains
    are commonly used for routing protocol authentication and other applications requiring
    symmetric keys.  A key chain is a list of elements each containing a key string,
    send lifetime, accept lifetime, and algorithm (authentication or encryption).
    \ By properly overlapping the send and accept lifetimes of multiple key chain
    elements, key strings and algorithms may be gracefully updated.  By representing
    them in a YANG data model, key distribution can be automated.</p>"
