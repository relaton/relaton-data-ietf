- language: en
  script: Latn
  content: "<p>This document describes guidelines for Signal Degrade (SD) fault condition
    detection at an arbitrary transport path (LSP or PW) and the usage of MPLS-TP
    fault management [3] for triggering protection switching as defined in the MPLS-TP
    survivability framework [2].</p>"
