abstract:
- language: en
  script: Latn
  content: "<p>A new extended community is introduced in this document to carry the
    link congestion status, especially for the exit link of one AS. We call this extended
    community congestion status community, which can be used by the BGP routers to
    steer the Internet-access traffic among the exit links by deploying policy routing.</p>"
