abstract:
- language: en
  script: Latn
  content: "<p>This document provides an overview of MPLS-TP OAM tools, including
    MPLS-TP OAM functions, generic mechanisms for supporting MPLS-TP OAM; MPLS-TP
    Fault management tools; and Performance Management tools defined in IETF, OAM
    toolset utilization, and IANA assigned code point under G-Ach discussion. The
    protocol definitions for each individual MPLS-TP OAM tool are specified in separate
    RFCs (or Working Group documents while this document is work in progress) which
    this document references.</p>"
