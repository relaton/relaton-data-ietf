abstract:
- language: en
  script: Latn
  content: "<p>This document defines the intent_chain claim as a companion to the\n   actor_chain claim defined in {{!I-D.draft-mw-spice-actor-chain}}.\n   While the actor chain addresses delegation provenance (WHO delegated\n   to whom), the intent chain addresses content provenance (WHAT was\n   produced and HOW it was transformed).\n\n   In AI agent workflows, content flows through multiple processing\n   stages including AI agents and filters.  The intent chain provides a\n   cryptographically verifiable, tamper-evident record of this content\n   journey.  The full intent chain is stored as ordered logs, with only\n   the Merkle root included in the OAuth token for efficiency.\n\n   Together, the actor chain and intent chain provide complete\n   governance for autonomous AI agent systems, addressing Spoofing,\n   Tampering, Repudiation, and Elevation of Privilege threats in the\n   STRIDE threat model.</p>"
