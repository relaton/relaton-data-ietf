  content: "<p>RFC-904 is the specification of the Exterior Gateway Protocol (EGP).
    \   This memo updates portions of RFC-888 and RFC-827.  This RFC specifies    an
    official protocol of the DARPA community for use between gateways of    different
    autonomous systems in the ARPA-Internet.</p>"
