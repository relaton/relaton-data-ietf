abstract:
- language: en
  script: Latn
  content: "<p>The multiple care-of address registration protocol [1] provides a framework
    to maintain multiple virtual paths with its home agents. But there is no solution
    to synchronize a policy for flow distribution on the multiple paths. This document
    describes a schema fragment (a xml based data set) to define flow distribution
    policy. A dynamic policy exchange method using SOAP is also introduced.</p>"
