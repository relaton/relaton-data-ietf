abstract:
- language: en
  script: Latn
  content: "<p>This document summarizes publicly available information on a range of\n   widely studied post-quantum cryptographic algorithms, including Key\n   Encapsulation Mechanisms (KEMs) and digital signature schemes.\n\n   It aggregates parameters and high-level security assumptions from\n   existing specifications and standardization efforts, serving as a\n   unified informational reference.\n\n   This document is purely informational.  It does not provide guidance,\n   recommendations, or requirements regarding algorithm selection,\n   deployment, or migration strategies.</p>"
