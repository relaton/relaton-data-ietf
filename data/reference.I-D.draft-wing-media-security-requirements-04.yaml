abstract:
- language: en
  script: Latn
  content: "<p>A number of proposals have been published to address the need of securing
    media traffic. Different assumptions, requirements, and usage environments justify
    every one of them. This document aims to summarize the discussed media security
    requirements in order progress the work on identifying a small subset applicable
    to a large range of deployment environments. This document is discussed on the
    RTPSEC mailing list, http://www.imc.org/ietf-rtpsec.</p>"
