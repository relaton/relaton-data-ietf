abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a new DNS RR type for experimental purposes.  This
    RFC describes a mechanism to allow the DNS to carry location information about
    hosts, networks, and subnets.  This memo defines an Experimental Protocol for
    the Internet community.</p>"
