abstract:
- language: en
  script: Latn
  content: <p>In case operators decide to delay BGPsec path validation, none of the
    available states do properly represent this decision. This document introduces
    "Unverified" as a well-defined validation state which allows to properly identify
    a non-evaluated BGPsec routes as not verified.</p>
