abstract:
- language: en
  script: Latn
  content: "<p>This draft describes the interface to the Telnet server on IBM's iSeries
    line of midrange business computers. This interface allows Telnet clients to request
    a Telnet terminal or printer session using specific session attributes related
    to device names, encryption, lan- guage support, auto-signon, response codes,
    session association, etc. These support functions are implemented primarily using
    the Telnet Environment option negotiation [RFC1572] to define new USERVAR vari-
    ables that will be recognized by iSeries Telnet server.</p>"
