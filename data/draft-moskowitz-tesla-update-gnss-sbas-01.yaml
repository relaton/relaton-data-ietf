  script: Latn
  content: "<p>This document updates TESLA [RFC4082] to current cryptographic methods
    for use by the International Civil Aviation Organization (ICAO) in their Global
    Navigation Satellite System (GNSS) Satellite- based augmentation system (SBAS)
