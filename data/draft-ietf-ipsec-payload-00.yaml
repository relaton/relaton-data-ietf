abstract:
- language: en
  script: Latn
  content: "<p>This document describes the IP Encapsulating Security Payload (ESP).
    ESP is a mechanism for providing integrity and confidentiality to IP datagrams.
    In some circumstances it can also provide authentication to IP datagrams. The
    mechanism works with both IPv4 and IPv6.</p>"
