- language: en
  script: Latn
  content: |-
    <p>This document describes a generic IPv6 addressing scheme which is
       suitable for self-managing Autonomic Control Plane.  The scheme
       allows for a flat address hierarchy as well as optionally, when
       required, the definition of aggregatable zones.</p>
