abstract:
- language: en
  script: Latn
  content: "<p>This document describes a set of Layer 2 Tunneling Protocol (L2TP)
    Attribute Value Pair (AVP) extensions designed to carry the Access Line information
    which is not currently available by the existing L2TP AVP set. It is expected
    that this document will be updated if and when new line information is available,
    since its primary purpose is to provide a reference for DSL equipment vendors
    wishing to interoperate with other vendors' products.</p>"
