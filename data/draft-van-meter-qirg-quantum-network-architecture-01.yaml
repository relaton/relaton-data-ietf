- language: en
  script: Latn
  content: "<p>This quantum network architecture defines a set of planes providing
    different views of the network, supporting different responsibilities and modes
    of operation; a set of device, node and link types; some network topologies, deployment
    scenarios and their relationship to applications; and key design decisions as
    a result of corresponding requirements.</p>"
