abstract:
- language: en
  script: Latn
  content: "<p>SIPREC Session Recording Protocol is used for establishing recording
    session and reporting of the metadata of the communication session.  This document
    specifies the SIPREC Protocol (SIPREC).  SIPREC is used between Session Recording
    Client (SRC) and Session Recording Server (SRS).</p>"
