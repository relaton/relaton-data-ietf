abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Self-Describing Resilient Container\n   (SFC) file format, a general-purpose binary container format\n   designed for reliable transmission of arbitrary file data over\n   unreliable, bandwidth-constrained, or asynchronous channels\n   including physical media hand-carry, multi-session transfers,\n   and heterogeneous delivery paths.\n\n   SFC encapsulates any file or directory tree into independently\n   addressable, self-identifying chunks.  Each chunk carries\n   sufficient metadata to identify itself and verify its own\n   integrity in isolation.  Full reconstruction additionally requires\n   a Global Header; this distinction is made explicit throughout.\n\n   This document defines a Core specification and five optional\n   Profiles: Image (SFC/P1), Split Transport (SFC/P2), HTTP Hints\n   (SFC/P3), Preprocessing (SFC/P4), and Directory (SFC/P5).</p>"
