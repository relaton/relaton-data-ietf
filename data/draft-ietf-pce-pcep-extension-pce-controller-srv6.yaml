date:
- type: published
  at: '2026-03-16'
abstract:
- language: en
  script: Latn
  content: "<p>The Path Computation Element (PCE) is a core component of Software-\n   Defined Networking (SDN) systems.  A PCE-based Central Controller\n   (PCECC) can simplify the processing of a distributed control plane by\n   blending it with elements of SDN without necessarily completely\n   replacing it.\n\n   This document specifies the procedures and Path Computation Element\n   Communication Protocol (PCEP) extensions when a PCE-based controller\n   is also responsible for configuring the forwarding actions on the\n   routers, in addition to computing the paths for packet flows in an\n   SRv6 (SR in IPv6) network and telling the edge routers, what\n   instructions to attach to packets as they enter the network.  PCECC\n   is further enhanced for SRv6 Segment Identifier (SID) allocation and\n   distribution.</p>"
