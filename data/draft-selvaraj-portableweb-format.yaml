abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Portable Web Content Format (PortableWeb),\n   a file format for packaging interactive web content — including HTML,\n   CSS, JavaScript, and associated media — into a single self-contained,\n   portable bundle.  A PortableWeb bundle (.pweb file) can be saved,\n   shared, and rendered by a compatible viewer application on any\n   platform, entirely offline, without a web server, without association\n   with a Web origin, and without being confined to a web browser.\n\n   This specification defines the container format and manifest schema\n   for PortableWeb bundles at version 0.1.  Companion specifications\n   covering the runtime sandbox, storage model, signing, and inter-\n   bundle communication are forthcoming.</p>"
