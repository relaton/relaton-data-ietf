abstract:
- language: en
  script: Latn
  content: "<p>DECADE is an in-network storage infrastructure under discussions and
    constructions.  It can be integrated into Peer-to-Peer (P2P) applications to achieve
    more efficient content distributions.  This document represents a detailed example
    of integrating DECADE with a dominating P2P application - P2P livestreaming.  This
    document describes a preliminary framework of DECADE client API, P2P live streaming
    integration, the environment of the test on this integrarion and application performance
    analysis in the test.</p>"
