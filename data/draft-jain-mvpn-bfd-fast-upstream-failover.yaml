abstract:
- language: en
  script: Latn
  content: "<p>This document defines BGP extensions and procedures that allows use\n   of BFD for Multi Point Networks for fast detection and failover for\n   upstream faults in Multicast VPNs.  The upstream failures addressed\n   in this proposal can be failure of any node between the Root PE and\n   Leaf PE or failure between the Multicast Source and Root PE.</p>"
