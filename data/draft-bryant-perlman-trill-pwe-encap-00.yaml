abstract:
- language: en
  script: Latn
  content: "<p>A new layer of encapsulation is required with RBridges. This layer
    must contain at least a time-to-live and an RBridge identifier field. This document
    proposes that the reuse of the encapsulation defined by PWE3 for encapsulation
    of Ethernet frames over an MPLS packet switched network.</p>"
