- language: en
  script: Latn
  content: "<p>This memo defines classification of SNMP MIBs to either use SNMP cache
    database and shared database (SDB) mechanism to reduce high CPU usage while SNMP
    GET REQUEST, GETNEXT REQUEST, GETBULK REQUEST are continuously performed from
    network management system (NMS)/SNMP manager/SNMP MIB browser to managed device.</p>"
