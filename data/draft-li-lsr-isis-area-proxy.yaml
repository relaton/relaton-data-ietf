title:
- language: en
  script: Latn
  content: Area Proxy for IS-IS
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-li-lsr-isis-area-proxy-07
docidentifier:
- content: draft-li-lsr-isis-area-proxy
