- language: en
  script: Latn
  content: "<p>The purpose of this document is to make errata changes and adopt a
    proposal from Yoshifumi Nishida to slightly increase the minimum window size after
    Fast Recovery from one to two segments, to improve performance when the receiver
    uses delayed acknowledgments.</p>"
