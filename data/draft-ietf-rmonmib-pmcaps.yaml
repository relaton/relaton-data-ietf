abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB) for\nuse with network management protocols in the Internet community.  In\nparticular, it describes managed objects used for classifying and\ncharacterizing the performance measurement (PM) capabilities of various\nstandard and proprietary PM techniques.</p>"
