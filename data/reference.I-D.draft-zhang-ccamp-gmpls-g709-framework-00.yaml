- language: en
  script: Latn
  content: "<p>This document provides a framework for applying Generalized Mulit-
    Protocol Label Switching (GMPLS) and the Path Computation Element (PCE) architecture
    to the control of G.709 Optical Transport Networks (OTN) as specified in the ITU-T
    G.709 recommendation, including the enhanced functionality in the recently consented
