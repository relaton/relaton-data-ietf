- language: en
  script: Latn
  content: "<p>Based on changes to the 4th edition of X.500, this document updates
    the Lightweight Directory Access Protocol (LDAP). It defines an equality and a
    substrings matching rule for the 'Facsimile Telephone Number' syntax and updates
    the 'facsimileTelephoneNumber' attribute type to use them.</p>"
