abstract:
- language: en
  script: Latn
  content: |-
    <p>For MPLS EVPN, RFC9489 specifies the mechanisms for detecting data
       plane failures using LSP Ping.  This document proposes a similar
       mechanism to detect data plane failures for EVPN over SRv6.</p>
