abstract:
- language: en
  script: Latn
  content: "<p>This document provides an approach of cross-domain traffic control
    in application-layer or overlay routing, such as content delivery networks and
    live media streaming systems, to reduce inter-domain traffic and transit traffic
    that costs more for Internet service providers (ISPs).  This approach utilizes
    global cost map to regulate policy conflicts between distinct ISPs.  The approach
    and the simulation results in this document suggest to use global cost map in
    application-layer routing and highlight the advantage of cross-domain cooperation
    with the global cost map.  To distribute the global cost map, the ALTO protocol
    is the best way today, and consequently, this document defines a usage of the
    ALTO protocol.  This document also defines a solution approach to compute global
    cost map that takes into account commercial relationships between autonomous systems,
    with hiding confidential information as much as possible.</p>"
