abstract:
- language: en
  script: Latn
  content: "<p>This document registers the Simple Authentication and Security Layer
    (SASL) mechanisms SCRAM-SHA-256 and SCRAM-SHA-256-PLUS, provides guidance for
    secure implementation of the original SCRAM-SHA-1-PLUS mechanism, and updates
    the SCRAM registration procedures of RFC 5802.</p>"
