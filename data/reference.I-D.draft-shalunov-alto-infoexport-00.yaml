abstract:
- language: en
  script: Latn
  content: "<p>The ALTO Information Export Service is a simple way to convey ISP routing
    policy preferences to applications.  Applications that could use this service
    are those that have a choice in connection endpoints.  Examples of such applications
    are peer-to-peer and content delivery networks.  Applications already have access
    to great amount of underlying topology information.  For example, views of the
    Internet routing table are easily available at looking glass servers and entirely
    practical to download to every client.  What is missing is the routing policy
    information -- what does the local ISP actually prefer?  This document describes
    a very simple mechanism that would allow to export such information to applications.
    \ While such service would primarily be provided by the network, i.e., the local
    ISP, third parties could also operate this service.1.  Requirements notation</p>"
