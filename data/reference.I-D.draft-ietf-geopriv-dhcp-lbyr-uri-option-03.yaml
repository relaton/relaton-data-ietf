abstract:
- language: en
  script: Latn
  content: "<p>This document creates a Dynamic Host Configuration Protocol (DHCP)
    Option for the downloading of a Uniform Resource Identifier (URI) pointing to
    the geolocation record of an endpoint.  This URI, called a Location-by-Reference
    (LbyR), points to a record on a location server which tracks the geolocation of
    the endpoint.  Once downloaded by an endpoint, this LbyR can be forwarded to another
    entity, to be dereferenced if this entity wants to learn the geolocation of the
    sender endpoint.</p>"
