abstract:
- language: en
  script: Latn
  content: |-
    <p>Past cyber theft stole files.  Present theft steals live sessions and
       SaaS tokens.  The next theft does not need a dump.  A frontier
       enterprise assistant that can see mail, tickets, code, finance, and
       memory can join those fragments into a meaning that was never stored
       as one record, then act.  That is enterprise-future mapping:
       reconstruction of strategy, relationships, and probable next moves,
       followed by send, write, or tool invoke [DAS-ISOLATION].

       IAM, DLP, clean rooms, TEEs, and output filters still answer who may
       touch a store.  They do not answer whether separately lawful
       fragments may be joined into a new protected meaning, or whether that
       meaning may leave through Claude, ChatGPT Enterprise, a computer-use
       agent, or an MCP tool.

       This profile keeps identity, content, and association under
       independently controlled vaults, joins them only under a session-
       bound Reconstruction Authorization Object, seals the Candidate
       Output, commits a receipt before release authority exists, and
       completes send, render, store, or invoke only at an Output Release
       Boundary.  Compromise of the model host is not reconstruction.
       Reconstruction is not release.

       *This revision adds two clarifications that operators and reviewers
       should read first.* First, a compromised AI-connected server is not
       merely a copy of stored rows: it is a joining engine that can
       correlate lawfully accessible fragments across mail, tickets, code,
       procurement, and finance into strategic intelligence that was never
       written down as a single record, and, in a defense or critical-
       infrastructure deployment, into operational intelligence with
       correspondingly higher consequence.  Second, independently controlled
       vaults do not require every protected operation to run serially on
       every inference step: this revision specifies a cold path for
       protected precomputation, a hot path limited to checks whose omission
       would permit unauthorized reconstruction or release, permissible
       parallel fan-out across vaults after a valid Reconstruction
       Authorization Object is established, and an incremental legacy-
       database migration path, so that the profile can be adopted without
       an immediate rebuild of existing enterprise data stores, models, or
       application interfaces.</p>
