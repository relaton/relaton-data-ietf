abstract:
- language: en
  script: Latn
  content: "<p>Past cyber theft stole files.  Present theft steals live sessions and\n   SaaS tokens.  The next theft does not need a dump.  A frontier\n   enterprise assistant that can see mail, tickets, code, finance, and\n   memory can join those fragments into a meaning that was never stored\n   as one record, then act.  That is enterprise-future mapping:\n   reconstruction of strategy, relationships, and probable next moves,\n   followed by send, write, or tool invoke [DAS-ISOLATION].\n\n   IAM, DLP, clean rooms, TEEs, and output filters still answer who may\n   touch a store.  They do not answer whether separately lawful\n   fragments may be joined into a new protected meaning, or whether that\n   meaning may leave through Claude, ChatGPT Enterprise, a computer-use\n   agent, or an MCP tool.\n\n   This profile keeps identity, content, and association under\n   independently controlled vaults, joins them only under a session-\n   bound Reconstruction Authorization Object, seals the Candidate\n   Output, commits a receipt before release authority exists, and\n   completes send, render, store, or invoke only at an Output Release\n   Boundary.  Compromise of the model host is not reconstruction.\n   Reconstruction is not release.\n\n   *This revision adds two clarifications that operators and reviewers\n   should read first.* First, a compromised AI-connected server is not\n   merely a copy of stored rows: it is a joining engine that can\n   correlate lawfully accessible fragments across mail, tickets, code,\n   procurement, and finance into strategic intelligence that was never\n   written down as a single record, and, in a defense or critical-\n   infrastructure deployment, into operational intelligence with\n   correspondingly higher consequence.  Second, independently controlled\n   vaults do not require every protected operation to run serially on\n   every inference step: this revision specifies a cold path for\n   protected precomputation, a hot path limited to checks whose omission\n   would permit unauthorized reconstruction or release, permissible\n   parallel fan-out across vaults after a valid Reconstruction\n   Authorization Object is established, and an incremental legacy-\n   database migration path, so that the profile can be adopted without\n   an immediate rebuild of existing enterprise data stores, models, or\n   application interfaces.</p>"
