abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the processing mechanism for the Link State
    Protocol Data Unit (LSP) with an incorrect LSP Checksum in the interoperable networks
    using IS-IS. It is suggested to add a configurable switch to control the processing
    mechanism of checksum error LSP. This document clarifies the processing mechanism
    for zero checksum LSP and zero remaining lifetime LSP, and gives advices to calculate
    the checksum of all kinds of LSPs as well.</p>"
