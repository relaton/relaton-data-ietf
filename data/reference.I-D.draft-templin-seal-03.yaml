abstract:
- language: en
  script: Latn
  content: "<p>Subnetworks are connected network regions bounded by border routers.
    These routers forward unicast and multicast packets over virtual links that are
    tunneled above another forwarding layer.  These virtual links span multiple IP-
    and/or sub-IP layer forwarding hops which may cross links with diverse Maximum
    Transmission Units (MTUs) and introduce packet duplication.  This document specifies
    a Subnetwork Encapsulation and Adaptation Layer (SEAL) that accommodates diverse
    underlying link technologies.</p>"
