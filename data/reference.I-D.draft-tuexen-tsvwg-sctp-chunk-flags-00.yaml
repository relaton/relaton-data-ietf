- language: en
  script: Latn
  content: "<p>The current definition of the Stream Control Transmission Protocol
    (SCTP) is missing a procedure for registering chunk flags for already defined
    chunk types.  This document defines this procedure.  It does not change SCTP in
    any other way.</p>"
