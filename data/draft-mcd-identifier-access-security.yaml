abstract:
- language: en
  script: Latn
  content: <p>The Industrial Internet Identifier Data Access Protocol (IIIDAP) provides
    "RESTful" web services to retrieve identifier metadata from Second-Level Node
    (SLN). This document describes information security services, including access
    control, authentication, authorization, availability, data confidentiality, and
    data integrity for IIIDAP.</p>
