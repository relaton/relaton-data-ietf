- language: en
  script: Latn
  content: "<p>We define a mechanism to allow DNS domain name labels that are considered
    to be private to not appear in public Certificate Transparency (CT) logs, while
    still retaining most of the security benefits that accrue from using Certificate
    Transparency mechanisms.</p>"
