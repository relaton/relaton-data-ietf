abstract:
- language: en
  script: Latn
  content: |-
    <p>There are several cases where, once Fast Reroute has taken place (for
       MPLS protection), a second fast reroute is undesirable, even
       detrimental.  This memo gives several examples of this, and proposes
       a mechanism to prevent further fast reroutes.</p>
