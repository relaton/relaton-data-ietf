abstract:
- language: en
  script: Latn
  content: "<p>Routing protocols have over time been extended to use cryptographic
    mechanisms to validate data being received from a neighboring router to ensure
    that:  o It has not been modified in transit. o Actually originated from an authorized
    neighboring router.  The cryptographic mechanisms defined to date and described
    in this document rely on a digest produced with a hash algorithm applied to the
    payload encapsulated in the routing protocol packet.  This document outlines some
    of the limitations of the current mechanism, problems with manual keying of these
    cryptographic algorithms, and possible vectors for the exploitation of these limitations.</p>"
