abstract:
- language: en
  script: Latn
  content: "<p>SCONE throughput advice is scoped to the path and direction in which
    it is received. When a QUIC connection changes path, the endpoint can retain an
    old advice value while that value is no longer applicable to the active path.
    This document describes endpoint- local handling of that transition. It focuses
    on the distinction between retained advice and active-path advice, the interval
    in which no fresh path-applicable advice is available, and the observability needed
    to avoid treating historical advice as current guidance. This document defines
    no new SCONE protocol elements, does not modify QUIC path validation, does not
    define an application API, and does not change congestion control behavior.</p>"
