abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an application-layer end-to-end encryption\n   (E2EE) scheme for HTTP APIs.  The scheme uses X25519 Elliptic Curve\n   Diffie-Hellman (ECDH) for key agreement, HKDF-SHA256 for key\n   derivation, and AES-GCM (with 128-, 192-, or 256-bit keys) for\n   authenticated encryption of request and response payloads.  Server\n   public keys are discovered through a Well-Known URI and authenticated\n   either by TLS or by a stronger out-of-band trust mechanism, depending\n   on the deployment threat model.  The scheme is designed to provide\n   confidentiality and integrity of payloads independent of, and in\n   addition to, transport-layer security such as TLS.  It provides\n   replay protection and key rotation.</p>"
