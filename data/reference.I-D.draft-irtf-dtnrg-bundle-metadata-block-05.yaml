abstract:
- language: en
  script: Latn
  content: <p>This document defines an extension block that may be used with the DTN
    Bundle Protocol.  This Metadata Extension Block is designed to carry additional
    information that DTN nodes can use to make processing decisions regarding bundles,
    such as deciding whether to store a bundle or determining to which nodes to forward
    a bundle. The metadata that is carried in a metadata block must be formatted according
    to the metadata type that is identified in the block's metadata type field.  One
    specific metadata type, for carrying URIs as metadata, is defined in this document.  Other
    metadata types may be defined in separate documents.  Status of this Memo  This
    Internet-Draft is submitted to IETF in full conformance with the provisions of
    BCP 78 and BCP 79.  Internet-Drafts are working documents of the Internet Engineering
