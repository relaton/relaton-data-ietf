abstract:
- language: en
  script: Latn
  content: "<p>FMIPv6 extends Mobile IPv6 for reducing handover delays. But it does
    not deal with the scenario that an MN joins multicast trees using it's CoA in
    a visited link. The document proposes an extension to FMIPv6 to handle local multicast
    traffic during handover.</p>"
