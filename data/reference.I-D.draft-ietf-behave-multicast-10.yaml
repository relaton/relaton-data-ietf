abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for a Network Address (and port)
    Translator (NAT) that supports Any Source IP Multicast or Source- Specific IP
    Multicast. An IP multicast-capable NAT device that adheres to the requirements
    of this document can optimize the operation of IP multicast applications that
    are generally unaware of IP multicast NAT devices.</p>"
