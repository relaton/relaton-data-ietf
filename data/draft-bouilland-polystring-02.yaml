abstract:
- language: en
  script: Latn
  content: "<p>Managing multi-languages support for a service with autonomous parts
    can be complex. Having its internal parts be polyglot, and coalece to end-user's
    language only on display is one solution. This paper discuss a format to store,
    exchange, and algorithms to consume multi-language strings to this goal.</p>"
