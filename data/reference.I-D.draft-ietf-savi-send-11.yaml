  script: Latn
  content: "<p>This memo specifies SEND SAVI, a mechanism to provide source address
    validation using the SEND protocol.  The proposed mechanism complements ingress
    filtering techniques to provide a finer granularity on the control of IPv6 source
    addresses.</p>"
