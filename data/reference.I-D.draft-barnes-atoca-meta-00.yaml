abstract:
- language: en
  script: Latn
  content: "<p>Recipients of emergency alerts need to discover information about local
    alerting resources, and to register contact points where they can receive alerts.
    \ This document defines a mechanism for IP networks to advertise a local alert
    information resource, and a protocol that end hosts can use to retrieve local
    information and register information about themselves.  Please send feedback to
    the atoca@ietf.org mailing list.</p>"
