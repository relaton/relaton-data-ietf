  script: Latn
  content: "<p>This document defines an HTTPS based transport layer for use with the
    MIMI Protocol. Discussion Venues This note is to be removed before publishing
    as an RFC. Discussion of this document takes place on the More Instant Messaging
    Interoperability Working Group mailing list (mimi@ietf.org), which is archived
    at https://mailarchive.ietf.org/arch/browse/mimi/. Source for this draft and an
    issue tracker can be found at https://github.com/kkohbrok/mimi-transport.</p>"
