abstract:
- language: en
  script: Latn
  content: "<p>Two formats of Operator Identifier (Opr_ID) are specified in Multi-
    Protocol Label Switching Transport Profile (MPLS-TP) networks, to uniquely identify
    an operator.  One is Global Identifier (Global_ID), the other is ITU Carrier Code
    (ICC).  In MPLS-TP networks, Opr_ID as part of the global identifier of an MPLS-TP
    LSP may be required to be carried in the Path message when setting up the LSP.
    \ This document defines two types of Operator Identifier Object: Global_ID Object
    and ICC Object, which could be carried in the Path message to comunicate the Operator
    Identifiers (Opr_IDs) that the two ends of an LSP in use.  At the same time, it
    makes sure all the nodes that the LSP traverses to use the same format of Opr_ID.</p>"
