title:
- language: en
  script: Latn
  content: A YANG data model to manage configurable DWDM optical interfaces
  format: text/plain
docidentifier:
- content: draft-ietf-ccamp-dwdm-if-param-yang
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG model related to the Optical Transceiver
    parameters characterising coherent 100G and above interfaces. 100G and above Transceivers
    support coherent modulation, multiple modulation formats, multiple Forward Error
    Correction (FEC) codes including some not yet specified (or in phase of specification
    by) ITU-T G.698.2 or any other ITU-T recommendation. Use cases are described in
    RFC7698. The YANG model defined in this document can be used for Optical Parameters
    monitoring and/or configuration of Dense Wavelength Division Multiplexing (DWDM)
    interfaces. The use of this model does not guarantee interworking of DWDM transceivers.
    Optical path feasibility and interoperability has to be determined by tools and
    algorithms outside the scope of this document. The purpose of this model is to
    program interface parameters to consistently configure the mode of operation of
    transceivers.</p>"
  format: text/html
