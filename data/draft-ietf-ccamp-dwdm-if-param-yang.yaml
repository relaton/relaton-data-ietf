id: draftietfccampdwdmifparamyang
schema_version: v1.5.6
formattedref:
  content: draft-ietf-ccamp-dwdm-if-param-yang
title:
- language: en
  script: Latn
  content: A YANG data model to manage configurable DWDM optical interfaces
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-ccamp-dwdm-if-param-yang-16
docidentifier:
- content: draft-ietf-ccamp-dwdm-if-param-yang
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-07-03'
abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG model related to the Optical Transceiver\n   parameters characterising coherent 100G and above interfaces.  100G\n   and above Transceivers support coherent modulation, multiple\n   modulation formats, multiple Forward Error Correction (FEC) codes\n   including some not yet specified (or in phase of specification by)\n   ITU-T G.698.2 or any other ITU-T recommendation.  Use cases are\n   described in RFC7698.\n\n   The YANG model defined in this document can be used for Optical\n   Parameters monitoring and/or configuration of Dense Wavelength\n   Division Multiplexing (DWDM) interfaces.  The use of this model does\n   not guarantee interworking of DWDM transceivers.  Optical path\n   feasibility and interoperability has to be determined by tools and\n   algorithms outside the scope of this document.  The purpose of this\n   model is to program interface parameters to consistently configure\n   the mode of operation of transceivers.</p>"
