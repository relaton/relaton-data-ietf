title:
- language: en
  script: Latn
  content: Security Considerations for Tenant ID and Similar Fields
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-eastlake-secdispatch-tenantid-consid-09
docidentifier:
- content: draft-eastlake-secdispatch-tenantid-consid
