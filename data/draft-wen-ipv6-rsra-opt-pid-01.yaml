- language: en
  script: Latn
  content: "<p>This document makes an extension to stateless address auto- configuration
    (SAAC) mechanism by defining Port Identifier option for RS/RA messages in IPv6
    access network. This option can make SAAC possible without upgrading access node
    and CPE to be layer 3 devices.</p>"
