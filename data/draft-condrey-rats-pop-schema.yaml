abstract:
- language: en
  script: Latn
  content: "<p>This document provides the normative Concise Data Definition Language\n   (CDDL) schema for the Proof of Process (PoP) protocol.  The schema\n   defines the CBOR-encoded wire format for PoP evidence packets,\n   semantic editing event transcripts, time anchors, signed tool\n   receipts, compact evidence references, and verifier-produced\n   attestation results.\n\n   The schema is published separately to enable independent tooling,\n   validation, and schema versioning decoupled from narrative\n   specification text.</p>"
