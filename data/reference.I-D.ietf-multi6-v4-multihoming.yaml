abstract:
- language: en
  script: Latn
  content: "<p>Multihoming is an essential component of service for many sites which
    are part of the Internet. This document describes some implementation strategies
    for multihoming with IPv4 and enumerates features for comparison with other multihoming
    proposals (particularly those related to IPv6).</p>"
