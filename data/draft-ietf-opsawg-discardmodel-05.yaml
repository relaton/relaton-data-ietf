abstract:
- language: en
  script: Latn
  content: "<p>This document defines an information model and corresponding data model
    for packet discard reporting. The information model provides an implementation-independent
    framework for classifying packet loss to enable automated network mitigation of
    unintended packet loss. The data model specifies a YANG implementation of this
    framework for network elements.</p>"
