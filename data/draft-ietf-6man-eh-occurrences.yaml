id: draftietf6manehoccurrences
schema_version: v1.5.6
formattedref:
  content: draft-ietf-6man-eh-occurrences
title:
- language: en
  script: Latn
  content: Enforcement of IPv6 Extension Headers Ordering and Occurrence at Destination Nodes
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-6man-eh-occurrences-00
docidentifier:
- content: draft-ietf-6man-eh-occurrences
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-05-29'
abstract:
- language: en
  script: Latn
  content: "<p>Operational experience has demonstrated that permitting multiple\n   occurrences of the same IPv6 Extension Header can create parsing\n   ambiguity, complicate packet processing, and increase potential\n   security risks.  Although RFC 8200 recommends that senders follow a\n   specific order of appearance and limit the occurrences of Extension\n   Headers, receivers cannot assume that these recommendations have been\n   followed.  This document updates RFC 8200 by allowing an IPv6\n   destination node, namely a host (i.e., the final destination of an\n   IPv6 packet) or an intermediate destination node addressed by an\n   entry in a Routing header list other than the final one, to enforce\n   strict ordering and limits on the occurrence of Extension Headers.</p>"
