abstract:
- language: en
  script: Latn
  content: "<p>This RFC describes an internet anycasting service for IP.  The primary
    purpose of this memo is to establish the semantics of an anycasting service within
    an IP internet. This memo provides information for the Internet community.  This
    memo does not specify an Internet standard of any kind.</p>"
