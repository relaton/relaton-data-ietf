abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Kinetic Network Protocol, a decentralized\n   naming and ownership protocol for binding human-readable names to\n   cryptographic identity keys without a central registry, blockchain,\n   or monetary renewal system.  Kinetic uses a commit-reveal flow,\n   verifiable delay functions (VDFs), signed heartbeat records, and\n   redundant Distributed Hash Table (DHT) storage to make name\n   acquisition sequential, verifiable, and resistant to front-running,\n   mass registration, and stale-state capture.  This document defines\n   the protocol model, required records, validation rules, and security\n   considerations for interoperable Kinetic network implementations.</p>"
