abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Run Envelope Runtime (RER) artifact\n   format: a hash-chained, Ed25519-signed JSON record of a single AI\n   inference run.  An RER artifact carries (1) a signed envelope\n   declaring the permissions and limits under which the run was\n   authorized, (2) a hash-chained event log covering every model call,\n   tool call, and policy decision made during execution, and (3) a\n   runtime signature binding the envelope hash and event log head to the\n   runtime implementation that produced the record.\n\n   The artifact is designed for offline verification by parties who did\n   not participate in the run.  A separate verifier package, with a\n   minimal dependency surface (canonicalization, SHA-256, Ed25519, JSON\n   schema validation), can establish the artifact's structural and\n   cryptographic integrity without any of the code that produced it.\n   After sealing, the integrity of the record does not depend on trust\n   in the operator.\n\n   This document complements the declaration-side agents.txt and ai.txt\n   well-known URI proposals (both filed, under review at the IANA Well-\n   Known URIs registry).  Declaration says what an agent was permitted\n   to do.  An RER artifact records what the runtime attested actually\n   happened.  The two surfaces together cover the before-and-after of an\n   agent interaction.\n\n   Two on-the-wire schema versions are defined here: rer-artifact/0.1\n   and rer-artifact/0.2.  Version 0.2 adds a bundle format, manifest\n   binding, and approval-protocol metadata while preserving the\n   verification semantics of 0.1.</p>"
