- language: en
  script: Latn
  content: "<p>This document describes the art of email greylisting, the practice
    of providing temporarily degraded service to unknown email clients as an anti-abuse
    mechanism. Greylisting is an established mechanism deemed essential to the repertoire
    of current anti-abuse email filtering systems. [STANDARDS-TRACK]</p>"
