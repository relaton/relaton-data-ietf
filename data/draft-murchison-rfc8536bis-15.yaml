abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Time Zone Information Format (TZif) for
       representing and exchanging time zone information, independent of any
       particular service or protocol.  Two media types for this format are
       also defined.

       This document replaces and obsoletes RFC 8536.</p>
