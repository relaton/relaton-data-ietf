abstract:
- language: en
  script: Latn
  content: "<p>The purpose of the Intrusion Detection Exchange Format Working Group
    (IDWG) is to define data formats and exchange procedures for sharing information
    of interest to intrusion detection and response systems, and to the management
    systems which may need to interact with them. This Internet-Draft describes the
    high-level requirements for such a communication mechanism, including the rationale
    for those requirements where clarification is needed. Scenarios are used to illustrate
    some requirements.</p>"
