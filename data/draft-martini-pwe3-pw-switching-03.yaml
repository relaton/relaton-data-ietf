abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how to switch pseudo wires (PW) between two
       distinct control planes or PSN domains. The PW control planes may
       belong to independent autonomous systems, or the PSN technology is
       heterogeneous, or a PW might need to be aggregated at a specific PSN
       point.</p>
