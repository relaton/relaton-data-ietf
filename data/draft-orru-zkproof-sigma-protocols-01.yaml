abstract:
- language: en
  script: Latn
  content: "<p>This document describes interactive sigma protocols, a class of secure,
    general-purpose zero-knowledge proofs of knowledge consisting of three moves:
    commitment, challenge, and response. Concretely, the protocol allows one to prove
    knowledge of a secret witness without revealing any information about it.</p>"
