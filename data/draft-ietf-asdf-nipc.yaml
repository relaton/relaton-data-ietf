  script: Latn
  content: An Application Layer Interface for Non-Internet-connected Physical Components
    (NIPC)
  format: text/plain
docidentifier:
- content: draft-ietf-asdf-nipc
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document describes an API that allows applications to perform
    operations against a gateway serving one or more devices described by an SDF model.
    The API consists of a RESTful application layer interface that performs operations
    on those devices, as well as a CBOR-based publish-subscribe interface for streaming
    data.</p>"
