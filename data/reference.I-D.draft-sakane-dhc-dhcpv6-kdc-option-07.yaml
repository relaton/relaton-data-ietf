abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new DHCPv6 option to carry a set of configuration
    information related to the Kerberos protocol [RFC4120]. This document also defines
    three sub-options to be used within this new option, which specify a realm name
    of the Kerberos, a list of IP addresses of the Key Distribution Center of that
    realm, and a client principal name to distinguish a Kerberos client by the DHCPv6
    server.</p>"
