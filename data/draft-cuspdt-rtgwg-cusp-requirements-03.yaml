abstract:
- language: en
  script: Latn
  content: "<p>This document introduces the Control Plane and User Plane separated
    BNG (Broadband Network Gateway) architecture and defines a set of associated terminology.
    It also specifies a set of protocol requirements for communication between the
    BNG-CP and the BNG-UPs in the Control Plane and User Plane Separated BNG.</p>"
