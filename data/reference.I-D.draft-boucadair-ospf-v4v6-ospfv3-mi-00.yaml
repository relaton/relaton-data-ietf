abstract:
- language: en
  script: Latn
  content: "<p>This memo defines two new Instance Identifiers (Instance IDs) in OSPFv3
    [RFC2740]).  These new Instance IDs [I-D.ietf-ospf-af-alt] are meant to instantiate
    distinct OSPFv3 instances to convey routing information which is restricted to
    IPv4-mapped IPv6 address Address Family [I-D.ietf-behave-address-format].  The
    ultimate goal of running separate instances for IPv4-mapped IPv6 is to isolate
    the native IPv6 routing table from the IPv4 and to prevent to be overloaded by
    IPv4-mapped one.  This isolation is motivated also from an operational perspective
    to allow specific engineering policies for each instance.</p>"
