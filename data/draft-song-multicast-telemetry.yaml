abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the requirement of on-path telemetry for multicast
    traffic. The existing solutions are examined and their issues are identified.
    Solution modifications are proposed to allow the original multicast tree to be
    correctly reconstructed without unnecessary replication of telemetry information.</p>"
