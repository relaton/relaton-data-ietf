abstract:
- language: en
  script: Latn
  content: "<p>This document analyses the security of the BGP/MPLS IP VPN architecture
    that is described in RFC 2547bis [13], for the benefit of service providers and
    VPN users. The analysis shows that BGP/MPLS IP VPN networks can be as secure as
    traditional layer-2 VPN services using ATM or Frame Relay.</p>"
