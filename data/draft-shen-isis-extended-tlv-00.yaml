- language: en
  script: Latn
  content: "<p>This document describes an extension to IS-IS protocol that extends
    the code and length fields of IS-IS TLV to two octets each. The extension is backwards
    compatible to existing IS-IS implementation. A transition mechanism for the deployment
    of the new extension is also described.</p>"
