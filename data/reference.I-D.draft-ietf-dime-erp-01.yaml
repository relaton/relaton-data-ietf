abstract:
- language: en
  script: Latn
  content: "<p>EAP Re-authentication Protocol (ERP) defines extensions to the Extensible
    Authentication Protocol (EAP) to support efficient re- authentication between
    the EAP peer and an EAP re-authentication server through an EAP/ERP authenticator.
    \ This document specifies Diameter support for ERP.  It defines a new Diameter
    ERP application to transport ERP messages between authenticator and ERP server,
    and a set of new AVPs that can be used to transport the cryptographic material
    needed by ERP server.</p>"
