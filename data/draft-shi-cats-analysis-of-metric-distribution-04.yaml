abstract:
- language: en
  script: Latn
  content: "<p>This document analyses different methods for distributing the computing
    metrics from service instances to the ingress router. Discussion Venues This note
    is to be removed before publishing as an RFC. Discussion of this document takes
    place on the Computing-Aware Traffic Steering Working Group mailing list (cats@ietf.org),
    which is archived at https://mailarchive.ietf.org/arch/browse/cats/. Source for
    this draft and an issue tracker can be found at https://github.com/VMatrix1900/draft-cats-method-analysis.</p>"
