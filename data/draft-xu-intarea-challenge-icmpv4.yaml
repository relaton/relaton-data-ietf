title:
- language: en
  script: Latn
  content: Enhancing ICMP Error Message Validation Using a Challenge-Confirm Mechanism
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-xu-intarea-challenge-icmpv4-04
