abstract:
- language: en
  script: Latn
  content: "<p>Most of current address autoconfiguration mechanisms for MANET introduce
    significant load like message flooding, or are dependent on the underlying routing
    protocols. This document proposes a new mechanism that is intended to minimize
    these drawbacks. It is also designed to be applicable for hybrid MANET, where
    a MANET is connected to Internet through one or more Interet gateways.</p>"
