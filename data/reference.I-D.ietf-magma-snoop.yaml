abstract:
- language: en
  script: Latn
  content: "<p>This memo describes the recommendations for IGMP- and MLD-snooping
    switches. These are based on best current practices for IGMPv2, with further considerations
    for IGMPv3- and MLDv2-snooping. Additional areas of relevance, such as link layer
    topology changes and Ethernet-specific encapsulation issues, are also considered.</p>"
