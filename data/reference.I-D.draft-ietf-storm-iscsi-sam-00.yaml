abstract:
- language: en
  script: Latn
  content: "<p>Internet Small Computer Systems Interface (iSCSI) is a SCSI transport
    protocol that maps the SCSI family of protocols onto TCP/IP. RFC 3720 defines
    the iSCSI protocol. The current iSCSI protocol (RFC 3720 and RFC 5048) is based
    on the SAM-2 version of the SCSI family of protocols). This document defines additions
    and changes to the iSCSI protocol to enabled additional features that were added
    to the SCSI family of protocols through SAM-3, SAM-4, and SAM-5.  This document
    updates RFC 3720 and RFC 5048 and the text in this document supersedes the text
    in RFC 3720 and RFC 5048 when the two differ.</p>"
