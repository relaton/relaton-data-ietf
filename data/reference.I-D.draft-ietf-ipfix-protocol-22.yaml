abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the IPFIX protocol that serves for transmitting
    IP traffic flow information over the network. In order to transmit IP traffic
    flow information from an exporting process to an information collecting process,
    a common representation of flow data and a standard means of communicating them
    is required. This document describes how the IPFIX data and templates records
    are carried over a congestion-aware transport protocol from an IPFIX exporting
    process to an IPFIX collecting process.</p>"
