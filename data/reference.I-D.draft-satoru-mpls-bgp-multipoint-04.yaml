abstract:
- language: en
  script: Latn
  content: "<p>This document describes the extension of BGP in order to build a policy
    based point-to-multipoint (p2mp) LSP. By using this function, all BGP speakers
    can discover ingress, branch and egress LSRs which belong to a specified p2mp
    LSP and downstream LSRs can specify upstream LSRs by distributing a MPLS label
    information.</p>"
