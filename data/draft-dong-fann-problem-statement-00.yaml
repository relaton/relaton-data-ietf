abstract:
- language: en
  script: Latn
  content: "<p>Many network applications, ranging from Artificial Intelligence (AI)
    /Machine Learning (ML) training/inference to cloud services, require networks
    with various combination of high bandwidth, low delay and low jitter and minimal
    packet loss in data transfer. This requires that the networks must rapidly adapt
    to the presence of faults, degradation and congestion. However, existing routing
    and traffic management mechanisms often face limitations in responsiveness, coverage,
    and operational complexity, particularly in large-scale and high-bandwidth network
    environments (e.g. data center (DC) and data center interconnect (DCI)). A good
    and timely understanding of network conditions can help to enable faster response
    to critical events, so as to enable the selection of paths with reduced latency
    and improve network utilization. This document describes the gap analysis and
    the need for fast network notification, and identifies the set of problems which
    a fast network notification solution needs to address.</p>"
