abstract:
- language: en
  script: Latn
  content: "<p>Flow selection is the process in charge of electing a limited number
    of flows from all of those accounted at an observation point to be considered
    into the measurement process chain. The flow selection process can be enabled
    at different stages of the monitoring reference model by directly acting on the
    metering process after that packet classification is performed, i.e. flow state
    dependent packet sampling, or on the exporting process by limiting the number
    of flows to be stored and/or exported to the collector applications. This document
    describes the motivations which might lead flow selection to be performed and
    a categorization of the related techniques. The document furthermore provides
    the basis for the definition of information models for configuring flow selection
    techniques.</p>"
