abstract:
- language: en
  script: Latn
  content: "<p>This document presents a light-weight, point-to-multipoint transport
    layer protocol named Labelcast, which utilizes a fix-length transport layer label
    to forward multicast packets.  Labelcast is not a universal solution for Internet
    multicast, but aims to give an efficient point-to-multipoint data distribution
    protocol deployed in medium or small scale edge networks.  Since Labelcast provides
    rich functions of quality monitoring, it's suitable to be applied in streaming
    data distribution systems.</p>"
