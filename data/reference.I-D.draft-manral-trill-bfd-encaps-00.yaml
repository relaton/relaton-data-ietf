abstract:
- language: en
  script: Latn
  content: "<p>BFD is a widely deployed Operation, Administration, and Maintenance
    (OAM) mechanism in IP and MPLS networks.  However, in the present form a BFD packet
    cannot be sent over a TRILL network as it is either IP/ UDP encapsulated or encapsulated
    directly over MPLS or using ACH encapsulation.  This document defines BFD encapsulation
    over TRILL to address this shortcoming.</p>"
