abstract:
- language: en
  script: Latn
  content: "<p>Several drafts in the CoRE WG are discussing the usage of CoAP on non-UDP/IP
    transports already.  There are various use cases for non- UDP/IP transports.  In
    order to structure the discussion, this draft introduces new terminology and transport
    scenarios.</p>"
