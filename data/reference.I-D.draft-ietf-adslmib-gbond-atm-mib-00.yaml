abstract:
- language: en
  script: Latn
  content: "<p>This document defines Management Information Base (MIB) module for
    use with network management protocols in TCP/IP based networks. This document
    proposes an extension to the GBOND-MIB which defines a set of common objects for
    managing multi-pair bonded Digital Subscriber Line (xDSL) interfaces. In particular,
    it describes objects used for managing parameters of the ATM based xDSL multi-pair
    bonded interfaces, as defined in ITU-T recommendations G.998.1. The Management
    Information Base (MIB) modules specific to the other bonding technologies are
    defined in GBOND-ETH-MIB and GBOND-TDIM-MIB respectively.</p>"
