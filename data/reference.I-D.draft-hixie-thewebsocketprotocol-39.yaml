abstract:
- language: en
  script: Latn
  content: "<p>This protocol enables two-way communication between a user agent running
    untrusted code running in a controlled environment to a remote host that understands
    the protocol.  It is intended to fail to communicate with servers of pre-existing
    protocols like SMTP or HTTP, while allowing HTTP servers to opt-in to supporting
    this protocol if desired.  It is designed to be easy to implement on the server
    side.Author's note This document is automatically generated from the same source
    document as the HTML5 specification.  [HTML5]  Please send feedback to either
    the hybi@ietf.org list or the whatwg@whatwg.org list.</p>"
