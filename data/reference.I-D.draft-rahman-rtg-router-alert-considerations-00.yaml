abstract:
- language: en
  script: Latn
  content: "<p>The IP Router Alert Option is an IP option that alerts transit routers
    to more closely examine the contents of an IP packet.  RSVP, PGM and IGMP are
    some of the protocols which make use of the IP Router Alert option.  This document
    discusses security aspects and common practices around the use of router alert
    and discusses consequences on the use of router alert by existing or new applications.
    \ Common practices in router alert implementation facilitating router protection
    are also discussed.  Finally a possible enhancement to the current specification
    of Router Alert is presented for feedback.</p>"
