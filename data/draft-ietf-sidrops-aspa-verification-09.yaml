abstract:
- language: en
  script: Latn
  content: "<p>This document defines the semantics of an Autonomous System Provider
    Authorization object in the Resource Public Key Infrastructure to verify the AS_PATH
    attribute of routes advertised in the Border Gateway Protocol. This AS_PATH verification
    is primarily intended for detection and mitigation of route leaks. It also provides
    protection against forged-origin prefix hijacks.</p>"
