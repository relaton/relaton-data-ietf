- language: en
  script: Latn
  content: "<p>This document introduces Precision Network Slicing Management problems
    and their context. It represents an initial review of the Management of Network
    Slicing problem statement derived from the analysis of the technical gaps in IETF
    protocols ecosystem. It complements and brings together the efforts being carried
    out in several other IETF working groups covering certain aspects of Network Slicing
    management functions and operations.</p>"
