abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the Path Computation Element Communication
    Protocol (PCEP) to support the computation of paths for native IP traffic. The
    proposed extensions enable a Path Computation Element (PCE) to calculate and manage
    paths via Path Computation Client (PCC)for native IP networks, enhancing the capabilities
    of PCEP beyond traditional MPLS and GMPLS networks. By introducing new PCEP objects
    and procedures, this document allows for the efficient use of IP network resources
    and supports the deployment of traffic engineering in native IP environments.</p>"
