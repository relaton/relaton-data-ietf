- language: en
  script: Latn
  content: <p>Technologies such as Transport Layer Security (TLS) and IPsec enable
    a secure connection between two entities (a "client" and a "server") using X.509
    certificates.  This document specifies recommended procedures for checking the
    identity of the server in such an interaction.</p>
