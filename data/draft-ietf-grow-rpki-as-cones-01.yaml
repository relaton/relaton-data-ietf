abstract:
- language: en
  script: Latn
  content: "<p>This document describes a way to define groups of Autonomous System
    numbers in RPKI [RFC6480]. We call them AS-Cones. AS-Cones provide a mechanism
    to be used by operators for filtering BGP-4 [RFC4271] announcements.</p>"
