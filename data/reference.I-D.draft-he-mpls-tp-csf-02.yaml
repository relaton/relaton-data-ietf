- language: en
  script: Latn
  content: "<p>This document describes a Multi-Protocol Label Switching Transport
    Profile (MPLS-TP) Operations, Administration and Maintenance (OAM) tool to propagate
    a client failure indication across an MPLS-TP network in case the propagation
    of failure status in the client layer is not supported.</p>"
