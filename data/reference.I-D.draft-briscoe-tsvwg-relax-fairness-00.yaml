abstract:
- language: en
  script: Latn
  content: "<p>Nowadays resource sharing on the Internet is largely a result of what
    applications, users and operators do at run-time, rather than what the IETF designs
    into transport protocols at design-time.  The IETF now needs to recognise this
    trend and consider how to allow resource sharing to be properly controlled at
    run-time.</p>"
