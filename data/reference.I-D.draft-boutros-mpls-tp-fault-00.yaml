abstract:
- language: en
  script: Latn
  content: "<p>This draft specifies a fault management mechanism for MPLS Transport
    Profile(MPLS-TP) Label Switched Path (LSP). The proposed mechanism is based on
    a generic way of notifying a Maintenance End Point (MEP) or Maintenance Intermediate
    Point (MIP) of a fault on an MPLS-TP LSP using new type of MPLS Operation, Administration,
    and Maintenance (OAM) messages.</p>"
