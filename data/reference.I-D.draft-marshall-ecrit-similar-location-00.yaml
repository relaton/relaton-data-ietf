abstract:
- language: en
  script: Latn
  content: <p>This document introduces a new way to return similar civic locations
    (i.e., address sets) when original input location is returned not valid within
    the findServiceResponse message.  This document defines a new extension to the
    findServiceResponse message within the LoST protocol [RFC5222], that enables the
    LoST protocol to return one or more suggested sets of civic location information.  This
    "similar" address information is included as compilation of ca type xml elements
    within the existing response message structure.</p>
