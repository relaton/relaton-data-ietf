abstract:
- language: en
  script: Latn
  content: "<p>The Resource Public Key Infrastructure (RPKI) provides globally\n   verifiable signed routing security data, such as Route Origin\n   Authorizations (ROAs).  Operators also commonly use local or\n   supplemental data sources, including SLURM files, operator-maintained\n   exceptions, IRR-derived inputs, and other operator-selected\n   supplemental data, to improve local routing decisions.  These sources\n   may not have the same authority as signed RPKI objects and therefore\n   may require operator-configured priority-safe handling.\n\n   This document describes a framework for RPKI-based validation with\n   prioritized resource data.  It defines priority-safe handling\n   semantics that allow operators to use data sources with different\n   levels of authority or assurance for local routing policy, while\n   preserving the global authorization semantics of signed RPKI data.\n   The document also discusses deployment models with different\n   implementation costs and operational trade-offs.</p>"
