abstract:
- language: en
  script: Latn
  content: "<p>This document specifies using packets' source addresses in route\n   lookups as additional qualifier to be used in hop-by-hop routing\n   decisions.  The proposed mechanism applies to IPv6 [RFC8200] in\n   general with specific considerations for routing protocols.</p>"
