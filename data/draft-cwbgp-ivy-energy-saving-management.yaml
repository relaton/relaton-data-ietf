  script: Latn
  content: "<p>This document defines a YANG module for power and energy management.\n   The document covers both device and network levels.\n\nDiscussion Venues\n\n   This note is to be removed before publishing as an RFC.\n\n   Discussion of this document takes place on the Network Inventory YANG\n   Working Group mailing list (inventory-yang@ietf.org), which is\n   archived at https://mailarchive.ietf.org/arch/browse/inventory-yang/.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/boucadair/draft-cwbgp-energy-saving-management.</p>"
