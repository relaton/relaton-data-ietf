abstract:
- language: en
  script: Latn
  content: <p>This document describes a mechanism to add origin authentication, message
    integrity, replay resistance, message sequencing, and detection of missing messages
    to the transmitted syslog messages. This specification is intended to be used
    in conjunction with the work defined in RFC 5424, "The Syslog Protocol". [STANDARDS-TRACK]</p>
