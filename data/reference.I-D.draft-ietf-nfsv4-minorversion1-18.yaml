abstract:
- language: en
  script: Latn
  content: '<p>This Internet-Draft describes NFS version 4 minor version one, including
    features retained from the base protocol and protocol extensions made subsequently.
    Major extensions introduced in NFS version 4 minor version one include: Sessions,
    Directory Delegations, and parallel NFS (pNFS).Requirements Language The key words
    "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT",
    "RECOMMENDED", "MAY", and "OPTIONAL" in this document are to be interpreted as
    described in RFC 2119 [1].</p>'
