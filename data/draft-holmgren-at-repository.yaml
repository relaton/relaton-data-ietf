abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a repository data structure for storage and\n   transfer of public user data records as part of the Authenticated\n   Transfer Protocol (ATP).  It describes encoding formats for both\n   individual data records and entire repositories.  The repository data\n   structure is content-addressable and cryptographically authenticated.</p>"
