abstract:
- language: en
  script: Latn
  content: "<p>A PCE can be either stateful or stateless.  The information carried
    in stateful PCE are more detailed than that of stateless PCE.  With the state
    capability of PCEs, the PCCs may make advanced and informed choices about the
    PCEs to use.  This draft focus on stateful PCE, describes the applicability of
    stateful PCE and gives the IGP and PCEP extensions to support stateful PCE.</p>"
