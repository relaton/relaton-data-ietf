abstract:
- language: en
  script: Latn
  content: <p>This document describes a method for expressing DNS response policy
    inside a specially constructed DNS zone, and for processing the contents of such
    response policy zones (RPZ) inside recursive name servers.  These "DNS Firewalls"
    are widely used in fighting Internet crime and abuse.</p>
