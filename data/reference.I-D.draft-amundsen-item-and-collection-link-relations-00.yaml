abstract:
- language: en
  script: Latn
  content: "<p>RFC 5988 [RFC5988] defined the way of indicating resources on the Web.
    This specification defines a pair of reciprocal link relation types that may be
    used to express the relationship between a collection and its members.  Editorial
    Note (To be removed by RFC Editor)  Distribution of this document is unlimited.
