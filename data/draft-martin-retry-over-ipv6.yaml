id: draftmartinretryoveripv6
schema_version: v1.5.6
formattedref:
  content: draft-martin-retry-over-ipv6
title:
- language: en
  script: Latn
  content: HTTP Signaling of Planned IPv4 Unavailability
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-martin-retry-over-ipv6-04
docidentifier:
- content: draft-martin-retry-over-ipv6
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-07-28'
abstract:
- language: en
  script: Latn
  content: "<p>As operators transition services to IPv6-only, planned IPv4 outages\n   help identify remaining dependencies before permanent decommission.\n   Such outages must be measurable, reversible, and understandable to\n   end users.  This document defines HTTP signaling for an intentional,\n   often time-bounded IPv4 outage: the existing 503 Service Unavailable\n   status code together with the mandatory Retry-Over-IPv6 response\n   header field (and optional related fields) that instruct aware\n   clients to retry over IPv6 after closing the IPv4 connection, and\n   allow clients to confirm successful IPv6 recovery via an optional\n   correlation token so operators can distinguish soft failures from\n   hard failures in centralized logs.  Machine-readable response bodies\n   MAY use Problem Details (RFC 9457) with a registered problem type\n   URI.  The mechanism supports staged enterprise rollouts, internal\n   HTTP services, and permanent IPv6-only migration; coordinated public\n   events (for example, 6/6 drills) remain possible with advance notice.\n   The primary intended deployment is operator-controlled environments\n   where provider and users share operational responsibility.  Legacy\n   clients that do not implement this specification treat the response\n   as ordinary service unavailability and MAY use the response body for\n   human-readable guidance.</p>"
