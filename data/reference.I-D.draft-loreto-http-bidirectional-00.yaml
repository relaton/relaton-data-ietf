abstract:
- language: en
  script: Latn
  content: <p>There is widespread interest in using the Hypertext Transfer Protocol
    (HTTP) to enable asynchronous or server-initiated communication from a server
    to a client as well as from a client to a server.  This document describes how
    to better use HTTP, as it exists today, to enable such "bidirectional HTTP" using
    "long polling" and "HTTP streaming" mechanisms.</p>
