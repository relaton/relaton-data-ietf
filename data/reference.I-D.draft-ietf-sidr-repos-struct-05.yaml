abstract:
- language: en
  script: Latn
  content: "<p>This document defines a profile for the structure of repository publication
    points that contain X.509 / PKIX Resource Certificates, Certificate Revocation
    Lists and signed objects.  This profile contains the proposed object naming scheme,
    the contents of repository publication points, and a suggested internal structure
    of a local repository cache that is intended to facilitate synchronisation across
    a distributed collection of repository publication points and facilitate certification
    path construction.</p>"
