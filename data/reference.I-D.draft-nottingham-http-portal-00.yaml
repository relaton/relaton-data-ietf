abstract:
- language: en
  script: Latn
  content: <p>"Captive portals" are a commonly-deployed means of obtaining access
    credentials and/or payment for a network.  This memo discusses issues of their
    use for HTTP applications, and proposes one possible mitigation strategy.  This
    memo should be discussed on the ietf-http-wg@w3.org mailing list, although it
    is not a work item of the HTTPbis WG.</p>
