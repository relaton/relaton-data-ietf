abstract:
- language: en
  script: Latn
  content: "<p>Mobility of an IP-based node affects routing paths, and as a result,
    can have a dramatic effect on protocol operation and state management. This draft
    discusses the effects mobility can cause to the NSIS protocols, and how the protocols
    operate in different scenarios, and together with mobility management protocols.</p>"
