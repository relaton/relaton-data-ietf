abstract:
- language: en
  script: Latn
  content: "<p>The iSCSI Extensions for RDMA document [iSER] currently specifies \n
    \  the RDMA data transfer capability for [iSCSI] over iWARP.  This \n   document
    generalizes the iSER document to permit it to be used with \n   other RDMA capable
    protocols such as InfiniBand.</p>"
