abstract:
- language: en
  script: Latn
  content: |-
    <p>This document maps the concept of Direct Anonymous Attestation (DAA)
       to the Remote Attestation Procedures (RATS) Architecture.  The
       protocol entity DAA Issuer is introduced and its mapping with
       existing RATS roles in DAA protocol steps is specified.</p>
