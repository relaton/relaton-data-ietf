abstract:
- language: en
  script: Latn
  content: "<p>This document defines two Dynamic Host Configuration Protocol for IPv4
    [RFC2131] options that allow servers to assign port restricted IPv4 addresses
    to clients. Port restriction may be necessary in cases when one public IPv4 address
    is assigned to multiple clients because of scarcity of the available IPv4 addresses.</p>"
