abstract:
- language: en
  script: Latn
  content: |-
    <p>This document discusses issues that arise when RTP sessions span
       Coordinated Universal Time (UTC) leap seconds.  It updates RFC 3550
       to describe how RTP senders and receivers should behave in the
       presence of leap seconds.</p>
