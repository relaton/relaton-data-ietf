abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an architectural framework for the application
    of MPLS in transport networks.  It describes a profile of MPLS that enables operational
    models typical in transport networks , while providing additional OAM, survivability
    and other maintenance functions not currently supported by MPLS.</p>"
