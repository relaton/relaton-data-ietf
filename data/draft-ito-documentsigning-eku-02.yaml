abstract:
- language: en
  script: Latn
  content: |-
    <p>[RFC5280] specifies several extended key usages for X.509
       certificates.  This document defines a general purpose document
       signing extended key usage for X.509 public key certificates which
       restricts the usage of the certificates for document signing.</p>
