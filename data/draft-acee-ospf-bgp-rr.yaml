abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an OSPF Router Information (RI) TLV to advertise
    the BGP Router Reflector capability and peering information. This information
    can be used by BGP Router Reflector clients to dynamically learn and establish
    sessions with BGP Router Reflectors in the routing domain.</p>"
