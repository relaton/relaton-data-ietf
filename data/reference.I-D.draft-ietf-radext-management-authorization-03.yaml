abstract:
- language: en
  script: Latn
  content: "<p>This document describes Remote Authentication Dial-In User Service
    (RADIUS) attributes for the authorization and service provisioning of Network
    Access Servers (NASes).  Both local and remote management are supported, with
    granular access rights and management privileges. Specific provisions are made
    for remote management via framed management protocols, and for specification of
    a protected transport protocol.</p>"
