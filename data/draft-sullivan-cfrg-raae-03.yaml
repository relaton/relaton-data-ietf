abstract:
- language: en
  script: Latn
  content: "<p>This document defines random-access authenticated encryption (raAE),
    a primitive that partitions a message into an indexed sequence of segments that
    can be encrypted and decrypted independently and in any order. It also specifies
    SEAL (Segmented Encryption and Authentication Layer), a parameterized construction
    that defines a family of concrete raAE instantiations, one for each valid choice
    of an Authenticated Encryption with Associated Data (AEAD) algorithm, a key derivation
    function (KDF), and associated parameters. SEAL supports immutable (write-once),
    append-only, and mutable (in- place ciphertext rewrite) operations, each with
    per-segment authentication. A separately configured snapshot authenticator can
    additionally authenticate the complete, indexed segment set. The document also
    defines the security notions of raAE, specifies the requirements for conforming
    constructions, and analyzes SEAL against those requirements. Concrete cipher suites,
    serialization layouts, and test vectors for SEAL are specified in a companion
    document.</p>"
