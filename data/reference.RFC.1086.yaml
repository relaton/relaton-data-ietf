abstract:
- language: en
  script: Latn
  content: "<p>This memo proposes a standard for the Internet community.  Hosts on
    the Internet that choose to implement ISO TP0 transport connectivity between TCP
    and X.25 based hosts are expected to experiment with this proposal. TCP port 146
    is reserved for this proposal.</p>"
