abstract:
- language: en
  script: Latn
  content: "<p>iSCSI is a proposed transport protocol for SCSI that operates on top
    of TCP. This memo describes a standard mechanism to enable clients to bootstrap
    themselves using the iSCSI protocol. The goal of this standard is to enable iSCSI
    boot clients to obtain the information to open an iSCSI session with the iSCSI
    boot server.</p>"
