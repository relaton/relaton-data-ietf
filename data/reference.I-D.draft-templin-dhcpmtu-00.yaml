abstract:
- language: en
  script: Latn
  content: "<p>IP fragmentation has been shown to be problematic through operational
    experience and through studies conducted over the course of many years.  Some
    transports (e.g., TCP) have the ability to adjust their message sizes to avoid
    IP fragmentation, however no such capability is built into the UDP transport.
    \ UDP applications must therefore have a means to perform their own fragmentation
    and reassembly prior to submitting their data to UDP/IP.  This document specifies
    a fragmentation/reassembly capability for DHCP.</p>"
