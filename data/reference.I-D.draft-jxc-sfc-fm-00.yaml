abstract:
- language: en
  script: Latn
  content: "<p>SFC provides a flexible and agile approach to service innovation, but
    whether the SFC path is constructed as expected, whether the chaining is functioning
    correctly still needs to be verified. This document discusses fault management
    requirements in SFC and provides a fault management solution for service function
    chaining.</p>"
