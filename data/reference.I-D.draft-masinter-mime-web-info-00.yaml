abstract:
- language: en
  script: Latn
  content: "<p>This document describes some of the ways in which parts of the MIME
    system, originally designed for electronic mail, have been used in the web, and
    some of the ways in which those uses have resulted in difficulties.  This informational
    document is intended as background and justification for a companion Best Current
    Practice which makes some changes to the registry of Internet Media Types and
    other specifications and practices, in order to facilitate Web application design
    and standardization.</p>"
