abstract:
- language: en
  script: Latn
  content: "<p>To keep the information of topology and links resource synchronized
    at each control node, massive messages are necessary to be flooded in the control
    plane of General Multi-Protocol Label Switching (GMPLS) based multi-domain networks.
    \ The convergence time of information flooding will have a significant impact
    on the performance of the networks.  So measuring and analyzing the convergence
    time of information flooding in multi-domains becomes very important.  A performance
    metric of convergence time of information flooding is proposed to characterize
    the ability of information synchronization in multi-domain networks.</p>"
