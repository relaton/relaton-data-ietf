abstract:
- language: en
  script: Latn
  content: "<p>Large scale DCs can provide various services and usually have a lot
    of internal and external links.  Service provisioning and network connectivity
    configuration are complex.  This draft analyzes some use cases in Distributed
    Data Centers (DDC), and the applicability of SUPA data models and platform which
    can be used for better resource usage and easy service/network configuration.</p>"
