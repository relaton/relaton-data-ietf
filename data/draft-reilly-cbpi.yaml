abstract:
- language: en
  script: Latn
  content: "<p>This document defines Cognitive Behavioral Provenance and Integrity
    (CBPI), a framework for recording, verifying, and analyzing the operant conditioning
    history of an autonomous artificial intelligence agent. Existing agent identity,
    delegation, and attestation mechanisms establish who an agent is, who authorized
    it, and what model weights it loaded. None of them record what shaped the agent's
    behavior after deployment. CBPI closes that gap by defining a tamper-evident,
    hash-linked record of the reinforcement contingencies applied to an agent, a set
    of integrity properties over that record, and a Cognitive Behavioral Analysis
    (CBA) procedure for detecting behavioral drift, unauthorized conditioning, and
    adventitious reinforcement. A formal data model is provided in CDDL. The framework
    applies the three-term contingency of behavior analysis to machine agents and
    treats reinforcement delivery as a security-relevant event requiring authorization,
    attribution, and non-repudiation.</p>"
