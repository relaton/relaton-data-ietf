abstract:
- language: en
  script: Latn
  content: "<p>This document outlines requirements for extending the BGP Monitoring
    Protocol (BMP) to provide comprehensive monitoring of RPKI-related processes on
    routers, including RPKI data acquisition, RPKI-related policy configuration, route
    validation, and the impact of validation on routing decisions. The proposed extensions
    aim to standardize router-side monitoring of RPKI within BMP, focusing specifically
    on RPKI's effect on BGP routing decisions while maintaining a clear scope boundary
    with other monitoring mechanisms such as YANG modeling and streaming telemetry
    for RPKI-to-Router (RTR) protocol operations.</p>"
