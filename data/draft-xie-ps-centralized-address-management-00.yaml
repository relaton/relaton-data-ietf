abstract:
- language: en
  script: Latn
  content: "<p>The increase in number, diversity and complexity of modern network
    devices and services bring new challenges for the management of network resources,
    such as IP addresses, bandwidth, VAS(Value Added Service) pool, etc. This draft
    contains a problem statement and defines the requirements for IP address management
    with practical use cases provided by operators.</p>"
