- language: en
  script: Latn
  content: "<p>Hosts experiencing rapid link-layer changes may require further configuration
    change detection procedures than more traditional fixed hosts. DNA is defined
    as the process by which a host collects appropriate information and detects the
    identity of its currently attached link to ascertains the validity of its IP configuration.</p>"
