abstract:
- language: en
  script: Latn
  content: "<p>A Network Resource Partition (NRP) is a network resource attribute
    associated with the SR policy. It is also an important attribute of the SR policy
    and needs to be reported to the external components. This document defines a new
    TLV which enable the headend to report the configuration and the states of an
    SR policy carrying the NRP information by using BPG-LS.</p>"
