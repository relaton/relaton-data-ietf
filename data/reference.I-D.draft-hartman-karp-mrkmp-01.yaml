abstract:
- language: en
  script: Latn
  content: "<p>Several routing protocols engage in one-to-many communication.  In
    order to authenticate these communications using symmetric cryptography, a group
    key needs to be established.  This specification defines a group protocol for
    establishing and managing such keys.</p>"
