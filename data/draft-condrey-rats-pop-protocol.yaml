abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Proof of Process (PoP) Evidence\n   Framework, a specialized profile of Remote Attestation Procedures\n   (RATS) designed to validate the provenance of effort in digital\n   authorship.  Unlike traditional provenance, which tracks file\n   custody, PoP attests to the continuous physical process of creation.\n\n   The protocol defines a cryptographic mechanism for generating\n   Evidence Packets utilizing a composite Sequential Work Function (SWF)\n   based on Proof of Biological Space-Time (PoBST) to enforce temporal\n   monotonicity and Cross-Domain Constraint Entanglement (CDCE) to bind\n   behavioral entropy (human jitter) and physical state to the document.\n   Technical specifications for wire formats, sequential work functions,\n   and hardware-anchored trust are provided.</p>"
