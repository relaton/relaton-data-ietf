abstract:
- language: en
  script: Latn
  content: "<p>The Mercurius Window System (MWS) is a zero-trust network-native, server-side
    rendering system that enables graphical sessions to be accessed remotely with
    explicit semantics for Session, Window, and rendering state. MWS allows a user
    to interact with a workstation from untrusted or resource-constrained portal devices
    (thin clients or laptops acting as Mercurius terminals) while keeping authoritative
    application, GPU, and compositor state on the workstation. The protocol defines
    a zero-trust portal model, a structured Session and Window architecture, and a
    multi-stream SCTP transport profile. It defines distinct protocol planes for control,
    rendering, input, video, and audio. Some payload encodings remain subject to refinement
    in later revisions of this Internet-Draft.</p>"
