abstract:
- language: en
  script: Latn
  content: "<p>The IPv6 interim mechanism 6to4 (RFC3056) uses automatic IPv6-over-
    IPv4 tunneling to interconnect IPv6 networks. The architecture includes 6to4 Routers
    and Relay Routers, which accept and decapsulate IPv4 protocol-41 ('IPv6-in-IPv4')
    traffic from anywhere. There aren't many constraints on the embedded IPv6 packets,
    or where IPv4 traffic will be automatically tunneled to. These could enable one
    to go around access controls, and more likely, being able to perform proxy Denial
    of Service attacks using 6to4 relays or routers as reflectors. Anyone is also
    capable of spoofing traffic from non-6to4 addresses, as if it was coming from
    a relay, to a 6to4 node. This document discusses these issues in more detail and
    tries to suggest enhancements to alleviate the problems.</p>"
