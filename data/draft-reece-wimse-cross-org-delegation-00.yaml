abstract:
- language: en
  script: Latn
  content: "<p>Autonomous software agents increasingly act on behalf of human principals
    by invoking tools, services, and other agents, frequently across organizational
    boundaries. Existing workload and token-based authorization mechanisms were designed
    for a single trust domain and a small number of delegation hops. They do not adequately
    express, constrain, or verify authority that is delegated recursively among agents
    and that crosses the boundary between independently administered organizations.
    This document describes the problem of cross-organizational agent delegation,
    identifies the gaps in current mechanisms, and enumerates requirements that any
    solution within the scope of the Workload Identity in Multi-System Environments
    (WIMSE) working group should satisfy. It does not specify a solution.</p>"
