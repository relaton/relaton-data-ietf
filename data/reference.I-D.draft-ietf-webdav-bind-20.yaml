abstract:
- language: en
  script: Latn
  content: <p>This specification defines bindings, and the BIND method for creating
    multiple bindings to the same resource.  Creating a new binding to a resource
    causes at least one new URI to be mapped to that resource. Servers are required
    to insure the integrity of any bindings that they allow to be created.  Editorial
    Note (To be removed by RFC Editor before publication)  Please send comments to
    the Distributed Authoring and Versioning (WebDAV) working group at &lt;mailto:w3c-dist-auth@w3.org&gt;,
    which may be joined by sending a message with subject "subscribe" to &lt;mailto:w3c-dist-auth-request@w3.org&gt;.  Discussions
    of the WEBDAV working group are archived at &lt;http://lists.w3.org/Archives/Public/w3c-dist-auth/&gt;.  &lt;http://www.webdav.org/bind/draft-ietf-webdav-bind-issues.html&gt;
    lists all registered issues since draft 02.</p>
