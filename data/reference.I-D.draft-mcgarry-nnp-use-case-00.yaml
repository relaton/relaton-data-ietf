abstract:
- language: en
  script: Latn
  content: "<p>A proposed solution for geographic number portability in the USA calls
    for a new non-geographic numbering resource.  This draft uses this proposal as
    a use case for a MODERN solution.  While this focuses on an effort occurring in
    the USA the concepts are applicable to any country.</p>"
