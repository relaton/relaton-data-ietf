abstract:
- language: en
  script: Latn
  content: "<p>DHCPv6 clients may use Option Request Option (ORO) to specify, which
    options they would like to get configured by DHCPv6 servers.  Clients may also
    be interested in specific options that do not appear in DHCPv6 message directly
    (top-level options), but rather as a compounds of other options (suboptions).
    \ This document defines way of using existing ORO to request for specific suboptions.</p>"
