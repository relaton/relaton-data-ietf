abstract:
- language: en
  script: Latn
  content: "<p>This document considers the new use cases for IP together with the
    network capabilities and services that will be needed to address those use cases.
    \ It then looks at the underlying packet requirements and considers the changing
    deployment models and the issues with existing packet designs that need to be
    addressed.  It concludes by looking at some parameters of a solution.</p>"
