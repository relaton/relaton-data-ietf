abstract:
- language: en
  script: Latn
  content: "<p>Pingback Permitted From (PPF) defines a DNS-based mechanism for authorizing
    senders of linkback requests. A domain owner publishes a TXT record declaring
    which hosts are permitted to send linkbacks for source URIs on that domain. Receivers
    and linkback proxies can then reject unauthorized linkbacks before fetching the
    claimed source URI. PPF is intended for linkback protocols in which a sender claims
    that one web resource links to another and the receiver would otherwise fetch
    the claimed source resource to verify that claim. PPF provides sender authorization;
    it does not replace content verification, moderation, or abuse filtering.</p>"
