abstract:
- language: en
  script: Latn
  content: "<p>There is increasing need for application endpoints to exchange rich
    information with devices in the network and secure that information from on-path
    observers. This document presents some current problems and the broad strokes
    of potential solutions. Discussion Venues This note is to be removed before publishing
    as an RFC. Source for this draft and an issue tracker can be found at https://github.com/mjoras/sadcdn.</p>"
