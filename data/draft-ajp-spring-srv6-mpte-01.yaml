abstract:
- language: en
  script: Latn
  content: "<p>A Multipath Traffic Engineered Directed Acyclic Graph (MPTED) tunnel
    is a Traffic Engineering (TE) construct that enables weighted load balancing of
    unicast traffic across a constrained set of paths optimized for an objective.
    This document is informational and describes one realization approach for applying
    SRv6 semantics to MPTE, based on the Multipath Traffic Engineering as described
    in Internet-Draft (draft-kompella-teas- mpte). It summarizes associated procedures,
    lifecycle, management, and forwarding behavior. This document applies existing
    SRv6 architecture and semantics to MPTE without defining new SRv6 Endpoint Behaviors
    or signaling protocols. It focuses on data-plane realization using existing forwarding
    instructions.</p>"
