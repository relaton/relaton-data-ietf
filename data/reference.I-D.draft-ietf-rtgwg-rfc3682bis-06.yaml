abstract:
- language: en
  script: Latn
  content: "<p>The use of a packet's Time to Live (TTL) (IPv4) or Hop Limit (IPv6)
    to verify whether the packet originated within the same link has been used in
    many recent protocols. This document generalizes this technique. This document
    obsoletes RFC 3682.</p>"
