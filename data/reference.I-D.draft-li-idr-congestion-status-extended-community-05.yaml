abstract:
- language: en
  script: Latn
  content: "<p>A new extended community, called congestion status extended community,
    is introduced in this document to carry the link congestion status, especially
    for the exit link of one AS. Congestion status extended community can be used
    by the BGP speakers to steer the AS-outgoing traffic among the exit links.</p>"
