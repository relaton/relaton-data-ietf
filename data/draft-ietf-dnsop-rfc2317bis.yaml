abstract:
- language: en
  script: Latn
  content: "<p>This memo describes how to do IN-ADDR.ARPA delegation on any non- octet
    boundary, and how to consolidate reverse DNS for multiple address blocks into
    one zone. It obsoletes RFC 2317. It also clarifies the behaviour of dynamic reverse
    DNS UPDATE clients. It updates RFC 2136.</p>"
