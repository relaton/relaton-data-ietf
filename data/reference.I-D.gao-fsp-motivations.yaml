abstract:
- language: en
  script: Latn
  content: "<p>This document introduces the motivation to design the Flexible Session
    Protocol which supports mobility and multihoming at the transport layer. FSP is
    to avoid the routing scalability problem in the IPv6 internetwork.  The document
    serves to explain choices of design goals of FSP as well.</p>"
