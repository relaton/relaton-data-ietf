  content: "<p>This memo introduces a content coding for HTTP that allows message
    payloads to be encrypted. Note to Readers Discussion of this draft takes place
    on the HTTP working group mailing list (ietf-http-wg@w3.org), which is archived
    at https://lists.w3.org/Archives/Public/ietf-http-wg/. Working Group information
    can be found at http://httpwg.github.io/; source code and issues list for this
    draft can be found at https://github.com/httpwg/http-extensions/labels/encryption.</p>"
