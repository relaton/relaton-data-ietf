abstract:
- language: en
  script: Latn
  content: "<p>This document updates the Message Session Relay Protocol (MSRP) session
    matching procedure of MSRP endpoints.  The update extends the applicability of
    MSRP peer-to-peer communication to network scenarios where Application Layer Gateway
    (ALG) functions modify the Session Description Protcoll (SDP) MSRP address information.
    \ The update is backwards compatible.  In the absence of ALGs RFC 4975 compliant
    MSRP User Agents (UAs) can interwork with MSRP UAs compliant with this specification.
    \ In the presence of ALGs RFC 4975 compliant MSRP UAs can normally not establish
    MSRP sessions.</p>"
