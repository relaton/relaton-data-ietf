abstract:
- language: en
  script: Latn
  content: "<p>This document provides FEC Scheme specifications according to the RMT
    FEC Building Block for the Compact No-Code FEC Scheme, the Small Block, Large
    Block and Expandable FEC Scheme, the Small Block Systematic FEC Scheme and the
    Compact FEC Scheme.  This document obsoletes RFC3695 and assumes responsibility
    for the FEC Schemes defined in RFC3452.</p>"
