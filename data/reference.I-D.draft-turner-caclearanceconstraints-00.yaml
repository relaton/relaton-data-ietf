abstract:
- language: en
  script: Latn
  content: "<p>This document defines the syntax and semantics for the Clearance and
    the Certification Authority (CA) Clearance Constraints X.509 certificate extensions.
    \ The Clearance certificate extension is used to indicate the clearance held by
    the subject.  The CA Clearance Constraints certificate extension values in a Trust
    Anchor (TA) and  the CAs in a certification path constrain the effective Clearance
    of the subject of the last certificate in the certification path.</p>"
