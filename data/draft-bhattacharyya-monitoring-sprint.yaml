abstract:
- language: en
  script: Latn
  content: "<p>This document provides an overview of network measurements and monitoring
    from the perspective of Sprint Advanced Technology Labs. It starts with a detailed
    discussion of the benefits of monitoring for an ISP's backbone and the type of
    measurements required for various tasks. It describes the tools and techniques
    currently in use, and then outlines what else is needed to meet the challenges
    of monitoring an operational network.</p>"
