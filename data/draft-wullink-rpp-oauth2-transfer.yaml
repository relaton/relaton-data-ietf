abstract:
- language: en
  script: Latn
  content: "<p>This document describes how OAuth 2.0 [RFC6749] can be used to secure
    object transfers in RESTful Provisioning Protocol (RPP) [I-D.ietf-rpp-core]. It
    extends the RPP OAuth 2.0 authorization model defined in [I-D.wullink-rpp-oauth2]
    with mechanisms specific to federated object transfers.</p>"
