abstract:
- language: en
  script: Latn
  content: "<p>This document defines a standard to extend Time Stamp Tokens with Time
    Attestations recorded on Distributed Ledgers. The aim is to provide long-term
    validity to Time Stamp Tokens, backward compatible with currently available software.
    This document update RFC 3161 [RFC3161].</p>"
