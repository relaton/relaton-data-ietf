abstract:
- language: en
  script: Latn
  content: |-
    <p>QUIC in-band cryptographic negotiation on stream 0 creates a number
       of odd edge cases.  This document considers an alternative design in
       which QUIC transport is run directly over DTLS, thus separating the
       cryptographic negotiation from the transport piece.</p>
