abstract:
- language: en
  script: Latn
  content: "<p>IPv6-in-IPv4 tunnel endpoints support an MTU of 1280 bytes or larger
    via static prearrangements and/or dynamic MTU determination based on ICMPv4 messages,
    but these methods have known operational limitations. This document proposes a
    new MTU determination mechanism for IPv6-in-IPv4 tunnels that supports larger
    MTUs using a link adaptation scheme with tunnel endpoint-based segmentation/ reassembly
    and dynamic segment size probing.</p>"
