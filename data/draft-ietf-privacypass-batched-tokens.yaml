abstract:
- language: en
  script: Latn
  content: "<p>This document specifies two variants of the Privacy Pass issuance protocol
    that allow for batched issuance of tokens. These allow clients to request more
    than one token at a time and for issuers to issue more than one token at a time.</p>"
