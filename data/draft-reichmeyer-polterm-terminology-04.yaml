- language: en
  script: Latn
  content: "<p>This memo defines a common vocabulary for describing concepts and components
    related to policy management. It is intended to be used to align terminology and
    concepts in architecture and framework documents that either address policy management
    or which specify components and services that are subject to policy management.</p>"
