abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv6 signaling between the mobile node and home agent is secured
    using IPsec.  The security association between a mobile node and the home agent
    is established using IKEv1 or IKEv2.  The security model specified for Mobile
    IPv6 which relies on IKE/IPsec requires interaction between the Mobile IPv6 protocol
    part of the IP stack and the IKE/IPsec part of the IP stack.  Implementation and
    deployment concerns exist with such a security architecture.  This document proposes
    an alternate security framework which relies on the reuse of Transport Layer Security
    for securing Mobile IPv6 signaling and IP traffic between the mobile node and
    home agent.</p>"
