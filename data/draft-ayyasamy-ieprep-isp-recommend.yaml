abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this document is to express what the engineering \ncommunity
    expects of Service providers with respect to emergency \npreparedness. The document
    can be considered as a set of \nrecommendations to support mission-critical traffic
    at various \nlocations like access and core.  \nThe goal of the draft is to raise
    discussion among Internet service \nproviders (ISPs) on the importance of accommodating
    emergency \nservices across Internet.</p>"
