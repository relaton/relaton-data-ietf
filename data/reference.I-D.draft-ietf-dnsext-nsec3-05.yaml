- language: en
  script: Latn
  content: "<p>The DNS Security Extensions introduces the NSEC resource record for
    authenticated denial of existence. This document introduces a new resource record
    as an alternative to NSEC that provides measures against zone enumeration and
    allows for gradual expansion of delegation-centric zones.</p>"
