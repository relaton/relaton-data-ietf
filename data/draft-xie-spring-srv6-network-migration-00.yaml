abstract:
- language: en
  script: Latn
  content: "<p>SRv6 has significant advantages over SR-MPLS which has attracted more
    and more attentions and interests from operators and verticals. The smooth network
    migration towards SRv6 is a key focal point for the SRv6 deployers. This document
    provides network migration guidance and recommendations on solutions in various
    scenarios.</p>"
