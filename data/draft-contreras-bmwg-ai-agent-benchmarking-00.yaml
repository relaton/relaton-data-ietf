abstract:
- language: en
  script: Latn
  content: "<p>This document defines a benchmarking methodology for evaluating Artificial
    Intelligence (AI) agents performing network operations tasks such as configuration,
    troubleshooting, and optimization. This document focuses on task-oriented performance
    metrics, including task completion success, execution efficiency, and robustness
    across multi-step workflows, proposing benchmarking practices towards agent- based,
    closed-loop network operation scenarios. The proposed methodology aims to provide
    a reproducible and vendor- independent framework to compare AI agent effectiveness
    in controlled network environments.</p>"
