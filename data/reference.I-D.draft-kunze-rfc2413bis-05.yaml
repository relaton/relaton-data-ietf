abstract:
- language: en
  script: Latn
  content: "<p>The Dublin Core Metadata Workshop Series began in 1995 with an invitational
    workshop which brought together librarians, digital library researchers, content
    experts, and text-markup experts to promote better discovery standards for electronic
    resources. The resulting metadata element set is perhaps the most widely adopted
    convention for structuring resource descriptions designed to bridge networked
    information systems and content providers in the publishing, library, museum,
    scholarly, archival, and government communities. It defines fifteen metadata elements
    for resource description in a cross-disciplinary information environment.</p>"
