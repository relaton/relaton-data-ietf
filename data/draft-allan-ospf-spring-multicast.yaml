- language: en
  script: Latn
  content: |-
    <p>This document describes the OSPFv2 extensions required to support
       multicast for MPLS based Segment Routing. In this approach OSPF
       speakers compute their role in multicast tree construction based on
       the information in the OSPF routing information base.</p>
