abstract:
- language: en
  script: Latn
  content: "<p>This specification defines Link Bindings, which provide dynamic linking
    of state updates between resources, either on an endpoint or between endpoints,
    for systems using CoAP (RFC7252). This specification also defines Conditional
    Notification Attributes that work with Link Bindings or with CoAP Observe (RFC7641).
    Editor note The git repository for the draft is found at https://github.com/core-
    wg/dynlink</p>"
