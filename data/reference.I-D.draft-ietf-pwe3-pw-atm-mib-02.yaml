abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an experimental portion of the Management Information
    Base (MIB) for use with network management protocols in the Internet community.
    In particular, it describes managed objects for modeling ATM Pseudowire (PW) carrying
    ATM cells over Packet Switch Network (PSN) as defined in the PWE3 [ATMENCAP]and
    [ATMTRANS].</p>"
