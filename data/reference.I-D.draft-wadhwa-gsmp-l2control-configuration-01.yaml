abstract:
- language: en
  script: Latn
  content: "<p>This document describes proposed extensions to the GSMP protocol to
    allow its use in a broadband environment, as a control plane between Access Nodes
    (e.g. DSLAM) and Broadband Network Gateways (e.g. BRAS). This document focuses
    on specific use cases, topology discovery and line configuration. It is intended
    to be complemented by other Internet-drafts focusing on additional use cases.</p>"
