abstract:
- language: en
  script: Latn
  content: "<p>This document describes an Architectural Framework for Media Server
    Control. The primary focus will be to define logical entities that exist within
    the context of the MediaCtrl Work Group in the IETF. This document will also define
    appropriate naming conventions and interactions between the core logical entities.</p>"
