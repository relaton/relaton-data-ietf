abstract:
- language: en
  script: Latn
  content: "<p>Providing deep performance information by the networks is expected
    in many use cases. This document intends to discuss a unified presentation of
    performance, by investigating use cases that benefit from performance information,
    describing relevant requirements, and proposing a framework of how the components
    work together to enable deep performance visualization.</p>"
