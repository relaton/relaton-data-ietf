abstract:
- language: en
  script: Latn
  content: "<p>The Lightweight Directory Access Protocol (LDAP) provides a number
    of password-based mechanisms for authenticating directory users to the directory
    service. This document discusses the use of passwords in directory user authentication.
    The document specifies schema for representing a basic password policy and directory
    service enforcement of password policy.</p>"
