id: draftleiba5322updfromgroup
schema_version: v1.5.6
title:
- language: en
  script: Latn
  content: Update to Internet Message Format to Allow Group Syntax in the "From:"
    and "Sender:" Header Fields
  format: text/plain
docidentifier:
- content: draft-leiba-5322upd-from-group
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2012-12-05'
abstract:
- language: en
  script: Latn
  content: <p>The Internet Message Format (RFC 5322) allows "group" syntax in some
    email header fields, such as "To:" and "CC:", but not in "From:" or "Sender:".
    This document updates RFC 5322 to relax that restriction, allowing group syntax
    in those latter fields, as well as in "Resent-From:" and "Resent-Sender:", in
    certain situations.</p>
  format: text/html
