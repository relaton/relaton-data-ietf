- language: en
  script: Latn
  content: "<p>This document describes an extension of Extensible Provisioning Protocol
    (EPP) domain name mapping for the provisioning and management of Chinese Domain
    Names (CDNs), especially for variant CDNs. Specified in XML, this extended mapping
    is applied to provide additional features required by CDNs Registration.</p>"
