abstract:
- language: en
  script: Latn
  content: "<p>This document describes a set of network-based solutions for seamless
    Virtual Machine mobility in the data center. These solutions provide a toolkit
    which is based on IP routing, BGP/MPLS E-VPNs, BGP/MPLS IP VPNs, and NHRP.</p>"
