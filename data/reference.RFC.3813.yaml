abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community.  In particular,
    it describes managed objects to configure and/or monitor a Multiprotocol Label
    Switching (MPLS) Label Switching Router (LSR).  [STANDARDS-TRACK]</p>"
