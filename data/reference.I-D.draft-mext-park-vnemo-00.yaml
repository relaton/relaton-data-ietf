abstract:
- language: en
  script: Latn
  content: "<p>A mobile router with multiple interfaces can make connection to several
    access networks.  Using virtualization on the mobile network, several virtual
    mobile network can be exist for a single mobile network.  Multiple virtual mobile
    networks for a single mobile network can be used for service differentiation for
    mobile network nodes.</p>"
