abstract:
- language: en
  script: Latn
  content: "<p>This specification defines how to use Session Description Protocol
    (SDP) to signal that media will be transported over Datagram Transport Layer Security
    (DTLS) and it defines new SDP protocol identifiers. It reuses the syntax and semantics
    for an SDP 'fingerprint' attribute that identifies the certificate which will
    be presented for the DTLS handshake. This allows the security provided by the
    existing TCP/TLS specifications for stream transported media to also be applicable
    to media that is transported over a datagram oriented transport.</p>"
