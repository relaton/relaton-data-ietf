abstract:
- language: en
  script: Latn
  content: "<p>This document augments the notification mechanism defined in the Conference
    Event Package [2] to suit the specific needs of the Centralized Conferencing Framework
    [1] and the Data Model for Centralized Conferencing [3]. The document registers
    a new media subtype for this purpose. Support for this new data format may be
    negotiated using Accept header semantics as defined in the Session Initilization
    Protocol (SIP).</p>"
