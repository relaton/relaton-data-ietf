abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a resource set registration mechanism between
    an OAuth 2.0 authorization server and resource server.  The resource server registers
    information about the semantics and discovery properties of its resources with
    the authorization server. This revision of the specification is part of UMA V0.9.</p>"
