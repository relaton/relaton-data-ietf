abstract:
- language: en
  script: Latn
  content: "<p>The hierachical Path Computation Element (PCE) architecture defined
    in [PCE-HIERARCHY-FWK] allows the optimum sequence of domains to be selected,
    and the optimum end-to-end path to be derived through the use of a hierarchical
    relationship between domains. This document defines the Path Computation Element
    Protocol (PCEP) extensions for the purpose of implementing hierarchical PCE procedures
    which are described in [PCE-HIERARCHY-FWK].</p>"
