abstract:
- language: en
  script: Latn
  content: "<p>The document describes several use cases of peering between two or
    more service providers that provide none VOIP based collaboration services and
    presence and IM in particular. These service providers create a peering relationship
    between themselves thus enabling their users to collaborate with users on other
    communities. The target of the document is to drive requirements for peering between
    domains that provide the none VOIP based collaboration services.</p>"
