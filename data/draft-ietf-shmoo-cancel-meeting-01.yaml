- language: en
  script: Latn
  content: |-
    <p>The IETF firmly believes in the value of in-person meetings to
       discuss and undestand issues.  However, various emergencies can make
       a planned in-person meeting impossible.  This document provides
       criteria for making this judgment.</p>
