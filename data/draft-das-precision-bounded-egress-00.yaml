abstract:
- language: en
  script: Latn
  content: "<p>Precise location is increasingly valuable inference material.  Modern\n   AI systems can correlate coordinates, timestamps, movement traces,\n   device observations, public maps, telemetry, and other ordinary data\n   to infer sensitive facilities, routines, relationships, or strategic\n   patterns even when no single record explicitly contains the inferred\n   fact.\n\n   This document defines a precision-bounded data-egress execution-\n   finality profile.  Local access to precise data is separated from\n   authority to disclose that data.  A proposed release is represented\n   as a Candidate Act and maintained in a Non-Effective State while a\n   Protected Enforcement Domain evaluates purpose, requesting\n   application or component, recipient, destination, jurisdiction,\n   required precision, policy and revocation state, cumulative\n   disclosure state, and intended egress sink.\n\n   The egress Finality Sink independently verifies scoped non-bearer\n   finality authority immediately before release.  The permitted result\n   may be exact data, a coarse or regional representation, a delayed or\n   randomized representation, or denial.  The core rule is: data access\n   is not data-export authority, and precise GPS access is not precise\n   GPS-release authority.\n\n   This revision also defines a concrete JSON-based interoperability\n   profile for Location Release Candidate Acts, precision-bounded policy\n   decisions, egress finality authority, and sink-side verification of\n   the actual outbound payload.</p>"
