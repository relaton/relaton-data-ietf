- language: en
  script: Latn
  content: "<p>This document describes how to use the Hypertext Transfer Protocol,
    http, for communication across delay- and disruption-tolerant networks. http is
    well-known and simpler to deploy in these networks than custom specialised alternatives
    such as the Bundle Protocol.</p>"
