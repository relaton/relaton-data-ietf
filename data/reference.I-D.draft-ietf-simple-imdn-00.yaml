abstract:
- language: en
  script: Latn
  content: "<p>Instant Messaging (IM) refers to the transfer of messages between users
    in real-time. This document extends Message/CPIM message format to enable endpoints
    to request, create and send IM Disposition Notifications (IMDN), including delivery
    and read notifications, for page-mode as well as session mode instant messages.
    This document also describes how SIP and MSRP entities behave using this extension.</p>"
