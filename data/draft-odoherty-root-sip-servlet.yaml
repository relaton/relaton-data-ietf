- language: en
  script: Latn
  content: "<p>This Internet draft builds on and refines the SIP Servlet API defined
    in [3]. The SIP Servlet API defines an API for SIP Clients that allows them, via
    a SIP Servlet engine, present messages to 'Servlets' which can then interact with
    the message and the Client to change the behavior of the CIP Client.</p>"
