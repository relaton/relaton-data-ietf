- language: en
  script: Latn
  content: "<p>This document describes the implementation of a transition 'toolbox'
    which intelligently choses between usage of application proxies, translation and
    tunneling depending on the deployment scenario. This document does not attempt
    to solve NA(P)T-PT related issues, though it does deal with certain issues.</p>"
