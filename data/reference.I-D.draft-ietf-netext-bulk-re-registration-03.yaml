abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 specification requires the Mobile Access Gateway
    (MAG) to send a separate Proxy Binding Update (PBU) message to the Local Mobility
    Agent (LMA) for each mobile node (MN) to renew the MN's mobility binding.  This
    document defines an optimization to the re-registration and revocation processes
    in Proxy Mobile IPv6 in addition to specifying a new Mobility Option for carrying
    group affiliation of a Mobile Node in the signaling messages between the mobility
    enabler entities.</p>"
