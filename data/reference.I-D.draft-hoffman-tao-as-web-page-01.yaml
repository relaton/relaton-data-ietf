abstract:
- language: en
  script: Latn
  content: <p>Discussion of the "Tao of the IETF" during 2012 made it clear that many
    people want the document published only as a web page, not as an RFC that needs
    to be periodically updated.  This document specifies how the Tao will be published
    as a web page.</p>
