abstract:
- language: en
  script: Latn
  content: "<p>This document presents some recommendations for firewall vendors to\n   help them implement their firewalls in a way that allows Mobile IPv6\n   and DSMIPv6 signaling and data messages to pass through.  This\n   document describes how to implement stateful packet filtering\n   capability for MIPv6 and DSMIPv6.</p>"
