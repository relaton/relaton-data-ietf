abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the Saki Agent Secure Stream (SASS) protocol,
       version 1.4.  SASS is an application-layer overlay protocol for
       authenticated remote command execution, streaming process I/O, and
       binary file transfer between trusted agents.

       To ensure strict self-containment and compatibility with IETF
       standard specifications, SASS defines a decoupled "Control-Transport
       Decoupling" architecture.  The SASS Core defines an abstract SASS
       Abstract Messaging Model (SAMM) utilizing standard CBOR (RFC 8949)
       and JSON as baseline serializations.

       Following the precedent of TLS 1.0 (RFC 2246) inheriting and refining
       SSL 3.0, SASS v1.4 formalizes its security evolution through four
       major incremental milestones: Active Threat Defense (v1.1), Forward-
       Secure Audit Hash Chains (v1.2), modular Control-Transport Decoupling
       (v1.3) incorporating tls-exporter Channel Binding (RFC 9266) and
       Zero-Allocation Tarpit streams, and Total Response Mapping (v1.4)
       with 6-Response state machine convergence and Safety Gradient loss
       bounding.

       SASS v1.4 achieves the MAS (Martingale Almost-Surely Superior)
       milestone: a comparative claim between protocol versions based on
       Second-order Stochastic Dominance (SSD).  Each version iteration
       eliminates specific behavioral branches from the agent probability
       space while maintaining expected loss, yielding strict SSD
       improvement.</p>
