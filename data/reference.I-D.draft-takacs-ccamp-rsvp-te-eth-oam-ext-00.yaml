abstract:
- language: en
  script: Latn
  content: "<p>The GMPLS controlled Ethernet Label Switching (GELS) work is extending
    GMPLS RSVP-TE to support the establishment of Ethernet LSPs.  Ethernet Connectivity
    Fault Management (CFM) specifies an adjunct OAM flow to check connectivity in
    Ethernet networks.  CFM can be also used with Ethernet LSPs for fault detection
    and triggering recovery mechanisms.  This memo proposes experimental extensions
    to GMPLS RSVP-TE to support the setup of the associated CFM OAM entities for point-to-point
    bidirectional Ethernet LSPs.  Note that the extensions defined may be applicable
    to other fault detection mechanisms that use periodic Hello messages, e.g., BFD,
    as well.  Subsequent versions of the ID will consider the possibility of general
    OAM extensions not limiting the applicability to Ethernet OAM.</p>"
