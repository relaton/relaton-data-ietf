  script: Latn
  content: <p>This document defines the "Carbon-Emissions-Scope-2" HTTP response header
    field for reporting the amount of carbon emissions associated with processing
    a given HTTP request, as calculated according to the Scope 2 protocol outlined
    in ISO 14064-1:2006.</p>
