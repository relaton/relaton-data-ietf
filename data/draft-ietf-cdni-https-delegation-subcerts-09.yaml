abstract:
- language: en
  script: Latn
  content: "<p>The delivery of content over HTTPS involving multiple CDNs raises credential
    management issues. This document defines metadata in the CDNI Control and Metadata
    interface to setup HTTPS delegation using delegated credentials from an Upstream
    CDN (uCDN) to a Downstream CDN (dCDN).</p>"
