abstract:
- language: en
  script: Latn
  content: <p>This specification augments "Multiprotocol Extensions for BGP-4" [MP-
    BGP] by proposing a mechanism to allow multiple sessions to be used between a
    given pair of BGP speakers. Each session is used to transport routes for one or
    more AFI/SAFI. This provides an alternative to the current [MP-BGP] approach of
    multiplexing routes for all AFI/SAFI onto a single connection. Use of this approach
    is expected to increase the robustness of the BGP protocol as it is used to support
    more and more diverse AFI/SAFI.</p>
