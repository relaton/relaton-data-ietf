abstract:
- language: en
  script: Latn
  content: "<p>For hosts with multiple interfaces, the problem is how to make it run
    several applications simultaneously on variant interfaces such as GPRS, Wifi etc.
    To achieve this, one key issue here is to select appropriate route according to
    RFC 1122. The approach presented in this document is extending DHCPv6 option to
    configure route tables of the hosts.</p>"
