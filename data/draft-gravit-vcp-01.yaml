abstract:
- language: en
  script: Latn
  content: "<p>Verifiable Convergence Protocol (VCP) defines minimal data types and
    APIs for autonomous agents and human-machine systems to achieve epistemic convergence
    without centralized truth arbiters. VCP is transport-agnostic, blockchain-agnostic,
    and model-agnostic. This document defines a formal cost model where C_validation
    is the cost to verify a Claim's provenance and signatures, and C_manipulation
    is the cost to forge a quorum of attestations under GQRVP. The protocol enforces
    the invariant C_manipulation &gt; C_validation for all accepted Claims. This revision
    addresses derivation of security parameters and empirical validation methodology.</p>"
