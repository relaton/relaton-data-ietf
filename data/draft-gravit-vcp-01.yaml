abstract:
- language: en
  script: Latn
  content: "<p>Verifiable Convergence Protocol (VCP) defines minimal data types and\n   APIs for autonomous agents and human-machine systems to achieve\n   epistemic convergence without centralized truth arbiters.  VCP is\n   transport-agnostic, blockchain-agnostic, and model-agnostic.  This\n   document defines a formal cost model where C_validation is the cost\n   to verify a Claim's provenance and signatures, and C_manipulation is\n   the cost to forge a quorum of attestations under GQRVP.  The protocol\n   enforces the invariant C_manipulation &gt; C_validation for all accepted\n   Claims.  This revision addresses derivation of security parameters\n   and empirical validation methodology.</p>"
