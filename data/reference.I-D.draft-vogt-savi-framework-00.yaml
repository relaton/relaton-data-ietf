abstract:
- language: en
  script: Latn
  content: "<p>The Source Address Validation Improvement protocol was developed to
    complement ingress filtering with finer-grained IP source address validation.
    \ To enable the deployment of the SAVI protocol in networks of various kinds,
    the protocol was designed to be modular and extensible.  This document describes
    and motivates this design, explains how protocol components fit into this framework,
    and compares the properties of existing protocol components.</p>"
