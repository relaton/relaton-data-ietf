abstract:
- language: en
  script: Latn
  content: <p>Within the Domain Name System, several names have been reserved or used
    for special purposes, some at the top level and some at other levels.  RFC 2606
    identified An IANA registry of Reserved and Special Names is established to reduce
    the likelihood of conflict of names and the consequent ambiguity.  This specification
    establishes that registry.  Status of this Memo  This Internet-Draft is submitted
    to IETF in full conformance with the provisions of BCP 78 and BCP 79.  Internet-Drafts
    are working documents of the Internet Engineering Task Force (IETF), its areas,
    and its working groups.  Note that other groups may also distribute working documents
