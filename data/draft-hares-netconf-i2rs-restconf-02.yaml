abstract:
- language: en
  script: Latn
  content: "<p>This document describes two RESTCONF optional capabilities (i2rs- control
    plane capability, ephemeral state capabilities) that are needed to support the
    I2RS protocol needs. The purpose of this draft is to kick-start the discussions
    with I2RS Working Group and NETCONF WG on these two capabilities.</p>"
