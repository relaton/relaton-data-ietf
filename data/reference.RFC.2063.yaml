abstract:
- language: en
  script: Latn
  content: "<p>This document describes an architecture for the measurement and reporting
    of network traffic flows, discusses how this relates to an overall network traffic
    flow architecture, and describes how it can be used within the Internet.  This
    memo defines an Experimental Protocol for the Internet community.</p>"
