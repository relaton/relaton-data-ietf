abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo proposes an application-specific identifier for use with
       the TLS and DTLS protocols.  It defines a TLS extension to allow an
       arbitrary identifier to be specified in the Client Hello, which can
       be used for application-specific routing purposes.</p>
