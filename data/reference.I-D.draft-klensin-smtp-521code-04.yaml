abstract:
- language: en
  script: Latn
  content: "<p>This memo defines two Simple Mail Transfer Protocol (SMTP) reply code,
    521 and 556.  The 521 code was originally described in an Experimental RFC in
    1995 and is in wide use, but has not previously been formally incorporated into
    SMTP.  The 556 code was created for RFC-nullMX.  These codes are used to indicate
    that an Internet host does not accept incoming mail at all (not just under particular
    circumstances).</p>"
