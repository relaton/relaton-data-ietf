abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes the requirements generated by ETSI to support
    NGN simulation services implemented with SIP. The document analyzes standard solutions
    that can meet the requirements. Where a standard solution is not available, the
    document proposes one or more solutions. The aim is to provoke discussion within
    the Internet community and get early feedback.</p>"
