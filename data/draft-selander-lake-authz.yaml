abstract:
- language: en
  script: Latn
  content: "<p>This document describes a procedure for authorizing enrollment of new
    devices using the lightweight authenticated key exchange protocol Ephemeral Diffie-Hellman
    Over COSE (EDHOC). The procedure is applicable to zero-touch onboarding of new
    devices to a constrained network leveraging trust anchors installed at manufacture
    time.</p>"
