- language: en
  script: Latn
  content: "<p>In this document we give guidelines for writing Internet Drafts in
    order to facilitate their security analysis. By 'security analysis' we mean, not
    only informal analyses, but formal analyses using automated tools, and mathematical
    analysis of the cryptographic protocols used in an Internet Draft.</p>"
