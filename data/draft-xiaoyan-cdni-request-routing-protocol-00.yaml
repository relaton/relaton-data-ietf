abstract:
- language: en
  script: Latn
  content: "<p>The Request Routing Protocol allows the Request Routing system in interconnected
    Content Delivery Network(CDNs) to communicate to ensure that an end user request
    can be (re)directed from an upstream CDN to a surrogate in the downstream CDN.
    This document describes the details of the protocol used to provide this mechanism.</p>"
