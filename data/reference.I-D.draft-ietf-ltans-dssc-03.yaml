abstract:
- language: en
  script: Latn
  content: "<p>In many application areas it must be possible to prove the existence
    and integrity of digital signed data.  This proof depends on the security suitability
    of the used cryptographic algorithms.  Because algorithms can become weak over
    the years, it is necessary to periodically evaluate these security suitabilities.
    \ When signing or verifying data, these evaluations must be considered.  This
    document specifies a data structure for security suitabilities of cryptographic
    algorithms which may be automatically interpreted.</p>"
