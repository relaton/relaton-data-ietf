abstract:
- language: en
  script: Latn
  content: "<p>This document provides an architecture for the incident management
    system and related function interface requirements. This document also defines
    a YANG module to support the incident lifecycle management. This YANG module is
    meant to provide a standard way to report, diagnose, and resolve incidents for
    the sake of enhanced network services.</p>"
