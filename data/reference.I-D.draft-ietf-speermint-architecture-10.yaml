abstract:
- language: en
  script: Latn
  content: "<p>This document defines a peering architecture for the Session Initation
    Protocol (SIP) [RFC3261], it's functional components and interfaces.  It also
    describes the steps necessary to establish a session between two peering domains
    in the context of the functions defined.</p>"
