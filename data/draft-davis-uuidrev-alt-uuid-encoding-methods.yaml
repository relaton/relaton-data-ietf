abstract:
- language: en
  script: Latn
  content: "<p>This document presents considerations and best practices for\n   alternate Universally Unique Identifier (UUID) encoding methods\n   observed in the industry.\n\n   This document updates RFC9562 to provide suggested alternate encoding\n   methods, best practices and the various implementation considerations\n   required for choosing the correct encoding for an application.\n\n   When selected correctly, these alternate UUID encodings perform\n   better on the wire, in a database, or within various other\n   application logics versus the unnecessarily verbose text\n   representation from RFC9562.</p>"
