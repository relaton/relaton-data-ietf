abstract:
- language: en
  script: Latn
  content: "<p>This document describes Service Provider requirements for IP/MPLS-
    GMPLS interworking in support of GMPLS deployment. The main objective is to present
    a set of requirements and scenarios which result in general guidelines for the
    definition, selection and specification of a technical solution addressing these
    requirements and supporting the scenarios. Specification for this solution itself
    is out of scope in this document.</p>"
