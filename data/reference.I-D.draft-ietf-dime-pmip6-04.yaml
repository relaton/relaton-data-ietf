abstract:
- language: en
  script: Latn
  content: "<p>This specification defines Authentication, Authorization, and Accounting
    interactions between Proxy Mobile IPv6 entities (both Mobile Access Gateway and
    Local Mobility Anchor) and an Authentication, Authorization, and Accounting server
    within a Proxy Mobile IPv6 Domain.  These Authentication, Authorization, and Accounting
    interactions are primarily used to download and update mobile node specific policy
    profile information between Proxy Mobile IPv6 entities and a remote policy store.</p>"
