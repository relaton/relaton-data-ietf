abstract:
- language: en
  script: Latn
  content: "<p>This memo analyzes provider-to-provider QoS agreements suited for a
    global QoS-enabled Internet. It defines terminology relevant to inter-domain QoS
    models. It introduces a new concept denoted by Meta-QoS-Class. This new concept
    drives and federates the way QoS inter-domain relationships are built. It opens
    up new perspectives for a QoS-enabled Internet that retains, as much as possible,
    the openness of the existing best-effort Internet.</p>"
