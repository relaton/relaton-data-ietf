abstract:
- language: en
  script: Latn
  content: "<p>This RFC proposes several elliptic curve domain parameters over finite
    prime fields for use in cryptographic applications. The domain parameters are
    consistent with the relevant international standards, and can be used in X.509
    certificates and CRLs, IKE, TLS, XML signatures, and all applications or protocols
    based on the cryptographic message syntax (CMS).</p>"
