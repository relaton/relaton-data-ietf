abstract:
- language: en
  script: Latn
  content: "<p>This document explores how the Constrained RESTful Application Language
    (CoRAL) might be used for enabling publish/subscribe-style communication over
    the Constrained Application Protocol (CoAP), which allows CoAP nodes with long
    breaks in connectivity and/or up-time to exchange data via a publish/subscribe
    broker.</p>"
