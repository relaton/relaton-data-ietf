abstract:
- language: en
  script: Latn
  content: "<p>This document explores how the Constrained RESTful Application\n   Language (CoRAL) might be used for enabling publish/subscribe-style\n   communication over the Constrained Application Protocol (CoAP), which\n   allows CoAP nodes with long breaks in connectivity and/or up-time to\n   exchange data via a publish/subscribe broker.</p>"
