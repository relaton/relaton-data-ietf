abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies how to send HTML-formatted documents in Internet
    mail. The memo particularly addresses the issue of handling of hyperlinks in HTML
    documents referring to embedded content in other body parts in the same message.
    In order to do this, the memo introduces one new MIME content-header with the
    name 'Content-Location'.</p>"
