abstract:
- language: en
  script: Latn
  content: "<p>The Geopriv Location Object introduced by the Presence Information
    Data Format Location Object (PIDF-LO), RFC 4119, defines a basic XML format for
    carrying geographical information of a presentity. This document extends the &lt;location&gt;
    element specified in RFC 4119 to carry temporal feature elements useful for tracking
    moving objects. It defines five elements, namely speed, bearing, acceleration
    elevation and directionOfObject. The document also specifies mechanism to carry
    multiple moving object's status elements and proposes mechanism to indicate the
    type of the PIDF-LO content.</p>"
