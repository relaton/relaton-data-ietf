abstract:
- language: en
  script: Latn
  content: "<p>In some multihoming SRv6 L3VPN and EVPN scenarios, there are requirements
    for the egress PE to advertise multiple SRv6 Service SIDs for the same service,
    such as egress fast reroute and anycast load balancing. This document defines
    No-Further-FRR-flag and Anycast-flag for SRv6 Service SIDs carried in BGP messages.</p>"
