abstract:
- language: en
  script: Latn
  content: "<p>This document describes OpenToken (OTK), a format for the secure, cross-application
    exchange of key-value pairs. The format is designed primarily for use as an HTTP
    cookie or query parameter, but may also be used in other scenarios that require
    a compact, platform- neutral token.</p>"
