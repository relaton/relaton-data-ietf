abstract:
- language: en
  script: Latn
  content: "<p>This document defines additional subschema operational attributes for
    the XML Enabled Directory (XED) that allow user-defined directory attribute syntaxes
    to be imported into a directory server. User defined syntaxes specified in XML
    Schema, RELAX NG or Abstract Syntax Notation One (ASN.1), or specified as XML
    document type definition (DTD) element type declarations, are supported.</p>"
