abstract:
- language: en
  script: Latn
  content: "<p>The intention of this draft is to provide an overview of the topology
    of the Aeronautical Telecommunications Network to help with the analysis of the
    possible options of NEMO RO within this context.  The intention is to allow taking
    the existing NEMO RO solution space analysis document and cross-check it with
    the aeronautical environment presented within this document.</p>"
