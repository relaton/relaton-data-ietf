abstract:
- language: en
  script: Latn
  content: "<p>This document defines the QIK-VRT Effect Acknowledgement Protocol\n   (EFFECT_ACK), a protocol layer between technical transport\n   acknowledgement and responsible semantic release.  TCP\n   acknowledgement confirms technical arrival.  EFFECT_ACK confirms\n   whether received information may responsibly continue as an effect.\n   The protocol distinguishes TRANSPORT_ACK from EFFECT_ACK, defines\n   five effect states, introduces a versioned and hash-linked\n   Responsibility Protocol, and specifies deterministic hashing and\n   canonical JSON requirements for reproducible audit.</p>"
