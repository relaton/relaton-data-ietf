abstract:
- language: en
  script: Latn
  content: <p>This document specifies the Control Packet Snooping (CPS) mechanism
    for IP version 4 and IP version 6. This mechanism is used to set up binding between
    "authorized" source IP address of host and corresponding anchor on the access
    network device, including switch and wireless access point. The bindings are used
    to perform source address validation on packets sent by host.</p>
