abstract:
- language: en
  script: Latn
  content: "<p>The IASA is resposible for managing intellectual property rights on
    behalf of the IETF. This includes the license to copy, implement and otherwise
    use IETF contributions, among them Internet-Drafts and RFCs. The IASA accepts
    direction from the IETF regarding the rights to be granted. This document describes
    the desires of the IETF regarding outbound rights to be granted in IETF contributions.</p>"
