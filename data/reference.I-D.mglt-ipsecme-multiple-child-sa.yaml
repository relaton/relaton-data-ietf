abstract:
- language: en
  script: Latn
  content: "<p>IPsec packet processing with one Security Association (SA) per core
    is more efficient than having a SA shared by the multiple cores.  This document
    optimizes the negotiation of multiple unidirectional SAs in order to minimize
    the impact SAs being shared by multiple cores.</p>"
