abstract:
- language: en
  script: Latn
  content: "<p>Applications, such as multiple screen teleconference systems, often
    have multiple video streams that are organized to be displayed side by side.  This
    specification defines uses the RFC 5888 grouping semantics to define a new group
    type that indicates that multiple audio or video streams may be rendered side
    by side and also indicates the relative ordering of streams.</p>"
