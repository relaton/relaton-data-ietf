abstract:
- language: en
  script: Latn
  content: "<p>The definitions of IGMPv3 and MLDv2 require new behavior within the
    multicast routing protocols.  The additional source information contained in IGMPv3
    and MLDv2 messages necessitates multicast routing protocols to manage and utilize
    the information.  This document will describe how multicast routing protocols
    will interact with these source-filtering group management protocols.</p>"
