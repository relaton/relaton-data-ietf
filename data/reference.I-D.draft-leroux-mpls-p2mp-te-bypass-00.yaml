abstract:
- language: en
  script: Latn
  content: "<p>This document defines procedures for fast reroute protection of point-to-multipoint
    (P2MP) MPLS-TE LSPs, with point-to-multipoint bypass tunnels. During branch node
    failure the traffic on a protected P2MP TE-LSP is tunneled within a P2MP bypass
    tunnel towards the set of Merge Points. To avoid data duplication, the backup
    label is assigned by the PLR following the RSVP-TE upstream label assignment procedure.</p>"
