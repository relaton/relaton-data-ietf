abstract:
- language: en
  script: Latn
  content: "<p>This document gives guidance on securing IPv6-in-IPv4 tunnels using
    IPsec. No additional protocol extensions are described beyond those available
    with the IPsec framework. This document describes packet formats, IPsec security
    policy database for various scenarios, address configuration procedures, and the
    usage of the Extensible Authentication Procotol.</p>"
