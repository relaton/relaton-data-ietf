abstract:
- language: en
  script: Latn
  content: "<p>This document defines a message TLV named MANET INSTANCE_ID. The INSTANCE_ID
    TLV is used by a (DYMO) process to identify information as belonging to a particular
    (DYMO) instance. This specification enables multiple instances of (DYMO) to run
    independently on the same node.</p>"
