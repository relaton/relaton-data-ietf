- language: en
  script: Latn
  content: "<p>This memo defines an extension to the SMTP service whereby a server
    can indicate the extent of its ability to accept multiple commands in a single
    TCP send operation. Using a single TCP send operation for multiple commands can
    improve SMTP performance significantly.</p>"
