abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new IPv6 Hop-by-Hop Option that enables Minimum
    Rate Limit Discovery along the forward path between a source host and a destination
    host. Each router along the path can update the option with the minimum of its
    local Maximum Rate (MRate) and the recorded value. The discovered rate can then
    be communicated back to the source via a return mechanism, enabling the source
    to adapt its transmission rate to match the bottleneck link capacity and queue
    buffer.</p>"
