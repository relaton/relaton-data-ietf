abstract:
- language: en
  script: Latn
  content: "<p>The use of right-to-left scripts in internationalized domain names
    has presented several challenges. This memo discusses some problems with these
    scripts, including one resulting from a constraint on the use of combining characters
    at the end of an RTL domain label, causing some words to be declared invalid as
    IDN labels, and proposes a means for ameliorating this problem.</p>"
