abstract:
- language: en
  script: Latn
  content: "<p>The Diameter authentication, authorization, and accounting (AAA)\nprotocol provides support for peering AAA transactions across the\nInternet.  This document describes an API for the Diameter protocol.\nThe API is defined for the C language.  The intent of the API is to\nfoster source code portability across multiple programming platforms.</p>"
