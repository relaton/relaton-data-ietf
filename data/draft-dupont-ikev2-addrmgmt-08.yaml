- language: en
  script: Latn
  content: "<p>The current IKEv2 proposal lacks an address management feature. As
    it is compatible with the NAT traversal capability, this document specifies a
    complete address management with support for multi-homing and mobility, and fulfill
    mobike IETF working group goals 1, 2, 3, 4, and 6.</p>"
