abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a Management Information Base (MIB) module Which
    contains Textual Conventions to represent commonly used Pseudo Wire (PW) management
    information. The intent is that these TEXTUAL CONVENTIONS (TCs) will be imported
    and used in PW related MIB modules that would otherwise define their own representations.</p>"
