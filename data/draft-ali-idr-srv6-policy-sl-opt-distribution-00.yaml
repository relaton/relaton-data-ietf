abstract:
- language: en
  script: Latn
  content: "<p>In some use cases, an SRv6 policy's SID list ends with the policy endpoint's
    node SID, and the traffic steered (over policy) already ensures that it is taken
    to the policy endpoint. In such cases, the SID list can be optimized by excluding
    the endpoint Node SID when installing the policy. This draft specifies a BGP-LS
    extension to indicate whether the endpoint's node SID is included or excluded
    in installing SID list(s) of the Candidate Path (CP) of an SRv6 policy.</p>"
  format: text/html
