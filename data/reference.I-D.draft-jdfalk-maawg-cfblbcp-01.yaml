abstract:
- language: en
  script: Latn
  content: "<p>Complaint Feedback Loops similar to those described herein have existed
    for more than a decade, resulting in many de facto standards and best practices.
    \ This document is an attempt to codify, and thus clarify, the ways that both
    providers and consumers of these feedback mechanisms intend to use the feedback,
    describing some already-common industry best practices.  This paper is the result
    of cooperative efforts within the Messaging Anti-Abuse Working Group, a trade
    organization separate from the IETF.  The original MAAWG document upon which this
    document is based was published in April, 2010.  While not originally written
    as an Internet Draft, it has been contributed to the IETF standards repository
    in order to make it easier to incorporate this material into IETF work.</p>"
