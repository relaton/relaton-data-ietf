abstract:
- language: en
  script: Latn
  content: "<p>This document summarizes a recommended terminology for Network Coding
    concepts and constructs. It provides a comprehensive set of terms in order to
    avoid ambiguities in future Network Coding IRTF and IETF documents. This document
    is intended to be in-line with the terminology used by the RFCs produced by the
    Reliable Multicast Transport (RMT) and FEC Framework (FECFRAME) IETF working groups.</p>"
