abstract:
- language: en
  script: Latn
  content: "<p>This document provides a specification for including geolocation information
    in the headers of IPv6 packets (IPv6 GEO). The information is intended to be included
    in packets for which the location of the source node is to be conveyed via the
    network to the destination node or nodes.</p>"
