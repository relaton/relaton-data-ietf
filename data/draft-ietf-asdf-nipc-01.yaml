abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo specifies RESTful application layer interface for gateways
       providing operations against non-IP devices.  The described interface
       is extensible.  This memo initially describes Bluetooth Low Energy
       and Zigbee as they are the most commonly deployed.</p>
