abstract:
- language: en
  script: Latn
  content: "<p>A frame relay pseudo wire is a mechanism that exists between a provider's
    edge network nodes and support as faithfully as possible frame relay services
    over MPLS packet switched network (PSN). This document describes the detailed
    encapsulation necessary to transport frame relay packets over an MPLS network.</p>"
