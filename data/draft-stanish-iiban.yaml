abstract:
- language: en
  script: Latn
  content: "<p>An Internet IBAN (IIBAN) identifies an internet-based financial\n   endpoint in a manner that is superset-compatible with the existing\n   European Committee for Banking Standards (ECBS) International Bank\n   Account Number (IBAN) standard [ISO13616] and implementation\n   recommendations [ECBS].  This document obsoletes draft-iiban-00.</p>"
