abstract:
- language: en
  script: Latn
  content: "<p>Integrating RoHC with IPsec (RoHCoIPsec) offers the combined benefits
    of IP security services and efficient bandwidth utilization. However, extensions
    to the SPD and SAD are required in order to integrate RoHC with IPsec.  This document
    describes the IPsec extensions required to support RoHCoIPsec.</p>"
