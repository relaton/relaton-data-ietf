  script: Latn
  content: "<p>This dpcument describes the methodology for benchmarking IGP Route
    Convergence as described in Applicability document [1] and Terminology document
    [2]. The methodology and terminology are to be used for benchmarking route convergence
    and can be applied to any link-state IGP such as ISIS [3] and OSPF [4]. The terms
    used in the procedures provided within this document are defined in [2].</p>"
