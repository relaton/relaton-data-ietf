abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension for Bidirectional Forwarding Detection
    (BFD) to allow the use of any cryptographic authentication algorithm in addition
    to the already documented authentication schemes, described in the base specification.
    \ Although this document has been written specifically to introduce two new Authentication
    types it describes how BFD can use Hashed Message Authentication Code (HMAC) construct
    along with the Secure Hash algorithm (SHA) [FIPS-180-3] family of cryptographic
    hash functions to authenticate the control packets.  The method described in this
    document is generic and can be used to extend BFD to support any cryptographic
    hash function in the future.</p>"
