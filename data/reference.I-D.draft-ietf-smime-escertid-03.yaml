abstract:
- language: en
  script: Latn
  content: "<p>In the original Enhanced Security Services for S/MIME draft, a structure
    for cryptographically linking the certificate to be used in validation with the
    signature was introduced, this structure was hardwired to use SHA-1. This document
    allows for the structure to have algorithm agility and defines new attributes
    to deal with the updating.</p>"
