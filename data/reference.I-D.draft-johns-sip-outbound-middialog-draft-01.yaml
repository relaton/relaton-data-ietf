abstract:
- language: en
  script: Latn
  content: "<p>This document describes modifications to the procedures for the generation
    of a flow token as described in the Internet Draft titled Managing Client Initiated
    Connections in the Session Initiation Protocol. This modification is necessary
    to support routing of mid- dialog requests while preserving Edge Proxy failover
    within an outbound-proxy-set.</p>"
