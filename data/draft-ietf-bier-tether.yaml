abstract:
- language: en
  script: Latn
  content: "<p>This document specifies optional enhancements to optimize the support
    of Bit Index Explicit Replication (BIER) incapable routers in a BIER domain by
    attaching (tethering) a BIER router to a BIER incapable router, including procedures
    and ISIS/OSPF/BGP signaling extensions.</p>"
