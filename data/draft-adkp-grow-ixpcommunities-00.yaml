abstract:
- language: en
  script: Latn
  content: "<p>This document presents suggestion and examples for application of BGP
    Large Communities [RFC8092] at Internet Exchange Points (IXPs). Suggestions are
    based on operational experiences from IXP operators and members. Any IXP operator
    or IXP member can consider using these communities. The document specifically
    focusses on Route Server [RFC7947] deployments in IXP context [RFC7948].</p>"
