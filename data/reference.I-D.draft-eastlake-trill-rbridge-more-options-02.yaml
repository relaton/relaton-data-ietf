  script: Latn
  content: "<p>The TRILL base protocol standard, draft-ietf-trill-rbridge- protocol-16.txt,
    specifies minimal hooks for options and draft-ietf- trill-rbridge-options specifies
    the format for options and a proposed initial set of options. This draft is a
