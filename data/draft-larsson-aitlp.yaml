abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Agent Identity, Trust and Lifecycle Protocol\n(AITLP), a protocol for autonomous software agents operating within\norganizational boundaries. AITLP specifies agent identity and naming\nconventions, hierarchical mandate enforcement, lifecycle state\nmanagement, inter-agent trust verification, ontological scope\nconstraints, certificate-based authentication, and generational\nknowledge transfer via Agent Legacy Mode (ALM).\n\nThe protocol enables agents to operate autonomously while remaining\nauditable, revocable, and organizationally bounded. AITLP focuses on\nboundaries -- what an agent is not permitted to do and how that is\nenforced -- complementing capability-focused specifications such as MCP,\nA2A, and ANS.\n\nUnlike those specifications, AITLP defines not a tool or a\ncommunication channel, but an organizational actor: an agent with a\ndeclared identity, a bounded mandate, a managed lifecycle, and a\ncryptographically enforced scope of authority.</p>"
