abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Security Evaluated Standardized Password
    Authenticated Key Exchange (SESPAKE) protocol.  The SESPAKE protocol provides
    password authenticated key exchange for usage in the systems for protection of
    sensitive information.  The security proofs of the protocol were made for the
    case of an active adversary in the channel, including MitM attacks and attacks
    based on the impersonation of one of the subjects.</p>"
