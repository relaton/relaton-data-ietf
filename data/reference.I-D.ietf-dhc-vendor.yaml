abstract:
- language: en
  script: Latn
  content: "<p>The DHCP options for Vendor Class and Vendor-Specific Information can
    be ambiguous when a DHCP client represents multiple vendors. This document defines
    two new options, modeled on the IPv6 options for vendor class and vendor-specific
    information, which contain Enterprise Numbers to remove ambiguity.</p>"
