abstract:
- language: en
  script: Latn
  content: "<p>Use of data services in smart phones and broadband services via HSPA
    and HSPA+, in particular Internet services, has increased rapidly and operators
    that have deployed networks based on 3GPP network architectures are facing IPv4
    address shortages at the Internet registries and are feeling a pressure to migrate
    to IPv6.  This document describes the support for IPv6 in 3GPP network architectures.</p>"
