abstract:
- language: en
  script: Latn
  content: <p>This document describes the "dsn-envelope" and "dsn-redirect" extensions
    to the Sieve email filtering language.  The "dsn-envelope" extension provides
    access to additional envelope information provided by the delivery status notification
    extension to SMTP defined in RFC 3461.  The "dsn-redirect" extension extends Sieve's
    redirect action to provide control over delivery status notification parameters.</p>
