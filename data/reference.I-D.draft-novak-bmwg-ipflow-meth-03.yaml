  script: Latn
  content: <p>This document provides methodology and framework for quantifying performance
    of selective monitoring of IP flows on a network device and export of this information
    to a collector. It is based on the Architecture for IP Flow Information Export
    [RFC5470].  Status of this Memo  This Internet-Draft is submitted to IETF in full
    conformance with the provisions of BCP 78 and BCP 79.  Internet-Drafts are working
