abstract:
- language: en
  script: Latn
  content: "<p>This document registers and obsoletes Enumservices for Internet\n   calendaring.  Specifically, this document focuses on Enumservices for\n   iMIP (iCalendar Message-Based Interoperability Protocol), CalDAV\n   (Calendaring Extensions to WebDAV), and iSchedule (Internet Calendar\n   Scheduling Protocol).</p>"
