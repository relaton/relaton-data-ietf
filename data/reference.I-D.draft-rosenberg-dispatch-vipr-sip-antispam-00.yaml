abstract:
- language: en
  script: Latn
  content: <p>Verification Involving PSTN Reachability (ViPR) is a new technique for
    inter-domain federation of SIP calls.  ViPR makes use of a the PSTN as an introduction
    mechanism to verify the correctness of mappings from phone numbers to domains.  The
    PSTN introduction mechanism can also be used as a techqnique for blocking spam
    - a SIP caller is only authorized when they're calling domain has previously called
    that same number over the PSTN.  This document describes an extension to SIP which
    enables authorization of SIP calls based on a prior PSTN introduction.  Legal  This
    documents and the information contained therein are provided on an "AS IS" basis
