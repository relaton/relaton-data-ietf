abstract:
- language: en
  script: Latn
  content: "<p>The intention of this document is to analyze the set of requirements
    for Operations, Administration, and Maintenance (OAM) for the Transport Profile
    of MPLS(MPLS-TP) as defined in [MPLS-TP OAM Requirements], to evaluate whether
    existing MPLS OAM tools can be applied to these requirements.  Eventually, the
    purpose of the document is to recommend which of the existing tools should be
    extended and what new tools should be defined to support the set of OAM requirements
    for MPLS-TP.</p>"
