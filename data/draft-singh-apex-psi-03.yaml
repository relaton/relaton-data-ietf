abstract:
- language: en
  script: Latn
  content: "<p>PSI-03 specifies a portable, Ed25519-signed bond that anchors a registered
    NDIS practitioner's professional identity to a DID- compatible decentralised identifier
    without requiring a central registry. The bond enables cross-provider, cross-border
    practice verification while preserving privacy and issuer sovereignty.</p>"
