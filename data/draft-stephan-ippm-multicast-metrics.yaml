- language: en
  script: Latn
  content: "<p>This memo defines a set of spatial metrics for measuring the \nperformance
    of multicast networks and a set of multicast metrics for \nmeasuring the performance
    of multicast services. It introduces a \nframework to perform operational multicast
    metrics measurements \ncoupling SNMP and the IPPM-MIB.</p>"
