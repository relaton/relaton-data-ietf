  script: Latn
  content: "<p>This document describes a framework for automatic traffic engineering
    of autonomous system (AS). Automatic traffic engineering aims to automatically
    control incoming traffic. The framework in this document provides roles of each
    element and a communication model between the elements for realizing automatic
    traffic engineering.</p>"
