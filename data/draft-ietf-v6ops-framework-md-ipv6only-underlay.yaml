title:
- language: en
  script: Latn
  content: Framework for Multi-domain IPv6-only Network and IPv4-as-a-Service
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-v6ops-framework-md-ipv6only-underlay-30
