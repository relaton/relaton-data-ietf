abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses suggest a reference model for energy consumption
    monitoring and control.  It defines entities involved in energy management, their
    roles, and relationships between them.  Considered entities include energy consumers,
    energy consumption meters, energy consumption reporters, energy consumption controllers,
    and energy consumption management systems.</p>"
