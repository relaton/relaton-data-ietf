abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a method for providing multicast distribution-tree
    accounting data. Simple extensions to the Protocol Independent Multicast (PIM)
    protocol allow a rough approximation of tree-based data in a scalable fashion.
    This document defines an Experimental Protocol for the Internet community.</p>"
