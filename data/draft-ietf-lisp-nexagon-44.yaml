abstract:
- language: en
  script: Latn
  content: "<p>This document describes an interoperable system of Geolocation agents
    that utilizes virtual layer 3 routing and geospatial addressing to form a mobility-edge
    network. The network uses a hierarchical H3 grid to calculate the high-resolution
    tile positions of detections made by vehicles equipped with vision AI cameras
    using their GPS coordinates. When these vehicles detect elements of interest or
    map road segments, the system uses the tile ID of the detection or road segment
    as the basis for an IPv6 endpoint identifier (EID). These EIDs are the destination
    queues and channel sources for network-addressable agents that consolidate detections
    from all vehicles in a given area. The mobility network is constructed using the
    Locator/ID Separation Protocol (LISP).</p>"
  format: text/html
