abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a method of distributing device discovery information
    in NVMe over RoCEv2 storage network using the BGP routing protocol. A new BGP
    Network Layer Reachability Information (NLRI) encoding format, named NoF NLRI,
    is defined.</p>"
