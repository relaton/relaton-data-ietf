- language: en
  script: Latn
  content: "<p>This document is not intended for publication as an RFC. It gives the
    underpinning arguments for why the idea that RTP sessions and MIME top level types
    are related is a deeply broken paradigm, and that we need to get away from it.
    These arguments are solely the opinion of the listed author.</p>"
