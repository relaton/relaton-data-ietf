abstract:
- language: en
  script: Latn
  content: "<p>This document describes a TRILL based L2VPN solution using VTSD. VTSD
    (Virtual TRILL Service/Switch Domain) is specified in [draft-VTSD]. This draft
    describes the advantages provided by a TRILL based EVPN solution over an existing
    MPLS L2VPN solution, advantages such as bandwidth scaling and providing multiple
    active pseudowires.</p>"
