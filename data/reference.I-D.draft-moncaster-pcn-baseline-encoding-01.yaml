abstract:
- language: en
  script: Latn
  content: "<p>Pre-congestion notification (PCN) provides information to support admission
    control and flow termination in order to protect the Quality of Service of inelastic
    flows.  It does this by marking packets when traffic load on a link is approaching
    or has exceeded a rate threshold below the physical link rate.  This document
    specifies how such marks are to be encoded into the IP header.  The baseline encoding
    described here provides for only two PCN encoding states. Another document describes
    an extended encoding scheme that allows for three encoding states.  Status  This
    memo is posted as an Internet-Draft with an intent to eventually progress to standards
    track.</p>"
