abstract:
- language: en
  script: Latn
  content: "<p>This document proposes to add mutual authentication, based on human-memorizable
    password, to the basic unauthenticated Diffie-Hellman key exchange. The proposed
    algorithm is called Password Authenticated Key exchange (PAK). PAK allows two
    parties to authenticate themselves while performing the Diffie-Hellman exchange.
    The protocol is secure against all passive and active attacks. In particular,
    it does not allow either type of attackers to obtain any information that would
    enable an off-line dictionary attack on the password. The use of Diffie-Hellman
    exchange ensures Forward Secrecy.</p>"
