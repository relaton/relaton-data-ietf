abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Protocol for Transposed Transactions over
    HTTP (PTTH), an HTTP extension that allows a backend server to establish an HTTP
    connection to a reverse proxy and transpose the flow of HTTP requests. The reverse
    proxy then sends requests to the backend server over the resulting transposed
    channel. This extension lets backend servers behind restrictive firewalls accept
    HTTP traffic through reverse proxies without changing firewall settings and with
    minimal overhead.</p>"
