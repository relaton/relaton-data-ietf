abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Enforcement-Point (PEP) profile that\n   composes on the shared verifier core specified in the referenced\n   authorization-receipt Internet-Draft\n   [I-D.schrock-ep-authorization-receipts].  The profile gives a Policy\n   Enforcement Point a small, stable contract for high-risk agent\n   actions: a registered decision vocabulary (allow / allow_with_signoff\n   / deny, with an out-of-band observe mode), a decision-request and\n   decision-response schema bound to the exact action under evaluation,\n   and a requirement that every decision be bound to an offline-\n   verifiable authorization receipt (the EP-RECEIPT-v1 wire format).  It\n   states the conformance requirements an enforcement point must meet —\n   fail-closed on uncertainty, honoring of one-time consumption, and\n   receipt emission — and the central invariant that a rejecting\n   decision must take effect before any approval-bearing state mutation.\n\n   This profile _consumes_ a policy decision; it does not define a\n   policy language.  It is complementary to, not a replacement for, the\n   decision-interface and policy-engine work it sits behind (AuthZEN,\n   OPA, Cedar), and it does not redefine the verifier core, which is\n   specified in (draft-schrock-ep-authorization-receipts).</p>"
