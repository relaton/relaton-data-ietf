abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Enforcement-Point (PEP) profile that composes
    on the shared verifier core specified in the referenced authorization-receipt
    Internet-Draft [I-D.schrock-ep-authorization-receipts]. The profile gives a Policy
    Enforcement Point a small, stable contract for high-risk agent actions: a registered
    decision vocabulary (allow / allow_with_signoff / deny, with an out-of-band observe
    mode), a decision-request and decision-response schema bound to the exact action
    under evaluation, and a requirement that every decision be bound to an offline-
    verifiable authorization receipt (the EP-RECEIPT-v1 wire format). It states the
    conformance requirements an enforcement point must meet — fail-closed on uncertainty,
    honoring of one-time consumption, and receipt emission — and the central invariant
    that a rejecting decision must take effect before any approval-bearing state mutation.
    This profile _consumes_ a policy decision; it does not define a policy language.
    It is complementary to, not a replacement for, the decision-interface and policy-engine
    work it sits behind (AuthZEN, OPA, Cedar), and it does not redefine the verifier
    core, which is specified in (draft-schrock-ep-authorization-receipts).</p>"
