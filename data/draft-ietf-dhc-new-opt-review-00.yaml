abstract:
- language: en
  script: Latn
  content: "<p>This document outlines deficiencies that have become evident since
    RFC 2131 and RFC 2132 were published regarding the allocation of new option codes,
    the review of drafts covering these new option codes, and the availability of
    option codes for new parameters. The document then presents proposals for correcting
    these deficiencies.</p>"
