abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the web message response mode that authorization
    servers use for transmitting authorization response parameters via the user-agent's
    postMessage API to the client. This mode is intended for authorization flows that
    use secondary windows, which are well-suited for browser-based applications.</p>"
