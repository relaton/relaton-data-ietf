abstract:
- language: en
  script: Latn
  content: "<p>ENUM as defined in RFC3761 [1] is not well suited for the purpose of
    interconnection by carriers, as can be seen by the use of various private tree
    arrangements based on ENUM mechanisms. A combined end- user and carrier ENUM tree
    solution would leverage the ENUM infrastructure in e164.arpa, increase resolution
    rates, and decrease the cost per registered telephone number. This document describes
    a minimally invasive scheme to provide both end-user and carrier data in ENUM.</p>"
