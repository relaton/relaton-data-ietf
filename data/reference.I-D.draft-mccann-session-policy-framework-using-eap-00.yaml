abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a framework for implementing a session policy
    channel using EAP. It defines a standard mechanism by which a mobile device can
    conduct a session policy channel exchange with a networkcomponent and obtain session
    policies using a XML session policy structure, encapsulated within an EAP TLV
    message. EAP Re-authentication Protocol is suggested as a mechanism to allow asynchronous
    use of SIP at upper layers.</p>"
