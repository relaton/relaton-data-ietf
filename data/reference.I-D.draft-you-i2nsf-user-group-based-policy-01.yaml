abstract:
- language: en
  script: Latn
  content: "<p>This draft defines the User-group Aware Policy Control (UAPC) framework,
    which facilitates consistent enforcement of security policies based on user group
    identity.  Policies are used to control security policy enforcement using a policy
    server and a security controller.  Northbound APIs are also discussed.</p>"
