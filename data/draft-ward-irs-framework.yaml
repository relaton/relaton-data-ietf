- language: en
  script: Latn
  content: "<p>This document describes a framework for a standard, programmatic interface
    for full-duplex, streaming state transfer in and out of the Internet's routing
    system. It lists the information that might be exchanged over the interface, and
    describes the uses of an interface to the Internet routing system.</p>"
