abstract:
- language: en
  script: Latn
  content: "<p>This document describes a possible direction for the management of\n   Network-as-a-Service (NaaS), in which the relationship between a\n   service consumer and a provider is treated not as a static contract\n   but as a continuous, automated negotiation conducted on both sides by\n   cognitive software agents.  A NaaS whose required bandwidth, latency\n   and availability move continuously cannot be settled once at order\n   time; it is a standing dialogue - intent, quote, agreement and in-\n   life change - that today stops at the customer-operator boundary and\n   is bridged by humans.  The document frames that boundary as the\n   unautomated gap, sketches an end-to-end agentic negotiation\n   architecture that closes it, and describes the intent instance as a\n   managed object whose life cycle includes scarcity-driven pricing and\n   closed-loop renegotiation.  It maps the architecture onto already-\n   published specifications from several bodies, showing that the\n   direction rests on a standards basis rather than on new protocol\n   invention.  Two NaaS settings illustrate its utility.</p>"
