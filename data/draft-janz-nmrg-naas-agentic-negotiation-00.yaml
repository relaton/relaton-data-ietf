abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a possible direction for the management of
       Network-as-a-Service (NaaS), in which the relationship between a
       service consumer and a provider is treated not as a static contract
       but as a continuous, automated negotiation conducted on both sides by
       cognitive software agents.  A NaaS whose required bandwidth, latency
       and availability move continuously cannot be settled once at order
       time; it is a standing dialogue - intent, quote, agreement and in-
       life change - that today stops at the customer-operator boundary and
       is bridged by humans.  The document frames that boundary as the
       unautomated gap, sketches an end-to-end agentic negotiation
       architecture that closes it, and describes the intent instance as a
       managed object whose life cycle includes scarcity-driven pricing and
       closed-loop renegotiation.  It maps the architecture onto already-
       published specifications from several bodies, showing that the
       direction rests on a standards basis rather than on new protocol
       invention.  Two NaaS settings illustrate its utility.</p>
