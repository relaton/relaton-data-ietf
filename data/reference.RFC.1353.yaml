abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in TCP/IP-based internets.  In particular,
    it describes a representation of the SNMP parties defined in [8] as objects defined
    according to the Internet Standard SMI [1]. [STANDARDS-TRACK]</p>"
