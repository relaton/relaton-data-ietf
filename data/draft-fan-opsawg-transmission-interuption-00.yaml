- language: en
  script: Latn
  content: "<p>The transmission performance of IP/MPLS network affects upper layer
    services and networks, but there is no consensus in the industry on transmission
    interruption for IP/MPLS network up to now. This memo studies requirements for
    the interruption duration criteria in several service scenarios.</p>"
