abstract:
- language: en
  script: Latn
  content: "<p>This document describes the DHCPv6 Route Option for provisioning static
    IPv6 routes on a DHCPv6 client..This improves the ability of an operator to configure
    and influence the client to pick an appropriate route to a destination when the
    client is multi-homed to routers and where other means of route configuration
    may be impractical.  It is primarily envisaged for implementation on a DHCP client
    stack of a broadband Residential Gateway (RG) node.</p>"
