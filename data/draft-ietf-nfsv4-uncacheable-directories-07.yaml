abstract:
- language: en
  script: Latn
  content: "<p>Network File System version 4.2 (NFSv4.2) clients may cache\n   directory-entry (dirent) metadata returned by READDIR to improve\n   performance.  In some deployments, the rate at which directory\n   contents change at the server exceeds the validity of typical NFSv4.2\n   client caches, so that a client serving READDIR responses from its\n   local cache returns entries or attribute values that no longer\n   reflect the current state of the directory.  This document introduces\n   an uncacheable dirent metadata attribute for NFSv4.2 that allows a\n   server to indicate that a client honouring the attribute is required\n   to retrieve directory-entry metadata from the server on each READDIR\n   rather than serving the response from a local cache.</p>"
