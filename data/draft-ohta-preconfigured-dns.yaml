abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes how to make addresses of DNS servers
       preconfigured in clients.  Well known anycast addresses, which are
       assigned to DNS servers, should be preconfigured to resolvers of
       clients. It is also explained why anycast does not offer redundancy.</p>
