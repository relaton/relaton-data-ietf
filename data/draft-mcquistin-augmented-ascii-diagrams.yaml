abstract:
- language: en
  script: Latn
  content: "<p>This document describes a machine-readable format for specifying the
    syntax of protocol data units within a protocol specification, known as an Augmented
    Packet Header Diagram. This comprises a consistently formatted packet header diagram,
    using a well-defined syntax, that is followed by structured explanatory text.
    The Augmented Packet Header Diagram format is designed to maintain human readability,
    while also supporting automated parser generation from protocol specification
    documents. This document is itself an example of how the format can be used.</p>"
  format: text/html
