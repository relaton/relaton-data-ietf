abstract:
- language: en
  script: Latn
  content: "<p>Bidirectional Forwarding Detection (BFD) mechanisms can be used for
    fast detection of failures in the forwarding path of SR Policy. This document
    describes the Operational Guidance for BFD Encapsulation in SRv6 Policy. The BFD
    packets may be encapsulated in Insert-mode or Encaps-mode.</p>"
