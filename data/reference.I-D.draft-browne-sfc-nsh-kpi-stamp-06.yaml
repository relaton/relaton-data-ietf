  script: Latn
  content: "<p>This document describes an experimenal method of carrying Key Performance
    Indicators (KPIs) using the Network Service Header (NSH). This method may be used,
    for example, to monitor latency and QoS marking to identify problems on some links
    or service functions.</p>"
