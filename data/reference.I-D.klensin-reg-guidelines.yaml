abstract:
- language: en
  script: Latn
  content: "<p>This document explores the issues in registration of internationalized
    domain names (IDNs). The basic IDN definition potentially allows a very large
    number of possible characters in domain names, and this richness may lead to serious
    user confusion about similar-looking names. To avoid this confusion, it is necessary
    for the IDN registration process to impose rules that disallow some otherwise-valid
    name combinations. This document suggests a set of mechanisms that registries
    might use to define and implement such rules, including adaptation of methods
    developed for Chinese, Japanese, and Korean domain names to other languages and
    scripts.</p>"
