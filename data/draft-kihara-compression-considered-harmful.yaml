abstract:
- language: en
  script: Latn
  content: |-
    <p>Transport Layer Security is essential to secret communications in the
       Internet, and protecting TLS is our fundamental task.  This document
       describes a threat to TLS when compression is used and proposes
       possible mitigations of the threat.</p>
