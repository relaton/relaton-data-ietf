- language: en
  script: Latn
  content: Update to OAuth 2.0 Protected Resource Metadata Resource Identifier Validation
  format: text/plain
docidentifier:
- content: draft-mcguinness-oauth-rfc9728bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>RFC 9728 defines OAuth 2.0 Protected Resource Metadata, enabling clients
    to dynamically discover the authorization requirements of protected resources.
    Section 3.3 of RFC 9728 requires that when protected resource metadata is obtained
    via a WWW-Authenticate challenge, the resource value in the metadata MUST exactly
    match the URL the client used to access the protected resource, limiting the applicability
    of the specification. This document updates the resource validation rule in Section
    3.3 of RFC 9728 to permit the resource value to be any URI that shares the same
    TLS origin (scheme, host, and port) as the requested URL and whose path is a prefix
    of the request URL path. This enables a wider range of use cases for the WWW-Authenticate
    response. All other aspects of RFC 9728 remain unchanged.</p>"
