abstract:
- language: en
  script: Latn
  content: "<p>This document provides for the ability to send and receive \nnotifications
    using HTTP over TCP/IP and administratively scoped \nunreliable multicast UDP.
    Provisions are made for the use of \nintermediary arbiters, called subscription
    arbiters, which handle \nrouting notifications to their intended destination.</p>"
