abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Work-In-Progress syntax called claim pointers
    that identify specific items in structured credentials, which often have nested
    levels of hierarchy; and claim matchers that facilitate comparisons between items
    in credentials and a target value. It also describes a new version of the More
    Instant Messaging Interoperability (MIMI) preauthorization format using claim
    pointers and claim matchers.</p>"
