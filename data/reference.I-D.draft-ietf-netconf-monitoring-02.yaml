abstract:
- language: en
  script: Latn
  content: "<p>This document defines NETCONF content via XML Schema to be used to
    monitor the NETCONF protocol.  It includes information about NETCONF sessions,
    locks, and subscriptions and is intended to facilitate management of a NETCONF
    server.  In addition this memo defines a mechanism to discover all possible data
    models (schema list retrieval) and a mechanism to retrieve schema via NETCONF
    (get schema).  Both can be performed dynamically throughout a session, unlike
    capabilities exchange which is performed during session setup only.  Both support
    multiple schema versions, formats and locations.</p>"
