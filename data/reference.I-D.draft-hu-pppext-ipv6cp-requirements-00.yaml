abstract:
- language: en
  script: Latn
  content: "<p>The IPv6 Control Protocol (IPv6CP) is a NCP that allows for the negotiation
    of parameters for an IPv6 interface over PPP. In IPv6 networks, PPP (PPPoE) will
    still be an important mechanism for connecting broadband access users. However,
    IPv6CP only defines the Interface-Identifier option, other parameters such as
    IPv6 Address, Primary and alternative DNS server addresses, and delegated prefix
    have to be configured by other methods rather than IPv6CP.  This document describes
    problems the ISPs faced and lists requirements related when deploying IPv6 in
    broadband access network over PPP.</p>"
