abstract:
- language: en
  script: Latn
  content: "<p>This rfc describes a protocol, called kx509, for using Kerberos tickets
    to acquire X.509 certificates.  While not (previously) standardized, this protocol
    is already in use at several large organizations, and certificates issued with
    this protocol are recognized by TAGPMA (The Americas Grid Policy Management Authority).</p>"
