abstract:
- language: en
  script: Latn
  content: "<p>This FYI RFC document is intended for existing Internet Network Information
    Center (NIC) personnel, people interested in establishing a new NIC, Internet
    Network Operations Centers (NOCs), and funding agencies interested in contributing
    to user support facilities. This memo provides information for the Internet community.
    It does not specify an Internet standard.</p>"
