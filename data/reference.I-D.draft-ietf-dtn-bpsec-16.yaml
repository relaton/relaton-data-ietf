- language: en
  script: Latn
  content: "<p>This document defines a security protocol providing end to end data
    integrity and confidentiality services for the Bundle Protocol.  This document
    is an update of the protocol described in RFC 6257, reflecting lessons learned.
    \ For this reason it obsoletes RFC 6257, an IRTF-stream document.</p>"
