abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a registry to define methods to distribute
    identity events to subscribers.  It includes a definition for publishers to use
    HTTP POST to push events to clients via web callback, and a method for subscribers
    to use HTTP GET to retrieve events in a feed queue.</p>"
