abstract:
- language: en
  script: Latn
  content: "<p>This document describes a way to perform end-user authentication in
    the Simple Authentication and Security Layer (SASL) framework which re-use an
    external security layer (such as the Transport Layer Security (TLS) protocol)
    that may have already completed end-user authentication.  In comparison with the
    existing EXTERNAL mechanism, this mechanism offers a way to cryptographically
    bind the authentication to the security layer via a channel binding.  The EXTERNAL-CHANNEL
    mechanism alleviates the a priori assumptions made by the design of the EXTERNAL
    mechanism.  See &lt;http://josefsson.org/external-channel/&gt; for more information.</p>"
