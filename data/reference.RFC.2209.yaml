abstract:
- language: en
  script: Latn
  content: "<p>This memo contains an algorithmic description of the rules used by
    an RSVP implementation for processing messages.  It is intended to clarify the
    version 1 RSVP protocol specification.  This memo provides information for the
    Internet community.  It does not specify an Internet standard of any kind.</p>"
