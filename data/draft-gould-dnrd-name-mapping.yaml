  content: |-
    <p>This document defines the data escrow structure of depositing objects
       specific to the .NAME Top Level Domain (TLD) as an extension to the
       objects deposited with DNRD Objects Mapping.  The .NAME TLD-specific
       objects are Email Forwarding, Defensive Registration, and NameWatch.</p>
