abstract:
- language: en
  script: Latn
  content: <p>This document provides a general mechanism to provide with compact and
    efficient inband signaling mechanisms for VoIP applications using the RTP (Real-Time
    Transport Protocol). It provides the option to include a few additional inband
    signaling bytes in between the RTP header and the RTP payload. The intention of
    using Shim is to enable a fast inband signaling channel. The main application
    is for two party teleconferencing, The presented mechanism is not recommended
    to be used for multi party teleconferencing applications. The name Shim is to
    refer to the "little thing something that one put in between".</p>
