abstract:
- language: en
  script: Latn
  content: "<p>This document contains some example traces of Ephemeral Diffie- Hellman
    Over COSE (EDHOC). Discussion Venues This note is to be removed before publishing
    as an RFC. Discussion of this document takes place on the Lightweight Authenticated
    Key Exchange Working Group mailing list (lake@ietf.org), which is archived at
    https://mailarchive.ietf.org/arch/browse/lake/. Source for this draft and an issue
    tracker can be found at https://github.com/lake-wg/edhoc.</p>"
