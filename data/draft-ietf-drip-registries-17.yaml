abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the high level architecture for the
       registration and discovery of DRIP Entity Tags (DETs) using DNS.
       Discovery of DETs and related metadata is performed via DRIP specific
       DNS structures and standard DNS methods.  A general overview of the
       interfaces required between involved components is provided in this
       document with future supporting documents to provide technical
       specifications.</p>
