abstract:
- language: en
  script: Latn
  content: "<p>This document is a problem statement for the Trust Router Protocol.
    The Trust Router Protocol has been designed to support multihop ABFAB federations,
    without the need for credentials to be configured for every pair of Identity Providers
    and Relying Parties.</p>"
