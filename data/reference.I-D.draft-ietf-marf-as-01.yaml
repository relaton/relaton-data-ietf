abstract:
- language: en
  script: Latn
  content: "<p>RFC 5965 defines an extensible, machine-readable format intended for
    mail operators to report feedback about received email to other parties.  This
    document describes one common method for utilizing this format for reporting at
    scale between large mailbox providers, and from large mailbox providers to other
    mail sending entities.  [NOTE TO EDITOR: Murray Kucherawy is listed as an author
    only to enable him to complete the publication process on behalf of J.D. Falk.
    \ Please remove Murray from the author list prior to publication.]</p>"
