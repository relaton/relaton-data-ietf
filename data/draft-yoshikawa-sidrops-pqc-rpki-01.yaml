abstract:
- language: en
  script: Latn
  content: "<p>This document defines an initial experimental post-quantum signature
    profile and migration design for the Resource Public Key Infrastructure (RPKI).
    The profile uses Composite ML-DSA-65 with ECDSA P-256 for RPKI certificates, CRLs,
    certification requests, and CMS signed objects. The migration design introduces
    the composite suite at CA boundaries through Mixed Certification Chains. It preserves
    the existing RPKI object formats, repository system, validation procedure, and
    router-facing VRP/RTR model. This revision is intended for SIDROPS evaluation
    and does not update RFC 7935.</p>"
