- language: en
  script: Latn
  content: "<p>This document details the challenges with building an Autonomic Control
    Plane on Campus/Enterprise networks which are built out of layer-two (Ethernet)
    switched technologies.</p>"
- language: en
  script: Latn
  content: "<p>This document does not propose a specific solution as yet, but details
