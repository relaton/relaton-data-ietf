abstract:
- language: en
  script: Latn
  content: "<p>This draft adapts the general technique described in draft- ferrieuxhamchaoui-tsvwg-lossbits
    draft-ferrieuxhamchaoui-tsvwg- lossbits for QUIC using reserved bits in QUIC v1
    header. It describes a method that employs two bits to allow endpoints to signal
    packet loss in a way that can be used by network devices to measure and locate
    the source of the loss.</p>"
