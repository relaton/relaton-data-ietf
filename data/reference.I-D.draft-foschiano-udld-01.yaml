abstract:
- language: en
  script: Latn
  content: "<p>This document describes a protocol that can be used to detect and disable
    unidirectional Ethernet fiber or copper links caused for instance by mis-wiring
    of fiber strands, interface malfunctions, media converters' faults, etc. It operates
    at Layer 2 in conjunction with IEEE 802.3's existing Layer 1 fault detection mechanisms.
    Please note that this document is not meant to be used as an implementation reference
    for inter-vendor interoperability purposes. Its objective instead is to be an
    informative reference for users who wish to deploy services based on the protocol
    herein described.</p>"
