abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Media Control Channel Framework Package for
    BFCP-based conference moderation. The control of Media Servers and their related
    resources in decomposed network architectures plays an important role in various
    Next Generation Networks. This Control Package aims at adding BFCP functionality
    to conferences using the Media Control Channel Framework.</p>"
