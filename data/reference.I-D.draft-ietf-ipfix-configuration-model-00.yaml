abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a data model for the configuration of caches,
    selection processes, exporting processes, and collecting processes of IPFIX and
    PSAMP compliant monitoring devices.  The configuration data model is encoded in
    Extensible Markup Language (XML).  The structure of the data model is specified
    in a YANG module to ensure compatibility with the NETCONF protocol.  A YANG-to-XSD
    converter is available which allows generating an XML Schema Definition (XSD)
    of the data model.</p>"
