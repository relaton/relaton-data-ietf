abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an improvement to the use of SCTP as specified
    in the IPFIX specifications: exporting each template record and the associated
    data records within a unique SCTP stream.  This specification offers several advantages:
    the data loss for each template record can be deduced, the transmission order
    is maintained, and the collecting process's job is easier.</p>"
