abstract:
- language: en
  script: Latn
  content: <p>This document defines a new parameter "enumdi" for the "tel" Uniform
    Resource Identifier (URI) to support the handling of ENUM queries in VoIP (Voice
    over Internet Protocol) network elements. A VoIP network element may receive an
    URI containing an E.164 number, where that URI contains an "enumdi" parameter.
    The presence of the "enumdi" parameter indicates that an ENUM query has already
    been performed on the E.164 number by a previous VoIP network element. Equally,
    if a VoIP network element sends such an URI, it asserts that an ENUM query has
    been carried out on this number.</p>
