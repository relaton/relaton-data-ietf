  content: |-
    <p>This document describes the CONNECT-IP HTTP method.  CONNECT-IP is
       similar to CONNECT-UDP, but allows transmitting IP packets, without
       being limited to just TCP like CONNECT or UDP like CONNECT-UDP.</p>
