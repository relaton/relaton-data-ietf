abstract:
- language: en
  script: Latn
  content: "<p>This document describes a simple and efficient mechanism that can be
    used to detect data plane failures in Multi-Protocol Label Switching Label Switched
    Paths that extend beyond a single Autonomous System and/or across multiple Service
    Provider network boundaries. This document describes extensions to the existing
    MPLS LSP Ping protocol to achieve these goals.</p>"
