abstract:
- language: en
  script: Latn
  content: "<p>This memo proposes a scheme that supports a fast handover effectively
    in Proxy Mobile IPv6 by optimizing the associated data and signaling flows during
    the handover. New signaling messages, Fast PBU and Reverse PBU, are defined and
    utilized to expedite the handover procedure.</p>"
