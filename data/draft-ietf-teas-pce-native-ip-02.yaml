abstract:
- language: en
  script: Latn
  content: "<p>This document defines the CCDR framework for traffic engineering within
    native IP network, using Dual/Multi-BGP session strategy and PCE-based central
    control architecture. The proposed central mode control framework conforms to
    the concept that defined in [RFC8283]. The scenario and simulation results of
    CCDR traffic engineering is described in draft [I-D.ietf-teas-native-ip-scenarios].</p>"
