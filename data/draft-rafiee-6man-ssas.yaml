abstract:
- language: en
  script: Latn
  content: "<p>Since performance and security are, both, two important criteria for
    a mechanism to be widely used by different nodes with various resources, the purpose
    of this document is to propose a mechanism for local security and to prevent IP
    spoofing. This mechanism also consider user's privacy.</p>"
