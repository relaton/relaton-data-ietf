abstract:
- language: en
  script: Latn
  content: "<p>This documents defines a new response code, namely 495 (URI-List Handling
    Refused), for the Session Initiation Protocol (SIP). This new response code can
    used by URI-list servers that do not want to handle an incoming URI-list (e.g.,
    due to local policy). For example, a URI-list server may not want to handle a
    URI-list when an incoming SIP request carries a URI-list inside a URI-list. The
    URI- list server may not want to handle that particular embedded URI-list.</p>"
