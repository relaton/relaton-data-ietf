abstract:
- language: en
  script: Latn
  content: "<p>This memo describes how GMPLS signaling may be applied to Provider
    Backbone Transport (PBT) or configured Ethernet switches in order to establish
    Ethernet P2P and P2MP MAC switched paths and P2MP VID based trees. This utilizes
    a domain wide label for maintaining unique Ethernet capabilities combined with
    GMPLS control.</p>"
