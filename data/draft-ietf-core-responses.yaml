abstract:
- language: en
  script: Latn
  content: "<p>In CoAP as defined by RFC 7252, there is generally one response for
    each request. Various CoAP extensions have individually relaxed that practice.
    The present memo presents a generalized model beyond 1:1 responses, describes
    different forms in which it can be used, and introduces new CoAP Options that
    make use of that model. Beyond that, this document provides implementation guidance
    to simplify prior extensions, and outlines future possibilities of using it. //
    This revision -01 has been created as discussion input for IETF // 126. It makes
    a first attempt to sort the proposals into short- // term actionable ones and
    more long-term considerations for more // kinds of responses that could help additional
    use cases through // future work.</p>"
