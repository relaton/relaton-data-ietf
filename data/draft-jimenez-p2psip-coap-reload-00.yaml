abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Constrained Application Protocol (CoAP) Usage
    for REsource LOcation And Discovery (RELOAD). The CoAP Usage provides the functionality
    to federate Wireless Sensor Networks (WSN) in a peer-to-peer fashion. The CoAP
    Usage also provides a rendezvous service for CoAP Nodes and caching of sensor
    information. The RELOAD AppAttach method is used to establish a direct connection
    between nodes through which CoAP messages are exchanged.</p>"
