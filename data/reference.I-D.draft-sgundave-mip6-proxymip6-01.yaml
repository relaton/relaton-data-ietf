abstract:
- language: en
  script: Latn
  content: "<p>This specification describes a network-based mobility management protocol.
    It is called Proxy Mobile IPv6 (PMIPv6) and is based on Mobile IPv6. This protocol
    is for providing mobility support to any IPv6 host within a restricted and topologically
    localized portion of the network and with out requiring the participation of the
    host in any mobility related signaling.</p>"
