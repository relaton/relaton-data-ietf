abstract:
- language: en
  script: Latn
  content: "<p>Organizations running multiple directory servers need an ability for
    administrators to determine who is responsible for a particular server. An attribute,
    conceptually similar to the 'sysContact' object of SNMP, is defined which can
    retrieved from the directory server using the Lightweight Directory Access Protocol.</p>"
