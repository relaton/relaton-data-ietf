abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Programming Methodology Framework, also
    known as the PMF methodology. The methodology is based on the manifesto written
    by Zed A. Shaw [PROGRAMMING-MF-MANIFESTO], which describes a natural approach
    to software engineering with a strong focus on the act of programming. The PMF
    methodology uses a neutral name to provide a non-partisan reference for official
    engineering or project documents describing one of the most widely used software
    engineering methodologies.</p>"
