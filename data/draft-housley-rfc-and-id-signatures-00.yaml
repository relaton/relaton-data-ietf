abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the conventions for digital signatures on RFCs
    and Internet-Draft documents. For most file types, the Cryptographic Message Syntax
    (CMS) is used to create a detached signature, which is stored in a separate companion
    file so that no existing utilities are impacted by the addition of the digital
    signature. For Portable Document Format (PDF) files types, embedded signatures
    are supported. This document (once approved) obsoletes RFC 5485.</p>"
