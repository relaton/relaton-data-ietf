abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes IS-IS Multi Topology (MT) applicability in various
    IS-IS deployments. This document explores the nuances around the terminology and
    usage of various IS-IS address families, topologies with different considerations,
    for choosing the right combination for a specific deployment scenario. This document
    also discusses various ways one can deploy IPv6 only IS-IS topology.</p>"
