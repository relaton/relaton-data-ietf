- language: en
  script: Latn
  content: "<p>This document describes the SMTP option for Email related configuration
    information in Dynamic Host Configuration Protocol for IPv6 (DHCPv6). The purpose
    of the DHCPv6 option for Simple Mail Transfer Protocol (SMTP) Server addresses
    is to route SMTP messages throughout the Internet to a mail server.</p>"
