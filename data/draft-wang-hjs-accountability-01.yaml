abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Human Judgment Structure (HJS), a minimal
       and infrastructure‑grade accountability layer for AI agents, built on
       the Judgment Event Protocol (JEP) [draft-wang-jep-judgment-event-protocol-01].
       HJS provides a cryptographic mechanism to manage and verify
       responsibility for AI agent judgment behaviors across heterogeneous
       platforms.  Its core design consists of four primitives (Judge,
       Delegate, Terminate, Verify) inherited from JEP, a minimal receipt
       structure with responsibility chaining, and a three‑tier privacy
       architecture for accountability governance.  All advanced features
       (state machines, compliance proofs, governance mechanisms) are defined
       as optional extensions or informative appendices, preserving the
       structure’s narrow‑waist stability and compatibility with JEP.</p>
