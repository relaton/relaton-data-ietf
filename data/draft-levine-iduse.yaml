abstract:
- language: en
  script: Latn
  content: "<p>This memo updates the way that Internet-Drafts are used in the Internet
    Standards Process. Rather than expiring, Internet-Drafts are marked Active or
    Inactive. Also, the rules for referencing Internet-Drafts in other documents are
    clarified.</p>"
