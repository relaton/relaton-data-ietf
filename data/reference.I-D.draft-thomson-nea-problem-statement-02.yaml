abstract:
- language: en
  script: Latn
  content: "<p>Architectures have been implemented in the industry to assess the software
    or hardware configuration of endpoint devices for the purposes of monitoring or
    enforcing compliance of endpoints to an organization's policy on access to the
    network. While these architectures share common components and interfaces to support
    network endpoint assessment, these components are not interoperable because not
    all required protocols are standards. This document describes the problem these
    architectures are intending to address, defines common terminology and concepts,
    and identifies interfaces that are candidates for standardization.</p>"
