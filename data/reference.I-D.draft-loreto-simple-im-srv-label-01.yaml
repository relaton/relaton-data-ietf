abstract:
- language: en
  script: Latn
  content: "<p>This document registers with the IANA a new Instant Messaging SRV Protocol
    Label for SIP/SIMPLE protocol as specified in Address Resolution for Instant Messaging
    and Presence.  This SRV Protocol Label indicates SIP/SIMPLE protocol as a protocol
    that will be used to instantiate the instant messaging or presence operations.</p>"
