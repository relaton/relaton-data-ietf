abstract:
- language: en
  script: Latn
  content: <p>This document specifies a revision of the IANA registry for Enumservices,
    describes corresponding registration procedures, and provides a guideline for
    creating Enumservices and its Registration Documents. Registration of Enumservices
    is now handled using the "Expert Review" process.  A Registration Document containing
    the specification of the Enumservice is required.  However, contrary to earlier
    registration procedures, said Registration Document does not necessarily need
    to be promoted to RFC status.</p>
