abstract:
- language: en
  script: Latn
  content: "<p>The Host Identity Protocol is a signaling protocol for secure communication,
    mobility, and multihoming by introducing a cryptographic namespace.  This document
    specifies an extension for HIP that enables middleboxes to unambiguously verify
    the identities of hosts that communicate across them.  This extension enables
    middleboxes to verify the liveness and freshness of a HIP association and, thus,
    enables reliable and secure access control in middleboxes.</p>"
