abstract:
- language: en
  script: Latn
  content: "<p>Documents in the RFC series normally use only plain-text ASCII characters
    and a fixed-width font.  However, there is sometimes a need to supplement the
    ASCII text with graphics or picture images. The historic solution to this requirement,
    allowing secondary PDF and Postscript files, is seldom used because it is awkward
    for authors and publisher.  This memo sugests a more convenient scheme for attaching
    authoritative diagrams, illustrations, equations or other graphics to RFCs.</p>"
