abstract:
- language: en
  script: Latn
  content: |-
    <p>This document outlines the DSCP Notification Payload, which, during a
       CREATE_CHILD_SA Exchange, explicitly indicates the DSCP code points
       that will be encapsulated in the newly established tunnel.  This
       document updates RFC 4301.</p>
