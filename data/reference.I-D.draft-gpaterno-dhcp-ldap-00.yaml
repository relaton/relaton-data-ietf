abstract:
- language: en
  script: Latn
  content: "<p>This document defines two new DHCP options for delivering configuration
    information for LDAP services. The first option defines a list of the closest
    LDAP servers for the client, while the second one deliver the base distinguished
    name of the LDAP tree. These options delivers enough LDAP information to enable
    the client to authenticate users and perform LDAP address lookup to the closest
    available LDAP server.</p>"
