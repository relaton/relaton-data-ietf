abstract:
- language: en
  script: Latn
  content: "<p>The IETF has standardized various aspects of placing emergency calls.
    This document describes how all of those component parts are used to support emergency
    calls from citizens and visitors to authorities. This document is not an Internet
    Standards Track specification; it is published for informational purposes.</p>"
