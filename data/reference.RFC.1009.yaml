abstract:
- language: en
  script: Latn
  content: "<p>This RFC summarizes the requirements for gateways to be used between
    networks supporting the Internet protocols.  This document is a formal statement
    of the requirements to be met by gateways used in the Internet system.  As such,
    it is an official specification for the Internet community.</p>"
