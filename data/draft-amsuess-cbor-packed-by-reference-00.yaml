abstract:
- language: en
  script: Latn
  content: "<p>Packed CBOR is a compression mechanism for Concise Binary Object Representation
    (CBOR) that can be used without a decompression step. This document introduces
    a means for setting up its tables by means of dereferencable identifiers, and
    introduces a pattern of using it without sending long identifiers.</p>"
