abstract:
- language: en
  script: Latn
  content: "<p>This document revises RFC 2132 to reclassify DHCPv4 option codes 128
    to 223 (decimal) as publicly defined options to be managed by IANA in accordance
    with RFC 2939. This document directs IANA to make these option codes available
    for assignment as publicly defined DHCP options for future options.</p>"
