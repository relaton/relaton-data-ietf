abstract:
- language: en
  script: Latn
  content: "<p>Diameter is being increasingly included in the work of other standards
    organizations and has become a key protocol in many architectures. One of the
    uses of Diameter includes setting and maintaining hard-state and soft-state during
    failover and in the event of delayed refresh messages respectively. Often there
    is a need to query for information on active sessions for backup or synchronization
    purposes.</p>"
