abstract:
- language: en
  script: Latn
  content: "<p>This document defines generalized procedures that allow BGP speakers
    to exchange Route Target reachability information. This information can be used
    to precisely control the propagation of different kinds of Virtual Private Network
    (VPN) routing information. This method avoids unnecessary advertising of VPN routes
    when more than one kind of VPN is deployed in the network.</p>"
