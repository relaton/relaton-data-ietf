abstract:
- language: en
  script: Latn
  content: "<p>The Call Processing Language (CPL) is a language that can be used to
    describe and control Internet telephony services. It is designed to be implementable
    on either network servers or user agent servers. It is meant to be simple, extensible,
    easily edited by graphical clients, and independent of operating system or signalling
    protocol. It is suitable for running on a server where users may not be allowed
    to execute arbitrary programs, as it has no variables, loops, or ability to run
    external programs. This document is a product of the IP Telephony (IPTEL) working
    group of the Internet Engineering Task Force. Comments are solicited and should
    be addressed to the working group's mailing list at iptel@ietf.org and/or the
    authors.</p>"
