abstract:
- language: en
  script: Latn
  content: "<p>This draft describes how the LISP mapping system can be distributed
    for scale, decentralized for management and maintain trust among data-plane nodes.
    The intended status for this document is Informational RFC and should be used
    by LISP-Decent implementations to interoperate with each other.</p>"
