abstract:
- language: en
  script: Latn
  content: "<p>This document describes a TRILL based DCI solution using VTSD. VTSD
    (Virtual TRILL Service/Switch Domain) is specified in [draft-VTSD]. This draft
    describes the advantages provided by a TRILL based DCI solution over an existing
    MPLS L2VPN solution, advantages such as bandwidth scaling and providing multiple
    active pseudowires.</p>"
