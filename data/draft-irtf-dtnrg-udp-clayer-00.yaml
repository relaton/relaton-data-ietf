abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the use of the User Datagram Protocol (UDP)
    as a method for transporting DTN protocol data over the Internet. The specification
    covers both the use of UDP as a convergence layer for the Bundle Protocol as well
    as the use of UDP to carry LTP segments.</p>"
