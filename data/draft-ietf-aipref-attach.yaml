abstract:
- language: en
  script: Latn
  content: "<p>Methods are defined for associating usage preferences with content
    that is obtained using the HTTP protocol. This document defines attachment methods
    using the Robots Exclusion Protocol and HTTP header fields. This document updates
    RFC 9309 to allow for the inclusion of usage preferences.</p>"
