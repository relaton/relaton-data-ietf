abstract:
- language: en
  script: Latn
  content: "<p>There are a variety of intermediate devices in the Internet today\nthat
    require application intelligence for their operation. \nDatagrams pertaining to
    real-time streaming applications such\nas SIP and H.323 and peer-to-peer applications
    such as Napster \nand NetMeeting cannot be identified by merely examining packet\nheaders.</p>"
