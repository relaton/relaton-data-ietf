abstract:
- language: en
  script: Latn
  content: "<p>This document focuses on the monitoring aspects of the flow-based Network
    Security Functions (NSFs).  The NSF Capability interface between the Service Provider's
    management system (or Security Controller) and the NSFs is meant to enforce the
    required monitoring capability.</p>"
