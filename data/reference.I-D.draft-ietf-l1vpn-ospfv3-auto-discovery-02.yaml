- language: en
  script: Latn
  content: "<p>This document defines an Open Shortest Path First (OSPF) version 3
    based Layer-1 Virtual Private Network (L1VPN) auto-discovery mechanism.  This
    document parallels the existing OSPF version 2 L1VPN auto-discovery mechanism.
    \ The notable functional difference is the support of IPv6.</p>"
