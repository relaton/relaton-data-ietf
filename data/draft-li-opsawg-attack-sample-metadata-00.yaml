abstract:
- language: en
  script: Latn
  content: "<p>Operational analysis, troubleshooting, validation of network defense\n   functions, and exchange of collected traffic evidence rely on attack\n   samples that are consistently described and can be processed across\n   operators, vendors, and research tools.  Today, such samples are\n   often represented by proprietary labels, partial traffic captures,\n   flow exports, log bundles, or local database schemas, which makes\n   comparison, reproduction, and automated processing difficult.\n\n   This document defines a YANG data model for network attack sample\n   metadata.  The model describes the sample identity, collection\n   context, attack characteristics, data-content summary, anonymization\n   status, and reproducibility information associated with packet, flow,\n   session, log, or payload data.  The model is intended to complement\n   IPFIX, IODEF, PCAP/PCAPng-based operational data, and collected data\n   manifests by defining metadata for the attack sample itself.</p>"
