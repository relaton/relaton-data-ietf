abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an experimental portion of the Management Information
    Base (MIB) for use with network management protocols in the Internet community.
    In particular, it describes an interface for configuring and controlling a flexible
    SNMP dual-role entity, also referred to as a Mid-Level-Manager (MLM).</p>"
