abstract:
- language: en
  script: Latn
  content: "<p>The RFC Editor performs a number of functions that may be carried out
    by various persons or entities.  The RFC Editor model described in this document
    divides the responsibilities for the RFC Series into four functions: The RFC Series
    Editor, the Independent Submission Editor, the RFC Production Center, and the
    RFC Publisher.  The function of the Independent Submission Editor is defined here.
    \ The IAB oversight by way of delegation to the RFC Series Oversight Board is
    described.  This document reflects 1 year of experience with RFC Editor Model
    version 1.</p>"
