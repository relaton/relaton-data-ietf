- language: en
  script: Latn
  content: "<p>This specification defines a document format for media properties of
    Session Initiation Protocol (SIP) sessions, such as the codecs or media types
    to be used. This format can used to define media properties in SIP user agent
    profile data sets and SIP session policies. It extends the Schema for SIP User
    Agent Profile Data Sets.</p>"
