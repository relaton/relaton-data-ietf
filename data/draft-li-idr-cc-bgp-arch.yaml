abstract:
- language: en
  script: Latn
  content: "<p>As the Software Defined Networks (SDN) solution develops, BGP is extended
    to support central control. This document introduces an architecture of using
    BGP for central controlling. Some use cases under this new framework are also
    discussed. For specific use cases, making necessary extensions in BGP are required.</p>"
