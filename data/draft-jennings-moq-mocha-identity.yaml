abstract:
- language: en
  script: Latn
  content: "<p>This document specifies identity, authentication, authorization, and
    federation for MOCHA (MoQ Open Communication &amp; Hosting Architecture). It defines
    how users authenticate with Identity Providers (IdPs), how authorization tokens
    (C4M and Privacy Pass) are issued and validated at relays, how permissions map
    to MOQT namespaces, and how users from one Provider obtain access to resources
    on a federated Provider.</p>"
