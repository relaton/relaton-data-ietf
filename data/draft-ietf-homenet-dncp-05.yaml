abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Distributed Node Consensus Protocol (DNCP),
    a generic state synchronization protocol which uses Trickle and Merkle trees.
    DNCP is transport agnostic and leaves some of the details to be specified in profiles,
    which define actual implementable DNCP based protocols.</p>"
