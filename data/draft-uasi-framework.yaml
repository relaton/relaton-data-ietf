abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Universal Authenticated Sender Identity\n   (UASI) framework, a protocol-agnostic mechanism for cryptographic\n   sender identity assertion and verification across Internet\n   communication protocols. UASI provides a unified method by which\n   any sending entity -- whether a mail server, an API endpoint, an\n   IoT device, or a messaging service -- can assert its identity in a\n   manner that receivers can independently verify using DNS-anchored\n   trust. The framework is designed to be incrementally deployable,\n   backwards-compatible with existing authentication mechanisms, and\n   simple enough to encourage default-on adoption.</p>"
