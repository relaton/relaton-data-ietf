abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Proactive Self-Healing Mesh Protocol (PSHMP),
    a decentralized overlay transport architecture designed to improve resilience
    and availability in distributed IP networks. PSHMP operates as an L4-oriented
    overlay above existing IP infrastructure. It continuously evaluates path quality
    and proactively reconstructs routes before degradation becomes service- impacting.
    The architecture combines decentralized topology discovery, adaptive path selection,
    batch acknowledgements, and transport abstraction to provide reliable communication
    under unstable network conditions without requiring modifications to underlying
    IP routing. This document presents the protocol architecture, design principles,
    and an overview of an experimental implementation. It does not specify an Internet
    Standard.</p>"
