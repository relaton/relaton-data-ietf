abstract:
- language: en
  script: Latn
  content: "<p>This document sets out some key terms that are fundamental to a common
    understanding of network incident and problem management within the IETF. The
    purpose of this document is to bring clarity to discussions and other work related
    to network incident and problem management in particular YANG models and management
    protocols that report, make visible, or manage network incidents and problems.</p>"
