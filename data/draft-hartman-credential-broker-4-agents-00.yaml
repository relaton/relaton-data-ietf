abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a Credential Broker for Agents (CB4A). a\n   credential vaulting and brokering architecture that mediates AI agent\n   access to API credentials.  Agents never hold real long-lived\n   credentials.  Instead, they receive short-lived, narrowly scoped,\n   auditable proxy credentials issued by a broker that separates policy\n   decisions from credential delivery.  The architecture addresses the\n   \"credential sprawl\" risk inherent in agentic AI, where agents\n   aggregating access across many services become high-value compromise\n   targets.\n\n   CB4A builds on SPIFFE/SPIRE for workload identity, uses a Policy\n   Decision Point / Credential Delivery Point separation inspired by\n   NIST SP 800-207, and employs DPoP (RFC 9449) for sender-constrained\n   token binding.  The specification defines three credential proxy\n   models, a tiered approval framework, and a comprehensive threat model\n   with ten identified threats and their mitigations.</p>"
