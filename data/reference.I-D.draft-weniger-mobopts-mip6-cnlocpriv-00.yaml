abstract:
- language: en
  script: Latn
  content: "<p>This draft discusses the problem and proposes a solution for simultaneous
    optimized routing and correspondent node-targeted location privacy for Mobile
    IPv6. The solution utilizes the MIPv6 bootstrapping mechanisms for the split scenario
    and requires only changes to the mobile node operation.</p>"
