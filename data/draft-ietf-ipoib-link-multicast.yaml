abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a method for setting up IP subnets and\nmulticast services over InfiniBand(TM) networks. Discussions in this\ndocument are applicable to both IPv4 and IPv6, unless explicitly\nspecified. A separate document will cover unicast and encapsulation\nof IP datagrams over InfiniBand networks.</p>"
