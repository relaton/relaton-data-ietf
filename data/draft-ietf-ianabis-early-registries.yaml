abstract:
- language: en
  script: Latn
  content: "<p>This memo describes the requirements for establishing an IANA registry
    before the IETF Stream document that creates the registry is approved for publication
    as an RFC. This process can be used when an IETF working group needs to coordinate
    allocations among multiple documents or with an organization outside the IETF.</p>"
