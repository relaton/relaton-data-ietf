abstract:
- language: en
  script: Latn
  content: "<p>This document defines a portion of the Management Information Base
    (MIB) module for use with network management protocols in the Internet community.
    In particular, it describes objects used for managing the Line Code Specific parameters
    of Very High Speed Digital Subscriber Line (VDSL) interfaces using Single Carrier
    Modulation (SCM) Line Coding. It is an optional extension to the VDSL-LINE CORE
    MIB RFC XXXX [RFCXXXX] which handles the line code independent objects.</p>"
