abstract:
- language: en
  script: Latn
  content: "<p>This document describes a general and flexible TLV (type-length-value
    structure) for representing cryptographic signatures as well as timestamps, using
    the generalized MANET packet/message format [RFC5444].  It defines two Message
    TLVs and two Packet TLVs, for affixing a cryptographic signature and a timestamp
    to a packet and message, respectively.</p>"
