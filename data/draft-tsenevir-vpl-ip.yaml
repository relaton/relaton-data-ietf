abstract:
- language: en
  script: Latn
  content: "<p>This document presents a port based Virtual Private LAN services solution
    for IP only data networks. Address Resolution Protocol (ARP) is extended to discover
    the hardware addresses of the remote devices. The service provider edge (PE) devices
    perform packet forwarding using the Layer 2 addresses of the end stations.</p>"
