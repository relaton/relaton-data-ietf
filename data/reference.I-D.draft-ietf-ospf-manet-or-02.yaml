abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to OSPF to support mobile ad hoc
    networks (MANETs).  The extension, called OSPF-OR, includes a mechanism for link-local
    signaling, a OSPF-MANET interface, a simple technique to reduce the size of Hello
    packets by only transmitting incremental state changes, and a method for optimized
    flooding of routing updates. It also provides a means to reduce unnecessary adjacencies
    to support larger MANET networks.</p>"
