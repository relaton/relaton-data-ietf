- language: en
  script: Latn
  content: "<p>This draft gives a comprehensive overview on open OAuth security topics.
    It is intended to serve as a working document for the OAuth working group to systematically
    capture and discuss these security topics and respective mitigations and eventually
    recommend best current practice and also OAuth extensions needed to cope with
    the respective security threats.</p>"
