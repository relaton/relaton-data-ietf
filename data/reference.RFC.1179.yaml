abstract:
- language: en
  script: Latn
  content: <p>This RFC describes an existing print server protocol widely used on
    the Internet for communicating between line printer daemons (both clients and
    servers).  This memo is for informational purposes only, and does not specify
    an Internet standard.  Please refer to the current edition of the "IAB Official
    Protocol Standards" for the standardization state and status of this protocol.</p>
