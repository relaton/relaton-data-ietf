abstract:
- language: en
  script: Latn
  content: "<p>This document defines an IPv4 DHCP Option and related methods to allocate
    the same IPv4 address to multiple nodes by sharing the available port space. These
    options can be used in the context of port range-based solutions (port range delegation)
    or NAT-based ones (port delegation or port forwarding).</p>"
