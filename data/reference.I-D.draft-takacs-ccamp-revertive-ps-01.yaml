abstract:
- language: en
  script: Latn
  content: "<p>RSVP-TE recovery extensions are specified in [RFC4872] and [RFC4873].
    Currently these extensions cannot signal request for revertive protection to the
    remote endpoint.  This document defines a new bit to signal this request and two
    new fields to specify a wait-to- restore and hold-off intervals.</p>"
