abstract:
- language: en
  script: Latn
  content: "<p>To support flow mobility in PMIPv6, the Mobile Node's Home Network
    Prefix should be able to be shared across its attachments and the network should
    support flow-based routing.  This document specifies how to extend PMIPv6 to meet
    these requirements.</p>"
