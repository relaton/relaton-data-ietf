- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes managed objects for modeling the Control And Provisioning of Wireless
    Access Points (CAPWAP) Protocol for 802.11 wireless binding.</p>"
