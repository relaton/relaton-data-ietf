abstract:
- language: en
  script: Latn
  content: "<p>This document describes iQUIC (Independent QUIC), an experimental operational
    profile for HTTP/3 over QUIC. iQUIC aims to reduce aggressive application-level
    multiplexing behavior commonly associated with HTTP/3 deployments while preserving
    compatibility with QUIC, TLS 1.3, and HTTP/3 semantics. Instead of removing mandatory
    HTTP/3 internal streams, iQUIC limits concurrent application requests per QUIC
    connection and encourages the use of multiple independent QUIC keep-alive sessions.</p>"
