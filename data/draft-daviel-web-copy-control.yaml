abstract:
- language: en
  script: Latn
  content: "<p>This memo describes a simple syntax for describing the copyright status
    of a World-Wide-Web document in a machine-readable way. When implemented in a
    Web browser it provides an unambiguous notification when permission must be sought
    to print or copy material obtained from the network.</p>"
