abstract:
- language: en
  script: Latn
  content: "<p>SAM is a generic mechanism for packets whose addresses are in an address
    family to traverse routing domains where this address family is not directly supported.
    \ Its topological scenarios are in the defined as mesh softwire class, i.e. with
    point to multipoint tunnels between border nodes so that packets never need to
    traverse softwire domains twice.  SAM exterior to interior address mappings are
    stateless, i.e; such that border nodes don't need to maintain states about other
    border nodes.  While 6to4, ISATAP, and 6rd, are already solutions for IPv6 tunnels
    across IPv4 domains, SAM supports all IPvX across IPvY combinations.  Also, to
    mitigate consequences of the IPv4 address shortage during the transition-to-IPv6
    period, SAM supports, for protocols that have ports to designate connection endpoints,
    port-extended IPv4 addresses.</p>"
