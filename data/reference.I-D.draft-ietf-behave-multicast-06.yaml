abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for a Network Address Translator
    (NAT) and Network Address and Port Translator (NAPT) that supports any-source
    multicast or single-source multicast. A multicast-capable NAPT device that adheres
    to the requirements of this document can optimize the operation of multicast applications
    that are generally unaware of multicast NAPT devices.</p>"
