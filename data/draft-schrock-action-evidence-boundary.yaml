abstract:
- language: en
  script: Latn
  content: |-
    <p>Consequential agent actions can cross identity, transport,
       authorization, policy, and execution systems.  Each system can
       produce a valid artifact while the executor still lacks a safe rule
       for joining the artifacts to the exact effect, consuming one-time
       authority, and handling an uncertain outcome.  This document defines
       the Action Evidence Boundary (AEB), an executor-side processing model
       for that lifecycle.

       AEB requires native artifact verification, exact-action binding, a
       relying-party authorization decision, stable replay identity, durable
       atomic consumption or reservation, provider entry, closed effect
       outcomes, and authenticated reconciliation.  CAID matching is used
       when independently encoded native representations must be joined.
       AEC is used when local policy requires multiple evidence legs.  A
       native authorization decision accepted and enforced by the effect-
       owning PEP does not require a second PDP.  AEB defines no receipt or
       token format, no policy language, no universal evidence taxonomy, and
       no new registry.  Native workload credentials, OAuth artifacts,
       AuthZEN decisions, AP2 mandates, message signatures, permits,
       authorization receipts, and status mechanisms retain their own
       semantics and verifiers.</p>
