abstract:
- language: en
  script: Latn
  content: "<p>GMPLS [2] is being considered as an extension to the MPLS framework
    to include optical, non-packet switched technologies. This draft reviews the motivation
    for doing so from an end-user’s perspective and points out some key requirements/impacts
    that this will have on the extensions to the routing and label distribution/signaling
    protocols.</p>"
