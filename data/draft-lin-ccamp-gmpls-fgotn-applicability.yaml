abstract:
- language: en
  script: Latn
  content: "<p>ITU-T Recommendation ITU-T G.709/Y.1331 (2020) Amd.3 (03/2024)\nintroduced new fine grain OTN (fgOTN) for the efficient transmission of\nsub-1G client signals.\n\nThis document reviews the fgOTN control plane requirements, examines\nthe applicability of using existing GMPLS control plane for fgOTN, and\nprovides the standard gap analysis and considerations on GMPLS\nextensions.</p>"
