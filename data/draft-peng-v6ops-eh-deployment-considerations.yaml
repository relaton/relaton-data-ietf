abstract:
- language: en
  script: Latn
  content: "<p>As more and more new services using IPv6 options have been proposed\n   and start being deployed in a large-scale network environment, issues\n   also start showing up in deployments.  This document describes and\n   analyzes the issues encountered, and aims to provide deployment\n   guidance when the IPv6 options are used.</p>"
