id: draftietfnetconfservermodel
schema_version: v1.5.6
formattedref:
  content: draft-ietf-netconf-server-model
title:
- language: en
  script: Latn
  content: NETCONF Server and RESTCONF Server Configuration Models
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-netconf-server-model-09
