abstract:
- language: en
  script: Latn
  content: "<p>There are several NAT64 and/or NAT46 proposals.  Each of them have
    recommended PREFIX64, which is used to represent IPv4 address in IPv6 address
    format.  Each of them have advantages and shortcomes. Therefore the preferable
    PREFIX64 would depends on the utilization scene.  This draft compares seven proposals
    for IPv6 and IPv4 coexistence.i</p>"
