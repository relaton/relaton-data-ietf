abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it defines a set of managed objects for SNMP-based management of the Radio Frequency
    (RF) interfaces for systems compliant with the Data Over Cable Service Interface
    Specifications (DOCSIS). This document revises and obsoletes RFC 2670. Please
    see section 6 for a description of the changes from RFC 2670. Note to RFC Editor
    (Remove this paragraph prior to publication) This memo is a product of the IPCDN
    working group within the Internet Engineering Task Force. Comments are solicited
    and should be addressed to the working group's mailing list at ipcdn@ietf.org
    and/or the author.</p>"
