- content: draft-ietf-roll-enrollment-priority
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>The Routing Protocol for Low-Power and Lossy Networks (RPL) manages
    the routing topology but lacks a mechanism to globally regulate how many new nodes,
    known as Pledges, can join a node in a 6TiSCH network at any given time. Currently,
    Join Proxies (6LowPAN Routers) make local decisions about whether to facilitate
    a Pledge's enrollment based only on their immediate resources. This document introduces
    RPL extensions to ensure that enrollment remains orderly, prevents localized congestion
    at specific Join Proxies, and allows the network to stay within its operational
    capacity limits.</p>"
  format: text/html
