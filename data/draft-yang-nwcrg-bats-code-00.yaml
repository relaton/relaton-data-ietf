- language: en
  script: Latn
  content: "<p>This document describe a BATS code scheme for communication through
    a multi-hop network. BATS code is a class of efficient linear network coding scheme
    with a matrix generalization of fountain codes as the outer code, and batch-based
    linear network coding as the inner code.</p>"
