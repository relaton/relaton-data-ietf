abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for an endpoint to explicitly signal
    encrypted metadata to the network, and the network to signal its ability to accommodate
    that metadata back to the endpoint. This mechanism can be used where the endpoints
    desire that network elements along the path receive these explicit signals.</p>"
