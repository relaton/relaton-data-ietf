title:
- language: en
  script: Latn
  content: A Common Operational Problem in DNS Servers - Failure To Respond.
  format: text/plain
docidentifier:
- content: draft-andrews-dns-no-response-issue
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2015-11-26'
abstract:
- language: en
  script: Latn
  content: "<p>The DNS is a query / response protocol. Failure to respond or to respond
    correctly to queries causes both immediate operational problems and long term
    problems with protocol development. This document identifies a number of common
    classes of queries to which some servers either fail to respond or else respond
    incorrectly. This document also suggests procedures for TLD and other similar
    zone operators to apply to help reduce / eliminate the problem. The document does
    not look at the DNS data itself, just the structure of the responses.</p>"
  format: text/html
