abstract:
- language: en
  script: Latn
  content: "<p>This document describes a schema and possible mechanism for distributed
    configuration of similar directory user agents. This document defines a schema
    for configuration of these DUAs that may be discovered using the Lightweight Directory
    Access Protocol. A set of attribute types and an objectclass are proposed, along
    with specific guidelines for interpreting them. A proposal of using attribute
    and objectclass mapping allows DUAs to re-configure their schema to that of the
    end user's environment. This document is intended to be a skeleton for future
    documents that describe configuration of specific DUA services.</p>"
