abstract:
- language: en
  script: Latn
  content: "<p>This document introduces EchoPulse, a Key Encapsulation Mechanism (KEM)
    designed for high efficiency and minimal resource usage, offering adaptive symbolic
    behavior and built-in resistance to replay and side-channel attacks. EchoPulse
    aims to serve as a viable lightweight PQC candidate.</p>"
