abstract:
- language: en
  script: Latn
  content: "<p>This document describes a gateway capability-directory framework for\n   the Internet of Agents (IoA) in deployments that use Agent Gateways.\n   In such deployments, a gateway-managed capability directory is a\n   necessary control-plane function for maintaining validated capability\n   information beyond transient advertisements, static endpoint\n   bindings, or external descriptions alone.  This document defines\n   requirements and a common object model for gateway-managed capability\n   information, including the Agent Capability Specification (ACS),\n   Capability Digest, and directory entry lifecycle.  It also specifies\n   synchronization, freshness, provenance, and validation requirements\n   for capability information exchanged across gateways.\n\n   This document clarifies the relationship between gateway-managed ACS\n   objects and externally published descriptions such as the A2A Agent\n   Card, and briefly compares this framework with broader distributed\n   directory-service approaches.  It does not define a discovery query\n   protocol, ranking algorithm, storage substrate, distributed lookup\n   algorithm, task orchestration protocol, or agent-to-agent session\n   protocol.  It can inform subsequent DMSC protocol work, including\n   capability digest synchronization and related gateway procedures.</p>"
