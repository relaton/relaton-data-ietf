abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an improvement to the PR-SCTP export specified
    in the IPFIX specifications in RFC5101. This method offers several advantages
    such as the ability to calculate Data Record losses for PR-SCTP, immediate export
    of Template Withdrawal Messages, immediate reuse of Template IDs within an SCTP
    stream, and reduced demands on the Collecting Process.</p>"
