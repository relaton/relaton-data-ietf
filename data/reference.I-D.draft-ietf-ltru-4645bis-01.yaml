abstract:
- language: en
  script: Latn
  content: "<p>This memo defines the procedure used to update the IANA Language Subtag
    Registry in conjunction with the publication of RFC 4646bis [RFC EDITOR NOTE:
    replace with actual RFC number], for use in forming tags for the identification
    of languages. As an Internet-Draft, it also contained a complete replacement of
    the contents of the Registry to be used by IANA in updating it. To prevent confusion,
    this material was removed before publication.</p>"
