abstract:
- language: en
  script: Latn
  content: "<p>This document outlines the functionality required for an HTTP-based
    P2P Streaming Tracker Protocol, including requirements, functional entities and
    architecture, components, message flows, with detailed message processing instructions
    using an HTTP/XML encoding, the respective parameters, methods, and message formats,
    formal syntax and semantics. The PPSP Tracker Protocol proposed in this document
    extends the capabilities of PPSP to support adaptive and scalable video and 3D
    video, for Video On Demand (VoD) and Live video services. The Tracker Protocol
    is an application-level protocol for peers to publish/request content, provide
    peer lists to peers and peer status to Trackers.</p>"
