  content: |-
    <p>This specification defines a profile for issuing OAuth 2.0 access
       tokens in JSON web token (JWT) format.  Authorization servers and
       resource servers from different vendors can leverage this profile to
       issue and consume access tokens in interoperable manner.</p>
