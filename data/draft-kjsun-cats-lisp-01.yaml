abstract:
- language: en
  script: Latn
  content: "<p>This document describes the usage of Locator/ID Separation Protocol
    (LISP) as a solution to implement Computing-Aware Traffic Steering (CATS). How
    LISP meets CATS requirements and how it fits to the control plane and data plane
    of CATS framework are presented.</p>"
