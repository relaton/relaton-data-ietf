abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Lightweight Directory Access Protocol (LDAP)
      No-Op control which can be used to disable the normal effect of an
      operation.  The control can be used to discover how a server might
      react to a particular update request without updating the directory.</p>
