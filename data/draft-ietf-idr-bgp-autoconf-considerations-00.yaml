abstract:
- language: en
  script: Latn
  content: "<p>This draft is an exploration of the requirements, the alternatives,
    and trade-offs in BGP peer auto-discovery at various layers in the stack. It is
    based on discussions in the IDR Working Group BGP Autoconf Design Team. The current
    target environment is the datacenter. This document is not intended to become
    an RFC.</p>"
