abstract:
- language: en
  script: Latn
  content: "<p>This document describes a proposal to segment an in-situ OAM domain
    in order to control the iOAM data overhead, adapt to the path MTU limitations,
    and enable new applications. We provide use cases to motivate our proposal and
    base the necessary modifications on the current in-situ OAM header format specification.</p>"
