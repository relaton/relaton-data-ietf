abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies a throttle mechanism for limiting the rate of Session
    Initiation Protocol (SIP) event notifications.  This mechanism can be applied
    in subscriptions to all SIP event packages, but the mechanism is especially designed
    to be used in combination with a subscription to a Resource List Server (RLS).</p>"
