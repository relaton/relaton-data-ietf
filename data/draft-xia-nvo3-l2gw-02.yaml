abstract:
- language: en
  script: Latn
  content: "<p>A Layer 2 Gateway (L2GW) is used for interconnecting a Layer 2 overlay
    network [NVO3FRWK] and a Layer 2 bridged network [IEEE802.1Q] to form a single
    Layer 2 virtual network. This draft describes data plane interconnection and control
    plane interworking at the L2GW.</p>"
