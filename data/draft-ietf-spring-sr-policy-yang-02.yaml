abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model for Segment Routing (SR)
       Policy that can be used for configuring, instantiating, and managing
       SR policies.  The model is generic and apply equally to the MPLS and
       SRv6 instantiations of SR policies.</p>
