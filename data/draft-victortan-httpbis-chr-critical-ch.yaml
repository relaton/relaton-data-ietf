- language: en
  script: Latn
  content: "<p>This document defines the Critical-CH HTTP response header to allow
    HTTP servers to reliably specify their Client Hint preferences. Discussion Venues
    This note is to be removed before publishing as an RFC. Source for this draft
    and an issue tracker can be found at https://github.com/Tanych/http-client-hint-reliability.</p>"
