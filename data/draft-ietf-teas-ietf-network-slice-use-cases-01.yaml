abstract:
- language: en
  script: Latn
  content: "<p>This document analyses the needs of potential customers of network
    slices realized with IETF techniques in several use cases, identifies the functionalities
    for the IETF Network Slice Service Interface of an IETF Network Slice Controller
    to satisfy such requests. This document is intended to provide motivation and
    support for work on YANG models for the IETF Network Slice Service interface.</p>"
