  script: Latn
  content: <p>This note discusses the process related to "individual submissions",
    publication of RFCs by finding a sponsoring Area Director to take it through IETF
    and Internet Engineering Steering Group (IESG) review. This note covers both the
    the processing in the IESG as well as guidance on when such sponsoring is appropriate.</p>
