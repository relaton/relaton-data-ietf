- language: en
  script: Latn
  content: "<p>This document specifies new IPv6 RADIUS attributes used to support
    IPv6 network access.  As IPv6 specifies two configuration mechanisms (DHCP and
    SLAAC), the new attributes are targeted at both protocols when that makes sense.</p>"
