  script: Latn
  content: "<p>This document serves to register a media type for the SMPTE Material
    Exchange Format (MXF). MXF, defined by SMPTE 377M, is a standard wrapper format
    developed for the interchange of audiovisual material, including both audiovisual
    essence and rich metadata.</p>"
