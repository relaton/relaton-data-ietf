abstract:
- language: en
  script: Latn
  content: "<p>Many application technologies enable a secure connection between two
    entities by means of Internet Public Key Infrastructure Using X.509 (PKIX) certificates
    in the context of Transport Layer Security (TLS). This document specifies best
    current practices for representing and verifying the identity of application services
    in such interactions.</p>"
