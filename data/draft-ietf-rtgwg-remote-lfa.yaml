abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to the basic IP fast reroute mechanism,
    described in RFC 5286, that provides additional backup connectivity for point-to-point
    link failures when none can be provided by the basic mechanisms.</p>"
