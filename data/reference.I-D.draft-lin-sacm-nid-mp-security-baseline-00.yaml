abstract:
- language: en
  script: Latn
  content: "<p>Network infrastructure devices such as routers, switches are important
    parts for network security.  This document describes security baseline for network
    infrastructure device management plane, with YANG output, to provide a minimum
    set of important security management features.  The security baselines for control
    plane, data plane, application layer and infrastructure layer of network infrastructure
    devices are described in [I-D. ietf-dong-sacm-nid-cp- security-baseline], [I-D.ietf-xia-sacm-nid-dp-security-baseline],
    [I- D.ietf-xia-sacm-nid-app-infr-layers-security-baseline], respectively.</p>"
