abstract:
- language: en
  script: Latn
  content: "<p>The Simple Two-Way Active Measurement Protocol (STAMP) and its optional
    extensions can be used for Edge-to-Edge (E2E) active measurements. In Situ Operations,
    Administration, and Maintenance (IOAM) data fields can be used for recording and
    collecting Hop-by- Hop (HBH) and E2E operational and telemetry information. This
    document extends STAMP to reflect MPLS extension headers, including MPLS Network
    Action Sub-Stacks and Post-Stack MPLS Headers, for HBH and E2E active measurements,
    for example, using the IOAM data fields.</p>"
