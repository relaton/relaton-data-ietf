abstract:
- language: en
  script: Latn
  content: "<p>This document specifies use of the BFD (Bidirectional Forwarding Detection)
    protocol in RBridge campuses based on the Rbridge Channel extension to the TRILL
    (TRansparent Interconnection of Lots of Links) protocol.  BFD is a widely deployed
    (Operations, Administration and Maintenance) OAM mechanism in IP and MPLS networks.
    \ However, in the present form a BFD packet cannot be sent over a TRILL network
    as it is either IP/ UDP encapsulated or encapsulated directly over Multi Protocol
    Label Switching (MPLS) or using Associated Channel Header (ACH) encapsulation.
    \ This document defines BFD encapsulation over TRILL to address this shortcoming.</p>"
