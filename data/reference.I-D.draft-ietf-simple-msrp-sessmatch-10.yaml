abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension, sessmatch, for the Message Session
    Relay Protocol (MSRP) session matching procedure of MSRP entities.  The extension
    extends the applicability of MSRP communication to network scenarios where Application
    Layer Gateway (ALG) functions modify the Session Description Protocol (SDP) MSRP
    address information.</p>"
