abstract:
- language: en
  script: Latn
  content: "<p>This document presents the concepts and the implementations of address-sharing
    stateless IVI (stateless 1:N IVI) and the address- sharing stateless double IVI
    (stateless 1:N dIVI).  The stateless 1:N IVI keeps the features of stateless,
    end-to-end address transparency and bidirectional-initiated communications of
    the original stateless 1:1 IVI, while it can utilize the IPv4 addresses more effectively.
    \ The stateless 1:N dIVI has above features and it does not require the DNS64/DNS46
    and ALG supports.</p>"
