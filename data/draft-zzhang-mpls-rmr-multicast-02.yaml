abstract:
- language: en
  script: Latn
  content: "<p>With Resilient MPLS Rings (RMR), although all existing multicast procedures
    and solutions can work as is, there are optimizations that could be done for RSVP-TE
    P2MP tunnel signaling and Fast-ReRouting for both mLDP and RSVP-TE P2MP tunnels.
    This document describes RMR multicast on a high level, with detailed protocol
    procedure for RSVP- TE P2MP optimizations specified in a separate document. This
    document also discusses end to end multicast when there are RMRs.</p>"
