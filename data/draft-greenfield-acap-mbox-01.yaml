  content: |-
    <p>IMAP [IMAP4] allows users to access the mail store in an efficient
       way, but has insufficient support to export detailed meta-level
       information about mailboxes, subscriptions, and multiple servers.
       The mailbox dataset provides a fast, flexible way of exporting this</p>
