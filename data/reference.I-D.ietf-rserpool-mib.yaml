abstract:
- language: en
  script: Latn
  content: "<p>Reliable Server Pooling (RSerPool) is a framework to provide reliable
    server pooling.  The RSerPool frameworks consists of the two protocols ASAP (Aggregate
    Server Access Protocol) and ENRP (Endpoint Handlespace Redundancy Protocol).  This
    document defines a SMIv2 compliant Management Information Base (MIB) module providing
    access to managed objects in an RSerPool implementation.</p>"
