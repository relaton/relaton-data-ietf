abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the PSI-04 Protocol, a cryptographic\n   framework for establishing the Proof of Stateful Integrity (PSI)\n   for data involving vulnerable subjects (e.g., Clinical Trial\n   participants, NDIS recipients, and Aged Care residents).  The\n   protocol mandates a verifiable \"Chain of State\" that prevents\n   post-hoc data manipulation by ensuring the final submission is\n   mathematically anchored to the point of inception.  PSI-04 utilizes\n   Ed25519 signatures canonicalized via RFC 8785 and verified through\n   a 3-node Multi-Party Computation (MPC) consensus mechanism.</p>"
