abstract:
- language: en
  script: Latn
  content: "<p>This document describes an algorithm for selecting the timestamps (TS
    value) used for TCP connections that use the TCP timestamp option, such that the
    resulting timestamps are monotonically-increasing across connections that involve
    the same four-tuple {local IP address, local TCP port, remote IP address, remote
    TCP port}.  The properties of the algorithm are such that it reduces the possibility
    of an attacker of guessing the exact value.  Additionally, it describes an algorithm
    for processing incoming SYN segments that allows higher connection-establishment
    rates between any two TCP endpoints when a TCP timestamps option is present in
    the incoming SYN segment.</p>"
