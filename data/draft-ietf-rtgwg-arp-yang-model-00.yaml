- language: en
  script: Latn
  content: "<p>This document defines a YANG data model to describe Address Resolution
    Protocol (ARP) configurations. The data model performs as a guideline for configuring
    ARP capabilities on a system. It is intended this model be used by service providers
    who manipulate devices from different vendors in a standard way.</p>"
