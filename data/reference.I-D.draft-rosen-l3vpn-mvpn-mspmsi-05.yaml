abstract:
- language: en
  script: Latn
  content: '<p>Specifications for a number of important topics were arbitrarily omitted
    from the initial MVPN specifications, so that those specifications could be "frozen"
    and advanced.  The current document provides some of the missing specifications.  The
    topics covered are: (a) Extending PE-PE PIM control mechanisms to support MPLS
    tunnels and IPv6 flows, (b) using Wild Card selectors to bind multicast data streams
    to tunnels, (c) using Multipoint-to-Multipoint Label Switched Paths as tunnels,
    (d) binding bidirectional customer multicast data streams to specific tunnels,
    (e) running PIM (i.e., sending and receiving multicast control traffic) over a
    set of tunnels that are created only if needed to carry multicast data traffic,
    (f) extranets, (g) support for anycast sources, (h) support for "hub and spoke"
    VPNs.</p>'
