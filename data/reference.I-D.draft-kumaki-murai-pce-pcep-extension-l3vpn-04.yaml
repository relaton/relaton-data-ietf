abstract:
- language: en
  script: Latn
  content: "<p>It is highly desirable for VPN customers to be able to dynamically
    establish their MPLS TE LSPs in the context of a BGP/MPLS IP-VPN. In such a scenario,
    it is advantageous to use PCE to calculate customer MPLS TE LSPs. This document
    defines PCEP extensions for BGP/MPLS IP- VPNs.</p>"
