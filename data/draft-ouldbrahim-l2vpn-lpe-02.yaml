  script: Latn
  content: "<p>Service Providers offer Virtual Private LAN Service (VPLS), also known
    as Transparent LAN Service (TLS), as part of their Layer 2 VPN offering. VPLS
    simulates an Ethernet Virtual 802.1d bridge for given set of customers across
    metro or wide area networks.</p>"
