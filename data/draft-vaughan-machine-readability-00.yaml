abstract:
- language: en
  script: Latn
  content: <p>The term "machine readable" is widely invoked when content usage preferences,
    rights, and legal terms are expressed for automated consumption, but it is rarely
    defined with enough precision to be actionable. This document distinguishes a
    series of properties (discoverability, parseability, interpretability, actionability,
    and verifiability) that together determine whether an expression of preferences
    or policy can be reliably acted upon by a non-human agent without human intervention.
    It applies these properties to the case of usage preferences and legal terms of
    service.</p>
