abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines YANG data models for Operations,
       Administration, and Maintenance (OAM) &amp; Management of Application-
       Layer Traffic Optimization (ALTO) Protocol.  The operator can use
       these data models to set up an ALTO server, create, update and remove
       ALTO information resources, manage the access control, configure
       server discovery, and collect statistical data.</p>
