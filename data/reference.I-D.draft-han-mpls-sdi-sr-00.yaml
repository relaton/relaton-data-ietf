abstract:
- language: en
  script: Latn
  content: "<p>This document describes the typical use cases for signal degrade indication
    used in SR over MPLS networks.  To satisfy the use cases and requirements of signal
    degrade indication, two extensions based on the BFD protocol and MPLS-TP OAM mechanisms
    are given respectively.</p>"
