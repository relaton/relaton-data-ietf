abstract:
- language: en
  script: Latn
  content: "<p>The IP Router Alert Option is an IP option that alerts transit routers
    to more closely examine the contents of an IP packet.  RSVP, PGM, IGMP/MLD and
    MRD are some of the protocols which make use of the IP Router Alert option.  This
    document discusses security aspects and common practices around the use of the
    current IP Router Alert option and discusses consequences on the use of IP Router
    Alert by existing or new applications.  Common practices in IP Router Alert implementation
    facilitating router protection are also discussed.</p>"
