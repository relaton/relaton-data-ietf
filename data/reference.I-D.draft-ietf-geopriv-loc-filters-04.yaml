abstract:
- language: en
  script: Latn
  content: <p>This document describes filters that limit asynchronous location notifications
    to compelling events, designed as an extension to RFC 4661 "An XML-Based Format
    for Event Notification Filtering".  The resulting location information is conveyed
    in existing location formats wrapped in the Presence Information Document Format
    (PIDF-LO).</p>
