  content: 'JSContact: Converting from and to vCard'
  format: text/plain
docidentifier:
- content: draft-ietf-calext-jscontact-vcard
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document defines how to convert contact information between the
    JSContact and vCard data formats. To achieve this, it updates RFC I- D.ietf-calext-jscontact
    (JSContact) by registering new JSContact properties. Similarly, it updates RFC
    6350 (vCard) by registering new vCard properties and parameters.</p>"
  format: text/html
