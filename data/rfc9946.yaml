abstract:
- language: en
  script: Latn
  content: "<p>This document addresses the problem of protocol support for measuring
    One-Way IP Capacity metrics specified by RFC 9097.  The Method of Measurement
    discussed in that RFC requires a feedback channel from the receiver to control
    the sender's transmission rate in near real-time.  This document defines the UDP
    Speed Test Protocol (UDPSTP) for conducting measurements as described in RFC 9097
    and other related measurements.</p>"
