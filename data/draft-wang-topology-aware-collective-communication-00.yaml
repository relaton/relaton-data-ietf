abstract:
- language: en
  script: Latn
  content: "<p>This document describes a topology-aware method for constructing collective
    communication schedules in distributed systems. Instead of selecting from a small
    set of predefined communication algorithms, the method expands a target network
    topology along a time dimension, tracks per-node data state, and incrementally
    builds a schedule through candidate-source discovery and link-to-chunk matching.
    The approach is intended for heterogeneous or asymmetric topologies in which fixed
    communication patterns often underutilize available links or create avoidable
    bottlenecks. According to the source material, the resulting schedule is intended
    for collective communication tasks involving data distribution, aggregation, reduction,
    and synchronization, including all-gather, reduce-scatter, and all- reduce.</p>"
