- language: en
  script: Latn
  content: "<p>This draft defines a DHCP-based scheme to enable dynamic discovery
    of Mobile IPv6 home agent address, home address, and home subnet. New DHCP options
    are defined to carry the information from a DHCP server to the DHCP client running
    on the mobile node.</p>"
