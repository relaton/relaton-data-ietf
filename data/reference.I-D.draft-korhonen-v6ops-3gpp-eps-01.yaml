abstract:
- language: en
  script: Latn
  content: "<p>The increased use of data services, growth of subscribers in 3GPP based
    mobile networks, and the impending exhaustion of available IPv4 addresses from
    the registries is driving the need to specify the transition to IPv6 solutions
    in 3GPP network architectures.  This document describes the support for IPv6 in
    3GPP network architectures and a solution to transition to IPv6 using a dual-stack
    approach.</p>"
