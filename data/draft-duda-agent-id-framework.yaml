abstract:
- language: en
  script: Latn
  content: "<p>We present an identity and delegation framework for secure AI agent\n   communications.  The framework introduces a set of entities including\n   Client AI Agents, Service AI Agents, Agent Providers, and Agent\n   Brokers, together with a Trustful Mutable Store responsible for\n   maintaining cryptographically verifiable identity bindings.  We\n   propose self-certifying identifiers derived from public keys,\n   realized as DNS-based Self-certifying Identifiers (SIDs) and IPFS-\n   based Identifiers (IIDs), which provide lightweight decentralized\n   identities for agents.  To support trust establishment, we\n   distinguish identity from trust and introduce a model that combines\n   globally meaningful names, cryptographic identities, and trusted\n   intermediaries such as Agent Providers and Agent Brokers.  We show\n   how DNS/DNSSEC and IPFS/IPNS can be used as distributed, highly\n   available, integrity-protected, and mutable infrastructures for\n   managing AI agent identities and trust metadata.</p>"
