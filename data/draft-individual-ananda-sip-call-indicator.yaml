- language: en
  script: Latn
  content: "<p>This document proposes an extension to the Session Initiation Protocol
    (SIP). This extension provides the ability for calling SIP User to specify the
    call urgency while originating a call and for called SIP user agent to identify
    that call is an 'Urgent' call.</p>"
