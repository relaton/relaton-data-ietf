abstract:
- language: en
  script: Latn
  content: "<p>A fast reroute framework for egress node protection is specified by
    [RFC8679]. But it cannot be applied to VXLAN EVPN directly. This document specifies
    a mechanism to apply Egress Node Protection to VXLAN EVPN nodes and apply Egress
    Link Protection to EVPN EAD/EVI routes.</p>"
