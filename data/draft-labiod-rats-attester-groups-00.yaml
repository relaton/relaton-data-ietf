abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension to the Remote Attestation Procedures
    architecture as defined in [RFC9334] by introducing the concept of Attester Groups.
    This extension aims to reduce computational and communication overhead by enabling
    collective attestation of devices with similar characteristics, thereby improving
    the scalability of attestation processes.</p>"
