abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces a URI scheme for Linked Identitites to be
       used in URI Attributes in OpenPGP keyrings compatible to [RFC4880]
       and [URIATTR].  A Linked Identity then links the keyring to a
       resource on the internet in a mutual and verifiable way.  The assumed
       authorization required to publish the resource forms a limited basis
       of trust for the key.</p>
