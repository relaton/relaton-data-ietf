abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a new Vendor-Specific suboption for the Dynamic\n   Host Configuration Protocol's (DHCP) relay agent information option.\n   The suboption allows a DHCP relay agent to include vendor-specific\n   information in DHCP messages it forwards, as configured by its\n   administrator.</p>"
