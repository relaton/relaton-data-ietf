abstract:
- language: en
  script: Latn
  content: |-
    <p>All domain names used in examples throughout this document use
       ".test" in accordance with RFC 2606.  In actual deployments, ".utxo"
       is used.

       This document specifies the UTXO Domain Name System (UTXO6-DNS), a
       decentralized naming protocol that maps .utxo domain names to
       blockchain UTXO (Unspent Transaction Output) endpoints and generates
       verifiable IPv6 Interface Identifiers (IIDs) using Verifiable Random
       Functions (VRFs).  The base protocol defines a new DNS RR type (UTXO,
       code 260), an EDNS0 option for capability discovery, and fallback
       mechanisms to coexist with legacy DNS, updating RFC 1034, RFC 1035,
       and RFC 7217.

       Additionally, this document defines an optional compliance overlay
       --- the Penetrating Regulation Node (PRN) extensions --- that can be
       deployed by regulated financial institutions to meet AML/CFT
       requirements, provide audit trails, and verify legal entity
       identities using GLEIF vLEI credentials.  The PRN extensions include
       optional regulatory attributes in UTXO RRs, a new PRNAUDIT RR type
       for daily audit summaries, a RESTful API (PRN-API) for regulatory
       dashboards, a 2-of-3 MPC threshold signature framework for audit
       integrity, and native vLEI integration.  This document also describes
       a transaction lifecycle compliance enforcement model (AnteHandler)
       and an application-layer policy format (AgentPolicyEnvelope) for
       declarative authorization.

       The PRN extensions are privacy-preserving (only Merkle roots and
       aggregated statistics are shared), decentralized (no central
       authority), and verifiable (audit summaries are jointly signed by
       independent auditing firms).

       *This document is published as an Experimental specification.* It is
       not an IETF standard and does not represent IETF consensus.  It is
       intended for informational purposes, to facilitate implementation
       experience, and to support early discussion within the DNSOP working
       group.  See Section 1 for details.

       *Note:* The AgentPolicyEnvelope JSON Schema (Appendix I) and the
       AnteHandler compliance enforcement model (Section 4) are application-
       layer constructs provided as informative examples.  They are not on
       the IETF standards track and are not subject to IETF consensus.
       Their inclusion in this document is intended to facilitate
       interoperability of experimental deployments.</p>
