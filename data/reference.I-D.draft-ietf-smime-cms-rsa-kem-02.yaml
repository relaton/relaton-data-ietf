abstract:
- language: en
  script: Latn
  content: "<p>The RSA-KEM Key Transport Algorithm is a one-pass (store-and-forward)
    mechanism for transporting keying data to a recipient using the recipient's RSA
    public key. This document specifies the conventions for using the RSA-KEM Key
    Transport Algorithm with the Cryptographic Message Syntax (CMS). This version
    (-02) updates the ASN.1 syntax to align with the latest draft of ANS X9.44 and
    ISO/IEC 18033-2, and adds material on Camillia algorirthm.</p>"
