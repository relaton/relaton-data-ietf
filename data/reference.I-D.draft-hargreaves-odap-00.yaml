abstract:
- language: en
  script: Latn
  content: "<p>This memo describes the Open Digital Asset Protocol (ODAP).  ODAP is
    intended for describing assets held on distributed ledgers in an open and interoperable
    format, session negotiation and message passing between gateways connecting disparate
    blockchain systems.</p>"
