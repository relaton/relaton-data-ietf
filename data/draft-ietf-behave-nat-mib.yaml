abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for devices implementing Network Address Translator (NAT) function. This MIB module
    may be used for monitoring of a device capable of NAT function. This document
    obsoletes RFC 4008.</p>"
