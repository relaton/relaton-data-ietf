- language: en
  script: Latn
  content: "<p>This draft provides a gap analysis for the Scalable Synchronization
    Networks (SCSN). The document provides an overview of the existing standardization
    work on synchronization solutions, and outlines some of the important features
    with regard to scalability that are still missing in current synchronization networks.</p>"
