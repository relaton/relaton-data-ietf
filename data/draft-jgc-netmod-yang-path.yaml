abstract:
- language: en
  script: Latn
  content: "<p>This document defines ypath (YANG path), a single-line, self- describing
    path format for referencing nodes in YANG schema trees, YANG instance data, and
    data filters. A ypath identifies YANG nodes using module-qualified names and list
    key predicates. The format is closely related to the YANG instance-identifier
    built-in type but additionally supports schema paths, filter wildcards, regular
    expression key matching, key value sets, and path enumeration.</p>"
