abstract:
- language: en
  script: Latn
  content: "<p>This document discusses how Ethernet VPN (E-VPN) technology is used
    to interconnect TRILL [TRILL] networks over an MPLS/IP network, with two key characteristics:
    C-MAC address transparency on the hand-off point and control-plane isolation among
    the interconnected TRILL networks.  Conventions</p>"
