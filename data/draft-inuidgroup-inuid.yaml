abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Internet Unique ID (INUID) protocol, a\n   128-bit network-layer protocol designed to decouple endpoint identity\n   from topological location.  INUID introduces a hierarchical\n   addressing model, fixed-size header layout, mandatory cryptographic\n   source verification, and explicit support for mobility and\n   multihoming without requiring upper-layer session re-establishment.\n\n   INUID is intended to address several persistent weaknesses in\n   contemporary internetworking, including inadequate source\n   authenticity, unsustainable routing table growth, and the operational\n   complexity of legacy transition mechanisms.  The protocol is designed\n   for efficient hardware forwarding, strong anti-spoofing guarantees,\n   and scalable inter-domain routing behavior.</p>"
