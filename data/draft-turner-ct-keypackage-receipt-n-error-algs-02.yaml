abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the conventions for using several
       cryptographic algorithms with the Cryptographic Message Syntax (CMS)
       key package receipt and error content types.  Specifically, it
       includes conventions necessary to implement SignedData,
       EnvelopedData, EncryptedData, and AuthEnvelopedData.</p>
