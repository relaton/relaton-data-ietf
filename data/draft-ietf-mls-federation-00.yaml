- language: en
  script: Latn
  content: "<p>This document describes how the Messaging Layer Security (MLS) can
    be used in a federated environment where different MLS implementations can interoperate
    by defining the message format for user key retrieval. The document also describes
    some use cases where federation could be useful.</p>"
