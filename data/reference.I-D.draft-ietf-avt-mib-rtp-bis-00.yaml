abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it defines objects for managing Real-Time Transport Protocol (RTP) systems (RFC3550)
    and is a proposed replacement for RFC 2959 - the RTP MIB.</p>"
