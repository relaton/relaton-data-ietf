abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this document is to make errata changes and adopt a
    proposal from Yoshifumi Nifida to slightly increase the minimum window size after
    Fast Recovery from one to two segments, to improve performance when the receiver
    uses delayed acknowledgments.  However, there is no change in the text of this
    version relative to RFC 3782.  Future revisions will contain the proposed changes.</p>"
