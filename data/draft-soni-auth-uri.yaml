abstract:
- language: en
  script: Latn
  content: "<p>This document describes an URI scheme capable of susbtituting userinfo
    in traditional URIs, in machine-to-machine contexts, allowing for the deprecation
    and, in some applications, complete elimination of userinfo from URIs. In particular,
    the nature of the proposed URI scheme makes it unsuitable for use in semantic
    attacks, without compromising legitimate use-cases.</p>"
