abstract:
- language: en
  script: Latn
  content: "<p>This document defines how the Session Initiation Protocol (SIP) conveys,
    or pushes, user location information from one SIP entity to another SIP entity.
    SIP Location Conveyance is always end to end, but sometimes the embedded location
    information can be acted upon by SIP Servers to direct where the message goes,
    based on where the user agent client is.</p>"
