abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the use of Curve25519 and Curve448 for
       ephemeral key exchange in the Transport Layer Security (TLS) and
       Datagram TLS (DTLS) protocols.  It updates RFC 5246 (TLS 1.2) and RFC
       4492 (Elliptic Curve Cryptography for TLS).</p>
