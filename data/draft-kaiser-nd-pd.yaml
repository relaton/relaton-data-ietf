abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to the Neighbor Discovery protocol
    (ND). The proposed extension enhances ND by providing it with a new option: the
    Prefix Delegation option (ND-PD). ND-PD offers the possibility for routers on
    a same link to ask for or delegate IPv6 prefixes.</p>"
