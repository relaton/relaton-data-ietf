abstract:
- language: en
  script: Latn
  content: <p>This document defines the ChaCha20 stream cipher as well as the use
    of the Poly1305 authenticator, both as stand-alone algorithms and as a "combined
    mode", or Authenticated Encryption with Associated Data (AEAD) algorithm.</p>
- language: en
  script: Latn
  content: "<p>This document does not introduce any new crypto, but is meant to serve
