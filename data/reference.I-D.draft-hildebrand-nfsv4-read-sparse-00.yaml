abstract:
- language: en
  script: Latn
  content: "<p>This document extends the NFSv4.1 protocol to support efficient reading
    of sparse files.  The number of sparse files is growing in the data center, most
    notably due to the increasing number of virtual disk images.  This simple extension
    provides an easy and efficient way for administrators to copy and manage these
    files without wasting disk space or transferring data unnecessarily.</p>"
