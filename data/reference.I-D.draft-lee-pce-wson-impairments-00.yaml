abstract:
- language: en
  script: Latn
  content: "<p>This memo provides application-specific requirements for the Path Computation
    Element communication Protocol (PCEP) for the support of Impairments in Wavelength
    Switched Optical Networks (WSON). From a path computation perspective, optical
    impairments are additional constraints on the process of determining an optical
    light path.</p>"
