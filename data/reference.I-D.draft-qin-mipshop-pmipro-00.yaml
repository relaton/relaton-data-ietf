abstract:
- language: en
  script: Latn
  content: "<p>This document defines route optimization protocol for PMIPv6. Proxy
    home test, concurrent proxy care-of test and handover procedures are explained.
    Proxy mobile agent uses cryptographically generated home addresses so that no
    more home test is needed after the initial home test. Handover home keygen token
    is used during handover in order to eliminate home test for the next proxy mobile
    agent. A different route optimization protocol is defined for inter-proxy mobile
    agent operation if the correspondent node is not Mobile IPv6 enabled.</p>"
