abstract:
- language: en
  script: Latn
  content: "<p>This document describes translation between IGMP and MLD.  This\n   allows single-stack multicast nodes to participate in multicast\n   groups from a different address family.  Both sending and receiving\n   is supported by this translation mechanism.  Both any-source and\n   source-specific multicast (ASM and SSM) are supported as well.</p>"
