abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes the current practices for handling TCP urgent
    data in the current Internet.  It describes how popular TCP implementations process
    urgent data, and also describes how a number of middle-boxes affect how urgent
    data is processed by end systems. Additionally, it includes a survey of the processing
    of urgent data by popular TCP implementations.  This document updates the relevant
    specifications such that they accommodate current practice in processing TCP urgent
    data.</p>"
