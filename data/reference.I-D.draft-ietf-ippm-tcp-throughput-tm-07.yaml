abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework for measuring sustained TCP throughput
    performance in an end-to-end managed network environment. This document is intended
    to provide a practical methodology to help users validate the TCP layer performance
    of a managed network, which should provide a better indication of end-user experience.
    \ In the framework, various TCP and network parameters are identified that should
    be tested as part of the network verification at the TCP layer.</p>"
