abstract:
- language: en
  script: Latn
  content: "<p>This document describes a set of Extension Headers for the Unidirectional
    Lightweight Encapsulation (ULE), RFC4326. The Extension Header formats specified
    in this document define extensions appropriate to both ULE and the Generic Stream
    Encapsulation (GSE) defined to support the second generation framing structure
    defined by Digital Video Broadcasting (DVB) family of specifications.</p>"
