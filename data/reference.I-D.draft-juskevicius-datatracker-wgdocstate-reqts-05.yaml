abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for new functionality to be added
    to the Datatracker tool to make it possible for IETF Working Group (WG) Chairs
    and their delegates to input and update the status of WG documents. After this
    functionality is implemented, WG Chairs, document authors and everyone else will
    have more visibility into the status and history of IETF stream documents from
    their earliest stages.</p>"
