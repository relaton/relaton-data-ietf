abstract:
- language: en
  script: Latn
  content: |-
    <p>The OAuth 2.0 public client utilizing Authorization Code Grant (RFC
       6749 - 4.1) is susceptible to the code interception attack.  This
       specification describes a mechanism that acts as a control against
       this threat.</p>
