abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a minimal standard by which a domain\n   designates, via a single DNS record, a Domain Authority (DA) as a\n   service endpoint accessible at a well-known HTTPS URI.  The DA\n   exposes five namespaces for capabilities beyond what DNS can natively\n   deliver: atomic record bundles, public key distribution, domain-\n   defined APIs, authenticated access, and private domain control\n   verification.\n\n   The standard is organized in three layers.  The Designation Layer\n   specifies how a domain publishes a DNS record that points to its DA.\n   The Retrieval Layer specifies the five namespaces through which\n   consumers access domain information.  The Trust Layer specifies how\n   consumers establish confidence in the DA and its responses.\n\n   The standard preserves full backward compatibility with existing DNS\n   resolution.  It requires no changes to DNS resolvers, no new DNS\n   record types, and no ecosystem-wide coordination.  Any domain can\n   adopt unilaterally and gain immediate operational benefit.</p>"
