abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an extension to the SMTP service whereby an SMTP
    client can know beforehand the reputation and whitelisting treatment for the messages
    that it is about to transmit.  By formalizing the trust that the receiving part
    grants to the sending one, using the VHLO command a sender recovers reliability
    at the expenses of flexibility.</p>"
