abstract:
- language: en
  script: Latn
  content: "<p>A requirement has been identified by the operator community for the
    transparent carriage of the MPLS network of one party over the MPLS network of
    another party.  This document describes an IETF- recommended method of satisfying
    this need using the existing RFC4448 PWE3 Ethernet pseudowire standard.</p>"
