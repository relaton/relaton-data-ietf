abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the problems related to fully mapping one name
    to another name.  With the emergence of internationalized domain names and new
    TLDs, two names may require to redirect one name space fully to another name space.
    \ Current DNS protocols have not provided such ability to satisfy these requirements.</p>"
