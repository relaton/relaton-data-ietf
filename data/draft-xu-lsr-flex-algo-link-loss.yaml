abstract:
- language: en
  script: Latn
  content: "<p>IGP Flexible Algorithms allow IGPs to compute constraint-based paths.
    Since link loss plays an important role in network evaluation, links with high
    packet loss rate should be bypassed during forwarding. This draft proposes a path
    computation method based on a link loss constraint to prune unsatisfied links
    in Flexible Algorithms.</p>"
