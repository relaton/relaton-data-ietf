abstract:
- language: en
  script: Latn
  content: "<p>The NetLMM protocol provides local mobility to the mobile node without
    requiring any modification of mobile node. The NetLMM domain provides this service
    by maintaining forwarding state for the mobile node's prefix. In case that the
    mobile node is a mobile router in the home network the NetLMM domain may not have
    the forwarding state for the mobile network prefix, so it can't forward packets
    from nodes within the mobile network, that is to say, existing NetLMM protocols
    do not consider mobile routers enough.</p>"
