abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the requirements and reference framework for
    Ethernet VPN (EVPN) Operations, Administration and Maintenance (OAM). The requirements
    cover the OAM aspects of EVPN and PBB-EVPN. The framework defines the layered
    OAM model encompassing the EVPN service layer, network layer and underlying Packet
    Switched Network (PSN) transport layer.</p>"
