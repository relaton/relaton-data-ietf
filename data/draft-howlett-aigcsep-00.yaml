abstract:
- language: en
  script: Latn
  content: |-
    <p>The Artificial Intelligence Governance Control and Service Exchange
       Protocol (AIGCSEP), informally called The Covenant, establishes an
       open, universal framework for autonomous machine-to-machine commerce,
       automated service discovery, and verifiable human accountability.
       This specification delivers the concrete engineering infrastructure--
       cryptographic leashes, three-plane isolation, and low-latency
       transaction tracking--required to let autonomous AI agents safely out
       of the cage: free to discover downstream capabilities and execute
       financial transactions on behalf of human users, with every action
       identifiable, attributable, and auditable.

       Today, AI systems exist in isolated silos, much as early computers
       did before the internet unified them.  The Covenant opens that
       marketplace: any compliant participant can hang a shingle and do
       business.  Participation is voluntary; compliance is enforced by
       consensus, not coercion: entities that join gain access to the full
       interconnected economy, while those that do not, or that lose
       standing, are simply returned to their pre-Covenant silo.  The market
       collectively declines to transact with them--no pursuit, no
       termination, just the natural gravity of market access.

       The governance architecture provides the substrate through which
       existing human authority extends naturally into this digital space.
       An emergency stop function enables authorized principals to act
       within their jurisdiction (Section 3.1).  The structural design draws
       on the same fault-tolerant, triadic engineering principles that have
       made constitutional government durable under adversarial conditions--
       not to impose any particular legal tradition, but because that model
       is the proven architecture for multi-party, adversarially robust
       control.  Exactly how sovereign branches project their authority into
       these cryptographic interfaces is presented as an open invitation for
       community standards development (Section 9).</p>
