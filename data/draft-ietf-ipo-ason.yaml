- language: en
  script: Latn
  content: "<p>This draft describes the main architectural principles of the automatic
    switched optical networks (ASON) work that has recently been approved by the ITU-T
    [2,3]. ASON architecture defines a set of reference points (interfaces) that allows
    ASON clients to request network services across those reference points.</p>"
