abstract:
- language: en
  script: Latn
  content: "<p>A PCE can be either stateful or stateless. The information carried
    in a stateful PCE is more detailed than that of a stateless PCE. This draft focus
    on stateful PCE, describes the problems without stateful PCE, and gives the IGP
    and PCEP extensions to realize stateful PCE.</p>"
