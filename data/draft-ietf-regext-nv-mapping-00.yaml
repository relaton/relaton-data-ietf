- language: en
  script: Latn
  content: "<p>This document describes an Extensible Provisioning Protocol (EPP) for
    the provisioning and management of Name Verification (NV) stored in a shared central
    repository in China. Specified in XML, the mapping defines EPP command syntax
    and semantics as applied to name verification.</p>"
