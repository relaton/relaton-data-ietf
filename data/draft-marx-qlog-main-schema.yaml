abstract:
- language: en
  script: Latn
  content: "<p>This document describes a high-level schema for a standardized logging
    format called qlog. This format allows easy sharing of data and the creation of
    reusable visualization and debugging tools. The high-level schema in this document
    is intended to be protocol- agnostic. Separate documents specify how the format
    should be used for specific protocol data. The schema is also format-agnostic,
    and can be represented in for example JSON, csv or protobuf.</p>"
