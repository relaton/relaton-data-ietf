- language: en
  script: Latn
  content: "<p>This memo identifies an ambiguity in the Secure Shell (SSH) connection
    protocol defined by RFC 4254 regarding the handling of channel closure in combination
    with channel requests requiring a reply, and issues a clarification specifying
    the correct interpretation of the ambiguous point.</p>"
