- language: en
  script: Latn
  content: "<p>This document describes the requirement for an IP multicast \n   performance
    monitoring system for service provider IP multicast \n   networks. This system
    enables efficient performance monitoring in \n   Service Providers' production
    networks and provides diagnostic \n   information in case of performance degradation
    or failure.</p>"
