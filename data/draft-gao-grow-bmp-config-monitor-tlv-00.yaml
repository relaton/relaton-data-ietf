abstract:
- language: en
  script: Latn
  content: "<p>This document defines two BMP extension TLVs, which are used to carry
    configuration information for associated BGP route changes and store configuration
    submission and effective timestamps. With this extension, BGP monitoring platforms
    can correlate various BGP events with configuration operations, providing traceability
    evidence for identifying routing anomalies and network failures caused by configuration
    changes.</p>"
