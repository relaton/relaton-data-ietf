abstract:
- language: en
  script: Latn
  content: "<p>This paper considers some IPv6 issues for residential networks, including
    use of address types and firewalls.  The paper describes IPv6 usage in the UPnP
    Device Architecture standard and offers some clarifications and changes to it.
    \ The paper seeks comments on IPv6 address usage, address selection, and the need
    to develop best practices for IPv6 firewall control.</p>"
