  content: |-
    <p>This document defines a new HTTP field Content-Warning and a standard
       response format for representing warning information in HTTP APIs.

    Note to Readers

       This draft should be discussed on the rfc-interest mailing list
       (&lt;https://lists.w3.org/Archives/Public/ietf-http-wg/&gt;).

