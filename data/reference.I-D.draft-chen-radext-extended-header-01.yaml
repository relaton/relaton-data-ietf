abstract:
- language: en
  script: Latn
  content: <p>The limitation with the one-octet "Identifier" field in the RADIUS packet
    is well known. In this document we propose extensions to the RADIUS protocol to
    address this fundamental limitation, and thus allowing for more efficient and
    more scalable implementations.</p>
