abstract:
- language: en
  script: Latn
  content: "<p>When a Location Information Server receives a request for location
    information (using the locationRequest message), described in the base HTTP Enabled
    Location Delivery (HELD) specification, it uses the source IP address of arriving
    message as a pointer to the location determination process.  This is appropriate
    in many environments. However, when an entity acting on behalf of the Target would
    like to request location information then the source IP address of the request
    will lead to wrong results.  In other cases the IP address is not the only identifier
    that serves as an input to the location determination procedure.  This document
    extends the HELD protocol to allow the location request message to carry additional
    identifiers assisting the location determination process.  It defines a set of
    URNs for Target identifiers and an XML containment schema.  As such, this extension
    is used in conjunction with HELD to provide Target identification. Examples and
    usage in HELD message syntax are provided.</p>"
