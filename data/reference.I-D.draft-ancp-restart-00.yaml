abstract:
- language: en
  script: Latn
  content: "<p>This document describes proposed extensions to the ANCP protocol to
    allow a graceful recovery of an ANCP session and associated information after
    an existing session is reset.  Such a reset may be due to a NAS restart , or a
    loss of connectivity between the NAS and the AN.</p>"
