abstract:
- language: en
  script: Latn
  content: "<p>The Virtual Router Redundancy Protocol (VRRP) protocol depends on\n   IPv4 or IPv6 connectivity between redundant peers and can use\n   Seamless Bidirectional Forwarding Detection (S-BFD) to detect a\n   Primary Router failure faster than the base VRRP advertisement\n   timers.\n\n   This document describes an extension that allows VRRP to use S-BFD as\n   an additional failure-detection mechanism.  It defines a new VRRP\n   packet type, a dedicated timer, and a mechanism for a VRRP Primary\n   Router to advertise an S-BFD reflector discriminator to Backup\n   Routers.  Local discriminator allocation is left to the\n   implementation.</p>"
