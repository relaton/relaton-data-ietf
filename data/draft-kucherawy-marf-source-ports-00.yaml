- language: en
  script: Latn
  content: |-
    <p>This document registers an additional header field for use in Abuse
       Reporting Format reports to permit the identification of the source
       port of the connection involved in an abuse incident.

       This memo updates RFC5965 and RFC6xxx (authfailure-report).</p>
