abstract:
- language: en
  script: Latn
  content: |-
    <p>In this document we present Architecture, Model, and Requirements
    for Operation and Maintenance of Virtual Private Networks (VPN).
    Operation and Maintenance of VPN is divided into Application Level
    VPN testability, Technology dependent VPN testability, and
    Technology specific VPN testability. This document presents a
    solution for Application level VPN Operation and Maintenance
    (Testability).</p>
