abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to traceroute and ping messages
    that allows the probe packets to be authenticated by the intermediate nodes and
    the destination node.  This extension can also include requests for node specific
    information that the probe sender is interested to receive from one or more nodes
    via the traceroute and ping replies.  This extension supports UDP, TCP and ICMP
    types of traceroute and ping probes.</p>"
