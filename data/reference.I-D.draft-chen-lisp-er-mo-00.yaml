abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism of providing mapping service for
    LISP-like architecture.  The mapping service comprises of EID Router (ER) mechanism
    and supplementary DHT Mapping Overlay (MO), in which ER mechanism is for non-cached
    packets tunneling, while the DHT MO serves as a supplement that provides specific
    mappings to reduce tunneling cost.  The mechanism is flexibly deployable for ISPs
    since it costs little and is easy to progress.</p>"
