abstract:
- language: en
  script: Latn
  content: "<p>This document defines a means of remotely initiating Multiprocal Label
    Switched Protocol Pings from proxy Label Switching Routers. The motivation for
    this facility is to limit the number of messages and related processing when using
    LSP Ping in large Point-to-Multipoint LSPs.</p>"
