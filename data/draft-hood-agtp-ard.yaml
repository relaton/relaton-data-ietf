abstract:
- language: en
  script: Latn
  content: "<p>The Agentic Resource Discovery (ARD) specification defines a\n   federated, domain-anchored model for cataloging, discovering, and\n   searching agentic resources across organizational boundaries.  ARD is\n   artifact-protocol-agnostic: it advertises capabilities and trust\n   metadata, then steps out of the way to let agents connect over each\n   artifact's native protocol.\n\n   This document specifies how the Agent Transfer Protocol (AGTP)\n   composes with ARD.  It defines an AGTP catalog entry type for ARD\n   manifests, the agtp:// endpoint URI as a valid runtime connection\n   target, the composition of AGTP's wire-level identity model with the\n   ARD trustManifest object, and an AGTP-native binding for publishing\n   and consuming ARD catalogs over the AGTP substrate rather than HTTPS.\n\n   The result is a clean composition.  ARD operates at the application\n   layer and answers the discovery question: where is the capability,\n   can it be trusted before connection.  AGTP operates at the transport\n   substrate beneath application-layer protocols (MCP, A2A, API, and\n   others ARD catalogs) and carries structural identity, authority\n   scope, and attribution at the wire.  ARD and the application\n   protocols it catalogs can run over AGTP as substrate, the same way\n   they currently run over HTTP.</p>"
