abstract:
- language: en
  script: Latn
  content: "<p>The draft defines a new BGP EVPN route message for syncing DHCP\n   packet contents as well as snoop entry among PEs in an Ethernet\n   Segment (ES).  The snoop entry is required to implement Dynamic ARP\n   inspection (DAI), IP Source Guard (IPSG/IPSGv6) and IPv6 Neighbor\n   Discovery Inspection (NDI) access security features.</p>"
