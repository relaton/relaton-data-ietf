abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Message Session Relay Protocol (MSRP) extension,
    Connection Establishment for Media Anchoring (CEMA). Support of the extension
    is optional.  The extension allows Middleboxes to anchor the MSRP connection,
    without the need for Middleboxes to modify the MSRP messages, and thus also enables
    a secure end-to-end MSRP communication in networks where such Middleboxes are
    deployed.  The document also defines a Session Description Protocol (SDP) attribute,
    a=msrp-cema, that MSRP endpoints use to indicate support of the CEMA extension.</p>"
