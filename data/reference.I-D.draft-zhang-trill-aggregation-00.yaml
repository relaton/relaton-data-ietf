abstract:
- language: en
  script: Latn
  content: "<p>TRILL supports multi-access LAN links that can have multiple RBridges
    attached. This draft specifies RBridge Aggregation which enables concurrent data
    forwarding for the hosts in the same VLAN on a LAN link via multiple RBridges
    without partition this LAN link. RBridge Aggregation offers active/active multi-homing
    to multi-access LAN links, which improves their reliability and increases the
    access bandwidth of RBridge campus.</p>"
