abstract:
- language: en
  script: Latn
  content: "<p>This document defines a number of Dynamic Host Configuration Protocol
    (DHCP-for-IPv4) options that contain a list of domain names or IPv4 addresses
    that can be mapped to servers providing Mobility Services. Mobility Services are
    used to assist an MN in handover preparation (network discovery) and handover
    decision (network selection). The services addressed by this document are the
    Media Independent Handover Services defined in [1].</p>"
