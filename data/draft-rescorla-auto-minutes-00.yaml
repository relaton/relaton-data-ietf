abstract:
- language: en
  script: Latn
  content: <p>RFC 2418 requires that working group chairs ensure that sessions shall
    "be reported by making minutes available". Those minutes can be automatically
    generated from meeting recordings. This document requests that the IETF LLC update
    the meeting tooling to facilitate this.</p>
