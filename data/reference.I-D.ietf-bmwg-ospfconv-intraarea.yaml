abstract:
- language: en
  script: Latn
  content: "<p>This draft establishes standards for measuring OSPF single router control
    plane convergence [TERM]. Its initial emphasis is on the control plane of single
    OSPF routers. We do not address forwarding plane performance. NOTE: Within this
    document, the word convergence relates to single router control plane convergence
    only.</p>"
