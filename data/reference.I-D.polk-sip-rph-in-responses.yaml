abstract:
- language: en
  script: Latn
  content: "<p>The Session Initiation Protocol (SIP) Resource-Priority Header is ignored
    in SIP responses, according to RFC 4412.  This was a design choice during RFC
    4412's development. This is now considered a bad design choice in certain scenarios.
    \ This document corrects RFC 4412's communications model by optionally allowing
    a SIP server or user agent (UA) to process the Resource-Priority Header in a response.</p>"
