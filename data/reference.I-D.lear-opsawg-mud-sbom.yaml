- language: en
  script: Latn
  content: "<p>Software bills of materials (SBOMs) are formal descriptions of what
    pieces of software are included in a product.  This memo specifies a means for
    manufacturers to state how SBOMs may be retrieved through an extension to manufacturer
    usage descriptions (MUD).</p>"
