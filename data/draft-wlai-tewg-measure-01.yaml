- language: en
  script: Latn
  content: "<p>In this document, a measurement framework for supporting the traffic
    engineering of IP-based networks is presented. It is intended for the TEM (Traffic
    Engineering Measurement) category as described in the TEWG charter. Consideration
    for including this document as a TEWG working-group item for further development
    is requested.</p>"
