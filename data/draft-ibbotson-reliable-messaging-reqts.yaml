abstract:
- language: en
  script: Latn
  content: "<p>This memo identifies a set of requirements for the reliable delivery\nof messages over the Internet.  It defines what is meant by reliable\ndelivery between two software agents and what requirements this\nplaces on an inter-agent protocol to ensure reliable message delivery\nbetween them.</p>"
