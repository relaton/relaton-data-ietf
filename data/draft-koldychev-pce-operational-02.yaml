abstract:
- language: en
  script: Latn
  content: "<p>This document is meant to provide better clarity about how PCEP operates
    and hence to facilitate better interoperability between different equipment vendors.
    The content of this document has been compiled based on the feedback from several
    multi-vendor interop exercises. Several constructs are introduced to facilitate
    this, such as the LSP-DB and the ASSO-DB.</p>"
