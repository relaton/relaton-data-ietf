- language: en
  script: Latn
  content: "<p>This document specifies a new BGP based signaling mechanism for providing
    Virtual Private LAN Service (VPLS) in large scale and multi-service networks.
    This new mechanism combines the advantage of both the existing BGP based [RFC4761]
    and LDP based [RFC4762] VPLS mechanism.</p>"
