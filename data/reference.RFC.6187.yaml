abstract:
- language: en
  script: Latn
  content: "<p>X.509 public key certificates use a signature by a trusted certification
    authority to bind a given public key to a given digital identity.  This document
    specifies how to use X.509 version 3 public key certificates in public key algorithms
    in the Secure Shell protocol.  [STANDARDS-TRACK]</p>"
