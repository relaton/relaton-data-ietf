abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a document format for the media properties
    of Session Initiation Protocol (SIP) sessions.  Examples for media properties
    are the codecs or media types used in a session.  This document format is based
    on XML and extends the Schema for SIP User Agent Profile Data Sets.  It can be
    used to describe the properties of a specific SIP session or to define policies
    that are then applied to different SIP sessions.</p>"
