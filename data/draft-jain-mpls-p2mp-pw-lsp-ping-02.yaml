abstract:
- language: en
  script: Latn
  content: |-
    <p>LSP-Ping is a widely deployed Operation, Administration, and
            Maintenance (OAM) mechanism in MPLS networks. This document
            describes a mechanism to verify connectivity of Point-to-Multipoint
            (P2MP) Pseudowires (PW) using LSP Ping.</p>
