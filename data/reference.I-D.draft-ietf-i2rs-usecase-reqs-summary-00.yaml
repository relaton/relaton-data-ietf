- language: en
  script: Latn
  content: "<p>The I2RS Working Group (WG) has described a set of use cases that the
    I2RS systems could fulfil.  This document summarizes these use cases. It is designed
    to provide requirements that will aid the design of the I2RS architecture, Information
    Models, Data Models, Security, and protocols.</p>"
