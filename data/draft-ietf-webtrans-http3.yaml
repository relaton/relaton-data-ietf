abstract:
- language: en
  script: Latn
  content: "<p>WebTransport over HTTP/3 is a binding of the WebTransport protocol
    framework [OVERVIEW] to HTTP/3 [HTTP3]. It provides support for unidirectional
    streams, bidirectional streams, and datagrams, all multiplexed within the same
    HTTP/3 connection. WebTransport enables application clients constrained by the
    Web security model to communicate with a remote application server using a secure
    multiplexed transport.</p>"
