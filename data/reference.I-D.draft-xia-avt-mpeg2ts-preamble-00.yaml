abstract:
- language: en
  script: Latn
  content: "<p>MPEG2-TS is a container format that describes the schema of the audio,
    video content and the in-band control information.  The format information called
    MPEG2-TS preamble must be acquired before a RTP receiver processed any data received
    in MPEG2-TS.  In this document, a Retransmission Server is specified to deliver
    MPEG2-TS preamble prior to unicast RTP packets.  The Retransmission Server caches
    raw RTP packets with MPEG2-TS preamble information, and sends them to the RTP
    receiver which initiates rapid acquisition of MPEG2-TS multicast sessions.</p>"
