abstract:
- language: en
  script: Latn
  content: "<p>This document describes the common Fibre Channel (FC) frame encapsulation
    format and a procedure for the measurement and calculation of frame transit time
    through the IP network. This specification is intended for use by any IETF protocol
    that encapsulates FC frames.</p>"
