abstract:
- language: en
  script: Latn
  content: "<p>Recent revisions of ITU-T Recommendation G.709 have introduced new
    features for OTNs:ODU0, ODU4, ODU2e, ODU3e1, ODU3e2 and ODUflex.  The new features
    for the evolutive OTNs are described in separate ITU-T documents.  ODU0, ODU2e
    and ODU4 ODUflex are described in [G709-V3]. ODU3e1 and ODU3e2 are described in
    [Gsup43].  This document describes OSPF routing protocol extensions to support
    the evolutive Optical Transport Networks (OTN) under the control of Generalized
    MPLS (GMPLS).</p>"
