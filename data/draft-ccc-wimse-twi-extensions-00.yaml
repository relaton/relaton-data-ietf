abstract:
- language: en
  script: Latn
  content: "<p>This document contains a gap analysis that is the output of the Confidential
    Computing Consortium identifying areas in the IETF WIMSE WG work where the current
    WIMSE architecture should be extended to accommodate workloads running in Confidential
    Computing environments. This document contains a high-level outline for these
    extensions.</p>"
