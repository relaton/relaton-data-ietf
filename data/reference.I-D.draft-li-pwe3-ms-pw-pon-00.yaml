abstract:
- language: en
  script: Latn
  content: "<p>This draft describes MS-PW application in a PON network.  Static configuration
    of one segment of PW is a typical case of MS-PW.  When MS-PW is implemented in
    a PON network, the large quantity of T-PE makes such static provisioning a heavy
    burden of network manager. Making use of management protocol of GPON helps to
    reduce the labor of configuration, simplify and speedup the PW provision procedure
    to a great extent, and notify to switching PE (OLT) ACs status on T-PE (ONU).
    \ Link layer of GPON may also replace PSN to carry MPLS-PW.</p>"
