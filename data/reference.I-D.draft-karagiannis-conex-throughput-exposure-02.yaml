abstract:
- language: en
  script: Latn
  content: "<p>This draft is focusing on relaying throughput instead of congestion
    back into the network in-band at the IP layer, such that the total level of throughput
    is visible to all IP devices along the path. The advantage of this approach is
    that applications that are not using the TCP protocol as transport protocol could
    also apply the Conex concept to rely the throughput experienced on the end-to-end
    path back into the network.</p>"
