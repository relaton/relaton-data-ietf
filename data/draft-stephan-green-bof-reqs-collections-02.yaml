  content: "<p>This memo extracts and groups requirements from the revisit of operator's
    requirements made in the last charter refinement work and from the drafts which
    provided material to the green BoF. The aim is to determine initial sets of requirements
    actionable at different levels of the framework. Discussion Venues The source
