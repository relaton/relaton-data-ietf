abstract:
- language: en
  script: Latn
  content: "<p>This document specifies extensions to Proxy Mobile IPv6 protocol for
    supporting IPv4 protocol.  The scope of this IPv4 support includes the support
    for the mobile node's IPv4 home address mobility and for allowing the mobility
    entities in the Proxy Mobile IPv6 domain to exchange signaling messages over an
    IPv4 transport.</p>"
