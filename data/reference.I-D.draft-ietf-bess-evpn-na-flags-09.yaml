abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Extended Community that is advertised along
    with an EVPN MAC/IP Advertisement route and carries information relevant to the
    ARP/ND resolution, so that an EVPN PE implementing a proxy-ARP/ND or ARP/ND (on
    IRB interfaces) function can reply to ARP Requests or Neighbor Solicitations with
    the correct information.</p>"
