abstract:
- language: en
  script: Latn
  content: "<p>IPv6 nodes use the Neighbor Discovery Protocol (NDP) to discover other
    nodes on the link, to determine the link-layer addresses of other nodes on the
    link, to find routers, and to maintain reachability information about the paths
    to active neighbors. If not secured, NDP is vulnerable to various attacks. This
    document specifies security mechanisms for NDP. Unlike to the original NDP specifications,
    these mechanisms do not make use of IPsec.</p>"
