title:
- language: en
  script: Latn
  content: The Locator/ID Separation Protocol (LISP)
  format: text/plain
docidentifier:
- content: draft-ietf-lisp-rfc6830bis
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2022-05-07'
abstract:
- language: en
  script: Latn
  content: "<p>This document describes the data plane protocol for the Locator/ID
    Separation Protocol (LISP). LISP defines two namespaces: Endpoint Identifiers
    (EIDs), which identify end hosts; and Routing Locators (RLOCs), which identify
    network attachment points. With this, LISP effectively separates control from
    data and allows routers to create overlay networks. LISP-capable routers exchange
    encapsulated packets according to EID-to-RLOC mappings stored in a local Map-Cache.
    LISP requires no change to either host protocol stacks or underlay routers and
    offers Traffic Engineering (TE), multihoming, and mobility, among other features.
    This document obsoletes RFC 6830.</p>"
  format: text/html
