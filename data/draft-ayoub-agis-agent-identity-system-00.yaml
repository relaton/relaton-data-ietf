abstract:
- language: en
  script: Latn
  content: "<p>This document specifies AgIS, the Agent Identity System, a DNS-backed\n   identity and verification profile for AI agents, autonomous software\n   agents, and agentic services operating on the existing web.\n\n   AgIS defines an agent identifier form, DNS TXT bindings, Agent Cards,\n   key thumbprints, status and revocation documents, signed HTTP request\n   verification, replay protection, delegation tokens, and delegation\n   chains.  The design intentionally reuses existing Internet\n   mechanisms, including DNS, HTTPS well-known resources, JSON Web Keys,\n   JSON canonicalization, HTTP Message Signatures, and HTTP digest\n   fields.\n\n   This document describes the AgIS 0.2.2 wire/profile format and the\n   behavior exercised by the AgIS v0.3.0-alpha.3 reference\n   implementation and its 23 deterministic test vectors.  That\n   implementation includes signed Agent Cards, HTTP Message Signature\n   verification, two-phase replay protection, delegation signer-key\n   binding enforced by default, and signed agent status document\n   support.  It does not define a global trust authority, a production\n   trust network, or a new public-key infrastructure.\n\n   This is an individual Internet-Draft and a work in progress.  It has\n   not been approved by the IETF, does not represent an IETF standard or\n   RFC, and has not been adopted by any IETF working group.\n\n   AgIS is designed to be compatible with agent naming services such as\n   Linux Foundation ANS and similar systems.  AgIS is not affiliated\n   with, endorsed by, or a replacement for Linux Foundation ANS or any\n   global naming authority.  AgIS defines verification, governance, and\n   request-signing behavior that operates over identity evidence that\n   may originate from ANS or any comparable naming layer.</p>"
