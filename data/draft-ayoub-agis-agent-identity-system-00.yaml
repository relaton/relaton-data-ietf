abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies AgIS, the Agent Identity System, a DNS-backed
       identity and verification profile for AI agents, autonomous software
       agents, and agentic services operating on the existing web.

       AgIS defines an agent identifier form, DNS TXT bindings, Agent Cards,
       key thumbprints, status and revocation documents, signed HTTP request
       verification, replay protection, delegation tokens, and delegation
       chains.  The design intentionally reuses existing Internet
       mechanisms, including DNS, HTTPS well-known resources, JSON Web Keys,
       JSON canonicalization, HTTP Message Signatures, and HTTP digest
       fields.

       This document describes the AgIS 0.2.2 wire/profile format and the
       behavior exercised by the AgIS v0.3.0-alpha.3 reference
       implementation and its 23 deterministic test vectors.  That
       implementation includes signed Agent Cards, HTTP Message Signature
       verification, two-phase replay protection, delegation signer-key
       binding enforced by default, and signed agent status document
       support.  It does not define a global trust authority, a production
       trust network, or a new public-key infrastructure.

       This is an individual Internet-Draft and a work in progress.  It has
       not been approved by the IETF, does not represent an IETF standard or
       RFC, and has not been adopted by any IETF working group.

       AgIS is designed to be compatible with agent naming services such as
       Linux Foundation ANS and similar systems.  AgIS is not affiliated
       with, endorsed by, or a replacement for Linux Foundation ANS or any
       global naming authority.  AgIS defines verification, governance, and
       request-signing behavior that operates over identity evidence that
       may originate from ANS or any comparable naming layer.</p>
