abstract:
- language: en
  script: Latn
  content: "<p>There is a need to document data defined in YANG models when a live
    server is unavailable.  Data is often needed at design or implementation time
    or needed when a live running server is unavailable.  This document specifies
    a standard file format for YANG instance data, which follows the syntax and semantics
    of existing YANG models, and annotates it with metadata.</p>"
