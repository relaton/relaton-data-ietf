- language: en
  script: Latn
  content: "<p>This document defines an extended SMTP response for mail servers to
    assist clients in adjusting the rate at which they send mail. Use of this mechanism
    can reduce wasteful SMTP connections and reduce mail delivery delays; at scale
    the aggregate benefit to clients and servers can be significant.</p>"
