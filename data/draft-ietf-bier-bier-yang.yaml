abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model that can be used to configure
       and manage devices supporting Bit Index Explicit Replication"(BIER).
       The YANG module in this document conforms to the Network Management
       Datastore Architecture (NMDA).</p>
