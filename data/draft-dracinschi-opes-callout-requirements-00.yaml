abstract:
- language: en
  script: Latn
  content: "<p>In the context of the Content Networks, the Open Pluggable Edge Services
    represents an infrastructure that enables quick and easy creation of value-added
    networking services. This document attempts to present requirements for callout
    protocols that provide communication between an in-path OPES intermediary (e.g.
    a cache) and remote callout servers.</p>"
