abstract:
- language: en
  script: Latn
  content: "<p>This document describes a standardized approach to discovering Web
    Service Endpoints from a DNS name. Services are advertised using the DNS SRV and
    TXT records and the HTTP Well Known Service conventions. This document is also
    available online at http://mathmesh.com/Documents/draft-hallambaker-web-service-
    discovery.html.</p>"
