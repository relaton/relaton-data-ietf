abstract:
- language: en
  script: Latn
  content: "<p>This memo describes a technique for radio paging using the Internet
    mail infrastructure.  In particular, this memo focuses on the case in which radio
    pagers are identified via the international telephone network. This memo provides
    information for the Internet community.  This memo does not specify an Internet
    standard of any kind.</p>"
