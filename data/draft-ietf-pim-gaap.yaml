abstract:
- language: en
  script: Latn
  content: <p>This document describes a design for a lightweight decentralized multicast
    group address allocation protocol (named GAAP and pronounced "gap" as in "mind
    the gap"). The base allocation protocol requires no centralized service and minimal
    configuration, although deployments using encryption or administrative scoping
    may require configuration. The protocol runs among group participants which need
    a unique group address to send and receive multicast packets. Tailored for IPv4
    and IPv6 networks, this design offers a simple, lightweight option rather than
    extending an existing protocol.</p>
