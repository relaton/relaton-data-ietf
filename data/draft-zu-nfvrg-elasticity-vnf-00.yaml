  script: Latn
  content: "<p>This draft is an analytic of NFV applications based on the NFV architecture,
    use cases and requirements. The purpose of this analytic is to identify any NFV
    characteristics related issues. The analytic is focusing on elasticity VNF with
    predicable performance, reliability and security. Only the issues which are unique
    to NFV are discussed in this document.</p>"
