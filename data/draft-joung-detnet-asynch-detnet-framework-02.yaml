abstract:
- language: en
  script: Latn
  content: "<p>This document describes an overall framework of Asynchronous Deterministic
    Networking (ADN) for large-scale networks. It specifies the functional architecture
    and requirements for providing latency and jitter bounds to high priority traffic,
    without strict time-synchronization of network nodes.</p>"
