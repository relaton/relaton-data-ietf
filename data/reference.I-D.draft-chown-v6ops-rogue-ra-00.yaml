abstract:
- language: en
  script: Latn
  content: "<p>When deploying IPv6 networks, whether IPv6-only or dual-stack, routers
    are configured to use IPv6 Router Advertisements to convey information to on link
    nodes that enable them to autoconfigure on the network.  This information includes
    the implied default router address taken from the observed source address of the
    Router Advertisement (RA) message.  However, in some networks 'bogus' RAs are
    observed, which may be present due to misconfigurations or possibly malicious
    attacks on the network.  In this draft we summarise the scenarios in which rogue
    RAs may be observed, and we present a list of possible solutions to the problem.
    \ The goal of this draft is to present a framework around which solutions can
    be proposed and discussed.</p>"
