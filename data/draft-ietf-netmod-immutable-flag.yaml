title:
- language: en
  script: Latn
  content: YANG Metadata Annotation for Immutable Flag
  format: text/plain
docidentifier:
- content: draft-ietf-netmod-immutable-flag
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: <p>This document defines a mechanism to formally document an existing behavior,
    implemented by servers of YANG-driven network management protocols (e.g., NETCONF
    and RESTCONF), on the immutability of some system-provided nodes, using a YANG
    metadata annotation called "immutable" to flag which nodes are immutable. Clients
    may use "immutable" annotations provided by the server, to know beforehand why
    certain otherwise valid configuration requests will cause the server to return
    an error. The immutable flag is descriptive, documenting an existing behavior,
    not prescriptive, dictating server behaviors. This document updates RFC 8040 and
    RFC 8526.</p>
  format: text/html
