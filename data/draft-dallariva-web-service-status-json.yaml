abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a standard JSON format for service status\n   resources. It provides a machine-readable format for overall service\n   health indicators, component-level status information with\n   criticality classification, geographic scope identification, and\n   structured incident reporting.  This standard enables\n   interoperability between status monitoring tools and service\n   providers.</p>"
