abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a mechanism for using designated HTTP
       responses as an external dictionary for future HTTP responses for
       compression schemes that support using external dictionaries (e.g.,
       Brotli (RFC 7932) and Zstandard (RFC 8878)).</p>
