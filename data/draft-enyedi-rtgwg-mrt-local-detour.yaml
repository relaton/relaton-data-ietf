  content: |-
    <p>IP and LDP Fast ReRoute using Maximally Redundant trees was defined
       in [I-D.ietf-rtgwg-mrt-frr-architecture].  In this document we add a
       simple extension to that technique, which can guarantee to keep
       detours in the part of the network, where the failure happened.</p>
