abstract:
- language: en
  script: Latn
  content: "<p>X.509 public key certificates use a signature by a trusted certification
    authority to bind a given public key to a given digital identity.  This document
    outlines how to incorporate X.509 version 3 public key certificates into the authentication
    methods of the Secure Shell protocol.</p>"
