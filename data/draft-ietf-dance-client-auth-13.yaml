abstract:
- language: en
  script: Latn
  content: "<p>The DANE TLSA protocol describes how to publish Transport Layer Security
    (TLS) server certificates or public keys in the DNS. This document updates RFC
    6698 and RFC 7671. It describes how to use the TLSA record to publish client certificates
    or public keys, and also the rules and considerations for using them with TLS.
    In addition, it defines a new TLS extension, DANE Client Identity, to convey the
    client's domain name identity to the server.</p>"
