abstract:
- language: en
  script: Latn
  content: "<p>This document describes an optimized mechanism for BGP route reflection,
    known as BGP route broker. It aims to utilize the BGP- based IP VPN as an overlay
    routing protocol in a scalable manner, specifically for hyperscale data center
    network virtualization environments, commonly referred to as Software-Defined
    Network (SDN) environments.</p>"
