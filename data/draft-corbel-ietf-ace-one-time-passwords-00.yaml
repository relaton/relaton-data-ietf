- language: en
  script: Latn
  content: |-
    <p>This document aims to submit a few improvements to the RFC2289, which
       describes a One-Time Password System : interfaces to Secure Hash
       Algorithms, folding hashes to 64 bits, alternate dictionaries and
       automatic renewal of authentication parameters will be studied in
       detail.</p>
