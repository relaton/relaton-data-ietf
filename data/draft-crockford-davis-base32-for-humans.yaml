abstract:
- language: en
  script: Latn
  content: "<p>This document details the formal specification of Base32 for Humans;\n   an alternate Base32 alphabet which extends the \"Handled by Humans\"\n   text found in Section 3.4 of RFC 4648.  This base features an\n   alphabet curated for expressing numbers in a form that can be\n   conveniently and accurately transmitted between humans and computer\n   systems.</p>"
