abstract:
- language: en
  script: Latn
  content: "<p>RBridges provide the ability to have an entire campus, with multiple
    physical links, look to IP like a single subnet. The design allows for zero configuration
    of switches within an RBridge campus, optimal pair-wise routing, safe forwarding
    even during periods of temporary loops, and the potential ability to cut down
    on Address Resolution Protocol (ARP) and/or Neighbor Discovery (ND) traffic. The
    design supports VLANs, allows forwarding tables to be based on destinations within
    the RBridge campus (rather than endnode destinations, allowing internal forwarding
    tables to be smaller than in conventional bridge systems) and re-uses existing
    routing protocols (for distribution of reachability of destinations and shortest
    path computation within an RBridge campus, and potentially for peer/topology discovery).
    In order to accomplish this, the design may impose requirements for extensions
    to one or more existing routing protocols necessary to accomplish the distribution
    and computation processes, as well as specific limits on interactions between
    bridge, R-Bridge and Router instances.</p>"
