abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it defines a basic set of managed objects for SNMP- based management of DVB interfaces
    in EuroModem v1.0 compliant Cable Network Interface Units.</p>"
