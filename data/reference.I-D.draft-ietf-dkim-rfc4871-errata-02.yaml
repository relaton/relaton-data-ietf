abstract:
- language: en
  script: Latn
  content: "<p>This documents and resolves errata for RFC 4871, DomainKeys Identified
    Mail (DKIM) Signatures.  Specifically the document clarifies the nature, roles
    and relationship of the two DKIM identifier tag values that are candidates for
    payload delivery to a receiving processing module.  This Errata entry has been
    developed and approved by the IETF's DKIM working group.  Errata Contact Fields
    \ Name: Dave Crocker  Email: dcrocker@bbiw.net  Type  Technical</p>"
