abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new DHCP option for delivering configuration
    information to hosts utilizing the Compatibility Mode Driver (CMD) provided with
    Novell’s NetWare 5. This option is passed from the DHCP server to the DHCP Client
    to provide the addresses of one or more Migration Agents along with their CMD
    network number.</p>"
