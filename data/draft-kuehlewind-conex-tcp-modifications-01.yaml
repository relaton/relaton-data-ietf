abstract:
- language: en
  script: Latn
  content: |-
    <p>Congestion Exposure (ConEx) is a mechanism by which senders inform
       the network about the congestion encountered by previous packets on
       the same flow.  This document describes the necessary modifications
       to use ConEx with the Transmission Control Protocol (TCP).</p>
