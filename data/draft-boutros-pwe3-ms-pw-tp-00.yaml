abstract:
- language: en
  script: Latn
  content: "<p>The existing procedures for concatenating Pseudowire(PW) segments to
    form Multi-Segment PW (MS-PW) do not take into account operator functions such
    Lock Instruct and Loopback introduced as part of MPLS Transport Profile (MPLS-TP).
    This informational document reiterates the PW stitching procedures in an MPLS-TP
    environment.</p>"
