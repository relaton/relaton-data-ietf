abstract:
- language: en
  script: Latn
  content: "<p>By default, message header parameters in Hypertext Transfer Protocol
    (HTTP) messages can not carry characters outside the ISO-8859-1 character set.
    \ RFC 2231 defines an escaping mechanism for use in Multipurpose Internet Mail
    Extensions (MIME) headers.  This document specifies a profile of that encoding
    suitable for use in HTTP.</p>"
