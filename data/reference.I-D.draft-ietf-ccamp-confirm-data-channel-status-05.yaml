abstract:
- language: en
  script: Latn
  content: "<p>This document defines simple additions to the Link Management Protocol
    (LMP) to provide a control plane tool that can assist in the location of stranded
    resources by allowing adjacent LSRs to confirm data channel statuses, and provides
    triggers for notifying the management plane if any discrepancies are found. As
    LMP is already used to verify data plane connectivity, it is considered to be
    an appropriate candidate to support this feature.  Li  Expires November 2009  [page
    1]  draft-ietf-ccamp-confirm-data-channel-status-05.txt  May 2009</p>"
