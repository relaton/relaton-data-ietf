abstract:
- language: en
  script: Latn
  content: "<p>This document defines a repeatable evaluation methodology for\n   measuring the influence of AI Machine-Readable Ethics Directive\n   (AIMED) blocks, as specified in draft-reilly-aimed-00, on the\n   outputs of AI systems that process IETF Internet-Drafts and\n   related standards documentation.\n\n   The methodology establishes a controlled test protocol, a scoring\n   rubric, a set of canonical test queries, and a results framework\n   suitable for independent replication.  It also presents the\n   results of the initial live evaluation conducted on April 8-9,\n   2026, in which Google AI Mode correctly attributed authorship,\n   provenance, and conceptual definitions for AIMED-compliant\n   documents within hours of their submission to the IETF Datatracker,\n   without any training cycle refresh or manual intervention.\n\n   These results constitute the first empirically documented instance\n   of protocol-layer prompt engineering -- the embedding of normative\n   AI directives at the document layer of the standards process rather\n   than at the query layer of user interaction.</p>"
