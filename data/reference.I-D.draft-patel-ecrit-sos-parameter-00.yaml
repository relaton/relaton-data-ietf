abstract:
- language: en
  script: Latn
  content: "<p>This memo describes requirements and protocol conventions for a new
    SIP (Session Initiation Protocol) URI parameter intended for marking SIP requests
    and responses related to emergency services.  This proposal addresses issues that
    exist in the current 3rd Generation Partnership Project IP Multimedia Subsystem
    (IMS) Emergency services solution, but is not precluded from being used by other
    SIP-based emergency services solutions.  It is not intended as a replacement for
    the service URN.</p>"
