- language: en
  script: Latn
  content: "<p>This document defines a virtual list view extension for the LDAP C
    API to support the LDAP protocol extensions for scrolling view browsing of search
    results. More specifically, this document defines functions to create virtual
    list view request controls and to parse virtual list view response controls.</p>"
