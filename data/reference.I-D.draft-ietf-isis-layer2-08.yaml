abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the IS-IS extensions necessary to support link
    state routing to any protocols running directly over layer 2. While supporting
    this concept involves several pieces, this document only describes extensions
    to IS-IS.  Furthermore, the TLVs described in this document are generic layer
    2 additions and specific ones as needed are defined in the IS-IS technology specific
    extensions.  We leave it to the systems using these IS-IS extensions to explain
    how the information carried in IS-IS is used.</p>"
