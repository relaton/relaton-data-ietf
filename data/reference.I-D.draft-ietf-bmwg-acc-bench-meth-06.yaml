abstract:
- language: en
  script: Latn
  content: "<p>Routers in an operational network are configured with multiple protocols
    and security policies while simultaneously forwarding traffic and being managed.
    To accurately benchmark a router for deployment it is necessary to test the router
    under accelerated operational conditions, which is known as Stress Testing. This
    document provides the Methodology Guidelines for performing Accelerated Stress
    Benchmarking of networking devices. Descriptions of Test Topology, Benchmarks
    and Reporting Format are provided in addition to procedures for conducting various
    test cases. The methodology is to be used with the companion terminology document
    [4]. These guidelines can be used as the basis for additional methodology documents
    that benchmark stress conditions for specific network technologies.</p>"
