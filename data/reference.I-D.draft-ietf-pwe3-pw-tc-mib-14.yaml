abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a Management Information Base (MIB) module which
    contains Textual Conventions (TCs) to represent commonly-used Pseudowire (PW)
    management information.  The intent is that these TCs will be imported and used
    in PW-related MIB modules that would otherwise define their own representations.</p>"
