abstract:
- language: en
  script: Latn
  content: <p>This memo documents existing usage for the "VoIP Configuration Server
    Address Option" (previously known as the "TFTP Server IP Address Option").  The
    option number currently in use is 150.  This memo documents the current usage
    of the option in agreement with [RFC3942], which declares that any pre-existing
    usages of option numbers in the range 128 - 223 should be documented and the working
    group will try to officially assign those numbers to those options.</p>
