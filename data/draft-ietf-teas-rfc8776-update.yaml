- type: published
  at: '2026-06-12'
abstract:
- language: en
  script: Latn
  content: "<p>This document defines a collection of commonly used Traffic Engineering
    (TE) specific data types, identities, and groupings in YANG data modeling language.
    These derived common data types, identities, and groupings are intended to be
    imported by other modules that model configuration and state for TE constructs,
    such as TE Topologies, TE Tunnels, TE Policies, TE Paths, TE Label Switched Paths
    (LSPs), and TE interfaces. This document obsoletes RFC 8776.</p>"
  format: text/html
