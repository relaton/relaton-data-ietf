abstract:
- language: en
  script: Latn
  content: "<p>BGPsec-speaking routers must be provisioned with private keys and the
    corresponding public key must be published in the global RPKI (Resource Public
    Key Infrastructure).  This document describes two ways of provisioning public/private
    keys, router-driven and operator- driven.</p>"
