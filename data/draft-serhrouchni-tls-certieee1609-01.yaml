- language: en
  script: Latn
  content: "<p>This document specifies the use of two new certificate types to authenticate
    TLS entities. The first type enables the use of a certificate specified by the
    Institute of Electrical and Electronics Engineers (IEEE) [IEEE-ITS] and the second
    by the European Telecommunications Standards Institute (ETSI) [ETSI103097].</p>"
