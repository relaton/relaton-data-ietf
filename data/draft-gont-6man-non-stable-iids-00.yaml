- language: en
  script: Latn
  content: |-
    <p>This document clarifies the stability requirements for IP6 addresses,
       and provides recommendations regarding the generation of non-stable
       addresses.  Finally, it formally updates RFC4941 such that nodes are
       allowed to configure only temporary addresses.</p>
