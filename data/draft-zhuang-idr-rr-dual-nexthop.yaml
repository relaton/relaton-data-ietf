abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a mechanism where a BGP Route Reflector (RR)
    reflects a single received BGP route as two distinct routing updates towards a
    target client. By preserving the original client next-hop in one update and modifying
    the next-hop to the RR's own address in the second update, the receiving client
    obtains two parallel paths for the same prefix. This enables the receiving client
    to implement Load Balancing or Primary-Backup path protection without requiring
    full-mesh IBGP sessions or BGP Add-Path extensions.</p>"
