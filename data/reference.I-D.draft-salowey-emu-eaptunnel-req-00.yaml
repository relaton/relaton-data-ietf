abstract:
- language: en
  script: Latn
  content: "<p>This memo provides an outline for the requirements for a Tunnel Extensible
    Authentication Protocol (EAP) Method.  This method will use Transport Layer Security
    (TLS) to establish a tunnel.  The tunnel will support password authentication,
    EAP authentication and the transport of additional data for other purposes.</p>"
