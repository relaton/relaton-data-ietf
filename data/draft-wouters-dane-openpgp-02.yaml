abstract:
- language: en
  script: Latn
  content: "<p>OpenPGP is a message format for email (and file) encryption, that lacks
    a standarized lookup mechanism to obtain OpenPGP public keys. This document specifies
    a standarized method for securely publishing and locating OpenPGP public keys
    in DNS using a new OPENPGPKEY DNS Resource Record.</p>"
