abstract:
- language: en
  script: Latn
  content: "<p>GEVP defines a minimal protocol for epistemic convergence. Renamed
    from VCP to avoid collision with draft-kamimura-scitt-vcp. Invariant C_manip &gt;
    C_val*2.0 as engineering heuristic. Theta 0.73 RECOMMENDED, pinned 7755f53. Architecture
    stable per https://github.com/GravitOpenNetwork/gravit-canon. This revision adds
    a formal mapping between GEVP's Epistemic State Machine and the evidence taxonomy
    defined in the Gravit Verifiable Epistemic Decision Standard (VEDS).</p>"
