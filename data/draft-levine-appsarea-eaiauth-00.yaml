abstract:
- language: en
  script: Latn
  content: "<p>SPF, DKIM, and DMARC enable a domain owner to publish e-mail authentication
    and policy information in the DNS. In internationalized e-mail, domain names can
    occur both as U-labels and A-labels. This specification clarifies when to use
    which form of a domain names when using SPF, DKIM, and DMARC.</p>"
