abstract:
- language: en
  script: Latn
  content: "<p>This document describes the behavior of the B4 when co-located with
    a NAT while the NAT in the AFTR is disabled.  The proposed solution is expected
    to offload the burden on the AFTR, by delegating the NAT to B4.</p>"
