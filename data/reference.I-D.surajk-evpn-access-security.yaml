abstract:
- language: en
  script: Latn
  content: "<p>The draft defines a new BGP EVPN route message for syncing DHCP packet
    contents as well as snoop entry among PEs in an Ethernet Segment (ES).  The snoop
    entry is required to implement Dynamic ARP inspection (DAI), IP Source Guard (IPSG/IPSGv6)
    and IPv6 Neighbor Discovery Inspection (NDI) access security features.</p>"
