abstract:
- language: en
  script: Latn
  content: "<p>This document describes protocol extensions to PIM-SM for supporting\nPIM-SM neighbors that are not directly connected. The mechanism\ndescribed herein makes use of PIM-SM Hello messages that are directed\nto the remote neighbor. Following the discovery of the remote\nneighbor PIM-SM Join and Prune messages can be exchanged.</p>"
