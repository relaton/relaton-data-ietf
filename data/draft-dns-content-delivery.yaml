abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a mechanism for serving content, such as HTML\n   or JSON, directly via DNS TXT records.  This feature is intended as a\n   fallback mechanism when a primary service (A/AAAA record) is\n   unreachable, or as a lightweight hosting solution for parked domains\n   to display landing pages without requiring active HTTP servers or\n   individual SSL certificates.  Trust is established via DNSSEC,\n   allowing browsers to treat the content as secure.</p>"
