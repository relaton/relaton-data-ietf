abstract:
- language: en
  script: Latn
  content: "<p>Cryptographic algorithms for go through multiple phases during their
    lifetime: experimental, adopted, generally available, in mainstream use, phasing
    out, deprecated, and obsoleted. This document defines phases for algorithm deployment
    lifecycles within DNSSEC, and criteria that can be used by the IETF for moving
    an algorithm from one phase to the next.</p>"
