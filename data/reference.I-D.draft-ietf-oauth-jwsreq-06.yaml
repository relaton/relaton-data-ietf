abstract:
- language: en
  script: Latn
  content: <p>The authorization request in RFC6749 utilizes query parameter serialization.  This
    specification defines the authorization request using JWT serialization.  The
    request is sent by value through "request" parameter or by reference through "request_uri"
    parameter that points to the JWT, allowing the request to be optionally signed
    and encrypted.</p>
