abstract:
- language: en
  script: Latn
  content: "<p>This document describe a new method for the Presence Server to process
    presence in inter-domain scenarios. The currently-defined method according to
    RFC 3261 [1] and RFC 3265 [2] results in duplicated messaging. This document provides
    a new method to avoid this duplication.</p>"
