abstract:
- language: en
  script: Latn
  content: "<p>This document describes an encapsulaton of IPv6 packets using Link-
    Layer Discovery Protocol (LLDP). LLDP has the desireable property over standard
    ethernet encapsulation that it does not propogate through layer-switching fabric.
    This makes creation of the autonomic control plane easier.</p>"
