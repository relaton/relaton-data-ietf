abstract:
- language: en
  script: Latn
  content: "<p>This document aims at providing a recommendation for the design of
    future DHCP options when both IP Address and Name encoding are needed to be supported.
    This design reconciles the flexibility requirement from service providers and
    the DHC WG recommendation to avoid defining options conveying similar set of configuration
    data.</p>"
