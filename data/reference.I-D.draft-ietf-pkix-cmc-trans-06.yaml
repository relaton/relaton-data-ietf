abstract:
- language: en
  script: Latn
  content: '<p>This document defines a number of transport mechanisms that are used
    to move CMC (Certificate Management over CMS (Cryptographic Message Syntax)) messages.
    The transport mechanisms described in this document are: HTTP, file, mail and
    TCP.1. Overview This document defines a number of transport methods that are used
    to move CMC messages (defined in [CMC-STRUCT]). The transport mechanisms described
    in this document are: HTTP, file, mail and TCP. The key words "MUST", "MUST NOT",
    "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY",
    and "OPTIONAL" in this document are to be interpreted as described in [RFC2119].</p>'
