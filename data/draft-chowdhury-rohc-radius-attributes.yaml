abstract:
- language: en
  script: Latn
  content: <p>The definition of RADIUS attribute "Framed-Compression" in RFC 2865
    does not include values for new Header Compression schemes like ROHC, ROHC-TCP.
    This document defines the new values to the "Framed- Compression" attribute.</p>
