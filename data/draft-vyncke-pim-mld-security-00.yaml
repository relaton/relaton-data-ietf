abstract:
- language: en
  script: Latn
  content: "<p>The latest version of Multicast Listener Discovery protocol is defined
    in RFC 3810, dated back in 2004. New security research has exhibited new vulnerabilities
    in MLD, both remote and local attack vectors. This document describes those vulnerabilities
    and proposes specific mitigation techniques.</p>"
