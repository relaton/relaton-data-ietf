abstract:
- language: en
  script: Latn
  content: "<p>With IP protocols now generalizing to constrained networks, users expect
    to be able to Operate, Administer and Maintain them with the familiar tools and
    protocols they already use on less constrained networks.</p>"
- language: en
  script: Latn
  content: "<p>OAM uses specific messages sent into the data plane to measure some
    parameters of a network.  Most of the time, no explicit values are sent is these
    messages.  Network parameters are obtained from the analysis of these specific
    messages.</p>"
- language: en
  script: Latn
  content: "<p>This can be used:</p>"
- language: en
  script: Latn
  content: "<p>*  To detect if a host is up or down.</p>"
- language: en
  script: Latn
  content: "<p>*  To measure the RTT and its variation over time.</p>"
- language: en
  script: Latn
  content: "<p>*  To learn the path used by packets to reach a destination.</p>"
- language: en
  script: Latn
  content: "<p>OAM in LPWAN is a little bit trickier since the bandwidth is limited
    and extra traffic added by OAM can introduce perturbation on regular transmission.</p>"
- language: en
  script: Latn
  content: "<p>Two scenarios can be investigated:</p>"
