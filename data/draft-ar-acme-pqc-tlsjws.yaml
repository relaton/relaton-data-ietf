abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 8555 (ACME) to specify post-quantum and PQ/\n   T hybrid cryptographic requirements for quantum-ready deployments.\n   The Automatic Certificate Management Environment (ACME) automates\n   certificate issuance, validation, and management over HTTPS using\n   JSON Web Signatures (JWS) to authenticate client request payloads.\n   Current ACME deployments rely on traditional public-key algorithms in\n   both JWS and TLS, which are vulnerable to attacks from\n   Cryptographically Relevant Quantum Computers (CRQCs).  These profiles\n   define PQC or PQ/T TLS 1.3 key establishment and specify PQC or PQ/T\n   authentication mechanisms for JWS and TLS where required by the\n   selected quantum-ready profile.  Together, these profiles enable ACME\n   clients and servers to achieve quantum-resistant confidentiality and\n   authentication.</p>"
