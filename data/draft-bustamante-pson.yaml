abstract:
- language: en
  script: Latn
  content: "<p>PSON (Packed Sensor Object Notation) is a compact binary data\n   encoding format designed for IoT environments where bandwidth,\n   memory, and processing power are constrained.  PSON efficiently\n   represents the data types commonly found in sensor telemetry and\n   device interaction: integers, floating-point numbers, booleans,\n   strings, binary blobs, arrays, and key-value maps.  It achieves\n   significant size reductions over JSON (40-75% for typical IoT\n   payloads) through inline small value encoding and variable-length\n   integers.  PSON is self-describing (no external schema required for\n   decoding) and designed for minimal implementation complexity on\n   microcontrollers.</p>"
