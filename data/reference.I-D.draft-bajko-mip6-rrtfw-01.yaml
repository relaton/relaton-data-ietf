abstract:
- language: en
  script: Latn
  content: "<p>Firewalls represent an integral part of today's IP networks, currently
    based on IPv4 technology. Deployment of IPv6 is under way, and firewall vendors
    will need to deploy firewalls which will be able to handle IPv6 packets, including
    its many extensions. Mobile IPv6, standardized in RFC3775, specifies a number
    of extensions and procedures to IPv6, which do not work when firewalls are on
    the data communication path [1]. This document defines a slightly modified Return
    Routability Test (RRT) for MIPv6 [2]. The new method is firewall friendly and
    allows a mobile node to send Binding Update message to its correspondent node
    (so that Route Optimization can be applied) and ensures that the CN receives the
    Binding Update, even when either the mobile node, the CN, or both are located
    behind firewalls.</p>"
