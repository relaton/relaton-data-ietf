abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Session Initiation (SIP) Control Package for
    Conference Control. The control of Media Servers and their related resources in
    decomposed network architectures plays an important role in various Next Generation
    Networks. This Control Package aims to fulfil Conferencing requirements using
    the SIP Control Framework[7].</p>"
