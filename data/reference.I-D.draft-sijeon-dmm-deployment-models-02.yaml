abstract:
- language: en
  script: Latn
  content: "<p>This document presents available deployment models for distributed
    mobility management networks, consisted of mobility management functions: anchoring
    function, location management, and forwarding management functions defined in
    RFC7429.  Some of the functions are modified on a need to allow potential deployment
    scenarios support.</p>"
