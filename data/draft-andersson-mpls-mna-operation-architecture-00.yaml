abstract:
- language: en
  script: Latn
  content: "<p>MPLS Network Action (MNA) allows MPLS packet to carry instruction and
    data for in-network services and functions in an MPLS network. This document describes
    the network operations to support MNAs and what actions an MNA capable Label Switching
    Router (LSR) takes when MNA is present or absent in an packet.</p>"
