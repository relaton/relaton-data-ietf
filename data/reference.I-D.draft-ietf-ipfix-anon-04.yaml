abstract:
- language: en
  script: Latn
  content: "<p>This document describes anonymisation techniques for IP flow data and
    the export of anonymised data using the IPFIX protocol.  It categorizes common
    anonymisation schemes and defines the parameters needed to describe them.  It
    provides guidelines for the implementation of anonymised data export and storage
    over IPFIX, and describes an information model and Options-based method for anonymisation
    metadata export within the IPFIX protocol or storage in IPFIX Files.</p>"
