abstract:
- language: en
  script: Latn
  content: "<p>An RTP profile (SAVP) is defined for secure real-time communications,
    and another profile (AVPF) is specified to provide timely feedback from the receivers
    to a sender. This memo defines the combination of both profiles to enable secure
    RTP communications with feedback.</p>"
