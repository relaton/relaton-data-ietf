abstract:
- language: en
  script: Latn
  content: "<p>Current source address validation (SAV) on an AS's provider\n   interfaces mainly relies on loose uRPF, which cannot defend against\n   IP spoofing using routable prefixes and is ineffective when a default\n   route is present.  This document describes a *framework* for provider\n   interface source address validation against spoofing of customer cone\n   source prefixes (PI-SAV for CC).  Two architectural approaches are\n   presented:\n\n   *  *PI-SAV for Standalone CC*: a static solution that builds a\n      blocklist based on topology information from BGP RIBs, RPKI ASPA,\n      and local configuration (SLURM) etc.  It requires no inter-AS\n      communication.\n\n   *  *PI-SAV for Standalone+ CC*: an enhanced solution that uses\n      lightweight query-response coordination between the top AS and\n      member ASes to identify sub-cones that do not actually cause\n      traffic detours, thereby enlarging the effective blocklist.\n\n   This document is *informational* and provides only the framework,\n   conceptual procedures, and requirements for future protocol\n   specifications.  Detailed wire protocols (e.g., for partial transit\n   information provisioning or for query-response messaging) are out of\n   scope and will be defined in separate documents.</p>"
