abstract:
- language: en
  script: Latn
  content: "<p>This subnet configuration option set provides subnet address assignment
    capability to DHCP[1,2] to be applied to both virtual subnet creation like as
    LIS[3], V-LAN and static subnet configuration for new deployed network. This draft
    illustrates service models for subnet configuration, protocol design concept,
    protocol behavior and discussions.</p>"
