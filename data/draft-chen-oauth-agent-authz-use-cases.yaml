abstract:
- language: en
  script: Latn
  content: "<p>This document provides a systematic analysis of these emerging agent-
    based use cases. It categorizes them into distinct scenarios, details their specific
    authorization requirements, and performs a comprehensive gap analysis against
    the existing OAuth 2.0 framework [RFC6749] and its common extensions. The analysis
    identifies fundamental mismatches, the goal of this document is to articulate
    these gaps clearly, providing a foundation for future work on new extensions within
    the OAuth Working Group to address the authorization needs of the next generation
    of ai agents.</p>"
