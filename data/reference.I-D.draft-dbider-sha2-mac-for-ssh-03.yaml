abstract:
- language: en
  script: Latn
  content: "<p>This memo defines algorithm names and parameters for use of some of
    the SHA-2 family of secure hash algorithms for data integrity verification in
    the Secure Shell (SSH) protocol.  This document adds new Message Authentication
    Code (MAC) algorithms to the set defined in RFC 4253 [RFC4253].</p>"
