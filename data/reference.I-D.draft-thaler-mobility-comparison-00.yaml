abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv6 (MIP6), the Level 3 Multihoming Shim Protocol (SHIM6),
    and the Host Identity Protocol (HIP) all address various aspects of mobility and
    multi-homing in similar ways. This document gives a brief comparison of their
    features.</p>"
