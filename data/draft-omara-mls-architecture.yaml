abstract:
- language: en
  script: Latn
  content: "<p>This document describes the architecture and requirements for the\n   Messaging Layer Security (MLS) protocol.  MLS provides a security\n   layer for group messaging applications with from two to a large\n   number of clients.  It is meant to protect against eavesdropping,\n   tampering, and message forgery.</p>"
