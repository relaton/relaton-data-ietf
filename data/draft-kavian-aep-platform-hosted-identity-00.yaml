abstract:
- language: en
  script: Latn
  content: "<p>This document defines interoperable hosted identity behavior for Agent
    Enrollment Protocol (AEP) Platforms. It lets a Platform provision Service-scoped
    Agent did:web identities, publish DID documents, custody signing keys, and produce
    AEP client assertion JWTs through delegated signing operations.</p>"
