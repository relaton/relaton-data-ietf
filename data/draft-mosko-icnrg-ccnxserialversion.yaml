- language: en
  script: Latn
  content: |-
    <p>This document specifies using a serial number to indicate versions in
       name name segments.  A serial number is an increasing unsigned
       integer with an increment of 1.  Therefore, given one name with a
       serial version number, one may compute the next version number.</p>
