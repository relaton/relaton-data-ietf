abstract:
- language: en
  script: Latn
  content: "<p>HMTFTP is a lightweight UDP file transfer protocol derived from TFTP.\n   It preserves the TFTP transfer model (RRQ/WRQ, DATA, ACK, ERROR, and\n   OACK option acknowledgment) and replaces text options with binary\n   TLVs.  HMTFTP defines optional AEAD protection for DATA payloads\n   using HKDF-derived keys from a pre-shared key (PSK).\n\n   This document describes transfer behavior, extension processing\n   rules, key derivation, nonce construction, and operational guidance\n   for experimental implementations intended to facilitate\n   interoperability.\n\n   This document requests IANA actions for a UDP service name/port and\n   registries for TLV Types and Ciphersuites.  Until assignment, TBD1 is\n   used as the default UDP port value.</p>"
