abstract:
- language: en
  script: Latn
  content: "<p>The DHCP Relay Agent Information Option (RFC 3046) conveys information
    between a DHCP relay agent and a DHCP server. This specification defines a mechanism
    for securing the messages exchanged between a relay agent and a server using IPsec
    (RFC 2401)</p>"
