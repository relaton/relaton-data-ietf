abstract:
- language: en
  script: Latn
  content: "<p>In order to integrate RoHC with IPsec [ROHCOIPSEC], a mechanism is
    needed to negotiate RoHC configuration parameters between end-points. Internet
    Key Exchange (IKE) is a mechanism which can be leveraged to handle these negotiations.
    \ This document specifies extensions to IKEv2 [IKEV2] that will allow RoHC and
    its associated configuration parameters to be negotiated for IPsec security associations
    (SAs).</p>"
