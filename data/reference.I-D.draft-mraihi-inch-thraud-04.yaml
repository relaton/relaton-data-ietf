abstract:
- language: en
  script: Latn
  content: "<p>This document describes a data-format and protocol for defining and
    exchanging Transaction Fraud (Thraud) Report Data. It extends the INCH WG's IODEF
    XML [IODEF] incident reporting format. Both inbound (Thraud Reports) and outbound
    (Thraud Watchlists) mechanisms are presented. This work has been endorsed by the
    Initiative for Open AuTHentication [OATH].</p>"
