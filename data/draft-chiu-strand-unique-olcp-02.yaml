abstract:
- language: en
  script: Latn
  content: "<p>Advances in the Optical Layer control plane is critical to ensure tremendous
    amount of bandwidth generated by the DWDM technology be provided to upper layer
    services in a timely, reliable, and cost effective fashion. This document describes
    some unique features and requirements for the Optical Layer control plane that
    protocol designers need to take into consideration</p>"
