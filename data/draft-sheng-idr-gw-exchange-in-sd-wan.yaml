- language: en
  script: Latn
  content: "<p>The document describes the control plane enhancement for multi- segment
    SD-WAN to exchange the associated GW information between edges. Discussion Venues
    This note is to be removed before publishing as an RFC. Discussion of this document
    takes place on the Inter-Domain Routing Working Group mailing list (idr@ietf.org),
    which is archived at https://mailarchive.ietf.org/arch/browse/idr/. Source for
    this draft and an issue tracker can be found at https://github.com/VMatrix1900/draft-sheng-idr-gw-exchange-in-sd-wan.</p>"
