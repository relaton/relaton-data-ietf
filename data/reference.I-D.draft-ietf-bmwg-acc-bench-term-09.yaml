abstract:
- language: en
  script: Latn
  content: "<p>This document provides the Terminology for performing Accelerated Stress
    Benchmarking of networking devices. The three phases of the Stress Test: Startup,
    Instability and Recovery are defined along with the benchmarks and configuration
    terms associated with the each phase. Also defined are the Benchmark Planes fundamental
    to stress testing configuration, setup and measurement. The terminology is to
    be used with the companion framework and methodology documents.</p>"
