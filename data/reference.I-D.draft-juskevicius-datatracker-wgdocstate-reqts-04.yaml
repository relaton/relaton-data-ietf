abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for new functionality to be added
    to the IETF Datatracker tool to make it possible for Working Group (WG) Chairs
    and their delegates to input and update the status of WG documents.  After the
    functionality is implemented, WG Chairs, WG document authors and all other IETF
    participants will have access to more information about the WG status history,
    current state, and progression of IETF WG documents from their earliest stages.</p>"
