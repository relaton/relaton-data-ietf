abstract:
- language: en
  script: Latn
  content: <p>This document describes a mechanism to add origin authentication, message
    integrity, replay-resistance, message sequencing, and detection of missing messages
    to the transmitted syslog messages. This specification draws upon the work defined
    in RFC xxx, "The syslog Protocol", however it may be used atop any message delivery
    mechanism, even that defined in RFC 3164, "The BSD syslog Protocol", or in the
    RAW mode of "RFC 3195, "The Reliable Delivery of syslog".</p>
