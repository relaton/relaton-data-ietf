- language: en
  script: Latn
  content: "<p>This memo describes the behaviour of a node that when connecting to
    a network, offers connectivity via itself to other nodes (or entities needing
    addresses) connected to it. The focus is on IPv6 connectivity, but the same principles
    could be applied to IPv4.</p>"
