abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG model for network inventory topology to
    correlate the network inventory data with the general topology model to form a
    base underlay network, which can facilitate the mapping and correlation of the
    layer (e.g. Layer 2, Layer3) topology information above to the inventory data
    of the underlay network for agile service provisioning and network maintenance
    analysis.</p>"
