  script: Latn
  content: "<p>The DHCP Relay Agent Assignment Notification (RAAN) option is sent
    from a DHCP server to a DHCP relay agent to inform the relay agent of IPv6 addresses
    that have been assigned or IPv6 prefixes that have been delegated to DHCP clients.</p>"
