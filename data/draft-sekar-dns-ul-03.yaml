abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes a new EDNS0 option that can be used by DNS
       Update clients and DNS servers to include a lease lifetime in a DNS
       Update or response, allowing a server to garbage collect stale
       resource records that have been added by DNS Updates</p>
