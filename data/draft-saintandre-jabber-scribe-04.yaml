abstract:
- language: en
  script: Latn
  content: <p>During IETF meetings, individual volunteers often help sessions run
    more smoothly by relaying information back and forth between the physical meeting
    room and an associated textual chatroom. Such volunteers, commonly called "Jabber
    scribes", might benefit from the suggestions provided in this document.</p>
