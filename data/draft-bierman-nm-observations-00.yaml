abstract:
- language: en
  script: Latn
  content: "<p>This memo contains observations on the progress of standards based
    network management efforts within the IETF. In particular, it describes technical
    and process oriented deficiencies which have delayed the creation and adoption
    of standards for network device configuration, and offers recommendations for
    correcting these deficiencies.</p>"
