id: draftthomassendnsopcdsconsistency
schema_version: v1.5.6
formattedref:
  content: draft-thomassen-dnsop-cds-consistency
title:
- language: en
  script: Latn
  content: Consistency for CDS/CDNSKEY and CSYNC is Mandatory
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-thomassen-dnsop-cds-consistency-03
docidentifier:
- content: draft-thomassen-dnsop-cds-consistency
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2023-03-04'
abstract:
- language: en
  script: Latn
  content: "<p>Maintenance of DNS delegations requires occasional changes of the DS\n   and NS record sets on the parent side of the delegation.  [RFC7344]\n   automates this for DS records by having the child publish CDS and/or\n   CDNSKEY records which hold the prospective DS parameters.  Similarly,\n   CSYNC records indicate a desired update of the delegation's NS\n   records [RFC7477].  Parent-side entities (e.g.  Registries,\n   Registrars) typically discover these records by periodically querying\n   them from the child (\"polling\"), before using them to update the\n   delegation's parameters.\n\n   This document specifies that if polling is used, parent-side entities\n   MUST ensure that updates triggered via CDS/CDNSKEY and CSYNC records\n   are consistent across the child's authoritative nameservers, before\n   taking any action based on these records.</p>"
