abstract:
- language: en
  script: Latn
  content: "<p>This document defines a profile for SCIM 2.0 to meet the security and
    interoperability requirements for identity lifecycle management within enterprises.
    Within the context of SCIM, the profile establishes requirements for provisioning,
    account management, client authentication, and identity synchronization across
    three Account Lifecycle assurance levels: AL1 (User Deprovisioning), AL2 (User
    and Group Management), and AL3 (Role Management).</p>"
