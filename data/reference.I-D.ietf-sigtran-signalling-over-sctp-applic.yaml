abstract:
- language: en
  script: Latn
  content: "<p>This document describes the applicability of the new protocols developed
    under the signaling transport framework[RFC2719]. A description of the main issues
    regarding the use of the Stream Control Transmission Protocol (SCTP)[RFC2960]
    and each adaptation layer for transport of telephony signalling information over
    IP infrastructure is explained.</p>"
