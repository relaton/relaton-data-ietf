id: draftietfdnsopstructureddnserror
schema_version: v1.5.6
title:
- language: en
  script: Latn
  content: Structured Error Data for Filtered DNS
  format: text/plain
docidentifier:
- content: draft-ietf-dnsop-structured-dns-error
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-07-29'
abstract:
- language: en
  script: Latn
  content: "<p>DNS filtering is widely deployed for various reasons, including network
    security and policy enforcement. However, filtered DNS responses lack structured
    information for end users to understand the reason for the filtering. Existing
    mechanisms to provide explanatory details to end users cause harm especially if
    the blocked DNS response is for HTTPS resources. This document updates RFC 8914
    by signaling client support for structuring the EXTRA-TEXT field of the Extended
    DNS Error to provide details on the DNS filtering. Such details can be parsed
    by the client and displayed, logged, or used for other purposes.</p>"
  format: text/html
