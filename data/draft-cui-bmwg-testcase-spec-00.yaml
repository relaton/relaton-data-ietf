abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a standardized test case specification used in
       automated network protocol testing.  The specification aims to
       provide a structured and interoperable format for representing test
       cases that evaluate the implementations of network protocols.  This
       work facilitates the development of protocol-agnostic testing
       frameworks and improves the repeatability and automation of network
       testing.</p>
