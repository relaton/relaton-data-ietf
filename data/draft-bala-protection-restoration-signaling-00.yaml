  script: Latn
  content: "<p>Protection and restoration of switched connections under tight time
    constraints is a challenging problem in optical mesh networks. This draft describes
    different local and end-to-end protection modes for connections, and the message
    flow required for protection and restoration-related signaling.</p>"
