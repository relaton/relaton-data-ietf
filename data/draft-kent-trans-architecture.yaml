abstract:
- language: en
  script: Latn
  content: "<p>This document describes the architecture for Certificate Transparency
    (CT) focusing on the Web PKI context. It defines the goals of CT and the elements
    that comprise the CT system. It also describes the major features of these elements.
    Other documents, cited in the References, establish requirements for these CT
    system elements and describe their operation in greater detail.</p>"
