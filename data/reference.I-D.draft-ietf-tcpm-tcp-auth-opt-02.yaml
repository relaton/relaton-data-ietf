abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the TCP Authentication Option (TCP-AO), which
    obsoletes the TCP MD5 Signature option of RFC-2385 (TCP MD5). TCP-AO specifies
    the use of stronger Message Authentication Codes (MACs), protects against replays
    even for long-lived TCP connections, and provides more details on the association
    of security with TCP connections than TCP MD5. TCP-AO is compatible with either
    static  keying or an external, out-of-band key management mechanism; in either
    case, TCP-AO also protects connections when using the same key across repeated
    instances of a connection. The result is intended to support current infrastructure
    uses of TCP MD5, such as to protect long-lived connections (as used, e.g., in
    BGP and LDP), and to support a larger set of MACs with minimal other system and
    operational changes. TCP-AO uses its own option identifier, even though used mutually
    exclusive of TCP MD5 on a given TCP connection. TCP-AO supports IPv6, and is fully
    compatible with the requirements for the replacement of TCP MD5.</p>"
