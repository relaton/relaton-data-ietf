abstract:
- language: en
  script: Latn
  content: |-
    <p>Multicast DNS will not normally extend beyond the MAC Bridge.  This
       limitation is problematic when desired services are beyond the reach
       of multicast mDNS.  This document explores security considerations
       when overcoming this limitation.</p>
