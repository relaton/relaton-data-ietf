abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method for making random selections in such
    a way that the unbiased nature of the choice is publicly verifiable. For example,
    the selection of the voting members of the IETF Nominations Committee (NomCom)
    from the pool of eligible volunteers. Similar techniques would be applicable to
    other cases.</p>"
