- language: en
  script: Latn
  content: "<p>This document specifies extensions to PCEP protocol when a PCE-based
    controller is also responsible for configuring the forwarding actions on the routers,
    in addition to computing the paths for packet flows in a BIER-TE network and telling
    the edge routers what instructions to attach to packets as they enter the network.</p>"
