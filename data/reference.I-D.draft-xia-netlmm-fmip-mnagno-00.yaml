abstract:
- language: en
  script: Latn
  content: "<p>In the current Proxy Mobile IPv6 (PMIPv6) proposals, the mobile nodes
    do not implement any mobility management protocol. This document proposes an enhancement
    to PMIPv6 protocol in order to improve Layer 3 handover performance through borrowing
    some ideas from FMIPv6 protocol and using IEEE 802.21 triggers. It proposes to
    use FMIP PAR-NAR signaling to establish a tunnel and PAR uses this tunnel to send
    MN's packets to NAR during handover. FMIP PAR-NAR signaling depends on the predictive
    and reactive modes of handover.</p>"
