abstract:
- language: en
  script: Latn
  content: "<p>This document defines two YANG data modules. The first is the initial
    version of the IANA-maintained YANG module for Maximum SID Depths (MSDs) Types.
    The second augments the IETF MPLS YANG model to provide support for MPLS MSDs
    as defined in RFC 8476 and RFC 8491.</p>"
