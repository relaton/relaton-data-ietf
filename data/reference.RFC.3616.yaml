abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Uniform Resource Name Namespace Identification
    (URN NID) for the Foundation for Intelligent Physical Agents (FIPA). This URN
    NID will be used for identification of standard components published by the FIPA
    standards body in the area of Agent technology.</p>"
