  script: Latn
  content: "<p>This document augments the ietf-yang-library in [RFC8525] to provide
    the augmentation list. It facilitates the process of obtaining the entire dependencies
    of YANG model, by directly querying the server YANG module. Discussion Venues
    This note is to be removed before publishing as an RFC. Source for this draft
