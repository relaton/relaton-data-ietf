abstract:
- language: en
  script: Latn
  content: "<p>This memo documents the concept of virtual AP which refers to using
    \nmulti physical APs to simulate only one virtual AP, method and \nprocess used
    for seamless handoff between APs upon IEEE802.11 network. \nIt defines the stages
    to actualize smooth handoff, mentions the \nconcepts, theories and requirements
    in these stages.</p>"
