abstract:
- language: en
  script: Latn
  content: "<p>This document defines dsub, an OPTIONAL, descriptive claim naming the
    *decision subject*, the party an automated agent's action is taken _upon_, as
    distinct from the acting agent (act) and the delegating principal (sub). Its purpose
    is *audit legibility*: letting a record name the party a decision concerns, which
    is the precondition for that record ever being made legible to them. The claim
    is privacy- minimizing by construction and is NOT an input to the authorization
    decision; a Policy Decision Point MUST ignore it. This document defines representation
    only.</p>"
