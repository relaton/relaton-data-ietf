abstract:
- language: en
  script: Latn
  content: "<p>Several addressing mechanisms supporting DHCPv6 Prefix Delegation in
    home networks require identification of the customer edge router (CER) as the
    demarcation between the customer network and the service provider network. This
    document reserves a DHCPv6 option to identify the CER.</p>"
