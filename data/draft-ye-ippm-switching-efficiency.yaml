abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Switching Efficiency Framework, a\n   measurement methodology designed to evaluate network efficiency in AI\n   Data Centers (AIDCs).  Conventional network metrics, such as\n   bandwidth utilization or network throughput, fail to directly link\n   network activity to computational progress, as they cannot\n   distinguish computationally effective data that directly advances\n   neural network computing from the redundant traffic induced by both\n   multi-hop forwarding and the algorithmic overhead of collective\n   operations.\n\n   To address this, this document defines the Switching Efficiency\n   Framework, a measurement methodology for evaluating AIDC network\n   efficiency.  The core metric, Switching Efficiency, quantifies the\n   computationally effective data throughput delivered per unit of\n   provisioned switching capacity.  To facilitate precise diagnostic\n   analysis, the framework further decomposes this core metric into\n   three fine-grained factors: Data Efficiency, Routing Efficiency, and\n   Port Utilization.\n\n   This framework provides metrics that can help operators identify\n   communication bottlenecks and evaluate topology-traffic alignment.</p>"
