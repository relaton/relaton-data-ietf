abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a mechanism for embedding security-related
       metadata within the Geneve header (RFC 8926).  It allows a security
       Enforcement Point to attach a cryptographically signed, verifiable
       attestation of how it handled a packet, so that downstream
       Enforcement Points and tunnel endpoints can confirm that security
       policy was actually executed on the data path -- detecting policy
       bypasses and divergence between Enforcement Points that should agree
       -- while each Enforcement Point continues to enforce its own policy
       independently.  This validation of execution complements the
       management plane's validation of intent.  The document presents two
       operational models.  The primary model is the "End-to-End Attestation
       Model", fully compliant with RFC 8926, where an ingress tunnel
       endpoint adds and cryptographically signs metadata, and an egress
       endpoint verifies it.  This enables downstream nodes to verify and
       audit that policy was executed consistently, while still applying
       their own policy independently.  The second part of this document
       presents a proposal for a future extension to the Geneve standard.
       This proposed extension would allow trusted transit devices to
       participate in the metadata chain, enabling a hop-by-hop "chain of
       custody" for enhanced, real-time security responsiveness within the
       data center fabric.</p>
