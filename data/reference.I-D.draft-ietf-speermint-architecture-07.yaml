abstract:
- language: en
  script: Latn
  content: <p>This document defines the SPEERMINT peering architecture, its functional
    components and peering interface functions. It also  describes the steps taken
    to establish a session between two peering domains in the context of the functions
    defined.  Conventions used in this document  The key words "must", "must NOT",
    "REQUIRED", "SHALL", "SHALL NOT", "should", "should NOT", "RECOMMENDED", "MAY",
    and "OPTIONAL" in this document are to be interpreted as described in RFC-2119[1]</p>
