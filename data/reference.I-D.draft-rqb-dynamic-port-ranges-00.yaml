abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension regarding dynamic port range re-
    assignment to an IPv4 address sharing framework (SHARA), to overcome IPv4 address
    shortage.  It allows an entity which is responsible for address and port distribution
    to apply a more flexible handling of already assigned port ranges.  An adjustment
    of number of ports per customer according to the current consumption pattern is
    possible with this enhancement.</p>"
