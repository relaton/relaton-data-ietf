abstract:
- language: en
  script: Latn
  content: "<p>This document discusses multi-endpoint topologies used in Real-time
    Transport Protocol (RTP)-based environments.  In particular, centralized topologies
    commonly employed in the video conferencing industry are mapped to the RTP terminology.
    \ This memo provides information for the Internet community.</p>"
