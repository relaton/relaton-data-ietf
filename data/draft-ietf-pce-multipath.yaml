abstract:
- language: en
  script: Latn
  content: "<p>This document defines Path Computation Element Communication Protocol
    (PCEP) extensions to signal multipath information, associating multiple forwarding
    paths with a single PCEP Label Switched Path (LSP) to allow load-balancing and
    redundancy across diverse paths. The extensions are generic and applicable to
    both stateless and stateful PCEP, and are designed to be reusable for future path
    types. Their primary application is Segment Routing (SR) Policy, where a Candidate
    Path can contain multiple Segment Lists: current PCEP extensions for SR Policy
    only allow signaling of a single Segment List per Candidate Path. These extensions
    enable multipath capabilities such as weighted or equal-cost load-balancing across
    paths.</p>"
  format: text/html
