- language: en
  script: Latn
  content: "<p>In this document, requirements for supplementing the MPLS LDP-MIB are
    presented for the support of specific network management needs for fault and performance
    management. Based on these requirements, it describes managed objects in a supplementary
    history module for use with the LDP-MIB.</p>"
