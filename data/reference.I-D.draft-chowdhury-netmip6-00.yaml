abstract:
- language: en
  script: Latn
  content: "<p>The layer 3 connection and mobility management is essential in providing
    seamless access to services and enhanced user experience in a mobile and nomadic
    envoirnment. This document defines a mechanism via which service providers can
    deploy a managed layer 3 connectivity and mobility management scheme that is entirely
    based on the capabilities in the Network.</p>"
