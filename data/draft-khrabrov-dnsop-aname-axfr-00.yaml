abstract:
- language: en
  script: Latn
  content: "<p>This document defines the ANAME DNS resource record. ANAME provides
    name-to-name indirection for address queries while allowing other resource record
    types to exist at the same owner name. It is therefore usable at a zone apex.
    This document also defines authoritative processing, TTL and failure behavior,
    DNSSEC considerations, and interoperable transport of ANAME records in full and
    incremental zone transfers. In particular, each ANAME-capable authoritative server
    resolves the transferred target independently. This avoids treating transient,
    synthesized address records as the portable source of zone data.</p>"
