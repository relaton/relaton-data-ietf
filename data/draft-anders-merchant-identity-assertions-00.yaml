abstract:
- language: en
  script: Latn
  content: "<p>Existing work helps a relying party determine whether an automated\n   client is authorized to initiate a transaction.  This document\n   addresses how that client can obtain verifiable merchant identity\n   information about the payee before completing the transaction.\n\n   Specifically, this document defines a Merchant Identity Assertion\n   (MIA): a JSON document that attests to the verifiable identity of a\n   merchant entity and carries an embedded cryptographic proof.  It\n   defines the assertion object structure, required and optional fields,\n   the proof object, key discovery via well-known URIs, validity\n   semantics, and an optional signed Evaluation Result Token for pre-\n   transaction verification.\n\n   This document is intended to complement, not replace, existing agent\n   identity and payment authorization protocols.</p>"
