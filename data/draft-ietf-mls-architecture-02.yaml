abstract:
- language: en
  script: Latn
  content: "<p>This document describes the architecture and requirements for the Messaging
    Layer Security (MLS) protocol. MLS provides a security layer for group messaging
    applications with from two to a large number of clients. It is meant to protect
    against eavesdropping, tampering, and message forgery.</p>"
