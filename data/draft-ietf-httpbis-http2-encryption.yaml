- language: en
  script: Latn
  content: <p>This document describes how "http" URIs can be accessed using Transport
    Layer Security (TLS) and HTTP/2 to mitigate pervasive monitoring attacks. This
    mechanism not a replacement for "https" URIs; it is vulnerable to active attacks.</p>
