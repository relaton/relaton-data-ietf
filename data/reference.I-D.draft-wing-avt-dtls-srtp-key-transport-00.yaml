abstract:
- language: en
  script: Latn
  content: "<p>The existing DTLS-SRTP specification allows SRTP keys to be established
    between a pair of SRTP endpoints. However, when there are more than two participants
    in an RTP session, DTLS-SRTP is unable to provide a single key for all of the
    participants. This document describes an extension to DTLS-SRTP which transports
    SRTP keying material from one DTLS-SRTP peer to another, so the same SRTP keying
    material can be used by multiple DTLS-SRTP peers. This reduces or eliminates the
    need to key each SRTP session individually.</p>"
