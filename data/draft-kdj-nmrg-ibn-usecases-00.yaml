abstract:
- language: en
  script: Latn
  content: "<p>This document proposes several use cases of Intent-Based Networking
    (IBN) and the methodologies to differ each use case by following the lifecycle
    of a real IBN system. It includes the initial system awareness and data collection
    for the IBN system, the construction of the IBN system, the IBN system integration
    and deployment, and the evaluation and optimization of the IBN system. Practice
    learnings are also summarized to instruct the construction of next generation
    network management systems with the integration of IBN techniques.</p>"
