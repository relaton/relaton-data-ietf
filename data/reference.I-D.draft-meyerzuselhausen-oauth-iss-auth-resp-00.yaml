abstract:
- language: en
  script: Latn
  content: <p>This document specifies a new parameter "iss" that is used to explicitly
    include the issuer identifier of the authorization server in the authorization
    response of an OAuth authorization grant.  If implemented correctly, the "iss"
    parameter serves as an effective countermeasure to "mix-up" attacks.</p>
