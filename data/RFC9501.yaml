abstract:
- language: en
  script: Latn
  content: |-
    <p>This document outlines a principle for open participation that
    extends the open process principle defined in RFC 3935 by stating
    that there must be a free option for online participation to IETF
    meetings and, if possible, related IETF-hosted events.</p>
