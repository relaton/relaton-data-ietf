abstract:
- language: en
  script: Latn
  content: "<p>In MPLS-TP survivability framework, a fault condition includes both
    \nSignal Failure (SF) and Signal Degrade (SD) that can be used to \ntrigger protection
    switching. This document describes Signal Degrade \n(SD) detection and the consequent
    protection switching mechanism.</p>"
