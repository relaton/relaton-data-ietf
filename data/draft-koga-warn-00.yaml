abstract:
- language: en
  script: Latn
  content: "<p>This document describes WARN, a transport-agnostic compact binary\n   wire protocol used for emergency alerts under constrained hardware\n   and lossy networks.  It is designed to reach farther and quicker than\n   OASIS CAP, which tries to deliver full human-readable information at\n   the cost of complexity.  It primarily uses fixed fields, with support\n   for TLVs when more expressiveness is required.  It also has a\n   mandatory signature to prevent fake alerts propagating through a\n   mesh.</p>"
