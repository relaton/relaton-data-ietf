abstract:
- language: en
  script: Latn
  content: "<p>It is expected that the Domain Name System (DNS) will be used to\n   publish and retrieve Digital Emblems.  The objective of this Internet\n   Draft is to propose an architecture on how the DNS could be used and\n   outline the main challenges that will require work from the diem\n   Working Group.  Publication of this document is intended to provoke\n   discussion and analysis of how digital emblems can be deployed in the\n   DNS.</p>"
