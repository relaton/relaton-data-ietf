abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a trust model for agent-to-agent (A2A)
       interactions in multi-agent AI systems.  It specifies how agents
       obtain verifiable identities via CA-signed templates, how spawn
       chains are cryptographically established and validated, how dynamic
       policies are governed under a dual-signature model, and how cross-
       organizational agent interactions are explicitly authorized.  The
       model applies existing PKI primitives (X.509, CRL, CSR) and
       established identity patterns (OAuth 2.0, On-Behalf-Of) to the
       problem of agent provenance.  It complements the workload identity
       and OAuth delegation work in progress, supplying what that work
       leaves to the deployment: who signs an agent's bounds, how agents
       that create other agents are bounded, and per-call proof that the
       agent presenting a token is the one it names.  It addresses non-human
       identity only.  This document does not address agent-to-resource
       access control, human-in-the-loop orchestration, agent behavior, or
       the identity of the person an agent acts for, as those concerns
       belong to the resource enforcement layer, the orchestration layer,
       and the delegation layer respectively.</p>
