abstract:
- language: en
  script: Latn
  content: "<p>The goal of Application-Layer Traffic Optimization (ALTO) is to provide
    guidance to applications, which have to select one or several hosts from a set
    of candidates, which are able to provide the desired resource.  Until now the
    members in ALTO group propose many solutions, such as P4P and PROXIDOR.  The goal
    of the protocol specified in this document is to try to extend the existing solutions
    to improve the performance of protocol and better satisfy the privacy requirements.
    \ The proposed protocol is based on the P4P or merged protocol.  It introduces
    a way to transfer the guidance or costs using Network Location identifiers/PIDs
    (we called it CPID) directly. This solution can inherit the existing solution's
    architecture, messages, and other mechanisms.  It can be an independent solution
    and also be a function together with other functions in the existing solution
    to provide the guidance for different client and balance the workload on the server.</p>"
