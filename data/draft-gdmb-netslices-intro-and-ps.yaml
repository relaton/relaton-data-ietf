abstract:
- language: en
  script: Latn
  content: "<p>This document introduces Network Slicing problems and the motivation
    for new work areas. It represents an initial revision of the Network Slicing problem
    statement derived from the analysis of the technical gaps in IETF protocols ecosystem.
    It complements and brings together the silo efforts being carried out in several
    other IETF working groups to achieve certain aspects of Network Slicing functions
    and operations.</p>"
