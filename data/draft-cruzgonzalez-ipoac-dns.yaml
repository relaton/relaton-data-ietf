abstract:
- language: en
  script: Latn
  content: "<p>The Domain Name System (DNS) was designed under the implicit assumption
    that the underlying transport would be fast, reliable, and free from predation.
    This document specifies DNS over Avian Carriers (DoAC), enabling hostname resolution
    for networks operating over avian-carrier infrastructure. Without DoAC, operators
    of avian- carrier networks are forced to hardcode IP addresses directly onto their
    Carriers, a practice that does not scale and is widely considered inelegant.</p>"
