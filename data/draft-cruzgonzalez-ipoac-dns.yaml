abstract:
- language: en
  script: Latn
  content: "<p>The Domain Name System (DNS) was designed under the implicit\n   assumption that the underlying transport would be fast, reliable, and\n   free from predation.  This document specifies DNS over Avian Carriers\n   (DoAC), enabling hostname resolution for networks operating over\n   avian-carrier infrastructure.  Without DoAC, operators of avian-\n   carrier networks are forced to hardcode IP addresses directly onto\n   their Carriers, a practice that does not scale and is widely\n   considered inelegant.</p>"
