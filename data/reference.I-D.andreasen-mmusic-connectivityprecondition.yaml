  script: Latn
  content: "<p>This document defines a new connectivity precondition for the Session
    Description Protocol precondition framework described in RFC 3312. A connecitivity
    precondition can be used to delay session establishment or modification until
    media stream connectivity has been verified successfully.</p>"
