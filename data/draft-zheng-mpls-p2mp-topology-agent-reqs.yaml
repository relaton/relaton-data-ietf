- language: en
  script: Latn
  content: "<p>This document presents a set of requirements for leaf nodes and root
    node of any point-to-multipoint (P2MP) and multipoint-to-multipoint (MP2MP) Label
    Switched Paths (LSP) know each other dynamically without requiring a multicast
    routing protocol in connection-oriented service provider core networks, especially
    in Multi-Protocol Label Switching (MPLS) and Generalized MPLS (GMPLS) networks.</p>"
