title:
- language: en
  script: Latn
  content: A RoCEv2 Flow-Level Load Balancing Method Based on the IPv6 Flow Label
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-hu-6man-ipv6-flowlabel-load-balancing-rdma-02
