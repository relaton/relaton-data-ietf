abstract:
- language: en
  script: Latn
  content: "<p>There has been an increasing level of discussion within the IETF\n   about the best Working Group (WG) structures for handling the wide\n   array of DNS work being conducted within the IETF.  Wes Hardaker was\n   asked to gather information from the community at large through\n   e-mail, hallway discussions, and meetings and create a small team to\n   discuss potential structural changes to be shared with the community.\n   This document describes the team’s aggregated findings, their derived\n   recommendations, and topics where the team did not find sufficient\n   commonality within the collected opinions.\n\n   This document is published to retain the record for historic\n   reference.</p>"
