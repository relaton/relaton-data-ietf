abstract:
- language: en
  script: Latn
  content: "<p>This document specifies problem definition and use cases of NFV resource
    management in service chaining for path optimization, traffic optimization, failover,
    load balancing, etc. It further describes design considerations and relevant framework
    for the resource management capability that dynamically creates and updates network
    forwarding paths (NFPs) considering resource constraints of NFV infrastructure.</p>"
