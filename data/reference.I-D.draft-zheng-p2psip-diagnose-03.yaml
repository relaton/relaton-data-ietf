abstract:
- language: en
  script: Latn
  content: "<p>This document describes P2PSIP diagnostics. It extends the methods
    defined in the base protocol for the diagnostics in P2PSIP overlay network. A
    new method Echo is an efficient method used in the trusted overlays for retrieving
    useful diagnostic information. The methods and message formats are consistent
    with P2PSIP base protocol RELOAD, and the diagnostic information mainly comes
    from the previous version-02 of this document.</p>"
