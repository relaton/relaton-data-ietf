abstract:
- language: en
  script: Latn
  content: "<p>The Martini Working Group is defining a mechanism for SIP IP-PBX type
    devices to REGISTER and obtain SIP service for E.164-based Address of Records,
    in [draft-gin].  Another draft [draft-olive] proposes the same for non-E.164-based
    AoRs.  This document defines a variant of the Registration Event-package [reg-event]
    for open-ended AoRs for either mechanisms, using a wildcard syntax and specific
    target handling rules.</p>"
