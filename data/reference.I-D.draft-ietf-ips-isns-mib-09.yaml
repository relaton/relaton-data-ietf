abstract:
- language: en
  script: Latn
  content: "<p>The iSNS protocol provides storage name service functionality on an
    IP network that is being used for iSCSI or iFCP storage. This draft provides a
    mechanism to monitor multiple iSNS Servers, including information about registered
    objects in an iSNS Server. This memo is a product of the IP Storage (IPS) working
    group within the Internet Engineering Task Force. Comments are solicited and should
    be addressed to the working group's mailing list at ips@ietf.org and/or the authors.</p>"
