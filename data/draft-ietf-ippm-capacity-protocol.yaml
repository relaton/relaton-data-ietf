title:
- language: en
  script: Latn
  content: UDP Speed Test Protocol for One-way IP Capacity Metric Measurement
  format: text/plain
docidentifier:
- content: draft-ietf-ippm-capacity-protocol
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document addresses the problem of protocol support for measuring
    One-Way IP Capacity metrics specified by RFC 9097. The Method of Measurement discussed
    there requires a feedback channel from the receiver to control the sender's transmission
    rate in near-real-time. This document defines the UDP Speed Test Protocol for
    conducting RFC 9097 and other related measurements.</p>"
