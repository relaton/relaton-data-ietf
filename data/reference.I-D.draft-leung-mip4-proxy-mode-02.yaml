abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv4 is a standard mobility protocol that enables IPv4 device
    to roam between networks. The mobile device has the Mobile IP function to signal
    its location to the routing anchor, known as the Home Agent. However, there are
    many IPv4 devices without such capability due to various reasons. This document
    describes a solution based on Proxy Mobile IPv4, which enables some other entity
    to provide mobility support on behalf of an unaltered and mobility- unaware IPv4
    device.</p>"
