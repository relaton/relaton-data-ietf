abstract:
- language: en
  script: Latn
  content: "<p>The BGP MULTI_EXIT_DISC (MED) attribute provides a mechanism for BGP
    speakers to convey to an adjacent AS the optimal entry point into the local AS.
    While BGP MEDs function correctly in many scenarios, there are a number of issues
    which may arise when utilizing MEDs in dynamic or complex topologies. This document
    discusses implementation and deployment considerations regarding BGP MEDs and
    provides information which implementors and network operators should be familiar
    with.</p>"
