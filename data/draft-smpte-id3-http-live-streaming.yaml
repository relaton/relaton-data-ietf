abstract:
- language: en
  script: Latn
  content: "<p>This document describes how the subtitle feature for different \n   languages
    can be achievable in HTTP Live Streaming output streams. \n   In order to achieve
    the goal, SMPTE-TT XML files are used to embed \n   into the ID3 tag with user
    defined languages and text information \n   stored in multiple frames.</p>"
