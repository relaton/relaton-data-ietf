- language: en
  script: Latn
  content: "<p>This document specifies the AGENTS.TXT protocol, a strict plaintext
    policy file for automated clients, bots, and crawlers. It defines directives,
    top-line hash verification, optional parameters, and mandatory failure behavior
    for malformed files. Malformed files are treated as fully restrictive to prevent
    unintended access.</p>"
