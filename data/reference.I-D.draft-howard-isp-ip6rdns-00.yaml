abstract:
- language: en
  script: Latn
  content: "<p>In IPv4, Internet Service Providers (ISPs) commonly provide IN- ADDR.ARPA.
    information by prepopulating the zone with one PTR record for every available
    address.  This practice does not scale in IPv6. This document analyses different
    approaches to managing the ip6.arpa zone for broadband customers. .</p>"
