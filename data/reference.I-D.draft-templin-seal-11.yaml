abstract:
- language: en
  script: Latn
  content: <p>Subnetworks are connected network regions bounded by border routers
    that forward unicast and multicast packets over a virtual topology manifested
    by tunneling.  This virtual topology resembles a "virtual ethernet", but may span
    multiple IP- and/or sub-IP layer forwarding hops that can introduce packet duplication
    and/or traverse links with diverse Maximum Transmission Units (MTUs).  This document
    specifies a Subnetwork Encapsulation and Adaptation Layer (SEAL) that accommodates
    such virtual topologies over diverse underlying link technologies.</p>
