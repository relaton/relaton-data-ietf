- language: en
  script: Latn
  content: "<p>This document specifies the extensions to ICMP that allow virtual network
    information to be included in an ICMP packet.  These extensions can be used to
    facilitate troubleshooting network problems within a virtual network or across
    multiple virtual networks.</p>"
