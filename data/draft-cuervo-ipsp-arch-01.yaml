abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an architecture for IPSec policy. The proposed
    architecture extends the one described in the policy framework draft [PFRFC].
    The architecture addresses the mechanisms required to facilitate the dynamic exchange
    of policy between end administrative domains and across a number of intermediate
    domains imposing restrictive policies.</p>"
