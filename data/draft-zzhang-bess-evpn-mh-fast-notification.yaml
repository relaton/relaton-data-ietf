abstract:
- language: en
  script: Latn
  content: "<p>EVPN supports powerful multihoming features, but it depends on the\n   timely notification and handling of link going down or coming up on\n   multihomed Ethernet Segments, which may not be guaranteed by the\n   nature of control plane BGP signaling.  When the handling is delayed,\n   traffic duplication or loss may happen.  This document specifies a\n   UDP-based notification that can be originated and processed (near)\n   instantly, greatly eliminate the potential traffic duplication or\n   loss.</p>"
