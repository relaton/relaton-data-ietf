abstract:
- language: en
  script: Latn
  content: "<p>Virtual Aggregation (VA) is a technique for shrinking the DFZ FIB size
    in routers (both IPv4 and IPv6).  This allows ISPs to extend the lifetime of existing
    routers, and allows router vendors to build FIBs with much less concern about
    the growth of the DFZ routing table.  VA does not shrink the size of the RIB.
    \ VA may be deployed autonomously by an ISP (cooperation between ISPs is not required).
    \ While VA can be deployed without changes to existing routers, doing so requires
    significant new management tasks.  This document describes changes to routers
    and BGP that greatly simplify the operation of VA.</p>"
