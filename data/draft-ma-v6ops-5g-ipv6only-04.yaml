abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a practical guide of deploying 464XLAT based
       IPv6-only technology on user plane in 3GPP 5G networks.  It also
       covers key 5G concepts and architectures, configuration methods and
       operational challenges.</p>
