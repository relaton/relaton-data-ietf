abstract:
- language: en
  script: Latn
  content: "<p>This document defines several subcodes for BGP Finite State Machine
    Error that could provide more information to help network operators in diagnosing
    BGP FSM issues and correlating network events. It also provides a mechanism for
    BGP speaker to notify its peer the reason for last time session flap after the
    session comes up again.</p>"
