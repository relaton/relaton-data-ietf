abstract:
- language: en
  script: Latn
  content: "<p>This document defines random-access authenticated encryption of large
    write-once files for Messaging Layer Security (MLS) groups. A file is encrypted
    so that a receiver can decrypt and authenticate any byte range without processing
    the whole file. The encryption is SEAL- attachment, SEAL's named write-once attachment
    scheme (raAE), parameterized by the AEAD and key derivation function of the group's
    MLS cipher suite and keyed from the MLS exporter. The encrypted bytes are carried
    by any means, and a recipient needs only a small reference (the object's identifier,
    length, and snapshot value, and an optional locator) to fetch, key, and verify
    the object. Carrying that reference in an MLS message attributes the object to
    the member that sent the message. MLS application messages cannot carry large
    files, and existing attachment encryption produces an opaque, immutable blob with
    no partial access. This extension supplies the random-access layer those uses
    need.</p>"
