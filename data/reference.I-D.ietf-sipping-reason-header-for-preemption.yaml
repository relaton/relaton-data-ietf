abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an IANA Registration extension to the Session
    Initiation Protocol (SIP) Reason Header to include in a BYE Method Request as
    a result of a session preemption event, either at a user agent (UA), or somewhere
    in the network involving a reservation- based protocol such as RSVP or NSIS. This
    document does not attempt to address routers failing in the packet path; but a
    deliberate event of tearing down a flow between UAs, and informing the terminated
    UA(s) with an indication of what occurred.</p>"
