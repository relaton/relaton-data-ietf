abstract:
- language: en
  script: Latn
  content: "<p>Source address validation (SAV) is an important means to mitigate IP
    source address spoofing [RFC2827]. This document analyzes the gaps in current
    operational mechanisms for intra-domain SAV. It also identifies the properties
    that new intra-domain SAV mechanisms are expected to provide.</p>"
