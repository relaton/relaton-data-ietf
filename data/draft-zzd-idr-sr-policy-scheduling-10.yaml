abstract:
- language: en
  script: Latn
  content: "<p>Segment Routing (SR) policy enables instantiation of an ordered list
    of segments with a specific intent for traffic steering. When using SR policy
    in a a network with time-variant characterics or requires high resources utilization
    efficiency, delivering the time-variant information associated with paths is necessary.
    This document proposes extensions to BGP SR Policy to deliver the schedule time
    information of candidate paths and segment lists.</p>"
