- language: en
  script: Latn
  content: "<p>This draft describes a new protocol allowing communication between
    two Path Computation Elements (PCEs) located in different domains in order to
    compute inter-domain paths satisfying a set of QoS constraints. This protocol
    could also be used for intra-domain purposes.</p>"
