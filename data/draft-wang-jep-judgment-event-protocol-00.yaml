abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Judgment Event Protocol (JEP), an\n   accountability attribution framework for distributed AI systems.\n   JEP provides a responsibility tracing mechanism for judgment\n   behaviors, operating with identity verification (OAuth/DID) and\n   environmental trust (RATS).\n\n   Core Design:\n   - Four-primitive model: $Judge, $Delegate, $Terminate, $Verify,\n     covering the complete judgment lifecycle.\n   - Three-tier privacy architecture: Public Governance Tier (Tier 1),\n     Logical Accountability Tier (Tier 2), Private Payload Tier (Tier 3),\n     balancing transparency and privacy.\n   - Minimal core fields: eight fields (verb, who, when, what, based_on,\n     nonce, signature, time_anchor) form the atomic evidence set for\n     accountability.\n   - Progressive verification strategy: from open mode (local\n     verification) to platform mode (platform-enhanced), adapting to\n     different scenarios.\n   - Compliance-friendly design: cryptographic erasure mechanism\n     supports GDPR \"right to be forgotten\" and similar requirements,\n     with specific policies configured via IANA‑registered extensions.\n\n   JEP follows a \"minimal intrusion, maximum compatibility\" philosophy,\n   adding verifiable accountability capabilities to critical judgment\n   nodes without reconstructing AI systems, working with IETF standards\n   including SCITT, RATS, and OAuth.</p>"
