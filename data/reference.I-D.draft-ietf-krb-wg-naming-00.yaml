abstract:
- language: en
  script: Latn
  content: "<p>This document defines new naming constraints for reserved Keberos names.
    Names can be reserved for either the Kerberos principal name or the Kerberos realm
    name. The reserved names defined in this document are critical: if a reserved
    name is unknown, authentication MUST fail.</p>"
