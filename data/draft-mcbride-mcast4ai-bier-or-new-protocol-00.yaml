abstract:
- language: en
  script: Latn
  content: "<p>AI workloads in data centers exhibit inherently point-to-multipoint
    (P2MP) communication patterns, particularly during collective operations such
    as AllReduce, AllGather and broadcast in distributed training. Unicast replication
    of these flows does not scale to large GPU clusters. This document analyzes two
    architectural approaches to addressing this problem: extending BIER (Bit Index
    Explicit Replication) to support AI P2MP requirements, or defining a new purpose-built
    protocol. The tradeoffs of each approach are discussed, including considerations
    around ACK aggregation, congestion control, RoCE/RDMA compatibility and operational
    complexity. This document does not define a protocol but is intended instead to
    help the mcast4ai community evaluate this problem space.</p>"
