  script: Latn
  content: <p>This memo defines a protocol for the transmission of IP and ARP packets
    over the ARCnet Local Area Network.This memo specifies a method of encapsulating
    Internet Protocol (IP) and Address Resolution Protocol (ARP) datagrams for transmission
    across ARCNET using the "ARCNET Packet Header Definition Standard". [STANDARDS-TRACK]</p>
