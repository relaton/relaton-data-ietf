abstract:
- language: en
  script: Latn
  content: "<p>OPC Unified Architecture (OPC UA) is a data exchange specification
    that provides interoperability in industrial automation. With the arrival of Industry
    4.0, it is of great importance to implement the exchange of semantic information
    utilizing OPC UA Transmitting in CoAP. This document provides some transmission
    methods for message of OPC UA over CoAP.</p>"
