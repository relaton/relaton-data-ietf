abstract:
- language: en
  script: Latn
  content: "<p>EAP-FAST is an extensible EAP method that enables secure communication
    between a client and a server by using the Transport Layer Security (TLS) to establish
    a mutually authenticated tunnel. EAP-FAST also enables the provisioning credentials
    or other information thru this protected tunnel. This document describes the use
    of EAP-FAST for dynamic provisioning.</p>"
