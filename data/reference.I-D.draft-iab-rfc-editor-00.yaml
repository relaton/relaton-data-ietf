abstract:
- language: en
  script: Latn
  content: "<p>One of the responsibilities assigned to the IAB in its charter is oversight
    of the RFC Editor. With this document, the IAB provides an explicit implementation
    of its oversight role, a model for defining (and updating) processes relating
    to the RFC Editor, and a brief charter for the RFC Editor.</p>"
