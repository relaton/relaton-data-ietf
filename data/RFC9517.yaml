  content: <p>This document describes the Namespace Identifier (NID) "ddi" for Uniform
    Resource Names (URNs) used to identify resources that conform to the standards
    published by the Data Documentation Initiative (DDI) Alliance.</p><p>The DDI Alliance
    is not affiliated with the Internet Engineering Task Force (IETF) or Internet
    Society (ISOC). This Independent Submission is not a standard nor does it have
    IETF community consensus.</p>
