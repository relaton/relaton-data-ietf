abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism that opportunistically enables
    encryption of in-transit Remote Procedure Call (RPC) transactions with minimal
    administrative overhead and full interoperation with ONC RPC implementations that
    do not support this mechanism. This document updates RFC 5531.</p>"
