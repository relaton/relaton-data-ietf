abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a one-way synchronization protocol for Internet
    Routing Registry (IRR) records, called Near Real Time Mirroring version 4 (NRTMv4),
    in which files are distributed over HTTPS. The protocol allows instances of IRR
    database servers to mirror IRR records, specified in the Routing Policy Specification
    Language (RPSL), between each other.</p>"
