abstract:
- language: en
  script: Latn
  content: <p>This document specifies a new TLS extension as well as modified TLS
    client and TLS server behaviour when public keys are authenticated out-of-band
    to the current TLS connection.  It is a companion document for RFC 5246, "The
    Transport Layer Security (TLS) Protocol Version 1.2".  The new extension specified
    is "oob_pubkey_list" which can be used when the TLS client is already in possession
    of a validated public key of the TLS server before it starts the TLS handshake.</p>
