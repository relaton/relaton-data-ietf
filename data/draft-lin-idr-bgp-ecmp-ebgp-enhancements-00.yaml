abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes extensions to BGP to apply the RFC 5004 route
       persistence algorithm across parallel EBGP sessions and to suppress
       unnecessary advertisements between EBGP peers in the same AS.

       This document updates RFC 5004.</p>
