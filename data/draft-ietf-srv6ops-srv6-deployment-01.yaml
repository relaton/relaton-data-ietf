abstract:
- language: en
  script: Latn
  content: "<p>When deciding to migrate a network from MPLS/SR-MPLS to SRv6, common
    questions involve how to go about performing the migration, what's the least amount
    of impact to an existing network and what existing techniques are available. This
    document presents various options for networks being migrated from MPLS/SR-MPLS
    to SRv6.</p>"
