- language: en
  script: Latn
  content: "<p>This draft defines an extention to Virtual Router Redundancy Protocol
    (VRRP) [1] which limits the amount of provisioning required to support the VRRP
    operations. It specifically addresses the scenario when the primary owner of the
    interfaces leaves the Virual Router group.</p>"
