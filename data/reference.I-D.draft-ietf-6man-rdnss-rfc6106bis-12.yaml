abstract:
- language: en
  script: Latn
  content: "<p>This document specifies IPv6 Router Advertisement options to allow
    IPv6 routers to advertise a list of DNS recursive server addresses and a DNS Search
    List to IPv6 hosts.  This document obsoletes RFC 6106 and allows a higher default
    value of the lifetime of the RA DNS options to avoid the frequent expiry of the
    options on links with a relatively high rate of packet loss.</p>"
