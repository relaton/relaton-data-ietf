- language: en
  script: Latn
  content: |-
    <p>This specification defines the use of a Diffie-Hellman key agreement
       (DH-KA) protocol combined with a key derivation function (KDF) to
       derive a symmetric Message Authentication Code (MAC) key from public
       information conveyed within a JSON Web Signature (JWS).</p>
