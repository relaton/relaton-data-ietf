abstract:
- language: en
  script: Latn
  content: "<p>Directed ARP is a dynamic address resolution procedure that enables
    hosts and routers to resolve advertised potential next-hop IP addresses on foreign
    IP networks to their associated link level addresses. This memo defines an Experimental
    Protocol for the Internet community.</p>"
