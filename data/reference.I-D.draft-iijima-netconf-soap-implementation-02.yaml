abstract:
- language: en
  script: Latn
  content: "<p>NETCONF protocol is standardized to be exchanged over SSH, SOAP, or
    BEEP. We developed a network management system based on NETCONF protocol. For
    several reasons, we chose the SOAP protocol as a transport protocol of NETCONF.
    This document describes why we chose SOAP as a transport protocol and the insight
    gained from actual development.</p>"
