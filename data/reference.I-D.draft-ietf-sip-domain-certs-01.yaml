abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to interpret certain information in a X.509
    PKIX-compliant certificate used in a Session Initiation Protocol (SIP) over Transport
    Layer Security (TLS) connection.  More specifically, it describes how to find
    the right identity for authentication in such certificates and how to use it for
    SIP domain authentication.</p>"
