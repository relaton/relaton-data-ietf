abstract:
- language: en
  script: Latn
  content: "<p>Low power and Lossy Networks (LLNs) are a class of network in which
    both the routers and their interconnect are constrained: LLN routers typically
    operate with constraints on (any subset of) processing power, memory and energy
    (battery), and their interconnects are characterized by (any subset of) high loss
    rates, low data rates and instability.  LLNs are comprised of anything from a
    few dozen and up to thousands of routers, and support point-to-point traffic (between
    devices inside the LLN), point-to-multipoint traffic (from a central control point
    to a subset of devices inside the LLN) and multipoint- to-point traffic (from
    devices inside the LLN towards a central control point).  This document specifies
    the IPv6 Routing Protocol for LLNs (RPL), which provides a mechanism whereby multipoint-to-
    point traffic from devices inside the LLN towards a central control point, as
    well as point-to-multipoint traffic from the central control point to the devices
    inside the LLN, is supported.  Support for point-to-point traffic is also available.</p>"
