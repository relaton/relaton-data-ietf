abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies requirements for an IPv6 Customer Edge (CE)
       router.  Specifically, the current version of this document focuses
       on the basic provisioning of an IPv6 CE router and the provisioning
       of IPv6 hosts attached to it.  The document obsoletes RFC 7084.</p>
