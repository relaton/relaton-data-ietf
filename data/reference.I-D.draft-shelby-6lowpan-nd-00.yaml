abstract:
- language: en
  script: Latn
  content: "<p>The 6LoWPAN format allows IPv6 to be used over very low-power, low-
    bandwidth wireless networks often making use of extended multihop topologies.
    \ However, the use of standard IPv6 Neighbor Discovery over 6LoWPAN networks has
    several problems.  Standard ND was not designed for wireless links, the standard
    IPv6 link concept and heavy use of multicast makes it inefficient.  This paper
    specifies Neighbor Discovery optimized for 6LoWPAN.</p>"
