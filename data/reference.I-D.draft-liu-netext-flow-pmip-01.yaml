abstract:
- language: en
  script: Latn
  content: "<p>PMIPv6 is designed to provide network based mobility, it requries no
    changes to the UE.  There are proposals to extend PMIPv6 to support flow mobility.
    \ Flow mobility requries the UE and the network have communication protocol to
    carry the flow control information.  This document proposes to use the IKEv2 protocol
    to carry the flow control information between the UE and network.</p>"
