abstract:
- language: en
  script: Latn
  content: "<p>This document provides requirements for protocols addressing Zero-configuration
    routing, known as 'Zerouter' protocols. It identifies requirements applicable
    to any of various approaches that may be proposed to this problem space, and is
    provided with the aim of ensuring complete and secure protocol definition. Scope
    is defined to ensure operation compatible with existing protocols while minimizing
    overlap with other ongoing work.</p>"
