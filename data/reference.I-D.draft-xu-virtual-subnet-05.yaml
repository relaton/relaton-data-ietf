abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a scalable IP-only L2VPN solution called Virtual
    Subnet, which reuses BGP/MPLS IP VPN [RFC4364] and ARP proxy [RFC925][RFC1027]
    technologies. Virtual Subnet could be used to interconnect geographically distributed
    data centers in a much scalable way.</p>"
