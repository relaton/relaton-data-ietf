abstract:
- language: en
  script: Latn
  content: "<p>This document implements automated certificate provisioning through\n   \"public key identity challenge + private key ownership verification\"\n   by introducing the pk-01 challenge to the ACME protocol [RFC8555].\n   It serves as a valuable complement to existing external resource\n   verification challenge types such as DNS/HTTP, extending the ACME\n   protocol's applicability beyond Web-PKI to other scenarios.  This\n   enables automated certificate issuance for devices and accounts.  The\n   core design objective of this document's extension to ACME's pk-01\n   challenge is to introduce a trusted identity provider (IdP) during\n   the digital certificate application process.  This provider verifies\n   the certificate applicant's identity and obtains the corresponding\n   identity public key.  It enables the ACME server to use public key\n   identity authentication protocols (e.g., WebAuthn and Opaque\n   [RFC9807]) to verify whether the genuine application behind the ACME\n   client controls the public key.  It ensures strong consistency\n   between the public key used during the challenge phase and the public\n   key ultimately used to sign the certificate, preventing tampering\n   with the public key during the CSR submission phase.  This enhances\n   the security of the digital certificate issuance process.  Similar\n   related work can be found in [RFC9883].\n\n   This document also defines an optional process extension that allows\n   removal of the CSR under the pk-01 challenge, enabling the ACME\n   server to issue a certificate directly after successful public key\n   verification.\n\n   This document provides an example of practical application at the\n   end, illustrating the integration of the OPAQUE [RFC9807], strong\n   asymmetric password authenticated key exchange (saPAKE) protocol with\n   the pk-01 challenge.</p>"
