abstract:
- language: en
  script: Latn
  content: "<p>This document redefines how the explicit congestion notification (ECN)
    field of the IP header should be constructed on entry to and exit from any IP
    in IP tunnel.  On encapsulation it updates RFC3168 to bring all IP in IP tunnels
    (v4 or v6) into line with RFC4301 IPsec ECN processing.  On decapsulation it updates
    both RFC3168 and RFC4301 to add new behaviours for previously unused combinations
    of inner and outer header.  The new rules propagate the ECN field whether it is
    used to signal one or two severity levels of congestion, whereas before they propagated
    only one.  Tunnel endpoints can be updated in any order without affecting pre-existing
    uses of the ECN field (backward compatible).  Nonetheless, operators wanting to
    support two severity levels (e.g. for pre-congestion notification--PCN) can require
    compliance with this new specification.  A thorough analysis of the reasoning
    for these changes and the implications is included.</p>"
