abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes UDP Speedy Transmission Protocol Secure
       (USTPS), an experimental secure transport built on UDP for low-
       latency streaming-oriented applications.  USTPS provides packet-level
       authenticated encryption for DATA packets, plaintext transport
       control, selective retransmission, out-of-order acceptance, adaptive
       retransmission timeout based on RTT sampling, and application-visible
       stream position metadata.  USTPS is intentionally unordered at the
       transport layer and is designed to avoid transport-level Head-of-Line
       blocking.</p>
