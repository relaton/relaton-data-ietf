abstract:
- language: en
  script: Latn
  content: "<p>Point to point (P2P) communication between arbitrary IPv6 routers and
    hosts in a Low power and Lossy Network (LLN) is a key requirement for many applications.
    \ RPL, the IPv6 Routing Protocol for LLNs, constrains the LLN topology to a Directed
    Acyclic Graph (DAG) and requires the P2P routing to take place along the DAG links.
    \ Such P2P routes may be suboptimal and may lead to traffic congestion near the
    DAG root.  This document specifies a P2P route discovery mechanism, complementary
    to the RPL base functionality.  This mechanism allows an IPv6 router or host to
    discover and establish, on demand, one or more routes to another IPv6 router or
    host in the LLN such that the discovered routes meet specified constraints.</p>"
