abstract:
- language: en
  script: Latn
  content: "<p>The DNS Security Extensions (DNSSEC) provide origin authentication
    and integrity of DNS data. However, the current resolver Application Programming
    Interface (API) does not allow a security-aware resolver to communicate detailed
    results of DNSSEC processing back to the application. This document describes
    an API between applications and a validating security-aware stub resolver that
    allows applications to control the validation process and obtain results of DNSSEC
    processing.</p>"
