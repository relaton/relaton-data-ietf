- language: en
  script: Latn
  content: "<p>This memo defines an experimental protocol, and an experimental portion
    of the Management Information Base (MIB) for use with network management protocols
    in the Internet community. In particular, it describes a physical topology discovery
    protocol and managed objects used for managing the protocol.</p>"
