abstract:
- language: en
  script: Latn
  content: <p>This document specifies how DNSSEC cryptographic algorithm identifiers
    in the IANA registries are allocated.  It changes the rule from "standard required"
    to "RFC required".  It does not change the list of algorithms that are recommended
    or required for DNSSEC implementations.</p>
