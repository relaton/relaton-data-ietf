abstract:
- language: en
  script: Latn
  content: |-
    <p>This document recommends that operators avoid using the maxLength
       attribute when issuing Route Origin Authorizations (ROAs) in the
       Resource Public Key Infrastructure (RPKI).  These recommendations
       complement those in [RFC7115].</p>
