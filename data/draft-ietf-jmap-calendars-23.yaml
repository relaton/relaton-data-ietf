abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a data model for synchronizing calendar data
    with a server using JMAP. Clients can use this to efficiently read, write, and
    share calendars and events, receive push notifications for changes or event reminders,
    and keep track of changes made by others in a multi-user environment.</p>"
