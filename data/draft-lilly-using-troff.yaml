abstract:
- language: en
  script: Latn
  content: "<p>Internet-Drafts and RFCs have traditionally been produced using a variety
    of tools, including nroff. This memo describes production of Internet-Drafts and
    RFCs using a set of troff/nroff macros suitable for that purpose. Public comments
    regarding this memo may be sent to the rfc-interest mailing list.</p>"
