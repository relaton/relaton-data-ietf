title:
- language: en
  script: Latn
  content: 'Authorization Posture Mechanism (APM): Per-Transaction Consistency for OAuth 2.0'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-vicente-oauth-apm-05
docidentifier:
- content: draft-vicente-oauth-apm
