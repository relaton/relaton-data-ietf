abstract:
- language: en
  script: Latn
  content: "<p>This document provides a single reference point for requirements for\n   Relying Party (RP) software for use in the Resource Public Key\n   Infrastructure (RPKI).  It cites requirements that appear in several\n   RPKI RFCs and related specifications, making it easier for\n   implementers to become aware of these requirements.  This document\n   updates [RFC8897] to reflect changes to the requirements and guidance\n   specified in the relevant RPKI standards, including updates to\n   repository synchronization, certificate and CRL processing, signed\n   object validation, validated cache distribution, local control, and\n   operational and manageability support for RP software.  This document\n   is expected to be updated to reflect changes to the requirements and\n   guidance specified in the RFCs discussed herein.</p>"
