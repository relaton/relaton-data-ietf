abstract:
- language: en
  script: Latn
  content: "<p>This document extends the IPFilterRule AVP functionality of the Diameter
    Base protocol and the functionality of the QoS-Filter-Rule AVP defined in RFC
    4005.  The ability to convey Quality of Service information using the AVPs defined
    in this document is available to existing and future Diameter applications where
    permitted by the command ABNF.</p>"
