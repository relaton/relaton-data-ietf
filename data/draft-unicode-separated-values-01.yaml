abstract:
- language: en
  script: Latn
  content: |-
    <p>Unicode Separated Values (USV) is a data format that uses Unicode
       characters to mark parts.  USV builds on ASCII separated values
       (ASV), and provides pragmatic ways to edit data in text editors by
       using visual symbols and layouts.</p>
