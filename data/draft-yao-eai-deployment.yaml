- language: en
  script: Latn
  content: "<p>Key RFCs for internationalized email address have been published, specifying
    the basic protocols for using it. This document provides some guidelines for implementing
    the email systems that support Email Address Internationalization (EAI). Its aim
    is to give some suggestions and help the engineers to implement these protocols.</p>"
