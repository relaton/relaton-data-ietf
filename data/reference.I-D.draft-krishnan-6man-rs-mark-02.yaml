abstract:
- language: en
  script: Latn
  content: "<p>In ethernet based aggregation networks, several subscriber premises
    may be connected to the same interface of an edge router.  This document proposes
    a method for the edge router to identify the subscriber premises using the contents
    of the received router solicitation messages.</p>"
