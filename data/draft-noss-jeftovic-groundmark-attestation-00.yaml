abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Groundmark attestation framework and the
    profile of Identity Service Providers (IDSPs) that issue Groundmark attestations.
    It is the companion document to the Groundmark core protocol, which specifies
    DNS publication and request-signature mechanics. This document specifies the role
    and obligations of Identity Service Providers, a four-level taxonomy of attestation
    strength, an initial vocabulary of claim types, the JSON schema and signature
    construction for attestation payloads, the method- disclosure discipline that
    defines an IDSP's accountability obligation, and revocation semantics for the
    attestation layer. The core protocol document defines the discovery mechanisms
    (the _agentclaim DNS TXT record and the HTTP retrieval of attestation payloads)
    on which this document depends. Together the two documents specify Groundmark.</p>"
