abstract:
- language: en
  script: Latn
  content: |-
    <p>The RADIUS protocol as defined in [RFC2865] does not have a means to
       signal server overload or congesition to the clients.  This can lead
       to load problems, especially in a federated RADIUS proxy fabric.
       This document attempts to fix this.</p>
