abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how the Authenticated Transfer (AT) Protocol\n   can leverage Media over QUIC Transport (MOQT) for efficient data\n   synchronization across decentralized social networks.  The AT\n   Protocol's firehose event stream and repository synchronization\n   mechanisms map naturally to MOQT's publish/subscribe model, enabling\n   scalable relay infrastructure, priority-based delivery, and improved\n   resilience for large-scale social data distribution.\n\n   This specification addresses the challenges of the current WebSocket-\n   based transport and demonstrates how MOQT's relay architecture,\n   group-based caching, and multiplexed streams provide significant\n   benefits for AT Protocol deployments at scale.</p>"
