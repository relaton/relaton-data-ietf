- language: en
  script: Latn
  content: |-
    <p>This document presents extensions to the Presence Information
    Document Format (PIDF) for representing the state of telephones. This
    state includes whether the telephone is in a call or not, whether it
    is registered to the network, whether it is ringing, and so on.</p>
