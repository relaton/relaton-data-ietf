abstract:
- language: en
  script: Latn
  content: "<p>This document proposes *APSIX* (_Agent Portable Semantic Interface\n   eXtension_) as a minimal primitive contract for portable semantic\n   runtimes.  The goal is not to standardize agent personalities, prompt\n   formats, planner graphs, or model-specific reasoning behavior.  The\n   goal is to standardize the smallest useful contract of the runtime\n   environment itself.\n\n   The design reflects runtime patterns observed in early governed\n   semantic-runtime implementations.  In those implementations, the\n   primary managed resource is bounded semantic territory, and spawned\n   actor populations are the main source of pressure on that resource.\n   APSIX defines the lower-layer contract required for such runtimes to\n   become portable across implementations.\n\n   The contract is intentionally narrow.  It standardizes logical\n   objects, lifecycle primitives, membrane-mediated decisions,\n   capability semantics, event and provenance requirements, replay\n   obligations, and progressive compliance profiles.  It does not\n   standardize model internals, scheduling strategies, storage engines,\n   user interfaces, or application-specific orchestration logic.\n\n   The document is written to stand on its own as a self-contained\n   runtime specification, without dependency on unpublished external\n   framing.\n\n   This is a draft specification, not a final standard.  The current\n   name is provisional; the technical target is a portable primitive\n   surface for governed semantic runtimes.\n\n   This document is intended as a *research specification*, not as an\n   immediate industry standardization proposal.  Its purpose is to\n   define a portability target early enough that emerging runtime\n   implementations do not harden around mutually incompatible framework-\n   local abstractions before a shared primitive vocabulary exists.</p>"
