abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this RFC is to outline a variety of models for policy
    based routing.  The relative benefits of the different approaches are reviewed.
    \ Discussions and comments are explicitly encouraged to move toward the best policy
    based routing model that scales well within a large internetworking environment.</p>"
