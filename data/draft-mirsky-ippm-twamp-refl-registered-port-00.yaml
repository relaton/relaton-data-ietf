- language: en
  script: Latn
  content: "<p>This document arguments and requests allocation of the UDP port number
    from the User Ports range for a Reflector in Two-Way Active Measurement Protocol
    (TWAMP). This document, if accepted, will be an update to the TWAMP Test protocol
    specified in RFC 5357.</p>"
