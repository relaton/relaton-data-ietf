abstract:
- language: en
  script: Latn
  content: "<p>Network management is increasingly carried out by autonomous, AI- driven
    agents that observe and act on the network and service state they share. Where
    their scopes overlap - the same managed entities, resources, or objectives - their
    independent decisions can prove mutually inconsistent, and such inter-agent conflict
    is, at bottom, coordination that has not been put in place; the two are best studied
    together. This document maps the problem for network management: where inter-agent
    conflict comes from, which families of mechanism resolve it, and how those mechanisms
    are chosen and combined. It then turns that map on a case of current interest
    in the IETF - the AI-based Network Management Agent (NMA) architecture - and offers
    six recommendations for strengthening how that architecture handles inter-agent
    conflict at its Agent-to-Agent interface.</p>"
