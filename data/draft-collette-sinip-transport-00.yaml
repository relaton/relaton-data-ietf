abstract:
- language: en
  script: Latn
  content: "<p>SIN/IP is a secure, multiplexed transport protocol designed for\n   kernel residency and incremental deployment.  It provides\n   authenticated encryption (AEAD), multiplexed streams over a single\n   connection to avoid head-of-line blocking, connection IDs for NAT\n   rebinding and path migration, and pluggable congestion control and\n   pacing.  SIN/IP can run as a native IP protocol in controlled\n   networks or be encapsulated in UDP for Internet deployment.  This\n   document specifies the wire format, packet and frame layout,\n   connection establishment, packet protection, loss recovery, flow\n   control, congestion control, path management, and connection\n   termination.  It also defines IANA registries for SIN/IP parameters\n   and codepoints.</p>"
