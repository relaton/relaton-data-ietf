abstract:
- language: en
  script: Latn
  content: "<p>This document describes several methods for obtaining reference delay
    applicable to different scenarios. These methods are in conjunction with mechanisms
    aimed at reducing end-to-end delay jitter in a scalable deterministic network.
    The goal is to meet specific business requirements and provide greater flexibility
    in the multipath planning for service protection.</p>"
