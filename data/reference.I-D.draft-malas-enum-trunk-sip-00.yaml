abstract:
- language: en
  script: Latn
  content: "<p>This document concludes that incorporating trunk group parameters into
    an Electronic Number (ENUM) response for the Session Initiation Protocol (SIP)
    [RFC3261] service URI is a more effective approach compared to defining a new
    ENUM service type for a 'trunk'.  Upon further review of the existing ENUM trunk
    group draft [I-D.ietf-enum-trunkgroup] and practical operator experience, this
    draft recommends the use of the current trunk group contexts as defined in [RFC4904]
    as additional parameters in the E2U+SIP enumservice NAPTR record [RFC3403] URI.</p>"
