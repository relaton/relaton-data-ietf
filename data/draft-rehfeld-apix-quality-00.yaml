abstract:
- language: en
  script: Latn
  content: "<p>The APIX Core ([APIX-CORE]) defines a three-dimensional trust model —\n   Organisation Trust Level (O), Service Verification Level (S), and\n   Liveness — that lets a consuming agent decide whether a discovered\n   service is operated by a verified party, is technically reachable and\n   consistent, and is currently alive.  These dimensions do not describe\n   the _quality_ of what a service produces.  They cannot answer whether\n   a manufacturing process is GMP-certified, whether a product carries\n   an independent quality grade, or whether an organisation holds a\n   domain quality certification, nor who attested any of these and with\n   what strength.\n\n   This document defines the APIX Quality Attestation Extension: a\n   cross-cutting extension, docking via the structured extensions\n   container of the APM ([APIX-CORE] Section 7.1), that records third-\n   party and self-declared quality claims about a discovered service's\n   Organisation, Process, or Product, each carried with an explicit\n   assurance level, attestation provenance, validity state, and\n   liability regime.  The extension reuses and extends the Core\n   Verification Basis Registry for provenance and mirrors the Core\n   capability-taxonomy governance for its criterion vocabulary.  It is\n   the mechanism by which measurable quality enters the agentic purchase\n   decision without re-introducing the central-arbiter and race-to-the-\n   bottom failure modes the Core is designed to prevent.</p>"
