- language: en
  script: Latn
  content: "<p>This specification extends the Post Office Protocol version 3 (POP3)
    to support unencoded international characters in user names, mail addresses and
    message headers. This is an early draft and intended as a framework for discussion.
    Please do not deploy implementations of this draft.</p>"
