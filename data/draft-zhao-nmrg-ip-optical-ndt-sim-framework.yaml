abstract:
- language: en
  script: Latn
  content: "<p>This document describes a lightweight cross-layer simulation framework
    for IP-optical Network Digital Twins. The framework correlates IP-layer logical
    topology, traffic-engineering state, Segment Routing policies, optical and transport
    resources, OTN resources, and physical shared-risk objects in a digital twin environment.
    The framework is intended to support what-if analysis for cross-layer failure
    propagation, soft degradation, protection-timer interaction, service-aware traffic
    shifting, shared-risk validation, and energy- aware operation. This document does
    not define a new routing protocol, optical control-plane protocol, BGP-LS extension,
    ACTN interface, or YANG data model. The framework is intended for planning, assurance,
    simulation, and analysis. Simulation outputs are not directly applied to production
    network elements.</p>"
