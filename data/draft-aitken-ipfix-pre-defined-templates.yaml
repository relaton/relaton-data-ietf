- language: en
  script: Latn
  content: |-
    <p>This document specifies a way to pre-define well-known IPFIX
       Templates which can be pre-shared with Collectors, thus avoiding the
       need for Exporters to send those Templates to Collectors.  This saves
       export bandwidth and reduces Collector complexity.</p>
