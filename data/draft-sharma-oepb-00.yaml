abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Offline Emergency Peer-to-Peer Broadcast
       Protocol (OEPB).  OEPB is a transport-agnostic overlay protocol for
       distributing authenticated emergency alerts over short-range peer-to-
       peer radios in infrastructure-absent environments.  Its principal
       contributions are: (1) a Transport Abstraction Layer (TAL) that
       presents heterogeneous radio technologies (BLE, Wi-Fi Direct, LoRa,
       IEEE 802.15.4) as a uniform 256-byte datagram interface to upper
       layers; (2) application of the Trickle algorithm (RFC 6206) to
       content-dissemination suppression in a multi-class broadcast context,
       distinct from its original routing-consistency application in
       RPL/6LoWPAN; (3) an emergency-semantic five-class Weighted Fair
       Queuing taxonomy calibrated to disaster-triage urgency; and (4) a
       trust architecture that deliberately separates relay forwarding from
       signature verification, preserving life-safety reachability for
       unauthenticated SOS messages.  To the authors' knowledge, no prior
       open specification addresses authenticated, amplification-resistant
       emergency broadcast in a transport-agnostic manner across
       heterogeneous short-range radios; Section 1.1 surveys prior systems
       and standards.  A companion document defines the Transport Binding
       Profile for Bluetooth Low Energy.</p>
