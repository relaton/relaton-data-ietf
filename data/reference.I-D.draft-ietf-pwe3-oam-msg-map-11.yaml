abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the mapping and notification of defect states
    between a Pseudo Wire and the Attachment Circuits (AC) of the end-to- end emulated
    service. This document covers the case whereby the ACs and the PWs are of the
    same type in accordance to the PWE3 architecture [RFC3985] such that a homogenous
    PW service can be constructed.</p>"
