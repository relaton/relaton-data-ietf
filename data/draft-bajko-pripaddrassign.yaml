abstract:
- language: en
  script: Latn
  content: "<p>This document defines an IPv4 DHCP Option and related behaviours to
    allocate the same IPv4 address to multiple nodes by sharing the available port
    space among them. The two sub-options defined in this document specify random
    port allocation to nodes in order to maximize the entropy of port randomization.</p>"
