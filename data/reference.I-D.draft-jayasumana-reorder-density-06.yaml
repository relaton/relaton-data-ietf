abstract:
- language: en
  script: Latn
  content: "<p>Out-of-order arrival of packets is a common occurrence on the Internet,
    and it will become more widespread as link speeds increase. A good reorder metric
    will capture the occurrence and characteristics of reordering comprehensively,
    and will have broader utility than merely distinguishing among different reordered
    sequences. Two metrics for packet reordering are presented, namely, Reorder Density
    (RD) and Reorder Buffer-occupancy Density (RBD). A threshold is used to clearly
    define when a packet is considered lost, to bound computational complexity at
    O(N), and to keep the memory requirement for evaluation independent of N, where
    N is the length of the packet sequence. RD is a comprehensive metric that captures
    the characteristics of reordering, while RBD evaluates the sequences from the
    point of view of recovery from reordering. These metrics are simple to compute
    yet comprehensive in their characterization of packet reordering. The measures
    are robust and orthogonal to packet loss and duplication.</p>"
