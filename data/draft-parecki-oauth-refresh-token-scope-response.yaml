abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a new OAuth 2.0 token response parameter,
    refresh_token_scope, that indicates the scope authorized for a refresh token when
    it differs from the scope of the access token issued alongside it. This allows
    clients to discover that a refresh token carries broader authorization than the
    initial access token, enabling just-in-time requests for elevated access without
    requiring a new authorization flow.</p>"
