abstract:
- language: en
  script: Latn
  content: "<p>This document defines Delta-1, a profile of the SCITT (Supply Chain\n   Integrity, Transparency, and Trust) architecture applied to AI agent\n   decision accountability.\n\n   Delta-1 specializes the SCITT receipt model for a specific use case:\n   proving that an individual AI decision met three accountability\n   conditions simultaneously:\n\n   C1: Evidence of the decision process was consumed and sealed.  C2:\n   Strategic intent was isolated from inference providers.  C3: An\n   authorized party recorded the settlement.\n\n   The verdict is binary (VALID or INVALID) with no intermediate states.\n   Receipts are independently verifiable without the issuing\n   infrastructure being online, subject to the trust and attestation\n   assumptions defined in this document.\n\n   By building on the SCITT framework, Delta-1 inherits transparency-log\n   semantics, receipt conventions, and verification patterns, while\n   extending them with domain-specific requirements for AI decision\n   closure.\n\n   This profile is intended for regulated industries, including finance,\n   healthcare, and legal, operating under accountability and record-\n   retention obligations.</p>"
