abstract:
- language: en
  script: Latn
  content: "<p>[STANDBY] has discussed how to achieve load-balancing among a group
    of NAT64 devices, however, it doesn't mention the mechanism for load-balancer,
    e.g., how to assign different prefix64s to different hosts. In this memo, we propose
    our investigation on this topic.</p>"
