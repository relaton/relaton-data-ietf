abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies use of H3 and LISP to reflect status of public
    roads:    - Enabling tile by tile, indexed annotation of streets &amp; curbs in real
    time    - Sharing: hazards, blockages, parking, weather, maintenance, inventory..
       - Between MobilityClients who produce and consume geo-state information
       - Using geo-spatial IP channels for the current state of the physical
    world</p>
