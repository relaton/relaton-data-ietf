abstract:
- language: en
  script: Latn
  content: <p>Many application protocols use named parameters to identify data (media
    types, header fields in Internet mail messages and HTTP requests, etc.).  Historically,
    protocol designers and implementers have often distinguished between "standard"
    and "non-standard" parameters by prefixing the latter with the string "X-" or
    similar constructions (e.g., "x."), where the "X" is commonly understood to stand
    for "eXperimental" or "eXtension".  Although in theory the "X-" convention was
    a good way to avoid collisions (and attendant interoperability problems) between
    standard parameters and non- standard parameters, in practice the costs associated
    with the advancement of non-standard parameters into the standards space outweigh
    the benefits.  Therefore this document deprecates the "X-" convention for most
    application protocols.</p>
