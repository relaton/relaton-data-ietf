abstract:
- language: en
  script: Latn
  content: "<p>Heterogeneous artificial-intelligence systems can exchange messages
    without sharing stable semantics for claims, evidence, objections, revisions,
    decisions, failures, and termination. This document defines an experimental public-artifact
    protocol for model- independent deliberation. It separates interoperable public
    state from private model computation and does not require disclosure of chain-of-thought,
    hidden state, prompts, model weights, or private memory. The document defines
    seven public artifact types, append-only revision, evidence provenance, blocking-objection
    closure, explicit failure and termination, a restricted canonical JSON profile,
    and SHA-256-based artifact identifiers. It does not define transport, signatures,
    authorization, model execution, or a completed consensus system.</p>"
