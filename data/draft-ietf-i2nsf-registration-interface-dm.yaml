abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model for the Registration Interface
    between Security Controller and Developer's Management System (DMS) in the Interface
    to Network Security Functions (I2NSF) framework to register Network Security Functions
    (NSF) of the DMS with the Security Controller. The objective of this data model
    is to support NSF capability registration and query via I2NSF Registration Interface.</p>"
