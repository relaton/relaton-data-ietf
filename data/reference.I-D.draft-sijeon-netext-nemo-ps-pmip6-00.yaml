abstract:
- language: en
  script: Latn
  content: "<p>This document summarizes the problem statement for network mobility
    support in the Proxy Mobile IPv6 (PMIPv6) domain. Especially, when applying the
    NEMO basic support protocol (NEMO-BSP) in PMIPv6 domain, NEMO support scenarios
    are examined and problems are presented for those scenarios.</p>"
