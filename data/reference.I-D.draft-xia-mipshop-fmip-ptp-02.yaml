abstract:
- language: en
  script: Latn
  content: "<p>The Mobile IPv6 Fast Handovers (FMIPv6) specification currently does
    not explicitly define prefix management over point-to-point links when a Mobile
    Node (MN) uses a prefix to formulate a new Care-of- Address (CoA).  In this document
    a mechanism is proposed for assigning unique prefixes to the MN by the Previous
    Access Router (PAR).  The New Access Router (NAR) dynamically assigns an unique
    prefix called dedicated prefix to any MN that is performing a handover.  Both
    reactive and predictive modes of FMIPv6 are explained.</p>"
