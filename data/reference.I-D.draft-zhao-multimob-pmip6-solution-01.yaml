abstract:
- language: en
  script: Latn
  content: "<p>To mobility scenario, multicast service is a valuable feature to those
    mobile customers.  We need to consider how to integrate current multicast service
    in PMIPv6 domain.  This draft will introduce this kind of solution about proxy
    mobile multicast.  It explains the system consideration about how to provide the
    proxy mobile multicast system.</p>"
