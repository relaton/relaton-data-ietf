abstract:
- language: en
  script: Latn
  content: "<p>This document defines a non-critical X.509 certificate extension, the\n   Post-Quantum Hybrid Commitment (PQCHC), that allows a certificate\n   issued with a classical or hybrid key to carry a verifiable,\n   cryptographically bound commitment to a specific future post-quantum\n   algorithm and a Commitment Validity Time.  The PQCHC commitment binds\n   to a hash of the committed future public key and algorithm\n   identifier, enabling a relying party to verify that a subsequently\n   issued post-quantum certificate honors the earlier commitment.  This\n   mechanism provides a crypto-agility signal for certificate-lifecycle\n   automation, including ACME Renewal Information (ARI), to plan and\n   verify PQC migration.</p>"
