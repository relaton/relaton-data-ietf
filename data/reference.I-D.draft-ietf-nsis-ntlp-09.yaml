abstract:
- language: en
  script: Latn
  content: <p>This document specifies protocol stacks for the routing and transport
    of per-flow signaling messages along the path taken by that flow through the network.
    The design uses existing transport and security protocols under a common messaging
    layer, the General Internet Signaling Transport (GIST), which provides a universal
    service for diverse signaling applications. GIST does not handle signaling application
    state itself, but manages its own internal state and the configuration of the
    underlying transport and security protocols to enable the transfer of messages
    in both directions along the flow path. The combination of GIST and the lower
    layer transport and security protocols provides a solution for the base protocol
    component of the "Next Steps in Signaling" framework.</p>
