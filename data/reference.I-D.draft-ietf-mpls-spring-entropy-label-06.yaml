abstract:
- language: en
  script: Latn
  content: "<p>Source routed tunnels with label stacking is a technique that can be
    leveraged to steer a packet through a controlled set of segments. This can be
    applied to the Multi Protocol Label Switching (MPLS) data plane.  Entropy label
    (EL) is a technique used in MPLS to improve load-balancing.  This document examines
    and describes how ELs are to be applied to source routed tunnels with label stacks.</p>"
