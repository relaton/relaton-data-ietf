abstract:
- language: en
  script: Latn
  content: "<p>The flexible authentication via secure tunneling EAP method (EAP- FAST)
    enables secure communication between a client and a server by using Transport
    Layer Security (TLS) to establish a mutually authenticated tunnel.  EAP-FAST also
    enables the provisioning credentials or other information through this protected
    tunnel.  This document describes the use of EAP-FAST for dynamic provisioning.</p>"
