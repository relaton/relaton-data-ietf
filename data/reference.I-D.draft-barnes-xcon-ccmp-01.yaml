abstract:
- language: en
  script: Latn
  content: <p>"A Framework and Data Model for Centralized Conferencing" defines a
    model whereby client intereaction is required for creation, deletion, and manipulation
    of a conference, as well as querying the state of a conference. The Centralized
    Conferencing Manipulation Protocol (CCMP) defined in this document provides the
    appropriate mechanisms for these protocol interactions. CCMP is based on the Simple
    Object Access Protocol (SOAP), with the data necessary for the interactions specified
    via Web Services Description Language (WSDL).</p>
