  content: |-
    <p>This document documents best practices for deployment of Low Latency,
       Low Loss, and Scalable Throughput (L4S) in mobile devices.  It
       defines the responsibilities of the host operating system, the link-
       layer (modem and WiFi) subsystems to ensure successful end-to-end
       low-latency communication.</p>
