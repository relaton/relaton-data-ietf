- language: en
  script: Latn
  content: <p>This document analyzes the timeline of the specification of different
    types of "numeric identifiers" used in IETF protocols, and how the security and
    privacy implications of such protocols has been affected as a result of it. It
    provides concrete evidence that advice in this area is warranted.</p>
