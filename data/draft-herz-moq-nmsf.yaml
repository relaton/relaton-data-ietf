abstract:
- language: en
  script: Latn
  content: "<p>This document updates the MOQT Streaming Format (MSF) by defining a\n   new optional feature for the streaming format.  It specifies the\n   syntax and semantics for adding Neural Video Codec (NVC) packaged\n   media to MSF.  NVC codecs use learned neural network transforms for\n   video compression, and their bitstreams require a distinct packaging\n   model from traditional block-based codecs.  NMSF maps neural\n   keyframes (Intra) and delta frames (Inter) onto MoQ Groups and\n   Objects, and introduces a multi-track model that separates hyperprior\n   side information from latent bitstreams for priority-aware delivery.\n   This enables real-time neural video streaming over any standard MoQ\n   relay.</p>"
