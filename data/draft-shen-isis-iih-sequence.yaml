abstract:
- language: en
  script: Latn
  content: "<p>This draft describes an optional sequence number TLV inside the ISIS
    IIH packets. This sequence number TLV can be used for ISIS adjacency troubleshooting
    especially in the case where a large number of adjacencies are maintained and/or
    a low adjacency holddown time is used for the purpose of fast convergence.</p>"
