abstract:
- language: en
  script: Latn
  content: "<p>This document requests the allocation of an IPv4 /10 address block
    to be used as Shared Carrier Grade Network Address Translation (CGN) Space.  Service
    Providers will use Shared CGN Space to number the interfaces that connect CGN
    devices to Customer Premise Equipment (CPE).  As this document proposes the allocation
    of an additional special-use IPv4 address block, it updates RFC 5735.</p>"
