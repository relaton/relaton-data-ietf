abstract:
- language: en
  script: Latn
  content: "<p>This Internet Draft is an attempt to define the security threats \nagainst
    the OPES protocol. In addition to the threats, the effects \nof such security
    threats on the underlying architecture as well as \nthe requirements of a security
    solution to mitigate such threats are \ndiscussed. The threats and requirements
    identified herein and the \ndocument should be considered as work in progress.</p>"
