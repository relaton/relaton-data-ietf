- language: en
  script: Latn
  content: "<p>This specification extends the Web Distributed Authoring Protocol (WebDAV)
    to support datatyping. Protocol elements are defined to let clients and servers
    specify the datatype, and to instruct the WebDAV method PROPFIND to return datatype
    information.</p>"
