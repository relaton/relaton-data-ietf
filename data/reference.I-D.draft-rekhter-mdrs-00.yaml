abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism whereby a subscriber's Internet
    service provider may signal in BGP the ability of the subscriber network to receive
    content using multicast connectivity.  This mechanism is called Multicast Distribution
    Reachability Signaling (MDRS).</p>"
