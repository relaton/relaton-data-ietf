abstract:
- language: en
  script: Latn
  content: "<p>Path MTU discovery is vulnerable and IP fragmentation may cause protocol
    weakness. Currently, DNS is said to be the biggest user of IP fragmentation. However,
    it is possible to avoid IP fragmentation in DNS because TCP transport and truncation
    work well. This document proposes to avoid IP fragmentation in DNS.</p>"
