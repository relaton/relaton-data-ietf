abstract:
- language: en
  script: Latn
  content: "<p>The DS-Lite technique enables service providers to deliver IPv4 unicast
    services following IPv4 address exhaustion by combining two mechanisms: NAT and
    IPv4-in-IPv6 encapsulation.  This document describes extensions to DS-Lite to
    support IPv4 multicast delivery.</p>"
