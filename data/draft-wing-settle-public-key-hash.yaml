abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification eliminates security warnings when connecting to
       local domains using TLS.  Servers use a unique, long hostname which
       encodes their public key that the client validates against the public
       key presented in the TLS handshake.</p>
