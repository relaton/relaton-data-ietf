abstract:
- language: en
  script: Latn
  content: "<p>Route Optimization is an useful aspect of Mobile IPv6.  In Route Optimization
    mode Mobile Node (MN) can communicate with Correspondent Node (CN) without the
    involvement of MN's home agent.  However, there are some limitations to this feature,
    including that the Mobile Node and the Correspondent Node must both be capable
    of Route Optimization.  This document introduces a Route Optimization Proxy function
    used for Route Optimization which can be used to enable Route Optimization between
    Mobile Node and arbitrary IP node - the Route Optimization functions are delegated
    to the Proxy.  The Route Optimization Proxy function may be implemented in the
    access router attached to the CN or any other node present on the path between
    MN and CN, and the Route Optimization Proxy can conduct RO-related signaling and
    accomplish the Route Optimization procedure on behalf of the Correspondent Node.</p>"
