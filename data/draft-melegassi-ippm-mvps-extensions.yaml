abstract:
- language: en
  script: Latn
  content: "<p>This document defines a forward-compatible extension point for the\n   Multi-Vantage Path Synchrony (MVPS) bundle format.  The base format\n   already provides a schema version, a path-fingerprint version\n   prefix, and an IANA \"MVPS Bundle Capability Flags\" registry, but its\n   serialization is closed to unknown fields.  This document adds a\n   single, typed, namespaced \"extensions\" object and a processing rule\n   (ignore-but-preserve), and specifies how extensions interact with\n   the canonical hash and the MVPS Proof Envelope.\n\n   The mechanism is designed so that an extension can never become a\n   tamper vector and can never alter the core coherence detector: the\n   detection statistic D^2 is, by construction, a function of the core\n   bundle only.  Every property in this document is backed by a\n   machine-checkable numerical receipt.</p>"
