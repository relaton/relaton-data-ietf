abstract:
- language: en
  script: Latn
  content: |-
    <p>This document shows how to set default route inside VLSM tree.  With
       this approach routing information of the external world need not be
       passed down to the VLSM tree. It shows how RSVP-TE is extended to
       support IP-VPN with MPLS to support default route inside VLSM tree.</p>
