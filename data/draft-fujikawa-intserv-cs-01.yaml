- language: en
  script: Latn
  content: "<p>This draft defines Comfortable Service (CS), which realizes statistical
    end-to-end QoS guarantee in the Internet. CS is based on Policed Priority Queuing
    (PPQ) which processes packets in a constant time, and statistically guarantee
    the maximum time of queuing delay.</p>"
