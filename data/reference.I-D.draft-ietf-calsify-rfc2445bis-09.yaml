abstract:
- language: en
  script: Latn
  content: "<p>This document defines the iCalendar data format for representing and
    exchanging calendaring and scheduling information such as events, to- dos, journal
    entries and free/busy information, independent of any particular calendar service
    or protocol.Editorial Note (To be removed by RFC Editor prior to publication)
    This document is a product of the Calendaring and Scheduling Standards Simplification
    (Calsify) working group of the Internet Engineering Task Force.  Comments on this
    draft are welcomed, and should be addressed to the ietf-calsify@osafoundation.org
    [1] mailing list.</p>"
