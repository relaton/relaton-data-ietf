abstract:
- language: en
  script: Latn
  content: |-
    <p>LSP-Ping is a widely deployed Operation, Administration, and
       Maintenance (OAM) mechanism in MPLS networks.  This document
       describes mechanisms for detecting data-plane failures using LSP Ping
       in MPLS based EVPN and PBB-EVPN networks.</p>
