abstract:
- language: en
  script: Latn
  content: "<p>This memo describes a set of practices designed to enable the distribution
    of a root DNS server to multiple geographically and topologically distinct network
    locations. These practices presume that a single entity remains administratively
    and operationally responsible for each of the distributed servers.</p>"
