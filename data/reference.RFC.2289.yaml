abstract:
- language: en
  script: Latn
  content: "<p>This document describes a one-time password authentication system (OTP).
    The system provides authentication for system access (login) and other applications
    requiring authentication that is secure against passive attacks based on replaying
    captured reusable passwords.  [STANDARDS-TRACK]</p>"
