abstract:
- language: en
  script: Latn
  content: "<p>In this document, we analyze the applicability of the Loop-Free Alternates
    method of providing IP fast re-route in both the core and the access parts of
    Service Provider networks.  We consider both the link and node failure cases,
    and provide guidance on the applicability of LFA to different network topologies,
    with special emphasis on the access parts of the network.</p>"
