abstract:
- language: en
  script: Latn
  content: <p>The Subnetwork Encapsulation and Adaptation Layer (SEAL) includes two
    basic modes of operation known as "SEAL with Fragmentation Sensing (SEAL-FS)"
    and "SEAL with Traffic Engineering (SEAL-TE)".  This document specifies an additional
    mode known as "SEAL with Reliability Extensions (SEAL-RE)".</p>
