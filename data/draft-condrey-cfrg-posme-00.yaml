abstract:
- language: en
  script: Latn
  content: "<p>This document defines Proof of Sequential Memory Execution (PoSME), a\n   cryptographic primitive combining mutable arena state, data-\n   dependent pointer-chase addressing, per-block causal hash binding,\n   and execution entropy entanglement in a single step function.  A\n   Prover executes K sequential steps over a mutable N-block arena.\n   Each step reads d blocks at addresses determined by the previous\n   read's result (pointer chasing), writes one block with symbiotic\n   binding (new data depends on old causal hash; new causal hash depends\n   on cursor), and advances a transcript chain.  At regular intervals,\n   CPU jitter entropy is folded into the transcript, binding the proof\n   to physical execution on a general-purpose system.  The construction\n   provides four properties: (1) unconditional sequential time\n   enforcement (Omega(K) computation regardless of storage), (2) forgery\n   prevention via causal hashes (reduces to collision resistance of H),\n   (3) TMTO resistance scaling linearly with write density rho = K/N\n   (34x penalty at rho=16 for a zero-storage adversary), and (4)\n   execution- environment ASIC resistance (the adversary must execute on\n   a general-purpose CPU with an operating system to produce valid\n   entropy, limiting the advantage to commodity hardware variation).  A\n   compact parameter profile achieves these properties with\n   approximately 32 MiB peak RAM.  Verification requires O(Q * d^R * log\n   N) hash evaluations with no arena allocation.  No trusted setup is\n   required.</p>"
