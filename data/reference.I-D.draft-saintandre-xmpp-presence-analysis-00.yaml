abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes the traffic that is generated as a result of
    presence subscriptions between users of federated domains that support the Extensible
    Messaging and Presence Protocol (XMPP). This analysis is provided as a source
    of comparison with a similar analysis being performed regarding domains that support
    federated presence using Session Initiation Protocol (SIP) for Instant Messaging
    and Presence Leveraging Extensions (SIMPLE).</p>"
