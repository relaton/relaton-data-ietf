abstract:
- language: en
  script: Latn
  content: "<p>This document proposes guidelines for the design of Autonomic Service
    Agents for autonomic networks.  It is based on the Autonomic Network Infrastructure
    outlined in the ANIMA reference model, making use of the Autonomic Control Plane
    and the Generic Autonomic Signaling Protocol.</p>"
