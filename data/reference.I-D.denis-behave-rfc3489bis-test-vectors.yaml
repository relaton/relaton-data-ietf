  content: "<p>This document includes test vectors for the MESSAGE-INTEGRITY and FINGERPRINT
    attributes of the STUN protocol.Table of Contents 1. Introduction . . . . . .
    . . . . . . . . . . . . . . . . . . . 3 2. Test vectors . . . . . . . . . . .
    . . . . . . . . . . . . . . 3 2.1. Sample request . . . . . . . . . . . . . .
    . . . . . . . . 3 2.2. Sample IPv4 response . . . . . . . . . . . . . . . . .
    . . 4 2.3. Sample IPv6 response . . . . . . . . . . . . . . . . . . . 5 3. Security
    Considerations . . . . . . . . . . . . . . . . . . . . 5 4. IANA Considerations
    . . . . . . . . . . . . . . . . . . . . . . 5 5. Acknowledgements . . . . . .
    . . . . . . . . . . . . . . . . . 5 6. Normative References . . . . . . . . .
    . . . . . . . . . . . . 6 Appendix A. Source code for test vectors . . . . . .
    . . . . . . . 61. Introduction The Session Traversal Utilities for NAT (STUN)[I-D.ietf-behave-rfc3489bis]
    protocol defines two different hashes that may be included in messages exchanged
    by peers implementing that protocol: FINGERPRINT attribute: a 32-bits Circular
    Redundancy Check. MESSAGE-INTEGRITY attribute: a HMAC-SHA1 authentication code.
    This document documents sample properly-formatted STUN messages including these
    hashes, for the sake of testing implementations of the STUN protocol.</p>"
