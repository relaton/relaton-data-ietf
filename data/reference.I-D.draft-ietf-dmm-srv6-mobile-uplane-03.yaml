abstract:
- language: en
  script: Latn
  content: "<p>This document shows the applicability of SRv6 (Segment Routing IPv6)
    to the user-plane of mobile networks.  The network programming nature of SRv6
    accomplish mobile user-plane functions in a simple manner. The statelessness of
    SRv6 and its ability to control both service layer path and underlying transport
    can be beneficial to the mobile user-plane, providing flexibility and SLA control
    for various applications.  This document describes the SRv6 mobile user plane
    behavior and defines the SID functions for that.  It also provides a mechanism
    for end-to-end network slicing.</p>"
