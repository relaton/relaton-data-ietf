abstract:
- language: en
  script: Latn
  content: "<p>An IPv6 device can configure its addresses and locate neighboring\nrouters through stateless address autoconfiguration (RFC2462) and\nrouter discovery (RFC2461).  Most IPv6 devices will require\ninformation about DNS services to make use of the basic IPv6\nconnectivity.</p>"
