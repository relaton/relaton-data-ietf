abstract:
- language: en
  script: Latn
  content: "<p>An IPv6 device can configure its addresses and locate neighboring routers
    through stateless address autoconfiguration (RFC2462) and router discovery (RFC2461).
    Most IPv6 devices will require information about DNS services to make use of the
    basic IPv6 connectivity.</p>"
