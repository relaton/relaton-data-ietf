- language: en
  script: Latn
  content: "<p>RFC2521 defines ICMP security failures messages for indicating failures
    when using IP Security Protocols (AH and ESP). This document presents extension
    of those messages, which make use of some reserved field to specify sub types
    of failures.</p>"
