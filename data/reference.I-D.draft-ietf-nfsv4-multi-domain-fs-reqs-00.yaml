abstract:
- language: en
  script: Latn
  content: "<p>This document describes constraints to the NFSv4.0 and NFSv4.1 protocols
    as well as the use of multi-domain capable file systems, name resolution services,
    and security services required to fully enable a multiple NFSv4 domain file system,
    such as a multiple NFSv4 domain Federated File System.</p>"
