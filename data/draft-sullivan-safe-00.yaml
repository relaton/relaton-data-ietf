abstract:
- language: en
  script: Latn
  content: "<p>SAFE defines an encryption envelope that encrypts a payload once for\n   multiple recipients.  Decryption can require multiple credentials in\n   sequence (public keys, passphrases, or other registered methods), so\n   no single factor suffices.  The format is designed for large,\n   writable files: it supports streaming decryption, random-access reads\n   at block granularity, and selective re-encryption of modified blocks\n   without re-keying.  Recipient privacy modes allow locks to omit\n   identifying metadata.  SAFE accommodates post-quantum key\n   encapsulation without format changes, provides algorithm agility\n   through IANA registries, and defines a mandatory-to-implement profile\n   for interoperability.</p>"
