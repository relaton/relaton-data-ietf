abstract:
- language: en
  script: Latn
  content: <p>This document specifies the URI (Uniform Resource Identifier) scheme
    "about".  About URIs are designed to be an internal, application-   level identifier.  Unlike
    many other URI schemes, the resolution of, and resources represented by, about
    URIs are left largely to each individual application.  Only the "about:blank"
    URI must be the same.</p>
