abstract:
- language: en
  script: Latn
  content: "<p>The rapid adoption of AI language tools has prompted concern across
    professional and technical communities, including the IETF, about authenticity,
    accountability, and the integrity of human contribution. This document approaches
    the question from two directions: a critical reader's concerns about what AI use
    means for IETF discussion, and a practitioner's account of how AI is currently
    being used in IETF discussions. We aim to explore some of the issues arising,
    and perhaps make some specific (but tentative) recommendations, but the main recommendation
    is that the IETF should develop guidelines for use of AI tooling when engaging
    in IETF discussions.</p>"
