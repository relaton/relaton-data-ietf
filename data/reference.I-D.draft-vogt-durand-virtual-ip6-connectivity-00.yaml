abstract:
- language: en
  script: Latn
  content: "<p>This document proposes Virtual IPv6 Connectivity, a method for deployment
    in IPv4-only networks to enable communications with the IPv6 Internet.  Virtual
    IPv6 Connectivity uses IP protocol translation to support both incoming traffic
    from IPv6 to IPv4, and outgoing traffic from IPv4 to IPv6.  Communications initiated
    into the latter direction are facilitated through DNS or DNSSEC proxies. Different
    than existing IPv4/IPv6 interworking techniques, which are for deployment in IPv6
    networks, Virtual IPv6 Connectivity does not require extra, globally unique IPv4
    addresses.</p>"
