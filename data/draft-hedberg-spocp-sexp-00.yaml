abstract:
- language: en
  script: Latn
  content: "<p>This document describes restricted S-expressions as they are used for
    storing and querying for access rights within the SPOCP (Simple POlicy Control
    Protocol) project. We describe the restrictions we have made to basic S-expressions
    and also the theory that allows us to use S-expressions in a policy engine.</p>"
