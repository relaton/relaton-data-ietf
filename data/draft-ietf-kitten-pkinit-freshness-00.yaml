- language: en
  script: Latn
  content: "<p>This document describes how to further extend the Public Key Cryptography
    for Initial Authentication in Kerberos (PKINIT) extension [RFC4556] to exchange
    an opaque data blob which a KDC can validate to ensure that the client is currently
    in possession of the private key during a PKInit AS exchange.</p>"
