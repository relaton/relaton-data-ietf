abstract:
- language: en
  script: Latn
  content: "<p>AI Agents may dynamically join, leave, and update their capabilities
    while participating in interactions across administrative domains. Efficient capability
    discovery in such environments requires mechanisms to onboard agent capabilities
    and maintain consistent capability information across distributed management entities.
    Existing service registration and discovery mechanisms do not necessarily provide
    a capability-oriented mechanism for distributed synchronization and hierarchical
    forwarding of agent capability information. This document proposes a distributed
    and hierarchical mechanism for AI Agent capability onboarding, information synchronization,
    and capability-based discovery. The mechanism introduces a hierarchical capability
    classification model and defines two functional entities: the Agent Capability
    Management Server (ACMS), which maintains and synchronizes capability information,
    and the Agent Capability Access Server (ACAS), which manages locally attached
    agents. Capability information is aggregated and propagated among ACMSs, while
    access information for locally attached agents is maintained by ACASs. A capability
    table is used to determine forwarding toward relevant ACMSs, and an access mapping
    table is used for local agent matching. The document also describes onboarding
    and intent-driven capability discovery procedures. The mechanism is intended to
    provide a distributed control-plane foundation for capability-aware agent discovery
    and does not define agent-to-agent interaction or task execution protocols.</p>"
