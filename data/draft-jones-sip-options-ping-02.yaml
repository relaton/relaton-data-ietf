abstract:
- language: en
  script: Latn
  content: "<p>This document describes a procedure for using the Session Initiation
    Protocol (SIP) OPTIONS method in order to allow one SIP entity to query the operational
    status of another SIP entity. Through discovery of the status of a SIP entity,
    it is possible to expedite session establishment or provide diagnostic information
    to network administrators.</p>"
