abstract:
- language: en
  script: Latn
  content: "<p>This document proposes the extension of the TE topology model for including
    information related to data center resource capabilities. For that purpose, it
    defines a YANG module to augment TE topologies with awareness of data-center computing
    resources. Although the model is designed to be compatible with TE aware topologies,
    it can also be applied to non-TE networks.</p>"
