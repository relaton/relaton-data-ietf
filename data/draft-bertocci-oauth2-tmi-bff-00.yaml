abstract:
- language: en
  script: Latn
  content: "<p>This document describes how a JavaScript frontend can delegate access
    token acquisition to a backend component. In so doing, the frontend can access
    resource servers directly without taking on the burden of communicating with the
    authorization server, persisting tokens, and performing operations that are fraught
    with security challenges when executed in a user agent, but are safe and well
    proven when executed by a confidential client running on a backend.</p>"
