- language: en
  script: Latn
  content: "<p>This draft introduces use cases related to AI Agents in 6G networks,
    primarily referencing the technical report of 3GPP SA1 R20 Study on 6G Use Cases
    and Service Requirements (TR 22.870). It also elaborates on some of the requirements
    for introducing AI Agents into 6G networks from the perspective of operators.</p>"
