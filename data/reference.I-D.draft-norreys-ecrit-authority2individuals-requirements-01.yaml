abstract:
- language: en
  script: Latn
  content: "<p>Public safety agencies need to provide information to the general public
    before and during large-scale emergencies.  While many aspects of such systems
    are specific to national or local jurisdictions, emergencies span such boundaries
    and notifications need to reach visitors from other jurisdictions.  This document
    summarizes requirements for protocols to alert individuals within a defined geographic
    area.</p>"
