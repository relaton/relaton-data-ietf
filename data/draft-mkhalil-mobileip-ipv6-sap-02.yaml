abstract:
- language: en
  script: Latn
  content: "<p>A protocol is proposed to allow a fast establishment of Security Association
    between the Mobile Node (MN) and Correspondent Node (CN). Once this Security Association
    is established, it can be used to authenticate any control message exchanged between
    these two nodes (e.g. Binding Update and Binding Acknowledgement).</p>"
