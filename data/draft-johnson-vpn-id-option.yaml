- language: en
  script: Latn
  content: "<p>This memo defines a new DHCP option for passing VPN information between
    the DHCP client and the DHCP server. It is intended for use primarily by DHCP
    proxy clients in situations where VPN information needs to be passed to the DHCP
    server for proper address allocation to take place.</p>"
