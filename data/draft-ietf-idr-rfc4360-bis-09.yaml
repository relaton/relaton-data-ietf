abstract:
- language: en
  script: Latn
  content: <p>This document describes the "Extended Communities" BGP-4 attribute.
    This attribute provides a mechanism for labeling information carried in BGP-4.
    These labels can be used to control the distribution of this information, or for
    other applications. This document obsoletes RFC 4360. This document also updates
    RFC 5701 by adding an "Operational Considerations" section.</p>
