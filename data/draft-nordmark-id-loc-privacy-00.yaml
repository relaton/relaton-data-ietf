abstract:
- language: en
  script: Latn
  content: "<p>There exists several protocols and proposals for identifier/locator
    split which have some form of control plane by which participating nodes can use
    to share their current id to locator information with their peers. This document
    explores some of the privacy considerations for such a system.</p>"
