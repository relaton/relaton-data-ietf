abstract:
- language: en
  script: Latn
  content: <p>The Open Pluggable Edge Services (OPES) framework is application agnostic.
    Application specific adaptations extend that framework. Previous work has focussed
    on HTTP and work for SMTP is in progress. These protocols differ fundamentally
    in the way data flows and it turns out that existing OPES requirements and IAB
    considerations for OPES need to be reviewed with regards to how well they fit
    for SMTP adaptation. This document analysis aspects about the integrity of SMTP
    and mail message adaptation by OPES systems and privacy and security issues when
    the OPES framework is adapted to SMTP and lists requirements that must be considered
    when creating the "SMTP adaptation with OPES" document.</p>
