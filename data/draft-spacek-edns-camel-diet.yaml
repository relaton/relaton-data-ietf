abstract:
- language: en
  script: Latn
  content: "<p>DNS responders must either follow RFC 6891 by fully implementing EDNS
    or at least respond to queries containing OPT record according to older specifications.
    Non-compliant implementations which do not respond at all are not worth talking
    to.</p>"
