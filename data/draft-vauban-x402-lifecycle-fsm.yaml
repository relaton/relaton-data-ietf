abstract:
- language: en
  script: Latn
  content: "<p>This document defines a normative finite state machine (FSM) for x402\n   V2 Payment lifecycle transitions, covering the four canonical Payment\n   Claim states: PaymentIntent (initialisation), SettlementReceipt\n   (completion), RefundClaim (reversal), and DelegationGrant (bounded\n   authority).  Each transition is bound to the prior state by\n   cryptographic linkage via the JCS canonical preimage discipline\n   ([RFC8785]), enabling supervisor reconstruction of full payment\n   histories from retained off-VM manifests.  The FSM is compatible with\n   the x402 STARK Receipt Format Extension [STARK-RECEIPTS] but\n   applicable to any x402 receipt format that implements the canonical\n   preimage discipline.  Implementation evidence: 18 DelegationGrant\n   vectors cross-validated byte-identical across five language runtimes\n   ([X402-2432]), live on-chain anchor on Starknet Sepolia\n   (PaymentDemoEmitter at\n   0x044dd87a94a801cf775d4c5e4b6703102d4e97e1cd1d0a8879341219ae4f19ff).</p>"
