abstract:
- language: en
  script: Latn
  content: "<p>Autonomous and semi-autonomous software agents increasingly take consequential
    actions across administrative and trust domains. Holding such an action accountable
    — to a regulator, auditor, or counterparty who does not trust the operator — requires
    answering several questions, each answerable by an independently-verifiable profile:
    whether the agent was permitted to act (CAN), which accountable human authorized
    the specific action (WHO), what the agent actually did (WHAT), and whether the
    runtime enforced correctly (AUDIT). This document specifies, in Informational
    terms, how such profiles compose — by a shared action-digest, each verifying independently
    — and defines a shared conformance-vector suite against which any profile may
    be tested. It complements existing audit-architecture and record-format work rather
    than replacing it, reusing existing signing, transport, and transparency mechanisms.
    Its focus is an assurance tier those documents leave open: most agent records
    today are self-attested by an interested party; this document makes reachable
    and testable an anchored, third-party-verifiable tier, in which a record is registered
    to a transparency service (SCITT) so a party who trusts neither the agent nor
    the operator can verify it. Self-attestation remains a valid baseline; convergence
    on the disinterested tier — by any conforming profile — is the goal, not a single
    mandated format.</p>"
