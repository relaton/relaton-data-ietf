abstract:
- language: en
  script: Latn
  content: "<p>This document provides a framework for Layer 2 Provider Provisioned
    Virtual Private Networks (L2VPNs).  This framework is intended to aid in standardizing
    protocols and mechanisms to support interoperable L2VPNs.  This memo provides
    information for the Internet community.</p>"
