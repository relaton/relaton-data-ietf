title:
- language: en
  script: Latn
  content: Ordered Information Element Export in IP Flow Information Export (IPFIX)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-claise-opsawg-ipfix-ordered-ie-01
