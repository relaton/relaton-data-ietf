abstract:
- language: en
  script: Latn
  content: <p>Point-to-point Multiprotocol Label Switching (MPLS) and Generalized
    MPLS (GMPLS) Traffic Engineering Label Switched Paths (TE LSPs) may be established
    using signaling techniques, but their paths may first need to be determined.  The
    Path Computation Element (PCE) has been identified as an appropriate technology
    for the determination of the paths of P2MP TE LSPs.  This document describes extensions
    to the PCE communication Protocol (PCEP) to handle requests and responses for
    the computation of paths for P2MP TE LSPs.  Status of this Memo  This Internet-Draft
    is submitted to IETF in full conformance with the provisions of BCP 78 and BCP
    79.  Internet-Drafts are working documents of the Internet Engineering Task Force
    (IETF), its areas, and its working groups.  Note that other groups may also distribute
    working documents as Internet- Drafts.  Internet-Drafts are draft documents valid
    for a maximum of six months and may be updated, replaced, or obsoleted by other
    documents at any time.  It is inappropriate to use Internet-Drafts as reference
    material or to cite them other than as "work in progress."  The list of current
    Internet-Drafts can be accessed at http://www.ietf.org/ietf/1id-abstracts.txt.  The
    list of Internet-Draft Shadow Directories can be accessed at http://www.ietf.org/shadow.html.  This
