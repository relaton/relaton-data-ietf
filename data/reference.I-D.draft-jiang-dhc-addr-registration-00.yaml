abstract:
- language: en
  script: Latn
  content: "<p>In the IPv6 address allocation scenarios, node self-generated addresses
    are notionally conflicted with the network managed address architecture. These
    addresses need to be registered in the networking management plate for the purposes
    of central address administration. This document extends Dynamic Host Configuration
    Protocol for IPv6 (DHCPv6) and Router Advertisement to enable the address registration
    processing from nodes to network management.</p>"
