  script: Latn
  content: <p>Over the course of several years, a rich collection of technologies
    has developed around DNS-Based Service Discovery, described across multiple documents.  This
    "Road Map" document gives an overview of how these related but separate technologies
    (and their documents) fit together, to facilitate service discovery in various
    environments.</p>
