abstract:
- language: en
  script: Latn
  content: |-
    <p>This document explores addressing the problem of using an IGP to
       carry arbitrary information, often referred to using the phrase "the
       IGP is not a dump truck".  It describes the kinds of information
       carried in an IGP and proposes an approach to changing the system.</p>
