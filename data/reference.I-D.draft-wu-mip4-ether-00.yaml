abstract:
- language: en
  script: Latn
  content: "<p>The IP Mobility Protocol [RFC3344] enables node to maintain IP connectivity
    when node changes the location. However it is ideal to support forwarding ethernet
    frame between mobile node and ethernet service provider. This document describes
    ethernet extension mobility option for mobile IPv4 that is intended to assist
    home agent to tunnel ethernet frame on the home link to the FA in the foreign
    link during datagram delivery process.</p>"
