abstract:
- language: en
  script: Latn
  content: "<p>This document describes a LDP graceful restart(GR) mechanism that helps
    to minimize the negative effects on single or multi-segment pseudowire traffic
    caused by Provider Edge (PE) control plane restart, specifically by the restart
    of its Label Distribution Protocol (LDP) component.</p>"
