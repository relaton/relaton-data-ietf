abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method for streaming multimedia attachments
    received by a resource constrained and/or mobile device from an IMAP server.  It
    allows such clients, which often have limits in storage space and bandwidth, to
    play video and audio e-mail content.  The document describes a profile for making
    use of the IMAP URLAUTH extension (RFC 4467), the Network Announcement SIP Media
    Service (RFC 4240), and the Media Server Control Markup Language (RFC 4722).  The
    document also defines a new IMAP METADATA entry.</p>"
