abstract:
- language: en
  script: Latn
  content: "<p>This document defines a profile for the structure of repositories that
    contain X.509 / PKIX Resource Certificates, Certificate Revocation Lists and signed
    objects. This profile contains a suggested object naming scheme for the contents
    of Resource Certificate Repositories and a suggested internal structure of the
    Repository that is intended to facilitate synchronization across a distributed
    collection of repositories and facilitate certificate path construction.</p>"
