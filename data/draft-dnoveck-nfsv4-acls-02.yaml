abstract:
- language: en
  script: Latn
  content: "<p>This document is part of the set of documents intended to update the\n   description of NFSv4 Minor Version One as part of the rfc5661bis\n   effort.  It describes the structure and function of Access Control\n   Lists within all minor versions of NFSv4.\n\n   It describes the structure of NFSv4 ACLs and their role in the NFSv4\n   security architecture.  While the focus of this document is on the\n   role of ACLs in providing a more flexible approach to file access\n   authorization than is made available by the POSIX-derived\n   authorization-related attributes, the potential provision of other\n   security-related functionality is covered as well.\n\n   While the goals of the description are similar to those motivating\n   previous specifications, the approach taken is substantially\n   different, in that the relationship of the multiple ACL models\n   supported has changed.  A core set of functionality, derived from the\n   now-withdrawn POSIX draft ACLs is presented as the conceptual base of\n   the feature set.  Additional features used to provide the\n   functionality within the NFSv4 ACL model are presented as OPTIONAL\n   extensions to that core.\n\n   The current version of the document is intended, in large part, to\n   result in working group discussion regarding repairing problems with\n   previous specifications of ACL-related features and to enable work to\n   provide a greater degree of interoperability than has been available\n   heretofore.  The drafts provide a framework for addressing these\n   issues and obtaining working group consensus regarding necessary\n   changes.\n\n   When the resulting document is eventually published as an RFC, it\n   will supersede the descriptions of ACL structure and semantics\n   appearing in existing minor version specification documents for\n   NFSv4.0 and NFSv4.1, thereby updating RFC7530 and RFC8881.</p>"
