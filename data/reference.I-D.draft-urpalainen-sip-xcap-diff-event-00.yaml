abstract:
- language: en
  script: Latn
  content: <p>This document describes an "xcap-diff" SIP event package with the aid
    of which the clients can receive partial changes of the Extensible Markup Language
    (XML) Configuration Access Protocol (XCAP) resources. The initial synchronization
    and document updates are based on using the XCAP-Diff format. This document extends
    this format by allowing subscriptions also to XCAP components.</p>
