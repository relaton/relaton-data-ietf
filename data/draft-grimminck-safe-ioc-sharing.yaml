formattedref:
  content: draft-grimminck-safe-ioc-sharing
title:
- language: en
  script: Latn
  content: Safe and Reversible Sharing of Malicious URLs and Indicators
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-grimminck-safe-ioc-sharing-14
docidentifier:
- content: draft-grimminck-safe-ioc-sharing
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-09-09'
abstract:
- language: en
  script: Latn
  content: "<p>This document codifies a consistent and reversible convention used in\n   the threat intelligence and security communities for sharing\n   potentially malicious indicators of compromise (IOCs), such as URLs,\n   IP addresses, email addresses, and domain names.  It describes an\n   obfuscation format that reduces the risk of accidental execution or\n   activation when IOCs are displayed or transmitted.  The\n   transformation renders an indicator syntactically invalid as a URI\n   while keeping it recognizable to a human reader, and the original\n   value can be recovered deterministically.  Safe-IOC strings are a\n   textual rendering convention, not URIs, and are not intended to be\n   processed by generic URI parsers.  These conventions aim to improve\n   interoperability among tools and feeds that exchange threat\n   intelligence data.</p>"
