abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a nomination snapshot published by a CATS
       Service Metric Agent (C-SMA) to a CATS Path Selector (C-PS).  The
       snapshot carries aggregated service metrics together with a nominated
       service candidate set.

       The document defines the snapshot contract and two interoperable
       binding for the C-SMA-to-C-PS interface: a YANG-modeled snapshot
       delivered over HTTPS using RESTCONF for centralized C-PS deployments,
       and a BGP-LS service-metadata mapping for distributed deployments in
       which a C-PS is located at an ingress CATS-Forwarder.

       The SCI-to-C-SMA interface, individual metric definitions, management
       models, generic OAM, and the C-SMA's internal aggregation, ranking,
       and caching methods are outside the scope of this document.</p>
