- language: en
  script: Latn
  content: "<p>Segment Routing has been proposed to cope with the use cases in traffic
    engineering, fast re-reroute, service chain, etc. This document is to compare
    Segment Routing with the existing LDP and RSVP-TE. Through the comparison the
    challenges are clarified for the Segment Routing when deploy in the existing MPLS
    network.</p>"
