abstract:
- language: en
  script: Latn
  content: "<p>This document relaxes packet verification rules defined in the Babel
    MAC Authentication protocol in order to make it more robust in the presence of
    packet reordering. This document updates RFC 8967 by relaxing the packet validation
    rules defined therein.</p>"
