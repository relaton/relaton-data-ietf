abstract:
- language: en
  script: Latn
  content: <p>The registration and use of Interface Types ("ifType" values) predated
    the use of IANA Considerations sections and YANG modules, and so confusion has
    arisen about the ifType allocation process. This document provides updated guidelines
    for the definition of new Interface Types, for consideration by those who are
    defining, registering, or evaluating those definitions.</p>
