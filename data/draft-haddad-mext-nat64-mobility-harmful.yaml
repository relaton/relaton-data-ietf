abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo discusses potential NAT64 technology repercussions for
    mobile nodes using Mobile IPv6.  An ambiguity is identified related
    to the use of DNS during bootstrapping, which is likely to inhibit
    proper signaling between mobile node and home agent.</p>
