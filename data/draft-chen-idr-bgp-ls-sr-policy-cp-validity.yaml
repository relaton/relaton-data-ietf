abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism to collect the configuration and
    states of SR policies carrying the validity control parameters of the candidate
    path by using BGP Link-State (BGP-LS) updates. Such information can be used by
    external components for path computation, re-optimization, service placement,
    etc.</p>"
