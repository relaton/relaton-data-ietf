abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism for an mLDP based P2MP/MP2MP LSP
    root node to discover the leaf nodes information.  This allows the root node gets
    the full information of the leaf node for one specified P2MP/MP2MP LSP.  Such
    kind of function provides a general method for mLDP based P2MP/MP2MP LSP leaf
    node discovery, which will be used for multiplexing/aggregation by various mLDP
    applications, e.g, P2MP PW [I-D.draft-martini-pwe3-p2mp-pw], VPLS multicast [I-D.draft-ietf-l2vpn-vpls-mcast],
    L3VPN multicast [I-D.draft-ietf-l3vpn-2547bis-mcast] and etc.</p>"
