  content: "<p>The purpose of this informational document is to establish test and
    evaluation methodology and measurement techniques for physical network equipment
    in the data center. Many of these terms and methods may be applicable beyond this
    publication's scope as the technologies originally applied in the data center
    are deployed elsewhere.</p>"
