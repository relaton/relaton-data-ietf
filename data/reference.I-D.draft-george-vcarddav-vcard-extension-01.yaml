abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension to the vCard data format for representing
    and exchanging a variety of social network information.  Note  A revised version
    of this draft document will be submitted to the RFC editor as a Proposed Standard
    for the Internet Community.  Discussion and suggestions for improvement are requested,
    and should be sent to vcarddav@ietf.org.</p>"
