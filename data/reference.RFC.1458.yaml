abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses some of these unresolved issues, and provides a
    high-level design for a new multicast transport protocol, group address and membership
    authority, and modifications to existing routing protocols.  This memo provides
    information for the Internet community. It does not specify an Internet standard.</p>"
