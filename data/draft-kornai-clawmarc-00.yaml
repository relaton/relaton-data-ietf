abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies clawmarc, a fixed-size, 4096-byte catalog
       card for describing digital artefacts in content-addressed and
       replicated catalogs.  A clawmarc card binds to the bytes of an
       artefact, carries compact human-readable descriptive text and an
       optional machine-readable search payload, records retrieval hints,
       and is signed by its issuer.  The format is intended to improve
       interoperability among independent catalog producers and consumers
       without requiring any particular storage backend, catalog governance
       model, or search engine.  This document is an Independent Stream
       Informational specification; it does not represent IETF consensus and
       does not define an Internet standard.</p>
