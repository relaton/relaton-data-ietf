abstract:
- language: en
  script: Latn
  content: <p>This document describes an Registration Data Access Protocol (RDAP)
    extension for including status sets assigned to RDAP object classes, such as the
    Domain Object Class and the Nameserver Object Class in [RFC9083]. There can be
    many overlapping reasons for each of the "status" member values, such as implementing
    a lock service, complying with a court order, or addressing domain abuse. A status
    set defines an object representing the reason for setting a "status" value, so
    clients and servers can effectively manage the overlapping reasons of individual
    "status" values using the status sets. This RDAP extension supports returning
    the assigned client and server status sets with additional data members, such
    as the mapped "status" values and when the status set was assigned.</p>
