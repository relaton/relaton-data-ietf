id: draftchenpcecomputebackupegress
schema_version: v1.5.6
title:
- language: en
  script: Latn
  content: Extensions to the Path Computation Element Communication Protocol (PCEP)
    for Backup Egress of a Traffic Engineering Label Switched Path
  format: text/plain
docidentifier:
- content: draft-chen-pce-compute-backup-egress
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document presents extensions to the Path Computation Element Communication
    Protocol (PCEP) for a PCC to send a request for computing a backup egress for
    an MPLS TE P2MP LSP or an MPLS TE P2P LSP to a PCE and for a PCE to compute the
    backup egress and reply to the PCC with a computation result for the backup egress.</p>"
  format: text/html
