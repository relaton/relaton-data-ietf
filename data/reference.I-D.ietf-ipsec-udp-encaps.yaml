abstract:
- language: en
  script: Latn
  content: "<p>This protocol specification defines methods to encapsulate and decapsulate
    IP Encapsulating Security Payload (ESP) packets inside UDP packets for the purpose
    of traversing Network Address Translators. ESP encapsulation as defined in this
    document is capable of being used in both IPv4 and IPv6 scenarios. The encapsulation
    is used whenever negotiated using Internet Key Exchange (IKE).</p>"
