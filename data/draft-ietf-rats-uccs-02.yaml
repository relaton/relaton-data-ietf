abstract:
- language: en
  script: Latn
  content: "<p>CBOR Web Token (CWT, RFC 8392) Claims Sets sometimes do not need the
    protection afforded by wrapping them into COSE, as is required for a true CWT.
    This specification defines a CBOR tag for such unprotected CWT Claims Sets (UCCS)
    and discusses conditions for its proper use. // The present version (-01) has
    a few editorial improvements over // -00 and attempts to address points from Thomas
    Fossati's // 2021-03-16 review, for further discussion at IETF 111.</p>"
