abstract:
- language: en
  script: Latn
  content: "<p>SCIJER (pronounced skyjer) specifies a mapping of data types to\n   JavaScript Object Notation (JSON) encoding.  The JSON specification\n   defines encodings for integers, strings, arrays and objects.  This\n   document specifies a mapping between JSON encoding and an extended\n   set of types.</p>"
