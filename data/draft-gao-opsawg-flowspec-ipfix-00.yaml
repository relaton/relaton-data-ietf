abstract:
- language: en
  script: Latn
  content: "<p>BGP Flow Specification (FlowSpec) is commonly used to distribute traffic
    filtering and traffic treatment rules. Operational monitoring of FlowSpec deployments
    may require information from multiple sources, including BGP control-plane telemetry,
    operational state, and forwarding-plane observations. This document defines IP
    Flow Information Export (IPFIX) Information Elements that add FlowSpec context
    to IPFIX Flow Records. The exported information enables a Collector to correlate
    exported Flow Records with a FlowSpec rule in the scope of an Observation Domain
    and to identify the treatment class reported by the Exporter.</p>"
