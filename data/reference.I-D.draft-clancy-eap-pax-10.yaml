abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Extensible Authentication Protocol method
    called EAP-PAX (Password Authenticated eXchange). This method is a lightweight
    shared-key authentication protocol with optional support for key provisioning,
    key management, identity protection, and authenticated data exchange.</p>"
