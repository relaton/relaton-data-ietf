- language: en
  script: Latn
  content: <p>Multiple Internet standards describe common mailbox names (mailbox @
    domain) to be used by organizations for operational and business functions. This
    document defines a new mailbox called "privacy" that SHOULD be used for contacting
    domain name owners about privacy issues.</p>
