- language: en
  script: Latn
  content: |-
    <p>NTP timestamps are used by several RTP protocols for synchronisation
       and statistical measurement.  This memo specificies SDP signalling
       identifying NTP timestamp clock sources and SDP signalling
       identifying the media clock sources in a multimedia session.</p>
