abstract:
- language: en
  script: Latn
  content: "<p>This document defines PaC-EP Master Key (PEMK), a master key used between
    a PANA client and an enforcement point, for bootstrapping lower-layer ciphering.
    A PEMK is derived from EAP Master Session Key as a result of successful PANA authentication.
    The PEMK is defined to guarantee cryptographic independence among enforcement
    points across different types of lower-layers.</p>"
