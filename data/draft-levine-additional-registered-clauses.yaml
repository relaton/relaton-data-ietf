abstract:
- language: en
  script: Latn
  content: "<p>SMTP servers add Received: trace headers to mail messages to track
    their progress This document updates the registration criteria for Additional
    Registered Clauses in those headers to Expert Review, and adds new clauses for
    Server Name Indication (SNI) and sending port number (PORT).</p>"
