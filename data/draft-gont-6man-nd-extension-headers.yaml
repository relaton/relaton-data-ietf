abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes the security implications of using IPv6 Extension
    Headers with Neighbor Discovery (ND) messages. It updates RFC 4861 such that use
    of the IPv6 Fragmentation Header is forbidden in all Neighbor Discovery messages,
    thus allowing for simple and effective counter-measures for Neighbor Discovery
    attacks. Finally, it discusses the security implications of using IPv6 fragmentation
    with SEcure Neighbor Discovery (SEND), and provides advice such that the aforementioned
    security implications are mitigated.</p>"
