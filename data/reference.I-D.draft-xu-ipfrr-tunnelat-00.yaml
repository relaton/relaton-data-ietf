abstract:
- language: en
  script: Latn
  content: "<p>This draft decribes Tunnel-AT mechanism that improves the Tunnel IP
    fast re-route mechanism.  Tunnel-AT provides 100% node protection coverage in
    a symmetric biconnected network at a computational cost of less than one full
    SPT calculation.</p>"
