abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an alternative mechanism how to deliver the
    current target URI to the UAS, e.g. in order to implement the use- cases specified
    in draft-rosenberg-sip-ua-loose-route-01 [8]. The document also shows how the
    P-Called-Party-ID header can be used to solve some use-cases.</p>"
