abstract:
- language: en
  script: Latn
  content: "<p>This document presents a noble mechanism to eliminate jitter caused
    by shaping delay on the network entrance node. It needs to be used in combination
    with a queueing mechanism that provides low jitter for the DetNet path, and ultimately
    provides a low jitter guarantee for the DetNet flow.</p>"
