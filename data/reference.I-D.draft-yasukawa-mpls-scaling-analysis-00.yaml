abstract:
- language: en
  script: Latn
  content: "<p>Traffic engineered Multiprotocol Label Switching (MPLS-TE) is being
    deployed in provider's backbone networks. The providers wish to grow these networks,
    and need to discover whether existing protocols and implementations can support
    the network sizes that they are planning. This document presents an analysis of
    some of the scaling concerns for MPLS-TE backbone networks, and examines the value
    of two techniques for improving scaling.</p>"
