abstract:
- language: en
  script: Latn
  content: "<p>Version 2 of the Internet Open Trading Protocol (IOTP) will extend\nthe interoperable framework for Internet commerce capabilities of\nVersion 1 while replacing the XML messaging and digital signature\npart of IOTP v1 with standards based mechanisms. Additional features\nare listed and divided into those the will, may, and will not be\nincluded.</p>"
