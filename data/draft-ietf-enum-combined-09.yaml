- language: en
  script: Latn
  content: "<p>This memo defines an interim solution for Infrastructure ENUM in order
    to allow a combined User and Infrastructure ENUM implementation in e164.arpa as
    a national choice. This interim solution will be deprecated after implementation
    of the long-term solution. This memo provides information for the Internet community.</p>"
