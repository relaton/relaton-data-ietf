abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension to OAuth 2.0 [RFC6749] that enables
    Authorization Servers to consider Attestation Results presented by Native Applications
    when issuing access grants. By incorporating information about the security characteristics
    of the application and its execution environment, this mechanism supports Authorization
    Policies that are tailored to the trustworthiness of the Native Application.</p>"
