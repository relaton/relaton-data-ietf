abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new AVP to be transported in RADIUS or Diameter
    when EAP is carried over these protocols. The purpose of this AVP is to determine
    which layer 2 protocol was used to encapsulate the EAP messages at the point they
    were initiated.</p>"
