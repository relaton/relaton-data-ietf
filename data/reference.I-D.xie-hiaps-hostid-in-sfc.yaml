- language: en
  script: Latn
  content: "<p>The purpose of this document is to present host identification problem
    due to the address and prefix sharing in service function chaining.  We have identified
    this problem in the use cases of the parental control service and offloading service
    in home networks and also some use cases in mobile networks.</p>"
