abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a framework for dynamically adjusting network-
       wide load balancing policies in response to cloud service scaling
       events, addressing key challenges faced by Telecom Cloud Service
       Providers (TCSPs).  As cloud services scale, increase traffic, or
       relocate workloads across distributed edge and core clouds, network
       policies must adapt in real time to maintain optimal performance and
       ensure compliance with strict service level objectives (SLOs).
       Current manual network adjustments are often slow, error prone, and
       insufficient for the dynamic nature of cloud environments.</p>
