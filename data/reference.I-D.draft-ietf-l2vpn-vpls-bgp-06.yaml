abstract:
- language: en
  script: Latn
  content: "<p>Virtual Private LAN (Local Area Network) Service (VPLS), also known
    as Transparent LAN Service, and Virtual Private Switched Network service, is a
    useful Service Provider offering. The service offers a Layer 2 Virtual Private
    Network (VPN); however, in the case of VPLS, the customers in the VPN are connected
    by a multipoint Ethernet LAN, in contrast to the usual Layer 2 VPNs, which are
    point-to-point in nature.</p>"
