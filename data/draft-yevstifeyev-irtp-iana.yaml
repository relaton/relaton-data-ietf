abstract:
- language: en
  script: Latn
  content: "<p>This document defined IANA considerations for Internet Reliable Transaction
    Protocol (IRTP). This protocol uses several values that are to be assigned by
    IANA, but no appropriate registries have been created so far. This document serves
    as a foundation for such registries. It updates RFC 938.</p>"
