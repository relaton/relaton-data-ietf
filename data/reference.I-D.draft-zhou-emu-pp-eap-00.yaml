abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Protected Password-based Extensible Authentication
    Protocol (EAP) method. PP-EAP is an EAP method that enables secure communication
    between a peer and a server by using the Transport Layer Security (TLS) to establish
    a server-authentictaed tunnel. Within the tunnel, Type-Length-Value (TLV) objects
    are used to convey password-based authentication between the peer and the EAP
    server.</p>"
