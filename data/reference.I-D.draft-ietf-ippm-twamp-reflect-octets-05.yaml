abstract:
- language: en
  script: Latn
  content: "<p>The IETF has completed its work on the core specification of TWAMP
    - the Two-Way Active Measurement Protocol.  This memo describes two closely-related
    features for TWAMP: an optional capability where the responder host returns some
    of the command octets or padding octets to the controller, and an optional sender
    packet format that ensures equal test packet sizes are used in both directions.</p>"
