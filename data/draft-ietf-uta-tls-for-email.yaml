abstract:
- language: en
  script: Latn
  content: "<p>This specification updates the current recommendation for the use of
    the Transport Layer Security (TLS) protocol to provide confidentiality of email
    between a Mail User Agent (MUA) and a Mail Submission Server or Mail Access Server.
    This document updates RFC 8314.</p>"
