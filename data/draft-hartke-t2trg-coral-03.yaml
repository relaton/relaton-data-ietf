abstract:
- language: en
  script: Latn
  content: |-
    <p>The Constrained RESTful Application Language (CoRAL) defines a data
       model and interaction model as well as two specialized serialization
       formats for the description of typed connections between resources on
       the Web ("links"), possible operations on such resources ("forms"),
       and simple resource metadata.

    Discussion Venue

       This Internet-Draft is discussed on the Thing-to-Thing Research Group
       (T2TRG) mailing list &lt;https://www.irtf.org/mailman/listinfo/t2trg&gt;.</p>
