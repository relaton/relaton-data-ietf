    structured data in email messages. Discussion Venues This note is to be removed
    before publishing as an RFC. Discussion of this document takes place on the Structured
    Email Working Group mailing list (sml@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/sml/.
