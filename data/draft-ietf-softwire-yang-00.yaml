abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model for the configuration and operations
    (state, notification, RPC etc.) of IPv4-in-IPv6 Softwire Border Routers and Customer
    Premises Equipment. The model covers the Lightweight 4over6, MAP-E and MAP-T Softwire
    mechanisms.</p>"
