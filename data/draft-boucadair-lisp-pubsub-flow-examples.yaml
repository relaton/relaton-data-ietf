  content: "<p>This document provides a set of flow examples to illustrate the use
    of LISP PubSub specification. Discussion Venues This note is to be removed before
    publishing as an RFC. Discussion of this document takes place on the Locator/ID
    Separation Protocol Working Group mailing list (lisp@ietf.org), which is archived
    at https://mailarchive.ietf.org/arch/browse/lisp/. Source for this draft and an
    issue tracker can be found at https://github.com/boucadair/lisp-pubsub-flow-examples.</p>"
