abstract:
- language: en
  script: Latn
  content: "<p>The CBOR Extended Diagnostic Notation (EDN), to be standardized in\n   draft-ietf-cbor-edn-literals, provides \"application extensions\" as\n   its main language extension point.\n\n   A number of application extensions are already defined in draft-ietf-\n   cbor-edn-literals itself and in draft-ietf-cbor-edn-e-ref.  The\n   present document defines a number of additional application\n   extensions that have been batched up as a next step after completing\n   these specifications. (\n   // Chore: Briefly List extensions.)\n\n\n   // This -01 of an individual submission is a slight update of -00,\n   // which showed the approximate shape the first \"batch\" of\n   // application extensions could have, plus a number of registrations\n   // that could go into this batch.  The latter provides a basis for a\n   // technical discussion of those registrations.</p>"
