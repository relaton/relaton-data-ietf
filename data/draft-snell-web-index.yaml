abstract:
- language: en
  script: Latn
  content: "<p>This memo describes an alternative approach to the Web Resource discovery
    mechanisms described within the draft-jones-simple-web-discovery and draft-jones-appsawg-webfinger
    Internet Drafts. It is the intention of this document to provide an alternative
    point of view intended to add to the overall discussion and evolution of a functional,
    usable, simple discovery mechanism.</p>"
