- language: en
  script: Latn
  content: "<p>This specification defines a new Session Initiation Protocol (SIP)
    media feature tag, sip.psap.callback, that SIP entities can use to identity Public
    Safety Answering Point (PSAP) callback calls, and to associate them with a previously
    made emergency call.</p>"
