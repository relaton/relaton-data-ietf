abstract:
- language: en
  script: Latn
  content: "<p>IEEE 802.1Qca Path Control and Reservation (PCR) [IEEE8021Qca] uses
    the algorithm specified in [I-D.ietf-rtgwg-mrt-frr-algorithm] to compute Maximally
    Redundant Trees (MRTs) to be used for the protection of data traffic in bridged
    networks. This document discusses the applicability of the MRT algorithm to 802.1Qca.</p>"
