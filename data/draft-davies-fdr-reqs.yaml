- language: en
  script: Latn
  content: "<p>This document sets out a set of requirements which we believe are \ndesirable
    for the future routing architecture and routing protocols \nof a successful Internet.
    \ This first version is, of necessity, \nincomplete.  It is hoped that this document
    will be useful as a \ncatalyst to the work that needs to be done in both the IRTF
    and the \nIETF.</p>"
