abstract:
- language: en
  script: Latn
  content: "<p>This document defines the REQUESTED-ADDRESS-TYPE attribute for the
    Simple Traversal Underneath NAT (STUN) Relay Usage, which allows a client to explicitly
    request the address type the STUN relay server will allocate (e.g., an IPv4-only
    node may request the STUN relay server to allocate an IPv6 address). Additionally,
    this document also defines a new error response code with the value 440 (Address
    Family not Supported).</p>"
