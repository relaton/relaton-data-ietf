abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Deferred Token Response (DTR) extension for
    OAuth 2.1. In existing OAuth grants, the token endpoint either issues an access
    token or returns an error. DTR establishes a generic asynchronous token request
    mechanism that any OAuth grant may plug into. In DTR-aware flows, the authorization
    server returns a deferral_code and a polling interval, indicating that the final
    token response will be available at a later time. The client retrieves the eventual
    response by polling the token endpoint, or by receiving a callback from the authorization
    server when one is configured.</p>"
