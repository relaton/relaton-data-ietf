abstract:
- language: en
  script: Latn
  content: "<p>This document describes an optional BGP extended community for use
    in Ethernet VPN (EVPN) Virtual Private Wire Service (VPWS).  It helps in avoiding
    the situation where the EVPN VPWS instance is declared 'up' on one side but remains
    'down' on the other side.</p>"
