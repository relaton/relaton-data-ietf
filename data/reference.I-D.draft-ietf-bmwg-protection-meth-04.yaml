abstract:
- language: en
  script: Latn
  content: "<p>Protection Mechanisms  This  draft  describes  the  methodology  for
    \ benchmarking  MPLS Protection mechanisms for link and node protection as defined
    in [MPLS-FRR-EXT]. This document provides test methodologies and test bed  setup
    \ for  measuring  failover  times  while  considering  all dependencies that might
    impact faster recovery of real-time services bound to MPLS based traffic engineered
    tunnels.  The terms used in the procedures included in this document are defined
    in [TERM-ID].</p>"
