abstract:
- language: en
  script: Latn
  content: "<p>OAuth 2.0 Rich Authorization Requests (RAR) [RFC9396] standardizes\n   the exchange and processing of authorization details but does not\n   define metadata for describing authorization details types.\n\n   This document addresses a practical interoperability challenge\n   regarding authorization details type metadata, allowing clients to\n   dynamically discover metadata instead of relying on out-of-band\n   agreements.  It also standardizes error signaling for cases where\n   insufficient authorization details are provided, and offers\n   structured remediation mechanisms.</p>"
