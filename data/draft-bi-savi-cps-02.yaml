  script: Latn
  content: "<p>This document specifies the procedure of setting up bindings between
    DHCPv4 [RFC2131]/DHCPv6 [RFC3315] assigned source IP address and anchor (refer
    to [SAVI-framework]) on SAVI (Source Address Validation Improvements) device.
    The bindings can be used to filter packets with forged IP addresses.</p>"
