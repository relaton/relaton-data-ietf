abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a modification to the 6rd deployment model for
    IPv6.  This model extends existing access tunnels beyond an operator- owned gateway
    collocated with the operator's IPv4 network edge to the Border Router.  This modification
    makes it unnecessary to provide IPv4 routes to IPv6 UEs.  The gateway serves as
    an aggregation point for IPv4 routing.</p>"
