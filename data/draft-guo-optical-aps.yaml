abstract:
- language: en
  script: Latn
  content: "<p>We describe an Optical Automatic Protection Switching protocol (O-APS)
    \nfor optical rings. Specifically, the O-APS protocol is an IP-based \nlightweight
    protocol which exploits the characteristics of rings and\ninitially supports the
    optical ring protection on the Optical Channel \n(OCh) level.</p>"
