abstract:
- language: en
  script: Latn
  content: "<p>This document provides some suggestions about ALTO architecture through
    experiments made by P2P Network Experiment Council in Japan. This document also
    introduces experiments made by the Council in Japan to harmonize P2P technology
    with the infrastructure. Specifically, this document describes Hint Server technology,
    which is similar to ALTO technology.</p>"
