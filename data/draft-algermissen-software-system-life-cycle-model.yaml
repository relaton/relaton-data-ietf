abstract:
- language: en
  script: Latn
  content: "<p>This specification defines an abstract model for software systems and
    their relationships with each other in order to establish a basic abstraction
    on which the lifecycle of software systems and collaborations around them can
    be expressed. In addition, this specification defines a number of message formats
    and hypermedia controls, to enable the creation of tools and application in the
    space of software systems life cycle management.</p>"
