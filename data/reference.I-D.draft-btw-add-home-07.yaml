abstract:
- language: en
  script: Latn
  content: "<p>This document discusses DoT/DoH deployment considerations for home
    networks.  It particularly sketches the required steps to use DoT/DoH capabilities
    provided by local networks.  The document specifies new DHCP and Router Advertisement
    Options to convey a DNS Authentication Domain Name.</p>"
