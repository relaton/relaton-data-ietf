abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension to reduce the cost of QUIC deployment
    in environments like datacenters by allowing packet number protection to be optionally
    disabled. Note to Readers Discussion of this draft takes place on the QUIC working
    group mailing list (quic@ietf.org), which is archived at https://mailarchive.ietf.org/arch/search/?email_list=quic
    [1]. Working Group information can be found at https://github.com/quicwg [2];
    source code and issues list for this draft can be found at https://github.com/quicwg/base-drafts/labels/-recovery
    [3].</p>"
