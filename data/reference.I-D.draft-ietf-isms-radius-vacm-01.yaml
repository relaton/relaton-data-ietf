abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols.  In particular, it describes a backward-compatible
    extension to the View-based Access Control Model (VACM) for SNMPv3 for use with
    RADIUS and other AAA services to provide authorization of MIB database access,
    and defines objects for managing this extension.  This extension is intended to
    be used in conjunction with secure SNMP Transport Models that facilitate RADIUS
    authentication, such as the Secure Shell Transport Model.</p>"
