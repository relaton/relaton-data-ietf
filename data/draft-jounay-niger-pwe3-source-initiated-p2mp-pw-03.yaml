abstract:
- language: en
  script: Latn
  content: "<p>This document provides a solution to extend Label Distribution Protocol
    (LDP) signaling in order to allow set up and maintenance of Point-to-Multipoint
    Pseudowire (P2MP PW). Such an extension of existing point to point Pseudowire
    is made necessary by new applications. The document deals with the source-initiated
    P2MP PW setup and maintenance.</p>"
