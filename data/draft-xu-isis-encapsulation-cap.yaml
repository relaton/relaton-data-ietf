abstract:
- language: en
  script: Latn
  content: "<p>Some networks use tunnels for a variety of reasons. A large variety
    of tunnel types are defined and the ingress needs to select a type of tunnel which
    is supported by the egress. This document defines how to advertise egress tunnel
    capabilities in IS-IS Router Capability TLV.</p>"
