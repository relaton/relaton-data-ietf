abstract:
- language: en
  script: Latn
  content: "<p>This document considers the problem of service identification in the
    Session Initiation Protocol (SIP).  Service identification is the process of determining
    the user-level use case that is driving the signaling being utilized by the user
    agent.  This document discusses the uses of service identification, and outlines
    several architectural principles behind the process.  It identifies several perils
    associated with service identification, including fraud, interoperability failures
    and stifling of innovation.</p>"
