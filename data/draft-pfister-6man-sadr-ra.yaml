  script: Latn
  content: "<p>This document defines the Source Address Dependent Route Information
    option for Router Advertisements, enabling source address dependent routes to
    be installed in hosts by neighboring routers. It also adds a new flag to the existing
    Route Information option for backward compatibility purposes.</p>"
