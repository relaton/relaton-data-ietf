abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the drawbacks of the current practice of assigning
    a UDP port to each multicast application. Such assignments are redundant because
    the multicast address already uniquely identifies the data. The document assigns
    a UDP port specifically for use with multicast applications and lists requirements
    for using this port. This approach provides immediate compatibility with existing
    protocol stacks, while also requiring improvements to make the port easier to
    use.</p>"
