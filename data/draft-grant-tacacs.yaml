- language: en
  script: Latn
  content: "<p>TACACS+ provides access control for routers, network access servers
    and other networked computing devices via one or more centralized servers. TACACS+
    provides separate authentication, authorization and accounting services. This
    document describes the protocol that is used by TACACS+.</p>"
