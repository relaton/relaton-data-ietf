abstract:
- language: en
  script: Latn
  content: "<p>In-situ Operations, Administration, and Maintenance (IOAM) records
    operational and telemetry information in the packet while the packet traverses
    a path between two points in the network. This document proposes a new Geneve
    tunnel option and outlines how IOAM data fields are carried in the option data
    field.</p>"
