abstract:
- language: en
  script: Latn
  content: "<p>The QoS NSLP protocol is used to signal QoS reservations and is independent
    of a specific QoS model (QOSM) such as IntServ or DiffServ. Rather, all information
    specific to a QOSM is encapsulated in a separate object, the QSPEC. This document
    defines a template for the QSPEC including a number of QSPEC parameters. The QSPEC
    parameters provide a common language to be re-used in several QOSMs and thereby
    aim to ensure the extensibility and interoperability of QoS NSLP. The node initiating
    the NSIS signaling adds an initiator QSPEC, which indicates the QSPEC parameters
    that must be interpreted by the downstream nodes less the reservation fails, thereby
    ensuring the intention of the NSIS initiator is preserved along the signaling
    path.</p>"
