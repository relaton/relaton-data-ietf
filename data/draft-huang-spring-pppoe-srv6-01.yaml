abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a method that employs SRv6 underlay tunnel to
    transport PPPoE session information across broadband networks. By leveraging the
    programmability of SRv6 SIDs, the approach not only delivers trusted authentication
    and secure subscriber access, but also enables operators to offer differentiated
    services and flexibly instantiate network functions for broadband users.</p>"
