abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to use the Extensible Messaging and Presence
    Protocol (XMPP) as a transport for collecting and distributing security-relevant
    information between network-connected devices.  To illustrate the principles involved,
    this document describes such a usage for the Incident Object Description Exchange
    Format (IODEF).</p>"
