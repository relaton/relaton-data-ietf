abstract:
- language: en
  script: Latn
  content: "<p>The Packet-switched Streaming Service (PSS) and the Multimedia Broadcast/Multicast
    Service (MBMS) defined by 3GPP use SDP and RTSP with some extensions. This document
    provides information about these extensions and registers the RTSP and SDP extensions
    with IANA.</p>"
