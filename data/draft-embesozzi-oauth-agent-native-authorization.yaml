abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Structured Elicitation extension to the OAuth\n   2.0 First-Party Applications (FiPA) specification [FiPA],\n   establishing a standard metadata format for FiPA authorization\n   challenge responses.  FiPA leaves the format for advertising\n   available authenticators and their required inputs undefined,\n   preventing interoperable implementation by AI Agents and other non-\n   browser clients.  This extension adds an elicitations array to the\n   FiPA Authorization Challenge Response, providing a standard metadata\n   format for authenticator challenges.  Model Context Protocol (MCP)\n   Elicitation [MCP-Elicitation] is the normative reference binding.\n\n   This specification covers the just-in-time (JIT) authorization for AI\n   Agents executing on behalf of users in Human-to-Agent (H2A) flows.</p>"
