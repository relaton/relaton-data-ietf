- language: en
  script: Latn
  content: |-
    <p>This document extends the YANG notifications subscription mechanism
       to specify the YANG module semantic version at the subscription.
       Then, a new extension with the revision and the semantic version of
       the YANG push subscription state change notification is proposed.</p>
