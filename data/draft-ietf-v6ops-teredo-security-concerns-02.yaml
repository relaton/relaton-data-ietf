abstract:
- language: en
  script: Latn
  content: "<p>Additional security concerns with Teredo are documented, beyond what
    is in RFC 4380. This is based on an independent analysis of Teredo's security
    implications. The primary intent of this document is to raise the awareness regarding
    the security issues in Teredo as deployed today.</p>"
