abstract:
- language: en
  script: Latn
  content: <p>This document defines "action_ref", a deterministic, content- addressed
    identifier for autonomous agent actions. Any party holding the four preimage fields
    (agent_id, action_type, scope, timestamp) can independently compute and verify
    the identifier without trusting the emitting system. The document specifies the
    derivation algorithm, canonical serialization using RFC 8785 JSON Canonicalization
    Scheme (JCS), timestamp format requirements, canonical receipt envelope, optional
    fields for revocation and policy rotation auditability, scope conventions, and
    a composability model with existing exactly-once execution guarantees.</p>
