abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes an alternative method for performing secure Domain
    Name System (DNS) dynamic updates. The method described here is both simple and
    flexible enough to represent any policy decisions. Secure communication based
    on request/transaction signatures [TSIG] is used to provide authentication and
    authorization.</p>"
