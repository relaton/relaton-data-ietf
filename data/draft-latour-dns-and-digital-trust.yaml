abstract:
- language: en
  script: Latn
  content: "<p>This memo describes an architecture for trust registry membership association
    and verification using Decentralized Identifiers (DIDs), trust registries, and
    the DNS. This architecture provides a verifier with a simple process by which
    to determine and verify an issuer's membership in a trust registry.</p>"
