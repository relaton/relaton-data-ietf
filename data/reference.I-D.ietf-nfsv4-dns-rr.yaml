- language: en
  script: Latn
  content: "<p>This document describes a new DNS Resource Record (RR) type that will
    be utilized by NFSv4 clients and servers to determine the domain string to utilize
    for on-the-wire user/group name attributes and ACL entry information. Discussion
    and suggestions for improvements requested.</p>"
