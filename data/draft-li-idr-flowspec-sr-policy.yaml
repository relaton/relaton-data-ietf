abstract:
- language: en
  script: Latn
  content: "<p>Extensions to BGP Flowspec Version 1 (FSv1) support steering traffic\n   into a Segment Routing (SR) Policy.\n\n   This document extends BGP Flowspec Version 2 (FSv2) to provide the\n   same capability of steering traffic into a SR Policy.  Using the\n   Community Container attribute, this document defines two new standard\n   actions for FSv2: the Redirect to SR Policy Action and the SRv6 SID\n   Action.  The former instructs headend node to direct traffic to a\n   designated SR Policy, while the latter supports simultaneously\n   encapsulating an additional SRv6 SID as required during redirection.\n\n   The Redirect to SR Policy Action may be used either independently or\n   in conjunction with the SRv6 SID Action, depending on the specific\n   application scenario.  In addition, the SRv6 SID Action can be\n   combined with other actions supported by FSv2, such as the Redirect\n   to IPv6 Action.</p>"
