abstract:
- language: en
  script: Latn
  content: "<p>Where the payload carried over a pseudowire carries a number of identifiable
    flows it can in some circumstances be desirable to carry those flows over the
    equal cost multiple paths that exist in the packet switched network.  This draft
    describes two methods of achieving that, the one by including an additional label
    in the label stack, the other by using a block of alternative pseudowire labels.</p>"
