  content: draft-schrock-ep-presentation-binding
title:
- language: en
  script: Latn
  content: Binding Deterministic Rendering and Display Attestations to Human-Authorization Receipts
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-schrock-ep-presentation-binding-01
