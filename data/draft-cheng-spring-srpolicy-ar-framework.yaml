abstract:
- language: en
  script: Latn
  content: "<p>This document defines a framework for quality-aware dynamic adaptive
    adjustment of Segment Lists within an SR-TE Candidate Path. It addresses the limitation
    of static weight assignment, which cannot adapt to dynamic changes in path quality
    (e.g., latency, loss, utilization). The framework enables continuous monitoring
    of end-to- end metrics for each Segment List, computation of updated weights proportional
    to their relative quality, and application at the policy head-end. This allows
    the Candidate Path to autonomously optimize traffic distribution towards higher-quality
    paths, enhancing performance without altering the SR-Policy architecture.</p>"
