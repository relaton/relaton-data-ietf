abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Smart Traffic Synchronization Protocol\n   (STSP), version 1.0 -- an open, extensible protocol for real-time\n   coordination of urban traffic signal infrastructure across\n   distributed networks of intersections.\n\n   STSP defines a standard message format, node state machine,\n   synchronization algorithm, and inter-node communication model that\n   enables any compliant traffic controller to participate in a\n   federated intelligent network -- regardless of manufacturer, city, or\n   country of deployment.\n\n   The key contribution of STSP is the definition of the Infrastructure-\n   to-Infrastructure (I2I) coordination layer -- a communication model\n   between traffic signal nodes that does not exist as an open standard\n   in any currently published specification.  Existing standards such as\n   SAE J2735 SPaT/MAP and ETSI ITS-G5 address Vehicle-to-Infrastructure\n   (V2I) communication.  STSP addresses the orthogonal problem: how\n   nodes coordinate with each other.\n\n   This document is placed in the public domain under CC BY 4.0 with\n   Open Implementation Clause.  Any city, government, company, or\n   individual may implement STSP freely, provided that original\n   authorship is attributed in all implementations, documentation, and\n   derivative works as follows: \"Implements STSP, designed by Gustavo\n   Angel Aldana Flores (draft-aldana-stsp).\"</p>"
