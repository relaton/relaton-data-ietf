abstract:
- language: en
  script: Latn
  content: "<p>This document defines Post-Quantum Traditional (PQ/T) Hybrid key exchange
    methods based on the quantum-resistant Module-Lattice-Based Key-Encapsulation
    Mechanism (ML-KEM) standard and traditional Elliptic-Curve Diffie-Hellman (ECDH)
    key exchange schemes. These methods are defined for use in the Secure Shell (SSH)
    transport layer protocol.</p>"
