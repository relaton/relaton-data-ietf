abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework and a process for developing Performance
    Metrics of protocols and applications transported over IETF-specified protocols.
    \ These metrics can be used to characterize traffic on live networks and services.
    \ This memo documents an  Internet Best Current Practice.</p>"
