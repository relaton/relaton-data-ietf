abstract:
- language: en
  script: Latn
  content: "<p>This document defines a security context suitable for using CBOR Object
    Signing and Encryption (COSE) algorithms within Bundle Protocol Security (BPSec)
    integrity and confidentiality blocks. A profile for COSE, organized by algorithm
    families, and for public key certificates are included for BPSec interoperation.
    This document updates BPSec RFC 9172 by providing Concise Data Definition Language
    (CDDL) rules for extensible security block content.</p>"
