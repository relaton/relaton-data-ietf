abstract:
- language: en
  script: Latn
  content: "<p>Session mobility is the transfer of media of an ongoing communication
    session from one device to another. This document describes the general methods
    and specifies the signaling and media flows for providing this service using the
    Session Initiation Protocol (SIP). Service discovery is essential to locate targets
    for session transfer and is discussed using the Service Location Protocol (SLP)
    as an example.</p>"
