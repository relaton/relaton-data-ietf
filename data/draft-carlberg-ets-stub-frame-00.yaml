  content: |-
    <p>This document presents a framework discussing the role of various
    protocols and mechanisms that could be considered candidates for
    supporting ETS within a stub domain.  Comments about their potential
    usage as well as their current deployment are provided to the reader.
    Specific solutions are not presented.</p>
