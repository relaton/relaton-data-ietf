- language: en
  script: Latn
  content: "<p>This document defines an extension to the SIP registration event package
    for communicating whether or not a registrar has obtained permission to perform
    a translation that was set up through a registration. This extension is used by
    registrars implementing the framework for consent-based communications in SIP.</p>"
