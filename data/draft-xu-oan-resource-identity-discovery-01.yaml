abstract:
- language: en
  script: Latn
  content: "<p>Open agent ecosystems increasingly include heterogeneous resource products:
    callable agents, skills, Model Context Protocol (MCP) servers, ordinary tools,
    and application programming interfaces. A user or orchestrator often needs to
    discover such resources before it can decide which interaction protocol, credential,
    endpoint, or artifact to use. Discovery alone is not sufficient: the relying party
    also needs to know which resource identity was registered, which authority accepted
    it, whether the accepted package is current, and whether the Discovery service
    is authorized to expose it. This document describes a trust-governed resource
    identity and discovery architecture for OpenAgenet (OAN). The architecture separates
    resource subjects, resource providers, Registrar Nodes, a Root Node, Discovery
    Nodes, content distribution, and resource consumers. It defines architectural
    roles, trust boundaries, resource identity expectations, Root-verified package
    semantics, registration and verification behavior, authorization-aware Discovery,
    and pre-use verification requirements. The architecture can be profiled with Decentralized
    Identifier (DID) document concepts and credential-based assertions. This document
    does not define a new DID method, media type, URI scheme, transport protocol,
    ranking algorithm, blockchain protocol, agent invocation protocol, or product-native
    schema.</p>"
