abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Post-Stack MPLS Network Action (MNA) Header
    encoding and procedures for carrying Network Action encodings and Ancillary Data
    after the MPLS label stack, based on the MNA Sub- Stack including In-Stack Network
    Actions and Data specified in RFC 9994. MPLS Network Actions can be used to influence
    packet forwarding decisions, carry additional Operations, Administration, and
    Maintenance information in the MPLS packet, or perform user- defined operations.
    This document follows the framework specified in RFC 9789.</p>"
