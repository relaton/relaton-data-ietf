abstract:
- language: en
  script: Latn
  content: "<p>This document discusses which multicast addresses should be used for
    documentation purposes and reserves IPv6 multicast addresses for such use.  Some
    multicast addresses are derived from AS numbers or unicast addresses.  This document
    also explains how these can be used for documentation purposes by deriving them
    from AS numbers and unicast addresses that are reserved for such purposes.</p>"
