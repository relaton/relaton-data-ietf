abstract:
- language: en
  script: Latn
  content: <p>This document defines the terminology regarding the usage of expressions
    such as "IPv6-Only" and "IPv6-Mostly", in order to avoid confusions when using
    them in IETF and other documents. The goal is that a reference to "IPv6-Only"
    describes the actual functionality being used in a given scope, not the installed
    protocol support.</p>
