---
id: draftietfidr5gedgeservicemetadata
schema_version: v1.5.6
title:
- language: en
  script: Latn
  content: BGP Extension for 5G Edge Service Metadata
  format: text/plain
docidentifier:
- content: draft-ietf-idr-5g-edge-service-metadata
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a new Edge Metadata Path Attribute and some Sub-
    TLVs for egress routers to advertise the Edge Metadata about the attached edge
    services (ES). The edge service Metadata can be used by the ingress routers in
    the 5G Local Data Network to make path selections not only based on the routing
    cost but also the running environment of the edge services. The goal is to improve
    latency and performance for 5G edge services. The extension enables an edge service
    at one specific location to be more preferred than the others with the same IP
    address (ANYCAST) to receive data flow from a specific source, like a specific
    User Equipment (UE).</p>"
  format: text/html
