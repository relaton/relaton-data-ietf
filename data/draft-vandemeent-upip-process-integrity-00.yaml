abstract:
- language: en
  script: Latn
  content: "<p>This document specifies UPIP (Universal Process Integrity Protocol),\n   a five-layer protocol for capturing, verifying, and reproducing\n   computational processes across machines, actors, and trust domains.\n   UPIP defines a cryptographic hash chain over five layers: STATE,\n   DEPS, PROCESS, RESULT, and VERIFY, enabling any party to prove that a\n   process was executed faithfully and can be reproduced.\n\n   This document also specifies Fork Tokens, a continuation protocol\n   enabling multi-actor process handoff with cryptographic chain of\n   custody.  Fork tokens freeze the complete UPIP stack state and\n   transfer it to another actor (human, AI, or machine) for\n   continuation, maintaining provenance integrity across the handoff\n   boundary.\n\n   Together, UPIP and Fork Tokens address process integrity in multi-\n   agent AI systems, distributed computing, scientific reproducibility,\n   autonomous vehicle coordination, and regulatory compliance scenarios.</p>"
