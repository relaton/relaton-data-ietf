- language: en
  script: Latn
  content: "<p>This document describes a way of sharing a /64 prefix among multiple
    links in a leaf network scenario, such as a home network or small office network.
    This provides a way to provide global addressing to all nodes on such a network,
    allowing for end-to-end communication without address translation.</p>"
