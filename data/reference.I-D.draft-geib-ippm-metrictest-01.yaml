abstract:
- language: en
  script: Latn
  content: "<p>This document specifies tests to determine if multiple, independent,
    and interoperable implementations of a metrics specification document are at hand
    so that the metrics specification can be advanced to an Internet standard.  Results
    of different IPPM implementations can be compared if they measure under the same
    underlying network conditions.  Results are compared using state of the art statistical
    methods.</p>"
