abstract:
- language: en
  script: Latn
  content: "<p>The problem of provisioning a light-path in a transparent dense wavelength
    division multiplexing (DWDM) optical island requires the transmission of optical
    impairment related parameters along the selected route.  In this draft we propose
    the GMPLS signaling protocol (RSVP/RSVP-TE) extensions to transmit optical impairments
    to setup an optically feasible light-path.</p>"
