abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the Kerberos protocol for the Kerberos
    client to authenticate the Kerberos Key Distribution Center (KDC) and the Kerberos
    server, without revealing the client's identity or the client's realm to the server
    or to the KDC.  It updates RFC 4120.  These extensions can be used to secure communication
    between the anonymous client and the server.</p>"
