abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to use 'static-static' Elliptic Curve Diffie-Hellman
    key-agreement with the Cryptographic Message Syntax. In this form of key-agreement,
    the Diffie-Hellman values of both sender and receiver are long-term values contained
    in certificates. Thus, this form of key-agreement provides authentication of sender
    as well as receiver.</p>"
