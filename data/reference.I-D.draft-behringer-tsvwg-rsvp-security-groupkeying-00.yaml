abstract:
- language: en
  script: Latn
  content: "<p>The Resource reSerVation Protocol (RSVP) allows hop-by-hop authentication
    of RSVP neighbors. This requires messages to be cryptographically signed using
    a shared secret between participating nodes. This document compares group keying
    for RSVP with per neighbor or per interface keying, and discusses the applicability
    and limitations of these approaches. Draft-weis-gdoi-for-rsvp describes how the
    Group Domain of Interpretation (GDOI) can be used to distribute group keys to
    RSVP nodes. The document also discusses applicability of group keying to RSVP
    encryption.</p>"
