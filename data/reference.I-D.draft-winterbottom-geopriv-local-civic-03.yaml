abstract:
- language: en
  script: Latn
  content: "<p>A backwardly-compatible mechanism for adding locally significant civic
    address elements to the Geopriv civic address format is described.  A formal mechanism
    for handling unsupported extensions when translating between XML and DHCP civic
    address forms is defined for entities that need to perform this translation.</p>"
