abstract:
- language: en
  script: Latn
  content: "<p>This document describes the unnecessary multicast stream flooding problem
    in the link layer switches between multicast source and PIM First Hop Router (FHR).
    \ The IGMP-Snooping Switch will forward multicast streams to router ports, and
    the PIM FHR must receive all multicast streams even if there is no request from
    receiver.  This often leads to waste of switchs' cache and link bandwidth when
    the multicast streams are not actually required.  This document details the problem
    and defines design goals for a generic mechanism to restrain the unnecessary multicast
    stream flooding.</p>"
