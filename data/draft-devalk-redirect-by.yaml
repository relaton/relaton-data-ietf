abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Redirect-By HTTP response header field. It
    allows the software component whose decision determined an HTTP redirect to identify
    itself, so that an operator diagnosing a redirect can determine which component
    was responsible for it. The field succeeds the widely deployed, non-standard X-Redirect-By
    header, which this document deprecates.</p>"
