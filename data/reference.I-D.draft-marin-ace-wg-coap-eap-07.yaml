abstract:
- language: en
  script: Latn
  content: "<p>This document describes an authentication service that uses EAP transported
    by means of CoAP messages with the following purposes:</p>"
- language: en
  script: Latn
  content: "<p>o  Authenticate a CoAP-enabled device that enters a new security domain
    against a AAA infrastructure through a domain Controller.</p>"
- language: en
  script: Latn
  content: "<p>o  Bootstrap key material to protect CoAP messages exchanged between
    them.</p>"
- language: en
  script: Latn
  content: "<p>o  Enable the establishment of Security Associations between them.</p>"
