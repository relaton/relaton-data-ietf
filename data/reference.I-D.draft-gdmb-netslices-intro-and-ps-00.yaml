- language: en
  script: Latn
  content: "<p>This documents represents an introduction to the motivation and Network
    Slicing problems and work ares.  It represents an initial revision of Network
    Slicing problem statement derived from the analysis of the technical gaps in IETF
    protocols ecosystem.  It complements and it bring together the isolated efforts
    being carried out in several IETF working groups to achieve certain aspects of
    network slice functions and operations.</p>"
