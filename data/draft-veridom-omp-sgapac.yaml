abstract:
- language: en
  script: Latn
  content: "<p>This document defines a domain profile of the Operating Model\n   Protocol (OMP) for AI systems deployed in Singapore and the ASEAN\n   region subject to the Singapore Model AI Governance Framework (Second\n   Edition, 2020), the Monetary Authority of Singapore (MAS) FEAT\n   Principles for financial services AI, and the ASEAN Guide on AI\n   Governance and Ethics (2024).\n\n   The profile -- designated SingapureMark -- specifies how OMP's\n   deterministic routing invariant, Watchtower enforcement framework,\n   and three-layer cryptographic integrity architecture generate the\n   per-decision accountability evidence required by Singapore's model AI\n   governance framework, satisfy the MAS FEAT Principles' named\n   accountability and explainability requirements, and align with the\n   ASEAN Guide's human oversight and consumer protection governance\n   standards.\n\n   The OMP core specification is defined in the Operating Model Protocol\n   Internet-Draft (draft-veridom-omp).</p>"
