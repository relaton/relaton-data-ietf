abstract:
- language: en
  script: Latn
  content: "<p>Pre-congestion notification (PCN) is a link-specific and load- dependent
    packet marking mechanism for Differentiated Services networks.  The packet markings
    are evaluated by egress nodes of PCN domains and the result is used for admission
    control and flow termination decisions.  Two different types of markings have
    been defined.  This document gives a summary of the marking requirements, the
    constraints to encode them in the current IP header (version 4 and above), and
    it explains why the PCN WG currently supports different encoding schemes for PCN
    marking.</p>"
