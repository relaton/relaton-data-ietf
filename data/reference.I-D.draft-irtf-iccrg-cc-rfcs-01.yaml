abstract:
- language: en
  script: Latn
  content: "<p>This document is a survey of congestion control topics within the RFC
    series. The intent of this document is to be an informational snapshot of the
    current state of Internet standards and other IETF products related to congestion
    control. This is an initial output of the IRTF's Internet Congestion Control Research
    Group (ICCRG) and may be used as one reference or starting point for the future
    work of the research group, especially in noting gaps or open issues in the current
    IETF standards.</p>"
