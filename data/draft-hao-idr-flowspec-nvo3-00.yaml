- language: en
  script: Latn
  content: "<p>This document defines BGP flow-spec extension for NVO3. A Flag in BGP
    Path Attribute is introduced to indicate the Flow-spec rules imposing on NVO3
    outer or inner layer. A new subset of NVO3 specific component types and extended
    community also are defined.</p>"
