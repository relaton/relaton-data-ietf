abstract:
- language: en
  script: Latn
  content: "<p>In MPLS-TP survivability framework, a fault condition includes both
    Signal Failure (SF) and Signal Degrade (SD) that can be used to trigger protection
    switching. This document describes Signal Degrade (SD) detection and the consequent
    protection switching mechanism.</p>"
