abstract:
- language: en
  script: Latn
  content: <p>In a companion paper we defined the "unmanaged networks", which typically
    correspond to home networks or small office networks, and the requirements for
    transition mechanisms in various scenarios of transition to IPv6. We start from
    this analysis and evaluate here the suitability of mechanisms that have already
    been specified, proposed or deployed.</p>
