- language: en
  script: Latn
  content: "<p>This document outlines various use-cases for Operations, Administration,
    and Maintenance (OAM) in Segment Routing with the IPv6 data plane (SRv6) network.
    It also describes how the existing OAM mechanisms can be used to address SRv6
    OAM requirements.</p>"
