abstract:
- language: en
  script: Latn
  content: "<p>RFC5926 creates a list of cryptographic algorithms that can be used
    with TCP-AO. This document expands that list, adding two Message Authentication
    Code (MAC) algorithms, HMAC-SHA256-128 and KMAC256-128. For each MAC algorithm,
    a corresponding Key Derivation Function (KDF) is also added. The MAC algorithms
    described by this document produce 128-bit (i.e., 16-byte) MACs. When 16-byte
    MACs are encoded in TCP-AO, the TCP-AO consumes 20 of the 40 bytes available for
    TCP options.</p>"
