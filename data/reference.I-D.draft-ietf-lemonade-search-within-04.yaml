abstract:
- language: en
  script: Latn
  content: "<p>This document describes the WITHIN extension to IMAP SEARCH. IMAP SEARCH
    returns messages whose internal date is within or outside a specified interval.
    The mechanism described here, OLDER and YOUNGER, differs from BEFORE and SINCE
    in that the client specifies an interval, rather than a date. We expect WITHIN
    to be most useful for persistent searches from mobile devices.</p>"
