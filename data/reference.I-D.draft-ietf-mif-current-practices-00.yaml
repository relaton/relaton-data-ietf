abstract:
- language: en
  script: Latn
  content: "<p>An increasing number of hosts are operating in multiple-interface environments,
    where different network interfaces are providing unequal levels of service or
    connectivity.  This document summarizes current practices in this area, and describes
    in detail how some common operating systems cope with these challenges.</p>"
