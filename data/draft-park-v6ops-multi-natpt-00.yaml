abstract:
- language: en
  script: Latn
  content: "<p>In order to widely deploy IPv6 only networks a transition mechanism
    is needed. There are several transition mechanisms defined and many of them have
    issues with scalability. This draft provides a solution to have a scalable NAT-PT,
    which is a transition mechanism defined in [NATPT]</p>"
