abstract:
- language: en
  script: Latn
  content: "<p>Hybrid measurement is the combination of metrics derived from passive
    and active measurement to produce a measurement result. This document discusses
    use cases for hybrid measurement using metrics defined within the IPPM framework,
    and discusses requirements for the definition of passive methodologies for selected
    IPPM metrics.</p>"
