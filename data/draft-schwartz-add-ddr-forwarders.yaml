    Discussion Venues This note is to be removed before publishing as an RFC. Discussion
    of this document takes place on the mailing list (add@ietf.org), which is archived
    at https://mailarchive.ietf.org/arch/browse/add/. Source for this draft and an
    issue tracker can be found at https://github.com/bemasc/ddr-forwarders.</p>"
