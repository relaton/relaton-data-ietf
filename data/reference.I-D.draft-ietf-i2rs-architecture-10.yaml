abstract:
- language: en
  script: Latn
  content: "<p>This document describes an architecture for a standard, programmatic
    interface for state transfer in and out of the Internet routing system.  It describes
    the basic architecture, the components, and their interfaces with particular focus
    on those to be standardized as part of the Interface to Routing System (I2RS).</p>"
