abstract:
- language: en
  script: Latn
  content: "<p>The document describes the BGP mechanisms for SD-WAN (Software Defined
    Wide Area Network) edge node attribute discovery. These mechanisms include a new
    tunnel type and sub-TLVs for the BGP Tunnel- Encapsulation Attribute [RFC9012]
    and set of NLRI (network layer reachability information) for SD-WAN underlay information.
    In the context of this document, BGP Route Reflector (RR) is the component of
    the SD-WAN Controller that receives the BGP UPDATE from SD-WAN edges and in turn
    propagates the information to the intended peers that are authorized to communicate
    via the SD-WAN overlay network.</p>"
