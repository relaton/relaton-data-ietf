abstract:
- language: en
  script: Latn
  content: "<p>This documents describes a set of requirements for an application layer
    registration protocol that allows a user to register in the network by providing
    its identity and authentication information to the local network. The local network
    then validates the user, charge him and, authorize use of resources with the help
    of a AAA infrastructure.</p>"
