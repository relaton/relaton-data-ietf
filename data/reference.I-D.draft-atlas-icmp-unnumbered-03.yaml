abstract:
- language: en
  script: Latn
  content: "<p>This memo defines ICMP extensions through which an router or host can
    explicitly identify the interface upon which an undeliverable datagram arrived.
    The incoming interface can be identified by ifIndex, name, and/or address. The
    extensions defined herein are particularly useful when troubleshooting networks
    with unnumbered interfaces, parallel interfaces and/or asymmetric routing.</p>"
