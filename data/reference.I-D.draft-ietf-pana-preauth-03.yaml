abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension to the Protocol for carrying Authentication
    for Network Access (PANA) for proactively establishing a PANA SA (Security Association)
    between a PaC in one access network and a PAA in another access network to which
    the PaC may move.  The proposed method operates across multiple administrative
    domains.</p>"
