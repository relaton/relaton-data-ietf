- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base\n(MIB) for use with network management protocols in the Internet\ncommunity.  In particular, it defines a basic set of managed\nobjects for SNMP-based monitoring and management of an Internet\nStorage Name Service (iSNS).</p>"
