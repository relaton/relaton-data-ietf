title:
- language: en
  script: Latn
  content: 'Trusted Artifact Provenance (TAP): A Producer, Verifier, and Sealer Contract for Attestation-Gated Reconstruction of Stateful Assets'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-nikolaichuk-rats-tap-00
