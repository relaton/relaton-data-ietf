abstract:
- language: en
  script: Latn
  content: "<p>A bit, D bit, is defined in Flow-spec Redirect-to-IPv4 Extended Community
    and Flow-spec Redirect-to-IPv6 Extended Community. This bit is used by BGP Flow
    Specification to indicate that the associated Flow Specification policy be set
    to an invalid state when the directly connected link associated with the redirect
    target address becomes unavailable.</p>"
