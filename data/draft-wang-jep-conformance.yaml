abstract:
- language: en
  script: Latn
  content: "<p>This document defines conformance classes, validation-result structure,\nschema requirements, test-vector categories, reference-validator behavior,\nand implementation testing guidance for the Judgment Event Protocol\n(JEP). It is a companion to draft-wang-jep-judgment-event-protocol-06.\n\nThe purpose of this document is to make JEP implementations testable,\ninteroperable, and auditable across languages, platforms, identity\nsystems, and deployment profiles.\n\n---</p>"
