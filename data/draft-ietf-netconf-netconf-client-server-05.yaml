abstract:
- language: en
  script: Latn
  content: '<p>This document defines two YANG modules, one module to configure a NETCONF
    client and the other module to configure a NETCONF server. Both modules support
    both the SSH and TLS transport protocols, and support both standard NETCONF and
    NETCONF Call Home connections. Editorial Note (To be removed by RFC Editor) This
    draft contains many placeholder values that need to be replaced with finalized
    values at the time of publication. This note summarizes all of the substitutions
    that are needed. No other RFC Editor instructions are specified elsewhere in this
    document. This document contains references to other drafts in progress, both
    in the Normative References section, as well as in body text throughout. Please
    update the following references to reflect their final RFC assignments: o I-D.ietf-netconf-keystore
    o I-D.ietf-netconf-ssh-client-server o I-D.ietf-netconf-tls-client-server Artwork
    in this document contains shorthand references to drafts in progress. Please apply
    the following replacements: o "XXXX" --&gt; the assigned RFC value for this draft
    o "YYYY" --&gt; the assigned RFC value for I-D.ietf-netconf-ssh-client- server
    o "ZZZZ" --&gt; the assigned RFC value for I-D.ietf-netconf-tls-client- server
    Artwork in this document contains placeholder values for the date of publication
    of this draft. Please apply the following replacement: o "2017-10-30" --&gt; the
    publication date of this draft The following Appendix section is to be removed
    prior to publication: o Appendix A. Change Log</p>'
