abstract:
- language: en
  script: Latn
  content: "<p>SEAL (Segmented Encryption and Authentication Layer) is a construction
    that realizes random-access authenticated encryption (raAE), a primitive that
    partitions a message into an indexed sequence of independently accessible, individually
    authenticated segments. This document specifies concrete, interoperable instantiations
    of SEAL for particular uses, built from previously specified primitives, and applies
    the analysis in a companion document to state their security properties and safe
    usage limits.</p>"
