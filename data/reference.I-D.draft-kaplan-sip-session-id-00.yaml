abstract:
- language: en
  script: Latn
  content: "<p>There are several reasons for having a globally unique session identifier
    for the same SIP session, which can be maintained across B2BUA's and other SIP
    middle-boxes.  This draft proposes a new SIP header to carry such a value: Session-ID.
    \ Kaplan  Expires May 18, 2009  [page 1]  SIP Session Identifier  November 2008</p>"
