abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model for the configuration and
       management of IPv4-in-IPv6 Softwire Concentrators containing a
       Network Configuration Protocol (NETCONF) server.  The models cover
       A+P [RFC6346], encapsulation based softwires.</p>
