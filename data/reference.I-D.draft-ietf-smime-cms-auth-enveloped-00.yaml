abstract:
- language: en
  script: Latn
  content: "<p>This document describes an additional content type for the Cryptographic
    Message Syntax (CMS). The AuthEnvelopedData content type is intended for use with
    authenticated encryption modes. All of the various key management techniques that
    are supported in the EnvelopedData content type are also supported by the AuthEnvelopedData
    content type.</p>"
