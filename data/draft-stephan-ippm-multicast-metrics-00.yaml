- language: en
  script: Latn
  content: "<p>This memo defines a set of spatial metrics for measuring the performance
    of multicast networks and a set of multicast metrics for measuring the performance
    of multicast services. It introduces a framework to perform operational multicast
    metrics measurements coupling SNMP and the IPPM-MIB.</p>"
