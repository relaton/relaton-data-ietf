abstract:
- language: en
  script: Latn
  content: "<p>Experience has shown that there are a number of DNS zones all iterative
    resolvers and recursive nameservers should, unless configured otherwise, automatically
    serve.  RFC 4193 specifies that this should occur for D.F.IP6.ARPA.  This document
    extends the practice to cover the IN-ADDR.ARPA zones for RFC 1918 address space
    and other well known zones with similar characteristics.</p>"
