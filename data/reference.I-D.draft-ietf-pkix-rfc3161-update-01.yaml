abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 3161 [RFC3161]. It allows the use of ESSCertIDv2
    defined in RFC 5035 [ESSv2] to specify the hash of a signer certificate when the
    hash is calculated with a function other than SHA-1 [SHA1].</p>"
