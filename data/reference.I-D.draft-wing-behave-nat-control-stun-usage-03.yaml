abstract:
- language: en
  script: Latn
  content: "<p>Simple Traversal Underneath NAT (STUN) is a mechanism for traversing
    NATs. STUN requests are transmitted through a NAT to external STUN servers. While
    this works very well, its two primary drawbacks are the inability to modify the
    properties of a NAT binding and the need to query a public STUN server for every
    new NAT binding (e.g., every phone call). These drawbacks require frequent messages
    which present a load on servers (like SIP servers and STUN servers) and are bad
    for low speed access networks, such as cellular access. This document describes
    two mechanisms to discover NATs and firewalls and a mechanism to query and control
    them. With these mechanisms, binding discovery and keepalive traffic can be reduced
    to involve only the necessary NATs or firewalls. At the same time, backwards compatibility
    with NATs and firewalls that do not support this document is retained, which allows
    for incremental deployment of these mechanisms.</p>"
