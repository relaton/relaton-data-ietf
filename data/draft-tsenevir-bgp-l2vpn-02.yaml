- language: en
  script: Latn
  content: "<p>Membership and configuration discovery is a key component in Layer
    2 VPN infrastructure. This document presents use of BGP-MP extensions for VPLS
    Membership and configuration discovery. More specifically, this document adapts
    generic VPN discovery methods presented in [2] for VPLS Membership and Configuration
    discovery.</p>"
