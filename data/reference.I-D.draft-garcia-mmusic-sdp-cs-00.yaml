abstract:
- language: en
  script: Latn
  content: "<p>This memo describes use cases and requirements for controlling circuit-switched
    media streams using the Session Description Protocol (SDP).  Additional, it proposes
    conventions on how to use SDP and the SDP capability negotiation framework for
    agreeing on alternative media streams between the endpoints.</p>"
