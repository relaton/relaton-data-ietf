abstract:
- language: en
  script: Latn
  content: "<p>The IETF policies about rights in Contributions to the IETF are\n   designed to ensure that such Contributions can be made available to\n   the IETF and Internet communities while permitting the authors to\n   retain as many rights as possible.  This memo is an update to\n   [RFC5378] and retains the same consistent policies about intellectual\n   property rights in Contributions to the IETF and contains the edits\n   needed to recognize the IETF Intellectual Property Management\n   Corporation (IPMC) as the successor to the IETF Trust.  This memo\n   updates [RFC5378].</p>"
