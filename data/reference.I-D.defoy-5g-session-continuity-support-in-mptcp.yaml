  script: Latn
  content: "<p>This document describes how 5G session continuity can affect MPTCP.
    For now only potential performance issues are identified.  This document aims
    to document discussions that took place at the IETF on this subject, to facilitate
    future deployment of MPTCP over 5G.</p>"
