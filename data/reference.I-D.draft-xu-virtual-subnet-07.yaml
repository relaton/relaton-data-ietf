abstract:
- language: en
  script: Latn
  content: "<p>This document describes a host route based subnet extension solution
    referred to as Virtual Subnet, which mainly reuses existing BGP/MPLS IP VPN [RFC4364]
    and ARP proxy [RFC925][RFC1027] technologies. Virtual Subnet provides a scalable
    approach for interconnecting geographically dispersed cloud data centers.</p>"
