abstract:
- language: en
  script: Latn
  content: "<p>AFS-3 heavily leverages Remote Procedure Calls (RPCs).  This proposal
    adds a new mechanism to better manage the addition of new, enhancement-specific
    RPCs through the use of both capability bits via the GetCapabilities RPC, and
    via standardization of backwards- compatibility behaviors for enhancement-specific
    RPCs.  These goals are accomplished through standardization of Tag-Length-Value
    (TLV) get/set/enumerate RPCs with value payloads encoded using an XDR discriminated
    union.  The XDR union decode problem is circumvented by specifying an opaque default
    leg.  Tags are allocated for existing volume and transaction metadata, and implementation-private
    tags are allocated for metadata related to the OpenAFS Demand Attach File Server.</p>"
