abstract:
- language: en
  script: Latn
  content: "<p>This document describes a bandwidth saving methodology for exporting
    flow or packet information using the IP Flow Information Export (IPFIX) protocol.
    Being the PSAMP protocol based on IPFIX, these considerations are valid for PSAMP
    exports as well. The main idea is to separate the export of information common
    to several flows (or packets) and the specific flow (or packet) information, using
    two different records. The association between the records is kept using unique
    Identifiers.</p>"
