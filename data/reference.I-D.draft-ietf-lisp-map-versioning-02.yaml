abstract:
- language: en
  script: Latn
  content: "<p>This document describes the LISP Map-Versioning mechanism, which provides
    in-packet information about EID-to-RLOC mappings used to encapsulate LISP data
    packets.  The proposed approach is based on associating a version number to EID-to-RLOC
    mappings and transport such a version number in the LISP specific header of LISP-
    encapsulated packets.  LISP Map-Versioning is particularly useful to inform communicating
    xTRs about modifications of the mappings used to encapsulate packets.  The mechanism
    is transparent to legacy implementations, since in the LISP-specific header and
    in the Map Records, bits used for Map-Versioning can be safely ignored by xTRs
    that do not support the mechanism.</p>"
