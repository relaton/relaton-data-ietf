- language: en
  script: Latn
  content: |-
    <p>SRv6 inherits potential security vulnerabilities from Source Routing
       in general, and also from IPv6.  This document describes various
       threats and security concerns related to SRv6 networks and existing
       approaches to solve these threats.</p>
