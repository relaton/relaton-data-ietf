- language: en
  script: Latn
  content: "<p>RFC2563 defines the DHCP Auto-configure option, which controls whether
    a DHCP client uses address auto-configuration. Because of the potential threat
    of a denial of service attack, the use of RFC2563 is deprecated.</p>"
