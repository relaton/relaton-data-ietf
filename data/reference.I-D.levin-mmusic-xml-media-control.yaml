abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Extensible Markup Language (XML) Schema for
    video fast update in a tightly controlled environment, developed by Microsoft,
    Polycom, Radvision and used by multiple vendors.  This document describes a method
    that has been deployed in Session Initiation Protocol (SIP) based systems for
    over the last three years and being used across real-time interactive applications
    from different vendors in interoperable manner.  New implementations are discouraged
    from using the described method described except for backward compatibility purposes.
    \ New Implementations are required to use the new full intra request command in
    the RTP Control Protocol (RTCP) channel.</p>"
