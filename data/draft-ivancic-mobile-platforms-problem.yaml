abstract:
- language: en
  script: Latn
  content: "<p>This document describes numerous problems associated with deployment
    of multi-homed mobile platforms consisting of multiple networks and traversing
    large geographical areas. The purpose of this document is to provide insight to
    real-world deployment issues and provide information to working groups that are
    addressing many issues related to multi-homing, policy-base routing, route optimization
    and mobile security.</p>"
