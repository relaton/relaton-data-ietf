abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an aggregated BMP Route Monitoring message based
    on the BMP Multi-Peer Header message (draft-liu-grow-bmp- multiple-peer-header).
    It can compress multiple BMP Route Monitoring messages into one aggregated BMP
    Route Monitoring message to reduce the amount of reported BMP Route Monitoring
    messages and reduce the network overhead.</p>"
