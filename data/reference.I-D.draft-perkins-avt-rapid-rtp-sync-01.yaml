abstract:
- language: en
  script: Latn
  content: "<p>This memo outlines how RTP multimedia sessions are synchronised, and
    discusses how rapidly such synchronisation can occur.  We show that most RTP sessions
    can be synchronised immediately, but that the use of video switching MCUs or large
    multicast (SSM) groups can greatly increase the initial synchronisation delay.
    \ This increased delay can be unacceptable to some applications that use layered
    and/or multi- description codecs.  This memo changes to the RTCP timing rules
    to reduce the initial synchronisation delay for SSM sessions.  A new RTP/AVPF
    feedback packet is defined to allow video switching MCUs to request rapid resynchronisation,
    and a new RTP header extension is defined to support rapid synchronisation for
    late joiners.</p>"
