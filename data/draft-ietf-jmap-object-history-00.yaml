abstract:
- language: en
  script: Latn
  content: "<p>The JMAP base protocol (RFC8620) provides methods for synchronizing\n   the current state of data objects between client and server.  This\n   extension adds the ability to retrieve historical versions of\n   objects, including objects that have been destroyed, by extending the\n   standard Foo/get method.</p>"
