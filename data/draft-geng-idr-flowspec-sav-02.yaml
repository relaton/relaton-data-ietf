abstract:
- language: en
  script: Latn
  content: |-
    <p>BGP FlowSpec reuses BGP route to distribute infrastructure and
       propogates traffic flow information with filtering actions.  This
       document specifies a new flow specification called Incoming-
       Interface-Set. Incoming-Interface-Set can be used together with the
       Source Prefix component to disseminate SAV rules.</p>
