abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the problems related to the identical resolution
    of bundle DNS names.  With the emergence of internationalized domain names, two
    names with the same meaning or visual similarity sometimes require the identical
    resolution. Current DNS protocols have not provided such ability to satisfy these
    requirements.</p>"
