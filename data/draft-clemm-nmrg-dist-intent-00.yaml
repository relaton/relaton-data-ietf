abstract:
- language: en
  script: Latn
  content: "<p>This document presents existing definitions of the Intent, Policy,
    and Service Models concepts, analyses their differences and commonalities, and
    how the concepts relate to one another. The document is intended to clarify the
    different concepts and converge towards a common and shared understanding, and
    then use this foundation to guide further definition of valid research and engineering
    problems and their solutions.</p>"
