abstract:
- language: en
  script: Latn
  content: "<p>The Delay-Tolerant Networking Bundle Protocol includes a custody transfer
    mechanism to provide acknowledgements of receipt for particular bundles.  No checksum
    is included in the basic DTN Bundle Protocol, however, so at intermediate hops,
    it is not possible to verify that bundles have been either forwarded or passed
    through convergence layers without error.  Without assurance that a bundle has
    been received without errors, the custody transfer receipt cannot guarantee that
    a correct copy of the bundle has been transferred. This document attempts to address
    the situation by defining new ciphersuites for use within the existing Bundle
    Security Protocol's Payload Integrity Block (formerly called the Payload Security
    Block) to provide error-detection functions regardless of an implementation's
    support for other, more complex, security-providing ciphersuites.  This creates
    the checksum service needed for error- free reliability, but does so at the expense
    of divorcing security concerns from the few new reliability-only ciphersuite definitions
    that are introduced here.  This document lengthily discusses the pros and cons
    of this approach and the existing constraints that combined to drive this design.</p>"
