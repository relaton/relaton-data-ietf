abstract:
- language: en
  script: Latn
  content: <p>This draft describes a new mechanism called "Layer-3 accessible EVPN
    services", which extends the EVPN Service Interfaces in [RFC7432]. This mechanism
    allows Layer-3 network to run between CE and PE, and defines Logical Session Identifier(LSI)
    for traffic isolation.</p>
