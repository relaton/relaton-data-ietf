abstract:
- language: en
  script: Latn
  content: "<p>Dual-Stack Lite is a solution to offer both IPv4 and IPv6 connectivity
    to customers which are addressed only with an IPv6 prefix.  DS-Lite requires to
    pre-configure the DS-Lite Address Family Transition Router tunnel information
    on the Basic Bridging BroadBand element.  In many networks, the customer profile
    information may be stored in AAA servers while client configurations are mainly
    provided through DHC protocol.  This document specifies a new RADIUS attribute
    to carry Dual-Stack Lite Address Family Transition Router Tunnel name; the RADIUS
    attribute is defined based on the equivalent DHCPv6 OPTION_AFTR_NAME option.  This
    RADIUS attribute is meant to be used between the RADIUS Server and the NAS, it
    is not intended to be used directly between the B4 element and the RADIUS Server.</p>"
