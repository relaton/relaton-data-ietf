abstract:
- language: en
  script: Latn
  content: "<p>SNAP (Simple Native Archive Protocol) defines a minimal, self-\n   describing backup object encoded as a single JSON document, modeled\n   in YANG [RFC7950] and encoded per [RFC7951].  A SNAP object contains\n   a manifest of files with per-file cryptographic hashes, integrity-\n   verified metadata, and a compressed binary payload -- all within one\n   atomic, transport-agnostic JSON document.  Any agent capable of\n   parsing JSON and applying standard decompression can produce or\n   restore a SNAP backup without proprietary tooling, side-channel\n   metadata, or multi-phase handshakes.\n\n   This document defines the YANG module \"snap\", its JSON encoding,\n   integrity verification procedure, bindings to common transports, and\n   its role as the atomic transport substrate for the Multi-Vantage Path\n   State (MVPS) family of Internet-Drafts.  When a SNAP Object carries\n   an MVPS Bundle [I-D.melegassi-ippm-mvps-bundle], the canonical-form\n   determinism of SNAP (Theorem 1 of this document) composes with the\n   MVPS Architecture axioms A1..A5 [I-D.melegassi-iab-mvps-architecture]\n   to inherit the full coherence algebra of [MVPS-v4] (Theorems 1, 2, 3,\n   3', 4, 5, 9 and Stein's Lemma [Stein52] [CoverThomas2006]) without\n   alteration.</p>"
