abstract:
- language: en
  script: Latn
  content: "<p>RFC3484 defines source and destination address selection algorithms
    that are commonly deployed in current popular OSs. Meanwhile, there is a possibility
    to provide multiple addresses in one physical network. In such a multi-prefix
    environment, end-hosts could encounter some troubles in the communication because
    of default use of the RFC3484 mechanism. Therefore, extending various rules beyond
    the default use of the RFC3484 mechanism should be considered. We propose a concept
    of distribution of address selection policy to an end-host as a solution to these
    possible problems. In this document, we describe detailed requirements of address
    selection policy distribution.</p>"
