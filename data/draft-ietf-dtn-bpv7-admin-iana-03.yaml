abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates RFC 9171 to clarify that a Bundle Protocol
       Version 7 agent is intended to use an IANA sub-registry for
       Administrative Record types.  It also makes a code point reservation
       for private or experimental use.</p>
