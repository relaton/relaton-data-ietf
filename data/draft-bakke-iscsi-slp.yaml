abstract:
- language: en
  script: Latn
  content: "<p>The iSCSI protocol provides a way for hosts to access SCSI devices\nover an IP network.  This document defines the use of the Service\nLocation Protocol (SLP) by iSCSI hosts, devices, and name services,\nalong with the SLP service type templates that describe the services\nthey provide.</p>"
