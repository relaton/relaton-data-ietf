- language: en
  script: Latn
  content: "<p>This document describes the implementation of Bridged Line Appearance
    (BLA) feature based on Session Initiation Protocol (SIP). The BLA feature is commonly
    offered in the IP Centrex services and IP-PBX offerings. This feature is likely
    to be implemented on SIP IP telephones and SIP feature servers used in a business
    environment.</p>"
