abstract:
- language: en
  script: Latn
  content: <p>The Session Initiation Protocol (SIP) "Caller Preferences" extension
    defined in RFC 3840 provides a mechanism that allows a SIP message to convey information
    relating to the originator's capabilities.  This document makes it possible for
    SIP proxies to convey similar information, by extending the rr-param rule defined
    in RFC 3261, so that the header field parameter can be used to convey feature
    tags that indicate features supported by the proxy.</p>
