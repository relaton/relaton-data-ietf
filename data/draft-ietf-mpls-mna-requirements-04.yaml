abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for MPLS network actions which
    affect the forwarding or other processing of MPLS packets. These requirements
    are derived from a number of proposals for additions to the MPLS label stack to
    allow forwarding or other processing decisions to be made, either by a transit
    or terminating LSR (i.e. the LER).</p>"
