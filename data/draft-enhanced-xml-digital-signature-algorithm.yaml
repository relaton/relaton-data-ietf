title:
- language: en
  script: Latn
  content: Enhanced XML Digital Signature Algorithm to Mitigate  Wrapping Attacks
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-enhanced-xml-digital-signature-algorithm-01
