abstract:
- language: en
  script: Latn
  content: "<p>This document a method for offering data origin authentication and
    integrity protection of HTTP requests. To convey the relevant data items in the
    request a JSON-based encapsulation is used and the JSON Web Signature (JWS) technique
    is re-used. JWS offers integrity protection using symmetric as well as asymmetric
    cryptography.</p>"
