abstract:
- language: en
  script: Latn
  content: "<p>This document defines MP-BGP procedures that allow BGP speakers to
    exchange VPN route interest information. This information can be used to control
    VPN route distribution at the granularity of address prefix, which is applicable
    in the context of Virtual Subnet and may also be applicable in other BGP/MPLS
    IP VPN environments.</p>"
