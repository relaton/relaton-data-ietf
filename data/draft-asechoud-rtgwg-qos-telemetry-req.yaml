- language: en
  script: Latn
  content: "<p>This document discusses QoS requirements for data model based network
    telemetry. QoS configuration and operational models have been defined as part
    of [I-D.asechoud-rtgwg-qos-model] and [I-D.asechoud-rtgwg-qos-oper-model] respectively.
    This document describes the requirement to extend the models to support QoS Telemetry.</p>"
