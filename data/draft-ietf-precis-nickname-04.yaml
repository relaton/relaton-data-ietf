  content: "<p>This document describes how to prepare and compare Unicode strings
    representing nicknames, primarily for use within textual chatrooms. This profile
    is intended to be used by messaging and text conferencing technologies such as
    the Extensible Messaging and Presence Protocol (XMPP), the Message Session Relay
    Protocol (MSRP), and Centralized Conferencing (XCON).</p>"
