abstract:
- language: en
  script: Latn
  content: <p>This document specifies an extension to Transport Layer Security (TLS)
    for carrying application data which is suitable for delayed integrity protection
    and does not require privacy protection.  In particular we describe how to use
    this extension to reduce the number of round trips needed for application-layer
    authentication, specifically Simple Authentication (SASL), and through it, Generic
    Security Services (GSS-API).  The use of this extension to optimize SASL/GSS-API
    authentication is termed "TLS/SA".  This extension can also be used to optimize
    application protocols.</p>
