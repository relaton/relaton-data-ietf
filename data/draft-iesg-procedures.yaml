  script: Latn
  content: "<p>This memo describes the current operating procedures of the Internet
    Engineering Steering Group (IESG), a management function of the Internet Engineering
    Task Force (IETF). This memo is not intended to become an RFC, but provides information
    to the Internet community, for which the internet-drafts mechanism is a convenient
    distribution veichle Discussion of this memo is encouraged on the POISED mailing
    list &lt;poised@lists.tislab.com&gt;</p>"
