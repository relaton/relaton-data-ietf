  script: Latn
  content: "<p>This document describes the usage of the 'image' media type and registers
    it with IANA as a top-level media type for the Session Description Protocol (SDP).
    \ This media type is primarily used by SDP to negotiate and establish T.38 media
    streams.  [STANDARDS-TRACK]</p>"
