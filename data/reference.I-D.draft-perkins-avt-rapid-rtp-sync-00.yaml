abstract:
- language: en
  script: Latn
  content: "<p>This memo outlines how RTP multimedia sessions are synchronised, and
    discusses how rapidly such synchronisation can occur.  It is shown that unicast
    sessions can be synchronised immediately in most cases. Multicast groups have
    longer synchronisation delay.  A modification to the RTCP timing rules is suggested
    to improve synchronisation time for SSM senders.  A new RTP/AVPF feedback packet
    is defined to improve general synchronisation times.</p>"
