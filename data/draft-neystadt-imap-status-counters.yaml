abstract:
- language: en
  script: Latn
  content: "<p>The STATUS-COUNTERS extends IMAP4rev1’s STATUS command. This extension
    adds the following functionality: Enable MUA to get mailbox counters per groups
    of messages, grouped according to the value of Message-Context header field. For
    example, the MUA can find out that the Inbox contains 5 unseen fax messages.</p>"
