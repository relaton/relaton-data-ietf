abstract:
- language: en
  script: Latn
  content: "<p>The STATUS-COUNTERS extends IMAP4rev1’s STATUS command. This \nextension
    adds the following functionality: \nEnable MUA to get mailbox counters per groups
    of messages, grouped \naccording to the value of Message-Context header field.
    For \nexample, the MUA can find out that the Inbox contains 5 unseen fax \nmessages.</p>"
