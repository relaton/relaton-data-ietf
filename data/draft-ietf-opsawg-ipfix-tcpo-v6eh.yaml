abstract:
- language: en
  script: Latn
  content: "<p>This document specifies new IP Flow Information Export (IPFIX) Information
    Elements (IEs) to solve issues with existing ipv6ExtensionHeaders and tcpOptions
    IPFIX IEs, especially the ability to export any observed IPv6 extension headers
    or TCP options.</p>"
