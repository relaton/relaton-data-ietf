abstract:
- language: en
  script: Latn
  content: "<p>This memo defines two new Multi Topology Routing Identifiers (MT IDs)
    in Intermediate System to Intermediate System (M-ISIS, [RFC5120]). These new M-ISIS
    topologies are meant to convey routing information which is restricted to IPv4-mapped
    IPv6 addresses [I-D.ietf-behave-address-format].  The ultimate goal of instantiating
    dedicated topologies for IPv4-mapped IPv6 is to isolate the native IPv6 routing
    table from the IPv4 and to prevent from being overloaded by the IPv4-mapped one.
    \ This isolation is motivated also from an operational perspective to enforce
    specific engineering policies for each topology.</p>"
