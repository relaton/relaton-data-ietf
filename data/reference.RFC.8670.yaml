abstract:
- language: en
  script: Latn
  content: "<p>This document describes the motivation for, and benefits of, applying
    Segment Routing (SR) in BGP-based large-scale data centers. It describes the design
    to deploy SR in those data centers for both the MPLS and IPv6 data planes.</p>"
