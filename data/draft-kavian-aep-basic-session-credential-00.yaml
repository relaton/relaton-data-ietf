abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a Basic session-credential extension for the
       Agent Enrollment Protocol (AEP).  The extension lets an AEP Service
       issue an HTTP Basic credential through the AEP Grant command for
       deployments that already integrate with Basic authentication
       middleware.</p>
