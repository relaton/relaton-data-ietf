abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Extended Generic Security Service Application
    Program Interface (GSS-API) Negotiation Mechanism (NegoEx).  NegoEx is a pseudo-security
    mechanism that logically extends the SPNEGO protocol as defined in RFC4178.  The
    NegoEx protocol itself is a security mechanism negotiated by SPNEGO.  When selected
    as the common mechanism, NegoEx OPTIONALLY adds a pair of meta-data messages for
    each negotiated security mechanism.  The meta-data exchange allows security mechanisms
    to exchange auxiliary information such as trust configurations, thus NegoEx provides
    additional flexibility beyond the negotiation capabilities based on exchanging
    object identifiers offered by SPNEGO.  NegoEx preserves the optimistic token semantics
    of SPNEGO and applies that recursively.  Consequently a context establishment
    mechanism token can be included in the initial NegoEx message, and NegoEx does
    not require an extra round-trip when the initiator's optimistic token is accepted
    by the target.  Similar to SPNEGO, NegoEx defines a few new GSS-API extensions
    that a security mechanism MUST support in order to be negotiated by NegoEx. This
    document defines these GSS-API extensions.  Unlike SPNEGO however, NegoEx defines
    its own way for signing the protocol messages in order to protect the protocol
    negotiation.  The NegoEx message signing or verification can occur before the
    security context for the negotiated real security mechanism is fully established.</p>"
