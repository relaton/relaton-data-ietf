abstract:
- language: en
  script: Latn
  content: <p>It is possible for DHCP clients to attempt to update the same DNS FQDN
    or attempt to update a DNS FQDN that has been added to the DNS for another purpose
    as they obtain DHCP leases. Whether the DHCP server or the clients themselves
    perform the DNS updates, conflicts can arise. To resolve such conflicts, [1] proposes
    storing client identifiers in the DNS to unambiguously associate domain names
    with the DHCP clients to which they refer. This memo defines a distinct RR type
    for this purpose for use by DHCP clients and servers, the "DHCID" RR.</p>
