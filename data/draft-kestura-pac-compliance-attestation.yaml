abstract:
- language: en
  script: Latn
  content: "<p>Organizations increasingly enforce regulatory and security requirements
    using policy-as-code (PaC) engines integrated into continuous integration and
    delivery (CI/CD) pipelines. The evidence these engines produce, that is, the record
    of which policies were evaluated, against what inputs, and with what outcome,
    is typically emitted in vendor-specific, non-portable formats. This impairs auditability,
    cross-tool aggregation, and independent verification. This document analyzes the
    problem and describes an interoperable, machine-readable attestation format for
    PaC compliance evidence. It is informational and does not define an IETF standard,
    nor does it establish a new IANA registry.</p>"
