abstract:
- language: en
  script: Latn
  content: "<p>Path MTU discovery has turned out to be a thorny problem that has haunted
    the Internet community for decades. Lately there has been some work both at the
    transport layer and at the network layer. This memo lists the solutions the author
    is aware of from the perspective of the network layer.</p>"
