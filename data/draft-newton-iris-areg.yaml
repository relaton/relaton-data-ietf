abstract:
- language: en
  script: Latn
  content: "<p>This document describes an IRIS registry namespace and schema for\nregistered Internet address information.  The schema extends the\nnecessary query and result operations of IRIS\n(draft-newton-iris-00.txt) to provide the functional information\nservice needs for syntaxes and results used by Internet address\nregistries.</p>"
