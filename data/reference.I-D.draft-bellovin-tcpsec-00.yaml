abstract:
- language: en
  script: Latn
  content: "<p>The TCP-MD5 option, commonly used to secure BGP sessions between routers,
    has many serious deficiencies. We present here justifications for designing a
    new, more capable version of that option; we also discuss some of the design criteria
    for one.</p>"
