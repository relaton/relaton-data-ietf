abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Segment Routing (SR) Policy extension for
    schedule (called SR-Schedule). It applies to both Segment Routing over IPv6 (SRv6)
    and SR-MPLS. This document specifies the framework of SR policy schedule including
    the SR-Schedule definition, acquisition, computation, enforcement, and the handling
    behaviors on the headend.</p>"
