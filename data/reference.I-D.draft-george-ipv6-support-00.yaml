abstract:
- language: en
  script: Latn
  content: "<p>Given the global lack of available IPv4 space, and limitations in IPv4
    extension and transition technologies, this document recommends that IETF formally
    require protocol work to be IP version agnostic or to explicitly include support
    for IPv6, with some exceptions.</p>"
