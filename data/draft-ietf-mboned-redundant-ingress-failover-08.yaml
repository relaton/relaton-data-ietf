abstract:
- language: en
  script: Latn
  content: |-
    <p>This document analyzes the problem of failover between redundant
       ingress routers in multicast domains.  It describes cold, warm, and
       hot standby modes, detailing their advantages, limitations, and
       deployment considerations to help operators select appropriate
       mechanisms.</p>
