abstract:
- language: en
  script: Latn
  content: "<p>The requirements of computing interconnection are increasingly attracting
    the attention of service providers. They have been thinking about how to leverage
    their network advantages to provide integrated networking and computing services.
    This document describes some scenarios of using SRv6 based network technology
    which can partially meet the service requirement of computing interconnection.</p>"
