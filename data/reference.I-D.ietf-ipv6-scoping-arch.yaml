- language: en
  script: Latn
  content: "<p>This document specifies the architectural characteristics, expected
    behavior, textual representation, and usage of IPv6 addresses of different scopes.
    According to a decision in the IPv6 working group, this document intentionally
    avoids using the syntax and usage of unicast site-local addresses.</p>"
