abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Web 7.0 Verifiable Trust Circles (VTCs), a\n   generalized mechanism for expressing verifiable multi-party\n   membership, belonging, and trust relationships using the W3C\n   Verifiable Credentials (VC) Data Model 2.0 [W3C.VC-DATA-MODEL] and VC\n   Data Integrity Proof Sets [W3C.VC-DATA-INTEGRITY].  VTCs extend the\n   Partof Architecture Reference Model (PARM) to provide a universal\n   credential pattern that subsumes prior pairwise constructs\n   (Personhood Credentials (PHCs) and Verifiable Relationship\n   Credentials (VRCs)) and additionally supports voting-based decision\n   making, meeting requests, task forces, and digital societies.</p>"
