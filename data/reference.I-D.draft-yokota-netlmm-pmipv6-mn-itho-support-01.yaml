abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 supports a handoff between different access technologies,
    by which the assigned IP address is preserved regardless of the access technology
    type.  From the perspective of the mobile node, this involves the change of the
    network interfaces, through which the IP address is assigned and the IP session
    is established.  Some implementations, however, do not assume this interface switching
    in the middle of the session and it could cause a disconnection by the event of
    unavailability of the current interface; hence it is not guaranteed to be able
    to maintain the IP session simply by assigning the same IP address to the new
    interface. This document analyzes the handling of the network interfaces on the
    mobile node and presents several measures to avoid a disconnection due to the
    interface switching.</p>"
