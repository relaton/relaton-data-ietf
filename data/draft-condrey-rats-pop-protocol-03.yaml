abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Proof of Process (PoP) Evidence\n   Framework, a specialized profile of Remote Attestation Procedures\n   (RATS) [RFC9334] designed to validate the provenance of effort in\n   digital authorship.  Unlike traditional provenance, which tracks file\n   custody, PoP attests to the continuous physical process of creation.\n\n   The protocol defines a cryptographic mechanism for generating\n   Evidence Packets utilizing Proof of Biological Space-Time (PoBST) to\n   enforce temporal monotonicity and Cross-Domain Constraint\n   Entanglement (CDCE) to bind behavioral entropy (human jitter) and\n   physical die thermodynamics to the document state.  Technical\n   specifications for wire formats, verifiable delay functions, and\n   hardware-anchored trust are provided.</p>"
