abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to the ACME protocol [RFC8555]
    that enables ACME servers to use the public key authentication protocol to verify
    that the client has control of the private key corresponding to the public key.
    This document also defines several application methods for binding identity information
    to public keys.</p>"
