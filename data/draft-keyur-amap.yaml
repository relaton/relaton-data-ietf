abstract:
- language: en
  script: Latn
  content: "<p>This document describes a new multicast signaling protocol for \nsolving
    the 'last-mile connectivity' problem for multicast. This \nprotocol is called
    Automatic Multicast Access Protocol (AMAP). It \nis intended to facilitate an
    endnode that resides in a portion of \nthe Internet infrastructure without multicast
    support, or whose OS \ndoes not support IGMPv3 (SSM stype groups).</p>"
