- language: en
  script: Latn
  content: "<p>This document describes a serialiation of the RFC8366 voucher format
    to a JSON format is then signed using the JSON Object Signing and Encryption mechanism
    described in RFC7515. In addition to explaining how the format is created, MIME
    types are registered and examples are provided.</p>"
