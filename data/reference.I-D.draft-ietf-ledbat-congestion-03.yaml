abstract:
- language: en
  script: Latn
  content: "<p>LEDBAT is an experimental delay-based congestion control algorithm
    that attempts to utilize the available bandwidth on an end-to-end path while limiting
    the consequent increase in queueing delay on the path.  LEDBAT uses changes in
    one-way delay measurements to limit congestion induced in the network by the LEDBAT
    flow.  LEDBAT is designed largely for use by background bulk-transfer applications;
    it is designed to be no more aggressive than TCP congestion control and yields
    in the presence of competing TCP flows, thus reducing interference with the network
    performance of the competing flows.</p>"
