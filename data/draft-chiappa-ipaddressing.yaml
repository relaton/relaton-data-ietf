abstract:
- language: en
  script: Latn
  content: "<p>The packet layer of the IP architecture is about to enter a period
    of stress caused by deficiencies in the IP address. This stress is caused by a
    number of inter-related problems. This note describes these problems, lists some
    suggested solutions, and discusses pros and cons of each of those solutions.</p>"
