- language: en
  script: Latn
  content: "<p>This document defines a new SIP header field, Feature-Caps, that can
    be used by SIP entities to indicate support of features and capabilities, in cases
    where the Contact header field contains a URI that does not represent the SIP
    entity that wants to indicate support of its features and capabilities.</p>"
