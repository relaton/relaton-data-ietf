abstract:
- language: en
  script: Latn
  content: "<p>There is a clear need to provide and deploy interoperable calendaring
    and scheduling services for the Internet. Current group scheduling and Personal
    Information Management (PIM) products are being extended for use across the Internet,
    today, in proprietary ways. This memo has been defined to provide the definition
    of a common format for openly exchanging calendaring and scheduling information
    across the Internet.</p>"
