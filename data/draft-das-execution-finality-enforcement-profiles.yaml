title:
- language: en
  script: Latn
  content: 'Execution Finality at External-Effect Boundaries: Enforcement Profiles for 6G, AI-Native RAN, RF, ISAC, Accelerated Compute, Devices, and Autonomous Systems'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-das-execution-finality-enforcement-profiles-01
