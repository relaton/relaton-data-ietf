- language: en
  script: Latn
  content: "<p>This document describes a framework for using AAA backend protocols
    (e.g., RADIUS, Diameter) between home agents and AAA servers for centralizing
    Mobile IPv6 service management. Implementation of this framework requires definition
    of a new AAA application on the aforementioned protocols.</p>"
