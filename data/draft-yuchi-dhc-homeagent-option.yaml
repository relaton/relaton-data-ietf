abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new home agent option for the Dynamic Host
    Configuration Protocol for IPv6 (DHCPv6). To assist with rapid handovers the option
    allows a mobile node (DHCPv6 client) to acquire a list of home agent addresses
    from a DHCPv6 server.</p>"
