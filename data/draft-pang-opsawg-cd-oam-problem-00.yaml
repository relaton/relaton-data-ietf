abstract:
- language: en
  script: Latn
  content: "<p>As network service deployments increasingly span multiple administrative
    domains—such as operator edge clouds, tenant datacenters, multi-cloud environments,
    and managed security services—operators lack standardized OAM (Operations, Administration,
    and Maintenance) mechanisms to localize faults across these trust boundaries.
    Existing OAM mechanisms, such as RFC 9516 for Service Function Chaining (SFC),
    typically assume all network elements reside within a single administrative domain.
    This document describes the generic problem space, typical use cases, and gaps
    in existing standards for cross-domain OAM across trust boundaries, and outlines
    the requirements for a cross-domain OAM proxy mechanism. This document is intended
    to provide a problem baseline and requirement definitions for the OPSAWG and the
    broader operations community; it does not specify protocols or data models.</p>"
