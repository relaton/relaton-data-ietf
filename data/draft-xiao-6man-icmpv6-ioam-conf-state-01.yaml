abstract:
- language: en
  script: Latn
  content: "<p>This document describes the ICMPv6 IOAM Echo functionality, which uses
    the ICMPv6 IOAM Echo Request/Reply messages, allowing the IOAM encapsulating node
    to discover the enabled IOAM capabilities of each IOAM transit and decapsulating
    node. This document updates RFC 4884.</p>"
