abstract:
- language: en
  script: Latn
  content: "<p>This document describes some specifics that apply when Signaling Compression
    (SigComp) is applied to the Session Initiation Protocol (SIP), such as default
    minimum values of SigComp parameters, compartment and state management, and a
    few issues on SigComp over TCP. Any implementation of SigComp for use with SIP
    must conform to this document, in addition to SigComp and support of the SIP and
    Session Description Protocol (SDP) static dictionary.</p>"
