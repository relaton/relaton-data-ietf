abstract:
- language: en
  script: Latn
  content: "<p>This draft defines a method for optimized MAC Address Withdrawal in
    VPLS model 3 [RFC4664] supporting qualified learning [RFC4762]. Based on the MAC
    Address Withdrawal procedures defined in [RFC4762] and [I-D.ietf-l2vpn-vpls-ldp-mac-opt],
    some extensions are made to enable a PE device to remove only the MAC addresses
    that belong to MAC address space affected by topology change and need to be relearned.</p>"
