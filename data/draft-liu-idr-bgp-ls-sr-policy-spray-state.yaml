abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension to BGP-LS that allows a headend
    node, when reporting SR Policy state information via BGP-LS, to carry a new state
    flag at the candidate path level. This flag indicates whether the candidate path
    is currently being used for packet spraying. The information can be consumed by
    external controllers for path optimization, operations management or other purposes.</p>"
