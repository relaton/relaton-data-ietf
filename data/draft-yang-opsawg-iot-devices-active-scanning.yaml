- language: en
  script: Latn
  content: "<p>This draft extends MUD [RFC8520] model for the active scanning during
    the end host device on-boarding. The according features include TCP/ UDP port
    scanning, weak password detection, mandatory and hazardous services detection,
    etc, which can help administrator to discover system security vulnerabilities
    in advance.</p>"
