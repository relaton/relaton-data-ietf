abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new verifiable data structure type for COSE
    Signed Merkle Tree Proofs specifically designed for transaction ledgers produced
    via Trusted Execution Environments (TEEs), such as the Confidential Consortium
    Framework ([CCF]) to provide stronger tamper-evidence guarantees. Discussion Venues
    This note is to be removed before publishing as an RFC. Source for this draft
    and an issue tracker can be found at https://github.com/ietf-scitt/draft-birkholz-cose-cometre-ccf-
    profile.</p>"
