abstract:
- language: en
  script: Latn
  content: "<p>We are facing the exhaustion of the IANA IPv4 free IP address pool.
    Unfortunately, IPv6 is not yet deployed widely enough to fully replace IPv4, and
    it is unrealistic to expect that this is going to change before we run out of
    IPv4 addresses.  Letting hosts seamlessly communicate in an IPv4-world without
    assigning a unique globally routable IPv4 address to each of them is a challenging
    problem, for which many solutions have been proposed.  Some prominent ones involve
    carrier-grade-NATs (CGN), which have been shown to provide an inadequate experience
    to IPv4 users and enshrine a walled garden in the core of the provider.  Instead,
    we propose using specialized NATs at the consumer premises equipment (CPE) edge
    which treat some of the port number bits as part of an extended IPv4 address.</p>"
