abstract:
- language: en
  script: Latn
  content: "<p>Compositing the post-quantum FN-DSA signature with traditional\n   signature algorithms provides protection against potential breaks in\n   either component.  This document specifies how such a composite\n   signature can be used for authentication in TLS 1.3.  The selection\n   of composite algorithms is intentionally chosen to strictly mirror\n   the composite strategies for ML-DSA.  This alignment provides two\n   distinct and predictable security tiers for hybrid signatures,\n   ensuring a consistent approach to post-quantum transition across the\n   ecosystem.</p>"
