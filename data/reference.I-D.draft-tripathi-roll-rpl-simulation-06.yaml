abstract:
- language: en
  script: Latn
  content: "<p>This document presents a performance evaluation of the Routing Protocol
    for Low power and Lossy Networks (RPL) for a small outdoor and for a large scale
    smart meter network.  Detailed simulations are carried out to produce several
    routing performance metrics using a set of real-life scenarios.</p>"
