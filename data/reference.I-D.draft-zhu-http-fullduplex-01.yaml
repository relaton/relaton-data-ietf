abstract:
- language: en
  script: Latn
  content: "<p>Full-duplex HTTP follows the basic HTTP request-response semantics
    but also allows the server to send the response to the client at the same time
    that the client is transmitting the request to the server. Requirements for Full-duplex
    HTTP are under-specified in the existing HTTP specification, and this memo intends
    to clarify the requirements for implementing Full-duplex HTTP under the standard
    HTTP protocol.</p>"
