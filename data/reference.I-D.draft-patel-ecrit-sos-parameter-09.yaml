abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new Session Initiation Protocol (SIP) Uniform
    Resource Identifier (URI) parameter intended for marking SIP registration requests
    related to emergency services.  The URI parameter is extensible to allow future
    values to be defined if required by other use cases that require specific SIP
    registrations to be distinctly identified.  The usage of this new URI parameter
    complements the usage of the Service Uniform Resource Name (URN) and is not intended
    to replace it.</p>"
