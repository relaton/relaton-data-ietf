abstract:
- language: en
  script: Latn
  content: "<p>This document defines a verifier-side profile for accepting agent\n   identity.  A verifier accepts an Agent only when an authority\n   statement, holder-of-key proof, accepted TLS session, freshness\n   state, any required attestation result, and verifier-local policy all\n   describe the same intended interaction.\n\n   The profile does not define a TLS extension, attestation evidence\n   format, identity provider, wallet format, registry, control plane,\n   gateway, or application protocol.  It composes existing mechanisms\n   and defines the fail-closed acceptance rule between them.</p>"
