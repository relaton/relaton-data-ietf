abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension to RELOAD to support direct response
    and relay peer routing modes.  RELOAD recommends symmetric recursive routing for
    routing messages.  The new extensions provide a shorter route for responses and
    describes the potential cases where these extensions can be used.</p>"
