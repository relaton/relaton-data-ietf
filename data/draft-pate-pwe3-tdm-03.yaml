abstract:
- language: en
  script: Latn
  content: "<p>This document describes the service-specific implementation and requirements
    for Pseudo-Wires Emulation Edge-to-Edge (PWE3) of TDM circuits. It discusses the
    emulation of circuits (such as T1, E1, T3 and E3) over packet networks using IP,
    L2TP or MPLS.</p>"
