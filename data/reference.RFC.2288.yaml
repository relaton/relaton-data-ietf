abstract:
- language: en
  script: Latn
  content: "<p>This document discusses how three major bibliographic identifiers (the
    ISBN, ISSN and SICI) can be supported within the URN framework and the currently
    proposed syntax for URNs.  This memo provides information for the Internet community.
    \ It does not specify an Internet standard of any kind.</p>"
