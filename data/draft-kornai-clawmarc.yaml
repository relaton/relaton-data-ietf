abstract:
- language: en
  script: Latn
  content: "<p>This document specifies clawmarc, a fixed-size, 4096-byte catalog\n   card for describing digital artefacts in content-addressed and\n   replicated catalogs.  A clawmarc card binds to the bytes of an\n   artefact, carries compact human-readable descriptive text and an\n   optional machine-readable search payload, records retrieval hints,\n   and is signed by its issuer.  The format is intended to improve\n   interoperability among independent catalog producers and consumers\n   without requiring any particular storage backend, catalog governance\n   model, or search engine.  This document is an Independent Stream\n   Informational specification; it does not represent IETF consensus and\n   does not define an Internet standard.</p>"
