abstract:
- language: en
  script: Latn
  content: "<p>Whenever IETF decides to enter into a liaison relationship with another
    organization, such as a Standards Development Organization (SDO), a consortium,
    or an industrial forum, a liaison manager is appointed. The procedures used by
    the IAB to establish and maintain liaison relationships between the IETF and other
    organizations are described in RFC 4052 [RFC4052]. This document gives guidelines
    on expectations, tasks, responsibilities and mandate of the liaison managers.</p>"
