abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a qlog extension for Happy Eyeballs v3 (HEv3),
    enabling logging of dual-stack and multi-protocol connection racing behavior.
    It defines a dedicated event schema, event names, and data structures that capture
    DNS resolution timing, SVCB/HTTPS service discovery, candidate sorting and grouping,
    connection attempt scheduling and racing, NAT64 prefix discovery, success/failure
    outcomes, and summary metrics.</p>"
