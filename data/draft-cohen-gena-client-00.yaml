abstract:
- language: en
  script: Latn
  content: "<p>This document provides for the ability to send and receive notifications
    using HTTP over TCP/IP and administratively scoped unreliable multicast UDP. Provisions
    are made for the use of intermediary arbiters, called subscription arbiters, which
    handle routing notifications to their intended destination.</p>"
