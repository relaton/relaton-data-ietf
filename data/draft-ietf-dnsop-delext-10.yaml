abstract:
- language: en
  script: Latn
  content: "<p>The Domain Name System (DNS) protocol permits Delegation Signer (DS)
    records at delegation points. This document specifies modifications to the DNS
    protocol to permit a range of Resource Record types at delegation points. These
    modifications are designed to maintain compatibility with existing DNS resolution
    mechanisms and provide a secure method for processing these records at delegation
    points. This document updates RFCs 1034, 4035, 6672, 6840, 6895 and 9824.</p>"
