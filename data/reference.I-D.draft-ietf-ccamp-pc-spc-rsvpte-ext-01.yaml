abstract:
- language: en
  script: Latn
  content: <p>We would like to dedicate this work to our friend and colleague Dino
    Bramanti, who passed away at the early age of 38.  Dino has been involved in this
    work since its beginning.  In a transport network scenario, where Data Plane connections
    controlled either by GMPLS Control Plane (Soft Permanent Connections - SPC) or
    by Management System (Permanent Connections - PC) may independently coexist, the
    ability of transforming an existing PC into a SPC and vice versa - without actually
    affecting Data Plane traffic being carried over it - is a requirement.  See draft
    "draft-ietf-ccamp-pc-and-reqs-04.txt [1].  This memo provides a minor extension
    to RSVP-TE [RFC2205],[RFC3471],[RFC3473],[RFC4872] signaling protocol, within
    GMPLS architecture, to enable such connection ownership transfer and describes
    the proposed procedures. Failure conductions and subsequent roll back are also
    illustrated taking into account that an handover failure must not impact the already
    established data plane connections.</p>
