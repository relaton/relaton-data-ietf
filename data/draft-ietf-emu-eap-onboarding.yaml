abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method by which an unconfigured device can\n   use EAP-TLS to join a network on which further device onboarding,\n   network attestation or other remediation can be done.  While RFC 5216\n   supports EAP-TLS without a client certificate, that document defines\n   no method by which unauthenticated EAP-TLS can be used.  This draft\n   addresses that issue.</p>"
