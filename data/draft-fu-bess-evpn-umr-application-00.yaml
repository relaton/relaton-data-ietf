abstract:
- language: en
  script: Latn
  content: "<p>This document describes an application scenario that how unknown MAC-
    route(UMR) is used in the EVPN network. In particular, this document describes
    how MAC address route and UMR route are advertised on DC's GW or NVE. This document
    also describes the soloution that MAC mobility issue due to the lack of advertisement
    of specific MAC routes. However, some incremental work is required, which will
    be covered in a separate document.</p>"
