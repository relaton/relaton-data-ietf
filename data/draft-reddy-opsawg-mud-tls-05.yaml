abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo extends Manufacturer Usage Description (MUD) to incorporate
       (D)TLS profile parameters.  This allows a network element to identify
       unexpected (D)TLS usage, which can indicate the presence of
       unauthorized software or malware on an endpoint.</p>
