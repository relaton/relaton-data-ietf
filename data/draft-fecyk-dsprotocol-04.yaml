abstract:
- language: en
  script: Latn
  content: "<p>This document describes a proposed standard for identifying host computer
    systems designated as Simple Mail Transfer Protocol (SMTP) clients for an Internet
    domain or host through Domain Name System (DNS). This identification allows SMTP
    servers to verify if a connecting client is allowed to make outgoing SMTP connections
    on behalf of the client's domain.</p>"
