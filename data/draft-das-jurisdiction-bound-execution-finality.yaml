title:
- language: en
  script: Latn
  content: 'Authorized Here, Not Authorized There: Jurisdiction-Bound Execution Finality for Cross-Border and Sovereign Systems'
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-das-jurisdiction-bound-execution-finality-00
