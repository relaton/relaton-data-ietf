abstract:
- language: en
  script: Latn
  content: "<p>This document describes an optional extensions to the TRILL protocol.
    The extensions uses Intermediate System to Intermediate Systems (IS-IS) as the
    control plane, to support multiple topologies (MT) within the same TRILL protocol
    instance of IS-IS.  It describes how to run Multiple Independent TRILL topologies,
    within a single IS-IS domain.</p>"
