abstract:
- language: en
  script: Latn
  content: "<p>The Atom and APP specifications specify simple uses of cryptography\nto sign and encrypt their documents.  Each document is processed\ncompletely, and in isolation.  This document specifies additional\nuses that enable selective protection or encryption of content, and\nallow a \"trust path\" to be created across \"atom:link\" elements.</p>"
