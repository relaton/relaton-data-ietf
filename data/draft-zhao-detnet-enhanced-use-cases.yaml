- language: en
  script: Latn
  content: "<p>This document describes use cases and network requirements for scaling
    deterministic networks which is not covered in RFC8578, such as industrial internet,
    high experience video, intelligent computing, and ISAC-enabled smart factory and
    outlines the common properties implied by these use cases.</p>"
