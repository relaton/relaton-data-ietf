  content: |-
    <p>The Point-to-Point Protocol (PPP) [RFC-1661] provides a standard
       method for transporting multi-protocol datagrams over point-to-point
       links.  This document describes the use of PPP over Synchronous Opti-
       cal Network (SONET) and Synchronous Digital Hierarchy (SDH) circuits.</p>
