abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to MPLS BDI packet to form a new
    type of OAM packet BNM(Backward Notify Message) , this BNM packet will not only
    have the function of informing source MEP about existing fault in the back of
    path like MPLS BDI packet, but also it may response or feedback to performance
    and test aspect.  And these response or fault indication information will be encapsulated
    in BNM packet by the way of TLV packet.  So it may decrease the number of OAM
    type and keep compatibility with MPLS network. on the other hand, this encapsulating
    these feedback or response information by the way of TLV packet will be easy to
    extend OAM function to operate an MPLS Transport profile(MPLS-TP) label switched
    path (LSP).</p>"
