abstract:
- language: en
  script: Latn
  content: "<p>This document lists the design principles, scope, and requirements
    for the Electronic Commerce Modeling Language (ECML) version 2 specification.
    It includes requirements as they relate to Extensible Markup Language (XML) syntax,
