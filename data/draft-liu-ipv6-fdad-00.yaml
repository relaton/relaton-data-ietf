- language: en
  script: Latn
  content: "<p>This document proposes an efficient method to speed the address auto-
    configuration and Duplicate Address Detection (DAD) in IPv6 network and thus greatly
    decrease the time spend on the address configuration and DAD. This is achieved
    by modifing the host and router's behaviour and related IPv6 messages.</p>"
