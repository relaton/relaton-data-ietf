abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines optional TLVs which are carried in Simple Two-
       way Active Measurement Protocol (STAMP) test packets to enhance the
       STAMP base functions.  Such extensions to STAMP enable OAM data
       collection at every node that STAMP test packets traverse.</p>
