- language: en
  script: Latn
  content: "<p>This document provides extensions for the Resource ReserVation Protocol-Traffic
    Engineering (RSVP-TE) to allow the communication of changes made by a node to
    the information provided by other nodes in a ROUTE_RECORD Object (RRO) in Path
    and Resv messages, or to indicate that it has itself provided incomplete information.</p>"
