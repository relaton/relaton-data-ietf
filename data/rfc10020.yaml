abstract:
- language: en
  script: Latn
  content: "<p>The Constrained Application Protocol (CoAP) is a web transfer protocol
    for constrained devices and constrained networks. In a number of use cases, constrained
    devices often naturally operate in groups (e.g., in a building automation scenario,
    all lights in a given room may need to be switched on/off as a group). This document
    specifies the use of CoAP for group communication, including the use of UDP/IP
    multicast as the default underlying data transport. Both unsecure and secure CoAP
    group communication are specified. Security is achieved by use of the Group Object
    Security for Constrained RESTful Environments (Group OSCORE) protocol. The target
    application area of this specification is any group communication use cases that
    involve resource-constrained devices or networks that support CoAP. This document
    obsoletes RFC 7390 and updates RFCs 7252 and 7641.</p>"
