abstract:
- language: en
  script: Latn
  content: "<p>Routing protocols are subject to attacks that can harm individual users
    or the network operations as a whole. This document provides a description and
    a summary of generic threats that affects routing protocols in general. The work
    describes threats, including threat sources and capabilities, threat actions,
    and threat consequences as well as a breakdown of routing functions that might
    be separately attacked.</p>"
