abstract:
- language: en
  script: Latn
  content: "<p>This document defines a set of RADIUS Vendor-Specific Attributes (VSAs)
    designed to encode network quality metrics that are not uniquely associated with
    an IEEE 802.11 (Wi-Fi) connection. These attributes enable access network quality
    information to be communicated between RADIUS clients and servers.</p>"
