abstract:
- language: en
  script: Latn
  content: "<p>This document describes a format for distributing security policy statments.
    \ Individual security policy statements are expressed in a HTTP compatible header
    syntax.  Lists of security policy statements are exchanged as signed CMS objects.
    \ Strong references to static data objects are formed using Named Information
    (ni) URI specifiers.</p>"
