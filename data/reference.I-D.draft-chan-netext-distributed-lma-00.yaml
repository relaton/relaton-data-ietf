abstract:
- language: en
  script: Latn
  content: '<p>The full functions of a local mobility anchor may be separated into
    different logical functions: (1) allocation of home network prefixes or home addresses
    to mobile nodes, (2) location management function which includes managing the
    IP addresses and locations of the mobile nodes and (3) mobility routing function
    which includes intercepting and forwarding packets.  Distributed local mobility
    anchors provides visiting local mobility anchors in different networks with mobility
    routing function to avoid triangle routing problem in Proxy mobile IP or Mobile
    IP, but keeps the internetwork location management function at the home local
    mobility anchors at registered networks.  The needed location information of a
    mobile node is acquired only when a packet is first sent to the mobile node and
    are then cached at the visiting local mobility anchor to enable subsequent optimized
    mobility routing.  Status of this Memo  This Internet-Draft is submitted to IETF
    in full conformance with the provisions of BCP 78 and BCP 79.  Internet-Drafts
