abstract:
- language: en
  script: Latn
  content: "<p>There are currently some mechanisms available to mitigate attacks in
    local networks -- Secure Neighbor Discovery (SeND), First Hop Security (FHS),
    SAVI, etc.. The purpose of this document is to compare these mechanisms and offer
    some recommendations regarding the implementations and deployments of these mechanisms.</p>"
