abstract:
- language: en
  script: Latn
  content: "<p>SRv6 is used by operators to provide programmable and traffic- engineered
    IP private line services. Such services are often deployed for customers with
    strict requirements on service isolation, predictable forwarding, and communication
    security. Quantum Key Distribution (QKD) networks can provide symmetric key material
    to authorized applications or security functions. When QKD- generated keys are
    used together with SRv6-based private line services, operators need to coordinate
    service provisioning, SRv6 policy state, endpoint security functions, and QKD
    key availability. This document describes the problem space and operational considerations
    for QKD-assisted SRv6 private line services. It does not define new SRv6 data-plane
    behavior, new SRv6 Segment Identifier semantics, a new QKD protocol, or a new
    cryptographic algorithm.</p>"
