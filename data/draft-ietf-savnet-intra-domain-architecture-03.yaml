abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the architecture of intra-domain SAVNET, which
    aims to achieve accurate source address validation (SAV) at external interfaces
    of an intra-domain network in an automated manner. It describes the conceptual
    design of intra-domain SAVNET, along with its use cases and design requirements,
    to help ensure that the intended objectives are met.</p>"
