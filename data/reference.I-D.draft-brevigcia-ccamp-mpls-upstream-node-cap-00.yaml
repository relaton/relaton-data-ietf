abstract:
- language: en
  script: Latn
  content: "<p>This document proposes to extend [TE-NODE-CAP] in order to support
    additional TE node capabilities in the context of Point-to-MultiPoint (P2MP) LSP
    routing and fast reroute protection. As for point-to- point LSP, nesting P2MP
    LSPs into P2MP Tunnels is a desirable traffic-engineering feature. However, nesting
    P2MP LSPs requires a mechanism to coordinate the label allocation of the inner
    P2MP LSP between the egress nodes of the P2MP Tunnel as described in [MPLS- UPSTREAM].
    To solve this issue, a new label allocation scheme called Upstream Label Assignment
    (ULA) is defined. Network elements responsible for the route computation of P2MP
    LSP should be aware of the nodes that support this functionality. For that purpose,
    we define a new bit flag to the TE Node Capability Descriptor as defined in [TE-NODE-CAP].
    The bit flag (U) enables a node to advertise its capability to accept Upstream
    Label Assignment.</p>"
