abstract:
- language: en
  script: Latn
  content: "<p>Matroska is a multimedia container format. It can store timestamped
    multimedia data but also chapters and tags. The Tag elements add important metadata
    to identify and classify the information found in a Matroska Segment. This document
    defines the Matroska multimedia container tags, namely the tag names and their
    respective semantic meaning.</p>"
