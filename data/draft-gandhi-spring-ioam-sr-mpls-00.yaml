abstract:
- language: en
  script: Latn
  content: "<p>In-situ Operations, Administration, and Maintenance (IOAM) records
    operational and telemetry information in the data packet while the packet traverses
    a path between two points in the network. This document defines how IOAM data
    fields are transported with the Segment Routing with MPLS data plane (SR-MPLS)
    encapsulation.</p>"
