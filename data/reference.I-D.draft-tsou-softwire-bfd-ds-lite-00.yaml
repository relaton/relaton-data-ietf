  script: Latn
  content: "<p>In DS-Lite, there is no state information of the tunnel, which make
    it difficult to mange and diagnose.  BFD can be used in this case to detect the
    state of the IPv4-in-IPv6 tunnel by creating BFD session between CPE and AFTR.</p>"
