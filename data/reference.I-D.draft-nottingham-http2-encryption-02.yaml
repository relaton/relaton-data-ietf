abstract:
- language: en
  script: Latn
  content: "<p>This document proposes two changes to HTTP/2.0; first, it suggests
    using ALPN Protocol Identifies to identify the specific stack of protocols in
    use, including TLS, and second, it proposes a way to opportunistically encrypt
    HTTP/2.0 using TLS for HTTP URIs.</p>"
