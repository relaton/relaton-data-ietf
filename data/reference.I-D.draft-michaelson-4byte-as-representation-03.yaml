abstract:
- language: en
  script: Latn
  content: "<p>A single textual representation for four-octet Autonomous System (AS)
    numbers is defined. The syntax chosen avoids collision with Border Gateway Protocol
    (BGP) community string parsing of AS numbers. It is recommended that this textual
    representation be used by all documents, systems and user interfaces referring
    to four-octet AS numbers.</p>"
