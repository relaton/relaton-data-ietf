title:
- language: en
  script: Latn
  content: TLS-Session-Bound Access Tokens for OAuth 2.0
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-mw-oauth-tls-session-bound-tokens-07
docidentifier:
- content: draft-mw-oauth-tls-session-bound-tokens
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-06-20'
abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for binding OAuth 2.0 access tokens\n   to a specific mutual TLS (mTLS) connection.  The binding is achieved\n   through a proof token that incorporates the TLS Exporter value (RFC\n   5705) derived from the current connection and an access token hash,\n   signed by the client's private key corresponding to its mTLS\n   certificate.  This mechanism prevents stolen bearer tokens from being\n   replayed on a different TLS connection.  The proof is constructed\n   once per (token, connection) pair and reused across all requests on\n   that connection, delivering session binding with no per-request\n   signing overhead and no additional key management beyond what mTLS\n   already provides.  The mechanism is applicable to TLS 1.2, TLS 1.3,\n   and QUIC transports.  While applicable to any OAuth 2.0 access token\n   presented over mTLS, this specification is primarily motivated by the\n   OAuth 2.0 Token Exchange protocol (RFC 8693), where multi-hop\n   delegation chains in autonomous, agent-driven architectures create\n   elevated replay risk.</p>"
