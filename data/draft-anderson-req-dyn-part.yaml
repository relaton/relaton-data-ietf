abstract:
- language: en
  script: Latn
  content: "<p>This document identifies a set of requirements for the mechanisms \nused
    to dynamically reallocate the resources of a partitionable \nnetwork element (NE).
    \ These requirements are particularly critical \nin the case of an operator creating
    a virtual NE (by partitioning a \nphysical NE) and then leasing control of that
    virtual NE to a third \nparty.</p>"
