abstract:
- language: en
  script: Latn
  content: "<p>This document describes a simple mapping database to be used by the
    Locator/ID Separation Protocol (LISP) to find Endpoint Identifier (EID) to Routing
    Locator (RLOC) mappings.  Termed the Alternative Logical Topology (ALT), the database
    is built as an overlay network on the public Internet using the Border Gateway
    Protocol (BGP) and the Generic Routing Encapsulation (GRE).  Using these proven
    protocols, the ALT can be built and deployed relatively quickly without major
    changes to the existing routing infrastructure.</p>"
