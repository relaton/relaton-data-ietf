abstract:
- language: en
  script: Latn
  content: "<p>[VPLS-LDP] defines a mechanism to remove or unlearn MAC addresses that
    have been dynamically learned in a Virtual Switch Instance(VSI) for faster convergence
    on topology change. One of the ways to accomplish this is by sending LDP Address
    Withdraw Message with empty MAC List when topology change occurs due to spoke
    PW (Pseudo- Wire) switchover at dual-homed capable Multi-Tenant Unit Switch (MTU-s)
    in a Hierarchical VPLS (H-VPLS) domain. On receiving this message a PE-rs removes
    all MAC addresses associated with the VSI except the ones learned in the session
    over which the message is received. The MAC addresses removed in this procedure
    also include the MAC addresses learned from LDP sessions in the same VSI that
    are not actually affected due to such topology change. This document proposes
    an extension to LDP Address Withdraw Message with empty MAC List defined in [VPLS-LDP],
    which enables the PE-rs receiving the message to remove only the MAC addresses
    that are affected and need to be relearned.</p>"
