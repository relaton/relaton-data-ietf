abstract:
- language: en
  script: Latn
  content: "<p>One of the important goals of the participants working on Zeroconf,
    Multicast DNS, and DNS-Based Service Discovery was the desire to retire AppleTalk
    and the AppleTalk Name Binding Protocol, and to replace them with an all-IP solution.
    This document outlines the specific requirements that IP-based protocol(s) need
    to meet to make that possible.</p>"
