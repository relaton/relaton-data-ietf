abstract:
- language: en
  script: Latn
  content: "<p>In-situ Operations, Administration, and Maintenance (IOAM) records
    operational and telemetry information in the packet while the packet traverses
    a path between two points in the network.  This document outlines how IOAM data
    fields are encapsulated in the Network Service Header (NSH).</p>"
