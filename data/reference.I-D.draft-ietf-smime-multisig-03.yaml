abstract:
- language: en
  script: Latn
  content: <p>CMS SignedData includes the SignerInfo structure to convey per-signer
    information. SignedData supports multiple signers and multiple signature algorithms
    per-signer with multiple SignerInfo structures. If a signer attaches more than
    one SignerInfo, there are concerns that an attacker could perform a downgrade
    attack by removing the SignerInfo(s) with the 'strong' algorithm(s). This document
    defines the multiple-signatures attribute, its generation rules, and its processing
    rules to allow signers to convey multiple SignerInfo while protecting against
    downgrade attacks. Additionally, this attribute may assist during periods of algorithm
    migration. Conventions used in this document The key words "MUST", "MUST NOT",
    "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY",
    and "OPTIONAL" in this document are to be interpreted as described in [RFC2119].
    Discussion This draft is being discussed on the 'ietf-smime' mailing list. To
    subscribe, send a message to ietf-smime-request@imc.org with the single word subscribe
    in the body of the message. There is a Web site for the mailing list at &lt;http://www.imc.org/ietf-smime/&gt;.</p>
