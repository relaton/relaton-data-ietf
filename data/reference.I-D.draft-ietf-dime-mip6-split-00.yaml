abstract:
- language: en
  script: Latn
  content: <p>In Mobile IPv6 deployment a need for an interaction between the Home
    Agent, the AAA infrastructure of the Mobile Service Provider (MSP) and the Mobility
    Service Authorizer (MSA) has been identified. This document describes how Diameter
    can be used to perform AAA functionalities for the Mobile IPv6 service in the
    "split" scenario. For this, it describes two possible approaches. It also explains
    how Diameter meet the goals outlined in the MIPv6 AAA goals document.</p>
