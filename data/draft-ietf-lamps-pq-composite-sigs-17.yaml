abstract:
- language: en
  script: Latn
  content: "<p>This document defines combinations of US NIST Module-Lattice-Based
    Digital Signature Algorithm (ML-DSA) in hybrid with traditional algorithms RSASSA-PKCS1-v1.5,
    RSASSA-PSS, ECDSA, Ed25519, and Ed448. These combinations are tailored to meet
    regulatory guidelines in certain regions. Composite ML-DSA is applicable in applications
    that use X.509 or PKIX data structures that accept ML-DSA, but where the operator
    wants extra protection against breaks or catastrophic bugs in ML-DSA, and where
    existential unforgeability (EUF-CMA) level security is acceptable.</p>"
