abstract:
- language: en
  script: Latn
  content: "<p>Advanced Encryption Standard (AES) counter modes use a counter, which
    is typically assumed to be incremented by a single sender.  This memo describes
    the use of AES counter modes when applied to the Encapsulating Security Payload
    (ESP) and Authentication Header (AH) in multiple-sender group applications.</p>"
