abstract:
- language: en
  script: Latn
  content: "<p>This document allocates a formal Uniform Resource Name (URN) namespace
    for assignment by the North Atlantic Treaty Organization (NATO), as specified
    in RFC 3406.  The current primary use is for uniquely identifying Extensible Markup
    Language (XML) artifacts that provide information about NATO message text formats
    and service specifications as described in various NATO standards, instructions
    and publications.</p>"
