abstract:
- language: en
  script: Latn
  content: "<p>This specification defines redirect reference resources. A redirect
    reference resource is a resource whose default response is an HTTP/1.1 3xx (Redirection)
    status code (see RFC2616, Section 10.3), redirecting the client to a different
    resource, the target resource. A redirect reference makes it possible to access
    the target resource indirectly, through any URI mapped to the redirect reference
    resource. There are no integrity guarantees associated with redirect reference
    resources.</p>"
