abstract:
- language: en
  script: Latn
  content: "<p>This document specifies QUIP (QUIC Identity Protocol), a federated
    application protocol providing portable cryptographic identity, verifiable server
    trust, deterministic state synchronization, and built-in accountability. QUIP
    runs over QUIC (RFC 9000) and uses a strict deterministic CBOR profile (QUIP-CBOR).
    Three conformance profiles are defined: Basic (messaging), Documents (content
    addressing), and Media (real-time transport). The protocol enables users to own
    a portable NodeId independent of service providers, servers to authenticate via
    DANE+DNSSEC with deployable fallback modes, and peers to detect and throttle misbehavior
    through signed violation receipts propagated via gossip.</p>"
