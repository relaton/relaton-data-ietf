abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how explicit congestion notification (ECN)
    can be used with Real-time Transport Protocol (RTP) over UDP flows that use RTP
    Control Protocol (RTCP) as feedback mechanism.  It defines one RTP Control Protocol
    Extended Reports (RTCP XR) extension for ECN summary, a RTCP transport feedback
    format for timely reporting of congestion events, and an Session Traversal Utilities
    for NAT (STUN) extension used in the optional initilization method using Interactive
    Connectivity Establishment (ICE).  Signalling and procedures for negotiation of
    capabilities and initilization methods are also defined.</p>"
