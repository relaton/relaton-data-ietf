abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model to configure and manage IPv6
    Neighbor Discovery (ND) and related functions, including IPv6 address resolution,
    redirect function, proxy Neighbor Advertisement, Neighbor Unreachability Detection
    (NUD), Duplicate Address Detection (DAD), and Enhanced Duplicate Address Detection.</p>"
