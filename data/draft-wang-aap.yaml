abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Agent Accountability Protocol (AAP) v0.0,\n   a minimal infrastructure layer for tracking task chains in multi-\n   agent systems. Built on JEP [draft-wang-jep-judgment-event-protocol-01]\n   and HJS [draft-wang-hjs-accountability-02], AAP adds a single\n   field—task_based_on—to establish verifiable causality between tasks\n   across agents, platforms, and trust domains.\n\n   AAP follows the same narrow-waist design philosophy as JEP and HJS:\n   a minimal mandatory core with all advanced features defined as\n   optional extensions.</p>"
