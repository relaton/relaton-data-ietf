abstract:
- language: en
  script: Latn
  content: "<p>VEIL (Verified Ephemeral Identity Layer) is a security profile of\n   OAuth 2.1 for privacy-preserving identity verification.  It separates\n   claims into two tracks: proof claims (boolean verification results,\n   compliance flags, assurance levels) travel through standard token\n   claims, while identity claims (name, date of birth, address,\n   nationality) travel only through an ephemeral, single-consume channel\n   that keeps personally identifiable information off long-lived tokens.\n   Subject identifiers are pairwise by default.  Consent records are\n   HMAC-protected.  Step-up authentication scales with operation\n   sensitivity.  VEIL is the base profile for domain-specific\n   extensions.</p>"
