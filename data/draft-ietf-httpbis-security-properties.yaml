abstract:
- language: en
  script: Latn
  content: "<p>Recent IESG practice dictates that IETF protocols must specify mandatory-to-implement
    (MTI) security mechanisms, so that all conformant implementations share a common
    baseline. This document examines all widely deployed HTTP security technologies,
    and analyzes the trade-offs of each.</p>"
