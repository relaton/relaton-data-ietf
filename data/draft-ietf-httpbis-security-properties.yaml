abstract:
- language: en
  script: Latn
  content: "<p>Recent IESG practice dictates that IETF protocols must specify\n   mandatory-to-implement (MTI) security mechanisms, so that all\n   conformant implementations share a common baseline.  This document\n   examines all widely deployed HTTP security technologies, and analyzes\n   the trade-offs of each.</p>"
