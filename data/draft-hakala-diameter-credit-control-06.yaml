- language: en
  script: Latn
  content: "<p>This document specifies a Diameter application that is used for real-
    time cost and credit control between a service element and a credit control server
    in service environment. Diameter accounting messages with additional AVPs are
    used to transfer service and credit control information between the service element
    and the Credit Control Server.</p>"
