abstract:
- language: en
  script: Latn
  content: <p>ENUM domains track the right-to-use of the underlying E.164 number.
    The process of asserting this is called "validation". This document describes
    a generalized role model and a XML data format -- the validation token -- to convey
    validation related information.</p>
