abstract:
- language: en
  script: Latn
  content: |-
    <p>This document presents a mobility-aware distributed security
       framework for 5G edge networks using the Interface to Network
       Security Functions (I2NSF) architecture.  The proposed system uses
       Intent-Based Networking (IBN) to allow users or administrators to
       declare high-level security intents, which are translated into
       network and application policies.  Network-level security policies
       may be enforced through distributed Network Security Functions (NSFs)
       deployed near User Plane Functions (UPFs), while application-level
       policies may be enforced on User Equipment (UE) through distributed
       IBN Controllers.  This architecture is intended to support adaptive,
       context-aware, and distributed policy enforcement in response to
       dynamic edge conditions and user mobility scenarios such as
       handovers.  Closed-loop monitoring and analytics provide feedback for
       maintaining policy consistency across heterogeneous 5G environments.</p>
