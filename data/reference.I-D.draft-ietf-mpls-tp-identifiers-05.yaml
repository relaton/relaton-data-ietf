abstract:
- language: en
  script: Latn
  content: "<p>This document specifies identifiers for MPLS-TP objects.  Included
    are identifiers conformant to existing ITU conventions and identifiers which are
    compatible with existing IP, MPLS, GMPLS, and Pseudowire definitions.  This document
    is a product of a joint Internet Engineering Task Force (IETF) / International
    Telecommunication Union Telecommunication Standardization Sector (ITU-T) effort
    to include an MPLS Transport Profile within the IETF MPLS and Pseudowire Emulation
    Edge-to-Edge (PWE3) architectures to support the capabilities and functionalities
    of a packet transport network as defined by the ITU-T.</p>"
