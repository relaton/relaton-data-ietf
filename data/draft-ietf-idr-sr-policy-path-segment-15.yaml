abstract:
- language: en
  script: Latn
  content: "<p>BGP SR Policy address-family is used for signaling of individual candidate
    paths of a Segment Routing Policy. This document specifies extensions for the
    signaling of a Path Segment Identifier associated with the Segment List(s) of
    a candidate path. It also specifies extensions for the signaling of the Segment
    List(s) in the reverse direction when Bidirectional SR Policies are used.</p>"
