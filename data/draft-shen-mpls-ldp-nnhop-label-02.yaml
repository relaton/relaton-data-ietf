abstract:
- language: en
  script: Latn
  content: "<p>This document specifies extensions to LDP in support of next-nexthop
    label discovery. The next-nexthop label information can be used to fast re-route
    LDP LSP traffic into an explicitly routed tunnel for nexthop node protection in
    the case of a link or node failure.</p>"
