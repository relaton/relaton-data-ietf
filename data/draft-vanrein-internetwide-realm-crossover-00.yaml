- language: en
  script: Latn
  content: "<p>Domains and domain user identities are available in many protocols,
    and can be expressed as part of the URI grammar. This document outlines how clients
    can bring their self-controlled identities over when crossing over to foreign
    realms that rely on authenticated user identities.</p>"
