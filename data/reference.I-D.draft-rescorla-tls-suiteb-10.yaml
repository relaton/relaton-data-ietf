abstract:
- language: en
  script: Latn
  content: <p>The United States Government has published guidelines for "NSA Suite
    B Cryptography", which defines cryptographic algorithm policy for national security
    applications.  This document defines a profile of TLS version 1.2 which is fully
    conformant with Suite B. This document also defines a transitional profile for
    use with TLS version 1.0 and TLS version 1.1 employ Suite B algorithms to the
    greatest extent possible.</p>
