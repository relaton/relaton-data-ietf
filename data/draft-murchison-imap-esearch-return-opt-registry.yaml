abstract:
- language: en
  script: Latn
  content: |-
    <p>This document creates a registry of IMAP Extended Search Return
       Options and Data Tags (RFC 4466) in order to help developers and IMAP
       extension writers track interactions between different extensions.

    Open Issues

       *  Is Expert Review the correct registration policy?

       *  Should we also add a registry of SEARCH criteria?</p>
