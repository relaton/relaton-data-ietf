abstract:
- language: en
  script: Latn
  content: "<p>The IETF has completed its work on the core specification of TWAMP
    - the Two-Way Active Measurement Protocol.  This memo describes a new feature
    for TWAMP: an optional capability where the responder host returns some of the
    command octets or padding octets to the controller, and/or ensures that the same
    test packet sizes are used in both directions.</p>"
