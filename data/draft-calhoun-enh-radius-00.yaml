- language: en
  script: Latn
  content: "<p>This document describes a protocol for carrying authentication, authorization,
    and configuration information between a Network Access Server which desires to
    authenticate its links and a shared Authentication Server. This enhanced protocol
    is a backward compatible protocol which attempts to solve many deficiencies with
    the existing protocol.</p>"
