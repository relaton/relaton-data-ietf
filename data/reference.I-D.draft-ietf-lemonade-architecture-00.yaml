abstract:
- language: en
  script: Latn
  content: <p>This document specifies the architecture for mobile email, as described
    by the OMA, using Internet Mail protocols. This architecture is the basis of the
    work of the LEMONADE WG and is a guidleine for the LEMONADE Profile.Conventions
    used in this document The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL
    NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this document
    are to be interpreted as described in RFC 2119 [1].</p>
