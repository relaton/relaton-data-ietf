abstract:
- language: en
  script: Latn
  content: "<p>This document defines the procedures that the Internet Assigned Numbers
    Authority (IANA) uses when handling registration and other requests related to
    the transport protocol port number and service name registry.  It also discusses
    the rationale and principles behind these procedures and how they facilitate the
    long-term sustainability of the registry.  This document updates RFC2780 by obsoleting
    Sections 8 and 9.1 of that RFC, and it updates the IANA allocation procedures
    for DCCP as defined in RFC4340.</p>"
