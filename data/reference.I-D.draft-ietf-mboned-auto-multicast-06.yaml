abstract:
- language: en
  script: Latn
  content: "<p>Automatic Multicast Tunneling (AMT) allows multicast communication
    amongst isolated multicast-enabled sites or hosts, attached to a network which
    has no native multicast support. It also enables them to exchange multicast traffic
    with the native multicast infrastructure and does not require any manual configuration.
    AMT uses an encapsulation interface so that no changes to a host stack or applications
    are required, all protocols (not just UDP) are handled, and there is no additional
    overhead in core routers.</p>"
