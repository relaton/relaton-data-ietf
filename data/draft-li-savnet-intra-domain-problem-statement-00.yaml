abstract:
- language: en
  script: Latn
  content: "<p>Source Address Validation in Intra-domain Networks (Intra-domain SAVNET)
    aims to make improvements to existing intra-domain Source Address Validation (SAV).
    This document provides the gap analysis of existing intra-domain SAV mechanisms,
    describes the fundamental problems, and defines the requirements for improvements.</p>"
