abstract:
- language: en
  script: Latn
  content: "<p>This informational document details the mechanism used by the CIRA
    Secure Home Gateway (SHG) to load MUD definitions for devices which have no integrated
    MUD (RFC8520) support. The document describes extensions to the WiFi Alliance
    DPP QR code to support the use of MUD URLs.</p>"
