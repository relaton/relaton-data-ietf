abstract:
- language: en
  script: Latn
  content: "<p>The only FTP mode that works without changes through an IPv6-to-IPv4
    translator is extended passive, introduced in 1998.  However, many existing FTP
    servers don't support this mode, making it impossible to support the File Transfer
    Protocol through an IPv6-to-IPv4 translator without an Application Layer Gateway.
    \ This document describes the behavior of such an ALG.</p>"
