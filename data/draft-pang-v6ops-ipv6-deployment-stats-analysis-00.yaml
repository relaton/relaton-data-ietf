abstract:
- language: en
  script: Latn
  content: "<p>This document explains why existing observations of IPv6 deployment
    are often insufficient to identify the operational gaps and bottlenecks that limit
    IPv6 utilization and service quality. It describes the need for correlated analysis
    across different parts of the service path and discusses examples of statistical
    evidence that can support such analysis.</p>"
