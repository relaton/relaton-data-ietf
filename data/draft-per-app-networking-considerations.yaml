abstract:
- language: en
  script: Latn
  content: "<p>This document describes considerations for and implications of using\n   application identifiers as a method of differentiating traffic on\n   networks.  Specifically, it discusses privacy considerations,\n   possible mitigations, and considerations for user experience and API\n   design.\n\nDiscussion Venues\n\n   This note is to be removed before publishing as an RFC.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/tfpauly/per-app-networking-considerations.</p>"
