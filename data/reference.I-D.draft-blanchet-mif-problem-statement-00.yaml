abstract:
- language: en
  script: Latn
  content: "<p>A multi-homed host receives node configuration information from each
    of its access networks.  Some configuration objects are global to the node, some
    are local to the interface.  Various issues arise when multiple configuration
    objects that are global to the node are received on the many interfaces the multi-homed
    host has.  This document describes these issues.</p>"
