abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for the detection of communication
    failures between two communicating hosts at IP layer, and an exploration protocol
    for switching to another pair of interfaces and/or addresses between the same
    hosts if a working pair can be found. The draft also discusses the roles of a
    multihoming protocol versus network attachment functions at IP and link layers.</p>"
