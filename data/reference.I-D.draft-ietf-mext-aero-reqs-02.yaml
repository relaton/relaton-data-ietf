abstract:
- language: en
  script: Latn
  content: "<p>This document describes the requirements and desired properties of
    NEMO Route Optimization techniques for use in global networked communications
    systems for aeronautics and space exploration.  This version has been reviewed
    by members of the International Civil Aviation Orgnanization (ICAO) and other
    aeronautical communications standards bodies, and contributed to by a number of
    aeronautical communications experts outside the normal IETF process.</p>"
