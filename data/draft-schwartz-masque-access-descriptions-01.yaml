abstract:
- language: en
  script: Latn
  content: |-
    <p>HTTP proxies can operate several different kinds of access services.
       This specification provides a format for identifying a collection of
       such services.

    About This Document

       This note is to be removed before publishing as an RFC.

       Status information for this document may be found at
       https://datatracker.ietf.org/doc/draft-schwartz-masque-access-
       descriptions/.

       Source for this draft and an issue tracker can be found at
       https://github.com/bemasc/access-services.</p>
