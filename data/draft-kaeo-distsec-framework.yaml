abstract:
- language: en
  script: Latn
  content: "<p>Security policy enforcement is becoming increasingly challenging as
    the trend to utilize mobile and nomadic nodes in networked communications continues
    to grow. This document will enumerate the problem statement and threat model and
    will describe how a distributed security framework can address the threats related
    to these problems.</p>"
