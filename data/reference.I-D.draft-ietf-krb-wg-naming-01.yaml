abstract:
- language: en
  script: Latn
  content: "<p>This document defines new naming constraints for reserved Keberos names.
    A reserved name can be either a Kerberos principal name or a Kerberos realm name.
    All reserved names defined in this document are critical, so if a reserved name
    is unknown, authentication MUST fail.</p>"
