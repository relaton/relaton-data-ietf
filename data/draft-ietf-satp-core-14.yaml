abstract:
- language: en
  script: Latn
  content: "<p>This memo describes the Secure Asset Transfer Protocol (SATP) for digital
    assets. SATP is a protocol operating between two gateways that conducts the transfer
    of a digital asset from one gateway to another, each representing their corresponding
    digital asset networks. The protocol establishes a secure channel between the
    endpoints and implements a 2-phase commit (2PC) to ensure the properties of transfer
    atomicity, consistency, isolation and durability.</p>"
