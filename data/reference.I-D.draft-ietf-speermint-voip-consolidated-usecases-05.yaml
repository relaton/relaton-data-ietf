abstract:
- language: en
  script: Latn
  content: "<p>This document will capture VoIP use case for SIP Peering.  This document
    depicts many common VoIP peering use cases. These use cases are categorized into
    two types: static and on-demand, and then further subcategorized into direct and
    indirect. These use cases are not an exhaustive set, but rather the most common
    use cases deployed today. This document captures them to provide a reference.</p>"
