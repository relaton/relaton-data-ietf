abstract:
- language: en
  script: Latn
  content: '<p>This document modifies RFC 3978 "IETF Rights in Contributions" as follows:
    (1) recognizing that the IETF Trust is now the proper custodian of all IETF-related
    intellectual property rights, (2) giving IETF Trust the right to permit extraction
    of material from RFCs, and (3) giving IETF Trust the right to permit others to
    create derivative works outside the IETF Standards Process. This document does
    not constrain how the IETF Trust exercises those rights.</p>'
