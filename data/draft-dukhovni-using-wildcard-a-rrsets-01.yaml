abstract:
- language: en
  script: Latn
  content: "<p>This document describes how the use of wildcard A and AAAA resource
    records (RRs) in the Domain Name System (DNS), optionally coupled with self-service
    key management for host names that match the wildcards, to create per-user services.
    This memo describes what should be a best current practice.</p>"
