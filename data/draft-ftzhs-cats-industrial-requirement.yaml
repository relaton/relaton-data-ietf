abstract:
- language: en
  script: Latn
  content: "<p>This draft illustrates use cases of traffic steering for Industrial
    Internet in terms of dynamic computing and networking resource status,together
    with the requirements and solutions for CATS(Computing-Aware Traffic Steering).Industrial
    production tasks are time-sensitive, which put forward high requirements on collaboration
    of networks and applications. Industrial management platforms need to unify network
    forwarding and computing tasks at the same time.</p>"
