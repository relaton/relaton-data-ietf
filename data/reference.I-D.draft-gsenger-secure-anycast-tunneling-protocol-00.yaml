abstract:
- language: en
  script: Latn
  content: "<p>The secure anycast tunneling protocol (SATP) defines a protocol used
    for communication between any combination of unicast and anycast tunnel endpoints.
    It allows tunneling of every ETHER TYPE protocol (ethernet, ip ...). SATP directly
    includes cryptography and message authentication based on the methodes used by
    SRTP. It can be used as an encrypted alternative to IP Encapsulation within IP
    [3] and Generic Routing Encapsulation (GRE) [4]. It supports both anycast receivers
    and senders.</p>"
