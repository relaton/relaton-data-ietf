abstract:
- language: en
  script: Latn
  content: "<p>This document specifies problems in running the IETF IP protocols over
    IEEE 802.16 networks by identifying specific gaps in the 802.16 MAC for IPv4 and
    IPv6 support. This document also provides an overview of IEEE 802.16 network characteristics
    and convergence sublayers. The common terminology to be used for the base guideline
    while defining the solution frameworks is also presented.</p>"
