abstract:
- language: en
  script: Latn
  content: "<p>This document gives general rules for how to pronounce Mandarin Chinese
    names in conversation, and how to determine which name is someone's surname. It
    also covers some other related topics about Chinese names. The intent is to allow
    IETF participants who are not familiar with Chinese to communicate better with
    Chinese participants.</p>"
