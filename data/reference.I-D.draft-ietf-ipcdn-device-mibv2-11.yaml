abstract:
- language: en
  script: Latn
  content: <p>This memo is a revision of the standards track RFC 2669. Please see
    "Revision Descriptions" below for a description of changes. This document obsoletes
    RFC 2669. This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it defines a basic set of managed objects for SNMP- based management of DOCSIS-compliant
    Cable Modems and Cable Modem Termination Systems. This memo is a product of the
    IPCDN working group within the Internet Engineering Task Force. Comments are solicited
    and should be addressed to the working group's mailing list at ipcdn@ietf.org
    and/or the author.</p>
