abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Message Layer Security (MLS) KeyPackage extension
    to convey a specific context or anticipated use for the KeyPackage. It is useful
    when a client provides the KeyPackage out- of-band to another client, and wants
    the specific KeyPackage used only in the anticipated context, for example a specific
    MLS group.</p>"
