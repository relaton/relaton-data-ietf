abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Message Layer Security (MLS) KeyPackage\n   extension to convey a specific context or anticipated use for the\n   KeyPackage.  It is useful when a client provides the KeyPackage out-\n   of-band to another client, and wants the specific KeyPackage used\n   only in the anticipated context, for example a specific MLS group.</p>"
