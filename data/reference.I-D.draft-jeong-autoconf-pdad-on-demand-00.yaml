abstract:
- language: en
  script: Latn
  content: "<p>This document describes passive DAD schemes over on-demand ad-hoc routing
    protocols such as AODV and DYMO. In order to achieve these two goals: (a) improving
    the accuracy of detecting address conflicts and (b) reducing the time taken to
    detect these conflicts, this document provides several schemes using additional
    information including sequence, location, or neighbor knowledge.</p>"
