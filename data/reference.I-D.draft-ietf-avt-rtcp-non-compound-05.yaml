abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses benefits and issues that arise when allowing RTCP
    packets to be transmitted with reduced size such that mandatory report types according
    to the rules outlined in RFC3550 are removed. Based on that analysis this memo
    proposes changes to the rules to allow feedback messages to be sent as reduced
    size RTCP packets when using the RTP AVPF profile (RFC 4585) under certain conditions.</p>"
