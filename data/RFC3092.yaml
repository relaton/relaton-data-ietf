abstract:
- language: en
  script: Latn
  content: "<p>Approximately 212 RFCs so far, starting with RFC 269, contain the terms
    `foo', `bar', or `foobar' as metasyntactic variables without any proper explanation
    or definition. This document rectifies that deficiency. This memo provides information
    for the Internet community.</p>"
