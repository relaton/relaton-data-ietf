abstract:
- language: en
  script: Latn
  content: "<p>This document describes RADIUS attributes for conveying access network
    ownership and location information based on a civic and geospatial location format.
    The distribution of location information is a privacy sensitive task. Dealing
    with mechanisms to preserve the user's privacy is important and addressed in this
    document.</p>"
