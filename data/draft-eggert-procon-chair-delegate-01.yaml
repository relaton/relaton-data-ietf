abstract:
- language: en
  script: Latn
  content: "<p>This document affirms that the IETF Chair may delegate some of their
    responsibilities to other Area Directors, and updates several existing RFCs to
    enable that. It also defines a succession of emergency stand-ins in case the IETF
    Chair becomes incapacitated.</p>"
