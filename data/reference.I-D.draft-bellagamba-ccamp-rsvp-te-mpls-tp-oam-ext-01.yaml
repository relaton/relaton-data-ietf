abstract:
- language: en
  script: Latn
  content: "<p>This document defines a method for the configuration of MPLS-TP OAM
    functionalities through RSVP-TE Control Plane.  The procedures presented are experimental
    and currently describe BFD configuration for CC and CV.  Updated version of this
    document will possibly describe the configuration of the remaining MPLS-TP OAM
    functionalities.</p>"
