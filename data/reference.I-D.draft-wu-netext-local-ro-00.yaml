abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 allows the Mobility Access Gateway (MAG) to optimize
    the media delivery by locally routing the packets within one MAG, However it does
    not support optimization of the media delivery by locally routing the packets
    between MAGs sharing the same LMA. This document specifies extensions for Proxy
    MIP to support local routing optimization through the interaction between the
    MAG and the LMA.</p>"
