abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Pseudo-Random Function (PRF) extension to the
    Generic Security Service Application Programming Interface (GSS-API) for keying
    application protocols given an established GSS-API security context. The primary
    intended use of this function is to key secure session layers that don't or cannot
    use GSS-API per- message MIC (message integrity check) and wrap tokens for session
    protection.</p>"
