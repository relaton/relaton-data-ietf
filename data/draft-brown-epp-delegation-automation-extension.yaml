abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to the Domain Mapping for the
    Extensible Provisioning Protocol (EPP) which allows EPP clients to enable and
    disable automatic delegation maintenance carried out by the server. It also describes
    how the maintenance automation state of a domain can be included in RDAP responses.
    The source for this draft, and an issue tracker, may can be found at https://github.com/gbxyz/epp-ds-automation-extension.</p>"
