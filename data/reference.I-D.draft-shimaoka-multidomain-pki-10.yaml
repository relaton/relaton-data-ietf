abstract:
- language: en
  script: Latn
  content: "<p>The objective of this document is to establish a standard terminology
    for interoperability of multi-domain Public Key Infrastructure (PKI), where each
    PKI Domain is operated under a distinct policy. This document describes the relationships
    between Certification Authorities (CAs), provides the definition and requirements
    for PKI Domains, and discusses typical models of multi-domain PKI.</p>"
