abstract:
- language: en
  script: Latn
  content: "<p>There has been much discussion over the last years about the overall
    scalability of the Internet routing system.  This document attempts to describe
    what the actual problem is and the various demands being placed on the routing
    system that have made finding a straightforward solution difficult.  Comments
    should be sent to rrg@psg.com or to radir@ietf.org.</p>"
