abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to MPLS Operation,  administration,
    and Maintenance (OAM) to operate an Label Switched Path (LSP), bi-directional
    RSVP-TE tunnels, Pseudowires (PW), or Multi-segment PWs in loopback mode for management
    purpose in an MPLS based Transport. This extension includes mechanism to lock
    and  unlock MPLS-TP Tunnels (i.e. data and control traffic) and can be used to
    loop all traffic (i.e, data and control traffic) at a specified LSR on the path
    of the LSP in an MPLS based Transport Network back to the source. However, the
    mechanisms are intended to be applicable to other aspects of MPLS as well.</p>"
