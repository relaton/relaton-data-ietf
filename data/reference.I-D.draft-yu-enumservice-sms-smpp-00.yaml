abstract:
- language: en
  script: Latn
  content: <p>This document registers an enumservice subtype "smpp" under the existing
    type "sms" using the URI scheme "smpp" as per the IANA registration process defined
    in RFC 3761 [2] and draft-ietf-enum- enumservices-guide-07 [6] and registers a
    new URI type "smpp:" according to the URI registration procedure in RFC 4395 [8].  This
    enumservice subtype indicates that the remote resource identified by the URI scheme
    can receive short messages using the Short Message Peer-to-Peer Protocol (SMPP)
    [7].</p>
