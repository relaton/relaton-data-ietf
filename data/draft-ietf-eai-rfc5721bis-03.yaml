abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification extends the Post Office Protocol version 3 (POP3)
       to support un-encoded international characters in user names,
       passwords, mail addresses, message headers, and protocol-level
       textual strings.  This specification replaces RFC 5721.</p>
