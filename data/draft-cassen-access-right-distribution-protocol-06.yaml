- language: en
  script: Latn
  content: "<p>This document describes a protocol using multicast to securely distribute
    IPTV management elements such as IPTV customer's access rights. The protocol typically
    runs on any piece of equipments to locally store owned customers IPTV service
    access right. This design provides access control at aggregation level.</p>"
