abstract:
- language: en
  script: Latn
  content: "<p>HTTP proxies can operate several different kinds of access services.\n   This specification provides a format for identifying a collection of\n   such services.\n\nAbout This Document\n\n   This note is to be removed before publishing as an RFC.\n\n   Status information for this document may be found at\n   https://datatracker.ietf.org/doc/draft-schwartz-masque-access-\n   descriptions/.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/bemasc/access-services.</p>"
