abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Open Mesh Protocol (OMP), a proposed\n   open standard for device-native proximity mesh networking spanning\n   multiple radio technologies simultaneously.  Existing proximity\n   wireless mesh standards -- including Wi-Fi Aware (NAN), Bluetooth\n   Mesh, and Thread -- each operate over a single radio technology and\n   serve specific application domains.  No existing open standard\n   provides a unified multi-radio mesh routing protocol spanning BLE,\n   WiFi Direct, and LoRa with per-device cryptographic identity\n   independent of any central registry or carrier relationship.  This\n   document describes the OMP architecture, specific technical\n   implementations, and the gap in the current standards landscape that\n   OMP addresses.  It is submitted as an Informational Internet-Draft\n   to establish a public prior art record and to invite community\n   discussion on whether a new working group or individual submission\n   track is appropriate for this work.</p>"
