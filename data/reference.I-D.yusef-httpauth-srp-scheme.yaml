abstract:
- language: en
  script: Latn
  content: "<p>This document defines an HTTP Authentication Scheme that is based on
    the Secure Remote Password (SRP) protocol.  The SRP protocol is an Augmented Password
    Authenticated Key Exchange (PAKE) protocol suitable for authenticating users and
    exchanging keys over an untrusted network.</p>"
