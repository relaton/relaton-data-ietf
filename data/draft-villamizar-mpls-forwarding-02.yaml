- language: en
  script: Latn
  content: "<p>This document provides guidelines for implementors regarding MPLS forwarding
    and a basis for evaluations of forwarding implementations. Guidelines cover many
    aspects of MPLS forwarding. Topics are highlighted where implementors might potentially
    overlook practical requirements which are unstated or underemphasized or are optional
    for conformance to RFCs.</p>"
