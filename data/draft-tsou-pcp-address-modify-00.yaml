abstract:
- language: en
  script: Latn
  content: "<p>This document proposes that a field be added to the PIN-REQUEST message
    in the Pinhole Control Protocol to ask that the new mapping being requested reuse
    the same external address already assigned to the requesting device. The actual
    form of this new field is discussed within the document.</p>"
