abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to use a Generic Security Service Application
    Program Interface (GSS-API) mechanism in the the Simple Authentication and Security
    Layer (SASL) framework. This is done by defining a new SASL mechanism family,
    called GS2. This mechanism family offers a number of improvements over the previous
    SASL/GSS-API mechanism: it is more general, uses fewer messages for the authentication
    phase in some cases, and supports a SASL-specific notion of channel binding. See
    &lt;http://josefsson.org/sasl-gs2-*/&gt; for more information.</p>"
