abstract:
- language: en
  script: Latn
  content: <p>Many application protocols use named parameters to identify data. Historically,
    protocol designers and implementers distinguished between "standard" and "non-standard"
    parameters by prefixing the latter with the string "X-" or similar constructions.  On
    balance, this "X-" convention has more costs than benefits, although it can be
    appropriate in certain circumstances.</p>
