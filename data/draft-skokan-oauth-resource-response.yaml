- language: en
  script: Latn
  content: |-
    <p>This document defines the resource parameter for OAuth 2.0 access
       token responses, enabling an authorization server to indicate to the
       client the resource(s) which an issued access token is for.  It
       updates "Resource Indicators for OAuth 2.0" (RFC 8707).</p>
