abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Agentic Reasoning Protocol (ARP), a\n   lightweight mechanism for cryptographically binding machine-readable\n   entity claims to domain ownership via DNS TXT records.  ARP enables\n   AI agents and Retrieval-Augmented Generation (RAG) pipelines to\n   verify that structured data published on a domain was authorized by\n   the domain owner, preventing narrative injection and entity spoofing\n   in generative search systems.\n\n   ARP uses Ed25519 digital signatures [RFC8032], JSON Canonicalization\n   Scheme (JCS) [RFC8785], and DNS TXT records to establish a chain of\n   trust analogous to DomainKeys Identified Mail (DKIM) [RFC6376] but\n   designed specifically for the verification of semantic entity data\n   consumed by autonomous AI agents.</p>"
