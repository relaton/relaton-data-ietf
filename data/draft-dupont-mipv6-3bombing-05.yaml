- language: en
  script: Latn
  content: "<p>Mobile IPv6 introduces some new kinds of reflection attacks, as known
    as 3rd party bombing. This memo analyses these attacks and makes some recommendations:
    the goal is to avoid anything, including in new optimized mechanisms, which can
    make the life of bad guys easier.</p>"
