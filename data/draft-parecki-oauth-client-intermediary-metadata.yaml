abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a mechanism for including information about
    additional parties involved in an OAuth transaction by adding a new section to
    the OAuth 2.0 Dynamic Client Registration request, as well as requires that authorization
    servers surface this information to users during an OAuth transaction.</p>"
