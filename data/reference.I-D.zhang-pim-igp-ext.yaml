abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a method to advertise multicast source information.
    \ The information will be flooded all over the network by OSPF, ISIS and Babel
    extension.  This allows PIM Sparse Mode routers with connected receivers to build
    a Shortest Path Tree straight away, with no need for a shared a tree.</p>"
