abstract:
- language: en
  script: Latn
  content: "<p>This draft specifies Dynamic Host Configuration Protocol option (both
    DHCPv4 and DHCPv6) for NSH aware clients participating in the service function
    path(SFP) of the service chaining. As part of this proposal SFF and SF will receive
    the SFP information containing Service Path Identifier(SPI), Transport protocol
    and Nexthop(NH) address of subsequent SFF/SF.</p>"
