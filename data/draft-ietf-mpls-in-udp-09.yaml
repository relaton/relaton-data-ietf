abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an IP-based encapsulation for MPLS, called
    MPLS-in-UDP (User Datagram Protocol) for situations where UDP encapsulation is
    preferred to direct use of MPLS, e.g., to enable UDP-based ECMP (Equal Cost Multi-Pathing)
    or link aggregation. MPLS- in-UDP is primarily applicable to service provider
    networks, and additional restrictions apply to MPLS-in-UDP usage for traffic that
    is not congestion controlled and to UDP zero checksum usage with IPv6.</p>"
