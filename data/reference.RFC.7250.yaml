abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new certificate type and two TLS extensions
    for exchanging raw public keys in Transport Layer Security (TLS) and Datagram
    Transport Layer Security (DTLS).  The new certificate type allows raw public keys
    to be used for authentication.</p>"
