abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Media Control Channel Framework Package for
    Interactive Voice Response (IVR) dialog interaction on media connections and conferences.
    \ The package defines dialog management elements for preparing, starting and terminating
    dialog interactions, as well as associated responses and notifications.  While
    other dialog types can be used, this package defines a specific IVR dialog type
    supporting prompt playback, runtime controls, DTMF collect and media recording.
    \ The package also defines elements for auditing package capabilities and dialogs.</p>"
