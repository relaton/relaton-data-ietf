abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an algorithm for marking and metering by using
    pre-congestion notification (PCN) baseline encoding for both flow admission and
    flow termination.  The proposed algorithm uses threshold marking whose TBthreshold.threshold
    is set to the number of bits of a metered-packet smaller than the token bucket
    size.  Another threshold for the token bucket is required to change the marking.
    frequency.  Under the flow termination state, all the packets are to be threshold-marked.
    \ Under the admission stop state, 1/Nth of packets are to be threshold-marked
    when the meter indicates.  We evaluates the performance of the proposed algorithm
    by simulations. Our simulation indicates that the performance is almost the same
    as that of the CL[I-D.briscoe-tsvwg-cl-architecture] algorithm.</p>"
