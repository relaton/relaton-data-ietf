abstract:
- language: en
  script: Latn
  content: "<p>This document describes a signaling-layer correlation gap in SIP-\n   based real-time AI voice systems.  Existing SIP identifiers provide\n   dialog and communication-session scope, but they do not define a\n   stable application-layer identifier capable of persisting across\n   topology changes, multi-dialog call control operations, federated\n   interconnects, or distributed processing environments.\n\n   The document analyzes current mechanisms and their limitations, and\n   motivates the need for a standardized SIP-carried identifier whose\n   semantics are restricted to application-layer correlation and out-of-\n   band context retrieval.</p>"
