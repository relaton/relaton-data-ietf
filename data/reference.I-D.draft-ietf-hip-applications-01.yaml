abstract:
- language: en
  script: Latn
  content: "<p>The Host Identity Protocol (HIP) and architecture proposes to add a
    cryptographic name space for network stack names. From an application viewpoint,
    HIP-enabled systems support a new address family of host identifiers, but it may
    be a long time until such HIP- aware applications are widely deployed even if
    host systems are upgraded. This informational document discusses implementation
    and API issues relating to using HIP in situations in which the system is HIP-aware
    but the applications are not.</p>"
