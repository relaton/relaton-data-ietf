abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Multi-Protocol Label Switching Transport
    Profile (MPLS-TP) Operations, Administration and Maintenance (OAM) protocol to
    propagate a client failure indication across an MPLS-TP network in the case that
    propagation of failure status in the client layer is not supported as required
    in [RFC5860].</p>"
