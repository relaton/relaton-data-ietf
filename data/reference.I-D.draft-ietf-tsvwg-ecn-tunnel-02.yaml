abstract:
- language: en
  script: Latn
  content: "<p>This document redefines how the explicit congestion notification (ECN)
    field of the IP header should be constructed on entry to and exit from any IP
    in IP tunnel.  On encapsulation it brings all IP in IP tunnels (v4 or v6) into
    line with the way RFC4301 IPsec tunnels now construct the ECN field.  On decapsulation
    it redefines how the ECN field in the forwarded IP header should be calculated
    for two previously invalid combinations of incoming inner and outer headers, in
    order that these combinations may be usefully employed in future standards actions.
    \ It includes a thorough analysis of the reasoning for these changes and the implications.</p>"
