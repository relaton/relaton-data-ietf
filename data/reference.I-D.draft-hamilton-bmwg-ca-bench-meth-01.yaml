abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this document is to define a series of test scenarios
    which may be used to generate statistics that should help to better understand
    the performance of network devices under realistic loading conditions.  Additionally,
    this document provides suggestions on which statistics may be the most useful
    for determining network device performance under realistic deployment scenarios.</p>"
