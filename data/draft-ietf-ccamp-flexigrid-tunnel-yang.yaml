abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG model for managing flexi-grid optical\n   tunnels (media-channels), complementing the information provided by\n   the flexi-grid topology model.\n\n   The YANG data model defined in this document conforms to the Network\n   Management Datastore Architecture (NMDA).</p>"
