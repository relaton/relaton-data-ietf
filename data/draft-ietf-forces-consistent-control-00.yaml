- language: en
  script: Latn
  content: "<p>This document introduces a consistent control mechanism in the framework
    of Software Defined Network (SDN), which is one method to achieve forwarding and
    control element separation. In detail, this mechanism uses a centralized control
    element to control multiple forwarding elements.</p>"
