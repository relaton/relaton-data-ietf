abstract:
- language: en
  script: Latn
  content: "<p>Delay and disruption tolerant networks are a foundational component
    of Interplanetary Internet communications. This document will treat several methods
    and modes of operation of Mail Transfer Agents in concert with Bundle Protocol
    Agents which allow SMTP interoperability between discrete IP networks bridged
    by DTNs, via Application Layer Gateways.</p>"
