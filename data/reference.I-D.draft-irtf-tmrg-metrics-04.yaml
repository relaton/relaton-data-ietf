abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the metrics to be considered in an evaluation
    of new or modified congestion control mechanisms for the Internet. This includes
    metrics for the evaluation of new transport protocols, of proposed modifications
    to TCP, of application-level congestion control, and of Active Queue Management
    (AQM) mechanisms in the router. This document is intended to be the first in a
    series of documents aimed at improving the models that we use in the evaluation
    of transport protocols.</p>"
