abstract:
- language: en
  script: Latn
  content: "<p>This document is an attempt to consolidate terminology in the field
    privacy by data minimization.  It motivates and develops definitions for anonymity/identifiability,
    (un)linkability, (un)detectability, (un)observability, pseudonymity, identity,
    partial identity, digital identity and identity management.  Starting the definitions
    from the anonymity and unlinkability perspective and not from a definition of
    identity (the latter is the obvious approach to some people) reveals some deeper
    structures in this field.  Note: In absence of a separate discussion list please
    post your comments to the IETF SAAG mailing list and/or to the authors.  For information
    about that mailing list please take a look at https://www.ietf.org/mailman/listinfo/saag.</p>"
