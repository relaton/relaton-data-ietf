abstract:
- language: en
  script: Latn
  content: "<p>This documents defines the policy-type for federations within the Domain
    Policy DDDS Application. Using this policy-type domain-owners can announce their
    membership in a federation and thus their willingness to accept incoming communications
    according to the rules of that federation. Such federations can be used to establish
    selective peerings e.g. in the Voice over IP and Instant Messaging space.</p>"
