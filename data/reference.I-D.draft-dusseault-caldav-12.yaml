abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a set of methods, headers, message bodies,
    properties, and reports that define calendar access extensions to the WebDAV protocol.
    The new protocol elements are intended to make WebDAV-based calendaring and scheduling
    an interoperable standard that supports calendar access, calendar management,
    calendar sharing, and calendar publishing.</p>"
