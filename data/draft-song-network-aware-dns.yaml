abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework that extends the Domain Name System
    (DNS) to provide network awareness to applications. The framework enables DNS
    responses that depend on communication service requirements such as QoS or path,
    without changes to the format of DNS protocol messages or to application programming
    interfaces (APIs). The different enhancement methods and use cases are discussed.</p>"
  format: text/html
