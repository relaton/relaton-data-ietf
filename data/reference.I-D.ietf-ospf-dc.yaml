abstract:
- language: en
  script: Latn
  content: "<p>OSPF is a link-state intra-domain routing protocol used in IP networks.
    OSPF behavior over demand circuits is optimized in RFC1793 to minimize the amount
    of overhead traffic. A part of OSPF demand circuit extensions is the Hello suppression
    mechanism. This technique allows a demand circuit to go down when no interesting
    traffic is going through the link. However, it also introduces a problem, where
    it becomes impossible to detect a OSPF-inactive neighbor over such a link. This
    memo introduces a new mechanism called</p>"
