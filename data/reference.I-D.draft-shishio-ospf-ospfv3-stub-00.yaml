abstract:
- language: en
  script: Latn
  content: "<p>Open Shortest Path First for IPv6 has no transit capability,it is R-bit
    and V6-bit. The feature can avoid transit when the router does not ready to forward
    packets.This is very useful feature for operators.  But Stub Router advertisment
    is very popular operation method on Open Shortest Path First IPv4 enviroments.
    \ This document describe about OSPFv3 Stub Router Advertisemnt for easy to operate
    OSPFv2 and OSPFv3 dual stack environments.</p>"
