abstract:
- language: en
  script: Latn
  content: "<p>[I-D.peng-teas-network-slicing] defines a unified TN-slice identifier,
    AII(administrative instance identifier), to indicate the topology, computing,
    storage resources of the dedicated virtual network for both intra-domain and inter-domain
    network slicing scenarios.  This draft defines extensions to BGP-LS protocol in
    order to advertise the information of the transport slice.</p>"
