abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model for Segment Routing (SR)
       Policy Group that can be used for configuring, instantiating, and
       managing SR Policy groups.  The model is generic and applies equally
       to the MPLS and SRv6 instantiations of SR Policy groups.</p>
