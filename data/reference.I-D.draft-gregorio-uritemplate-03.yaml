abstract:
- language: en
  script: Latn
  content: "<p>A URI Template is a compact sequence of characters used for the construction
    of URIs.  This specification defines the URI Template syntax and the process for
    expanding a URI Template into a URI, along with guidelines and security considerations
    for the use of URI Templates on the Internet.  The URI Template syntax allows
    for the construction of strings that are a superset of URIs, allowing an implementation
    to process any URI Template without knowing the scheme-specific requirements of
    every possible resulting URI.</p>"
