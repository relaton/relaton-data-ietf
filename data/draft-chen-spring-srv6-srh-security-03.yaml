abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a method to protect SRH and IP header using
    signature which stored in the TLV, this scheme can apply to SRv6 and G-SRv6. By
    defining a new type of TLV which is used for signature protection based on asymmetric
    secret keys. Of course, we have designed the process of signature and verification,
    and tips for verifying optimization process.</p>"
