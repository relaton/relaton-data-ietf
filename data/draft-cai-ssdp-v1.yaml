abstract:
- language: en
  script: Latn
  content: "<p>The Simple Service Discovery Protocol (SSDP) provides a mechanism \nwhere
    by network clients, with little or no static configuration, \ncan discover network
    services. SSDP accomplishes this by providing \nfor multicast discovery support
    as well as server based notification \nand discovery routing.</p>"
