abstract:
- language: en
  script: Latn
  content: "<p>This document is a report from the IRTF HIP research group documenting
    the collective experiences and lessons learned from studies, related experimentation,
    and designs completed by the research group.  The documents summarizes implications
    of adding HIP to host protocol stacks, Internet infrastructure, and applications.
    The perspective of a network operator, as well as a list of HIP experiments, are
    presented as well.</p>"
