abstract:
- language: en
  script: Latn
  content: "<p>This document describes a use of the PIM Join Attribute as defined
    in draft-ietf-pim-join-attributes [RFC5384] which enables PIM to build multicast
    trees through an MPLS-enabled network, even if that network's IGP does not have
    a route to the source of the tree.</p>"
