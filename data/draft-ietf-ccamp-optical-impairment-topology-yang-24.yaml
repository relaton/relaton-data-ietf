abstract:
- language: en
  script: Latn
  content: "<p>Provisioning an optical connection requires that path continuity, resource
    availability, and impairment constraints be satisfied in order to determine viable
    paths through the network. This process is known as Impairment-Aware Routing and
    Wavelength Assignment (IA-RWA) in Wavelength Switched Optical Networks (WSONs)
    and as Impairment- Aware Routing and Spectrum Assignment (IA-RSA) in Spectrum
    Switched Optical Networks (SSONs). This document defines a YANG data model for
    impairment-aware Traffic Engineering (TE) topologies in optical networks. The
    model augments the technology-agnostic YANG data model for TE topologies and provides
    read-only topology information, including optical impairments. Such information
    can be used, for example, by a Path Computation Engine (PCE) to compute optically
    feasible paths prior to connection establishment.</p>"
