abstract:
- language: en
  script: Latn
  content: "<p>This document defines a protocol for provisioning session establishment
    data into Session Data Registries or SIP Service Provider data stores, data that
    may then be used by various network elements for session peering.  This document
    focuses on the Session Peering Provisioning Protocol used by clients to provision
    registries.  The document provides a set of guiding principles for the design
    of this protocol like extensibility and independent transport definitions, a basic
    data model that meets some of the requirements discussed in DRINKS and an early
    XML Schema Document.  Future revisions of this Internet-Draft will include a more
    complete definition of the Session Peering Provisioning Protocol and considerations
    and changes to make the protocol implementable using SOAP and RESTful Web Services.</p>"
