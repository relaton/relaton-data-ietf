abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to connect pseudo wires (PW) between two
    distinct PW control planes or PSN domains. The PW control planes may belong to
    independent autonomous systems, or the PSN technology is heterogeneous, or a PW
    might need to be aggregated at a specific PSN point. The PW packet data units
    are simply switched from one PW to another without changing the PW payload.</p>"
