abstract:
- language: en
  script: Latn
  content: <p>The Automatic Certificate Management Environment (ACME) [RFC8555] requires
    a PKCS#10 Certificate Signing Request (CSR) at the finalization stage. This document
    defines a new ACME challenge type, "pk-01", that allows a client to prove possession
    of a private key directly, without constructing a CSR. The primary motivation
    is to support key types that cannot generate CSR self-signatures, notably post-quantum
    Key Encapsulation Mechanism (KEM) keys. The client declares the public key via
    a popKey field in the "newOrder" request; the server attaches the "pk-01" challenge
    to existing identifier authorizations. When all required authorizations are satisfied,
    the ACME server issues a certificate using the validated public key and the authorized
    identifiers, eliminating the need for a CSR in the finalization stage.</p>
