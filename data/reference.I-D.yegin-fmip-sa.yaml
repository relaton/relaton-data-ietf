abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism to dynamically generate a security
    association between the mobile node and the FMIPv6 access router to secure the
    FMIPv6 protocol messages. The mechanism relies on generating a local security
    association based on the network access authentication.</p>"
