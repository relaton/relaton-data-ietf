- language: en
  script: Latn
  content: |-
    <p>This specification describes an all-purpose platform independent
    networking protocol for use to realize client/server (or similar)
    applications.
    User and administration messages are transformed into a special
    network format (see [SDXF]).
    This format is self-describing and cpu-independent.</p>
