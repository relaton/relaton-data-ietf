abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes to develop an open p2p streaming protocol, namely
    PPSP. We survey the current practice of p2p streaming applications, analyze the
    incentive to develop PPSP and its applying scenarios. Then we introduce the PPSP
    interaction process and state the problem of PPSP and its scope. In the last section
    we also analyze the relationship between PPSP and P2PSIP as well as RTSP.</p>"
