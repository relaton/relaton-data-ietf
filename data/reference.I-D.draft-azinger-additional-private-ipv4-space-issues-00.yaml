abstract:
- language: en
  script: Latn
  content: "<p>When a private network or internetwork grows very large it is sometimes
    not possible to address it using private IPv4 address space.  This document describes
    the problems faced by those networks, the available options and the issues involved
    in assigning a new block of private IPv4 address space.</p>"
