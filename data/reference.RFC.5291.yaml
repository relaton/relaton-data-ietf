- language: en
  script: Latn
  content: "<p>This document defines a BGP-based mechanism that allows a BGP speaker
    to send to its BGP peer a set of Outbound Route Filters (ORFs) that the peer would
    use to constrain/filter its outbound routing updates to the speaker.  [STANDARDS-TRACK]</p>"
