abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces the capability to forward 6LoWPAN fragments.
       This method reduces the latency and increases end-to-end reliability
       in route-over forwarding.  It is the companion to using virtual
       reassembly buffers which is a pure implementation technique.</p>
