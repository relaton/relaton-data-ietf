abstract:
- language: en
  script: Latn
  content: "<p>This document describes an Internet Registry Information Service (IRIS)
    registry schema for registered DNS information.  The schema extends the necessary
    query and result operations of IRIS to provide the functional information service
    needs for syntaxes and results used by domain registries and registrars.  [STANDARDS-TRACK]</p>"
