abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a method to allow DNS operators to more
       easily update DNSSEC Key Signing Keys using the DNS as communication
       channel.  The technique described is aimed at delegations in which it
       is currently hard to move information from the child to parent.</p>
