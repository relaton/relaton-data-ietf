- language: en
  script: Latn
  content: "<p>This document describes the key consistency and correctness requirements
    of protocols such as Privacy Pass, Oblivious DoH, and Oblivious HTTP for user
    privacy. It discusses several mechanisms and proposals for enabling user privacy
    in varying threat models. In concludes with discussion of open problems in this
    area.</p>"
