abstract:
- language: en
  script: Latn
  content: "<p>This document defines two alternate methods for the support of GMPLS
    Asymmetric Bandwidth Bidirectional LSPs. One method is Ethernet specific the other
    method is generic and applicable to any switching technology. The objective of
    this document is aid the working group in selecting one of these two methods,
    and to fully define the mechanisms for the selected method. [Note: this is an
    in-progress version of the draft.]</p>"
