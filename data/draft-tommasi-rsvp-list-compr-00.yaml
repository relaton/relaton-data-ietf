  script: Latn
  content: "<p>This document describes a simple method for compressing lists of Message_Identifiers
    contained in MESSAGE_ID_LIST objects of the RSVP protocol, as defined in [RSVP2205]
    and [Berger2000]. This method helps to alleviate the scaling problem of the RSVP
    protocol.</p>"
