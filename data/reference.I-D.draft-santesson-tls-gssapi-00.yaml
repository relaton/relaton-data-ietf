abstract:
- language: en
  script: Latn
  content: "<p>This document defines protocol extensions to the Transport Layer Security
    (TLS) protocol for user authentication and key negotiation based on the Generic
    Security Service Application Program Interface (GSS-API). Full flexibility for
    negotiation of GSS-API mechanisms is provided, allowing use of arbitrary GSS-API
    mechanisms provided that they support the GSS-API PRF. This document supersedes
    RFC 2712 [ref] as the mechanism to support Kerberos based authentication and key
    establishment for a TLS session.</p>"
