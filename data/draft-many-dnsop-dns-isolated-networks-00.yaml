abstract:
- language: en
  script: Latn
  content: "<p>This document lists operational methods to enable local DNS name resolving
    on an isolated network, where that network have intermittent reachability to Internet
    and/or have very long delays, disabling the real-time query and response flow
    to the authoritative name servers on Internet.</p>"
