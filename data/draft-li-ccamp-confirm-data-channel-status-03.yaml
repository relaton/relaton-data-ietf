- language: en
  script: Latn
  content: <p>This document defines simple additions to the Link Management Protocol
    (LMP) to provide a control plane tool that can assist in the location of stranded
    resources by allowing adjacent LSRs to confirm Li Expires August 2008 [page 1]
    draft-li-ccamp-confirm-data-channel-status-03.txt February 2008 data channel statuses,
    and provides triggers for notifying the management plane if any discrepancies
    are found. Conventions used in this document The key words "MUST", "MUST NOT",
    "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY",
    and "OPTIONAL" in this document are to be interpreted as described in [RFC2119].</p>
