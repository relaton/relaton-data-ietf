abstract:
- language: en
  script: Latn
  content: "<p>This document defines an IPFIX Information Element for classifying
    flow-level discards that aligns with the information model defined in [I-D.ietf-opsawg-discardmodel].
    The flowDiscardClass Information Element provides consistent classification of
    packet discards across IPFIX implementations, enabling correlation between device,
    interface and control-plane discards and the impacted flows.</p>"
