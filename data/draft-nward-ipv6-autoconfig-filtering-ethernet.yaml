abstract:
- language: en
  script: Latn
  content: "<p>Many ethernet switch vendors provide features for filtering IPv4 address
    assignment services - i.e. DHCP, Bootp. This document describes what is necessary
    for a switch to provide the same level of filtering for IPv6, as a standard on
    which operators can base equipment selection decisions.</p>"
