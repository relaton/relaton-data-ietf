abstract:
- language: en
  script: Latn
  content: "<p>This document proposed an extension to OSPF Router Information LSA
    [LINDEM1] to distribute selected information about BGP process on a router to
    other routers in the same area or in the same domain. Such information is required
    for network based auto discovery of IBGP peers as described in [IBGP-AM].</p>"
