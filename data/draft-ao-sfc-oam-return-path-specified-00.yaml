abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the Service Function Chain (SFC)
    Operation, Administration and Maintenance (OAM) that enable control of the Echo
    Reply return path by specifying it as Reverse Service Function Path. Enforcing
    the specific return path can be used to verify bidirectional connectivity of SFC
    and increase robustness of SFC OAM.</p>"
