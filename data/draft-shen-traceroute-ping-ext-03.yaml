abstract:
- language: en
  script: Latn
  content: "<p>This document specifies extensions to traceroute and ping techniques
    to facilitate addition application information to be carried in UDP, TCP and ICMP
    traceroute probe messages and ICMP echo request and reply messages. This proposal
    also allows the receiver to authenticate the source of the traceroute and ping
    senders.</p>"
