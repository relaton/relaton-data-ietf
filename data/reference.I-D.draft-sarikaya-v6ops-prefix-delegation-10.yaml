abstract:
- language: en
  script: Latn
  content: "<p>As interest on IPv6 deployment is increasing in cellular networks several
    migration issues are being raised and IPv6 prefix management is the one addressed
    in this document.  Based on the idea that DHCPv6 servers can manage prefixes,
    we address prefix management issues such as the access router offloading delegation
    and release tasks of the prefixes to a DHCPv6 server using DHCPv6 Prefix Delegation.
    \ The access router first requests a prefix for an incoming mobile node from the
    DHCPv6 server.  The access router may next do stateless or stateful address allocation
    to the mobile node, e.g. with a Router Advertisement or using DHCP.  We also describe
    prefix management using Authentication Authorization and Accounting servers.</p>"
