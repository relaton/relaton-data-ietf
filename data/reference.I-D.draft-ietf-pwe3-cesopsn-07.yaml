  script: Latn
  content: "<p>This document describes a method for encapsulating structured (NxDS0)
    Time Division Multiplexed (TDM)signals as pseudo-wires over packet- switching
    networks (PSN). In this regard, it complements similar work for structure-agnostic
    emulation of TDM bit-streams [PWE3-SAToP].</p>"
