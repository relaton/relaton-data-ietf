abstract:
- language: en
  script: Latn
  content: "<p>This document provides common terminology and metrics for benchmarking
    the performance of sub-IP layer protection mechanisms. The performance benchmarks
    are measured at the IP-Layer, avoiding dependence on specific sub-IP protection
    mechanisms. The benchmarks and terminology can be applied in methodology documents
    for different sub-IP layer protection mechanisms such as Automatic Protection
    Switching (APS), Virtual Router Redundancy Protocol (VRRP), Stateful High Availability
    (HA), and Multi-Protocol Label Switching Fast Reroute (MPLS-FRR).</p>"
