- language: en
  script: Latn
  content: "<p>There are scenarios that require two or more LSPs or segments of LSPs
    to follow same route in the network. This document specifies methods to communicate
    route inclusions along the loose hops during path setup using the Resource ReserVation
    Protocol-Traffic Engineering (RSVP-TE) protocol.</p>"
