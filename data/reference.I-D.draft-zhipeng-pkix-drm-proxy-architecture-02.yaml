- language: en
  script: Latn
  content: "<p>This document specifies a method and its architecture for proxy application
    based on the PKI environment with X.509 certificate [X.509].  As a typical application,
    this method can be used on DRM service regardless the specific DRM standard which
    is implemented on the interface between the Client Device and Service Server.</p>"
