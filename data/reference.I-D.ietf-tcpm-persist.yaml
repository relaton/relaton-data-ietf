abstract:
- language: en
  script: Latn
  content: "<p>This document clarifies the Zero Window Probes (ZWP) described in Requirements
    for Internet Hosts [RFC1122].  In particular, it clarifies the actions that can
    be taken on connections which are experiencing the ZWP condition.  This draft
    clarifies what has been till now a misinterpretation of the standard as specified
    in RFC 1122 [RFC1122] rather than making a change to the standard.</p>"
