abstract:
- language: en
  script: Latn
  content: "<p>This document describes a solution in which the control plane protocol
    specified in BGP/MPLS IP VPNs [RFC4364] is used to provide a Virtual Network service
    to end-systems. These end-systems may be used to provide network services or may
    directly host end-to-end applications.</p>"
