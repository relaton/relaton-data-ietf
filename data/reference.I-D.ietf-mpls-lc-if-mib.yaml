- language: en
  script: Latn
  content: "<p>This memo defines two MIB modules and corresponding MIB Object Definitions
    that describe how label switching controlled Frame-Relay and ATM interfaces can
    be managed given the interface stacking as defined in the MPLS-LSR-STD-MIB and
    MPLS-TE-STD-MIB.</p>"
