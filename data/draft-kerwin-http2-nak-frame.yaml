abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension to the Hypertext Transfer Protocol\n   Version 2 (HTTP/2) that allows an endpoint to signal to its peer that\n   an unsupported extension frame was discarded.\n\nNote to Readers\n\n   The issues list for this draft can be found at\n   &lt;https://github.com/phluid61/internet-drafts/labels/\n   HTTP%2F2%20NAK%20Frame&gt;\n\n   The most recent (often unpublished) draft is at\n   &lt;https://phluid61.github.io/internet-drafts/http2-nak-frame/&gt;</p>"
