abstract:
- language: en
  script: Latn
  content: "<p>This document provides YANG data models to access to and control CMIS
    for controlling pluggable Digital Coherent Optics transceivers equipped in a router
    or a switch from outside. CMIS has custom pages which enables to be defined by
    the module vendor for its own usage, and allows to extend the uses of the optics
    devices. These YANG modules also allow the utilization of CMIS custom pages as
    a generic control mechanism.</p>"
