abstract:
- language: en
  script: Latn
  content: "<p>The Security Architecture for the Internet Protocol [RFC4301] describes
    security services for traffic at the IP layer. That architecture primarily defines
    services for Internet Protocol (IP) unicast packets, as well as manually configured
    IP multicast packets. This document further defines the security services for
    manually and dynamically keyed IP multicast packets within that Security Architecture.</p>"
