abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a general, umbrella use case that illustrates
    application layer traffic optimization with software defined networks. Unique
    requirements for design and operations are identified and summarized. Under this
    umbrella, this draft also elaborates three detailed use cases. In addition, extensions
    to the existing ALTO protocol are recommended.</p>"
