abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Agent Interaction &amp; Delegation Protocol
    (AIDP), a control-plane protocol for secure, auditable, and interoperable software
    agents. AIDP defines standardized mechanisms for expressing intent, enforcing
    authority, delegating capabilities, executing actions, and binding execution results
    to agent reasoning across heterogeneous systems and administrative domains. This
    version introduces a normative Intent Lifecycle Model, including Human Approval
    Gates and support for long-running agent executions, defines version negotiation
    and capability discovery, clarifies the relationship of AIDP to the Model Context
    Protocol (MCP) and the Agent2Agent (A2A) protocol, and establishes extensibility
    registries. Non-normative deployment material has been moved to informative appendices.</p>"
