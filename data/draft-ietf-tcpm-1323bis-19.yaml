abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a set of TCP extensions to improve performance
    over paths with a large bandwidth * delay product and to provide reliable operation
    over very high-speed paths. It defines the TCP Window Scale (WS) option and the
    TCP Timestamps (TS) option and their semantics. The Window Scale option is used
    to support larger receive windows, while the Timestamps option can be used for
    at least two distinct mechanisms, PAWS (Protection Against Wrapped Sequences)
    and RTTM (Round Trip Time Measurement), that are also described herein. This document
    obsoletes RFC1323 and describes changes from it.</p>"
