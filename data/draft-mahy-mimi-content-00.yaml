abstract:
- language: en
  script: Latn
  content: "<p>This document describes content semantics common in Instant Messaging
    (IM) systems and describes an example profile suitable for instant messaging interoperability
    of messages end-to-end encrypted inside the MLS (Message Layer Security) Protocol.
    It adapts prior work (CPIM) to work well in the MLS context.</p>"
