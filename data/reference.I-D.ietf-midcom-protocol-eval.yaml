abstract:
- language: en
  script: Latn
  content: "<p>This document provides an evaluation of the applicability of SNMP,
    RSIP, MEGACO, DIAMETER and COPS as the MIDCOM protocol. A summary of each of the
    proposed protocols against the MIDCOM requirements and MIDCOM framework is provided.
    Compliancy of each of the protocols against each requirement is detailed. A conclusion
    summarizes how each of the protocols fares in the evaluation.</p>"
