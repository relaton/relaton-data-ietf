abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the identifier to be used on IP packets
    for a new network service called low latency, low loss and scalable throughput
    (L4S).  It is similar to the original (or 'Classic') Explicit Congestion Notification
    (ECN).  'Classic' ECN marking was required to be equivalent to a drop, both when
    applied in the network and when responded to by a transport.  Unlike 'Classic'
    ECN marking, for packets carrying the L4S identifier, the network applies marking
    more immediately and more aggressively than drop, and the transport response to
    each mark is reduced and smoothed relative to that for drop.  The two changes
    counterbalance each other so that the throughput of an L4S flow will be roughly
    the same as a non-L4S flow under the same conditions.  Nonetheless, the much more
    frequent control signals and the finer responses to them result in ultra-low queuing
    delay (sub-millisecond) for L4S traffic without compromising link utilization,
    and this low delay can be maintained during high traffic load.  The L4S identifier
    defined in this document is the key piece that distinguishes L4S from TCP-Reno-Friendly
    (or 'Classic') traffic.  It gives an incremental migration path so that suitably
    modified network bottlenecks can distinguish and isolate existing Classic traffic
    from L4S traffic to prevent it from degrading the ultra-low queuing delay and
    loss of the new scalable transports, without harming Classic performance.  Examples
    of new active queue management (AQM) marking algorithms and examples of new transports
    (whether TCP-like or real- time) are specified separately.</p>"
