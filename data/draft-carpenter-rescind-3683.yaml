abstract:
- language: en
  script: Latn
  content: "<p>This document restores the previous option of finite posting rights
    suspensions authorized by an Area Director. It also abolishes the existing form
    of indefinite Posting Rights Action. It obsoletes RFC 3683 and RFC 3934, and updates
    RFC 2418.</p>"
