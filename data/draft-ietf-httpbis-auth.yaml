  content: |-
    <p>The Hypertext Transfer Protocol (HTTP) is a stateless application-
       level protocol for distributed, collaborative, hypermedia information
       systems.  This document formerly defined the HTTP Authentication
       framework, which has since been moved to the core HTTP Semantics
       document.</p>
