abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a practical work for Peer-to-Peer (P2P) SIP
    system based on Distributed Service Network (DSN), which was proposed by China
    Mobile in ITU-T. In this document, it introduces some key problem of carrier grade
    P2PSIP VoIP system. Then it gives a brief introduction on DSN VoIP system and
    especially discusses some key technologies aimed at those mentioned problems.
    At last, it presents some validation works for those technologies.</p>"
