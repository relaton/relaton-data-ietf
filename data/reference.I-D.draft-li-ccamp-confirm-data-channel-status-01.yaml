abstract:
- language: en
  script: Latn
  content: "<p>This document defines simple additions to the Link Management Protocol
    (LMP) to provide a control plane tool that can assist in the location of stranded
    resources by allowing adjacent LSRs to confirm data channel statuses, and provides
    triggers for notifying the management plane if any discrepancies are found.</p>"
