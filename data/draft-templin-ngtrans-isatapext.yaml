abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an optional extension for [ISATAP] that sup-
    ports fast convergence (i.e, fast discovery of on-link routers). The extension
    employs a subset of the multicast mechanisms specified by [6OVER4] to augment
    the NBMA mechanisms specified by [ISATAP].</p>"
