- language: en
  script: Latn
  content: |-
    <p>This document introduces two key exchange algorithms based on
       Pairing-Based Cryptography (PBC) for the Transport Layer Security
       (TLS) protocol. In particular, it specifies the use of two identity-
       based key exchange algorithms for the TLS handshake.</p>
