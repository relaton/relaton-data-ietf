- language: en
  script: Latn
  content: "<p>This document describes conventions for using the Session Description
    Protocol (SDP) described in RFC 2327 for controlling ATM Bearer Connections, and
    any associated ATM Adaptation Layer (AAL).  The AALs addressed are Type 1, Type
    2 and Type 5.  [STANDARDS-TRACK]</p>"
