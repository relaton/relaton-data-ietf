abstract:
- language: en
  script: Latn
  content: "<p>48-bit Extended Unique Identifiers (EUI-48) and 64-bit Extended Unique
    Identifiers (EUI-64) are address formats specified by the IEEE for use in various
    layer-2 networks, e.g. ethernet.  This document defines two new DNS resource record
    types, EUI48 and EUI64, for encoding ethernet addresses in the DNS.</p>"
