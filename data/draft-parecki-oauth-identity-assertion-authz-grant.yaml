abstract:
- language: en
  script: Latn
  content: "<p>This specification provides a mechanism for an application to use an\n   identity assertion to obtain an access token for a third-party API by\n   coordinating through a common enterprise identity provider using\n   Token Exchange [RFC8693] and JWT Profile for OAuth 2.0 Authorization\n   Grants [RFC7523].</p>"
