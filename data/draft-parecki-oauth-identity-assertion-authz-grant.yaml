abstract:
- language: en
  script: Latn
  content: "<p>This specification provides a mechanism for an application to use an
    identity assertion to obtain an access token for a third-party API by coordinating
    through a common enterprise identity provider using Token Exchange [RFC8693] and
    JWT Profile for OAuth 2.0 Authorization Grants [RFC7523].</p>"
