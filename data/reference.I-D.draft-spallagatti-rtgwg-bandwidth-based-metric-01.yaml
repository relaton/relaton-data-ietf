- language: en
  script: Latn
  content: "<p>This document describes a method to group multiple interfaces and assign
    metric to that group based on the cumulative bandwidth of all the interfaces in
    that group.  Each link in a group takes same group metric irrespective of its
    own bandwidth.</p>"
