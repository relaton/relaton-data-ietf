abstract:
- language: en
  script: Latn
  content: "<p>This document presents the concept and practice of the prefix- specific
    and stateless address mapping mechanism (IVI) for IPv4/IPv6 coexistence and transition.
    \ In this scheme, subsets of the IPv4 addresses are embedded in prefix-specific
    IPv6 addresses and these IPv6 addresses can therefore communicate with the global
    IPv6 networks directly and can communicate with the global IPv4 networks via stateless
    (or almost stateless) gateways.  The IVI scheme supports the end-to-end address
    transparency, incremental deployment and performance optimization in multi-homed
    environment.  This document is a comprehensive report on the IVI design and its
    deployment in large scale public networks.  Based on the IVI scenario, the corresponding
    address allocation and assignment policies are also proposed.</p>"
