abstract:
- language: en
  script: Latn
  content: "<p>Parallel NFS (pNFS) extends Network File Sharing version 4 (NFSv4)
    to allow client to directly access file data on the storage used by the NFSv4
    server.  This ability to bypass the server for data access can increase both performance
    and parallelism, but requires additional client functionality for data access,
    some of which is dependent of the class of storage used.  The published protocol
    for block layout file systems describes how clients can recognize the volumes
    used for pNFS storage, but only after communicating with the server.  This document
    proposes a mechanism by which clients can recognize block storage devices used
    by pNFS file systems, without having to communicate with the server, and therefore
    allows the clients to limit access to the devices at client boot time.</p>"
