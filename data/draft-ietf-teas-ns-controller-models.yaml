abstract:
- language: en
  script: Latn
  content: "<p>This document describes an approach for structuring the IETF Network
    Slice Controller as well as how to use different data models being defined for
    IETF Network Slice Service provision (and how they are related). It is not the
    purpose of this document to standardize or constrain the implementation of the
    IETF Network Slice Controller.</p>"
