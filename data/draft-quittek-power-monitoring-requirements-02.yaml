abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses requirements for energy management, particularly
    for monitoring energy consumption and controlling power states of managed devices.
    This memo further shows that existing IETF standards are not sufficient for energy
    management and that energy management requires architectural considerations that
    are diffenrent from common other management functions.</p>"
