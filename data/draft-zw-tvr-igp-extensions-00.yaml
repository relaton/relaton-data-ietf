abstract:
- language: en
  script: Latn
  content: "<p>TVR needs IGP to calculate different results depending on the time,
    without convergence after the detection of link or nodes. IGP nodes need to learn
    the predictable and scheduled changes in advance. This document defines the IGP
    extensions for predictable and scheduled changes of TVR.</p>"
