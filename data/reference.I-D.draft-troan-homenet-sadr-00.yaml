- language: en
  script: Latn
  content: "<p>A multihomed network using provider aggregatable addresses must send
    the packet out the right path to avoid violating the provider's ingress filtering.
    \ This memo suggests a mechanism called Source Address Dependent Routing to solve
    that problem.</p>"
