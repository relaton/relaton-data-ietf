abstract:
- language: en
  script: Latn
  content: "<p>This document presents various options to help provide deployment direction
    to those whose networks will be upgraded to an SRv6 environment. Whether the existing
    network is IPv4, IPv6, MPLS, SR- MPLS or other, this draft provides direction
    on how to seemlessly upgrade to SRv6.</p>"
