abstract:
- language: en
  script: Latn
  content: "<p>This document creates a generic way for Internet Key Exchange (IKEv2)
    to use any of the symmetric secure password authentication methods. There are
    multiple methods already specified in other documents and this document does not
    add new one.  This document specifies a way to agree on which method is to be
    used in current connection.  This document also provides a common way to transmit
    secure password authentication method specific payloads between peers.</p>"
