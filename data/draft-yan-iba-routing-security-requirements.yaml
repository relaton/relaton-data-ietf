abstract:
- language: en
  script: Latn
  content: "<p>This document specifies security requirements for intent-based agent\n   routing.  It defines a security architecture, phase-specific attack\n   surface analysis, and normative protections for the Registration,\n   Resolution, and Dispatch phases of routing.  It also describes a\n   secure operational process and an annotated interaction flow for\n   protecting routing decisions, intent privacy, and capability\n   integrity.\n\n   Intent-based routing enables autonomous agents to collaborate based\n   on semantic intent rather than static addresses, but this model\n   introduces new security risks beyond those addressed by traditional\n   channel protection and endpoint authentication.  Existing mechanisms\n   such as Transport Layer Security (TLS) and Public Key Infrastructure\n   (PKI) verify identity and protect transport, but do not constrain\n   what an agent claims to be capable of, nor do they protect the\n   semantic content of intent queries during routing.  This document\n   establishes requirements to mitigate these risks and provides a\n   comprehensive security framework for intent-based agent networks.</p>"
