abstract:
- language: en
  script: Latn
  content: "<p>The multiple care-of addresses registration protocol [1] maintains
    at the same time multiple virtual paths with its home agent or correspondent nodes.
    This document provides a policy data set for flow distribution among the multiple
    paths. The flow distribution policy defines how packets are forwarded from and
    to the mobile node by using the multiple paths.</p>"
