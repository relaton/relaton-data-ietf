abstract:
- language: en
  script: Latn
  content: "<p>The CAPWAP problem statement [3] describes a problem that needs to
    be addressed before a wireless LAN (WLAN) network designer can construct a solution
    composed of Wireless Termination Points (WTP) and Access Controllers (AC) from
    multiple, different vendors.  One of the primary goals is to find a solution that
    solves the interoperability between the two classes of devices (WTPs and ACs)
    which then enables an AC from one vendor to control and manage a WTP from another.</p>"
