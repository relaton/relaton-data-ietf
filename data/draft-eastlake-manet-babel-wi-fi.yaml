abstract:
- language: en
  script: Latn
  content: "<p>The BABEL routing protocol (RFC 8966) is well applicable (RFC 8967)
    to networks with unstable link metrics such as wireless networks. Wi-Fi (IEEE
    Std 802.11-2024) is an example of such a network and the Wi-Fi standard includes
    a mesh feature which was specified to be configurable for different routing protocols
    and link metrics. This document specifies how, in Wi-Fi mesh, to use BABEL and/or
    the delay based link metric specified in RFC 9616.</p>"
