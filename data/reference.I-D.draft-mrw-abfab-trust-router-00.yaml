abstract:
- language: en
  script: Latn
  content: "<p>A Trust Router is an infrastucture element used to construct multihop
    Application Bridging for Federated Authentication Beyond the Web (ABFAB) federations,
    as discussed in draft-mrw-abfab-multihop-fed-01.txt.  This document defines both
    the Trust Router Protocol and the Trust Path Query, as discussed in the multihop
    federation document.</p>"
