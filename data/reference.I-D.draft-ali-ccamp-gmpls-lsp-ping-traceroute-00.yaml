  script: Latn
  content: <p>"Detecting Multi-Protocol Label Switched (MPLS) Data Plane Failures,"
    RFC4379, describes procedures for ping and traceroute for LSPs that traverse a
    Packet Switch Capable (PSC) network. These procedures are known as Label Switched
    Path Ping (LSP Ping).</p>
