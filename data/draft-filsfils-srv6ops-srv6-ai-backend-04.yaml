abstract:
- language: en
  script: Latn
  content: "<p>This document describes how SRv6 uSID (NEXT-CSID) enables deterministic
    path placement in AI backend fabrics through L3-L4 integration: the transport
    stack on the NIC encodes each path as an ordered list of segments (a uSID network
    program) in the packet header, while the fabric forwards statelessly. It explains
    operational benefits including deterministic probing and alignment with hyperscale
    production deployments.</p>"
