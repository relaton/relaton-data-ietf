abstract:
- language: en
  script: Latn
  content: "<p>IP Virtual Private Networks (VPNs) provide connectivity between sites
    across an IP backbone. These VPNs can be supported using BGP/MPLS and the connections
    can be created by using MPLS Traffic Engineered (TE) Label Switched Paths (LSPs).
    \ In order to support multiple MPLS-TE based BGP/MPLS IP-VPNs that are interconnected
    via the same Provider Edge (PE) routers, new RSVP extensions are required. This
    document outlines the requirements and proposes a solution for interconnecting
    multiple BGP/IP-VPNs via the same Provider Edge router.</p>"
