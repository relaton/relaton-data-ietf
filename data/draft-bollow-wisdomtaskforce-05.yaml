  content: <p>This memo calls for the creation of a new governance forum named "Wisdom
    Task Force" (WisdomTF). The main purpose of the WisdomTF is to facilitate consensus-seeking
    strategy-oriented discussions regarding governance actions that may be decided
    by national parliaments.</p>
