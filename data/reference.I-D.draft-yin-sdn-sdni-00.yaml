abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes a protocol SDNi for the interface between Software
    Defined Networking (SDN) domains to exchange information between the domain SDN
    Controllers.  It defines the concept of a SDN domain; its need, what are its components
    and how SDNi helps in inter domain communication.</p>"
