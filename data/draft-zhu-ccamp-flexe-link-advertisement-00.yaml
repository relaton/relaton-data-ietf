- language: en
  script: Latn
  content: "<p>This document specifies the extensions to the IS-IS routing protocol
    to carry and flood Flex Ethernet (FlexE) link state information. The FlexE link
    state information is necessary for a node or a controller to compute a path that
    is required to over FlexE links.</p>"
