abstract:
- language: en
  script: Latn
  content: "<p>AI agents are increasingly expected to communicate across platforms,\n   organizations, clouds, edge environments, and administrative domains.\n   Current agent-related mechanisms mainly focus on description,\n   discovery, identity, authentication, authorization, tool invocation,\n   and application-layer collaboration.  These mechanisms are important,\n   but they often treat the IP network as a transparent connectivity\n   substrate.\n\n   This document describes networking problems that arise when AI agents\n   perform cross-domain communication and continuous tool, API, data,\n   and agent-to-agent calls.  It focuses on problem description rather\n   than a protocol solution.  In particular, it discusses gaps related\n   to agent identity visibility at the network layer, path control,\n   audit continuity, the separation of discovery from addressing and\n   authorization, and privacy and privilege risks introduced by highly\n   autonomous agents.\n\n   The document positions Agent6 as a problem space for network support\n   of cross-domain AI agent collaboration.  It does not define a new\n   agent discovery protocol, a new application-layer collaboration\n   protocol, a new authentication or authorization mechanism, or a new\n   IPv6 extension header.</p>"
