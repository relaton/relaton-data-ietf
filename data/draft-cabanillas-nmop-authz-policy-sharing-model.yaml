abstract:
- language: en
  script: Latn
  content: "<p>This document defines mechanisms and conventions for the representation,
    lifecycle management, and distribution of authorization policies in distributed
    and automated environments. It specifies a consistent, machine-readable, and interoperable
    framework that enables policies to be validated, exchanged, and removed across
    heterogeneous systems and areas. The framework defines how authorization policies,
    expressed in declarative Policy-as-Code (PaC) languages, are encapsulated, managed,
    and distributed using YANG as the canonical representation format. This separation
    allows independent evolution of policy languages, enforcement architectures, and
    trust models. The model also defines extensible Policy-as-Code language identities
    using YANG identity and identityref mechanisms, enabling future policy languages
    to be incorporated without modifying the core schema.</p>"
