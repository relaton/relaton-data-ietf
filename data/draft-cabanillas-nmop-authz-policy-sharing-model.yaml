abstract:
- language: en
  script: Latn
  content: "<p>This document defines mechanisms and conventions for the\n   representation, lifecycle management, and distribution of\n   authorization policies in distributed and automated environments.  It\n   specifies a consistent, machine-readable, and interoperable framework\n   that enables policies to be validated, exchanged, and removed across\n   heterogeneous systems and areas.\n\n   The framework defines how authorization policies, expressed in\n   declarative Policy-as-Code (PaC) languages, are encapsulated,\n   managed, and distributed using YANG as the canonical representation\n   format.  This separation allows independent evolution of policy\n   languages, enforcement architectures, and trust models.\n\n   The model also defines extensible Policy-as-Code language identities\n   using YANG identity and identityref mechanisms, enabling future\n   policy languages to be incorporated without modifying the core\n   schema.</p>"
