- language: en
  script: Latn
  content: "<p>This document describes a RTP profile for transporting generic media
    packet properties using bits in the RTP payload type RTP header field. One typical
    usage of this profile is for the transport of MPEG-4 but the scheme is general
    enough to be suitable for many media streams.</p>"
