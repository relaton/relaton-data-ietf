abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a way for the parties in the Transport Layer
    Security (TLS) protocol to indicate that an individual session ticket can be used
    to perform resumption even if the Server Name of the new connection does not match
    the Server Name of the original.</p>"
