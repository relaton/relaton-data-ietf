abstract:
- language: en
  script: Latn
  content: "<p>This is an informational document describing issues and comparing general
    advantages and disadvantages of various approaches to extending TRILL (Transparent
    Interconnection of Lot of Links) to use multilevel IS-IS (Intermediate System
    to Intermediate System) routing to improve TRILL's scalability.</p>"
