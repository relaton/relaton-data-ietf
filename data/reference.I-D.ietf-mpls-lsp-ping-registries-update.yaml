abstract:
- language: en
  script: Latn
  content: <p>This document updates RFC 8029 and RFC 8611 which both define IANA registries
    for MPLS Label Switched Path (LSP) Ping, in particular the registration procedure
    "Private Use" (esarlier know as "Vendor Private Use") is changed to "First Come,
    First Served" the TLV and Sub-TLV Registries.</p>
- language: en
  script: Latn
  content: <p>It also updates the description of the procedures for the responses
    sent when an unknown or erroneous code point is found.  The updates are to clarify
    and align this namespace with recent developments, e.g. the updates to " Guidelines
    for Writing an IANA Considerations Section in RFCs" (e.g.  RFC 8126), instead
    of the terminology from the obsoleted RFC 5226.</p>
