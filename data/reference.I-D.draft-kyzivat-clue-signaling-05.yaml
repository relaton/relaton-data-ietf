abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how signaling is conducted in the course of
    CLUE sessions.  This includes how SIP/SDP signaling is applied to CLUE sessions
    as well as defining a CLUE-specific signaling protocol that complements SIP/SDP
    and supports negotiation of CLUE application level data.</p>"
