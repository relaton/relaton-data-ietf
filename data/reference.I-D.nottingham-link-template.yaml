abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the Link-Template HTTP header field, providing
    a means for describing the structure of a link between two resources, so that
    new links can be generated.  Note to Readers  The issues list can be found at
    https://github.com/mnot/I-D/labels/ link-template .  The most recent (often, unpublished)
    draft is at https://mnot.github.io/I-D/link-template/ .  Recent changes are listed
    at https://github.com/mnot/I-D/commits/gh- pages/link-template .</p>"
