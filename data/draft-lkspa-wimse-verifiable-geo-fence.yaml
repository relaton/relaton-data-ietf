title:
- language: en
  script: Latn
  content: Privacy Preserving Verifiable Geofencing with Residency Proofs for Sovereign Workloads
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-lkspa-wimse-verifiable-geo-fence-04
