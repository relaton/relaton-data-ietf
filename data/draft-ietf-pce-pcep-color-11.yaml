abstract:
- language: en
  script: Latn
  content: "<p>Color is a 32-bit numerical (unsigned integer) attribute that is used
    to associate a Traffic Engineering (TE) tunnel or policy with an intent or objective
    (e.g., low latency). This document specifies extensions to Path Computation Element
    Protocol (PCEP) to carry the color attribute.</p>"
