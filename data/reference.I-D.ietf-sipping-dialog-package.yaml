abstract:
- language: en
  script: Latn
  content: "<p>This document defines a dialog event package for the SIP Events architecture,
    along with a data format used in notifications for this package. The dialog package
    allows users to subscribe to another user, an receive notifications about the
    changes in state of INVITE initiated dialogs that the user is involved in.</p>"
