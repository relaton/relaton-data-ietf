abstract:
- language: en
  script: Latn
  content: <p>This document describes how Segment Routing (SR) policies can be used
    to satisfy the requirements for strict bandwidth guarantees, end-to- end recovery
    and persistent paths within a segment routing network. SR policies satisfying
    these requirements are called "circuit-style" SR policies (CS-SR policies).</p>
