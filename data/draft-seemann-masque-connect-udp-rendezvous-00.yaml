- language: en
  script: Latn
  content: "<p>This document defines an Extended CONNECT protocol for relaying UDP
    between two clients authenticated by the same proxy. A Listener registers with
    the proxy, and a Client uses the resulting Rendezvous ID to connect to it. No
    public UDP address is allocated.</p>"
