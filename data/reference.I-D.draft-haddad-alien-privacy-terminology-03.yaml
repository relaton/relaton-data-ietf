abstract:
- language: en
  script: Latn
  content: "<p>This memo introduces terminology for the main privacy aspects.  The
    prime goal is to avoid situations where different interpretations of the same
    key privacy aspects result in different requirements when designing specific solutions,
    thus leading to an unnecessary confusion.</p>"
