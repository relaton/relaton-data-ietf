abstract:
- language: en
  script: Latn
  content: "<p>This document specifies extensions to the Kerberos PKINIT pre- authentication
    mechanism [RFC4556] [RFC8636] to support post-quantum key establishment using
    the Module-Lattice-Based Key-Encapsulation Mechanism (ML-KEM) algorithms defined
    in [FIPS203]. The extensions define a new kemInfo arm in PA-PK-AS-REP, a KDCKEMInfo
    structure signed by the KDC, HKDF-based AS reply key derivation (HKDF-SHA-512
    for ML-KEM), and downgrade-prevention rules. The KEM path framework supports multiple
    KEM algorithms including ML-KEM, composite ML-KEM algorithms, and future KEM standards.</p>"
