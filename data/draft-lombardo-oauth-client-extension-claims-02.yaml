abstract:
- language: en
  script: Latn
  content: "<p>This specification defines new claims for JWT profiled access tokens
    [RFC9068] so that resource providers can benefit from more granular information
    about the client: its authentication methods as well as the grant flow and the
    grant flow extensions used as part of the issuance of the associated tokens.</p>"
