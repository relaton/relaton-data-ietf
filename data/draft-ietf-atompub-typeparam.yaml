abstract:
- language: en
  script: Latn
  content: "<p>The Atom Syndication Format (RFC 4287) defines the 'application/\n   atom+xml' media type to identify both Atom Feed and Atom Entry\n   Documents.  This document defines an optional 'type' parameter used\n   to differentiate the two types of Atom documents.</p>"
