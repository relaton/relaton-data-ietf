abstract:
- language: en
  script: Latn
  content: "<p>The Energy Management (EMAN) framework will work on the management
    \ of energy-aware devices. In this document we describe the  applicability of
    the EMAN framework for a variety of applications.  We show how network elements
    and applications can use EMAN. We  furthermore describe relations of the EMAN
    framework to other  architectures and frameworks.</p>"
