abstract:
- language: en
  script: Latn
  content: "<p>The Atom Publishing Protocol (APP) is an application-level protocol
    for publishing and editing Web resources. The protocol is based on HTTP transport
    of Atom-formatted representations. The Atom format is documented in the Atom Syndication
    Format (RFC4287).</p>"
