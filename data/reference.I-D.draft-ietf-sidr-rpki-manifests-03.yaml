abstract:
- language: en
  script: Latn
  content: <p>This document defines a "manifest" for use in the Resource Public Key
    Infrastructure.  A manifest is a signed object that contains a listing of all
    the signed objects in the repository publication point associated with an authority
    responsible for publishing in the repository.  For each certificate, or other
    forms of signed objects issued by the authority that are published at this repository
    publication point, the manifest contains both the name of the file containing
    the object, and a hash of the file content.  Manifests are intended to expose
    potential attacks against relying parties of the Resource Public Key Infrastructure,
    such as a man-in-the middle attack of withholding repository data from relying
    party access, or replaying stale repository data to a relying party's access request.</p>
