- language: en
  script: Latn
  content: |-
    <p>This is a proposal for backwards compatibility for the INSIPID
       Session-ID SIP header.

       This draft is never intended to reach RFC status, and is written
       merely to make a concrete proposal that everyone can view - and if
       agreed upon, it will be woven into the INSIPID solution draft.</p>
