- language: en
  script: Latn
  content: "<p>This document discusses the usage scenarios and usage models of event
    services and command services involving inter-system IP mobility, specifically
    media independent handovers. The discussion is intended to aid the MIPSHOP WG
    in understanding the problem domain and requirements of the event and command
    services in the Internet.</p>"
