abstract:
- language: en
  script: Latn
  content: "<p>A mechanism to eliminate jitter caused by policing delay is described.
    It needs to be used in combination with a scheduling mechanism that provides low
    jitter for the transport path, and ultimately provides a low jitter guarantee
    for the application flow.</p>"
