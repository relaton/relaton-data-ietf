- language: en
  script: Latn
  content: "<p>This document provides guidance and suggestions for Internet Content
    Providers and Application Service Providers who wish to offer their service to
    both IPv6 and IPv4 customers.  Many of the points will also apply to hosting providers
    or to any enterprise network preparing for IPv6 users.</p>"
