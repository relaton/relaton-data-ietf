abstract:
- language: en
  script: Latn
  content: "<p>Some countries and regions require location information be constrained
    to emergency service applications and do not permit location information to traverse
    the end-point at all. This document describes the requirements of these countries
    and provides a solution based on an extension to the HELD location protocol.</p>"
