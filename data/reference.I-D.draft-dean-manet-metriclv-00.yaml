abstract:
- language: en
  script: Latn
  content: "<p>This document defines two TLVs (type-length-value structures) for representing
    cost values using the generalized MANET packet/message format [1]. A message block
    TLV is defined for representing a cost value associated with the local node. An
    address block TLV is defined for representing a cost value associated with links
    or a cost value associated with other nodes. Both TLVs defined are for use within
    MANET protocols.</p>"
