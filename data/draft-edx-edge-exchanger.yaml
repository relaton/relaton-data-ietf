- language: en
  script: Latn
  content: "<p>This document describes a new DNS resource record (RR) type, called
    the Edge Exchanger (EDX) RR, that is used to find services and location of the
    server(s) for any specific domain (the word domain is used here in the strict
    RFC1034 sense).</p>"
