abstract:
- language: en
  script: Latn
  content: <p>The Dynamic Host Configuration Protocol for IPv6 (DHCPv6) provides a
    framework for passing configuration information to nodes on a network.  This document
    describes new options for DHCPv6 which are required for booting a node from the
    network.  Status of this Memo  This Internet-Draft is submitted to IETF in full
    conformance with the provisions of BCP 78 and BCP 79.  Internet-Drafts are working
    documents of the Internet Engineering Task Force (IETF), its areas, and its working
    groups.  Note that other groups may also distribute working documents as Internet-
    Drafts.  Internet-Drafts are draft documents valid for a maximum of six months
