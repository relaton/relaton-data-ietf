abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Agent Execution and Payment Protocol\n   (AEPP), a standardized protocol layer for executing AI agents and\n   verifying payment for agent tasks on the open internet.  AEPP\n   provides the missing execution and payment layer for existing agent\n   URI schemes and naming services including agent://, ai://, mcp://,\n   ANS, and DNS-AID.  It defines a three-phase execution model:\n   discovery, payment, and execution, with on-chain payment verification\n   and cryptographic receipts.  This revision introduces the AE:// URI\n   scheme, namespace derivation rules, DNS-based ownership verification,\n   payment scheme extensions, DDoS mitigation via dynamic session\n   tokens, and a privacy model requiring no identity disclosure.  A\n   reference implementation serving 1,800,000 agents with zero per-agent\n   fees is live at a2a.agentir.com.</p>"
