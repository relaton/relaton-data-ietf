abstract:
- language: en
  script: Latn
  content: |-
    <p>The CBOR Object Signing and Encryption (COSE) message structure uses
       references to keys and defines header parameters to carry chains of
       X.509 certificates.

       This specification extends this functionality to CBOR Web Tokens
       (CWTs).</p>
