abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method by which a Service Provider may use\nan
    IEEE 802.1ad PBN (Provider Bridge Network) to provide IP Virtual \nPrivate Network
    Service for its customers.  This method extends \nthe BGP/MPLS IP VPN service
    to allow IP VPN service to be offered \nusing a PBN instead.  This document specifies
    the way in which this \nis done.</p>"
