abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework for inter-domain Quality of\n   Service (QoS).  It makes use of a new concept denoted by Meta-QoS-\n   Class.  This new concept guides and simplifies QoS agreements between\n   providers and opens up new perspectives for a global QoS-enabled\n   Internet.</p>"
