abstract:
- language: en
  script: Latn
  content: "<p>The Proxy Mobile IPv6 specification requires the Mobile Access Gateway
    (MAG) to send a separate Proxy Binding Update (PBU) message to the Local Mobility
    Agent (LMA) for each mobile node (MN), to renew the MN's mobility binding, when
    the MNs binding lifetime is close to expiry. This document defines a mechanism
    by which a MAG can update the mobility bindings of multiple MNs attached to it
    with a single PBU message to the serving LMA.</p>"
