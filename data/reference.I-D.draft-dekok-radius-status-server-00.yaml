  script: Latn
  content: <p>[RFC2865] defines a Status-Server code for use in RADIUS, but labels
    it as "Experimental" without further discussion. This document describes practical
    uses for Status-Server that have been implemented as a method of querying the
    status of a RADIUS server.</p>
