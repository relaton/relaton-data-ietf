abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a YANG model for TCP on devices that are configured
    by network management protocols. The YANG model defines groupings for fundamental
    parameters that can be modified in many TCP implementations. The model extends
    a base model for TCP clients and servers [I-D.ietf-netconf-tcp-client-server].</p>"
