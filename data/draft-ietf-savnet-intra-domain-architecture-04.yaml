abstract:
- language: en
  script: Latn
  content: "<p>This document describes a generic architecture for intra-domain Source
    Address Validation (SAV). It provides a common framework for developing new intra-domain
    SAV mechanisms and describes the conditions under which such mechanisms can improve
    SAV accuracy with respect to existing intra-domain SAV mechanisms.</p>"
