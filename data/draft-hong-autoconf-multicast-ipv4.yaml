abstract:
- language: en
  script: Latn
  content: "<p>In this document, we describe a method by which a host automatically
    allocates multicast addresses using IPv4 link local address without any address
    allocation server. These multicast addresses do not collide with other multicast
    addresses in a local scope.</p>"
