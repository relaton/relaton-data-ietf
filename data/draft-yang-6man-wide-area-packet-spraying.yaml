abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Wide-area Packet Spraying (WPS) option,
    an IPv6 option that can be carried in the Destination Options header or, where
    required, the Hop-by-Hop Options header. The option conveys the scheduling metadata
    that is needed to distribute the packets of a single high-volume flow across multiple
    parallel wide- area paths at the granularity of packet groups, and to restore
    the original packet ordering at the egress boundary of a controlled domain. The
    mechanism provides order-preserving multipath load balancing and bandwidth aggregation
    for wide-area interconnection of distributed computing sites, such as wide-area
    interconnects between Artificial Intelligence (AI) data centers, and is intended
    for use within limited domains.</p>"
