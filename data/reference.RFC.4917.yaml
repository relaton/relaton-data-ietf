abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new extension for use in Mobile IPv4.  This
    extension can be added by the Home Agent and the Foreign Agent to Registration
    Reply messages.  This extension carries a text string that is intended for the
    user of the Mobile Node.  [STANDARDS-TRACK]</p>"
