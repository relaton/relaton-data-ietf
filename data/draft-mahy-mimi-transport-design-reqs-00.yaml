abstract:
- language: en
  script: Latn
  content: "<p>This document describes design requirements on the More Instant Messaging
    Interoperability (MIMI) Working Group provider-to-provider message transport protocol.
    These requirements are based on the requirements of the group encryption using
    the Messaging Layer Security (MLS) protocol and requirements for high volume message
    transfer which would be needed with large messaging providers.</p>"
