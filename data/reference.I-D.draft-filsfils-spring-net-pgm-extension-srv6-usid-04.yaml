abstract:
- language: en
  script: Latn
  content: '<p>The SRv6 "micro segment" (SRv6 uSID or uSID for short) instruction
    is a straightforward extension of the SRv6 Network Programming model:  o  The
    SRv6 Control Plane is leveraged without any change  o  The SRH dataplane encapsulation
    is leveraged without any change  o  Any SID in the SID list can carry micro segments  This
    enables:  o  ultra-scale (e.g. multi-domain 5G deployments)  o  minimum MTU overhead  o  installed-base
    reuse</p>'
