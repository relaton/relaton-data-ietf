abstract:
- language: en
  script: Latn
  content: "<p>This document provides a set of guidelines for YANG module authors
    related to the design of IANA-maintained modules. These guidelines are meant to
    leverage existing IANA registries and use YANG as just another format to present
    the content of these registries. This document updates RFC 8407 by providing additional
    guidelines for IANA-maintained modules. It also relaxes a recommendation related
    to the extensibility for such modules.</p>"
