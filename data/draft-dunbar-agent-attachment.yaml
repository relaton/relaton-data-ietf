abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Agent Attachment Protocol (AAP)\n   that enables AI agents to establish attachment to an edge\n   node and derive communication and attachment-related\n   properties. These properties include endpoint identifiers,\n   supported communication mechanisms, and attachment context\n   information that can be exposed to discovery systems. AAP\n   focuses on how agents obtain and maintain attachment state\n   and how attachment-derived properties can be represented in a\n   consistent and interoperable manner. These properties can be\n   used by forwarding functions at edge nodes and by routing or\n   control-plane mechanisms to support communication between\n   agents.</p>"
