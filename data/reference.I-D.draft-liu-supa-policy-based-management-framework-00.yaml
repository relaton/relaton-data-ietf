abstract:
- language: en
  script: Latn
  content: "<p>Simplified Use of Policy Abstractions (SUPA) defines a set of rules
    that define how services are designed, delivered, and operated within an operator's
    environment independent of any one particular service or networking device. This
    document describes the SUPA basic architecture, its elements and interfaces.</p>"
