abstract:
- language: en
  script: Latn
  content: "<p>This document describes the ALG (Application Level Gateway) for the
    SNMP (Simple Network Management Protocol) by which IP (Internet Protocol) addresses
    in the payload of SNMP packets are statically mapped from one group to another.
    \ This memo provides information for the Internet community.</p>"
