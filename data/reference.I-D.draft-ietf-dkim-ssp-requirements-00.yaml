abstract:
- language: en
  script: Latn
  content: "<p>DomainKeys Identified Mail [DKIM] provides a cryptographic mechanism
    for domains to assert responsibility for the messages they sign. A related mechanism
    would allow an administrator ot publish various statements about their email accountability
    practices. This draft defines the requirement for this additional mechanism.</p>"
