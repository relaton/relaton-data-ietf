abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv6 uses IPsec to protect signaling between the mobile node
    and the home agent. This document defines how IPsec can be used between the mobile
    node and correspondent nodes for home address option validation (aka. triangular
    routing) and protection of mobility signaling for route optimizations. The configuration
    details for IPsec and IKE are also provided.</p>"
