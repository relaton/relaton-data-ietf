abstract:
- language: en
  script: Latn
  content: <p>RFC 1112 offers no facilities for participant control or accounting.
    This document explores the requirements for such facilities, and offers a potential
    solution, based on extending the IGMP and MLD "join" operations to carry EAP and/or
    ERP packets.</p>
