abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how Segment Routing (SR) policies can be used
       to satisfy the requirements for bandwidth, end-to-end recovery and
       persistent paths within a SR network.  SR Policies satisfying these
       requirements are called "circuit-style" SR Policies (CS-SR Policies).</p>
