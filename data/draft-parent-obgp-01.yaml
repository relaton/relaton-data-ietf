abstract:
- language: en
  script: Latn
  content: "<p>This work investigates intra-AS lightpath provisioning using BGP. BGP
    is currently deployed across the different autonomous systems on the Internet,
    so investigating how a BGP approach to provision lightpaths across autonomous
    systems is of great interest. This work proposes extensions to BGP to this end.</p>"
