abstract:
- language: en
  script: Latn
  content: "<p>This memo describes an API that allows applications to perform operations
    against a gateway serving one or more devices described by an SDF model. The document
    describes a RESTful application layer interface to perform operations on those
    devices, as well as a CBOR- based publish-subscribe interface for streaming data.</p>"
