abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines "cache channels" to propagate out-of-band
       events from HTTP origin servers (or their delegates) to subscribing
       caches.  It also defines an event payload that gives finer-grained
       control over cache freshness.</p>
