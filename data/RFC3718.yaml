abstract:
- language: en
  script: Latn
  content: "<p>This memo describes various internal workings of the Unicode Consortium
    for the benefit of participants in the IETF. It is intended solely for informational
    purposes. Included are discussions of how the decision-making bodies of the Consortium
    work and their procedures, as well as information on public access to the character
    encoding & standardization processes.</p>"
