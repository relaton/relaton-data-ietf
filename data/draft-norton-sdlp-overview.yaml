abstract:
- language: en
  script: Latn
  content: "<p>This document presents an architectural overview of the Secured Digital
    Lifecycle Protocol (SDLP). SDLP defines a structured model for representing, identifying,
    tracking, and securing digital objects across their lifecycle. This overview summarizes
    the SDLP object model, explains how identity, lineage, lifecycle, and security
    architecture interrelate, and outlines the rationale for defining SDLP through
    multiple coordinated specifications. It serves as the entry point for understanding
    the SDLP framework.</p>"
