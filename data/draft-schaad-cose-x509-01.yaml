abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the headers and usage for referring to and
       transporting X.509 certificates in the CBOR Encoded Message (COSE)
       Syntax.

    Contributing to this document

       The source for this draft is being maintained in GitHub.  Suggested
       changes should be submitted as pull requests at &lt;https://github.com/
       cose-wg/X509&gt;.  Instructions are on that page as well.  Editorial
       changes can be managed in GitHub, but any substantial issues need to
       be discussed on the COSE mailing list.</p>
