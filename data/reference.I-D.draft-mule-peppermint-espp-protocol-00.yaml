abstract:
- language: en
  script: Latn
  content: "<p>This document defines a provisioning protocol for ENUM-SIP addressing
    servers.  This protocol has been recently published as part of CableLabs(r) PacketCable(tm)
    specifications.  It allows SIP service providers to provision and manage session
    establishment data used by SIP network elements to route SIP sessions to the target
    destinations which may be served by the operator's own internal network or by
    a session peering partner.  The data provisioned into an ENUM-SIP addressing server
    is queried by SIP entities using ENUM or SIP.</p>"
