abstract:
- language: en
  script: Latn
  content: "<p>Delivering cryptographic security over MPLS networks currently requires
    insertion of extra IP Packet headers in the label stack.  This document discusses
    encryption and authentication of datagrams by carriage of Encapsulating Security
    Payload directly inside a label header.</p>"
