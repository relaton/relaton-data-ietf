abstract:
- language: en
  script: Latn
  content: "<p>This document describes broad categories of use cases for the Discovery
    of Agents, Workloads, and Named Entities (DAWN). The purpose of the document is
    to illustrate situations in which entities need to discover other entities. This
    document does not define a discovery protocol, a registration procedure, a selection
    algorithm, or an agent-to-agent communication protocol.</p>"
