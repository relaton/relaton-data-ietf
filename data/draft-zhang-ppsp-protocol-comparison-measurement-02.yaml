- language: en
  script: Latn
  content: "<p>In this draft we introduce an Internet measurement work for pplive,
    ppstream and UUSee. First, we give a brief introduction about our motivation and
    target of this measurement. We then introduce the methodology, platform, data
    and modeling of our measurement. Finally we outline the p2p media streaming protocols
    by the measurement. Zhang Expires January 9,2010 [page 2] Internet-Draft Protocol
    Analysis and Comparison of PPlive, PPstream and UUSee by Internet Measurement
    July 2009</p>"
