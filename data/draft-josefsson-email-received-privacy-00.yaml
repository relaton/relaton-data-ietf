abstract:
- language: en
  script: Latn
  content: <p>The email "Received" header has a problematic privacy concern affecting
    email routing before or after handling by public SMTP relays. This document discusses
    the problem and describes a solution that relevant Message Transfer Agents (MTAs)
    and Mail Submission Agents (MSAs) may adopt.</p>
