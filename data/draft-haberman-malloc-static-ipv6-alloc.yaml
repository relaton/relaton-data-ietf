abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for statically allocating IPv6\nmulticast addresses by network prefixes.  This approach will\nintegrate seamlessly with the Multicast Address Dynamic Client\nAllocation Protocol (MADCAP). It will also remove the need to support\nthe Multicast Address Set Claim (MASC) Protocol for IPv6.</p>"
