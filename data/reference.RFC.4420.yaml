abstract:
- language: en
  script: Latn
  content: "<p>Multiprotocol Label Switching (MPLS) Label Switched Paths (LSPs) may
    be established using the Resource Reservation Protocol Traffic Engineering (RSVP-TE)
    extensions.  This protocol includes an object (the SESSION_ATTRIBUTE object) that
    carries a Flags field used to indicate options and attributes of the LSP.  That
    Flags field has eight bits allowing for eight options to be set.  Recent proposals
    in many documents that extend RSVP-TE have suggested uses for each of the previously
    unused bits.</p>"
- language: en
  script: Latn
  content: "<p>This document defines a new object for RSVP-TE messages that allows
    the signaling of further attribute bits and also the carriage of arbitrary attribute
    parameters to make RSVP-TE easily extensible to support new requirements.  Additionally,
    this document defines a way to record the attributes applied to the LSP on a hop-by-hop
    basis.</p>"
- language: en
  script: Latn
  content: "<p>The object mechanisms defined in this document are equally applicable
    to Generalized MPLS (GMPLS) Packet Switch Capable (PSC) LSPs and to GMPLS non-PSC
    LSPs.  [STANDARDS-TRACK]</p>"
