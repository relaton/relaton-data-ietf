abstract:
- language: en
  script: Latn
  content: "<p>In IS-IS deployments, the process identifier (process ID) is used on\n   a local router to distinguish and manage different IS-IS protocol\n   instances.  Process ID is local to the router and is not transmitted\n   to neighbors, providing operational flexibility.  However, because\n   the process ID is also used to implement route redistribution and\n   specify administrative tags for fine-grained control, its\n   misconfiguration can lead to severe impacts (e.g., routing loops or\n   black holes) with difficult troubleshooting.\n\n   To address this problem, network operators typically deploy a\n   consistent process ID on both ends of a link within the same domain,\n   to reduce configuration complexity.  In this context, to avoid the\n   misconfiguration of the IS-IS process ID, this document introduces\n   two optional approaches for process ID verification.  When process ID\n   verification is enabled, an IS-IS adjacency can be established only\n   when the process identifiers at both ends of the link match.</p>"
