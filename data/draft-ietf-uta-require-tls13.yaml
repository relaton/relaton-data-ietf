id: draftietfutarequiretls13
schema_version: v1.5.6
title:
- language: en
  script: Latn
  content: New Protocols Using TLS Must Require TLS 1.3
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-uta-require-tls13-11
docidentifier:
- content: draft-ietf-uta-require-tls13
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2025-04-14'
abstract:
- language: en
  script: Latn
  content: "<p>TLS 1.3 use is widespread, it has had comprehensive security proofs,
    and it improves both security and privacy over TLS 1.2. Therefore, new protocols
    that use TLS must require TLS 1.3. As DTLS 1.3 is not widely available or deployed,
    this prescription does not pertain to DTLS (in any DTLS version); it pertains
    to TLS only. This document updates RFC9325 and discusses post-quantum cryptography
    and the security and privacy improvements over TLS 1.2 as a rationale for that
    update.</p>"
  format: text/html
