abstract:
- language: en
  script: Latn
  content: "<p>This document presents a taxonomy of extending TLS protocol with remote
    attestation, referred to as attested TLS. It also presents high-level analysis
    of benefits and limitations of each category, namely pre-handshake attestation,
    intra-handshake attestation and post-handshake attestation. It also captures the
    opinions of the WG participants in order to build consensus towards solutions.
    It also discussed tradeoffs and scalability.</p>"
