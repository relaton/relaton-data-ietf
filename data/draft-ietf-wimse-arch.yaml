abstract:
- language: en
  script: Latn
  content: "<p>The increasing prevalence of cloud computing and micro service architectures
    has led to the rise of complex software functions being built and deployed as
    workloads, where a workload is defined as software executing for a specific purpose,
    potentially comprising one or more running instances. This document discusses
    an architecture for designing and standardizing protocols and payloads for conveying
    workload identity and security context information.</p>"
