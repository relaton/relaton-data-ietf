abstract:
- language: en
  script: Latn
  content: <p>Contacting a CA is just one way in which a newly deployed HTTPS server
    can get hold of the certificate to use. This document describes additional (and
    common) use cases that fall into the major guiding use case for ACME as stated
    by [I-D.barnes-acme], "obtaining certificates for Web sites".</p>
