abstract:
- language: en
  script: Latn
  content: "<p>This document updates the Internet Engineering Task Force (IETF) Standards
    Process defined in RFC 2026.  Primarily, it reduces the Standards Process from
    three Standards Track maturity levels to two. This memo documents an Internet
    Best Current Practice.</p>"
