abstract:
- language: en
  script: Latn
  content: "<p>In many scenarios, users need to be able to ensure and prove the existence
    and integrity of data, especially digitally signed data, in a common and reproducible
    way over a long and possibly undetermined period of time. This document specifies
    the syntax and processing of an Evidence Record, designed for long-term non-repudiation
    of existence of data, which particularly can be used for conservation of evidence
    of digitally signed data.</p>"
