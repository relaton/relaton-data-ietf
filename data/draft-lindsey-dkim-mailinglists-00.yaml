abstract:
- language: en
  script: Latn
  content: |-
    <p>It is proposed that a Mailing List Manager (MLM) may, under
    certain circumstances, replace the From header field of a message
    before forwarding it in order to prevent its being discarded by
    over-zealous DKIM verifiers/receivers.</p>
