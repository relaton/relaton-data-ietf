abstract:
- language: en
  script: Latn
  content: <p>IANA has defined an "OTN Signal Type" subregistry of the "Generalized
    Multi-Protocol Label Switching (GMPLS) Signaling Parameters" registry. This document
    updates the OTN Signal Type subregistry specified in RFC 7139 to allow Specification
    Required policies, as defined in RFC 5226.</p>
