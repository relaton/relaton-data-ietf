abstract:
- language: en
  script: Latn
  content: "<p>This draft standardizes a new well-known BGP community GRACEFUL_SHUTDOWN
    to signal the graceful shutdown of paths. This draft also describes operational
    procedures which use this community to reduce the amount of traffic lost when
    BGP peering sessions are about to be shut down deliberately, e.g. for planned
    maintenance.</p>"
