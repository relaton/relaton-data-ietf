abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Uniform Resource Name (URN) namespace for
    the Schema for Academia (SCHAC).  This namespace is for naming persistent resources
    defined by the SCHAC international activity participants, their working groups
    and other designated subordinates.  The main use will be the creation of controlled
    vocabulary values for attributes in the SCHAC schema. These values will be associated
    to particular instances of persons or objects belonging to any of the SCHAC object
    classes.</p>"
