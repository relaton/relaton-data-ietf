abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification will describe how ephemeral LISP EIDs can be used
       to create source anonymity.  The idea makes use of frequently
       changing EIDs much like how a credit-card system uses a different
       credit-card numbers for each transaction.</p>
