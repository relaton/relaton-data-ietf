- language: en
  script: Latn
  content: "<p>This document specifies an extension to the OAuth 2.0 Authorization
    Framework defining request parameters that enable a client to explicitly signal
    to an authorization server about the identity of the protected resource(s) to
    which it is requesting access.</p>"
