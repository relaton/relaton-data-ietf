abstract:
- language: en
  script: Latn
  content: "<p>The specific mechanism described in the current PMIPv6 draft to support
    multihoming is such that a unique prefix is given to each interface of a Mobile
    Node (multiple unique prefixes per MN) that is attached to the PMIPv6 domain.
    \ However, multihoming can also be provided using same unique prefix for all interfaces
    of MN (single unique prefix per MN).  This memo explores and highlights some issues
    associated with multihoming support in PMIPv6: using single unique prefix per
    MN method or unique prefix per each interface of MN method.</p>"
