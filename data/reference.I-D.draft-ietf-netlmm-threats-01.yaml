abstract:
- language: en
  script: Latn
  content: "<p>This document discusses security threats to NETLMM mobility management.
    Threats to NETLMM occur on two interfaces: the access router/localized mobility
    anchor interface and the access router/ mobile node interface. Threats to the
    access router/localized mobility anchor interface are threats to the NETLMM protocol
    itself. This document discusses threats on these two interfaces.</p>"
