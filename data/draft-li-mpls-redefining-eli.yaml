abstract:
- language: en
  script: Latn
  content: "<p>Recent work on MPLS Network Actions (MNA) has produced two drafts that
    propose to redefine the MPLS Entropy Label Indicator (ELI) for use with MNA. [I-D.jags-mpls-ext-hdr]
    [I-D.gandhi-mpls-ioam] This work also proposes the use of a Network Programming
    Label (NPL) as another option for use with MNA. This document considers both of
    these options harmful in the sense of [GOTO].</p>"
