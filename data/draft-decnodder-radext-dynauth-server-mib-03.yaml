- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes the RADIUS dynamic authorization server (DAS) functions that support
    the dynamic authorization extensions as defined in RFC 3576.</p>"
