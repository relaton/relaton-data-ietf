abstract:
- language: en
  script: Latn
  content: "<p>Researchers have discovered that the authenticated encryption portion
    of the current SSH Transport Protocol is vulnerable to several attacks. This document
    describes new symmetric encryption methods for the SSH Transport Protocol and
    gives specific recommendations on how frequently SSH implementations should rekey.
    In a paper at the Ninth ACM Conference on Computer and Communications Security,
    Bellare, Kohno, and Namprempre prove that if an SSH application implements the
    modifications described in this document, then the symmetric cryptographic portion
    of that application will provably resist chosen-plaintext, chosen-ciphertext,
    reaction-based privacy, and integrity/authenticity attacks.</p>"
