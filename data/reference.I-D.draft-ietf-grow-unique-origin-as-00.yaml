abstract:
- language: en
  script: Latn
  content: "<p>This document makes recommendations regarding the use of per-node unique
    origin ASNs for globally anycasted critical infrastructure services in order to
    provide routing system discriminators for a given anycasted prefix.  Network managment
    and monitoring techniques, or other operational mechanisms may employ this new
    discriminator in whatever manner fits their operating environment.</p>"
