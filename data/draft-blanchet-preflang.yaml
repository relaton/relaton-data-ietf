- language: en
  script: Latn
  content: "<p>This memo defines a new tag which will help users and servers to determine
    the best language in their communications. For example, error messages coming
    from SMTP servers or HTTP servers can use this tag to send those error messages
    in the preferred language for the user.</p>"
