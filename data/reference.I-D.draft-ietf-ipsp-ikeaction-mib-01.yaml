abstract:
- language: en
  script: Latn
  content: "<p>This document defines a SMIv2 Management Information Base (MIB) module
    for configuring IKE actions for the security policy database (SPD) of a device
    that uses the IPsec Security Policy Database Configuration MIB for configuring
    the IKE protocol actions on that device. The IPSP IKE Action MIB integrates directly
    with the IPsec Security Policy Database Configuration MIB and it is meant to work
    within the framework of an action referenced by that MIB.</p>"
