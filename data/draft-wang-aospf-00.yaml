- language: en
  script: Latn
  content: "<p>This document describes AOSPF (Anycast Extensions to OSPFv3), a routing
    protocol which extends OSPFv3 to support anycast, which we implemented and tested
    successfully in our IPv6 test bed. And the performance analysis shows the overhead
    of AOSPF is low.</p>"
