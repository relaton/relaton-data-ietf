abstract:
- language: en
  script: Latn
  content: "<p>[draft-ietf-nvo3-framework-07] and [draft-ietf-nvo3-overlay-problem-
    statement-04] all have information on _Auto-provisioning/Service discovery_ or
    _Dynamic Provisioning_. Some further information should be helpful to clarify
    how automatic virtual network/service provisioning can be done in NVO3.  This
    document describes the NVO3 general virtual network provisioning processes and
    discusses how VN can be automatically provided and related requirements.</p>"
