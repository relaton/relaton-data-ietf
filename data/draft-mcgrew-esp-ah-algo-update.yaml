abstract:
- language: en
  script: Latn
  content: "<p>This note defines an update to the ESP and AH algorithm requirements
    that promotes efficiency, security, and interoperability, by recommending the
    use of the Advanced Encryption Standard (AES) block cipher in the Galois/Counter
    Mode (GCM) of operation. It is an individual submission, intended as input to
    future standards track work on IPsec policy.</p>"
