abstract:
- language: en
  script: Latn
  content: "<p>The More Instant Messaging Interoperability (MIMI) working group is
    defining a suite of protocols that allow messaging providers to interoperate with
    one another. This document lays out an overall architecture enumerating the MIMI
    protocols and how they work together to enable an overall messaging experience.</p>"
