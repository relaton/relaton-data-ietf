abstract:
- language: en
  script: Latn
  content: "<p>Many telephony services are IP based and they can use various signaling
    protocols like H323, SIP, MGCP, MEGACO and owner vendor protocol. This document
    describe a method to identify and to change the Calling Line Identification (or
    CLI) field during call forwarding. This method is voice over ip protocol independent.
    This method can be apply to all voice over ip protocols.</p>"
