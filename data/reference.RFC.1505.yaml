abstract:
- language: en
  script: Latn
  content: "<p>This document expands upon the elective experimental Encoding header
    field which permits the mailing of multi-part, multi-structured messages.  It
    replaces RFC 1154. This memo defines an Experimental Protocol for the Internet
    community.  It does not specify an Internet standard.</p>"
