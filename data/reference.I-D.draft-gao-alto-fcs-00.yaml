abstract:
- language: en
  script: Latn
  content: "<p>OpenFlow [openflow] is the current standard southbound protocol for
    Software-Defined Networking.  In this document, we define a new service, namely
    the Flow Cost Service, for clients in a OpenFlow- enabled network to query the
    network information.</p>"
