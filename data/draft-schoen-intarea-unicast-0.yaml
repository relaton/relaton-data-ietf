abstract:
- language: en
  script: Latn
  content: "<p>This document redesignates 0/8, the lowest block in the IPv4 address
    space, so that this space is no longer reserved. It asks implementers to make
    addresses in this range fully usable for unicast use on the Internet.</p>"
