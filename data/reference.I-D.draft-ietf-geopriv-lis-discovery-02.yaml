abstract:
- language: en
  script: Latn
  content: "<p>A method is described for the discovery of a Location Information Server.
    \ The method uses a Dynamic Host Configuration Protocol (DHCP) option.  DHCP options
    are defined for both IPv4 and IPv6 DHCP.  A URI-enabled NAPTR (U-NAPTR) method
    is described for use where the DHCP option is unsuccessful.  This document defines
    a U-NAPTR Application Service for a LIS, with a specific Application Protocol
    for the HTTP Enabled Location Delivery (HELD) protocol.  The held: URI scheme,
    the product of the discovery process, is defined by this document.</p>"
