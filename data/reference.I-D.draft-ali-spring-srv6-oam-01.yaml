abstract:
- language: en
  script: Latn
  content: "<p>This document defines building blocks that can be used for Operations,
    Administration, and Maintenance (OAM) in Segment Routing Networks with IPv6 Dataplane
    (SRv6). The document also describes some SRv6 OAM mechanisms that can be realized
    using these building blocks.</p>"
