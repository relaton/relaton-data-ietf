abstract:
- language: en
  script: Latn
  content: "<p>This document standardizes an HTTP extension header field that allows
    proxy components to disclose the originating IP number of a request. Given a trusted
    path of proxying components, each subsequent component will have access to all
    IP numbers used in the chain of proxied HTTP requests.  This document also standardizes
    ways for a proxy possessor to anonymize the origin of a request.</p>"
