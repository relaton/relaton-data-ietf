abstract:
- language: en
  script: Latn
  content: "<p>This document discusses operational and policy considerations related
    to the deployment of TLS Encrypted Client Hello (ECH). It describes the impact
    of encrypting the TLS Server Name Indication (SNI) on operational practices such
    as threat detection, network security controls, and content filtering in private,
    edge, and public network environments, with a particular focus on education, enterprise,
    and public operator use cases.</p>"
