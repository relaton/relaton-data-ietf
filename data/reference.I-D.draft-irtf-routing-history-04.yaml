abstract:
- language: en
  script: Latn
  content: <p>This document analyses the current state of IDR routing with respect
    to RFC1126 and other IDR requirements and design efforts. It is the companion
    document to "Requirements for Inter-Domain Routing" [I-D.irtf-routing-reqs], which
    is a discussion of requirements for the future routing architecture and future
    routing protocols. Publication of this document is in accordance with the consensus
    of the active contributors the IRTF's Routing Research Group.</p>
