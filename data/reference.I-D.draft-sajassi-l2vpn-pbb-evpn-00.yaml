abstract:
- language: en
  script: Latn
  content: "<p>This document discusses how Ethernet Provider Backbone Bridging [802.1ah]
    can be combined with E-VPN in order to reduce the number of BGP MAC advertisement
    routes, provide Customer MAC address mobility with MAC sub-netting, provide Customer
    MAC address scoping, offer per site policies and avoid Customer MAC address flushing
    on topology changes. The combined solution is referred to as PBB-EVPN.  Conventions</p>"
