abstract:
- language: en
  script: Latn
  content: "<p>This document identifies two deployment scenarios that have arisen
    from the unconventional network topologies formed using Network Address Translator
    devices (NATs). First, the simplicity of administering networks through the combination
    of NAT and DHCP has increasingly lead to the deployment of multi-level inter-connected
    private networks involving overlapping IP address spaces. Second, the proliferation
    of private networks in enterprises, hotels and conferences, and the wide spread
    use of Virtual Private Networks (VPNs) to access enterprise intranet from remote
    locations has increasingly lead to overlapping IP address space between remote
    and corporate networks. The document does not dismiss these unconventional scenarios
    as invalid, but recognizes them as real and offers recommendations to ensure these
    real scenarios can function.</p>"
