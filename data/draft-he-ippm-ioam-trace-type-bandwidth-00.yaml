abstract:
- language: en
  script: Latn
  content: "<p>Traffic scheduling and optimization have become routine network operation
    and maintenance tasks for operators. The operators need to select a path that
    can accommodate the capacity of the traffic to be scheduled. In situ Operations,
    Administration, and Maintenance (IOAM) is used for recording and collecting operational
    and telemetry information. This document defines two bit flags within IOAM Trace-
    Type for carrying bandwidth information.</p>"
