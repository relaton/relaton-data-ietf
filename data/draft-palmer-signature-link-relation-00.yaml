- language: en
  script: Latn
  content: "<p>This document specifies a way to associate web resources with their
    corresponding digital signatures. A signature can then be verified automatically
    during the process of downloading a resource. Infomation presented to the user
    about the verification results may enable them to make wiser security decisions
    about downloaded content.</p>"
