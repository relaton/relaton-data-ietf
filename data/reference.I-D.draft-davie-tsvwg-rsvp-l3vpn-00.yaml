abstract:
- language: en
  script: Latn
  content: "<p>RFC 4364 defines an approach to building provider-provisioned Layer
    3 VPNs. It may be desirable to use RSVP to perform admission control on the links
    between CE and PE routers. This document specifies procedures by which RSVP messages
    travelling from CE to CE across an L3VPN may be appropriately handled by PE routers
    so that admission control can be performed on PE-CE links. Optionally, admission
    control across the provider's backbone may also be supported.</p>"
