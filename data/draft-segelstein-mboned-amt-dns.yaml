title:
- language: en
  script: Latn
  content: Using Domain Name Services to Enable an AMT Gateway to Discover the Optimal AMT Relay in a Multi-Network SSM Multicast Environment
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-segelstein-mboned-amt-dns-00
