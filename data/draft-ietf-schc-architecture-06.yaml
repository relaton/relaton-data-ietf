abstract:
- language: en
  script: Latn
  content: "<p>The Static Context Header Compression and fragmentation (SCHC) framework
    provides both a header compression mechanism and an optional fragmentation mechanism.
    This document defines a minimal architecture for SCHC deployments, providing guidance
    for implementers and operators on the essential components and their interactions
    required for effective SCHC operation. The architecture defines the components
    of a SCHC deployment - Endpoints, Instances, Contexts, Sessions, and Domains -
    their management, the framing of SCHC Datagrams, and considerations for technology-specific
    profiles.</p>"
