abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an autonomic fast failover mechanism for SRv6
       networks using a bounce-back strategy.  It uses GRASP to distribute
       failover protection information, enabling data plane fast reroute
       without control plane reconvergence.</p>
