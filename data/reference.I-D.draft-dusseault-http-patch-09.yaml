abstract:
- language: en
  script: Latn
  content: "<p>Several applications extending HTTP require a feature to do partial
    resource modification. Existing HTTP functionality only allows a complete replacement
    of a document. This proposal adds a new HTTP method, PATCH, to modify an existing
    HTTP resource.</p>"
