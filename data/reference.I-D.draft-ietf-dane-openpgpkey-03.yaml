abstract:
- language: en
  script: Latn
  content: "<p>OpenPGP is a message format for email (and file) encryption that lacks
    a standardized lookup mechanism to securely obtain OpenPGP public keys.  This
    document specifies a method for publishing, locating and verifying OpenPGP public
    keys in DNS for a specific email address using a new OPENPGPKEY DNS Resource Record.
    \ Security is provided via DNSSEC.</p>"
