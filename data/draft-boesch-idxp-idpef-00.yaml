abstract:
- language: en
  script: Latn
  content: "<p>The Intrusion Detection Parameterization Exchange Format (IDPEF) defines
    data formats and exchange procedures to standardize parameterization information
    exchange into intrusion detection and response systems from a Manager to an Analyzer.
    This Internet-Draft describes a data model to represent parameterization information
    of intrusion detection system entities, and explains the rationale for using this
    model. An implementation of the data model in the Extensible Markup Language (XML)
    is presented, a XML Document Type Definition is developed, and parameterization
    examples are provided.</p>"
