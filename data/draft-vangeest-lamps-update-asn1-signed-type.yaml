- language: en
  script: Latn
  content: "<p>This document updates some ASN.1 modules which conform to the syntax
    of the 2002 version of ASN.1 but feature constraints that are no longer consistent
    with usage of the associated structures. There are no bits-on-the-wire changes
    to any of the formats; this is simply a change to the syntax to better align with
    current practices.</p>"
