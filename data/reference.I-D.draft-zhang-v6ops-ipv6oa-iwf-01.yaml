abstract:
- language: en
  script: Latn
  content: "<p>This document describes an interworking function between IPv6 over
    ATM (Asynchronous Transfer Mode) and IPv6 over Ethernet.  The interworking function
    enables the communication between ATM and Ethernet by maintaining the multiple
    states of both of them.</p>"
