abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an EVPN extension to allow several of its multihoming
    functions, fast convergence and aliasing/backup path, to be used in conjunction
    with inter-subnet forwarding. The extension is limited to All-Active and Single-Active
    redundancy modes.</p>"
