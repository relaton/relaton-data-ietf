abstract:
- language: en
  script: Latn
  content: "<p>This document introduces the KeyState EDNS(0) option, to enable a\n   child operator to query a parent UPDATE Receiver about the state of a\n   SIG(0) key used to secure cross-zone-cut DNS UPDATE messages.  The\n   KeyState option allows the child to include a key state inquiry in\n   its DNS query, and the parent to include the corresponding key state\n   in its response.  This addresses the challenge of maintaining\n   synchronization of SIG(0) keys between the child and the parent\n   UPDATE Receiver: the child can become aware of any issue with its\n   SIG(0) key in advance, before attempting the next operational DNS\n   UPDATE.\n\n   TO BE REMOVED: This document is being collaborated on in Github at:\n   https://github.com/johanix/draft-berra-dnsop-keystate\n   (https://github.com/johanix/draft-berra-dnsop-keystate).  The most\n   recent working version of the document, open issues, etc, should all\n   be available there.  The authors (gratefully) accept pull requests.</p>"
