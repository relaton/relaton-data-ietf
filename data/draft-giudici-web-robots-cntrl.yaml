- language: en
  script: Latn
  content: "<p>The Web Robots Control Standard [1] is a method for administrators
    of sites on the World-Wide-Web to give instructions to visiting Web robots. This
    document describes an extension for supporting Robots based on Mobile Agents,
    in a way that is independent of the technology used for their actual implementation.</p>"
