title:
- language: en
  script: Latn
  content: TCP Extensions for Multipath Operation with Multiple Addresses
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-mptcp-rfc6824bis-18
docidentifier:
- content: draft-ietf-mptcp-rfc6824bis
  type: Internet-Draft
