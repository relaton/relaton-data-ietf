- language: en
  script: Latn
  content: "<p>This memo contains a mechanism by which NETCONF server and client can
    extended to operate in a master-agent sub-agent scheme. It extends the base NETCONF
    protocol with additional NETCONF operations, describes the protocol for this interaction
    and provides error messages exchanged during this interaction.</p>"
