abstract:
- language: en
  script: Latn
  content: '<p>This document describes a simple and efficient mechanism that can be
    used to detect and localize failures in P2PSIP overlay network.  This document
    mainly consists of two parts: information carried in a P2PSIP Peer "Echo request"
    message and "Echo response" message for the purpose of fault detection and localization,
    and mechanisms for processing those messages.</p>'
