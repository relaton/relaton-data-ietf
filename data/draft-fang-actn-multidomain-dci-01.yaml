abstract:
- language: en
  script: Latn
  content: "<p>This document discusses a use case for data center operators that need
    to interface multi-domain transport networks to offer their global data center
    applications and services. As data center operators face multi-domain and diverse
    transport technology, interoperability based on standard-based abstraction is
    required to support dynamic and flexible applications and services.</p>"
