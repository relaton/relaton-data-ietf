abstract:
- language: en
  script: Latn
  content: "<p>Seamless MPLS design enables a single IP/MPLS network to scale over
    core, metro and access parts of a large network infrastructure using standardized
    IP/MPLS protocols.  One of the key goals of Seamless MPLS is to meet requirements
    specific to access devices, based on their position in the network topology and
    their compute and memory constraints limit the amount of state they can hold.
    \ This can be achieved with LDP Downstream-on-Demand (LDP DoD) as specified in
    RFC 5036 [RFC5036].  This document describes LDP DoD use cases and lists LDP DoD
    procedures in the context of Seamless MPLS design.</p>"
