title:
- language: en
  script: Latn
  content: Using Codec Control Messages in the RTP Audio-Visual Profile with Feedback with Layered Codecs
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-wenger-avtext-avpf-ccm-layered-00
docidentifier:
- content: draft-wenger-avtext-avpf-ccm-layered
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2015-12-09'
abstract:
- language: en
  script: Latn
  content: "<p>This document fixes a shortcoming in the specification language of\n   the Codec Control Message Full Intra Request (FIR) as defined in\n   RFC5104 when using with layered codecs.  In particular, a Decoder\n   Refresh Point needs to be sent by a media sender when a FIR is\n   received on any layer of the layered bitstream, regardless on whether\n   those layers are being sent in a single or in multiple RTP flows.\n   The other payload-specific feedback messages defined in RFC 5104 and\n   RFC 4585 as updated by RFC 5506 have also been analyzed, and no\n   corresponding shortcomings have been found.</p>"
