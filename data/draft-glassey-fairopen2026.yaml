- language: en
  script: Latn
  content: "<p>This document tracks the use of the terms Fair and Open as used in
    RFC2026, and their impact on the processes of the IETF Operations. It also summarizes
    a set of requirements for other changes to the governance models so stay in concert
    with the concept that the ETF’s processes be fair and open.</p>"
