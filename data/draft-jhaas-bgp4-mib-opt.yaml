abstract:
- language: en
  script: Latn
  content: "<p>This memo is an extention to the BGP-4 MIB to support the Optional\nParameters attributes for Authentication [RFC1771 4.2a] and BGP-4\nCapabilities Advertisement [RFC2842].  Additionally, this MIB\nprovides a registration point for BGP-4 Capabilities defined\nprotocols.</p>"
