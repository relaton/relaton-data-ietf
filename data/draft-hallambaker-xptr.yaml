abstract:
- language: en
  script: Latn
  content: |-
    <p>The DNS XPTR resource record is defined.  An XPTR record may be used
       in combination with prefixed DNS records to create the effect of
       wildcarding and to simplify management where prefixed records are
       employed on an extended scale.</p>
