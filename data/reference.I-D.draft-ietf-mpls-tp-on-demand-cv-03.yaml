abstract:
- language: en
  script: Latn
  content: "<p>LSP-Ping is an existing and widely deployed OAM mechanism for MPLS
    LSPs.  This document describes extensions to LSP-Ping so that LSP- Ping can be
    used for On-demand Connectivity Verification of MPLS-TP LSPs.  This document also
    clarifies procedures to be used for processing the related OAM packets.  Further,
    it describes procedures for using LSP-Ping to perform Connectivity Verification
    and Route Tracing functions in MPLS-TP networks.  Finally this document updates
    RFC 4379 by adding a new address type and requesting a registry.</p>"
