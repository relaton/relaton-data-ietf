abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a protocol for the compression and
       decompression of data using the Markel Tree Algorithm.  This protocol
       allows for the compression of a 103MB file into a 1MB file, which can
       then be transmitted over a network and decompressed back to its
       original size at the receiving end.</p>
