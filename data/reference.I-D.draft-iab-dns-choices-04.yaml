abstract:
- language: en
  script: Latn
  content: "<p>This note discusses how to extend the DNS with new data for a new application.
    DNS extension discussion too often circulates around reuse of the TXT record.
    This document lists different mechanisms to accomplish the extension to DNS, and
    comes to the conclusion that the use of a new RR Type is the best solution.</p>"
