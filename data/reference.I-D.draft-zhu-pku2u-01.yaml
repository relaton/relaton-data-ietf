abstract:
- language: en
  script: Latn
  content: "<p>This document defines the public key cryptography based user-to-user
    authentication protocol - PKU2U. This mechanism provides security services in
    peer to peer networking environments without requiring a trusted third party.
    Furthermore, the binding of PKU2U for the Generic Security Service Application
    Program Interface (GSS-API) per RFC2743 is defined based on RFC4121.</p>"
