abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides a technical guide for certification path
       validation of web server certificates during Internet SSL/TLS
       protocol communication, including the basic path verification
       process, as well as reference procedures, guidance and suggestions
       for input, initialization, and basic certificate processing in the
       verification process.  This document is applicable to the development
       and application of Internet browsers, as well as other similar
       digital certificate authentication systems requiring SSL/TLS security
       protocol secure communication.</p>
