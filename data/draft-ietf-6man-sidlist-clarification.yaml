abstract:
- language: en
  script: Latn
  content: "<p>Segment Routing over IPv6 (SRv6) is the instantiation of Segment Routing
    (SR) on the IPv6 data plane. Segments are indicated by Segment Identifiers (SIDs).
    SRv6 utilizes the Segment Routing Header (SRH), an IPv6 extension header, that
    includes a SID list indicating the sequence of segments and any additional processing
    to be performed. This document updates RFC 8754 by clarifying the processing of
    SID list entries. It does not change any elements of the SRv6 architecture.</p>"
