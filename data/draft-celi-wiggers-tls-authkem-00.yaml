- language: en
  script: Latn
  content: "<p>This document gives a construction for KEM-based authentication in
    TLS 1.3. The overall design approach is a simple: usage of Key Encapsulation Mechanisms
    (KEM) for certificate-based authentication. Discussion Venues This note is to
    be removed before publishing as an RFC. Discussion of this document takes place
    on the mailing list (), which is archived at. Source for this draft and an issue
    tracker can be found at https://github.com/claucece/draft-celi-wiggers-tls-authkem.</p>"
