abstract:
- language: en
  script: Latn
  content: |-
    <p>This document gives a construction for KEM-based authentication in
       TLS 1.3.  The overall design approach is a simple: usage of Key
       Encapsulation Mechanisms (KEM) for certificate-based authentication.

