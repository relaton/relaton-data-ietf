abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to the specifications in RFC5101,
    IP Flow Information Export (IPFIX), when using the Partial Reliability extension
    of SCTP (PR-SCTP, Partial Reliability Stream Control Transmission Protocol). When
    implemented at both the Exporting and Collecting Processes, this method offers
    several advantages such as the ability to calculate Data Record losses for PR-SCTP,
    immediate export of Template Withdrawal Messages, immediate reuse of Template
    IDs within an SCTP stream, reduced likelihood of Data Record loss, and reduced
    demands on the Collecting Process.  When implemented in only the Collecting or
    Exporting Process then normal IPFIX behavior will be seen without these additional
    benefits.</p>"
