abstract:
- language: en
  script: Latn
  content: "<p>Post-quantum DNSSEC signature algorithms have much larger keys and/or\n   signatures than the elliptic-curve algorithms in common use today.\n   For any such algorithm the apex DNSKEY RRset grows, since it carries\n   the key material; the open question is whether the rest of the zone\n   has to grow with it.  A key-signing key (KSK) signs only the apex\n   DNSKEY RRset, so its signature size is nearly irrelevant; a zone-\n   signing key (ZSK) signs every other RRset, so keeping its signatures\n   small is what keeps ordinary responses small.  Confining a large\n   algorithm to the KSK, and using a small-signature algorithm for the\n   ZSK, keeps the cost of the large algorithm contained in the DNSKEY\n   RRset.\n\n   This document specifies the changes that make this pattern safe and\n   practical: (1) it relaxes the DNSSEC signing rule that requires a\n   zone to be signed with every algorithm present in the apex DNSKEY\n   RRset, so that an algorithm used only by a key-signing key need not\n   be applied to the rest of the zone; (2) it relies on ordinary ZSK\n   rotation to bound the residual exposure of the ZSK algorithm; and (3)\n   it specifies how a resolver can use the algorithm number in the\n   parent's DS RRset to recognize a likely-oversized DNSKEY RRset and\n   select a transport suitable for large responses, avoiding the\n   truncate-then-retry round trip.  This document updates RFC 4035 and\n   RFC 6840.</p>"
