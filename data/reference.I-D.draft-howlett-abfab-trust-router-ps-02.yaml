abstract:
- language: en
  script: Latn
  content: "<p>This document is a problem statement for a Trust Router Protocol.  A
    Trust Router Protocol is needed to support large, multihop ABFAB federations,
    without the need for credentials to be configured for every pair of Identity Providers
    and Relying Parties.</p>"
