abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a lightweight in-band in-network edge-to-edge
    flow-based network round trip time measurement architecture and proposes the implementation
    over IOAM E2E option. By augmenting the IOAM E2E option header, the process can
    be fully done in data plane without needing to involve the control plane to maintain
    any states.</p>"
