abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model for representing, retrieving,
    and manipulating Optical Transport Network (OTN) topologies. It is independent
    of control plane protocols and captures topological and resource-related information
    pertaining to OTN.</p>"
