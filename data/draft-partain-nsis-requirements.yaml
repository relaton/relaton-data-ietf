- language: en
  script: Latn
  content: "<p>This memo identifies a set of requirements that must be applied to
    the development of the NSIS quality of service (QoS) signalling protocol. These
    requirements are based upon the needs of various kinds of applications that will
    utilize IP networks and need to be able to signal their QoS needs</p>"
