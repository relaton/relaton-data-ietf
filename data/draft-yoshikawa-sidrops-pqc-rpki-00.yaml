abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an initial post-quantum signature algorithm\n   profile and migration considerations for the Resource Public Key\n   Infrastructure (RPKI).  It profiles ML-DSA-65 as the primary\n   candidate for an RPKI next signature algorithm suite by reusing the\n   ML-DSA algorithm identifiers and CMS conventions defined by LAMPS.\n   It also describes how Certification Authorities, repository\n   operators, and Relying Parties can evaluate and deploy a post-quantum\n   suite while preserving the existing RPKI architecture and router-\n   facing VRP/RTR model.\n\n   This document profiles candidate post-quantum signature algorithms\n   for RPKI certificates, CRLs, certification requests, and CMS signed\n   objects.  It is written as input to SIDROPS discussion and does not\n   update RFC 7935 in this revision.  It does not define a new RPKI\n   object format, a new cryptographic primitive, a new repository\n   synchronization protocol, or a new router protocol.</p>"
