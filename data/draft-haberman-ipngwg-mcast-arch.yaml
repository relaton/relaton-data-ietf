abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the multicast addressing architecture of
    the \nIP Version 6 protocol.  The updated multicast address architecture \npresented
    in this document allows for unicast prefix-based allocation \nof multicast addresses.
    \ It is an update of section 2.7 of the RFC \n2373.</p>"
