abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the syntax of LISTA and SELECTA commands for
    the Internet Message Access Protocol [RFC3501]. With LISTA command, a client can
    obtain a list of all the accounts authenticated for the user. With SELECTA command,
    a client can select one of the user's authenticated accounts and then gain access
    to all the mailboxes belonging to that account, without having to log out of the
    current account.</p>"
