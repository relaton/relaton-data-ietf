abstract:
- language: en
  script: Latn
  content: "<p>Stateless Address Mapping (SAM) is a generic technique to achieve global
    IPv4 or IPv6 connectivity across local domains where routing is in a different
    address space.  To cope with the IPv4 address shortage, it supports an extension
    of IPv4 addresses with dynamic- port prefixes.  For multi-homed routing domains,
    it ensures that source addresses that cross domain borders are always routable
    in the reverse direction (Reverse Path Forwarding).  SAM can be used alone as
    an alternative to NATs, to improve scalability and end-to-end network transparency,
    or in combination with NATs, to cover a wider range of IPv4-IPv6 coexistence scenarios.</p>"
