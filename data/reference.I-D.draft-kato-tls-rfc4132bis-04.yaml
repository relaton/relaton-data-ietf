abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a set of cipher suites for the Transport Security
    Layer (TLS) protocol to support the Camellia encryption algorithm as a block cipher.
    \ It amends the ciphersuites originally specifed in RFC 4132 by counterparts using
    the newer cryptographic hash algorithms from the SHA-2 familiy.  This document
    obsoletes RFC 4132.</p>"
