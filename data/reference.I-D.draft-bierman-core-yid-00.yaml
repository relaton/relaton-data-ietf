abstract:
- language: en
  script: Latn
  content: "<p>This document describes an encoding of YANG object identifiers using
    numeric values instead of string values.  It combines several techniques to provide
    optimized serialization in protocol messages.  Note  Discussion and suggestions
    for improvement are requested, and should be sent to core@ietf.org.</p>"
