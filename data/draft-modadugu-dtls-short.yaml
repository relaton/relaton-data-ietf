- language: en
  script: Latn
  content: "<p>This document describes a series of extensions to Datagram Transport
    Layer Security (DTLS) which reduce the per-record bandwidth of the data channel.
    These extensions apply only to the on-the-wire representation of the protocol
    and do not affect cryptographic processing.</p>"
