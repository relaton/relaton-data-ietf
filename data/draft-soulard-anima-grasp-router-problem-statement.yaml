abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes challenges for using the GeneRic Autonomic Signaling
    Protocol (GRASP) in the context of deployment of services on machines (servers,
    Virtual Machines, etc) without the network elements, such as routers, needing
    any support for GRASP by themselves. It analyses issues regarding the discovery
    mechanism, including discovery across subnets and operation across administrative
    boundaries, and provides terminology and general considerations for the development
    of future extensions, profiles, and architectural refinements.</p>"
