abstract:
- language: en
  script: Latn
  content: "<p>IANA maintains several registries that were created for IPv4 extensions.
    As the IPv4 core specification is no longer being extended and as some registries
    do not have a defined IANA registration procedure, these registries need to be
    updated to indicate a registration procedure or to reflect the current practice
    that defining such extensions is not recommended.</p>"
