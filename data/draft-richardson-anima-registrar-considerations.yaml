abstract:
- language: en
  script: Latn
  content: "<p>This document describes a number of operational modes that a BRSKI
    Registration Authority (Registrar) may take on. Each mode is defined, and then
    each mode is given a relevance within an over applicability of what kind of organization
    the Registrar is deployed into. This document does not change any protocol mechanisms.
    This document includes operational advice about avoiding unwanted consequences.</p>"
