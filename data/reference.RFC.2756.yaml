abstract:
- language: en
  script: Latn
  content: "<p>This document describes HTCP, a protocol for discovering HTTP caches
    and cached data, managing sets of HTTP caches, and monitoring cache activity.
    \ This is an experimental protocol, one among several proposals to perform these
    functions.  This memo defines an Experimental Protocol for the Internet community.</p>"
