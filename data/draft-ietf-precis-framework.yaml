title:
- language: en
  script: Latn
  content: 'PRECIS Framework: Preparation, Enforcement, and Comparison of Internationalized
    Strings in Application Protocols'
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-precis-framework-23
