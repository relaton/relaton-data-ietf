abstract:
- language: en
  script: Latn
  content: "<p>Web Bot Auth authenticates automated clients to origins using HTTP
    Message Signatures, with verification keys published in a key directory at a well-known
    URI. Current drafts assume that each agent operator hosts its own key directory.
    A large and growing population of agents is operated by individuals and small
    organizations for whom hosting a directory is impractical, and whose legitimate
    traffic is otherwise indistinguishable from abusive automation. This document
    describes the hosted (multi-tenant) key directory deployment model, in which a
    registry operator publishes key directories on behalf of many independent agent
    operators while the operators retain exclusive custody of their private keys.
    It analyzes principal mapping, proof of key possession, freshness, and accountability
    in this model; reports interoperability observations from an independent implementation;
    and offers operational guidance for hosted directory operators and for verifiers.
    It is intended as input to the Web Bot Auth working group's operational and deployment
    guidance.</p>"
