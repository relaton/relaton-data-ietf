abstract:
- language: en
  script: Latn
  content: |-
    <p>Network operators operating overlay networks require the ability to
       identify hops in an underlay network when traceroute in the overlay.
       This document defines an ICMP Error extension message to carry the
       underlay error information to the overlay network endpoint.</p>
