abstract:
- language: en
  script: Latn
  content: "<p>Deployed agent tool-interface protocols carry JSON Schema type declarations
    for tools, but a type declaration is not a contract: nothing signals that a tool
    is fully schema-bounded, conformance to declared schemas is self-certified by
    the declaring party, declarations are not pinned between discovery time and invocation
    time, and error channels are untyped by design. As a consequence, any decision
    made about a tool call — authorization, discovery, audit, or composition — requires
    a language model to interpret what the call means, even for the large class of
    tools that are not intrinsically open-ended. This document states that problem
    and poses questions for the community. It deliberately proposes no mechanism.</p>"
