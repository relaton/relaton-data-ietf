abstract:
- language: en
  script: Latn
  content: "<p>Intent was defined as an abstract high-level policy (or instruction)
    used to trigger network operations (not only configuration aspects, but also continuous
    tuning to adjust the measured/actual network state to an expected state). This
    document describes the intent- driven management architecture, its key elements,
    and interfaces.</p>"
