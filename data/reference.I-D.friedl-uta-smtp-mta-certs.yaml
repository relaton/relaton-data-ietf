abstract:
- language: en
  script: Latn
  content: "<p>This document describes TLS server identity verification procedure
    for Message Transfer Agent (MTA) to Message Transfer Agent connections in an SMTP
    email network, with specific guidance on identity verification steps associated
    with delegated email services. This document is intended to supplement the identify
    verification procedures described in [RFC6125].</p>"
