abstract:
- language: en
  script: Latn
  content: |-
    <p>Autonomous software agents are being deployed across enterprise,
       cloud, and cross-organizational boundaries.  These agents negotiate,
       transact, delegate, and produce work products that persist beyond
       their own ephemeral runtime.  Current standards and initiatives for
       agent identity collectively address runtime authentication,
       authorization, lifecycle management, and tool interaction, but a gap
       remains: a durable, governance-backed identifier that lets a relying
       party determine and verify the accountable entity behind an agent it
       encounters, including agents that have since been retired or whose
       keys have rotated, and attribute past and present work products to
       that entity.  Lifecycle-history verification is governed by the
       applicable log method and deployment scope.

       DNSid addresses the accountable layer of identity: the durable
       ownership anchor that existing agent identity standards do not
       provide.  This document specifies DNSid, a minimal identity primitive
       that assigns each agent a Fully Qualified Domain Name (FQDN), binds
       it to an accountable entity identified by a DNS domain under that
       entity's control, and publishes a structured set of pointers in DNS
       TXT records to the agent's cryptographic keys, lifecycle log, and
       operational status.  DNSid uses accountable-entity-controlled
       signatures for record integrity and an abstract append-only lifecycle
       log for history.  It is designed to sit beneath existing identity,
       authentication, authorization, and agent interaction standards
       without competing with them.

       DNSid introduces no new DNS resource record types, opcodes, or
       response codes, and requires no changes to DNS resolvers,
       authoritative servers, or the DNS protocol.  It applies to any agent
       that can be assigned an FQDN whose accountable entity can publish
       verification material; public discoverability of the agent is not
       required.</p>
