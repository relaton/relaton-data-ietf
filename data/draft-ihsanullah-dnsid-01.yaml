abstract:
- language: en
  script: Latn
  content: "<p>Autonomous software agents are being deployed across enterprise,\n   cloud, and cross-organizational boundaries.  These agents negotiate,\n   transact, delegate, and produce work products that persist beyond\n   their own ephemeral runtime.  Current standards and initiatives for\n   agent identity collectively address runtime authentication,\n   authorization, lifecycle management, and tool interaction, but a gap\n   remains: a durable, governance-backed identifier that lets a relying\n   party determine and verify the accountable entity behind an agent it\n   encounters, including agents that have since been retired or whose\n   keys have rotated, and attribute past and present work products to\n   that entity.  Lifecycle-history verification is governed by the\n   applicable log method and deployment scope.\n\n   DNSid addresses the accountable layer of identity: the durable\n   ownership anchor that existing agent identity standards do not\n   provide.  This document specifies DNSid, a minimal identity primitive\n   that assigns each agent a Fully Qualified Domain Name (FQDN), binds\n   it to an accountable entity identified by a DNS domain under that\n   entity's control, and publishes a structured set of pointers in DNS\n   TXT records to the agent's cryptographic keys, lifecycle log, and\n   operational status.  DNSid uses accountable-entity-controlled\n   signatures for record integrity and an abstract append-only lifecycle\n   log for history.  It is designed to sit beneath existing identity,\n   authentication, authorization, and agent interaction standards\n   without competing with them.\n\n   DNSid introduces no new DNS resource record types, opcodes, or\n   response codes, and requires no changes to DNS resolvers,\n   authoritative servers, or the DNS protocol.  It applies to any agent\n   that can be assigned an FQDN whose accountable entity can publish\n   verification material; public discoverability of the agent is not\n   required.</p>"
