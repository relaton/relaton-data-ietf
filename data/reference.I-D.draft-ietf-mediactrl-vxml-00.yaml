abstract:
- language: en
  script: Latn
  content: "<p>This document describes a SIP interface to VoiceXML media services.
    Commonly, application servers control media servers use this protocol for pure
    VoiceXML processing capabilities. This protocol is an adjunct to the full MEDIACTRL
    protocol and packages mechanism.Comments Please send comments on this draft to
    the MEDIACTRL mail list, mediactrl@ietf.org.</p>"
