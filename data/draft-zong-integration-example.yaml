abstract:
- language: en
  script: Latn
  content: "<p>Decoupled Application Data Enroute (DECADE) system is an in-network
    storage infrastructure which was discussed in IETF. This document presents two
    detailed examples of how to integrate such in-network storage infrastructure into
    peer-to-peer (P2P) applications to achieve more efficient content distribution,
    and Application Layer Traffic Optimization (ALTO) system to build a content distribution
    platform for Content Providers (CPs).</p>"
