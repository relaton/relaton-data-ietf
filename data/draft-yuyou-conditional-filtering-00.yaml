abstract:
- language: en
  script: Latn
  content: "<p>In Media over QUIC Transport (MOQT), subscribers can use Range Filters
    to select specific subgroups, objects, or priorities within a subscribed track.
    However, these subscription filters are static once established and can only be
    modified through explicit subscriber control signaling. This document proposes
    an extension to the Range Filter design that binds conditional evaluation logic
    directly to specific Range Filter sets. By introducing dynamic conditions to Range
    Filter configurations, a relay can autonomously adapt the intra-track forwarding
    behavior based on real-time network conditions, avoiding the round-trip delay
    of explicit subscriber update signaling.</p>"
