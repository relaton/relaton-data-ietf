abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism for achieving lossless Equal-Cost
    Multi-Path (ECMP) convergence by utilizing the propagation of Local Degrade (LD)
    and Remote Degrade (RD) signals defined in the Physical Coding Sublayer (PCS)
    layer of IEEE 802.3. The mechanism enables proactive ECMP path switching upon
    detection of link degradation, before an actual link failure occurs, thereby preventing
    packet loss during routing convergence.</p>"
