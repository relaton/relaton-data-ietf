abstract:
- language: en
  script: Latn
  content: "<p>This document extends BGP SR Policy, the same protocol used to\n   configure SR Policies, to report operational state information of SR\n   Policies, Candidate Paths, and Segment Lists.\n\n   Optional State sub-TLVs, carried within the BGP Tunnel Encapsulation\n   attribute, are introduced in this document to report the operational\n   states (e.g., Down, Inactive, or Invalid) along with their associated\n   reasons of the SR Policies from network elements to controller.\n\n   These extensions are restricted to operational state reporting and do\n   not alter SR Policy computation, path selection procedures, or the\n   operations of the base BGP protocol.</p>"
