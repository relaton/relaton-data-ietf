abstract:
- language: en
  script: Latn
  content: "<p>A Cryptographically Generated Address is an IPv6 addresses binding
    with a public/private key pair. However, the current CGA specifications are lack
    of procedures to enable proper management of CGA generation. Administrators should
    be able to configure parameters used to generate CGA. The Dynamic Host Configuration
    Protocol for IPv6 (DHCPv6), which enables network management to dynamically configure
    hosts, can be used in the CGA configuration. This document defines the process
    using DHCPv6 to configure CGA in detail, include configuration CGA parameters
    and that a DHCPv6 server grants the CGA usage. Two new DHCPv6 options are defined
    accordingly.</p>"
