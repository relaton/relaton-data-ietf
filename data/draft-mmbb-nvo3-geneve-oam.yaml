abstract:
- language: en
  script: Latn
  content: "<p>This document lists a set of general requirements for active OAM protocols
    in the Geneve overlay network. Based on the requirements, IP encapsulation for
    active Operations, Administration, and Maintenance protocols in Geneve protocol
    is defined. Considerations for using ICMP and UDP-based protocols are discussed.</p>"
