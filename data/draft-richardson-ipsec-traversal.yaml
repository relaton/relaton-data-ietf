abstract:
- language: en
  script: Latn
  content: "<p>This document describes a public key certificate mechanism to authorize
    traversal of multiple security gateways (firewalls). This work is independant
    of transport layer in concept, and could apply to IPsec, TLS, or SecSH. It is
    applied here to IPsec. The SPKI certificate format is used here.</p>"
