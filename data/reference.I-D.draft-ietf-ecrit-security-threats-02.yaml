abstract:
- language: en
  script: Latn
  content: "<p>This document reviews the security threats associated with: o the marking
    of signalling messages to indicate that they are related to an emergency; and
    o the process of mapping from locations to Universal Resource Identifiers (URIs)
    pointing to Public Safety Answering Points (PSAPs). This mapping occurs as part
    of the process of routing emergency calls through the IP network. Based on the
    idnetified threats, this document establishes a set of security requirements for
    the the mapping protocol and for the handling of emergency-marked calls.</p>"
