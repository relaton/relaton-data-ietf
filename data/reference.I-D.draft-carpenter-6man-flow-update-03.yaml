abstract:
- language: en
  script: Latn
  content: "<p>Various published proposals for use of the IPv6 flow label are incompatible
    with its existing specification in RFC 3697.  This document proposes changes to
    the specification that permit additional use cases.  The concept of flow label
    domains is introduced, with the label possibly being rewritten at domain boundaries.</p>"
