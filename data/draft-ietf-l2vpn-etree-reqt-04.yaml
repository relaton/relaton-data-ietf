abstract:
- language: en
  script: Latn
  content: "<p>This document provides functional requirements for Metro Ethernet Forum
    (MEF) Ethernet Tree (E-Tree) support in multipoint L2VPN solutions (referred to
    as simply L2VPN). It is intended that potential solutions will use these requirements
    as guidelines.</p>"
