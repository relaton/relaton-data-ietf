abstract:
- language: en
  script: Latn
  content: "<p>This document describes the problems in obtaining IP Performance Metrics
    (IPPM) one-way and two-way active measurements across Internet paths that traverse
    Network Address Translators (NATs).  It also documents the requirements, guidelines
    and best practices when such measurements are obtained across NATs.</p>"
