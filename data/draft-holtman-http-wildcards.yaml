abstract:
- language: en
  script: Latn
  content: "<p>The HTTP/1.1 specification (RFC 2068) defines an Accept-Charset header,
    but fails to define a wildcard '*' which could be used in this header to match
    all character sets. This proposal corrects this omission.</p>"
