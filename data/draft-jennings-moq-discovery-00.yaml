abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines how MOQT clients discover server endpoints
       using DNS and Multicast DNS (mDNS).  It specifies SVCB and HTTPS DNS
       record mappings for the moqt URI scheme, SRV records as a fallback
       mechanism, and DNS-SD over mDNS for local network discovery.</p>
