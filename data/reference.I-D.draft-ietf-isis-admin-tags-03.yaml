abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to the IS-IS protocol to add operational
    capabilities that allow for ease of management and control over IP prefix distribution
    within an IS-IS domain. This document enhances the IS-IS protocol by extending
    the information that a Intermediate System (IS) [router] can place in Link State
    Protocol Data Units (LSPs) for policy use. This extension will provide operators
    with a mechanism to control IP prefix distribution throughout multi-level IS-IS
    domains. Additionally, the information can be placed in LSPs that have TLVs as
    yet undefined, if this information is used to convey the same meaning in these
    future TLVs as it is used in the currently defined TLVs.</p>"
