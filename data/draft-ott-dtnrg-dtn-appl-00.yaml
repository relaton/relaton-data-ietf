abstract:
- language: en
  script: Latn
  content: "<p>This document discusses issues arising when moving the bundle protocol
    usage from closed or lab deployments into open, heterogeneous environments with
    a variety of usages and applications carried over common bundle agents. We address
    naming conventions and endpoint identifiers, content encapsulation, and on the
    identification of application contents.</p>"
