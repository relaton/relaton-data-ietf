  script: Latn
  content: "<p>This specification defines the application/proxy-explanation+json media
    type, to allow HTTP proxies to explain to clients why a request is unsuccessful.
    Note to Readers The issues list for this draft can be found at https://github.com/mnot/I-D/labels/proxy-explanation.
    The most recent (often, unpublished) draft is at https://mnot.github.io/I-D/proxy-explanation/.
