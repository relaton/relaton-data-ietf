abstract:
- language: en
  script: Latn
  content: "<p>This document describes Real-Time Transport Protocol (RTP) payload
    formats for carrying each of MPEG-4 Audio and MPEG-4 Visual bitstreams without
    using MPEG-4 Systems.  It is a revision of RFC 3016 and is needed because of some
    misalignments between RFC 3016 and the 3GPP PSS specification regarding the RTP
    payload format for MPEG-4 Audio.  For the purpose of directly mapping MPEG-4 Audio/Visual
    bitstreams onto RTP packets, this document provides specifications for the use
    of RTP header fields and also specifies fragmentation rules.  It also provides
    specifications for Media Type registration and the use of Session Description
    Protocol (SDP).  The audio payload format described in this document has some
    limitations related to the signaling of audio codec parameters for the required
    multiplexing format.  Therefore, for new system designs should be utilize RFC
    3640 which does not have these restrictions.  Nevertheless, this revision of RFC
    3016 is provided to update and complete the specification, and to enable interopeable
    implementations.  This document obsoletes RFC 3016.  It contains a summary of
    changes from RFC 3016 and discussed backward compatibility to RFC 3016.</p>"
