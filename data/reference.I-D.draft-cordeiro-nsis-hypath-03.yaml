abstract:
- language: en
  script: Latn
  content: "<p>In a multi-domain Internet that offers QoS guaranties for applications,
    there is the need of signaling among the domain entities which are responsible
    for QoS management. Because different do the HyPath approach uses the NSIS protocol
    and interactions with the local routing protocols to achieve an off path signaling
    in hybrid environments.</p>"
