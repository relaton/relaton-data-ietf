abstract:
- language: en
  script: Latn
  content: "<p>CoAP is a RESTful application protocol for constrained nodes and networks.
    \ The state of a resource on a CoAP server can change over time.  This specification
    provides a simple extension for CoAP that gives clients the ability to observe
    such changes.</p>"
