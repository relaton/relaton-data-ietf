abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6, specified in RFC 5213, is a network-based mobility
    protocol. It uses a Mobile Access Gateway (MAG) and a Local Mobility Anchor (LMA)
    to allow hosts to move around within a domain while keeping their address or address
    prefix stable [1]. Although the issues of mobile multicast in the PMIPv6 network
    are being discussed in the Multimob WG, how to provide the service connectivity
    for the mobile multicast source is still a problem for the PMIPv6. This document
    discusses the extensions of the PMIPv6 to support the multicast source mobility.</p>"
