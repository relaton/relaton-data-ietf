abstract:
- language: en
  script: Latn
  content: "<p>The SEARCH=INTHREAD extension extends the IMAP SEARCH command to search
    on entire threads as well as individual messages. Other commands which search
    are implicitly extended. The THREAD=REFS extension provides a threading algorithm
    using only the Feferences header field for use with the IMAP THREAD command.</p>"
