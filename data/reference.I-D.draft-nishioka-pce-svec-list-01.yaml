abstract:
- language: en
  script: Latn
  content: "<p>A Path Computation Element (PCE) performing dependent path computations,
    for instance calculating a diverse working and protected path do not share common
    network points, would need to synchronize the computations in order to increase
    the probability of meeting the working and protected path disjoint objective and
    network resource optimization objective. This document describes the usage of
    multiple Synchronization VECtors (SVECs) in the SVEC list. When a PCE  computes
    multiple sets of dependent path computation requests concurrently, it is required
    to use SVEC list for association among the sets of dependent path computation
    requests. The aim of this document is to define the association among SVECs and
    its processing rule.</p>"
