abstract:
- language: en
  script: Latn
  content: "<p>Ad Hoc networks present an IPv6 addressing challenge due to the undetermined
    neighborhood properties of their interfaces. IPv6 nodes assign IPv6 addresses
    to their Ad Hoc networks that must be locally unique. IPv6 nodes must therefore
    be able to assign topology- independent addresses when topology-oriented IPv6
    address delegation services are either absent or only intermittently available.
    This document introduces a new IPv6 address type that nodes can autonomously assign
    for use over Ad-Hoc networks.</p>"
