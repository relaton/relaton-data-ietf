abstract:
- language: en
  script: Latn
  content: <p>This document describes an Extensible Provisioning Protocol (EPP) extension
    for providing the status of server validations. Server validations can be done
    for an extensible set of types, with examples including validating the DNS resolution
    with the type "dns" and validating the DNSSEC with the type "dnssec". The validations
    can be performed synchronously that will include the extension in the response
    or asynchronously that will include the validation in a poll message. If validations
    are performed on a schedule, a change in the status of a typed-validation will
    be included in a poll message.</p>
