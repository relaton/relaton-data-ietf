abstract:
- language: en
  script: Latn
  content: <p>This document defines the bundle security protocol, which provides data
    integrity and confidentiality services for the bundle protocol. Separate capabilities
    are provided to protect the bundle payload and additional data that may be included
    within the bundle.  We also describe various bundle security considerations including
    policy options.  Status of this Memo  This Internet-Draft is submitted to IETF
    in full conformance with the provisions of BCP 78 and BCP 79.  Internet-Drafts
