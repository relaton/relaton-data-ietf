abstract:
- language: en
  script: Latn
  content: "<p>This document discusses scenarios and implications of LISP based overlay
    deployment in the Data Center. The alternatives for topological location of the
    different LISP functions are analyzed in the context of the most prevalent Data
    Center topologies. The role and deployment of LISP in the Wide Area Network and
    Data Center Interconnection are also discussed.</p>"
