abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the Layer Two Tunneling Protocol
    version 3 (L2TPv3) for support of structure-agnostic and structure- aware (CESoPSN
    style) Time-Division Multiplexing (TDM) pseudowires. Support of structure-aware
    (TDMoIP style) pseudowires over L2TPv3 is left for further study.</p>"
