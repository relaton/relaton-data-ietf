abstract:
- language: en
  script: Latn
  content: "<p>This document defines new attributes to facilitate Mobile IPv6 operations
    using RADIUS infrastructure.  The operations include bootstrapping of information
    required by the Mobile Node and the interface between the Network Access Server,
    Home Agent and the RADIUS server used to assist MIP6 operations.</p>"
