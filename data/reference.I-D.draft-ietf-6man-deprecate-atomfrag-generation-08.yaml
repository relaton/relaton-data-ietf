abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the security implications of the generation
    of IPv6 atomic fragments and a number of interoperability issues associated with
    IPv6 atomic fragments, and concludes that the aforementioned functionality is
    undesirable, thus documenting the motivation for removing this functionality in
    the revision of the core IPv6 protocol specification.</p>"
