abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies modifications required to 6RD so that both IPv6
    hosts can receive multicast data from IPv6 servers.  The protocol is based on
    proxying MLD at the 6RD Customer Edge and then tunneling MLD messages to 6RD Border
    Relays where IPv6 multicast routing is supported.  Multicast data received at
    6RD Border Relay is tunneled to 6RD Customer Edge node and then delivered to the
    hosts.  We show that IPv4 multicast and IGMP can be supported in a similar way.</p>"
