abstract:
- language: en
  script: Latn
  content: "<p>The WebSocket protocol enables two-way communication between a user
    agent running untrusted code running in a controlled environment to a remote host
    that has opted-in to communications from that code.  The security model used for
    this is the Origin-based security model commonly used by Web browsers.  The protocol
    consists of an initial handshake followed by basic message framing, layered over
    TCP.  The goal of this technology is to provide a mechanism for browser-based
    applications that need two-way communication with servers that does not rely on
    opening multiple HTTP connections (e.g. using XMLHttpRequest or &lt;iframe&gt;s
    and long polling).  NOTE!  THIS COPY OF THIS DOCUMENT IS OBSOLETE.  For an up-to-date
    copy of this specification, please see:  http://www.whatwg.org/specs/web-socket-protocol/Author's
    note  This document is automatically generated from the same source document as
    the HTML specification.  [HTML]  Please send feedback to either the hybi@ietf.org
    list or the whatwg@whatwg.org list.</p>"
