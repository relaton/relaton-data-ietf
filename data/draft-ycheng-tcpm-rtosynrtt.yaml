- language: en
  script: Latn
  content: |-
    <p>This document proposes seeding the retransmission timer by the RTT
       measured during the TCP connection establishment and updates the
       recommended approach in [RFC3390]. It discusses the motivation, the
       TCP  modification, and the experimental result.</p>
