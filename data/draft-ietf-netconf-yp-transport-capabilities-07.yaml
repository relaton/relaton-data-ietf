abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a YANG module for discovering transport capabilities
    for YANG notifications. The module augments the YANG notifications capabilities
    model with capabilities for the notification transport protocol, transport encoding,
    and transport encryption. The capabilities enable a client to determine the notification
    transport options supported by a NETCONF or RESTCONF server at runtime or at implementation
    time using the YANG instance data file format.</p>"
