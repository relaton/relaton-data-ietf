abstract:
- language: en
  script: Latn
  content: "<p>This document defines how EAP [5] (Extensible Authentication Protocol)\n   can  be  used with the SOCKS V5 protocol. EAP was defined to allow any\n   authentication mechanism to be used without any  modification  to  the\n   authentication protocol (i.e. CHAP, OTP).</p>"
