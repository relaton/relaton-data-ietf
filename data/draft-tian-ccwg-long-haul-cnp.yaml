abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a multi-level congestion response framework\n   and an associated Long-haul Congestion Notification Packet (Long-haul\n   CNP) for Data Center Interconnect (DCI) wide-area network scenarios.\n   The framework defines a graduated congestion response mechanism:\n   lightweight ECN marking for incipient congestion and device-\n   originated Long-haul CNP for severe or rapidly worsening congestion.\n   Long-haul CNP packets carry explicit control instructions (e.g., rate\n   reduction percentage, pause duration) and are sent directly by\n   congestion-aware intermediate nodes to the traffic source via\n   unicast, reducing feedback latency compared to receiver-mediated\n   congestion notification.  The document also specifies a multi-device\n   collaborative suppression mechanism and BDP-adaptive dynamic\n   threshold calculation for long-haul links.  Two packet encapsulation\n   formats are defined: an ICMPv6 extension and a RoCEv2 backward-\n   compatible extension.</p>"
