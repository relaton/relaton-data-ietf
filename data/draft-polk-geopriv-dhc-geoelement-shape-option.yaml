abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Dynamic Host Configuration Protocol (DHCP)\nOption
    for downloading a location shape to a client, from a server. \nThis is commonly
    called Location Configuration Information (LCI). \nServers that provide this information
    to a client are doing so by \ncommunicating via a Location Configuration Protocol,
    or LCP.</p>"
