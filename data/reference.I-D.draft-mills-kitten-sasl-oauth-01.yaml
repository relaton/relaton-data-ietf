abstract:
- language: en
  script: Latn
  content: "<p>Simple Authentication and Security Layer (SASL) is a framework for
    providing authentication and data security services in connection- oriented protocols
    via replaceable mechanisms.  OAuth is a protocol framework for delegated HTTP
    authentication and thereby provides a method for clients to access a protected
    resource on behalf of a resource owner.  This document defines the use of HTTP
    authentication over SASL, and additionally defines authoriation and token issuing
    endpoint discovery.  Thereby, it enables schemes defined within the OAuth framework
    for non-HTTP-based application protocols.  A future version of this document will
    describe the integration into the Generic Security Services Application Program
    Interface (GSS-APIO).</p>"
