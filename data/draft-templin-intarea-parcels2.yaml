abstract:
- language: en
  script: Latn
  content: "<p>IPv6 Parcels and Advanced Jumbos (AJs) present new data packaging constructs
    for both existing Internetworking pathways and a new link model for the future.
    As is often the case, technologies developed in the IPv6 space can also be applied
    in IPv4 and vice-versa. This document presents the adaptations necessary to support
    Parcels and AJs in IPv4.</p>"
