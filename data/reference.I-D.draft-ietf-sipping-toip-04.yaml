abstract:
- language: en
  script: Latn
  content: "<p>This document provides a framework for the implementation of real-
    time text conversation over the IP network using the Session Initiation Protocol
    and the Real-Time Transport Protocol. It lists the essential requirements for
    real-time Text-over-IP (ToIP) and defines a framework for implementation of all
    required functions based on existing protocols and techniques. This includes interworking
    between Text-over-IP and existing text telephony on the PSTN and other networks.</p>"
