abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the verification.* constraint family --- a
    pre-action, fail-closed gate primitive for AI agent decisions, sibling in shape
    to the environment.* family used in Verifiable Intent specifications. A verification.*
    receipt is a JWS-signed artifact ([RFC7515]) carrying a canonical input, a derived
    binary act/halt output, and a versioned mapping identifier that binds them. A
    relying party recomputes the gate locally from signed primitives under the named
    mapping; the verifier never trusts the issuer's runtime. This shape provides decision
    explainability and traceability evidence aligned with EU AI Act Article 12 record-
    keeping obligations and with the Decision Explainability tier of Anthropic's Zero
    Trust for AI Agents framework [ANTHROPIC-ZT]. The format is forward-compatible
    across mapping revisions: receipts signed under one mapping ID remain verifiable
    as correct-under-that- mapping after newer mappings ship.</p>"
