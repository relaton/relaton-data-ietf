abstract:
- language: en
  script: Latn
  content: "<p>This document specifies FTP commands to download thumbnails of remote
    images, remove entire directory trees, request the amount of storage space available
    to the user, request the size of a remote directory and its contents, and to specify
    an FTP host.  The commands are designed to reduce the number of server / client
    exchanges, provide information that was not previously available, and to reduce
    bandwidth requirements for some higher level operations.</p>"
