  script: Latn
  content: Generic Address Assignment Option for 6LoWPAN Neighbor Discovery
  format: text/plain
docidentifier:
- content: draft-ietf-6lo-nd-gaao
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to the IPv6 Neighbor Discovery
    in Low Power and Lossy Networks (LLNs), enabling a node to request to be assigned
    an address or a prefix from neighbor routers, without introducing a centralized
    infrastructure and without relying on multicast messages. Such a mechanism makes
    it possible to algorithmically assign addresses and prefixes to nodes in a 6LoWPAN
    deployment. The proposed mechanism is more efficient in such specific scenario
    with respect to DHCPv6.</p>"
