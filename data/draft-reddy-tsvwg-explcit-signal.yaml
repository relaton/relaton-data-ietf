abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for endpoints to explicitly signal
    encrypted metadata to the network, and the network to signal its ability to accommodate
    that metadata back to the endpoints. This mechanism can be used where the endpoints
    desire that some network elements along the path receive these explicit signals.</p>"
