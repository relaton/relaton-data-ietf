abstract:
- language: en
  script: Latn
  content: "<p>This document defines Silithium, an augmentation of US NIST Module-
    Lattice-based Digital Signing Algorithm (ML-DSA) [FIPS.204] with traditional elliptic-curve
    operations, that uses ML-DSA in a black- box manner. This results in a digital
    signature scheme with hybrid security, requiring solving hard lattice problems
    as well as discrete logarithm in order to forge a signature. This augmentation
    is designed to satisfy regulatory guidelines in certain regions. Silithium is
    strongly unforgeable as long as ML-DSA is. Morevoer, Silithium can be used in
    a backward compatible and interopable manner without hindering security.</p>"
