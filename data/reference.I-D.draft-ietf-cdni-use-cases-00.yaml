abstract:
- language: en
  script: Latn
  content: "<p>Content Delivery Networks (CDNs) are commonly used for improving the
    footprint and the end-user experience of a content delivery service, at a reasonable
    cost.  This document outlines real world use-cases (not technical solutions) for
    interconnecting CDNs.  It can be used to provide guidance to the CDNI WG about
    the interconnection arrangements to be supported and to validate the requirements
    of the various CDNI interfaces.  This document describes a number of use cases
    that motivate CDN Interconnection.  It represents a work in progress and may be
    extended later to cover additional use-cases.</p>"
