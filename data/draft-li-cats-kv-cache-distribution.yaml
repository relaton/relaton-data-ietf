abstract:
- language: en
  script: Latn
  content: "<p>In large language model (LLM) inference, the key-value (KV) cache holds
    the attention state computed from previously processed tokens. Reusing cached
    state across requests avoids repeated prefill computation and reduces time-to-first-token.
    In distributed inference deployments, the KV cache becomes a network-distributed
    resource: the effectiveness of steering a request to a service instance depends
    not only on computing and network metrics but also on whether reusable cached
    state is available at or near that instance. This document describes the KV cache
    distribution use case for Computing-Aware Traffic Steering (CATS), identifies
    the gaps relative to the existing CATS framework and metrics, and states requirements
    for cache-state metric exposure and for the distribution and synchronization of
    cached content across multiple cache tiers.</p>"
