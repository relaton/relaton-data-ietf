abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a way to signal the usage of DoT, and the pinned
    keys for that DoT usage, in authoritative servers. This signal lives on the parent
    side of delegations, in DS records. To ensure easy deployment, the signal is defined
    in terms of (C)DNSKEY.</p>"
