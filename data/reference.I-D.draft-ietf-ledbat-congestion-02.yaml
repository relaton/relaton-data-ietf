abstract:
- language: en
  script: Latn
  content: "<p>LEDBAT is an alternative experimental congestion control algorithm.
    \ LEDBAT enables a networking application to minimize the extra delay it induces
    in the bottleneck while saturating the bottleneck.  It thus implements an end-to-end
    version of scavenger service.  LEDBAT has been been implemented in uTorrent, which
    is currently the most popular BitTorrent client, as the preferred congestion control
    mechanism, and deployed in the wild with favorable results.</p>"
