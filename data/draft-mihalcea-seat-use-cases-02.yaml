abstract:
- language: en
  script: Latn
  content: "<p>This document outlines desirable properties and use cases for integrating
    remote attestation (RA) capabilities with secure channel establishment protocols
    (e.g., TLS and DTLS). Peer authentication in such protocols establishes trust
    in a peer's network identifiers but provides no assurance regarding the integrity
    of its underlying software and hardware stack. Remote attestation addresses this
    gap by enabling a peer to provide verifiable evidence about the current state
    of the Target Environment. This document specifies a set of essential properties
    the protocol solution must have, including cryptographic binding to the secure
    connection, evidence freshness, and flexibility to support different attestation
    models. It then explores relevant use cases, such as confidential data collaboration
    and secure secrets provisioning, to motivate the need for this integration. This
    document is intended to serve as an input to the design of protocol solutions
    within the SEAT working group.</p>"
