abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a simple mechanism which enables a host using
    a cryptographically generated IPv6 address to delegate the task of secure neighbor
    discovery to another node, i.e., proxying, by means of establishing a 'symbiotic'
    relationship with that node.</p>"
