abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new Attachment Individual Identifier (AII)
    type which could be used when ITU Carrier Code (ICC) is used as the provider's
    globally unique identifier (Opr_ID).  The new AII (ICC AII) consists a ICC, a
    prefix and a AC ID field.</p>"
