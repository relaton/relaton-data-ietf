abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the use of the Domain Name System (DNS) for
    storage of E.164 [E164] numbers, and resolving those to URIs that can be used
    for (for example) call setup. This include how DNS can be used for identifying
    available services connected to one E.164 number. It obsoletes RFC 3761 [RFC3761].
    This version of the document (00) is not more than the start of a discussion for
    detailed changes.</p>"
