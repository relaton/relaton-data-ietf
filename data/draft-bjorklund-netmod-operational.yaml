abstract:
- language: en
  script: Latn
  content: "<p>This document defines the concept of operational state data in the\n   context of YANG and the Network Configuration Protocol (NETCONF).  It\n   updates RFC 6020 with rules for how to model the operational state,\n   and defines NETCONF operations to retrieve and modify the operational\n   state.</p>"
