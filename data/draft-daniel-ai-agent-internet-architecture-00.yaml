abstract:
- language: en
  script: Latn
  content: "<p>Autonomous AI agents are evolving from interactive assistants into
    networked software workloads that discover services, invoke tools, delegate authority,
    transact, communicate with other agents, and act asynchronously on behalf of humans
    and organizations. Existing Internet protocols provide strong foundations, but
    agent autonomy, dynamic delegation, machine-speed execution, and cross-domain
    interaction create requirements that span multiple protocol families. This document
    describes architectural requirements for supporting AI agents on the Internet
    across naming and discovery, HTTP, authentication, authorization and delegation,
    TLS and workload identity, asynchronous messaging, capability and intent-based
    resolution, payments, provenance, auditability, revocation, security, and privacy.
    It favors profiling and extending existing Internet protocols over defining a
    monolithic new agent protocol, and identifies the need for IETF-wide architectural
    coordination.</p>"
