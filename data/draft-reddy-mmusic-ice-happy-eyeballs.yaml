  content: |-
    <p>This document provides guidelines on how to make Interactive
       Connectivity Establishment (ICE) conclude faster in IPv4/IPv6 dual-
       stack scenarios where broken paths exist.  The provided guidelines
       are backwards compatible with the original ICE specification.</p>
