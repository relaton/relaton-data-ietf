- language: en
  script: Latn
  content: "<p>This memo proposes an extension to the SNMP MIB to support the adaptation
    of the ISO IDRP protocol that enables it to be used as an Inter-Autonomous System
    routing protocol in the TCP/IP Internet. This adaptation is called IDRP for IP.</p>"
