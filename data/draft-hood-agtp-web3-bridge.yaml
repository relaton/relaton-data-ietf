abstract:
- language: en
  script: Latn
  content: "<p>The Agent Transfer Protocol (AGTP) uses a PKI-based trust model:\n   agent identity is anchored to DNS-verified domain ownership and CA-\n   issued X.509 certificates.  Web3 systems offer an alternative\n   identity model based on blockchain address ownership, smart contract\n   verification, and decentralized naming systems including the Ethereum\n   Name Service (ENS) and Unstoppable Domains.  This document specifies\n   the AGTP Web3 Bridge: a framework for mapping Web3 identity anchors\n   to AGTP trust tiers, resolving Web3 names to canonical AGTP Agent-\n   IDs, and operating AGTP sessions with agents whose identity is\n   anchored to blockchain rather than DNS.  Web3-anchored agents are\n   treated as Trust Tier 2 (Org-Asserted) in the absence of additional\n   verification.  This document also defines the conditions under which\n   a Web3 identity MAY be elevated to Trust Tier 1 through a hybrid\n   verification procedure.</p>"
