abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies a new approach of Encapsulating Security Payload
    (ESP) Security Association (SA) negotiation. Because of the existing of the Cryptographically
    Generated Addresses (CGA) extension header and the key pair in CGA, it is convenient
    and feasible to negotiate ESP SA under the protection of key pair.</p>"
