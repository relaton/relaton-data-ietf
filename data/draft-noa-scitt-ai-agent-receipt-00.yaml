abstract:
- language: en
  script: Latn
  content: "<p>This document profiles the IETF SCITT (Supply Chain Integrity,\n   Transparency, and Trust) architecture for *AI-agent action receipts*:\n   tamper-evident, signed, offline-verifiable records of what an\n   autonomous agent did, for which principal, under which policy, with\n   what verdict.  Each receipt is a COSE_Sign1 Signed Statement (RFC\n   9052) over a canonical (RFC 8785 / JCS) payload, hash-chained for\n   ordering, and registrable in any SCITT Transparency Service to obtain\n   non-equivocation and tail-truncation properties a self-signed chain\n   cannot provide alone.  The profile makes a deliberately NARROW,\n   checkable claim — \"this is a tamper-evident, signature-verifiable\n   record of the action, principal, policy identity, and recorded\n   verdict\" — and explicitly does NOT claim that the agent was correct,\n   safe, or wise, that the recorded inputs were true or complete, or\n   that any real-world outcome followed.  A deterministic offline\n   policy-REPLAY capability (re-deriving the verdict from the recorded\n   inputs) is named here as a non-goal of this revision and is left to a\n   separate companion profile.</p>"
