abstract:
- language: en
  script: Latn
  content: "<p>In DMM scenario, it is possible for the MN to use multiple mobility
    anchor points and corresponding prefixes. In that case, MN needs to know the property
    of the addresses then it can select the optimized one for application to use.
    This document defines new IP network prefix types to assist address selection
    for applications.</p>"
