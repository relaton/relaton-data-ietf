abstract:
- language: en
  script: Latn
  content: "<p>Deploying new transport protocols on the Internet is a well-known problem,
    as NATs and firewall drop packets with new protocol types. Tunnelling over UDP
    is one way to make IP packets hide the actual payload and enable end-to-end delivery.
    \ This draft proposes a simple UDP tunnelling encapsulation and end-host operation
    to enable new IP payloads, e.g., new transport protocols, to be deployed on the
    Internet.</p>"
