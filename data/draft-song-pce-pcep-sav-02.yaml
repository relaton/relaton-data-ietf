abstract:
- language: en
  script: Latn
  content: "<p>This document presents a method of Path Computation Element (PCE) for
    Source Address Validation (SAV) in networks. It extends Path Computation Element
    Communication Protocol (PCEP) to support SAV policy distribution and synchronization
    between PCEP speakers for threat mitigation for source address spoofing.</p>"
