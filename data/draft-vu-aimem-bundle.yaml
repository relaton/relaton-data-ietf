abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a vendor-neutral interchange format for the\n   persistent memory of AI agents — preferences, decisions, identity\n   claims, pitfalls, and procedures that an agent accumulates across\n   sessions.\n\n   The format is a self-contained JSON Bundle with explicit conformance\n   levels (Producer, Consumer, Bidirectional).  Implementations MAY\n   accompany the Bundle with an HTTP Profile that exposes export and\n   import endpoints.\n\n   The goal is to allow a user's \"agent brain\" to move between cloud\n   services, on-premise installations, and third-party implementations\n   without lock-in, in a manner that interoperates with existing right-\n   to-erasure obligations such as [GDPR-A17].\n\n   This document is self-contained: all schema fields normatively\n   required by Producers and Consumers are defined inline.  An\n   informative reference implementation is cited in [AIMEM-REF].</p>"
