abstract:
- language: en
  script: Latn
  content: "<p>This document recommends a single preferred format for specifying trust
    anchors in DNSSEC validating resolvers and describes how the validating resolver
    should initalize the trust anchor for use upon start-up. This document also describes
    different mechanisms for keeping trust anchors up to date over time.</p>"
