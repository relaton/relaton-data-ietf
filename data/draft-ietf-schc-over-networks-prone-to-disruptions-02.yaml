abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of SCHC over different network topologies
    and devices regardless of their capabilities and configurations. The use of SCHC
    will bring connectivity to devices with disruptive connections caused by restrained
    use of battery and connectionless setups with long delays and latency.</p>"
