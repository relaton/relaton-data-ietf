abstract:
- language: en
  script: Latn
  content: <p>A number of ICMPv4 message types have become obsolete in practice, but
    have never been formally deprecated.  This document deprecates such ICMPv4 message
    types, thus cleaning up the corresponding IANA registry.  Additionally, it updates
    RFC792 and RFC950, obsoletes RFC1788, and requests the RFC Editor to change the
    status of RFC1788 to "Historic".</p>
