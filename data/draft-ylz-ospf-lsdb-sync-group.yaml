- language: en
  script: Latn
  content: "<p>This document describes a special scheme of OSPF Database synchronization
    by dividing OSPF Routers into different groups and preventing OSPF Routers from
    different groups to synchronize, this scheme can help to enhance the number of
    OSPF adjacencies and the capability of deploying OSPF on large network.</p>"
