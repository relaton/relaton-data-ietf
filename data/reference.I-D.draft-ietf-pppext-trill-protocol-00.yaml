abstract:
- language: en
  script: Latn
  content: "<p>The Point-to-Point Protocol (PPP) [1] defines a Link Control Protocol
    (LCP) and a method for negotiating the use of multi-protocol traffic over point-to-point
    links.  This document describes support for Transparent Interconnection of Lots
    of Links (TRILL) Protocol, allowing direct communication between Routing Bridges
    (RBridges) via PPP links.</p>"
