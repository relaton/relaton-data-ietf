abstract:
- language: en
  script: Latn
  content: "<p>This document describes a standard-based method for fast latency and\n   congestion notification.  By combining in-network telemetry and\n   source routing, it enables a source node to acquire a path's latency\n   and congestion status in less than half baseline RTT.  The more\n   timely and accurate telemetry data allow the source node to apply\n   more effective traffic steering and congestion control actions.  The\n   method is applicable to both WAN and DCN, and can be realized through\n   existing IETF standards.</p>"
