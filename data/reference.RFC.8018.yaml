- language: en
  script: Latn
  content: "<p>This document provides recommendations for the implementation of password-based
    cryptography, covering key derivation functions, encryption schemes, message authentication
    schemes, and ASN.1 syntax identifying the techniques.</p>"
- language: en
  script: Latn
  content: "<p>This document represents a republication of PKCS #5 v2.1 from RSA Laboratories'
