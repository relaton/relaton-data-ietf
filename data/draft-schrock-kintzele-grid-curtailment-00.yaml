abstract:
- language: en
  script: Latn
  content: "<p>This document defines GRACE, an application profile for one bounded
    grid.curtailment action. The profile binds an exact action to a finite participation
    envelope, distinct human approvals when required, one-attempt executor admission,
    an authenticated actuator acknowledgment, separately authenticated meter observations,
    an Action State Signed Statement, and one-time admission to a settlement effect.
    Missing or ambiguous post-invocation evidence is preserved as indeterminate and
    cannot authorize blind retry. GRACE verifies signed inputs and deterministic computations.
    It does not establish physical meter truth, baseline correctness, tariff eligibility,
    actual payment, complete mediation, or a physical grid deployment. An optional
    hybrid artifact-signature profile combines Ed25519 with ML-DSA-65 and requires
    both signatures to verify.</p>"
