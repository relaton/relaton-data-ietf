abstract:
- language: en
  script: Latn
  content: "<p>This draft discusses the security requirements and several issues which
    need to be considered in securing a virtualized data center network for multiple
    tenants (a NVO3 network for short).  In addition, the draft also attempts to discuss
    how such issues could be addressed or mitigated.</p>"
