abstract:
- language: en
  script: Latn
  content: |-
    <p>This document (re)introduces the ability to provide multiple answers
       in a DNS response.  This is especially useful as, in many cases, the
       entity making the request has no a prori knowledge of what other
       questions it will need to ask.</p>
