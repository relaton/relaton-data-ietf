- language: en
  script: Latn
  content: "<p>Current multiple interfaces terminal causes the problem of selecting
    a proper interface for a specific application, and this is a new question which
    will change the previous internet model. This document proposes a solution which
    extend DHCPv4 to carry the policy routing to map the IP flows to multiple interfaces.</p>"
