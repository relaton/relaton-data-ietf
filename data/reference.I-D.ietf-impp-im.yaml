abstract:
- language: en
  script: Latn
  content: "<p>Instant messaging is defined in RFC2778 [5]. Today, numerous instant
    messaging protocols are in use, and little interoperability between services based
    on these protocols has been achieved. This specification defines common semantics
    and data formats for instant messaging to facilitate the creation of gateways
    between instant messaging services.</p>"
