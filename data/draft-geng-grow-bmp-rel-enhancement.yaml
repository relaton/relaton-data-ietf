abstract:
- language: en
  script: Latn
  content: "<p>The Route Event Logging (REL) message is defined in [I-D.ietf-grow-bmp-rel],
    which enables monitored routers to report event-driven operational data to BMP
    collectors. This document defines additional event code points for BGP FlowSpec
    RFC8955 [RFC8956] and BGP SR Policies [I-D.ietf-idr-sr-policy-safi]. These extensions
    enhance monitoring visibility for policy execution failures and improve network
    operation and troubleshooting capabilities.</p>"
