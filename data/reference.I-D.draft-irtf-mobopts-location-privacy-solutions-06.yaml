abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv6 [10] enables mobile nodes to remain reachable while roaming
    on the Internet.  With its current specification, the location of a mobile node
    can be revealed and its movement can be tracked by simply monitoring its IP packets.
    \ In this document, we consider the MIP6 location privacy problem described in
    [14] and propose efficient and secure techniques to protect the location privacy
    of a mobile node.</p>"
