abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism of failure detection as well as communication
    recovery for the scenarios of multi-homing of Host Identity Protocol (HIP). It
    can be applied to HIP by using newly defined HIP parameters, so that a HIP-enabled
    multihomed host can timely detect the failures and switch to an alternative locator
    if currently used link breaks down or currently used locator is deprecated.</p>"
