- language: en
  script: Latn
  content: "<p>This document defines an extension for the SMIv2 which allows to define
    operations. Operations can among other things be used to define install/remove
    operations on conceptual MIB tables. This can result in simpler and more efficient
    implementations of configuration management systems.</p>"
