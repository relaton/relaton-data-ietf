abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a lightweight convention for namespaces in the
    JSON payloads of RPP: a registry of namespaces plus the convention to write JSON
    names as namespace_shortname. It is not intended to be published as a RFC, just
    to stir discussion.</p>"
