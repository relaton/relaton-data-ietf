abstract:
- language: en
  script: Latn
  content: "<p>This document contains requirements on the TCP/IP header compression
    scheme (profile) to be developed by the ROHC WG. The document discusses the scope
    of TCP compression, performance considerations, assumptions on the surrounding
    environment, as well as IPR concerns. The structure of this document is inherited
    from the document defining RTP/UDP/IP requirements for ROHC.</p>"
