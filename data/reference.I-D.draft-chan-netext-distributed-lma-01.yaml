abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes a distributed local mobility anchors architecture.
    \ It separates the full functions of a local mobility anchor into different logical
    functions: (1) allocation of home network prefixes or home addresses to mobile
    nodes, (2) location management (LM) which includes managing the IP addresses and
    locations of the mobile nodes and (3) mobility routing (MR) which includes intercepting
    and forwarding packets.  The distributed local mobility anchors architecture provides
    visited local mobility anchors in different networks with mobility routing function
    to avoid triangle routing problem in Proxy mobile IP or Mobile IP, but keeps the
    internetwork location management function at the home local mobility anchors at
    registered networks.  The needed location information of a mobile node is acquired
    only when a packet is first sent to the mobile node and are then cached at the
    visited local mobility anchor to enable subsequent optimized mobility routing.</p>"
