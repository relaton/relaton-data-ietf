abstract:
- language: en
  script: Latn
  content: <p>Layer 2 services (such as Frame Relay, Asyncronus Transfer Mode, Ethernet)
    can be "emulated" over an MPLS backbone by encapsulating the layer 2 Packet Data
    Units (PDU) and then transmitting them over "pseudowires". It is also possible
    to use pseudowires to provide low-rate Time Dividion Multiplexed and a Synchronous
    Optical NETworking circuit emulation over a MPLS enabled network. This document
    specifies a protocol for establishing and maintaining the pseudowires, using extensions
    to Label Distribution Protocol (LDP). Procedures for encapsulating layer 2 PDUs
    are specified in a set of companion documents.</p>
