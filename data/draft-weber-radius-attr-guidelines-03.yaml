- language: en
  script: Latn
  content: "<p>This memo explores various issues related to the data model used by
    the Remote Authentication Dial In User Service (RADIUS) protocol. Recommendations
    are made to facilitate internal alignment and uniformity. Attribute design guidelines
    are provided both as an aid to IETF development work, and to facilitate independent
    work by other Standards Development Organizations (SDOs).</p>"
