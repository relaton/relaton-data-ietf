  content: |-
    <p>This document suggests Hangeul-specific NAMEPREP recommendations.
    It defines :
    - mapping tables for half-width jamo and enclosed jamo
    - compatibility Hangeul jamo block to be excluded 
    from compatibility decomposition in normalization step
    - criteria for determining invalid syl-ipf jamo sequence
    - prohibited hangul filler character  in KC norm output.</p>
