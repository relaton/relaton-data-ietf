abstract:
- language: en
  script: Latn
  content: "<p>This intentionally incomplete design note defines an overlay for Human
    and Agent participation in existing Task and Action protocols. It separates the
    responsible Participant from the authenticated Actor, records Human interactions,
    excludes Humans from Agent discovery, and binds each change to its authorized
    request. It defines neither a wire protocol nor Humans as Agents.</p>"
