abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the format of EIP protocol elements and the\n   transport of EIP in different IPv6-based protocol headers.\n\n   In particular, this document defines the standalone EIP formats for\n   the IPv6 Hop-by-Hop Options Header and for the Segment Routing\n   Header, and it defines the generic format of EIP Information\n   Elements.  Other approaches to transport EIP, including integration\n   with the IOAM framework through the Global Opaque Block (GOB), are\n   described in separate documents.\n\n   Caveat: this document is still in brainstorming stage, it is\n   distributed to stimulate discussion.</p>"
