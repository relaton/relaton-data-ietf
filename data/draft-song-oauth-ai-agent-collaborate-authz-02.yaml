abstract:
- language: en
  script: Latn
  content: "<p>This method extends OAuth 2.0 by adding fields to token and message
    flows, enabling sub-agents to act as a task group. It simplifies authorization
    for task groups, avoids repeated interactions between sub-agents and the authorization
    server, and bounds the authority delegated to the group and to each member while
    maintaining compatibility with existing OAuth 2.0 workflows.</p>"
