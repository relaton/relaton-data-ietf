abstract:
- language: en
  script: Latn
  content: "<p>This document focuses on the problems encountered when using dynamic
    DNS in address sharing contexts (e.g., DS-Lite, NAT64, A+P)during IPv6 transition.
    Issues, possible solutions and preliminary implementation and validation of one
    of the solutions are documented in this memo.</p>"
