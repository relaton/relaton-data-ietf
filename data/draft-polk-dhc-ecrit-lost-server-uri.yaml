abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new Dynamic Host Configuration Protocol \n
    \  (DHC) Option to deliver a Location-to-Service Translation (LoST) \n   Protocol
    URI to a client.  This SIP(S)-URI will be become the \n   destination URI in any
    call set-up message to a Public Safety \n   Answering Point (PSAP) in times of
    an emergency.</p>"
