abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Shim pipeline for the Unheaded Protocol\n   Computer (UPC).  The Shim translates MBC (Monad Bytecode) programs\n   into eBPF execution contexts, defines the per-hop processing model,\n   and specifies the tick packet protocol that drives distributed\n   computation across IPv6 network hops.  The pipeline implements a\n   four-stage architecture: Assembly, Verification, Loading, and\n   Execution, with integrated support for memory-mapped I/O, framebuffer\n   rendering, and CRC validation.</p>"
