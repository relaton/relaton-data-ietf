abstract:
- language: en
  script: Latn
  content: "<p>It is highly desirable for Path Computation Clients (PCCs) to be able
    to dynamically discover a set of Path Computation Elements (PCEs) when PCCs/PCEs
    request a path computation to PCEs across ASes. In such a scenario, it is advantageous
    to use BGP to distribute PCE information. This document defines a new attribute
    and describes how PCE information can be carried using BGP.</p>"
