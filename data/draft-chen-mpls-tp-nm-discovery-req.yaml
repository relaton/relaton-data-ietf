  script: Latn
  content: "<p>Layer network topology display on NMS (Network Management System),
    and can refresh quickly on any change happen on managed network, this function
    is very useful and important in current and future TMN (Telecom Management Network).
    It implies equipment should provide some mechanism to support, such as auto discovery.
    These also apply to TMN of MPLS-TP network.</p>"
