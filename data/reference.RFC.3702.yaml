abstract:
- language: en
  script: Latn
  content: "<p>As Session Initiation Protocol (SIP) services are deployed on the Internet,
    there is a need for authentication, authorization, and accounting of SIP sessions.
    \ This document sets out the basic requirements for this work.  This memo provides
    information for the Internet community.</p>"
