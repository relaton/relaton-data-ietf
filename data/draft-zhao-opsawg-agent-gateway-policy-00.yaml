abstract:
- language: en
  script: Latn
  content: "<p>This document defines an operator-facing management and policy\n   control model for operator-managed Agent Gateways.  The model\n   controls and observes interactions mediated by an Agent Gateway; it\n   does not manage, govern, or modify the internal behavior or lifecycle\n   of an agent.\n\n   Agent-related identifiers, agent groups, tenants, task classes, and\n   service levels are used only as gateway-recognized policy matching\n   attributes.  Policies are enforced at the Agent Gateway and, when\n   validated gateway attachment bindings provide suitable selectors, at\n   associated network enforcement points.\n\n   The model is organized around four core policy classes: Interaction\n   Access Control, QoS and Flow Control, Invocation and Token Control,\n   and Path Selection.  The model also defines three supporting\n   management models: Subject and Attachment Binding, Applied Policy\n   State and Telemetry, and Policy Lifecycle and Failure Handling.\n\n   This document defines a YANG module for configuring and observing\n   Agent Gateway policy control state.  It does not define agent-runtime\n   governance, agent reasoning or planning, prompt or model-output\n   governance, global agent identity registration, DNS, service\n   discovery, or the semantics of existing ACL, QoS, routing, VPN,\n   traffic-engineering, or network-slice mechanisms.</p>"
