abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a cnf response parameter for the OAuth 2.0
    Token Exchange (RFC 8693) response. The parameter carries the confirmation method
    that the authorization server applied to the issued token, enabling clients to
    verify that sender-constraint binding (for example a DPoP key or mutual-TLS client
    certificate) was performed without inspecting the issued token. This is useful
    for opaque tokens, encrypted tokens, or any other case where the client cannot
    read the issued token's cnf claim directly.</p>"
