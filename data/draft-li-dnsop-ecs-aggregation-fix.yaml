id: draftlidnsopecsaggregationfix
schema_version: v1.5.6
formattedref:
  content: draft-li-dnsop-ecs-aggregation-fix
title:
- language: en
  script: Latn
  content: Strengthening DNS Query Aggregation against ECS-based Attacks
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-li-dnsop-ecs-aggregation-fix-02
docidentifier:
- content: draft-li-dnsop-ecs-aggregation-fix
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-06-28'
abstract:
- language: en
  script: Latn
  content: "<p>The DNS query aggregation mechanism is a critical defense against DNS\n   cache poisoning attacks that exploit the \"Birthday Paradox\".\n   However, recent research has revealed that flawed implementations of\n   the EDNS Client Subnet (ECS) option, as specified in RFC 7871, can be\n   exploited to bypass this defense.  This allows attackers to force a\n   resolver to issue multiple simultaneous queries for the same domain\n   name by crafting queries with different ECS options.  This\n   vulnerability revives the classic DNS Birthday Attack, posing a\n   significant threat to DNS resolvers and the clients they serve.\n\n   Section 11.2 of RFC 7871 notes the general risk of Birthday Attacks\n   and suggests marking whether responding nameservers send ECS options,\n   but it does not define a concrete mechanism.  This document turns\n   that observation into a specified processing model for the ECS option\n   in DNS resolvers.  A resolver tracks, per zone, whether the\n   authoritative servers use ECS: a \"no-ECS-support\" state forces query\n   aggregation for zones that do not use ECS, and an \"ECS-support\" state\n   lets a resolver treat an unexpected response without an ECS option\n   (or one with a zero scope) as suspect for zones that do, such as\n   content delivery networks.  The document also describes how a\n   resolver bounds the residual risk with a limit on simultaneous\n   outstanding queries.  It is offered as input that the working group\n   could fold into a future revision of RFC 7871.</p>"
