abstract:
- language: en
  script: Latn
  content: "<p>This document imposes a new requirement on Label Edge Routers (LER)
    specifying that when determining whether to MPLS encapsulate an IP packet, the
    determination is made independent of any IP options that may be carried in the
    IP packet header.  Lack of a formal standard has resulted in different LER forwarding
    behaviors for IP packets with header options despite being associated with a prefix-based
    Forwarding Equivalence Class (FEC).  IP option packets that belong to a prefix-based
    FEC but fail to be MPLS encapsulated simply due to their header options present
    a security risk against the MPLS infrastructure. Further, LERs that are unable
    to MPLS encapsulate IP packets with header options cannot operate in certain MPLS
    environments. This new requirement will reduce the risk of IP options-based security
    attacks against LSRs as well as assist LER operation across MPLS networks which
    minimize the IP routing information carried by LSRs.</p>"
