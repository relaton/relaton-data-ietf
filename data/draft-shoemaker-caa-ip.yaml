abstract:
- language: en
  script: Latn
  content: "<p>The Certification Authority Authorization (CAA) RFC specifies a method
    for users to restrict which Certificate Authorities (CAs) are authorized to issue
    certificates for their DNS domain names. This document extends that specification
    to provide a method for holders of IP addresses to do the same.</p>"
