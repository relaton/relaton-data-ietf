- language: en
  script: Latn
  content: <p>This document proposes updates to the ECMAScript media types, superseding
    the existing registrations for "application/javascript" and "text/javascript"
    by adding an additional extension and removing usage warnings.  This document
    updates RFC4329, "Scripting Media Types".</p>
