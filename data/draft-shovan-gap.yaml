abstract:
- language: en
  script: Latn
  content: "<p>The Governed Action Protocol (GAP) is an open wire protocol for a\n   Universal Action Coordination Fabric.  GAP defines a four-phase\n   lifecycle (Declare, Grant, Invoke, Receipt) that governs every action\n   an AI agent, smart device, industrial controller, or automated\n   pipeline may take.  Every gate decision produces a content-addressed,\n   immutable receipt; receipts are signed at L2+ (Ed25519) and L4\n   (hybrid ML-DSA-65).  The protocol is designed to be language- and\n   platform-neutral, applicable across enterprise AI agent pipelines,\n   consumer smart home devices, medical equipment, industrial control\n   systems, and game engines.\n\n   This document specifies the wire format, object model, grant\n   evaluation rules, HTTP API surface, workflow semantics, revocation\n   mechanisms, and conformance tiers for GAP version 1.0.</p>"
