abstract:
- language: en
  script: Latn
  content: "<p>This memo describes an RTP payload format for Scalable Video Coding
    (SVC) as defined in_Annex G of ITU-T Recommendation H.264, which is technically
    identical to Amendment 3 of ISO/IEC International Standard 14496-10.  The RTP
    payload format allows for packetization of one or more Network Abstraction Layer
    (NAL) units in each RTP packet payload, as well as fragmentation of a NAL unit
    in multiple RTP packets.  Furthermore, it supports transmission of an SVC stream
    over a single as well as multiple RTP sessions.  For single-session streams the
    packetization modes of RFC 3984 are used, whereas for multi-session streams four
    different packetization modes are defined in this memo.  The multi-session packetization
    modes extend the packetization modes defined in RFC 3984.  The payload format
    is backwards compatible to RFC 3984, and has wide applicability in videoconferencing,
    Internet video streaming, and high bit-rate entertainment-quality video, among
    others.  Table of Contents  Status of this Memo...............................................1
    Copyright Notice..................................................1 Abstract..........................................................2</p>"
