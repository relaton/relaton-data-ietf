abstract:
- language: en
  script: Latn
  content: "<p>This memo proposes an alternative handover scheme in Proxy Mobile\n    IPv6(PMIPv6) by making NMAG early registering to LMA before MN\n    attaches to NMAG. Therefore, when MN handover to NMAG, it can sends\n    the Router Advertisement message to MN immediately, because the\n    network-layer handoff has completed already.</p>"
