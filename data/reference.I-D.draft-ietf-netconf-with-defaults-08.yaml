abstract:
- language: en
  script: Latn
  content: "<p>The NETCONF protocol defines ways to read and edit configuration data
    from a NETCONF server.  Part of this data may not be set by the NETCONF client,
    but rather a default value is used.  In many situations the NETCONF client has
    a priori knowledge about default data, so the NETCONF server does not need to
    save it in a NETCONF datastore or send it to the client in a retrieval operation
    reply. In other situations the NETCONF client will need this data as part of the
    NETCONF &lt;rpc-reply&gt; messages.  Not all server implementations treat this
    default data the same way.  This document defines a capability-based extension
    to the NETCONF protocol that allows the NETCONF client to identify how defaults
    are handled by the server, and control whether default values are part of NETCONF
    &lt;rpc-reply&gt; messages or &lt;copy-config&gt; output to a file.</p>"
