abstract:
- language: en
  script: Latn
  content: "<p>This document describes common code point reservation strategies for
    the zeroth and last code points in IANA-managed IETF registries and for bit-field
    registries. This document additionally provides the reasoning to support these
    strategies and their adoption as Best Current Practices to be applied to all IETF
    registries.</p>"
