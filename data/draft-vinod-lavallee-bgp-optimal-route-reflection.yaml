abstract:
- language: en
  script: Latn
  content: "<p>This document describes procedures on providing optimal routing for
    IPv4 Internet traffic based on the shortest IGP metric. It builds on the ability
    of advertising multiple paths for a given destination prefix, using BGP Add-Path
    and provides a solution for selectively indicating preferences towards BGP path(s)
    via affinities.</p>"
