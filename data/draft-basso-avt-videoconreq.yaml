abstract:
- language: en
  script: Latn
  content: "<p>A variety of video communication services such as video conferencing
    \n   and video messaging rely on the capability of video encoders and \n   decoders
    to respond to control commands. This document outlines this \n   set of commands
    as well as the requirements for their transport.</p>"
