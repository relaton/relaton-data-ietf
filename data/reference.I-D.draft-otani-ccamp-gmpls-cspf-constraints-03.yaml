abstract:
- language: en
  script: Latn
  content: "<p>This draft provides the guideline to consider generalized multi- protocol
    label switching (GMPLS) traffic-engineering (TE) attributes for constraint-based
    shortest path first (CSPF) path computation at a source node in a GMPLS network
    environment. This draft summarizes most possible cases of GMPLS constraint TE
    attributes at an ingress link, transit links and an egress link to establish a
    GMPLS label switched path (LSP) appropriately.</p>"
