abstract:
- language: en
  script: Latn
  content: "<p>This memo proposes a solution, based on fractional addresses, to face
    the IPv4 public address exhaustion.  It details the solution and presents a mock-up
    implementation, with the results of tests that validate the concept.  Finally,
    it makes a comparison with the alternative Carrier-Grade NAT (CG-NAT) solutions.</p>"
