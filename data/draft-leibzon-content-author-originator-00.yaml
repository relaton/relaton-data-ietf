  content: |-
    <p>This document defines Content-Author and Content-Originator header
       fields which can be used with MAIL, HTTP and other protocols that use
       MIME to identify name and optionally email address of the author of
       piece of MIME content as well as the person or entity responsible for
       current distribution of the content.</p>
