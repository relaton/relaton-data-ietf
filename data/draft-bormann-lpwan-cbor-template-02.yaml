abstract:
- language: en
  script: Latn
  content: |-
    <p>The Concise Binary Object Representation (CBOR, RFC 7049) is a data
       format whose design goals include the possibility of extremely small
       code size, fairly small message size, and extensibility without the
       need for version negotiation.

       The present document makes use of this extensibility to define a CBOR
       tag for a variable within a CBOR data item, which then could be
       filled in by a separate process (e.g., from another CBOR data item).</p>
