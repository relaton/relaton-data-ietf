abstract:
- language: en
  script: Latn
  content: "<p>DNS ANY query is widely abused for reflection attacks. This feature
    was designed to aid in debugging. As there is no good reason for applications
    to ever issue an ANY query this document codifies how an authoritative server
    can reject such queries.</p>"
