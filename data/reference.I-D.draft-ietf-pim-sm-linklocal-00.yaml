- language: en
  script: Latn
  content: "<p>This document outlines the security issues for the link-local messages
    in the Protocol Independent Multicast - Sparse Mode (PIM-SM) routing protocol.
    It provides mechanisms to authenticate the PIM-SM link local messages using the
    IP security (IPsec) Authentication Header (AH).</p>"
