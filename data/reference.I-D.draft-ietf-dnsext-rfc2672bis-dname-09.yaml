abstract:
- language: en
  script: Latn
  content: "<p>The DNAME record provides redirection for a sub-tree of the domain
    name tree in the DNS system.  That is, all names that end with a particular suffix
    are redirected to another part of the DNS.  This is an update to the original
    specification in RFC 2672, also aligning RFC 3363 and RFC 4294 with this revision.</p>"
