abstract:
- language: en
  script: Latn
  content: "<p>This document describes a number of use cases together with directions
    and interpretations for organizations and relying parties when creating or encountering
    Resource Public Key Infrastructure (RPKI) object scenarios in the public RPKI.
    All of these items are discussed here in relation to the Internet routing system.</p>"
