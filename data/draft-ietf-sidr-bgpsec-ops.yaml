- language: en
  script: Latn
  content: "<p>Deployment of the BGPsec architecture and protocols has many operational
    considerations. This document attempts to collect and present the most critical
    and universal. Operational practices are expected to evolve as BGPsec is formalized
    and initially deployed.</p>"
