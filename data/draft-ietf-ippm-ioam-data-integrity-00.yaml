abstract:
- language: en
  script: Latn
  content: "<p>In-situ Operations, Administration, and Maintenance (IOAM) collects
    operational and telemetry information in the packet while the packet traverses
    a path between two points in the network. IETF protocols require features to ensure
    their security. This document describes the integrity protection of IOAM data
    fields.</p>"
