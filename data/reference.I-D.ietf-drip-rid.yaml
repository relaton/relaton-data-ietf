abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of Hierarchical Host Identity Tags
    (HHITs) as self-asserting IPv6 addresses and thereby a trustable Identifier for
    use as the UAS Remote ID.  HHITs self-attest to the included explicit hierarchy
    that provides Registrar discovery for 3rd-party ID attestation.</p>"
