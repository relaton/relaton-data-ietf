abstract:
- language: en
  script: Latn
  content: "<p>This memo defines URI fragment identifiers for text/csv MIME entities.
    \ These fragment identifiers make it possible to refer to parts of a text/csv
    MIME entity, identified by row, column, or cell. Fragment identification can use
    single items, or ranges.  Note to Readers  This draft should be discussed on the
    apps-discuss mailing list [1].  Online access to all versions and files is available
    on github [2].</p>"
