abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB) for\nuse with network management protocols in the Internet community.  In\nparticular, it describes managed objects used for implementations of the\nTransmission Control Protocol (TCP) [5] in an IP version independent\nmanner.</p>"
