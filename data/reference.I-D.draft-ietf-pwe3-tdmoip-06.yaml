abstract:
- language: en
  script: Latn
  content: "<p>TDM over IP (TDMoIP) is a structure-aware method for transporting Time
    Division Multiplexed (TDM) signals as pseudowires (PWs). By ensuring TDM structure
    integrity, TDMoIP is able to better withstand network degradations. As TDM signaling
    and individual channels are visible, it is possible to use mechanisms that exploit
    or manipulate these to conceal packet loss or conserve bandwidth.</p>"
