abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a new DHCP option for passing Virtual Subnet Selection
    (VSS) information between the DHCP client and the DHCP server. It is intended
    for use primarily by DHCP proxy clients in situations where VSS information needs
    to be passed to the DHCP server for proper address allocation to take place. The
    option number currently in use is TBD. This memo documents the current usage of
    the option in agreement with [7], which declares that any pre-existing usages
    of option numbers in the range 128 - 223 should be documented and the working
    group will try to officially assign those numbers to those options.</p>"
