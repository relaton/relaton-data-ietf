abstract:
- language: en
  script: Latn
  content: "<p>This specification introduces an alternate, low-consumption mechanism
    for protecting signaling messages between the Mobile Node and previous Access
    Router for Fast Mobile IPv6.  The alternate method defined here utilizes the Master
    Session Key(MSK) generated from EAP authentication to derive a fast handover key
    between the Mobile Node and the Access Router in order to avoid certain attacks.
    \ This mechanism also adds the Mobile Node Identifier option and the mobility
    message authentication option to the FMIPv6 signaling messages</p>"
