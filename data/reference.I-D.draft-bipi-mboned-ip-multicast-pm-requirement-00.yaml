abstract:
- language: en
  script: Latn
  content: "<p>With increasing deployment of IP multicast in service provider (SP)
    network, SPs need a carrier-grade IP multicast performance monitoring solution.
    This document describes the requirements for such a system for a SP network. This
    system enables efficient performance monitoring in SPs' production network and
    provides diagnostic information in case of performance degradation or failure.</p>"
