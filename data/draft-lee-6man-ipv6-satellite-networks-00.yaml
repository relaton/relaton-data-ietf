abstract:
- language: en
  script: Latn
  content: "<p>This document describes use cases and a problem statement for IPv6
    Wireless Access in Satellite Networks (IPWASN). IPWASN aims at the IPv6-based
    wireless access in Non-Terrestrial Networks (NTNs), that is, satellite networks.
    It considers NTN characteristics such as dynamic topology, multi-hop communication
    over inter-satellite links, High-Altitude Platform Station (HAPS)-assisted relay
    paths, frequent handovers, variable link quality, and intermittent connectivity.
    Based on these characteristics, this document identifies key challenges in applying
    existing IPv6 protocols to NTN environments. It also analyzes the applicability
    of current IPv6 mechanisms and outlines requirements to support efficient data
    forwarding, Quality of Service (QoS), Segment Routing (SR)-based traffic engineering,
    and connectivity in satellite-based networks.</p>"
