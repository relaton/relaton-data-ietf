abstract:
- language: en
  script: Latn
  content: "<p>This document serves as input into the IETF GSMP requirements and protocol
    definition process. It is submitted in response to draft- ieft-gsmp-msf-response-00.txt.
    It provides additional explanations to requirements that were not clearly specified
    in the original liaison (draft-mceachern-scireq-00.txt). It also provides some
    suggestions for how some of the requirements might be satisfied in the GSMP protocol.</p>"
