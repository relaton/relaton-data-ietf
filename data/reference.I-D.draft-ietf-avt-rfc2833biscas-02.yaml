abstract:
- language: en
  script: Latn
  content: '<p>This memo updates RFC xxxx to add event codes for telephony signals
    used for channel-associated signalling when carried in the telephony event RTP
    payload. It supersedes the assignment of event codes for this purpose in RFC 2833,
    and therefore obsoletes that part of RFC 2833. [Note to RFC Editor: please replace
    "RFC xxxx" in the header above and throughout this document with the RFC number
    assigned to draft-ietf-avt-rfc2833bis-15. Please also make the appropriate change
    to the fourth normative reference.]</p>'
