abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new Neighbor Discovery mechanism suitable
    for LoWPANs.  The 6LoWPAN format allows IPv6 to be used over energy and bandwidth
    constrained wireless networks often making use of multihop topologies.  However,
    the use of classic IPv6 Neighbor Discovery with 6LoWPAN has several problems.
    \ Classic Neighbor Discovery was not designed for non-transitive wireless links,
    and the traditional IPv6 link concept and heavy use of multicast makes it unpractical.
    \ This document specifies a simple Neighbor Discovery mechanism both sufficient
    yet minimal for LoWPAN operation.</p>"
