abstract:
- language: en
  script: Latn
  content: "<p>This document obsoletes RFC 3330.  It describes the global and other
    specialized IPv4 address blocks that have been assigned by the Internet Assigned
    Numbers Authority (IANA).  It does not address IPv4 address space assigned to
    operators and users through the Regional Internet Registries.  It also does not
    address allocations or assignments of IPv6 addresses or autonomous system numbers.
    \ Special IPv6 addresses are described in RFC 5156.</p>"
