abstract:
- language: en
  script: Latn
  content: |-
    <p>In a SRv6 network, each SRv6 Segment Endpoint Node must be assigned
       a locator, and segment IDs are generated within the address space of
       this locator. This document describes a method for assigning
       locators to SRv6 Segment Endpoint Nodes through DHCPv6.</p>
