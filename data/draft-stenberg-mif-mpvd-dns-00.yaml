abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism to transmit and secure provisioning
    domain information for IPv6 and IPv4 addresses by using reverse DNS resolution.
    In addition it specifies backwards- compatible extensions to IPv6 host configuration
    to support special- purpose global IPv6 prefixes which can only be used to access
    certain isolated services.</p>"
