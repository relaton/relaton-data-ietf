abstract:
- language: en
  script: Latn
  content: "<p>When using IPv6 within a single L2 network segment it is assumed that
    for good network behavior, the available routers attached to the segment are valid
    routers. A rogue Router Advertisement (RA) [1] however could be sent by accident
    by a misconfigured network device, or on purpose by malicious devices. This document
    proposes a solution to reduce the threat of rogue RAs by enabling layer 2 devices
    to provide forward RAs received over designated ports.</p>"
