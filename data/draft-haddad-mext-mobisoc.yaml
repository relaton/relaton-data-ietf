abstract:
- language: en
  script: Latn
  content: "<p>This memo introduces the concept of peer-to-peer route optimization
    mode which enables Mobile IPv6 route optimization, without requiring mobility
    signaling messages exchange between two mobile endpoints. For this purpose, we
    use a social dimension within the home network as one tool to implement our concept.</p>"
