abstract:
- language: en
  script: Latn
  content: "<p>This document specifies new metrices to be used with the ALTO protocol.
    The goal is to provide information about the availability of physical network,
    host, and storage infrastructures to management systems that orchestrate virtual
    infrastructures on top of them. Terminology and Requirements Language This document
    makes use of the ALTO terminology defined in [RFC5693] and [RFC6708].</p>"
