abstract:
- language: en
  script: Latn
  content: "<p>This document describes Bundle-in-Bundle Encapsulation (BIBE), a Delay-Tolerant
    Networking (DTN) Bundle Protocol (BP) tunneling mechanism by which a bundle is
    carried as the payload of one or more encapsulating bundles, allowing security
    measures, routing policy, and protocol version translation to be applied to the
    encapsulating bundle without modification of the encapsulated bundle. The protocol
    includes an optional segmentation mechanism, allowing a large encapsulated bundle
    to be carried in multiple encapsulating bundles.</p>"
