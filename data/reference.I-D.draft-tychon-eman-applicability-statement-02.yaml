abstract:
- language: en
  script: Latn
  content: "<p>The objective of Energy Management (EMAN) is to provide an energy management
    framework for networked devices. In this document the applicability of the EMAN
    framework for a variety of network scenarios is described. This document lists
    a number of use-cases that can implement the EMAN framework and the associated
    MIB modules. Furthermore, we describe the relationship of the EMAN framework to
    other energy monitoring standards and architectures.</p>"
