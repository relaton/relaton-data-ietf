abstract:
- language: en
  script: Latn
  content: "<p>This document describes the certificate policy for a PKI used to support
    attestations about Internet resource holdings. Each organization that distributes
    IP addresses or Autonomous System (AS) numbers to an organization will, in parallel,
    issue a certificate reflecting this distribution. These certificates will enable
    verification that the holder of the associated private key has been allocated
    the resources indicated in the certificate, and is the current, unique holder
    of these resources.</p>"
