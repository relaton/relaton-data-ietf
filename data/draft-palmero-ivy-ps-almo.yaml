abstract:
- language: en
  script: Latn
  content: "<p>This document presents a problem statement for assets lifecycle management
    and operations. It describes a framework, the motivation and requirements for
    asset-centric metrics including but not limited to, asset adoption, usability,
    entitlements, supported capabilities, and enabled capabilities. The document also
    defines an information model. The primary objective for this problem statement
    document is to validate and prove that the framework can measure and improve the
    network operators' experience along the lifecycle journey, from technical requirements
    and technology selection through renewal, including the end of life of an asset.</p>"
