abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 6775 and RFC 8505 in order to enable proxy
    services for IPv6 Neighbor Discovery by Routing Registrars called Backbone Routers.
    Backbone Routers are placed along the wireless edge of a Backbone, and federate
    multiple wireless links to form a single Multi-Link Subnet.</p>"
