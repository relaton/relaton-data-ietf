- language: en
  script: Latn
  content: "<p>This memo is an extention to the BGP-4 MIB to support the Optional
    Parameters attributes for Authentication [RFC1771 4.2a] and BGP-4 Capabilities
    Advertisement [RFC2842]. Additionally, this MIB provides a registration point
    for BGP-4 Capabilities defined protocols.</p>"
