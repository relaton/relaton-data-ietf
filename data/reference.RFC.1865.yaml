abstract:
- language: en
  script: Latn
  content: "<p>This memo is targeted towards the EDI community that is unfamiliar
    with the Internet, including EDI software developers, users, and service providers.
    \ The memo introduces the Internet and assumes a basic knowledge of EDI.  This
    memo provides information for the Internet community.  This memo does not specify
    an Internet standard of any kind.</p>"
