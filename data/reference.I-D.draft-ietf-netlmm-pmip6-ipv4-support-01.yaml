abstract:
- language: en
  script: Latn
  content: "<p>This document specifies extensions to the Proxy Mobile IPv6 protocol
    [ID-PMIP6] for supporting IPv4. The scope of the IPv4 support in Proxy Mobile
    IPv6 includes the support for the mobile node's IPv4 home address mobility and
    for supporting the scenario where the local mobility anchor and the mobile access
    gateway are separated by an IPv4 transport network. The solution primarily leverages
    the extensions defined in Dual Stack Mobile IPv6 specification [ID- DSMIP6] for
    achieving this.</p>"
