abstract:
- language: en
  script: Latn
  content: "<p>This memo defines extensions to ICMP that permit identification of
    unnumbered interfaces. The interface the triggering IPv4 packet was received upon
    can be identified by appending an ifIndex and/or a string describing the interface.
    These extensions are defined to facilitate troubleshooting in network with unnumbered
    interfaces. Additionally, to facilitate debugging of numbered interfaces, the
    IPv4 address of the interface the triggering IPv4 packet was received upon can
    be identified by appending the IPv4 address.</p>"
