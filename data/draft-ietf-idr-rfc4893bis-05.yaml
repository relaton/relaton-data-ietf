abstract:
- language: en
  script: Latn
  content: |-
    <p>The Autonomous System (AS) number is encoded as a two-octet entity in
       the base BGP specification. This document describes extensions to BGP
       to carry the Autonomous System numbers as four-octet entities.  This
       document obsoletes RFC 4893.</p>
