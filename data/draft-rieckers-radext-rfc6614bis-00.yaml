abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a transport profile for RADIUS using Transport
    Layer Security (TLS) over TCP as the transport protocol. This enables dynamic
    trust relationships between RADIUS servers. About This Document This note is to
    be removed before publishing as an RFC. Status information for this document may
    be found at https://datatracker.ietf.org/doc/draft-rieckers-radext-rfc6614bis/.
    Discussion of this document takes place on the RADIUS EXTensions Working Group
    mailing list (mailto:radext@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/radext/.</p>"
