- language: en
  script: Latn
  content: "<p>This memo defines a directory information profile for a white pages
    person, to be carried in an application/directory MIME Content-Type. The profile
    consists of type definitions (e.g., for name and email address) and the corresponding
    format of values that each type is allowed to contain.</p>"
