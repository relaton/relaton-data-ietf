abstract:
- language: en
  script: Latn
  content: "<p>Deterministic Networking (DetNet) provides a capability to carry specified
    unicast or multicast data streams for real-time applications with extremely low
    data loss rates and maximum latency. Techniques used include: 1) reserving data
    plane resources for individual (or aggregated) DetNet streams in some or all of
    the relay systems (bridges or routers) along the path of the stream; 2) providing
    fixed paths for DetNet streams that do not rapidly change with the network topology;
    and 3) sequentializing, replicating, and eliminating duplicate packets at various
    points to ensure the availability of at least one path.  The capabilities can
    be managed by configuration, or by manual or automatic network management.</p>"
