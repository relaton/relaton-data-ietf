abstract:
- language: en
  script: Latn
  content: "<p>JSON Schema is a JSON based format for defining the structure of JSON\n   data.  This document specifies hyperlink- and hypermedia-related\n   keywords of JSON Schema for annotating JSON documents with hyperlinks\n   and instructions for processing and manipulating remote JSON\n   resources through hypermedia environments like HTTP.</p>"
