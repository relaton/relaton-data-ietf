abstract:
- language: en
  script: Latn
  content: "<p>This document defines new Dynamic Host Configuration Protocol (DHCPv4
    and DHCPv6) options that allow clients to discover the IP address or the domain
    name of Access Network Discovery and Selection    Function (ANDSF) entities in
    an IP network. ANDSF is being developed in 3GPP (Release-8) and provides inter-system
    mobility policies and access network specific information to the mobile nodes
    [3GPPTS23.402].</p>"
