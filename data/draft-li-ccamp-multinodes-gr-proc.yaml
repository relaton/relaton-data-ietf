abstract:
- language: en
  script: Latn
  content: "<p>The Hello message for the Resource Reservation Protocol (RSVP) has
    \n   been defined to establish and maintain basic signaling node \n   adjacencies
    for Label Switching Routers (LSRs) participating in a \n   Multiprotocol Label
    Switching (MPLS) traffic engineered (TE) network. \n   The Hello message has been
    extended for use in Generalized MPLS \n   (GMPLS) network for state recovery of
    control channel or nodal \n   faults.</p>"
