abstract:
- language: en
  script: Latn
  content: "<p>The Short Messaging System (SMS) is widely used by GSM mobile phones
    for the transmission of text messages. This memo specifies the general syntax
    for email addresses of terminal equipment with SMS capabilities. The purpose of
    the memo is to facilitate the transmission of SMS messages using a familiar e-mail
    client application.</p>"
