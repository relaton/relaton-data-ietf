abstract:
- language: en
  script: Latn
  content: "<p>This document aims to make protocol designers aware of the privacy-
    related design choices and offers guidance for writing privacy considerations
    in IETF documents.  Similiar to other design aspects the IETF influence on the
    actual deployment is limited.  We discuss these limitations but are convinced
    that protocol architects have indeed a role to play in a privacy friendly design
    by making more conscious decision, and by documenting those.</p>"
