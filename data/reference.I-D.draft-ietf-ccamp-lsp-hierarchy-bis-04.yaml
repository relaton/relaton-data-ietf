abstract:
- language: en
  script: Latn
  content: "<p>Label Switched Paths (LSPs) set up in Multiprotocol Label Switching
    (MPLS) or Generalized MPLS (GMPLS) networks can be used to form links for carrying
    traffic in those networks or in other (client) networks.  Protocol extensions
    already exist to facilitate the establishment of an LSP as a numbered traffic
    engineering (TE) link within the same instance of the routing as is used to advertise
    the links that it traverses creating a Forwarding Adjacency (FA). This document
    extends those mechanisms to support unnumbered FAs.  This document also defines
    how to indicate that an LSP should be advertised as a link in another instance
    of the routing protocol (for instance in a client network) and which instance
    to use. Furthermore, mechanisms are defined to indicate when an LSP is to be used
    as a component link of a TE link bundle and to identify the bundle.</p>"
