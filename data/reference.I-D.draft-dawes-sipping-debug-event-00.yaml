abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Session Initiation Protocol (SIP) event package
    for debugging.  SIP requests and responses for session setup can traverse a number
    of network entities, which might be geographically spread over a large area.  This
    document provides a means by which logging of requests and responses can be configured
    on a per-entity basis.</p>"
