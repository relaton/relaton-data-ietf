abstract:
- language: en
  script: Latn
  content: "<p>This document defines the APIX IoT Device Profile: an extension to\n   the APIX Core Infrastructure specification that enables discovery and\n   presence management for physical connected devices.  It specifies the\n   two-layer discoverability model (public device class, private device\n   instance), the presence signal protocol, device instance token\n   management, device class lifecycle, hub-mediated presence, ownership\n   transfer, and the data retention and privacy rules applicable to\n   device instance records.  Autonomous agents that implement this\n   profile can discover device capabilities at the class layer without\n   any authentication, and retrieve live instance endpoint data at the\n   instance layer subject to owner-granted authorisation.</p>"
