abstract:
- language: en
  script: Latn
  content: "<p>The target of DECoupled Application Data Enroute (DECADE) is to specify
    a protocol that can be used by a P2P application to utilize storage and related
    resources in an in-network storage element.  This document enumerates and explains
    requirements that should be considered during the design and implementation of
    this protocol.</p>"
