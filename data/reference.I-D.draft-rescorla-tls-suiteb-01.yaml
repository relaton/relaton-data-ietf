- language: en
  script: Latn
  content: <p>The United States Government has published guidelines for "NSA Suite
    B Cryptography" dated July, 2005, which defines cryptographic algorithm polcy
    for national security applications. This document defines a profile of TLS which
    is conformant with Suite B.</p>
