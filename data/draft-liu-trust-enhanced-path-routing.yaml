abstract:
- language: en
  script: Latn
  content: "<p>Digital trust refers to the measurable confidence of one entity posts
    on another about accomplishing some task in the digital world. This document introduces
    the concept of trust into the networking and routing area, and proposes the idea
    of trust-enhanced path routing, elaborates the key technical problems and design
    goals, and also lists some use cases.</p>"
