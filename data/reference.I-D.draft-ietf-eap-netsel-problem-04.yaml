abstract:
- language: en
  script: Latn
  content: "<p>The so called realm discovery and selection problem affects network
    access, particularly in the presence of multiple available wireless accesses and
    roaming. This problem has been the subject of discussions in various standards
    bodies. This document summarizes the discussion held about this problem in the
    Extensible Authentication Protocol (EAP) working group at the IETF. The problem
    is defined and divided into subproblems, and some constraints for possible solutions
    are outlined. The document also provides a discussion of the limitations of certain
    classes of solution, including some that have been previously defined.</p>"
