id: draftdicksondpriveadotauth
schema_version: v1.5.6
formattedref:
  content: draft-dickson-dprive-adot-auth
title:
- language: en
  script: Latn
  content: Authenticated DNS over TLS to Authoritative Servers
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-dickson-dprive-adot-auth-06
docidentifier:
- content: draft-dickson-dprive-adot-auth
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2021-11-09'
abstract:
- language: en
  script: Latn
  content: "<p>This Internet Draft proposes a mechanism for DNS resolvers to\n   discover support for TLS transport to authoritative DNS servers, to\n   validate this indication of support, and to authenticate the TLS\n   certificates involved.\n\n   This requires that the name server _names_ are in a DNSSEC signed\n   zone.\n\n   This also requires that the delegation of the zone served is\n   protected by [I-D.dickson-dnsop-ds-hack], since the NS names are the\n   keys used for discovery of TLS transport support.\n\n   Additional recommendations relate to use of various techniques for\n   efficiency and scalability, and new EDNS options to minimize round\n   trips and for signaling between clients and resolvers.</p>"
