abstract:
- language: en
  script: Latn
  content: "<p>draft-malyushkin-bess-ip-vpn-abstract-next-hops-00 Abstract This document
    discusses the IP VPN convergence aspects and specifies procedures for IP VPN to
    signal the attachment circuit failure. The specified procedures help significantly
    improve the IP VPN convergence. About This Document This note is to be removed
    before publishing as an RFC. Status information for this document may be found
    at https://datatracker.ietf.org/doc/draft-malyushkin-bess-ip-vpn- abstract-next-hops/.
    Discussion of this document takes place on the BGP Enabled ServiceS Working Group
    mailing list (mailto:bess@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/bess/.
