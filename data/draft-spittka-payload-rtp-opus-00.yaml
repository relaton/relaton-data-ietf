abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Real-time Transport Protocol (RTP) payload
    format and file storage format for packetization of Opus encoded speech and audio
    data that is essential to integrate the codec in the most compatible way. Further,
    media type registrations are described for the RTP payload format and the file
    storage format.</p>"
