abstract:
- language: en
  script: Latn
  content: "<p>This document defines possible optimization approaches for combining
    the lightweight authenticated key exchange protocol EDHOC run over CoAP with the
    first subsequent OSCORE transaction.  This combination reduces the number of round
    trips required to set up an OSCORE Security Context and complete an OSCORE transaction
    using that context.</p>"
