abstract:
- language: en
  script: Latn
  content: "<p>The Agent Definition Language (ADL) provides a standard JSON-based\n   format for describing AI agents.  An ADL document declares an agent's\n   identity, capabilities, tools, permissions, security requirements,\n   data classification, and runtime configuration in a single, machine-\n   readable artifact.  ADL enables discovery, interoperability,\n   deployment, and lifecycle management of AI agents across diverse\n   platforms and runtimes.  This document defines the structure of ADL\n   documents, the semantics of their members, conformance requirements\n   for implementations, and the registration of the application/adl+json\n   media type.</p>"
