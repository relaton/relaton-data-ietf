abstract:
- language: en
  script: Latn
  content: "<p>IETF RATS Architecture, defines the key role of a Verifier. In a complex
    system, this role needs to be performed by multiple Verfiers coordinating together
    to assess the full trustworthiness of an Attester. This document focuses on various
    topological patterns for a multiple Verifier system. It only covers the architectural
    aspects introduced by the Multi Verifier concept, which is neutral with regard
    to specific wire formats, encoding, transport mechanisms, or processing details.</p>"
