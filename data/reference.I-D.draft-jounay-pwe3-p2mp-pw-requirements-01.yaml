abstract:
- language: en
  script: Latn
  content: "<p>This document provides some use cases advocating for the definition
    of a unidirectional Point-to-Multipoint Pseudowire (P2MP PW) and its relevant
    Virtual Private P2MP Service (VPMS). Based on these use cases it also presents
    a set of requirements for the set up and maintenance of P2MP PW, proposed as guidelines
    for possible solutions.</p>"
