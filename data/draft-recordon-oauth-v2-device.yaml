abstract:
- language: en
  script: Latn
  content: "<p>The device profile is suitable for OAuth 2.0 clients executing on devices
    which do not have an easy data-entry method (e.g. game consoles or media hubs),
    but where the end-user has separate access to a user-agent on another computer
    or device (e.g. home computer, a laptop, or a smart phone).</p>"
