abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes SNMPv3 optimizations for its use in 6LoWPANs. The
    draft presents optimization goals, issues, and the optimization approaches to
    enable the use of SNMP under the given memory, processing, and message size constraints
    imposed by 6LoWPANs.</p>"
