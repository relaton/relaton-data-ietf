abstract:
- language: en
  script: Latn
  content: "<p>AI agents and agentic systems generate a growing volume of intent-\n   driven, unstructured, and undifferentiated traffic that flows through\n   HTTP indistinguishably from human-initiated requests.  HTTP lacks the\n   semantic vocabulary, observability primitives, and identity\n   mechanisms required by agent systems operating at scale.  Existing\n   protocols described as \"agent protocols\" — including MCP, ACP, A2A,\n   and ANP — are messaging-layer constructs that presuppose HTTP as\n   their transport.  They do not address the underlying transport\n   problem.\n\n   This document defines the Agent Transfer Protocol (ATP): a dedicated\n   application-layer protocol for AI agent traffic.  ATP provides agent-\n   native intent methods (QUERY, SUMMARIZE, BOOK, SCHEDULE, LEARN,\n   DELEGATE, COLLABORATE, CONFIRM, ESCALATE, NOTIFY), protocol-level\n   agent identity and authority headers, and a status code vocabulary\n   designed for the conditions AI agent systems encounter.  ATP SHOULD\n   prefer QUIC for new implementations and MUST support TCP/TLS for\n   compatibility and fallback.  It is designed to be composable with\n   existing agent frameworks, not to replace them.</p>"
