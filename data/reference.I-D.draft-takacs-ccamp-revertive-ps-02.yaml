abstract:
- language: en
  script: Latn
  content: "<p>GMPLS RSVP-TE recovery extensions are specified in [RFC4872] and [RFC4873].
    \ Currently these extensions cannot signal request for revertive protection neither
    values for the associated timers to the remote endpoint.  This document defines
    two new fields in the PROTECTION Object to specify wait-to-restore and hold-off
    intervals.</p>"
