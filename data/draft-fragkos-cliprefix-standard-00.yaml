abstract:
- language: en
  script: Latn
  content: "<p>Command-line interface (CLI) tools frequently emit status,\n   diagnostic, and progress messages that in some cases are prefixed\n   with short ASCII tokens containing anything from any printable\n   characters (e.g. !, i, +, etc.), abbreviations (e.g. DEL, INS, etc.),\n   to short verbal descriptors (e.g. \"INFO:\", \"DELETE\", \"ALERT\", etc.).\n   Despite their ubiquity, use, and convenience, no standard defines\n   these tokens or their semantics.  This document proposes a machine-\n   parseable, human-readable vocabulary of 3-character ASCII prefixes --\n   collectively referred to as \"gclifixes\" -- enclosed in square\n   brackets [ ] for events and curly braces { } for context metadata.\n   The goal is to enable consistent interpretation across CLI tools, log\n   aggregators, CI/CD pipelines, IDE integrations, and most importantly\n   for any AI-generated code the adoption of this standard will\n   streamline how these are used and provides additional meaning to any\n   prompt message and log file without additional effort.</p>"
