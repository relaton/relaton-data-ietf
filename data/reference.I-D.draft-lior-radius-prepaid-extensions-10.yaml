abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to the Remote Authentication Dial-
    In User Service (RADIUS) protocol. This extension makes RADIUS support charging
    for prepaid services. The extension is based on a number of charging models, in
    particular based on volume, duration and single (atomic) events.</p>"
