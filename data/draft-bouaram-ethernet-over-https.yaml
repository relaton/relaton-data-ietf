abstract:
- language: en
  script: Latn
  content: "<p>This document defines a protocol for encapsulating Ethernet frames
    over HTTPS, allowing secure communication between a client and internal web servers.
    The protocol includes authentication using strong API keys encrypted with the
    server's public key. The communication is secured using TLS for privacy and integrity.</p>"
