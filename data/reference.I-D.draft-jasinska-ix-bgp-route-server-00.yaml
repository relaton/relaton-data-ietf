abstract:
- language: en
  script: Latn
  content: "<p>The growing popularity of Internet exchange points (IXPs) brings a
    new set of requirements to interconnect participating networks. While bilateral
    exterior BGP sessions between exchange participants were previously the most common
    means of exchanging reachability information, the overhead associated with dense
    interconnection has caused substantial operational scaling problems for IXP participants.
    \ This document outlines a specification for multilateral interconnections at
    IXPs.  Multilateral interconnection describes a method of exchanging routing information
    between three or more BGP speakers using a single intermediate broker system,
    referred to as a route server.  Route servers are typically used on shared access
    media networks such as Internet Exchanges (IXPs), to facilitate simplified interconnection
    between multiple Internet routers on such a network.</p>"
