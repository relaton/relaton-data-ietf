abstract:
- language: en
  script: Latn
  content: "<p>This document describes the preferred design of a PWE3 Control Word
    to be use over an MPLS packet switched network, and the Pseudo Wire Associated
    Channel Header. The design of these fields is chosen so that an MPLS Label Switching
    Router performing MPLS payload inspection will not confuse a PWE3 payload with
    an IP payload.</p>"
