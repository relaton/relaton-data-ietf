abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model for the provisioning and management
    of Traffic Engineering (TE) tunnels, Label Switched Paths (LSPs), and interfaces.
    The model covers data pertinent to TE tunnels, TE LSPs, and TE interfaces that
    are independent of any technology or data plane encapsulation. The model is divided
    into two YANG modules that address both device-specific and device-independent
    data, supporting configuration, operational state, Remote Procedure Calls (RPCs),
    and event notifications.</p>"
