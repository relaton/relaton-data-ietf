- language: en
  script: Latn
  content: |-
    <p>The Network Time Protocol (NTP), currently on its fourth version, has
       been widely used since its initial publication.  This documentation
       is a collection of Best Practices for general operation of time
       servers on the Internet from across the NTP community.</p>
