abstract:
- language: en
  script: Latn
  content: "<p>This document provides a solution to extend LDP signaling in order
    to allow set up and maintenance of Point-to-Multipoint Pseudowire (P2MP PW). Such
    an extension of existing point to point Pseudowire is made necessary by new applications.
    The document deals with the leaf- initiated P2MP PW setup and maintenance. The
    processing for setting up a P2MP MS-PW is built on the processing for setting
    up a P2MP LSP with LDP.</p>"
