abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a way to synchronise existing trust anchors
    automatically between a child zone and its parent.  The algorithm can be used
    for other Resource Records that are required to delegate from a parent to a child
    such as NS and glue records.</p>"
