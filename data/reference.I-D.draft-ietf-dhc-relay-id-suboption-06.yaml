abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a new Relay Agent Identifier suboption for the Dynamic
    Host Configuration Protocol's (DHCP) Relay Agent Information option.  The suboption
    carries a value that uniquely identifies the relay agent device.  The value may
    be administratively-configured or may be generated by the relay agent.  The suboption
    allows a DHCP relay agent to include the identifier in the DHCP messages it sends.</p>"
