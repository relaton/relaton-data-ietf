abstract:
- language: en
  script: Latn
  content: "<p>DNS Resource Records (DNS RR) are often used in the order that they
    are returned. This means that if there are more than one RR in a RR set, then
    they should be returned in a random order, to reduce bias in how the answers are
    used.</p>"
