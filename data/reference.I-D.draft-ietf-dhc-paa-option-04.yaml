- language: en
  script: Latn
  content: "<p>This document defines new DHCPv4 and DHCPv6 options that contain a
    list of IP addresses to locate one or more of PANA Authentication Agents (PAA).
    This is one of the many methods that a PANA Client (PaC) can use to locate PANA
    Authentication Agents (PAA).</p>"
