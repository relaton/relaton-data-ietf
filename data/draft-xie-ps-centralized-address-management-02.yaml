abstract:
- language: en
  script: Latn
  content: "<p>The increase in number, diversity and complexity of devices and services
    in modern networks bring new challenges for the management of network resources,
    such as IP addresses, network prefixes, bandwidth, and services that utilize such
    resources. This draft contains a problem statement for IP address management and
    defines requirements with practical use cases provided by operators.</p>"
