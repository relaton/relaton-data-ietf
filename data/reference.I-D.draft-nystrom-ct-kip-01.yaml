abstract:
- language: en
  script: Latn
  content: "<p>This document represents a republication of CT-KIP Version 1.0 from
    RSA Laboratories' One-Time Password Specifications (OTPS) series, and change control
    is retained within the OTPS process. The body of this document, except for the
    intellectual property considerations section and the IANA considerations section,
    is taken directly from the CT- KIP Version 1.0 document. CT-KIP is a client-server
    protocol for initialization (and configuration) of cryptographic tokens. The protocol
    requires neither private-key capabilities in the cryptographic tokens, nor an
    established public-key infrastructure. Provisioned (or generated) secrets will
    only be available to the server and the cryptographic token itself.</p>"
