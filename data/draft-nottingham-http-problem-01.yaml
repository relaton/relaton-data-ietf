  content: |-
    <p>This document defines a "Problem Detail" as an extensible way to
       carry machine-readable details of HTTP errors in a response, to avoid
       the need to invent new response formats for non-human consumers.

    Note to Readers

       This draft should be discussed on the apps-discuss mailing list [1].</p>
