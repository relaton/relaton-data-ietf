- language: en
  script: Latn
  content: "<p>This document describes agents networking scenarios in enterprise and
    home broadband networks. These scenarios differ from mobile networks and Internet
    scenarios. Since the agentic service is still at the emerging stage, especially
    in enterprise and home broadband networks, the scenarios are mostly based on reasonable
    assumptions.</p>"
