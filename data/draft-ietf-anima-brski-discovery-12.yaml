abstract:
- language: en
  script: Latn
  content: "<p>This document specifies procedures for variations of the\n   \"Bootstrapping Remote Secure Key Infrastructure\" (BRSKI) series of\n   protocols to automatically announce, disover and select responders\n   using different discovery mechanisms such as DNS-SD, GRASP or CORE-\n   LF.  Different variations are not interoperable so initiators need to\n   be able to find initiators supporting the variations(s) they support.\n   Procedures for BRSKI proxies are defined that allow to proxy traffic\n   for any current and future variation.  Procedures to discover BRSKI\n   Pledges by their identifier are defined.\n\n   All procecdures are defined such that they rely on IANA defined\n   tables through which not only well specified but also possible but\n   not yet validated variations of BRSKI or additional discovery\n   mechanisms can be supported simply by adding entries to the IANA\n   tables.\n\n   Many of the procedures and mechanisms covered by this document may\n   equally be applied to discovery of other protocols especially when\n   they have non-interoperable variations.</p>"
