  content: |-
    <p>The 'new IANA corporation' (referred to below as 'the Internet
       Corporation for Assigned Names and Numbers' (ICANN)) assumes the
       existence of a 'Protocol Supporting Organization' (PSO).  This
       document is a draft set of bylaws for such an organization.</p>
