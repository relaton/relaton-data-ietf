abstract:
- language: en
  script: Latn
  content: "<p>Automated Certificate Management Environment (ACME) core protocol addresses
    the use case of web server certificates for TLS and defines authentication challenge
    types to automate certificate issuance. This document describes the orthoganal
    nature of certificate types to challenge types for a better understanding of the
    applicability of challenge types to various certificate types.</p>"
