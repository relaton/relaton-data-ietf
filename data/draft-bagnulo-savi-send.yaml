- language: en
  script: Latn
  content: |-
    <p>This memo describes SeND SAVI, a mechanism to provide source address
    validation using the SeND protocol.  The proposed mechanism is
    intended to complement ingress filtering techniques to provide a
    higher granularity on the control of the source addresses used.</p>
