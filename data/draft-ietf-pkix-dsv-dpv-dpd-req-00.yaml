- language: en
  script: Latn
  content: "<p>This document specifies requirements for three main request/response
    pairs. The first one, called Delegated Signature Validation (DSV), can be used
    to fully delegate signature validation processing to an DSV server, according
    to a set of rules, called a signature policy.</p>"
