abstract:
- language: en
  script: Latn
  content: "<p>This memo documents a process which can be used to avoid network \noutages
    during the upgrading of a router's software.  In this way, \ndisruptions to the
    network community are avoided.  The upgrade process \ndefinition comprises requirements
    for inserting a replacement router \nor upgrading the software in a working router
    within an operational \nnetwork.  To do this, it maximizes the use of accepted
    internet \nstandards with minimal alteration.</p>"
