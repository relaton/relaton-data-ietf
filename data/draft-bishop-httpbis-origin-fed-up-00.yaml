abstract:
- language: en
  script: Latn
  content: <p>The definition of the HTTP/2 ORIGIN frame "relaxes" the requirement
    to check DNS for various reasons. However, experience has shown that such relaxation
    leads to security risks and is inadvisable. This document restores the original
    requirements.</p>
