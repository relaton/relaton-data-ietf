abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies procedures for variations of the
       "Bootstrapping Remote Secure Key Infrastructure" (BRSKI) architecture
       of protocols to automatically announce, discover and select
       responders using different discovery mechanisms such as DNS-SD, GRASP
       or CORE-LF.  Different variations are not interoperable so initiators
       need to be able to find responders supporting the variation(s) they
       support.  Procedures for BRSKI proxies are defined that allow
       proxying of traffic for any current and future variation.  Procedures
       to discover BRSKI Pledges by their identifier are defined.
       Extensibility is provided through a set of IANA tables.

       This document updates I-D.ietf-anima-brski-prm, RFC6690 and rfc9733.</p>
