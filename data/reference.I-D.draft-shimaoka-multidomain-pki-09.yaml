abstract:
- language: en
  script: Latn
  content: "<p>This document desires to establish a standard terminology and actual
    language for interoperability of multi-domain PKI that consists of several PKI
    domains which are operated under each distinct policy. This document describes
    the relationships between Certification Authorities (CAs), the definition and
    requirements for PKI domains, and typical models of multi-domain PKI.</p>"
