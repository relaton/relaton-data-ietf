abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification updates RELATED-TO defined in [RFC5545] and
       introduces new iCalendar properties LINK, STRUCTURED-CATEGORY and
       REFID to allow better linking and grouping of iCalendar components
       and related data.</p>
