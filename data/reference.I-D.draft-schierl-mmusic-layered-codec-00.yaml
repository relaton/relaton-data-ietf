abstract:
- language: en
  script: Latn
  content: <p>This memo defines semantics that allows for signaling decoding dependency
    of different media descriptions with the same media type in the Session Description
    Protocol (SDP). This is e.g. required if media data as result of a layered media
    coding process is separated and carried in different transport streams. Therefore
    a new grouping type "DDP" - decoding dependency is defined to be used with the
    Grouping of Media Lines in the Session Description Protocol (RFC 3388); further
    an attribute is specified describing the relationship of media streams of a "DDP"
    group. Additionally attributes for description of the media properties are defined.</p>
