abstract:
- language: en
  script: Latn
  content: "<p>The Post Office Protocol - Version 3 (POP3) LIST+ Extension allows
    a POP3 client to instruct a POP3 server to send additional information with the
    LIST command response.  This will help save message round trips and bandwidth
    overhead, especially on mailboxes containing several messages.  On public POP3
    servers, serving thousands of mailboxes, and being polled frequently, LIST+ will
    help reduce server load.  Note  This document defines an extension to POP3, and
    updates RFC 1939.  Technical comments are solicited and should be addressed to
    Message Organizations Working Group's mailing list at morg@ietf.org and/or to
    the author.  You can subscribe to that list at https://www.ietf.org/mailman/listinfo/morg.
    \ Editorial comments should be addressed directly to the author.</p>"
