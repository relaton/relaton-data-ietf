abstract:
- language: en
  script: Latn
  content: "<p>This memo documents a proposal to allow SIP elements to use local policy
    when processing requests containing Route header fields. It identifies two restrictions
    on that local policy and provides an algorithm for satisfying one of those restrictions.
    It also presents several example flows utilizing policies enabled by this proposal.</p>"
