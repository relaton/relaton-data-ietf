abstract:
- language: en
  script: Latn
  content: "<p>The Autonomous Agent Interchange Format (AAIF) is an open, vendor-\n   neutral specification for the portable definition of artificial\n   intelligence agents.  An AAIF document encapsulates an agent's\n   identity, goal, system instructions, large language model (LLM)\n   provider preferences and fallback routing, multi-agent orchestration\n   topology (sequential pipeline, parallel swarm, dynamic routing, and\n   mid-run handoff), tool catalogue (supporting function, MCP, HTTP, and\n   OpenAPI protocols with structured authentication), memory\n   configuration, runtime policy, OpenTelemetry telemetry settings, LLM-\n   as-judge evaluation criteria, and compliance controls including data\n   residency and human-in-the-loop approval.\n\n   An agent defined in AAIF can be validated offline, committed to\n   version control, and imported into any conforming runtime regardless\n   of the original authoring environment.  This document describes the\n   AAIF data model, field semantics, conformance levels, capability\n   negotiation protocol, and the companion Agent State checkpoint schema\n   that enables cross-platform live migration of running agents.</p>"
