abstract:
- language: en
  script: Latn
  content: "<p>In this draft we introduce practical work for Peer-to-Peer (P2P) SIP
    system based on DSN, which is a Distributed Service Network proposed by China
    Mobile in ITU-T as the evolution of NGN. First we give a brief introduction about
    DSN and DSN VoIP system. We then introduce the measurement for validating the
    system. Finally we give the conclusion.</p>"
