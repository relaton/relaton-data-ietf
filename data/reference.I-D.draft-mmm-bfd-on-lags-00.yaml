abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a mechanism to run BFD on Link Aggregation Group
    (LAG) interfaces.  It does so by running an independent BFD session on every LAG
    member link.  A dedicated well-known multicast IP address for both IPv4 and IPv6
    is introduced as the destination IP address of the BFD packets when running BFD
    on the member links of the LAG.  There is currently no standard that describes
    how BFD should run on LAG interfaces.  As a result multiple non-interoperable
    BFD implementations for LAG interfaces exist.  This draft provides a short overview
    as a context for the new proposed mechanism.</p>"
