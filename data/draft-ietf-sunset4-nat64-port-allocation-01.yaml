abstract:
- language: en
  script: Latn
  content: "<p>This document enumerates methods of port assignment in Carrier Grade
    NATs (CGNs), focused particularly on NAT64 environments. Different NAT port allocation
    methods have been categorized and described. A series of port allocation design
    principles has been proposed to facilitate the implementations and deployment.</p>"
