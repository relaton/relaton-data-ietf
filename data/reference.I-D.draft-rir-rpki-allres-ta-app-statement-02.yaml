abstract:
- language: en
  script: Latn
  content: "<p>This document provides an applicability statement for the use of multiple,
    over-claiming 'all resources' (0/0) RPKI certificate authorities (CA) certificates
    used as trust anchors (TAs) operated by the Regional Internet Registry community
    to help mitigate the risk of massive downstream invalidation in the case of transient
    registry inconsistencies.</p>"
