abstract:
- language: en
  script: Latn
  content: "<p>This memo extends the Binary Floor Control Protocol enabling it to
    use UDP as a transport.  In order to use an unreliable transport mechanism this
    draft utilizes the existing transaction model in BFCP to achieve reliability.
    \ Each request now has an appropriate response to complete the transaction.  It
    also defines a keep alive behavior needed to keep NAT bindings open.</p>"
