abstract:
- language: en
  script: Latn
  content: "<p>This document defines protocols that instantiate the MoLE architecture:
    two endorsement protocols, by which a Client proves to a Moderator that it holds
    an Endorsement from a trusted Anchor without revealing which one, and three credential
    protocols, by which a Moderator issues, verifies, and updates per-Client state
    without being able to link presentations. It also establishes the registries that
    identify these protocols.</p>"
