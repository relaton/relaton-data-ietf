- language: en
  script: Latn
  content: "<p>It is often desirable to be able to indicate the natural language associated
    with values held in a directory and to be able to query the directory for values
    which fulfill the user's language needs. This document details the use of Language
    Tags and Ranges in the Lightweight Directory Access Protocol (LDAP). [STANDARDS-TRACK]</p>"
