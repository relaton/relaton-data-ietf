abstract:
- language: en
  script: Latn
  content: "<p>This document outlines a set of improvements to the WebRTC session
    setup protocols aimed at significantly reducing connection setup latency. This
    improved setup mechanism is known as the WebRTC Abridged Roundtrip Protocol (WARP).
    By addressing inefficiencies within the current multi-protocol handshake process,
    WARP can reduce setup latency from 6 RTTs to 2 RTTs when its optimizations are
    used together, with a direct impact on perceived performance and reliability.</p>"
