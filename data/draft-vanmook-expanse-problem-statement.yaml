abstract:
- language: en
  script: Latn
  content: "<p>Ongoing IETF work on networking in non-terrestrial and deep-space environments
    treats addressing, numbering, and registry policy as a greenfield. It is not.
    Three decades of operational practice, registry governance, and routing security
    infrastructure exist, and any space-segment architecture that ignores them will
    recreate, badly, the coordination mechanisms the Internet already has. This document
    describes the problem and motivates chartering a working group to address it.</p>"
