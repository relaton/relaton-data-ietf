abstract:
- language: en
  script: Latn
  content: "<p>This document describes deployment scenario of multi-homed Network
    in Motion (NEMO) and attempts to identify issues that arises when supporting multi-homing
    in NEMO. It is also the objective of this document to build a full taxonomy covering
    multi-homed scenarios in NEMO, so as to facilitate explorations into this aspect
    of NEMO.</p>"
