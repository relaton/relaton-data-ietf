abstract:
- language: en
  script: Latn
  content: <p>This document specifies a point-to-point route discovery mechanism,
    complementary to the RPL core functionality. This mechanism allows an IPv6 router
    to discover "on demand" routes to one or more IPv6 routers in the LLN such that
    the discovered routes meets specified metrics constraints.</p>
