abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Verified Infrastructure Response Protocol
       (VIRP), a cryptographic trust framework for AI-managed network
       infrastructure.  VIRP provides structural guarantees that
       observations of network state are authentic and that proposed changes
       are authorized, through channel-separated key binding and tiered
       approval enforcement.

       VIRP addresses the emerging threat of AI fabrication in network
       automation, where language model-based systems generate plausible but
       false device output, configuration state, or security findings.  The
       protocol makes fabrication structurally impossible by requiring
       cryptographic proof of observation at the point of collection.</p>
