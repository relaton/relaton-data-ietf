abstract:
- language: en
  script: Latn
  content: "<p>The SCHC architecture separates a SCHC Control Header from a SCHC\n   Data Header but leaves the format of the Control Header, the RuleID\n   encoding, and the Discriminator deployment-specific.  A node that\n   handles a SCHC datagram without being a Compression/Decompression\n   endpoint - a segment boundary, firewall, classifier, or capture tool\n   - therefore cannot delineate the datagram.  This document defines the\n   SCHC Header Format: a small, named description of a SCHC datagram's\n   framing - the RuleID encoding and the Control Header type - that can\n   be conveyed in band (self-describing) or fixed out of band (by an RFC\n   binding it to a demux point, by configuration, or by a signalling\n   protocol such as ICMPv6-SEC).  It defines the self-describing Shape\n   Tag wire format and establishes the SCHC RuleID Encodings and SCHC\n   Control-Header Types registries.</p>"
