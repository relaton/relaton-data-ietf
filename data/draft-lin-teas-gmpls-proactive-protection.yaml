abstract:
- language: en
  script: Latn
  content: "<p>This document describes protocol-specific procedures and extensions
    for Generalized Multi-Protocol Label Switching (GMPLS) Resource ReSerVation Protocol
    - Traffic Engineering (RSVP-TE) signaling to support Label Switched Path (LSP)
    Proactive Protection, which create the protecting LSP after a failure is predicted
    and before it becomes a real failure.</p>"
