abstract:
- language: en
  script: Latn
  content: "<p>This document describes how multicast mobility services can be supported
    with Proxy Mobile IPv6 [RFC5213], Multicast Listener Discovery (MLD) [RFC3810],
    and Internet Group Management Protocol (IGMP) [RFC3376]. Specifically, this document
    analyzes scenarios for multicast listener mobility. It proposes the use of a dedicated
    Local Mobility Anchor as the topological anchor point for multicast traffic, while
    the Mobile Access Gateway serves as an IGMP/MLD proxy. There are no impacts to
    the Mobile Node to support multicast listener mobility.</p>"
