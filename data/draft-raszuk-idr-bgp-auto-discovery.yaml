abstract:
- language: en
  script: Latn
  content: <p>This document describes a method for automating portions of a router's
    BGP configuration via discovery of BGP peers with which to establish further sessions
    from an initial "bootstrap" router. This method can apply for establishment of
    either Internal or External BGP peering sessions.</p>
