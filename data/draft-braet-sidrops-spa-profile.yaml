abstract:
- language: en
  script: Latn
  content: "<p>This document defines a standard profile for Source Prefix\n   Authorizations (SPAs), a Cryptographic Message Syntax (CMS) protected\n   content type for use with the Resource Public Key Infrastructure\n   (RPKI).  A SPA is a digitally signed object that allows the holder of\n   an IP address prefix assigned by a Regional Internet Registry (RIR)\n   to publish a list of source IP address prefixes authorized to send IP\n   packets to that destination prefix or its subprefixes.\n\n   To enforce these policies, a BGP speaker may include a\n   SOURCE_SELECTIVE Path Attribute referencing the SPAs.  This\n   distributes policy references, enabling routing systems to\n   incorporate source-based constraints into local forwarding policies\n   and trigger control plane enforcement</p>"
