abstract:
- language: en
  script: Latn
  content: "<p>The application of Digital Twin technology in the networking field
    is meant to develop various rich network applications, realize efficient and cost-effective
    data-driven network management, and accelerate network innovation. This document
    presents an overview of the concept of Network Digital Twin (NDT), provides the
    basic definitions and a reference architecture, lists a set of application scenarios,
    and discusses such technology's benefits and key challenges. This document is
    a product of the Network Management Research Group (NMRG) of the Internet Research
    Task Force (IRTF). This document reflects the consensus of the research group.
    It is not a candidate for any level of Internet Standard and is published for
    informational purposes.</p>"
