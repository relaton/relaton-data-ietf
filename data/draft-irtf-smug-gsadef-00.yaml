- language: en
  script: Latn
  content: "<p>This document provides a definition of the Group Security Association
    (GSA) for IP multicast, derived from the Security Association (SA) definition
    for unicast. The document describes the motivations of a GSA and other issues
    related to the GSA usage in the context of the existing IPsec implementations.</p>"
