- language: en
  script: Latn
  content: "<p>This document defines extensions to the Web Distributed Authoring and
    Versioning (WebDAV) protocol to specify a standard way of accessing, managing,
    and sharing contact information based on the vCard format. Discussion of this
    Internet-Draft is taking place on the mailing list &lt;http://lists.osafoundation.org/mailman/listinfo/ietf-carddav&gt;.</p>"
