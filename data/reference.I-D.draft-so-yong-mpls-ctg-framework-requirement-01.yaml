abstract:
- language: en
  script: Latn
  content: "<p>This document states a traffic distribution problem in today's IP/
    MPLS network when multiple physical or logical links are configured between two
    routers.  The document presents a Composite Transport Group framework as TE transport
    methodology over composite link for the problems and specifies a set of requirements
    for Composite Transport Group(CTG).</p>"
