abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a protocol named IMP, which can be used for
    monitoring IGP routing protocol. Compared to the widely used packets catch and
    route listening method, this protocol is more convenient for obtaining routing
    information and capturing routing changes, can well satisfy network routing monitoring
    and research purpose.</p>"
