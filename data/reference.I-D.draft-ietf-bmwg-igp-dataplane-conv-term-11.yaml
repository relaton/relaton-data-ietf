abstract:
- language: en
  script: Latn
  content: "<p>This document describes the terminology for benchmarking IGP Route
    Convergence as described in Applicability document [Po061] and Methodology document
    [Po062]. The methodology and terminology are to be used for benchmarking Convergence
    Time and can be applied to any link-state IGP such as ISIS [Ca90] and OSPF [Mo98].
    The data plane is measured to obtain the convergence benchmarking metrics described
    in [Po062].</p>"
