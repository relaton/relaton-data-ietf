abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Transport Layer Security (TLS) extension for
    cached information. This extension allows the TLS client to inform a server of
    cached information from previous TLS sessions, allowing the server to omit sending
    cached static information to the client during the TLS handshake protocol exchange.</p>"
