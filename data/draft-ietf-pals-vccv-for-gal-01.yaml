abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new Virtual Circuit Connectivity Verification
    (VCCV) (RFC5085) control channel type for use with pseudowires (PW) carried over
    an MPLS network. This new channel type uses the Generic Associated Channel Label
    (GAL) (RFC5586) to distinguish VCCV packets from packets carrying user data.</p>"
