abstract:
- language: en
  script: Latn
  content: "<p>Many definitions of packet delay variation exist, and two different
    formulations have come into wide use in the context of active measurements. This
    memo examines a range of circumstances for active measurements and their uses,
    and recommends which of these two forms is best matched to the conditions and
    task.</p>"
