title:
- language: en
  script: Latn
  content: A Deprecation Manifest for Field-Level Lifecycle Signalling in HTTP APIs
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-rmili-httpapi-deprecation-manifest-00
