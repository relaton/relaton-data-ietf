abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how to use ECDSA (Elliptic Curve Digital Signature
    Algorithm) with XML Signatures [XMLDSIG]. The mechanism specified provides integrity,
    message authentication, and/or signer authentication services for data of any
    type, whether located within the XML that includes the signature or included by
    reference.</p>"
