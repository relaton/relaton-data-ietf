abstract:
- language: en
  script: Latn
  content: <p>Before a client application subscribes to updates from a datastore,
    server capabilities related to "Subscription to YANG Datastores" can be advertised
    using YANG Instance Data format.  These server capabilities can be documented
    at implement time or reported at run- time.</p>
- language: en
  script: Latn
  content: "<p>This document proposes a YANG module for self describing data Object
    tag capability which augments system capabilities model and provide additional
    self describing data node attributes associated with node selectors within per-node
    capabilities.</p>"
