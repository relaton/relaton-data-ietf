abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a standard way of converting IP addresses to CCITT
    X.121 addresses and is the recommended standard for use on the Internet, specifically
    for the Defense Data Network (DDN).  This memo provides information for the Internet
    community.  It does not specify an Internet standard.</p>"
