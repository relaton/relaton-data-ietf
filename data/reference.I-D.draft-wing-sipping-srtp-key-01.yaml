abstract:
- language: en
  script: Latn
  content: "<p>Many Secure RTP (SRTP) key exchange mechanisms do not disclose the
    SRTP session keys to intermediate SIP proxies. Howevr, these key exchange mechanisms
    cannot be used In environments where transcoding, monitoring, or call recording
    are needed. This document specifies a secure mechanism for a cooperating endpoint
    to disclose its SRTP master keys to an authorized party.</p>"
