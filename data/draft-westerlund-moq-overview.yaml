abstract:
- language: en
  script: Latn
  content: "<p>This document provides a high-level overview of the Media over QUIC
    (MoQ) protocol suite. It describes the architecture, data model, transport protocol,
    streaming formats, and security mechanisms that together enable scalable low-latency
    media delivery over the Internet. The document explains how these components relate
    to each other and how they are composed to create interoperable media applications.</p>"
