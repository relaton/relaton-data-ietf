abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Micro Agent Communication Protocol (µACP),
    a resource-efficient messaging protocol for autonomous agents operating on resource-constrained
    Edge and IoT devices (including Class 1 and Class 2 devices per [RFC7228]). Existing
    agent communication protocols assume unbounded computational and energy resources,
    µACP provides mechanisms for bounded resource consumption with deterministic memory
    bounds (8-byte header, explicitly delimited TLV region, and profile-dependent
    payload limits) and bounded processing time per message, while maintaining expressiveness
    sufficient for finite-state coordination patterns. The protocol defines four core
    message types, a fixed 64-bit header, TLV-based extensibility, and mandatory OSCORE
    security binding for operation in adversarial environments.</p>"
