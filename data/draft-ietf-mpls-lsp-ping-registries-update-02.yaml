abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 8029 and RFC 8611 that both define IANA registries
    for MPLS LSP Ping. It also updates the language that is used to define the procedures
    for responses are sent when an unkwon or errored code point is found. The updates
    are for clarification and to align this name space with recent developments.</p>"
