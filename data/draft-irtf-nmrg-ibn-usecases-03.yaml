abstract:
- language: en
  script: Latn
  content: "<p>This document proposes several use cases of Intent-Based Networking
    (IBN) and a methodology to differ each use case by following the lifecycle of
    a real IBN system. It includes data collection for system awareness in the IBN
    system and the construction of the IBN system. This construction consists of intent
    translation, policy translation, policy verification, policy deployment, policy
    monitoring, policy validation, policy optimization, and intent report. Practice
    learnings are also summarized to instruct the construction of next generation
    network management systems with the integration of IBN techniques. Finally, this
    document discusses three aspects for the deployment of IBN systems on the real
    world. They are Multi-Domain Dichotomy for IBN, the Integration of IBN and Network
    Digital Twin, and IBN with Artificial Intelligence (AI).</p>"
