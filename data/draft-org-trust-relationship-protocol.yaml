- language: en
  script: Latn
  content: <p>This document specifies the "Organization Trust Relationship Protocol"
    method for service owners (organizations) to express in a standard format their
    trusted relationships with other organizations, as well as identify the social
    networks they control. This method was originally defined by Scott Yates in 2020
    for this purpose.</p>
