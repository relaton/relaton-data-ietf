abstract:
- language: en
  script: Latn
  content: "<p>This document provides two possible solutions for protecting point
    to multipoint (P2MP) traffic distribution over a ring topology in MPLS-TP networks.
    These two methods can protect any link or node(except the root node)failure once
    a failure is detected through MPLS-TP OAM mechanism.</p>"
