abstract:
- language: en
  script: Latn
  content: <p>Bootstrapping Remote Secure Key Infrastructures (BRSKI) defines how
    to onboard a device securely into an operator-maintained infrastructure. It assumes
    that there is local network infrastructure for the device to discover. On networks
    without that, there is nothing present to help onboard the device. This document
    extends BRSKI and defines behavior for bootstrapping devices for deployments where
    no local infrastructure is available, such as in a home or remote office. This
    document defines how the device can use a well-defined "call-home" mechanism to
    find the operator-maintained infrastructure. This document defines how to contact
    a well-known Cloud Registrar, and two ways in which the device may be redirected
    towards the operator-maintained infrastructure. The Cloud Registrar enables discovery
    of the operator-maintained infrastructure, and may enable establishment of trust
    with operator-maintained infrastructure that does not support BRSKI mechanisms.
    This document updates RFC 8995 (BRSKI).</p>
  format: text/html
