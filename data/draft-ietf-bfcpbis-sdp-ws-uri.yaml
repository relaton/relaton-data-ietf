abstract:
- language: en
  script: Latn
  content: "<p>The WebSocket protocol enables bidirectional real-time communication
    between clients and servers in web-based applications. This document specifies
    extensions to Session Description Protocol (SDP) for application protocols using
    WebSocket as a transport.</p>"
  format: text/html
