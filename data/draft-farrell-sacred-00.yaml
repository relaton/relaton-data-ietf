abstract:
- language: en
  script: Latn
  content: "<p>As the number, and more particularly the number of different types,
    of devices, connecting to the Internet increases, credential mobility becomes
    an issue for IETF standardization. This draft presents some requirements, a strawman
    framework and outlines a protocol for securely available credentials.</p>"
