abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a DHCPv4 option to indicate that a host supports
    an IPv6-only mode and willing to forgo obtaining an IPv4 address if the network
    provides IPv6 connectivity. It also updates RFC2563 to specify the DHCPv4 server
    behavior when the server receives a DHCPDISCOVER not containing the Auto-Configure
    option.</p>"
