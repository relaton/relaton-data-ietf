abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in TCP/IP-based internets. In particular,
    it defines objects for controlling the reporting of alarm conditions of a network
    device. Textual Conventions used in this MIB are defined in [RFC2579].</p>"
