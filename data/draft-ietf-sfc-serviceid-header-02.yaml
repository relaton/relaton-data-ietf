abstract:
- language: en
  script: Latn
  content: "<p>This document defines Subscriber and Performance Policy Identifiers
    Network Service Header Variable-Length Context Headers to inform Service Functions
    about subscriber- and service-related information for the sake of policy enforcement
    and appropriate service function chaining operations. The structure of each context
    header is defined, their use and processing instructions by SFC-aware nodes are
    explained.</p>"
