abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a QoS-NSLP QoS model (QOSM) based on ITU-T Recommendation
    Y.1541 Network QoS Classes and related signaling requirements.  Y.1541 specifies
    8 classes of Network Performance objectives, and the Y.1541-QOSM extensions include
    additional QSPEC parameters and QOSM processing guidelines.</p>"
