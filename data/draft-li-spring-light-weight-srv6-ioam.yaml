abstract:
- language: en
  script: Latn
  content: "<p>In-situ OAM(IOAM) records OAM information within the packet while the
    packet traverses a particular network domain. This document defines a light weight
    IOAM method for SRv6 network programming. In this method, IOAM information is
    carried in the data packet by the SIDs in the SRH.</p>"
