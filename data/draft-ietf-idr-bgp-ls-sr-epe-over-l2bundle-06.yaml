abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to support Segment Routing BGP Egress Peer
    Engineering over Layer 2 bundle members. It updates RFC 9085 to allow the L2 Bundle
    Member Attributes TLV in the BGP-LS Attribute of the BGP-LS Link NLRI for a BGP
    peering link. For SR-MPLS, it updates RFC 9085 and RFC 9086 to allow the PeerAdj
    SID TLV as a sub-TLV of the L2 Bundle Member Attributes TLV.</p>"
