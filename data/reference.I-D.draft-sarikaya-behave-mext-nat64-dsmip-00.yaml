abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies how IPv6 only mobile nodes (MN) receiving host-
    based mobility management using Dual Stack Mobile IPv6 (DSMIPv6) can communicate
    with IPv4 only servers.  The protocol is based on home agents maintaining a table
    similar to NAT64 and linking it to the binding cache.  This technique avoids the
    problems encountered when NAT64 is used for mobile nodes in Dual Stack Mobile
    IPv6.  How IPv6 only mobile nodes can receive multicast data from IPv4 only content
    providers is also explained.</p>"
