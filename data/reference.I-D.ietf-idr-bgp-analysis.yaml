abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this report is to document how the requirements for
    advancing a routing protocol from Draft Standard to full Standard have been satisfied
    by Border Gateway Protocol version 4 (BGP-4). This report satisfies the requirement
    for 'the second report', as described in Section 6.0 of [RFC1264]. In order to
    fulfill the requirement, this report augments [RFC1774] and summarizes the key
    features of BGP-4 protocol, and analyzes the protocol with respect to scaling
    and performance.</p>"
