abstract:
- language: en
  script: Latn
  content: "<p>This document describes an RFC 3933 experiment in the Working Group
    formation process, known as the Study Group. Study Groups may be created as the
    first step toward Working Group formation, or as an intermediate step between
    a Birds of a Feather (BOF) session and Working Group creation. Study Groups are
    focused on completion of prerequisites for Working Group formation, and as a result
    they have a short life-time, with limited opportunities for milestone extension.</p>"
