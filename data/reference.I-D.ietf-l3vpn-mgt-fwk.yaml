abstract:
- language: en
  script: Latn
  content: "<p>This document provides a framework for operation and management of
    Layer 3 Virtual Private Networks (L3VPNs). This framework intends to produce a
    coherent description of the significant technical issues that are important in
    the design of L3VPN management solutions. Selection of specific approaches, making
    choices among information models and protocols are outside of the scope of this
    document.</p>"
