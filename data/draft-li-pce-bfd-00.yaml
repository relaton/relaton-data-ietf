abstract:
- language: en
  script: Latn
  content: "<p>This document describes the extensions to the PCEP to notify BFD parameters
    for LSPs from PCE to PCC for PCE-initiated LSP. The extensions include BFD protocol
    parameters and allow PCC to support BFD for PCE-Initiated LSP whose BFD session
    is a bi-directional co- routed channel.</p>"
