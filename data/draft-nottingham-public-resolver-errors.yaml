abstract:
- language: en
  script: Latn
  content: "<p>[I-D.ietf-dnsop-structured-dns-error] introduces structured error\n   data for DNS responses that have been filtered.  This specification\n   allows more specific details of filtering incidents to be conveyed.\n\nDiscussion Venues\n\n   This note is to be removed before publishing as an RFC.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/mnot/public-resolver-errors.</p>"
