abstract:
- language: en
  script: Latn
  content: "<p>Source Address Validation (SAV) enforcement requires operational\n   visibility into validation results, traffic-handling outcomes, SAV\n   rule generation and state, and SAV configuration.  Such visibility\n   helps operators understand how SAV operates in the network and\n   supports operational decisions, including staged deployment where\n   traffic that fails validation may be permitted while being monitored\n   and analyzed.  This document identifies information requirements for\n   monitoring SAV enforcement.</p>"
