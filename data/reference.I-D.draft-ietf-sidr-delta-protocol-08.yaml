abstract:
- language: en
  script: Latn
  content: "<p>In the Resource Public Key Infrastructure (RPKI), Certificate Authorities
    publish certificates, including end entity certificates, Certificate Revocation
    Lists (CRL), and RPKI signed objects to repositories.  Relying Parties retrieve
    the published information from those repositories.  This document specifies a
    new RPKI Repository Delta Protocol (RRDP) for this purpose.  RRDP was specifically
    designed for scaling.  It relies on a notification file which lists the current
    snapshot and delta files that can be retrieved using HTTP over TLS (HTTPS), and
    enables to use of CDNs or other caching infrastructure for the retrieval of these
    files.</p>"
