abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the payload format for packetization of SPIRIT
    IP-MR encoded speech signals into the real-time transport protocol (RTP). The
    payload format supports transmission of multiple frames per packet and introduced
    redundancy for robustness against packet loss and bit errors.</p>"
