abstract:
- language: en
  script: Latn
  content: "<p>This draft defines a new option to inform the server about the client's
    physical interface it is connected to. This information may be used together with
    the relay agent information option (RFC 3046) for the purpose of topology recognition
    as well as for IP and other parameter assignment policies.</p>"
