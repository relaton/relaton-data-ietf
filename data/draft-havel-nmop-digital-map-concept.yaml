abstract:
- language: en
  script: Latn
  content: "<p>This document defines the concept of Digital Map, explains its\n   connection to the Digital Twin, and identifies a set of Digital Map\n   requirements and use cases.\n\n   The document intends to be used as a reference for the assessment\n   effort of the various topology modules to meet Digital Map\n   requirements.\n\n   Discussion Venues\n\n   This note is to be removed before publishing as an RFC.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/OlgaHuawei/draft-havel-nmop-digital-map-concept/.</p>"
