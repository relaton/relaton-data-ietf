abstract:
- language: en
  script: Latn
  content: "<p>This memo presents an approach  for  building  hierarchical   Virtual\nPrivate  Network  (VPN)  services.   This approach uses Multiprotocol\nLabel Switching (MPLS).   The  central  vision  is  for  the  service\nprovider  to  provide  a  virtual router service to other SPs without\nparticipating in VPNs of those SPs.</p>"
