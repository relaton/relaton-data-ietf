abstract:
- language: en
  script: Latn
  content: "<p>This document defines a core verifier-side acceptance profile for\n   session-bound Agent identity.  Its primary failure class is context\n   diversion: accepting cryptographically valid material for a different\n   service, tenant, Agent, task, delegation, or authority boundary than\n   the verifier intended.  A verifier accepts an Agent only when a\n   verified authority grant, holder-of-key proof, accepted TLS or\n   exported-authenticator session, freshness and replay state, any\n   required attestation result, and verifier-local policy all describe\n   the same intended interaction.\n\n   This document does not define a universal Agent namespace, identity\n   provider, attestation evidence format, holder-side presentation\n   mechanism, control plane, gateway, or complete application protocol.\n   Instead, it defines the fail-closed acceptance rule for composing\n   existing Internet mechanisms at the verifier boundary, and states the\n   requirements that a concrete binding profile has to fix for\n   interoperability.</p>"
