abstract:
- language: en
  script: Latn
  content: "<p>This document defines YANG modules to add support for classifying traffic
    received on interfaces as Ethernet/VLAN framed packets to sub-interfaces based
    on the fields available in the Ethernet/VLAN frame headers. These modules allow
    configuration of Layer 3 and Layer 2 sub-interfaces (e.g. attachment circuits)
    that can interoperate with IETF based forwarding protocols; such as IP and L3VPN
    services; or L2VPN services like VPWS, VPLS, and EVPN. The sub-interfaces also
    interoperate with VLAN tagged traffic orginating from an IEEE 802.1Q compliant
    bridge. Primarily the classification is based on VLAN identifiers in the 802.1Q
    VLAN tags, but the model also has support for matching on some other layer 2 frame
    header fields and is designed to be extensible to match on other arbitrary header
    fields. The model differs from an IEEE 802.1Q bridge model in that the configuration
    is interface/sub-interface based as opposed to being based on membership of an
    802.1Q VLAN bridge.</p>"
