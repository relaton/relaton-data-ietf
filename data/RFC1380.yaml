- language: en
  script: Latn
  content: "<p>This memo summarizes issues surrounding the routing and addressing
    scaling problems in the IP architecture, and it provides a brief background of
    the ROAD group and related activities in the Internet Engineering Task Force (IETF).
    This memo provides information for the Internet community. It does not specify
