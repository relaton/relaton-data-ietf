- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes managed objects for Multiprotocol Label Switching (MPLS) and Generalized
    Multiprotocol Label Switching (GMPLS) Label Switched Routers (LSRs).</p>"
