abstract:
- language: en
  script: Latn
  content: "<p>When HTTP clients use the CONNECT method or UDP proxying (CONNECT-
    UDP) to reach target servers through a proxy, the proxy performs DNS resolution
    on behalf of the client. This prevents the client from accessing Service Binding
    (SVCB and HTTPS) DNS records that carry service configuration such as supported
    protocols and Encrypted Client Hello keys. This document defines HTTP header fields
    that enable the proxy to relay SVCB information to the client, and introduces
    a conditional early closure mechanism that allows the client to coordinate with
    the proxy to abort a connection when specific SVCB parameters are present, so
    that the client can retry with a different connection strategy.</p>"
