abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework for Computing-Aware Traffic Steering
    (CATS). Specifically, the document identifies a set of CATS functional components,
    describes their interactions, and provides illustrative workflows of the control
    and data planes. The framework covers only the case of a single service provider.</p>"
  format: text/html
