title:
- language: en
  script: Latn
  content: The 'I' in RPKI Does Not Stand for Identity
  format: text/plain
docidentifier:
- content: draft-ietf-sidrops-rpki-has-no-identity
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2022-04-20'
abstract:
- language: en
  script: Latn
  content: "<p>There is a false notion that Internet Number Resources (INRs) in the
    RPKI can be associated with the real-world identity of the 'holder' of an INR.
    This document specifies that RPKI does not associate to the INR holder.</p>"
  format: text/html
