abstract:
- language: en
  script: Latn
  content: "<p>A standard set of information fields is defined as the first version
    of an Electronic Commerce Modeling Language (ECML) so that this task can be more
    easily automated, for example by wallet software that could fill in fields.  This
    memo provides information for the Internet community.</p>"
