  content: |-
    <p>This document describes the 'voc:' Uniform Resource Identifier (URI)
    scheme for vocabulary terms and codes.
    The 'voc:' URI scheme also belongs to the class of Hierarchical URI
    Schemes as defined in RFC 2396 'Uniform Resource Identifiers (URI):
    Generic Syntax'.</p>
