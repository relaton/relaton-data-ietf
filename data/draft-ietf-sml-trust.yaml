- language: en
  script: Latn
  content: "<p>This document discusses trust and security considerations for structured
    email and provides recommendations for message user agents on how to deal with
    structured data in email messages. Discussion Venues This note is to be removed
    before publishing as an RFC. Discussion of this document takes place on the Structured
    Email Working Group mailing list (sml@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/sml/.
    Source for this draft and an issue tracker can be found at https://github.com/arnt/sml-trust.</p>"
