abstract:
- language: en
  script: Latn
  content: "<p>NETCONF clients and servers often need to have a synchronized view
    of the server's configuration datastores. The volume of configuration data in
    a server may be very large, while datastore changes typically are small when observed
    at typical client resynchronization intervals. Rereading the entire datastore
    and analyzing the response for changes is inefficient for synchronization. This
    document specifies a NETCONF extension that allows clients and servers to keep
    synchronized with a much smaller data exchange and without any need for servers
    to store information about the clients.</p>"
