- language: en
  script: Latn
  content: "<p>This document describes an application layer client-server protocol
    for a framework of representing the query and result operations of directory services.
    Specified in XML, the protocol defines generic directory query and result operations
    and a mechanism for extending these operations for specific directory service
    needs.</p>"
