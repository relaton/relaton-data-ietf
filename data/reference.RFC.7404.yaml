abstract:
- language: en
  script: Latn
  content: "<p>In an IPv6 network, it is possible to use only link-local addresses
    on infrastructure links between routers.  This document discusses the advantages
    and disadvantages of this approach to facilitate the decision process for a given
    network.</p>"
