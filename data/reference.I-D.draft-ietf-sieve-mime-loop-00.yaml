abstract:
- language: en
  script: Latn
  content: "<p>The current Sieve language has no way to look at individual MIME parts,
    looping mechanism, or any way to manipulate those individual parts. This document
    defines extensions for each of these needs. This document is being discussed in
    the MTA-FILTERS mailing lists, ietf-mta-filters@imc.org.</p>"
