abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC2026 describes the procedure for appealing decisions or process
       failures to the IESG and the IAB.  This document updates RFC2026 and
       requires that an appellant must first gain support for their appeal
       before an appeal may be considered by the body it is submitted to.</p>
