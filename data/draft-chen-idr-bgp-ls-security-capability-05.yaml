abstract:
- language: en
  script: Latn
  content: "<p>The BGP-LS protocol is extended to carry the security capabilities
    of the node. The controller collects topology information, forms a topology path
    with security capabilities according to security requirements, and supports SRv6
    path sending to execute node forwarding through programming.</p>"
