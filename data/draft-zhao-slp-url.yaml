abstract:
- language: en
  script: Latn
  content: "<p>This document describes the SLP URL format for the Service Location\nProtocol. The SLP URL is used to encode an SLP search query into a\nURL string, which facilitates the integration of SLP with systems\nthat use URL as an interface, and provides a convenient way to\nexpress remote SLP discovery.</p>"
