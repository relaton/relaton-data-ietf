abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a data model for the configuration of Selection
    Processes, Caches, Exporting Processes, and Collecting Processes of IPFIX and
    PSAMP compliant Monitoring Devices using UML (Unified Modeling Language) class
    diagrams.  The configuration data is encoded in Extensible Markup Language (XML).
    \ The structure of the data model is specified in a YANG module to ensure compatibility
    with the NETCONF protocol.</p>"
