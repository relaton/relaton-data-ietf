- language: en
  script: Latn
  content: "<p>This document defines a generic stateless command-line interface for
    dealing with OpenPGP messages, certificates, and secret key material, known as
    sop. It aims for a minimal, well-structured API covering OpenPGP object security
    and maintenance of credentials and secrets.</p>"
