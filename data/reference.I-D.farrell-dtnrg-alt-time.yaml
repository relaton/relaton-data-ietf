abstract:
- language: en
  script: Latn
  content: "<p>The Bundle Protocol (RFC 5050) requires the use of real time clocks
    to handle bundle expiry.  This sometimes has some drawbacks; this specification
    explains some such situations, briefly considers generic ways to ameliorate those,
    and defines some alternative approaches for handling bundle expiry that do not
    require real time clocks.</p>"
