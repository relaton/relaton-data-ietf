abstract:
- language: en
  script: Latn
  content: "<p>This document describes a delivery framework for usage and domain specific
    root keys (USRK and DSRK), derived as part of an EAP EMSK hierarchy, and delivered
    from an EAP server to an intended third party key holder.  The framework description
    includes different scenarios for key delivery, depending on the type of keys being
    delivered.  It also includes, specification of derivation of keys required for
    security protection of key requests and delivery signaling.</p>"
