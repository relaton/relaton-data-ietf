abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 5066. It amends that specification by informing
    the Internet community about the transition of the EFM-CU-MIB module from the
    concluded IETF Ethernet Interfaces and Hub MIB Working Group to the Institute
    of Electrical and Electronics Engineers (IEEE) 802.3 working group.</p>"
