abstract:
- language: en
  script: Latn
  content: "<p>The IETF is completing its work on TWAMP - the Two-Way Active Measurement
    Protocol. This memo describes a proposed feature for TWAMP, intended for discussion
    in the IP Performance Metrics WG. The feature gives the reflector the ability
    to return some of the packet padding bits to the sender.</p>"
