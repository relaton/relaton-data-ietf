abstract:
- language: en
  script: Latn
  content: "<p>Current attestation frameworks establish that a system or agent is\n   trustworthy at a point in time.  They do not address whether that\n   system actually performed a claimed action or whether the outcome of\n   that action can be independently verified.  This document defines\n   execution outcome verification as a first-class concept, separate\n   from identity attestation and communication transport.  It introduces\n   the execution receipt as a minimal composable primitive, provides a\n   formal abstract model, and maps the model to concrete realizations\n   including SCITT transparency logs, tightly-coupled direct\n   verification, append-only local logs, and TEE-internal receipts.</p>"
