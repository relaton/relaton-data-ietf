abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines ML-KEM-512, ML-KEM-768, and ML-KEM-1024 as
       NamedGroups and and registers IANA values in the TLS Supported Groups
       registry for use in TLS 1.3 to achieve post-quantum (PQ) key
       establishment.</p>
