abstract:
- language: en
  script: Latn
  content: "<p>This document discusses topics related to hierarchical and stitched
    Generalized Multiprotocol Label Switching (GMPLS) Label Switched Paths (LSPs).
    \ It describes extensions to allow an egress to identify that a bi-directional
    LSP will be used as a dynamically signaled Forwarding Adjacency LSP (FA-LSP) or
    as a Routing Adjacency (RA). In addition, the document also discusses the issue
    of how to indicate that an LSP should be advertised as a traffic engineering (TE)
    link into a different instance of the IGP, and how to identify the instance that
    should be used.</p>"
