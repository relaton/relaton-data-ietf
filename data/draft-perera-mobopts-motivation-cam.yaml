abstract:
- language: en
  script: Latn
  content: "<p>This document describes the motivation for investigating the\n       definition
    and architectural implications of defining what a\n       “context” is for mobility
    management purposes.  This draft seeks\n       to generate enough interest on
    this topic in the working group. \n       If there is sufficient interest on this
    topic, drafts that \n       address methodologies to enable context aware mobility
    could be \n       proposed.</p>"
