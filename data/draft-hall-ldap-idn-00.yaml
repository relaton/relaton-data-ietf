abstract:
- language: en
  script: Latn
  content: "<p>This document defines schema and behavioral rules which are necessary
    to fully accommodate the use of internationalized domain names as UTF-8 sequences
    in LDAP. Specifically, this document defines an internationalized domain component
    attribute, email address attribute, URI syntax, and several related object classes,
    and also discusses their usage considerations.</p>"
