abstract:
- language: en
  script: Latn
  content: "<p>This draft presents an informational overview of the Wi-SUN technology,
    which gives the principal characteristics of the protocols that have been adopted.
    \ The objective is to provide overview information for the IETF LPWAN working
    group.  We also identify relevant characteristics of Wi-SUN that make it suitable
    for deployment in LPWWANs.</p>"
