abstract:
- language: en
  script: Latn
  content: "<p>BGP Flow Specification (FlowSpec) (as defined in RFC 8955, RFC 8956
    and RFC 9117) has been proposed to distribute BGP (RFC 4271) FlowSpec NLRI to
    FlowSpec clients to mitigate (distributed) denial-of-service attacks, and to provide
    traffic filtering in the context of a BGP/ MPLS VPN service. Recently, traffic
    steering applications in the context of SR-MPLS and SRv6 using FlowSpec are being
    used in networks. This document introduces the usage of BGP Flow Specification
    to steer packets into an SR Policy.</p>"
