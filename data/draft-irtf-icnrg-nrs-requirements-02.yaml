abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the motivation and design guidelines for Name
    Resolution Service (NRS) in ICN. The NRS in ICN is to translate an object name
    into some other information such as a locator and another name which is used for
    forwarding the object request.</p>"
