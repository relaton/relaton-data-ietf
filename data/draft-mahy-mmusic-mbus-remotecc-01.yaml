abstract:
- language: en
  script: Latn
  content: "<p>Mbus (Message Bus for Local Coordination) was designed with remote
    call control in mind as an Mbus profile. This document discusses changes necessary
    to the long abandoned call control profile to address recent requrirement, and
    conditions of use to make the core Mbus appropriate for use among SIP systems
    on the Internet.</p>"
