abstract:
- language: en
  script: Latn
  content: "<p>A number of TCP enhancements in so diverse fields as congestion control,
    loss recovery or side-band signaling could be improved by making the values carried
    in the Timestamp option transparent, and changing the receiver side processing
    of timestamps in the presence of selective acknowledgements.  This documents specifies
    a backwards compatible way of negotiating for Timestamp capabilities, and lists
    a number of benefits and drawbacks of this approach.</p>"
