abstract:
- language: en
  script: Latn
  content: "<p>In certain topologies, it is not necessary to run a multicast routing
    protocol. It is sufficient to learn group membership information and simply forward
    based upon that information. This draft describes a mechanism for forwarding based
    solely upon IGMP membership information.</p>"
