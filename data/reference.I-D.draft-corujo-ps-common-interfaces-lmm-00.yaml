abstract:
- language: en
  script: Latn
  content: "<p>This memo is a problem statement on the use of link events for enhanced
    handover control in network based localized mobility management. Starting from
    existing solutions for fast link detection the document aims at discussing possibilities
    for a layer 2.5 interface between MN and AR for handover control. The document
    also presents a set of considerations and identifies conditions where a layer
    2.5 based interface offers significant advantages compared to a pure layer three
    solution.</p>"
