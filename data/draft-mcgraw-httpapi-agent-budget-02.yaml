abstract:
- language: en
  script: Latn
  content: <p>Delegated software requesters increasingly make HTTP requests that spend,
    consume, disclose, mutate, invoke, or actuate on behalf of human or organizational
    principals. Existing HTTP authentication mechanisms indicate whether a requester
    holds a credential. RateLimit fields communicate server-advertised quota and current
    service-limit information. HTTP Message Signatures can protect selected components
    of an HTTP message. None of these mechanisms directly defines a common origin-server
    challenge for a requester to present verifiable, bounded authority from its principal
    before the server performs protected processing. This document defines the "Delegation"
    HTTP authentication scheme, response semantics for delegated-authority challenges
    using existing HTTP status codes and Problem Details, the Delegation-Proof HTTP
    field, and a COSE/CBOR proof carriage model for request-bound delegated authority.
    The initial authority profile is the Budget profile, which uses a CBOR/COSE Budget-Attestation
    envelope to prove bounded authority to spend, consume metered service units, or
    commit bounded resources. The mechanism is algorithm-agile; the initial cose-ml-dsa
    proof profile uses existing JOSE and COSE serializations for ML-DSA, with ML-DSA-65
    as the baseline algorithm and ML-DSA-87 available as a high-assurance deployment
    policy option. A dedicated 4NN Delegated Authority Required status code remains
    an open design question for HTTP Working Group review; this revision does not
    depend on that status code and does not define payment semantics.</p>
