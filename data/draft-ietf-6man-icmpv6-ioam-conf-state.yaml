  primary: true
abstract:
- language: en
  script: Latn
  content: <p>This document describes the application of the mechanism of discovering
    In-situ OAM (IOAM) capabilities, described in RFC 9359 "Echo Request/Reply for
    Enabled In Situ OAM (IOAM) Capabilities", in IPv6 networks. IPv6 Node IOAM Query
    functionality uses the ICMPv6 Query messages, allowing the IOAM encapsulating
    node to discover the enabled IOAM capabilities of each IOAM transit and IOAM decapsulating
    node.</p>
  format: text/html
