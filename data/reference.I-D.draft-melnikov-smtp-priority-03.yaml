abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an extension to the SMTP (Simple Mail Transfer Protocol)
    service whereby messages are sent with a priority to enable the receiving MTA
    (Message Transfer Agent) to take this into account for onward processing, with
    the general goal of processing and/or transferring higher priority messages first.</p>"
