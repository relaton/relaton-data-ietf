abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to use a Service Function Forwarder (SFF)
    Label (similar to a pseudowire label or VPN label) to indicate the presence of
    a Service Function Chaining (SFC) Network Service Header (NSH) between an MPLS
    label stack and the packet payload. This allows SFC packets using the NSH to be
    forwarded between SFFs over an MPLS network, and the selection between multiple
    SFFs in the destination MPLS node.</p>"
