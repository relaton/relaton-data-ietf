abstract:
- language: en
  script: Latn
  content: "<p>The document proposes an extension to FMIPv6 to enable fast multicast
    handover. The mobile node in the foreign link being visited uses its care-of address(CoA)
    to join multicast groups via a local multicast router. During handover, PAR sends
    MN's MLD state to NAR which helps NAR establish the multicast delivery trees in
    advance. PAR also tunnels all multicast traffic to NAR which buffers them to be
    delivered after the handover is completed.</p>"
