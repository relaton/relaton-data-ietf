abstract:
- language: en
  script: Latn
  content: "<p>This draft defines algorithms for authenticated encryption with additional
    authenticated data (AEAD), and defines a uniform interface and a registry for
    such algorithms. The interface and registry can be used as an application independent
    set of cryptoalgorithm suites. This approach provides advantages in efficiency
    and security, and promotes the reuse of crypto implementations.</p>"
