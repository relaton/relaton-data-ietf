abstract:
- language: en
  script: Latn
  content: <p>The Session Initiation Protocol (SIP) "Caller Preferences" extension,
    defined in RFC 3840, provides a mechanism that allows a SIP message to convey
    information relating to the originator's features and capabilities.  This document
    defines a new SIP header field, Feature- Caps, that can be used by entities to
    indicate support of features and capabilities, in case they cannot use the Contact
    header field for that purpose.</p>
