abstract:
- language: en
  script: Latn
  content: <p>This document describes an Registration Data Access Protocol (RDAP)
    extension for providing the status of server validations. Server validations can
    be done for an extensible set of types, with examples including validating DNS
    resolution with the type "dns" and validating DNSSEC with the type "dnssec". The
    validations can be performed synchronously in the provisioning command or asynchronously
    based on a triggering command or a schedule. The extension will provide the status
    of the validations, by type, performed by the server in an RDAP lookup response.</p>
