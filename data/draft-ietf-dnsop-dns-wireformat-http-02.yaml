abstract:
- language: en
  script: Latn
  content: "<p>This memo introduces a DNS proxy use case to tunnel DNS query and response
    over HTTPs using DOH, a newly proposed DNS transport. This is useful in some situation
    where DNS is not working properly and DOH is not widely available for many stub-resolvers.</p>"
