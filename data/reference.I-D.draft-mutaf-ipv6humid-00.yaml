abstract:
- language: en
  script: Latn
  content: "<p>This document describes some rules for constructing an IPv6 interface
    identifier from a human name (denoted HUMID). A HUMID-based IPv6 address can augment
    the reachability of a node in some critical scenarios. HUMID-based IPv6 addresses
    are configured using standard stateless address autoconfiguration.</p>"
