abstract:
- language: en
  script: Latn
  content: "<p>Secure Hybrid Wireless Mesh Protocol (SHWMP) for a Wireless Mesh\n   Network (WMN) is a modified version of Hybrid Wireless Mesh Protocol\n   (HWMP) which ensures both end-to-end and point-to-point\n   authentication and integrity by using ID based signature schemes and\n   key agreement schemes.</p>"
