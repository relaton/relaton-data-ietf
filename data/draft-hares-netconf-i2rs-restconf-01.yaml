abstract:
- language: en
  script: Latn
  content: "<p>This document describes two RESTCONF optional capabilities (control
    plane datastore capability, ephemeral state capabilities) that are needed to support
    the I2RS protocol needs. The I2RS protocol requirese an ephemeral control plane
    datastore. as control plane datastores. The purpose of this draft is to kick-start
    the discussions with NETCONF on these two capabilities.</p>"
