  script: Latn
  content: "<p>This document describes an additional RX remote procedure call that
    may be used to obtain the size of an AFS-3 volume dump from an AFS-3 Volume Server
    service with greater flexibility and granularity.  Internet Draft Comments  Comments
    regarding this draft are solicited.  Please include the AFS-3 protocol standardization
    mailing list (afs3-standardization@openafs.org) as a recipient of any comments</p>"
