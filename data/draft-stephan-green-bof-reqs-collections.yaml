abstract:
- language: en
  script: Latn
  content: "<p>This memo extracts and groups requirements from the revisit of\n   operator's requirements made in the last charter refinement work and\n   from the drafts which provided material to the green BoF.  The aim is\n   to determine initial sets of requirements actionable at different\n   levels of the framework.\n\n   Discussion Venues\n\n   The source of this draft and an issue tracker can be found at\n   https://github.com/emile22/green-bof-req-collections</p>"
