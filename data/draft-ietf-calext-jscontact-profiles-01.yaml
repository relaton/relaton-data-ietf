- language: en
  script: Latn
  content: "<p>This document defines JSContact profiles, a named subsets of JSContact
    elements that are supported in context of a contact data exchange protocol or
    other use case. It aims to facilitate using JSContact in contexts where supporting
    all of JSContact semantics is not appropriate.</p>"
