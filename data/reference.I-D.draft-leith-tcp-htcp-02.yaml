abstract:
- language: en
  script: Latn
  content: "<p>Our objective in this document is to renew discussion on how the TCP
    congestion control algorithm might best be modified to improve performance in
    high bandwidth-delay product paths. We focus on changes to the additive increase
    element of the TCP AIMD algorithm.</p>"
