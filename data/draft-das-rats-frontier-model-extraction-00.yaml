abstract:
- language: en
  script: Latn
  content: "<p>As frontier AI providers such as Anthropic and OpenAI expose\n   increasingly rich inference interfaces to partners, evaluators, and\n   enterprise tenants, richer-than-normal outputs -- for example logits,\n   log-probability distributions, embeddings, hidden states,\n   intermediate activations, KV-cache material, and diagnostic state --\n   become practical extraction vectors rather than theoretical concerns.\n   In this document, a \"release\" is any point at which such information\n   leaves a provider's protected execution environment and becomes\n   usable outside it, whether returned directly to a caller, cached,\n   forwarded, or otherwise materialized.  Existing authentication,\n   confidential-computing, and remote-attestation mechanisms can\n   establish important properties of the requester and execution\n   environment, but they do not by themselves establish that each\n   specific release of sensitive model information is currently\n   authorized to cross that protected-to-unprotected boundary.\n\n   This document describes that gap as a pre-effectuation release-\n   control problem.  It presents an execution-finality architecture in\n   which computation is separated from authority to release.  A\n   sensitive result is treated as a Candidate Release, remains non-\n   effective outside the protected domain, and becomes externally\n   available only after release-specific validation, rollback-resistant\n   extraction-state evaluation, bounded authorization, and verification\n   at a controlled Finality Sink.  The document discusses anti-bypass\n   requirements, remote-attestation composition, latency, legacy\n   deployment, industrial relevance, and a concrete model-extraction\n   scenario.\n\n   The mechanism is not claimed to prevent all forms of model\n   distillation.  Its narrower objective is to reduce unauthorized or\n   excessive extraction of privileged model information that can\n   materially improve model stealing, reconstruction, imitation, or\n   distillation.  Because release authority is bound to rollback-\n   resistant, atomically consumed extraction state rather than to a\n   bearer credential, the volume of privileged teacher signal an\n   adversary can accumulate through the governed path is capped by\n   authorized state transitions, not by request volume or attacker\n   persistence alone.</p>"
