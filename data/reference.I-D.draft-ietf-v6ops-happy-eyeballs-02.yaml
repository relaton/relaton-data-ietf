abstract:
- language: en
  script: Latn
  content: "<p>This document describes an algorithm for a dual-stack client to quickly
    determine the functioning address family to a dual-stack server, and trend towards
    using that same address family for subsequent connections.  This improves the
    dual-stack user experience during IPv6 or IPv4 server or network outages.</p>"
