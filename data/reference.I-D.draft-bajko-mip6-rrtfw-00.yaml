abstract:
- language: en
  script: Latn
  content: "<p>This document defines a slightly modified Return Routability Test (RRT)
    for MIPv6 [2]. The new method is firewall friendly and allows a mobile node to
    send Binding Update message to its correspondent node (so that Route Optimization
    can be applied) and ensures that the CN receives the Binding Update, even when
    either the mobile node, the CN, or both are located behind firewalls.</p>"
