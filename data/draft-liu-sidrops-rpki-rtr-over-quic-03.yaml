abstract:
- language: en
  script: Latn
  content: "<p>The Resource Public Key Infrastructure (RPKI) to Router Protocol provides
    a simple but reliable mechanism to receive cryptographically validated RPKI prefix
    origin data and router keys from a trusted cache. RPKI to Router (RTR) Protocol
    can be carried over various transports such as TCP, SSH or else. QUIC provides
    practical and secure semantics for the RTR protocol, particularly fast connection
    establishment and multi-stream carrying, thereby reducing the time required to
    complete RTR data synchronization. This document describes how to use RTR Protocol
    over the QUIC transport protocol, named RTRoQUIC.</p>"
