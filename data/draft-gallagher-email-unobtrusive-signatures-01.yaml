abstract:
- language: en
  script: Latn
  content: <p>This document deals with end-to-end cryptographically signed email.
    It introduces a novel structure for signed email that is designed to avoid creating
    any disturbance in legacy email clients. This "unobtrusive" signature structure
    removes disincentives for signing email.</p>
