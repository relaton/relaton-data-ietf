- language: en
  script: Latn
  content: "<p>This document is a report of implementations based on [IDR-SLA]. [IDR-SLA]
    introduces a new BGP attribute to exchange QoS SLA parameters between BGP peers.
    Current status of the implementation report covers Cisco implementation and an
    inter-operability results between implementations from 2 different Cisco OS.</p>"
