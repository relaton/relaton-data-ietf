- language: en
  script: Latn
  content: "<p>This memo defines SOAP Extensions which implement a basic access authentication
    mechanism and a digest access authentication mechanism for use in request/response
    message exchange patterns. These mechanisms are adaptations of the corresponding
    mechanisms defined in RFC 2617.</p>"
