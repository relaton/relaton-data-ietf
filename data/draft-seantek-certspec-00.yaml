abstract:
- language: en
  script: Latn
  content: "<p>Digital certificates are used in many systems and protocols to identify
    and authenticate parties. This document describes a Uniform Resource Name (URN)
    namespace that identifies certificates. These URNs can be used when certificates
    need to be identified by value or reference. Applications can also use this specification
    in non-URI contexts.</p>"
