abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension to BGP Graceful Restart that
       reduces the negative impact of multiple inter-connected routers
       restarting.  The proposed mechanism does not require any changes to
       the BGP protocol.</p>
