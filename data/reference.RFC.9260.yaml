abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Stream Control Transmission Protocol (SCTP)
    and obsoletes RFC 4960.  It incorporates the specification of the chunk flags
    registry from RFC 6096 and the specification of the I bit of DATA chunks from
    RFC 7053. Therefore, RFCs 6096 and 7053 are also obsoleted by this document. In
    addition, RFCs 4460 and 8540, which describe errata for SCTP, are obsoleted by
    this document.</p>"
- language: en
  script: Latn
  content: "<p>SCTP was originally designed to transport Public Switched Telephone
    Network (PSTN) signaling messages over IP networks. It is also suited to be used
    for other applications, for example, WebRTC.</p>"
- language: en
  script: Latn
  content: "<p>SCTP is a reliable transport protocol operating on top of a connectionless
    packet network, such as IP. It offers the following services to its users:</p>"
- language: en
  script: Latn
  content: "<p>The design of SCTP includes appropriate congestion avoidance behavior
    and resistance to flooding and masquerade attacks.</p>"
