abstract:
- language: en
  script: Latn
  content: "<p>In many scenarios, users must be able to demonstrate the (time) existence,
    integrity and validity of data including signed data for long or undetermined
    period of time. This document specifies XML syntax and processing rules for creating
    evidence for long-term non- repudiation of existence of data. ERS-XML incorporates
    alternative syntax and processing rules to ASN.1 ERS syntax by using XML language.</p>"
