abstract:
- language: en
  script: Latn
  content: "<p>An increasing number of SIP architectures implement multiple path routing
    (MPR), which is the providing of more than one path for a call to reach a destination
    user agent (UA). To implement MPR well, the proxy which forks a request onto the
    redundant paths needs to be able to determine if a fork that failed reached the
    destination UA and was rejected by the UA (and so an alternate path should not
    be tried), or if the fork failed before reaching the UA (and so an alternate path
    should be attempted). In order that the proxy can distinguish these two situations,
    response codes should unambiguously identify which of these situations applies.
    This Internet-Draft begins classifying the current usage of response codes, describes
    their implications for MPR, and suggests possible improvements.</p>"
