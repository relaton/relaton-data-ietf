abstract:
- language: en
  script: Latn
  content: "<p>This document extends the Lightweight Directory Access Protocol (LDAP)
    to support absolute True and False filters based upon similar capabilities found
    in X.500 directory systems.  The document also extends the String Representation
    of LDAP Search Filters to support these filters.  [STANDARDS-TRACK]</p>"
