abstract:
- language: en
  script: Latn
  content: "<p>A common misconception within the Internet community is that internal
    BGP (iBGP) strictly requires a full mesh or alternatives such as Route Reflectors.
    In reality, a full mesh is an architectural design choice driven by route visibility
    needs, rather than a protocol mandate. This document analyzes the historical origins
    of this misunderstanding and clarifies the specific scenarios—multihomed stub
    Autonomous Systems (ASes)— where an iBGP full mesh is unnecessary and operationally
    undesirable.</p>"
