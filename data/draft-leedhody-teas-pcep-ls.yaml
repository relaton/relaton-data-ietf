abstract:
- language: en
  script: Latn
  content: "<p>In order to compute and provide optimal paths, Path Computation Elements
    (PCEs) require an accurate and timely Traffic Engineering Database (TED). Traditionally
    this Link State and TE information has been obtained from a link state routing
    protocol (supporting traffic engineering extensions). This document provides possible
    architectural alternatives for link- state and TE information distribution and
    their potential impacts on PCE, network nodes, routing protocols etc.</p>"
