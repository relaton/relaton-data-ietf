abstract:
- language: en
  script: Latn
  content: "<p>This specification defines Delegated Authorization Tokens, key-bound
    tokens that enable an OAuth client to delegate a constrained subset of its authorization
    to another client without contacting the authorization server for each delegation.
    An authorization server issues the root token and binds it to a client key. That
    client can use the bound key either to prove possession when accessing a protected
    resource or to sign a further token bound to a delegate client's key. Resource
    servers validate the ordered token chain, the restrictions imposed at every delegation
    step, and a DPoP proof signed by the key bound to the leaf token.</p>"
