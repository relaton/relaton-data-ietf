abstract:
- language: en
  script: Latn
  content: "<p>This memo presents an elaboration of the SNMP administrative model
    set forth in [1]. This model provides a unified conceptual basis for administering
    SNMP protocol entities to support: authenticaiton and integrity, privacy, access
    control, and cooperation of protocol entities.  [STANDARDS-TRACK]</p>"
