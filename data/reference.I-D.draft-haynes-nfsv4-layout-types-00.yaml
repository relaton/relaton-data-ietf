abstract:
- language: en
  script: Latn
  content: "<p>This document provides guidelines for identifying the fine line between
    the requirements for Network File System (NFS) version 4.1's Parallel NFS (pNFS)
    and those for the pNFS File Layout.  Implementors trying to specify new Layout
    Types are having difficulty in separating the two sets of requirements.</p>"
