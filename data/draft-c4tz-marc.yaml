abstract:
- language: en
  script: Latn
  content: "<p>This document specifies MARC, a vendor-neutral control and\n   uncertainty-disclosure profile for generative models and agentic\n   systems.  MARC defines a small set of interoperable control metadata,\n   separates pre-decision capability assessment from post-decision\n   answer confidence, identifies the target of confidence disclosures,\n   and defines a bounded primary action set for answering,\n   clarification, retrieval, tool use, additional deliberation,\n   abstention, and escalation.\n\n   MARC does not standardize model internals, training methods, agent\n   discovery, authorization, transport, tool schemas, provenance\n   systems, or claims about machine cognition.  Instead, it defines\n   externally observable semantics that can be implemented by model\n   providers, orchestration layers, evaluation harnesses, API gateways,\n   and user-facing systems.  The goal is to reduce silent failure,\n   unnecessary externalization, and misleading uncertainty communication\n   while improving auditability and interoperability.</p>"
