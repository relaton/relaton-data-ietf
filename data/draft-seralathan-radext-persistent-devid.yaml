abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Chargeable-Device-Identity (CDI) -- a privacy-
    preserving, rotating device correlator carried in existing RADIUS Class attributes
    -- that enables Network Access Control (NAC) systems to maintain device session
    correlation across Media Access Control (MAC) address changes. Modern operating
    systems randomize MAC addresses by default, disrupting RADIUS-based authentication,
    authorization, and accounting workflows that rely on the Calling- Station-Id attribute
    as a persistent device identifier. CDI is modeled after the Chargeable-User-Identity
    (CUI) defined in RFC 4372, providing an analogous device-level correlator with
    explicit privacy controls: epoch-based rotation limits long-term tracking, HMAC
    construction prevents identifier reversal by intermediate systems, and transport
    within the Class attribute ensures immediate deployability on existing infrastructure.
    This document additionally defines a new RADIUS attribute, Persistent-Device-Id,
    for deployments that require explicit device identity semantics beyond what the
    opaque Class attribute can provide. The Class-based CDI mechanism is the RECOMMENDED
    approach for immediate deployment; the dedicated attribute provides a migration
    path for future interoperability.</p>"
