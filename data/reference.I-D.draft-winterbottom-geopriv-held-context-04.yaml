abstract:
- language: en
  script: Latn
  content: "<p>This document describes a protocol extension for the HTTP-Enabled Location
    Delivery (HELD) protocol.  It allows a Target to manage their location information
    on a Location Information Server (LIS) through the application of constraints
    invoked by accessing a location URI.  Constraints described in this memo restrict
    how often location can be accessed through a location URI, how long the URI is
    valid for, and the type of location information returned when a location URI is
    accessed.  Extension points are also provided.</p>"
