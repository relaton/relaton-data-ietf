abstract:
- language: en
  script: Latn
  content: "<p>This contribution addresses the service providers requirements to support
    Cloud services interworking with the existing MPLS-based L2 and L3 VPN services.
    Maintenance of virtual separation of the traffic, data, and queries must be supported
    for the VPN customers that are conscious of end-to-end security features and functions
    that VPN technologies provide today.</p>"
