abstract:
- language: en
  script: Latn
  content: "<p>This document describes the details of the interoperability test of
    the Forward and Control Element Separation (ForCES) protocol that will take place
    in the University of Patras in Rio, Greece, in the third week of July 2009.  This
    informational draft provides necessary information, for all parties who wish to
    participate in the interoperability test.</p>"
