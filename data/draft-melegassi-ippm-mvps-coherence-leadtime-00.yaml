abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Coherence Lead-Time Profile for the Multi-
    Vantage Path Synchrony (MVPS) framework [I-D.melegassi-ippm-mvps-bundle]. It states
    three LEMMAS (L_ZD.1', L_ZD.2', L_ZD.3) that bound, in closed form, the expected
    lead-time of the multi-vantage Mahalanobis detector D^2 over the per-vantage max-z
    detector under three canonical signal regimes: linear growth, exponential (worm-style)
    growth, and the degenerate sparse-direction case in which the multi-vantage detector
    loses its advantage. The operational claim is the closed form</p>"
