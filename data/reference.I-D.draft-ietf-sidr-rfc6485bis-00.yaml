abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the algorithms, algorithms' parameters, asymmetric
    key formats, asymmetric key size and signature format for the Resource Public
    Key Infrastructure subscribers that generate digital signatures on certificates,
    Certificate Revocation Lists, and signed objects as well as for the Relying Parties
    (RPs) that verify these digital signatures.</p>"
