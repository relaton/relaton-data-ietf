abstract:
- language: en
  script: Latn
  content: "<p>This document will capture VoIP use case for SIP Peering. It is a consolidation
    of Speermint use cases drafts. This document depicts many common VoIP peering
    use cases. These use cases are categorized into three types: Direct, Indirect
    and Assisted. They are not the exhaust set of use cases but the most common use
    cases deployed in production today. This document captures them to provide a reference.</p>"
