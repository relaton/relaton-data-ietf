title:
- language: en
  script: Latn
  content: Path Computation Element Communication Protocol (PCEP) Extensions for Native
    IP Networks
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-pce-pcep-extension-native-ip-40
