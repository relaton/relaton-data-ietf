date:
- type: published
  at: '2024-09-10'
abstract:
- language: en
  script: Latn
  content: "<p>This document introduces extensions to the PCE Communication Protocol
    (PCEP) to support path computation in native IP networks through a PCE-based central
    control mechanism known as Centralized Control Dynamic Routing (CCDR). These extensions
    empower a PCE to calculate and manage paths specifically for native IP networks,
    expand PCEP’s capabilities beyond its traditional use in MPLS and GMPLS networks.
    By implementing these extensions, IP network resources can be utilized more efficiently,
    facilitating the deployment of traffic engineering in native IP environments.</p>"
  format: text/html
