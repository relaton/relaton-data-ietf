abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Session Initiation Protocol Uniform Resource
    Identifier (SIP URI) advertisement for DNS-based Service Discovery (DNS-SD). Using
    this mechanism, a SIP user agent (UA) can communicate with another UA even when
    no SIP registrar is available, as in a wireless ad-hoc network for example.</p>"
