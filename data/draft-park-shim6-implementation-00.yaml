- language: en
  script: Latn
  content: |-
    <p>The SHIM6 protocol is a conceptual sublayer (hereafter "shim") for
       providing multihoming.  This document reports the current status of
       the implementation for the shim6 protocol.  The implementation is
       done on a IPv6-enabled Linux machine.</p>
