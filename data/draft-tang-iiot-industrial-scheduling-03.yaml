abstract:
- language: en
  script: Latn
  content: "<p>This document describes the multipriority scheduling technology for
    the interconnection between industrial field and cloud data in the application
    of 5G communication. The technology includes spectrum resource scheduling based
    on 5G slice in the process of accessing industrial data and task collaborative
    scheduling based on edge computing.</p>"
