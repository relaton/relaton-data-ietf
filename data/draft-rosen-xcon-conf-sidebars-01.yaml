- language: en
  script: Latn
  content: "<p>This document discusses the creation, management of operation of sub-conferences
    in a centralized conferencing architecture, also known as 'sidebars'. This work
    uses the SIP Conferencing Framework and builds on the descriptions of sub-conferences
    in that document. Examples of SIP and XCON protocols are given.</p>"
