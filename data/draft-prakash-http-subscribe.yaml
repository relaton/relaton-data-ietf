abstract:
- language: en
  script: Latn
  content: "<p>This document defines the HTTP SUBSCRIBE request method. The SUBSCRIBE
    method allows a client to establish a long-lived, safe connection to a resource
    to receive real-time updates and event streams. It enables servers to push data
    to clients using standard HTTP structures (such as HTTP/2 or HTTP/3 streams) while
    supporting a request body for subscription parameters, avoiding the protocol-
    switching overhead of WebSockets and the URL limitations of Server- Sent Events
    (SSE) via GET.</p>"
