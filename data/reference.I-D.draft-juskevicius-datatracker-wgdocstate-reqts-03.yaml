abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for new functionality to be added
    to the Datatracker tool to make it possible for IETF working group Chairs and/or
    their delegates to indicate the status of working group documents.  The functions
    to be added will enable IETF Chairs and others to more easily follow the progression
    of working group documents from their earliest stages and increase the amount
    of information available to all IETF participants about the status of working
    group Internet-Drafts.</p>"
