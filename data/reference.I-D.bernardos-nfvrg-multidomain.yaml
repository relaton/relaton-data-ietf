abstract:
- language: en
  script: Latn
  content: "<p>This document analyzes the problem of multi-provider multi-domain orchestration,
    by first scoping the problem, then looking into potential architectural approaches,
    and finally describing the solutions being developed by the European 5GEx and
    5G-TRANSFORMER projects.</p>"
