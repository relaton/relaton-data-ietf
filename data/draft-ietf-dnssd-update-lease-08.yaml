  script: Latn
  content: "<p>This document describes an EDNS(0) option that can be used by DNS Update
    requestors and DNS servers to include a lease lifetime in a DNS Update or response,
    allowing a server to garbage collect stale resource records that have been added
    by DNS Updates</p>"
