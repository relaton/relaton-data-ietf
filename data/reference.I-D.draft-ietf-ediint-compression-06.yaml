abstract:
- language: en
  script: Latn
  content: "<p>The intent of this document is to be placed on the RFC track as an
    Informational RFC. The EDIINT AS1 and AS2 message formats don't currently contain
    any transport neutral provisions for compressing data when utilizing S/MIME as
    the secure packaging standard. Compressing data before transmission provides a
    number of advantages including 1. reducing data redundancy, and so reducing opportunities
    for attacks exploiting redundancy, and 2. reducing the amount of data and so speeding
    up cryptographic processing such as signing, encryption, archiving, and 3. reducing
    the overall transmitted message size, reducing both time and bandwidth needed
    for transport.</p>"
