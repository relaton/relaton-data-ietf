abstract:
- language: en
  script: Latn
  content: "<p>This document updates IANA registries defined in RFC4255, which defines
    a DNS resource record - SSHFP that contains a standard SSH key fingerprint used
    to verify Secure Shell (SSH) host keys using Domain Name System Security (DNSSEC).
    \ This document defines additional options supporting Secure Shell (SSH) public
    keys using the Elliptic Curve Digital Signature Algorithm (ECDSA) and the use
    of fingerprints computed using the SHA-256 message digest algorithm in SSHFP resource
    records (SSHFP RR).</p>"
