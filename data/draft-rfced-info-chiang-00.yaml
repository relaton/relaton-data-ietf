- language: en
  script: Latn
  content: "<p>This memo describes the Data Link Switching Remote Access Protocol
    that is used between workstations and routers to transport SNA/ NetBIOS traffic
    over TCP sessions. This memo provides information for the Internet community.
    This memo does not specify an Internet standard of any kind.</p>"
