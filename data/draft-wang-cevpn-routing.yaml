- language: en
  script: Latn
  content: "<p>When IPsec tunneling is used to provide VPN connection, it is important
    to support site-to-site customer network routing. This document describes the
    scenario, requirement, and several potential solutions to provide customer network
    (intranet) routing support for IPsec-based VPNs.</p>"
