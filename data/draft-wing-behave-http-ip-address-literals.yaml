abstract:
- language: en
  script: Latn
  content: "<p>A small percentage of HTTP URIs contain an IPv4 address literal as\nthe hostname which is not accessible to IPv6-only HTTP clients using\nan IPv6/IPv4 translator and DNS64.  This document proposes a\nworkaround for this problem using an HTTP proxy to handle that\ntraffic.</p>"
