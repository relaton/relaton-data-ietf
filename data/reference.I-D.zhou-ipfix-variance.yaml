- language: en
  script: Latn
  content: "<p>This document proposes several new Information Elements for the IP
    Flow Information Export (IPFIX) protocol, which are used to export variance information
    about the flow, regarding the sizes of the packets sampled. This kind of information
    is helpful to form a statistical view of the flow.</p>"
