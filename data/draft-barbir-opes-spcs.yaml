- language: en
  script: Latn
  content: "<p>This document provides the requirements for implementing a Framework
    \nfor Service Personalization (FSP) in OPES intermediaries. This \ndocument provides
    a summary of modifications and required protocols \nthat need to be supported
    by OPES intermediaries in order to allow \nfor the development, deployment, and
    execution of a Service \nPersonalization (SP) call-out server.</p>"
