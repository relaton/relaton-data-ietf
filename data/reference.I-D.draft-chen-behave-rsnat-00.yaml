abstract:
- language: en
  script: Latn
  content: "<p>For the rapid exhaustion of IPv4 address pool against the slow development
    of IPv6, IPv4/6 coexistence/transition proved to be a long period.  In the IPv4/6
    transition process, there are many NAT- like technologies existing in the internet.
    \ However the NAT boxes such as IPv4 NAT, IPv4/6 NAT are so poor in their reliability
    and scalability, which put a severe threat on the development of IPv4/6 Transition.
    \ This document defines a reliable and scalable NAT(RS- NAT)mechanism to solve
    the problem.</p>"
