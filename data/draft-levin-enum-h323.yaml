abstract:
- language: en
  script: Latn
  content: "<p>The H.323 specification [2] defines a means for building multimedia
    \ncommunication services over an arbitrary Packet Based Network, \nincluding the
    Internet. This document registers an ENUM service for \nH.323 according to specifications
    and guidelines in RFC2916bis [3].</p>"
