abstract:
- language: en
  script: Latn
  content: "<p>The address selection mechanisms have been suggested under the circumstance
    occurring link failure already. But this draft proposes various considerations
    to address selection such as load sharing without presenting address selection
    mechanism clearly. The goal of this document is merely referred various situation
    that have to consider when we make out address selection mechanism in the context
    of load sharing.</p>"
