abstract:
- language: en
  script: Latn
  content: "<p>The General Internet Signaling Transport (GIST) protocol currently
    uses TCP or TLS over TCP for connection mode operation.  This document describes
    the usage of GIST over the Stream Control Transmission Protocol (SCTP) and Datagram
    Transport Layer Security (DTLS).  The use of SCTP can take advantage of features
    provided by SCTP, namely streaming-based transport, support of multiple streams
    to avoid head of line blocking, the support of multi-homing to provide network
    level fault tolerance, as well as partial reliability extension for partially
    reliable data transmission.  This document also specifies how to establish GIST
    security over datagram transport protocols using an extension to DTLS.</p>"
