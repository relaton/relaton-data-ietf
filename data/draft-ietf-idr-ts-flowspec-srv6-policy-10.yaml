abstract:
- language: en
  script: Latn
  content: "<p>BGP Flow Specification version 1 (FSv1), defined in [RFC8955], [RFC8956]
    and [RFC9117] has been proposed to distribute BGP [RFC4271] FlowSpec NLRI to FlowSpec
    clients to mitigate (distributed) denial- of-service attacks, and to provide traffic
    filtering in the context of a BGP/MPLS VPN service. Recently, traffic steering
    applications in the context of SR-MPLS and SRv6 using FlowSpec are being used
    in networks. This document introduces the usage of BGP FSv1 to steer packets into
    an SR Policy.</p>"
