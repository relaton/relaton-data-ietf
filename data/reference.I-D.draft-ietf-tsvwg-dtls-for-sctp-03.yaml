abstract:
- language: en
  script: Latn
  content: "<p>This document describes the usage of the Datagram Transport Layer Security
    (DTLS) protocol over the Stream Control Transmission Protocol (SCTP).  Security
    features provided by DTLS over SCTP include authentication, message integrity
    and privacy of user messages.  Applications using DTLS over SCTP can use almost
    all transport features provided by SCTP and its extensions.</p>"
