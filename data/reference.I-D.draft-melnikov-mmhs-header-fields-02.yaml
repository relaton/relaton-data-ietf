abstract:
- language: en
  script: Latn
  content: "<p>A Miltary Message Handling System (MMHS) processes formal messages
    ensuring release, distribution, security, and timely delivery across national
    and international strategic and tactical networks.  The MMHS Elements of Service
    are defined as a set of extensions to the ITU-T X.400 (1992) international standards
    and are specified in STANAG 4406 Edition 2.  This document describes a method
    for enabling those MMHS Elements of Service that are defined as Heading Extension
    to be encoded as RFC 5322 (Internet Email) message header fields.  These header
    field definitions support the provision of a STANAG 4406 MMHS over Internet Email,
    and also provides for a STANAG 4406 / Internet Email Gateway supporting message
    conversion compliant to this specification.</p>"
