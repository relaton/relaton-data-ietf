abstract:
- language: en
  script: Latn
  content: "<p>Proxy Mobile IPv6 is a network-based mobility protocol which provides
    IP mobility for a regular IPv6 mobile node without the involvement of the IPv6
    host.  This document specify an enhancement to enable Proxy MIPv6 protocol to
    support a transient proxy care-of address registration.  This process allows the
    target mobile access gateway to request the local mobility anchor which host the
    mobile node binding cache entry to register a transient proxy care-of address
    and the direction of the associated traffic to enable the LMA to receive uplink
    traffic from two different proxy care-of addresses at the same time during the
    mobile node inter-MAG active handoff.</p>"
