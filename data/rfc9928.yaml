abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism for networks with legacy IPv4-only
    clients to use services provided by DHCPv4 over DHCPv6 in a Relay Agent.  RFC
    7341 specifies the use of DHCPv4 over DHCPv6 in the client only.  This document
    specifies an approach based on RFC 7341 that allows a Relay Agent to implement
    the DHCPv4-over-DHCPv6 encapsulation and decapsulation of DHCPv4 messages in DHCPv6
    messages on behalf of a DHCPv4 client.</p>"
