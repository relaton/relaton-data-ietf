abstract:
- language: en
  script: Latn
  content: "<p>This document describes a cryptographic transform which uses a keystream
    generator (which can generate keystream segments in arbitrary order) and a universal
    hash function to provide both confidentiality, message authentication, and replay
    protection. This transform is efficient, provably secure, and is appropriate for
    network security.</p>"
