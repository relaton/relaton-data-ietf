abstract:
- language: en
  script: Latn
  content: "<p>This document supplements RFC 3279. It specifies algorithm identifiers
    and ASN.1 encoding rules for the Digital Signature Algorithm (DSA) and Elliptic
    Curve Digital Signature Algorithm (ECDSA) digital signatures when using SHA-224,
    SHA-256, SHA-384 or SHA- 512 as hashing algorithm. This specification applies
    to the Internet X.509 Public Key Infrastructure (PKI) when digital signatures
    are used to sign certificates and certificate revocation lists (CRLs).</p>"
