abstract:
- language: en
  script: Latn
  content: "<p>The Sensor Measurement Lists (SenML) media type supports multiple types
    of values, from numbers to text strings and arbitrary binary data values. In order
    to simplify processing of the data values this document proposes to specify a
    new SenML field for indicating the Content-Format of the data.</p>"
