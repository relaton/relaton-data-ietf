abstract:
- language: en
  script: Latn
  content: "<p>Flowspec, an extension to BGP, enables the dissemination of traffic\n   flow specification rules and can be used to steer traffic into SR\n   Policy.  However, existing approaches using Flowspec to direct\n   traffic into a SR Policy have certain drawbacks (for details, refer\n   to section 1).\n\n   This document difines two new standard actions for the BGP Flowspec\n   V2 protocol (FSv2) [I-D.ietf-idr-flowspec-v2]: Redirect to SR Policy\n   Action and SRv6 SID Action.  The former allows traffic to be directed\n   to a designated SR Policy, while the latter allows for the\n   encapsulation of an additional SRv6 SID as required during\n   redirection.\n\n   The Redirect to SR Policy Action can be used independently or in\n   conjunction with the SRv6 SID Action, depending on the application\n   scenario.  Additionally, the SRv6 SID Action can be used together\n   with other actions defined in FSv2, such as Redirect to IPv6.</p>"
