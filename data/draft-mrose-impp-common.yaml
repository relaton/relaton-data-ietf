- language: en
  script: Latn
  content: "<p>This memo describes a common set of Instant Messaging formats and services,
    independent of underlying IM infrastructure. The profile meets the requirements
    specified in RFC 2779 using a minimalist approach allowing interoperation of a
    wide range of IM systems.</p>"
