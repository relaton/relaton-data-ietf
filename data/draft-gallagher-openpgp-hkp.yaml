abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a series of conventions to implement an OpenPGP
    keyserver using the Hypertext Transfer Protocol (HTTP). As this document is a
    codification and extension of a protocol that is already in wide use, strict attention
    is paid to backward compatibility with these existing implementations.</p>"
