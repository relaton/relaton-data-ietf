abstract:
- language: en
  script: Latn
  content: "<p>Source Address Validation in Inter-domain Networks (Inter-domain SAVNET)
    focuses on narrowing the technical gaps of existing source address validation
    (SAV) mechanisms in inter-domain scenarios. This document provides a gap analysis
    of existing SAV efforts, describes the problem statement based on the analysis
    results, and concludes the requirements for improving inter-domain SAV.</p>"
