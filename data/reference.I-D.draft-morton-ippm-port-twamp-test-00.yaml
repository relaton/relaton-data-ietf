abstract:
- language: en
  script: Latn
  content: "<p>This memo describes new well-known port assignments for the OWAMP and
    TWAMP protocols for control and measurement, and clarifies the meaning and composition
    of these standards track protocol names for the industry.  The memo updates RFC
    4656 and RFC 5357, in terms of the UDP well- known port assignments.</p>"
