abstract:
- language: en
  script: Latn
  content: "<p>This memo aims to highlight specific residual threats in the Mobile
    IPv6 design.  These threats are inherited in the design of new mechanisms built
    on top of the mobility protocol, and are raising concerns regarding the amplitude
    of their potential impacts.</p>"
