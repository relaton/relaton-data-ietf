abstract:
- language: en
  script: Latn
  content: "<p>IOAM pre-allocated trace option data fields can be encapsulated in
    the IPv6 Hop-by-Hop (HbH) Options header as described in RFC 9486. However, due
    to the potentially large size of the trace data and the location of the HbH Options
    header in the IPv6 packet, this scheme creates practical challenges for implementation,
    especially when other extension headers, such as a routing header, are also present
    and require on-path processing. In addition to IOAM Direct Export (DEX), this
    document proposes two alternative approaches to address this challenge: separating
    the IOAM incremental trace data from the IOAM instruction header, or applying
    the segment IOAM trace data export scheme, depending on the network scenario and
    application requirements. We discuss the pros and cons of each approach.</p>"
  format: text/html
