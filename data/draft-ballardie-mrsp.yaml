abstract:
- language: en
  script: Latn
  content: "<p>MRSP is a layer 2 protocol that runs over Ethernet. Together with minor
    enhancements to PIM-SM [PIM] and PIM-SSM [SSM] it can be used to build uni-directional
    multicast forwarding state in Ethernet Switches that interconnect IP multicast
    routers.</p>"
