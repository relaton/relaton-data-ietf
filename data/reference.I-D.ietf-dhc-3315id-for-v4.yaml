abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the format that is to be used for encoding
    DHCPv4 client identifiers, so that those identifiers will be inter- changeable
    with identifiers used in the DHCPv6 protocol. This document also addresses and
    corrects some problems in RFC2131 and RFC2132 with respect to the handling of
    DHCP client identifiers.</p>"
