abstract:
- language: en
  script: Latn
  content: "<p>Autonomous System Provider Authorization (ASPA) is very helpful in
    detecting and mitigating route leaks (valley-free violations) and a majority of
    forged-origin hijacks. This document does an analysis on ASPA-based AS_PATH verification
    to help people understand its strengths and deficiencies. The document can help
    people deploy ASPA properly and provide some potential directions of enhancing
    ASPA.</p>"
