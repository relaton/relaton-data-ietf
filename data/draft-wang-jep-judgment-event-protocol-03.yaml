abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Judgment Event Protocol (JEP), a minimal,
       verifiable format for logging judgment-related actions in distributed
       systems. It defines four immutable event verbs (J, D, T, V), a signed
       JSON event structure with replay protection, and standardized
       signature verification rules. The protocol is designed to be
       interoperable across platforms and autonomous agents. A set of
       optional, standard extensions are defined to enhance privacy,
       distribute responsibility, respect data lifecycles, and ensure data
       sovereignty, making the protocol adaptable to diverse legal and
       cultural contexts.</p>
