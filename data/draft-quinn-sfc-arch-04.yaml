abstract:
- language: en
  script: Latn
  content: "<p>This document describes an architecture used for the creation of Service
    Function Chains (SFC). It includes architectural concepts, principles, and components
    used in the construction of composite services through deployment of SFCs in a
    network. This document does not propose solutions, protocols, or extensions to
    existing protocols.</p>"
