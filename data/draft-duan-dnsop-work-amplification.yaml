abstract:
- language: en
  script: Latn
  content: '<p>Recursive DNS resolvers are expected to bound the amount of "work"
    performed when answering a client query. DNS specifications discuss such bounds
    but leave key concepts, accounting rules, and safe limits underspecified. This
    leeway has led to divergent implementations and makes systematic bounding difficult,
    contributing to denial-of-service attacks that amplify resolver work and harm
    different DNS components. This document describes the problem space of DNS work
    amplification. It defines terminology for discussing work performed during a single
    resolution instance, develops a taxonomy of work-amplification vulnerabilities
    along resource and mechanism axes, and analyses where existing DNS specifications
    leave amplification-relevant behavior underspecified. The document is descriptive:
    it does not itself specify protocol changes or operational requirements.</p>'
