abstract:
- language: en
  script: Latn
  content: "<p>This draft describes layer-3 accessible EVPN service interfaces according
    to [RFC7432], and proposes a new solution which can simplify the deployment of
    layer-3 accessible EVPN service. This solution allows each PE in EVPN network
    to maintain only one IP-VRF.</p>"
