abstract:
- language: en
  script: Latn
  content: "<p>The Label Distribution Protocol (LDP) specification for the Wildcard
    FEC element has several limitations.  This document addresses those limitations
    by defining a Typed Wildcard FEC element and associated procedures. In addition,
    it defines a new LDP capability to address backward compatibility.</p>"
