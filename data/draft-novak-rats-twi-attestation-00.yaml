abstract:
- language: en
  script: Latn
  content: "<p>Trustworthy Workloads are workloads that operate in environments that
    provide isolation of data in use. This document describes how Trustworthy Workloads
    can acquire credentials containing stable identifiers, upon proving the trust
    in the environments in which they operate via Remote Attestation.</p>"
