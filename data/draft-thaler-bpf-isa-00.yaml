abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies version 1.0 of the eBPF instruction set.

       The eBPF instruction set consists of eleven 64 bit registers, a
       program counter, and an implementation-specific amount (e.g., 512
       bytes) of stack space.</p>
