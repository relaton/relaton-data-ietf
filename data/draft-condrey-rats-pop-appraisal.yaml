abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the forensic appraisal methodology and\n   quantitative security model for the Proof of Process (PoP) framework.\n   It defines how Verifiers evaluate behavioral entropy, perform\n   liveness detection, and calculate forgery cost bounds.  Additionally,\n   it establishes the taxonomy for Absence Proofs and the Writers\n   Authenticity Report (WAR) format, as well as the Tool Receipt\n   protocol for artificial intelligence (AI) attribution within the\n   linear human authoring process.</p>"
