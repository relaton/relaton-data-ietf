abstract:
- language: en
  script: Latn
  content: |-
    <p>AI inference environments dynamically load, transform, configure,
       and execute model artifacts across heterogeneous software and
       hardware trust domains.  Independent measurements of model artifacts
       and inference runtimes do not establish that a particular model
       representation was admitted into a particular runtime instance or
       maintained within the execution environment.

       This document specifies a Remote ATtestation procedureS (RATS)
       profile for cryptographically protected evidence of AI inference
       model admission and runtime binding.

       The profile defines an information model and processing requirements
       for identifying source model artifacts, recording transformation
       provenance, measuring admitted model representations, identifying
       inference-runtime instances, and establishing a protected association
       between admitted representations and execution environments.

       The profile builds on the RATS architecture, the Entity Attestation
       Token (EAT), and the EAT measured-component information model.  It
       defines requirements for model identity, transformation continuity,
       admission events, runtime identity, evidence protection, freshness,
       and verifier appraisal.

       The resulting evidence enables a Verifier to evaluate whether an
       identified model representation was admitted into an identified
       inference-runtime instance within the declared attestation boundary.</p>
