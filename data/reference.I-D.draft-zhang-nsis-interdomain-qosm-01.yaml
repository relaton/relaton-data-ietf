abstract:
- language: en
  script: Latn
  content: "<p>This document describes a NSIS QoS Model for inter-domain signaling
    (InterDomain-QOSM) between adjacent domains to enable end-to-end QoS provisioning
    over heterogeneous network domains. Specifically, it assumes a distinct separation
    between the intra-domain control plane and the inter-domain control plane at each
    administrative domain and is intended to implement a common inter-domain interface
    that allows the QoS negotiation and setup of inter-domain traffic streams while
    hiding the heterogeneity of intra-domain control mechanisms in use in a chain
    of heterogeneous network domains. The InterDomain-QoSM in this document first
    describes its operation mode and then the additional QSPEC parameters for fulfilling
    the common inter-domain interface are specified, followed by the illustrations
    of how the InterDomain-QOSM interacts with some typical intra-domain QoS models
    to achieve the end-to-end QoS provisioning over heterogeneous domains in a standardized
    and dynamic way.</p>"
