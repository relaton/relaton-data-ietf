abstract:
- language: en
  script: Latn
  content: "<p>Flow-based measurement is currently a popular method for traffic monitoring.
    \ To construct a measurement system, an IPFIX mediation device (IPFIX Mediator),
    which reroutes, filters, aggregates, or modifies Flow information, may help scalability
    and several other purposes.  This document describes the applicability of an IPFIX
    Mediator and the problems that the IPFIX Mediator might encounter.</p>"
