abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new SRv6 Endpoint behavior which can be used
    to associate with a set of network resource partition (e.g. bandwidth, buffer
    and queue resources ) Programming, called End.NRP. By using the End.NRP SID to
    build its segment list, the SRv6 policy has the capability to program network
    resources and achieve strict SLA guarantees.</p>"
