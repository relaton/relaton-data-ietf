title:
- language: en
  script: Latn
  content: The Generalized Object Encoding (GOE) Approach for the Forward Erasure Correction (FEC) Protection of Objects and its Application to Reed- Solomon Codes over GF(2^^8)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-roca-rmt-goe-fec-02
