abstract:
- language: en
  script: Latn
  content: "<p>This document describes the problem space and roadmap for monitoring
    BGP Flow Specification (FlowSpec) deployments. It outlines the operational motivation
    for FlowSpec monitoring, identifies representative classes of monitoring information,
    and positions relevant work on FlowSpec, the BGP Monitoring Protocol (BMP), IP
    Flow Information Export (IPFIX), and YANG-based operational state within a common
    framework. The resulting roadmap provides common context for related protocol-specific
    work in the relevant IETF working groups.</p>"
