abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the did7:web7 Decentralized Identifier (DID)
       method, which defines a deterministic mapping from Uniform Resource
       Names (URNs) (RFC 8141) into a DID-compatible identifier format
       called a Decentralized Universal Resource Name (URN).  The did7:web7
       method preserves URN semantics, enables DID resolution without
       mandatory centralized infrastructure, and provides optional
       cryptographic and service-layer extensibility.  The method is fully
       compatible with the W3C DID Core specification (W3C DID Core, 2022)
       and the broader DID ecosystem.</p>
