abstract:
- language: en
  script: Latn
  content: "<p>There are a number of different methods by which an RFC can be published
    in addition to the regular submissions from a working group. This note discusses
    the publication of RFCs by finding a sponsoring Area Director to take it through
    IETF and Internet Engineering Steering Group (IESG) review. This note covers both
    the the processing in the IESG as well as guidance on when such sponsoring is
    appropriate.</p>"
