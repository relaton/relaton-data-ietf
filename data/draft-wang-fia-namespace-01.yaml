- language: en
  script: Latn
  content: "<p>This document presents the architecture and implementation of an open
    and flexible namespace resolution mechanism to be used with Future Internet Architectures.
    This resolution mechanism allows the resolution of different network entities
    and can be adapted to the needs of network, application and service providers
    alike.</p>"
