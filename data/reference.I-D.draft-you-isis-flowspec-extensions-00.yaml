abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the use cases why IS-IS distributing flow specification
    (FlowSpec) routes is necessary.  One advantage is to mitigate the impacts of Denial-of-Service
    (DoS) attacks.  This document also defines a new IS-IS FlowSpec reachability TLV
    encoding format that can be used to distribute the FlowSpec routes.</p>"
