abstract:
- language: en
  script: Latn
  content: "<p>OAuth 2.0 access tokens encode an authorization decision made at\n   issuance time.  Sender-constraining mechanisms such as Mutual-TLS\n   certificate binding ([RFC8705]) and Demonstrating Proof of Possession\n   ([RFC9449]) extend this model by proving key possession at request\n   time, but neither mechanism re-evaluates the full security context —\n   certificate validity, token claims, and device-level security posture\n   — against the conditions present at token issuance, nor provides a\n   normative pathway for graduated least-privilege outcomes when that\n   context has degraded.\n\n   This document describes the Authorization Posture Mechanism (APM)\n   problem domain: the gap between what per-request sender-constraining\n   mechanisms prove cryptographically and what Zero Trust Architecture\n   requires for per-request authorization decisions.  It motivates and\n   specifies requirements for a mechanism that (a) assembles a per-\n   request Consistency View comprising the client certificate, the bound\n   access token, and an integrity-protected device-posture signal; (b)\n   evaluates the Consistency View against the Issuance Posture recorded\n   at token issuance; and (c) produces graduated, least-privilege\n   outcomes — scope reduction, method restriction, or full denial —\n   proportional to the degree of posture degradation detected.</p>"
