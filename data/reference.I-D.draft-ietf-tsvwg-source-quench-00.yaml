- language: en
  script: Latn
  content: <p>This document formally deprecates the use of ICMP Source Quench messages
    by transport protocols, formally updating RFC 792, RFC 1122, and RFC 1812.  Additionally,
    it requests that the status of RFC 1016 be changed to "Historic".</p>
