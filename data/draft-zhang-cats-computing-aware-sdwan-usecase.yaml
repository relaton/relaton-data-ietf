abstract:
- language: en
  script: Latn
  content: "<p>SD-WAN is aware of the computing power of applications deployed in
    the multiple sites of enterprise and can perform the routing policy according
    to such information. This is defined as the computing- aware SD-WAN.This document
    describes the use cases for computing- aware Software-Defined Wide Area Network(SD-WAN).</p>"
