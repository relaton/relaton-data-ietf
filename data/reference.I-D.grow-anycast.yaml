abstract:
- language: en
  script: Latn
  content: "<p>As the Internet has grown, and as systems and networked services within
    enterprises have been more pervasive, many services with high availability requirements
    have emerged. These requirements have increased the demands on the reliability
    of the infrastructure on which those services rely. Various techniques have been
    employed to increase the availability of services deployed on the Internet. This
    document presents a series of recommendations for distribution of services using
    anycast.</p>"
