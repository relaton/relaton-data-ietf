- language: en
  script: Latn
  content: "<p>SMTP mail software adds trace header fields to messages as they pass
    through the mail system.  This document updates the definition of trace header
    fields, and adds trace field information to the registries for Permanent Message
    Header Fields and Provisional Message Header Fields.</p>"
