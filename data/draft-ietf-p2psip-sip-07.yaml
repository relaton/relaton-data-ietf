abstract:
- language: en
  script: Latn
  content: "<p>This document defines a SIP Usage for REsource LOcation And Discovery
    (RELOAD), The SIP Usage provides the functionality of a SIP proxy or registrar
    in a fully-distributed system. The SIP Usage provides lookup service for AoRs
    stored in the overlay. The SIP Usage also defines GRUUs that allow the registrations
    to map an AoR to a specific node reachable through the overlay. The AppAttach
    method is used to establish a direct connection between nodes through which SIP
    messages are exchanged.</p>"
