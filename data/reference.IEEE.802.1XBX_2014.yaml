abstract:
- language: en
  script: Latn
  content: "<p>Media Access Control security (MACsec) Key Agreement protocol (MKA)
    data elements and procedures that provide additional security and manageability
    capabilities, including the ability to maintain secure communication while the
    operation of MKA is suspended, when used in conjunction with MACsec Cipher Suites
    that support Extended Packet Numbering are added in this amendment.</p>"
