abstract:
- language: en
  script: Latn
  content: "<p>To consider the Labeled NFS work for addition to the NFSv4 working
    group charter the working group has requested an impact study be drafted for the
    security label extensions to NFSv4 and the RPC layer. This document describes
    the impact, usecases, customers, and scope of the work to be performed.</p>"
