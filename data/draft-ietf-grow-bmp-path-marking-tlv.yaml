abstract:
- language: en
  script: Latn
  content: |-
    <p>The BGP Monitoring Protocol (BMP) provides an interface for obtaining
       BGP path information, which is conveyed through BMP Route Monitoring
       (RM) messages.  This document specifies a BMP extension to convey the
       status of a path after being processed by the BGP process.</p>
