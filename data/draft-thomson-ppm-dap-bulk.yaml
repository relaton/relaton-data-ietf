  content: |-
    <p>A bulk report submission endpoint and format are described for the
       Distributed Aggregation Protocol (DAP).  This provides modest, but
       meaningful, efficiency benefits over the core protocol for cases
       where an intermediary is able to collect large numbers of reports.</p>
