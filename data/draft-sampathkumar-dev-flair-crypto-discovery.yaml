abstract:
- language: en
  script: Latn
  content: "<p>This document introduces FLAIR (Framework for Language-Agnostic\n   Intermediate Representation), a novel approach to discover\n   cryptographic elements in source code.  By detecting encryption\n   components present in code, FLAIR addresses critical challenges like\n   identifying deprecated and misconfigured implementations across\n   diverse programming languages.  Unlike language-specific tools, FLAIR\n   employs semantic graphs to represent instances of encryption\n   detected, enabling identification of cryptographic algorithm usage,\n   associated parameters (keys, nonces, salts), and flag compliance\n   status with established encryption standards.  The semantic graph\n   approach makes representing cryptographic algorithms and related\n   elements independent of the underlying programming language.</p>"
