  script: Latn
  content: "<p>This specification describes a service to locate OpenPGP and LibrePGP
    keys by mail address using a Web service and the HTTPS protocol. It also provides
    a method for secure communication between the key owner and the mail provider
    to publish and revoke the public key.</p>"
