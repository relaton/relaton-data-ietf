abstract:
- language: en
  script: Latn
  content: "<p>This document defines the INVOKE method, which describes a mechanism
    by which a UA can invoke a well-defined action on a remote UA.  These actions
    are represented by well-defined URNs that must be registered with IANA.  It also
    provides a mechanism that allows the INVOKE issuer to be notified of the outcome
    of the invoked action. Furthermore, It allows the INVOKE issuer to keep the dialog
    established with the INVOKE recipient open, to allow both sides to exchange application
    specific information.  This document also defines the 'invoke' event package and
    the Action, Subscribe-Type and Action-Progress request headers.</p>"
