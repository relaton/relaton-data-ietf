abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism to allow a system to originate\nmore than 256 LSP fragments, a limit set by the original Intermediate\nSystem to Intermediate System (IS-IS) Routing protocol, as described\nin ISO 10589.  This mechanism can be used in IP-only, OSI-only, and\ndual routers.</p>"
