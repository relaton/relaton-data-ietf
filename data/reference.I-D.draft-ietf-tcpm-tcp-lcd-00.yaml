abstract:
- language: en
  script: Latn
  content: "<p>Disruptions in end-to-end path connectivity, which last longer than
    one retransmission timeout cause suboptimal TCP performance.  The reason for the
    performance degradation is that TCP interprets segment loss induced by long connectivity
    disruptions as a sign of congestion, resulting in repeated retransmission timer
    backoffs. This leads in turn to a deferred detection of the re-establishment of
    the connection since TCP waits until the next retransmission timeout occurs before
    attempting the retransmission.  This document proposes a algorithm for making
    TCP more robust to long connectivity disruptions (TCP-LCD).  The memo describes
    how standard ICMP messages can be exploited during timeout-based loss recovery
    to disambiguate true congestion loss from non-congestion loss caused by connectivity
    disruptions.  Moreover, a revert strategy of the retransmission timer is specified
    that enables a more prompt detection of whether the connectivity to a previously
    disconnected peer node has been restored or not.  TCP-LCD is a TCP sender-only
    modification that effectively improves TCP performance in presence of connectivity
    disruptions.</p>"
