abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Collaboration Content Transfer (TCT) Protocol,
    an HTTP-based method for efficient, verifiable delivery of web content to automated
    agents. TCT defines a JSON envelope that encapsulates resource content in negotiated
    text-based formats (such as Markdown or plain text) together with canonical metadata.
    It uses bidirectional URL discovery between human-facing and machine-facing URLs,
    JSON sitemaps, strong ETag validators, and conditional requests to reduce bandwidth
    while preserving semantic structure and canonical identity.</p>"
