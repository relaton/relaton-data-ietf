abstract:
- language: en
  script: Latn
  content: "<p>This informational document describes ways to interconnect a Shortest
    Path Tree (SPT) Region over WAN connections using MPLS Pseudo Wires (PWs) with
    existing SPB and MPLS standards. It also describes how a combination of SPB and
    MPLS can provide a hierarchical scalable L2VPN.</p>"
