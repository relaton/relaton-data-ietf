abstract:
- language: en
  script: Latn
  content: <p>The Extensible Authentication Protocol (EAP) defines an extensible framework
    for performing network access authentication. Most EAP authentication algorithms,
    also known as "methods", export keying material that can be used with lower layer
    ciphersuites. It has been proposed [11] to leverage the EAP keying framework to
    derive Application Master Session Keys (AMSKs) for specific applications or services.
    This document defines how to generate Application Master Session Keys (AMSKs)
    specific to Mobile IPv6. These AMSKs can be used by Mobile Node and Home Agent
    to bootstrap Mobile IPv6 protocol operation.</p>
