abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a set of methods, headers and resource types
    that define the scheduling extension to the CalDAV protocol. CalDAV itself extends
    WebDAV, which extends HTTP. The new protocol elements defined here allow interoperable
    scheduling operations on a CalDAV repository.</p>"
