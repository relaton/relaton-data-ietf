abstract:
- language: en
  script: Latn
  content: "<p>In some application of the associated channel header (ACH), it is necessary
    to have to ability to include a set of TLVs to provide additional context information
    for the ACH payload.  This document describes the TLV structure and defines a
    number of TLV types.</p>"
