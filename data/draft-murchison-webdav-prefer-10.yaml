abstract:
- language: en
  script: Latn
  content: "<p>This specification defines how the HTTP Prefer header field can be\n   used by a WebDAV client to request that certain behaviors be employed\n   by a server while constructing a response to a request.\n\nEditorial Note (To be removed by RFC Editor before publication)\n\n   Please send comments to the Web Distributed Authoring and Versioning\n   (WebDAV) mailing list at &lt;mailto:w3c-dist-auth@w3.org&gt; [1], which may\n   be joined by sending a message with subject \"subscribe\" to\n   &lt;mailto:w3c-dist-auth-request@w3.org&gt; [2].  This mailing list is\n   archived at &lt;http://lists.w3.org/Archives/Public/w3c-dist-auth/&gt; [3].\n\nOpen Issues\n\n   o  Should the list of updated RFCs (other than RFC 7240) in the title\n      page header only contain those whose method responses have been\n      altered by this document?  Or should all potentially effected\n      methods/protocols be listed?\n\n   o  Should we add any text regarding caching responses in Section 3?\n\n   o  Should we update the HTTP Status Code Registry to add a reference\n      to Section 3.2 for 412 (Precondition Failed)?</p>"
