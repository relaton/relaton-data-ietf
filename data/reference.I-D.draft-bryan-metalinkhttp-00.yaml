abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Metalink in HTTP Headers, an alternative representation,
    instead of the usual XML-based download description format.  Metalink describes
    alternate download locations (mirrors), Peer-to-Peer information, checksums, digital
    signatures, and other information.  Clients can transparently use this information
    to reliably transfer files.</p>"
