- language: en
  script: Latn
  content: "<p>This document defines a new DHCP option for delivering configuration
    information for LDAP services. Through this option, the client receives an LDAP
    URL [8] of the closest available LDAP server/replica that can be used to authenticate
    users or look up any useful data.</p>"
