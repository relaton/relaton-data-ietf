- language: en
  script: Latn
  content: "<p>This document aims to explain the requirement and usecases for a secure
    authentication model for different SDN components (e.g. SDN switch, application,
    etc.). It also covers the standard structure for the communications of two SDN
    controllers or an application to different SDN controllers via a mediator service.</p>"
