abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the use of HTTP content negotiation and the\n   Prefer header to request consolidated, machine-readable\n   representations of web resources.  A client uses the Accept header to\n   negotiate an appropriate media type and Prefer: return=consolidated\n   to request a representation intended for automated consumption.  A\n   server that honours the preference identifies the selected\n   representation with Preference-Applied: return=consolidated and\n   varies cached responses on Accept and Prefer.  The mechanism uses\n   existing HTTP semantics and introduces a single new preference value\n   for the existing Prefer header.  It provides a protocol-level\n   alternative to ad-hoc client detection or path conventions when\n   serving machine-readable representations, while also enabling\n   publishers to reduce repeated fetching, bandwidth use, and server\n   processing.</p>"
