abstract:
- language: en
  script: Latn
  content: "<p>This document extends the Point-to-Point Over Ethernet (PPPoE) Protocol
    [2] with a credit-based flow control mechanism and Link Quality Metric report.
    This optional extension should improve the performance of PPPoE over media with
    variable bandwidth and limited buffering, such as mobile radio links.</p>"
