- language: en
  script: Latn
  content: |-
    <p>This document provides a Database Discovery mechanism for PAWS.  By
       this mechanism the master device gets the available WSDBs with which
       it should communicate as well as the regulatory domain information.
       The mechanism is based on the LoST protocol .</p>
