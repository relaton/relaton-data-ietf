abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Identity Control Validation (ICV) framework\n   for the ACME protocol [RFC8555], introducing a new ACME identifier\n   type \"idp\" and a new challenge type \"idp-01\".  The ICV framework\n   allows ACME servers to delegate trusted Identity Providers (IdPs) to\n   verify certificate applicants’ control over the claimed identities.\n\n   This document also defines an optional X.509 certificate extension,\n   the Trust-Domain-Restricted Certificate Extension, which explicitly\n   indicates that certificates issued via the ICV framework are backed\n   by a specific IdP trust domain and whose trustworthiness depends on\n   the current status and policies of that IdP, preventing trust leakage\n   into contexts outside the IdP’s trust domain.\n\n   This extension is parallel to Domain Control Validation (DCV)\n   [RFC8555]; either can independently verify an applicant’s control\n   over identities/resources and request certificates.\n   Proof-of-Possession (PoP) [I-D.geng-acme-public-key] serves as an\n   auxiliary enhancement framework.  Based on this architecture, two\n   standardized certificate enrollment models are formed: the Domain\n   Validation model (DCV + optional PoP) and the Identity Validation\n   model (ICV + optional PoP).  This document focuses on the latter.\n\n   This document defines three deployment models: the IdP-Operated\n   Certificate Model, the Intra-PKI Domain Mutual-Trust Model, and the\n   CA-Integrated IdP Model.  It supports multiple authentication\n   protocols via the extensible idp_method parameter, covering both\n   device and account identities.</p>"
