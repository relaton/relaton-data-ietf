abstract:
- language: en
  script: Latn
  content: "<p>Routing and Addressing in Next-Generation EnteRprises (RANGER) [I-D.templin-RANGER]
    provides an architectural framework for scalable routing and addressing.  It provides
    for scalability, provider independence, mobility, multihoming and security for
    the next generation Internet.  This document describes a series of use cases in
    order to showcase RANGER capabilities.  It further shows how the RANGER architecture
    restores the network-within-network principles originally intended for the sustained
    growth of the Internet.</p>"
