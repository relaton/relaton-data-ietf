abstract:
- language: en
  script: Latn
  content: "<p>Software-Defined Networks (SDNs) are multilayer systems. In this context,
    this draft defines a graph-based reference model capable of properly representing
    such complex multilayer networks. The defined reference model thus eases the management
    and planning of SDN environments.</p>"
