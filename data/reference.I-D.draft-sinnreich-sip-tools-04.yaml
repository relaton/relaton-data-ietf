abstract:
- language: en
  script: Latn
  content: "<p>For Internet-centric usage, the number of SIP related standards for
    presence, IM and audio/video communications can be drastically reduced by using
    only the rendezvous and session initiation capabilities of SIP. The simplification
    is based on avoiding emulating telephony and its model of the intelligent network.
    Simple SIP by contrast relies on powerful computing endpoints. Simple SIP desktop
    applications for example can be combined with rich Internet applications (RIA).
    However, significant telephony features may also be implemented in the endpoints.
    \ This approach for SIP reduces the number of SIP standards to comply with, currently
    from roughly 100 and still growing, to about 10.  References for NAT traversal
    and for security are also provided.</p>"
