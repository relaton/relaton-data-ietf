abstract:
- language: en
  script: Latn
  content: "<p>This document defines a number of Quality of Service (QoS) parameters
    that can be reused for conveying QoS information within Diameter.  The defined
    QoS information includes data traffic parameters for describing a token bucket
    filter, bandwidth, defending and preemption priority, admission priority, application-level
    resource priority, per-hop behavior class, and DiffServ-aware Multiprotocol Label
    Switching (MPLS) traffic engineering.</p>"
