abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a framework for the PSAMP (Packet Sampling)
    protocol. The functions of this protocol are to select packets from a stream according
    to a set of standardized reports, form a stream of reports on the selected packets,
    and to export that stream to a collector. This framework details the components
    of this architecture, then describes some generic requirements, motivated the
    dual aims of ubiquitous deployment and utility of the reports for applications.
    Detailed requirements for selection, reporting and export are described, along
    with configuration of the PSAMP functions.</p>"
