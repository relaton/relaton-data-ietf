abstract:
- language: en
  script: Latn
  content: <p>This document specifies a set of methods, headers, properties and content-types
    composing WebDAV SEARCH, an application of the HTTP/1.1 protocol to efficiently
    search for DAV resources based upon a set of client-supplied criteria.Editorial
    Note (To be removed by RFC Editor before publication) Please send comments to
    the Distributed Authoring and Versioning (WebDAV) DASL mailing list at &lt;mailto:www-webdav-dasl@w3.org&gt;,
    which may be joined by sending a message with subject "subscribe" to &lt;mailto:www-webdav-dasl-request@w3.org&gt;.  Discussions
    of the WebDAV DASL mailing list are archived at &lt;http://lists.w3.org/Archives/Public/www-webdav-dasl/&gt;.  An
    issues list and XML and HTML versions of this draft are available from &lt;http://greenbytes.de/tech/webdav/#draft-reschke-webdav-search&gt;.</p>
