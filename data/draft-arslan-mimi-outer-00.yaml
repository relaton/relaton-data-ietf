abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a general purpose messaging format that is
       flexible enough to capture the semantics of incumbent messaging
       formats like MIME or XMPP or non-standard protocols like those of
       apps like WhatsApp, Signal, etc.  It can be used as the payload
       format inside an MLS session.</p>
