abstract:
- language: en
  script: Latn
  content: "<p>As mandated in RFC 2418, working group charters currently contain milestones.
    However, these milestones are often sufficiently out of date that they no longer
    provide value. This document exists to facilitate a community discussion around
    the future of milestones. This document could potentially update RFC 2418.</p>"
