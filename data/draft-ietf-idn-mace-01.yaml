- language: en
  script: Latn
  content: |-
    <p>MACE is a reversible transformation method from a sequence of Unicode
    [UNICODE] characters to a sequence of ASCII letters, digits and
    hyphens (LDH characters).  It is designed to be used as an encoding
    for internationalized domain names [IDN].</p>
