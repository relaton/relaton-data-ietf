abstract:
- language: en
  script: Latn
  content: "<p>Discovery of the correct Location Information Server (LIS) in the local
    access network is necessary for devices that wish to acquire location information
    from the network.  A method is described for the discovery of a LIS.  Dynamic
    Host Configuration Protocol (DHCP) options for IP versions 4 and 6 are defined
    that specify a URI for a LIS in the local access network.  Additional DHCP options
    are provided that enable authentication of the indicated LIS.  An alternative
    method that uses URI-enabled NAPTR (U-NAPTR) is described for use where the DHCP
    option is unsuccessful.</p>"
