abstract:
- language: en
  script: Latn
  content: "<p>This draft discusses requirements of routers that serve as ingress/egress
    points to/from differentiated services (diff-serv) networks. We discuss the traffic
    conditioning components required and associated configuration mechanisms and protocols.
    We also discuss admission control to diff-serv networks in support of signaled
    QoS.</p>"
