abstract:
- language: en
  script: Latn
  content: "<p>This document is intended to be a source of information about the Russian
    Federal standard for for electronic encryption, decryption and MAC algorithms
    (GOST 28147-89) [GOST28147], which is one of the official standards in the Russian
    cryptography, used in Russian algorithms (GOST algorithms). Recently, the Russian
    cryptography started to be used in different applications intended to work with
    the OpenSSL cryptographic library. Thus, this document has been created for the
    informational purposes for users of Russian cryptography.</p>"
