- language: en
  script: Latn
  content: "<p>This document introduces a method to let receivers control the part
    of the full video image that they wish to watch. It specifies an extension to
    the messages defined in the Audio-Visual Profile with Feedback (AVPF), and it
    can be applied to any RTP video applications.</p>"
