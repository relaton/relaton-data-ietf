abstract:
- language: en
  script: Latn
  content: "<p>RFC 1323 defines the TSecr field of a SYN packet to be not valid and
    thus this field will always be zero.  This documents specifies the use of this
    field to signal and negotiate additional information about the content of the
    TSopt field as well as the behavior of the receiver.  If the receiver understands
    this extension, it will use the TSecr field of the SYN/ACK to reply.  Otherwise
    the receiver will ignore the TSecr field and set a timestamp in the TSecr field
    as specified in RFC 1323.</p>"
