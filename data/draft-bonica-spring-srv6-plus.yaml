abstract:
- language: en
  script: Latn
  content: "<p>This document describes Segment Routing mapped to IPv6 (SRm6). SRm6
    is a Segment Routing (SR) solution that leverages IPv6. It supports a wide variety
    of use-cases while remaining in strict compliance with IPv6 specifications. SRm6
    is optimized for ASIC-based forwarding devices that operate at high data rates.</p>"
