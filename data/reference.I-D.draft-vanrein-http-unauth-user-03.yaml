abstract:
- language: en
  script: Latn
  content: "<p>Most protocols support users under domain names, but HTTP does not.
    Usage patterns in the wild do suggest a desire to have this facility. This specification
    defines a header for user names, orthogonal to any authentication or authorisation
    concerns.</p>"
