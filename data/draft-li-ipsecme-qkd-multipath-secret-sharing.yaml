abstract:
- language: en
  script: Latn
  content: "<p>Trusted relay is currently the most practical deployment model for\n   Quantum Key Distribution (QKD) networks.  However, trusted relay\n   nodes pose inherent security vulnerabilities, as intermediate nodes\n   can access the plaintext random number used to derive the end-to-end\n   QKD key, leading to complete key exposure if any single relay node is\n   compromised.  To mitigate this risk, this document proposes a Multi-\n   Path Secret Sharing (MPSS) mechanism for QKD key relay.  The core\n   idea is to split the random number into multiple shares using a\n   threshold secret sharing scheme, distribute each share through\n   independent QKD relay paths planned by the Key Management Plane\n   (KMP), and reconstruct the complete random number only at the\n   destination node.  This mechanism transforms the security model from\n   \"all-or-nothing\" to \"threshold security\".  Notably, this mechanism\n   leverages an extended IPv6 Destination Option Header (DOH) to carry\n   key share-related metadata and utilizes Segment Routing over IPv6\n   (SRv6) to enforce strict path isolation.</p>"
