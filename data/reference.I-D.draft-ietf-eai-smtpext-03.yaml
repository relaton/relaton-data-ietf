abstract:
- language: en
  script: Latn
  content: "<p>Internationalized email address includes two parts, the local part
    and the domain part. The ways email addresses are used by protocols are different
    from the ways domain names are used. The most critical difference is that emails
    are delivered through a chain of peering clients and servers while domain names
    are resolved by name servers by looking up their own tables. In addition to this,
    email transport protocols SMTP and ESMTP provide a negotiation mechanism through
    which clients can make decisions for further processing. This document specifies
    the use of SMTP extension for internationalized email address delivery. It also
    mentions the backward compatible mechanism for downgrade procedure, as specified
    in an associated specification.</p>"
