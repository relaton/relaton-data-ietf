abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the procedure for creating bindings between
    a DHCPv4 [RFC2131]/DHCPv6 [RFC3315] assigned source IP address and a binding anchor
    [I-D.ietf-savi-framework] on SAVI (Source Address Validation Improvements) device.
    The bindings can be used to filter packets generated on the local link with forged
    source IP address.</p>"
