abstract:
- language: en
  script: Latn
  content: "<p>The Pseudowire FEC sub-TLVs for the Target FEC Stack in the LSP Ping
    mechanism are implicitly defined for IPv4 Provider Edge (PEs) routers.  There
    is, however, a degree of potential ambiguity in the specification of these sub-TLVs
    since the address family is not specified but could be inferred from the length.
    \ This document updates RFC4379 to explicitly constraint these sub-TLVs for IPv4
    LDP sessions, and extends Pseudowire LSP Ping to the IPv6 scenario where an IPv6
    LDP session is used to signal the Pseudowire (i.e., where the Sender's and Receiver's
    IP addresses are IPv6 addresses.)  This is done by defining two new LSP Ping sub-TLVs
    for IPv6 Pseudowire FECs.</p>"
