- language: en
  script: Latn
  content: "<p>This document describes the requirement for an IP multicast performance
    monitoring system for service provider IP multicast networks. This system enables
    efficient performance monitoring in Service Providers' production networks and
    provides diagnostic information in case of performance degradation or failure.</p>"
