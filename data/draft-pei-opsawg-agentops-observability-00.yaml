abstract:
- language: en
  script: Latn
  content: "<p>Agentic systems execute tasks through long-running sequences of model
    inference, planning, delegation, tool use, state updates, verification, and recovery.
    Conventional metrics, logs, and traces can identify a failed request but often
    cannot determine whether a failure is emerging, which actor introduced it, or
    which earlier event was its root cause. This document specifies an AgentOps observability
    event model and processing requirements for interoperable early failure detection
    and post-failure root-cause attribution. It defines common event, anomaly, assertion,
    and diagnosis records; distinguishes causal origins from propagated symptoms;
    and provides the evidence model required by separate benchmarks of detection lead
    time, responsible-actor attribution, and root-cause localization. The model is
    transport-neutral and can be carried by existing telemetry systems.</p>"
