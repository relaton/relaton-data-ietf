abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides guidelines on how to make ICE [RFC5245]
       conclude faster in IPv4/IPv6 dual-stack scenarios where broken paths
       exist.  This will lead to more sustained IPv6 deployment as users
       will no longer have an incentive to disable IPv6.</p>
