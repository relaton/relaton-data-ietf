abstract:
- language: en
  script: Latn
  content: <p>This document describes the use of Bidirectional Forwarding Detection
    for Multi-chassis Link Aggregation Group to provide faster than Link Aggregation
    Control Protocol convergence. This specification enhances RFC 7130 "Bidirectional
    Forwarding Detection (BFD) on Link Aggregation Group (LAG) Interfaces".</p>
