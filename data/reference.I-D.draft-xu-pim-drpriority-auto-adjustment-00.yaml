abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for automatically adjusting the Protocol
    Independent Multicast (PIM) Designed Router (DR) priority according to the status
    of the tracked interface. This approach can be used to realize DR auto-switchover
    in case the current DR loses the routes to multicast senders or Rendezvous Points
    (RP).</p>"
