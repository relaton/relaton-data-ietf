abstract:
- language: en
  script: Latn
  content: "<p>This document describes SPAKE2 which is a protocol for two parties
    that share a password to derive a strong shared key with no risk of disclosing
    the password.  This method is compatible with any group, is computationally efficient,
    and SPAKE2 has a security proof.</p>"
