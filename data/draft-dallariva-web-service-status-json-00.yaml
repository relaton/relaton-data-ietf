abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a standard JSON format for service status
       resources. It provides a machine-readable format for overall service
       health indicators, component-level status information with
       criticality classification, geographic scope identification, and
       structured incident reporting.  This standard enables
       interoperability between status monitoring tools and service
       providers.</p>
