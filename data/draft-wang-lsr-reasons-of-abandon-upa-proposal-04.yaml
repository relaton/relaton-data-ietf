abstract:
- language: en
  script: Latn
  content: "<p>[I-D.ietf-lsr-igp-ureach-prefix-announce] (UPA draft) proposes the
    solution to announce the prefix unreachable information within the IGP domain.
    It utilizes the LSInfinity concept that is introduced in [RFC2328], without analyzing
    the dormant and flawed design. The proposal doesn't work even in simple scenario,
    is based on one flawed feature, lacks the explicit withdrawn procedures. This
    document analyzes the above issues, suggests the IETF commuity abandon the UPA
    draft, replace it with other more comprehensive document [I-D.wang-lsr-prefix-unreachable-annoucement](Founder
    Draft), to provide the IETF community the more optimal solution.</p>"
