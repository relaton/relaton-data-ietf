- language: en
  script: Latn
  content: "<p>This document defines two new URI parameters to describe the calling
    party's category and toll class of service originating line information which
    are parameters also used in SS7 ISUP and other telephony signalling protocols.
    \ The intended use of these URI parameters is for the tel URI address scheme.</p>"
