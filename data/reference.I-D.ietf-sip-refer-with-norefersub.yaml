abstract:
- language: en
  script: Latn
  content: <p>This specification defines a way to suppress an implicit subscription
    with the Session Initiation Protocol (SIP) REFER method. A new SIP option tag
    "norefersub" is defined to indicate support for this extension. A new SIP header
    field "Refer-Sub" is defined to request the usage of this extension.</p>
