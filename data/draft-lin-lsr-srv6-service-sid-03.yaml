abstract:
- language: en
  script: Latn
  content: |-
    <p>The IPv6 backbone networks only deploying IGP may be required to
       interconnect IPv4 islands. SRv6 Service SIDs like End.DT4 may be
       used to realize such requirements. This document extends IS-IS and
       OSPFv3 to advertise SRv6 Service SIDs.</p>
