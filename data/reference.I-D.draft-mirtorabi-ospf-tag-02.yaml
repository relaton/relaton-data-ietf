abstract:
- language: en
  script: Latn
  content: "<p>There are applications which require additional attributes to be advertised
    with an OSPF link or route. The existing OSPF LSA formats do not allow for backward
    compatible extension to advertise these attributes. This draft proposes an extension
    to OSPF for advertising additional attributes which will be associated with a
    link or route. It also introduces the support of administrative tags for any link
    type in the router-LSA and any route in summary-LSAs, NSSA-LSAs, or AS-external-LSAs.</p>"
