abstract:
- language: en
  script: Latn
  content: <p>This document describes the "envelope-dsn", "redirect-dsn", "envelope-deliverby",
    and "redirect-deliverby" extensions to the Sieve email filtering language.  The
    "envelope-dsn" and "envelope- deliverby" extensions provide access to additional
    envelope information provided by the delivery status notification and deliver-by
    SMTP extensions.  The "redirect-dsn" and "redirect- deliverby" extensions extend
    Sieve's redirect action to provide control over delivery status notification and
    deliver-by parameters, respectively.  Change History (to be removed prior to publication
    as an RFC  Clarified orcpt decoding.  Changed the ABNF for notary values to disallow
    spaces.  Fixed several typos.  Changed name of extension from notary to envelope-dsn.  Added
    the redirect-dsn extension.  Updated references.  Added a note about the use of
    ADDRESS-PART arguments with the new envelope-part strings defined by the envelope-dsn
    extension.  Fleshed out the redirect-dsn extension.  Changed document title to
    agree with new extension names.  Added some examples.  Fixed more typos.  Changed
    dsn-envelope and dsn-redirect to envelope-dsn and redirect- dsn, respectively.  Added
    a redirect-dsn example.  Added the two deliver-by extensions.</p>
