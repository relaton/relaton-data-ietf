abstract:
- language: en
  script: Latn
  content: "<p>Recently a number of architectures have been proposed to allow sessions
    with multiple data streams to pass through firewalls. Examples of such sessions
    are IP telephony and multimedia sessions. This draft provides a threat analysis
    on three architectures offered to address this issue.</p>"
