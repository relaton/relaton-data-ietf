abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the issues of processing the AS_PATH attribute
    which provides sufficient information for constructing a graph of AS connectivity,
    and defines the detailed procedure of fragmenting or merging a sequence of AS
    PATH segments. This is necessary for the robust implementation of Border Gateway
    Protocol (BGP) and the interoperation of vendors.</p>"
