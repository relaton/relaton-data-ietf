abstract:
- language: en
  script: Latn
  content: "<p>This document considers the consequences of moving the underlying \n
    \  network architecture from the current Internet to an Information-\n   Centric
    Network (ICN) architecture on video distribution. As most of \n   the traffic
    in future networks is expected to be video, we consider \n   how to modify the
    existing video streaming mechanisms. Several \n   important topics related to
    video distribution over ICN are \n   presented, covering a wide range of scenarios:
    we look at how to \n   evolve DASH to work over ICN, and leverage the recent ISO/IEC
    MPEG \n   Dynamic Adaptive Streaming over HTTP (DASH) standard; we consider \n
    \  layered encoding over ICN; P2P mechanisms introduce distinct \n   requirements
    for video and we look at how to adapt PPSP for ICN; \n   IPTV adds delay constraints,
    and this will create more stringent   \n   requirements over ICN as well. As part
    of the discussion on video, \n   we discuss DRMs in ICN. Finally, in addition
    to consider how \n   existing mechanisms would be impacted by ICN, this document
    lists \n   some research issues to design ICN specific video streaming \n   mechanisms.</p>"
