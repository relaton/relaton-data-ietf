abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of the Camellia block cipher algorithm
    in Cipher Block Chaining (CBC) mode, Counter (CTR) mode, and Counter with CBC-MAC
    (CCM) mode, as an IKEv2 and Encapsulating Security Payload (ESP) mechanism to
    provide confidentiality, data origin authentication, and connectionless integrity.</p>"
