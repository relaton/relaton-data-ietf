abstract:
- language: en
  script: Latn
  content: "<p>This memo describes an RTP payload format for scalable video coding
    (SVC) defined in_Annex G of the ITU-T Recommendation H.264 video codec which is
    technically identical to Amendment 3 of ISO/IEC International Standard 14496-10.
    The RTP payload format allows for packetization of one or more Network Abstraction
    Layer (NAL) units, produced by the video encoder, in each RTP packet payload.
    The payload format has wide applicability, such as low bit-rate conversational,
    Internet video streaming, or high bit-rate entertainment quality video.</p>"
