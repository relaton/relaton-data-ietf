abstract:
- language: en
  script: Latn
  content: |-
    <p>Deployment of Domain Name System (DNS) security with good cryptologic
    practice will involve large volumes of key rollover traffic.  A
    standard format and protocol for such messages will be necessary for
    this to be practical and is specified herein.</p>
