abstract:
- language: en
  script: Latn
  content: |-
    <p>This document analyzes the requirements and problems when monitoring
       flows with multi-layer network encapsulations.  This document aims to
       solve this problem by updating RFC7011 and introducing new IPFIX IEs
       for encapsulation layer indication.</p>
