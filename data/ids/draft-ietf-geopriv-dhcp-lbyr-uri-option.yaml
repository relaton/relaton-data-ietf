title:
- language: en
  script: Latn
  content: Dynamic Host Configuration Protocol (DHCP) IPv4 and IPv6 Option for a Location
    Uniform Resource Identifier (URI)
docidentifier:
- content: draft-ietf-geopriv-dhcp-lbyr-uri-option
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document creates a Dynamic Host Configuration Protocol (DHCP)
       Option for transmitting a client's geolocation Uniform Resource
       Identifier (URI). This Location URI can then be dereferenced in a
       separate transaction by the client or sent to another entity and
       dereferenced to learn physically where the client is located, but
       only while valid.</p>
