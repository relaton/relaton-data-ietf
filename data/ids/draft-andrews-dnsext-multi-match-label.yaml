abstract:
- language: en
  script: Latn
  content: |-
    <p>Idn users have expressed a need to have multiple labels be treated as
    one in the DNS.  This document presents a method to do this by
    defining a new label type that ties a set of labels together that
    need to be treated indentically.</p>
