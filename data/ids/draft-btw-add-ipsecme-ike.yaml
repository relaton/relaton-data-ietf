abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a new Internet Key Exchange Protocol Version
       2 (IKEv2) Configuration Payload Attribute Types for encrypted DNS
       protocols such as DNS-over-HTTPS (DoH), DNS-over-TLS (DoT), and DNS-
       over-QUIC (DoQ).</p>
