  content: Token Binding for 0-RTT TLS 1.3 Connections
docidentifier:
- content: draft-ietf-tokbind-tls13-0rtt
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how Token Binding can be used in the 0-RTT
       data of a TLS 1.3 connection.  This involves a new TLS extension to
       negotiate and indicate the use of Token Binding in 0-RTT data.  A
       TokenBindingMessage sent in 0-RTT data has different security
       properties than one sent after the TLS handshake has finished, which
       this document also describes.</p>
