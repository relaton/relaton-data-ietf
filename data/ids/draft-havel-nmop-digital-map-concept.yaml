abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the concept of Digital Map, explains its
       connection to the Digital Twin, and identifies a set of Digital Map
       requirements and use cases.

       The document intends to be used as a reference for the assessment
       effort of the various topology modules to meet Digital Map
       requirements.

       Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/OlgaHuawei/draft-havel-nmop-digital-map-concept/.</p>
