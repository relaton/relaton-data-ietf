  content: Advertising Proxy for DNS-SD Service Registration Protocol
docidentifier:
- content: draft-ietf-dnssd-advertising-proxy
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>An Advertising Proxy advertises the contents of a DNS zone, for
       example maintained using the DNS-SD Service Registration Protocol
       (SRP), using Multicast DNS.  This allows legacy clients to discover
       services registered with SRP using Multicast DNS.</p>
