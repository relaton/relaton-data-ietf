abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a new resource record for the Domain Name
       System (DNS) protocol.  The record introduced will allow associated
       domain names to be associated with a particular domain name and
       retrieved in in a single DNS query.</p>
