id: draftietfoauthrfc7523bis
schema_version: v1.5.6
formattedref:
  content: draft-ietf-oauth-rfc7523bis
title:
- language: en
  script: Latn
  content: Updates to OAuth 2.0 JSON Web Token (JWT) Client Authentication and Assertion-Based
    Authorization Grants
docidentifier:
- content: draft-ietf-oauth-rfc7523bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates RFC7521, RFC7522, RFC7523 and RFC9126 with
       respect to the treatment of audience values in OAuth 2.0 Client
       Assertion Authentication and Assertion-based Authorization Grants to
       address a security vulnerability identified in the previous
       requirements for those audience values in multiple OAuth 2.0
       specifications.</p>
