abstract:
- language: en
  script: Latn
  content: |-
    <p>This document supplements additional information of the segment list
       in the BGP-LS advertisement for SR Policy state information.  A new
       flag and a new sub-TLV are introduced in the SR Segment List TLV of
       BGP-LS SR Policy Candidate Path NLRI.</p>
