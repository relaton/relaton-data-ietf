  script: Latn
  content: Updates to X.509 Policy Validation
docidentifier:
- content: draft-ietf-lamps-x509-policy-graph
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates RFC 5280 to replace the algorithm for X.509
       policy validation with an equivalent, more efficient algorithm.  The
       original algorithm built a structure which scaled exponentially in
       the worst case, leaving implementations vulnerable to denial-of-
       service attacks.</p>
