abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an experimental TCP option that can be used to
       negotiate a set of options that are supported by two TCP endpoints.
       The main motivation for designing this option is the optimization of
       the option space for SYN segments.</p>
