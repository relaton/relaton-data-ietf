abstract:
- language: en
  script: Latn
  content: |-
    <p>This document relaxes the recommendations specified in BGP/MPLS IP
       Virtual Private Networks (VPNs) and BGP Route Reflection: An
       Alternative to Full Mesh Internal BGP (IBGP) allowing the building of
       Inter-domain L3VPN architecture with internal BGP.</p>
