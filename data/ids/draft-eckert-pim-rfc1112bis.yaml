  content: Host Extensions for "Any Source" IP Multicasting (ASM)
docidentifier:
- content: draft-eckert-pim-rfc1112bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo specifies the extensions required of a host implementation
       of the Internet Protocol (IP) to support Any Source Multicast (ASM)
       IP Multicasting or abbreviated IP Multicast.  Distribution of this
       memo is unlimited.

       This document replaces [RFC1112] for anything but its specification
       of the IGMP version 1 protocol.</p>
