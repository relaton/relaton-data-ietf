- language: en
  script: Latn
  content: "<p>This specification defines extended uses of the Multicast Listener
    \nDiscovery protocol to support hosts participating in anycast groups.  \nThe
    extensions presented in this document allow hosts to notify the \nrouting system
    of membership changes in an anycast group.</p>"
