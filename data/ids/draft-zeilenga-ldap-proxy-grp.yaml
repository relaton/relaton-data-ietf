abstract:
- language: en
  script: Latn
  content: |-
    <p>This document details a proxy authorization mechanism for LDAPv3
    [RFC2251] which allows an authenticated client to concurrently issue
    operations on behalf of multiple entities.  The mechanism utilizes the
    LDAPv3 Grouping of Related Operations [GROUPING] framework.</p>
