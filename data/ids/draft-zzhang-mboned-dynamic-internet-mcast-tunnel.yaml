abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a mechanism to facilitate widespread
       multicast connectivity over the Global Internet via dynamic
       tunneling, enabling many different multicast islands to be connected
       by tunnels between both PIM routers and AMT gateways/relays.</p>
