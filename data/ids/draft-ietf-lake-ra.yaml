abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies how to perform remote attestation as part of
       the lightweight authenticated Diffie-Hellman key exchange protocol
       EDHOC (Ephemeral Diffie-Hellman Over COSE), based on the Remote
       ATtestation procedureS (RATS) architecture.</p>
