  content: 'Internet X.509 Public Key Infrastructure: Algorithm Identifiers for SLH-DSA'
docidentifier:
- content: draft-ietf-lamps-x509-slhdsa
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Digital signatures are used within X.509 Public Key Infrastructure
       such as X.509 certificates, Certificate Revocation Lists (CRLs), and
       to sign messages.  This document specifies the conventions for using
       the Stateless Hash-Based Digital Signature Algorithm (SLH-DSA) in
       X.509 Public Key Infrastructure.  The conventions for the associated
       signatures, subject public keys, and private keys are also specified.</p>
