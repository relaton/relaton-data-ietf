  content: |-
    <p>This draft describes how to extend the Binary Floor Control Protocol
       (BFCP) for use over an unreliable transport.  It details the
       differences from the BFCP protocol definition document and the
       Session Description Protocol (SDP) format specified for BFCP streams.</p>
