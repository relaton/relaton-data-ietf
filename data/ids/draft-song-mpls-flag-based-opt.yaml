  content: Flag-based MPLS Network Actions (MNA) for On-Path Telemetry
docidentifier:
- content: draft-song-mpls-flag-based-opt
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the support of two flag-based variants of on-
       path Telemetry techniques, Postcard-Based On-Path Telemetry (PBT) and
       Alternate Marking (AM), as MPLS Network Actions (MNA)for OAM in MPLS
       networks.  The scheme only uses a few bits in the MNA header opcode
       dedicated for the flag-based actions.</p>
