abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Deterministic Networking IP data plane
    when operating over a Time-Sensitive Networking (TSN) sub-network.  This document
    does not define new procedures or processes.  Whenever this document makes statements
    or recommendations, these are taken from normative text in the referenced RFCs.</p>"
