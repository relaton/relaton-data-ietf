abstract:
- language: en
  script: Latn
  content: |-
    <p>LSP attributes can be specified or recorded for whole path, but they
       cannot be targeted to a specific hop.  This document proposes
       alternative ways to extend the semantic for RSVP ERO object to target
       LSP attributes to a specific hop.</p>
