- content: draft-ietf-kitten-krb-spake-preauth
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new pre-authentication mechanism for the
       Kerberos protocol.  The mechanism uses a password-authenticated key
       exchange to prevent brute-force password attacks, and may optionally
       incorporate a second factor.</p>
