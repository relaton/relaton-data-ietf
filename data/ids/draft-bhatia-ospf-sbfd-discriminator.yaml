abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new OSPF Router Information (RI) TLV that
       allows OSPF routers to flood the S-BFD discriminator values
       associated with a target network identifier.  This mechanism is
       applicable to both OSPFv2 and OSPFv3.</p>
