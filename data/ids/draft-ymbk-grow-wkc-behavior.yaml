abstract:
- language: en
  script: Latn
  content: |-
    <p>Well-Known BGP Communities are manipulated inconsistently by current
       implementations.  This results in difficulties for operators.  It is
       recommended that removal policies be applied consistently to Well-
       Known Communities.</p>
