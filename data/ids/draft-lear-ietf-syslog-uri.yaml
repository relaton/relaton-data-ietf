abstract:
- language: en
  script: Latn
  content: |-
    <p>syslog specifies both a logging format and a set of protocols to
       communicate that format over.  This memo specifies a set of URIs that
       administrators and configuration systems may use to inform syslog
       senders of their collectors or relays and protocols.</p>
