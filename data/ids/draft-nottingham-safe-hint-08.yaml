abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a "safe" preference for HTTP requests that
       expresses a desire to avoid objectionable content, according to the
       definition of that term by the origin server.

       Support for this preference by clients and servers is optional.</p>
