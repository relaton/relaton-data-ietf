abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes issues when describing multiple RTP streams
       in a single RTP session using SDP and considers the different RTP
       topologies that should be supported.  The document looks at current
       solutions and provides paths toward addressing the issues.</p>
