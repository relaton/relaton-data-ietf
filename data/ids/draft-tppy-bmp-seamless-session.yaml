abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an optional BMP session lifecycle extension
       to prevent data duplication of previously exported messages when TCP
       session is re-established.  It prevents loss of messages between TCP
       session re-establishments and increase overall BMP scalability.</p>
