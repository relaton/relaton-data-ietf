abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes extensions to Border Gateway Protocol (BGP)
       for distributing a Bit Index Explicit Replication Traffic/Tree
       Engineering (BIER-TE) path.  A new Tunnel Type for BIER-TE path is
       defined to encode the information about a BIER-TE path.</p>
