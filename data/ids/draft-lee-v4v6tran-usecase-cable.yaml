abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes some use cases to transition to IPv6 in cable
    access network.  This memo discusses enabling dual-stack to users
    over various types of network infrastructures.  It also describes
    impacts to network, operation, CPE, and applications.</p>
