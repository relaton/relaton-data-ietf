abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a protocol that installs, updates, and
       deletes Trusted Components in a device with a Trusted Execution
       Environment (TEE).  This specification defines an interoperable
       protocol for managing the lifecycle of Trusted Components.</p>
