abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes HiAE, a high-throughput authenticated
       encryption algorithm designed for next-generation wireless systems
       (6G) and high-speed data transmission applications.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/hiae-aead/draft-pham-hiae.</p>
