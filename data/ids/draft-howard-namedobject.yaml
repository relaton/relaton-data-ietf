abstract:
- language: en
  script: Latn
  content: |-
    <p>The Lightweight Directory Access Protocol (LDAP) supports auxiliary
    object classes for adding additional attributes to a directory entry.

    This document defines a structural object class that may be used when no
    other structural object class is available.</p>
