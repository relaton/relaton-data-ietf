abstract:
- language: en
  script: Latn
  content: |-
    <p>The Doain Name System standard specifies that names are represented
    using the ASCII character encoding.  This docuent expands that
    specification to allow the use of the UTF-8 character encoding, a
    superset of ASCII and a translation of the UCS-2 character encoding.</p>
