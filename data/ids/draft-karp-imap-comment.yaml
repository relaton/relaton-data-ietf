abstract:
- language: en
  script: Latn
  content: |-
    <p>The COMMENT extension to the Internet Message Access Protocol [IMAP]
       permits a client to attach free-form text comments to messages stored
       in a mailbox on the server.  These comments are persistent, public,
       mutable, readable, and searchable.</p>
