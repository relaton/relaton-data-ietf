abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines new Transport Layer Security (TLS) Supported
       Groups to allow negotiation in TLS for encoding certain elliptic
       curve public keys in a compressed form rather than the more verbose
       method specified in [RFC8446] and [RFC8422].</p>
