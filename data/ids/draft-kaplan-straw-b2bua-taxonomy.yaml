abstract:
- language: en
  script: Latn
  content: |-
    <p>There are numerous types of SIP Back-to-Back User Agents (B2BUAs),
       performing different roles in different ways.  This document
       identifies several common B2BUA roles, in order to provide taxonomy
       other documents can use and reference.</p>
