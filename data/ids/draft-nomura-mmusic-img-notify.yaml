abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an update notification protocol for
       Internet Media Guides (IMGs) using SIP event notification. The
       mechanism achieves the timely delivery of IMGs and avoids that
       IMG receivers have to poll for updates.</p>
