abstract:
- language: en
  script: Latn
  content: |-
    <p>SMTP supports STARTTLS for inter-domain mail transfer, but it only
       provides very limited security because the server's certificate
       cannot be authenticated.  This memo specifies how TLSA records in the
       DNS can be used for proper MX target server authentication.</p>
