title:
- language: en
  script: Latn
  content: Existing Support for Network Operations in Multilayer Transport Network
    based upon unified approach to OAM (Layer 0 - Layer 2)
docidentifier:
- content: draft-lam-lime-summary-l0-l2-layer-independent
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft summarizes the existing ITU-T SG 15 standards, (Layer 0 -
       Layer 2) both technology-specific and generic across these
       technologies, relevant to leveraging OAM to support fault management,
       performance monitoring, and configuration management.  Knowledge from
       this domain may be leveraged for the benefit of developing generic
       layer independent management for other layers.</p>
