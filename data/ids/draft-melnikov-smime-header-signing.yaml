abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes best practices for handling of Email header
       protected by S/MIME.  It also adds a new Content-Type parameter to
       help distinguish an S/MIME protected forwarded message from an S/MIME
       construct protecting message header.</p>
