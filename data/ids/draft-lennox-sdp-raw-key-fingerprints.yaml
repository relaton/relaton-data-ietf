abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines how to negotiate the use of raw keys for TLS
       and DTLS with the Session Description Protocol (SDP).  Raw keys are
       more efficient than certificates for typical uses of TLS and DTLS
       negotiated with SDP, without loss of security.</p>
