abstract:
- language: en
  script: Latn
  content: |-
    <p>Some networks require communication between an interior and exterior
       portion of a VPN, but have sensitivities about what information is
       communicated across the boundary.  This note seeks to outline the
       issues and the nature of the proposed solutions.</p>
