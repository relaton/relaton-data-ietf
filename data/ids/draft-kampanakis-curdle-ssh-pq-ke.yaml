abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines Post-Quantum Traditional (PQ/T) Hybrid key
       exchange methods based on traditional ECDH key exchange and post-
       quantum key encapsulation schemes.  These methods are defined for use
       in the SSH Transport Layer Protocol.</p>
