abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Segment Routing IPv6 Prefix-SID in the
       IPv4/IPv6 Extended Reachability Attribute Flags TLV.  The new flag is
       used for advertising the capability to handle the IPv6 Segment
       Routing header for the prefix that has the flag attached.</p>
