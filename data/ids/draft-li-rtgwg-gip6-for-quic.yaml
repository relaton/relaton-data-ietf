abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new encapsulation method for QUIC packet
       transmission based on IPv6 extension headers.  This method enables
       QUIC packet transmission to easily inherit the extended functions of
       IPv6.</p>
