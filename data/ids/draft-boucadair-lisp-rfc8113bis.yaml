- content: draft-boucadair-lisp-rfc8113bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a Locator/ID Separation Protocol (LISP)
       shared message type for defining future extensions and conducting
       experiments without consuming a LISP packet type codepoint for each
       extension.

       This document obsoletes RFC 8113.</p>
