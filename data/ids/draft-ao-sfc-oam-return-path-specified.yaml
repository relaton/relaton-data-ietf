title:
- language: en
  script: Latn
  content: Controlled Return Path for Service Function Chain (SFC) OAM
docidentifier:
- content: draft-ao-sfc-oam-return-path-specified
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension to the Service Function Chain
       (SFC) Operation, Administration and Maintenance (OAM) that enables
       control of the Echo Reply return path directing it over a Reverse
       Service Function Path.  Enforcing the specific return path can be
       used to verify the bidirectional connectivity of SFC and increase the
       robustness of SFC OAM.</p>
