  script: Latn
  content: Update to the IANA CoAP Content-Formats Registration Procedures
docidentifier:
- content: draft-ietf-core-cf-reg-update
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates RFC7252 regarding the registration procedures
       for the "CoAP Content-Formats" IANA registry, within the "Constrained
       RESTful Environments (CoRE) Parameters" registry group.  This
       document also introduces a new column, "Media Type", to the registry.
       Furthermore, this document reserves Content-Format identifiers 64998
       and 64999 for use in documentation.</p>
