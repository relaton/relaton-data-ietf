abstract:
- language: en
  script: Latn
  content: |-
    <p>ALTO aims to improve the peer selection in applications that have a
    choice to transfer data from multiple data resources.  This draft
    presents a protocol for a flexible and extensible query response
    protocol between an ALTO aware client and ALTO service provider.</p>
