abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model for configuring and managing
       routing policies in a vendor-neutral way and based on actual
       operational practice.  The model provides a generic policy framework
       which can be augmented with protocol-specific policy configuration.</p>
