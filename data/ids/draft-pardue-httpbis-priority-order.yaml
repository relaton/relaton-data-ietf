abstract:
- language: en
  script: Latn
  content: |-
    <p>The send-order parameter for the HTTP extensible prioritization
       scheme allows explicit ordering indication independent of request
       order.  This can be used to as an additional input signal to
       scheduling decisions, to support alternative sending behaviors.</p>
