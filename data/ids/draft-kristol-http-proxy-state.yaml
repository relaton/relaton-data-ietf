abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a way to create a stateful session, using HTTP
    requests and responses, between an HTTP proxy server and its client.  It
    describes two new headers, Pcookie and Set-Pcookie, which carry state
    information between participating HTTP proxy servers and their clients.</p>
