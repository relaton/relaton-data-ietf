abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a simplified method for extending the LSP space
    \nbeyond the 256 Link State PDU (LSP) limit defined in ISO 10589. This \nmethod
    is intended as a preferred replacement for the method defined \nin RFC 3786.</p>"
