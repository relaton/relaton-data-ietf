  content: Standard Communication with Network Elements (SCONE) Protocol
docidentifier:
- content: draft-ietf-scone-protocol
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a protocol where on-path network elements can
       communicate their perspective on the maximum sustainable throughput
       for QUIC flows to endpoints.  This throughput advice suggests an
       upper bound on long-term average throughput, independent of and
       complementary to real-time congestion control signals.</p>
