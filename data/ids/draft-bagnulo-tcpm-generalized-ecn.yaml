  content: 'ECN++: Adding Explicit Congestion Notification (ECN) to TCP Control Packets'
docidentifier:
- content: draft-bagnulo-tcpm-generalized-ecn
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an experimental modification to ECN when used
       with TCP.  It allows the use of ECN on the following TCP packets:
       SYNs, pure ACKs, Window probes, FINs, RSTs and retransmissions.</p>
