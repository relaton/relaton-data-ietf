abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community.
    In particular, it describes management objects used for describing
    alarms using the ITU Alarm Model, defined in X.733 and X.736.</p>
