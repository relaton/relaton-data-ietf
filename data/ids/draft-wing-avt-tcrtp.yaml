  content: |-
    <p>This document describes a mechanism which improves the end-to-end
    bandwidth utilization of RTP streams over an IP network by
    compressing the UDP and RTP headers and allowing the packets of
    multiple RTP streams to be multiplexed into one IP packet.</p>
