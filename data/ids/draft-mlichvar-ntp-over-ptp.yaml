abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a transport for the Network Time Protocol
       (NTP) client-server mode using the Precision Time Protocol (PTP) to
       enable hardware timestamping on hardware that can timestamp PTP
       messages but not NTP messages.</p>
