abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a new, simpler mechanism for searching FedFS
       NSDBs (Name Space Data Bases) for FedFS records.  This mechanism
       replaces the mechanism described in existing FedFS Proposed
       Standards.</p>
