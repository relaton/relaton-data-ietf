abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a DTLS layer for the UDP-notif protocol.
       DTLS allows a server and a client to exchange secured messages over
       UDP.  This transport layer permits networking devices to send secured
       UDP-notif messages over the network.</p>
