  content: Automatic Certificate Management Environment (ACME) Device Attestation
    Extension
docidentifier:
- content: draft-ietf-acme-device-attest
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies new identifiers and a challenge for the
       Automatic Certificate Management Environment (ACME) protocol which
       allows validating the identity of a device using attestation.  This
       document updates RFC 8555 to enable a privacy-preserving mode for the
       identifiers defined in this document.</p>
