abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how to create a conference using SIP ad-hoc
       methods and a URI list. In particular, we describe a mechanism that
       allows a client to provide a conference server with the initial list
       of participants for an ad-hoc conference.</p>
