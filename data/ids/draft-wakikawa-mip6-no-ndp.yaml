abstract:
- language: en
  script: Latn
  content: |-
    <p>This document summarizes how to eliminate the Proxy NDP from the Home
    Agent's operations.  Although the Proxy NDP is mainly used to
    intercept packets by a Home Agent on Mobile IPv6 and NEMO, it brings
    several limitations to the protocols.</p>
