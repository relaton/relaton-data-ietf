- language: en
  script: Latn
  content: |-
    <p>This memo describes the APEX publish-subscribe service, addressed as
    the well-known endpoint 'apex=pubsub'.  The pubsub service is used to
    manage subscriber lists for a set of topical distribution groups, and
    to forward messages to group subscribers.</p>
