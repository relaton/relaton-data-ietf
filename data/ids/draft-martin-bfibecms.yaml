abstract:
- language: en
  script: Latn
  content: "<p>This document describes the conventions for using the Boneh-Franklin
    \nidentity-based encryption (BF-IBE) algorithm in the Cryptographic \nMessage
    Syntax (CMS). The BF-IBE algorithm supports the transport of \nsymmetric keys
    to encrypt message content. Object identifiers (OIDs) \nand the convention for
    encoding a recipient’s identity are also \ndefined.</p>"
