abstract:
- language: en
  script: Latn
  content: |-
    <p>A Point-to-Multipoint (P2MP) Tree in a Segment Routing domain
       efficiently carries traffic from a Root to a set of Leaves.  This
       document describes extensions to BGP encodings and procedures for
       P2MP trees used in BGP/MPLS IP VPNs.</p>
