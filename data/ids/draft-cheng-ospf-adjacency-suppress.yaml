abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a mechanism for a router to signal its
       neighbors to suppress advertising the adjacency to it until link-
       state database synchronization is complete. This minimizes transient
       routing disruption when a router restarts from unplanned outages.</p>
