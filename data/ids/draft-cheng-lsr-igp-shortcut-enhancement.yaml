abstract:
- language: en
  script: Latn
  content: |-
    <p>IGP shortcut mechanism allows calculating routes to forward traffic
       over Traffic Engineering tunnels. This document specifies the
       enhancement of IGP shortcut which can steer routes onto TE-tunnels
       based on colors.</p>
