  content: Semi-Static Diffie-Hellman Key Establishment for TLS 1.3
docidentifier:
- content: draft-rescorla-tls-semistatic-dh
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>TLS 1.3 [I-D.ietf-tls-tls13] specifies a signed Diffie-Hellman
       exchange modelled after SIGMA [SIGMA].  This design is suitable for
       endpoints whose certified credential is a signing key, which is the
       common situation for current TLS servers.  This document describes a
       mode of TLS 1.3 in which one or both endpoints have a certified DH
       key which is used to authenticate the exchange.</p>
