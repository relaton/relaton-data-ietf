- language: en
  script: Latn
  content: "<p>This document clarifies the procedures for establishing, maintaining,
    and removing multiple, concurrent BFD (Bidirectional Forwarding Detection) sessions
    for a given &lt;MPLS LSP, FEC&gt; as described in RFC 5884.</p>"
