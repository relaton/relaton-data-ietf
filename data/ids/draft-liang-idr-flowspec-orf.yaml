abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new ORF-type, called the "FlowSpec-ORF".
       FlowSpec-ORF is applicable in the networks supporting flow
       specifications (FlowSpec) [RFC5575].  It can be used to filter the
       FlowSpec rules on demand.</p>
