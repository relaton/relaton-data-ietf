  content: Routing in Fat Trees (RIFT) Key/Value Topology Information Elements Structure
    and Processing
docidentifier:
- content: draft-ietf-rift-kv-tie-structure-and-processing
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The RIFT (Routing in Fat Trees) protocol allows for key/value pairs
       to be advertised within Key-Value Topology Information Elements (KV
       TIEs).  The data contained within these KV TIEs can be used for any
       imaginable purpose.

       This document specifies behavior for the various Key-Types (i.e.,
       Well-Known, OUI, and Experimental) and a method to structure
       corresponding values.  It also defines a Well-Known Key Sub-Type used
       for testing tie-breaking behavior.</p>
