abstract:
- language: en
  script: Latn
  content: |-
    <p>Separate Internets standards documents define the e-mail headers
    In-Reply-To, References, Supersedes and Expires. This document, which
    is an informational RFC, gives some advice on the implementation of
    these features.</p>
