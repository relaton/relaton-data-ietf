abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines extensions to the AIGP attribute to carry
       Generic Metric sub-types.  This is applicable when multiple domains
       exchange BGP routing information.  The extension will aid in intent-
       based end-to-end path selection.</p>
