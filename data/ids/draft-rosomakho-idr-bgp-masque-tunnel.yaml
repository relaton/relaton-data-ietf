abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines BGP Tunnel Encapsulation Attribute tunnel types
       for MASQUE CONNECT-TCP, CONNECT-UDP, CONNECT-IP, and CONNECT-
       ETHERNET.  It also defines URI Template and ALPN Sub-TLVs for
       advertising the MASQUE proxy endpoint, the HTTP request target
       template, and the application-layer protocol constraints used to
       establish the corresponding MASQUE tunnel.</p>
