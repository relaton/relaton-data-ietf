  content: 'Certificate Management Messages over CMS (CMC): Compliance Requirements'
docidentifier:
- content: draft-mandel-lamps-rfc5274bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides a set of compliance statements about the CMC
       (Certificate Management over CMS) enrollment protocol.  The ASN.1
       structures and the transport mechanisms for the CMC enrollment
       protocol are covered in other documents.  This document provides the
       information needed to make a compliant version of CMC.

       This document obsoletes RFCs 5274 and 6402.</p>
