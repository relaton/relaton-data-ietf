id: draftietfidrbgpbfdstrictmode
schema_version: v1.5.6
formattedref:
  content: draft-ietf-idr-bgp-bfd-strict-mode
title:
- language: en
  script: Latn
  content: BGP BFD Strict-Mode
docidentifier:
- content: draft-ietf-idr-bgp-bfd-strict-mode
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies extensions to RFC4271 BGP-4 that enable a BGP
       speaker to negotiate additional Bidirectional Forwarding Detection
       (BFD) extensions using a BGP capability.  This BFD Strict-Mode
       Capability enables a BGP speaker to prevent a BGP session from being
       established until a BFD session is established.  This is referred to
       as BFD "strict-mode".</p>
