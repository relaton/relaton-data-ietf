  content: |-
    <p>This document describes a sockets-like API for the Reliable Server
       Pooling (RSerPool) protocol suite.  This API provides applications
       within an RSerPool enabled system with a reliable communications
       layer via a highly-available socket interface (rsp_socket).</p>
