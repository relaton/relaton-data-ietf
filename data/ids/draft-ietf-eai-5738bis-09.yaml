abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification extends the Internet Message Access Protocol
       version 4rev1 (IMAP4rev1) to support UTF-8 encoded international
       characters in user names, mail addresses and message headers.  This
       specification replaces RFC 5738.</p>
