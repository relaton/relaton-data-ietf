  content: H.265 Profile for WebRTC
docidentifier:
- content: draft-ietf-avtcore-hevc-webrtc
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC 7742 defines WebRTC video processing and codec requirements,
       including guidance for endpoints supporting the VP8 and H.264 codecs,
       which are mandatory to implement.  This document defines a profile of
       RFC 7798 for browsers supporting the H.265 codec.</p>
