abstract:
- language: en
  script: Latn
  content: |-
    <p>There is limited support to prevent IP fragmentation when using a UDP
       or Datagram Transport Layer Security (DTLS) transport with the
       Session Initiation Protocol (SIP).  This document describes an
       extension to prevent fragmentation in SIP responses.</p>
