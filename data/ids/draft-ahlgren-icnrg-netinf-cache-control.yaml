abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines NetInf protocol extensions for controlling
       caching behaviour.  This includes bypassing caches, asking to not
       return data, setting expiration time for objects, and marking objects
       as non-cacheable.</p>
