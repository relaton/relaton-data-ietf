abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new type of segment for Segment Routing,
       i.e., 4map6 segment, which is a mapping rule-based IPv4/IPv6
       conversion function running in PE nodes.  This segment can be used
       for IPv4 service delivery over IPv6-only undelay networks.</p>
