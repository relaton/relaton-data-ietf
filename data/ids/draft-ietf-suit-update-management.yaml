  content: Update Management Extensions for Software Updates for Internet of Things
    (SUIT) Manifests
docidentifier:
- content: draft-ietf-suit-update-management
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies extensions to the SUIT manifest format.
       These extensions allow a Manifest Author, update distributor, or
       device operator to more precisely control the distribution and
       installation of updates to devices.  These extensions also provide a
       mechanism to inform a management system of Software Identifier and
       Software Bill Of Materials information about an updated device.</p>
