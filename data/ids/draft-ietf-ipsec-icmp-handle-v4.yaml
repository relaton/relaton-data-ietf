abstract:
- language: en
  script: Latn
  content: |-
    <p>This document enumerates the list of ICMP messages that a security gate-
    way may receive and provides an analysis of if and how a gateway should
    handle them.  Three options types of behaviour are enumerated: discard,
    MAY be forwarded, and MUST be forwarded.</p>
