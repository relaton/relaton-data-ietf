abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes a modernization of the AUTH48 process to
       actively protect the Rough Consensus.  It introduces deterministic
       timers and clear Datatracker states to prevent late technical changes
       after the Working Group Last Call.</p>
