  content: BGP Link-State extensions for Segment Routing
docidentifier:
- content: draft-gredler-idr-bgp-ls-segment-routing-ext
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Segment Routing (SR) allows for a flexible definition of end-to-end
       paths within IGP topologies by encoding paths as sequences of
       topological sub-paths, called "segments".  These segments are
       advertised by the link-state routing protocols (IS-IS, OSPF and
       OSPFv3).

       This draft defines extensions to the BGP Link-state address-family in
       order to carry segment information via BGP.</p>
