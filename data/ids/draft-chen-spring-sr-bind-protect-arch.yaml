abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a architecture of fast re-route protection
       for binding SIDs on SR paths including SRv6 paths and SR-MPLS paths.
       The SR paths are in a single domain or cross two domains.  The two
       domains are administrated by one provider or two different providers.</p>
