  content: 'JOSE: Deprecate ''none'' and ''RSA1_5'''
docidentifier:
- content: draft-ietf-jose-deprecate-none-rsa15
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates [RFC7518] to deprecate the JWS algorithm "none"
       and the JWE algorithm "RSA1_5".  These algorithms have known security
       weaknesses.  It also updates the Review Instructions for Designated
       Experts to establish baseline security requirements that future
       algorithm registrations are expected to meet.</p>
