abstract:
- language: en
  script: Latn
  content: |-
    <p>In this document we enhance the existing BGP route refresh mechanisms
    to provide for the demarcation of the beginning and the ending of a
    route refresh.  The enhancement can be used to facilitate on-line,
    non-disruptive consistency validations of BGP routing updates.</p>
