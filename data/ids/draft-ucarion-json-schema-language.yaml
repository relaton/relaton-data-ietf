abstract:
- language: en
  script: Latn
  content: |-
    <p>JSON Schema Language (JSL) is a portable method for describing the
       format of JavaScript Object Notation (JSON) data and the errors
       associated with ill-formed data.  JSL is designed to enable code
       generation from schemas.</p>
