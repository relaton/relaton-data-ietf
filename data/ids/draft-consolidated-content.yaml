  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the use of HTTP content negotiation and the
       Prefer header to request consolidated, machine-readable
       representations of web resources.  A client uses the Accept header to
       negotiate an appropriate media type and Prefer: return=consolidated
       to request a representation intended for automated consumption.  A
       server that honours the preference identifies the selected
       representation with Preference-Applied: return=consolidated and
       varies cached responses on Accept and Prefer.  The mechanism uses
       existing HTTP semantics and introduces a single new preference value
       for the existing Prefer header.  It provides a protocol-level
       alternative to ad-hoc client detection or path conventions when
       serving machine-readable representations, while also enabling
       publishers to reduce repeated fetching, bandwidth use, and server
       processing.</p>
