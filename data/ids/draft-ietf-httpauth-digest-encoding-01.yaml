abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC2617 does not define how to treat non-ASCII characters with the
       "Digest" scheme. This document defines an extension to the "Digest"
       scheme, and a mechanism that would allow the client and server to
       negotiate the proper character encoding support.</p>
