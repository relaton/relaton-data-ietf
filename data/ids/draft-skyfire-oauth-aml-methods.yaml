  content: |-
    <p>Financial regulations require application of Anti-Money Laundering
       (AML) and Countering the Financing of Terrorism (CFT) methods in many
       jurisdictions worldwide.  This specification defines a claim and
       values for declaring what AML/CFT methods were employed.</p>
