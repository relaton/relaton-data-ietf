abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft proposes that routing mechanisms in support of
            traffic engineering be developed independent of specific IGPs.
            A modular constraint-based routing overlay approach is suggested
            and its components are briefly described.</p>
