abstract:
- language: en
  script: Latn
  content: |-
    <p>Protocol endpoints often want to adapt their behavior based upon the
       current properties of the network path, but have limited information
       available to aid these decisions.  This document motivates discussion
       of protocol work to make this information available.</p>
