abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a protocol leveraging TCP and TLS to provide
       modern transport services such as multiplexing, connection migration
       and multipath in a secure manner.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/mpiraux/draft-piraux-tcpls.</p>
