formattedref:
  content: draft-ietf-rtgwg-vrrp-p2mp-bfd
title:
- language: en
  script: Latn
  content: Applicability of Bidirectional Forwarding Detection (BFD) for Multi-point
    Networks in Virtual Router Redundancy Protocol (VRRP)
docidentifier:
- content: draft-ietf-rtgwg-vrrp-p2mp-bfd
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the applicability of Bidirectional Forwarding
       Detection in multipoint networks to support sub-second failure
       detection for Virtual Router Redundancy Protocol Router Role
       election.  The mechanism enables faster determination of the Active
       Router without requiring any modification to the protocol behavior or
       message formats defined in RFC 9568.</p>
