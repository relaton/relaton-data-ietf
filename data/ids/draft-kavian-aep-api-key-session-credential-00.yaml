- language: en
  script: Latn
  content: |-
    <p>This document defines an API-key session-credential extension for the
       Agent Enrollment Protocol (AEP).  The extension lets an AEP Service
       issue an opaque API key through the AEP Grant command for deployments
       that already operate header-based API-key authentication.</p>
