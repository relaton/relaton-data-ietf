  script: Latn
  content: Multihoming in Homenet
docidentifier:
- content: draft-haddad-homenet-multihomed
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Multihoming becomes popular in residential and SOHO networks
       indicating the absolute necessity of fully supporting multihoming in
       Homenet.  While the approach followed in Homenet is to delegate
       multihoming management to hosts, we propose to enable multihoming in
       Homenet by the mean of the infrastructure instead of the hosts.</p>
