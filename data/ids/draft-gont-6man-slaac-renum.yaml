title:
- language: en
  script: Latn
  content: Improving the Robustness of Stateless Address Autoconfiguration (SLAAC)
    to Flash Renumbering Events
docidentifier:
- content: draft-gont-6man-slaac-renum
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>In renumbering scenarios where an IPv6 prefix suddenly becomes
       invalid, hosts on the local network will continue using stale
       prefixes for an unacceptably long period of time, thus resulting in
       connectivity problems.  This document improves the reaction of IPv6
       Stateless Address Autoconfiguration to such renumbering scenarios.</p>
