abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the did:web identity method for the Agent
       Enrollment Protocol (AEP).  The method lets an AEP Service verify
       Agent client assertion JWTs by resolving an Agent did:web identifier
       to a DID document published over HTTPS.</p>
