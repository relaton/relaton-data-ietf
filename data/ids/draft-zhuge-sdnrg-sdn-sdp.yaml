title:
- language: en
  script: Latn
  content: An Intelligent SDN Framework based on Meta-Model with Software-Defined
    Pricing (SDP)
docidentifier:
- content: draft-zhuge-sdnrg-sdn-sdp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a notion called Software-Defined Pricing (SDP)
       and introduces it into a Software-Defined Networks (SDN) framework.
       The SDN system with SDP inside is expected to promote the efficiency
       on SDN resources usage and ease management for service providers.This
       document also defines a mechanism that can efficiently mannage SDN
       framework orderly and intelligently.</p>
