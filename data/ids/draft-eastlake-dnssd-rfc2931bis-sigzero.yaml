title:
- language: en
  script: Latn
  content: Domain Name System (DNS) Public Key Based Request and Transaction Authentication
    (SIGZERO, SIG(0))
docidentifier:
- content: draft-eastlake-dnssd-rfc2931bis-sigzero
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the SIGZERO and SIG(0) Domain Name System
       (DNS) Resource Records (RRs) which provide public key based
       authentication of DNS requests and transactions.  SIGZERO is the
       RECOMMENDED option.  This document obsoletes RFC 2931.</p>
