id: draftietfaceextenddtlsauthorize
schema_version: v1.5.6
formattedref:
  content: draft-ietf-ace-extend-dtls-authorize
title:
- language: en
  script: Latn
  content: Extension of the Datagram Transport Layer Security (DTLS) Profile for Authentication
    and Authorization for Constrained Environments (ACE) to Transport Layer Security
    (TLS)
docidentifier:
- content: draft-ietf-ace-extend-dtls-authorize
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates the Datagram Transport Layer Security (DTLS)
       Profile for Authentication and Authorization for Constrained
       Environments (ACE) specified in RFC 9202 by specifying that the
       profile applies to Transport Layer Security (TLS) as well as Datagram
       TLS (DTLS).</p>
