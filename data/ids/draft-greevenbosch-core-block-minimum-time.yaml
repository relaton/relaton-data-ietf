abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an "MinimumBlockTime" option for CoAP, which
       can be used to negotiate the minimum time between two subsequent
       block requests.  It can be used for overload and congestion control.

    Note

       Discussion and suggestions for improvement are requested, and should
       be sent to core@ietf.org.</p>
