  content: Secondary Certificate Authentication in HTTP/2
docidentifier:
- content: draft-ietf-httpbis-http2-secondary-certs
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>A use of TLS Exported Authenticators is described which enables
       HTTP/2 clients and servers to offer additional certificate-based
       credentials after the connection is established.  The means by which
       these credentials are used with requests is defined.</p>
