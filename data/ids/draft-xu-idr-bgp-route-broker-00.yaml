abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an optimized BGP route reflector mechanism,
       referred to as a BGP route broker, so as to use BGP-based IP VPN as
       an overlay routing protocol for hyper-scale data center network
       virtualization environments, also known as Software-Defined Network
       (SDN) environments.</p>
