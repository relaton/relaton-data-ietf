abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a forward-compatible extension point for the
       Multi-Vantage Path Synchrony (MVPS) bundle format.  The base format
       already provides a schema version, a path-fingerprint version
       prefix, and an IANA "MVPS Bundle Capability Flags" registry, but its
       serialization is closed to unknown fields.  This document adds a
       single, typed, namespaced "extensions" object and a processing rule
       (ignore-but-preserve), and specifies how extensions interact with
       the canonical hash and the MVPS Proof Envelope.

       The mechanism is designed so that an extension can never become a
       tamper vector and can never alter the core coherence detector: the
       detection statistic D^2 is, by construction, a function of the core
       bundle only.  Every property in this document is backed by a
       machine-checkable numerical receipt.</p>
