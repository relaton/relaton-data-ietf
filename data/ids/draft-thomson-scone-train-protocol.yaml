abstract:
- language: en
  script: Latn
  content: |-
    <p>On-path network elements can sometimes be configured to apply rate
       limits to flows that pass them.  This document describes a method for
       signaling to endpoints that rate limiting policies are in force and
       approximately what that rate limit is.</p>
