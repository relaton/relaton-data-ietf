abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a mechanism for an OAuth 2.0 client to
       discover the resource owner's OAuth 2.0 authorization server and
       obtain information needed to interact with it, including its OAuth
       2.0 endpoint locations and authorization server capabilities.</p>
