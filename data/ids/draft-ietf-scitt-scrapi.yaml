abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a REST API with the HTTP resources, request
       and response messages, and error handling needed for an interoperable
       implementation of a SCITT Transparency Service, as defined by the
       Supply Chain Integrity, Transparency, and Trust (SCITT) Architecture.</p>
