abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification introduces an alternative way to communicate a
       secondary cache key for a HTTP resource, using the HTTP "Variants"
       and "Variant-Key" response header fields.  Its aim is to make HTTP
       proactive content negotiation more cache-friendly.</p>
