abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a general mechanism for encrypting attributes
       within RADIUS packets. This mechanism permits more than one attribute
       within a RADIUS transaction (request and response) to be encrypted
       without compromising the security of the encryption.</p>
