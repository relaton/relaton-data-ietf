abstract:
- language: en
  script: Latn
  content: |-
    <p>The Agent Capability and Profile Model (ACPM) is an open, vendor-
       neutral specification for describing what an artificial intelligence
       (AI) agent, the platform that runs it, a tool it calls, or the
       underlying large language model (LLM) actually offers, independent of
       how that subject is run or discovered.  An ACPM document, called a
       capability profile, declares a subject's identity, a dot-namespaced
       list of supported capabilities together with a support level, an
       inventory of tool protocols, models, and memory backends, a trust and
       attestation posture, a cost structure, service-level commitments,
       structured delegation rules governing inbound and outbound work
       handoff, and a compliance posture.

       ACPM profiles are designed to cross-reference agent definitions and
       registry entries defined by other Schema Commons standards, and to be
       consumed by registries, marketplaces, and orchestrators that need to
       compare capabilities, gate on trust, and reason about cost and
       service levels without bespoke per-vendor parsing.  This document
       describes the ACPM data model, field semantics, conformance levels,
       and the relationship of ACPM's trust and signature fields to actual
       verification, which ACPM deliberately does not itself perform.</p>
