abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a set of Type-Length-Value (TLV) tuples which,
    when encapsulated in RADIUS Extended Attributes, are designed to
    allow the secure transmission of sensitive or confidential data
    (including encryption keys) between RADIUS clients and servers.</p>
