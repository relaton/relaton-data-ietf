abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo extends Manufacturer Usage Description (MUD) to model DTLS
       and TLS usage.  This allows a network element to notice abnormal DTLS
       or TLS usage which has been strong indicator of other software
       running on the endpoint, typically malware.</p>
