abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the API-key session-credential grant type for
       the Agent Enrollment Protocol (AEP).  The grant type lets an AEP
       Service issue an opaque API key through the AEP Grant command for
       deployments that already operate header-based API-key authentication.</p>
