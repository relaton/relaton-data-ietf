abstract:
- language: en
  script: Latn
  content: |-
    <p>Automated clients, including Large Language Model (LLM) crawlers and
       Retrieval-Augmented Generation (RAG) systems, currently lack a
       deterministic mechanism to verify the canonical identity of a web
       domain's operator.  This "Identity Gap" results in attribution loss
       and prevents the automated verification of authority and expertise
       signals.  This document defines the Semantic Anchor: a protocol-level
       orchestration of a domain-root, machine-readable JSON-LD identity
       node discoverable via predictable endpoints.  It establishes a stable
       identity layer and a "Root of Trust" for AI-to-site interactions.</p>
