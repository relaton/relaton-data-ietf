abstract:
- language: en
  script: Latn
  content: |-
    <p>An IPv6 Router Advertisements flooding attack can cause a node to
       consume all CPU resources available making the system unusable and
       unresponsive. This document recommends some configurable variables as
       a mitigation against an IPv6 Router Advertisements flooding attack.</p>
