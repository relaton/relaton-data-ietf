abstract:
- language: en
  script: Latn
  content: |-
    <p>The DKIM protocol applies a cryptographic signature to an e-mail
       message.  This specification defines a DKIM-like signature that
       includes the specification of external conditions that must be
       satisfied for a signature to be valid.</p>
