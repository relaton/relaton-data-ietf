abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo introduces TLS extensions and a DNS Resource Record Type
       that can be used to protect attackers from obtaining the value of the
       Server Name Indication extension being transmitted over a Transport
       Layer Security (TLS) version 1.3 handshake.</p>
