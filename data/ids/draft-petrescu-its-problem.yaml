  content: |-
    <p>Two vehicle-to-vehicle communications use cases are discussed, namely
       Cooperative Adaptive Cruise Control (C-ACC) and Platooning.  For
       these two use cases, the problems are identified that pertain to
       development with Internet protocols and connectivity.</p>
