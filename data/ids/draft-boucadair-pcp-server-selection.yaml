abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the behavior to be followed by the PCP Client
       to contact its PCP Server(s) when one or several PCP Names are
       configured.  Multiple Names may be configured to a PCP Client in some
       deployment contexts such as multi-homing.</p>
