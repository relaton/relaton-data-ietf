abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a proposed Kerberos Security Model (KSM) for
    SNMP version 3 for use in the SNMP architecture [RFC2271].  It
    defines the Elements of Procedure for providing SNMP message level
    security with Kerberos [RFC1510].</p>
