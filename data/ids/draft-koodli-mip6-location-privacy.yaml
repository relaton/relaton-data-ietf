abstract:
- language: en
  script: Latn
  content: |-
    <p>In this document, we discuss Location Privacy as applicable to IP
       Mobility.  We discuss two problems:  disclosing a new IP address to a
       correspondent, and revealing a fixed identity to an eavesdropper.  We
       document some of the previous discussion on possible solutions.</p>
