title:
- language: en
  script: Latn
  content: 'Service Function Chaining: Subscriber and Service Identification Use Cases
    and Variable-Length NSH Context Headers'
docidentifier:
- content: draft-sarikaya-sfc-hostid-serviceheader
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document discusses how to inform Service Functions about
       service- and subscriber-related information for the sake of policy
       enforcement and appropriate SFC-inferred forwarding.  Once the
       information is consumed by SFC-aware elements of an SFC-enabled
       domain, it is stripped from packets when they leave the SFC-enabled
       domain.  Thus privacy-sensitive information is not leaked outside the
       domain.</p>
