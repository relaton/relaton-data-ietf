title:
- language: en
  script: Latn
  content: Carrying Network Resource (NR) related Information in IPv6 Extension Headers
docidentifier:
- content: draft-ietf-6man-enhanced-vpn-vtn-id
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Virtual Private Networks (VPNs) provide different customers with
       logically separated connectivity over a common network
       infrastructure.  With the introduction of 5G and also in some
       existing network scenarios, some customers may require network
       connectivity services with features that are more advanced compared
       to conventional VPN services.  Such kind of network service is called
       enhanced VPNs.  Enhanced VPNs can be used, for example, to deliver
       network slice services.

       A Network Resource Partition (NRP) is a subset of the network
       resources and associated policies on each of a connected set of links
       in the underlay network.  An NRP may be used as the underlay to
       support one or a group of enhanced VPN services.  For packet
       forwarding within a specific NRP, some fields in the data packet
       (these fields are called the NRP Selector) are used to identify the
       NRP to which the packet belongs.  By identifying a packet with an
       NRP, NRP-specific processing can be performed on each node along the
       forwarding path in the NRP.

       This document specifies a new IPv6 Hop-by-Hop option to carry Network
       Resource related information in data packets.  The new option is
       called the Network Resource (NR) Option.  It can be used to carry an
       identifier of the NRP Selector, but it is designed to also be able to
       carry general information about network resource semantics and
       functions.</p>
