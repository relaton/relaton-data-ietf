- language: en
  script: Latn
  content: PCEP Extensions for MPLS-TE LSP Automatic Bandwidth Adjustment with Stateful
    PCE
docidentifier:
- content: draft-dhody-pce-stateful-pce-auto-bandwidth
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The Path Computation Element Communication Protocol (PCEP) provides
       mechanisms for Path Computation Elements (PCEs) to perform path
       computations in response to Path Computation Clients (PCCs) requests.
        The stateful PCE extensions allow stateful control of Multi-Protocol
       Label Switching (MPLS) Traffic Engineering Label Switched Paths (TE
       LSPs) using PCEP.

       This document describes PCEP extensions for automatic bandwidth
       adjustment when employing an Active Stateful PCE for both PCE-
       initiated and PCC-initiated LSPs.</p>
