abstract:
- language: en
  script: Latn
  content: |-
    <p>Slicing at the transport network is expected to be offered as part of
       end-to-end network slices, fostered by the introduction of new
       services such as 5G.  This document explores the usage of intent
       technologies for requesting IETF network slices.</p>
