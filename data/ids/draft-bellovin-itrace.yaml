abstract:
- language: en
  script: Latn
  content: |-
    <p>It is often useful to learn the path that packets take through the
    Internet,  especially when dealing with certain denial-of-service
    attacks.  We propose a new ICMP [RFC792] message, emitted randomly by
    routers along the path and sent to the destination.</p>
