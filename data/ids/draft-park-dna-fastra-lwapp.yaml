abstract:
- language: en
  script: Latn
  content: "<p>To provide fast handover in mobile environment, mobile node has to
    \ndiscover neighbor router in visited network because of configuring \nnew IPv6
    address as care-of address.  This document proposes new \nmethod so as to reduce
    time delay when mobile node moves to a new \nlink particularly supporting LWAPP.
    \ This extension is targeted to \nDetecting Network Attachment (DNA) as well as
    to LWAPP.</p>"
