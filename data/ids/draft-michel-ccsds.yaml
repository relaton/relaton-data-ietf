  content: |-
    <p>This Internet Draft proposes a charter for an 'Internet Protocol over
    CCSDS-based link layers' working group.  The Consultative Committee
    for Space Data Systems (CCSDS) represents an international body of
    organizations dedicated to standardizing the various aspects of
    space-based communication.</p>
