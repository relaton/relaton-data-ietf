abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the TCP/UDP port extension (EPORT) model to
       enhance Network Address Translation (NAT)capability.  EPORT based NAT
       helps service provider and enterprise to save mass public IPv4
       addresses with enough application sessions offered at same time.</p>
