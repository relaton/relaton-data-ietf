abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Max-Breadth mechanism for limiting the
       number of concurrent branches pursued for any given request.  This
       tool helps protect against certain amplification attacks that
       leverage the Session Initiation Protocol's request forking mechanism.</p>
