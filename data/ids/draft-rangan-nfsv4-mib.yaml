abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines an experimental portion of the Management
    Information Base (MIB) for use with network management protocols in
    the Internet Community.  In particular, it defines objects used for
    the management of NFS version 4 Protocol (NFSv4) implementations.</p>
