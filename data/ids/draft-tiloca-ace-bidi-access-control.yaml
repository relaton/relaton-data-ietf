abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates the Authentication and Authorization for
       Constrained Environments (ACE) framework, for which it defines a
       method to enforce bidirectional access control by means of a single
       access token.  Therefore, this document updates RFC 9200.</p>
