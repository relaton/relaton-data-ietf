id: draftietfdnsopcompactdenialofexistence
schema_version: v1.5.6
formattedref:
  content: draft-ietf-dnsop-compact-denial-of-existence
title:
- language: en
  script: Latn
  content: Compact Denial of Existence in DNSSEC
docidentifier:
- content: draft-ietf-dnsop-compact-denial-of-existence
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a technique to generate a signed DNS response
       on demand for a non-existent name by claiming that the name exists
       but doesn't have any data for the queried record type.  Such answers
       require only one minimally covering NSEC or NSEC3 record, allow
       online signing servers to minimize signing operations and response
       sizes, and prevent zone content disclosure.

       This document updates RFC 4034 and 4035.</p>
