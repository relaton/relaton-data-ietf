abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an experimental header format for CCN
       packets.  The header is composed of a set fixed size fields followed
       by a set of Type-Length-Value fields in order to define a flexible,
       compact and easy to parse packet format for the CCN protocol.</p>
