abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a microTap segment that can be used to
       instruct a transit node to make a copy of a segment-routed packet and
       deliver it to a specified node for the purpose of network monitoring,
       trouble shooting, or lawful intercept.</p>
