abstract:
- language: en
  script: Latn
  content: |-
    <p>In some Softwire mechanisms, multiple Customer Edge (CE) devices can
       share the same IPv4 address by using different port sets.  This
       document describes a problem of the IPv4 communication between
       Softwire CEs with the same IPv4 address.</p>
