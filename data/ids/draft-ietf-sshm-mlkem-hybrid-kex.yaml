  content: PQ/T Hybrid Key Exchange with ML-KEM in SSH
docidentifier:
- content: draft-ietf-sshm-mlkem-hybrid-kex
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines Post-Quantum Traditional (PQ/T) Hybrid key
       exchange methods based on the quantum-resistant Module-Lattice-Based
       Key-Encapsulation Mechanism (ML-KEM) standard and traditional
       Elliptic-curve Diffie–Hellman (ECDH) key exchange schemes.  These
       methods are defined for use in the SSH Transport Layer Protocol.</p>
