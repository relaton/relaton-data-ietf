abstract:
- language: en
  script: Latn
  content: "<p>This draft describes an architecture for secure inter-domain routing
    \n(BGP [RFC4271]). The architecture consists of components (i.e. \nfunctional
    modules) which address the requirements mentioned in \n[REQUIREMENT]. The draft
    describes interfaces (i.e. security services) \nthat the architecture provides
    to routing engine as well.</p>"
