abstract:
- language: en
  script: Latn
  content: |-
    <p>The 505 (HTTP Version Not Supported) status code does not clearly
       indicate, on its own, the scope of the assertion, nor the version(s)
       supported.  This document introduces a new header field, "Over-
       Version", to indicate this information.</p>
