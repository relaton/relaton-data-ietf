abstract:
- language: en
  script: Latn
  content: "<p>BGP specification [RFC4271] prescribes 'BGP next-hop reachability'
    as \n   one of the key 'Route Resolvability Condition' that must be satisfied
    \n   before the BGP bestpath candidate selection. This condition, however, \n
    \  may not be sufficient (as explained in the Appendix section) and \n   desire
    further granularity.</p>"
