abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an extension to the Extensible Provisioning
       Protocol ([STD69]) which allows clients to provision DELEG records
       for domain names.

    About this draft

       This note is to be removed before publishing as an RFC.

       The source for this draft, and an issue tracker, may can be found at
       https://github.com/gbxyz/epp-deleg-extension.</p>
