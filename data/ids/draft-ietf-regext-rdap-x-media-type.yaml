- content: draft-ietf-regext-rdap-x-media-type
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new parameter for the RDAP media type that
       can be used to describe RDAP content with RDAP extensions.
       Additionally, this document describes the usage of this parameter
       with RDAP for the purposes of signalling RDAP extensions during
       content negotiation.</p>
