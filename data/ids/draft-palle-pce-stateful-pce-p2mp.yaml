title:
- language: en
  script: Latn
  content: Path Computation Element (PCE) Protocol Extensions for Stateful PCE usage
    for Point-to-Multipoint Traffic Engineering Label Switched Paths
docidentifier:
- content: draft-palle-pce-stateful-pce-p2mp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The Path Computation Element (PCE) has been identified as an
       appropriate technology for the determination of the paths of point-
       to-multipoint (P2MP) TE LSPs.  This document provides extensions
       required for Path Computation Element communication Protocol (PCEP)
       so as to enable the usage of a stateful PCE capability in supporting
       P2MP TE LSPs.</p>
