abstract:
- language: en
  script: Latn
  content: "<p>This document tracks the use of the terms Fair and Open as used in
    \nRFC2026, and their impact on the processes of the IETF Operations. \nIt also
    summarizes a set of requirements for other changes to the \ngovernance models
    so stay in concert with the concept that the \nETF’s processes be fair and open.</p>"
