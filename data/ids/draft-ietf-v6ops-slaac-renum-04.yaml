abstract:
- language: en
  script: Latn
  content: |-
    <p>In scenarios where network configuration information related to IPv6
       prefixes becomes invalid without any explicit signaling of that
       condition (such as when a CPE crashes and reboots without knowledge
       of the previously-employed prefixes), nodes on the local network will
       continue using stale prefixes for an unacceptably long time (on the
       order of several days), thus resulting in connectivity problems.
       This document documents this issue and discusses operational
       workarounds that may help to improve network robustness.
       Additionally, it highlights areas where further work may be needed.</p>
