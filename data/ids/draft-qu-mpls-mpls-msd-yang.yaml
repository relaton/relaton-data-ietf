  content: A YANG Model for MPLS MSD
docidentifier:
- content: draft-qu-mpls-mpls-msd-yang
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data module augmenting the IETF MPLS
       YANG model to provide support for MPLS Maximum SID Depths (MSDs) as
       defined in RFC 8476 and RFC 8491.</p>
