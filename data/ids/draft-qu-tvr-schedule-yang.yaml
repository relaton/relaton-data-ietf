abstract:
- language: en
  script: Latn
  content: |-
    <p>The YANG model in this document specifies a recurring schedule for
       changing the attributes of resources that are defined in other YANG
       data models.  An example use case augmentation is also included,
       i.e., using the schedule to change the OSPF interface metric.</p>
