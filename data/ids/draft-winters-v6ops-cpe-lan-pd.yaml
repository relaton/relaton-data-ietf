abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines requirements for IPv6 CE Routers to support
       DHCPv6 Prefix Delegation for redistributing any unused prefix(es)
       that were delegated to the IPv6 CE Router.  This document updates RFC
       7084.</p>
