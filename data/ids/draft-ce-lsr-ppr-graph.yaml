abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a graph structure for the Preferred Path Route
       (PPR) for IS-IS, OSPFv2 and OSPFv3 protocols.  This structure helps
       further scale of the PPR and reduce domain level global entries
       needed in some data planes.</p>
