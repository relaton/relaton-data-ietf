abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new AXFR message type for DNS NOTIFY
       messages, together with an accompanying subtype for the ZONEVERSION
       EDNS(0) option.  The message instructs a secondary server to perform
       an AXFR zone transfer of a zone.</p>
