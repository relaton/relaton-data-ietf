abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a method for adding explicit replay
    protection to IKE messages by altering the use of the message id in
    the ISAKMP header.
    We suggest that this change could be applied as part of the next
    revision of IKE.</p>
