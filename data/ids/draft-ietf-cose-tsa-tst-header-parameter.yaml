title:
- language: en
  script: Latn
  content: COSE Header parameter for RFC 3161 Time-Stamp Tokens
docidentifier:
- content: draft-ietf-cose-tsa-tst-header-parameter
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines two CBOR Signing And Encrypted (COSE) header
       parameters for incorporating RFC 3161-based timestamping into COSE
       message structures (COSE_Sign and COSE_Sign1).  This enables the use
       of established RFC 3161 timestamping infrastructure in COSE-based
       protocols.</p>
