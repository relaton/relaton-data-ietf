abstract:
- language: en
  script: Latn
  content: |-
    <p>This internet draft recommends modifications to Phase 1 IKE that will
    minimize code changes. We recommend simplification by removing some
    of the options, and minimal changes, when they provide a large
    increase in functionality, in the remaining portions of IKE.</p>
