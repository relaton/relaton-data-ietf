abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces new extensions to router advertisement and
       router solicitation messages.  The extensions are used to provide a
       mobile node's deprecated network prefix information to an access
       router.  This document updates [RFC4861].</p>
