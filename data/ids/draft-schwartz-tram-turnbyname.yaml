abstract:
- language: en
  script: Latn
  content: |-
    <p>When tunneling traffic through TURN, a client may sometimes desire to
       contact a remote endpoint that it knows by its DNS name, not its IP
       address.  This document describes an extension to TURN that allows
       such a client to contact a named endpoint.</p>
