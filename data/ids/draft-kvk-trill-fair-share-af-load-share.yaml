abstract:
- language: en
  script: Latn
  content: |-
    <p>In an access LAN of a TRILL campus, the DRB can choose to load share
       the AF responsibility among other RBridges in the LAN. This document
       throws light on one such approach where the AF appointment is fair
       share scheduled among the RBridges.</p>
