abstract:
- language: en
  script: Latn
  content: |-
    <p>This document adds a liveness protocol to PSC which provides
       functionality similar to APS's EXER command.  It also provides some
       rules for processing TLVs in PSC messages which apply to all future
       uses of PSC TLVs.</p>
