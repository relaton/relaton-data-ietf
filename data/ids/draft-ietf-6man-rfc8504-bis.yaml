  content: IPv6 Node Requirements
docidentifier:
- content: draft-ietf-6man-rfc8504-bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines requirements for IPv6 nodes.  It is expected
       that IPv6 will be deployed in a wide range of devices and situations.
       Specifying the requirements for IPv6 nodes allows IPv6 to function
       well and interoperate in a large number of situations and
       deployments.

       This document obsoletes RFC 8504, and in turn RFC 6434 and its
       predecessor, RFC 4294.</p>
