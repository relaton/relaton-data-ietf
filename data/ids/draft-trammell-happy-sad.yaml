abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies Slow Alternate Detection (SAD) for Happy
       Eyeballs, an ICMP-based advisory path signal [RFC8558] for exposing
       information about path non-selection on-path devices in order to aid
       debugging and measurement of Happy Eyeballs.</p>
