abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a XML DTD suitable for describing application
    configuration information or modifications made to configuration information.
    The file format is typically used to import and export configuration information between ACAP servers, or to describe a set of changes which are to be applied to a ACAP database or a set of ACAP databases.</p>
