abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes a Real-time Transport Protocol (RTP) payload
       format for TTML, an XML based timed text format for live and file
       based workflows from W3C.  This payload format is specifically
       targeted at live workflows using TTML.</p>
