abstract:
- language: en
  script: Latn
  content: |-
    <p>ssmping is a tool that is used to check whether one can receive SSM,
       as well as obtaining some additional information. ssmping requires
       both a client and a server supporting the ssmping protocol to work.
       We here specify this protocol.</p>
