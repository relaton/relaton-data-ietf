abstract:
- language: en
  script: Latn
  content: "<p>This document specifies extensions to the OSPF routing protocol in
    \nsupport of carrying link state information for abstracted transport \nplane
    sub-networks and external addresses in an optical network. For \nthis purpose,
    new TLV triplets for OSPF TE LSA are defined.</p>"
