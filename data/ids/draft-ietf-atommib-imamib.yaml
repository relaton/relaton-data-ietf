abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
       for use with network management protocols in the Internet community.
       In particular, it describes objects used for managing IMA (Inverse
       Multiplexing for ATM) interface type in accordance with [ATM Forum
       IMA 1.1].</p>
