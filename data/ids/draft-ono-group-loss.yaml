    <p>This memo defines several metrics for loss of grouped packets across
       Internet paths. It builds on notions introduced and discussed in the
       IPPM Framework document (currently ''Framework for IP Performance
       Metrics'' &lt;draft-ietf-ippm-framework-01.txt&gt;); the reader is assumed
       to be familiar with that document.</p>
