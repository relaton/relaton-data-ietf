abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a system for the forwarding of encrypted HTTP
       messages.  This allows a client to make multiple requests of a server
       without the server being able to link those requests to the client or
       to identify the requests as having come from the same client.</p>
