abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a new certificate type and a TLS extension
       for authentication with ECCSI public keys in Transport Layer Security
       (TLS).  The new certificate type allows ECCSI public keys to be used
       for mutual authentication over TLS protocol.</p>
