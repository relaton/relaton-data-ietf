abstract:
- language: en
  script: Latn
  content: |-
    <p>The Mathematical Mesh 'The Mesh' is an end-to-end secure
       infrastructure that facilitates the exchange of configuration and
       credential data between multiple user devices.  This document
       describes how Mesh profiles are stored for application access on
       Windows, Linux and OSX platforms.

       This document is also available online at
       http://prismproof.org/Documents/draft-hallambaker-mesh-platform.html.</p>
