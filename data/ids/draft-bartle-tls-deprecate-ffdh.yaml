abstract:
- language: en
  script: Latn
  content: |-
    <p>This document deprecates the use of finite field Diffie Hellman
       cipher suites and discourages the use of elliptic curve Diffie
       Hellman cipher suites, both of which have known vulnerabilities or
       improper security properties when implemented incorrectly.</p>
