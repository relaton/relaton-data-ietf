abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a new chunk type, several parameters and
       procedures for SCTP.  This new chunk type can be used to authenticate
       SCTP chunks by using a shared key between the sender and receiver.
       The new parameters are used to establish the shared key.</p>
