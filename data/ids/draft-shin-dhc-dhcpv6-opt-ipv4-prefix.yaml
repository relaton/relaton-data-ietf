  content: |-
    <p>This document describes new options for Dynamic Host Configuration
         Protocol (DHCP)  version 6 that provide a mechanism for the
         delegation of IPv4 prefixes.  Through these options, a delegating
         router can delegate IPv4 prefixes to authorized requesting devices.</p>
