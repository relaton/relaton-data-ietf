abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the use of TLS Application-Level Protocol
       Settings (ALPS) in HTTP/2 and HTTP/3.  Additionally, it defines a set
       of additional HTTP SETTINGS parameters that would normally be
       impractical without ALPS.</p>
