id: draftietfjmapblob
schema_version: v1.5.6
formattedref:
  content: draft-ietf-jmap-blob
title:
- language: en
  script: Latn
  content: JMAP Blob management extension
docidentifier:
- content: draft-ietf-jmap-blob
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The JMAP base protocol (RFC8620) provides the ability to upload and
       download arbitrary binary data via HTTP POST and GET on defined
       endpoint.  This binary data is called a "blob".

       This extension adds additional ways to create and access blobs, by
       making inline method calls within a standard JMAP request.

       This extension also adds a reverse lookup mechanism to discover where
       blobs are referenced within other data types.</p>
