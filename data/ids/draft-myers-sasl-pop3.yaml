abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the optional AUTH command to POP3 [POP3], for
       indicating an authentication mechanism to the server, performing an
       authentication protocol exchange, and optionally negotiating a
       security layer for subsequent protocol interactions.  This extension
       is a profile of the Simple Authentication and Session Layer [SASL].</p>
