abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a method for securely associating link-layer
       addresses (MAC) to the IPv6 address by a cryptography method similar
       to blockchain mining.
       It permits guarantee security at the IPv6 layer to the same degree
       as at the link layer (that node is dependent on anyway).</p>
