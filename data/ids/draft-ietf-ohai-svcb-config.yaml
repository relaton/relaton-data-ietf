  content: Discovery of Oblivious Services via Service Binding Records
docidentifier:
- content: draft-ietf-ohai-svcb-config
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a parameter that can be included in SVCB and
       HTTPS DNS resource records to denote that a service is accessible
       using Oblivious HTTP, by offering an Oblivious Gateway Resource
       through which to access the target.  This document also defines a
       mechanism to learn the key configuration of the discovered Oblivious
       Gateway Resource.</p>
