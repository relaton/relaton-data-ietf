  content: IPv6 CE Routers LAN DHCPv6 Prefix Delegation
docidentifier:
- content: draft-ietf-v6ops-cpe-lan-pd
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines requirements for IPv6 Customer Edge (CE)
       routers to support DHCPv6 Prefix Delegation for distributing
       available prefixes that were delegated to a IPv6 CE router.  This
       document updates RFC 7084.</p>
