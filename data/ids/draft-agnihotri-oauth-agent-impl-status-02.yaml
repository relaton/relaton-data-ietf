abstract:
- language: en
  script: Latn
  content: |-
    <p>This document reports an open-source implementation of two OAuth
       Working Group draft specifications: cross-domain identity chaining
       and transaction tokens.  For each draft, this report maps every
       normative section to the corresponding source location in the
       implementation under test, summarises the test surface that exercises
       the section, and records one open-issue candidate per parent draft.
       The report is prepared in accordance with RFC 7942 and is intended
       for use by the editors of the two parent drafts.</p>
