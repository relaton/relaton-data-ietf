abstract:
- language: en
  script: Latn
  content: "<p>[STANDBY] has discussed how to achieve load-balancing among a group
    \n of NAT64 devices. However, it doesn't explore the issues with \n achieving
    load-balancing with load-balancers. In this memo, we \n propose our investigation
    on this topic.</p>"
