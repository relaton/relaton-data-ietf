- language: en
  script: Latn
  content: |-
    <p>This document defines a "problem detail" as an extensible way to
       carry machine-readable details of errors in a HTTP response, to avoid
       the need to invent new response formats for HTTP APIs.

    Note to Readers

       This draft should be discussed on the apps-discuss mailing list [1].</p>
