  script: Latn
  content: IGMP and MLD Snooping Yang Module Extension for L2VPN
docidentifier:
- content: draft-ietf-pim-igmp-mld-snooping-yang-l2vpn-ext
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Internet Group Management Protocol (IGMP) and Multicast Listener
    Discovery (MLD) Snooping could be used in both bridge service and L2VPN
    service. The old ietf-igmp-mld-snooping yang module just describes the
    bridge service. In this document we extend the existing ietf-igmp-mld-
    snooping yang module and make it could be used in L2VPN service.</p>
