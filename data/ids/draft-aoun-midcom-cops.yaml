- language: en
  script: Latn
  content: "<p>This draft discusses the applicability of the COPS protocol as the
    \nMIDCOM protocol, in the context of the current protocol evaluations \nwithin
    the MIDCOM working group. \nIt discusses the architectural similarities between
    COPS and Midcom \nand how COPS meets most of the MIDCOM protocol requirements.</p>"
