abstract:
- language: en
  script: Latn
  content: |-
    <p>This document clarifies that the EVPN route Next Hop encoding is
       unaffected by whether the underlying BGP session is IPv4 or IPv6.

       From that perspective, this document updates the EVPN specification
       to provide more comprehensive documentation of the encoding.</p>
