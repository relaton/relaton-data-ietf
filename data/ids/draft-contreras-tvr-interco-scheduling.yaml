abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the applicability of Time-Variant Routing
       (TVR) information in interconnection scenarios.  In particular, it
       discusses how scheduled changes affecting BGP sessions, routing
       policies, and effective interconnection capacity between
       administrative domains can be applied.</p>
