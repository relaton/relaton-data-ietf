id: draftietfquicmultipath
schema_version: v1.5.6
formattedref:
  content: draft-ietf-quic-multipath
title:
- language: en
  script: Latn
  content: Managing multiple paths for a QUIC connection
docidentifier:
- content: draft-ietf-quic-multipath
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a multipath extension for the QUIC protocol
       to enable the simultaneous usage of multiple paths for a single
       connection.  It introduces explicit path identifiers to create,
       delete, and manage multiple paths.  This document does not specify
       address discovery or management, nor how applications using QUIC
       schedule traffic over multiple paths.</p>
