abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes two new TLVs within the body of the OSPF
       Router Information (RI) Opaque LSA, called Routable IPv4 Address TLV
       and Routable IPv6 Address TLV.  Here the term OSPF means both OSPFv2
       and OSPFv3.</p>
