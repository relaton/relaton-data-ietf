abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes adding directory delegations and notifications
       to NFS Version 4 [RFC3530]. It is hoped that these changes will be
       part of a new minor version of NFS, such as NFSv4.1.</p>
