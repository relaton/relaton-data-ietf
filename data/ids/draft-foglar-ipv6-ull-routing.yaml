title:
- language: en
  script: Latn
  content: IPv6 Source Routing for ultralow Latency
docidentifier:
- content: draft-foglar-ipv6-ull-routing
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This Internet-Draft describes a hierarchical addressing scheme
      for IPv6, intentionally very much simplified to allow for ultralow
      latency source routing experimentation using simple forwarding
      nodes. The "6Tree" Network based on this addrssing scheme is
      described as well as possible applications.</p>
