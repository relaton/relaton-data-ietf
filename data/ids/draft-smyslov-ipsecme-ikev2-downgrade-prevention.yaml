abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an extension to the Internet Key Exchange
       protocol version 2 (IKEv2) that aims to prevent some kinds of
       downgrade attacks on this protocol by having the peers confirm they
       have participated in the same conversation.</p>
