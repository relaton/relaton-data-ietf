abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a mapping of the Stream Control Transmission
    Protocol [SCTP] into a sockets API. The benefits of this mapping
    include compatibility for TCP applications, access to new SCTP
    features and a consolidate error and event notification scheme.</p>
