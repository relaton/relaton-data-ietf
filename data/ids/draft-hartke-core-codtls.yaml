abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft considers some obstacles in implementing Datagram
       Transport Layer Security (DTLS) in constrained environments, and
       presents some ideas for a constrained version of DTLS that is
       friendly to constrained nodes and networks.</p>
