  content: |-
    <p>This memo evaluates a method called 'auto-transition' to ensure that
       any device can obtain IPv6 connectivity at any time and whatever
       network is attached to, even if such network is connected to Internet
       only with IPv4 or already offers IPv6 but with poor performance.</p>
