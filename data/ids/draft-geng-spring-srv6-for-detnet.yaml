  content: |-
    <p>Deterministic Networking provides service with low jitter, bounded
       latency and low loss rate, using technologies of explicit route,
       resource reservation and service protection.This document specifies
       how to implement Deterministic Networking (DetNet) in a SRv6 Network.</p>
