abstract:
- language: en
  script: Latn
  content: |-
    <p>The behaviour that must be followed when an route distinguisher (RD)
       of value zero is received is not clearly defined in rfc4364. This
       document clarifies the use of an RD with a value of zero in the
       context defined in rfc 4364.</p>
