title:
- language: en
  script: Latn
  content: Bootstrapping TLS Encrypted ClientHello with DNS Service Bindings
docidentifier:
- content: draft-ietf-tls-svcb-ech
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>To use TLS Encrypted ClientHello (ECH) the client needs to learn the
       ECH configuration for a server before it attempts a connection to the
       server.  This specification provides a mechanism for conveying the
       ECH configuration information via DNS, using a SVCB or HTTPS resource
       record (RR).</p>
