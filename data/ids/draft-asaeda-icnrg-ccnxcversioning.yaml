abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a method for content versioning in CCNx,
       enabling the differentiation of content sharing the same name using
       version numbers.  This document updates RFC8569 [RFC8569] and RFC8609
       [RFC8609].</p>
