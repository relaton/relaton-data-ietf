abstract:
- language: en
  script: Latn
  content: |-
    <p>The Point-to-Point Protocol (PPP) [1] provides a standard method for
    transporting multi-protocol datagrams over point-to-point links.
    This document describes the use of ATM Adaptation Layer 2 (AAL2) for
    framing PPP encapsulated packets.</p>
