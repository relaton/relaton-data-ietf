abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a procedure for augmenting the authenticated
       Diffie-Hellman key exchange EDHOC with third party assisted
       authorization targeting constrained IoT deployments (RFC 7228).

    Note to Readers

       Source for this draft and an issue tracker can be found at
       https://github.com/EricssonResearch/ace-ake-authz
       (https://github.com/EricssonResearch/ace-ake-authz).</p>
