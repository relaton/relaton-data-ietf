abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes modifications to LDAP version 3[1] to allow
    transport of a subset of the LDAP protocol over connection-less
    transport. The case of UDP/IP is covered in detail in this memo but
    other transport layers are possible.</p>
