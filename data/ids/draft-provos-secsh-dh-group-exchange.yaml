abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes a new key exchange method for the SSH protocol.
    It allows the SSH server to propose to the client new groups on which
    to perform the Diffie-Hellman key exchange.  The proposed groups need
    not be fixed and can change with time.</p>
