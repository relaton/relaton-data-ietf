abstract:
- language: en
  script: Latn
  content: |-
    <p>This document calls attention to the problem of delivering ICMPv6
       type 2 "Packet Too Big" (PTB) messages to intended destinations in
       ECMP load balanced, anycast network architectures.  It discusses
       operational mitigations that can address this class of failure.</p>
