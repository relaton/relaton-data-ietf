abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends the Automatic Certificate Management
       Environment (ACME) to provision X.509 certificates for local Internet
       of Things (IoT) devices that are accepted by existing web browsers
       and other software running on End User client devices.</p>
