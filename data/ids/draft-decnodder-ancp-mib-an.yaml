abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
       for use with network management protocols.  In particular it defines
       objects for managing access nodes as described in [ANCPFW] that are
       using the Access Node Control Protocol (ANCP) defined in [ANCPPR].</p>
