abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification updates current recommendation for the use of
       Transport Layer Security (TLS) protocol to provide confidentiality of
       email between a Mail User Agent (MUA) and a Mail Submission Server or
       Mail Access Server.  This document updates RFC8314.</p>
