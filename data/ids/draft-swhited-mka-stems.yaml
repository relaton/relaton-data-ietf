abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a multi-track profile of the Matroska container
       format for distributing stems.  It is intended to be used by DJ
       applications, Digital Audio Workstations, and multi-track recorders
       while remaining backwards compatible with existing media players.</p>
