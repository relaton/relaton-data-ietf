abstract:
- language: en
  script: Latn
  content: "<p>This document describe a new method for the Presence Server to \n   process
    presence in inter-domain scenarios. The currently-defined \n   method according
    to RFC 3261 [1] and RFC 3265 [2] results in \n   duplicated messaging. This document
    provides a new method to avoid \n   this duplication.</p>"
