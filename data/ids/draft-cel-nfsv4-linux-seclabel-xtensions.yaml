abstract:
- language: en
  script: Latn
  content: |-
    <p>NFS version 4.2 introduces an optional feature known as NFSv4
       Security Labels.  This document extends NFSv4 Security Labels to
       support Linux file capabilities and the Linux Integrity Measurement
       Architecture.</p>
