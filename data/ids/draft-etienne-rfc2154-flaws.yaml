abstract:
- language: en
  script: Latn
  content: |-
    <p>This text comments the security offered by RFC2154[1] 'OSPF with
    Digital Signatures' and shows it is insecure against insiders
    attacks. It is describes an experimental extension of OSPF to
    digitaly sign the LSAs.</p>
