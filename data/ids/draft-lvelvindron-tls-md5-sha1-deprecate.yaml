title:
- language: en
  script: Latn
  content: Deprecating MD5 and SHA-1 signature hashes in TLS 1.2
docidentifier:
- content: draft-lvelvindron-tls-md5-sha1-deprecate
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The MD5 and SHA-1 hashing algorithms are steadily weakening in
       strength and their deprecation process should begin for their use in
       TLS 1.2 digital signatures.  However, this document does not
       deprecate SHA-1 in HMAC for record protection.</p>
