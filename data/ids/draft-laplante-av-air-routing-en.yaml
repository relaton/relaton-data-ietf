  content: 'AV-AI.R: A.V.AN Vectorized Artificial Intelligence Routing -- Eco-Responsible
    Transmission of IP Packets between AI Agents via Carriers Augmented by Artificial
    Intelligence'
docidentifier:
- content: draft-laplante-av-air-routing-en
