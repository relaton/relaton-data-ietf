abstract:
- language: en
  script: Latn
  content: |-
    <p>The TCP Authentication Option (TCP-AO) relies on security algorithms
       to provide connection authentication between the two end-points.
       This document specifies how to use SHA-256 algorithm and attributes
       with TCP-AO.</p>
