- content: draft-ietf-6man-rfc3484-revise
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC 3484 describes algorithms for source address selection and for
       destination address selection.  The algorithms specify default
       behavior for all Internet Protocol version 6 (IPv6) implementations.
       This document specifies a set of updates that modify the algorithms
       and fix the known defects.</p>
