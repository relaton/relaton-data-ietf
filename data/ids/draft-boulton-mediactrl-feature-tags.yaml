abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a profile set of media feature tags that
    can be used with the Session Initiation Protocol (SIP).  The media
    feature tags allow a Media Server to communicate a basic set of media
    server capabilities that are supported to its Application Server.</p>
