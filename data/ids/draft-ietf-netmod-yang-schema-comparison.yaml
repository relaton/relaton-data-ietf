  content: YANG Schema Comparison
docidentifier:
- content: draft-ietf-netmod-yang-schema-comparison
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an algorithm for comparing two revisions of a
       YANG schema to determine the scope of changes and produce a list of
       the changes between the revisions.  The output of the algorithm can
       be used to help select an appropriate revision-label or YANG semantic
       version number for a new revision.  Included is also a YANG module
       describing the possible output of this algorithm.</p>
