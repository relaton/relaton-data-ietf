title:
- language: en
  script: Latn
  content: Updates to Lightweight OCSP Profile for High Volume Environments
docidentifier:
- content: draft-bonnell-rfc5019bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates RFC 5019 to allow OCSP clients to use SHA-256.
       An RFC 5019 compliant OCSP client is still able to use SHA-1, but the
       use of SHA-1 may become obsolete in the future.</p>
