abstract:
- language: en
  script: Latn
  content: "<p>Advances in the Optical Layer control plane is critical to ensure \ntremendous
    amount of bandwidth generated by the DWDM technology be \nprovided to upper layer
    services in a timely, reliable, and cost \neffective fashion. This document describes
    some unique features and \nrequirements for the Optical Layer control plane that
    protocol \ndesigners need to take into consideration</p>"
