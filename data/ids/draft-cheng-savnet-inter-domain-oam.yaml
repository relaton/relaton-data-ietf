abstract:
- language: en
  script: Latn
  content: |-
    <p>This document is a framework for how Source Address Validation
       (SAVNET) can be applied to operations and maintenance procedures for
       Inter-domain network.  The document is structured to outline how
       Operations and Management (OAM) functionality can be used to assist
       in fault, configuration, accounting, performance, and security
       management, commonly known by the acronym FCAPS.</p>
