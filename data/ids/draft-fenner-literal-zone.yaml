abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the format to be used when specifying a zone
       identifier with a literal IPv6 address in URIs and IRIs, and in SMTP
       and Internet Mail Messages.  While this combination is expected to be
       needed rarely, it is useful to specify the exact syntax.</p>
