  content: A Special Purpose TLD to resolve IPv4 Address Literal on DNS64/NAT64 environments
docidentifier:
- content: draft-osamu-v6ops-ipv4-literal-in-url
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>In an IPv6-only environment with DNS64/NAT64 based translation
       service, there is no way to get access a URL whose domain name part
       includes an IPv4 address literal.  This memo proposes a special
       purpose TLD so that the IPv4 address literal is accessible from such
       a DNS64/NAT64 environments.</p>
