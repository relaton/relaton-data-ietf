abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft gives a brief overview of some scenarios where IPsec [1]
    can be used as a tunneling mechanism in the context of provider
    provisioned virtual private networks (PPVPNs). It also suggests some
    areas where extensions to IPsec could be considered.</p>
