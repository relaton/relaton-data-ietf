abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines how to propagate trace context information
       across the Network Configuration Protocol (NETCONF), that enables
       distributed tracing scenarios.  It is an adaption of the HTTP-based
       W3C specification.</p>
