abstract:
- language: en
  script: Latn
  content: "<p>The Link Management Protocol (LMP) introduces one fast keep-alive \nmechanism.
    This document describes a mechanism that can be used to \nreduce processing overhead
    requirements of messages with keep-alive \ninformation, avoid that normal control
    messages are flooded by large \nnumbers of Hello messages or Hello messages are
    flooded by large \nnumbers of retransmitted control messages.</p>"
