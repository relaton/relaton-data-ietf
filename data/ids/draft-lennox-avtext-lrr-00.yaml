abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes the RTP Payload-Specific Feedback Message "Layer
       Refresh Request" (LRR), which can be used to request a state refresh
       of one or more substreams of a layered media stream.  It also defines
       its use with several scalable media formats.</p>
