abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes PINE, a Verifiable Distributed Aggregation
       Function (VDAF) for secure aggregation of high-dimensional, real-
       valued vectors with bounded L2-norm.  PINE is intended to facilitate
       private and robust federated machine learning.</p>
