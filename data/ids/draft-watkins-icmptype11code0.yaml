abstract:
- language: en
  script: Latn
  content: |-
    <p>When performing a traceroute, it would be useful to know where
       packets are trying to go when they cannot be routed.  ICMP Type 11
       Code 0 packets could be used to provide this information, and the
       traceroute facility could report this information.</p>
