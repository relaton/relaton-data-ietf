abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an Extensible Provisioning Protocol (EPP)
       extension mapping for the provisioning and management of
       transformation (i.e. translation and transliteration) of contact
       information for objects stored in a shared central repository.
       Specified in XML, this mapping extends the EPP contact mapping.</p>
