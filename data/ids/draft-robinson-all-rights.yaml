title:
- language: en
  script: Latn
  content: Why Is the IETF Trust Requiring "All Rights Reserved" When That Term Has
    Been Superfluous for Over 25 Years?
docidentifier:
- content: draft-robinson-all-rights
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document discusses the continued appearance of the phrase “All
       Rights Reserved” in IETF Trust copyright notices, despite the phrase
       no longer being required for copyright protection in many
       jurisdictions.  It asks whether the phrase serves a present legal or
       operational purpose in IETF documents, or whether it should be
       removed or replaced.</p>
