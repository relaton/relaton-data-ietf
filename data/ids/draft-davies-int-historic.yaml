id: draftdaviesinthistoric
schema_version: v1.5.6
formattedref:
  content: draft-davies-int-historic
title:
- language: en
  script: Latn
  content: Deprecating infrastructure "int" domains
docidentifier:
- content: draft-davies-int-historic
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The document deprecates the use of any "int" domain names that were
       designated for infrastructure purposes by the IETF, and identifies
       them for removal from the "int" top-level domain.  Any implementation
       that involves these domains should be considered deprecated.  This
       document also requests moving the status of RFC 1528 and RFC 1706 to
       historic.</p>
