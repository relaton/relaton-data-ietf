abstract:
- language: en
  script: Latn
  content: <p>This document updates RFC 2026 to no longer use STD 1 as a summary of
    "Internet Official Protocol Standards".  It obsoletes RFC 5000 and requests the
    IESG to move RFC 5000 (and therefore STD 1) to Historic status.</p>
