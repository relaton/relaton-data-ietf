  content: |-
    <p>This memo is an editorial update to [RFC 2445]. This memo corrects
    textual prose and ABNF syntatical errors found in the iCalendar RFC.
    The memo also clarifies ambiguous or inconsistent text. These changes
    are the result of implementation and interoperability testing
    experience.</p>
