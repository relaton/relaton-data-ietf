abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes the allocation of an “Ingress Replication BUM”
       flag in the VXLAN Flags IANA registry and defines its use in EVPN
       networks that employ VXLAN tunnels with ingress replication to
       forward broadcast, unknown and multicast traffic.</p>
