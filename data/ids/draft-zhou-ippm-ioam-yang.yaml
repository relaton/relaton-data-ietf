abstract:
- language: en
  script: Latn
  content: |-
    <p>In-situ Operations, Administration, and Maintenance (IOAM) records
       operational and telemetry information in user packets while the
       packets traverse a path between two points in the network.  This
       document defines a YANG module for the IOAM function.</p>
