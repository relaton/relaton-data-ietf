  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a SemiPrivateMessage for the Messaging Layer
       Security (MLS) protocol.  It allows members to share otherwise
       private commits and proposals with a designated list of external
       receivers rather than send these handshakes in a PublicMessage.</p>
