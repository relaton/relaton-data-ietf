abstract:
- language: en
  script: Latn
  content: |-
    <p>To accomplish the goal that not exposing redundant and unuseful CNAME
       chains in answers responded to clients, this document describes two
       new DNS resource records called "IDR" and "ADR" for hiding CNAME
       iterative process and better safety consideration.</p>
