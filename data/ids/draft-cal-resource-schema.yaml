abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification describes a schema for representing resources for
       calendaring and scheduling.  A resource in the scheduling context is
       any shared entity that can be scheduled by a calendar user, but does
       not control its own attendance status.</p>
