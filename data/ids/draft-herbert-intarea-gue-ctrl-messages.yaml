abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a set of basic control messages for
       Generic UDP Encapsulation (GUE). One pair of messages provides a
       means to query the GUE capabilities of a peer, another pair defines
       an echo request and response exchange for testing reachability.</p>
