abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a method to eliminate domain name 'spoofig'
    over SMTP by introducing a new DNS resource record (RR) [1] type   'MDO' that contains valid SMTP sending server for a specified DNS
    domain. In doing so it addresses section 7.1 of RFC 2821, 'Mail
    Security and Spoofing'.</p>
