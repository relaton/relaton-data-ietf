abstract:
- language: en
  script: Latn
  content: |-
    <p>This document reserves the IPv6 prefix 64:ff9b:1::/48 for local use
       with IPv4/IPv6 translation mechanisms.  It updates RFC6890 in order
       to reflect this reservation.</p>
