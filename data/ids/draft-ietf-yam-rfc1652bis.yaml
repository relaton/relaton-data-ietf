abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an extension to the SMTP service whereby an SMTP
    content body consisting of text containing octets outside of the US-ASCII octet
    range (hex 00-7F) may be relayed using SMTP. [STANDARDS-TRACK]</p>"
