abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how mLDP FECs can be encoded to support both
       service specific and shared multicast trees and describes the
       associated procedures for EVPN PEs. Thus, mLDP can implement
       multicast for EVPN.</p>
