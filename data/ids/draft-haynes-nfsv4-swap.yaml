id: drafthaynesnfsv4swap
schema_version: v1.5.6
formattedref:
  content: draft-haynes-nfsv4-swap
title:
- language: en
  script: Latn
  content: Adding an Atomic EXCHANGE_RANGE Operation to NFSv4.2
docidentifier:
- content: draft-haynes-nfsv4-swap
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The Network File System version 4.2 (NFSv4.2) does not provide
       support for atomic multi-block updates to file data.  This document
       introduces a new EXCHANGE_RANGE operation which provides for such
       atomic updates.  This document extends NFSv4.2 (see RFC7862).</p>
