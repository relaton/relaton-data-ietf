abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a design to support Explicit Congestion
       Notification (ECN) for the RTP layer.  The design defines a means of
       end-to-end negotiated support of ECN using the Session Description
       Protocol (SDP) and a new RTCP Extended Report.</p>
