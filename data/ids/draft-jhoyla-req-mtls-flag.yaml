abstract:
- language: en
  script: Latn
  content: |-
    <p>Normally in TLS there is no way for the client to signal to the
       server that it has been configured with a certificate suitable for
       mTLS.  This document defines a TLS Flag [I-D.ietf-tls-tlsflags] that
       enables clients to provide this hint.</p>
