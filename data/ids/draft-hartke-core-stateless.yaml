abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides considerations for alleviating CoAP clients
       and intermediaries of maintaining per-request state.  Additionally,
       it introduces a new, optional CoAP protocol extension for extended
       token lengths.

       This document updates RFCs 7252 and 8323.</p>
