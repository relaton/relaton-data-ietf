title:
- language: en
  script: Latn
  content: Carrying PIM-SM in ASM mode Trees over P2MP mLDP LSPs
docidentifier:
- content: draft-rekhter-mpls-pim-sm-over-mldp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>When IP multicast trees created by PIM-SM in Any Source Multicast
       (ASM) mode need to pass through an MPLS domain, it may be desirable
       to map such trees to Point-to-Multipoint Label Switched Paths. This
       document describes how to accomplish this in the case where such
       Point-to-Multipoint Label Switched Paths are established using mLDP.</p>
