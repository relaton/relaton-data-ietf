abstract:
- language: en
  script: Latn
  content: |-
    <p>Conference State Control Protocol (CSCP) is a means to modify the
       state in a conference service.  It extends the Binary Floor Control
       Protocol and adds commands to get, set, add, and delete fields in the
       conference state.</p>
