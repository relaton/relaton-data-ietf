abstract:
- language: en
  script: Latn
  content: |-
    <p>Sometimes it is necessary to discover the Start of Authority points
       in the DNS, otherwise known as zone cuts, without causing negative
       entries to be recorded in caches.  This document describes how to
       achieve this.</p>
