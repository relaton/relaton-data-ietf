- content: draft-ietf-httpapi-digest-fields-problem-types
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies HTTP problem types that servers can use in
       responses to problems encountered while dealing with a request
       carrying integrity fields and integrity preference fields.  Using an
       HTTP problem type, the server can provide machine-readable error
       details to aid debugging or error reporting.</p>
