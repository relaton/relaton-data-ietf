title:
- language: en
  script: Latn
  content: iCalendar Format Extensions for JSCalendar
docidentifier:
- content: draft-ietf-calext-icalendar-jscalendar-extensions
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a set of new elements for iCalendar and extends
       the use of existing ones.  Their main purpose is to extend the
       semantics of iCalendar with elements defined in JSCalendar, but the
       new definitions also aim to be useful within just the iCalendar
       format.  This document updates RFC 5545 ("iCalendar") and its
       extension documents RFC 7986 and RFC 9073.</p>
