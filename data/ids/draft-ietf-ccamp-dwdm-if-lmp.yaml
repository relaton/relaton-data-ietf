title:
- language: en
  script: Latn
  content: Extension to the Link Management Protocol (LMP/DWDM -rfc4209) for Dense
    Wavelength Division Multiplexing (DWDM) Optical Line Systems to manage the application
    code of optical interface parameters in DWDM application
docidentifier:
- content: draft-ietf-ccamp-dwdm-if-lmp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines extensions to LMP RFC4209 for managing Optical
       parameters associated with Wavelength Division Multiplexing (WDM)
       systems in accordance with the Interface Application Identifier
       approach defined in ITU-T Recommendation G.694.1 and its extensions.</p>
