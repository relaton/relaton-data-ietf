abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism to extend Unicast Reverse Path
    \nForwarding(uRPF). By associating an uRPF flag with a specific route, \nuRPF
    can be controlled in a finer granularity than traditional one. \nIt may be used
    to reduce the cost to network devices caused by uRPF.</p>"
