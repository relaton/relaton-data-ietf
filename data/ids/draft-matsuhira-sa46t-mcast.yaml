abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describe Stateless Automatic IPv4 over IPv6
       Encapsulation / Decapsutation Technology (SA46T) multicast support.
       IPv4 multicast is supported by SA46T with same manner with IPv4
       unicast.  SA46T multicast address prefix is defined.</p>
