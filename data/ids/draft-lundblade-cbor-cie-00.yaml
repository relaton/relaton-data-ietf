abstract:
- language: en
  script: Latn
  content: |-
    <p>CBOR allows variable serialization to accommodate varying use cases
       in constrained environments, but leaves it without a default
       interoperable serialization.  Here a base interoperability
       serialization is defined that should usable for a majority of CBOR
       based protocols.</p>
