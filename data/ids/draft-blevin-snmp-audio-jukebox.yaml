abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a set of extensions (protocol operations and
    textual conventions) to the existing SNMP framework architecture
    [RFC2571].  These extensions provide a mechanism for remote control
    of an audio jukebox-style device via the SNMP protocol.</p>
