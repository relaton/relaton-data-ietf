abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines textual conventions to represent the commonly used
    Virtual Local Area Network Identifier (VLAN-ID). The intent is that
    these textual conventions (TCs) will be imported and used in MIB
    modules that would otherwise define their own representations.</p>
