abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes Transport Layer Security (TLS) authentication
       using Raw-Public-Key and Pre-Shared-Key as new mechanisms for OAuth
       client authentication.  Although defined for TLS the mechanisms are
       equally applicable for DTLS.</p>
