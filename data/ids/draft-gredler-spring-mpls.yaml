abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how source/explicitly routed tunnels could be
       realized using stacked Label Switched Paths (LSPs).

       This document also describes how use of IS-IS/OSPF as a label
       distribution protocol fits into the MPLS architecture.</p>
