abstract:
- language: en
  script: Latn
  content: |-
    <p>Devices that connect to Captive Portals need a way to identify that
       the network is restricted and discover a method for opening up
       access.  This document defines how to use Provisioning Domain
       Additional Information to discover a Captive Portal API URI.</p>
