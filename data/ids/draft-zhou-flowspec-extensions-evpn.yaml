  content: |-
    <p>[RFC8955] defines BGP flow specification version 1 (FSv1) and
       [I-D.ietf-idr-flowspec-v2] defines BGP flow specification (FSv2)
       protocol.  This document proposes extensions to BGP Flow
       Specification Version 2 to support MPLS-based EVPN traffic filtering.</p>
