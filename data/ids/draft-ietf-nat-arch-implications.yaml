abstract:
- language: en
  script: Latn
  content: |-
    <p>In light of the growing interest in, and deployment of network
              address translation (NAT - RFC 1631), this document will present some
              highlights of the architectural implications. A reader is assumed to
              be well familiar with the principles of NAT operations [RFC1631].</p>
