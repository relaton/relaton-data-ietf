  content: Support for adjustable maximum router lifetimes per-link
docidentifier:
- content: draft-krishnan-6man-maxra
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The neighbor discovery protocol specifies the maximum time allowed
       between sending unsolicited multicast Router Advertisements from a
       router interface as well as the maximum router lifetime.  It also
       allows the limits to be overridden by link-layer specific documents.
       This document allows for overriding these values on a per-link basis.</p>
