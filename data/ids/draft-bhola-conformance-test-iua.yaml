abstract:
- language: en
  script: Latn
  content: "<p>This Internet Draft presents a test specification for RFC 3057 which
    \ndefines the ISDN Q.921-User Adaptation protocol along with \nIUA Outstanding
    Issues &lt;draft-ietf-sigtran-iua-imp-guide-01.txt&gt;.\nThis test specification
    can be used to test IUA implementations for\nconformance to the IUA protocol definition.\n\nNext
    revision of the draft will cover the additions done to the\nprotocol revision
    and any subsequent RFC published by IETF.</p>"
