abstract:
- language: en
  script: Latn
  content: "<p>This document defines a set of extended status codes for use within
    \nthe mail system for delivery status reports, tracking, and improved \ndiagnostics.
    \ The in combination with other information provided in \nthe DSN delivery report,
    these codes facilitate media and language \nindependent rendering of message delivery
    status.</p>"
