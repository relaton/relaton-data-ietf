abstract:
- language: en
  script: Latn
  content: |-
    <p>This document analyzes the technological gaps when using SD-WAN to
       interconnect workloads &amp; apps hosted in various locations,
       especially cloud data centers when the network service providers do
       not have or have limited physical infrastructure to reach the
       locations [Net2Cloud-problem].</p>
