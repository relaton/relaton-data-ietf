abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a method of encapsulating TCP protocol
       packets within UDP headers.  TCP-in-UDP is useful in situations where
       network capabilities specific to UDP can be leveraged for TCP
       packets.</p>
