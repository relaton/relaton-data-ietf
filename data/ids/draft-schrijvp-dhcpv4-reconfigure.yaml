abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft  defines  extensions  to  DHCP  [DHCP]  to  allow  dynamic
    reconfiguration  of  a  single  host  with  a new IP address. This is
    achieved by introducing  a  unicast  DHCP  FORCERENEW  message  which
    forces the client to the RENEW state.</p>
