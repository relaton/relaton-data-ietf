abstract:
- language: en
  script: Latn
  content: |-
    <p>The DHCPINFORM message within the DHCPv4 protocol has in operation
       diverged incompatibly from the current defined standard.  This
       document seeks to provide clarification of actual behaviour and
       guidance for some situations that were previously omitted.</p>
