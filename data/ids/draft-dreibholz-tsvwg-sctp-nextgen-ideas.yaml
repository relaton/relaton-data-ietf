abstract:
- language: en
  script: Latn
  content: |-
    <p>This document collects some ideas for a next generation of the Stream
       Control Transmission Protocol (SCTP) for further discussion.  It is a
       result of lessons learned from more than one decade of SCTP
       deployment.</p>
