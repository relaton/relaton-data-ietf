abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines new Protocol Data Units (PDUs) for use within
    the Simple Network Management Protocol (SNMP).  The goals of the new
    PDUs are to reduce packet sizes and to reduce processing overhead
    required at the Command Responder side of the protocol.</p>
