abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends RFC 5172 to signal the use of SCHC as the
       compression method between a pair of nodes over PPP.  Combined with
       RFC 2516, this enables the use of SCHC over Ethernet and Wi-Fi.</p>
