abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a format for Precise Priority-based Flow
       Control (PPFC) notifications within RoCEv2 (RDMA over Converged
       Ethernet version 2) networks.  The proposed format enables network
       devices experiencing congestion to generate explicit congestion
       signals that can be efficiently carried back to the source clients.
       This facilitates fast, fine-grained flow control, complementing
       traditional end-to-end congestion control and improving performance
       in high-throughput, low-latency environments.</p>
