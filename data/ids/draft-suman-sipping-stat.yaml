abstract:
- language: en
  script: Latn
  content: "<p>SIP has emerged as a popular protocol for session setup and \n   management.
    But feedback is an important attribute of any session.\n   The objective of this
    document is to provide a generic framework \n   which could be used by user agents
    to provide feedback about the\n   session when it terminates.</p>"
