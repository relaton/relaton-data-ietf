  content: Handing Over Child SAs Following Re-Authentication in IKEv2
docidentifier:
- content: draft-nir-ipsecme-cafr
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an extension to the IKEv2 protocol whereby
       Child SAs are moved to the new IKE SA following re-authentication.
       This allows for a smoother transition with no loss of connectivity.</p>
