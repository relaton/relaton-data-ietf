  content: |-
    <p>[I-D.ietf-dnsop-structured-dns-error] introduces structured error
       data for DNS responses that have been filtered.  This specification
       allows more specific details of filtering incidents to be conveyed.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/mnot/public-resolver-errors.</p>
