  content: CDNI Metadata for Delegated Credentials
docidentifier:
- content: draft-ietf-cdni-https-delegation-subcerts
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The delivery of content over HTTPS involving multiple Content
       Delivery Networks (CDNs) raises credential management issues.  This
       document defines metadata in the CDNI Control and Metadata interface
       to setup HTTPS delegation using delegated credentials from an
       Upstream CDN (uCDN) to a Downstream CDN (dCDN).</p>
