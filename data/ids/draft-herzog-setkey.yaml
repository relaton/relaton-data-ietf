abstract:
- language: en
  script: Latn
  content: |-
    <p>A set-key is a symmetric key (or set of keys) associated with an
       immutable set of participants.  This document defines a set-key
       attribute for use in the CMS-based symmetric-key package structure
       [RFC6031].</p>
