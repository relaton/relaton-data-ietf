abstract:
- language: en
  script: Latn
  content: |-
    <p>The INFO extention method for SIP is introduced in RFC2976 [1], which
    is base on RFC2543.  Since RFC2543 is obsoleted by RFC3261 [3], It is
    suggested to update RFC2976 to conform to RFC3261.</p>
