  content: |-
    <p>This document defines the Lightweight Directory Access Protocol (LDAP)
    Manage Directory Information Tree (DIT) Control which allows a
    directory user agent (a client) to request the directory service
    temporarily relax enforcement of constraints of the X.500 models.</p>
