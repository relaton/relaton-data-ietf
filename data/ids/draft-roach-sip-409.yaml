abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes an addition of a '409 Conflict' response code
    for the Session Initiation protocol.  This response code is required
    for a number of application-specific purposes, and is expected to be
    useful in future extensions to the protocol.</p>
