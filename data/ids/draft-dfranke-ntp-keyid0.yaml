abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo clarifies that when a Network Time Protocol Version 4
       packet has a keyid field of zero, the MAC is present solely to
       satisfy certain syntactic constraints, and is to be ignored.</p>
