  script: Latn
  content: Post-Quantum and Hybrid KEMs for HPKE with JOSE and COSE
docidentifier:
- content: draft-reddy-cose-jose-pqc-hybrid-hpke
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the use of Post-Quantum (PQC) and Post-
       Quantum/Traditional (PQ/T) Hybrid Key Encapsulation Mechanisms (KEMs)
       within the Hybrid Public Key Encryption (HPKE) for JOSE and COSE.  It
       defines algorithm identifiers and key formats to support pure post-
       quantum algorithms (ML-KEM) and their PQ/T hybrid combinations.</p>
