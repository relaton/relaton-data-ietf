  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an HTTP header field that can be added to a
       response to indicate to a client that a response will only be
       provided over a TLS connection, and only if the client has provided a
       certificate on that connection.</p>
