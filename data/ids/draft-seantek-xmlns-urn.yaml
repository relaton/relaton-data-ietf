abstract:
- language: en
  script: Latn
  content: |-
    <p>XML segregates elements into namespaces, which can be used to mix
       tags with different semantics in a composite XML document.  XML
       namespaces are identified by URIs.  This document defines a URN
       specifically for identifying XML namespaces.</p>
