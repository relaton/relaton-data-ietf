abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes a YANG module that allows a YANG server to
       specify for which data nodes it will send "YANG Datastore
       Subscription" on-change notifications.  It also proposes to use YANG
       Instance Data to document this information in implementation time.</p>
