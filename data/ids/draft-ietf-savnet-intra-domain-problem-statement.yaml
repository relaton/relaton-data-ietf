id: draftietfsavnetintradomainproblemstatement
schema_version: v1.5.6
formattedref:
  content: draft-ietf-savnet-intra-domain-problem-statement
title:
- language: en
  script: Latn
  content: Problem Statement, Gap Analysis, and Requirements for Intra-domain Source
    Address Validation
docidentifier:
- content: draft-ietf-savnet-intra-domain-problem-statement
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Source address validation (SAV) is an important means to mitigate IP
       source address spoofing [RFC2827].  This document analyzes the gaps
       in current operational mechanisms for intra-domain SAV.  It also
       identifies the properties that new intra-domain SAV mechanisms are
       expected to provide.</p>
