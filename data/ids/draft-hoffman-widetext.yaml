abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new MIME top-level media type, 'widetext', which
    can be used to carry text that employs the UTF-16 character encoding
    scheme. The use of the 'widetext' media type is limited to text-like MIME
    bodies that cannot be represented using the 'text' media type.</p>
