abstract:
- language: en
  script: Latn
  content: |-
    <p>IGMP and MLD protocols are extensible, but no extensions have been
       defined so far.  This document provides a well-defined way of
       extending IGMP and MLD, including a new extension type to distinguish
       between different extensions.</p>
