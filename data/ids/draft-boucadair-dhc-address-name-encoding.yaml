  content: Recommendation for Encoding IP Address and FQDN in DHCP Options
docidentifier:
- content: draft-boucadair-dhc-address-name-encoding
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document aims at providing a recommendation for the design of
       future DHCP options when both IP Address and FQDN encoding are needed
       to be supported.  This design reconciles the flexibility requirement
       from service providers and the DHC WG recommendation to avoid
       defining multiple options conveying similar set of configuration
       data.</p>
