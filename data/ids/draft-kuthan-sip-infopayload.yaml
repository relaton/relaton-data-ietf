abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes SIP applications that have a need for mid-
    session signaling and use the SIP INFO method for this purpose. In
    particular, attention is paid to the applications’ needs for
    reliable in-order delivery and mechanisms to accomplish it.</p>
