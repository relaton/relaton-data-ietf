abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes a DNSSEC delegation mechanism that complements
       [I-D.homburg-deleg-incremental-deleg].  In addition this mechanism
       simplifies multi-signer setups by removing the need to coordinate for
       signers during key rollovers.</p>
