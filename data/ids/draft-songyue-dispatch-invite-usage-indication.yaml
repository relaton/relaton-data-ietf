abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes private extensions to the Session Initiation
       Protocol (SIP) that enable a SIP entity to indicate in the INVITE
       message the exact purpose of the INVITE transaction, e.g. media
       negotiation, session refresh or creation of an pure signaling dialog.</p>
