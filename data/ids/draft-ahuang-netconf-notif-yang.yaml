abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the structure of NETCONF Event Notification in
       a YANG model to be used in NETCONF environments.  The definition of
       this YANG model allows the encoding of NETCONF Event Notifications in
       YANG compatible encodings such as JSON and CBOR.</p>
