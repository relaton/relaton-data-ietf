abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a header field that enables the author of an
    email or netnews message to include a Presence URI in the message
    header block for the purpose of associating the author with an
    address that provides information about network availability, also
    known as "presence".</p>
