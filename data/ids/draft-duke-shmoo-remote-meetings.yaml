abstract:
- language: en
  script: Latn
  content: |-
    <p>The IETF firmly believes in the value of in-person meetings to reach
       consensus on documents.  However, various emergencies can make a
       planned in-person meeting impossible.  This document provides
       criteria for making this judgment.</p>
