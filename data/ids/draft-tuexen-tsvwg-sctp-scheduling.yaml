abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes pluggable stream scheduling to change the
       scheduling behavior of the Stream Control Transmission Protocol
       (SCTP).

       Pluggable stream scheduling allows to use different scheduling
       algorithms to optimize SCTP's behavior in different scenarios.</p>
