abstract:
- language: en
  script: Latn
  content: |-
    <p>PSI-09 defines a signed verdict format for distributed tribunal
       proceedings conducted under the Apex Protocol.  A verdict carries the
       case identifier, the predicate chain that produced it, the ruling,
       the evidence anchors, and the dissenting opinion if any.</p>
