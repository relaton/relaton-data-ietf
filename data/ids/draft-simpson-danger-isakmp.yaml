abstract:
- language: en
  script: Latn
  content: |-
    <p>IKE [RFC-2409] is a session-key exchange mechanism within the ISAKMP
    [RFC-2408] protocol framework.  The combination is fraught with
    egregious fundamental design flaws.  This document details a few of
    the more easily exploitable problems.</p>
