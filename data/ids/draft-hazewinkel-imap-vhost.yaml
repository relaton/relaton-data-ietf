abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes an extension to the IMAP protocol in order to
    enable virtual hosting. The concept of virtual hosting for HTTP is
    used and a new IMAP command is introduced to provide the virtual
    hosting feature.</p>
