  content: CoAP over GATT (Bluetooth Low Energy Generic Attributes)
docidentifier:
- content: draft-amsuess-core-coap-over-gatt
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Interaction from computers and cell phones to constrained devices is
       limited by the different network technologies used, and by the
       available APIs.  This document describes a transport for the
       Constrained Application Protocol (CoAP) that uses Bluetooth GATT
       (Generic Attribute Profile) and its use cases.</p>
