abstract:
- language: en
  script: Latn
  content: "<p>The Direct Data Placement protocol provides information to Place the
    \nincoming data directly into an upper layer protocol’s receive buffer \nwithout
    intermediate buffers. This removes excess CPU and memory \nutilization associated
    with transferring data through the \nintermediate buffers.</p>"
