abstract:
- language: en
  script: Latn
  content: |-
    <p>The Simple Server Discovery Protocol allows clients to use a
         multicast address to discover the unicast interface of a
         cooperating server for a desired service port and optionally
         authenticate the identity of the client and/or server.</p>
