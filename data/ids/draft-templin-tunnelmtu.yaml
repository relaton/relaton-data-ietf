abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a means for IPv6-in-IPv4 tunnel endpoints to
    support dynamic maximum transmission unit (MTU) determination. It
    provides a means for the local end to recognize when a packet should
    be forwarded to the far end, and when it should be dropped.</p>
