abstract:
- language: en
  script: Latn
  content: |-
    <p>There is no way to indicate the negative answer of resource records
    (RR) with name and type other than QNAME and QTYPE. This memo
    proposes a method to inform the nonexistence of a given name and a
    given type.</p>
