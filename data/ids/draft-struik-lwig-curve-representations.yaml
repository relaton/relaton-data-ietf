abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies how to represent Montgomery curves and
       (twisted) Edwards curves as curves in short-Weierstrass form and
       illustrates how this can be used to implement elliptic curve
       computations using existing implementations that already implement,
       e.g., ECDSA and ECDH using NIST prime curves.</p>
