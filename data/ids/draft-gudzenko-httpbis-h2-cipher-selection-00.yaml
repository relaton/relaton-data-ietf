abstract:
- language: en
  script: Latn
  content: |-
    <p>Section 9.2.2 of RFC 9113 identifies, but does not normatively
       resolve, a failure mode in which the application protocol and the
       cipher suite are selected independently, resulting in a successfully
       completed TLS handshake whose negotiated parameters may be rejected
       at the HTTP/2 layer with an INADEQUATE_SECURITY connection error.
       This document addresses that gap by adding a SHOULD-level procedure
       that coordinates cipher suite selection with ALPN negotiation, and
       updates RFC9113.</p>
