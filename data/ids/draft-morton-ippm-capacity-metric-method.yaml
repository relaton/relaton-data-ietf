  content: |-
    <p>This memo revisits the problem of Network Capacity metrics first
       examined in RFC 5136.  The memo specifies a more practical Maximum
       IP-layer Capacity metric definition catering for measurement
       purposes, and outlines the corresponding methods of measurement.</p>
