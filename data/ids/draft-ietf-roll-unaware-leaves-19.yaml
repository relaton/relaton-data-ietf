abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification extends RFC6550 and RFC8505 to provide routing
       services to Hosts called RPL Unaware Leaves that implement 6LoWPAN ND
       but do not participate in RPL.  This specification also enables the
       RPL Root to proxy the 6LoWPAN keep-alive flows in its DODAG.</p>
