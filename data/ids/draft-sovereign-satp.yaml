  content: |-
    <p>This document specifies the Sovereign Autonomous Trust Protocol
       (SATP), a foundational framework for establishing verifiable
       identity, attribution, and governance for autonomous machines.  SATP
       provides a non-repudiable "Root of Trust" for both digital AI agents
       and physical autonomous systems.</p>
