abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the Service Agent service type.  Service
    Agents are one of three types of agents used in the Service Location
    Protocol, Version 2 [1].  The Service Agent advertises all services
    on a given host which have been enabled to use SLPv2.</p>
