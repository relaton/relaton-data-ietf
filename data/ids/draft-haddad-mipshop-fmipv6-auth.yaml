abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a scheme to secure the handover signaling in
       FMIPv6 using one way hash chains.  The values generated in a one way
       hash chain will be used one at a time during each handoff to
       authenticate the signaling messages.</p>
