- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
       for use with network management protocols in the Internet community.
       In particular, it defines objects for managing the IPv6 Routing
       Protocol for Low Power and Lossy Networks (RPL).</p>
