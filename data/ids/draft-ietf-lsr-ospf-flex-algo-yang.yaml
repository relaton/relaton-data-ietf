  script: Latn
  content: A YANG Data Model for OSPF Application-Specific Link Attributes and Flexible
    Algorithm
docidentifier:
- content: draft-ietf-lsr-ospf-flex-algo-yang
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model to support OSPF Application-
       Specific Link Attributes and Flexible Algorithm.  It also creates the
       initial version of IANA-maintained YANG modules for IGP Algorithm
       Types, IGP Metric-Types, and IGP Link Attribute Applications.

       This document updates RFCs 8665, 9350, and 9843.</p>
