abstract:
- language: en
  script: Latn
  content: "<p>(Backus-Naur Form (BNF) is used hereinafter.)\nThis document describes
    an enhancing of symbolic name way of \ncharacter references in HTML by adding
    to a character symbolic name an \noptional character property in the following
    manner: BNF: '&amp;&lt;character \nsymbolic name&gt;[&lt;separator&gt;&lt;character
    property&gt;];'.</p>"
