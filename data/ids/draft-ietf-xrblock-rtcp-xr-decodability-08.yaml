abstract:
- language: en
  script: Latn
  content: |-
    <p>An MPEG2 Transport Stream (TS) is a standard container format used in
       the transmission and storage of multimedia data.  Unicast/Multicast
       MPEG2 TS over RTP is widely deployed in IPTV systems.  This document
       defines an RTP Control Protocol (RTCP) Extended Report (XR) Block
       that allows the reporting of MPEG2 Program Specific Information (PSI)
       Independent TS decodability statistics metrics related to
       transmissions of MPEG2 TS over RTP.</p>
