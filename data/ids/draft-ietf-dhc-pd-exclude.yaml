- language: en
  script: Latn
  content: "<p>This specification defines an optional mechanism to allow exclusion
    of one specific prefix from a delegated prefix set when using DHCPv6-based prefix
    delegation.  The new mechanism updates RFC 3633. [STANDARDS-TRACK]</p>"
