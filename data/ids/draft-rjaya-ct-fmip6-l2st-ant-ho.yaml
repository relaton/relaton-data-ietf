  content: |-
    Context Transfer and Fast Mobile IPv6 Interactions
    in a Layer-2 Source-Triggered Anticipative Handover
docidentifier:
- content: draft-rjaya-ct-fmip6-l2st-ant-ho
  type: Internet-Draft
