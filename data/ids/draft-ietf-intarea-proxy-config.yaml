title:
- language: en
  script: Latn
  content: Communicating Proxy Configurations in Provisioning Domains
docidentifier:
- content: draft-ietf-intarea-proxy-config
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a mechanism for accessing provisioning domain
       information associated with a proxy, such as other proxy URIs that
       support different protocols and information about which destinations
       are accessible using a proxy.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/tfpauly/privacy-proxy.</p>
