abstract:
- language: en
  script: Latn
  content: |-
    <p>Several IETF drafts relate to the use of overlay networks to support
           large scale virtual data centers. This draft provides a list of data
           plane requirements for Network Virtualization over L3 (NVO3) that
           have to be addressed in solutions documents.</p>
