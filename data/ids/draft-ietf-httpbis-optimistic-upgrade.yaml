title:
- language: en
  script: Latn
  content: Security Considerations for Optimistic Protocol Transitions in HTTP/1.1
docidentifier:
- content: draft-ietf-httpbis-optimistic-upgrade
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>In HTTP/1.1, the client can request a change to a new protocol on the
       existing connection.  This document discusses the security
       considerations that apply to data sent by the client before this
       request is confirmed, and adds new requirements to RFC 9112 and RFC
       9298 to avoid related security issues.</p>
