abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this document is to introduce a measurement header.
    \nMeasurement header is a new type of IPv6 extended header used for \nnetwork
    measurement. The information needed by measurement carried in \nmeasurement header.
    The parameters can be calculated based on these \ninformation.</p>"
