abstract:
- language: en
  script: Latn
  content: |-
    <p>This short I-D provides a simple addition to 6LoWPAN Header
       Compression that enables the compression of generic headers and
       header-like payloads, without a need to define a new header
       compression scheme for each new such header or header-like payload.</p>
