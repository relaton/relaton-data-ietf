title:
- language: en
  script: Latn
  content: Using Dummy IPv4 Address and Node Identification Extensions for IP/ICMP
    translators (XLATs)
docidentifier:
- content: draft-ietf-v6ops-icmpext-xlat-v6only-source
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document suggests that when a source IPv6 address of an ICMPv6
       message can not be translated to an IPv4 address, the protocol
       translators use the dummy IPv4 address (192.0.0.8) to translate the
       IPv6 source address, and utilize the ICMP extension for Node
       Identification (draft-ietf-intarea-extended-icmp-nodeid) to carry the
       original IPv6 source address of ICMPv6 messages.  This document
       obsoletes RFC6791, Stateless Source Address Mapping for ICMPv6
       Packets and updates IP/ICMP Translation Algorithm (RFC7915).</p>
