abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a protocol for the decentralized validation
       of entity integrity within the agentic web.  The objective is to
       establish a machine-readable trust anchor (Layer 0) that enables
       Large Language Models (LLMs) and autonomous agents to
       deterministically verify the authenticity and structural consistency
       of a data source prior to ingestion.  By shifting validation to the
       infrastructure ingress, the protocol minimizes resource waste and
       prevents the propagation of unverified signal noise.  This document
       reflects the current state of the protocol specification, including
       formal header structures, clarified pre-hash procedures, and
       explicitly defined protocol non-goals.</p>
