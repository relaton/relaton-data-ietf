abstract:
- language: en
  script: Latn
  content: |-
    <p>[RFC7240] standardizes a means of indicating client preferences using
       the "Prefer" header.  This specification defines a "Prefer" header
       preference extension to indicate synchronous processing, called
       "respond-sync".</p>
