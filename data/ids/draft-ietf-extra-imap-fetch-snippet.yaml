abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an IMAP protocol extension which allows a
       client to request that a server provide an abbreviated representation
       of a message (a snippet of text) that can be used by a client to
       provide a useful contextual preview of the message contents.</p>
