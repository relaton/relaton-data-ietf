abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how an Extensible Provisioning Protocol (EPP)
       session is mapped onto a QUIC connection.  EPP over QUIC (EoQ)
       leverages the performance and security features of the QUIC protocol
       as an EPP transport.</p>
