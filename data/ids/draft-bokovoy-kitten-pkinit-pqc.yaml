  content: Post-quantum Key Encapsulation with ML-KEM in Public Key Cryptography for
    Initial Authentication in Kerberos (PKINIT)
docidentifier:
- content: draft-bokovoy-kitten-pkinit-pqc
  type: Internet-Draft
