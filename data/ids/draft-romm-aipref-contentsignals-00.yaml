- language: en
  script: Latn
  content: |-
    <p>This Internet Draft proposes three categories that would enable
       parties to express preferences regarding how digital assets are used
       by automated processing systems.  The proposal is for these
       categories to nest within the larger category of Automated
       Processing, currently envisaged in the [AIPREF-VOCAB].</p>
