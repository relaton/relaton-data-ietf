abstract:
- language: en
  script: Latn
  content: |-
    <p>This document deprecates the IPv6 Router Alert Option.  Protocols
       that use the Router Alert Option may continue to do so, even in
       future versions.  However, protocols standardized in the future must
       not use the Router Alert Option.</p>
