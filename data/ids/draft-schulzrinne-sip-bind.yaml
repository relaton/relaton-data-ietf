abstract:
- language: en
  script: Latn
  content: |-
    <p>For many services, it is useful to be able to associate data,
    represented by URLs, with SIP user identifiers, both address-of-
    records and host-based user names. This draft proposes a solution
    that addresses most of the requirements for such a mechanism.</p>
