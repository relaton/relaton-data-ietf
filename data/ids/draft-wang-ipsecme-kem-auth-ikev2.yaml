  content: KEM-based Authentication for IKEv2 with Post-quantum Security
docidentifier:
- content: draft-wang-ipsecme-kem-auth-ikev2
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft specifies a new authentication mechanism, called KEM (Key
       Encapsulation Mechanism) -based authentication, for the Internet Key
       Exchange Protocol Version 2 (IKEv2).  This is motivated by the fact
       that some post-quantum KEMs (like ML-KEM) are more efficient than
       post-quantum signature algorithms (like ML-DSA).</p>
