abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines an extension to the SMTP service [Klensin, et al
    1995] to realize efficiency improvements in the relaying and delivery
    of slightly differing messages bound for more than one recipient, as
    specified by multiple RCPT TO commands.</p>
