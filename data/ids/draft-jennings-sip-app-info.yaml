abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes SIP extensions to allow network elements to
    request a UA to initiate a scripted application that is associated
    with a dialog.  It provides a mechanism for the network elements to
    find out a UA's ability to fetch and execute scripts.</p>
