title:
- language: en
  script: Latn
  content: RTP Payload Format for sub-codestream latency JPEG 2000 streaming
docidentifier:
- content: draft-ietf-avtcore-rtp-j2k-scl
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This RTP payload format defines the streaming of a video signal
       encoded as a sequence of JPEG 2000 codestreams.  The format allows
       sub-codestream latency, such that the first RTP packet for a given
       image can be emitted before the entire image is available to, or
       encoded by, the sender.</p>
