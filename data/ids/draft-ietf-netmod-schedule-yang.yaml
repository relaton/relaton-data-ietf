title:
- language: en
  script: Latn
  content: A Common YANG Data Model for Scheduling
docidentifier:
- content: draft-ietf-netmod-schedule-yang
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines common types and groupings that are meant to be
       used for scheduling purposes such as event, policy, services, or
       resources based on date and time.  For the sake of better modularity,
       the YANG module includes a set of recurrence-related groupings with
       varying levels of representation (i.e., from basic to advanced) to
       accommodate a variety of requirements.  It also defines groupings for
       validating requested schedules and reporting scheduling status.</p>
