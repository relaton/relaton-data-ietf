- language: en
  script: Latn
  content: |-
    <p>This document changes the IANA registry policy for a number of
       registries related to DTLS and TLS, renames some of the registries
       for consistency, and adds notes to many of the registries.  As a
       result, this document updates many RFCs (see updates header).</p>
