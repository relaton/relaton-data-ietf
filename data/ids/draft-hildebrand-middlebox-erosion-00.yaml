- language: en
  script: Latn
  content: |-
    <p>Many middleboxes on the Internet attempt to add value to the
       connections that traverse that point on the network.  Problems in
       their implementations erode the moral authority that otherwise might
       accrue to the legitimate value that they add.</p>
