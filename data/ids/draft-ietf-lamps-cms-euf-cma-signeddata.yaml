  content: Best Practices for Signed Attributes in CMS SignedData
docidentifier:
- content: draft-ietf-lamps-cms-euf-cma-signeddata
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The Cryptographic Message Syntax (CMS) has different signature
       verification behaviour based on whether signed attributes are present
       or not.  This results in a potential existential forgery
       vulnerability in CMS and protocols which use CMS.  This document
       describes the vulnerability and lists mitigations and best practices
       to avoid it.</p>
