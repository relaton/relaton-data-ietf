  content: RSVP-TE Recovery Extension for data plane initiated reversion, and protection
    timer signaling
docidentifier:
- content: draft-takacs-ccamp-revertive-ps
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>RSVP-TE recovery extensions are specified in [RFC4872] and
       [RFC4873].  Currently recovery signaling does not support the
       request for revertive protection and recovery timers values. This
       document extends the PROTECTION Object format allowing sub-TLVs, and
       defines two sub-TLVs to carry wait-to-restore and hold-off
       intervals.</p>
