title:
- language: en
  script: Latn
  content: Support of Versioning in YANG Notifications Subscription
docidentifier:
- content: draft-ietf-netconf-yang-notifications-versioning
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG module which extends the YANG-Push
       Subscription mechanism to enforce that particular revisions or
       semantic versions are used when configuring or establishing a
       Subscription.  It also extends the YANG-Push Subscription state
       change Notifications to include additional context about the YANG
       schema associated with the Subscription.</p>
