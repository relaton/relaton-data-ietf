  script: Latn
  content: Updated Use of the Expires Message Header Field
docidentifier:
- content: draft-billon-expires
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document allows broader use of the Expires message header field
       for mail messages.  Message creators can then indicate when a message
       expires, while recipients would use this information to handle an
       expired message differently.</p>
