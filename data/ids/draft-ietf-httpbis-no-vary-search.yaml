id: draftietfhttpbisnovarysearch
schema_version: v1.5.6
formattedref:
  content: draft-ietf-httpbis-no-vary-search
title:
- language: en
  script: Latn
  content: The No-Vary-Search HTTP Caching Extension
docidentifier:
- content: draft-ietf-httpbis-no-vary-search
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines an extension to HTTP Caching, changing how
       the URI query component impacts caching.  It introduces the "No-Vary-
       Search" response header field, which allows origin servers to signal
       to caches that certain parts of the query component do not
       semantically affect the served response and can be ignored for cache
       matching purposes.</p>
