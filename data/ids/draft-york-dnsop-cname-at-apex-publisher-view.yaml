  content: |-
    <p>There has been a large amount of discussion about the "CNAME at apex"
       issue within the DNSOP Working Group.  This draft provides the
       perspective of one publisher of multiple websites about why CNAME-
       like functionality is desirable at the apex of a domain zone.</p>
