- content: draft-he-6man-icmpv6-extensions-ipv6-ext-header
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes LOOPBACK6.  LOOPBACK6 is a utility that
       network operators can use to determine how IPv6 extension headers
       have been altered by transit nodes.  Its operation is similar to that
       of PING and PROBE.</p>
