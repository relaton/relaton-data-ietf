abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC5926 creates a list of cryptographic algorithms that can be used
       with TCP-AO.  This document expands that list, adding two Key
       Derivation Functions (KDFs) and two Message Authentication Code (MAC)
       Algorithms.  They are called HKDF-SHA384, KMAC384-KDF, HMAC-SHA384,
       and KMAC384.

       The algorithms described by this document produce 384-bit (i.e.,
       48-byte) MACs.  When 48-byte MACs are encoded in TCP-AO, the TCP-AO
       consumes 52 bytes.  This exceeds TCP's current 40-byte option size
       limitation.</p>
