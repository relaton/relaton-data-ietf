abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines user ports for experiments using transport
       protocols. It describes the use of experiment identifiers to enable
       shared use of these user ports, as well as updating the use of
       system ports for experiments [RFC4727] in the same manner.</p>
