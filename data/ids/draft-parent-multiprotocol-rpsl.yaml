abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the definitions and extensions required in
    RPSL [1] in order to be able to define IPv6 and multicast routing
    policies.  Defining RPSL for IPv6 is an important step to build an
    IPv6 Internet Routing Registry.</p>
