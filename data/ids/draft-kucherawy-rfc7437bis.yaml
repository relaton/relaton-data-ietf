title:
- language: en
  script: Latn
  content: 'IAB, IESG, and IAOC Selection, Confirmation, and Recall Process: Operation
    of the Nominating and Recall Committees'
docidentifier:
- content: draft-kucherawy-rfc7437bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The process by which the members of the IAB and IESG, and some
       members of the IAOC, are selected, confirmed, and recalled is
       specified in this document.  This document is a self-consistent,
       organized compilation of the process as it has evolved since the
       publication of [RFC7437].</p>
