abstract:
- language: en
  script: Latn
  content: |-
    <p>In some conferencing scenarios, it is desirable for an intermediary
       to be able to manipulate some RTP parameters, while still providing
       strong end-to-end security guarantees.  This document defines a
       procedure to perform end to end media authenticated encryption.</p>
