abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension to the Constrained Application
       Protocol (CoAP) to add a new option Size, which is used to indicate
       the resource size in a PUT/POST request or in a GET response.

    Note

       Discussion and suggestions for improvement are requested, and should
       be sent to core@ietf.org.</p>
