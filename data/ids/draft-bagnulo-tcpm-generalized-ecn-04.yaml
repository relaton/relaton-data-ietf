abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an experimental modification to ECN when used
       with TCP.  It allows the use of ECN on the following TCP packets:
       SYNs, pure ACKs, Window probes, FINs, RSTs and retransmissions.</p>
