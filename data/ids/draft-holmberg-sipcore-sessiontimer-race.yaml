abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates RFC 4028, by clarifying the procedures for
       negotiating usage of the Session Initiation Protocol (SIP) session
       timer mechansim, in order to avoid a race condition where both
       endpoints trigger simultaneous negotiations.</p>
