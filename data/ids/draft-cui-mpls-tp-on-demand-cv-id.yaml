abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines how to use ICC-based MPLS-TP identifiers for
       on-demand connectivity verification (CV) analogous to RFC 6426.  New
       TLVs are defined to support on-demand CV based on identifiers
       following ITU-T conventions.</p>
