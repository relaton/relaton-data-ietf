id: draftietfmasqueconnectudplisten
schema_version: v1.5.6
formattedref:
  content: draft-ietf-masque-connect-udp-listen
title:
- language: en
  script: Latn
  content: Proxying Bound UDP in HTTP
docidentifier:
- content: draft-ietf-masque-connect-udp-listen
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The mechanism defined in "Proxying UDP in HTTP" (RFC 9298) only
       allows each UDP proxying request to transmit to a specific host and
       port.  This is well suited for UDP client-server protocols such as
       HTTP/3, but is not sufficient for some UDP peer-to-peer protocols
       like WebRTC.  This document defines an extension to that mechanism
       that enables such use cases.</p>
