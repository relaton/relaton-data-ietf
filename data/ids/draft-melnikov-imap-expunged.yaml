abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an IMAP extension, which gives a disconnected
       client ability to quickly learn about expunged messages.  This
       extension also introduces a new response that allows for a more
       compact representation for a list of expunged messages.</p>
