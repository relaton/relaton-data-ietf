abstract:
- language: en
  script: Latn
  content: |-
    <p>Mail Accepted by Previous Sending defines a mechanism by which
       incoming unsollicited mails may be rejected or penalized by a MTA if
       their sender address domains has never been a destination for the
       outgoing mails treated by this MTA.</p>
