abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes mechanisms for using directory server(s) to
       assist TRILL (Transparent Interconnection of Lots of Links) edge
       switches in reducing multi-destination traffic, particularly ARP/ND
       and unknown unicast flooding.</p>
