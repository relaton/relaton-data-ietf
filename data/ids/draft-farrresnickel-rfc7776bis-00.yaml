abstract:
- language: en
  script: Latn
  content: |-
    <p>The IETF Anti-Harassment Procedures are described in RFC 7776.

       The IETF Administrative Oversight Committee (IAOC) has been replaced
       by the IETF Administration LLC.  This document updates RFC 7776 to
       replace all mention of the IAOC with reference to the IETF
       Administration LLC.</p>
