  content: Distribution of TRILL Link-State using BGP
docidentifier:
- content: draft-ietf-idr-ls-trill
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes a TRILL link state and MAC address reachability
       information distribution mechanism using a BGP LS extension.
       External components such as an SDN Controller can use the information
       for topology visibility, troubleshooting, network automation, and the
       like. This document updates RFC 7752.</p>
