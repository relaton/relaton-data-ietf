abstract:
- language: en
  script: Latn
  content: |-
    <p>During the network operation, there is a scenario where the IKEv2 is
    used between MN and MAG while the PMIPv6 is used between MAG and LMA.
    Hence, the interworking between IKEv2 and PMIPv6 need to be
    considered in this scenario.</p>
