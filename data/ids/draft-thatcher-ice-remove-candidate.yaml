abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an extension to the Interactive Connectivity
       Establishment (ICE) that enables ICE agents to signal the removal of
       ICE candidates to the remote ICE agent to prevent the remote ICE
       agent from wasting resources by attempting to use the ICE candidate.</p>
