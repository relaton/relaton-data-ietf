- language: en
  script: Latn
  content: |-
    <p>This document describes procedures for distributing upstream-assigned
       labels for Label Distribution Protocol (LDP). It also describes how
       these procedures can be used for avoiding branch LSR traffic
       replication on a LAN for LDP point-to-multipoint (P2MP)LSPs.</p>
