abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a new DHCPv6 option for distributing address
    selection policy information defined in RFC3484 and/or source address
    and destination address selection policies to a client.  With this
    option, site administrators can distribute address selection policy
    to control the node's address selection behavior.</p>
