abstract:
- language: en
  script: Latn
  content: |-
    <p>QUIC supports an idle timeout for connections, which can be
       negotiated once during the connection handshake.  This document
       defines QUIC extension frames that permit either endpoint to initiate
       an update to the idle timeout value.</p>
