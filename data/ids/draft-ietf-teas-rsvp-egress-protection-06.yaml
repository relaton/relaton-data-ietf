abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes extensions to Resource Reservation Protocol -
       Traffic Engineering (RSVP-TE) for locally protecting egress nodes of
       a Traffic Engineered (TE) Label Switched Path (LSP), which is a
       Point-to-Point (P2P) LSP or a Point-to-Multipoint (P2MP) LSP.</p>
