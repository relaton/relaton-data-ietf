  content: Operational Issues Associated With Long IPv6 Header Chains
docidentifier:
- content: draft-wkumari-long-headers
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo specifies requirements for IPv6 forwarders as they process
       packets with long header chains.  It also provides guidance for
       application developers whose applications might rely on long headers
       chains.

       As background, this memo explains how many ASIC-based IPv6 forwarders
       process packets and why processing of packets with long header chains
       might be problematic.</p>
