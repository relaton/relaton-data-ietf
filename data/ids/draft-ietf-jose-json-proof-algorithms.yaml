abstract:
- language: en
  script: Latn
  content: |-
    <p>The JSON Proof Algorithms (JPA) specification registers cryptographic
       algorithms and identifiers to be used with the JSON Web Proof, JSON
       Web Key (JWK), and COSE specifications.  It defines IANA registries
       for these identifiers.</p>
