abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how E-VPN can be used as an NVO solution and
       explores the various tunnel encapsulation options and their impact on
       the E-VPN control-plane and procedures. In particular, the following
       encapsulation options are analyzed: MPLS over GRE, VXLAN, and NVGRE.</p>
