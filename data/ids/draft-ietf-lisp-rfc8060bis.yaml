  content: LISP Canonical Address Format (LCAF)
docidentifier:
- content: draft-ietf-lisp-rfc8060bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a canonical address format encoding used in
       Locator/ID Separation Protocol (LISP) control messages and in the
       encoding of lookup keys for the LISP Mapping Database System.

       This document obsoletes RFC 8060 and RFC 9306.</p>
