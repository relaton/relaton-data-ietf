  content: JavaScript Session Establishment Protocol (JSEP)
docidentifier:
- content: draft-uberti-rtcweb-rfc8829bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the mechanisms for allowing a JavaScript
       application to control the signaling plane of a multimedia session
       via the interface specified in the W3C RTCPeerConnection API and
       discusses how this relates to existing signaling protocols.

       This specification obsoletes RFC 8829.</p>
