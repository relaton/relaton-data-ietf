  content: Data Fields for DetNet Enhanced Data Plane
docidentifier:
- content: draft-xiong-detnet-data-fields-edp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The DetNet-specific metadata should be carried in enhanced data plane
       based on the enhancement requirements.  This document proposes the
       common DetNet data fields and options including Deterministic Latency
       Option and Aggregation Option.  It also considers the common DetNet
       options being encapsulated into a variety of protocols such as MPLS,
       IPv6 and SRv6 networks.</p>
