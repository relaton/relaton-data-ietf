abstract:
- language: en
  script: Latn
  content: |-
    <p>This document identifies and analyzes several PCP failure scenarios.
       A procedure to retrieve the explicit dynamic mapping(s) from the PCP
       Server is proposed.  This procedure relies upon the use of a new PCP
       OpCode and Option: GET/NEXT.</p>
