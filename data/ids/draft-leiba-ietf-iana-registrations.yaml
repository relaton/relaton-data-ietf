abstract:
- language: en
  script: Latn
  content: |-
    <p>IETF documents have been inconsistent in what they specify as the
       registrant (or contact, or change controller) in IANA registrations
       they make.  This document provides a consistent specification
       ("IETF") to be used, and allows for exceptions with IESG approval.</p>
