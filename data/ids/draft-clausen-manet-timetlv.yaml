abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a general and flexible TLV (type-length-value
       structure) for representing time using the generalized MANET packet/
       message format.  It defines two message TLVs for representing
       validity and interval times for MANET routing protocols.</p>
