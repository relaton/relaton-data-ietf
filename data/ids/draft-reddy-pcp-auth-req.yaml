abstract:
- language: en
  script: Latn
  content: |-
    <p>In an attempt to reach consensus on a PCP authentication mechanism,
       this document describes requirements for PCP authentication.  It is
       hoped this can serve as the basis for a comparison of PCP
       authentication mechanisms.</p>
