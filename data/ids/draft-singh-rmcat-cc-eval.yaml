abstract:
- language: en
  script: Latn
  content: |-
    <p>The Real-time Transport Protocol (RTP) is used to transmit media in
       telephony and video conferencing applications.  This document
       describes the guidelines to evaluate new congestion control
       algorithms for interactive point-to-point real-time media.</p>
