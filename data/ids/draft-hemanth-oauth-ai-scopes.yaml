abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension to OAuth 2.0 for delegating scoped
       access to AI model APIs.  It introduces a standardized scope syntax,
       resource indicators for AI providers, and token constraints suitable
       for AI workloads including spend limits and model restrictions.</p>
