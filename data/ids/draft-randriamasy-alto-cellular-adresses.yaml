abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft proposes to use the cellular address format composed of
       elements as specified by 3GPP and called ECGI.  ECGI stands for
       E-UTRAN Cell Global Identifier and is used in Public Land Mobile
       Networks based on E-UTRAN.</p>
