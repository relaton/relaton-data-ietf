  content: |-
    <p>This document proposes two issues both in WiBro and in IEEE 802.16
       environment.  Firstly, it describes needs to define payload header
       suppression (PHS) rules for IPv6 packets.  Secondly, it accounts for
       the need to discuss IPv6 address auto-configuration.</p>
