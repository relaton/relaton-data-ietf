abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines and discusses a SASL mechanism that is based on the
       exchange of hashes.  It does not require the storage of a plaintext
       equivalent on the server, is simple to implement, and provides a
       reasonable level of security.</p>
