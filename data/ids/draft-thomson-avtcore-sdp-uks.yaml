abstract:
- language: en
  script: Latn
  content: |-
    <p>Unknown key-share attacks on the use of Datagram Transport Layer
       Security for the Secure Real-Time Transport Protocol (DTLS-SRTP) and
       its use with Web Real-Time Communications (WebRTC) identity
       assertions are described.  Simple mitigation techniques are defined.</p>
