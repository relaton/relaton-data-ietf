- content: draft-bdc-something-something-certificate
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the HTTP header field "Client-Cert" that allows
       a TLS terminating reverse proxy to convey the client certificate of a
       mutually-authenticated TLS connection to the origin server in a
       common and predictable manner.</p>
