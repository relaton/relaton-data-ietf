abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes DHCPv6 Route Options for provisioning IPv6
       routes on DHCPv6 client nodes for source address dependent routing.
       Using these options, an operator can configure multi-homed nodes
       where other means of route configuration may be impractical.</p>
