abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community.
    In particular, it describes managed objects providing information
    about the energy consumption, the power states, and the battery
    status of managed devices and their components.</p>
