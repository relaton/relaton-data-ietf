abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces Overlay Operations, Administration, and
       Maintenance (OOAM) Header to be used in overlay networks to create
       Overlay Associated Channel (OAC) to ensure that OOAM control packets
       are in-band with user traffic and de-multiplex OOAM protocols.</p>
