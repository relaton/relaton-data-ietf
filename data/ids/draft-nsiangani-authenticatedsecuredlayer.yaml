abstract:
- language: en
  script: Latn
  content: "<p>This document specifies ASL (Authenticated Secure Layer), a\ncryptographic\n
    \  protocol for establishing an authenticated and encrypted\ncommunication\n   session
    based on a novel arithmetic primitive called phi-ns-x (also\nknown\n   as ns-mod).
    ASL provides a complete handshake and data transport\nlayer\n   without reliance
    on traditional algorithms like RSA, Diffie-Hellman,\nAES or\n   SHA. Instead,
    it builds on the Phi-Ns cryptosystem, which defines a \n   structured quadratic
    relation between primes and achieves security\nthrough\n   non-linear modular
    arithmetic and combinatorial complexity. \n\n   ASL includes an initial authentication
    and key exchange mechanism\nwhere a\n   server public key (composed only of specific
    allowed elements such as\na\n   prime modulus and state parameters) is used by
    a client to establish\nshared\n   secrets. The protocol uses a stateful encryption
    transform (phi-ns-x)\nfor\n   data, with each message round incorporating a public
    state value that\n   changes unpredictably. Shared secret parameters control this
    state\nevolution,\n   preventing man-in-the-middle and injection attacks by ensuring
    that\nonly\n   parties with knowledge of the secrets can produce valid ciphertexts.</p>"
