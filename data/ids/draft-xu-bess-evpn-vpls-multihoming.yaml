abstract:
- language: en
  script: Latn
  content: |-
    <p>EVPN VPLS supports multi-homing to implement redundancy between PEs,
       including single-active and all-active redundancy [RFC7432].  The
       redundancy function on the access side needs to be implemented in
       another mode, which is described in this document.</p>
