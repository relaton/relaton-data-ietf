title:
- language: en
  script: Latn
  content: Specification of DNS over Dedicated QUIC Connections
docidentifier:
- content: draft-huitema-quic-dnsoquic
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the use of QUIC to provide transport privacy
       for DNS.  The encryption provided by QUIC has similar properties to
       that provided by TLS, while QUIC transport eliminates the head-of-
       line blocking issues inherent with TCP and provides more efficient
       error corrections than UDP.  DNS over QUIC (DNS/QUIC) has privacy
       properties similar to DNS over TLS specified in RFC7858, and
       performance similar to classic DNS over UDP.</p>
