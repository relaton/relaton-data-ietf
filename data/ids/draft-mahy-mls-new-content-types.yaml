abstract:
- language: en
  script: Latn
  content: |-
    <p>This Messaging Layer Security (MLS) extension adds two new variations
       of the application content type, each with a separate key ratchet.
       It also creates an MLS capability to negotiate use of the new types,
       and an IANA registry to register additional content types.</p>
