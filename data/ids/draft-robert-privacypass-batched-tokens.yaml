abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a variant of the Privacy Pass issuance
       protocol that allows for batched issuance of tokens.  This allows
       clients to request more than one token at a time and for issuers to
       isse more than one token at a time.</p>
