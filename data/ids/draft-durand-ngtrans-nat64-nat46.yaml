- language: en
  script: Latn
  content: |-
    <p>This document defines two scalable NAT mechanisms, NAT64 to enable
    IPv6-only devices to initiate communications with unmodified IPv4
    only devices and NAT46 to enable IPv4-only devices to initiate
    communications with IPv6-only devices.</p>
