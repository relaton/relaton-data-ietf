    Standard.  It has been prepared by the The Yet Another Mail Working
    Group.

    THIS INTERNET DRAFT IS WRITTEN TO FACILITATE PROCESSING WITHIN THE
    IESG.  IT IS NOT MEANT TO BE PUBLISHED AS AN RFC.</p>
