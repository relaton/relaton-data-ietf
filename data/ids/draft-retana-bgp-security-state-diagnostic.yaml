abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an extension to the BGP Diagnostic Message to
    communicate the security state of a route.  An application of this
    extension is to propagate information about non-secure advertisements
    back to the eBGP peer from where the information was received.</p>
