abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes an optional extension to the Post Office Protocol
       version 3 (POP3), which introduces a possibility for a POP3 client to
       be notified by a  POP3  server  whenever  the  clients  mail-drop  is
       accessed.</p>
