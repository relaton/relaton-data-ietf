id: draftietftsvwgecnencapguidelines
schema_version: v1.5.6
formattedref:
  content: draft-ietf-tsvwg-ecn-encap-guidelines
title:
- language: en
  script: Latn
  content: Guidelines for Adding Congestion Notification to Protocols that Encapsulate
    IP
docidentifier:
- content: draft-ietf-tsvwg-ecn-encap-guidelines
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The purpose of this document is to guide the design of congestion
       notification in any lower layer or tunnelling protocol that
       encapsulates IP.  The aim is for explicit congestion signals to
       propagate consistently from lower layer protocols into IP.  Then the
       IP internetwork layer can act as a portability layer to carry
       congestion notification from non-IP-aware congested nodes up to the
       transport layer (L4).  Following these guidelines should assure
       interworking among IP layer and lower layer congestion notification
       mechanisms, whether specified by the IETF or other standards bodies.
       This document is included in BCP 89 and updates the single paragraph
       of advice to subnetwork designers about ECN in Section 13 of RFC
       3819, by replacing it with a reference to the whole of this document.</p>
