- language: en
  script: Latn
  content: |-
    <p>This document specifies a data model for client and server
       implementations of the Two-Way Active Measurement Protocol (TWAMP).
       We define the TWAMP data model through Unified Modeling Language
       (UML) class diagrams and formally specify it using YANG.</p>
