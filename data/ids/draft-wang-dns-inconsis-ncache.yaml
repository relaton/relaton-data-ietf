abstract:
- language: en
  script: Latn
  content: |-
    <p>The introduction of negative caching of DNS queries may make DNS
       resolvers more frequently exposed to the cache inconsistency. This
       document describes the negative caching inconsistency and gives a
       solution for DNS resolvers to handle it.</p>
