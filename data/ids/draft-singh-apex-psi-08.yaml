  content: |-
    <p>PSI-08 specifies a format for composing multiple Digital Gallows
       predicates into a verifiable chain.  Each link in the chain is a
       signed predicate output that serves as input to the next, enabling
       verifiable multi-step inference without a trusted intermediary.</p>
