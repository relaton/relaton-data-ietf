abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification modifies 6LoWPAN stateless address compression to
       enable the compression by 6LOWPAN_IPHC of non Link-Local addresses in
       an IP header when a reference address can be found in an
       encapsulation.  .</p>
