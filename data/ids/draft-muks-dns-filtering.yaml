abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo documents EDNS options and methods that can be used to
       return information about filtered, blocked, or censored DNS
       responses.  It complements the information provided in EDNS Extended
       DNS Error options [RFC8914].</p>
