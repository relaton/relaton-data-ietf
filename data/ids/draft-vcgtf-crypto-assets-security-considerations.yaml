abstract:
- language: en
  script: Latn
  content: |-
    <p>This document discusses the technical and operational risks of
       cryptoassets custodians and its security controls to avoid the
       unintended transactions for its customers.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/cgtf/draft-crypto-assets-security-considerations.</p>
