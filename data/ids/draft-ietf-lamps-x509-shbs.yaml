title:
- language: en
  script: Latn
  content: Use of the HSS and XMSS Hash-Based Signature Algorithms in Internet X.509
    Public Key Infrastructure
docidentifier:
- content: draft-ietf-lamps-x509-shbs
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies algorithm identifiers and ASN.1 encoding
       formats for the stateful hash-based signature (HBS) schemes
       Hierarchical Signature System (HSS), eXtended Merkle Signature Scheme
       (XMSS), and XMSS^MT, a multi-tree variant of XMSS.  This
       specification applies to the Internet X.509 Public Key infrastructure
       (PKI) when those digital signatures are used in Internet X.509
       certificates and certificate revocation lists.</p>
