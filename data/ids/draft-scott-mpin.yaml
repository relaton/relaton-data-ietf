abstract:
- language: en
  script: Latn
  content: |-
    <p>In this document, the M-PIN protocol for authentication of digital
       identity is described. This protocol identifies a Client to a Server.
       M-PIN requires an external Trusted Authority to issue secrets to
       participating Clients and Servers.</p>
