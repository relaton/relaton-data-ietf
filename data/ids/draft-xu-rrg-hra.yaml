abstract:
- language: en
  script: Latn
  content: "<p>This document describes a new routing and addressing architecture,
    \n   which is based on identifier/locator split idea. This architecture \n   introduces
    a hierarchical routing mechanism to support routing across \n   multiple independent
    address spaces, besides, it also adopts a \n   hierarchical host identifier to
    ease the management of a global \n   identifier/locator mapping system.</p>"
