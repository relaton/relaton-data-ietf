abstract:
- language: en
  script: Latn
  content: |-
    <p>UTCSTAMP is an EDNS extension to allow a client to request from a
       server that it includes a timestamp in the response message, and for
       the server to provide it, if requested and deemed appropriate.  This
       is primarily intended as a debugging tool.</p>
