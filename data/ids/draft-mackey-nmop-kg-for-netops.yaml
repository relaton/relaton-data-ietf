  content: |-
    <p>This document describes some of the problems in modern operations and
       management systems and how knowledge graphs and RDF can be used to
       solve closed loop system, in an automatic way.

       Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/mike-mackey.</p>
