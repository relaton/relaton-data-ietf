abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a TCP option intended to facilitate
       transparent detection of middleboxes (or services playing that role)
       along the path of a TCP connection as the connection is made. The
       option has no effect if an appropriate middlebox is not on the path.</p>
