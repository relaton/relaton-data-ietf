abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft defines a portion of the Management Information Base (MIB)
       for use with network management protocols in the Internet community.
       In particular, it describes managed objects relevant for IP routes
       using IP Fast-Reroute [RFC5714]</p>
