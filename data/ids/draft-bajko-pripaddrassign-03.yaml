- language: en
  script: Latn
  content: "<p>This document defines an IPv4 DHCP Option and related methods to \n
    \  allocate the same IPv4 address to multiple nodes by sharing the \n   available
    port space. These options can be used in the context of \n   port range-based
    solutions (port range delegation) or NAT-based ones \n   (port delegation or port
