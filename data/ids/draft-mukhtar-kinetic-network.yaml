abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Kinetic Network Protocol, a decentralized
       naming and ownership protocol for binding human-readable names to
       cryptographic identity keys without a central registry, blockchain,
       or monetary renewal system.  Kinetic uses a commit-reveal flow,
       verifiable delay functions (VDFs), signed heartbeat records, and
       redundant Distributed Hash Table (DHT) storage to make name
       acquisition sequential, verifiable, and resistant to front-running,
       mass registration, and stale-state capture.  This document defines
       the protocol model, required records, validation rules, and security
       considerations for interoperable Kinetic network implementations.</p>
