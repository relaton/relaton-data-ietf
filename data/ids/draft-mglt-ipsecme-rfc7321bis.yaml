title:
- language: en
  script: Latn
  content: Cryptographic Algorithm Implementation Requirements and Usage Guidance
    for Encapsulating Security Payload (ESP) and Authentication Header (AH)
docidentifier:
- content: draft-mglt-ipsecme-rfc7321bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates the Cryptographic Algorithm Implementation
       Requirements for ESP and AH.  The goal of these document is to enable
       ESP and AH to benefit from cryptography that is up to date while
       making IPsec interoperable.

       This document obsoletes RFC 7321 on the cryptographic recommendations
       only.</p>
