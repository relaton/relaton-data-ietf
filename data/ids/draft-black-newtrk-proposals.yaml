abstract:
- language: en
  script: Latn
  content: |-
    <p>Discussions in the IETF's "problem" working group reached consensus
       that the current IETF 3-stage standards track, as implemented, is not
       working.  This draft proposes various alternative multi-step
       standards tracks for debate in the "newtrk" working group.</p>
