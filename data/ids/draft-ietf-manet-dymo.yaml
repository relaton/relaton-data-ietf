abstract:
- language: en
  script: Latn
  content: |-
    <p>The revised Ad Hoc On-demand Distance Vector (AODVv2) routing
       protocol is intended for use by mobile routers in wireless, multihop
       networks.  AODVv2 determines unicast routes among AODVv2 routers
       within the network in an on-demand fashion, offering on-demand
       convergence in dynamic topologies.</p>
