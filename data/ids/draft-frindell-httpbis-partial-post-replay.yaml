abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo introduces a method of exchanging HTTP [RFC7230] messages
       between a web server and a cooperating intermediary - such as a
       reverse proxy load balancer - that enables faster restarts for the
       web server with minimal disruption for users.</p>
