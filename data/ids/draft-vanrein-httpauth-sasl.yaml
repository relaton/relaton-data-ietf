title:
- language: en
  script: Latn
  content: HTTP Authentication with SASL
docidentifier:
- content: draft-vanrein-httpauth-sasl
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Most application-level protocols standardise their authentication
       exchanges under the SASL framework.  HTTP has taken another course,
       and often ends up replicating the work to allow individual
       mechanisms.  This specification adopts full SASL authentication into
       HTTP.</p>
