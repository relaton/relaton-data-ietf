  content: |-
    <p>This document describes a basic set of fundamental mechanisms for
    routing on a Low-power and Lossy Network (LLN).  It does not intend
    to specify a full-blown protocol.  It is rather offered as a basis to
    support the discussion while designing the ROLL protocol.</p>
