abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a profile of the rescap protocol [RESCAP-MAIN] for
    mail user agents (MUAs) and mail recipients. It describes the attributes
    that a mail sender might want or need to know about a particular mail
    recipient before sending a message.</p>
