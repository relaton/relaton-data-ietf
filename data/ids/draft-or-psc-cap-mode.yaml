abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces capabilites and modes to PSC.  A capability
       is an individual behavior, and a node's set of capabilities are
       signalled using the method given in this draft.  A mode is a
       particular combination of capabilities.</p>
