  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document clarifies an ambiguity in the Network Service Header
       (NSH) specification related to the handling of O bit.  In particular,
       this document clarifies the meaning of "OAM packet".

       This document updates RFC 8300.</p>
