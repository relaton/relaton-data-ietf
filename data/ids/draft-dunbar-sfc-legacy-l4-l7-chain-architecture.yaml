abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes the architecture for chaining existing Layer 4-
       7 service functions that are not aware of newly defined SFC header.
       The intent is to identify optimal architecture for flexibly chaining
       existing Layer 4-7 functions to meet various service needs.</p>
