  content: Additional XML Security Uniform Resource Identifiers (URIs)
docidentifier:
- content: draft-eastlake-rfc9231bis-xmlsec-uris
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates and corrects the IANA "XML Security URIs"
       registry that lists URIs intended for use with XML digital
       signatures, encryption, canonicalization, and key management.  These
       URIs identify algorithms and types of information.  This document
       obsoletes RFC 9231.</p>
