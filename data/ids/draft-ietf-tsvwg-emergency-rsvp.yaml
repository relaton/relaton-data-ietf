  content: RSVP Extensions for Admission Priority
docidentifier:
- content: draft-ietf-tsvwg-emergency-rsvp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Some applications require the ability to provide an elevated probability of session establishment to specific sessions in times of network congestion. When supported over the Internet Protocol suite, this may be facilitated through a network-layer admission control solution that supports prioritized access to resources (e.g., bandwidth). These resources may be explicitly set aside for prioritized sessions, or may be shared with other sessions. This document specifies extensions to the Resource reSerVation Protocol (RSVP) that can be used to support such an admission priority capability at the network layer.

     Based on current security concerns, these extensions are intended for use in a single administrative domain. [STANDARDS-TRACK]</p>
