abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes an extension to the DNS protocol that support the
       remote provisioning of zones on authoritative servers.  This addition
       is complementary to the existing mechanisms for provisioning zone
       data using the DNS protocol.</p>
