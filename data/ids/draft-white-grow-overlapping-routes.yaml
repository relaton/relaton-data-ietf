abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes an optional mechanism to remove a prefix when
       it overlaps with a functionally equivalent shorter prefix.  The
       proposed mechanism does not require any changes to the BGP protocol.</p>
