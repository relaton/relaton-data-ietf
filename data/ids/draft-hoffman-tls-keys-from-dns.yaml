abstract:
- language: en
  script: Latn
  content: |-
    <p>TLS requires the use of PKIX certificates for authenticating the
    server.  Some people want to obtain the public key used in this
    authentication using other methods.  This document describes how to
    securely retrieve a TLS server's public key from the DNS.</p>
