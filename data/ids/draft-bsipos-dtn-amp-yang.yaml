abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a YANG profile for defining Application Data
       Model (ADM) schema for the Asynchronous Management Protocol (AMP).
       The AMP has no relation to NETCONF; YANG is used here only for its
       language syntax, and its module and type systems.</p>
