abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC 7589 defines how to protect NETCONF messages with TLS 1.2.  This
       document updates RFC 7589 to address support requirements for TLS 1.2
       and TLS 1.3 and the use of TLS 1.3's early data.</p>
