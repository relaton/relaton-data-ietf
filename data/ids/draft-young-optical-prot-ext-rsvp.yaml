abstract:
- language: en
  script: Latn
  content: "<p>With this extension to the RSVP-TE protocol, an optical path can be
    \ninitiated with a requested maximum path restoration notification \ntime, and
    signalling nodes which make up the path can determine \ncompliance with this requirement
    and then establish the path.</p>"
