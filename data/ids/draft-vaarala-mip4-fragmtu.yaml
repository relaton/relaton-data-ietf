  content: Fragmentation MTU Extension for Mobile IPv4
docidentifier:
- content: draft-vaarala-mip4-fragmtu
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a vendor specific extension which allows a Mobile IPv4 node (MN, FA, or HA) to indicate its preferred maximum packet size for receiving encapsulated data packets. The intent is to work around problems in firewall configuration and implementation which prevent use
    of fragmentation and may arbitrarily limit maximum working packet size without useful error indications. The extension applies especially to UDP encapsulation where fragmentation occurs before encapsulation.</p>
