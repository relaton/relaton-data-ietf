abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes extensions to Resource Reservation Protocol -
       Traffic Engineering (RSVP-TE) for locally protecting the ingress node
       of a Traffic Engineered (TE) Label Switched Path (LSP) in a Multi-
       Protocol Label Switching (MPLS) and Generalized MPLS (GMPLS) network.</p>
