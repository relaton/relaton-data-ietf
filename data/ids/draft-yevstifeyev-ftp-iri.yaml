       via File Transfer Protocol (FTP).  It updates RFC-tbd.

       [NOTE TO RFC EDITOR: RFC-tbd refers to the [FTP-URI].  Please replace
       "tbd" when [FTP-URI] becomes an RFC with its number.]</p>
