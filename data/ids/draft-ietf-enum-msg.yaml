abstract:
- language: en
  script: Latn
  content: <p>This document registers the Enumservices "email", "fax", "sms", "ems",
    and "mms" using the URI schemes 'tel:' and 'mailto:' as per the IANA registration
    process defined in the ENUM specification RFC 3761. [STANDARDS-TRACK]</p>
