abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates several BGP Extended Community registries in
       order to replace the "Experimental Use" registration procedure in
       some entries, since their use is clearly not experimental and thus
       misleading.

       This document updates RFC7153.</p>
