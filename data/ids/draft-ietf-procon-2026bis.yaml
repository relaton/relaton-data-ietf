  content: The Internet Standards Process
docidentifier:
- content: draft-ietf-procon-2026bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo documents the process used by the Internet community for
       the standardization of protocols and procedures.  It defines the
       stages in the standardization process, the requirements for moving a
       document between stages, and the types of documents used during this
       process.  It also addresses the intellectual property rights and
       copyright issues associated with the standards process.

       This document obsoletes RFC 2026, RFC 5657, RFC 6410, RFC 7100, RFC
       7127, RFC 8789, and RFC 9282.  It also includes the changes from RFC
       7475.  If this document and [_2418bis] are published as RFCs, then
       taken together the two of them make RFC 7475 obsolete.</p>
