abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a method for calculating reverse paths by
       advertising reverse prefix costs. This method aims to solve the
       problem of strict RPF (Reverse Path Forwarding) check failure caused
       by mismatched bidirectional path costs in multi-area IGP scenarios.</p>
