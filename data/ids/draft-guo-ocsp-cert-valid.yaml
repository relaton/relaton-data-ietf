abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces a Certificate Validation extension and a
       Certificate Hash extension in the Online Certificate Status Protocol
       (OCSP) request message and response message, respectively.  OCSP is
       used to check the status of a certificate, and these two extensions
       are used to check the validity of that certificate.</p>
