abstract:
- language: en
  script: Latn
  content: |-
    <p>The "IPSEC Authentication Methods" registry created by IKE states
       that it can only be updated by Standards Track RFC.  In practice,
       this has not been the case.  This memo proposed to relax that
       requirement.</p>
