  content: Resource Discovery in Constrained RESTful Environments (CoRE) using the
    Constrained RESTful Application Language (CoRAL)
docidentifier:
- content: draft-hartke-t2trg-coral-reef
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document explores how the Constrained RESTful Application
       Language (CoRAL) might be used for two use cases in Constrained
       RESTful Environments (CoRE): CoRE Resource Discovery, which allows a
       client to discover the resources of a server given a host name or IP
       address, and CoRE Resource Directory, which provides a directory of
       resources on many servers.</p>
