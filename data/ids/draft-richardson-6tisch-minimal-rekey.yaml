abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes a mechanism to rekey the networks used by 6TISCH
       nodes.  It leverages the security association created during an
       enrollment protocol.  The rekey mechanism permits incremental
       deployment of new sets of keys, followed by a rollover to a new key.</p>
