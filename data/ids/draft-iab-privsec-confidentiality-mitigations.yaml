abstract:
- language: en
  script: Latn
  content: |-
    <p>The IAB has published [RFC7624] in response to several revelations of
       pervasive attack on Internet communications.  This document surveys
       the most plausible mitigations to those threats currently available
       to the designers of Internet protocols.</p>
