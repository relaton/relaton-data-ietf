abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines an interleaving scheme for RTP streams.
         This scheme is derived from the RTP payload format for redundant
         audio data [4] and hence is targetted primarily at streamed
         audio, although it may be of use in other scenarios.</p>
