  script: Latn
  content: SR Policies Extensions for Path Segment and Bidirectional Path in BGP-LS
docidentifier:
- content: draft-ietf-idr-bgp-ls-sr-policy-path-segment
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the way of collecting configuration and
       states of SR policies carrying Path Segment and bidirectional path
       information by using BPG-LS.  Such information can be used by
       external conponents for many use cases such as performance
       measurement, path re-optimization and end-to-end protection.</p>
