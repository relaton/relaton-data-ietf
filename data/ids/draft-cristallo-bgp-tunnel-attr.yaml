abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes the Tunnel Attribute, which may be used by a
    given BGP Speaker to indicate whether it expects to receive all,
    some, or none of its traffic through a tunnel and the types of tunnel
    that may be used.</p>
