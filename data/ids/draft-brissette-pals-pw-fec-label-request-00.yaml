abstract:
- language: en
  script: Latn
  content: |-
    <p>This document clarifies the behavior of an LSR PE upon receiving an
       LDP Label Request message for Pseudowire (PW) FEC types. Furthermore,
       this document specifies the procedures to be followed by the LSR PE
       in order to answer such requests for a given PW FEC type.</p>
