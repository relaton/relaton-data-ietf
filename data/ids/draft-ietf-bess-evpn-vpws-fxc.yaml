title:
- language: en
  script: Latn
  content: EVPN VPWS Flexible Cross-Connect Service
docidentifier:
- content: draft-ietf-bess-evpn-vpws-fxc
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a new EVPN VPWS service type specifically for
       multiplexing multiple attachment circuits across different Ethernet
       Segments and physical interfaces into a single EVPN VPWS service
       tunnel and still providing Single-Active and All-Active multi-homing.
       This new service is referred to as EVPN VPWS flexible cross-connect
       service.  This document specifies a solution based on extensions to
       EVPN VPWS(RFC8214) which in turn is based on extensions to EVPN
       (RFC7432).  Therefore, a thorough understanding of RFC7432 and
       RFC8214 are prerequisites for this document.</p>
