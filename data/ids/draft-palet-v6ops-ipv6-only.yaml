title:
- language: en
  script: Latn
  content: IPv6-only and IPv6-Mostly Terminology Definitions
docidentifier:
- content: draft-palet-v6ops-ipv6-only
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the terminology regarding the usage of
       expressions such as "IPv6-only" and "IPv6-Mostly", in order to avoid
       confusions when using them in IETF and other documents.  The goal is
       that the reference to "IPv6-only" describes the actual native
       functionality being used, not the actual protocol support.</p>
