abstract:
- language: en
  script: Latn
  content: |-
    <p>While DMARC is a powerful architecture to protect email users from
       malicious email activities, its deployment is still a work in
       progress.  To encourage further adoption of DMARC, in this draft we
       propose an incremental deployment procedure.</p>
