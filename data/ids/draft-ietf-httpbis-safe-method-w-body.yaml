id: draftietfhttpbissafemethodwbody
schema_version: v1.5.6
formattedref:
  content: draft-ietf-httpbis-safe-method-w-body
title:
- language: en
  script: Latn
  content: The HTTP QUERY Method
docidentifier:
- content: draft-ietf-httpbis-safe-method-w-body
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines the QUERY method for HTTP.  A QUERY
       requests that the request target process the enclosed content in a
       safe and idempotent manner and then respond with the result of that
       processing.  This is similar to POST requests but can be
       automatically repeated or restarted without concern for partial state
       changes.</p>
