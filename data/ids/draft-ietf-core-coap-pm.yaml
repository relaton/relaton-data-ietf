  content: Constrained Application Protocol (CoAP) Performance Measurement Option
docidentifier:
- content: draft-ietf-core-coap-pm
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a method for the Performance Measurement of
       the Constrained Application Protocol (CoAP).  A new CoAP option is
       defined in order to enable network telemetry both end-to-end and hop-
       by-hop.  The endpoints cooperate by marking and, possibly, mirroring
       information on the round-trip connection.</p>
