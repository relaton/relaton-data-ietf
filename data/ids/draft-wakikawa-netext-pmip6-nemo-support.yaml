abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an extension to Proxy Mobile IPv6 protocol
    for supporting network mobility.  The solution leverages the
    extensions defined in [RFC3963], [ID-DHCPPD-NEMO] and [RFC3633]
    specification for achieving this.</p>
