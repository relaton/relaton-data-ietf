abstract:
- language: en
  script: Latn
  content: |-
    <p>The existing Pseudowire LSP Ping can only work in IPv4 scenario, this
       document extends Pseudowire LSP Ping to IPv6 scenario where IPv6
       target LDP session is used to signal Pseudowire and the Sender and
       Receiver's IP addresses are IPv6 addresses.</p>
