abstract:
- language: en
  script: Latn
  content: |-
    <p>This document discusses the addition of a new operation to the
    proposed dtn: URI (Uniform Resource Identifier) scheme.  The new
    "find" operation would provide support for DTN (Delay- and
    Disruption-Tolerant Network) anycast services.</p>
