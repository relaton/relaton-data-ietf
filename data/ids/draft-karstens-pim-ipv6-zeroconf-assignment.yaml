abstract:
- language: en
  script: Latn
  content: |-
    <p>Describes a zero-configuration protocol for dynamically assigning
       IPv6 multicast addresses.  Applications randomly assign multicast
       group IDs from a reserved range and prevent collisions by using mDNS
       to publish records in a new "eth-addr.arpa" special-use domain.  This
       protocol satisfies all of the criteria listed in draft-karstens-pim-
       zeroconf-mcast-addr-alloc-ps.</p>
