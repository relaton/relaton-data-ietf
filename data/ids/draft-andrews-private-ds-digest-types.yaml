abstract:
- language: en
  script: Latn
  content: |-
    <p>When DS records where defined the ability to fully identify the
       DNSSEC algorithms using PRIVATEDNS and PRIVATEOID was overlooked.

       This documents specifies 2 DS Algorithm Types which allow the DNSSEC
       algorithm sub type to be encoded in the DS record.</p>
