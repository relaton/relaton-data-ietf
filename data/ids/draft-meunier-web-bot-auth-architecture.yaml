abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an architecture for identifying automated
       traffic using [HTTP-MESSAGE-SIGNATURES].  The goal is to allow
       automated HTTP clients to cryptographically sign outbound requests,
       allowing HTTP servers to verify their identity with confidence.</p>
