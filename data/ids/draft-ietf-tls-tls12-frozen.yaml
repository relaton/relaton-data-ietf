id: draftietftlstls12frozen
schema_version: v1.5.6
formattedref:
  content: draft-ietf-tls-tls12-frozen
title:
- language: en
  script: Latn
  content: TLS 1.2 is in Feature Freeze
docidentifier:
- content: draft-ietf-tls-tls12-frozen
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Use of TLS 1.3, which fixes some known deficiencies in TLS 1.2, is
       growing.  This document specifies that outside of urgent security
       fixes (as determine by TLS WG consensus), new TLS Exporter Labels, or
       new Application-Layer Protocol Negotiation (ALPN) Protocol IDs, no
       changes will be approved for TLS 1.2.  This prescription does not
       pertain to DTLS (in any DTLS version); it pertains to TLS only.</p>
