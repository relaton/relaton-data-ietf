abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a proposal for adding LoRaWAN support in
       RADIUS.  The purpose is to integrate the LoRaWAN network join
       procedure with an Authentication, Authorization and Accounting (AAA)
       infrastructure based on RADIUS.</p>
