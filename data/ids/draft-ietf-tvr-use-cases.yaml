abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces use cases where Time-Variant Routing (TVR)
       computations (i.e. routing computations taking into considerations
       time-based or scheduled changes to a network) could improve routing
       protocol convergence and/or network performance.</p>
