abstract:
- language: en
  script: Latn
  content: |-
    <p>[USRK] proposes a new mechanism for deriving cryptographically
       separate usage specific root keys (USRK) from the EAP extended master
       session key (EMSK).  This document follows the procedure suggested in
       [USRK] to derive root keys for Mobile IPv4, Mobile IPv6, and proxy
       Mobile IP.</p>
