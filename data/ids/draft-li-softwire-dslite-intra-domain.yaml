abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an automatic tunneling mechanism for
       providing IPv4 connectivity service to IPv6 end users in the same DS-
       Lite domain.  Key aspects include stateless operation and algorithmic
       mapping between IPv4 addresses and IPv6 tunnel endpoints.</p>
