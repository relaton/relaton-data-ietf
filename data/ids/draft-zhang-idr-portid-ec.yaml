abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces a new BGP extended community attribute for
       AI computing scenarios.  This attribute is used to carry the port ID
       when advertising routes on the switch before launching AI tasks,
       preparing for negotiation before sending large-scale traffic.</p>
