abstract:
- language: en
  script: Latn
  content: |-
    <p>Fastmail uses a number of keywords and mailbox names to implement
       mail functionality that others may wish to interoperate with.  This
       document notes what they are and how to use them, and registers them
       with IANA to avoid name collisions.</p>
