id: draftietfdnsop3901bis
schema_version: v1.5.6
formattedref:
  content: draft-ietf-dnsop-3901bis
title:
- language: en
  script: Latn
  content: Operational Guidelines for DNS Transport in Mixed IPv4/IPv6 Environments
docidentifier:
- content: draft-ietf-dnsop-3901bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides guidelines and documents Best Current Practice
       for operating authoritative DNS servers, recursive resolvers and stub
       resolvers in a mixed IPv4/IPv6 environment.  This document recommends
       that both authoritative DNS servers and recursive resolvers support
       IPv4 and IPv6.  It also provides guidance on how recursive DNS
       resolvers should select upstream DNS servers, including when
       IPv4-embedded IPv6 addresses are available.

       This document obsoletes RFC 3901.</p>
