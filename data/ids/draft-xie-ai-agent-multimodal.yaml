abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the Multimodal requirements for Agent-to-
       Agent Protocol, which enables autonomous agents to establish multi-
       channel communication sessions, negotiate heterogeneous data
       capabilities (e.g., text, file, real-time audio/video streams, sensor
       streams), and exchange synchronized multimodal content with adaptive
       QoS policies.</p>
