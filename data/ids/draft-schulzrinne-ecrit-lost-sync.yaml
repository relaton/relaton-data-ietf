abstract:
- language: en
  script: Latn
  content: |-
    <p>The LoST (Location-to-Service Translation) protocol is used to map
    locations to service URLs.  This document defines a set of LoST
    extensions that allow LoST servers to synchronize their lists of
    mappings.</p>
