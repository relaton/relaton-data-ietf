title:
- language: en
  script: Latn
  content: Announcing Supported Authentication Methods in IKEv2
docidentifier:
- content: draft-ietf-ipsecme-ikev2-auth-announce
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a mechanism that allows the Internet Key
       Exchange version 2 (IKEv2) implementations to indicate the list of
       supported authentication methods to their peers while establishing
       IKEv2 Security Association (SA).  This mechanism improves
       interoperability when IKEv2 partners are configured with multiple
       credentials of different type to authenticate each other.</p>
