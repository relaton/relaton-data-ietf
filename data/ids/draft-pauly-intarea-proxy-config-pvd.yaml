abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a mechanism for accessing provisioning domain
       information associated with a proxy, such as other proxy URIs that
       support different protocols and a list of DNS zones that are
       accessible via a proxy.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/tfpauly/privacy-proxy.</p>
