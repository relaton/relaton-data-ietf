abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies multicast procedures with RIFT.  Multicast in
       RIFT is similar to Bidirectional Protocol Independent Multicast (PIM-
       Bidir), with the Rendezvous Point Link (RP-Link) simulated by a
       spanning tree of some Top of Fabric (TOF) nodes and sub-TOF nodes.</p>
