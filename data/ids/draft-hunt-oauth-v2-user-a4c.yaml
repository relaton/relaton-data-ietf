title:
- language: en
  script: Latn
  content: Providing User Authentication Information to OAuth 2.0 Clients
docidentifier:
- content: draft-hunt-oauth-v2-user-a4c
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a way for OAuth 2.0 clients to verify the
       identity of the End-User and obtain consent based upon the
       authentication performed by an Authorization Server.  The
       interactions defined by this specification are intentionally
       compatible with the OpenID Connect protocol.</p>
