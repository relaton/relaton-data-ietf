- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community.
    In particular, it describes a set of managed objects that allow
    monitoring and configuration of middleboxes running a MIDCOM server,
    i.e. the MIDCOM MIB module RFC YYYY.</p>
