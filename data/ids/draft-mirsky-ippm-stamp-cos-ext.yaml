abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an optional extension to the Class of Service
       monitoring functionality of Simple Two-way Active Measurement
       Protocol that enables the upstream monitoring of the Explicit
       Congestion Notification and thus updates RFC 8972.</p>
