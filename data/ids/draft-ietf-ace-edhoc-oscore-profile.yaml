title:
- language: en
  script: Latn
  content: Ephemeral Diffie-Hellman Over COSE (EDHOC) and Object Security for Constrained
    Environments (OSCORE) Profile for Authentication and Authorization for Constrained
    Environments (ACE)
docidentifier:
- content: draft-ietf-ace-edhoc-oscore-profile
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a profile for the Authentication and
       Authorization for Constrained Environments (ACE) framework.  It
       utilizes Ephemeral Diffie-Hellman Over COSE (EDHOC) for achieving
       mutual authentication between an ACE-OAuth client and resource
       server, and it binds an authentication credential of the client to an
       ACE-OAuth access token.  EDHOC also establishes an Object Security
       for Constrained RESTful Environments (OSCORE) Security Context, which
       is used to secure communications between the client and resource
       server when accessing protected resources according to the
       authorization information indicated in the access token.  This
       profile can be used to delegate management of authorization
       information from a resource-constrained server to a trusted host with
       less severe limitations regarding processing power and memory.</p>
