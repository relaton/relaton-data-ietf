  content: 'Update to RFC 8717: IETF Administrative Terminology'
docidentifier:
- content: draft-rsalz-8717-update
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC 8717 updated several RFCs pertaining to the organization of the
       IETF to use the term "Managing Director, IETF Secretariat" (MDS).  As
       that term does not accurately reflect the organization or roles of
       the IETF staff, the MDS term is no longer relevant.  This document
       removes mention of particular staff roles, and instead updates the
       source documents so that the job to be done, and who the responsible
       entity is, are described.</p>
