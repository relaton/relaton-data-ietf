abstract:
- language: en
  script: Latn
  content: |-
    <p>Flow measurement based on Alternate-Marking method for IPv6 network
       requires the controller to collect statistical data, calculate and
       present the results. This document proposes a distributed method for
       in-situ flow measurement, which is indpendent of the controller.</p>
