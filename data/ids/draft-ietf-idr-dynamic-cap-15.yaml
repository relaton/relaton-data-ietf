abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a new BGP capability termed "Dynamic
       Capability", which would allow the dynamic update of capabilities
       over an established BGP session. This capability would facilitate
       non-disruptive capability changes by BGP speakers.</p>
