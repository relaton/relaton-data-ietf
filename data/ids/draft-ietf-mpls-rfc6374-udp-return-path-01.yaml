abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the proceedure to be used by the Packet Loss
       and Delay Measurement for MPLS Networks protocol defined in RFC6374
       when sending and processing MPLS performance management out-of-band
       responses for delay and loss measurements over an IP/UDP return path.</p>
