  content: |-
    <p>This document extends the WIMSE workload-to-workload authentication
       architecture with a mechanism for conveying attestation across TLS-
       terminating proxies, a deployment topology where TLS-layer
       attestation mechanisms lose their end-to-end security properties.</p>
