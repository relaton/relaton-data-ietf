abstract:
- language: en
  script: Latn
  content: |-
    <p>This document discusses the interaction of the Session Initiation
    Protocol (SIP) with with Network Address Translators (NATS) and
    firewalls. We show the difficulties in SIP traversing these devices,
    and we compare the solutions that might be used.</p>
