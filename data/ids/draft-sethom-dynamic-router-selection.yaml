abstract:
- language: en
  script: Latn
  content: "<p>In a network topology where the host has multiple routers on its \nDefault
    Router List, it is important to select the most suitable one \naccording to node’s
    application requirements. This document describes \nan extension to router advertisement
    message [RFC 1256, RFC 2461] for \ndynamic router selection. This new functionality
    is implemented in \nrouters with additional capabilities.</p>"
