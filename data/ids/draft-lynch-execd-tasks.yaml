abstract:
- language: en
  script: Latn
  content: |-
    <p>This document identifies jobs originally assigned to the IETF
       Executive Director in existing IETF processes, and in most cases re-
       assigns them formally to the IETF Secretariat.  It updates RFC 2028,
       2418, 3005, 3710, 3777, 3929, and 3979.</p>
