  content: |-
    <p>This document defines a JavaScript Object Notation (JSON) Web Key
       (JWK) object to wrap Public Key Infrastructure (X.509) (PKIX)
       certificate chains, to allow for some interoperability between
       existing PKIX-based systems and newer JOSE-based systems.</p>
