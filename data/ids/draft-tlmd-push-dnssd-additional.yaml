abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends DNS Push Notifications by providing ways for
       DNS Push subscribers to track additional data as well as direct
       answers to DNS questions.  This is analogous to the support for
       additional data specified for multicast DNS, for example.</p>
