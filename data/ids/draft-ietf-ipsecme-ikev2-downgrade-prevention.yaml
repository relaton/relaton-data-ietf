title:
- language: en
  script: Latn
  content: Downgrade Prevention for the Internet Key Exchange Protocol Version 2 (IKEv2)
docidentifier:
- content: draft-ietf-ipsecme-ikev2-downgrade-prevention
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an extension to the Internet Key Exchange
       protocol version 2 (IKEv2) in which the peers authenticate the full
       IKE_SA_INIT transcript.  When both peers implement the extension and
       at least one relevant authentication credential is not compromised,
       this prevents certain downgrade attacks on IKEv2.

       This document updates RFC 7296.</p>
