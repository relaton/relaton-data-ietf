abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a protocol to determine the liveness of
    routing protocols such as OSPF and BGP.  The basic idea is to have a
    single simple mechanism for liveness for all protocols, and thereby
    to allow fast detection of failures.</p>
