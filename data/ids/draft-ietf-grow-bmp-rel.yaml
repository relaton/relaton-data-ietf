  content: Logging of routing events in BGP Monitoring Protocol (BMP)
docidentifier:
- content: draft-ietf-grow-bmp-rel
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The BGP Monitoring Protocol (BMP) does provide for BGP session event
       logging (Peer Up, Peer Down), state synchronization (Route
       Monitoring), debugging (Route Mirroring) and Statistics messages,
       among others.  This document defines a new Route Event Logging (REL)
       message type for BMP with the aim of covering use cases with affinity
       to alerting, reporting and on-change analysis.</p>
