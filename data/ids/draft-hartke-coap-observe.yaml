abstract:
- language: en
  script: Latn
  content: |-
    <p>The state of a resource can change over time.  We want to give
    clients of the CoRE WG CoAP protocol the ability to observe this
    change.  This short I-D provides a design for such an addition to
    CoAP.</p>
