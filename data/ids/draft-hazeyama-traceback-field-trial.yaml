abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo reports a field trial of Inter-Domain Traceback Operation
       in Japan as a proof of concept on IP packet traceback. This field
       trial was carried out with 15 commercial ISPs and one traceback
       control center which was a mediator among participated ISPs.</p>
