abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies the IANA Registration Guidelines for
       Trustwords, describes corresponding registration procedures, and
       provides a guideline for creating Trustword list specifications.

       Trustwords are common words in a natural language (e.g., English) to
       which the hexidecimal strings are mapped to.  This makes verification
       processes (e.g., comparision of fingerprints), more practical and
       less prone to misunderstandings.</p>
