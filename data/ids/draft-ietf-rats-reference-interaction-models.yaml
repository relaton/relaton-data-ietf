  content: Reference Interaction Models for Remote Attestation Procedures
docidentifier:
- content: draft-ietf-rats-reference-interaction-models
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes interaction models for remote attestation
       procedures (RATS) [RFC9334].  Three conveying mechanisms --
       Challenge/Response, Uni-Directional, and Streaming Remote Attestation
       -- are illustrated and defined.  Analogously, a general overview
       about the information elements typically used by corresponding
       conveyance protocols are highlighted.</p>
