title:
- language: en
  script: Latn
  content: A Larger Internet Key Exchange version 2 (IKEv2) Payload
docidentifier:
- content: draft-nir-ipsecme-big-payload
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The messages of the Internet Key Exchange version 2 (IKEv2) protocol
       are made up of payloads.  The current protocol limits each of these
       payloads to 64KB by having a 2-byte length field.  While this is
       usually enough, several of the payloads may need to be larger.

       This document updates RFC 7296 by defining an extension that allows
       larger payloads.</p>
