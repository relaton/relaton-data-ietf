abstract:
- language: en
  script: Latn
  content: |-
    <p>The document introduces a new mode of interpretation of the bitmask
       field in the BIER encoding, called unmasked BIER, that solves the
       problem of BIER originator targeting receivers across many different
       sets and hence, in worst case, degrading into ingress replication.</p>
