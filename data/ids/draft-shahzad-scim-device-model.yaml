  content: Device Schema Extensions to the SCIM model
docidentifier:
- content: draft-shahzad-scim-device-model
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The initial core schema for SCIM (System for Cross Identity
       Management) was designed for provisioning users.  This memo specifies
       schema extensions that enables provisioning of devices, using various
       underlying bootstrapping systems, such as Wifi EasyConnect, RFC 8366
       vouchers, and BLE passcodes.</p>
