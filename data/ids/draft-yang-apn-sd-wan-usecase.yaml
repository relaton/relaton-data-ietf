  content: Usage scenarios of Application-aware Networking (APN) for SD-WAN
docidentifier:
- content: draft-yang-apn-sd-wan-usecase
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the usage of Application-aware Networking
       (APN) in SD-WAN scenarios.  In these scenarios, APN is able to
       identify a application group, steer its traffic flows along explicit
       path across the network, and provide SLA guaranteed network services
       such as low latency and high reliability.</p>
