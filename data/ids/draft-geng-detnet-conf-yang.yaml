abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model for Deterministic Networking
       (DetNet), which includes the DetNet topology YANG module, DetNet flow
       configuration YANG module and DetNet Transport QoS YANG Module.

       The YANG modules in this document conform to the Network Management
       Datastore Architecture (NMDA).</p>
