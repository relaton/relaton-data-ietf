title:
- language: en
  script: Latn
  content: PQ/T Composite Schemes for OpenPGP using NIST and Brainpool Elliptic Curve
    Domain Parameters
docidentifier:
- content: draft-ietf-openpgp-nist-bp-comp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines PQ/T ("post-quantum/traditional") composite
       schemes based on ML-KEM and ML-DSA combined with ECDH and ECDSA
       algorithms using the NIST and Brainpool domain parameters for the
       OpenPGP protocol [RFC9580], and as such extends [RFC9980].</p>
