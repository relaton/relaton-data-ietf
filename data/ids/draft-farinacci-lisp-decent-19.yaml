abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes how the LISP mapping system designed to be
       distributed for scale can also be decentralized for management and
       trust.  The intended status for this document is Informational RFC
       and should be used by LISP-Decent implementations to interoperate
       with each other.</p>
