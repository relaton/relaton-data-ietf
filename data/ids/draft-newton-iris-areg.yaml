  content: |-
    <p>This document describes an IRIS registry namespace and schema for
    registered Internet address information.  The schema extends the
    necessary query and result operations of IRIS
    (draft-newton-iris-00.txt) to provide the functional information
    service needs for syntaxes and results used by Internet address
    registries.</p>
