  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes a variation of RFC2547 [RFC2547] in which the
    outermost MPLS label of a VPN packet is replaced with either IP or a
    GRE encapsulation. This enables the VPN packets to be carried over
    non-MPLS networks.</p>
