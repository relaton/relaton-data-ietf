- language: en
  script: Latn
  content: |-
    <p>This document distinguishes between the terms "function" and "path".
       It also recommends against use of the terms "fast path", "slow path",
       and "host path" in IETF documents.  However, it defines the terms
       "congestion vulnerable path" and "congestion critical path".</p>
