abstract:
- language: en
  script: Latn
  content: |-
    <p>This document outlines the applicability of Abstraction and
         Control of Traffic Engineered Networks (ACTN) to Packet &amp; Optical
         Integration (POI). It also identifies a number of deployment
         scenarios to support L3VPN and L2VPN in operator's networks and
         provides implementation guidelines.</p>
