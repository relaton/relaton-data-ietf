abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a framework for defining content for NETCONF using
    a meta-model and XML Schema.  The approach is to build on existing
    well-deployed technology and overlap management specific semantics to
    ensure high-quality interoperable definition of NETCONF content.</p>
