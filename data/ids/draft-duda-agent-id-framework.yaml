abstract:
- language: en
  script: Latn
  content: |-
    <p>We present an identity and delegation framework for secure AI agent
       communications.  The framework introduces a set of entities including
       Client AI Agents, Service AI Agents, Agent Providers, and Agent
       Brokers, together with a Trustful Mutable Store responsible for
       maintaining cryptographically verifiable identity bindings.  We
       propose self-certifying identifiers derived from public keys,
       realized as DNS-based Self-certifying Identifiers (SIDs) and IPFS-
       based Identifiers (IIDs), which provide lightweight decentralized
       identities for agents.  To support trust establishment, we
       distinguish identity from trust and introduce a model that combines
       globally meaningful names, cryptographic identities, and trusted
       intermediaries such as Agent Providers and Agent Brokers.  We show
       how DNS/DNSSEC and IPFS/IPNS can be used as distributed, highly
       available, integrity-protected, and mutable infrastructures for
       managing AI agent identities and trust metadata.</p>
