abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community.
    In particular, it defines the contents of messages that will be used
    primarily by sensors to send alerts to managers when an intrusion
    related event is detetcted.</p>
