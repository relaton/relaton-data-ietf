abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo specifies a distributed mechanism for testing the
    uniqueness of identifiers within a connected collection of devices.
    The mechanism supports multiple identifier domains, and uses only
    link-local communication and flooding.</p>
