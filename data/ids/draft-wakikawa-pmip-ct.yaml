abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces a simple Context Transfer mechanism for
    Proxy Mobile IPv6.  This context transfer mechanism can carry
    information of a mobile node between mobility anchor gateways without
    any assumption of inter-MAG trust nor direct connectivity.</p>
