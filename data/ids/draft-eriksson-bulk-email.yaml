abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo describes an SMTP extension to differentiate between
    ordinary and unsolicited (bulk) e-mail.  This can in turn be used
    as a mailbox-by-mailbox opt-in or opt-out mechanism for allowing
    or disallowing bulk e-mail.</p>
