abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the local domain name option for DHCPv4 and
    DHCPv6. This option is used by the Peer (DHCP client) to request
    local domain name described in [RFC5296] which is used to derive the
    local root key, e.g., DSRK defined in [RFC5295].</p>
