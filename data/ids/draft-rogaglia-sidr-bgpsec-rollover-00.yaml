abstract:
- language: en
  script: Latn
  content: |-
    <p>The current BGPSEC draft documents do not specifies a key roll-over
       process for routers.  This document describes a possible key roll-
       over process and explores its impact to mitigate replay attacks and
       eliminate the need for beaconing in BGPSEC.</p>
