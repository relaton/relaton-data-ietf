  content: A YANG Data Model for Interface Management
docidentifier:
- content: draft-bjorklund-netmod-rfc7223bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a YANG data model for the management of network
       interfaces.  It is expected that interface-type-specific data models
       augment the generic interfaces data model defined in this document.
       The data model includes definitions for configuration and system
       state (status information and counters for the collection of
       statistics).  This document obsoletes RFC 7223.</p>
