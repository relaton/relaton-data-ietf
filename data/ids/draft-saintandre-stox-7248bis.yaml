abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a bi-directional protocol mapping for the
       exchange of presence information between the Session Initiation
       Protocol (SIP) and the Extensible Messaging and Presence Protocol
       (XMPP).  This document obsoletes RFC 7248.</p>
