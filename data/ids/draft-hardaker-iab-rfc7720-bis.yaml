abstract:
- language: en
  script: Latn
  content: |-
    <p>The DNS root name service is a critical part of the Internet
       architecture.  The DNS root name service's DNS protocol and
       deployment requirements are defined in this document.  Operational
       requirements for the root name service are out of scope.</p>
