abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the procedures for generating and handling
       liaison statements between the IETF and other Standards Development
       Organizations (SDOs), so that the IETF can effectively collaborate
       with other organizations in the international standards community.</p>
