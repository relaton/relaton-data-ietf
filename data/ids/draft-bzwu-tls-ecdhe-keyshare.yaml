abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension that allows a TLS client to carry
       Elliptic Curve Diffie-Hellman Ephemeral (ECDHE) keyshare in
       ClientHello message, so as to reduce the full handshake latency of
       one network round-trip times (RTT).</p>
