abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes transmission of IPv6 packets over Ethernet CS
    over IEEE 802.16 network.  In this document, two possible network
    deployment scenarios are discussed and behaviors for corresponding
    scenario are suggested in order to support IPv6 transmission over
    Ethernet CS over IEEE 802.16 network.</p>
