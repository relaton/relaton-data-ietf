abstract:
- language: en
  script: Latn
  content: |-
    <p>The Border Gateway Protocol (BGP) is a critical component in the
       Internet to exchange routing information between network domains.
       Due to this central nature, it is important to understand the
       security and reliability requirements that can and should be ensured
       to prevent accidental or intentional routing disturbances.  This
       document describes security requirements and goals when operating BGP
       for exchanging routing information with other networks, and
       explicitly does not focus on specific technical implementations and
       requirements.</p>
