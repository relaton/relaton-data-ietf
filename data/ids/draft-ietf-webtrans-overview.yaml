title:
- language: en
  script: Latn
  content: The WebTransport Protocol Framework
docidentifier:
- content: draft-ietf-webtrans-overview
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The WebTransport Protocol Framework enables clients constrained by
       the Web security model to communicate with a remote server using a
       secure multiplexed transport.  It consists of a set of individual
       protocols that are safe to expose to untrusted applications, combined
       with an abstract model that allows them to be used interchangeably.

       This document defines the overall requirements on the protocols used
       in WebTransport, as well as the common features of the protocols,
       support for some of which is optional.</p>
