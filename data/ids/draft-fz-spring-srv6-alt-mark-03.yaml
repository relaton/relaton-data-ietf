abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how the Alternate Marking Method can be used
       as the passive performance measurement tool in an SRv6 network.  It
       defines how Alternate Marking data fields are transported as part of
       the Segment Routing with IPv6 data plane (SRv6) header.</p>
