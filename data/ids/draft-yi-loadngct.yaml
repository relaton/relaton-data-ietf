abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the Collection Tree Protocol for Lightweight
       Ad hoc On-Demand - Next Generation (LOADng-CT) to build routes
       between a designated root and all the other routers in Mobile Ad Hoc
       NETworks (MANETs).  The protocol is an extension of LOADng.</p>
