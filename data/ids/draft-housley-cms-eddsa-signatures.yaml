abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the conventions for using Edwards-curve
       Digital Signature Algorithm (EdDSA) in the Cryptographic Message
       Syntax (CMS).  The conventions for Ed25519, Ed25519ph, Ed448, and
       Ed448ph are described.</p>
