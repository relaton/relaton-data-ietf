abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification describes the format of a manifest.  A manifest is
       a bundle of metadata about the firmware for an IoT device, where to
       find the firmware, the devices to which it applies, and cryptographic
       information protecting the manifest.</p>
