title:
- language: en
  script: Latn
  content: A Taxonomy of operational security considerations for manufacturer installed
    keys and Trust Anchors
docidentifier:
- content: draft-irtf-t2trg-taxonomy-manufacturer-anchors
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides a taxonomy of methods used by manufacturers of
       silicon and devices to secure private keys and public trust anchors.
       This deals with two related activities: how trust anchors and private
       keys are installed into devices during manufacturing, and how the
       related manufacturer held private keys are secured against
       disclosure.

       This document does not evaluate the different mechanisms, but rather
       just serves to name them in a consistent manner in order to aid in
       communication.


       // This document is a product of the Internet Research Task Force
       // (IRTF).  The IRTF publishes the results of Internet-related
       // research and development activities.  These results might not be
       // suitable for deployment.</p>
