abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines how to encapsulate IP within IP when the tunnel
       is managed with HIPv2 [RFC7401].  The goal is reduced header size and
       improved security over IPnIP [RFC2003] and [RFC2004].</p>
