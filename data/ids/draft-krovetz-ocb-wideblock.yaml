  content: OCB For Block Ciphers Without 128-Bit Blocks
docidentifier:
- content: draft-krovetz-ocb-wideblock
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The OCB authenticated-encryption algorithm is specified in RFC 7523,
       but only for blockciphers with 128-bit blocks such as AES.  This
       document extends RFC 7523 by specifying how OCB is used with
       blockciphers of any blocklength.  When the blocklength is 128 bits,
       this specification and that in RFC 7523 are identical.</p>
