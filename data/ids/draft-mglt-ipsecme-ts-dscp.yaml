  content: Traffic Selector for Internet Key Exchange version 2 to add support Differentiated
    Services Field Codepoints (DSCP)
docidentifier:
- content: draft-mglt-ipsecme-ts-dscp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Agreeing on SA with specific Differentiated Services Field Codepoints
       (DSCP) is not possible today as traffic selector does not consider
       DSCP.  This document enables to further specify DSCP the current
       traffic selectors with a new Traffic Selector Type.

       The Traffic Selector Type can only be used in tunnel mode.</p>
