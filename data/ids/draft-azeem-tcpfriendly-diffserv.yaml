abstract:
- language: en
  script: Latn
  content: |-
    <p>This informational draft presents performance problems associated
       with TCP flows running over the assured service. It proposes the use
       of TCP-friendly differentiated services building blocks, specifically
       TCP friendly traffic conditioners to alleviate these problems.</p>
