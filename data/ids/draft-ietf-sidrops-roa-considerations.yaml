title:
- language: en
  script: Latn
  content: Avoidance of ROA Containing Multiple IP Prefixes
docidentifier:
- content: draft-ietf-sidrops-roa-considerations
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>When using the Resource Public Key Infrastructure (RPKI), address
       space holders need to issue Route Origin Authorization (ROA)
       object(s) to authorize one or more Autonomous Systems (ASes) to
       originate routes to IP address prefix(es).  This memo discusses
       operational problems which may arise from ROAs containing multiple IP
       prefixes and recommends that each ROA contains a single IP prefix.</p>
