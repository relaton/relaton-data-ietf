abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces the bitwise match filter component for
       source and destination IPv4/IPv6 address fields.  These components
       enhance the BGP Flow Specification framework and provide a solution
       for dynamic symmetric traffic load-balancing.</p>
