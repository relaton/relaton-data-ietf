  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>YANG models frequently define identifiers using string or string-
       derived types whose lexical space permits multiple representations of
       the same underlying value.  This can lead to incorrect behavior when
       semantically equivalent values are compared lexically.

       This document add an optional extension to the existing YANG concept
       of normalized form to string-derived types whose lexical space
       permits multiple representations of the same underlying value.</p>
