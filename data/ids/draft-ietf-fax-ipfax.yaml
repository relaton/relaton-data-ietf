abstract:
- language: en
  script: Latn
  content: |-
    <p>This Internet Draft defines the procedures  to be applied to allow Group
    3 facsimile transmission between terminals where in addition to the GSTN
    or ISDN a portion of the transmission path used between terminals
    includes an IP network, e.g. the Internet.</p>
