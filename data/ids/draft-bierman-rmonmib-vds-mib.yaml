abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB) for
    use with network management protocols in the Internet community.  In
    particular, it describes managed objects used for defining virtual data
    monitoring sources for use with existing RMON MIBs.</p>
