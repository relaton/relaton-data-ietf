abstract:
- language: en
  script: Latn
  content: |-
    <p>The Application-Layer Traffic Optimization (ALTO) Service has defined
       network and cost maps to provide basic network information.  In this
       document, we discuss designs to provide abstracted (node-link) graph
       representations of network topology.</p>
