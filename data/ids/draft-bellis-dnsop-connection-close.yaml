abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates [RFC6891] by specifying a new single-bit flag
       in a DNS response that when seen in a packet carried over a
       connection-orientated transport protocol indicates to the client that
       it should close the current connection.</p>
