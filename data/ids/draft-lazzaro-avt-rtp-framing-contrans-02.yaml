- language: en
  script: Latn
  content: |-
    <p>This memo defines a method for framing Real Time Protocol (RTP) and
    Real Time Control Protocol (RTCP) packets onto connection-oriented
    transport (such as TCP and TLS).  The memo also defines how to
    specify the framing method in a session description.</p>
