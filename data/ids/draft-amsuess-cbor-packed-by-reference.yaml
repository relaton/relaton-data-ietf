  content: 'Packed CBOR: Table set up by reference'
docidentifier:
- content: draft-amsuess-cbor-packed-by-reference
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Packed CBOR is a mechanism for transforming Concise Binary Object
       Representation (CBOR) data into a more compact form.  This document
       introduces a means for setting up its tables by means of
       dereferenceable identifiers, and introduces a pattern of using it
       without sending long identifiers.</p>
