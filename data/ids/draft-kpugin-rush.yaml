- language: en
  script: Latn
  content: |-
    <p>RUSH is an application-level protocol for ingesting live video.  This
       document describes the protocol and how it maps onto QUIC.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Discussion of this document takes place on the mailing list (), which
       is archived at .

       Source for this draft and an issue tracker can be found at
       https://github.com/afrind/draft-rush.</p>
