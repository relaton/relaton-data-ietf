abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a set of cipher suites for the Transport
       Security Layer (TLS) protocol to support the CLEFIA encryption
       algorithm as a block cipher.  CLEFIA is a lightweight block cipher
       and suitable for constrained devices.</p>
