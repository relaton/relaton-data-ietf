abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a method for network operators to indicate that
       information about their network is broadcast only to allow legitimate
       participants in the network to connect or re-connect to them, and
       that other uses of such information are to be avoided.</p>
