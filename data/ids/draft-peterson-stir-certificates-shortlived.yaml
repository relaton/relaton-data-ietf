  content: Short-Lived Certificates for Secure Telephone Identity
docidentifier:
- content: draft-peterson-stir-certificates-shortlived
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>When certificates are used as credentials to attest the assignment of
       ownership of telephone numbers, some mechanism is required to provide
       certificate freshness.  This document specifies short-lived
       certificates as a means of guaranteeing certificate freshness for
       secure telephone identity (STIR), potentially relying on the
       Automated Certificate Management Environment (ACME) or similar
       mechanisms to allow signers to acquire certificates as needed.</p>
