abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the 'auth:' Uniform Resource Identifier (URI)
    scheme for hierarchical authority identifiers.
    The 'auth:' URI scheme belongs to the class of Hierarchical URI
    Schemes as defined in RFC 2396 'Uniform Resource Identifiers (URI):
    Generic Syntax'.</p>
