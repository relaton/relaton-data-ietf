abstract:
- language: en
  script: Latn
  content: <p>This memo describes an extension to the message format defined in [1]
    (known to the IETF Mail Extensions Working Group as "RFC 1341"), to allow the
    representation of character sets other than ASCII in RFC 822 message headers.
    [STANDARDS-TRACK]</p>
