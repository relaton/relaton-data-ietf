abstract:
- language: en
  script: Latn
  content: |-
    <p>Content-Types may have 'parameter' to make fine-grained description
       of contents.  The CoAP Accept Content-Type Parameter Option (Accept-
       CT-Parameter Option) is CoAP options to add a parameter to a content
       type specified in CoAP Accept Options.</p>
