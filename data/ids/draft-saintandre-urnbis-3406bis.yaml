abstract:
- language: en
  script: Latn
  content: |-
    <p>This document supplements the Uniform Resource Name (URN) syntax
       specification by defining the concept of a URN namespace, as well as
       mechanisms for defining and registering such namespaces.  This
       document obsoletes RFC 3406.</p>
