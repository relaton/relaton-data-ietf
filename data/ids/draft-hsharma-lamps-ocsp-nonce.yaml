  content: Online Certificate Status Protocol (OCSP) Nonce Extension
docidentifier:
- content: draft-hsharma-lamps-ocsp-nonce
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates the Nonce extension section of RFC-8954.  Nonce
       extension is a optional extension for Online Certificate Status
       Protocol (OCSP) request and response messages.  OCSP is used for
       checking the status of a certificate, and the Nonce extension is used
       to cryptographically bind an OCSP response message to a particular
       OCSP request message.  This document updates RFC 8954.</p>
