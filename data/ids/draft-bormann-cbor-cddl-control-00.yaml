abstract:
- language: en
  script: Latn
  content: |-
    <p>The Concise Data Definition Language (CDDL), standardized in RFC
       8610, provides "control operators" as its main language extension
       point.

       The present document defines a number of control operators that did
       not make it into RFC 8610.</p>
