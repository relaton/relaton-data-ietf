abstract:
- language: en
  script: Latn
  content: |-
    <p>Network of cooperating and mutually trusting DNS resolvers could
       benefit from cache sharing, where one resolver would distribute the
       result of a resolution to other resolvers.  This document
       standardizes a protocol to do so.</p>
