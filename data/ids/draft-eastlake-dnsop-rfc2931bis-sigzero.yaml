title:
- language: en
  script: Latn
  content: Domain Name System (DNS) Public Key Based Request and Transaction Authentication
    ( SIG(0) )
docidentifier:
- content: draft-eastlake-dnsop-rfc2931bis-sigzero
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies use of the Domain Name System (DNS) SIG
       Resource Record (RR) to provide a public key based authentication of
       DNS requests and transactions.  Such a resource record, because it
       has a "type covered" field of zero, is frequently called a "SIG(0)".
       This document obsoletes RFC 2931.</p>
