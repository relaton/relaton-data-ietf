abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification adds to the core set of configuration metadata
       defined in RFC8006, providing delivery metadata to define traffic
       types, request delegation behavior for downstream CDN (dCDN) node
       selection, and request routing modes of traffic delegation.</p>
