- content: draft-ietf-idr-enhanced-gr
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>In this document we specify extensions to BGP graceful restart in
       order to avoid unnecessary transmission of the routing information
       preserved across a session restart, thus accelerating the routing
       convergence.</p>
