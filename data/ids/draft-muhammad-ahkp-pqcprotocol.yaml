abstract:
- language: en
  script: Latn
  content: |-
    <p>The Abdelaziz Hybrid Key Protocol, a.k.a. AHKP, was designed to
       protect systems with hybrid, post-quantum mechanics and transition to
       full PQC in the future.  It is used in high-security environments to
       protect against quantum attacks.</p>
