- content: draft-zhu-spnego-2478bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a negotiation mechanism for the Generic
       Security Service Application Program Interface (GSS-API) which is
       described in RFC 2743.

       GSS-API peers can use this negotiation mechanism to choose from a
       common set of security mechanisms.</p>
