title:
- language: en
  script: Latn
  content: 'web-stream: A General Purpose Message Framing over Byte-Stream Oriented
    Wire Protocols'
docidentifier:
- content: draft-yoshino-wish
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines web-stream, a general-purpose message framing
       designed to support message-based communication over any byte-stream
       oriented L4 or L7 protocols, in particular HTTP as in its standard
       semantics [RFC9110].

       web-stream can be viewed as a binary alternative to the framing
       defined for the server-sent events (SSE) [SSE].  This was the
       original goal when the initial version of this proposal was published
       in 2017.</p>
