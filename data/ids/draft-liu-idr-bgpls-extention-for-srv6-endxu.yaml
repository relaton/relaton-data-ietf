abstract:
- language: en
  script: Latn
  content: |-
    <p>The SRv6 END.XU function points to an underlying interface, which can
       represent an underly link (or path) between two routers.  This
       document extends BGP-LS to advertise the link attributes of underlay
       link and the END.XU SID information.</p>
