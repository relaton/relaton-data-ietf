id: draftietf6mandeprecaterouteralert
schema_version: v1.5.6
formattedref:
  content: draft-ietf-6man-deprecate-router-alert
title:
- language: en
  script: Latn
  content: Deprecation Of The IPv6 Router Alert Option For New Protocols
docidentifier:
- content: draft-ietf-6man-deprecate-router-alert
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document deprecates the IPv6 Router Alert Option.  Protocols
       that use the Router Alert Option may continue to do so, even in
       future versions.  However, new protocols that are standardized in the
       future must not use the Router Alert Option.

       This document updates RFC 2711.</p>
