abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the identity trust system, which is an open
       identity authentication system that requires no federation of
       authentication domains.  It is based on a symmetric authentication
       protocol and a specific infrastructure based on trust in Identity
       Providers (IdPs).  Below are the main components of the
       authentication process between two entities.</p>
