  content: |-
    <p>This document describes DoHPE (DoH with Privacy Enhancements) - a
       privacy and anonymity profile for DoH [I-D.ietf-doh-dns-over-https]
       clients.  The profile provides guidelines on the composition of DoH
       messages, designed to minimize disclosure of identifying information.</p>
