abstract:
- language: en
  script: Latn
  content: |-
    <p>A vertical handover occurs in heterogeneous networks when a session
    media is moved among different access network technologies within the
    same device.  This document analyses the issue of handling the
    vertical handover using the Session Initiation Protocol (SIP) [1].</p>
