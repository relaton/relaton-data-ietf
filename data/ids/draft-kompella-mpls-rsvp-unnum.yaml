abstract:
- language: en
  script: Latn
  content: |-
    <p>Current signalling used by MPLS TE doesn't provide support for
    unnumbered links.  This document defines procedures and extensions to
    RSVP-TE, one of the MPLS TE signalling protocols, that are needed in
    order to support unnumbered links.</p>
