abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes a family of default quantisation matrices
       that may be used to improve perceptual quality when encoding with
       Thor. Similar quantisation matrix designs may be used in most
       block-based video and image codecs.</p>
