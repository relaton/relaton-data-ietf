abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes considerations for and implications of using
       application identifiers as a method of differentiating traffic on
       networks.  Specifically, it discusses privacy considerations,
       possible mitigations, and considerations for user experience and API
       design.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/tfpauly/per-app-networking-considerations.</p>
