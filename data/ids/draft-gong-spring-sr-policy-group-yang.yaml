abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines YANG data models for Segment Routing (SR)
       Policy group that can be used for configuring, instantiating, and
       managing SR Policy groups. The model is generic and apply equally to
       the MPLS and SRv6 instantiations of SR policy groups.</p>
