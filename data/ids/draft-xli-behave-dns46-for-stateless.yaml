  content: DNS46 for the IPv4/IPv6 Stateless Translator
docidentifier:
- content: draft-xli-behave-dns46-for-stateless
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The stateless translator can support IPv6-initiated communications as
       well as IPv4-initiated communications for IPv6 hosts using IPv4-
       translatable addresses.  DNS support for the IPv6-initiated
       communication is defined in the DNS64 specification.  This document
       defines the DNS46 function for the stateless translator.</p>
