  content: |-
    <p>This document describes qlog data type definitions for both the QUIC
       Datagram Frame defined in [RFC9221] and the HTTP/3 Datagram Frame
       defined in [RFC9297].  These data types are intended for use within
       event definitions defined in [QLOG-QUIC] and [QLOG-HTTP3].</p>
