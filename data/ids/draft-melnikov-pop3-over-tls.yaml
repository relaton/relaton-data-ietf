abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies how the Post Office Protocol, Version 3
       (POP3) may be secured with Transport Layer Security (TLS) protocol,
       by establishing TLS connection directly before POP3 transaction.  It
       updates RFC 2595.</p>
