abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends the stability of 6to4 and Teredo routing by
    defining the global anycast routes 2002::/16 and 2001::/32 as a
    routes of last resort. More specific unicast routes are allowed in
    order to create a more stable environment.</p>
