abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a means for a client, representing a
       requesting party, to use a permission ticket to request an OAuth 2.0
       access token to gain access to a protected resource asynchronously
       from the time a resource owner authorizes access.</p>
