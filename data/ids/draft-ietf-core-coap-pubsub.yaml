id: draftietfcorecoappubsub
schema_version: v1.5.6
formattedref:
  content: draft-ietf-core-coap-pubsub
title:
- language: en
  script: Latn
  content: A publish-subscribe architecture for the Constrained Application Protocol
    (CoAP)
docidentifier:
- content: draft-ietf-core-coap-pubsub
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a publish-subscribe architecture for the
       Constrained Application Protocol (CoAP), extending the capabilities
       of CoAP communications for supporting endpoints with long breaks in
       connectivity and/or up-time.  CoAP clients publish on and subscribe
       to a topic via a corresponding topic resource at a CoAP server acting
       as broker.</p>
