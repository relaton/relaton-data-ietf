- language: en
  script: Latn
  content: |-
    <p>The Hypertext Transfer Protocol (HTTP) is an application-level
       protocol for distributed, collaborative, hypertext information
       systems.  This document defines range requests and the rules for
       constructing and combining responses to those requests.</p>
