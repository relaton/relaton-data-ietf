abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the complete vocabulary of HTTP header fields
       for the Context Relay Protocol (CRP).  CRP header fields carry AI-
       specific metadata — context quality, safety risk, provenance
       integrity, regulatory classification, agent state, and memory layer
       information — as standard HTTP header fields on AI request/response
       cycles.  This specification provides normative definitions for 58
       header fields across six namespaces, suitable for provisional
       registration in the IANA HTTP Field Name Registry.</p>
