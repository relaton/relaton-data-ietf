abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a SCIM endpoint used to register and
       provision OAuth 2.0 clients to access a OAuth 2.0 protected service
       API in a just-in-time fashion.  This draft profiles how a OAuth 2.0
       client may use SCIM and OAuth 2.0 to manage its registration.</p>
