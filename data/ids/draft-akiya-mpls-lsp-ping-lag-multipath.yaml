title:
- language: en
  script: Latn
  content: Label Switched Path (LSP) Ping/Trace Multipath Support for Link Aggregation
    Group (LAG) Interfaces
docidentifier:
- content: draft-akiya-mpls-lsp-ping-lag-multipath
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension to the MPLS Label Switched Path
       (LSP) Ping and Traceroute as specified in RFC 4379.  The extension
       allows the MPLS LSP Ping and Traceroute to discover and exercise
       specific paths of Layer 2 (L2) Equal-Cost Multipath (ECMP) over Link
       Aggregation Group (LAG) interfaces.

       This document updates RFC4379 and RFC6424.</p>
