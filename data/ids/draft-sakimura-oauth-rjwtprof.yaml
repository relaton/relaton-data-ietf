abstract:
- language: en
  script: Latn
  content: |-
    <p>This discussion document describes a method to indicate a sender
       constraint within JWT.  It could potentially be incorporated into
       Proof-Of-Possession Semantics for JSON Web Tokens(JWTs) [POPS].  This
       document was created in response to the WGLC of it.</p>
