abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Critical-CH HTTP response header, and the
       ACCEPT_CH HTTP/2 and HTTP/3 frames to allow HTTP servers to reliably
       specify their Client Hint preferences, with minimal performance
       overhead.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/davidben/http-client-hint-reliability.</p>
