abstract:
- language: en
  script: Latn
  content: |-
    <p>We present a solution to initially configure the network of resource
       constrained nodes securely, a.k.a., secure bootstrapping.  The
       solution is based on EAP-TLS authentication with the use of raw
       public keys as certificates.</p>
