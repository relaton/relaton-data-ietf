  content: Updates for the Back-to-Back Frame Benchmark in RFC 2544
docidentifier:
- content: draft-ietf-bmwg-b2b-frame
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Fundamental benchmarking methodologies for network interconnect devices of interest to the IETF are defined in RFC 2544. This memo updates the procedures of the test to measure the Back-to-Back Frames benchmark of RFC 2544, based on further experience.

     This memo updates Section 26.4 of RFC 2544.</p>
