title:
- language: en
  script: Latn
  content: PCEP Extensions for PCE-initiated Point-to-Multipoint LSP Setup in a Stateful
    PCE Model
docidentifier:
- content: draft-palle-pce-stateful-pce-initiated-p2mp-lsp
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The Path Computation Element (PCE) has been identified as an
       appropriate technology for the determination of the paths of point-
       to-multipoint (P2MP) TE LSPs.  This document provides extensions
       required for Path Computation Element communication Protocol (PCEP)
       so as to enable the usage of a stateful PCE initiation capability in
       recommending P2MP TE LSP instantiation.</p>
