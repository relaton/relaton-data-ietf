  content: Describing QUIC's Protocol Data Units with Augmented Packet Header Diagrams
docidentifier:
- content: draft-mcquistin-quic-augmented-diagrams
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the core transport protocol data units used
       in the QUIC protocol using a machine-readable augmented packet header
       diagram format.  It is intended as an example of the augmented packet
       header diagram language, and not as a contribution to the development
       of the QUIC protocol.</p>
