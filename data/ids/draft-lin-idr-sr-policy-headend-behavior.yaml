abstract:
- language: en
  script: Latn
  content: |-
    <p>[RFC8986] defines H. Encaps behavior, H. Encaps.Red behavior, H.
       Encaps.L2 behavior, and H. Encaps.L2.Red behavior for SR policy.
       This document defines extensions to Border Gateway Protocol (BGP) to
       distribute SR policies carrying headend behavior.</p>
