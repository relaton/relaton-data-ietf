abstract:
- language: en
  script: Latn
  content: |-
    <p>This document sketches a potential quality control mechanism for the
    IETF in the form of working group review committees.  The idea is to
    form a small committee per working group that will provide document
    review and advice throughout the working group's lifetime.</p>
