abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides an overview of 3GPP work on Artificial
       Intelligence/ Machine Learning (AI/ML) services.  Application areas
       and corresponding proposed modifications to the architecture are
       identified.  Security and privacy issues of these new applications
       need to be identified out of which IETF work could emerge.</p>
