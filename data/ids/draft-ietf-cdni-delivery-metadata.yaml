abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification adds to the core set of configuration metadata
       defined in RFC8006, providing delivery metadata to define traffic
       types, request delegation behavior and CDN transport arrangements
       selection of a downstream CDN.</p>
