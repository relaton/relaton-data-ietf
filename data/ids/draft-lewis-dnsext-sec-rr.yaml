abstract:
- language: en
  script: Latn
  content: |-
    <p>The Security Resource Record (SEC RR) is defined to hold security
    specific parameters of a zone.  The record is stored at the apex of a
    zone and is used to inform resolvers of certain security aspects of a
    zone.</p>
