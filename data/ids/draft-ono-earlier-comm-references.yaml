abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a SIP header extension that refers to earlier
    SIP or non-SIP communication in SIP requests.  For example, this
    extension allows users to correlate a SIP session with earlier
    sessions or email exchanges.</p>
