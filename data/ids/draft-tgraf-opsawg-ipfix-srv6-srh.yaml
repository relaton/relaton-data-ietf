abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces new IP Flow Information Export (IPFIX)
       information elements to identify the SRv6 Segment Routing Header
       dimensions, the SRv6 Control Plane Protocol and the SRv6 Endpoint
       Behavior that traffic is being forwarded with.</p>
