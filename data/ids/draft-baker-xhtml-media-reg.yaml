abstract:
- language: en
  script: Latn
  content: "<p>This document defines the 'application/xhtml+xml' MIME media type for
    XHTML based markup languages; it is not intended to obsolete any previous IETF
    documents, in particular RFC 2854 which registers 'text/html'.  This memo provides
    information for the Internet community.</p>"
