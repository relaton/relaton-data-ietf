abstract:
- language: en
  script: Latn
  content: |-
    <p>The Virtual Router Redundancy Protocol (VRRP) [1] has been shown to
    function erratically over networks that do not support rapid MAC
    Address mobility. Examples of these types of networks include ATM
    networks using LAN Emulation, and Source Route Bridged networks.</p>
