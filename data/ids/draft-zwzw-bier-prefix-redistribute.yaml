abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a BIER proxy function to interconnect different
       underlay routing protocol areas in a network.  And a new BIER proxy
       range sub-TLV is also defined to convey BIER BFR-id information
       across the routing areas.</p>
