title:
- language: en
  script: Latn
  content: Signaling Composite Candidate Path of SR Policy using BGP-LS
docidentifier:
- content: draft-li-idr-bgpls-sr-policy-composite-path
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>SR Policy Architecture [RFC9256] defines the concept of a Composite
       Candidate Path.  A regular SR Policy Candidate Path outputs traffic
       to a set of Segment Lists, while an SR Policy Composite Candidate
       Path outputs traffic recursively to a set of SR Policies on the same
       headend.  This document specifies the extensions to BGP Link State
       (BGP-LS) to carry composite candidate path information in the
       advertisement of an SR policy.</p>
