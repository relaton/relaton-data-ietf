---
id: draftietfaddsplithorizonauthority
schema_version: v1.5.6
formattedref:
  content: draft-ietf-add-split-horizon-authority
title:
- language: en
  script: Latn
  content: Establishing Local DNS Authority in Validated Split-Horizon Environments
docidentifier:
- content: draft-ietf-add-split-horizon-authority
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>When split-horizon DNS is deployed by a network, certain domain names
       can be resolved authoritatively by a network-provided DNS resolver.
       DNS clients that are not configured to use this resolver by default
       can use it for these specific domains only.  This specification
       defines a mechanism for domain owners to inform DNS clients about
       local resolvers that are authorized to answer authoritatively for
       certain subdomains.</p>
