- language: en
  script: Latn
  content: "<p>This document presents a set of requirements for leaf nodes and root
    \nnode of any point-to-multipoint (P2MP) and multipoint-to-multipoint \n(MP2MP)
    Label Switched Paths (LSP) know each other dynamically \nwithout requiring a multicast
    routing protocol in connection-oriented\nservice provider core networks, especially
    in Multi-Protocol Label \nSwitching (MPLS) and Generalized MPLS (GMPLS) networks.</p>"
