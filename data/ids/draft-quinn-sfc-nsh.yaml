abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes a Network Service Header (NSH) inserted onto
       encapsulated packets or frames to realize service function paths.

       NSH also provides a mechanism for metadata exchange along the
       instantiated service path.</p>
