  content: |-
    <p>This document introduces an automatic setup and maintenance mechanism
    to compute, create, update and delete for a packet and/or optical layer
    path and pseudowire paths(PWs) via an extension to the Path Computation
    Element Communication Protocol(PCEP) and DB Synchronization procedures.</p>
