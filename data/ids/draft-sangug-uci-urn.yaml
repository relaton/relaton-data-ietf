abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Uniform Resource Name (URN) namespace for
    the National Computerization Agency (NCA) for naming persistent digital resources
    such as music, videos, texts, images, e-books, and other types of digital resources
    produced or managed by NCA.  This memo provides information for the Internet community.</p>"
