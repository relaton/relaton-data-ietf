  content: |-
    <p>WARM is a straw-man proposal for a solution to the RUP requirements
    of the WEBI WG which reuses the Web Architecture (and HTTP).  In
    particular, it provides a mechanism for distributing cache
    invalidations from HTTP servers to clients.</p>
