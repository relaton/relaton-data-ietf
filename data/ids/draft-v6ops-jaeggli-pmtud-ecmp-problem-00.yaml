abstract:
- language: en
  script: Latn
  content: |-
    <p>This document calls attention to the problem posed to ICMP type 2
       (PTB) messages by using stateless loading balancing in front of
       statelful services.  It discusses operational mitigations that can
       mitigate this kind of failure.</p>
