abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a method to speed up block-wise transfer in
       CoAP.  With this, the client can indicate its willingness to be
       responded with a sequence of blocks without issuing request for each
       block one by one.</p>
