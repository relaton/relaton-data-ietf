abstract:
- language: en
  script: Latn
  content: |-
    <p>IS-IS Flood Reflection is a mechanism that allows flat, single-area
       IS-IS topologies to scale beyond their traditional limitations.

       This document defines new BGP-LS (BGP Link-State) TLVs in order to
       carry IS-IS Flood Reflection information.</p>
