abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides a framework to describe how to use current
       existing GMPLS routing and signaling to set up ODUk/ODUflex over
       ODUCn link, as a result of the support of OTU/ODU links with rates
       larger than 100G in the 2016 version of G.709.</p>
