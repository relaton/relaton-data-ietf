abstract:
- language: en
  script: Latn
  content: |-
    <p>This note proposes a practical solution to Internet Layer Source
       Address Verification.  The purpose of such verification is to prevent
       attacks from using spoofed addresses and to facilitate the tracking
       of attack datagrams to the computers that send them.</p>
