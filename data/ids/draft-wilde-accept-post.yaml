abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a new HTTP response header field Accept-
       Post, which indicates server support for specific media types for
       entity bodies in HTTP POST requests.

    Note to Readers

       This draft should be discussed on the apps-discuss mailing list [1].

       Online access to all versions and files is available on github [2].</p>
