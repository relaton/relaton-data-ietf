abstract:
- language: en
  script: Latn
  content: |-
    <p>In Transport Layer Security (TLS) handshakes, certificate chains
       often take up the majority of the bytes transmitted.

       This document describes how certificate chains can be compressed to
       reduce the amount of data transmitted and avoid some round trips.</p>
