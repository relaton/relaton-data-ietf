abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a simple method for invoking and running the
    NETCONF configuration protocol within a Secure Shell (SSH) session.
    Some features of the NETCONF protocol are not suited for use in a
    single shell session, and those limitations are described here.</p>
