abstract:
- language: en
  script: Latn
  content: |-
    <p>The document proposes a way to resolve DNS names in zeroconf environment
    [Williams, 2002] , by using ICMPv6 node information query/reply
    [Crawford, 2002] .  The proposed protocol works only with IPv6 (not with
    IPv4).</p>
