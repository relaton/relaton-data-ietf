  content: Supporting Source-Multiplexing of the Real-Time Transport Protocol (RTP)
    Payload for Generic Forward Error Correction
docidentifier:
- content: draft-lennox-payload-ulp-ssrc-mux
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The Real-Time Transport Protocol (RTP) Payload format for Generic
       Forward Error Correction (FEC), specified in RFC 5109, forbids
       transmitting FEC repair flows as separate sources in the same RTP
       session as the flows being repaired.  This document updates RFC 5109
       to lift that restriction, as long as the association between original
       and repair flows is properly signaled and negotiated.</p>
