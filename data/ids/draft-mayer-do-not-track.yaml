abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the syntax and semantics of Do Not Track, an
       HTTP header-based mechanism that enables users to express preferences
       about third-party web tracking.  It also provides a standard for how
       web services should comply with such user preferences.</p>
