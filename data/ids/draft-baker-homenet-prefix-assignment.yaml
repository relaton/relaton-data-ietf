abstract:
- language: en
  script: Latn
  content: |-
    <p>It is necessary to allocate prefixes in small networks, which include
       residential and Small Office/Home Office (SOHO) networks in a manner
       that minimizes or eliminates manual configuration.  This note
       suggests an approach.</p>
