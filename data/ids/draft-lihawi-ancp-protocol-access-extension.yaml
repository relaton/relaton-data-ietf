title:
- language: en
  script: Latn
  content: Access Extensions for ANCP
docidentifier:
- content: draft-lihawi-ancp-protocol-access-extension
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies extensions to the Access Node Control
       Protocol (ANCP), defined in RFC6320, to support Passive Optical
       Networks (PON) and evolving DSL technologies such as G.fast.  To
       accommodate these diverse access environments, this document updates
       RFC6320 by modernizing existing terminologies, adapting message
       flows, and defining new Type-Length-Value (TLV) attributes.</p>
