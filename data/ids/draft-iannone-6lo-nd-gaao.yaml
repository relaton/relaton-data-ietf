  content: Generic Address Assignment Option for 6LowPAN Neighbor Discovery
docidentifier:
- content: draft-iannone-6lo-nd-gaao
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a new extension to the IPv6 Neighbor
       Discovery in Low Power and Lossy Networks, enabling a node to request
       to be assigned an address or a prefix from neighbor routers.  Such
       mechanism allows to algorithmically assign addresses and prefixes to
       nodes in a 6LowPAN deployment.</p>
