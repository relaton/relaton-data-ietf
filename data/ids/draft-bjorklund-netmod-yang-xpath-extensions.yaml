abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces new YANG extension statements for defining
       XPath functions.  These functions can be used in XPath expressions in
       YANG modules and in NETCONF XPath filters.  A set of YANG-specific
       XPath functions are also defined.</p>
