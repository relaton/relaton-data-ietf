abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the issues with HTTP proxies for TLS
       protected traffic and motivates the need for explicit proxying
       capability in HTTP.  It also presents the goals that such a solution
       would need to satisfy and some example solution directions.</p>
