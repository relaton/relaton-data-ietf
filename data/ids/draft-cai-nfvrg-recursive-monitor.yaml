abstract:
- language: en
  script: Latn
  content: |-
    <p>Network Function Virtualization (NFV) poses a number of monitoring
       challenges; one potential solution to these challenges is a recursive
       monitoring language.  This document presents a set of requirements
       for such a recursive monitoring language.</p>
