abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a mapping of In-kernel QUIC Implementations
       into a sockets API.  The benefits of this mapping include
       compatibility for TCP applications, access to new QUIC features, and
       a consolidated error and event notification scheme.  In-kernel QUIC
       enables usage for both userspace applications and kernel consumers.</p>
