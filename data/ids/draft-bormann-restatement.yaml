abstract:
- language: en
  script: Latn
  content: |-
    <p>Normative documents that cite other normative documents often
       _restate_ normative content extracted out of the cited document in
       their own words.

       The present memo explains why this can be an Antipattern, and how it
       can be mitigated.</p>
