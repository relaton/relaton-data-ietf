abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the Agent Trust Negotiation (ATN) protocol.
       ATN sits above whatever mechanism is used to discover an agent
       identity and answers questions that discovery alone cannot: what is
       the agent permitted to do, under whose authority, with what
       provenance, and how do two agents reach a verifiable working
       agreement.

       ATN binds four artifacts to a discovered agent identity:</p>
