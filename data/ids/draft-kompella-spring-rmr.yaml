abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the use of SPRING to setup LSP(s) for
       resilient MPLS ring networks.  It specifies how clockwise and anti-
       clockwise ring SIDs are allocated and signaled using IGP protocol
       extensions, and how such ring SIDs achieve ring protection.</p>
