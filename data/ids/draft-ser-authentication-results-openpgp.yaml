abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC 7601 specifies the Authentication-Results header field for
       conveying results of message authentication checks.  This document
       defines a new authentication method to be used in the Authentication-
       Results header field for PGP-related signature checks.</p>
