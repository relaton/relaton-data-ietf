id: draftietfquicreliablestreamreset
schema_version: v1.5.6
formattedref:
  content: draft-ietf-quic-reliable-stream-reset
title:
- language: en
  script: Latn
  content: QUIC Stream Resets with Partial Delivery
docidentifier:
- content: draft-ietf-quic-reliable-stream-reset
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>QUIC defines a RESET_STREAM frame to abort sending on a stream.  When
       a sender resets a stream, it also stops retransmitting STREAM frames
       for this stream in the event of packet loss.  On the receiving side,
       there is no guarantee that any data sent on that stream is delivered.

       This document defines a new QUIC frame, the RESET_STREAM_AT frame,
       that allows resetting a stream, while guaranteeing delivery of stream
       data up to a certain byte offset.</p>
