  script: Latn
  content: |-
    <p>Content-Types may have 'parameter' to make fine-grained description
       of contents.  The CoAP Content-Type Parameter Option (CT-Parameter
       Option) and Accept Content-Type Parameter Option (Accept-CT-Parameter
       Option) are CoAP options to add a parameter to a Content-Type.</p>
