  content: The WebRTC Data Channel as a Transport for the Message Session Relay Protocol
    (MSRP)
docidentifier:
- content: draft-pd-msrp-webrtc
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The WebRTC Data Channel enables two-way real-time communication
       between browsers.  This document updates normatively updates RFC 4975
       to add support for WebRTC Data Channel as a transport for MSRP
       (Message Session Relay Protocol).  This will enable secure, low-
       latency, structured peer-to-peer messaging between WebRTC end-points.</p>
