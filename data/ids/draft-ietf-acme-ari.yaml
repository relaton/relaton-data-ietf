title:
- language: en
  script: Latn
  content: Automated Certificate Management Environment (ACME) Renewal Information
    (ARI) Extension
docidentifier:
- content: draft-ietf-acme-ari
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies how an ACME server may provide suggestions to
       ACME clients as to when they should attempt to renew their
       certificates.  This allows servers to mitigate load spikes, and
       ensures clients do not make false assumptions about appropriate
       certificate renewal periods.</p>
