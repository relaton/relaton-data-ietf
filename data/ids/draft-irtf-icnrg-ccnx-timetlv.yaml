id: draftirtficnrgccnxtimetlv
schema_version: v1.5.6
formattedref:
  content: draft-irtf-icnrg-ccnx-timetlv
title:
- language: en
  script: Latn
  content: Alternative Delta Time Encoding for CCNx Using Compact Floating-Point Arithmetic
docidentifier:
- content: draft-irtf-icnrg-ccnx-timetlv
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>CCNx utilizes delta time for a number of functions.  When using CCNx
       in environments with constrained nodes or bandwidth constrained
       networks, it is valuable to have a compressed representation of delta
       time.  In order to do so, either accuracy or dynamic range has to be
       sacrificed.  Since the current uses of delta time do not require both
       simultaneously, one can consider a logarithmic encoding.  This
       document updates RFC 8609 ("CCNx messages in TLV Format") to specify
       this alternative encoding.

       This document is a product of the IRTF Information-Centric Networking
       Research Group (ICNRG).</p>
