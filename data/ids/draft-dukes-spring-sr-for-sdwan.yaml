abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how SR enables underlay Service Level
       Agreements (SLA) to a VPN with scale and security while ensuring
       service opacity.  This solution applies to Over-The-Top VPN (OTT VPN)
       and Software-Defined WAN (SDWAN).</p>
