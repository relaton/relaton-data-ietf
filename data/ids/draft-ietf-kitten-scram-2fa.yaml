title:
- language: en
  script: Latn
  content: Extensions to Salted Challenge Response (SCRAM) for 2 factor authentication
docidentifier:
- content: draft-ietf-kitten-scram-2fa
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification describes an extension to family of Simple
       Authentication and Security Layer (SASL; RFC 4422) authentication
       mechanisms called the Salted Challenge Response Authentication
       Mechanism (SCRAM), which provides support for 2 factor
       authentication.  It also includes a separate extension for quick
       reauthentication.

       This specification also gives 2 examples of second factors: TOTP (RFC
       6238) and FIDO CTAP1/U2F (Passkey).</p>
