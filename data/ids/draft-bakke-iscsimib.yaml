abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in TCP/IP based internets.
    In particular it defines objects for managing a client using the
    iSCSI (SCSI over TCP) protocol.  It is meant to match the latest
    version of iSCSI defined in [ISCSI].</p>
