abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates the registration procedures for the "CoAP
       Content-Formats" registry, within the "CoRE Parameters" registry
       group, defined in Section 12.3 of RFC7252.  Specifically, those
       regarding the First Come First Served (FCFS) portion of the registry.</p>
