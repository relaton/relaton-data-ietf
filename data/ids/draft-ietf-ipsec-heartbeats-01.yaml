abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a method for sending heartbeat packets
    (sometimes called keep-alives) across an ISAKMP SA in order to detect
    when a peer has crashed or has become otherwise unreachable. A method
    for negotiating the heartbeat parameters is also provided.</p>
