abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an extension to the Interactive Connectivity
       Establishment (ICE) that enables the controlling ICE agent to
       dynamically change its selected candidate pair over time as network
       conditions change, and notify the controlled side accordingly.</p>
