abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines protocol extensions and procedures for BGP PE-
    CE router iteration in RFC2547bis networks. These have the objective
    of making the usage of the RFC2547bis VPN transparent to the customer
    network, as far as routing information is concerned.</p>
