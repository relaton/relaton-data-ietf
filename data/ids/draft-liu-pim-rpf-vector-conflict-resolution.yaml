title:
- language: en
  script: Latn
  content: PIM Reverse Path Forwarding (RPF) Vector Conflict Resolution
docidentifier:
- content: draft-liu-pim-rpf-vector-conflict-resolution
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC7891 Section 7 defines the handling principles for PIM Join
       attributes with same type of RFF Vector and Explicit RFP Vector, but
       with different contents are received.

       However, it does not address scenarios where one downstream router
       includes a RFF Vector in its message while another does not. This
       leaves the handling of such conflicts unspecified.

       This document updates RFC 5496 and RFC 7891 by supplementing the
       existing specifications with handling rules for this specific
       conflict scenario.</p>
