title:
- language: en
  script: Latn
  content: Establishing Local DNS Authority in Split-Horizon Environments
docidentifier:
- content: draft-reddy-add-enterprise-split-dns
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>When split-horizon DNS is deployed by a network, certain domains can
       be resolved authoritatively by the network-provided DNS resolver.
       DNS clients that don't always use this resolver might wish to do so
       for these domains.  This specification describes how clients can
       confirm the local resolver's authority over these domains.</p>
