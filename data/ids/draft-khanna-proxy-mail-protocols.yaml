- language: en
  script: Latn
  content: |-
    <p>This document details the problem associated with the proxy of the mail
    protocols (SMTP, POP3 and IMAP), and suggests a means by which their
    proxy, by compliant proxy servers, can be made highly flexible,
    compared to how they are proxied today.</p>
