abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies PT-TLS, a TCP-based Posture Transport (PT)
       protocol.  The PT-TLS protocol carries the Network Endpoint
       Assessment (NEA) message exchange under the protection of a Transport
       Layer Security (TLS) secured tunnel.</p>
