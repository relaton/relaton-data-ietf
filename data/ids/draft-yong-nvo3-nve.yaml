abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies Network Virtualization Edge (NVE) data plane
       interoperability functionality for Network Virtualization Overlays
       (NVO3). These specifications are necessary for the interoperability
       between an NVE and its attached tenant systems and between the NVEs.</p>
