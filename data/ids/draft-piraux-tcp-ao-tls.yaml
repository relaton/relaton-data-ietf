  content: Opportunistic TCP-AO with TLS
docidentifier:
- content: draft-piraux-tcp-ao-tls
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies an opportunistic mode for TCP-AO when used
       with TLS.  In this mode, the TCP connection starts with a well-known
       authentication key which is later replaced by a secure key derived
       from the TLS handshake.</p>
