title:
- language: en
  script: Latn
  content: Export of GTP-U Information in IP Flow Information Export (IPFIX)
docidentifier:
- content: draft-ietf-opsawg-ipfix-gtpu
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces IP Flow Information Export (IPFIX)
       Information Elements to report information contained in the Generic
       Packet Radio Service Tunneling Protocol (GTP) User Plane header such
       as Tunnel Endpoint Identifier, and data contained in its session
       container extension header.</p>
