abstract:
- language: en
  script: Latn
  content: |-
    <p>People keep pitching drafts to the TLS Working Group where the only
       thing the draft does is register a code point for a cryptographic
       algorithm.  Stop doing that.  It's unnecessary.  Write an email to
       IANA instead.</p>
