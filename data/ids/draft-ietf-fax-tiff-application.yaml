abstract:
- language: en
  script: Latn
  content: "<p>This draft attempts to clarify some misunderstandings concerning\n
    \ use of the 'Application' parameter with the MIME type 'image/tiff'.\n \n  It
    is not intended to prescribe or proscribe future use of the\n  'Application' parameter,
    but simply to indicate the intention\n  behind its introduction.</p>"
