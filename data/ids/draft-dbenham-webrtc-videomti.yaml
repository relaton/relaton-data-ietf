  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo proposes that H.264/AVC be selected as the mandatory-to-
       implement (MTI) video codec for RTCweb due to is Adoption Advantage,
       Quality-Power-Bandwidth advantage, Hardware Acceleration Advantage
       and Well-established IPR Status.</p>
