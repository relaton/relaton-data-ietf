abstract:
- language: en
  script: Latn
  content: |-
    <p>SLPv2 [1] allows protocol extensions to be defined.  Each must be
    assigned an extension ID. This document lists all extension IDs
    which have been assigned and describes the process by which further
    extension IDs may be acquired.</p>
