abstract:
- language: en
  script: Latn
  content: |-
    <p>NRU specifies one-time, cryptographically bound tokens that couple a
       dataset identifier to a requester context.  Replayed or stolen
       datasets fail verification in the RepSec layer, preventing
       unauthorized reuse.</p>
