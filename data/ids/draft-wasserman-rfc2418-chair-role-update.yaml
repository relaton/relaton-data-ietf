abstract:
- language: en
  script: Latn
  content: |-
    <p>This document is an update to RFC 2418 that strengthens the
        recommended separation between the Working Group Chair and Document
        Editor roles.  It states that a single person should not serve in
        both roles for a single document, except temporarily in exceptional
        situations.</p>
