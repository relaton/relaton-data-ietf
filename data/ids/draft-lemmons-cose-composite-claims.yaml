abstract:
- language: en
  script: Latn
  content: |-
    <p>Composite claims are claims for CBOR Web Tokens (CWTs) and JSON Web
       Tokens (JWTs) that define logical relationships between sets of
       claims.  This document also defines a CWT representation of the
       "crit" (Critical) claim.</p>
