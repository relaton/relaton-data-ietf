abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies how an Extensible Provisioning Protocol (EPP)
       session is mapped onto a QUIC connection.  EPP over QUIC (EoQ)
       leverages features of the QUIC protocol.</p>
