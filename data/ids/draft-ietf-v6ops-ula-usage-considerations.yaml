abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides considerations for using IPv6 Unique Local
       Addresses (ULAs).  Based on an analysis of different ULA usage
       scenarios, this document identifies use cases where ULA addresses are
       helpful as well as potential problems caused by using them.</p>
