abstract:
- language: en
  script: Latn
  content: "<p>This document describes two additional RR types for the Domain Name
    System[7,8] required to implement the Nimrod Routing Architecture[1]. These RRs
    record the Nimrod Locator and an Endpoint Identifier (EID) associated with a given
    Domain Name.</p>"
