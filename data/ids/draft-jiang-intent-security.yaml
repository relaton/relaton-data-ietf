abstract:
- language: en
  script: Latn
  content: |-
    <p>Intent-based requests enable users, applications, and agents to
       express goals and constraints without specifying step-by-step
       procedures.  Such intents are commonly translated into executable
       directives and propagated across multiple entities (clients, agents,
       authorization components, orchestration functions, and execution
       endpoints).  This multi-hop processing expands the attack surface for
       tampering, privilege escalation, constraint bypass, and intent drift.
       In addition, at the point where an intent enters the system, a forged
       or unauthorized origin may cause actions to be taken without valid
       consent.

       This document provides a solution-agnostic security analysis for
       intent-based requests across agentic systems.  It presents attack
       scenarios, a threat model, security requirements, and per-scenario
       mitigation considerations, supported by a reference model.  The
       document is Informational: it does not define a protocol, message
       format, or registry, and concrete mechanisms are left to companion
       specifications.  It emphasizes origin authentication and admission
       control, constraint validation, invocation validation, multi-hop
       chain-of-custody, enforcement placement across hops, and policy-
       driven responses to drift, while remaining independent of any
       specific deployment domain.</p>
