abstract:
- language: en
  script: Latn
  content: "<p>This document creates and describes the SIP subscription filters \nnecessary
    to acquire the desired location information in the form of\na Presence Information
    Data Format - Location Object (PIDF-LO) from \na remote SIP user agent (UA).\n\n\nThe
    key words \"MUST\", \"MUST NOT\", \"REQUIRED\", \"SHALL\", \"SHALL NOT\",\n\"SHOULD\",
    \"SHOULD NOT\", \"RECOMMENDED\", \"MAY\", and \"OPTIONAL\" in this\ndocument are
    to be interpreted as described in RFC 2119 [RFC 2119].</p>"
