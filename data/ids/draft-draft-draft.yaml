abstract:
- language: en
  script: Latn
  content: |-
    <p>Network file access is often highly inefficient due to complexity of
       existing protocols.  Direct Random Access File Transfer (DRAFT) is
       one new protocol that uses simple UDP techniques to overcome this
       problem.</p>
