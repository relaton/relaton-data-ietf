abstract:
- language: en
  script: Latn
  content: |-
    <p>While EMAILCORE working group was working on update to SMTP
       specification, it became clear that existing entries in SMTP related
       registries are missing information or contain stale information and
       need to be updated.  This document updates such entries.</p>
