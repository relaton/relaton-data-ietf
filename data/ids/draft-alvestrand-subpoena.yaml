abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the IETF's procedures for handling subpoenas
       served on the IETF.  This is an adaptation of the ad-hoc procedures
       that the IESG has applied for recent such events, taking account of
       the creation of the IETF Administrative Support Activity (IASA).</p>
