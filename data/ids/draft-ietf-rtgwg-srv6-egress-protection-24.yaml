abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the mechanism and operational guidelines for
       fast protecting the egress node and link of a Segment Routing for
       IPv6 (SRv6) path.  TI-LFA specifies fast protections for transit
       nodes and links of an SR path, but does not present protections for
       the egress node.  The solution uses a Mirror SID (End.M) behavior to
       steer traffic to a protector egress upon failure of the primary
       egress.  The IGP extensions (IS-IS/OSPFv3) can be used to advertise
       Mirror SID and protected locators.</p>
