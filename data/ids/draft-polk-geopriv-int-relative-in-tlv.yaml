abstract:
- language: en
  script: Latn
  content: "<p>This document IANA registers XML elements of interior locations \n&lt;INT&gt;
    in a common TLV format.\nThe key words \"MUST\", \"MUST NOT\", \"REQUIRED\", \"SHALL\",
    \"SHALL NOT\",\n\"SHOULD\", \"SHOULD NOT\", \"RECOMMENDED\", \"MAY\", and \"OPTIONAL\"
    in this\ndocument are to be interpreted as described in RFC 2119 [RFC 2119].</p>"
