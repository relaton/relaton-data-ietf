abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an optional extension to RFC 959, "FILE
    TRANSFER PROTOCOL (FTP)" (October 1985).  It specifies a new
    "deflate" transmission mode designed to increase network bandwidth
    by compressing data using existing techniques.</p>
