abstract:
- language: en
  script: Latn
  content: |-
    <p>This document presents an extension to NHRP [RFC2332] that enables
       resolution of NBMA next hop addresses based on destination flow
       information.  This extension also enables NHSs to relay simple
       forwarding policy to source stations (NHCs).</p>
