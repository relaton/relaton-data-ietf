abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how to perform third party call control in
    SIP when SDP preconditions are used. There are no new SIP extensions
    needed to accomplish this. The mechanism outlined is illustrated
    with an example in order to help understand it.</p>
