abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates the set of best current security practices for
       OAuth 2.0 by extending the security advice given in RFC 6749, RFC
       6750, and RFC 9700, to cover new threats that have been discovered
       since the former documents have been published.</p>
