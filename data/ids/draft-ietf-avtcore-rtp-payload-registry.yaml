id: draftietfavtcorertppayloadregistry
schema_version: v1.5.6
formattedref:
  content: draft-ietf-avtcore-rtp-payload-registry
title:
- language: en
  script: Latn
  content: Closing the RTP Payload Format Media Types IANA Registry
docidentifier:
- content: draft-ietf-avtcore-rtp-payload-registry
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>A number of authors of RTP Payload Formats and the WG process have
       failed to ensure that the media types for RTP payload formats is
       registred in the IANA registry "RTP Payload Formats Media Types" as
       recommended by RFC 8088.  To simplify the process and rely only on
       the media types registry this document closes the RTP payload
       specific registry.  In addition it updates the instruction to payload
       format authors in RFC 8088 to reflect this change.</p>
