  content: Multiple Media Types in an RTP Session
docidentifier:
- content: draft-westerlund-avtcore-multi-media-rtp-session
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies how an RTP session can contain media streams
       with media from multiple media types such as audio, video, and text.
       This has been restricted by the RTP Specification, and thus this
       document updates RFC 3550 to enable this behavior for applications
       that satisfy the applicability for using multiple media types in a
       single RTP session.</p>
