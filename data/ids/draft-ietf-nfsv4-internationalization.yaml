  script: Latn
  content: Internationalization for the NFSv4 Protocols
docidentifier:
- content: draft-ietf-nfsv4-internationalization
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the handling of internationalization for all
       NFSv4 protocols, including NFSv4.0, NFSv4.1, NFSv4.2 and extensions
       thereof, and future minor versions.

       It updates RFC7530 and RFC8881.</p>
