abstract:
- language: en
  script: Latn
  content: |-
    <p>IETF working groups often formally adopt drafts.  This document
       specifies minimum requirements for this process, thereby extending
       RFC 2418.  It also describes how an adopted draft may be withdrawn
       from the working group process.</p>
