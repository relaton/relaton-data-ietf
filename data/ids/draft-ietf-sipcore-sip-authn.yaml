- content: draft-ietf-sipcore-sip-authn
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an authentication mechanism for SIP, that is
       based on the OAuth 2.0 and OpenID Connect Core 1.0 specifications, to
       enable the delegation of the user authentication to a dedicated
       third-party IdP entity that is separate from the SIP network elements
       that provide the SIP service.</p>
