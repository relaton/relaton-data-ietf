abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a normative finite state machine (FSM) for x402
       V2 Payment lifecycle transitions, covering the four canonical Payment
       Claim states: PaymentIntent (initialisation), SettlementReceipt
       (completion), RefundClaim (reversal), and DelegationGrant (bounded
       authority).  Each transition is bound to the prior state by
       cryptographic linkage via the JCS canonical preimage discipline
       ([RFC8785]), enabling supervisor reconstruction of full payment
       histories from retained off-VM manifests.  The FSM is compatible with
       the x402 STARK Receipt Format Extension [STARK-RECEIPTS] but
       applicable to any x402 receipt format that implements the canonical
       preimage discipline.  Implementation evidence: 18 DelegationGrant
       vectors cross-validated byte-identical across five language runtimes
       ([X402-2432]), live on-chain anchor on Starknet Sepolia
       (PaymentDemoEmitter at
       0x044dd87a94a801cf775d4c5e4b6703102d4e97e1cd1d0a8879341219ae4f19ff).</p>
