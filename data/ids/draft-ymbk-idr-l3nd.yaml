abstract:
- language: en
  script: Latn
  content: |-
    <p>Data Centers where the topology is BGP-based need to discover
       neighbor IP addressing, IP Layer-3 BGP neighbors, etc.  This Layer-3
       Neighbor Discovery protocol identifies BGP neighbor candidates.</p>
