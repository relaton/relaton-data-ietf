abstract:
- language: en
  script: Latn
  content: |-
    <p>APEX, at its core, provides a best-effort application-layer datagram
    service.  Options are used to alter the semantics of the core
    service.  This memo defines various options to change the default
    behavior of APEX's 'relaying mesh'.</p>
