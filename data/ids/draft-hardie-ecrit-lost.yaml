abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an XML-based protocol for mapping service
       identifiers and geospatial or civic location information to service
       contact URIs.  In particular, it can be used to determine the
       location-appropriate PSAP for emergency services.</p>
