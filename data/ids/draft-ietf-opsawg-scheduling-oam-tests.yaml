  content: A YANG Data Model for Network Diagnosis using Scheduled Sequences of OAM
    Tests
docidentifier:
- content: draft-ietf-opsawg-scheduling-oam-tests
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines two YANG data models to support on-demand
       network diagnosis using Operations, Administration, and Maintenance
       (OAM) tests.  This document defines both 'oam-unitary-test' and 'oam-
       test-sequence' YANG modules to manage the lifecycle of network
       diagnosis procedures, intended for use by external management and
       orchestration systems (including SDN controllers and network
       orchestrators), rather than by individual network nodes.</p>
