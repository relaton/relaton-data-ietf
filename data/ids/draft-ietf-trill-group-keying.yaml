  content: Simple Group Keying Protocol (SGKP)
docidentifier:
- content: draft-ietf-trill-group-keying
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies a simple general group keying protocol that
       provides for the distribution of shared secret keys to group members
       and the management of such keys. It assumes that secure pairwise keys
       can be created between any two group members.</p>
