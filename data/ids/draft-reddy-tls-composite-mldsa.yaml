  content: draft-reddy-tls-composite-mldsa
title:
- language: en
  script: Latn
  content: Use of Composite ML-DSA in TLS 1.3
docidentifier:
- content: draft-reddy-tls-composite-mldsa
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Compositing the post-quantum ML-DSA signature with traditional
       signature algorithms provides protection against potential breaks or
       critical bugs in ML-DSA or the ML-DSA implementation.  This document
       specifies how such a composite signature can be formed using ML-DSA
       with RSA-PKCS#1 v1.5, RSA-PSS, ECDSA, Ed25519, and Ed448 to provide
       authentication in TLS 1.3, including use in certificates.</p>
