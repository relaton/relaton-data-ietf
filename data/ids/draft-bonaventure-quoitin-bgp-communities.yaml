abstract:
- language: en
  script: Latn
  content: |-
    <p>Since its introduction in RFC1997, the BGP community attribute has
    been used by many Autonomous Systems to build more scalable routing
    policies. We describe here the most common utilizations of the BGP
    community attribute and provide some examples.</p>
