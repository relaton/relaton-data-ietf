abstract:
- language: en
  script: Latn
  content: |-
    <p>Some SASL mechanisms provide a fast reauthentication option.  TLS
    also provides this, and this memo outlines a proposal to use the TLS
    session resumption as a method for mechanism-independent fast
    reauthentication using SASL EXTERNAL.</p>
