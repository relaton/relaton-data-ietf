abstract:
- language: en
  script: Latn
  content: "<p>This document suggests improvements to OSPF v2 Graceful Restart. The
    \nbasic protocol working remains as specified in [OSPFGR]. The draft \ndescribes
    a two pronged approach for improving the current graceful \nrestart mechanism.
    It improves the restarting Router’s ability to \ndetect and react to topology
    changes. It also reduces the \nconservative behavior of the helper Router in reacting
    to topology \nchanges.  \nIn addition, it adds certain clarifications for interpretation
    of the \nRFC 3623.</p>"
