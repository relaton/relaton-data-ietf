abstract:
- language: en
  script: Latn
  content: |-
    <p>Event- and webhook-based integrations are a common application-layer
       mechanism for interoperability across Internet services, yet they
       lack a shared delivery semantics contract.  Existing implementations
       vary widely in retry behavior, acknowledgment signaling, failure
       classification, idempotency identifiers, and replay handling,
       resulting in fragile integrations and ambiguous operational
       expectations.

       This document defines a minimal, application-layer delivery semantics
       profile for event and webhook delivery over existing transports, and
       specifies a concrete binding for the Hypertext Transfer Protocol
       (HTTP).  The profile constrains only sender-observable behavior and
       signaling; it does not impose receiver-side storage or processing
       requirements and does not redefine existing transport protocols.</p>
