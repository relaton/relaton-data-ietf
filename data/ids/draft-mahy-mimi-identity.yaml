abstract:
- language: en
  script: Latn
  content: |-
    <p>This document explores the problem space in instant messaging (IM)
       identity interoperability when using end-to-end encryption, for
       example with the MLS (Message Layer Security) Protocol.  It also
       describes naming schemes for different types of IM identifiers.</p>
