abstract:
- language: en
  script: Latn
  content: |-
    <p>The delivery of content over HTTPS involving multiple CDNs raises
       credential management issues.  This document proposes extensions in
       CDNI Control and Metadata interfaces to setup HTTPS delegation from
       an Upstream CDN (uCDN) to a Downstream CDN (dCDN).</p>
