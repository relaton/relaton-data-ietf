abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an alternate method to signal multicast tree
       building among xTRs in multicast capable LISP sites.  This approach
       avoids the need to run a multicast routing protocol on the LISP
       overlay.</p>
