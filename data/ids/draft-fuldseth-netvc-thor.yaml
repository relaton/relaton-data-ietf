abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides a high-level description of the Thor video
       codec.  Thor is designed to achieve high compression efficiency with
       moderate complexity, using the well-known hybrid video coding
       approach of motion-compensated prediction and transform coding.</p>
