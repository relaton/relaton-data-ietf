  content: |-
    <p>This document specifies the extension to TELINK LSA of OSPF routing
       protocol [RFC4203] [3] in support of GMPLS [1] for flex-grid
       networks [2].

       This draft is a renamed version of ''draft-dhillon-ccamp-super-
       channel-ospfte-ext-06.txt'' [11]. To align with ITU terminology,
       references to super-channel have been removed in the title &amp; other
       parts of the document.</p>
