  content: 'FC1: A Non-Deterministic, Alien-Resistant, Cipher Where The Modulo Is
    The Symmetric Key'
docidentifier:
- content: draft-fabbrini-fc1-a-new-symmetric-key-cipher
  type: Internet-Draft
