abstract:
- language: en
  script: Latn
  content: |-
    <p>The current BGPSEC draft documents do not specifies a key rollover
       process for routers.  This document describes a possible key rollover
       process and explores its impact to mitigate replay attacks and
       eliminate the need for beaconing in BGPSEC.</p>
