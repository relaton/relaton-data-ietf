abstract:
- language: en
  script: Latn
  content: |-
    <p>We propose a resource assignment scheme based on multi-dimensional
       resource aggregation in 5G optical fronthaul networks.  This new
       scheme can suit to the higher demand of flexible resource allocation
       of the fronthaul in the new 5G scenario.</p>
