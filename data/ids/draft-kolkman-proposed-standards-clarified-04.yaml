abstract:
- language: en
  script: Latn
  content: |-
    <p>RFC 2026 describes the review performed by the IESG on IETF Proposed
       Standard RFCs and states the maturity level of those documents.  This
       document clarifies those descriptions and updates RFC 2026 by
       providing a new characterization of Proposed Standards.</p>
