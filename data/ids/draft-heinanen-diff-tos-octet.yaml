abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes how the TOS octet in the IPv4 header can be
       used to support differential Internet services.  The proposal is
       based on the existing format of the TOS octet as defined in [RFC791]
       and [RFC1349].</p>
