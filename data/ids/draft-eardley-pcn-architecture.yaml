abstract:
- language: en
  script: Latn
  content: |-
    <p>The purpose of this document is to describe a general architecture
       for flow admission and termination based on aggregated (pre-)
       congestion information in order to protect the quality of service of
       established inelastic flows within a single DiffServ domain.</p>
