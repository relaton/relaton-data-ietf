title:
- language: en
  script: Latn
  content: Remote Attestation Procedures for Network Security Functions (NSFs) through
    the I2NSF Security Controller
docidentifier:
- content: draft-pastor-i2nsf-nsf-remote-attestation
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the procedures a client can follow to assess
       the trust on an external NSF platform and its client-defined
       configuration through the I2NSF Security Controller.  The procedure
       to assess trustworthiness is based on a remote attestation of the
       platform and the NSFs running on it performed through a Trusted
       Platform Module (TPM) invoked by the Security Controller.</p>
