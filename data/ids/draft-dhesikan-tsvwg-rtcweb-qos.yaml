  content: DSCP and other packet markings for RTCWeb QoS
docidentifier:
- content: draft-dhesikan-tsvwg-rtcweb-qos
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Many networks, such as service provider and enterprise networks, can
       provide per packet treatments based on Differentiated Services Code
       Points (DSCP) on a per hop basis.  This document provides the
       recommended DSCP values for browsers to use for various classes of
       traffic.</p>
