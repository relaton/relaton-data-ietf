abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a second or "shadow" BFD session to an existing
       "primary" BFD session, providing resiliency against BFD failures that
       are not legitimate.

       Scenarios will be discussed on how presence of a shadow BFD session
       will be beneficial in the context of high availability.</p>
