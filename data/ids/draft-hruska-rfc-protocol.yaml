abstract:
- language: en
  script: Latn
  content: |-
    <p>The goal of this Draft is to define a single protocol that envelops
    all RFCs of the past, present, and future.  This document describes
    communication across the Unified RFC Protocol, preserving ancient
    protocols, and a framework for new protocols.</p>
