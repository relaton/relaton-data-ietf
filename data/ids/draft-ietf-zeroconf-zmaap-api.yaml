abstract:
- language: en
  script: Latn
  content: |-
    <p>Today, with the rapid rise of home networking, there is an increasing
    need for auto-configuration mechanisms. This document specifies an
    api to be used for applications which require multicast addresses on
    small networks without a multicast address allocation server.</p>
