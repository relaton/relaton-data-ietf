abstract:
- language: en
  script: Latn
  content: |-
    <p>'DHCP Relay Agent Information Option' (RFC 3046) assumes that DHCP
    messages exchanged between relay agents and servers are not subject
    to attack.  This document describes how IPsec can be used to protect
    messages exchanged between relay agents and servers.</p>
