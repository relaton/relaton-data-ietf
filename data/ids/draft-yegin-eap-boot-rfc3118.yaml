  content: Bootstrapping RFC3118 Delayed DHCP Authentication Using EAP-based Network
    Access Authentication
docidentifier:
- content: draft-yegin-eap-boot-rfc3118
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>The DHCP authentication extension (RFC 3118) cannot be widely
    deployed due to lack of a key agreement protocol.  This document
    outlines how EAP-based network access authentication mechanisms can
    be used to establish bootstrap keying material that can be used to
    subsequently use RFC 3118 security.</p>
