abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft introduces a pseudowire freeze mechanism, which enables
       pseudowire control plane and data plane separation.  When the PW is
       working in freeze state, the data transmission will not be influenced
       by turbulence of control plane.</p>
