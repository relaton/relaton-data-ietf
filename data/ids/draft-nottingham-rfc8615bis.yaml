abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a path prefix for "well-known locations",
       "/.well-known/", in selected Uniform Resource Identifier (URI)
       schemes.

       In doing so, it obsoletes RFC 8615.</p>
