  content: |-
    <p>This specification extends RPL to provide unicast and multicast
       routing based on bitStrings such as used in Bit Index Explicit
       Replication and its source-routed Traffic Engineering variant, which
       correspond to RPL storing and non-storing modes respectively.</p>
