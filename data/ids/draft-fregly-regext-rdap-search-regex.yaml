abstract:
- language: en
  script: Latn
  content: |-
    <p>The Registration Data Access Protocol (RDAP) provides limited search
       functionality based on pattern matching.  This document describes an
       RDAP query extension that provides additional search functionality
       using POSIX extended regular expressions.</p>
