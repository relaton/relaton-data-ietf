- language: en
  script: Latn
  content: |-
    <p>This document describes a congestion control solution based on SRv6.
       It defines mechanisms for congestion notification and flow control
       within an SRv6-based network, optimizing congestion handling through
       hierarchical congestion control messages along SRv6 paths.</p>
