- content: draft-ecrit-location-profile-registry-policy
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document changes the policy of the Location-to-Service
       Translation (LoST) Location Profile registry established by RFC5222
       from Standards Action to Specification Required.  This allows
       standards development organizations (SDOs) other than the IETF to add
       new values.</p>
