formattedref:
  content: draft-wang-idr-flowspec-dip-origin-as-filter
title:
- language: en
  script: Latn
  content: Destination-IP-Origin-AS Filter for BGP Flow Specification
docidentifier:
- content: draft-wang-idr-flowspec-dip-origin-as-filter
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extension to the Border Gateway Protocol
       (BGP) Flow Specification (FlowSpec) to enable filtering based on the
       Origin Autonomous System (AS) of the destination IP address.  This
       extension is particularly useful in mitigating Distributed Denial of
       Service (DDoS) attacks where the target IP addresses are dynamic but
       belong to a specific destination AS.</p>
