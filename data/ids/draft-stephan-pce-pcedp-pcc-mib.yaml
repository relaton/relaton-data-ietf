abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines a portion of the Management Information Base (MIB)
       for use with network management protocols in the Internet community.
       In particular, it describes objects used for managing Path
       Computation Elements Discovery Protocol (PCEDP) inside a Path
       Computation Client (PCC) application.</p>
