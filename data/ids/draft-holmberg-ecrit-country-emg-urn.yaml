  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates section 4.2 of RFC 5031, in order to allow the
       registration of service URNs with the 'sos' service type for
       emergency services that, at the time of registration, are offered in
       one country only.</p>
