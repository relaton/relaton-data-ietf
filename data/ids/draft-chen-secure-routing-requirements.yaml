abstract:
- language: en
  script: Latn
  content: |-
    <p>Both ISPs and users have put forward requirements for secure routing,
       the scenarios are analyzed in the draft draft-chen-secure-routing-
       use-cases (https://datatracker.ietf.org/doc/draft-chen-secure-
       routing-use-cases/).  This draft analyzes the functions required to
       implement secure routing.

       Attack detection and users security requirements translateion are out
       of scope.</p>
