abstract:
- language: en
  script: Latn
  content: |-
    <p>This document introduces options to communicate property and
       associate meta data with prefixes.  It extends DHCPv6 prefix
       delegation and address allocation using the meta data for selection
       of prefixes and addresses.</p>
