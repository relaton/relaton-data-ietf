abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes an approach for Resource Public Key
       Infrastructure (RPKI) Relying Parties to detect a particular form of
       RPKI Repository Delta Protocol (RRDP) session desynchronization and
       how to recover, as implemented in OpenBSD's rpki-client validator and
       Mikhail Puzanov's rpki-prover.</p>
