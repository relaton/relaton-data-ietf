abstract:
- language: en
  script: Latn
  content: "<p>There is a need for human beings who use X.400 systems to be able to
    write down O/R names in a uniform way.  This memo is a discussion of this topic.
    \ This memo provides information for the Internet Community.  It does not specify
    an Internet Standard of any kind.</p>"
