abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a mechanism for a host to signal flow
       characteristics to the network, and the network to signal its ability
       to accommodate that flow back to the host.  The mechanism defines a
       new PCP option for the existing MAP and PEER opcodes.</p>
