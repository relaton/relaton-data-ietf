title:
- language: en
  script: Latn
  content: Bit Index Explicit Replication (BIER) Ping and Trace
docidentifier:
- content: draft-ietf-bier-ping
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: |-
    <p>Bit Index Explicit Replication (BIER) is a multicast forwarding
       architecture designed to simplify and optimize multicast delivery.

       This document specifies the mechanism and basic BIER OAM packet
       format that can be used to perform failure detection and isolation on
       the BIER data plane without any dependency on other layers, like the
       IP layer.</p>
