abstract:
- language: en
  script: Latn
  content: |-
    <p>This document recommends that the IETF formally require its standards
       work to be IP version agnostic or to explicitly include support for
       IPv6, with some exceptions, to ensure that it is possible to operate
       without dependencies on IPv4.</p>
