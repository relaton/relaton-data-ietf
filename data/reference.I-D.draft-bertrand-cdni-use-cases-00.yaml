abstract:
- language: en
  script: Latn
  content: "<p>This document depicts use cases for content delivery network (CDN)
    interconnection based on Orange experiments.  The use cases are divided in the
    two following categories.  Category 1 use cases present situations that require
    a footprint extension for existing CDNs.  Category 2 use cases include additional
    situations where CDN interconnection would be desirable in a longer term.</p>"
