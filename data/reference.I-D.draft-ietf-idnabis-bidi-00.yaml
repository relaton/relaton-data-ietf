abstract:
- language: en
  script: Latn
  content: "<p>The use of right-to-left scripts in internationalized domain names
    has presented several challenges.  This memo discusses some problems with these
    scripts, and some shortcomings in the 2003 IDNA BIDI criterion.  Based on this
    discussion, it proposes a new BIDI criterion for IDNA labels.</p>"
