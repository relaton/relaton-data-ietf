abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an Extensible Authentication Protocol (EAP)
    mechanism for authentication and session key distribution using the Authentication
    and Key Agreement (AKA) mechanism used in the 3rd generation mobile networks Universal
    Mobile Telecommunications System (UMTS) and cdma2000. AKA is based on symmetric
    keys, and runs typically in a Subscriber Identity Module (UMTS Subscriber Identity
    Module USIM, or (Removable) User Identity Module (R)UIM), a smart card like device.</p>"
