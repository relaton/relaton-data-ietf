abstract:
- language: en
  script: Latn
  content: "<p>This document describes extension to the Remote Authentication Dial-
    In User Service (RADIUS) protocol to allow participants in a multi- hop RADIUS
    proxy fabric to check the status of a remote RADIUS authentication realm, gain
    visibility into the path that a RADIUS request will take across the RADIUS proxy
    fabric, and mitigate or prevent RADIUS proxy loops.</p>"
