abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of the OSPF-MANET interface in single-hop
    broadcast networks. It includes a mechanism to dynamically determine the presence
    of such a network and specific operational considerations due to its nature. This
    document updates RFC 5820.</p>"
