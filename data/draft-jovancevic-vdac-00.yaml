abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Verifiable Data Access Contract (VDAC),
    a protocol for cryptographically verifiable bilateral agreement between a content
    publisher and an automated agent regarding the terms of programmatic data access.
    VDAC defines the mechanism by which a site publishes an access offer, an agent
    accepts that offer, both parties sign the resulting contract, and per-request
    references bind individual interactions to agreed terms. VDAC is the protocol-layer
    realization of the bilateral commitment principle introduced in Section 6.6 of
    the Verifiable Identity Claims and Delegation Model [VICDM] and operates as a
    companion specification to the Signed Agent Identity Protocol [SAIP]. This document
    defines mechanism, not content: VDAC verifies the existence and integrity of an
    agreement; the substance of what is agreed remains entirely between the contracting
    parties.</p>"
