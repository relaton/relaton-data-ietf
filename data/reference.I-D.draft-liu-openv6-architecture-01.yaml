abstract:
- language: en
  script: Latn
  content: "<p>IPv6 transition leads to costly end-to-end network upgrades and poses
    new challenges in terms of device management with a variety of transitional protocols.
    \ This document provides a cost-effective and flexible unified IPv6 deployment
    by describing an architecture of a standard and programmatic manner for IPv6 deployment.</p>"
