abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a Network Service Header (NSH) that can be added
    to encapsulated network packets or frames to create network service paths.  In
    addition to path information, this header also carries metadata used by network
    devices and/or network services.</p>"
