abstract:
- language: en
  script: Latn
  content: <p>Cellular networks often use Internet standard technologies to handle
    synchronization.  This document analyses the need for security methods for synchronization
    messages distributed over the Internet. This document also gives a solution on
    how to mark the synchronization message when IPSec is implemented in end to end
    frequency synchronization."</p>
