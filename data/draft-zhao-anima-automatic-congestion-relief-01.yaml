abstract:
- language: en
  script: Latn
  content: "<p>This document describes an automatic network congestion relief mechanism
    for congestion caused by sudden capacity reduction, such as fiber failures. The
    mechanism uses traffic modeling, real-time congestion monitoring, policy generation,
    policy propagation, traffic regulation, and policy reversion to redistribute selected
    traffic from a congested plane to a lightly loaded paired plane. The objective
    is to reduce manual intervention, shorten congestion mitigation time, and improve
    network resilience during failure conditions.</p>"
