abstract:
- language: en
  script: Latn
  content: "<p>This memo identifies some issues with the process of progressing performance
    metric RFCs along the standards track.  This memo takes the position that the
    metric definitions themselves should be the primary focus, rather than the implementations
    of metrics.  This appears to allow some simplification of the task at hand and
    subsequently leads to solutions for the issues raised.</p>"
