abstract:
- language: en
  script: Latn
  content: "<p>This document provides a mechanism for synchronizing and negotiating quantum\nkeys by carrying quantum key information through IPv6 extension headers. The communicating parties\nselect the corresponding encryption and decryption keys from the quantum key library based\non the negotiation results, thereby achieving quantum-encrypted communication over IPv6\nnetwork. Internet-Drafts are draft documents valid for a maximum of six months and may be\nupdated, replaced, or obsoleted by other documents at  any time. It is inappropriate to\nuse Internet-Drafts as  reference material or to cite them other than as \"work in\nprogress.\"</p>"
