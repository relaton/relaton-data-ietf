title:
- language: en
  script: Latn
  content: Principles for Unicode Code Point Inclusion in Labels in the DNS Root
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-sullivan-dns-zone-codepoint-pples-00
