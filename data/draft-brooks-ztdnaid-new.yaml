abstract:
- language: en
  script: Latn
  content: <p>This document defines the 'ztdnaid' Uniform Resource Identifier(URI)
    scheme, used to represent globally unique, cryptographically verifiable Digital
    DNA Identifiers (ZTDNAIDs) within Zero Trust architecture implementations. A ZTDNAID
    binds an entitys immutable, unique Digital DNA Record "DDR" to a resolvable identifier
    suitable for authentication, authorization, attestation, and trust-registry lookup.
    The scheme is designed for use with trust registries operating across "Public
    Trust Infrastructure" (PTI), such as SAG-CTR and supports deterministic resolution,
    offline verification, and secure dereferencing.</p>
