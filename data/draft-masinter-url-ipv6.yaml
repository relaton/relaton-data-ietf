abstract:
- language: en
  script: Latn
  content: "<p>The normal textual representation for IPv6 addresses as a set\nof colon-separated hexadecimal numbers does not work well with\nmost deployed URL-parsing software. This document describes an\nalternate format which will pass unharmed through most URL-parsing\nsoftware.</p>"
