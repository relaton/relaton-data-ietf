abstract:
- language: en
  script: Latn
  content: <p>This document describes extensions to the Address Resolution Protocol
    to distribute MPLS labels for IP host addresses. Distribution of labels via ARP
    enables simple plug-and-play operation of MPLS, which is among the key goals of
    "MPLS Fabric" architecture.</p>
