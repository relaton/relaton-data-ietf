abstract:
- language: en
  script: Latn
  content: <p>This document specifies a CBOR encoding of X.509 certificates. The resulting
    certificates are called C509 Certificates. The CBOR encoding supports a large
    subset of RFC 5280 and all certificates compatible with the RFC 7925, IEEE 802.1AR
    (DevID), CNSA 1.0, RPKI, GSMA eUICC, and CA/Browser Forum Baseline Requirements
    profiles. C509 is deployed in different settings including, in-vehicle and vehicle-to-cloud
    communication, Unmanned Aircraft Systems (UAS), and Global Navigation Satellite
    System (GNSS). When used to re-encode DER encoded X.509 certificates, the CBOR
    encoding can in many cases reduce the size of RFC 7925 profiled certificates by
    over 50% while also significantly reducing memory and code size compared to ASN.1.
    The CBOR encoded structure can alternatively be signed directly ("natively signed"),
    which does not require re-encoding for the signature to be verified. The TLSA
    selectors registry defined in RFC 6698 is extended to include C509 certificates.
    The document also specifies C509 Certificate Requests, C509 COSE headers, a C509
    TLS certificate type, and a C509 file format.</p>
