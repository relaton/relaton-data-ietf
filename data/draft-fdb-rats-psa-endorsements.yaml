abstract:
- language: en
  script: Latn
  content: "<p>PSA Endorsements comprise reference values, endorsed values, cryptographic
    key material and certification status information that a Verifier needs in order
    to appraise Attestation Evidence produced by a PSA device. This memo defines PSA
    Endorsements as a profile of the CoRIM data model.</p>"
