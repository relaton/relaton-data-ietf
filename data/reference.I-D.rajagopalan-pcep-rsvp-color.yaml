- language: en
  script: Latn
  content: "<p>This document specifies extensions to Path Computation Element Protocol
    (PCEP) to carry a newly defined attribute of RSVP LSP called 'color' that can
    be used as a guiding criterion for selecting the LSP as a next hop for a service
    route.</p>"
