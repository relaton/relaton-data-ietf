- language: en
  script: Latn
  content: "<p>This MIB module defines textual conventions to represent commonly used
    Internet network layer addressing information. The intent is that these textual
    conventions (TCs) will be imported and used in MIB modules that would otherwise
    define their own representations. [STANDARDS-TRACK]</p>"
