abstract:
- language: en
  script: Latn
  content: "<p>The DNS Security Extensions (DNSSEC) was developed to provide origin
    authentication and integrity protection for DNS data by using digital signatures.
    \ These digital signatures can be generated using different algorithms.  Each
    digital signature added to a response increases the size of the response, which
    could result in the response message being truncated.  This draft sets out to
    specify a way for validating end-system resolvers to signal to a server which
    cryptographic algorithms they prefer in a DNSSEC response by defining an EDNS
    option to list a client's preferred algorithms.</p>"
