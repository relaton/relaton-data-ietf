abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how Generic Network Virtualization Encapsulation
    (Geneve) can be used to carry IP Encapsulating Security Payload (ESP) and IP Authentication
    Header (AH) to provide secure transport over IP networks. Using IPSec ESP and
    AH will provide both Geneve header integrity protection and Geneve payload encryption.</p>"
