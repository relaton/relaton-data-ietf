abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 4255, which defines a DNS resource record
    - SSHFP that contains a standard SSH key fingerprint used to verify Secure Shell
    (SSH) host keys using Domain Name System Security (DNSSEC).  This document defines
    how to store Secure Shell (SSH) ECDSA public keys and SHA-256 fingerprints in
    SSHFP resource records.</p>"
