- language: en
  script: Latn
  content: "<p>This document gives a construction for a Key Encapsulation Mechanism
    (KEM)-based authentication mechanism in TLS 1.3. This proposal authenticates peers
    via a key exchange protocol, using their long- term (KEM) public keys.</p>"
