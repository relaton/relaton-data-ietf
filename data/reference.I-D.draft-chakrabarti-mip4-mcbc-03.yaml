abstract:
- language: en
  script: Latn
  content: "<p>This document define a new Mobile IPv4 extension which is used with
    Mobile IPv4 signaling to negotiate the Multicast-Broadcast Encapsulation Delivery
    style in the case of Foreign Agent Care-of- Address mode registration.  This mechanism
    allows the mobile node to negotiate which type of traffic to be delivered encapsulated
    to the foreign agent while delivering other types of IP packets using direct delivery
    style.  In particular, this mechanism will give flexibility to eliminate tunnel
    overhead in the (typically) wireless medium between the mobile node and the foreign
    agent.</p>"
