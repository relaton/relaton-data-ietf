title:
- language: en
  script: Latn
  content: Encapsulation of Simple Two-Way Active Measurement Protocol for LSPs and
    Pseudowires in MPLS Networks
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-mpls-stamp-pw-18
