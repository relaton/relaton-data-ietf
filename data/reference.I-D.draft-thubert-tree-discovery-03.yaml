- language: en
  script: Latn
  content: "<p>The purpose of this paper is to describe a minimum set of features
    that extends the Nemo basic support [4] in order to avoid loops in the nested
    Nemo case. As a result, Mobile Routers assemble into a tree that can be optimized
    based on various metrics.</p>"
