id: draftietfpcebindinglabelsid
schema_version: v1.5.6
formattedref:
  content: draft-ietf-pce-binding-label-sid
title:
- language: en
  script: Latn
  content: Carrying Binding Label/Segment Identifier (SID) in PCE-based Networks.
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-pce-binding-label-sid-16
docidentifier:
- content: draft-ietf-pce-binding-label-sid
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2023-03-27'
abstract:
- language: en
  script: Latn
  content: "<p>In order to provide greater scalability, network confidentiality, and\n   service independence, Segment Routing (SR) utilizes a Binding Segment\n   Identifier (SID) (called BSID) as described in RFC 8402.  It is\n   possible to associate a BSID to an RSVP-TE-signaled Traffic\n   Engineering Label Switched Path or an SR Traffic Engineering path.\n   The BSID can be used by an upstream node for steering traffic into\n   the appropriate TE path to enforce SR policies.  This document\n   specifies the concept of binding value, which can be either an MPLS\n   label or Segment Identifier.  It further specifies an extension to\n   Path Computation Element (PCE) communication Protocol(PCEP) for\n   reporting the binding value by a Path Computation Client (PCC) to the\n   PCE to support PCE-based Traffic Engineering policies.</p>"
