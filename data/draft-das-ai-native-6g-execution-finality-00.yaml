abstract:
- language: en
  script: Latn
  content: |-
    <p>Future telecommunications systems are increasingly programmable, API-
       driven, AI-assisted, distributed, sensing-aware, and autonomous.  In
       such systems, successful authentication of a network function or AI
       controller does not necessarily establish authority for every
       routing, signaling, session, resource-allocation, sensing, or
       subscriber-specific consequence that the function can generate.

       This document defines an execution-finality profile for AI-native 5G,
       5G-Advanced, future 6G/IMT-2030, O-RAN, and AI-RAN environments.  A
       proposed network operation is represented as a Network Candidate Act
       and held in a Non-Effective State while a Protected Enforcement
       Domain validates network identity, purpose, scope, subscriber or
       resource context, destination, jurisdiction where applicable, policy
       and revocation state, and the intended network effectuation boundary.

       Protected validation evidence is committed before, or atomically
       with, release of scoped non-bearer finality authority.  A network
       Finality Sink at a carrier gateway, UPF, control-plane function,
       session controller, network API gateway, AI-RAN/O-RAN enforcement
       point, or equivalent boundary independently verifies that authority
       immediately before the live network state changes.  The core rule is:
       network authentication is not network finality, and computation is
       not authority.

       This revision also defines a concrete JSON-based interoperability
       profile for AI-mediated Network Candidate Acts, network validation
       decisions, scoped network finality authority, and immediate Network
       Finality Sink verification.</p>
