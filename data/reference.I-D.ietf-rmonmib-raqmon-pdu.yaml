abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies two transport mappings of the Real-time Application
    Quality of Service Monitoring (RAQMON) information model defined in [RAQMON-FRAMEWORK]
    using TCP as a native transport and the Simple Network Management Protocol (SNMP)
    to carry the RAQMON information from a RAQMON Data Source (RDS) to a RAQMON Report
    Collector (RRC).</p>"
