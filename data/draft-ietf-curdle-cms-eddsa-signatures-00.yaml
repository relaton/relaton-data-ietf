- language: en
  script: Latn
  content: "<p>This document describes the conventions for using Edwards-curve Digital
    Signature Algorithm (EdDSA) in the Cryptographic Message Syntax (CMS). The conventions
    for Ed25519 and Ed448 are described, but Ed25519ph and Ed448ph are not used with
    the CMS.</p>"
