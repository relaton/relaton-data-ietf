- language: en
  script: Latn
  content: "<p>This document discusses requirements for the support of inter-AS MPLS
    Traffic Engineering (MPLS TE). The main objective of this document is to present
    a set of requirements which would result in a set of general guidelines in the
    definition, selection and specification development for any technical solution(s)
    meeting these requirements.</p>"
