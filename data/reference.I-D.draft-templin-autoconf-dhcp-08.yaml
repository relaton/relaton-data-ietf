abstract:
- language: en
  script: Latn
  content: "<p>Mobile Ad-hoc Networks (MANETs) connect routers on links with asymmetric
    reachability characteristics, and may also connect to other networks including
    the Internet. Routers in MANETs must have a way to automatically provision global-
    and/or local-scope IP addresses/prefixes. This document specifies mechanisms for
    MANET autoconfiguration. Both IPv4 and IPv6 are discussed.</p>"
