abstract:
- language: en
  script: Latn
  content: |-
    <p>Some clients will want to know if there are one or more DoH servers
       associated with the DNS recursive resolver that the client is already
       using.  This document describes a protocol for a resolver to tell a
       client what its associated DoH servers are.</p>
