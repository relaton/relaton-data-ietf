- language: en
  script: Latn
  content: "<p>This document describes performance measurement(PM) architecture for
    Service Function Chains (SFCs) to assess the operational status and behavior of
    a service function, a subset of service function's, a whole service function chain
    as a function of the actual deterministic service function / service function
    chain. This document does not propose solutions, protocols, nor any extension
    to existing protocols.</p>"
