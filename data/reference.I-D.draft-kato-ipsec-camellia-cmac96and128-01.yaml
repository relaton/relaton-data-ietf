abstract:
- language: en
  script: Latn
  content: "<p>This memo specifies two new alogorithms.  One is the usage of Cipher-
    based Message Authentication Code (CMAC) with Camellia block cipher on the authentication
    mechanism of the IPsec Encapsulating Security Payload and Authentication Header
    protocols.  This algoritm is called Camellia-CMAC-96.  Latter is pseudo-random
    function based on CMAC with Camellia block cipher for Internet Key Exchange.  This
    algoritm is called Camellia-CMAC-PRF-128.</p>"
