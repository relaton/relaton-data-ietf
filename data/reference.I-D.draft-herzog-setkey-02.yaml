- language: en
  script: Latn
  content: "<p>A set-key is a symmetric key (or set of keys) associated with an immutable
    set of participants.  This document defines a set-key attribute for use in the
    CMS-based symmetric-key package structure defined in in RFC XXXX. {{{ RFC Editor,
    please replace XXXX with the number assigned to draft-ietf-keyprov-symmetrickeyformat
    when it is published. }}}</p>"
