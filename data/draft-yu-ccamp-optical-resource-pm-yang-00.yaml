abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model for performance Monitoring
    in optical networks which provides the functionalities of performance monitoring
    task management, TCA (Threshold Crossing Alert) configuration and current or historic
    performance data retrieval. This data model should be used in the northbound of
    PNC.</p>"
