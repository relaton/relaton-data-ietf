abstract:
- language: en
  script: Latn
  content: "<p>HTTP Streaming allows breaking the live contents or stored contents
    into several chunks/fragments and supplying them in order to the client. Several
    issues regarding control over the delivery of data with real-time property using
    HTTP have been raised. Also various issues arise when we consider offering the
    video quality requirements to streaming video over Internet. This document describes
    these issues.</p>"
