abstract:
- language: en
  script: Latn
  content: "<p>VPLS, as currently defined, has challenges pertaining to the areas
    of redundancy and multicast optimization. In particular, multi- homing with all-active
    forwarding cannot be supported and there's no easy way for leveraging MP2MP MDTs
    for optimizing the delivery of multi-destination frames. This document defines
    an evolution of the current VPLS solution, referred to as Routed VPLS (R-VPLS),
    to address these shortcomings.  Conventions</p>"
