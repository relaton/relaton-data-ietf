abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to the TCP Authentication Option
    to support its use over connections that pass through network address and/or port
    translators (NATs/NAPTs). This document describes this extension, and is intended
    that if desired, would be incorporated into the TCP-AO description currently under
    development. This document is not intended to remain stand-alone.</p>"
