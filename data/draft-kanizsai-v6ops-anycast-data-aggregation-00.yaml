abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to use anycast addresses for collecting
    feedback information on the reverse link in case of multicast forward transmission.
    The application for anycast addressing in the case of multicast transmission is
    the novelty. The draft describes the fundamentals and requirements about how to
    collect and aggregate feedback information if anycasting is applied.</p>"
