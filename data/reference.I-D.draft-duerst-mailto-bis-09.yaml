abstract:
- language: en
  script: Latn
  content: "<p>This document defines the format of Uniform Resource Identifiers (URI)
    to identify resources that are reached using Internet mail.  It adds better internationalization
    and compatibility with IRIs (RFC 3987) to the previous syntax of 'mailto' URIs
    (RFC 2368).</p>"
