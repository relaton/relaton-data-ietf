    - language: en
      script: Latn
      content: "<p>This memo discusses when it is appropriate to register and utilize
        an Autonomous System (AS), and lists criteria for such.  This document specifies
        an Internet Best Current Practices for the Internet Community, and requests
        discussion and suggestions for improvements.</p>"
