abstract:
- language: en
  script: Latn
  content: "<p>This memo describes the DING (Diagnostic Interplanetary Network Gateway)
    protocol, which is a network management protocol designed for use in delay and
    disruption tolerant networks (DTNs).  The protocol is designed to eliminate some
    of the overhead involved with using SNMP to manage hosts on a DTN.</p>"
