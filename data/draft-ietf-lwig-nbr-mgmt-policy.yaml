- language: en
  script: Latn
  content: "<p>This document describes the problems associated with neighbor cache
    management in multihop networks involving resource-constrained devices. Thereafter,
    it also presents a sample neighbor management policy that allows efficient cache
    management in multihop LLNs (low- power and lossy networks such as LoWPAN) with
    resource-constrained devices.</p>"
