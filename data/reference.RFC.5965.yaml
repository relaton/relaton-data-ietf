abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extensible format and MIME type that may be
    used by mail operators to report feedback about received email to other parties.
    \ This format is intended as a machine-readable replacement for various existing
    report formats currently used in Internet email.  [STANDARDS-TRACK]</p>"
