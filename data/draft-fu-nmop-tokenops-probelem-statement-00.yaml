abstract:
- language: en
  script: Latn
  content: "<p>Distributed LLM inference relies heavily on high-performance networking
    to synchronize states across accelerators (e.g., GPUs) and nodes. Unlike traditional
    web services, inference workloads particularly those involving Mixture-of-Experts
    (MoE) models and long-context windows exhibit unique traffic patterns characterized
    by massive east-west traffic and strict latency constraints. Current network infrastructures
    and scheduling methods often treat compute resources and network paths independently,
    leading to suboptimal performance and degraded Quality of Experience (QoE). This
    document elaborates on these issues to guide potential protocol enhancements within
    the IETF.</p>"
