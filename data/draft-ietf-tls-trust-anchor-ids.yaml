abstract:
- language: en
  script: Latn
  content: "<p>This document defines the TLS Trust Anchors extension, a mechanism\n   for a TLS client or server to select a certificate to present based\n   on the peer's trusted certification authorities.  It describes\n   certification authorities more succinctly than the TLS Certificate\n   Authorities extension.</p>"
