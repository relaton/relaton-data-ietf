abstract:
- language: en
  script: Latn
  content: "<p>This draft outlines a protocol to achieve minimal disruption during
    Mobile IPv6 handoff. Minimal disruption during handoff is required by Mobile IPv6
    to reduce the window of data loss experienced by a MN (Mobile Node) when moving
    between access networks that may belong to same or different administrative domains.</p>"
