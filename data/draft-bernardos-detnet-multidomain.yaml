abstract:
- language: en
  script: Latn
  content: "<p>This document addresses the multi-domain DetNet problem, analyzing
    what the technical gaps are and exploring some possible solutions. Application,
    control and data plane aspects are in scope. The goal is to help understanding
    what might be the next steps towards enabling DetNet in multi technology and/or
    administrative domains.</p>"
