- language: en
  script: Latn
  content: "<p>This document specifies extensions to the OSPF routing protocol in
    support of carrying link state information for abstracted transport plane sub-networks
    and external addresses in an optical network. For this purpose, new TLV triplets
    for OSPF TE LSA are defined.</p>"
