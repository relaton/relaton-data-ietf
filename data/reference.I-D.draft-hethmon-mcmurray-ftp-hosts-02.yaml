abstract:
- language: en
  script: Latn
  content: "<p>The File Transfer Protocol, as defined in RFC 959 [1] and RFC 1123
    Section 4 [6], is one of the oldest and widely used protocols on the Internet.
    \ This document addresses the subject of creating multi-homed FTP hosts servers
    on a single IP address.  This is achieved by extending the FTP specification to
    add a HOST command that is used to specify individual FTP hosts.</p>"
