abstract:
- language: en
  script: Latn
  content: "<p>This draft describes the Basic Mode of Layer 1 VPNs (L1VPN BM). L1VPN
    Basic mode is a port-based VPN. In L1VPN Basic Mode (BM), the basic unit of service
    is a Label Switched Path (LSP) between a pair of customer ports within a given
    VPN port-topology. This document defines the operational model using either provisioning
    or a VPN auto-discovery mechanism and the signaling extensions for the L1VPN BM.</p>"
