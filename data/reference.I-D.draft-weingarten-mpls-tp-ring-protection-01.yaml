abstract:
- language: en
  script: Latn
  content: "<p>This document describes mechanisms to address the requirements for
    protection of ring topologies for Multi-Protocol Label Switching Transport Profile
    (MPLS-TP) Label Switched Paths (LSP) and Pseudowires (PW) on multiple layers.
    \ Ring topologies offer the possibility of reducing the OAM overhead while providing
    a simplified protection mechanism.  The document analyzes two basic ring protection
    schemes and explains how ring protection can be viewed as an application of linear
    protection.</p>"
