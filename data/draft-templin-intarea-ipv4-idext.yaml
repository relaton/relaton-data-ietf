abstract:
- language: en
  script: Latn
  content: "<p>The Internet Protocol, version 4 (IPv4) header includes a 16 bit Identification
    field in all packets, but this length is too small to ensure reassembly integrity
    at high data rates in modern networks. This document addresses the issue by defining
    an Identification Extension (IDEXT) option for IPv4 as well as a corresponding
    Destination Option for IPv6.</p>"
