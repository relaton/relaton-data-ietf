abstract:
- language: en
  script: Latn
  content: "<p>With the widespread adoption of AI Agents, traditional network\n   architectures can no longer meet the demand for efficient\n   collaboration between agents and networks.  This document proposes a\n   new paradigm of \"AI Agent Policy-Aware Network\", enabling three key\n   transformations: from Flow-aware to Agent-aware, from QoS-based to\n   Policy-intent-based, and from Network-driven to Agent-network\n   collaborative.  By defining core components such as the Agent Policy-\n   aware Controller and Agent Policy-Aware Device, this paradigm\n   establishes a dynamic mapping mechanism between Agent intents and\n   network policies, supporting key scenarios including autonomous\n   performance measurement, path optimization, SLA assurance, and secure\n   transmission.  This document outlines the background, scenarios, use\n   cases and requirements of Agent Policy-aware Network.</p>"
