abstract:
- language: en
  script: Latn
  content: "<p>This document explains how to interconnect IPv6 islands over an IPv4
    cloud, including the exchange of IPv6 reachability information using BGP. Two
    approaches will be explained, both requiring a Dual Stack MP-BGP-speaking edge
    router per IPv6 island. The hosts in the IPv6 islands can use native IPv6 addresses.</p>"
