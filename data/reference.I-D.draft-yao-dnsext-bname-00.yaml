abstract:
- language: en
  script: Latn
  content: <p>This document defines a new DNS Resource Record called "BNAME", which
    provides the capability to map an entire tree of the DNS name space to another
    domain.  It differs from the CNAME record which maps a single node of the name
    space, from the DNAME which maps the subtree of the DNS name space to another
    domain.  Status of this Memo  This Internet-Draft is submitted to IETF in full
