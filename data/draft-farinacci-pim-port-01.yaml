abstract:
- language: en
  script: Latn
  content: "<p>This draft describes how a reliable transport mechanism can be used
    by the PIM protocol to optimize CPU and bandwidth resource utilization by eliminating
    periodic Join/Prune message transmission. This draft proposes a modular extension
    to PIM to use either the TCP or SCTP transport protocol.</p>"
