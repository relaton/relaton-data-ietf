abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a resource set registration mechanism
       between an OAuth 2.0 authorization server and resource server.  The
       resource server registers information about the semantics and
       discovery properties of its resources with the authorization server.</p>
