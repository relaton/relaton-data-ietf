abstract:
- language: en
  script: Latn
  content: "<p>With the global deployment of RPKI, a lot of concerns about technical
    problems have been and will be raised. In this draft, we collect and analyze the
    problems that have appeared or that seem likely to appear during the process of
    RPKI deployment, and suggest some solutions to address or mitigate these problems.</p>"
