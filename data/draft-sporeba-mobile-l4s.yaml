- language: en
  script: Latn
  content: "<p>This document documents best practices for deployment of Low Latency,\n   Low Loss, and Scalable Throughput (L4S) in mobile devices.  It\n   defines the responsibilities of the host operating system, the link-\n   layer (modem and WiFi) subsystems to ensure successful end-to-end\n   low-latency communication.</p>"
