abstract:
- language: en
  script: Latn
  content: <p>This document describes a YANG data model of the Consumer-Facing Interface
    of the Security Controller in an Interface to Network Security Functions (I2NSF)
    system in a Network Functions Virtualization (NFV) environment. This document
    defines various types of managed objects and the relationship among them needed
    to build the flow policies from users' perspective. The YANG data model is based
    on the "Event-Condition-Action" (ECA) policy defined by a capability YANG data
    model for I2NSF. The YANG data model enables different users of a given I2NSF
    system to define, manage, and monitor flow policies within an administrative domain
    (e.g., user group).</p>
