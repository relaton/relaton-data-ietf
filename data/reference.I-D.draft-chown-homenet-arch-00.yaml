abstract:
- language: en
  script: Latn
  content: <p>This text describes the evolving networking technology within small
    "residential home" networks.  The goal of this memo is to define the architecture
    for IPv6-based home networking.  The text highlights the impact of IPv6 on home
    networking, and illustrates some topology scenarios.  The architecture shows how
    standard IPv6 mechanisms and addressing can be employed in home networking, lists
    a number of principles that should apply, and outlines the need for specific protocol
    extensions for certain additional functionality.</p>
