- language: en
  script: Latn
  content: "<p>This document is a companion to RFC 7925 and defines TLS/DTLS 1.3 profiles
    for Internet of Things devices. It also updates RFC 7925 with regards to the X.509
    certificate profile. Discussion Venues This note is to be removed before publishing
    as an RFC. Source for this draft and an issue tracker can be found at https://github.com/thomas-fossati/draft-tls13-iot.</p>"
