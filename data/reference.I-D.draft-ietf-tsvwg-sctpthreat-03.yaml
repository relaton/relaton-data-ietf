abstract:
- language: en
  script: Latn
  content: "<p>Stream Control Transmission Protocol defined in RFC 2960 is a multi-
    homed transport protocol. As such, unique security threats exists that are addressed
    in various ways within the protocol itself. This document attempts to detail the
    known security threats and their countermeasures as detailed in the current version
    of the SCTP Implementors guide RFC 4460. It is hoped that this information will
    provide some useful background information for many of the newest requirements
    spelled out in the SCTP Implementors guide.</p>"
