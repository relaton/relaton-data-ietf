abstract:
- language: en
  script: Latn
  content: "<p>SMTP MTA-STS is a mechanism enabling mail service providers to declare
    their ability to receive TLS-secured connections, to declare particular methods
    for certificate validation, and to request that sending SMTP servers report upon
    and/or refuse to deliver messages that cannot be delivered securely.</p>"
