abstract:
- language: en
  script: Latn
  content: "<p>EAP pre-authentication is defined as the use of EAP to pre-establish
    EAP keying material on a target authenticator prior to arrival of the peer at
    the access network managed by that authenticator.  This draft discusses EAP pre-authentication
    problems in details.</p>"
