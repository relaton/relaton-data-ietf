abstract:
- language: en
  script: Latn
  content: "<p>The Application-Layer Traffic Optimization (ALTO) service defines\n   network and cost maps to provide basic network information.  This\n   document motivates an optional extension of ALTO for the definition\n   of additional topology properties.  The ALTO extension supports both\n   path-vector and node-edge topology maps.</p>"
