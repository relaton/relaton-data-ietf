abstract:
- language: en
  script: Latn
  content: "<p>This document extends local routing in proxy Mobile IPv6 and defines
    a simplified localized routing optimization protocol within one PMIPv6 domain.
    The protocol supports IPv4 transport network operation, IPv4 home address mobility
    and handover. The Local mobility anchor/mobile access gateway initiates local
    routing for the mobile and correspondent node by sending messages to each mobile
    access gateway/local mobility anchor. In case the correspondent node is connected
    to another local mobility anchor, the local mobility anchors connected by the
    correspondent node needs to be discovered firstly so that it can notify its mobile
    access gateways to the mobile access gateway attached by the mobile node afterwards.
    Mobile access gateways create and refresh bindings using proxy binding update
    and acknowledgement messages.</p>"
