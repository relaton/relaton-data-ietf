abstract:
- language: en
  script: Latn
  content: "<p>In order to provide inter-domain authentication services, it is necessary
    to have a standardized method that domains can use to identify each others users.
    \ This document defines the syntax for the Network Access Identifier (NAI), the
    user identity submitted by the client prior to accessing network resources. This
    document is a revised version of RFC 4282 [RFC4282], which addresses issues with
    international character sets, as well as a number of other corrections to the
    previous document.</p>"
