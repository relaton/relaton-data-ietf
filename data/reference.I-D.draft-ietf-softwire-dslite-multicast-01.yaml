abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a solution for the delivery of multicast service
    offerings to DS-Lite serviced customers.  The proposed solution relies upon a
    stateless IPv4-in-IPv6 encapsulation scheme and uses the IPv6 multicast distribution
    tree to deliver IPv4 multicast traffic over an IPv6 multicast-enabled network.</p>"
