abstract:
- language: en
  script: Latn
  content: "<p>Point-to-Point Protocol Over Ethernet (PPPoE), as described in RFC
    2516 [1], mandates a maximum negotiated MRU of 1492. This document outlines a
    solution to relax that restriction and allow a maximum negotiated MRU greater
    than 1492 to minimize fragmentation in next generation broadband networks.</p>"
