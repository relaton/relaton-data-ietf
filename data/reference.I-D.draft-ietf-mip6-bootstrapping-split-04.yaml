abstract:
- language: en
  script: Latn
  content: "<p>A Mobile IPv6 node requires a Home Agent address, a home address, and
    IPsec security associations with its Home Agent before it can start utilizing
    Mobile IPv6 service. RFC 3775 requires that some or all of these are statically
    configured. This document defines how a Mobile IPv6 node can bootstrap this information
    from non- topological information and security credentials preconfigured on the
    Mobile Node. The solution defined in this document solves the bootstrapping problem
    from draft-ietf-mip6-bootstrapping-ps-02 when the Mobile Node's mobility service
    is authorized by a different service provider than basic network access, and is
    therefore generically applicable to any bootstrapping case.</p>"
