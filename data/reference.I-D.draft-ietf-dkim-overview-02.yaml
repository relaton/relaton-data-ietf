abstract:
- language: en
  script: Latn
  content: <p>DomainKeys Identified Mail (DKIM) associates a "responsible" identity
    with a message and provides a means of verifying that the association is legitimate.[I-D.ietf-dkim-base].
    DKIM defines a domain-level authentication framework for email using public-key
    cryptography and key server technology. This permits verifying the source or intermediary
    for a message, as well as the contents of messages. The ultimate goal of this
    framework is to permit a signing domain to assert responsibility for a message,
    thus proving and protecting the identity associated with the message and the integrity
    of the messages itself, while retaining the functionality of Internet email as
    it is known today. Such protection of email identity, may assist in the global
    control of "spam" and "phishing". This document provides an overview of DKIM and
    describes how it can fit into a messaging service, how it relates to other IETF
    message signature technologies. It also includes implementation and migration
    considerations.</p>
