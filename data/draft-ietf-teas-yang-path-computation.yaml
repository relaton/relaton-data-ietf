id: draftietfteasyangpathcomputation
schema_version: v1.5.6
formattedref:
  content: draft-ietf-teas-yang-path-computation
title:
- language: en
  script: Latn
  content: A YANG Data Model for requesting path computation
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-teas-yang-path-computation-28
docidentifier:
- content: draft-ietf-teas-yang-path-computation
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-05-12'
abstract:
- language: en
  script: Latn
  content: "<p>In certain scenarios — particularly within hierarchical Software-\n   Defined Networking (SDN) environments—the topology information\n   provided by a Traffic Engineering (TE) network provider may be\n   insufficient for a client to perform end-to-end multi-domain path\n   computation.  In such cases, the client may need to delegate the\n   computation of specific intra-domain paths to the TE provider,\n   leveraging the resulting path segments to construct optimal multi-\n   domain end-to-end paths.\n\n   This document defines a mechanism to enable path computation requests\n   by augmenting the Remote Procedure Calls (RPCs) specified in RFC\n   YYYY.  The augmented RPCs support path computation on demand,\n   allowing clients to request intra-domain TE path computations from\n   the provider while maintaining control over inter-domain path\n   selection.\n\n   Additionally, this document outlines several use cases in which such\n   path computation requests are beneficial, particularly in\n   environments where YANG-based management protocols—such as NETCONF or\n   RESTCONF—are used for network automation and control.</p>"
