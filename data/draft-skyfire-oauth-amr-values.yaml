abstract:
- language: en
  script: Latn
  content: <p>The JWT "amr" (Authentication Methods References) claim contains values
    conveying authentication methods used in the authentication. This specification
    defines additional Authentication Method Reference values beyond those already
    registered to represent additional authentication methods in use today.</p>
