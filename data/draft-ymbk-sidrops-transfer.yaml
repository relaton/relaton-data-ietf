abstract:
- language: en
  script: Latn
  content: "<p>Transfer within the RPKI of actual address space and/or autonomous\n   system number resources between two Internet registries (ISPs, RIRs,\n   NIRs, etc.) is reasonably achievable for most useful operational\n   needs.  In this paper, we describe, at a high level, how this may be\n   accomplished.</p>"
