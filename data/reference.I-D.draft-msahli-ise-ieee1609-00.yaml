abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the use of a new certificate type to authenticate
    TLS entities.  The goal is to enable the use of a certificate specified by the
    IEEE and the European Telecommunications Standards Institute (ETSI).  This specification
    defines an experimental change of TLS to support a new certificate type.</p>"
