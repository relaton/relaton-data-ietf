abstract:
- language: en
  script: Latn
  content: "<p>AI agents operating in enterprise campus networks execute user-\n   delegated tasks by invoking multiple tools and services, often\n   without continuous user supervision.  Traditional authorization\n   models assume stable applications and human-driven interactions,\n   creating a mismatch when applied to autonomous agents that can chain\n   actions across heterogeneous systems.\n\n   Campus environments also contain heterogeneous and legacy services\n   across diverse protocols, making per-service agent-aware\n   authorization difficult to deploy consistently.  This document\n   describes the problem space for campus agent access control and\n   argues that agents require task-bound privilege reduction (\"scope-\n   down\") and that enforcement can be provided by in-path network\n   devices in order to preserve compatibility with existing systems.</p>"
