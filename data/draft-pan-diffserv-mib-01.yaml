  content: |-
    <p>This memo defines a portion of the Management Information Base
       (MIB) for use with network management protocols in TCP/IP-based
       Internets.  In particular, it defines objects for managing the
       interface attributes defined in the Differentiated Services
       Model[HBWW98, JNP98].</p>
