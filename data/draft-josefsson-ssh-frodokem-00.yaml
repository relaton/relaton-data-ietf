- language: en
  script: Latn
  content: |-
    <p>This document specify a hybrid key exchange method in the Secure
       Shell (SSH) protocol based on FrodoKEM (FrodoKEM-976) and X25519 with
       SHA-512 using Chempat as the combiner.

