abstract:
- language: en
  script: Latn
  content: "<p>The RPKI-to-Router (RTR) protocol synchronizes all the verified RPKI
    data to routers. This document proposes to extend the existing RTR protocol to
    support selective data synchronization. Selective synchronization can avoid unnecessary
    transmissions. The router can receive only the data that it really needs.</p>"
