abstract:
- language: en
  script: Latn
  content: <p>Load balancing is a powerful tool for engineering traffic across a network.  This
    memo suggests ways of improving load balancing across MPLS networks using the
    notion of "entropy labels".  It defines the concept, describes why they are needed,
    suggests how they can be used, and enumerates properties of entropy labels that
    allow optimal benefit.</p>
