abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for the reoptimization of loosely
    routed MPLS Traffic Engineering LSPs. A loosely routed LSP follows a path specified
    as a combination of strict and loose hop(s) that contains at least one loose hop
    and zero or more strict hop(s).</p>"
