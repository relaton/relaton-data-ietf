abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for the reoptimization of loosely
    \n   routed MPLS Traffic Engineering LSPs. A loosely routed LSP follows a \n   path
    specified as a combination of strict and loose hop(s) that \n   contains at least
    one loose hop and zero or more strict hop(s).</p>"
