- content: draft-ietf-lisp-nexagon
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>Lisp-Nexagon is a geospatial intelligence network protocol designed
    to support physical-world applications such as transportation, public safety,
    and logistics. It combines the Locator/ID Separation Protocol (LISP) with the
    H3 spatial indexing system to enable distributed agents to report, aggregate,
    and disseminate geospatial state information.</p>"
