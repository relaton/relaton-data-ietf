  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>This document requests registration of opr, an OPTIONAL, descriptive
    JWT claim that marks the operator of record, that is, whether a human or an agent
    operated a credential presentation or drove a decision. Its purpose is record
    integrity. Under agent operation a wallet key- binding proof is cryptographically
    indistinguishable from a human- operated one, and no presentation protocol marks
    the difference; opr records the distinction. A Policy Decision Point MUST ignore
    opr for the allow/deny decision; interpretation and any resulting authorization
    behavior are deployment-local and out of scope. This document defines representation
    only. It defines no remedy, adjudication, obligation, or authorization mandate.</p>"
