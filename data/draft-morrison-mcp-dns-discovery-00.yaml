abstract:
- language: en
  script: Latn
  content: "<p>This document defines a DNS-based mechanism for the discovery of\n   Model Context Protocol (MCP) servers.  A TXT resource record\n   published at the underscore-prefixed label _mcp.&lt;domain&gt; advertises\n   the presence, endpoint URL, transport protocol, cryptographic\n   identity, and capability profile of an MCP server associated with a\n   domain name.  The mechanism complements existing HTTPS-based\n   discovery (.well-known/mcp/server-card.json) by providing a\n   lightweight, resolver-cached bootstrap that requires no HTTPS round-\n   trip.  The design follows the precedent established by DKIM\n   [RFC6376], SPF [RFC7208], DMARC [RFC7489], and MTA-STS [RFC8461], all\n   of which use DNS TXT records at underscore-prefixed labels to\n   advertise domain-scoped policy and service metadata.</p>"
