- language: en
  script: Latn
  content: "<p>This document is a checklist to verify the completeness of Entity MIB
    (Version 2)[RFC2737] agent and manager implementations based on RFC 2737. This
    document will be used to gather and evaluate implementation experience in an effort
    to determine whether RFC 2737 is ready to advance to Draft Standard.</p>"
