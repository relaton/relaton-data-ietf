abstract:
- language: en
  script: Latn
  content: "<p>This document describes the RTP payload format for the Mixed Excitation
    Linear Prediction Enhanced (MELPe) speech coder.  MELPe's three different speech
    encoding rates and sample frames sizes are supported.  Comfort noise procedures
    and packet loss concealment are detailed.  INTERNET DRAFT   RTP Payload Format
    for the MELPe Codec  August 19, 2016</p>"
