- language: en
  script: Latn
  content: <p>This document defines an optional "system" datastore to allow clients
    populate the system configuration into running datastore in the device. It also
    defines a capability-based extension to the NETCONF protocol that helps the NETCONF
    client identify how system configuration are processed by the server.</p>
