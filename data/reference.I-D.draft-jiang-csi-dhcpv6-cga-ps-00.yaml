abstract:
- language: en
  script: Latn
  content: "<p>This document presents a problem statement for the possible interactions
    between DHCPv6 and CGA. Firstly, in order to support the co-existing scenarios
    of DHCPv6 and CGA, Some operations are clarified for the interaction of DHCPv6
    servers and CGA-associated hosts. Then, some extended scenarios are also discussed
    in this document, including using CGAs in DHCPv6 operations to enhance the security
    features and using DHCPv6 to serve the CGA generation.</p>"
