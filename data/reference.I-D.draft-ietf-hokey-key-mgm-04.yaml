abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism for delivering a usage-specific
    root key (USRK), a domain-specific root key (DSRK) and a usage- specific domain-specific
    root key (USDSRK) using RADIUS.  The root keys are derived as part of an Extended
    Master Session Key (EMSK) hierarchy in Extensible Authentication Protocol (EAP),
    and delivered from a server to an intended third-party key holder.  The mechanism
    supports different scenarios for key delivery, depending on the type of keys being
    delivered.  The mechanism description includes the definition for a key distribution
    exchange (KDE) protocol.</p>"
