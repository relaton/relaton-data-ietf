abstract:
- language: en
  script: Latn
  content: "<p>This document enables a pair of communicating proxies to reuse a congestion-controlled
    connection between themselves for sending requests in the forward and backwards
    direction. Because the connection is essentially aliased for requests going in
    the backwards direction, reuse should be predicated upon both the communicating
    endpoints authenticating themselves using X.509 certificates through TLS. For
    this reason, we only consider connection reuse for TLS over TCP and TLS over SCTP.
    A single connection cannot be reused for the TCP or SCTP transport between two
    peers, and this document provides insight into why this is the case. As a remedy,
    it suggests using two TCP connections (or two SCTP associations), each opened
    pro- actively towards the recipient by the sender. Finally, this document also
    provides guidelines on connection reuse and virtual SIP servers and the interaction
    of connection reuse and DNS SRV lookups in SIP.</p>"
