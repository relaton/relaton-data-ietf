- language: en
  script: Latn
  content: "<p>This document describe extensions to BGP-LS protocol to include Preferred
    Path Routing (PPR) information. This document also extends BGP-LS protocol and
    define new SAFIs and NLRIs for propagating path information from a central entity
    to a node in the network in the south bound direction.</p>"
