abstract:
- language: en
  script: Latn
  content: <p>In discussions about SPF users often want to add optional properties
    to their sender policies. The modifier "match_subdomains=yes" made it into early
    SPF drafts. This memo proposes a general syntax for a modifier "op=" for this
    purpose.</p>
