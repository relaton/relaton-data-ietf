abstract:
- language: en
  script: Latn
  content: <p>This document specifies an instantiation of the Privacy Pass Architecture
    (RFC 9576) that allows for a "reverse" flow from the Origin to the Client. It
    describes a method for an Origin to issue a state update to the Client in response
    to a request in which a token is redeemed.</p>
