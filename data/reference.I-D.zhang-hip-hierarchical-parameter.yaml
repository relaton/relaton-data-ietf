abstract:
- language: en
  script: Latn
  content: "<p>This document briefly introduces the benefits brought by extending
    the Host Identity Protocol (HIP) with hierarchical information. In addition, two
    hierarchical extensions of HIP are introduced. The first one aims to transport
    hierarchical information in a parameter of the HIP header, while the second one
    extends DNS resource records in order to contain hierarchical information.</p>"
