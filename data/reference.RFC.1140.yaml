  content: "<p>This memo describes the state of standardization of protocols used
    in the Internet as determined by the Internet Activities Board (IAB). This memo
    is issued quarterly, please be sure the copy you are reading is dated within the
    last three months.  Current copies may be obtained from the Network Information
    Center or from the Internet Assigned Numbers Authority.  Do not use this edition
    after 31-Aug-90.</p>"
