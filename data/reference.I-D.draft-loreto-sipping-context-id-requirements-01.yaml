abstract:
- language: en
  script: Latn
  content: "<p>This document justifies the need and lists the requirements for correlating
    SIP (Session Initiation Protocol) dialogs that relate to the same multimedia session.
    \ Being able to logically correlate multiple SIP dialogs is useful for applications
    that, for different reasons, need to establish several SIP dialogs to provide
    a given service.</p>"
