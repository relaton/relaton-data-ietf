- language: en
  script: Latn
  content: |-
    <p>RFC4412 defines "Resource-Priority Namespaces" and "Resource-Priority
       Priority-values" registries.  The management policy of these
       registries is "Standards Action".  This document changes the
       management policy of these registries to "IETF Review".</p>
