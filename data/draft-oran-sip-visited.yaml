abstract:
- language: en
  script: Latn
  content: "<p>Proxying hides the destinations tried by the proxy. Since this\ninformation is sometimes useful to the requestor, this draft proposes\na new optional SIP request header called Contacts-Tried listing the\nlocations tried unsuccessfully during a search.</p>"
