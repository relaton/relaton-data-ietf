abstract:
- language: en
  script: Latn
  content: "<p>The endpoints of a SRv6 path are given by a SRv6 Policy.  When an endpoint
    node fails, we need bypass this failed endpoint node and forward the packets to
    the failed node's next endpoint node.</p>"
