abstract:
- language: en
  script: Latn
  content: "<p>This document lists the different mechanisms that enable applications
    using Real-time Transport Protocol (RTP) to maintain their RTP Network Address
    Translator (NAT) mappings alive.  It also makes a recommendation for a preferred
    mechanism.  This document is not applicable to Interactive Connectivity Establishment
    (ICE) agents.</p>"
