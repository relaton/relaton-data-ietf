abstract:
- language: en
  script: Latn
  content: "<p>Active performance measurement protocols and metrics are commonly\n   used to measure packet loss, delay, delay variation, reachability,\n   and path behavior.  When an active measurement packet is not\n   received, a response is missing, or a measurement exchange times out,\n   the measurement result identifies the observable outcome but often\n   does not identify the underlying cause.\n\n   Loss observed by active performance measurements can be associated\n   with congestion, queue discard, link or forwarding failures, routing\n   changes, endpoint or reflector behavior, administrative filtering,\n   policing, multipath effects, or validation-related packet discard\n   such as Source Address Validation (SAV).  Different operational\n   conditions can produce similar measurement observations, but they may\n   have different meanings and require different troubleshooting\n   actions.\n\n   This document discusses considerations for interpreting packet loss\n   observed by active performance measurements.  It provides a common\n   set of considerations for separating measured outcomes from inferred\n   causes, describes operational conditions that can lead to observed\n   loss, discusses implications for one-way and two-way measurements,\n   delay and delay variation interpretation, OWAMP, TWAMP, STAMP, and\n   measurements over ECMP and link aggregation.  It also discusses how\n   some considerations may apply to hybrid and passive performance\n   measurements and identifies sources of operational context that can\n   help operators and measurement systems reason about possible\n   explanations.</p>"
