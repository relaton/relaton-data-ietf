abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a mechanism for advertising unreachable\n   prefixes across Autonomous Systems using BGP.  The mechanism enables\n   fast convergence in VPN services when backbone source nodes become\n   unreachable, by allowing Unreachable Prefix Advertisement (UPA)\n   routes propagated through BGP across AS boundaries.  This solution\n   extends the IGP-based UPA mechanism defined in RFC9929 to inter-\n   domain scenarios, ensuring remote PEs can promptly detect and react\n   to failures in source domains.  The route is not used for packet\n   forwarding but solely for BGP next-hop reachability resolution,\n   enabling fast failover of BGP VPN routes.</p>"
