- language: en
  script: Latn
  content: "<p>This document describes a light-weight Virtual Private LAN Service
    (VPLS), referred to as IS-IS VPLS, which uses IS-IS for auto- discovery and signaling.
    IS-IS VPLS is intended to be used as a scalable cloud data center network solution.</p>"
