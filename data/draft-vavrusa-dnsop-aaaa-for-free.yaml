abstract:
- language: en
  script: Latn
  content: "<p>This document enables DNS servers to include AAAA addresses in the
    answer section for DNS queries with QTYPE=A in order to reduce the number of resolver
    round-trips during address lookups, and also provides guidance for recursive DNS
    servers in accepting such records.</p>"
