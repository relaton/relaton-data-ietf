abstract:
- language: en
  script: Latn
  content: "<p>This document defines a solution for Network Address Trans(NAT) traversal
    for the media stream associated with an Real-time Streaming Protocol version 2
    (RTSP 2.0). The mechanism is based on Interactive Connectivity Establishment (ICE)
    adapted for using RTSP as signalling channel. The necessary RTSP protocol extensions
    and procedure is defined in this document.</p>"
