abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of the SEED block cipher algorithm
    in Counter (CTR) Mode, Counter with CBC-MAC (CCM) Mode and Galois/Counter Mode
    (GCM) as an IPsec Encapsulation Security Payload (ESP) mechanism to provide confidentiality
    and data origin authentication, and connectionless integrity.</p>"
