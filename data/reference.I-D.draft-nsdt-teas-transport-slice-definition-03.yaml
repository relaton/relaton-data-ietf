abstract:
- language: en
  script: Latn
  content: "<p>This document describes the definition of a slice in the transport
    networks and its characteristics.  The purpose here is to bring clarity and a
    common understanding of the transport slice concept and describe related terms
    and their meaning.  It explains how transport slices can be used in combination
    with end to end network slices, or independently.</p>"
