abstract:
- language: en
  script: Latn
  content: <p>This document describes the Namespace Identifier (NID) "ddi" for Uniform
    Resource Names (URNs) used to identify resources that conform to the standards
    published by the Data Documentation Initiative (DDI) Alliance (https://ddialliance.org/).
    The DDI Alliance is not affiliated with the Internet Engineering Task Force (IETF)
    or Internet Society (ISOC); and as an independent submission, it does not have
    IETF community consensus.</p>
