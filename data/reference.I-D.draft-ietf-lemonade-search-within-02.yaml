abstract:
- language: en
  script: Latn
  content: "<p>WITHIN is an extension to [RFC3501] SEARCH which returns messages whose
    internal date is within or outside a specified interval and differs from SINCE
    in that an interval in days is specified instead of a date. WITHIN is expected
    to be most useful for persistent searches in combination with mobile devices.</p>"
