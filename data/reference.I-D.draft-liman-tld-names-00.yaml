abstract:
- language: en
  script: Latn
  content: "<p>RFC 1123 is ambiguous regarding the specification for top level domain
    (TLD) labels used in the domain name system.  This document clarifies the specification,
    and aligns it with current praxis, including the use of Internationalized Domain
    Name (IDN) Labels in TLD names.</p>"
