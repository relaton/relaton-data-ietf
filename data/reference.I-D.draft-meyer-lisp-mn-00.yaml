abstract:
- language: en
  script: Latn
  content: "<p>This document describes how a lightweight version of LISP's ITR/ETR
    functionality can be used to provide seamless mobility to a mobile node.  The
    LISP Mobility Architecture uses standard LISP functionality to provide scalable
    mobility for LISP mobile nodes.</p>"
