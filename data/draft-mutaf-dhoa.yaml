- language: en
  script: Latn
  content: |-
    <p>The "home address" in Mobile IPv6 should be considered as private
       information, as it allows access to a mobile host regardless of its
       location.  This document presents a discussion of "disposable home
       addresses" for Mobile IPv6.</p>
