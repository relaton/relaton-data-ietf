abstract:
- language: en
  script: Latn
  content: "<p>Transation Signatures (TSIG) provide a standard mechanism to sign DNS
    messages, so that the authenticity of messages can be verified by the system that
    receives them. This document updates the required behaviour of a system that receives
    a signed message that fails verification.</p>"
