abstract:
- language: en
  script: Latn
  content: "<p>Transation Signatures (TSIG) provide a standard mechanism to sign DNS\n   messages, so that the authenticity of messages can be verified by the\n   system that receives them.  This document updates the required\n   behaviour of a system that receives a signed message that fails\n   verification.</p>"
