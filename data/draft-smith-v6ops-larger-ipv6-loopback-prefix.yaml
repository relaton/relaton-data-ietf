title:
- language: en
  script: Latn
  content: A Larger Loopback Prefix for IPv6
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-smith-v6ops-larger-ipv6-loopback-prefix-04
docidentifier:
- content: draft-smith-v6ops-larger-ipv6-loopback-prefix
