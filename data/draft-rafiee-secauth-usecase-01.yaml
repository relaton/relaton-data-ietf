abstract:
- language: en
  script: Latn
  content: "<p>This document aims to explain the requirement and usecases for reducing
    gaps in first point of trusts during secure authentication/authorization of nodes
    without the need of any CA. It focuses on the use of network layer security approaches
    for this purpose. Privacy requirement is also one of the important topic that
    will be addressed in this draft.</p>"
