abstract:
- language: en
  script: Latn
  content: "<p>This document defines a logical network element YANG module. This module
    can be used to manage the logical resource partitioning that may be present on
    a network device. Examples of common industry terms for logical resource partitioning
    are Logical Systems or Logical Routers.</p>"
