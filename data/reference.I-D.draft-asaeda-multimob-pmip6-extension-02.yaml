abstract:
- language: en
  script: Latn
  content: "<p>This document describes Proxy Mobile IPv6 (PMIPv6) extensions to support
    IP multicast.  The Mobile Access Gateway (MAG) and the Local Mobility Anchor (LMA)
    are the mobility entities defined in the PMIPv6 protocol.  The proposed protocol
    extension provides; 1) a dedicated multicast tunnel (M-Tunnel) between LMA and
    MAG, and 2) local routing to deliver IP multicast packets for mobile nodes.  This
    document defines the roles of LMA and MAG to support IP multicast for the mobile
    nodes.</p>"
