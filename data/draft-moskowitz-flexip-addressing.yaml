- language: en
  script: Latn
  content: "<p>This memo proposes an unbounded Flexible Address Space (FAS), consisting
    of a publicly routable Global Address Part (GP) and a locally routable Local Address
    Part (LP). It expands GP and LP to provide address privacy and special LP formats.
    Use cases are also provided.</p>"
