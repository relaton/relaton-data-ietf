abstract:
- language: en
  script: Latn
  content: "<p>This framework describes a practical methodology for measuring end-
    to-end TCP Throughput in a managed IP network. The goal is to provide a better
    indication in regards to user experience. In this framework, TCP and IP parameters
    are specified and should be configured as recommended.</p>"
