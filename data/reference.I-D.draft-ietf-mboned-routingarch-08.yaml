abstract:
- language: en
  script: Latn
  content: "<p>The lack of up-to-date documentation on IP multicast routing protocols
    and procedures has caused a great deal of confusion. To clarify the situation,
    this memo describes the routing protocols and techniques currently (as of this
    writing) in use. This memo also Obsoletes and reclassifies to Historic a number
    of older multicast protocols.</p>"
