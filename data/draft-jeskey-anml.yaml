abstract:
- language: en
  script: Latn
  content: "<p>ANML (Agentic Notation Markup Language) is a machine-first markup\n   language for agent-to-agent and agent-to-service communication over\n   the internet.  HTML provides visual interfaces for human consumption;\n   ANML describes content, intent, and interaction patterns optimized\n   for machine interpretation with minimal computational overhead.\n\n   ANML defines an abstract data model that MAY be serialized as XML\n   (application/anml+xml) or JSON (application/anml+json).  Both\n   serializations are normative and semantically equivalent.  The XML\n   serialization is recommended for human authoring and review; the JSON\n   serialization is recommended for programmatic generation and agent-\n   pipeline consumption.\n\n   An ANML document defines:\n\n   *  Content: structured, semantic information for machine\n      interpretation\n\n   *  Interactions: operations bound to HTTP methods, endpoints, and\n      parameters\n\n   *  Knowledge: bidirectional information exchange between services and\n      agents\n\n   *  Constraints: disclosure, consent, and authorization rules that\n      agents MUST evaluate before sharing data\n\n   *  State: metadata identifying the current phase of a multi-step\n      interaction\n\n   *  Persona: advisory behavioral and tonal guidance for agent\n      responses\n\n   ANML standardizes these elements to enable deterministic, efficient\n   agent interactions with reduced reliance on inference over\n   unstructured data.</p>"
