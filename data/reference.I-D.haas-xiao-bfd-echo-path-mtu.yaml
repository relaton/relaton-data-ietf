abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extended application of the BFD Echo function
    for path MTU verification or detection, while preserving its original purpose
    for detecting forwarding failures.  This document defines a process to vary the
    length of some BFD Echo packets periodically to accomplish this Path MTU verification
    or detection.</p>"
