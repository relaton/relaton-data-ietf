abstract:
- language: en
  script: Latn
  content: "<p>This document extends the Discovery Proxy for Multicast DNS-Based Service
    Discovery specification. It describes a lightweight relay mechanism, a Discovery
    Relay, which allows Discovery Proxies to provide service on links to which the
    hosts on which they are running are not directly attached.</p>"
