abstract:
- language: en
  script: Latn
  content: "<p>This Internet Draft proposes and suggests updates to the Network News\n   Transfer protocol, or NNTP.  The NNTP powers Usenet, one of the\n   largest social media platforms in the world.  It is primarily used\n   for transferring text and binary posts.  The aim of these updates is\n   to improve efficiency between NNTP peers and NNTP clients.</p>"
