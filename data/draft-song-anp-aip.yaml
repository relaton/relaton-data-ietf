abstract:
- language: en
  script: Latn
  content: "<p>The Internet Protocol (IP, RFC 791) provides best-effort datagram\n   delivery between hosts identified by numeric addresses.  The Agent\n   Internet Protocol (AIP) provides best-effort datagram delivery\n   between autonomous AI agents identified by agent:// URIs -- human-\n   readable, capability-descriptive names.\n\n   AIP is designed to serve as the narrow waist of the Agent Network\n   Protocol (ANP) suite, occupying an architectural position analogous\n   to IP in the TCP/IP suite: a minimal common substrate through which\n   upper-layer protocols and link technologies interoperate without\n   direct coupling.\n\n   This document specifies the AIP message format, addressing model,\n   upper-layer protocol demultiplexing, TLV options, message processing\n   rules, error handling, and interfaces to adjacent protocol layers.\n   Name registration, distributed name resolution, and semantic\n   discovery are provided by a companion resolver service and are\n   outside the scope of this document.</p>"
