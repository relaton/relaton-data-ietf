abstract:
- language: en
  script: Latn
  content: "<p>The aim of this document is to describe a common practice with regard
    to the behavior of a node sending a Resource ReserVation Protocol (RSVP) Traffic
    Engineering (TE) Path Error message and to the behavior of a node receiving an
    RSVP Path Error message for a preempted Multi-Protocol Label Switching (MPLS)
    Traffic Engineering Label Switched Path (TE LSP).  This document does not define
    any new protocol extensions.</p>"
