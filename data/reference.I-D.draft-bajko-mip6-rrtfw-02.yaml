abstract:
- language: en
  script: Latn
  content: "<p>This document defines a slightly modified Return Routability Test (RRT)
    for MIPv6. The herein defined RRT mechanism is intended for CoA exchanges between
    the MN and the CN. Once the MN and CN find out their peers' valid addresses, an
    additional mechanism will be used to run connectivity checks to figure out which
    of the address pairs have connectivity and, if needed, open the required pinholes
    in the firewalls. The defined mechanism is intended to work with current firewalls
    without requiring any support from them. The document also addresses the use of
    UDP encapsulation to facilitate MIPv6 signaling between involved nodes.</p>"
