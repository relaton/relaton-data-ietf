abstract:
- language: en
  script: Latn
  content: "<p>This memo defines existing usage for the Virtual Subnet Selection (VSS)
    information option.  It is intended for use primarily by DHCP proxy clients in
    situations where VSS information needs to be passed to the DHCP server for proper
    address allocation to take place.  The option number currently in use is 221.
    \ This memo documents the current usage of the option in agreement with [8], which
    declares that any pre-existing usages of option numbers in the range 128 - 223
    should be documented and the working group will try to officially assign those
    numbers to those options.</p>"
