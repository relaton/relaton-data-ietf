abstract:
- language: en
  script: Latn
  content: "<p>This document describes the problem of control word negotiation mechanism
    specified in [RFC4447]. Based on the problem analysis, a message exchanging mechanism
    is introduced to solve this control word negotiation issue. This document is to
    update [RFC4447] control word negotiation mechanism.</p>"
