abstract:
- language: en
  script: Latn
  content: "<p>This document defines the AgentID Protocol, an open standard for\n   establishing, verifying, and managing the identity of autonomous AI\n   agents operating across the Internet.  As AI agents increasingly\n   interact with web services, APIs, and each other on behalf of humans\n   and organisations, the industry lacks a universal mechanism to\n   determine which agent is making a request, who is accountable for it,\n   and what it is permitted to do.\n\n   AgentID introduces the Agent Identity Token (AIT), a signed JWT\n   carrying agent identity, owner verification, capability, and\n   delegation chain claims.  The protocol defines agent registration,\n   owner verification levels, service-side access tiers, and transparent\n   delegation chains with scope attenuation.  It builds on existing\n   standards including OAuth 2.0, OpenID Connect, JSON Web Token (JWT),\n   and JSON Web Key (JWK), adapting them to the unique requirements of\n   non-human autonomous actors.</p>"
