abstract:
- language: en
  script: Latn
  content: "<p>The GMPLS controlled Ethernet Label Switching (GELS) work is extending
    GMPLS RSVP-TE to support the establishment of Ethernet LSPs.  Ethernet Connectivity
    Fault Management (CFM) specifies an adjunct OAM flow to check connectivity in
    Ethernet networks.  CFM can be also used with Ethernet LSPs for fault detection
    and triggering recovery mechanisms.  This memo specifies extensions of GMPLS RSVP-TE
    to support the setup of the associated CFM OAM entities for point-to- point Ethernet
    LSPs.</p>"
