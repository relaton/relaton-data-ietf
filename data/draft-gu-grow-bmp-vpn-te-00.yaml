abstract:
- language: en
  script: Latn
  content: |-
    <p>The BGP Monitoring Protocol (BMP) is designed to monitor BGP running
       status, such as BGP peer relationship establishment and termination
       and route updates.  This document provides a traffic engineering (TE)
       method in the VPN (Virtual Private Network) scenario using BMP.</p>
