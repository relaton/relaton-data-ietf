abstract:
- language: en
  script: Latn
  content: "<p>Some deployment models for Lemonade [LEMONADEPROFILE] may require a
    non-pass-through proxy to fit OMA requirements. The proxy sits between the client
    and the backend Lemonade server and executes commands on behalf of the client,
    and rewriting some of the responses. XENCRYPT introduces a new encrypted literal
    type that allows the backend Lemonade server to end-to-end encrypt sensitive data
    returned from the mail store, such as message bodies and headers.</p>"
