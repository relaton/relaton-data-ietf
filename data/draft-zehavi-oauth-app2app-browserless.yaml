abstract:
- language: en
  script: Latn
  content: "<p>This document describes a protocol allowing a _Client App_ to obtain
    an OAuth grant from an _Authorization Server's Native App_ using the [App2App]
    pattern, providing *native* app navigation user-experience (no web browser used),
    despite both apps belonging to different trust domains.</p>"
