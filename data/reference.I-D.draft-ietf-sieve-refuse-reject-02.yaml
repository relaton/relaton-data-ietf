abstract:
- language: en
  script: Latn
  content: <p>This memo defines the SIEVE mail filtering language (RFC &lt;&lt;3028bis&gt;&gt;)
    "reject" extension. A Joe-job is a spam run forged to appear as though it came
    from an innocent party, who is then generally flooded by the bounces, Message
    Disposition Notifications (MDNs) and messages with complaints. The original Sieve
    "reject" action defined in RFC 3028 required use of MDNs for rejecting messages,
    thus contributing to the flood of Joe-job spam to victims of Joe-jobs. This document
    updates definition of "reject" to require rejecting messages during the SMTP transaction
    (instead of accepting them and then sending MDNs back to the alleged sender) wherever
    possible, thereby reducing the problem.</p>
