abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Session Initiation Protocol (SIP) Control Package
    for BFCP-based conference moderation.  The control of Media Servers and their
    related resources in decomposed network architectures plays an important role
    in various Next Generation Networks.  This Control Package aims at adding BFCP
    functionality to conferences using the SIP Control Framework.</p>"
