abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses the use of synthetic sources (or 'active' probes)
    within the context of remote performance monitoring. It discusses the importance
    of developing an 'active' probe monitoring capability within the Internet. It
    develops a framework for synthetic sources in performance monitoring against the
    backdrop of previous and current, related work within the IETF.</p>"
