abstract:
- language: en
  script: Latn
  content: "<p>This document discusses principles and guidelines for assigning authorship
    in RFC documents, including guidelines for the use of software tools during document
    preparation, and for inclusion of material from other sourcess. An important focus
    is on authors' responsibility for the content. The document also discusses the
    related issues of acknowledgements, editors and contributors. The various RFC
    streams are expected to apply these guidelines, and possibly define their own
    variations, which will have priority.</p>"
