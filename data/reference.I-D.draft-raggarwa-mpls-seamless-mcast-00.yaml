abstract:
- language: en
  script: Latn
  content: <p>This document describes procedures for building "inter-area P2MP segmented
    service LSPs" by using BGP to stitch intra-area segments of P2MP service LSP.  The
    intra-area P2MP LSPs that are used to carry intra-area segments of P2MP service
    LSP may be signaled using P2MP RSVP-TE or P2MP LDP. The applications/services
    that use such an inter-area service LSP may be NGEN MVPN, VPLS multicast or Internet-
    multicast over MPLS.</p>
