abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to strengthen the Kerberos V5 reply key
    using keying material derived from TLS, by using a pre-authentication mechanism.
    \ The goals are to 1) allow clients to securely learn a realm's KDC X.509 certificate,
    2) distribute the X.509 trust anchors used by the KDC, and 3) make it possible
    for clients to use Kerberos V5 over TLS without having to validate the server
    certificates.</p>"
