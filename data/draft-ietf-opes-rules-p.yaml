abstract:
- language: en
  script: Latn
  content: "<p>P is a simple configuration language designed for specification of
    message processing instructions at application proxies. P can be used to instruct
    an intermediary how to manipulate the application message being proxied. Such
    instructions are needed in an Open Pluggable Edge Services (OPES) context.</p>"
