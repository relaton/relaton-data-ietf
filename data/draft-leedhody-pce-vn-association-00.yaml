abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to extend PCE association mechanism introduced
    by [PCE-Association] to further associate sets of LSPs with a higher-level structure
    such as a virtual network requested by clients or applications. This extended
    association mechanism can be used to facilitate virtual network control using
    PCE architecture.</p>"
