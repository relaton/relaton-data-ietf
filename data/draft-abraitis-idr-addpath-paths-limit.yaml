abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a BGP capability that complements the ADD-
    PATH Capability by indicating the maximum number of paths a BGP speaker can receive
    from a peer, optimizing the transmission of BGP routes by selectively relaying
    pertinent routes instead of the entire set.</p>"
