abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes UDP Speedy Transmission Protocol Secure
       (USTPS), an experimental transport built directly on UDP for low-
       latency and loss-tolerant applications.  USTPS provides authenticated
       encryption for DATA packets, readable plaintext control records
       authenticated by HMAC where applicable, binary UPACK DATA framing,
       selective retransmission, out-of-order acceptance, adaptive
       retransmission timeout, optional congestion control, and application-
       visible stream position metadata.  USTPS is intentionally unordered
       at the transport layer and is designed to avoid transport-level Head-
       of-Line blocking.</p>
