abstract:
- language: en
  script: Latn
  content: "<p>This document defines the IANA procedures for registering port number
    values for use with the various IETF transport protocols, including TCP, UDP,
    DCCP, and SCTP.  It provides clear procedures for the management of the port number
    registry, which is important for its long-term management.  It updates RFC2780
    by obsoleting Sections 8 and 9.1 of that RFC, and it updates the IANA allocation
    procedures for DCCP as defined in RFC4340.</p>"
