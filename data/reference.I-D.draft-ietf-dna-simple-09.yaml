  script: Latn
  content: "<p>Detecting Network Attachment allows hosts to assess if its existing
    addressing or routing configuration is valid for a newly connected network.  This
    document provides simple procedures for detecting network attachment in IPv6 hosts,
    and procedures for routers to support such services.</p>"
