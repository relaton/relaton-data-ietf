abstract:
- language: en
  script: Latn
  content: "<p>The Platform Security Architecture (PSA) is a set of hardware and firmware
    specifications, backed by reference implementations and a security certification
    program (PSA Certified). The security specifications have been published by Arm,
    while the certification program and reference implementations are the result of
    a collaborative effort by companies from multiple sectors, including evaluation
    laboratories, semiconductor IP and security consultancy. The main objective of
    the PSA initiative is to assist device manufacturers and chip makers in incorporating
    best-practice security measures into their products. Devices that are PSA compliant
    can produce attestation tokens as described in this memo, which are the basis
    for many different protocols, including secure provisioning and network access
    control. This document specifies the PSA attestation token structure and semantics.
    The PSA attestation token is a profiled Entity Attestation Token (EAT). This specification
    describes what claims are used in an attestation token generated by PSA compliant
    systems, how these claims get serialized to the wire, and how they are cryptographically
    protected. This document is produced through the Independent RFC Stream and was
    not subject to the IETF's approval process.</p>"
