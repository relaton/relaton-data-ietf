abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a session-layer mechanism addressing a
       requirement independently exhibited by emerging agentic communication
       systems: the need for recipients to determine the authorization type
       of the communicating party (a human-controlled credential or an AI
       provider instance) before or during interaction.

       The Authorization Type Attestation (ATA) protocol defines a
       transport-layer extension that carries this authorization type using
       existing hardware roots of trust (Secure Enclaves, FIDO2, TPM,
       Confidential Computing) and PKI infrastructure.

       ATA does not replace existing identity systems (mTLS, SPIFFE, OAuth
       2.1, FIDO2).  ATA does not verify content authorship or model
       behavior.  ATA provides a mechanism to carry authorization type at
       the session layer, composably with TLS, QUIC, MLS, MCP, and A2A.</p>
