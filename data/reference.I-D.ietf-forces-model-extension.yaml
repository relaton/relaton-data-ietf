abstract:
- language: en
  script: Latn
  content: "<p>This memo extends the Forwarding and Control Element Separation (ForCES)
    model defined in RFC 5812 and updates RFC5812 to allow complex datatypes for metadata,
    optional default values for datatypes, optional access types for structures.  It
    fixes an issue with Logical Functional Block (LFB) inheritance.  It also introduces
    two new features a new event condition BecomesEqualTo and LFB properties.  The
    changes introduced in this memo do not alter the protocol and retain backward
    compatibility with older LFB models.</p>"
