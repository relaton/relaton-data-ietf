abstract:
- language: en
  script: Latn
  content: "<p>This document extends the Resource-Oriented Lightweight Information
    Exchange (ROLIE) core by defining a new information-type to ROLIE's atom:category
    pertaining to security configuration checklists. Additional supporting requirements
    are also defined which describe the use of specific formats and link relations
    pertaining to the new information-type.</p>"
