abstract:
- language: en
  script: Latn
  content: "<p>Often endpoints are connected by multiple paths, but the nature of
    TCP/IP restricts communications to a single path per socket. Resource usage within
    the network would be more efficient were these multiple paths able to be used
    concurrently.  This should enhance user experience through higher throughput and
    improved resilience to network failure.  This document presents extensions to
    TCP in order to transparently provide this multi-path functionality at the transport
    layer, if at least one endpoint is multi-addressed.</p>"
