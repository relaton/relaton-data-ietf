abstract:
- language: en
  script: Latn
  content: "<p>When communicating over the Internet using the HTTP protocol, it is
    often desirable to be able to securely verify the sender of a message as well
    as ensure that the message was not tampered with during transit. This document
    describes a way to add origin authentication and message integrity to HTTP messages.</p>"
