abstract:
- language: en
  script: Latn
  content: "<p>This document defines a protocol and specification format that can
    be used by a client to discover how a Top Level Domain (TLD) is organized in terms
    of what subdomains are used to place closely related but independent domains,
    e.g. commercial domains in country code TLDs (ccTLD) like .uk are placed in the
    .co.uk subTLD domain. This information is then used to limit which domains an
    Internet service can set cookies for, strengthening the rules already defined
    by the cookie specifications.</p>"
