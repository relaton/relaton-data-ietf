abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Trusted Execution Environment Provisioning
    (TEEP) Protocol, which enables secure lifecycle management of Trusted Components
    in devices with a Trusted Execution Environment (TEE). The protocol defines message
    exchanges between a Trusted Application Manager (TAM) and a TEEP Agent to query
    device state, convey attestation evidence, and install, update, or delete Trusted
    Components. Messages are encoded in CBOR and secured using COSE.</p>"
  format: text/html
