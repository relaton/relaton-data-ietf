abstract:
- language: en
  script: Latn
  content: "<p>Automatic, simple identification of when traffic is crossing a perimeter
    is highly desirable for a variety of home network uses. This document proposes
    a set of default tests to be applied to traffic scheduled for forwarding, which
    can be used collectively to identify this perimeter in some (but not all) environments.</p>"
