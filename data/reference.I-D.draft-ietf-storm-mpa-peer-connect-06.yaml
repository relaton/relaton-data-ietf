abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC5043 and RFC5044 by extending MPA negotiation
    for RDMA connection establishment.  The first enhancement extends RFC5043, enabling
    peer-to-peer connection establishment over MPA/TCP.  The second enhancement extends
    both RFC5043 and RFC5044, by providing an option for standardized exchange of
    RDMA-layer connection configuration.</p>"
