abstract:
- language: en
  script: Latn
  content: "<p>This document describes the practice and implications of whitelisting
    DNS recursive resolvers in order to limit AAAA resource record responses (which
    contain IPv6 addresses) sent by authoritative DNS servers.  This is an IPv6 transition
    mechanism used by domains as a method for incrementally transitioning inbound
    traffic to a domain from IPv4 to IPv6 transport.  The audience for this document
    is the Internet community generally, particularly IPv6 implementers.</p>"
