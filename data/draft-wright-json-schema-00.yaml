abstract:
- language: en
  script: Latn
  content: |-
    <p>JSON Schema defines the media type "application/schema+json", a JSON
       based format for describing the structure of JSON data.  JSON Schema
       asserts what a JSON document must look like, ways to extract
       information from it, and how to interact with it, ideal for
       annotating existing JSON APIs that would not otherwise have
       hypermedia controls or be machine-readable.</p>
