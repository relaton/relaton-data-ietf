abstract:
- language: en
  script: Latn
  content: "<p>Currently, there does not exist a simple and dynamic mechanism for
    routers running IS-IS to learn about symbolic hostnames. This document defines
    a new TLV which allows the IS-IS routers to flood their name-to-systemID mapping
    information across the IS-IS network.  The intention of this document is to provide
    an update to [RFC 2763].</p>"
