abstract:
- language: en
  script: Latn
  content: "<p>This document describes a cryptographic transform which uses an indexed
    keystream generator (that generates a keystream segment given an index value)
    and a universal hash function to provide confidentiality, message authentication,
    and replay protection. This transform is efficient, provably secure, and is appropriate
    for network security.</p>"
