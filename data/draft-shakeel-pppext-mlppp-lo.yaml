title:
- language: en
  script: Latn
  content: "An Enhanced Multi-Link PPP with low overhead suitable for multiple\nscalable bandwidth links\n\n"
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-shakeel-pppext-mlppp-lo-00
