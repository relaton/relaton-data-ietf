abstract:
- language: en
  script: Latn
  content: "<p>This documents describes best current practices to manage securely
    BGP in a network. It will explain the basic policies ones should configure on
    BGP peerings to keep an healthy BGP table. This document will only focus on unicast
    and multicast tables (SAFI 1 and 2) for IPv4 and IPv6. Foreword A placeholder
    to list general observations about this document.</p>"
