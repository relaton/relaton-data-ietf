abstract:
- language: en
  script: Latn
  content: "<p>This document presents issues regarding the reliance of IPv6 Router
    Solicitation messages for creating or initializing router state necessary to enable
    IPv6 users' connectivity, particularly in situations where such users have bridged
    ethernet connectivity with the router. A number of alternative solution approaches
    are also presented and discussed.</p>"
