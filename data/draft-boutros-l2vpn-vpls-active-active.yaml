abstract:
- language: en
  script: Latn
  content: "<p>This document defines VPLS extensions to support per-flow load- balancing
    among multiple active attachment circuits connected to the same multi-homed site,
    fast convergence upon redundant link or node failure, flexible PE location, shortest-path
    routing, and policy support such as E-TREE.</p>"
