abstract:
- language: en
  script: Latn
  content: "<p>This document defines VPLS extensions to support per-flow load-\nbalancing among multiple active attachment circuits connected to the\nsame multi-homed site, fast convergence upon redundant link or node\nfailure, flexible PE location, shortest-path routing, and policy\nsupport such as E-TREE.</p>"
