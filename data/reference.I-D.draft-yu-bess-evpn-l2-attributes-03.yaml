abstract:
- language: en
  script: Latn
  content: "<p>This document adopts Layer 2 Attributes Extended Community defined
    in [RFC8214] to EVPN allowing signalling L2 information in control plane.  An
    interoperability mechanism of control word is described for EVPN and VPWS in this
    document.  Also flow label signalling mechanism is described for EVPN and VPWS.</p>"
