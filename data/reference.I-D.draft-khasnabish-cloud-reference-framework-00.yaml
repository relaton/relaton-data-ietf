abstract:
- language: en
  script: Latn
  content: "<p>During IETF 78 Clouds Bar BoF, it was observed that there is no standard
    reference framework for Cloud Services.  Based on the survey of Cloud-based systems
    and services (draft-Khasnabish-cloud-sdo- survey-00, draft-khasnabish-cloud-Industry-workitems-survey-00),
    intra-cloud and inter-cloud reference frameworks are developed and presented in
    this document.  The requirements of each layer are also identified and discussed.</p>"
