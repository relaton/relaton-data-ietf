abstract:
- language: en
  script: Latn
  content: "<p>This memo describes a proposal to enhance Dual-Stack lite (DS-lite)
    [I-D.ietf-softwire-dual-stack-lite] solution with an additional feature to ease
    interconnection between IPv4 and IPv6 realms.  When deployed, no dual-stack-enabled
    network is required for the delivery of both IPv4 and IPv6 connectivity to customers.
    \ IPv6 transfer capabilities are used for the transfer of IPv4-addressed datagrams
    in a completely stateless scheme between the interconnection segment and the DS-lite
    CGN node(s).  The proposed DS-lite extension is meant to encourage (if not accelerate)
    IPv6 deployment in networks.</p>"
