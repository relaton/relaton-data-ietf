abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines the EMILIA Eye advisory: a scope-bound
       statement that an authorization posture for a named scope has changed
       (designed to be signed and offline-verifiable; the signing layer is
       specified here but is not yet present in the reference
       implementation, see Section 13.6), carrying a scope-binding hash that
       prevents the advisory from being replayed or re-targeted to a
       different scope.  An Eye advisory expresses an observation-derived
       posture (clear, caution, elevated, or review_required) and a
       recommended action (none, log, step_up_auth, require_signoff, or
       escalate).  The central safety invariant of this document is
       normative: an advisory MUST NEVER be the sole gate on an action.  A
       signal may only TIGHTEN posture - it may cause an enforcement point
       to demand stronger authentication, human signoff, or escalation - but
       it can never itself constitute the authorization.  Eye warns; an
       enforcement point verifies; an accountable human owns the decision.

       This work specifies the verifiability, scope-binding, and fail-safe
       advisory semantics that signal-transport frameworks leave undefined.
       It is a COMPOSABLE PROFILE: Eye advisories are carried as Security
       Event Token [RFC8417] payloads and MAY be transported over the OpenID
       Shared Signals Framework with Continuous Access Evaluation Profile
       (CAEP) events.  It is complementary to, not a replacement for, SSF/
       CAEP (which define signal shape and transport, not verifiable bound
       fail-safe advisory semantics), and it composes with the EP
       authorization receipt ([I-D.schrock-ep-authorization-receipts]),
       which remains the artifact that actually authorizes an action.  This
       document is experimental.</p>
