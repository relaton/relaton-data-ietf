abstract:
- language: en
  script: Latn
  content: "<p>This document proposes extensions to the QUIC protocol to enable the
    usage of multiple paths over a single connection. Those changes remain compliant
    with the current single-path QUIC design. They allow devices to benefit from multiple
    network paths while preserving the privacy features of QUIC.</p>"
