abstract:
- language: en
  script: Latn
  content: "<p>This draft describes a YANG data model to manipulate the topologies
    of a layer 1 Optical Transport Network (OTN). It is independent of control plane
    protocols and captures topology related information pertaining to OTN and also
    enables manipulation of an OTN network via the I2RS interface.</p>"
