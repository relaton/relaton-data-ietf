abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the COGITATOR Witness Protocol -- a scheme\n   for producing cryptographically verifiable, tamper-evident records of\n   AI agent execution.  A conforming implementation produces a single\n   witness root value that any third party can independently recompute\n   from the same inputs to verify the record was not altered after the\n   fact.\n\n   The protocol is implementation-agnostic.  The reference\n   implementation is COGITATOR (Rust), but any language or framework can\n   produce conforming witness bundles.\n\n   This document also describes how the COGITATOR Witness Protocol\n   relates to the IETF SCITT architecture, with which it is designed to\n   be used as a payload inside SCITT Signed Statements.</p>"
