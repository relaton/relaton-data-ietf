abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an update to the Datagram Congestion Control
    Protocol (DCCP) transport protocol. It describes a method that adds support to
    assist traversal of firewalls, Network Address Translators and other middleboxes
    that require simultaneous packets to be sent from the client and server to establish
    middlebox state.</p>"
