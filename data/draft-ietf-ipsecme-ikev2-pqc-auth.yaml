id: draftietfipsecmeikev2pqcauth
schema_version: v1.5.6
formattedref:
  content: draft-ietf-ipsecme-ikev2-pqc-auth
title:
- language: en
  script: Latn
  content: Signature Authentication in the Internet Key Exchange Version 2 (IKEv2) using PQC
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-ipsecme-ikev2-pqc-auth-12
docidentifier:
- content: draft-ietf-ipsecme-ikev2-pqc-auth
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-08-20'
abstract:
- language: en
  script: Latn
  content: "<p>Signature-based authentication methods are utilized in the Internet\n   Key Exchange Version 2 (IKEv2).  The current version of the IKEv2\n   protocol, specified in RFC 7296, supports traditional digital\n   signatures.\n\n   This document specifies a generic mechanism for integrating post-\n   quantum cryptographic (PQC) digital signature algorithms into the\n   IKEv2 protocol.  The approach allows for seamless inclusion of any\n   PQC signature scheme within the existing authentication framework of\n   IKEv2.  Additionally, it outlines how Module-Lattice-Based Digital\n   Signatures (ML-DSA) and Stateless Hash-Based Digital Signatures (SLH-\n   DSA), can be employed as authentication methods within the IKEv2\n   protocol, as they have been standardized by US NIST.</p>"
