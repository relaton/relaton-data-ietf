abstract:
- language: en
  script: Latn
  content: "<p>The Kerberos 5 KRB_CRED message is used to transfer Kerberos credentials
    between applications.  When used with a secure transport the unencrypted form
    of the KRB_CRED message may be desirable.  This document describes the unencrypted
    form of the KRB_CRED message.</p>"
