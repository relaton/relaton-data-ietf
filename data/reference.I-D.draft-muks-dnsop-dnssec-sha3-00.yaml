abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to produce RSA/SHA3-256, RSA/SHA3-384,
    and RSA/SHA3-512 DNSKEY and RRSIG resource records for use in the Domain Name
    System Security Extensions ([RFC4033], [RFC4034], and [RFC4035]).  It also describes
    how to produce SHA3-256 and SHA3-384 DS digest types.</p>"
