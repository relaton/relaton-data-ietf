abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method by which a Service Provider may use\nan
    IEEE 802.1ah PBBN (Provider Backbone Bridge Network) to provide IP\nVirtual Private
    Network Service for its customers.  This method \nextends the BGP/MPLS IP VPN
    service to allow IP VPN service to be \noffered using a PBN instead.  This document
    specifies the way in \nwhich this is done.</p>"
