  script: Latn
  content: "<p>This document describes a header field, SIO-Label, for use in Internet
    Mail to convey the sensitivity of the message.  The SIO- Label header field which
    may carry a textual representation (a display marking) and/or a structural representation
    (a security label) of the sensitivity of the message.</p>"
