abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a vocabulary for expressing preferences
       regarding how digital assets are used by automated processing
       systems.  This vocabulary allows for the declaration of restrictions
       or permissions for use of digital assets by such systems.</p>
