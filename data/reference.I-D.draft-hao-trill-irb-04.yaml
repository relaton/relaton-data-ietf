abstract:
- language: en
  script: Latn
  content: "<p>Currently TRILL protocol can only provide optimal pair-wise data frame
    forwarding for layer 2 intra-subnet traffic, not for layer 3 inter-subnet traffic.
    Normally centralized gateway solution is used for layer 3 inter-subnet traffic
    forwarding. Centralized gateway solution has following issues:</p>"
