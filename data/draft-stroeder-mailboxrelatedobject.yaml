- language: en
  script: Latn
  content: "<p>This document defines the auxiliary object class 'mailboxRelatedObject'
    that can be used to associate an arbitrary object with an Internet mail address.
    Furthermore an attribute 'intlMailAddr' is defined for storing fully internationalized
    Internet mail addresses.</p>"
