abstract:
- language: en
  script: Latn
  content: |-
    <p>BMP statistics messages are used by the monitoring station to
       observe interesting events that occur on the router. Several BMP
       statistics types are defined in RFC 7854, this document lists some
       new statistics types to update RFC 7854 for growing BGP features.</p>
