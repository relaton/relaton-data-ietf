abstract:
- language: en
  script: Latn
  content: "<p>Specifies support for email address internationalization in RFC5280
    / X.509 certificates. This defines an encoding for Unicode email local-part characters
    in certificate Subject Alternative Names and Issuer Alternative rfc822Names. The
    encoding is backwards compatible with existing practices with rfc822Name.</p>"
