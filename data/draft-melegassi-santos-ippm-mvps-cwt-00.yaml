abstract:
- language: en
  script: Latn
  content: "<p>The Multi-Vantage Path Snapshot (MVPS) bundle format [I-D.melegassi-ippm-mvps-bundle]
    specifies a deterministic wire envelope but defers cryptographic binding of vantage
    reports. This document specifies the MVPS Trust Profile, named Coherent-Witness
    Trust (CWT), which closes that gap with minimal cryptographic overhead: HMAC-SHA256
    per-snapshot authentication under an epoch-bound vantage session key, anchored
    every epoch by an Ed25519-signed Operator Epoch Manifest, and cosigned by independent
    witnesses on a bundle Merkle checkpoint. The measured per-snapshot crypto cost
    is 2.1 us -- strictly less than the 4.2 us required to parse the JSON snapshot
    it protects. At N = 1000 vantages and 1 Hz tick, the total verification load is
    0.21 % of one CPU core. The profile inherits the full MVPS v4.0 theorem catalogue
    and proves two theorems not available in simpler per-snapshot signature designs:
    T-COAL-1 (multi-operator coalition resistance via witness independence) and T-SPLIT-1
    (collector split-view resistance via cosignature quorum). Numerical receipts are
    in evidence/mvps_cwt_overhead_receipt.json and scripts/validate_cwt_theorems.py
    (12/12 PASS). The design draws on two production precedents: the HMAC- personalized
    authentication of the Tesla vehicle-command protocol [TESLA-VEHICLE-CMD] and the
    witness-cosignature model of the Sigsum / tlog-witness ecosystem [C2SP-TLOG-WITNESS].
    Neither codebase is reused; constructs are independently composed for the multi-vantage
    measurement setting.</p>"
