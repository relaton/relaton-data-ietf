abstract:
- language: en
  script: Latn
  content: "<p>The Witnessed Execution Protocol (WEXP) Core defines carrier-neutral
    appraisal semantics for execution-related evidence. It defines four distinct content
    bases, two independent evidence qualifiers, the Boundary Ceiling, exact-claim
    support, deterministic accept, downgrade, and reject verdicts, composition without
    inflation, and a normalized interface between evidence-carrying profiles and appraisers.
    WEXP Core does not define a record serialization, signature envelope, action identifier,
    authorization model, or evidence-artifact schema. A companion Native Record profile
    can encode the normalized inputs defined here, and other carriers can do so without
    adopting that record format.</p>"
