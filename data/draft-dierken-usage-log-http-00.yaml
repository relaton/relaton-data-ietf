abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism by which an HTTP origin can\n   advertise an endpoint for downstream usage reporting and by which an\n   authenticated client operator can report usage of cached\n   representations that were used without issuing additional requests to\n   the origin.\n\n   The mechanism complements access-time response metadata by allowing a\n   client operator to report downstream usage associated with a prior\n   origin-served response context.  The protocol defines discovery of a\n   usage reporting endpoint, submission semantics, and a minimal record\n   format suitable for reconciliation and billing.\n\n   This specification does not define payment, settlement, or\n   enforcement mechanisms.  It defines a good-faith accounting protocol\n   for reporting downstream usage.</p>"
