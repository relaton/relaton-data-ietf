abstract:
- language: en
  script: Latn
  content: "<p>This document defines the HTTP Origin header.  The Origin header is
    added by the user agent to describe the security context that initiated an HTTP
    request.  HTTP servers can use the Origin header to defend themselves against
    Cross-Site Request Forgery (CSRF) attacks.</p>"
