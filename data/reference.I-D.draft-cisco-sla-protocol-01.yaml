abstract:
- language: en
  script: Latn
  content: "<p>Cisco's Service Level Assurance Protocol is a protocol that has been
    widely deployed.  The protocol is used to measure service level parameters such
    as network latency, delay variation, and packet/frame loss.  This draft describes
    the protocol.</p>"
