abstract:
- language: en
  script: Latn
  content: "<p>[5] specifies the EAP Re-authentication Protocol (ERP). This document
    specifies Diameter support for ERP. The EAP payload AVP defined in the Diameter
    EAP application specification [1] is used for encapsulating the EAP Initiate and
    Finish messages specified in [5]. This document specifies attributes for the request
    and delivery of Domain Specific Root Keys from the AAA/EAP server to the ER Server.
    Additionally, this document also specifies Diameter message processing rules relevant
    to ERP.</p>"
