abstract:
- language: en
  script: Latn
  content: <p>This Internet Draft describes a new well-known BGP community, LAST_RESORT.  This
    community provides a simple and easily deployable solution to BGP "wedgies".  Initial
    deployment is expected to be achieved by voluntary use in the network operator
    community-at-large.  Long-term adoption via software enforcement of the well-known
    aspect of the community, will improve global behavior, and simplify router configurations.Author's
    Note  This Internet Draft is intended to result in this draft or a related draft(s)
    being placed on the Standards Track for idr.</p>
