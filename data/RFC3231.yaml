abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes a set of managed objects that are used to schedule management operations
    periodically or at specified dates and times. [STANDARDS-TRACK]</p>"
