abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a data model for synchronising email data with
    a server using JMAP (the JSON Meta Application Protocol). Clients can use this
    to efficiently search, access, organise and send messages, and get pushed notifications
    for fast resynchronisation when new messages are delivered or a change is made
    in another client.</p>"
