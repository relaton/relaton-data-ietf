abstract:
- language: en
  script: Latn
  content: "<p>It is noticed that within a data center, unique traffic pattern and
    performance goals for the transport layer exist, as compared to things on the
    Internet.  This draft discusses the usecase for applying transport API from the
    perspective of an application running in a data center environment, and proposes
    potential requirements for such API design.</p>"
