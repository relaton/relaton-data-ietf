abstract:
- language: en
  script: Latn
  content: "<p>This document provides recommendations for improving the security of
    the Network News Transfer Protocol (NNTP) when using Transport Layer Security
    (TLS).  It modernizes the NNTP usage of TLS to be consistent with TLS best current
    practices.  If approved, this document updates RFC 4642.</p>"
