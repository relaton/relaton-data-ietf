abstract:
- language: en
  script: Latn
  content: "<p>This document defines a proposed solution for defining, negotiating
    and exchanging info-event notifications in INFO messages, within SIP invite-created
    dialogs, for applications which need to exchange session-related information inside
    the invite-created dialog.  This draft addresses issues and open items from RFC
    2976, and updates it.  Kaplan  Expires May 8, 2007  [page 1]  SIP INFO Events
    Framework  November 2007</p>"
