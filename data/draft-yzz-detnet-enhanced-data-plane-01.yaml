abstract:
- language: en
  script: Latn
  content: "<p>Aiming at providing the bounded latency to DetNet services, DetNet
    data plane is required to be enhanced. This document provides a method to extend
    DetNet data plane by introducing the Bounded Latency Information (BLI), which
    facilitates DetNet transit nodes to guarantee the bounded latency transmission
    in data plane.</p>"
