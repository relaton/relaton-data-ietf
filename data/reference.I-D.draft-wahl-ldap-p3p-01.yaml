abstract:
- language: en
  script: Latn
  content: "<p>This document defines attributes that can be retrieved via Lightweight
    Directory Access Protocol version 3 (LDAP) requests, which contain URIs pointing
    to the privacy policy documents. These documents describe the privacy policy concerning
    access to a directory server, and the privacy policies that apply to the contents
    of the directory (a subtree of entries).</p>"
