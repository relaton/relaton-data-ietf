abstract:
- language: en
  script: Latn
  content: "<p>This document discusses about different IPv6 migrating solutions for
    each part of the Large-scale broadband network with layer 2 access infrastructure.
    \ They are based on the requirements of providing existing broadband services
    in v4v6-coexisting or IPv6-only scenarios.  The document provides analysis of
    different solutions and also describes the suitable scenarios that each solution
    may be deployed in.</p>"
