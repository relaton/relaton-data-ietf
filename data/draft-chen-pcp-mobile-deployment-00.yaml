- language: en
  script: Latn
  content: "<p>This memo provided two cases study, when PCP is deployed in mobile
    network. Some motivation of deployment PCP in mobile network was described and
    justification for each deployment case was stated. Corresponding to each mode,
    the document discussed some features to address operational issues. That might
    potentially cause some extension on PCP protocol level.</p>"
