abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an experimental portion of the Management Information
    Base (MIB) for use with network management protocols in the Internet Community.
    In particular, it defines objects used for the management of Dynamic Host Configuration
    Protocol for IPv4 (DHCPv4) and Bootstrap Protocol (BOOTP) servers.</p>"
