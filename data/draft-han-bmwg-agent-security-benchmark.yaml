abstract:
- language: en
  script: Latn
  content: "<p>This document defines a security evaluation benchmark framework for
    AI agents. It is divided into two parts: evaluation metrics and evaluation methodology,
    comprising four first-level evaluation dimensions and 55 second-level metrics,
    as well as a comprehensive evaluation methodology system covering all scenarios,
    including static evaluation, dynamic evaluation, attack-defense evaluation, compliance
    evaluation, and quantitative evaluation. It aims to assess the risk profile of
    AI agents throughout their entire lifecycle, including perception risks, memory
    risks, decision-making risks, and execution risks.</p>"
