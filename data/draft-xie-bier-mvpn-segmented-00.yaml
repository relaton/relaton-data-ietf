abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an alternative of the control plane and data
    plane procedures that allow segmented MVPN using BIER. This allows the use of
    a more efficient explicit-tracking as the BIER overlay, with a slight change in
    the forwarding procedure of a segmentation point BFR by a lookup of the IP header.
    This document updates [I-D.ietf-bier-mvpn].</p>"
