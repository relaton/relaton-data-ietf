abstract:
- language: en
  script: Latn
  content: "<p>As DOTS is used for DDoS Mitigation signaling, in practice, there are
    different deployment scenarios for DOTS agents deployment depending on the network
    deployment mode. This document made an recommandation for DOTS Server deployment,
    include ISP and enterprise deployment scenarios. The goal is to provide some guidance
    for DOTS agents deployment.</p>"
