abstract:
- language: en
  script: Latn
  content: "<p>A Point-to-Multipoint (P2MP) tree in a Segment Routing (SR) domain
    carries traffic from a Root to a set of Leaves. This document specifies extensions
    to BGP encodings and procedures for P2MP trees and Ingress Replication used in
    BGP/MPLS IP VPNs and Ethernet VPNs (EVPNs) in an SR domain. This document updates
    RFCs 6514 and 7988.</p>"
