abstract:
- language: en
  script: Latn
  content: "<p>This document defines three hybrid key agreement mechanisms for TLS
    1.3 -- X25519MLKEM768, SecP256r1MLKEM768, and SecP384r1MLKEM1024 -- that combine
    the post-quantum ML-KEM (Module-Lattice-Based Key Encapsulation Mechanism) with
    an ECDHE (Ephemeral Elliptic Curve Diffie-Hellman) exchange.</p>"
