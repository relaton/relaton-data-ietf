abstract:
- language: en
  script: Latn
  content: "<p>Encrypted ClientHello (ECH) key pairs need to be configured into TLS
    servers, which can be built using different TLS libraries.  This document specifies
    a standard file format for this purpose, similar to how RFC 7468 defines other
    Privacy-Enhanced Mail (PEM) file formats.</p>"
