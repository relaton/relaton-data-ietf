abstract:
- language: en
  script: Latn
  content: "<p>The initial core schema for the System for Cross-domain Identity Management
    (SCIM) was designed for provisioning users.  This memo specifies schema extensions
    that enable provisioning of devices using various underlying bootstrapping systems
    such as Wi-Fi Easy Connect, FIDO device onboarding vouchers, Bluetooth Low Energy
    (BLE) passcodes, and MAC Authenticated Bypass (MAB).</p>"
