abstract:
- language: en
  script: Latn
  content: "<p>Existing traffic-engineering-related link attribute advertisements
    have been defined and are used in RSVP-TE deployments. Since the original RSVP-TE
    use case was defined, additional applications such as Segment Routing (SR) Policy
    and Loop-Free Alternates (LFAs) that also make use of the link attribute advertisements
    have been defined. In cases where multiple applications wish to make use of these
    link attributes, the current advertisements do not support application-specific
    values for a given attribute, nor do they support indication of which applications
    are using the advertised value for a given link. This document introduces link
    attribute advertisements in OSPFv2 and OSPFv3 that address both of these shortcomings.</p><p>This
    document obsoletes RFC 8920.</p>"
