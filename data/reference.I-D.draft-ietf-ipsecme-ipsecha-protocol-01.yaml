abstract:
- language: en
  script: Latn
  content: '<p>IKEv2 and IPsec protocols are widely used for deploying VPN.  In order
    to make such VPN highly available, more scalable and failure- prone, these VPNs
    are implemented as IKEv2/IPsec Highly Available (HA) cluster.  But there are many
    issues in IKEv2/IPsec HA cluster. The draft "IPsec Cluster Problem Statement"
    enumerates all the issues encountered in IKEv2/IPsec HA cluster environment.  This
    document proposes an extension to IKEv2 protocol to solve main issues of "IPsec
    Cluster Problem Statement" in Hot Standby cluster and gives implementation advice
    for other issues.  The main issues to be solved are: o  IKEv2 Message Id synchronization
    : This is done by syncing up  expected send and receive message Id values with
    the peer and  updating the values at the newly active cluster member after the  failover.
    o  IPsec Replay Counter synchronization : This is done by syncing up  bumped up
    outgoing SA replay counters values with peer and  updating the values at the newly
    active cluster member after the  failover.</p>'
