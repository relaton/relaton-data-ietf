abstract:
- language: en
  script: Latn
  content: <p>This document describes a simple hop-by-hop fragmentation scheme for
    ICN and mappings to the CCNx 1.0 and NDN packet formats, called "begin-end fragmentation".
    This scheme may be used at Layer 3 when ICN packets are used natively over a Layer
    2 media which does not reorder packets.</p>
