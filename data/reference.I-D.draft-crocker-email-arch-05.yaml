abstract:
- language: en
  script: Latn
  content: "<p>Over its thirty-five year history Internet Mail has undergone significant
    changes in scale and complexity, as it has become a global infrastructure service.
    The first standardized architecture for networked email specified a simple split
    between the user world, in the form of Mail User Agents (MUA), and the transmission
    world, in the form of the Mail Handling Service (MHS) composed of Mail Transfer
    Agents (MTA). Core aspects of the service, such as mailbox address and basic message
    format style, have remained remarkably constant. However today Internet Mail is
    marked by many independent operators, many different components for providing
    users service and many others for performing message transfer. Public discussion
    of the architecture has not kept pace with the real-world technical and operational
    refinements. This document offers an enhanced Internet Mail architecture to reflect
    the current service.</p>"
