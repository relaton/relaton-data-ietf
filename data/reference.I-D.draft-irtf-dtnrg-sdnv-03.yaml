abstract:
- language: en
  script: Latn
  content: "<p>Self-Delimiting Numeric Values (SDNVs) have recently been introduced
    as a field type in proposed Delay-Tolerant Networking protocols. SDNVs encode
    an arbitrary-length non-negative integer with minimum wire-overhead.  They are
    intended to provide protocol flexibility without sacrificing economy, and to assist
    in future-proofing protocols under development.  This document describes formats
    and algorithms for SDNV encoding and decoding, along with notes on implementation
    and usage.</p>"
