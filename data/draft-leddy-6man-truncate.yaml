abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines IPv6 packet truncation procedures.  These
       procedures make Path MTU Discovery (PMTUD) more reliable.  Upper-
       layer protocols can leverage these procedures in order to take
       advantage of large MTUs.</p>
