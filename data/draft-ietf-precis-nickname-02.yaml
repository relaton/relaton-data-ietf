- language: en
  script: Latn
  content: "<p>This document describes how to prepare and compare Unicode strings
    representing nicknames, primarily as used within textual chatrooms. This profile
    is intended to be used by chatroom technologies based on both the Message Session
    Relay Protocol (MSRP) and the Extensible Messaging and Presence Protocol (XMPP).</p>"
