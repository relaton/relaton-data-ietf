abstract:
- language: en
  script: Latn
  content: "<p>In DS-Lite, the tunnel is stateless, not associated with any state
    information, and no failure detection and failover mechanism is available. This
    makes it difficult to manage and diagnose if there is a problem. This draft analyzes
    the applicability of some of the possible solutions.</p>"
