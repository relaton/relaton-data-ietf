abstract:
- language: en
  script: Latn
  content: "<p>This specification defines mechanisms by which a Session Initiation
    Protocol (SIP) user agent can convey its capabilities and characteristics to other
    user agents and to the registrar for its domain.  This information is conveyed
    as parameters of the Contact header field.  [STANDARDS-TRACK]</p>"
