abstract:
- language: en
  script: Latn
  content: "<p>This draft discusses the problem of simultaneous optimized routing
    and correspondent node-targeted location privacy for Mobile IPv6 and proposes
    a solution. The solution utilizes the MIPv6 bootstrapping mechanisms and requires
    no new network entities and no changes to home agent or correspondent node.</p>"
