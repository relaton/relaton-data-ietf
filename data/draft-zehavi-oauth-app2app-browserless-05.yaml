- language: en
  script: Latn
  content: "<p>This document describes a protocol allowing a _Client App_ to obtain
    an OAuth grant from a _Native App_ using the [App2App] pattern, providing *native*
    app navigation user-experience (no web browser required), despite both apps residing
    on different trust domains.</p>"
