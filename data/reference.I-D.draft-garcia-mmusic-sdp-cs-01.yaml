abstract:
- language: en
  script: Latn
  content: "<p>This memo describes use cases, requirements, and protocol conventions
    for using the Session Description Protocol (SDP) Offer/Answer model for establishing
    circuit-switched bearer connections in the Public Switched Telephone Network (PSTN).
    \ Additionally, this memo proposes conventions for using SDP and the SDP capability
    negotiation framework for expressing those circuit-switched bearer connections
    as alternatives to packet-switched streams.</p>"
