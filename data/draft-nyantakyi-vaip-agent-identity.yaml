abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Vorim Agent Identity Protocol (VAIP), a\n   standard for establishing verifiable cryptographic identity, fine-\n   grained permissions, trust scoring, and tamper-evident audit trails\n   for autonomous AI agents.\n\n   As AI agents increasingly perform actions autonomously in enterprise\n   systems, existing identity protocols designed for human users or\n   static services are insufficient.  VAIP addresses this gap by\n   providing cryptographic primitives and data structures for issuing,\n   verifying, and managing agent identities in multi-tenant\n   environments.\n\n   The protocol uses Ed25519 for agent identity, SHA-256 for audit\n   integrity, and defines seven hierarchical permission scopes with\n   time-bounded grants and rate limiting.</p>"
