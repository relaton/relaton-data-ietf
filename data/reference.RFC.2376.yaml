abstract:
- language: en
  script: Latn
  content: "<p>This document proposes two new media subtypes, text/xml and application/xml,
    for use in exchanging network entities which are conforming Extensible Markup
    Language (XML).  This memo provides information for the Internet community.  It
    does not specify an Internet standard of any kind.</p>"
