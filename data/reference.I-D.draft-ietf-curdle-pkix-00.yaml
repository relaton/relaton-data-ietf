abstract:
- language: en
  script: Latn
  content: <p>This document specify algorithm identifiers and ASN.1 encoding formats
    for EdDSA digital signatures, subject public keys, and a "named curve" object
    identifier, used in the Internet X.509 Public Key Infrastructure.  Parameters
    for Ed25519, Ed25519ph, Ed448, Ed448ph, Curve25519 and Curve448 are defined.</p>
