- language: en
  script: Latn
  content: "<p>This document clarifies the use of 'client identifier' option by the\nclients
    and servers as mentioned in [RFC2131]. The clarification \naddresses the issue
    arising out of the point specified by [RFC2131]\nthat the server 'MUST NOT' return
    client identifier' option to the\nclient.</p>"
