- language: en
  script: Latn
  content: "<p>This document describes a method by which the owners/administrators
    of a specific domain name can declare other domain names, which are not subdomains
    of the primary domain but are used by the owners/ administrators of the primary
    domain, as trusted by using TXT records in the DNS zone of the primary domain.</p>"
