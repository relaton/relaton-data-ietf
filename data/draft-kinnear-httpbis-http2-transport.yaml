abstract:
- language: en
  script: Latn
  content: "<p>HTTP/2 provides multiplexing of HTTP requests over a single underlying
    transport connection. HTTP/2 Transport defines the use of the bidirectional extended
    CONNECT handshake to negotiate the use of application protocols using streams
    of an HTTP/2 connection as transport.</p>"
