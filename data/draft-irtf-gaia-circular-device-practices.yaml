abstract:
- language: en
  script: Latn
  content: "<p>This document systematizes operational practices observed across\n   multiple community-centred deployments that aim to improve meaningful\n   connectivity and community digital autonomy through the circular\n   management of end-user and network devices.  It is published as an\n   Informational RFC on the IRTF stream and does not define Internet\n   standards or protocol requirements.\n\n   The document addresses a foundational but often overlooked dependency\n   of Internet connectivity deployments: the availability,\n   repairability, governance, sharing, reuse, and lifecycle management\n   of network and end-user devices required for meaningful participation\n   in the Internet.  Based on operational experience from deployments in\n   Spain, Argentina, and Senegal, this document describes practices that\n   have demonstrated positive outcomes for connectivity, social\n   inclusion and community capacity, and environmental sustainability.\n\n   These practices are presented as descriptive guidance derived from\n   operational experience rather than as normative requirements.  They\n   complement research within the IRTF GAIA Research Group by\n   documenting reproducible approaches that improve the sustainability,\n   autonomy, and long-term viability of community connectivity\n   infrastructure and meaningful participation in underserved contexts.</p>"
