abstract:
- language: en
  script: Latn
  content: "<p>IP Mobility along with RSVP makes my head hurt. Trying to guess the
    benefits (if any) of a proposed context transfer protocol is even more difficult
    to judge. This draft tries to make sense of some subset of the possible permutations
    in a possibly vain attempt have an overview of the problem space.</p>"
