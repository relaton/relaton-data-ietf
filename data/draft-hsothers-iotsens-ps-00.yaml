abstract:
- language: en
  script: Latn
  content: "<p>The document attempts to establish hardware based Internet of Things
    authentication as a future networking area beyond 5G going into 6G for standardization.
    The problem of hardware authentication is discussed and its relationship with
    Wireless Local Area network collaborative and/or multi-band sensing is established
    and then recent research efforts in the area are indicated.</p>"
