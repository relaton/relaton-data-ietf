abstract:
- language: en
  script: Latn
  content: "<p>MoE (Mixture-of-Experts) has been adopted in scale-up GPU connections
    by the mainstream Large Language Models, such as Llama4, Mixtral, and DeepSeekV3.
    This document focuses on the AI multicast protocol evolution for MoE in scale-up
    scenarios, analyzing the challenges and proposing potential protocol evolutions.</p>"
