abstract:
- language: en
  script: Latn
  content: "<p>This document defines the inference_root claim as a companion to the\n   actor_chain claim ({{!I-D.draft-mw-spice-actor-chain}}) and the\n   intent_root claim ({{!I-D.draft-mw-spice-intent-chain}}).  While the\n   actor chain addresses delegation provenance (WHO) and the intent\n   chain addresses content provenance (WHAT), the inference chain\n   addresses computational provenance (HOW) — providing cryptographic\n   proof that a claimed AI model actually performed the inference that\n   produced a given output.\n\n   The inference chain leverages two complementary mechanisms: Zero-\n   Knowledge Machine Learning (ZKML) proofs for mathematical certainty,\n   and Trusted Execution Environment (TEE) attestation quotes for\n   production-scale AI workloads.  The full inference chain is stored as\n   ordered logs, with only the Merkle root included in the OAuth token\n   for efficiency.\n\n   Together, the three chains — actor, intent, and inference — form a\n   complete \"Truth Stack\" for autonomous AI agent governance.</p>"
