abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses the steps required to bring a large number of devices
    into service in IP networks in an automated fashion. The goal of this document
    is to list known solutions where they exist, to point out approaches proven to
    be problematic, and to identify gaps that require further specifications.</p>"
