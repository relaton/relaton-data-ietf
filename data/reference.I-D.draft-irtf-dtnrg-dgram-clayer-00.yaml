abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the preferred method for transporting DTN protocol
    data over the Internet using datagrams.  The specification covers convergence
    layers for the Bundle Protocol as well as the transportation of LTP segments.
    \ UDP and DCCP are the candidate datagram protocols discussed.  UDP can only be
    used on a local network, or in cases where the DTN node implements explicit congestion
    control.  DCCP does address the congestion control problem; however, the availability
    of implementations is limited.</p>"
