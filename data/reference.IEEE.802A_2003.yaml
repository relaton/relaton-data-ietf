  script: Latn
  content: '<p>IEEE Std 802-2001, IEEE Local and Metropolitan Area Networks: Overview
    and Architecture, provides an overview to the family of IEEE 802 Standards. This
    amendment to IEEE Std 802 identifies a set of Ethertypes that may be used for
    prototype and vendor specific use, and defines how the ethertypes should be used.
