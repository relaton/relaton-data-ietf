abstract:
- language: en
  script: Latn
  content: <p>This document describes a Prefix Delegation Mechanism which delegates
    IPv6 prefixes to a subscriber's network (or "site") by an Internet Service Provider
    (ISP). It uses ICMPv6 messages to handle Prefix Delegation between the Delegating
    Router and the Requesting Router.</p>
