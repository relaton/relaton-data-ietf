- language: en
  script: Latn
  content: "<p>This document describes services, architectures, and protocols for
    existing pre-SPIRITS implementations of arrangements through which PSTN services
    can request Internet applications. The services and architecture presented was
    outlined by Telia and then evolved and implemented by Telia in co-operation with
    Nortel Networks.</p>"
