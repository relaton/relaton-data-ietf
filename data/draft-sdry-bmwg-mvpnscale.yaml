abstract:
- language: en
  script: Latn
  content: "<p>Multicast VPN (MVPN) is a service deployed by VPN service providers
    \n   to enable their customers to use IP multicast applications over VPNs. \n
    \  With the increased popularity the scalability of deploying such a \n   service
    is becoming of a great interest. This document defines \n   standard metric and
    test methodology for characterizing and comparing \n   control plane MVPN scalability
    of Provider Edge (PE) devices that \n   implement MVPN service.</p>"
