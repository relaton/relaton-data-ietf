abstract:
- language: en
  script: Latn
  content: "<p>There has been a lot of discussion and analysis of how Mobile IPv6
    and Proxy Mobile IPv6 can interact. A deeper analysis on the possible scenarios
    and related issues is necessary in order to provide guidelines to PMIPv6 protocol
    specification. With this purpose in mind, this document describes all scenarios
    of possible interactions between Mobile IPv6 and Proxy Mobile IPv6 and discusses
    a list of issues related to the each scenario.</p>"
