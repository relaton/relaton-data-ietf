abstract:
- language: en
  script: Latn
  content: |-
    <p>This document updates RFC 8138 by defining a bit in the RPL DODAG
       Configuration Option to indicate whether compression is used within
       the RPL Instance, and specify the behavior of RFC 8138-capable nodes
       when the bit is set and reset.</p>
