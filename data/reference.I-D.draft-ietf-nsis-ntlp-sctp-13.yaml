abstract:
- language: en
  script: Latn
  content: "<p>The General Internet Signaling Transport (GIST) protocol currently
    uses TCP or Transport Layer Security (TLS) over TCP for connection mode operation.
    \ This document describes the usage of GIST over the Stream Control Transmission
    Protocol (SCTP) and Datagram Transport Layer Security (DTLS).  It discusses how
    the use of SCTP can take advantage of features provided by SCTP, as well as how
    to establish GIST security over datagram transport protocols with DTLS.</p>"
