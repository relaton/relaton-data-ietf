abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a packet transmission rate metric for parent
    selection.  This metric represents the amount of traffic that the node is transmitting
    to the current parent node.  This document also proposes an Objective Function
    (OF) using the packet transmission rate metric for parent selection in order to
    balance the amount of traffic between nodes.</p>"
