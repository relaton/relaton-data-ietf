abstract:
- language: en
  script: Latn
  content: "<p>This document defines a protocol for real-time interactive communication
    between users and AI agents over Media over QUIC Transport (MOQT). It specifies
    how streaming inference outputs (ASR transcripts, LLM tokens, TTS audio) map to
    the MOQT object model, defines a turn-taking control protocol with barge-in support
    for voice interactions, and establishes track structure conventions for live agent
    sessions. The protocol operates as an application-layer profile on top of MOQT
    without modifying transport semantics.</p>"
