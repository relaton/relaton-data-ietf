abstract:
- language: en
  script: Latn
  content: "<p>This document reserves IPv4 and IPv6 multicast addresses for use in
    documentation, RFCs etc.  Some multicast addresses are derived from AS numbers
    or unicast addresses.  This document also explains how these can be used for documentation
    purposes by deriving them from AS numbers and unicast addresses that are reserved
    for such purposes.</p>"
