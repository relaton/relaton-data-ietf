abstract:
- language: en
  script: Latn
  content: "<p>A framework for the exchange of capabilities in HELD is described.
    A device is able to use this framework to notify a LIS of its location determination
    or location measurement capabilities. A method based on this framework where the
    LIS can use the location determination capability of the device is described.
    Guidelines for diverse location measurement technologies are included.</p>"
