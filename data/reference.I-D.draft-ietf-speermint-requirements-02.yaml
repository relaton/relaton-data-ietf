abstract:
- language: en
  script: Latn
  content: "<p>This memo defines Best Current Practices for session peering between
    SIP Service Providers for voice or other types of multimedia traffic exchanges.
    In its current state, this document describes high-level guidelines and general
    requirements for session peering for multimedia interconnect . It also defines
    a minimum set of requirements applicable to session peering for voice over IP,
    presence and instant messaging interconnects. It is intended to become best current
    practices based on the use cases discussed in the SPEERMINT working group.</p>"
