abstract:
- language: en
  script: Latn
  content: "<p>The memo has recommended to deploy Link-Local Multicast Name Resolution
    (LLMNR) in PCP scenarios. Depending on that, it could not only avoid adherence
    to DNS during PCP server name resolving, but also company with PCP FQDN DHCP options
    extension to accomplish PCP server discovery.  In order to fit LLMNR into PCP
    network, particular LLMNR deployment guides and relevant configurations are considerated
    along with PCP elements installation.</p>"
