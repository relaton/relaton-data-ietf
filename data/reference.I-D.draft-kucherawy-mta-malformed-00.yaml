abstract:
- language: en
  script: Latn
  content: "<p>The email ecosystem has long had a very permissive set of common processing
    rules in place despite increasingly rigid standards governing its components,
    ostensibly to improve the user experience. These come at some cost, and various
    components are faced with decisions about whether or not to permit non-conforming
    messages to continue toward their destinations unaltered, adjust them to conform
    (possibly at the cost of losing some of the original message), or outright rejecting
    them.  This memo includes a collection of the best current practices in a variety
    of such situations, to be used as implementation guidance.</p>"
