- language: en
  script: Latn
  content: "<p>This document specifies the ftp: Uniform Resource Identifier (URI)
    scheme that was originally specified in RFC 1738. The purpose of this document
    is to allow RFC 1738 to be moved to historic while keeping the information about
    the scheme on standards track.</p>"
