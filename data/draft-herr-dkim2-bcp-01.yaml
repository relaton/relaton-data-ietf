abstract:
- language: en
  script: Latn
  content: "<p>[DKIM2] and associated documents describe the DomainKeys Identified\n   Mail v2 (DKIM2) email authentication protocol.  DKIM2 is designed to\n   address shortcomings in email authentication protocols and mechanisms\n   released prior to DKIM2, specifically SPF [RFC7208], DKIM [RFC6376],\n   DMARC [RFC7489], and ARC [RFC8617].  Those shortcomings most commonly\n   manifested themselves in email messages that passed through one or\n   more intermediary hosts (e.g., forwarders or mailing list servers)\n   while transiting from origination to final destination.  Although\n   these messages were properly authenticated when sent, the alteration\n   of their path and/or content by the intermediary hosts would cause\n   authentication checks to fail at the final destination.  In addition,\n   DKIM was susceptible to \"replay\" of signatures, when attackers would\n   construct abusive messages in such a way that they would pass\n   validation checks for a DKIM signature that had been imported from\n   another message entirely.\n\n   To address these shortcomings, DKIM2 provides methods not only for\n   intermediary systems to provide details of the changes that they make\n   to a message in transit, but also for receiving hosts to validate\n   those changes in addition to the original message.  DKIM2 also allows\n   recipients to detect when messages have been unexpectedly \"replayed\"\n   and can also ensure that delivery status notifications (DSNs) are\n   only sent to entities that were involved in the transmission of a\n   message.\n\n   This document describes the recommended usage of the DKIM2 protocol\n   for sending hosts, intermediary hosts, and receiving hosts.</p>"
