abstract:
- language: en
  script: Latn
  content: "<p>This problem statement describes barriers to the use of Internet Protocols
    for highly scalable, high bandwidth, low latency transfers necessary in some of
    today's important applications, particularly applications found within data centers.
    In addition to describing technical reasons for the problems, it gives an overview
    of common non-IP solutions to these problems which have been deployed over the
    years.</p>"
