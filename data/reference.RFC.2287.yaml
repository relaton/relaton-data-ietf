abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes a basic set of managed objects for fault, configuration and performance
    management of applications from a systems perspective.  [STANDARDS-TRACK]</p>"
