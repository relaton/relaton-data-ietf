abstract:
- language: en
  script: Latn
  content: "<p>Currently, Internet SMTP transport does not allow the sender to know
    if the recipient receive or open a mail message. This limitation frequently causes
    one question: did my message really arrive? This proposes a simple solution, that
    could be easy implemented in the mail software.</p>"
