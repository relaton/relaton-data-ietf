abstract:
- language: en
  script: Latn
  content: "<p>Extended Service Description (ESRV) records are DNS Resource Records
    that provide information to applications attempting to establish a network connection.
    \ When authenticated using an appropriate means ESRV records may be used to prevent
    a downgrade attack in cases where use of security enhancements with an application
    protocol are optional.</p>"
