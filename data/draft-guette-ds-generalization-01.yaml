abstract:
- language: en
  script: Latn
  content: "<p>This document defines a generalization of the DS RR use in order to
    reduce the number of secure entry points in a resolver and in order to create
    a secure link between islands of security. This allows to simulate a secure spanning
    tree among all secure zones and reduce the number of non secure name resolutions.</p>"
