  script: Latn
  content: "<p>This document lists a set of slicing-related specifications that are
    being development within the IETF. This document is meant to provide an overview
    of slicing activities in the IETF to hopefully ease coordination and ensure that
    specifications that are developed in many WGs are consistent.</p>"
