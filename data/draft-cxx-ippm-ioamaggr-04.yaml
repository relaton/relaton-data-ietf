abstract:
- language: en
  script: Latn
  content: "<p>The purpose of this memo is to describe a new option type for In-Situ
    Operations, Administration, and Maintenance (IOAM). This option type allows to
    aggregate IOAM data along a network path. Aggregates include functions such as
    the sum, average, minimum, or maximum of a given data parameter.</p>"
