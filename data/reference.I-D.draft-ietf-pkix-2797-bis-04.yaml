abstract:
- language: en
  script: Latn
  content: "<p>This document defines the base syntax for CMC, a Certificate Management
    protocol using CMS (Cryptographic Message Syntax). This protocol addresses two
    immediate needs within the Internet PKI community: 1. The need for an interface
    to public key certification products and services based on CMS and PKCS #10 (Public
    Key Crytpography 2. The need in S/MIME (Secure MIME) for a certificate enrollment
    protocol for DSA-signed certificates with Diffie-Hellman public keys. CMC also
    requires the use of the transport document and the requirements usage document
    along with this document for a full definition.</p>"
