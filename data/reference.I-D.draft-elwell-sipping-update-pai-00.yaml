abstract:
- language: en
  script: Latn
  content: "<p>SIP has a mechanism for conveying the asserted identity of the originator
    of a request by means of the P-Asserted-Identity header field. This header field
    is specified for use in requests using a number of SIP methods, in particular
    the INVITE method. However, it is not specified for use in requests using the
    SIP UPDATE method. This document extends RFC 3325 by allowing use of the P-Asserted-
    Identity header field in UPDATE requests. This work is being discussed on the
    sipping@ietf.org mailing list.</p>"
