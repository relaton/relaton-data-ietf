- language: en
  script: Latn
  content: "<p>This document introduces a cloud based mobile core network architecture.
    The motivation and the key problems that need to be further studied by the community
    are analyzed. The purpose of this document is to call the community's attention
    and interest to study the key technologies and protocols to realize this cloud
    based mobile core network.</p>"
