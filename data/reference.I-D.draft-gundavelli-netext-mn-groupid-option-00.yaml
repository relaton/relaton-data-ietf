abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new mobility option for use in Proxy Binding
    Update and Proxy Binding Acknowledgement messages.  This option can be used by
    the mobility entities in a Proxy Mobile IPv6 domain for carrying the group affiliation
    of a mobile node in any of the mobility signaling messages.</p>"
