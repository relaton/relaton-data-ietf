abstract:
- language: en
  script: Latn
  content: "<p>At present the purge packet does not contain information of the source
    router generating it.  Thus under the circumstance of purge packet propagation,
    it is difficult to tracback and locate the source router.  To address the problem,
    this document proposes to add a new TLV in purge packet to record the system ID
    of the IS generating it.  This TLV should not be changed in purge packets sent
    by other routers.</p>"
