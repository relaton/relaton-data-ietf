abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Agent Passport System (APS), a protocol
    for identifying AI agents, attenuating delegated authority, and producing signed
    evidence at policy-enforcement boundaries. APS defines Ed25519 agent passports;
    separately signed principal bindings; delegation chains that cannot widen across
    scope, spend, depth, time, reputation, values, or reversibility; deterministic
    action and decision references; and a common envelope for signed action receipts.
    It also defines bindings for Model Context Protocol tool calls and imported OAuth
    identity-assertion authorization grants. Verification results keep cryptographic
    integrity, signer authority, referenced-artifact resolution, policy semantics,
    and external truth separate. An Implementation Status section identifies the exact
    coverage and maturity of the available open-source implementations.</p>"
