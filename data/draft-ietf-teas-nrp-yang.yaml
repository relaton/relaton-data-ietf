abstract:
- language: en
  script: Latn
  content: "<p>RFC 9543 describes a framework for Network Slices in networks built
    from IETF technologies. In this framework, the network resource partition (NRP)
    is introduced as a collection of network resources allocated from the underlay
    network to carry a specific set of Network Slice Service traffic and meet specific
    Service Level Objective (SLO) and Service Level Expectation (SLE) characteristics.
    This document defines two YANG data models for Network Resource Partitions (NRPs):
    a network-level model for policy configuration by a Network Slice Controller,
    and a device-level model for configuration of individual network elements. These
    models enable automated provisioning of NRPs in IP/MPLS and Segment Routing (SR)
    networks, supporting scalable realization of RFC 9543 Network Slice Services.</p>"
