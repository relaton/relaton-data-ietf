abstract:
- language: en
  script: Latn
  content: "<p>This document describes a standard way to store the configuration and
    the results of traceroute measurements. This document first of all describes the
    tool itself; afterwards, the common information model is defined dividing the
    information elements in two semantically separated groups (configuration elements
    and results ones). Moreover an additional element is defined to relate configuration
    elements and results ones by means of a common unique identifier. On the basis
    of the information model a data model based on XML is defined to store the results
    of traceroute measurements.</p>"
