abstract:
- language: en
  script: Latn
  content: "<p>The currently defined PIM version 2 messages share a common message
    header format. The common header definition contains eight reserved bits. This
    document specifies how these bits may be used by individual message types, and
    creates a registry containing the per message type usage. This document also extends
    the PIM type space by defining three new message types. For each of the new types,
    four of the previously reserved bits are used to form an extended type range.
    This document Updates RFC7761 and RFC3973 by defining the use of the currently
    Reserved field in the PIM common header. This document further updates RFC7761
    and RFC3973, along with RFC5015, RFC6754 and RFC8364, by specifying the use of
    the currently Reserved bits for each PIM message.</p>"
