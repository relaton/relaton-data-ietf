abstract:
- language: en
  script: Latn
  content: "<p>CoAP has been standardised as an application-level REST-based protocol.
    This document introduces a way forward for CoAP clients and servers to exchange
    resource representations when multiple transports exist at an endpoint, by agreeing
    upon alternate locations as well as transport and protocol configurations.</p>"
