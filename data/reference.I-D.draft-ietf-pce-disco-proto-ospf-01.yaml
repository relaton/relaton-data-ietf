abstract:
- language: en
  script: Latn
  content: "<p>There are various circumstances where it is highly desirable for a
    Path Computation Client (PCC) to be able to dynamically and automatically discover
    a set of Path Computation Element(s) (PCE), along with some of information that
    can be used for PCE selection. When the PCE is a Label Switch Router (LSR) participating
    to the IGP, or even a server participating passively to the IGP, a simple and
    efficient way for PCE discovery consists of relying on IGP flooding. For that
    purpose this document defines OSPF extensions for the advertisement of PCE Discovery
    information within an OSPF area or within the entire OSPF routing domain.</p>"
