abstract:
- language: en
  script: Latn
  content: "<p>Mobile Internet access from smartphones and other mobile devices is
    accelerating the exhaustion of IPv4 addressing.  IPv6 is widely seen as crucial
    for the continued operation and growth of the Internet, and IPv6 is critical in
    mobile networks.  This document discusses the issues that arise when deploying
    IPv6 in mobile networks with their own unique architecture and deployment models.</p>"
