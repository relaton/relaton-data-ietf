abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Open Trust Protocol (OTrP), a protocol
    that follows the Trust Execution Environment Provisioning (TEEP) architecture
    and provides a message protocol that provisions and manages Trusted Applications
    into a device with a Trusted Execution Environment (TEE).</p>"
