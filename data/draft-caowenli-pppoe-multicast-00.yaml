- language: en
  script: Latn
  content: "<p>This document extends the Point-to-Point Over Ethernet (PPPoE) Protocol
    [2] with a forwarding mode for IP multicast packets or broadcast packets in PPPoE
    networks. This optional extension can improve the performance of the IP multicasting
    and broadcasting in PPPoE links.</p>"
