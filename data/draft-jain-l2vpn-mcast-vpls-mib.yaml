- language: en
  script: Latn
  content: "<p>This memo defines an experimental portion of the Management\n   Information Base for use with network management protocols in the\n   Internet community.\n\n   In particular, it describes managed objects to configure and/or\n   monitor multicast in VPLS using Point-to-Multipoint LSPs or VPLS-\n   MCAST [I-D.ietf-l2vpn-vpls-mcast].</p>"
