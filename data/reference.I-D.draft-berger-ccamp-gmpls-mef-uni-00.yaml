abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method for controlling Ethernet transport
    connections via a Generalized Multi-Protocol Label Switching (GMPLS) based User-Network
    Interface (UNI). This document supports the types of Ethernet services that have
    been defined in the context of the Metro Ethernet Forum (MEF) and International
    Telecommunication Union (ITU). Specifically, Ethernet private line service and
    Ethernet virtual private line service. Support for the MEF and ITU defined Services
    parameters are also covered. This document does not define or limit the underlying
    intra-domain or Internal NNI (I-NNI) technology used to support the UNI.</p>"
