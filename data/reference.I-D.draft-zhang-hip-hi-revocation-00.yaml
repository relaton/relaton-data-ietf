abstract:
- language: en
  script: Latn
  content: "<p>This document mainly analyzes the key revocation issue with host identities
    (HI) in the Host Identity Protocol (HIP), which has not attracted enough attention
    from HIP community yet. As a core component of key management mechanism, key revocation
    is critical for security systems especially which are expected to execute for
    a long period. Apart from that, this document also discusses the possible challenges
    that the designers of HI revocation mechanisms have to face and introduces several
    possible solutions.</p>"
