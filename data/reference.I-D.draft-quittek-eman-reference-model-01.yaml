abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses suggest a reference model for energy consumption
    monitoring and control.  It defines entities involved in energy management, their
    roles, and relationships among them.  Considered entities include powered devices,
    power monitors, and power controllers, and energy management systems.</p>"
