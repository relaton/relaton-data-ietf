abstract:
- language: en
  script: Latn
  content: "<p>InfiniBand Architecture (IBA) specifies a high speed, channel based,
    \nswitched fabric architecture that delivers scalable performance in  \ndata centers.
    \n            \nThis memo defines a portion of the Management Information Base
    (MIB) \nfor use with network management protocols in Internet community. \nIn
    particular, it defines objects for managing IBA defined InfiniBand \ninterfaces.</p>"
