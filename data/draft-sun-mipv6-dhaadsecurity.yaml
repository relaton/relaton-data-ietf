abstract:
- language: en
  script: Latn
  content: "<p>This document describes potential security issues relevant to the Dynamic
    Home Agent Address Discovery (DHAAD) procedure in Mobile IPv6. In particular,
    we illustrate a Denial of Service (DoS) attack scenario and propose three possible
    solutions to improve the security of DHAAD in MIPv6.</p>"
