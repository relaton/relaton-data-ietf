abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Basic session-credential grant type for the\n   Agent Enrollment Protocol (AEP).  The grant type lets an AEP Service\n   issue an HTTP Basic credential through the AEP Grant command for\n   deployments that already integrate with Basic authentication\n   middleware.</p>"
