abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a Computing and Network Information Awareness
       (CNIA)system architecture for Computing-Aware Traffic Steering
       (CATS).  Based on the CATS framework, this document furtherly
       describes a proposal detailed awareness architecture about the
       network information and computing information.  It includes a new
       comomponent and the corresponding interfaces and work flows in the
       CATS control plane.</p>
