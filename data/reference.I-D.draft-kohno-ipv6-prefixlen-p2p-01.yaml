abstract:
- language: en
  script: Latn
  content: "<p>In many environments it is useful, for security and other reasons,
    to use 127-bit IPv6 prefixes on inter-router links.  This document outlines some
    of these reasons and proposes that 127-bit IPv6 prefix lengths be allowed on these
    links.</p>"
