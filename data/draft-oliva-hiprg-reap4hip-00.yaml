- language: en
  script: Latn
  content: "<p>This document considers scenarios for the provision of fault tolerance
    capabilities in multihomed HIP nodes. In order to support such configurations,
    this document updates the behaviour for HIP multihoming nodes currently defined
    and defines the integration of the REAP protocol in HIP.</p>"
