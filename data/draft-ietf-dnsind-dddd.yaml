- language: en
  script: Latn
  content: "<p>This document proposes a mechanism for notifying a dynamic DNS server
    that a delete operation should be performed at a certain point in the future.
    This works within the framework of the current DNS dynamic update protocol, and
    provides needed functionality for clients with leased dynamic addresses.</p>"
