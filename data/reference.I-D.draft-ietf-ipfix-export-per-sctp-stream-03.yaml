abstract:
- language: en
  script: Latn
  content: <p>This document specifies an improvement to the Partial  Reliability extension
    of SCTP (PR-SCTP, Partial Reliability  Stream Control Transmission Protocol) export
    specified in  the IP Flow Information Export (IPFIX) specifications in  RFC5101.  This
    method offers several advantages such as the ability to  calculate Data Record
    losses for PR-SCTP, immediate export of  Template Withdrawal Messages, immediate
    reuse of Template IDs  within an SCTP stream, and reduced demands on the Collecting  Process.  Status
    of this Memo  This Internet-Draft is submitted to IETF in full conformance  with
    the provisions of BCP 78 and BCP 79.  Internet-Drafts are working documents of
    the Internet  Engineering Task Force (IETF), its areas, and its working  groups.  Note
    that other groups may also distribute working  documents as Internet-Drafts.  Internet-Drafts
    are draft documents valid for a maximum of six  months and may be updated, replaced,
    or obsoleted by other  documents at any time.  It is inappropriate to use Internet-  Drafts
    as reference material or to cite them other than as "work  in progress."  The
