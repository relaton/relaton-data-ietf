abstract:
- language: en
  script: Latn
  content: "<p>This document describes ring based VPLS architecture. This architecture
    is an alternative to existing VPLS architecture. It can simplify the full mesh
    connection overhead and provide a standard based protection mechanism, especially
    when the underlying cable or fiber infrastructure is ring based. It is also an
    optimal architecture for customer multicast traffic compared with existing VPLS.</p>"
