id: draftietfnetmodsubintfvlanmodel
schema_version: v1.5.6
formattedref:
  content: draft-ietf-netmod-sub-intf-vlan-model
title:
- language: en
  script: Latn
  content: Sub-interface VLAN YANG Data Models
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-netmod-sub-intf-vlan-model-18
docidentifier:
- content: draft-ietf-netmod-sub-intf-vlan-model
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-07-06'
abstract:
- language: en
  script: Latn
  content: "<p>This document defines YANG modules to add support for classifying\n   traffic received on interfaces as Ethernet/VLAN framed packets to\n   sub-interfaces based on the fields available in the Ethernet/VLAN\n   frame headers.  These modules allow configuration of Layer 3 (L3) and\n   Layer 2 (L2) sub-interfaces (e.g., L2VPN attachment circuits) that\n   can interoperate with IETF based forwarding protocols, such as IP and\n   L3VPN services, or L2VPN services like Virtual Private Wire Service\n   (VPWS), Virtual Private LAN Service (VPLS), and EVPN.  The sub-\n   interfaces also interoperate with VLAN tagged traffic originating\n   from an IEEE 802.1Q compliant bridge.\n\n   The model differs from an IEEE 802.1Q bridge model in that the\n   configuration is interface/sub-interface based as opposed to being\n   based on membership of an 802.1Q VLAN bridge.\n\n   The YANG data models in this document conforms to the Network\n   Management Datastore Architecture (NMDA) defined in RFC 8342.</p>"
