abstract:
- language: en
  script: Latn
  content: |-
    <p>TLS-DPA is an experimental, identity-bound security protocol inspired
       by the design of TLS 1.3 ( [RFC8446] ).  It is intended to operate
       consistently across environments where conventional IP address and
       port semantics are weak, unstable, or intentionally absent, including
       zero-port transports such as UZP ( [UZP] ).

       TLS-DPA generalises the handshake so it is not tied to server-side
       listeners, binds authentication to Service Identities rather than
       network coordinates, reduces metadata exposure to intermediaries
       (including rendezvous nodes in UZP fabrics), provides a unified
       hybrid-KEM post-quantum transition model ( [NIST-PQC] ), and supports
       session continuity across overlay path changes (e.g., QUIC Connection
       IDs; [RFC9000] ).

       This document is part of an experimental, research-oriented
       Independent Stream suite.  It defines the current normative baseline
       for trust objects, validation rules, and security semantics within
       its scope.  Hard interoperability is expected for shared object
       semantics and validation rules.  Full wire-level, clustering, and
       proof-family interoperability is not claimed everywhere yet; the
       remaining details are intentionally profile-defined or deferred where
       noted.</p>
