abstract:
- language: en
  script: Latn
  content: "<p>TLS-DPA is an experimental, identity-bound security protocol inspired\n   by the design of TLS 1.3 ( [RFC8446] ).  It is intended to operate\n   consistently across environments where conventional IP address and\n   port semantics are weak, unstable, or intentionally absent, including\n   zero-port transports such as UZP ( [UZP] ).\n\n   TLS-DPA generalises the handshake so it is not tied to server-side\n   listeners, binds authentication to Service Identities rather than\n   network coordinates, reduces metadata exposure to intermediaries\n   (including rendezvous nodes in UZP fabrics), provides a unified\n   hybrid-KEM post-quantum transition model ( [NIST-PQC] ), and supports\n   session continuity across overlay path changes (e.g., QUIC Connection\n   IDs; [RFC9000] ).\n\n   This document is part of an experimental, research-oriented\n   Independent Stream suite.  It defines the current normative baseline\n   for trust objects, validation rules, and security semantics within\n   its scope.  Hard interoperability is expected for shared object\n   semantics and validation rules.  Full wire-level, clustering, and\n   proof-family interoperability is not claimed everywhere yet; the\n   remaining details are intentionally profile-defined or deferred where\n   noted.</p>"
