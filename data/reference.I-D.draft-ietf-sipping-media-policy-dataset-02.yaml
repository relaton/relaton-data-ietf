abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a document format for media properties of
    Session Initiation Protocol (SIP) sessions, such as the codecs or media types
    used. This format is based on XML and extends the Schema for SIP User Agent Profile
    Data Sets. It is capable of expressing the media properties of a SIP session and
    can be used to summarize a SIP session or to formulate policies for a SIP session.</p>"
