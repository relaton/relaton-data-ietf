abstract:
- language: en
  script: Latn
  content: "<p>This memo adds two Options for the Constrained Application Protocol
    (CoAP): Profile and Sec-flag.  The Profile Option is indicating the identification
    of an application using CoAP.  The Sec-flag Option complements the security considerations
    of CoAP.</p>"
