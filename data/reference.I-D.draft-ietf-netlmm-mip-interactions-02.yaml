abstract:
- language: en
  script: Latn
  content: "<p>The scenarios where Proxy Mobile IPv6 (PMIPv6) and Mobile IPv6 (MIPv6)
    protocols are both deployed in a network require some analysis and considerations.
    \ This document describes all identified possible scenarios, which require an
    interaction between PMIPv6 and MIPv6 and discusses all issues related to these
    scenarios.  Solutions and reccomendations to enable these scenarios are also described.</p>"
