abstract:
- language: en
  script: Latn
  content: "<p>In instant messaging systems, it is useful to know that the other party
    is composing a message, e.g., typing. This document defines a new content type
    and XML namespace that conveys information about a message being composed. The
    message could be of any type, including text, voice or video</p>"
