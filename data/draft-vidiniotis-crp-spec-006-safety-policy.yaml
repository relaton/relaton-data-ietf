abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the CRP-Safety-Policy directive language — a\n   declarative policy syntax for expressing AI safety requirements at\n   the transport layer.  The directive language is modelled after HTTP\n   Content-Security-Policy (CSP) as defined in W3C CSP Level 3.  It\n   allows clients to declare what AI output characteristics are trusted,\n   what risk levels trigger enforcement actions, and where violations\n   should be reported.  The CRP gateway enforces these policies on every\n   AI response before delivery to the client.  This document defines the\n   complete directive grammar, enforcement semantics, violation\n   reporting, and policy inheritance in multi-agent chains.</p>"
