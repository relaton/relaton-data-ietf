abstract:
- language: en
  script: Latn
  content: "<p>RBridges allow for optimal pair-wise forwarding with zero configuration,
    safe forwarding even during periods of temporary loops, and the ability to cut
    down on ARP/ND and IP multicast traffic. They achieve these goals by replacing
    the Spanning Tree protocol with IS-IS. The design also supports VLANs, and allows
    forwarding tables to be based on RBridge destinations (rather than endnode destinations),
    which allows internal forwarding tables to be substantially smaller than in conventional
    bridge systems.</p>"
