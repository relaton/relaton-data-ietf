abstract:
- language: en
  script: Latn
  content: "<p>This document describes a set of private Session Initiation Protocol
    (SIP) headers (P-headers) used by the 3rd-Generation Partnership Project (3GPP),
    along with their applicability, which is limited to particular environments.  The
    P-headers are for a variety of purposes within the networks that the partners
    use, including charging and information about the networks a call traverses.1.
    \ Overall Applicability  The SIP extensions specified in this document make certain
    assumptions regarding network topology, linkage between SIP and lower layers,
    and the availability of transitive trust.  These assumptions are generally NOT
    APPLICABLE in the Internet as a whole.  The mechanisms specified here were designed
    to satisfy the requirements specified in the 3GPP Release 5 requirements on SIP
    [RFC4083] for which either no general-purpose solution was planned, where insufficient
    operational experience was available to understand if a general solution is needed,
    or where a more general solution is not yet mature.  For more details about the
    assumptions made about these extensions, consult the Applicability subsection
    for each extension.2.  Conventions</p>"
