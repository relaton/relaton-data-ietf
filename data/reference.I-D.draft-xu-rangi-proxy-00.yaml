abstract:
- language: en
  script: Latn
  content: "<p>The Routing Architecture for the Next Generation Internet (RANGI) is
    a proposal for solving routing scalability, mobility, multihoming,  traffic engineering
    and other issues facing the current Internet. RANGI is described in a separate
    document [RANGI]. This document describes a transition mechanism for RANGI. With
    this mechanism, legacy IPv4 or IPv6 hosts can communicate with RANGI hosts, and
    vice versa. This allows RANGI to be deployed incrementally in the current Internet.</p>"
