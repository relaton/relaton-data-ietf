abstract:
- language: en
  script: Latn
  content: "<p>Wotan is the memory and I/O bus for the Unheaded Protocol, providing\n   addressable per-flow storage for BPF programs executing within the\n   Limited Domain.\n\n   The Wotan protocol specifies the BPF helper interface for memory\n   access, the address space layout for per-flow data structures, a\n   five-level cache hierarchy (L0 through L4), and the topic-based I/O\n   model for interaction with userspace services.\n\n   This memo defines the memory model, helper functions, address space,\n   cache miss protocol, gRPC streaming contracts, triple-role\n   architecture, reliability guarantees, and I/O topic naming\n   conventions for systems implementing the Unheaded Protocol's\n   computational layer.\n\n   Draft-03 introduces a structured error code taxonomy with severity\n   levels, helper return codes for common operations, and error recovery\n   procedures.  Draft-02 security patches W1-W8 are retained.</p>"
