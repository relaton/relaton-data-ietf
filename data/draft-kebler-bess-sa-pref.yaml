abstract:
- language: en
  script: Latn
  content: "<p>This document define new procedures to use Source-Active A-D routes
    to influence the UMH selection procedures at a downstream PE in certain deployments.
    These procedures allow some greater flexibility to influence the UMH selection
    based on more than just the unicast route to the source.</p>"
