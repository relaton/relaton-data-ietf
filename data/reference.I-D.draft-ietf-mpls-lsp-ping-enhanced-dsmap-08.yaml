abstract:
- language: en
  script: Latn
  content: "<p>This document describes methods for performing lsp-ping traceroute
    over mpls tunnels and for traceroute of stitched mpls LSPs.  The techniques outlined
    in RFC 4379 are insufficient to perform traceroute FEC validation and path discovery
    for a LSP that goes over other mpls tunnels or for a stitched LSP.  This document
    describes enhancements to the downstream-mapping TLV (defined in RFC 4379). These
    enhancements along with other procedures outlined in this document can be used
    to trace such LSPs.</p>"
