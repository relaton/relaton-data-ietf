abstract:
- language: en
  script: Latn
  content: "<p>This document provides a definition of the Group Security\n   Association (GSA) for IP multicast, derived from the Security\n   Association (SA) definition for unicast. The document describes the\n   motivations of a GSA and other issues related to the GSA usage in\n   the context of the existing IPsec implementations.</p>"
