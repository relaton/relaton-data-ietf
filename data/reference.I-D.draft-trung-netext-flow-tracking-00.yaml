abstract:
- language: en
  script: Latn
  content: "<p>When a mobile node attaches to the proxy mobile IPv6 domain by using
    multiple interfaces simultaneously, it can dynamically move a flow from an interface
    to another.  A Mobile Access Gateway (MAG) should be aware of this event and inform
    a Local Mobility Anchor (LMA) to send packets of the flow to appropriate interfaces.
    \ This document introduces procedures for the MAGs and a LMA to actively track
    the movement of the flow basing on the flow-label of the IPv6 packet header.</p>"
