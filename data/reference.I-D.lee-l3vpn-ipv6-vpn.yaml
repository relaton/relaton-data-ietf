abstract:
- language: en
  script: Latn
  content: "<p>This text introduces a kind of method to carry out VPN based on IPv6
    addresses, defines VPN unicast and multicast address structure and the method
    to construct VPN topology, and depicts unicast and multicast routing and forwarding
