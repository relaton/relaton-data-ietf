abstract:
- language: en
  script: Latn
  content: "<p>This memo discusses Flow Attribute Notification Protocol (FANP), which
    is a protocol between neighbor nodes for the management of cut-through packet
    forwarding functionalities.  This memo provides information for the Internet community.
    \ This memo does not specify an Internet standard of any kind.</p>"
