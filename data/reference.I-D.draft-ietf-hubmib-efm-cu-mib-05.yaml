abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Management Information Base (MIB) module for
    use with network management protocols in TCP/IP based internets. This document
    proposes an extension to the Ethernet-like Interfaces MIB and MAU MIB modules
    with a set of objects for managing an Ethernet in the First Mile Copper (EFMCu)
    interfaces 10PASS-TS and 2BASE-TL, defined in IEEE Std 802.3ah-2004.</p>"
