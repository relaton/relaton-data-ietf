- language: en
  script: Latn
  content: "<p>This document describes an extension to allow a Secure Shell (SSH)
    server to inform a client of the full set of host keys it supports. This may be
    used for graceful host key rotation and to provide keys for additional signature
    algorithms to the client, supporting algorithm agility.</p>"
