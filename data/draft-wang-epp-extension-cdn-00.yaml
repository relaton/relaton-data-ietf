- language: en
  script: Latn
  content: "<p>This document describes a practice of Extensible Provisioning Protocol
    (EPP) extension mapping for supporting Chinese domain names,especially for the
    variant chinese names. Specified in XML, this mapping extends the EPP domain name
    mapping to provide additional features required by Chinese domain names.</p>"
