abstract:
- language: en
  script: Latn
  content: <p>This document registers the Enumservice named "vmsg", which is used
    to facilitate the real-time routing of voice and/or video communications to a
    messaging system. This vmsg Enumservice registers three Enumservice types; "voicemsg",
    "videomsg", and "unifmsg".</p>
