abstract:
- language: en
  script: Latn
  content: "<p>Consequential agent actions can cross operator and administrative boundaries.
    The party that later decides whether to rely on an action record may not have
    participated in the interaction and may not trust either operator. This document
    describes an evidence architecture for that case. It separates transport and workload
    identity, delegation and policy, material action identity, authorization evidence,
    evidence satisfaction, local authorization, durable consumption or reservation,
    effect invocation, outcome evidence, revocation, and preservation. The architecture
    composes the Canonical Action Identifier (CAID), Authorization Evidence Chain
    (AEC), and Action Evidence Boundary (AEB) with optional staged-approval and consequence-control
    profiles. It does not define a universal token, policy language, execution engine,
    settlement network, or distributed consensus system. A valid signature, a current
    credential, a satisfied evidence requirement, and an observed effect remain different
    facts.</p>"
