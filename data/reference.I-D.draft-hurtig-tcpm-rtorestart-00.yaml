abstract:
- language: en
  script: Latn
  content: "<p>This document proposes to restart the TCP and the SCTP retransmission
    timer with consideration to the earliest outstanding segment and thus updates
    the standard algorithm.  It discusses the motivation, the required modifications
    and some experimental results.  This document focuses on TCP, but the motivation
    and required modifications also apply to SCTP as both protocols use the same algorithm
    for RTO management.</p>"
