abstract:
- language: en
  script: Latn
  content: "<p>This document describes the function and responsibilities of the Independent
    Stream Editor (ISE).  The Independent Stream is one of the Stream Producers, with
    the ISE as its Stream Approver.  The ISE is overall responsible for activities
    within the Independent Stream, working with draft editors and reviewers, and interacts
    with the RFC Production Centre and Publisher, and the RFC Series Editor.  The
    ISE is appointed by the IAB, and also interacts with the IETF Administrative Oversight
    Committee (IAOC).</p>"
