abstract:
- language: en
  script: Latn
  content: "<p>Simple Traversal Underneath NAT (STUN) is a mechanism for traversing
    NATs. STUN requests are transmitted through a NAT to external STUN servers. While
    this works very well, its two primary drawbacks are the inability to modify the
    properties of a NAT binding and the need to query a public STUN server for every
    NAT binding. These drawbacks require frequent messages which present a load on
    servers (like SIP servers and STUN servers) and are bad for low speed access networks,
    such as cellular. This document proposes that the STUN server be embedded in the
    NAT itself, and describes how these STUN servers can be readily discovered and
    utilized to reduce queries to public STUN servers and to reduce NAT keepalive
    traffic.</p>"
