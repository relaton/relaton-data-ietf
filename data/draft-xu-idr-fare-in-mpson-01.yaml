abstract:
- language: en
  script: Latn
  content: "<p>FARE-BGP enables weighted ECMP load balancing using a path-bandwidth
    extended community. FARE-in-SUN extends this mechanism from switches to GPUs for
    scale-up networks, which are typically multi-plane. Large AI training clusters
    are increasingly adopting multi-plane scale-out network topologies. This document
    further extends FARE-BGP from switches to RoCE NICs (RNICs) for such multi-plane
    scale-out networks. The document also presents two techniques to address route
    scalability concerns caused by the injection of numerous host routes.</p>"
