abstract:
- language: en
  script: Latn
  content: <p>This document defines guidelines for including YANG example instances
    in IETF documents in a way that enables automatic extraction and validation. It
    introduces the concept of YANG module "coverage" to measure how thoroughly example
    instances exercise a YANG module's data nodes. By standardizing how YANG examples
    are included, validated, and measured for coverage, these guidelines help authors
    catch errors before publication and give reviewers and implementers greater confidence
    that the examples in a specification are correct and cover a sufficient range
    of scenarios - ultimately making the underlying data models easier to implement
    and use.</p>
