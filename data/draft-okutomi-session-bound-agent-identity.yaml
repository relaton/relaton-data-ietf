abstract:
- language: en
  script: Latn
  content: "<p>This document defines a verifier-side acceptance profile for channel-
    bound Agent identity and authorization. It addresses context diversion, where
    cryptographically valid material is accepted for a different service, tenant,
    actor, task, target, delegation, or authority boundary than the verifier intended.
    A verifier accepts an actor only when a verified authority grant, holder-of-key
    proof, accepted channel instance, freshness and replay state, any required attestation
    result, and verifier-local policy all describe the same intended interaction.
    Protocol-specific wire formats and deployment choices are left to binding profiles.</p>"
  format: text/html
