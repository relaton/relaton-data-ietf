abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to OSPFv3 to support intra-area
    Traffic Engineering (TE). This document extends OSPFv2 TE to handle IPv6 networks.
    A new TLV and several new sub-TLVs are defined to support IPv6 networks.</p>"
