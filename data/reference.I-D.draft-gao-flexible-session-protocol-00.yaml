abstract:
- language: en
  script: Latn
  content: "<p>FSP is a connection-oriented transport layer protocol that provides
    support for mobility, multi-homing and multi-path by introducing the concept of
    'upper layer thread ID'.  It introduces the concept of transmit transaction to
    facilitate a quad-party sub-protocol of shared secret installation.  It provides
    transport layer features of zero round-trip connection multiplication and on-the-wire
    compression, in addition to ubiquitous message authentication with optional encryption
    service.</p>"
