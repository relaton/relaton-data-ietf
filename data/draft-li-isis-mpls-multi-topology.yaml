abstract:
- language: en
  script: Latn
  content: "<p>MPLS plays a key role in the process of implementing network virtualization.
    [I-D.li-mpls-network-virtualization-framework] proposes the framework to implement
    MPLS virtual network basedn on the architecture of central controller IGP. This
    document defines the corresponding IS-IS protocol extension and procedures to
    support MPLS Multi-Topology.</p>"
