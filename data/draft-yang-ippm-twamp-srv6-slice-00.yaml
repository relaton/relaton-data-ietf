abstract:
- language: en
  script: Latn
  content: "<p>Network Slices realized over Segment Routing over IPv6 (SRv6)\n   networks use slice-specific forwarding resources that are selected by\n   a slice indicator carried in the IPv6 packet.  For two-way active\n   measurement results to reflect the conditions experienced by traffic\n   within a given network slice, the probe packets generated by the Two-\n   Way Active Measurement Protocol (TWAMP) and the Simple Two-Way Active\n   Measurement Protocol (STAMP) need to be forwarded over the same\n   slice-specific resources as the data traffic they are intended to\n   characterize.\n\n   This document specifies how a slice indicator is carried in TWAMP and\n   STAMP probe packets so that those packets are forwarded through the\n   resources of a target slice, and it defines the corresponding\n   Session-Sender and Session-Reflector behavior.  The procedures are\n   independent of the specific encoding used to carry the slice\n   indicator in the SRv6 data plane.</p>"
