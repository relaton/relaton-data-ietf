abstract:
- language: en
  script: Latn
  content: "<p>Agent Communication Network(ACN) is becoming a promising and fundamental
    infrastructure for most vertical industries. To construct and build a scalable
    and trustable ACN, authentication and authorization of AI agents are critical
    requirements. This document extends the model of OAuth and proposes new workflows
    for AI agent authentication and authorization.</p>"
