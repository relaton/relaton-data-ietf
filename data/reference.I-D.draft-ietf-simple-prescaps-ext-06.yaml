abstract:
- language: en
  script: Latn
  content: "<p>Interoperation of instant messaging and presence systems has been defined
    in the IMPP working group. The IMPP WG has come up with baseline interoperable
    operations and formats for presence and instant messaging systems. This memo defines
    an extension to represent SIP User Agent capabilities in the Presence Information
    Document Format (PIDF) compliant presence documents.</p>"
