abstract:
- language: en
  script: Latn
  content: "<p>This document specifies best current practices on how Host Identity
    Protocol (HIP) can be utilized in Peer-to-Peer Session Initiation Protocol (P2PSIP)
    networks. The main focus is given to the Network Address Translation (NAT) functionality,
    even though HIP provides functionalities like mobility, multi-homing, and enhanced
    security as well. The HIP is utilized as it is and no additions or changes are
    proposed to it.</p>"
