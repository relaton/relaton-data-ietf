abstract:
- language: en
  script: Latn
  content: <p>The File transfer protocol, which is defined by the RFC 959, is widely
    used. RFC 2428 define IPv6 extensions of FTP, introducing EPRT and EPSV command.  In
    the IPv6-IPv4 translation scenario, considerations should be applied to FTP client,
    server and translation box to ensure FTP protocol work properly. There already
    have some work to address this problem, such as "draft-van-beijnum-behave-ftp64-05"
    etc, but this document provides a different approach.</p>
