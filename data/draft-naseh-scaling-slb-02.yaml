abstract:
- language: en
  script: Latn
  content: "<p>This document defines details of several design methodologies and current
    best practices for scaling server load balancing (a.k.a. content switching) environments
    in today’s enterprise data centers. The scenarios covered in this document covers
    utilization of protocols and technologies ranging from IPv4 routing to DNS for
    scalability of server load balancing.</p>"
