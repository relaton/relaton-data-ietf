abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG data model for management of IP implementations.
    \ The data model includes configuration and system state.  The YANG model in this
    document conforms to the Network Management Datastore Architecture defined in
    I-D.ietf-netmod-revised-datastores.  This document obsoletes RFC 7277.</p>"
