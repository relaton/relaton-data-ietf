abstract:
- language: en
  script: Latn
  content: "<p>Experience has show that people get confused using the three numeric
    fields the TLSA record.  This document specifies descriptive acronyms for the
    three numeric fields in the TLSA records.  This document updates the format of
    the IANA registry created by RFC6698.</p>"
