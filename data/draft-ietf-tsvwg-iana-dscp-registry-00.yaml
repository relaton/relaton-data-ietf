abstract:
- language: en
  script: Latn
  content: "<p>The Differentiated Services (Diffserv) architecture specifies use of
    the field in the IPv4 and IPv6 packet header to carry the Diffserv Code point
    (DSCP). The Internet Assigned Numbers Authority (IONA) maintains a registry of
    assigned DSCP values. This update to RFC2474 changes the IONA assignment method
    for Pool 3 of the registry (i.e., DEC's of the form xxxx01) to Standards Action,
    i.e., values are assigned through a Standards Track or Best Current Practice RFC.
    The update also removes permission for experimental and Local Use of the code
    points that form Pool 3 of the DSCP registry; Pool 1 code points (i.e., DEC's
    of the form xxxx11) remain available for these purposes.</p>"
