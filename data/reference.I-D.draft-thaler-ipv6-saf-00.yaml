abstract:
- language: en
  script: Latn
  content: "<p>RFC 3424 requires an exit strategy for UNilateral Self-Address Fixing
    (UNSAF) mechanisms which are required for applications to work with most translation
    schemes.  There are various recent proposals that would result in translation
    becoming permanent.  This document discusses a strategy for avoiding UNSAF mechansisms
    becoming permanent in this case.</p>"
