abstract:
- language: en
  script: Latn
  content: "<p>By introducing new Information Elements (IEs), this draft extends the
    existing BGP-related IEs to enable IP Flow Information Export (IPFIX) to export
    BGP community information, including BGP standard communities defined in RFC1997,
    BGP extended communities defined in RFC4360, and BGP large communities defined
    in RFC8092.  Network traffic information can then be accumulated and analyzed
    at the BGP community granularity, which represents the traffic of different kinds
    of customers, services, or geographical regions according to the network operator's
    BGP community planning.  Network traffic information at the BGP community granularity
    is useful for network traffic analysis and engineering.</p>"
