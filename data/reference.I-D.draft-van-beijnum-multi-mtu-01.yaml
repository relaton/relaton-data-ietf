abstract:
- language: en
  script: Latn
  content: "<p>In the early days of the internet, many different link types with many
    different maximum packet sizes were in use. For point-to-point or point-to-multipoint
    links, there are still some other link types (PPP, ATM, Packet over SONET), but
    shared subnets are almost exclusively implemented as ethernets. Even though the
    relevant standards madate a 1500 octet maximum packet size for ethernet, more
    and more ethernet equipment is capable of handling packets bigger than 1500 octets.
    However, since this capability isn't standardized, it's seldom used today, despite
    the potential performance benefits of using larger  packets. This document specifies
    a mechanism to negotiate per-neighbor maximum packet sizes so that nodes on a
    shared subnet may use the maximum mutually supported packet size between them
    without being limited by nodes with smaller maximum sizes on the same subnet.</p>"
