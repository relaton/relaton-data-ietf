abstract:
- language: en
  script: Latn
  content: "<p>The Multi-Vantage Path Snapshot (MVPS) family specifies coherence\n   detection algebra [MVPS-V4] and trust profiles that authenticate\n   vantage reports [I-D.melegassi-santos-ippm-mvps-cwt].  The\n   mathematical truth of the MVPS theorems is established off the wire,\n   in companion proof documents and machine validators that emit\n   numerical receipts.  Without a normative binding layer, a consumer\n   cannot verify WHICH theorem catalogue, proof revision, validator\n   script, or receipt artifact a given deployment claim relies on, nor\n   detect silent substitution of those artifacts.\n\n   This document specifies the MVPS Proof Envelope: a canonicalized\n   [RFC8785] manifest that lists theorem identifiers and the SHA-256\n   digests of the companion proof documents, validator scripts, and\n   numerical receipts that support them, aggregated under a Merkle root\n   [RFC9162] and anchored by the operator-epoch and witness-cosignature\n   machinery of [I-D.melegassi-santos-ippm-mvps-cwt].  Verification of\n   the envelope is tamper-evident under standard hash and signature\n   assumptions (Theorem T-BIND-1) and traceable (Theorem T-TRACE-1).\n\n   The envelope does NOT cryptographically prove the listed theorems; a\n   proved theorem is a mathematical fact, not subject to cryptanalysis.\n   The envelope makes the CHOICE OF PROOF ARTIFACTS tamper-evident.  An\n   OPTIONAL Post-Quantum Protection profile MAY replace the Ed25519\n   anchor signatures with ML-DSA-65 [FIPS204] while leaving the\n   per-snapshot HMAC-SHA256 hot path unchanged (Theorem T-PQ-MIG-1).\n   Security Considerations document a finite Grover-halved floor and\n   explicitly defer any claim of perpetual security.\n\n   Numerical receipts are regenerated by\n   scripts/validate_proof_envelope.py (11/11 PASS) and stored in\n   evidence/proof_envelope_receipt.json.  Companion proofs are in\n   [PROOF-ENVELOPE-PROOF].</p>"
