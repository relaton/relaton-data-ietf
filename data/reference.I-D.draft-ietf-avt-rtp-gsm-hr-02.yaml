abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the payload format for packetization of the
    GSM Half-Rate speech codec data into the Real-time Transport Protocol (RTP).  The
    payload format supports transmission of multiple frames per payload and packet
    loss robustness methods using redundancy.</p>"
