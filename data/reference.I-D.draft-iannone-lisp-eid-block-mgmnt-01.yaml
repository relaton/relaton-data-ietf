abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an allocation framework for the management of
    the LISP EID address prefix (requested in a separate document).  Such framework
    relies on hierarchical distribution of the address space to RIRs (Regional Internet
    Registries), who will allocate on a temporary basis sub-prefixes to requesting
    organizations.</p>"
