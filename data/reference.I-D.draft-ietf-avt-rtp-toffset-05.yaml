abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method to inform RTP clients when RTP packets
    are transmitted at a time other than their 'nominal' transmission time. It also
    provides a mechanism to provide improved inter-arrival jitter reports from the
    clients, that take into account the reported transmission times.</p>"
