abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the ability of Generic UDP Encapsulation (GUE)
    to provide secure transport over IP networks and the Internet, including GUE header
    integrity protection and origin authentication and GUE payload encryption. These
    are optional features of GUE.</p>"
