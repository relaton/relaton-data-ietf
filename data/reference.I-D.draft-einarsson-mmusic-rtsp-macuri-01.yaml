abstract:
- language: en
  script: Latn
  content: "<p>By introducing multiple aggregated control URIs to be used with PLAY
    requests inside one single RTSP session, it is possible to switch content channel
    with minimal delay, since no new transport setup is needed. This is important
    for delivering TV-like services with short zapping times over unicast networks.
    Another important use case is hybrid unicast and broadcast distribution of live
    media, e.g. mobile TV. The possibility of this mechanism can be signalled implicitly
    using a standard SDP description for each content channel but with identical media
    control URIs, or by one common SDP description with a new attribute for multiple
    control URIs.</p>"
