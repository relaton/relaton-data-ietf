abstract:
- language: en
  script: Latn
  content: "<p>This Internet draft introduces the concepts and motivations for an
    inter-domain user profile management framework, and shows that the combination
    of Diameter and the existing policy framework is well- suited for this purpose.
    The draft defines a new Diameter Profile Management Application (PMA) to support
    the inter-domain user profile management.</p>"
