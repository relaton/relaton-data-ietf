abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Semantic-ETag HTTP response header field\n   and two associated conditional request header fields.  Unlike the\n   standard ETag field, which identifies a selected representation,\n   Semantic-ETag identifies a server-defined semantic equivalence class\n   for the underlying resource state.  This enables origin servers to\n   support representation-independent validation and optimistic\n   concurrency control across different representations, such as HTML,\n   JSON, and Markdown views of the same logical resource.\n\n   This document does not update or replace the semantics of the ETag\n   header field defined in RFC 9110.</p>"
