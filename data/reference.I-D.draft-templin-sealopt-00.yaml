abstract:
- language: en
  script: Latn
  content: "<p>The Subnetwork Encapsulation and Adaptation Layer (SEAL) provides a
    mid-layer header designed for the encapsulation of an inner network layer packet
    within outer network layer headers.  SEAL also supports a transport mode of operation,
    where the inner payload corresponds to an ordinary transport layer payload.  However,
    SEAL can also provide benefit when used as an IPv6 extension header.  Namely,
    the SEAL header when used as an extension header contains a digital signature
    or nonce inserted by the source.  The source can thereafter use the digital signature/nonce
    to verify that any ICMPv6 messages received actually came from a router on the
    path.</p>"
