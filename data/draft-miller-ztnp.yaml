abstract:
- language: en
  script: Latn
  content: "<p>The Zero-Trust Negotiation Protocol (ZTNP) specifies a session-scoped\n   trust negotiation protocol for software-layer security and governance\n   posture.  ZTNP defines how a Relying Party challenges a counterparty\n   for a signed posture credential, evaluates local policy against it,\n   and issues a short-lived, channel-bound, scoped authorization\n   artifact (a Permit) gating subsequent operations within the session.\n\n   ZTNP covers three phases:\n\n   *  *Enrollment*, in which a Prover obtains a signed Posture Assertion\n      from an Issuer that has assessed it against a publicly-identified\n      security framework.\n\n   *  *Negotiation*, in which the Requester issues a session challenge,\n      receives the Prover's Posture Assertion bound to that challenge,\n      evaluates local policy against it, and either issues a Permit or\n      returns a structured denial.\n\n   *  *Validation*, in which subsequent operations within the session\n      are gated against the Permit, with mandatory channel binding when\n      the transport is TLS.\n\n   The protocol's central design choice is to anchor the meaning of\n   trust claims to a publicly-identified security framework (e.g., NIST\n   AI RMF 1.0, ISO/IEC 42001) rather than to a specific Issuer.  A\n   policy expressing \"require tier 3 against framework X\" is portable\n   across any Issuer that attests against framework X.\n\n   ZTNP is independent of any particular attestation pipeline.  Posture\n   Assertions MAY be derived from RATS Attestation Results [RFC9334],\n   from compliance audit programs, from automated governance scanners,\n   or from any other Issuer evaluation methodology that meets the format\n   requirements of Section 5.  ZTNP is *not* a RATS consumption profile;\n   Section 1.5 describes how ZTNP composes with RATS-pipelined and non-\n   RATS-pipelined deployments alike.\n\n   Multi-principal delegation, prompt-injection-resistant intent\n   binding, and behavioral-claim extensions are specified in a companion\n   document, the Zero-Trust Intent Protocol (ZTIP) [I-D.miller-ztip].\n\n   This draft is an individual submission.  The author intends to\n   progress this work in a venue scoped to attestation-gated session\n   authorization; possibilities include OAuth, WIMSE, SAAG-routed new\n   work, or an Independent Submission.  Community guidance on venue is\n   welcome.</p>"
