abstract:
- language: en
  script: Latn
  content: "<p>This document describes a protocol to securely distribute channel access
    rights to TVoDSL customers using multicast over a national backbone. The protocol
    typically runs on DSLAM or any other piece of equipments to locally store owned
    customers TV channel access right. This design provides access control at edge
    level.</p>"
