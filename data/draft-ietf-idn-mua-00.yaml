abstract:
- language: en
  script: Latn
  content: "<p>This document describes a way where domain names used in Internet e-mail
    can be internationalized by making changes only to end-user Mail User Agents and,
    by doing so, avoid damaging other applications which handle Internet e-mail, such
    as Message Transfer Agents and Delivery Agents.</p>"
