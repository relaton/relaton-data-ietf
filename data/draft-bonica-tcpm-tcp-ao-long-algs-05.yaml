abstract:
- language: en
  script: Latn
  content: "<p>RFC5926 creates a list of cryptographic algorithms that can be used
    with TCP-AO. This document expands that list, adding two Message Authentication
    Code (MAC) algorithms, HMAC-SHA256 and KMAC256. For each MAC algorithm, a corresponding
    Key Derivation Function (KDF) is also added. The MAC algorithms described by this
    document produce 256-bit (i.e., 32-byte) MACs. When 32-byte MACs are encoded in
    TCP-AO, the TCP-AO consumes 36 of the 40 bytes available for TCP options.</p>"
