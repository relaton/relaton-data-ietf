abstract:
- language: en
  script: Latn
  content: "<p>This document describes secure network management in Segment Routing
    version six (SRv6) networks. It proposes a framework empowered with Intent-Based
    Networking (IBN). The Intent-Based Network Management (IBNM) in this document
    specifies an architectural framework with system components and interfaces. Also,
    this framework builds on Interface to Network Security Functions (I2NSF).</p>"
