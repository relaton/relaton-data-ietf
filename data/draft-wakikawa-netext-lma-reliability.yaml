abstract:
- language: en
  script: Latn
  content: "<p>This document introduces an extension to the Home Agent Reliability\nprotocol standardized in MEXT Working Group for LMA reliability.  In\nProxy Mobile IPv6 [RFC5213], LMA is an anchor which is similar to\nHome Agent of Mobile IPv6 [RFC3775].  Providing LMA reliability is\nachieved with the extensions described in this document.</p>"
