abstract:
- language: en
  script: Latn
  content: "<p>The Virtual World Region Agent Protocol (VWRAP) defines interactions
    between hosts collaborating to create an shared, internet scale virtual world
    experience.  This document introduces the protocol, its objectives and requirements
    it imposes on hosts and users utilizing the protocol.  This document also describes
    the model assumed by the protocol (to the extent it affects protocol interactions.)</p>"
