abstract:
- language: en
  script: Latn
  content: <p>This document defines a standard profile for X.509 certificates for
    the purposes of supporting validation of assertions of "right-of-use" of an Internet
    Number Resource (IP Addresses and Autonomous System Numbers).  This profile is
    used to convey the issuer's authorization of the subject to be regarded as the
    current holder of a "right-of- use" of the IP addresses and AS numbers that are
    described in the issued certificate.</p>
