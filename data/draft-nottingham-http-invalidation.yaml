    origin servers to their invalidate stored responses. About This Document This
    note is to be removed before publishing as an RFC. Status information for this
    document may be found at https://datatracker.ietf.org/doc/draft-nottingham-http-invalidation/.
    information can be found at https://mnot.github.io/I-D/. Source for this draft
