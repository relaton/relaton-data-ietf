- language: en
  script: Latn
  content: "<p>Kerberos either retains client identity in all its ticket transformations,
    or it applies rigorous anonymity. When crossing over to another realm, an intermediate
    privacy measure is often desired, namely pseudonymity, as described in this specification.</p>"
