abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the conventions for using Edwards-curve Digital
    Signature Algorithm (EdDSA) for Curve25519 and Curve448 in the Cryptographic Message
    Syntax (CMS). For each curve, EdDSA defines the PureEdDSA and HashEdDSA modes.
    However, the HashEdDSA mode is not used with the CMS. In addition, no context
    string is used with the CMS.</p>"
