abstract:
- language: en
  script: Latn
  content: <p>This document specifies an extension of the Routing Information Protocol
    (RIP), o expand the amount of useful information carried in RIP messages and to
    add a measure of security. This memo obsoletes RFC 1388, which specifies an update
    to the "Routing Information Protocol" STD 34, RFC 1058. [STANDARDS-TRACK]</p>
