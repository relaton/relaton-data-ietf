abstract:
- language: en
  script: Latn
  content: "<p>The SIP security framework draft defines a range of possible threats
    that a SIP message in transit might be subject to, a list of require- ments, and
    provides the raw fodder for an extensible framework to counter many of the threats
    using various crypto systems.</p>"
