abstract:
- language: en
  script: Latn
  content: "<p>The MULTIMOB group has specified a base solution to support IP multicasting
    in a PMIPv6 domain [I-D.draft-ietf-multimob-pmipv6-base- solution]. In this document,
    an enhancement is proposed to the base solution to use a dedicated multicast LMA
    as the topological anchor point for multicast traffic, while the MAG remains as
    an IGMP/MLD proxy. This enhancement provides benefits such as reducing multicast
    traffic replication and supporting different PMIPv6 deployments scenarios.</p>"
