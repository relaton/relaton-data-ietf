abstract:
- language: en
  script: Latn
  content: <p>This specification introduces an alternative way to select a HTTP response
    from a cache based upon its request headers, using the HTTP "Variants" and "Variant-Key"
    response header fields. Its aim is to make HTTP proactive content negotiation
    more cache-friendly.</p>
