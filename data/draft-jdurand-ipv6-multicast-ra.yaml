abstract:
- language: en
  script: Latn
  content: "<p>This document defines a way to advertise IPv6 multicast prefix availability
    using Neighbor Discovery (RFC2461). This multicast RA option can be used by routers
    to announce a set of multicast prefixes that can be on the link to form new group
    addresses.</p>"
