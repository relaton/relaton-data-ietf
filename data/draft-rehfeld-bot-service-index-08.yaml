abstract:
- language: en
  script: Latn
  content: "<p>This document, draft-rehfeld-bot-service-index-08, is superseded by\n   three successor Internet-Drafts that together constitute the APIX\n   specification suite:\n\n   *  draft-rehfeld-apix-core-00 — Core infrastructure, trust model, and\n      Index API\n\n   *  draft-rehfeld-apix-services-00 — Web API and bot service\n      registration profile\n\n   *  draft-rehfeld-apix-iot-00 — IoT device service registration\n      profile\n\n   Readers are directed to those documents.  This revision exists solely\n   to document the supersession and to note two trust model updates that\n   diverge from prior revisions.</p>"
