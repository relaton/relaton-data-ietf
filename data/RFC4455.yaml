abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB),
    for use with network management protocols in the Internet community. In particular,
    it describes managed objects for Small Computer System Interface (SCSI) entities,
    independently of the interconnect subsystem layer. [STANDARDS-TRACK]</p>"
