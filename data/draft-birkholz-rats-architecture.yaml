abstract:
- language: en
  script: Latn
  content: "<p>An entity (a relying party) requires a source of truth and evidence
    about a remote peer to assess the peer's trustworthiness. The evidence is typically
    a believable set of claims about its host, software or hardware platform. This
    document describes an architecture for such remote attestation procedures (RATS).</p>"
