  script: Latn
  content: "<p>This document introduces a mechanism for devices to actively learn
    the NMS server address from the neighbors through IPv6 ND protocol extension.
    It is a good leverage of IPv6 automatic features.  This document only discusses
    problem/solution within the IPv6-only networks/plane.</p>"
