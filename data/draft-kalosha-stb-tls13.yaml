abstract:
- language: en
  script: Latn
  content: "<p>This specification introduces a subset of STB (STandards of Belarus)\n   cryptographic algorithms and defines their use in TLS 1.3.  The\n   document is self-contained, i.e., it fully describes the required STB\n   algorithms.  It can be used to develop STB-compliant TLS 1.3\n   implementations without referring to the original STB standards.</p>"
