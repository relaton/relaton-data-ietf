abstract:
- language: en
  script: Latn
  content: "<p>Physical Layer specifications and management parameters for 40 Gb/s
    operation over single-mode fiber (40GBASE-ER4) and for 100 Gb/s operation over
    multimode fiber (100GBASE-SR4) are added by this amendment. This amendment also
    specifies a four-lane variant of the 100 Gigabit Attachment Unit Interface (CAUI-4)
    and optional Energy Efficient Ethernet (EEE) for 40 Gb/s and 100 Gb/s operation
    over fiber optic cables.</p>"
