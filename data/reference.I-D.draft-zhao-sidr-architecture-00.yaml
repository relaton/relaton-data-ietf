- language: en
  script: Latn
  content: "<p>This draft describes an architecture for secure inter-domain routing
    (BGP [RFC4271]). The architecture consists of components (i.e. functional modules)
    which address the requirements mentioned in [REQUIREMENT]. The draft describes
    interfaces (i.e. security services) that the architecture provides to routing
    engine as well.</p>"
