abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a simple signalling mechanism for inter- domain
    QoS marking using a BGP Extended Community QoS Attribute. Class based packet forwarding
    for delay and loss critical services is currently performed in an individual AS
    internal manner.  The new QoS marking attribute makes the QoS class setup within
    the IP prefix advertising AS known to all access and transit ASes.  This enables
    individual (re-)marking and forwarding treatment adaptation to the original QoS
    class setup of the respective IP prefix.  The attribute provides the means to
    signal QoS markings on different layers, which are linked together in QoS class
    sets.  It provides inter-domain and cross-layer insight into the QoS class mapping
    of the source AS with minimal signalling traffic.</p>"
