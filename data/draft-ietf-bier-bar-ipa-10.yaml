abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies general rules for the interaction between the
       BIER Algorithm (BAR) and the IGP Algorithm (IPA) used for underlay
       path calculation.  The semantics defined in this document update
       RFC8401 and RFC8444.</p>
