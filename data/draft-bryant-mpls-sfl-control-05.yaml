abstract:
- language: en
  script: Latn
  content: |-
    <p>In draft-ietf-mpls-sfl-framework the concept of MPLS synonymous flow
       labels (SFL) was introduced.  This document describes a control
       protocol that runs over an associated control header to request,
       withdrawn and extend the lifetime of such labels.</p>
