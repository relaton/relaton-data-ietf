abstract:
- language: en
  script: Latn
  content: "<p>A scheme to defend against cache poisoning attacks against the Domain\nName System (DNS) by predicting the ID and source port number of\noutgoing queries is described in this draft.  It proposes a new\nresource record to provide a mechanism to introduce additional\nentropy into DNS queries.</p>"
