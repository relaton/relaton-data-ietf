  script: Latn
  content: <p>This document describes a signalling solution for setup and maintenance
    of multi-hop pseudo-wires. This signalling solution is a natural extention of
    the method described in "Pseudowire Setup and Maintenance using LDP" [PWE3-CTRL].
    The main purpose of this document is to solve the scaling issues in single hop
    pseudo-wire architectures.</p>
