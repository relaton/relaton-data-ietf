- language: en
  script: Latn
  content: "<p>This document means to clarify best current practices in the Internet
    community. Internet hosts should not contain globally routable Internet Protocol
    addresses embedded within firmware or elsewhere as part of their default configuration
    such that it influences run-time behavior.</p>"
