abstract:
- language: en
  script: Latn
  content: "<p>Per FEC framework, FEC source packet carries source FEC payload ID
    for FEC protection of arbitrary packet flow. This document specifies a FEC payload
    header and a source FEC payload mapping information unit (MIU) to enable carrying
    source FEC payload ID(s) in separate packet flow for FEC protection of sequence
    flow over unreliable transport. The FEC payload MIU consists of flexible source
    FEC payload ID(s) to be compatible with different FEC schemes.</p>"
