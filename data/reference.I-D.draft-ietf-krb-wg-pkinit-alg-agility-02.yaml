abstract:
- language: en
  script: Latn
  content: "<p>The PK-INIT defined in RFC 4556 is examined and updated to remove protocol
    structures tied to specific cryptographic algorithms. The affinity to SHA as the
    check-sum algorithm in the authentication request is analyzed. The PK-INIT key
    derivation function is made negotiable, the digest algorithms for signing the
    pre-authentication data and the client's X.509 certificates are made discoverable.
    These changes provide protection preemptively against vulnerabilities discovered
    in the future against any specific cryptographic algorithm, and allow incremental
    deployment of newer algorithms.</p>"
