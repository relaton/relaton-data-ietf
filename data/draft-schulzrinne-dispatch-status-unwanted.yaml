- language: en
  script: Latn
  content: |-
    <p>This document defines the 666 (Unwanted) SIP response code, allowing
       called parties to indicate that the call was unwanted.  The
       terminating SIP entity may use this information to adjust future call
       handling behavior for this called party or more broadly.</p>
