abstract:
- language: en
  script: Latn
  content: "<p>There are many web sites that give listings of IPv6 enabled service
    providers, or rate ISPs according to their IPv6 enabledness.  This document intends
    to gather information about currently known sites and their methods of checking
    an ISPs enabledness.  This document also summarizes a basic guideline that these
    listings may consider when checking an ISPs IPv6 enabledness.</p>"
