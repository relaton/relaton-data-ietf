abstract:
- language: en
  script: Latn
  content: "<p>We specify a new version of the Multimedia Internet Keying (MIKEY)
    protocol, MIKEYv2, tailored for the secure real-time transport protocol (SRTP).
    MIKEYv2 uses the same payloads and message formats as MIKEY; it supports mode
    negotiation, uses either SDP in the signaling path or UDP for transport, does
    not require time synchronization, and does not need SIP support for accessing
    end- point credentials.</p>"
