abstract:
- language: en
  script: Latn
  content: "<p>Implementation experience with RSVP-TE recovery signaling has\nuncovered some problems.  Associations between LSPs in different\nsessions are forbidden.  Protecting LSPs cannot themselves be\nprotected.  Overlapping repairs cause loss of traffic.  This draft\nprovides details of these problems for the community to consider.</p>"
