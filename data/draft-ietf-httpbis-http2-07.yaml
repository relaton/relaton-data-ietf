abstract:
- language: en
  script: Latn
  content: "<p>This specification describes an optimized expression of the syntax
    of the Hypertext Transfer Protocol (HTTP). HTTP/2.0 enables a more efficient use
    of network resources and a reduced perception of latency by introducing header
    field compression and allowing multiple concurrent messages on the same connection.
    It also introduces unsolicited push of representations from servers to clients.
    This document is an alternative to, but does not obsolete, the HTTP/1.1 message
    syntax. HTTP's existing semantics remain unchanged.</p>"
