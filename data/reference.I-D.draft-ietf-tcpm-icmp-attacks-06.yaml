abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the use of the Internet Control Message Protocol
    (ICMP) to perform a variety of attacks against the Transmission Control Protocol
    (TCP) and other similar protocols. Additionally, describes a number of widely
    implemented modifications to TCP's handling of ICMP error messages that help to
    mitigate these issues.</p>"
