abstract:
- language: en
  script: Latn
  content: "<p>Computing-Aware Traffic Steering (CATS) requires distribution of\n   computing metrics across the network to enable efficient traffic\n   steering decisions.  The Generic Autonomic Signaling Protocol (GRASP)\n   provides a distributed approach for autonomic node discovery, state\n   synchronization, and parameter negotiation in Autonomic Networking\n   (AN).  This document defines extensions to the GRASP protocol to\n   support the distribution of CATS metrics, by specifing the GRASP\n   Objective definition for CATS metrics, structured encodings,\n   distribution mechanisms tailored for dynamic and distributed network\n   scenarios such as edge computing.</p>"
