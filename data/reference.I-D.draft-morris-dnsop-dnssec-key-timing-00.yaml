abstract:
- language: en
  script: Latn
  content: "<p>RFC 4641 gives a detailed overview of the operational considerations
    involved in running a DNSSEC-secured zone, including key rollovers. This document
    expands on the previous work, and discusses timing considerations in greater depth.
    \ It explicitly identifies the relationships between the various time parameters,
    and gives a suggested algorithm for key rollover in a DNSSEC-secured zone.</p>"
