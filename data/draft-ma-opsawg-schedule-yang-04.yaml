abstract:
- language: en
  script: Latn
  content: "<p>This document defines a common schedule YANG module which is designed
    to be applicable for scheduling information such as event, policy, services, or
    resources based on date and time. For the sake of better modularity, the module
    includes basic, intermediate, and advanced versions of recurrence related groupings.</p>"
