abstract:
- language: en
  script: Latn
  content: "<p>This memo focused on hybrid packet and optical layer restoration architectures.
    We start with an initial description of general restoration related aspects, analyze
    various restoration schemes and focus on efficient inter-working between packet
    and optical layer restoration mechanisms. This analysis results in potential control
    protocols enhancements required to achieve the fast-restoration targets.</p>"
