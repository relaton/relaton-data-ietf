abstract:
- language: en
  script: Latn
  content: '<p>This document specifies the FAF Agent Format (.fafa): a declarative,
    YAML-based format for an agent''s identity, the capabilities it exposes, and the
    endpoints through which it is reached. A.fafa document describes an agent; it
    never instructs one..fafa (application/vnd.fafa+yaml, IANA-registered June 2026
    in the vendor tree) is the agent member of the FAF family, alongside.faf (project
    context) and.fafm (agent memory). It functions as a portable passport that answers
    four questions: who the agent is, what it may do, where it is reached, and what
    it must never do. Protocol- native cards (for example A2A Agent Cards and MCP
    Server Cards) remain useful wire formats; repository instruction files such as
    AGENTS.md remain the ops briefing;.fafa complements them as a house- neutral source
    of truth that can be projected into those formats; it does not replace them. This
    document documents the existing IANA vendor-tree registration. No standards-tree
    registration is requested. A companion white paper, "Why Agents Need a Passport,"
    provides the production rationale and lifecycle framing.</p>'
