abstract:
- language: en
  script: Latn
  content: "<p>This document reconsiders the reasons why the use of /127 was regarded
    as harmful and reevaluates some rationales for using it for IPv6 point-to-point
    links.  This document adheres fundamentally to RFC 3627 [RFC3627].  The main difference
    is that the use of /127 IPv6 prefix length is no longer considered as harmful.</p>"
