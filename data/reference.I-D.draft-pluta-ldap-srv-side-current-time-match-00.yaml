abstract:
- language: en
  script: Latn
  content: "<p>This document extends the Lightweight Directory Access Protocol (LDAP)
    to support server side current time matching.  Matching of attribute values against
    an LDAP server's current time offers additional functionality with regard to authorization
    and fulfills enhanced data privacy requirements for restrictive environments.
    Therefore this specification defines four additional syntaxes and related matching
    rules useful for extensible matching in association with these syntaxes.  In addition
    and for general use the matching rules defined in this document are also applicable
    to any attribute type definitions that are using the 'Generalized Time' syntax.
    \ This specification also contains restrictive attribute type definitions demonstrating
    the usage of the introduced syntaxes and matching rules.</p>"
