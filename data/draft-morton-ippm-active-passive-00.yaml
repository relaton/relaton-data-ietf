abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo provides clear definitions for Active and Passive
       performance assessment.  The construction of Metrics and Methods can
       be described as Active or Passive.  Methods can take on some of the
       attributes of both, and we refer to these as Hybrid Methods.</p>
