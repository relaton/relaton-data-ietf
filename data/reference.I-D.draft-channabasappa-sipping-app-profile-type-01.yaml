abstract:
- language: en
  script: Latn
  content: "<p>The SIP User Agent profile delivery framework describes how a User
    Agent can retrieve its data using a variety of protocols and defines a SIP event
    package for notifications of changes to those profiles. This document extends
    that event package to support the application profile type.</p>"
