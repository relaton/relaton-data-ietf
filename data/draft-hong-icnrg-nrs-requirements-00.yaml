abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the motivation and requirements for Name Resolution
    Service (NRS) in ICN. The NRS in ICN is to translate object names into routing
    hints such as locators, where names are location-independent and locators are
    network addresses.</p>"
