abstract:
- language: en
  script: Latn
  content: "<p>DECoupled Application Data Enroute (DECADE) is going to develop a protocol
    that is used by a P2P application client to control its shared resource in the
    in-network storage, as well as store/retrieve the resource to/from the in-network
    storage.  This document enumerates requirements for this protocol, which should
    be considered when designing and implementation.</p>"
