title:
- language: en
  script: Latn
  content: Galois Counter Mode with Strong Secure Tags (GCM-SST)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-mattsson-cfrg-aes-gcm-sst-21
docidentifier:
- content: draft-mattsson-cfrg-aes-gcm-sst
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-07-05'
abstract:
- language: en
  script: Latn
  content: "<p>This document defines Galois Counter Mode with Strong Secure Tags\n   (GCM-SST), an Authenticated Encryption with Associated Data (AEAD)\n   algorithm that addresses several weaknesses of GCM.  GCM-SST can be\n   used with any keystream generator, not only 128-bit block ciphers.\n   Main differences from GCM are the introduction of a second\n   authentication subkey H_2, per-nonce derivation of both H and H_2,\n   and stricter usage limits.  Together, these changes yield\n   authentication tags with near-ideal forgery probabilities, including\n   reforgeability resistance.  All registered instances have an expected\n   number of forgeries E(F) ≈ v / 2^t, a property that GCM is far from\n   providing.  GCM-SST is designed for security protocols with replay\n   protection such as TLS, QUIC, SRTP, and PDCP, and provides hardware\n   and software performance comparable to GCM.  This document registers\n   nine AEAD algorithm instances using AES and Rijndael-256 in counter\n   mode, with tag lengths of 48, 96, and 112 bits.  GCM-SST has been\n   standardized by 3GPP for use with SNOW 5G, AES-256, and ZUC-256.</p>"
