abstract:
- language: en
  script: Latn
  content: "<p>This document defines the lifecycle model for the Secured Digital Lifecycle
    Protocol (SDLP). The lifecycle model specifies the canonical state machine used
    by all SDLP-governed objects, including the rules for state transitions, transformation
    events, duplication events, and materialization events. The lifecycle model provides
    a stable and predictable framework for describing how SDLP objects evolve over
    time while preserving identity, lineage, and security guarantees defined in companion
    SDLP specifications. This document updates and formalizes the lifecycle semantics
    originally introduced in draft-norton-sdlp-lifecycle-00.</p>"
