abstract:
- language: en
  script: Latn
  content: "<p>AI agents are increasingly expected to communicate across platforms,\n   organizations, clouds, edge environments, and administrative domains.\n   Ongoing work on agent protocols has started to address agent\n   description, discovery, authentication, authorization, invocation,\n   delegation, and collaboration.  These functions are essential, but\n   they generally treat the IP network as a transparent connectivity\n   substrate.\n\n   This document discusses IPv6 networking considerations for AI agent\n   communication.  It focuses on networking support after an agent has\n   been discovered by an application-layer or control-plane mechanism.\n   It discusses how stable Agent identifiers can be associated with IPv6\n   locators or Agent Gateways, how agent communication requirements can\n   be mapped to IPv6 or SRv6 forwarding policies, how limited agent-\n   related network context can be carried within controlled deployment\n   environments, and how network-layer telemetry can complement\n   application-layer audit records.\n\n   This document does not define a new agent discovery protocol, a new\n   application-layer agent collaboration protocol, or a new\n   authentication or authorization mechanism.  It is intended to be\n   complementary to existing and emerging agent discovery, identity,\n   authorization, auditing, and collaboration mechanisms.</p>"
