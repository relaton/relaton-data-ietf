abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes a flexible SR policy candidate path selection
       method. Based on the real-time resource usage and forwarding quality
       of candidate paths, the head node can perform dynamic path switching
       among multiple candidate paths in the SR policy.</p>
