- language: en
  script: Latn
  content: "<p>This document defines an OAuth Bearer session-credential extension
    for the Agent Enrollment Protocol (AEP). The extension lets an AEP Service issue
    an OAuth-style Bearer access token through the AEP Grant command while preserving
    baseline AEP client assertion authentication as the root of trust.</p>"
