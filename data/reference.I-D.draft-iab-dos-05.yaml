abstract:
- language: en
  script: Latn
  content: "<p>This document provides an overview of possible avenues for denial-of-
    service attack on Internet systems. The aim is to encourage protocol designers
    and network engineers towards designs that are more robust. We discuss partial
    solutions that reduce the effectiveness of attacks, and how some solutions might
    inadvertently open up alternative vulnerabilities.</p>"
