abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an SMTP extension with keyword \"EAML\" whereby an\n   SMTP server can declare that it is capable of handling longer email\n   addresses without any local-part or domain-part restriction set by\n   RFC 5321.\n\n   EAML stands for \"Email Address Maximum Length\".</p>"
