abstract:
- language: en
  script: Latn
  content: "<p>On inter-router point-to-point links, it is useful for security and
    other reasons, to use 127-bit IPv6 prefixes.  Such a practice parallels the use
    of 31-bit prefixes in IPv4 [RFC3021].  This document outlines some of these reasons
    and specifies that 127-bit IPv6 prefix lengths must be supported on such links.</p>"
