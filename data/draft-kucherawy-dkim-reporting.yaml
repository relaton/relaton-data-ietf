- language: en
  script: Latn
  content: "<p>This memo presents an extension to the DomainKeys Identified Mail (DKIM)
    specifications to allow public keys for verification to include a reporting address
    to be used to report message verification issues, and extends an Internet Message
    reporting format to be followed when generating such reports.</p>"
