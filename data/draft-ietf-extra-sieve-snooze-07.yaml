abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the "snooze" extension to the Sieve email
       filtering language.  The "snooze" extension gives Sieve the ability
       to postpone the delivery of an incoming email message into a target
       mailbox until a later point in time.</p>
