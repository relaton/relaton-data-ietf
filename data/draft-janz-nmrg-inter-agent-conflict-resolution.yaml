abstract:
- language: en
  script: Latn
  content: "<p>Network management is increasingly carried out by autonomous, AI-\n   driven agents that observe and act on the network and service state\n   they share.  Where their scopes overlap - the same managed entities,\n   resources, or objectives - their independent decisions can prove\n   mutually inconsistent, and such inter-agent conflict is, at bottom,\n   coordination that has not been put in place; the two are best studied\n   together.  This document maps the problem for network management:\n   where inter-agent conflict comes from, which families of mechanism\n   resolve it, and how those mechanisms are chosen and combined.  It\n   then turns that map on a case of current interest in the IETF - the\n   AI-based Network Management Agent (NMA) architecture - and offers six\n   recommendations for strengthening how that architecture handles\n   inter-agent conflict at its Agent-to-Agent interface.</p>"
