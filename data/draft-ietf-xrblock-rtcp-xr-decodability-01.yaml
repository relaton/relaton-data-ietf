abstract:
- language: en
  script: Latn
  content: "<p>Transport Stream (TS) is a standard container format used in the transmission
    and storage of multimedia data. Unicast/Multicast/ Broadcast MPEG-TS over RTP
    is widely deployed in IPTV systems. This document defines an RTP Control Protocol
    (RTCP) Extended Report (XR) Block that allows the reporting of decodability statistics
    metrics related to transmissions of MPEG-TS over RTP.</p>"
