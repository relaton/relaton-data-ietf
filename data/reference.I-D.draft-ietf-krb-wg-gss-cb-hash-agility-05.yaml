abstract:
- language: en
  script: Latn
  content: "<p>Currently, channel bindings are implemented using a MD5 hash in the
    Kerberos Version 5 Generic Security Services Application Programming Interface
    (GSS-API) mechanism [RFC4121].  This document updates RFC4121 to allow channel
    bindings using algorithms negotiated based on Kerberos crypto framework as defined
    in RFC3961.  In addition, because this update makes use of the last extensible
    field in the Kerberos client-server exchange message, extensions are defined to
    allow future protocol extensions.</p>"
