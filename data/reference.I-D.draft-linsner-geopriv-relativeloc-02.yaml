abstract:
- language: en
  script: Latn
  content: <p>This document defines additional civic address parameters for use in
    Location Objects [1], [2], and [4].  The format is based on the civic address
    definition of PIDF-LO.  These additional parameters allow expression of a relative
    location within a building or campus.  Conventions used in this document  In examples,
    "C:" and "S:" indicate lines sent by the client and server respectively.</p>
