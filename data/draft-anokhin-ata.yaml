abstract:
- language: en
  script: Latn
  content: "<p>This document describes a session-layer mechanism addressing a\n   requirement independently exhibited by emerging agentic communication\n   systems: the need for recipients to determine the authorization type\n   of the communicating party (a human-controlled credential or an AI\n   provider instance) before or during interaction.\n\n   The Authorization Type Attestation (ATA) protocol defines a\n   transport-layer extension that carries this authorization type using\n   existing hardware roots of trust (Secure Enclaves, FIDO2, TPM,\n   Confidential Computing) and PKI infrastructure.\n\n   ATA does not replace existing identity systems (mTLS, SPIFFE, OAuth\n   2.1, FIDO2).  ATA does not verify content authorship or model\n   behavior.  ATA provides a mechanism to carry authorization type at\n   the session layer, composably with TLS, QUIC, MLS, MCP, and A2A.</p>"
