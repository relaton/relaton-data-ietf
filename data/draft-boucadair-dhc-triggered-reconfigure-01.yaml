abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new DHCPv6 messages type: RECONFIGURE- REQUEST.
    This message is issued by a relay agent to notify a DHCPv6 server a change, which
    requires issuing a Reconfigure message, has occurred. This document updates RFC
    3315.</p>"
