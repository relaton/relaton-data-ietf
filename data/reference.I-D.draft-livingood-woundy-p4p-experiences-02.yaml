abstract:
- language: en
  script: Latn
  content: "<p>This document describes the experiences of Comcast, a large cable broadband
    Internet Service Provider (ISP) in the U.S., in a recent Proactive Network Provider
    Participation for P2P (P4P) technical trial.  This trial used iTracker technology
    being considered by the IETF, as part of what is currently known as the Application
    Layer Transport Optimization (ALTO) Birds of a Feather (BoF).</p>"
