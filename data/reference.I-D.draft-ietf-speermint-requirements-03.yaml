abstract:
- language: en
  script: Latn
  content: "<p>A number of use cases have been identified for session peering of voice
    and other types of multimedia traffic.  This memo captures some of the requirements
    that enable these use case scenarios.  In its current version, this document describes
    both general and use case specific requirements for session peering for multimedia
    interconnect.  It is intended to become an informational document linking the
    use cases with potential protocol solutions.</p>"
