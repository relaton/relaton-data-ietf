- language: en
  script: Latn
  content: <p>At one time, the RFC Editor published periodic snapshots of the "Internet
    Official Protocol Standards". These documents were known as xx00 documents, the
    most of which was published in May 2008. This document notes that the RFC Editor
    will no longer be publishing these snapshots as RFCs.</p>
