abstract:
- language: en
  script: Latn
  content: "<p>This document describes a container format for storing serializable
    metadata. It shall provide the possibility to store and share any kind of metadata,
    including encryption support. The idea is to create an open, universal and interoperable
    standard for storing and distributing every kind of metadata independent from
    media type or file format.</p>"
