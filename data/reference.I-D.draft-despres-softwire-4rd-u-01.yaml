abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a new packet format for IPv4 packets to traverse
    IPv6 networks.  Its purpose is to get, for Residual Deployment of public IPv4
    across IPv6 networks (4rd), the best of Encapsulation and Double-translation solutions.
    \ For this, it ensures end-to-end transparency of IPv6 networks to IPv4 packets,
    and makes it possible to configure existing IPv6 Operation &amp; Management tools
    so that they operate also on 4rd packets.</p>"
