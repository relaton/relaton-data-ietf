abstract:
- language: en
  script: Latn
  content: "<p>The Mobile IP working group is currently searching for a security solution
    that enables semi-secure, weak authentication between IPv6 Mobile Nodes and Correspondent
    Nodes in the the global Internet. Sub­ sequent Binding Updates messages will then
    be cryptographically integrity protected to prevent abuse of the mechanisms for
    route opti­ mization.</p>"
