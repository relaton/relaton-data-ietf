abstract:
- language: en
  script: Latn
  content: "<p>RFC 5988 [RFC5988] defined the way of indicating resources on the Web.
    This specification defines link relation types which may be used to express the
    relationships between a resource and an input form for constructing data submissions.
    Editorial Note (To be removed by RFC Editor) Distribution of this document is
    unlimited. Comments should be sent to the IETF Apps-Discuss mailing list (see
