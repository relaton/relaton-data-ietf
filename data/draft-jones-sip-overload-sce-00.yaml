- language: en
  script: Latn
  content: "<p>This memo describes a method of preventing overload of Session Initiation
    Protocol (SIP) servers through the calculation, conveyance, and usage of a value
    referred to as the Session Capacity Estimate (SCE), a value that summarily represents
    the capacity of a SIP server.</p>"
