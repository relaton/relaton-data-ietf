abstract:
- language: en
  script: Latn
  content: "<p>This document defines the OAuth Bearer session-credential grant type
    for the Agent Enrollment Protocol (AEP). The grant type lets an AEP Service issue
    an OAuth-style Bearer access token through the AEP Grant command while preserving
    baseline AEP client assertion authentication as the root of trust.</p>"
