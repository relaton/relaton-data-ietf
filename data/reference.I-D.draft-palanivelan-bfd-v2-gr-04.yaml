abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an extension for Bidirectional Forwarding Detection
    (BFD) to support Graceful restart, in complementing Graceful restart support of
    the underlying protocol.This shall work consistently irespective of the bfd mode
    or protocol or the type of restart.This document describes the challenges to bfd
    in surviving a graceful restart and a generic solution to succeed.The intention
    of this document is to provide a solution that works fine for all types of bfd
    implementations.</p>"
