  script: Latn
  content: "<p>The Mathematical Mesh ?The Mesh? is an end-to-end secure\n   infrastructure that facilitates the exchange of configuration and\n   credential data between multiple user devices.  This document\n   describes the use of the Mesh to store Web application information.\n\n   This document is also available online at\n   http://prismproof.org/Documents/draft-hallambaker-mesh-app-web.html .</p>"
