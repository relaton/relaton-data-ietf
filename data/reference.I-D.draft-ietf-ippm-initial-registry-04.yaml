abstract:
- language: en
  script: Latn
  content: "<p>This memo defines the Initial Entries for the Performance Metrics Registry.
    \ This version includes:  * Addition of Loss Ratio metric in various sections
    (multiple metrics per section).  * All section 4, 5, 6, 7, and 8 parameters reference
    YANG types for alternate data formats.  * implementation of standard naming format
    for parameters.  * implementation of many IANA early-review comments.  Still need:
    Add MBM metric entry.</p>"
