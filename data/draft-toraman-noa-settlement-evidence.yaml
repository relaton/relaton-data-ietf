abstract:
- language: en
  script: Latn
  content: "<p>This document defines a signed side artifact that records the observation,
    on a public ledger, of a payment authorization whose correlation value was committed
    before dispatch. The artifact references the authorization record and the execution
    grant by hash and does not modify either. It permits a Relying Party *that obtains
    ledger facts itself* to establish that a payment authorization bearing the correlation
    value *was consumed on the token contract and network the mandate itself committed
    to, transferring a stated value to a stated recipient*, and that the correlation
    value is recomputable from a specific authorization record, a specific single-
    use execution grant, and the parameter pre-image that record commits to. *It does
    not establish that any service was delivered, that any obligation was discharged,
    or that the payment achieved its purpose. It does not establish that the approving
    principal — as opposed to the payer key — authorized the transfer.* Those scope
    limits are permanent and are restated wherever this artifact is described.</p>"
