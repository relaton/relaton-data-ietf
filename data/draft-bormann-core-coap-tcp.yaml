abstract:
- language: en
  script: Latn
  content: "<p>CoAP (RFC 7252) is defined to be transported over datagram transports
    such as UDP or DTLS. For a number of applications, it may be useful to channel
    CoAP messages in a TCP connection. This draft discusses different ways to do that.</p>"
