abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a Management Information Base (MIB) for
    use with SNMP-based network management.  In particular, it defines objects for
    configuring, monitoring, and controlling routers that employ the Virtual Router
    Redundancy Protocol Version 3 for both IPv4 and IPv6 as defined in RFC XXXX (RFC-editor,
    this is currently draft- ietf-vrrp-unified-spec-05.txt).  This memo obsoletes
    RFC 2787.</p>"
