abstract:
- language: en
  script: Latn
  content: "<p>Multi-Topology Routing (MTR) is a technology to enable service differentiation
    within an IP network. Flexible Algorithm (FA) is another mechanism of creating
    a sub-topology within a topology using defined topology constraints and computation
    algorithm. In order to deploy mLDP (Multipoint label distribution protocol) in
    a network that supports MTR, FA, or other methods of signaling non-default IGP
    algorithms, mLDP is required to become topology and algorithm aware. This document
    specifies extensions to mLDP to support MTR, with an algorithm, in order for Multipoint
    LSPs(Label Switched Paths) to follow a particular topology and algorithm. It updates
    [RFC7307] by allocating eight bits from a previously reserved field to be used
    as the IGP Algorithm (IPA) field.</p>"
  format: text/html
