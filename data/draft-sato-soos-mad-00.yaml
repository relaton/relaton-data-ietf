abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Multi-Agent Delegation (MAD) protocol for
    the Sovereign Object OS (SOOS) governance architecture. It defines how authority
    is structured, propagated, and enforced when multiple AI agents coordinate in
    a SOOS-governed execution environment. The specification covers the Narrowing
    Property invariant for mandate delegation chains, SO Instance Topology types for
    multi-agent workflow patterns, SO Cluster coordination primitives for parallel
    and dynamic agent topologies, and the Orchestrator-Specialist interaction model.
    MAD is the multi-agent coordination complement to the governance primitives defined
    in draft-sato-soos-aep, draft-sato-soos-sov, and draft-sato-soos-mjwt.</p>"
