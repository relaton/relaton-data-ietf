abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a Management Information Base (MIB) for the
    Lightweight User Datagram Protocol (UDP-Lite, RFC 3828). It defines a set of new
    MIB entities to characterise the behaviour and performance of the transport layer
    entities using UDP-Lite. UDP-Lite resembles UDP (RFC 768), but differs from the
    semantics of UDP by the addition a single (socket) option. This adds the capability
    for variable-length data checksum coverage that can benefit a class of applications
    which prefer delivery of corrupted datagram payload data in preference to discarding
    the datagram.</p>"
