abstract:
- language: en
  script: Latn
  content: "<p>This document describes mechanisms for P2PSIP diagnostics.  It describes
    the usage scenarios and defines several simple methods for performing diagnostics
    in P2PSIP overlay networks.  It also describes the diagnostic information which
    is useful for the connection and node status monitoring.  The methods and message
    formats are specified as extensions to P2PSIP base protocol RELOAD.</p>"
