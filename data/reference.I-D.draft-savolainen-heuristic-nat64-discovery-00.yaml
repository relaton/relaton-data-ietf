abstract:
- language: en
  script: Latn
  content: "<p>Advanced hosts and applications benefit of the knowledge of an IPv6
    address, AAAA record, synthesis taking place in the network.  This draft describes
    a method for detecting presence of NAT64 and for learning Network-Specific Prefix
    used in the access network without support from the access network.  The method
    depends on existence of known IPv4-only domain name.  The information learned
    enables applications and hosts to to perform local IPv6 address synthesis and
    in some cases avoid NAT64.</p>"
