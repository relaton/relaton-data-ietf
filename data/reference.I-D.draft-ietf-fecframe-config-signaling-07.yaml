abstract:
- language: en
  script: Latn
  content: "<p>FEC Framework document [RFC6363] defines the FEC Framework Configuration
    Information necessary for the FEC framework operation. This document describes
    using existing signaling protocols such as Session Announcement Protocol (SAP),
    Session Initiation Protocol (SIP), Real Time Stream Protocol (RTSP) etc. to determine
    and dynamically communicate the Configuration information between sender(s) and
    receiver(s).</p>"
