- language: en
  script: Latn
  content: "<p>In developing IP-based Radio Access Networks, there are needs for reliable
    signaling. It is assumed that SCTP would provide the transport bearer for any
    signaling. This draft presents a general signaling architecture for IP-based Radio
    Access Networks.</p>"
