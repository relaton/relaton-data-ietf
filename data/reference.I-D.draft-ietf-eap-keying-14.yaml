abstract:
- language: en
  script: Latn
  content: <p>The Extensible Authentication Protocol (EAP), defined in [RFC3748],
    enables extensible network access authentication. This document provides a framework
    for the transport and usage of keying material generated by EAP authentication
    algorithms, known as "methods". It also specifies the EAP key hierarchy.</p>
