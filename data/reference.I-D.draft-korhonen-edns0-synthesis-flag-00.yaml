abstract:
- language: en
  script: Latn
  content: "<p>Advanced hosts and applications benefit of the knowledge of an IPv6
    address, AAAA record, and a possible synthesis taking place in the network.  This
    specification defines ENDS0 flag bits for communicating whether the synthesis
    is taking place, what is the used IPv6 address format, and the IPv6 prefix and
    suffix used by the DNS64.  The communicated information enables hosts to perform
    a local IPv6 address synthesis and to extract the IPv4 address out of the synthesized
    IPv6 address.</p>"
