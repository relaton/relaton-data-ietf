abstract:
- language: en
  script: Latn
  content: |-
    <p>This document presents a new feature in BGP that allows grouping of
       multiple BGP sessions between a pair of speakers and sending multiple
       nexthops for a single prefix.  This helps avoid sending and receiving
       duplicate routes across all sessions.</p>
