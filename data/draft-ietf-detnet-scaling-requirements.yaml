abstract:
- language: en
  script: Latn
  content: "<p>To support the scaling of deterministic networks, this document describes
    the technical and operational requirements for networks that exhibit large hop-to-hop
    latency variation, a large number of flows, and/or multiple domains that do not
    share a common time source. Applications with varying levels of determinism coexist
    and are transported in such a network. This document also describes the corresponding
    Deterministic Networking (DetNet) data plane enhancement requirements.</p>"
  format: text/html
