abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Dynamic calculation SAVNET mechanism by extending
    IGP protocol in intra-domain scenarios. This mechanism can propagate SAV-related
    information through IGP messages to help routers automatically generate accurate
    SAV rules which are for checking the validity of data packets.</p>"
