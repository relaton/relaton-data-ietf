- language: en
  script: Latn
  content: <p>This memo suggests a method for workstations to dynamically access mail
    from a mailbox server ("respository").  This RFC specifies a standard for the
    SUMEX-AIM community and a proposed experimental protocol for the Internet community.  Discussion
    and suggestions for improvement are requested.</p>
