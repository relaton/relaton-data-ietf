abstract:
- language: en
  script: Latn
  content: "<p>Delegated B2B Authorization enables a third-party OAuth client to\n   obtain a limited access to an HTTP service on behalf of another OAuth\n   client which is acting as a resource owner.\n\n   This specification extends the OAuth 2.0 Authorization Framework with\n   two new endpoints which allow a resource owner OAuth client to manage\n   access for a third-party OAuth client.</p>"
