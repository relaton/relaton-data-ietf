abstract:
- language: en
  script: Latn
  content: "<p>Managing energy consumption of devices is different from several well
    understood network management functions because of the special nature of energy
    supply and use. This document explains issues of energy management arising from
    its special nature and proposes a layered reference model for energy management
    addressing these issues.</p>"
