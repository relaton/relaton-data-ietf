abstract:
- language: en
  script: Latn
  content: "<p>This document discusses an operational gap in Multicast-Only Fast Reroute
    when failures occur inside an upstream multicast path but do not cause a visible
    RIB or RPF change at the merge point. The document motivates the need for a scalable
    path-liveness mechanism that can detect such hidden multicast delivery failures
    without requiring expensive per-flow packet monitoring.</p>"
