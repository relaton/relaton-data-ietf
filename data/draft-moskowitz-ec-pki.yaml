abstract:
- language: en
  script: Latn
  content: "<p>This memo provides a guide for building a PKI (Public Key Infrastructure)
    of EC certificates using openSSL. Certificates in this guide can use either ECDSA
    or EdDSA. Along with common End Entity certificates, this guide provides instructions
    for creating IEEE 802.1AR iDevID Secure Device certificates.</p>"
