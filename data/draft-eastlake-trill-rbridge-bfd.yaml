abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a general channel for sending OAM (Operations,
    Administration, and Maintenance) messages between RBridges in a campus through
    an extension to the TRILL (Transparent Interconnection of Lots of Links) protocol.
    It further specifies use of this channel for the BFD (Bidirectional Forwarding
    Detection) protocol.</p>"
