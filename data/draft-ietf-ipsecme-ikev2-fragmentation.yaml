abstract:
- language: en
  script: Latn
  content: "<p>This document describes a way to avoid IP fragmentation of large Internet
    Key Exchange Protocol version 2 (IKEv2) messages. This allows IKEv2 messages to
    traverse network devices that do not allow IP fragments to pass through.</p>"
