abstract:
- language: en
  script: Latn
  content: |-
    <p>Specifications in W3C's Media Capture Task Force and WebRTC Working
       Group have need of a registry in which to maintain a list of
       constrainable properties for HTML media and other constrainable
       objects.  This document defines this registry.</p>
