- language: en
  script: Latn
  content: "<p>This document describes the use of the Bidirectional Forwarding Detection
    protocol over IPv4 and IPv6 for single IP hops. It further describes the use of
    BFD with OSPFv2, OSPFv3, and IS-IS. Comments on this draft should be directed
    to rtg-bfd@ietf.org.</p>"
