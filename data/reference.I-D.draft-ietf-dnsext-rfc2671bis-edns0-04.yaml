abstract:
- language: en
  script: Latn
  content: "<p>The Domain Name System's wire protocol includes a number of fixed fields
    whose range has been or soon will be exhausted and does not allow requestors to
    advertise their capabilities to responders.  This document describes backward
    compatible mechanisms for allowing the protocol to grow.  This document updates
    the EDNS0 specification (RFC2671) based on 10 years of deployment experience.</p>"
