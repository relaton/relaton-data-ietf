- language: en
  script: Latn
  content: "<p>The purpose of this document is to analyze several important use cases
    based on blockchain, including: blockchain based PKI for security device connection,
    blockchain as a service, interworking cross blockchain (exchange data and contracts
    cross different chains). Through case analysis, important scenarios and specific
    requirements are listed. Related solutions are also provided for easy understanding.</p>"
