abstract:
- language: en
  script: Latn
  content: "<p>This informational document describes ways to interconnect TRILL RBridges
    over WAN connections by using MPLS Pseudo Wire (PW) or Virtual Private LAN Service
    (VPLS) with existing TRILL and MPLS standards. It also describes the combination
    of RBridge and MPLS to provide a hierarchical scalable L2VPN.</p>"
