abstract:
- language: en
  script: Latn
  content: "<p>This document contains the Basic Network Policy and Filters (BNP IM)
    Information Model which provides a generic model for representing an ordered list
    of routing policy or filter rules. Filter rules which combine match-condition
    with action (forwarding or sets) are supported by this policy.</p>"
