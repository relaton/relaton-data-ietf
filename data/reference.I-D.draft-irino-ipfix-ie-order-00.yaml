abstract:
- language: en
  script: Latn
  content: "<p>This document describes about guideline of order of Information Elements
    of IPFIX protocol to create templates for exporters. This document aims at definition
    rules to generate same template from same selected Information Elements independently
    of difference of implementation. And then it can be expected for simple template
    management of collecting process and increasing speed or decreasing load of decoding
    of Information Elements.</p>"
