  content: "<p>This memo suggests a mechanism by which a user process may associate
    itself with the local SNMP agent on a host, in order to implement portions of
    the MIB. This mechanism would be local to the host.This is an Experimental Protocol
    for the Internet community. It does not specify an Internet standard.</p>"
