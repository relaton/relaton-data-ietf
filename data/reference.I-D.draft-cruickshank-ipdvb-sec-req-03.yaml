abstract:
- language: en
  script: Latn
  content: "<p>This document provides a threat analysis and derives security requirements
    for MPEG-2 transmission links using the Unidirectional Lightweight Encapsulation
    (ULE). It also provides the motivation for ULE link-level security. This work
    is intended as a work item of the ipdvb WG, and contributions are sought from
    the IETF on this topic.</p>"
