abstract:
- language: en
  script: Latn
  content: "<p>In this document we discuss current mobility extensions to IP layer
    multicast solutions. Problems arising from mobile group communication in general,
    in the case of multicast listener mobility and for mobile Any Source Multicast
    as well as Source Specific Multicast senders are documented. Characteristic aspects
    of multicast routing and deployment issues for fixed IPv6 networks are summarized.
    The principal approaches to the multicast mobility problems are outlined subsequently.
    In addition to providing a comprehensive exploration of the mobile multicast problem
    and solution space, this document attempts to outline a conceptual roadmap for
    initial steps in standardization for the use of future mobile multicast protocol
    designers.</p>"
