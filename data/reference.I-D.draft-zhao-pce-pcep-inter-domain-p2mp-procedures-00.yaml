abstract:
- language: en
  script: Latn
  content: "<p>Point-to-multipoint (P2MP) Multiprotocol Label Switching (MPLS) and
    Generalized MPLS (GMPLS) Traffic Engineering Label Switched Paths (TE LSPs) may
    be established using signaling techniques, but their paths must first be determined.
    \ The Path Computation Element (PCE) has been identified as an appropriate technology
    for the determination of the paths of P2MP TE LSPs.  This document describes the
    procedures and extensions to the PCE communication Protocol (PCEP) to handle requests
    and responses for the computation of inter-domain paths for P2MP TE LSPs.</p>"
