abstract:
- language: en
  script: Latn
  content: "<p>Cryptographic algorithms go through multiple phases during their lifetime:
    experimental, adopted, generally available, in mainstream use, phasing out, deprecated,
    and obsoleted. This document defines phases for algorithm deployment lifecycles
    within DNSSEC, and criteria that the IETF and/or other Standards Development Organizations
    are encouraged to use when moving an algorithm from one phase to the next.</p>"
