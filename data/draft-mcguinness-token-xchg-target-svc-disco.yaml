abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a method for OAuth 2.0 clients to discover
    the set of available Token Exchange Targets (such as audiences, resources, scopes,
    and token types) for a given subject token when performing OAuth 2.0 Token Exchange.
    The discovery endpoint accepts a subject token of any type the authorization server
    supports, identified by a token type URI, and returns values that are valid inputs
    to subsequent Token Exchange requests, supporting advanced use cases such as identity
    chaining and cross-domain delegation.</p>"
