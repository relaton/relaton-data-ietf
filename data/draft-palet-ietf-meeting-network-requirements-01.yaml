  content: "<p>This document describe the minimum technical requirements for a facility
    to be able to host a successful IETF meeting. Includes also requirements for the
    terminal room and other technical requirements. This documents should be used
    as the minimum criteria during an on- site facility survey, to ensure the fulfilment
    of the IETF meeting needs.</p>"
