abstract:
- language: en
  script: Latn
  content: "<p>The Centralized Conferencing framework defines a model whereby client
    initiated interactions are required for creation, deletion, manipulation and querying
    the state of a of conference. This document defines a Session Initiation (SIP)
    Control Package for Conference Control for these client interactions. The SIP
    Control Package is based on the SIP Control Framework, which is also used for
    media control, thus optimizing the implementation for some clients.</p>"
