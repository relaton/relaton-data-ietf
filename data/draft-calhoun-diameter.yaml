abstract:
- language: en
  script: Latn
  content: "<p>The DIAMETER base protocol is intended to provide a AAA framework for\nMobile-IP, NASREQ and ROAMOPS. This draft specifies the message\nformat, transport, error reporting and security services to be used\nby all DIAMETER extensions and MUST be supported by all DIAMETER\nimplementations.</p>"
