abstract:
- language: en
  script: Latn
  content: "<p>This document describes how to create a conference using SIP URI-list
    services.  In particular, it describes a mechanism that allows a User Agent Client
    to provide a conference server with the initial list of participants using an
    INVITE-contained URI list.  [STANDARDS-TRACK]</p>"
