title:
- language: en
  script: Latn
  content: Session Initiation Protocol (SIP) Extension Header Field for Registering Non-Adjacent Contacts
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-willis-sip-path-08
docidentifier:
- content: draft-willis-sip-path
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2002-05-30'
abstract:
- language: en
  script: Latn
  content: "<p>The REGISTER function is used in a SIP system primarily to associate\na temporary contact address with an address-of-record.  This contact\nis generally in the form of a URI, such as Contact:\n&lt;sip:alice@pc33.atlanta.com&gt; and is generally dynamic and associated\nwith the IP address or hostname of the SIP UA.  The problem is that\nnetwork topology may have one or more SIP proxies between the UA and\nthe registrar, such that any request travelling from the user's home\nnetwork to the registered UA must traverse these proxies.  The\nREGISTER method does not give us a mechanism to discover and record\nthis sequence of proxies in the registrar for future use.  This\ndocument defines an extension header field, 'Path' which provides\nsuch a mechanism</p>"
