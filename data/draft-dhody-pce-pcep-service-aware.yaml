title:
- language: en
  script: Latn
  content: Extensions to the Path Computation Element Communication Protocol (PCEP) to compute service aware Label Switched Path (LSP).
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-dhody-pce-pcep-service-aware-05
