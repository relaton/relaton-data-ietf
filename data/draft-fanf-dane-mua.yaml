- language: en
  script: Latn
  content: "<p>This specification describes the effect that DNSSEC has on SRV-based
    autoconfiguration and TLS certificate verification in the mail user agent protocols
    IMAP, POP3, and message submission. It also describes how to use TLSA DNS records
    to provide stronger authentication of server TLS certificates.</p>"
