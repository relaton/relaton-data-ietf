abstract:
- language: en
  script: Latn
  content: "<p>IKEv2 is a component of IPsec used for performing mutual authentication
    and establishing and maintaining security associations (SAs).  Redirect Mechanism
    for IKEv2 proposes a mechanism for IKEv2 that enables a VPN gateway to redirect
    the VPN client to another VPN gateway, for example, based on the load condition.
    \ Redirect mechanism can also be used to redirect a client to another router (Trust
    Anchor) to do mutual authentication on behalf of the server.  After mutual authentication
    Trust Anchor can redirect the client back to the server with an Access Token which
    can be used as a pre-shared key between the server and client for password based
    IKE_AUTH exchange.  This document describes a mechanism to use IKEv2 redirects
    to offload such verifications to another trusted third party.</p>"
