abstract:
- language: en
  script: Latn
  content: <p>This document specifies, abstractly, how to interface applications and
    transport protocols with IPsec so as to create "channels" by "latching" connections
    to certain IPsec Security Association (SA) parameters for their lifetime. This
    can be used to protect applications against accidental reconfiguration of IPsec
    that might expose live packet flows to unintended peers, such as might happen
    with Better Than Nothing Security (BTNS). Latched connections represent IPsec
    channels, and as such, allow for channel binding to IPsec.</p>
