abstract:
- language: en
  script: Latn
  content: "<p>This document introduces use cases where Time-Variant Routing (TVR)
    computations (i.e., routing computations that take into consideration time-based
    or scheduled changes to a network) could improve routing protocol convergence
    and/or network performance.</p>"
