- language: en
  script: Latn
  content: "<p>This memo introduces a new PIM Hello MTU Option which is carried in
    PIM Hello messages. The MTU option enables interface MTU information to be exchanged
    among PIM neighbors, and PIM messages to be encapsulated in an efficient and consistent
    way.</p>"
