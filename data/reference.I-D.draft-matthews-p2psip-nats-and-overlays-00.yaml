abstract:
- language: en
  script: Latn
  content: <p>This document discusses the constraints that NATs put on the possible
    overlay architectures of a P2P SIP system. Given what seems to be a reasonable
    set of assumptions on where nodes are deployed and the kinds of NATs they are
    located behind, the document concludes that a structured partial-mesh overlay
    network exhibiting a property known as "symmetric interest" is the most reasonable
    overlay architecture.</p>
