abstract:
- language: en
  script: Latn
  content: "<p>When several RBridges are multi-accessed to a LAN link, each of them
    can act as the packet forwarder for the hosts attached to this link. One of the
    RBridges will be elected as the Designated RBridge (DRB) which is responsible
    to choose the Appointed Forwarder (AF) for each VLAN appearing on this LAN link.
    If the DRB casually assign a VLAN to an RBridge as the Appointed Forwarder without
    considering the number of the MAC addresses and traffic load of this VLAN, it
    may overload some of the RBridges while leave other RBridges lightly loaded. This
    unbalanced assignment issue reduces the scalability of a TRILL network and undermines
    its performance. Therefore, the TRILL DRB should choose Appointed Forwarders taking
    their load into consideration. The goal of this document is to design a new protocol
    to support the adaptive VLAN assignment (or Appointed Forwarder selection) based
    on the forwarders' reporting of their usage of MAC tables and available bandwidth.</p>"
