abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a Service Extensible Protocol (SEP), which is
    spoken between P2PSIP peers.  SEP uses a flexible forwarding mechanism to avoid
    congestion in the overaly.  It also proposes a general service discovery method
    and a built-in NAT traversal mechanism.  By using these methods, SEP tries to
    improve the success rate and reduce the latency of the transaction.</p>"
