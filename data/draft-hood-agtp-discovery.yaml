abstract:
- language: en
  script: Latn
  content: "<p>The Agent Transfer Protocol (AGTP) enables agents to communicate once
    they know each other's canonical identifiers. This document specifies two layered
    mechanisms by which agents find each other and by which human-readable names resolve
    to Canonical Agent-IDs: the DISCOVER method, which queries for agents matching
    a capability description, and the Agent Name Service (ANS), which provides governed
    name-to-Agent-ID resolution. The architectural relationship is layered. AGTP-Presence
    [AGTP-PRESENCE] provides ambient awareness of agents within visibility scopes
    as a substrate property. DISCOVER operates over the Presence substrate to query
    the live population. ANS provides human-readable name resolution, analogous to
    DNS for the web, with name authorities federating across organizational boundaries.
    This document also introduces Anticipatory Discovery Services (ADS) as a forward-looking
    composition pattern where application-layer services preload agent awareness based
    on observed operational signals. DISCOVER and ANS together provide the application-layer
    interfaces for discovery and naming that compose with the substrate-level ambient
    discovery defined in [AGTP-PRESENCE].</p>"
