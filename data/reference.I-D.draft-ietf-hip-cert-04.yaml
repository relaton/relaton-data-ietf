abstract:
- language: en
  script: Latn
  content: "<p>The CERT parameter is a container for X.509.v3 certificates and Simple
    Public Key Infrastructure (SPKI) certificates.  It is used for carrying these
    certificates in HIP control packets.  This document only specifies the certificate
    parameter and the error signaling in case of a failed verification.  The use of
    certificates including how certificates are obtained, requested, and which actions
    are taken upon successful or failed verification are to be defined in the documents
    that use the certificate parameter.  Additionally, this document specifies the
    representations of Host Identity Tags in X.509.v3 and SPKI certificates.</p>"
