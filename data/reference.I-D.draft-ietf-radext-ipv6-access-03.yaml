abstract:
- language: en
  script: Latn
  content: "<p>This document specifies IPv6 RADIUS attributes, which complement those
    of RFC3162, and are intended to be used in residential broadband networks, where
    specific user configuration information is expected to be passed as part of the
    AAA process between a NAS and an AAA server.  The attributes cover the assignment
    or reporting of the following; a specific host IPv6 address; a recursive DNS IPv6
    server address; a specific IPv6 route announced to a host; a named IPv6 delegated
    prefix pool to be used for assignments to an accessing host.</p>"
