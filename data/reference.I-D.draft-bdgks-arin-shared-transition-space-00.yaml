abstract:
- language: en
  script: Latn
  content: "<p>This memo encourages the reservation of a Shared Transition Space,
    an IPv4 prefix designated for local use within service provider networks during
    the period of IPv6 transition.  This address space has been proposed at various
    times in the IETF, and more recently by the ARIN policy development community.</p>"
