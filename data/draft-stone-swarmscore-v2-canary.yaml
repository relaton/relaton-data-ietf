abstract:
- language: en
  script: Latn
  content: "<p>SwarmScore V2 Canary extends the SwarmScore V1 two-pillar reputation
    protocol with a third dimension: Safety, measured via covert canary prompt testing.
    This document specifies five formally-analyzed design decisions for the canary
    testing subsystem: mandatory testing thresholds, hybrid response classification
    (pattern matching plus opaque LLM ensemble), dedicated test session placement,
    prompt library composition and rotation, and session isolation for buyer- harm
    prevention. V2 Canary is backwards-compatible with V1: all V1 scores remain unchanged.
    The five-pillar formula covers Technical Execution (300 pts), Commercial Reliability
    (300 pts), Operational Depth (150 pts), Safety (100 pts), and Identity Verification
    (150 pts).</p>"
