abstract:
- language: en
  script: Latn
  content: "<p>This document states the problems pertaining to automatic IPv6 address
    configuration and prefix allocation in MANETs.  This draft currently contains
    terminology, target scenarios and goals for MANET autoconfiguration.  Future versions
    of this document will also review the applicability of existing IPv6 address autoconfiguration
    and prefix allocation mechanisms, and security considerations.</p>"
