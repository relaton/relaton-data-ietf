abstract:
- language: en
  script: Latn
  content: "<p>This document describes a way to perform end-user authentication in
    the Simple Authentication and Security Layer (SASL) framework by re- using an
    external security layer (such as the Transport Layer Security (TLS) protocol)
    that may have already completed end-user authentication.  In comparison with the
    existing EXTERNAL mechanism, this mechanism alleviates the a priori assumptions
    made by the design of the EXTERNAL mechanism.  This mechanism transfers an identifier
    of the external channel to be used explicitly.  See &lt;http://josefsson.org/external-channel/&gt;
    for more information.</p>"
