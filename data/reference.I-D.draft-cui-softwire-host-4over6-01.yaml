abstract:
- language: en
  script: Latn
  content: "<p>This draft proposes a mechanism for bidirectional communication between
    IPv4 Internet and hosts in IPv6 access networks.  Adopting the Softwire hub &amp;
    spoke model, this mechanism uses IPv4-over-IPv6 tunnel to traverse the IPv6 networks.
    \ Particularly, this mechanism allocates a global IPv4 address to each endpoint
    (CPE or host), so bidirectional communication can be achieved between IPv4 Internet
    and hosts in IPv6 access networks.</p>"
