abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a generic interface enabling the integration\n   between a Multimedia Communication Framework such as a 3GPP IP\n   Multimedia Subsystem and Large Language Models (LLMs) or other AI-\n   based services that perform text, audio, video, image and service\n   processing.  A Multimedia Communication framework is a network\n   supporting voice, video and message services as a SIP network or the\n   IMS (IP Multimedia System) defined by 3GPP.  The interface is\n   designed to be platform-agnostic and flexible, allowing a connection\n   to different AI platforms e.g. LLMs independent of their underlying\n   technology or deployment environment.\n\n   This document is inspired by the IMS environment providing data\n   channel capabilities offering a variety of services within the\n   framework.  Such an interface allows advanced AI functions such as\n   natural language understanding, semantic analysis, and contextual\n   processing through a standardized, extensible and interoperable\n   interface.  This enables the IMS ecosystem to seamlessly adopt and\n   integrate emerging AI technologies to enrich communication services.</p>"
