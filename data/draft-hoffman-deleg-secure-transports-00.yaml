- language: en
  script: Latn
  content: "<p>The DELEG base protocol allows a DNS zone operator to specify servers
    to be used when delegating zones to other DNS nameservers. This document extends
    the base protocol to allow zone operators to specify secure transports for those
    delegations.</p>"
