- language: en
  script: Latn
  content: |-
    <p>Payloads used in Remote Attestation Procedures may require an
       associated media type for their conveyance, for example when used in
       RESTful APIs.

       This memo defines media types to be used for Entity Attestation
       Tokens (EAT).</p>
