abstract:
- language: en
  script: Latn
  content: "<p>This memo defines URI fragment identifiers for text/plain MIME entities.
    These fragment identifiers make it possible to refer to parts of a text/plain
    MIME entity, identified by character count or range, line count or range, or a
    regular expression. These identification methods can be combined to identify more
    than one sub- resource of a text/plain MIME entity. Fragment identifiers may also
    contain hash information to make them more robust.</p>"
