- language: en
  script: Latn
  content: "<p>This memo defines an MPLS and PW payload ID. It describes how an MPLS
    payload ID may be used to address a number of issues associated with proprietary
    ECMP deployments. It describes how when used with PWs permits OAM and control
    protocols to be multiplexed with a PW.</p>"
