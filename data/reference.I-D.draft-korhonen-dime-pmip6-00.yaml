abstract:
- language: en
  script: Latn
  content: "<p>This specification defines the Diameter support for the Proxy Mobile
    IPv6. The policy information needed by the Proxy Mobile IPv6 is defined in mobile
    node's policy profile, which gets downloaded from the Diameter server to the Mobile
    Access Gateway once the mobile node roams into a Proxy Mobile IPv6 Domain and
    performs the access authentication. The access authentication procedure into the
    Proxy Mobile IPv6 Domain resembles the Mobile IPv6 integrated scenario bootstrapping.
    Rather than defining a completely new set of attributes or a new Diameter application
    this specification only leverages the work already done for the Mobile IPv6 bootstrapping.</p>"
