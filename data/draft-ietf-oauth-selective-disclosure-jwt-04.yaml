  script: Latn
  content: "<p>This document specifies conventions for creating JSON Web Token (JWT)
    documents that support selective disclosure of JWT claims. Discussion Venues This
    note is to be removed before publishing as an RFC. Discussion of this document
    takes place on the Web Authorization Protocol Working Group mailing list (oauth@ietf.org),
