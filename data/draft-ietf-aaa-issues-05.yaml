abstract:
- language: en
  script: Latn
  content: "<p>The AAA Evaluation Team's recommendation document raised some issues
    with the DIAMETER protocol. The AAA WG has created a design team to address these
    issues. This document is an attempt to describe the problems, which the WG can
    then concentrate on solving.</p>"
