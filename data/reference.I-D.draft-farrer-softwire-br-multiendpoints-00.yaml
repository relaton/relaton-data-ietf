- language: en
  script: Latn
  content: "<p>This document defines a mechanism to enable an IPv4-over-IPv6 Softwire
    Border Router to support multiple tunnel endpoint on one BR instance.  This feature
    can be used to group users based on IPv6 tunnel endpoint addresses and achieve
    high availability.</p>"
