abstract:
- language: en
  script: Latn
  content: "<p>This document encourages the practice of permitting DNS messages to
    be carried over TCP on the Internet.  This includes both DNS over unencrypted
    TCP, as well as over an encrypted TLS session.  The document also considers the
    consequences with this form of DNS communication and the potential operational
    issues that can arise when this best current practice is not upheld.</p>"
