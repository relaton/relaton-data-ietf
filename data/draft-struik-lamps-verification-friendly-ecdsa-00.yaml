abstract:
- language: en
  script: Latn
  content: "<p>This document specifies how to represent ECDSA signatures so as to
    facilitate fast verification of single signatures and fast batch verification.
    We illustrate that this technique can be applied retroactively by any device (rather
    than only by the signer), thereby facilitating transitioning to always generating
    ECDSA signatures in this way.</p>"
