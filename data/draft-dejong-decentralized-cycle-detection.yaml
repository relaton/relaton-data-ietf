- language: en
  script: Latn
  content: |-
    <p>Decentralized Cycle Detection is node-to-node messaging protocol for
       finding cycles in networks.  It differs from some other cycle finding
       algorithms in that it does not require a central coordinator or a
       bird's-eye view of the network.</p>
