abstract:
- language: en
  script: Latn
  content: "<p>Calendar sharing and scheduling enable a user to subscribe to receiving
    calendar information from other users' calendars as well as scheduling of various
    calendar events among a set of users. This memo defines Session Initiation Protocol
    (SIP) event packages for calendar sharing and scheduling.</p>"
