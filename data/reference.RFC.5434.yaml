abstract:
- language: en
  script: Latn
  content: "<p>This document discusses tactics and strategy for hosting a successful
    IETF Birds-of-a-Feather (BOF) session, especially one oriented at the formation
    of an IETF Working Group.  It is based on the experiences of having participated
    in numerous BOFs, both successful and unsuccessful. [STANDARDS-TRACK]</p>"
