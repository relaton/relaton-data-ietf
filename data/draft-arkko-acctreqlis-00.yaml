abstract:
- language: en
  script: Latn
  content: "<p>Over the years, as Internet services have evolved, sophisticated inter-domain
    applications such as roaming, voice over IP, Internet fax, and QoS provisioning
    have arisen. This document discusses whether accounting for these services services
    can be reliably and securely accomplished using established techniques, and explores
    the requirements for Internet-scale Accounting Management.</p>"
