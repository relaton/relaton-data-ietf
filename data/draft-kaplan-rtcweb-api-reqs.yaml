abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the advantages and disadvantages of several
    proposed approaches to what type of API and architectural model WebRTC Browsers
    should expose and use. The document then defines the requirements for an API that
    treats the Browser as a library and interface as opposed to a self-contained application
    agent.</p>"
