abstract:
- language: en
  script: Latn
  content: "<p>This document proposes extensions to the IGP Flexible Algorithm.  It\n   introduces a mechanism to exclude links exceeding a specified packet\n   loss rate threshold during path computation.  The solution leverages\n   existing link packet loss advertisement via IS-IS and OSPF, and\n   defines new constraints for Flex-Algorithm path calculation.</p>"
