abstract:
- language: en
  script: Latn
  content: "<p>This draft formulates a security problem statement.  The problem arises
    when a Host uses its Global Unicast Address (GUA) to communicate with another
    Host situated on the same link.</p>"
- language: en
  script: Latn
  content: "<p>To address this problem, we suggest to select and use addresses of
    a least scope that are common.</p>"
