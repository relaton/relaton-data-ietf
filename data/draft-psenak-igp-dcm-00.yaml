abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Distributed Congestion Mitigation (DCM)
    mechanism using the Interior Gateway Protocols (IGPs) such as IS-IS [RFC1195],
    OSPFv2 [RFC2328], or OSPFv3 [RFC5340]. DCM is a tactical, distributed mechanism,
    designed to mitigate network congestion by offloading traffic to an alternate,
    congestion-free paths. DCM is fully integrated in IGPs.</p>"
