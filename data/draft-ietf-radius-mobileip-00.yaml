abstract:
- language: en
  script: Latn
  content: "<p>RFC 2002 describes the framework for Mobile IP, while RFC 2290 describes
    how a mobile node and a peer negotiate the appropriate use of Mobile IP over a
    PPP link, through use of the IPCP IP Address and Mobile-IPv4 Configuration Options.
    This document describes how Mobile IP is supported within RADIUS.</p>"
