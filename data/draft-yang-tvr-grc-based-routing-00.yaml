abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes a dynamic routing mechanism for Low Earth
       Orbit(LEO) satellite networks based on geographic region coding.  By
       decoupling IP addressing from physical location, the mechanism uses
       hierarchical geographic grid codes (inspired by Uber's H3 spatial
       index) as temporary IP addresses for satellites.  Routing decisions
       are made based on the relative geographic position encoded in the
       destination address, rather than traditional prefix-based IP routing.
       Satellite ephemeris data is leveraged to pre-compute routing tables
       for discrete time slices, eliminating the need for real-time link-
       state flooding and enabling stable, predictable routing in highly
       dynamic satellite topologies.</p>
