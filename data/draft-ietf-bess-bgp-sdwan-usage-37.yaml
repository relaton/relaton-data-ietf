abstract:
- language: en
  script: Latn
  content: "<p>This document illustrates how a BGP-based control plane can be used
    to manage large scale Software Defined WAN (SD-WAN) overlay networks by distributing
    edge service reachability information, WAN port attributes, and underlay path
    details, thereby minimizing manual provisioning. In such deployments, BGP can
    provide a standards-based mechanism for distributing information that may otherwise
    be exchanged using proprietary SD-WAN control-plane mechanisms. However, extensions
    to BGP are needed to achieve that goal.</p>"
