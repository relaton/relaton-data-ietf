abstract:
- language: en
  script: Latn
  content: "<p>This document provides a general framework for describing network traffic
    flows, presents an architecture for traffic flow measurement and reporting, discusses
    how this relates to an overall network traffic flow architecture and indicates
    how it can be used within the Internet. This memo provides information for the
    Internet community.</p>"
