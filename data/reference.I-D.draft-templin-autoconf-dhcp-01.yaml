abstract:
- language: en
  script: Latn
  content: "<p>Mobile Ad-hoc Networks (MANETs) comprise MANET routers and their attached
    devices, and connect to the global Internet via one or more MANET gateways. MANET
    routers that require global Internet access must have a way to automatically configure
    globally routable and unique IP addresses/prefixes. This document specifies mechanisms
    for MANET autoconfiguration (AUTOCONF) based on the Dynamic Host Configuration
    Protocol (DHCP). Solutions for both IPv4 and IPv6 are given.</p>"
