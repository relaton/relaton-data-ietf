abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the object oriented information model for \nrepresenting
    policy information associated with the provisioning of \nIP VPN services, that
    include the configuration information related \nto the setup of the IP VPN connectivity,
    and may also include the \nconfiguration information related to the activation
    of the following \nelementary functions: firewall, address translation, quality
    of \nservice, encryption.</p>"
