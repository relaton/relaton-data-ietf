abstract:
- language: en
  script: Latn
  content: <p>The United States Government has published guidelines for "NSA Suite
    B Cryptography", which defines cryptographic algorithm policy for national security
    applications.  This document specifies a profile of the Certificate Management
    over CMS (CMC) protocol for managing Suite B X.509 public key certificates.  This
    profile is a refinement of RFC 5272, RFC 5273, and RFC 5274.</p>
