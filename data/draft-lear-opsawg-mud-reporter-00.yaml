- language: en
  script: Latn
  content: |-
    <p>As with other technology, manufacturers would like to understand how
       networks implementing MUD are treating devices that are providing MUD
       URLs and MUD files.  This memo specifies an extension to MUD that
       permits certain behaviors to be reported.</p>
