- language: en
  script: Latn
  content: "<p>Two DNS names may have the same DNS administrative boundaries for some
    services.  This document adds the function of lookup of domain name administrative
    boundary to domain name system, which describes a new method for using dbound
    resource record for judging domain name administrative boundaries.</p>"
