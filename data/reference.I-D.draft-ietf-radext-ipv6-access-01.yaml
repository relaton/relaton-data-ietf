abstract:
- language: en
  script: Latn
  content: "<p>IPv6 nodes can have configuration information provided to them using
    DHCPv6 and/or Router Advertisements.  This document specifies RADIUS attributes
    that complement RFC3162 for use with DHCPv6 and/or Router Advertisements (RAs)
    and their application in broadband network access.</p>"
