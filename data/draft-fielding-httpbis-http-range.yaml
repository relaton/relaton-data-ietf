abstract:
- language: en
  script: Latn
  content: "<p>The Hypertext Transfer Protocol (HTTP) is a stateless application-\n   level protocol for distributed, collaborative, hypertext information\n   systems.  This document defines range requests and the rules for\n   constructing and combining responses to those requests.\n\n   This document obsoletes RFC 7233.</p>"
