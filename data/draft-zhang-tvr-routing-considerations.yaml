abstract:
- language: en
  script: Latn
  content: "<p>Time-Variant Routing (TVR) introduces a scenario of calculating a\n   path, or sub-path within a network, taking into account the timing of\n   message transmission or receipt as an integral part of the overall\n   route computation.  This document introduces three modes of routing\n   computation for TVR scenario.</p>"
