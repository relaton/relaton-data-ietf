  primary: true
date:
- type: published
  at: '2026-04-05'
abstract:
- language: en
  script: Latn
  content: "<p>This document updates RFC 1928 by formally deprecating the FRAG\n   (Fragment) field in the SOCKS5 UDP ASSOCIATE request header.  It\n   mandates that the FRAG field MUST be set to X'00' by clients and that\n   proxies MUST drop any SOCKS5 UDP packets containing a non-zero FRAG\n   value.  This change aligns the SOCKS5 protocol with modern Internet\n   engineering practices regarding UDP fragmentation (BCP 227),\n   simplifies proxy implementations, and eliminates a vector for\n   resource exhaustion attacks.</p>"
