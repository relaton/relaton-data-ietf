abstract:
- language: en
  script: Latn
  content: <p>Saratoga is a simple, lightweight, UDP-based transfer protocol.  This
    is a companion document to the Saratoga specification, given in draft-wood-tsvwg-saratoga.  This
    document describes how to use Saratoga as a Delay-Tolerant Networking (DTN) "convergence
    layer" with the DTN Bundle Protocol, and with DTN Bundle Agents.</p>
