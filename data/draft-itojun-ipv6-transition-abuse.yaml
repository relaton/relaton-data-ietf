abstract:
- language: en
  script: Latn
  content: "<p>The document talks about possible abuse of IPv6 transition technologies,
    which may lead to denial-of-service (DoS) attacks and other problems. IPv6 transition
    technologies, namely IPv6 over IPv4 tunnelling specifications and some others,
    have room for abuse by malicious parties. Detailed descriptions and possible workarounds
    are supplied.</p>"
