abstract:
- language: en
  script: Latn
  content: "<p>This grant is made to help facilitate inclusion of certain patented
    search address technology covering network device mapping in IETF standards-track
    Management Information Base (MIB) modules.  This memo provides information for
    the Internet community.  This memo does not specify an Internet standard of any
    kind.</p>"
