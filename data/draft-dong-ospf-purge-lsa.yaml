- language: en
  script: Latn
  content: "<p>In some scenarios current OSPF flushing mechanism may incur problem
    of delaying the deletion of invalid Link State Advertisement (LSA) and result
    in desynchronization of link state database. This document proposes a backward
    compatible solution to solve this problem.</p>"
