abstract:
- language: en
  script: Latn
  content: "<p>This document defines an alternative connection model for Message Session
    Relay Protocol (MSRP) User Agents (UAs), which uses the connection-oriended media
    (COMEDIA) mechanism in order to create the MSRP transport connection.  The model
    allows MSRP UAs behind Network Address Translators (NATs) to negotiate which UA
    will initiate the establishment of the TCP connection, in order for MSRP messages
    to traverse the NAT.</p>"
