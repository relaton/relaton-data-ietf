abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the UnifiedBus over Ethernet (UBoE) protocol,
    which enables seamless interconnection between native UnifiedBus (UB) domains
    and standard Ethernet/IP network for AI and HPC high- performance scenarios. It
    defines the UBoE packet encapsulation based on IPv4/IPv6 and UDP over Ethernet,
    including the invariant CRC (ICRC) integrity protection for end-to-end packet
    verification. This document further specifies the cross-domain packet conversion
    and header adaptation behaviors at UB2E switches, including bidirectional mapping
    rules for UB-specific network layer and IP network layer.</p>"
