abstract:
- language: en
  script: Latn
  content: <p>The document describes a mechanism allowing the use of Duplicate Address
    Detection (DAD) by IPv6 nodes in a VLAN N:1 with "split- horizon" model DSL architecture.  Based
    on the DAD signalling, the first hop router stores all used addresses on the VLAN
    in a Binding Table.  When a node performs DAD for an address already used by another
    node, the first hop router replies instead of this last one.</p>
