abstract:
- language: en
  script: Latn
  content: "<p>This document describes an optional extension for DCCP congestion-
    control CCIDs that are based on TCP-Friendly Rate Control (TFRC).  The extension
    improves the accuracy of parameter estimation at the TFRC receiver, by periodically
    communicating the (more precise) RTT estimate available at the sender.</p>"
