abstract:
- language: en
  script: Latn
  content: "<p>This paper considers some IPv6 issues for residential networks, including
    address scoping and firewalls. The paper describes IPv6 usage in the UPnP Forums's
    Device Architecture standard; some clarifications and changes are considered.
    The paper seeks comments on IPv6 address usage, address selection, and the need
    to develop best practices for IPv6 firewall traversal.</p>"
