abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines a TLS Extension that enables a TLS server to
       support "pinning" to a self-chosen signing key.  A client contacting
       a pinned host will require the server to present a signature from the
       signing key over the TLS server's public key.</p>
