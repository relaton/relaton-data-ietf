abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a Power Conserving Path Placement Strategy\n   (PCPPS).  During periods of low demand, PCPPS concentrates traffic\n   onto a small set of network resources.  This causes other network\n   resources to become idle or nearly idle.  When demand increases,\n   PCPPS redistributes traffic as required.</p>"
