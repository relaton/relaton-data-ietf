abstract:
- language: en
  script: Latn
  content: |-
    <p>This document aims to document consensus on the CAPPORT architecture.
       DHCP or Router Advertisements, an optional signaling protocol, and an
       HTTP API are used to provide the solution.  The role of Provisioning
       Domains (PvDs) is described.</p>
