abstract:
- language: en
  script: Latn
  content: "<p>Virtual Subnet is a L3VPN-based subnet extension solution which can
    be used to build Layer3 network virtualization overlays within and/or across data
    centers. This document describes a mechanism for reducing the FIB size of PE routers
    in the Virtual Subnet context.</p>"
