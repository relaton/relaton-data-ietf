abstract:
- language: en
  script: Latn
  content: "<p>The Simple Two-Way Active Measurement Protocol (STAMP), as defined
    in RFC 8762, can be utilized for active measurement without relying on a control
    channel to pre-signal session parameters. This document describes the extensions
    to IS-IS, OSPF, BGP-LS, and BGP protocols for signaling STAMP reflector parameters
    in a network. The STAMP reflector parameters can be used by the STAMP senders
    to set up appropriate performance measurement sessions for delay and packet loss
    metrics.</p>"
