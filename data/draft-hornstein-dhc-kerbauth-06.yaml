abstract:
- language: en
  script: Latn
  content: "<p>This document describes how Kerberos V may be used in order to allow
    a DHCP client and server to mutually authenticate as well as to protect the integrity
    of the DHCP exchange. The protocol described in this document is capable of handling
    both intra-realm and inter-realm authentication.</p>"
