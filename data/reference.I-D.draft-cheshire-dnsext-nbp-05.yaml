abstract:
- language: en
  script: Latn
  content: <p>One of the implicitly understood goals amongst the participants working
    on "Multicast DNS", "Link-Local Multicast Name Resolution", "Zeroconf Name Service",
    "Bonjour" (or whatever you like to call it) is the ability to retire AppleTalk
    Name Binding Protocol, NetBIOS naming, and the like, and replace them with an
    all-IP solution. This document outlines the specific properties required of an
    IP replacement for AppleTalk Name Binding Protocol.</p>
