  content: "<p>From time to time, the Internet Architecture Board (IAB) publishes
    documents as Requests for Comments (RFCs). This document defines the process by
    which those documents are produced, reviewed, and published in the RFC Series.
    This memo provides information for the Internet community.</p>"
