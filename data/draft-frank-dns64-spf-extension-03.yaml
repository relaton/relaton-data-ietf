abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes interoperability issues and resolutions
       between DNS64 and SPF records for mail transfer agents.  This
       document also aims to simplify the IPv6 migration for mail transfer
       agent operators.

       This document updates [RFC6147] and [RFC7208].</p>
