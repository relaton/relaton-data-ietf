abstract:
- language: en
  script: Latn
  content: |-
    <p>This document explains why the IAB believes that, when there is a
       conflict between the interests of end users of the Internet and other
       parties, IETF decisions should favour end users.  It also explores
       how this can more effectively be achieved.</p>
