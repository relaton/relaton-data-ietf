abstract:
- language: en
  script: Latn
  content: "<p>This document describes extensions to the Address Resolution Protocol
    to distribute MPLS labels for IPv4 and IPv6 host addresses. Distribution of labels
    via ARP enables simple plug-and-play operation of MPLS, which is key to deploying
    MPLS in data centers and enterprises.</p>"
