abstract:
- language: en
  script: Latn
  content: "<p>This document describes fault detection and localization mechanism
    for MPLS TP ring network using dedicated control node and bidirectional periodical
    status OAM message. The mechanism takes advantage of ring topology and greatly
    reduces OAM sessions and messages among nodes in the ring.</p>"
