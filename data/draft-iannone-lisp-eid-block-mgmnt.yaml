abstract:
- language: en
  script: Latn
  content: "<p>This document proposes an allocation framework for the management of
    the LISP EID address prefix (requested in [I-D.ietf-lisp-eid-block]). The framework
    described relies on hierarchical distribution of the address space with sub-prefixes
    allocated on a temporary basis to requesting organizations.</p>"
