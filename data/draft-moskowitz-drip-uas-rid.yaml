abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes the use of Hierarchical Host Identity Tags
       (HHITs) as a self-asserting and thereby trustable Identifier for use
       as the UAS Remote ID.  HHITs include explicit hierarchy to provide
       Registrar discovery for 3rd-party ID attestation.</p>
