abstract:
- language: en
  script: Latn
  content: |-
    <p>This document provides a YANG data model for the IETF Network Slice
       Controller (NSC) Northbound Interface (NBI).  The model can be used
       by a IETF Network Slice customer to request configuration, and
       management IETF Network Slice services from the IETF NSC.</p>
