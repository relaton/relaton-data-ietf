abstract:
- language: en
  script: Latn
  content: "<p>IETF Internet Architecture Board (IAB) expressed nine architecture-level
    considerations for the Open Pluggable Edge Services (OPES) framework.  This document
    describes how OPES addresses those considerations.  This memo provides information
    for the Internet community.</p>"
