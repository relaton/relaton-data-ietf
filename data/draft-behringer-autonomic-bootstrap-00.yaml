abstract:
- language: en
  script: Latn
  content: "<p>This document describes a use case for a specific autonomic functionality:
    Securely bootstrapping new devices into a network, without the need for pre-staging.
    The goal is to illustrate a requirement from network operators, and to illustrate
    how autonomic approaches can solve this use case.</p>"
