abstract:
- language: en
  script: Latn
  content: "<p>The Secure Sockets Layer version 3.0 (SSLv3), as specified in RFC 6101,
    is not sufficiently secure.  This document requires that SSLv3 not be used.  The
    replacement versions, in particular, Transport Layer Security (TLS) 1.2 (RFC 5246),
    are considerably more secure and capable protocols.</p>"
- language: en
  script: Latn
  content: "<p>This document updates the backward compatibility section of RFC 5246
    and its predecessors to prohibit fallback to SSLv3.</p>"
