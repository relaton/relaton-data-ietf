- language: en
  script: Latn
  content: |-
    <p>This document defines a COPS Client-Type for Multicast Control
       Protocol (MCOP) and the encapsulation for transmitting MCOP messages
       over COPS.  The document also defines message formats when MCOP over
       COPS is used for MCOP operation for first hop routers.</p>
