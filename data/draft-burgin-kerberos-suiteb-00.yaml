abstract:
- language: en
  script: Latn
  content: |-
    <p>The United States Government has published guidelines for "NSA
       Suite B Cryptography" dated July, 2005, which defines cryptographic
       algorithm policy for national security applications.  This document
       specifies the conventions for using Suite B algorithms in the
       Kerberos 5 protocol specification.</p>
