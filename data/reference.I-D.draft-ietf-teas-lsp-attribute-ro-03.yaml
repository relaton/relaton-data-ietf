abstract:
- language: en
  script: Latn
  content: "<p>RFC5420 extends RSVP-TE to specify or record generic attributes which
    apply to the whole of the path of an Label Switched Path (LSP).  This document
    defines an extension to the RSVP Explicit Route Object (ERO) and Record Route
    Object (RRO) objects to allow it to specify or record generic attributes which
    apply to a given hop.</p>"
