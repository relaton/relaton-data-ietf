abstract:
- language: en
  script: Latn
  content: "<p>This document suggests improvements to OSPF v2 Graceful Restart. The
    basic protocol working remains as specified in [OSPFGR]. The draft describes a
    two pronged approach for improving the current graceful restart mechanism. It
    improves the restarting router�s ability to detect and react to topology changes.
    It also reduces the conservative behavior of the helper router in reacting to
    topology changes.</p>"
