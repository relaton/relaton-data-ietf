abstract:
- language: en
  script: Latn
  content: "<p>An Extended Master Session Key (EMSK) is a cryptographic key generated
    from an Extensible Authentication Protocol (EAP) exchange reserved solely for
    the purpose of deriving master keys for one or more purposes identified as usage
    definitions. This memo specifies a mechanism for avoiding conflicts between root
    keys by deriving cryptographically separate keys from the EMSK. This document
    also describes a usage for domain specific root keys made available to and used
    within specific administrative domains.</p>"
