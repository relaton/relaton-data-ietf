abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the current sockets API for Host
    Identity Protocol (HIP).  The extensions focus on the initial discovery of public-key
    based identifiers.  Using the extensions, the application can verify that the
    identifier is a Host Identity Tag (HIT) and it can require the system resolver
    to return only HITs from DNS.  The application can also to explicitly allow more
    relaxed security models where the communication can be non-HIP based in the absence
    of a peer identifiers, or that the application allows peer identity to be discovered
    after initial contact directly with the peer.</p>"
