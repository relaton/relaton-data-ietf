abstract:
- language: en
  script: Latn
  content: "<p>DHCP provides a mechanism for host configuration that includes dynamic
    assignment of IP addresses and fully qualified domain names. To maintain accurate
    name to IP address and IP address to name mappings in the DNS, these dynamically
    assigned addresses and fully qualified domain names require updates to the DNS.
    This document identifies situations in which conflicts in the use of fully qualified
    domain names may arise among DHCP clients and servers, and describes a strategy
    for the use of the DHCID DNS resource record in resolving those conflicts.</p>"
