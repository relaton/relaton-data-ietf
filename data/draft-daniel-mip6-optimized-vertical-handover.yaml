- language: en
  script: Latn
  content: "<p>This document describes a mechanism that extends Mobile IPv6 protocol
    to smoothly manage handovers for Mobile Nodes equipped with multiple interfaces
    and moving across different and heterogeneous links. For this purpose, the document
    provides indications on how to use the link events information to optimize L3
    movement detection.</p>"
