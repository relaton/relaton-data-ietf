abstract:
- language: en
  script: Latn
  content: "<p>This document describes the conventions for using the Boneh-Franklin
    identity-based encryption (BF-IBE) algorithm in the Cryptographic Message Syntax
    (CMS). The BF-IBE algorithm supports the transport of symmetric keys to encrypt
    message content. Object identifiers (OIDs) and the convention for encoding a recipient’s
    identity are also defined.</p>"
