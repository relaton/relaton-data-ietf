abstract:
- language: en
  script: Latn
  content: "<p>RadSec provides a means to secure the communication between a RADIUS
    client and server on the transport layer by using a TLS cipher-suite. This avoids
    the security weaknesses inherent in RADIUS' use of the MD5 algorithm.  The Key
    Negotiation Protocol for RadSec enables a RADIUS client and RADIUS server to derive
    a key that can be used with a TLS PSK ciphersuite and applied with a RadSec connection.</p>"
