abstract:
- language: en
  script: Latn
  content: "<p>The lisp-MN describes how a lightweight version of LISP's ITR/ETR functionality
    can be used to provide seamless mobility to a mobile node.  The LISP Mobile Node
    extension design described in this document uses standard LISP functionality to
    provide scalable mobility for LISP mobile nodes.  This document extends the lisp-MN,
    it introduces some contents that lisp-MN does not include but the author think
    it is important and recommendation them to be considered in the lisp-MN.</p>"
