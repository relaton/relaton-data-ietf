abstract:
- language: en
  script: Latn
  content: <p>For debugging, it is often helpful to have information about the implementation
    of a peer.  The present specification defines a link relation type, "impl-info",
    that can be used to convey such information via self-description, such as in the
    "/.well-known/core" resource.</p>
