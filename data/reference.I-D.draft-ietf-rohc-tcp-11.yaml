abstract:
- language: en
  script: Latn
  content: "<p>Existing TCP/IP header compression schemes do not work well when used
    over links with significant error rates and long round-trip times. For many bandwidth-limited
    links where header compression is essential, such characteristics are common.
    In addition, existing schemes have not addressed how to compress TCP options such
    as SACK (Selective Acknowledgements) and Timestamps. This document specifies a
    ROHC (Robust Header Compression) profile for compression of TCP/IP packets. The
    profile, called ROHC-TCP, is a robust header compression scheme for TCP/IP that
    provides improved compression efficiency and enhanced capabilities for compression
    of various header fields including TCP options.</p>"
