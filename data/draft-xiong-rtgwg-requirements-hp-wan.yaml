- language: en
  script: Latn
  content: "<p>Many applications such as big data and intelligent computing demand
    massive data transmission between data centers, which needs to ensure data integrity
    and provide stable and efficient transmission services in wide area networks and
    metropolitan area networks. This document outlines the requirements for High-performance
    Wide Area Networks (HP-WAN).</p>"
