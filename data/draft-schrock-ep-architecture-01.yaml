abstract:
- language: en
  script: Latn
  content: "<p>Consequential agent actions can cross operator and administrative\n   boundaries.  The party that later decides whether to rely on an\n   action record may not have participated in the interaction and may\n   not trust either operator.  This document describes an evidence\n   architecture for that case.  It separates transport identity,\n   delegation and policy, material action matching, authorization\n   evidence, evidence satisfaction, enforcement, outcome evidence, and\n   long-term preservation.\n\n   The architecture does not define a universal authorization policy and\n   does not claim that a valid signature establishes authority.  It\n   defines where independently verified artifacts join, which decisions\n   remain local to the relying party, and the terms VERIFIED, MATCH,\n   SATISFIED, AUTHORIZED, and EXECUTED so that an implementation cannot\n   silently collapse one into another.</p>"
