abstract:
- language: en
  script: Latn
  content: |-
    <p>Consequential agent actions can cross operator and administrative
       boundaries.  The party that later decides whether to rely on an
       action record may not have participated in the interaction and may
       not trust either operator.  This document describes an evidence
       architecture for that case.  It separates transport identity,
       delegation and policy, material action matching, authorization
       evidence, evidence satisfaction, enforcement, outcome evidence, and
       long-term preservation.

       The architecture does not define a universal authorization policy and
       does not claim that a valid signature establishes authority.  It
       defines where independently verified artifacts join, which decisions
       remain local to the relying party, and the terms VERIFIED, MATCH,
       SATISFIED, AUTHORIZED, and EXECUTED so that an implementation cannot
       silently collapse one into another.</p>
