abstract:
- language: en
  script: Latn
  content: "<p>This document describes a framework and a mechanism for deliverying
    usage specific root keys (USRK and DSUSRK), derived as part of an EAP EMSK hierarchy,
    and delivered from a server to an intended third party key holder.  The framework
    description includes different scenarios for key delivery, depending on the type
    of keys being delivered.  It also includes, specification of derivation of keys
    required for security protection of key requests and delivery signaling.  The
    mechanism description includes the definition for a three-party key distribution
    exchange (KDE) protocol.</p>"
