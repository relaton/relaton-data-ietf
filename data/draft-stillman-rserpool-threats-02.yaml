abstract:
- language: en
  script: Latn
  content: "<p>This Internet draft is an attempt to describe security threats against
    the Rserpool protocol. This draft presents requirements for a security solution
    to thwart these threats in environments where it is likely to be deployed. The
    threats and requirements identified herein and the document should be considered
    as work in progress.</p>"
