- language: en
  script: Latn
  content: |-
    <p>This document defines extensions to the LDAP C API to support use in
    concurrent execution environments.  The document describes and defines
    requirements for multiple concurrency levels: thread safe, session
    thread safe, and operation thread safe.</p>
