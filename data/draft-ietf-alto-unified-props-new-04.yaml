abstract:
- language: en
  script: Latn
  content: |-
    <p>This document extends the Application-Layer Traffic Optimization
       (ALTO) Protocol [RFC7285] by generalizing the concept of "endpoint
       properties" to domains of other entities, and by presenting those
       properties as maps, similar to the network and cost maps in ALTO.</p>
