abstract:
- language: en
  script: Latn
  content: "<p>This document defines and registers with IANA a Uniform Resource Name
    (URN) namespace for usage within messages standardized by the Eurosystem.  The
    URN namespace is managed by Deutsche Bundesbank, which is a member of the European
    System of Central Banks (ESCB).</p>"
