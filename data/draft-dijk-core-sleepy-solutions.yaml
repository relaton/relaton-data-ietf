abstract:
- language: en
  script: Latn
  content: "<p>This document describes possible solutions for sleepy devices support
    for the CoAP protocol. The solutions aim to meet the requirements for CoAP sleepy
    devices in home and building control use cases. The purpose of this document is
    to guide and stimulate the discussion on sleepy devices support for CoAP in the
    CoRE WG.</p>"
