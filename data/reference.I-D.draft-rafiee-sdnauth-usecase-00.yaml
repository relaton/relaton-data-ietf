abstract:
- language: en
  script: Latn
  content: "<p>This document aims to explain the requirement and usecases for a secure
    authentication and authorization of an app to foreign controllers to enforce policy
    in order to offer better services to end systems. It also covers the automation
    of authentication of two controllers and the possibility of two controllers to
    exchange any information to each other, e.g. end system's master key.</p>"
