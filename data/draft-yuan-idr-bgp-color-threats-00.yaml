abstract:
- language: en
  script: Latn
  content: "<p>The BGP Color Extended Community carries a user-defined Color value
    that is configured locally and has no globally standardized semantics. Although
    this design is suitable for local policy expression, it raises security concerns
    when Color values are propagated across Autonomous System (AS) boundaries and
    used to influence forwarding behavior in another domain. This document describes
    a threat model for that context, following the structure used by RFC 7132. It
    defines relevant terminology, characterizes the classes of adversaries considered
    to be threats, examines the classes of attacks that those threats are able to
    effect against Color-based forwarding, and concludes with a discussion of residual
    vulnerabilities. It does not revisit attacks against unprotected BGP, and it defines
    no new protocol mechanism.</p>"
