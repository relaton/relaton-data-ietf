abstract:
- language: en
  script: Latn
  content: "<p>Agent Group Messaging Protocols (AGMPs) -- including the Model\n   Context Protocol (MCP), the Agent-to-Agent Protocol (A2A), and the\n   Agent Communication Protocol (ACP) -- define what AI agents say to\n   each other.  The Agent Transfer Protocol (AGTP) defines how those\n   messages move across a network.  This document specifies how AGMP\n   messages are carried over AGTP as a transport substrate, providing\n   normative mapping rules for identity, authority scope, delegation,\n   and session fields between the AGMP and AGTP layers.  AGTP headers\n   take precedence over equivalent AGMP payload fields for all\n   infrastructure-level routing, enforcement, and audit operations.\n   Agents gain transport-level governance, observability, and identity\n   without modification to the AGMP layer.</p>"
