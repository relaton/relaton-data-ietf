abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for backhauling of V5.2, DPNSS and
    DASS 2 messages over IP by extending the ISDN User Adaptation Layer Protocol (&lt;draft-ietf-sigtran-iua-09.txt&gt;).
    The document aims to become an Appendix to IUA and to be the base for V5.2 and
    DUA (DPNSS/DASS 2 User Adaptation layer) implementation.</p>"
