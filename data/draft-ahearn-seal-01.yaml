abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Signed Email Authentication Layer (SEAL), a\n   cryptographically signed identity envelope carried within a new\n   message header field, SEAL-Envelope.  SEAL provides a stable,\n   forwarding-resilient identity assertion that binds the origin domain\n   to a specific message instance using the SEAL-MSGID header, which\n   contains a SEAL-protected copy of the [RFC5322] Message-ID present at\n   message creation time.  After SEAL-MSGID is set, intermediaries may\n   modify or discard the visible [RFC5322] Message-ID header without\n   affecting SEAL validity.  SEAL also records the canonical [RFC5322]\n   From header value in the envelope, enabling detection of From\n   rewriting without affecting SEAL validity.  SEAL is designed to\n   complement current approaches such as DKIM, DMARC, and ARC by\n   reducing their dependency on mutable message components and by\n   providing a canonical, tamper-evident identity layer that can remain\n   valid across many common transformations.</p>"
