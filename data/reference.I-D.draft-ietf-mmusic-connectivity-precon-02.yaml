abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new connectivity precondition for the Session
    Description Protocol precondition framework described in RFC 3312 (and its update,
    RFC4032). A connectivity precondition can be used to delay session establishment
    or modification until media stream connectivity has been verified successfully.
    The method of verification may vary depending on the type of transport used for
    the media. For reliable connection-oriented transports such as TCP verification
    is achieved by successful connection establishment. For unreliable datagram transports
    such as UDP, verification involves probing the stream with data or control packets.</p>"
