abstract:
- language: en
  script: Latn
  content: "<p>CAPP is a decentralized presentation protocol for Verifiable Credentials
    that enables frictionless, context-triggered, pre- consented credential sharing
    without requiring interactive challenge- response cycles. It is optimized for
    physical access, transit, event entry, and other passive authentication scenarios.</p>"
