- language: en
  script: Latn
  content: "<p>This draft suggests several ways to identify calls initiated between
    users within the same addressing realm. By having this capability, media flows
    are kept within the same realm, thus avoiding usage of certain network intermediaries
    and reducing bandwidth requirements on certain access links.</p>"
