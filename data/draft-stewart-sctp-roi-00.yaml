- language: en
  script: Latn
  content: "<p>This document describes a method to adapt DDP to SCTP using a generic
    DDP description found in [DDP-DRAFT]. This adaption provides a method for two
    peers to know that each side is performing direct placement thus enabling hardware
    acceleration if available.</p>"
