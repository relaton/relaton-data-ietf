abstract:
- language: en
  script: Latn
  content: "<p>This document provides an approach for the separation of the forwarding
    and control plane for the Broadband Network Gateway (BNG) using IETF's ForCES
    architecture. The document provides an initial primer on ForCES as well as an
    initial ForCES XML model that describes some basic functions of the BNG.</p>"
