abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes optional extensions to the TRILL protocol's
       use of IS-IS (Intermediate System to Intermediate Systems). These
       extensions support multiple topologies (MT) within the same TRILL
       campus and protocol instance of IS-IS.</p>
