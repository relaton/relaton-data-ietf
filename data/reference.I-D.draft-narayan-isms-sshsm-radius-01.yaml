abstract:
- language: en
  script: Latn
  content: "<p>The Secure Shell Security Model (SSHSM) describes a Security Model
    for the Simple Network Management Protocol, using the Secure Shell protocol within
    an SNMP Transport Mapping. This memo describes the usage of the Secure Shell Security
    Model with a RADIUS authentication and authorization system.</p>"
