abstract:
- language: en
  script: Latn
  content: "<p>In many application areas it must be possible to prove the existence
    and integrity of digital signed data.  This proof depends on the security suitability
    of the cryptographic algorithms used to generate or verify the digital signature.
    \ Because algorithms can become weak over the years, it is necessary to periodically
    evaluate their security suitability.  When signing or verifying data, these evaluations
    must be considered.  This document specifies a data structure that enables automated
    analysis of the security suitability of cryptographic algorithms.</p>"
