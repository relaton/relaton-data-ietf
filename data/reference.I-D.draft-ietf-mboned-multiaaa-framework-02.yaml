abstract:
- language: en
  script: Latn
  content: <p>IP multicast-based services, such as TV broadcasting or videoconferencing
    raise the issue of making sure that potential customers are fully entitled to
    access the corresponding contents. There is indeed a need for service and content
    providers to identify (if not authenticate, especially within the context of enforcing
    electronic payment schemes) and to invoice such customers in a reliable and efficient
    manner. This memo describes the framework for specifying the Authorization, Authentication
    and Accounting (AAA) capabilities that could be activated within the context of
    the deployment and the operation of IP multicast-based services. This framework
    addresses the requirements presented in draft-ietf-mboned- maccnt-req-04.txt,
    "Requirements for Accounting, Authentication and Authorization in Well Managed
    IP Multicasting Services".</p>
