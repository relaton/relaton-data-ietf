abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a set of extensions for Path Computation Element
    Communication Protocol (PCEP) for Circuit Style Policies - Segment-Routing Policy
    designed to satisfy requirements for connection-oriented transport services. New
    TLV is introduced to control path recomputation and new flag to add ability to
    request path with strict hops only.</p>"
