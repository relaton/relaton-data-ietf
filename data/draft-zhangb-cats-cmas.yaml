abstract:
- language: en
  script: Latn
  content: "<p>CATS applications require service resolution and traffic steering across
    heterogeneous computing resources. Directly exposing raw computing metrics from
    different hardware platforms can be difficult for clients, service sites, and
    CATS control-plane components to interpret consistently. This Informational document
    describes the purpose and functions of a public service platform for CATS, and
    identifies the CS-ID-related information fields needed by those functions. The
    platform maintains a common service catalogue, associates public service identifiers
    with service descriptions and deployment requirements, and provides the service
    context used by service-oriented metric mechanisms. This platform supports the
    Computing Metrics as a Service (CMAS) approach by allowing heterogeneous resources
    to be represented through service-oriented parameters rather than raw hardware
    metrics. Service-oriented metric definitions and operational procedures are specified
    in [I-D.zhangb-cats-service-metrics-op-02].</p>"
