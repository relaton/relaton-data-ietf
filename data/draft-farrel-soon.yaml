abstract:
- language: en
  script: Latn
  content: <p>Many discussions with IETF Area Directors and Working Group Chairs utilize
    the word "Soon" to qualify a commitment to action. This document attempts to provide
    a definition of that term so that common expectations may be realistically set.</p>
