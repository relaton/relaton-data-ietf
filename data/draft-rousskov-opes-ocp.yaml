abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Open Pluggable Edge Services (OPES) callout
    protocol (OCP). OCP supports the remote execution of OPES services. This OCP specification
    is incomplete and cannot be used for implementing the protocol yet. Major missing
    pieces are transport binding(s) and message encoding(s).</p>"
