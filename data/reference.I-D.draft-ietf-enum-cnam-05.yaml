abstract:
- language: en
  script: Latn
  content: <p>This document registers the Enumservice "pstn" and subtype "cnam" using
    the URI scheme "data:" as per the IANA registration process defined in the ENUM
    specification, RFC 3761[1] and registers a new media type application/cnam [17].
    This data is used to facilitate the transfer of Calling Name Delivery (CNAM) data
    for calls that originate on the Public Switched Telephone Network (PSTN) that
    may be displayed on VoIP or other Real-time Client User Agents (CUA).</p>
