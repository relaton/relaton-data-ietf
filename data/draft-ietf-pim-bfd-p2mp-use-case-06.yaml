abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the use of Bidirectional Forwarding Detection
    (BFD) for multipoint networks to provide nodes that participate in Protocol Independent
    Multicast - Sparse Mode (PIM-SM) with sub-second convergence. An extension to
    the PIM Hello message used to bootstrap point-to-multipoint BFD sessions is also
    defined in this document.</p>"
