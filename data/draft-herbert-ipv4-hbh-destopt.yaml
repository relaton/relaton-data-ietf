- language: en
  script: Latn
  content: "<p>This specification enables the use of Hop-by-Hop Options and Destination
    Options extension headers which are defined for IPv6 to be used with IPv4. The
    goal is to provide a uniform and feasible method of extensibility that is common
    between IPv4 and IPv6.</p>"
