abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Certificate Expectation Assertions (CEA), a\n   DNS-based mechanism enabling domain owners to publish expected\n   certificate authority identities for their domains. Clients can\n   compare observed TLS certificates against these published\n   expectations to identify potential unauthorized interception.\n\n   CEA uses DNSSEC-signed DNS TXT records, supports multiple certificate\n   authorities, and employs fail-open transparency rather than blocking\n   connections. This approach differs from HPKP's fail-secure model and\n   provides an optional mechanism for interception detection.\n\n   This document is published as Informational to document the CEA\n   protocol for experimental deployment. It does not modify TLS or PKI\n   infrastructure and is not an IETF standard. This is an experimental\n   specification that has not been endorsed by any IETF Working Group\n   and does not represent IETF consensus.\n\n   Note: This document does not modify the TLS protocol (RFC 8446),\n   certificate validation procedures (RFC 5280), or PKI infrastructure.\n   CEA is an optional client-side transparency overlay that provides\n   additional information to users. Implementations that do not support\n   CEA continue to function normally with no changes to TLS behavior.</p>"
