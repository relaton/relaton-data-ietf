- language: en
  script: Latn
  content: "<p>This document proposes extensions of BGP in order to provide path protection
    within a candidate path when delivering SR policy.  And it also extends BGP-LS
    to provide some extra information of the segment list in a candidate path in the
    advertisement.</p>"
