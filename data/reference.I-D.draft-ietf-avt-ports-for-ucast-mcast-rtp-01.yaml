abstract:
- language: en
  script: Latn
  content: "<p>This document presents a port mapping solution that allows RTP receivers
    to choose their own receive ports for an auxiliary unicast session in RTP applications
    using both unicast and multicast services.  The solution requires multiplexing
    RTP and RTCP on a single port on both endpoints in the unicast session.</p>"
