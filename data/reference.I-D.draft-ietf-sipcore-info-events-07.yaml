abstract:
- language: en
  script: Latn
  content: <p>This document defines a method, INFO, for the Session Initiation Protocol
    (SIP) [RFC3261], and an Info Package mechanism.  The document obsoletes [RFC2976].  For
    backward compatibility the document also specifies a "legacy" mode of usage of
    the INFO method that is compatible with the usage previously defined in [RFC2976],
    referred to as "legacy INFO Usage" in this document.</p>
