abstract:
- language: en
  script: Latn
  content: "<p>While TCP has enjoyed many enhancements over the decades, it is useful
    to allow applications to use transports beyond just UDP and TCP and to use TCP
    in new ways.  It is inefficient to naively probe the server using the new protocol.
    \ This document proposes a new DNS resource record which provides an efficient
    way to query which protocols are supported by a server.</p>"
