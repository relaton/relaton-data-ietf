abstract:
- language: en
  script: Latn
  content: "<p>This document describes version 2 of the Internet Key Exchange (IKE)
    protocol.  IKE is a component of IPsec used for performing mutual authentication
    and establishing and maintaining security associations (SAs).  It replaces and
    updates RFC 4306, and includes all of the clarifications from RFC 4718.</p>"
