abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension to the echo request/reply mechanisms
    used in IPv6, SR-MPLS and SFC environments, which can be used within an IOAM domain,
    allowing the IOAM encapsulating node to acquire IOAM capabilities of each IOAM
    transit node and/or IOAM decapsulating node.</p>"
