abstract:
- language: en
  script: Latn
  content: |-
    <p>In some multihoming SRv6 L3VPN and EVPN scenarios, there are
       requirements for the egress PE to advertise both unicast and anycast
       SRv6 Service SIDs for the same service. This document defines
       anycast flavor for SRv6 Service SIDs carried in BGP messages.</p>
