abstract:
- language: en
  script: Latn
  content: <p>This document describes the Depth-First Forwarding (DFF) protocol for
    IPv6 networks based on the IEEE 802.15.4 link layer (6lowpan).  The protocol is
    a mesh-under data forwarding mechanism that increases reliability of data delivery
    in cases where the next hop along the path to the destination, as determined by
    the underlying routing protocol, is not reachable.  In that case, a node running
    DFF tries to forward the packet successively to all neighbors, and - if the packet
    makes no forward progress - returns it to the previous hop, similar to a "depth-first
    search" in graph theory.</p>
