abstract:
- language: en
  script: Latn
  content: "<p>[fcfs] proposes a simple preference scheme to resolve binding entry
    collisions (same l3 address, different anchors): it keeps the first entry and
    rejects any others.  However, there are cases where keeping the first entry is
    not the best choice, and others cases where it is bogus.  This draft analyses
    what are these cases, and proposes a different algorithm (preference based) to
    fix the problem.</p>"
