abstract:
- language: en
  script: Latn
  content: "<p>This memo defines ICMP extensions, using ICMP multi-part messages,
    through which a router or host can explicitly identify an interface by ifIndex,
    name, and/or address, as already used in MIBs and by OSPF.  The interfaces so
    identified can be the interface upon which an undeliverable datagram arrived,
    a sub-IP member of that interface, and the interface through which the datagram
    would have been sent. The nexthop IP address can also be provided as part of the
    outgoing interface information.  The extensions defined herein are particularly
    useful when troubleshooting networks with unnumbered interfaces, parallel interfaces
    and/or asymmetric routing.</p>"
