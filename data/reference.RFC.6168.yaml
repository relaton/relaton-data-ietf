abstract:
- language: en
  script: Latn
  content: "<p>Management of name servers for the Domain Name System (DNS) has traditionally
    been done using vendor-specific monitoring, configuration, and control methods.
    \ Although some service monitoring platforms can test the functionality of the
    DNS itself, there is not an interoperable way to manage (monitor, control, and
    configure) the internal aspects of a name server itself.</p>"
- language: en
  script: Latn
  content: "<p>This document discusses the requirements of a management system for
    name servers and can be used as a shopping list of needed features for such a
    system.  This document is not an Internet Standards Track  specification; it is
    published for informational purposes.</p>"
