abstract:
- language: en
  script: Latn
  content: |-
    <p>This document presents a hybrid key and signature solution, which
       allows to integrate two public keys and/or two signatures into a
       single certificate.  The scheme enables a single certificate to be
       converted between different forms, allowing an alternative public key
       and/or an alternative signature to be transmitted either by direct
       inclusion or by referencing external data.  This flexibility ensures
       that the scheme is backward-compatible with legacy devices, while
       also providing enhanced security support for upgraded devices.  Four
       CSR attributes and two new X.509v3 certificate extensions are
       defined, and the procedures for signing and verifying certificates
       containing the defined attributes and extensions are described.</p>
