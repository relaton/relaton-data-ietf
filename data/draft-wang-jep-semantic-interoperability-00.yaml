abstract:
- language: en
  script: Latn
  content: "<p>This document defines semantic interoperability requirements for the\n   Judgment Event Protocol (JEP).\n\n   JEP-Core defines the event syntax, event classes, signatures, hashes,\n   references, extension processing, and validation levels for signed\n   judgment-related events. This document does not modify those mechanisms.\n   Where this document restates JEP-Core semantics, JEP-Core remains\n   authoritative. Instead, this document defines the minimum shared semantic\n   invariants required for independent systems to interpret JEP events\n   consistently across implementations, profiles, organizations, and\n   jurisdictions.\n\n   The document specifies core semantic roles, core semantic relations, event-\n   class interpretation rules for Judgment, Delegation, Termination, and\n   Verification events, verification-scope semantics, semantic identifiers,\n   profile-extension constraints, semantic validation results, non-inference\n   rules, semantic conformance requirements, initial semantic registry\n   requirements, and cross-jurisdictional boundaries. It defines semantic\n   registry contents and constraints, but does not define operational registry\n   governance beyond the requirements stated here.\n\n   This document does not define legal effect, moral responsibility,\n   regulatory compliance, runtime enforcement, access-control decisions,\n   domain-specific workflows, or external truth. A JEP event is a protocol-\n   semantic record. Whether that record is sufficient to support an external\n   target claim is outside the scope of this document and must be determined\n   by an applicable profile, evidence policy, domain rule, or target-support\n   analysis.</p>"
