abstract:
- language: en
  script: Latn
  content: "<p>This document describes a method for controlling customer traffic for
    L2 VPN services which support broadcast, multicast or implied broadcast such as
    Virtual Private LAN Service (VPLS), or other L2 Provider Provisioned VPNs. The
    method guarantees stability of the provider network regardless of the behavior
    of customer traffic, benign or malicious.</p>"
