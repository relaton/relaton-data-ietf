date:
- type: published
  at: '2014-09-24'
abstract:
- language: en
  script: Latn
  content: "<p>DNS Security Extensions (DNSSEC) is beginning widespread deployment.\n   However, domain signing tools and processes are not yet as mature and\n   reliable as is the case for non-DNSSEC-related domain administration\n   tools and processes.  As a result, some DNSSEC validation failures\n   may occur.  When these failures do occur, end users SHOULD NOT change\n   to a non-validating DNS resolver.</p>"
