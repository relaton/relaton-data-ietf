title:
- language: en
  script: Latn
  content: In Case of DNSSEC Validation Failures, Do Not Change Resolvers
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-livingood-dont-switch-resolvers-02
docidentifier:
