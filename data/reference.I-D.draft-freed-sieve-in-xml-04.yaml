abstract:
- language: en
  script: Latn
  content: <p>This document describes a way to represent Sieve email filtering language
    scripts in XML.  Representing sieves in XML is intended not as an alternate storage
    format for Sieve but rather as a means to facilitate manipulation of scripts using
    XML tools.  The XML representation also defines additional elements that have
    no counterparts in the regular Sieve language.  These elements are intended for
    use by graphical user interfaces and provide facilities for labeling or grouping
    sections of a script so they can be displayed more conveniently.  These elements
    are represented as specially structured comments in regular Sieve format.  Change
    History (to be removed prior to publication as an RFC  Changed representation
    of comments in XML to use a comment element.  Update references.  Added an IANA
    registration of a URN for the Sieve namespace.  Updated XML Schema to allow largely
    unrestricted use of material in other namespaces.  Add compact Relax NG schema.  Updated
    example stylesheet to handle material in other namespaces.  Corrected stylesheet
    handling of &lt;comment&gt; elements.  Added a section defining the structured
    comment convention.  Moved the examples section to an appendix.  Added text to
    clarify that the examples in the various appendices are in fact code components
    and may therefore be reused.  Added a section on validation requirements.  Clarified
    various editor requirements and trust issues, restricted the use of "*/" in non-Sieve
    XML content.  Added XML reference.</p>
