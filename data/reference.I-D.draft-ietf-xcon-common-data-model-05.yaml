abstract:
- language: en
  script: Latn
  content: "<p>This document defines an Extensible Markup Language (XML)-based conference
    information data model for centralized conferencing (XCON). A conference object,
    which can be manipulated using a conference control protocol, at a conference
    server represents a particular instantiation of this data model. The conference
    information data model defined in this document is an extension of (and thus,
    compatible with) the model specified in the Session Initiation Protocol (SIP)
    Event Package for Conference State.</p>"
