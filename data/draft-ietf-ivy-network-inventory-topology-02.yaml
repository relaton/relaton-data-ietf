abstract:
- language: en
  script: Latn
  content: "<p>This document defines a YANG model to map the network inventory data
    with the topology model to form a base underlay network. The model facilitates
    the correlation between the layer (e.g., Layer 2 and Layer 3) topology information
    and the inventory data of the underlay network for better service provisioning,
    network maintenance operations, and other assessment scenarios.</p>"
