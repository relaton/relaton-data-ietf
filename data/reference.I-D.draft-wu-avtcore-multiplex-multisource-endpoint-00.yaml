abstract:
- language: en
  script: Latn
  content: "<p>This document discusses bandwidth issues and RTCP timing rule issues
    that arise when the multi-source endpoint multiplexing all the media type in one
    RTP session and follows RFC3550 timing rules.  It provides recommendations for
    multi-source host sending multiple media types in the same session.</p>"
