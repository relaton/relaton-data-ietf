abstract:
- language: en
  script: Latn
  content: "<p>One of the main motivations behind VPLS is its ability to provide connectivity
    not only among customer routers and servers/hosts but also among customer bridges.
    VPLS is expected to deliver the same level of service that current enterprise
    users are accustomed to from their own enterprise bridged networks today or the
    same level of service that they receive from their Ethernet Service Providers
    using IEEE bridged networks.  When CE devices are IEEE bridges, then there are
    certain issues and challenges that need to be accounted for in a VPLS network.
    The majority of these issues have currently been addressed in the IEEE 802.1ad
    standard for provider bridges and they need to be addressed for VPLS networks.
    This draft discusses these issues and wherever possible suggests areas to be explored
    in rectifying these issues.</p>"
