abstract:
- language: en
  script: Latn
  content: '<p>HOKEY seeks to minimize handover delay due to authentication when a
    peer moves from one point of attachment to another.  Work has progressed on two
    different approaches to reducing handover delay: early authentication, and reuse
    of cryptographic material generated during an initial authentication to save time
    during re- authentication.  A starting assumption is that the mobile host or "peer"
    is initially authenticated using EAP, and the source of keying material used to
    authenticate the peer is an EAP authentication server in the peer''s home network.  This
    document describes the HOKEY architecture.  Specifically, it describes design
    objectives for the architecture, main components of the HOKEY architecture, HOKEY
    deployment scenarios in the wireless environment, and the message flows that must
    pass between the architectural components in those various scenarios.  Other documents
    describe the protocol(s) needed to implement the message flows.</p>'
