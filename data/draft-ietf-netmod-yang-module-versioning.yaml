title:
- language: en
  script: Latn
  content: Updated YANG Module Revision Handling
  format: text/plain
docidentifier:
- content: draft-ietf-netmod-yang-module-versioning
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-06-29'
abstract:
- language: en
  script: Latn
  content: "<p>This document refines the RFC 7950 module update rules. It specifies
    a new YANG module update procedure that can document when non- backwards-compatible
    changes have occurred during the evolution of a YANG module. It extends the YANG
    import statement with a suggestion for a minimum revision. This helps document
    inter-module dependencies. It provides guidelines for managing the lifecycle of
    YANG modules and individual schema nodes. This document updates RFC 7950, RFC
    6020, RFC 8525, and RFC 9907.</p>"
  format: text/html
