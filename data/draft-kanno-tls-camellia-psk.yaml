abstract:
- language: en
  script: Latn
  content: |-
    <p>This document specifies new Camellia cipher suites for the Transport
    Layer Security (TLS) protocol to support authentication based on Pre-
    Shared Key (PSK).  This document realizes compatibility with RFC4297,
    RFC5487, and RFC5489 specified in AES cipher suites.</p>
