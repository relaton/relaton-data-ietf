- language: en
  script: Latn
  content: "<p>The idea to use unidirectional link(UDL) routing without any modifications
    of current routing protocols is described in [1], but any dynamic tunneling path
    configuration technique was not described. This document describe the dynamic
    tunneling path configuration for UDL routing.</p>"
