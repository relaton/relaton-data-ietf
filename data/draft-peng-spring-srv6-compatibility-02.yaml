abstract:
- language: en
  script: Latn
  content: "<p>When deploying SRv6 on legacy devices, there are some compatibility
    challenges that must be addressed such as the support for SRH processing. This
    document identifies some of the major challenges, and provides solutions that
    can mitigate those challenges and smooth the migration towards SRv6 deployment.</p>"
