abstract:
- language: en
  script: Latn
  content: |-
    <p>There is a lot of confusion about media-types, content-types, and
       related terminology.

       This memo is an attempt at clearing it up, so we can use consistent
       terminology in CoRE and related specifications.  It also defines some
       ABNF that can be used in these specifications.</p>
