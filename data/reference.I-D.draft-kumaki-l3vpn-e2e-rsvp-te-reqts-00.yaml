abstract:
- language: en
  script: Latn
  content: "<p>This document describes Service Provider requirements for providing
    end-to-end MPLS TE LSPs over L3VPN. The main objective is to present a set of
    requirements which result in general guidelines for the definition, selection
    and specification of a technical solution addressing these requirements. Specification
    for this solution itself is out of scope in this document.</p>"
