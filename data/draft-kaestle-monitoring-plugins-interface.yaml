- language: en
  script: Latn
  content: "<p>This document aims to document the Monitoring Plugin Interface, a standard
    more or less strictly implemented by different network monitoring solutions. Implementers
    and Users of network monitoring solutions, monitoring plugins and libraries can
    use this as a reference point as to how these programs interface with each other.</p>"
