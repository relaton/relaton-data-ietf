abstract:
- language: en
  script: Latn
  content: "<p>This document describes the use of BGP large communities, as well as
    its usage, to signal prefix origin validation results from an RPKI Origin validating
    BGP speaker to other BGP peers. Upon reception of prefix origin validation results,
    peers can use this information in their local routing decision process.</p>"
