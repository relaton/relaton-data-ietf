- language: en
  script: Latn
  content: "<p>Like many network protocols, HTTP is vulnerable to ossification of
    its extensibility points. This draft explains why HTTP ossification is a problem
    and establishes guidelines for exercising those extensions by 'greasing' the protocol
    to combat it.</p>"
