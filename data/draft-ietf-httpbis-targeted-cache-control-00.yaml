- language: en
  script: Latn
  content: "<p>This specification defines a convention for HTTP response header fields
    that allow directives controlling caching to be targeted at specific caches or
    classes of caches. It also defines one such header field, targeted at Content
    Delivery Network (CDN) caches.</p>"
