  script: Latn
  content: "<p>rxgk is a security class for the RX RPC protocol. It uses the GSSAPI
    framework to provide authentication, confidentiality and integrity protection.
    This document provides a general description of rxgk. A further document will
    provide details of integration with specific RX applications.</p>"
