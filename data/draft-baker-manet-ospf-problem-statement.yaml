abstract:
- language: en
  script: Latn
  content: "<p>In ad hoc networks containing or contained within larger IP networks,\nmany of the capabilities of a routing protocol such as OSPF are\ndesirable. This document poses the issues that need to be addressed\nto make OSPF work well in a network containing both traditional LANs\nand WANs and also radio network topologies.</p>"
