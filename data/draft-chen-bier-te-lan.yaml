abstract:
- language: en
  script: Latn
  content: <p>This document describes extensions to "Bit Index Explicit Replication
    Traffic Engineering" (BIER-TE) for supporting LANs (i.e., broadcast links). For
    a multicast packet with an explicit point-to-multipoint (P2MP) path traversing
    LANs, the packet is replicated and forwarded statelessly along the path.</p>
