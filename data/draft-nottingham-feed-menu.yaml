- language: en
  script: Latn
  content: "<p>This specification defines Feed Menus, a simplified means of\n   discovering the feeds (e.g., RSS or Atom) offered by a Web site.\n\nAbout This Document\n\n   This note is to be removed before publishing as an RFC.\n\n   Status information for this document may be found at\n   https://datatracker.ietf.org/doc/draft-nottingham-feed-menu/.\n\n   information can be found at https://mnot.github.io/I-D/.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/mnot/I-D/labels/feed-menu.</p>"
