abstract:
- language: en
  script: Latn
  content: "<p>This document provides an information model for the optical impairment
    characteristics of optical network elements for use in path computation and optical
    path validation. This model is based on ITU-T defined optical network element
    characteristics as given in ITU-T recommendation G.680 and related specifications.
    This model is intentionally compatible with a previous impairment free optical
    information model used in optical path computations and wavelength assignment.</p>"
