abstract:
- language: en
  script: Latn
  content: "<p>This specification defines an OAuth 2.0 challenge mechanism by which\n   an Authorization Server or Protected Resource signals that a\n   credential presented by a Client is otherwise acceptable but lacks\n   claims required to fulfill the request.  A new error code,\n   insufficient_claims, together with a required_claims parameter that\n   enumerates the missing claims, lets the recipient signal what is\n   needed.  The same challenge is used in Token Endpoint error\n   responses, in Bearer authentication challenges at Protected\n   Resources, and (optionally) in OAuth 2.0 Protected Resource Metadata.\n\n   The challenge is intentionally decoupled from how the Client\n   responds.  For back-channel re-issuance grants (OAuth 2.0 Token\n   Exchange and Refresh Token), a Client uses the requested_claims Token\n   Endpoint request parameter defined here.  For grants that may require\n   end-user interaction (authorization_code, device_code, CIBA), a\n   Client uses an applicable front-channel claims request mechanism,\n   such as the OpenID Connect claims request parameter.\n\n   A motivating use case is just-in-time account provisioning by a\n   Resource Authorization Server receiving an identity assertion under\n   the Identity Assertion Authorization Grant.</p>"
