- language: en
  script: Latn
  content: "<p>This specification introduces a mechanism to advertise the support
    for WebSockets over different HTTP versions using HTTPS resource records. This
    mechanism allows clients to avoid delays in establishing WebSocket connections
    using HTTP-based advertisement for WebSocket support.</p>"
