abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines an extensible message schema in YANG to be used
       at the data collection for transforming Network Telemetry
       notifications into external systems such as message brokers.  The
       extensible message schema enables a data collection to add metadata
       for the provenance of the operational network data.</p>
