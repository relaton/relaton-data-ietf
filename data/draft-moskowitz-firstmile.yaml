  content: |-
    <p>This document describes a pub/sub styled protocol to send security
       alerts to a security monitor that can feed into MILE and other
       management platforms.  It uses data structures from NETCONF, MILE,
       and IPFIX to manage the reporting and report security alerts.</p>
