  script: Latn
  content: "<p>This draft proposes a gated adaptive CoDel algorithm that can operate
    in the Time-Sensitive Network (TSN) environment. Here, we define Virtual sojourn
    time, virtual Interval and virtaul Target that are only operate on non-blocking
    part of TSN.</p>"
