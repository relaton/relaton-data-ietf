abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a Transparency Metadata Interchange Format
    (TMIF) that allows a system to make standardized, verifiable claims about its
    levels of transparency and falsifiability. TMIF is designed to be agnostic to
    specific threat models or mitigations, serving purely as a communication vehicle
    for system providers to declare how their security and privacy controls can be
    verified by third-party evaluators.</p>"
