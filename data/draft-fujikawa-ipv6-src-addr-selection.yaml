abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes a problem of source address selection Rule 8.
       stated in RFC3484[RFC3484], and shows one solution, which is based
       just on the destination based address routing and does not require
       policy routing such as source address based routing.</p>
