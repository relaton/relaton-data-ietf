abstract:
- language: en
  script: Latn
  content: "<p>This document briefly introduces the existing mechanisms could be utilized
    by IPv6 site renumbering and envisions the effort could be done. This document
    tries to cover the most explicit issues and requirements of IPv6 renumbering.
    Through the gap analysis, the document provides a basis for future work to identify
    and develop solutions or to stimulate such development as appropriate. The gap
    analysis is presented following a renumbering event procedure clue.</p>"
