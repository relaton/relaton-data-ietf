abstract:
- language: en
  script: Latn
  content: "<p>The File transfer protocol, which is defined by the RFC 959, has a
    long history, but still widely used today. The original version of FTP specification
    defines IPv4 FTP which means it assumes the IP version is IPv4. RFC 2428 defines
    IPv6 extensions of FTP, introducing EPRT and EPSV command.  In the IPv6-IPv4 translation
    scenario, considerations should be applied to FTP client, server and translation
    box to ensure FTP protocol work properly. This document gives guidelines for the
    FTP client, server and the translation box to ensue FTP working properly in the
    IPv4-IPv6 transition scenario.</p>"
