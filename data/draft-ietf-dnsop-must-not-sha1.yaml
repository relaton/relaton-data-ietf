title:
- language: en
  script: Latn
  content: Deprecating the use of SHA-1 in DNSSEC signature algorithms
  format: text/plain
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-dnsop-must-not-sha1-10
