abstract:
- language: en
  script: Latn
  content: "<p>This document defines requirements for adding certificate authentication
    to the Session Initiation Protocol (SIP). It is intended that potential solutions
    specifying certificate authentication within SIP will use these requirements as
    guidelines. Supporting certificate authentication in SIP would provide strong
    authentication and increase the types of possible deployment scenarios.</p>"
