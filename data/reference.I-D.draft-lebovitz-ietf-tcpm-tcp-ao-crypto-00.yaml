abstract:
- language: en
  script: Latn
  content: "<p>The TCP Authentication Option, TCP-AO, relies on security algorithms
    to provide authentication between two end-points.  There are many such algorithms
    available, and two TCP-AO systems cannot interoperate unless they are using the
    same algorithm(s).  This document specifies the algorithms and attributes that
    can be used in TCP-AO manual key mode.  It also defines a UI labels framework
    that will be used across implementations to aid administrators in quickly achieving
    successful TCP-AO connections, something that will become far more important once
    a key management protocol (KMP) is defined for TCP-AO.</p>"
