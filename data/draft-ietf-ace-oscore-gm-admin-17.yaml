abstract:
- language: en
  script: Latn
  content: "<p>Group communication for the Constrained Application Protocol (CoAP)
    can be secured using Group Object Security for Constrained RESTful Environments
    (Group OSCORE). A Group Manager is responsible for handling the joining of new
    group members, as well as for managing and distributing the group keying material.
    This document defines a RESTful admin interface at the Group Manager that allows
    an Administrator entity to create and delete OSCORE groups, as well as to retrieve
    and update their configuration. The Authentication and Authorization for Constrained
    Environments (ACE) framework is used to enforce authentication and authorization
    of the Administrator at the Group Manager. Protocol-specific transport profiles
    of ACE are used to achieve communication security, proof of possession, and server
    authentication.</p>"
