abstract:
- language: en
  script: Latn
  content: "<p>This document defines an extension to the BGP Community Container Attribute,
    which allows flowspec redirection to multiple paths. This extended community serves
    to redirect traffic to a load balancing group and supports both equal-cost multi-path
    (ECMP) and unequal-cost multi-path (UCMP) scenarios.</p>"
