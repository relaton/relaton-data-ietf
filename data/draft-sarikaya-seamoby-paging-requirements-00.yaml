abstract:
- language: en
  script: Latn
  content: "<p>This document develops a set of requirements needed to support the
    mobile nodes that are in the dormant mode by way of a Layer 3 (L3) paging protocol
    for seamless IP mobility. This draft describes paging, and presents a list of
    requirements regarding work on developing a L3 paging protocol.</p>"
