abstract:
- language: en
  script: Latn
  content: |-
    <p>This draft describes a mechanism for adding multi-protocol support to
       Virtual eXtensible Local Area Network (VXLAN).  Protocol
       identification is carried in the VXLAN header and is used to describe
       the encapsulated payload.</p>
