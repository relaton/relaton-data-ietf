abstract:
- language: en
  script: Latn
  content: "<p>This documents proposes the use of the DNS to publish a domain's policy
    regarding incoming communication. The algorithm used is defined as a new application
    of the Dynamic Delegation Discovery System (DDDS). Such policy announcements can
    be used to facilitate selective SIP peering.</p>"
