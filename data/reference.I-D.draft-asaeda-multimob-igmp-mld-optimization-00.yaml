abstract:
- language: en
  script: Latn
  content: "<p>To notify neighboring multicast routers of their IP multicast group
    memberships, hosts must support IGMP and MLD protocols.  This document describes
    the ways of IGMPv3 and MLDv2 protocol optimization for mobility.  The optimization
    includes a query timer tuning and an explicit membership notification operation.</p>"
