abstract:
- language: en
  script: Latn
  content: "<p>This document defines requirements for standards specifications for
    energy management.  Defined requirements concern monitoring functions as well
    as control functions.  Covered functions include identification of powered entities,
    monitoring of their power state, power inlets, power outlets, actual power, consumed
    energy, and contained batteries.  Further included is control of powered entities'
    power supply and power state.  This document does not specify the features that
    must be implemented by compliant implementations but rather features that must
    be supported by standards for energy management.</p>"
