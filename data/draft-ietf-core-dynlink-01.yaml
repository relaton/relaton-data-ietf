abstract:
- language: en
  script: Latn
  content: "<p>For CoAP [RFC7252] Dynamic linking of state updates between resources,
    either on an endpoint or between endpoints, is defined with the concept of Link
    Bindings. This specification defines conditional observation attributes that work
    with Link Bindings or with CoAP Observe [RFC7641]. Editor's note: o The git repository
    for the draft is found at https://github.com/ core-wg/dynlink o Examples need
    to be added.</p>"
