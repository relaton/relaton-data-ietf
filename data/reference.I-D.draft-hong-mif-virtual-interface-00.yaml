abstract:
- language: en
  script: Latn
  content: "<p>The use of multiple interfaces in a host with existing TCP/IP stack
    may have some problems.  This document discusses how to solve the problems of
    multiple interfaces in a host and proposes a virtual network interface model which
    describes the use of original TCP/IP stack to support multiple network interfaces
    in a host.</p>"
