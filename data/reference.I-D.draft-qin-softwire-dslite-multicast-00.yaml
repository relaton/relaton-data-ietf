abstract:
- language: en
  script: Latn
  content: "<p>DS-Lite enables broadband service providers to provide IPv4 unicast
    service following IPv4 exhaustion by combining two mechanisms: NAT (for IPv4 address
    sharing) and IPv4-in-IPv6 tunnel(a bridging link, for carrying IPv4 traffic).
    \ Meanwhile, native IPv6 services, both unicast and multicast can be provided.
    \ This document describes extensions to DS-Lite to support IPv4 multicast.</p>"
