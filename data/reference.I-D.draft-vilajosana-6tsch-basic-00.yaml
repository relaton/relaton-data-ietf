abstract:
- language: en
  script: Latn
  content: "<p>This document describes the minimal set of rules to operate a [IEEE802154e]
    Timeslotted Channel Hopping (TSCH) network.  These rules can be used during early
    interoperability testing and development, when the centralized and distributed
    solutions developed by the 6TSCH group are not fully implemented yet, or otherwise
    not available.</p>"
