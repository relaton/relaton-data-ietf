abstract:
- language: en
  script: Latn
  content: "<p>This document presents a mechanism aimed at providing loop avoidance
    in the case of IGP network convergence event. The solution relies on the temporary
    use of SR policies ensuring loop-freeness over the post-convergence paths from
    the converging node to the destination.</p>"
