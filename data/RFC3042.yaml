abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a new Transmission Control Protocol (TCP) mechanism
    that can be used to more effectively recover lost segments when a connection's
    congestion window is small, or when a large number of segments are lost in a single
    transmission window. [STANDARDS-TRACK]</p>"
