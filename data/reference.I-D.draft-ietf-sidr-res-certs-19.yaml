abstract:
- language: en
  script: Latn
  content: <p>This document defines a standard profile for X.509 certificates for
    the purposes of supporting validation of assertions of "right-of-use" of Resources
    (INRs).  The certificates issued under this profile are used to convey the Issuer's
    authorisation of the Subject to be regarded as the current holder of a "right-of-use"
    of the INRs that are described in the certificate.  This document contains the
    normative specification of Certificate and Certificate Revocation List (CRL) syntax
    in the Resource Public Key Infrastructure (RPKI). The document also specifies
    profiles for the format of certificate requests.  The document also specifies
    the Relying Party RPKI certificate path validation procedure.</p>
