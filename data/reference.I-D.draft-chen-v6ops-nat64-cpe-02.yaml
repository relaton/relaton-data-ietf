abstract:
- language: en
  script: Latn
  content: "<p>The document has summarized NAT64 usages on different modes, in which
    NAT64-CGN would serve for a large-scale network and NAT64-CPE would give residential
    service opportunities to be accessed by IPv6 remote subscribers.  The document
    has described different operations for each usage and proposed operational considerations
    for each particular NAT64-mode.</p>"
