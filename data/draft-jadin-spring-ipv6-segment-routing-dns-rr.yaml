abstract:
- language: en
  script: Latn
  content: "<p>This document defines the IPv6 Segment Routing (SR6) Resource Record
    (RR). This Resource Record gives a path to reach a given destination. The path
    is encoded with an IPv6 Segment List. The host uses a Segment Routing Header (SRH)
    derived from the SR6 RR to reach the destination.</p>"
