abstract:
- language: en
  script: Latn
  content: "<p>This document defines one mechanism that enables a DNS resolver to
    inform a DNS client that filtering policies are in place and what their concern
    is. The second mechanism describes how a DNS client can request a resolver whether
    filtering policies are in place and what their concern is.</p>"
