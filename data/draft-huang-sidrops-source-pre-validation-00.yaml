abstract:
- language: en
  script: Latn
  content: "<p>The Resource Public Key Infrastructure (RPKI) and Route Origin\n   Validation (ROV) have significantly improved inter-domain routing\n   security.  However, thousands of RPKI-invalid routes - the vast\n   majority caused by misconfiguration or synchronization delays -\n   persistently appear in the global routing table.  Many of these self-\n   inflicted invalid routes originate from autonomous systems (ASes)\n   that could have easily blocked them before advertisement.\n\n   This document defines a *Best Current Practice (BCP)* for *source\n   pre-validation*: the practice by which an originating AS checks its\n   intended BGP announcement against its local RPKI cache *before*\n   sending it to eBGP neighbors.  Routes that would be evaluated as\n   Invalid (or NotFound for strict mode) are blocked, logged, and *MUST\n   be cached* for later re-evaluation, enabling automatic recovery when\n   RPKI data changes.  Routes evaluated as Valid or NotFound(for default\n   mode) may be advertised normally.\n\n   This BCP complements existing standards RFC8893 &amp; RFC9324 by focusing\n   on *mandatory deployment at the origin* and on *outbound caching* of\n   suppressed routes.  It provides operational guidance for deployment,\n   cache management, and handling of RPKI data updates.  Implementation\n   of this BCP reduces self-inflicted invalid routes, improves global\n   routing stability, and encourages wider ROV adoption.</p>"
