abstract:
- language: en
  script: Latn
  content: "<p>This document specifies Classic McEliece, a Key Encapsulation Method
    (KEM) designed for IND-CCA2 security, even against quantum computers. This is
    a transcribed version of the proposed ISO Classic McEliece draft, which ISO standardized
    in June 2026. About This Document This note is to be removed before publishing
    as an RFC. Status information for this document may be found at https://datatracker.ietf.org/doc/draft-josefsson-mceliece/.
    Source for this draft and an issue tracker can be found at https://gitlab.com/jas/ietf-mceliece.</p>"
