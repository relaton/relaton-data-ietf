abstract:
- language: en
  script: Latn
  content: "<p>The Diameter authentication, authorization, and accounting (AAA) protocol
    provides support for peering AAA transactions across the Internet. This document
    describes an API for the Diameter protocol. The API is defined for the C language.
    The intent of the API is to foster source code portability across multiple programming
    platforms.</p>"
