abstract:
- language: en
  script: Latn
  content: '<p>This document introduces the YANG module "iana-dns-class-rr-type",
    which contains derived types reflecting two IANA registries: DNS CLASSes and Resource
    Record (RR) TYPEs. These YANG types are intended as the minimum basis for future
    data modeling work.</p>'
