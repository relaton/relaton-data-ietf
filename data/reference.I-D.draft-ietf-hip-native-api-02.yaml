abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the current networking APIs for
    protocols based on identifier/locator split. Currently, the document focuses on
    HIP, but the extensions can be used also by other protocols implementing identifier
    locator split. Using the API extensions, new SHIM aware applications can configure
    manually mappings between upper layer identifiers and the corresponding locators.
    Also, the API describes how to handle outbound connection establishment where
    an application is unaware of the peer identifier but knows the peer locator.</p>"
