abstract:
- language: en
  script: Latn
  content: "<p>Semantics and data formats for common services of Instant Messaging\nand online Presence, independent of underlying transfer\ninfrastructure, are described.  The CPIM profile meets the\nrequirements specified in RFC 2779 using a minimalist approach\nallowing interoperation of a wide range of IM and Presence systems</p>"
