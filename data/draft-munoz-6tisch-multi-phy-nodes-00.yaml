abstract:
- language: en
  script: Latn
  content: "<p>The present document describes the needs that arise when considering
    to use more than one PHY in a IPv6 over the TSCH mode of IEEE802.15.4e (6TiSCH)
    network. These considerations are present in: the choice of the PHY, the MAC layer
    -TSCH- configuration, the 6top protocol, 6LoWPAN and RPL.</p>"
