abstract:
- language: en
  script: Latn
  content: "<p>This document proposes to migrate the MCAST.NET domain into the ARPA
    top level domain that is dedicated to infrastructure support.  It also provides
    for a maintenance policy for the new MCAST.ARPA domain and covers migration issues
    and caveats.  This document updates RFC 5771 and forms part of BCP 51.  XXX reverse
    mapping</p>"
