abstract:
- language: en
  script: Latn
  content: "<p>QUIP is a brokerless federation protocol over QUIC. It provides portable
    Ed25519 identities, causal consistency via Dotted Version Vectors, and queueless
    transport via four explicit tiers with backpressure. QUIP replaces DNSSEC-based
    trust with Key Transparency + Trust-On-First-Use, enabling 99% deployability while
    improving security against registrar compromise.</p>"
