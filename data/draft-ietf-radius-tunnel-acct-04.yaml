abstract:
- language: en
  script: Latn
  content: "<p>This document defines new RADIUS (Remote Authentication Dial In User
    Service) accounting Attributes and new values for the existing Acct- Status-Type
    Attribute designed to support the provision of compulsory tunneling in dial-up
    networks. This memo provides information for the Internet community.</p>"
