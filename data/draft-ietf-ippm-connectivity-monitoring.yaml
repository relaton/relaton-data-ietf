abstract:
- language: en
  script: Latn
  content: "<p>Within a Segment Routing (SR) domain, segment routed measurement packets
    can be sent along pre-determined paths. This enables new kinds of active measurements.
    Connectivity monitoring supervises the state and performance of a connection or
    a (sub)path from central monitoring systems. This document specifies an experimental
    Type-p connectivity monitoring metric to accomodate such operational needs.</p>"
