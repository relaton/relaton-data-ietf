abstract:
- language: en
  script: Latn
  content: "<p>The Message Session Relay Protocol(MSRP) does not allow efficient topology
    hiding, such that MSRP users can hide the IP Address of their systems.  This limitation
    is due to the fact that MSRP Path headers contain physical IP addresses.  This
    document describes a mechanism which adds a level of indirection to allow topology
    hiding. It defines the option tag msrp-opaque.</p>"
