abstract:
- language: en
  script: Latn
  content: "<p>This document describes the IGMP/MLD-based explicit membership tracking
    function for multicast routers supporting IGMPv3/MLDv2.  The explicit membership
    tracking function contributes to saving network resources and shortening leave
    latency, and enables operators to see which downstream routers(s) on a LAN are
    joined to which multicast tree.</p>"
