abstract:
- language: en
  script: Latn
  content: "<p>Presence and Instant Messaging (IM) federation involves the sharing
    of presence information and exchange of IM across multiple systems. Most often,
    presence and IM federation is assumed to be between different organizations, such
    as between two enterprises or between and enterprise and a service provider.  However,
    federation can occur within a single organization or domain.  This can be the
    result of a multi-vendor network, or a consequence of a large organization that
    requires partitioning.  This document examines different use cases and models
    for intra-domain presence and IM federation.</p>"
