abstract:
- language: en
  script: Latn
  content: "<p>This document provides a recommended default allocation of the mandatory
    fixed context headers for a Network Service Header (NSH) relevant to Service Function
    Chaining (SFC) for network security Service Functions. NSH is defined in [I-D.ietf-sfc-nsh].
    This allocation is intended to support the use cased described in [I-D.wang-sfc-ns-use-cases].</p>"
