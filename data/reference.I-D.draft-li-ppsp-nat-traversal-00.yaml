abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a NAT traversal solution using ICE for PPSP.
    To use ICE with PPSP, this document proposes some modifications to ICE and some
    requirements on PPSP.  First, capable PPSP peers function as STUN/relay servers,
    and PPSP protocol is used to discover them.  Second, PPSP protocol is used to
    convey candidate addresses. Third, in addition to STUN message, PPSP message is
    proposed as an option to test connectivity.  Fourth, as an option, proxy peer
    is proposed to relay PPSP messages.</p>"
