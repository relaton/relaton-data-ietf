title:
- language: en
  script: Latn
  content: Discovering MNA Capabilities Using LSP Ping
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ihlesong-mpls-mna-signaling-04
docidentifier:
- content: draft-ihlesong-mpls-mna-signaling
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2026-07-18'
abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism for discovering MPLS Network\n   Actions (MNA) capabilities along a Label Switched Path (LSP) using\n   the LSP Ping echo request/reply mechanism defined in RFC 8029.  The\n   In-Stack MNA capabilities include the Readable Label Depth (RLD), the\n   maximum sizes of differently scoped Network Action Sub-stacks\n   (MLD_NAS), and supported In-Stack network action opcodes.  The Post-\n   Stack MNA capabilities include the maximum Post-Stack MPLS Header\n   size (MLD_PSMH), the Readable Label Depth including the Post-Stack\n   MPLS Header (RLD_PSMH), and supported Post-Stack network action\n   opcodes.  This mechanism allows the ingress Label Edge Router (LER)\n   to discover MNA capabilities of each transit and egress node on the\n   path, enabling correct construction of MPLS label stacks containing\n   MNA network actions.</p>"
