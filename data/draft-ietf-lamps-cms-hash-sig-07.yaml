- language: en
  script: Latn
  content: "<p>This document specifies the conventions for using the the HSS/LMS hash-based
    signature algorithm with the Cryptographic Message Syntax (CMS). In addition,
    the algorithm identifier and public key syntax are provided. The HSS/LMS algorithm
    is one form of hash-based digital signature; it is described in [HASHSIG].</p>"
