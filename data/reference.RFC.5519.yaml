abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes objects used for managing the Internet Group Management Protocol
    (IGMP) and the Multicast Listener Discovery (MLD) protocol.  [STANDARDS-TRACK]</p>"
