abstract:
- language: en
  script: Latn
  content: "<p>This document describes an alternative mechanism to DANE ([RFC6698])
    in order to authenticate a DNS-over-TLS (DoT [RFC7858]) authoritative server by
    not making DNSSEC a hard requirement, making DoT server authentication available
    for insecure delegations.</p>"
