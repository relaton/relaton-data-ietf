abstract:
- language: en
  script: Latn
  content: "<p>The Network Management Operations (NMOP) working group has adopted
    documents describing an architecture, an operational lifecycle, and a semantics
    for network anomaly detection. Those documents direct implementers to minimize
    false positives and false negatives, but do not define how the accuracy of an
    anomaly detection implementation is to be measured, compared, or tracked over
    time. This document describes an evaluation methodology for machine-learning-based
    anomaly detection systems operating on network and infrastructure telemetry: the
    metrics to report and their known failure modes, a benchmarking procedure based
    on controlled fault injection and replay, and the properties a benchmark dataset
    needs in order to support reproducible, comparable evaluation. The methodology
    is informational and complements the adopted NMOP anomaly-detection documents.</p>"
