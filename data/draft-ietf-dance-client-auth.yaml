  primary: true
date:
- type: published
  at: '2026-09-11'
abstract:
- language: en
  script: Latn
  content: "<p>The DANE TLSA protocol describes how to publish Transport Layer\n   Security (TLS) server certificates or public keys in the DNS.  This\n   document updates RFC 6698 and RFC 7671.  It describes how to use the\n   TLSA record to publish client certificates or public keys, and also\n   the rules and considerations for using them with TLS.  In addition,\n   it defines a new TLS extension, DANE Client Identity, to convey the\n   client's domain name identity to the server.</p>"
