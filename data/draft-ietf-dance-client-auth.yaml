title:
- language: en
  script: Latn
  content: TLS Client Authentication via DANE TLSA records
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ietf-dance-client-auth-14
docidentifier:
- content: draft-ietf-dance-client-auth
