abstract:
- language: en
  script: Latn
  content: "<p>This document defines a number of transport mechanisms that are used
    to move Certificate Management over CMS (CMC) messages. The transport mechanisms
    described in this document are HTTP, file, mail, and TCP.</p><p>This document
    obsoletes RFCs 5273 and 6402.</p>"
