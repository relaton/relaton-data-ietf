abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a method for optional flow control credit \n
    \  scaling and link quality metric scaling for Point-to-Point over  \n   Ethernet
    (PPPoE).  Credit and metric scaling is required when \n   connecting to high performance
    devices that employ the PPPoE credit\n   flow control and link metric reports
    as defined in RFC 4938.</p>"
