abstract:
- language: en
  script: Latn
  content: "<p>This document extends RFC 4279, RFC 4492 and RFC 4785, and specifies
    a set of ciphersuites that use a pre-shared key (PSK) to authenticate an Elliptic
    Curve Diffie-Hellman exchange (ECDH).  These ciphersuites provide Perfect Forward
    Secrecy (PFS).</p>"
