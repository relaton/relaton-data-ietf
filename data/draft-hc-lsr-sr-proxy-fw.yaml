abstract:
- language: en
  script: Latn
  content: |-
    <p>This document describes extensions to OSPF and IS-IS to support SR
       proxy forwarding mechanism for fast protecting the failure of a node
       with segments on a SR-TE path.  The segments of the node include
       adjacency, node or binding segments.</p>
