abstract:
- language: en
  script: Latn
  content: "<p>By introducing multiple aggregated control URIs to be used with PLAY
    requests inside one single RTSP session, it is possible to switch content channel
    with minimal delay. This is important for accessing content channels via unicast
    networks while keeping the content streams the same as for multicast/broadcast
    network. An important use case is hybrid unicast and broadcast distribution of
    live media, e.g. mobile TV. The possible control URIs can be specified using a
    new SDP control attribute altcontrol either explicitly or in a dynamic out-of-band
    way.</p>"
