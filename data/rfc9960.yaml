abstract:
- language: en
  script: Latn
  content: "<p>The Point-to-Multipoint (P2MP) Policy enables creation of P2MP trees
    for efficient multipoint packet delivery in a Segment Routing (SR) domain.  This
    document specifies the architecture, signaling, and procedures for SR P2MP Policies
    with Segment Routing over MPLS (SR-MPLS) and Segment Routing over IPv6 (SRv6).
    \ It defines the SR P2MP Policy construct, candidate paths (CPs) of an SR P2MP
    Policy, and the instantiation of the P2MP tree instances (PTIs) of a CP using
    Replication segments.  Additionally, it describes the required extensions for
    a controller to support P2MP path computation and provisioning.  This document
    updates RFC 9524.</p>"
