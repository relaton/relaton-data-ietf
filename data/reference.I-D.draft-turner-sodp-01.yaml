abstract:
- language: en
  script: Latn
  content: "<p>This document describes the Secure Object Delivery Protocol (SODP).
    SODP enables clients to access secure packages produced by a Key Management Systems
    (KMS).  Client access is ideally direct and web- based, but access via agents
    acting on behalf of clients is supported.</p>"
