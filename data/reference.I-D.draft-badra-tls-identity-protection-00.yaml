abstract:
- language: en
  script: Latn
  content: <p>This document defines a special Signaling Cipher Suite Value (SCSV)
    "TLS_IDENTITY_PROTECTION_SCSV", with code point {XxXX, XxXX}.  This SCSV is not
    a true cipher suite (it does not correspond to any valid set of algorithms) and
    cannot be negotiated.  By negotiating this ciphersuite, the TLS clients will be
    able to determine for themselves when, how, to what extent and for what purpose
    information about them is communicated to others.</p>
