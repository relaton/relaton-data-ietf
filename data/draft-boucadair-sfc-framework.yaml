abstract:
- language: en
  script: Latn
  content: "<p>IP networks rely more and more on the combination of advanced functions
    (besides the basic routing and forwarding functions) for the delivery of added
    value services. This document defines a reference architecture and a framework
    to enforce Service Function Chaining (SFC) with minimum requirements on the physical
    topology of the network.</p>"
