abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the Static Context Header Compression
    (SCHC) framework that improve context management efficiency. Two categories of
    mechanisms are introduced: rule referencing CDAs (ref and ref-edit) that enable
    composable rule definitions and reduce context storage, and a rule fragment branching
    CDA (branch) with associated Matching Operators that enable dynamic multi-layer
    protocol compression without combinatorial rule explosion.</p>"
