abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Protocol for Carrying Authentication for
    Network Access (PANA), a network-layer transport for Extensible Authentication
    Protocol (EAP) to enable network access authentication between clients and access
    networks. PANA protocol specification covers the client-to-network access authentication
    part of an overall secure network access framework, which additionally includes
    other protocols and mechanisms for service provisioning, access control as a result
    of initial authentication, and accounting.</p>"
