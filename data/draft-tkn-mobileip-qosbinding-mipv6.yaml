abstract:
- language: en
  script: Latn
  content: "<p>This draft presents a scheme for QoS support in Mobile IPv6 based on\nthe architecture of Hierarchical Mobile IPv6.  A QoS option, a hop-\nby-hop header extension option first presented by Chaskar et al.\n[6], is carried in the message containing the Binding Update (BU)\noption to the mobility anchor point (MAP).</p>"
