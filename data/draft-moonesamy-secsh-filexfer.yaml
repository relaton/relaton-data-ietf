abstract:
- language: en
  script: Latn
  content: "<p>The SSH File Transfer Protocol provides secure file transfer\n   functionality over any reliable data stream.  It is the standard file\n   transfer protocol for use with the SSH2 protocol.  This document\n   describes the file transfer protocol and its interface to the SSH2\n   protocol suite.</p>"
