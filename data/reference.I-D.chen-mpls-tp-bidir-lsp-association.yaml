- language: en
  script: Latn
  content: "<p>This document defines a mechanism to bind two unidirectional LSPs into
    an associated bidirectional LSP and perform related operations, including update,
    withdrawal and verification of the association without a control plane. This is
    achieved using Generic Associated Channel.</p>"
