abstract:
- language: en
  script: Latn
  content: |-
    <p>This document creates an IANA registry for the PCAP and PCAPNG
       LINKTYPE values.  The PCAP and PCAPNG formats are used to save
       network captures from programs such as tcpdump and wireshark, when
       using libraries such as libpcap.</p>
