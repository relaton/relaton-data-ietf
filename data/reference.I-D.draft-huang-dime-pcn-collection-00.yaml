abstract:
- language: en
  script: Latn
  content: "<p>Pre-Congestion notification (PCN) is a technique for maintaining QoS
    for inelastic flows in a DIFFServ domain.  The PCN architecture requires that
    egress nodes send reports of congestion-related events (flow admission state change,
    excess flow) reliably to a policy decision point.  The ITU-T is working on a variant
    of this architecture which places the policy decision point in a central node
    rather than ingress or egress nodes of the network.  In this case the policy decision
    point must request and obtain certain data from an ingress node when it receives
    an excess flow report affecting that ingress node.  This memo defines a Diameter
    application to support egress node reporting and data collection from the ingress
    node.  The nature of the data flows requires the policy decision point to act
    both as server and as client.  Hence this memo draws upon the precedent established
    by the Rw application (RFC 5431 and ITU-T Recommendation Q.3303.3).</p>"
