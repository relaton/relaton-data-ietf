abstract:
- language: en
  script: Latn
  content: "<p>The Border Gateway Protocol (BGP) is a critical component in the Internet
    to exchange routing information between network domains. Due to this central nature,
    it is important to understand the security and reliability requirements that can
    and should be met to prevent accidental or intentional routing disturbances. Previously,
    security considerations for BGP have been described in RFC7454 / BCP194. Since
    the publications of RFC7454, several developments and changes in operational practice
    took place that warrant an update of these best current practices. This document
    obsoletes RFC7454, focusing on the overall goals, and providing a less implementation
    centric set of best practices. This document describes security requirements and
    goals when operating BGP for exchanging routing information with other networks,
    and explicitly does not focus on specific technical implementations and requirements.</p>"
