abstract:
- language: en
  script: Latn
  content: "<p>This document clarifies an ambiguity in the TLS 1.3 key share selection,
    to avoid a downgrade when server assumptions do not match client behavior. It
    additionally defines a mechanism for servers to communicate key share preferences
    in DNS. Clients may use this information to reduce TLS handshake round-trips.</p>"
