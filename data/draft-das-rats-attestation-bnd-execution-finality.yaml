title:
- language: en
  script: Latn
  content: Attestation-Bound Execution Finality for GPU, AI Accelerator, DPU, SmartNIC, and Confidential-Computing Infrastructure
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-das-rats-attestation-bnd-execution-finality-04
