- language: en
  script: Latn
  content: "<p>This specification defines a link relation type that is intended to
    convey that a URI, other than the URI that provides a link with the relation type,
    is preferred for the purpose of referencing. Note to Readers Please discuss this
    draft on the ART mailing list (&lt;https://www.ietf.org/mailman/listinfo/art&gt;).</p>"
