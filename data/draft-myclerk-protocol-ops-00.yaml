abstract:
- language: en
  script: Latn
  content: "<p>This document defines the application-layer operation codes for the\n   MyClerk Protocol.  It serves as the authoritative registry for\n   operation codes in the 0x0700-0x1DFF range, covering knowledge\n   management, settings, messaging, telephony, calendar, tasks, smart\n   home, automation, AI assistant, synchronization, orchestration,\n   presence, health, location, plugins, mobile device management, legal\n   documents, mobility, travel, audit, audio pipeline, and desktop\n   client operations.\n\n   This companion document follows the \"Assigned Numbers\" pattern\n   established by Bluetooth SIG specifications, separating the operation\n   registry from the core protocol specification to allow independent\n   evolution of application operations.</p>"
