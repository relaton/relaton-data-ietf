abstract:
- language: en
  script: Latn
  content: "<p>While the principal purpose of the Domain Name System (DNS) is to translate
    Internet domain names to IP addresses, over time a number of Internet applications
    have integrated supplemental features into the DNS to support their operations.
    \ Many of these features assist in locating the appropriate service in a domain,
    or in transforming intermediary identifiers into names that the DNS can process.
    Proposals to piggyback more sophisticated application behavior on top of the DNS,
    however, have raised questions about the propriety of instantiating some features
    in the DNS, especially those with security sensitivities.  This document explores
    the architectural consequences of installing application features in the DNS,
    and provides guidance for future work in this area.</p>"
