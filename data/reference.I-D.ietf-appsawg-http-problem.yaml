  script: Latn
  content: <p>This document defines a "problem detail" as a way to carry machine-
    readable details of errors in a HTTP response, to avoid the need to define new
    error response formats for HTTP APIs.  Note to Readers  This draft should be discussed
    on the apps-discuss mailing list [1].  This section is to be removed before publication.  Note
    to RFC Editor  Please replace all occurrences of "XXXX" with the final RFC number
    chosen for this draft.  This section is to be removed before publication.</p>
