- language: en
  script: Latn
  content: "<p>TRILL OAM Fault Management specification is presented in this document.
    Methods in this document follow the IEEE 802.1 CFM framework and reuse OAM tools
    where possible. Additional messages and TLVs are defined for TRILL specific applications
    or where a different set of information is required other than IEEE 802.1 CFM.</p>"
