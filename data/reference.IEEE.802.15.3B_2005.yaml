abstract:
- language: en
  script: Latn
  content: <p>Amendment to IEEE Std 802.15.3-2003 The protocol and compatible interconnection
    of data and multimedia communication equipment via 2.4 GHz radio transmissions
    in a Wireless Personal Area Network (WPAN) using low power and multiple modulation
    formats to support scalable data rates is defined in this standard. The Medium
    Access Control (MAC) sublayer protocol supports both isochronous and asynchronous
    data types. The "IEEE Get Program" grants public access to view and download individual
    PDFs of select standards at no charge. Visit http://standards.ieee.org/about/get/index.html
    for details.</p>
