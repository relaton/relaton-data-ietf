abstract:
- language: en
  script: Latn
  content: "<p>The Session PEERing for Multimedia INTerconnect working group (SPEERMINT)
    provides a peering framework that leverages the building blocks of existing IETF-defined
    protocols such as SIP and ENUM for the interconnection between SIP service providers.
    \ The objective of this document is to identify and enumerate SPEERMINT-specific
    threat vectors and to give guidance for implementers on selecting appropriate
    countermeasures.  Security requirements for SPEERMINT which have been derived
    from the threats detailed in this document can be found in draft-ietf-speermint-requirements;
    this document provides concrete countermeasures to meet those SPEERMINT security
    requirements.  In this document, the different security threats related to SPEERMINT
    are classified into threats to the Lookup Function (LUF), to the Location Routing
    Function (LRF), to the Signaling Function (SF), and to the Media Function (MF).
    \ Various instances of the threats are briefly introduced inside the classification.
    \ Finally, existing security solutions for SIP and RTP/RTCP are presented to describe
    countermeasures currently available for such threats.</p>"
