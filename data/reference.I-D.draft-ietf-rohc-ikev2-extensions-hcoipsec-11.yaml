abstract:
- language: en
  script: Latn
  content: "<p>In order to integrate Robust Header Compression (ROHC) with IPsec,
    a mechanism is needed to signal ROHC channel parameters between end- points.  Internet
    Key Exchange (IKE) is a mechanism which can be leveraged to exchange these parameters.
    \ This document specifies extensions to IKEv2 that will allow ROHC and its associated
    channel parameters to be signaled for IPsec security associations (SAs).</p>"
