abstract:
- language: en
  script: Latn
  content: "<p>This specification defines a mechanism to preserve identity information
    and federate authorization across trust domains that use the OAuth 2.0 Framework.
    Discussion Venues This note is to be removed before publishing as an RFC. Discussion
    of this document takes place on the Web Authorization Protocol Working Group mailing
    list (oauth@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/oauth/.
    Source for this draft and an issue tracker can be found at https://github.com/oauth-wg/oauth-identity-chaining.</p>"
