abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a new IP-only L2VPN solution which uses BGP/MPLS
    IP VPN technology [RFC4364] with some extensions, together with some other proven
    technologies including ARP proxy [RFC925][RFC1027] to provide a more scalable
    IP-only L2VPN services across a MPLS/IP backbone. This solution is intended to
    be a scalable data center network architecture which can be deployed today as
    an alternative to the spanning tree protocol bridge technology.</p>"
