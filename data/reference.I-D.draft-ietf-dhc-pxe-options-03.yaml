abstract:
- language: en
  script: Latn
  content: "<p>We define DHCP options being used by Preboot eXecution Environment
    (PXE) and Extensible Firmware Interface (EFI) clients to uniquely identify booting
    client machines and their pre-OS runtime environment so the DHCP and/or PXE boot
    server can return the correct OS bootstrap image (or pre-boot application) name
    and server to the client.</p>"
