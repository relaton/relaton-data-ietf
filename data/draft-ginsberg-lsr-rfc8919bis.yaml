title:
- language: en
  script: Latn
  content: IS-IS Application-Specific Link Attributes
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-ginsberg-lsr-rfc8919bis-02
docidentifier:
- content: draft-ginsberg-lsr-rfc8919bis
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2022-07-24'
abstract:
- language: en
  script: Latn
  content: "<p>Existing traffic-engineering-related link attribute advertisements\n   have been defined and are used in RSVP-TE deployments.  Since the\n   original RSVP-TE use case was defined, additional applications (e.g.,\n   Segment Routing Policy and Loop-Free Alternates) that also make use\n   of the link attribute advertisements have been defined.  In cases\n   where multiple applications wish to make use of these link\n   attributes, the current advertisements do not support application-\n   specific values for a given attribute, nor do they support indication\n   of which applications are using the advertised value for a given\n   link.  This document introduces new link attribute advertisements\n   that address both of these shortcomings.\n\n   This document obsoletes RFC 8919.</p>"
