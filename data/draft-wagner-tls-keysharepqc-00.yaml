abstract:
- language: en
  script: Latn
  content: |-
    <p>[RFC8446] is modified to where another key share extension is
       introduced to accommodate both public keys and ciphertexts in
       ClientHello and ServerHello messages for post-quantum algorithms that
       have large public keys, including the code-based cryptographic
       schemes the Classic McEliece family and the RLCE algorithm group.</p>
