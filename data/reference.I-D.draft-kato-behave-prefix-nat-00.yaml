abstract:
- language: en
  script: Latn
  content: "<p>This document describes a use-case of IPv6-to-IPv6 network address
    translation, and a new translation mechanism.  To be used in a network where IPv6
    /64 prefix is advertiesed, a network address translation mechanism is proposed
    that is based on Interface Identifier rewriting to be checksum neutral.</p>"
