abstract:
- language: en
  script: Latn
  content: "<p>This document describes Service Provider requirements for MPLS- TE/GMPLS
    interworking. The main objective is to allow the operation of an MPLS-TE network
    as a client network over a GMPLS network. The GMPLS network may be a packet or
    non-packet network. Specification of solutions is out of scope for this document.</p>"
