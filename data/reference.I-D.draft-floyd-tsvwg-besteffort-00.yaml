abstract:
- language: en
  script: Latn
  content: <p>This document presents some observations on "simple best-effort" traffic,
    defined loosely for the purposes of this document as Internet traffic that is
    not covered by Quality of Service mechanisms, congestion-based pricing, or the
    like. One observation is that simple best-effort traffic serves a useful role
    in the Internet, and is worth keeping. While traffic with Quality of Service mechanisms,
    congestion-based pricing, or the like can also be useful, we believe that they
    are useful as **adjuncts** to simple best-effort traffic, not as **replacements**
    of simple best-effort traffic. A second observation is that for simple best-effort
    traffic, some form of rough flow rate fairness is a useful goal for resource allocation,
    where "flow rate fairness" is defined by the goal of equal flow rates for different
    flows.</p>
