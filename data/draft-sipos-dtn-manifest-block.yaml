- language: en
  script: Latn
  content: "<p>This document defines an extension block type for Bundle Protocol version
    7 to capture discretionary summary data about the state of a Bundle at the time
    the extension block is added. This Manifest structure is a general purpose container
    for information about other blocks, and can be used as a piece-part of a larger
    security operation.</p>"
