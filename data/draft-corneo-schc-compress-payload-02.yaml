abstract:
- language: en
  script: Latn
  content: "<p>This document describes techniques to adapt the SCHC framework (RFC8724),
    used for header compression, to also compress and decompress payload of specific
    protocols. To this end, this document defines a new matching operator, equal-template,
    to check equality of field values with respect to a user-defined template, and
    a payload keyword to be used as Field IDentifier (FID) to signal the presence
    of payload to be compressed or decompressed. Additionally, this document defines
    a set of template functions and variables to optimize user-defined templates,
    which can be extended through the IANA registry defined herein.</p>"
