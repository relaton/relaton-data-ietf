abstract:
- language: en
  script: Latn
  content: "<p>This document specifies MetaLinkHeader: Mirrors and Checksums in HTTP
    Headers, an alternative to the Metalink XML-based download description format.
    \ MetaLinkHeader describes multiple download locations (mirrors), Peer-to-Peer,
    checksums, digital signatures, and other information using existing standards.
    \ Clients can transparently use this information to make file transfers more robust
    and reliable.</p>"
