abstract:
- language: en
  script: Latn
  content: "<p>Future edge systems may span terrestrial infrastructure, maritime gateways,
    and non-terrestrial nodes such as low-Earth-orbit satellites. In these environments,
    a computing service, its executable instances, input data, and reusable results
    may be distributed across intermittently connected and resource-constrained nodes.
    This document describes a problem statement, an illustrative network model, and
    requirements for name-based discovery of computing services and reusable results.
    The objective is to separate stable service identity from temporary execution
    location while supporting disruption awareness, metadata authenticity, controlled
    result reuse, and incremental deployment over existing IP and Information-Centric
    Networking infrastructures. This document does not define a wire protocol, a naming
    syntax, or a traffic-steering algorithm.</p>"
