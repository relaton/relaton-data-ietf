- language: en
  script: Latn
  content: "<p>This document provides an online mechanism for checking the revocation
    status of raw public keys.  The mechanism is based on its older brother for X.509
    certificates, OCSP.  Note  Discussion and suggestions for improvement are requested,
    and should be sent to tls@ietf.org.</p>"
