abstract:
- language: en
  script: Latn
  content: "<p>This document describes common misinterpretations and some ambiguities
    in the Signalling Compression Protocol (SigComp), and offers guidance to developers
    to clarify any resultant problems. SigComp defines a scheme for compressing messages
    generated by application protocols such as the Session Initiation Protocol (SIP).
    This document does not address compression specific issues such as different compressor
    types and bytecode. This information can be found in a separate document.</p>"
