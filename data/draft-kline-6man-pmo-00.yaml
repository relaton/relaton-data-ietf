- language: en
  script: Latn
  content: "<p>This document describes an IPv6 Neighbor Discovery (ND) Path MTU Option
    (PMO) for inclusion in Router Advertisements (RAs). This allows some environments
    greater flexibility to support, for example, a higher MTU for on-link or intra-administrative-domain
    communications than for broader Internet communications.</p>"
