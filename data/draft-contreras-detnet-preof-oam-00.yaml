abstract:
- language: en
  script: Latn
  content: "<p>Packet Replication, Elimination, and Ordering Functions (PREOF) enables
    highly reliable packet delivery through path redundancy and packet sequencing
    mechanisms in DetNet domains. Existing DetNet Operations, Administration, and
    Maintenance (OAM) specifications provide mechanisms for monitoring service connectivity,
    packet loss, delay, and overall service performance. However, they do not provide
    detailed operational visibility into the behavior of PREOF functions themselves.
    This document identifies operational observability gaps associated with PREOF,
    defines requirements for PREOF-specific OAM, and introduces a set of observable
    events and metrics to monitor, troubleshoot, and validate PREOF operation independently
    of the underlying DetNet data plane technology.</p>"
