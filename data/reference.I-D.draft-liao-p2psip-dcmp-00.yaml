abstract:
- language: en
  script: Latn
  content: "<p>This document defines a RELOAD Usage for Distributed Conference media
    processing. It describes a new distributed conference architecture which utilizing
    clients ability to handling media data. Different clients' ability information
    is stored in the RELOAD overlay with a new Kind data structure. An optimal media
    transmission path can be calculated with this information.</p>"
