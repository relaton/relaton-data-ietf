- language: en
  script: Latn
  content: "<p>This document specifies DNFTP, a new proposal of a protocol to replace
    the FTP. The fundamental objective is to make it more feature rich, keeping the
    existent one, to adapt new technologies that have been developing in the last
    decade like distributed computing, multimedia and concurrency.</p>"
