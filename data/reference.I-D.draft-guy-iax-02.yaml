abstract:
- language: en
  script: Latn
  content: <p>This document describes the Inter-Asterisk eXchange protocol, Version
    2, (IAX2) an application-layer control and media protocol for creating, modifying,
    and terminating multimedia sessions over Internet Protocol (IP) networks. IAX2
    is targeted primarily at the control of Voice over Internet Protocol (VoIP) calls,
    but can be used with streaming video or any other type of multimedia. IAX2 is
    an "all in one" protocol for handling multimedia in Internet Protocol (IP) networks.
    It combines both control and media services in the same protocol. IAX2's compact
    encoding decreases bandwidth usage and since IAX2 uses a single, static, UDP port,
    it facilitates native support for Network Address Translation (NAT) transparency.
    IAX2 is well suited for Internet telephony service, but, is open enough to support
    additional services.</p>
