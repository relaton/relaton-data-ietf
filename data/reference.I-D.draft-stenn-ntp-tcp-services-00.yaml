abstract:
- language: en
  script: Latn
  content: "<p>NTP was assigned port number 123 in 1985, in RFC 960.  Traditionally,
    it has only used the UDP port as while UDP is useful for time synchronization,
    TCP is not suitable for time synchronization.  UDP packet have length limits,
    and there are rate limits imposed by the protocol specification.  Between the
    UDP packet length and rate limits, some other mechanism must be provided for efficient
    exchange of larger data packets.  A TCP connection can be used for these uses.
    Additionally, we can perform better authentication and authorization checks using
    a TCP connection.</p>"
