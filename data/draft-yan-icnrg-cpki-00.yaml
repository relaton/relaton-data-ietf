abstract:
- language: en
  script: Latn
  content: "<p>With the wide deployment of Named Data Networking (NDN), secure and
    trustful content management architecture is needed in order to authenticate the
    producer of the content and authorize the publisher of the content. This draft
    proposes the architecture of Content Public Key Infrastructure (CPKI) for these
    motivations.</p>"
