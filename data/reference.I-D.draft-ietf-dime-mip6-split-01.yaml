abstract:
- language: en
  script: Latn
  content: "<p>In a Mobile IPv6 deployment the need for an interaction between the
    Home Agent, the AAA infrastructure of the Mobile Service Provider (MSP) and the
    Mobility Service Authorizer (MSA) has been identified. This document describes
    a new Diameter application, called Mobile IPv6 Authorization Application, used
    in conjunction with the Diameter EAP Application is used to perform the necessary
    AAA functions before executing Mobile IPv6 services. This document also specifies
    the role of the Home Agent as part of the AAA infrastructure supporting the Diameter
    Mobile IPv6 Authorization Application.</p>"
