abstract:
- language: en
  script: Latn
  content: "<p>The document describes several use cases of peering between two or
    more service providers that provide real time collaboration services and presence
    and IM in particular. These service providers create a peering relationship between
    themselves thus enabling their users to collaborate with users on other communities.
    The target of the document is to help understanding the requirements for peering
    between domains with regard to real time services</p>"
