abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Agent Operation Authorization framework —\n   a structured mechanism that enables verifiable delegation of actions\n   from human principals to autonomous AI agents with fine-grained agent\n   operation authorization.\n\n   The framework introduces two distinct phases:\n\n   *  Agent Operation Authorization Request: A structured proposal of\n      operations converted to a JSON Web Token (JWT) without including\n      the user's original natural language input.\n\n   *  Agent Operation Authorization Token: A JSON Web Token representing\n      confirmed authorization for a specific agent operation,\n      enforceable at runtime by agents and verifiers.  It\n      cryptographically verifies user intent, prevents unauthorized or\n      hallucinated actions, and ensures auditable traceability of each\n      authorized operation.</p>"
