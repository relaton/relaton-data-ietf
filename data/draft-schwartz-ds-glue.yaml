- language: en
  script: Latn
  content: "<p>This draft describes a mechanism for conveying arbitrary authenticated
    DNS data from a parent nameserver to a recursive resolver as part of a delegation
    response. Discussion Venues This note is to be removed before publishing as an
    RFC. Discussion of this document takes place on the mailing list (ds@ietf.org),
    which is archived at https://mailarchive.ietf.org/arch/browse/ds/. Source for
    this draft and an issue tracker can be found at https://github.com/bemasc/ds-glue.</p>"
