abstract:
- language: en
  script: Latn
  content: "<p>This memo introduces an extension to the RETR command in the POP3 protocol.
    The extension makes it possible for an interrupted RETR command to be continued.
    This is particularly useful when downloading large messages over unstable connections.</p>"
