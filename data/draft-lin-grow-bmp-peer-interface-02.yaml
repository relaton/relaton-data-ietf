abstract:
- language: en
  script: Latn
  content: |-
    <p>This document proposes extending BMP to allow BMP messages with the
       per-peer header to carry interface information for the established
       peer session, especially in order to distinguish parallel link-local
       and unnumbered BGP peers established based on distinct interfaces.</p>
