abstract:
- language: en
  script: Latn
  content: <p>FrodoKEM is a quantum-resistant key encapsulation mechanism (KEM) based
    on the standard Learning With Errors (LWE) problem，standardized by ISO. FrodoKEM
    offers multiple parameter sets, with the recommended sets for general use including
    (e)FrodoKEM-976-AES and (e)FrodoKEM-976-SHAKE for security level 3, and (e)FrodoKEM-1344-AES
    and (e)FrodoKEM-1344-SHAKE for security level 5. This document specifies the conventions
    for using FrodoKEM in the Cryptographic Message Syntax (CMS), using the KEMRecipientInfo
    structure defined in "Use of Key Encapsulation Mechanism (KEM) Algorithms in the
    Cryptographic Message Syntax (CMS)" [RFC9629].</p>
