abstract:
- language: en
  script: Latn
  content: "<p>TCP was designed with fixed, wired networks in mind.  As a result TCP
    performs suboptimal in networks where connectivity disruptions are frequent, e.g.,
    in wireless (multi-hop) networks.  One reason for the performance degradation
    is TCP's over-conservative behavior in face of long connectivity disruptions.
    \ This document describes how connectivity disruption indications provided by
    standard ICMP messages may be exploited to improve TCP's performance.  An RTO
    revert strategy is proposed that enables earlier detection of whether connectivity
    to a previously disconnected peer node has been restored or not.  The scheme is
    a sender only modification which fully respects the TCP congestion control principles.</p>"
