abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the procedure for creating bindings between
    a DHCPv4 [RFC2131]/DHCPv6 [RFC3315] assigned source IP address and an anchor (refer
    to [SAVI-framework]) on SAVI (Source Address Validation Improvements) device.
    The bindings can be used to filter packets with forged IP addresses generated
    on the local link.</p>"
