abstract:
- language: en
  script: Latn
  content: "<p>This document describes the current RFC Editor procedures for handling
    the submission, verification, and posting of errata for the RFC Series, and then
    proposes a more efficient and transparent process.  The main concepts are (1)
    distributing the responsibility for verification to the appropriate organization
    or person for each RFC stream, and (2) using a Web portal to automate the book-keeping
    for handling errata.</p>"
