abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Lightweight Directory Access Protocol (LDAP)
    Assertion Control which allows a client to specify that a directory operation
    should only be processed if the assertion when applied to the target entry of
    the operation. It can be used to construct 'test and set' and 'test and clear'
    operations.</p>"
