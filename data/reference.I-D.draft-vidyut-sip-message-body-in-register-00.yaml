abstract:
- language: en
  script: Latn
  content: "<p>In SIP, Register never carries any message body, but a lot of things
    can be simplified by allowing the one. User can configure their call preferences
    at any moment by just sending a Register message. In present scenario when users
    are becoming more and more demanding it's perfectly logical to allow them to configure
    their call preferences dynamically. The present draft present two such call preferences
    requested by user - call barging and advertising unavailability. It can, however,
    be extended for other scenarios as well.</p>"
