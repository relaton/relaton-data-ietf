abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new security precondition for the Session Description
    Protocol precondition framework described in RFC 3312. A security precondition
    can be used to delay session establishment or modification until media stream
    security has been negotiated successfully.</p>"
