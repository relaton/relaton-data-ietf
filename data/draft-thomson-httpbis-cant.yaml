abstract:
- language: en
  script: Latn
  content: "<p>This document defines an HTTP authentication scheme that can be added
    to an error response to indicate to a client that a successful response will only
    be provided over a new TLS connection, and only if the client has provided a certificate
    on that connection.</p>"
