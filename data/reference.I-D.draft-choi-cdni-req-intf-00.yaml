abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the request interface between a CDN end-user
    and an upstream CDN or downstream CDN to request CDN request routing redirection
    or URI signing.  It specifies the CDNI Request Interface information elements
    and the actual protocol for exchanging them.</p>"
