abstract:
- language: en
  script: Latn
  content: "<p>The decision to develop a Multiprotocol Label Switching (MPLS) Transport
    Profile in cooperation between IETF and ITU-T does not fully defines and document
    process for development the required RFCs.  This document complements the process
    as documented in the JWT decision with a couple of separate elements  o  An adaptation
    of the IETF working group process.  o  Identifies the expected participation in
    the process by the ITU-T.  o  A clarification of the decision rules regarding
    MPLS-TP documents.  This document does not intend specify any ITU-T process, to
    the extent that is necessary it will be done according to ITU-T processes.</p>"
