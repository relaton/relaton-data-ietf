abstract:
- language: en
  script: Latn
  content: "<p>This document describes various methods for interworking between the
    Internet and an Internet in which Endpoint Identifiers are separated from to Routing
    Locators using the Locator/ID Separation Protocol (LISP).  Existing Internet hosts
    that do not participate in the LISP system must still be able to reach sites numbered
    from this EID prefixes.  This new draft describes mechanisms which might be used
    to provide reachability between these types of sites.  A new network  element,
    the Proxy Tunnel Router may also be deployed to act as a transitional LISP Ingress
    Tunnel Router for a subnetwork which does not implement LISP but which requires
    communication to devices that are addressed from LISP prefixes.</p>"
