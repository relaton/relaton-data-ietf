abstract:
- language: en
  script: Latn
  content: "<p>This Internet-draft discusses the relative importance of path selection
    in peer-to-peer (P2P) applications. Recent discussions have highlighted the conflict
    between the use of P2P applications and the costs borne by network infrastructure
    operators. We conclude that it  would be premature for the IETF to strongly pursue
    standardization in this area.</p>"
