abstract:
- language: en
  script: Latn
  content: "<p>This document describes an NSIS QoS Model for networks that use the
    Resource Management in Diffserv (RMD) concept. RMD is a technique for adding admission
    control and preemption function to Differentiated Services (Diffserv) networks.
    The RMD QoS Model allows devices external to the RMD network to signal reservation
    requests to edge nodes in the RMD network. The RMD Ingress edge nodes classify
    the incoming flows into traffic classes and signals resource requests for the
    corresponding traffic class along the data path to the Egress edge nodes for each
    flow. Egress nodes reconstitute the original requests and continue forwarding
    them along the data path towards the final destination. In addition, RMD defines
    notification functions to indicate overload situations within the domain to the
    edge nodes.</p>"
