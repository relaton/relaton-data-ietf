abstract:
- language: en
  script: Latn
  content: "<p>Mobile IPv6 Support for Dual Stack Hosts and Routers requires that
    the mobile node's home link provides native dual stack support. This document
    relaxes this requirement and specifies how a DSMIP6-enabled mobile node can, with
    the help of its home agent, maintain connectivity for both of its home addresses
    while attached to a home link that supports only single IP family.</p>"
