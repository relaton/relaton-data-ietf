abstract:
- language: en
  script: Latn
  content: "<p>This document describes a set of requirements for messaging services
    to interoperate. These requirements are independent of any particular protocol
    or messaging service, describing the set of features an interoperable messaging
    service should support. Services should expect to go beyond the requirements listed
    here, as MIMI's future content format evolves.</p>"
