abstract:
- language: en
  script: Latn
  content: "<p>This document defines the concept of Service &amp; Infrastructure Maps
    (SIMAP) and identifies a set of SIMAP requirements and use cases. The SIMAP was
    previously known as Digital Map. SIMAP evolves the earlier 'Digital Map' concept
    by making explicit the ties between service and infrastructure layers, clarifying
    expected outcomes for operations and automation, and addressing ambiguity associated
    with the term 'digital.' The document intends to be used as a reference for the
    assessment of the various topology modules to meet SIMAP requirements.</p>"
