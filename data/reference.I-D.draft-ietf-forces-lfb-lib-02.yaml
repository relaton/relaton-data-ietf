abstract:
- language: en
  script: Latn
  content: "<p>This document defines basic classes of Logical Function Blocks (LFBs)
    used in the Forwarding and Control Element Separation (ForCES).  It is defined
    according to ForCES FE model [RFC5812] and ForCES protocol [RFC5810] specifications.
    \ The basis classes of LFBs are defined to meet requirements of typical router
    functions.  Descriptions of individual classes of LFBs are presented and detailed
    XML definitions are included.  As use instances, several use cases of the defined
    classes of LFBs to meet typical router functions are proposed in the document.</p>"
