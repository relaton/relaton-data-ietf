abstract:
- language: en
  script: Latn
  content: "<p>To minimize router delay in response to Router Solicitation message,
    several scheme are being discussed in IETF. This document suggests a new Neighbor
    Discovery option which is included in Router Solicitation and/or Router Advertisement
    messages to achieve fast network attachment.</p>"
