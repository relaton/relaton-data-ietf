abstract:
- language: en
  script: Latn
  content: '<p>The IETF TRILL protocol provides least cost pair-wise layer 2 data
    forwarding by using IS-IS link state routing. This document defines a new link
    MTU size negotiation mechanism to update the TRILL documents "Routing Bridges
    (RBridges): Base Protocol Specification" and "Routing Bridges (RBridges): Adjacency".</p>'
