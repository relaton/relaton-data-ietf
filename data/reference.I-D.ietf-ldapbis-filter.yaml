abstract:
- language: en
  script: Latn
  content: "<p>LDAP search filters are transmitted in the LDAP protocol using a binary
    representation that is appropriate for use on the network. This document defines
    a human-readable string representation of LDAP search filters that is appropriate
    for use in LDAP URLs [LDAPURL] and in other applications.</p>"
