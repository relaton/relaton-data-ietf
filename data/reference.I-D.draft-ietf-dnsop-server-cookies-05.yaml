abstract:
- language: en
  script: Latn
  content: "<p>DNS Cookies, as specified in [RFC7873], are a lightweight DNS transaction
    security mechanism that provide limited protection to DNS servers and clients
    against a variety of amplification denial of service, forgery, or cache poisoning
    attacks by off-path attackers.  This document updates [RFC7873] with precise directions
    for creating Server Cookies so that an anycast server set including diverse implementations
    will interoperate with standard clients, suggestions for constructing Client Cookies
    in a privacy preserving fashion, and suggestions on how to update a Server Secret.
    \ An IANA registry listing the methods and associated pseudo random function suitable
    for creating DNS Server Cookies is created, with the method described in this
    document as the first and as of yet only entry.</p>"
