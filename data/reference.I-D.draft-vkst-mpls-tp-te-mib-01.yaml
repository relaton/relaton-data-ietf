abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes managed objects of Tunnels, Identifiers, Label Switch Router and
    Textual conventions for Multiprotocol Label Switching (MPLS) based Transport Profile
    (TP).  This document is a product of a joint Internet Engineering Task Force (IETF)
    / International Telecommunication Union Telecommunication Standardization Sector
    (ITU-T) effort to include an MPLS Transport Profile within the IETF MPLS and Pseudowire
    Emulation Edge-to-Edge PWE3) architectures to support the capabilities and functionalities
    of a packet transport network as defined by the ITU-T.</p>"
