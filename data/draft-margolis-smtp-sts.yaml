- language: en
  script: Latn
  content: "<p>SMTP STS is a mechanism enabling mail service providers to declare
    their ability to receive TLS-secured connections, to declare particular methods
    for certificate validation, and to request sending SMTP servers to report upon
    and/or refuse to deliver messages that cannot be delivered securely.</p>"
