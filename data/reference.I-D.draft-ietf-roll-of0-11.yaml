abstract:
- language: en
  script: Latn
  content: "<p>The Routing Protocol for Low Power and Lossy Networks (RPL) defines
    a generic Distance Vector protocol that is adapted to such networks. RPL requires
    a specific Objective Function to establish a desired routing topology.  This document
    specifies a basic Objective Function that relies only on RPL's basic Protocol
    Data Units; it does not use extensions such as RPL metric containers.</p>"
