abstract:
- language: en
  script: Latn
  content: "<p>Lzip is a general-purpose lossless compressed data format. Lzip uses
    LZMA compression and can achieve higher compression ratios than gzip. Lzip provides
    accurate and robust 3-factor integrity checking. This document describes the lzip
    format and registers a media type, a content coding, and a structured syntax suffix
    to be used when transporting lzip-compressed content via MIME or HTTP.</p>"
  format: text/html
