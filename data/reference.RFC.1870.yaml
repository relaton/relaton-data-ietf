abstract:
- language: en
  script: Latn
  content: "<p>This memo defines an extension to the SMTP service whereby an SMTP
    client and server may interact to give the server an opportunity to decline to
    accept a message (perhaps temporarily) based on the client's estimate of the message
    size.  [STANDARDS-TRACK]</p>"
