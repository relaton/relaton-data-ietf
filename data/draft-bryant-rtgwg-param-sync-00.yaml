- language: en
  script: Latn
  content: |-
    <p>This document describes a mechanism for a link state routing protocol
       to coordinate the value of a network-wide parameter.  The document
       also defines the solution to one specific case: the agreement of a
       common convergence timer value for use in network convergence.</p>
