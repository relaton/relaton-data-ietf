abstract:
- language: en
  script: Latn
  content: "<p>This document describes how E-VPN can be used as an NVO solution and\n   explores the various tunnel encapsulation options and their impact on\n   the E-VPN control-plane and procedures. In particular, the following\n   three encapsulation options are analyzed: MPLS over GRE, VXLAN and\n   NVGRE.</p>"
