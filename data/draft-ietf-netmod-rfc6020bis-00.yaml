- language: en
  script: Latn
  content: |-
    <p>YANG is a data modeling language used to model configuration and
       state data manipulated by the Network Configuration Protocol
       (NETCONF), NETCONF remote procedure calls, and NETCONF notifications.
       This document obsoletes RFC 6020.</p>
