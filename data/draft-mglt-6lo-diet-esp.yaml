abstract:
- language: en
  script: Latn
  content: "<p>This document defines Diet-ESP that adapts IPsec/ESP for IoT. Diet-
    ESP compresses fields of the Standard ESP. The compression is defined by profiles
    based ROHC and ROHCoverIPsec as well as parameters mentioned in the Diet-ESP Context
    agreed between the two Diet-ESP peers for example using IKEv2.</p>"
