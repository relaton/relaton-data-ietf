title:
- language: en
  script: Latn
  content: Scalable Multihoming across IPv6 Local-Address Routing Zones Global-Prefix/Local-Address Stateless Address Mapping (SAM)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-despres-sam-03
