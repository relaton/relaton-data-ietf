abstract:
- language: en
  script: Latn
  content: "<p>SRv6 as designed has evoked interest from various parties, though its
    deployment is being limited, amongst other things, by known security problems
    in its architecture. This document specifies a standard way to create a solution
    that closes some of the major security concerns, while retaining the tenants of
    the SRv6 protocol.</p>"
