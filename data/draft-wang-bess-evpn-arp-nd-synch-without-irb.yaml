abstract:
- language: en
  script: Latn
  content: "<p>This draft discusses serveral signalling modes of EVPN Signalled L3VPNs.
    EVPN Signalled L3VPNs are used to improve L3VPNs for some new use cases. Then
    it discusses which style of RT-5 routes can be selected for these new use cases,
    and why they are selected.</p>"
