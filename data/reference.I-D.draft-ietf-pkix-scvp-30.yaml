abstract:
- language: en
  script: Latn
  content: "<p>SCVP allows a client to delegate certificate path construction and
    certificate path validation to a server. The path construction or validation (e.g.
    making sure that none of the certificates in the path are revoked) is performed
    according to a validation policy, which contains one or more trust anchors. It
    allows simplification of client implementations and use of a set of predefined
    validation policies.</p>"
