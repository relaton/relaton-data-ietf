abstract:
- language: en
  script: Latn
  content: "<p>The Remote Authentication Dial In User Server (RADIUS) Protocol has
    traditionally used the User Datagram Protocol (UDP) as it's underlying transport
    layer.  This document defines RADIUS over the Transmission Control Protocol (TCP),
    in order to address transport issues related to RADIUS over TLS [RTLS].  It is
    not intended to define TCP as a transport protocol for RADIUS in the absence of
    TLS.</p>"
