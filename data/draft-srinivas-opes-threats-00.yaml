abstract:
- language: en
  script: Latn
  content: "<p>This Internet Draft is an attempt to define the security threats against
    the OPES protocol. In addition to the threats, the effects of such security threats
    on the underlying architecture as well as the requirements of a security solution
    to mitigate such threats are discussed. The threats and requirements identified
    herein and the document should be considered as work in progress.</p>"
