abstract:
- language: en
  script: Latn
  content: "<p>Many application technologies enable secure communication between two
    entities by means of Internet Public Key Infrastructure Using X.509 (PKIX) certificates
    in the context of Transport Layer Security (TLS). This document specifies procedures
    for representing and verifying the identity of application services in such interactions.
    \  [STANDARDS-TRACK]</p>"
