abstract:
- language: en
  script: Latn
  content: "<p>This document provides methods and settings for using IPv6 to communicate
    among IPv6 nodes within the communication range of one another over 5G V2X (i.e.,
    the 5th Generation Vehicle-to-Everything) links. Support for these methods and
    settings require minimal changes to existing protocol stacks. This document also
    describes limitations associated with using these methods. Optimizations and usage
    of IPv6 over more complex scenarios are not covered in this specification and
    are a subject for future work.</p>"
