abstract:
- language: en
  script: Latn
  content: "<p>This note describes the fundamental algorithms of Elliptic Curve Cryptography
    (ECC) as they are defined in some early references. These descriptions may be
    useful for implementing the fundamental algorithms without using any of the specialized
    methods that were developed in following years.  Only elliptic curves defined
    over fields of characteristic greater than three are in scope; these curves are
    those used in Suite B.</p>"
