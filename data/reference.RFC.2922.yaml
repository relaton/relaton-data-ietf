abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community.  In particular,
    it describes managed objects used for managing physical topology identification
    and discovery.  This memo provides information for the Internet community.</p>"
