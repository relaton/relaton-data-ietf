abstract:
- language: en
  script: Latn
  content: "<p>This document defines a federated infrastructure layer for cross-\n   platform device and application attestation.\n\n   The proposed architecture extends the Remote ATtestation ProcedureS\n   (RATS) architecture [RFC9334] by introducing privacy-preserving\n   federation, decentralized endorsement distribution, decentralized\n   normalization of attestation claims, and software supply-chain\n   provenance integration.\n\n   The architecture enables interoperable attestation across\n   heterogeneous operating systems, application ecosystems, and trust\n   providers without requiring centralized platform ownership.\n\n   This document defines architectural roles, protocol interactions,\n   endorsement distribution semantics, provenance integration models,\n   and privacy requirements.</p>"
