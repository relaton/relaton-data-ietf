abstract:
- language: en
  script: Latn
  content: "<p>This document defines a new BGP opaque extended community to carry
    the origination AS validation state inside an autonomous system. IBGP speakers
    that receive this validation state can configure local policies allowing it to
    influence their decision process.</p>"
