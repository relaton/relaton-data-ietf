title:
- language: en
  script: Latn
  content: Autonomous System Relationship Authorization (ASRA) as an Extension to ASPA for Enhanced AS Path Verification
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-sriram-sidrops-asra-verification-05
