abstract:
- language: en
  script: Latn
  content: "<p>A key requirement has been identified by the operator community for
    the transparent carriage of the MPLS network of one party over the MPLS network
    of another party. This document describes one IETF- recommended profile to satisfy
    this requirement using the existing RFC4448 PWE3 Ethernet pseudowire standard.
    This solution does not preclude other solutions being developed in the future.</p>"
