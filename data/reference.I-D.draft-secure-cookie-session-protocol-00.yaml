abstract:
- language: en
  script: Latn
  content: <p>This document provides an overview of SCS, a cryptographic protocol
    layered on top of the HTTP cookie facility, that allows an origin server to handle
    session state without storing it locally.  Its typical use cases include devices
    with little or no storage offering some functionality via an HTTP interface, and
    web applications with High Availability or load balancing requirements which may
    want to handle application state without the need to synchronize the pool through
    shared storage or peering.  Nevertheless, its security properties allow it to
    be used whenever privacy and integrity of cookies is a concern, at the cost of
    increased server CPU and bandwidth usage, and of some "credential- ownership"
    implications which will be thoroughly analysed.</p>
