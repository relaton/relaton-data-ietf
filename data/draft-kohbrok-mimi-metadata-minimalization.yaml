- language: en
  script: Latn
  content: "<p>This document describes a proposal to run the MIMI protocol in a way
    that reduces the ability of the Hub and service providers to associate messaging
    activity of clients with their respective identities. For now, this document only
    contains a high-level description of the mechanisms involved.</p>"
