abstract:
- language: en
  script: Latn
  content: "<p>This document defines standard workload profiles for benchmarking\n   Large Language Model (LLM) inference serving systems.  Each profile\n   represents one class of production workload.  A profile is defined by\n   its input and output token distribution, output structure, latency\n   sensitivity, concurrency pattern, and caching behavior.  Profiles are\n   organized into six groups: Non-Generative, Minimal Output,\n   Interactive Streaming, Prefill-Heavy Generative, Decode-Heavy\n   Generative, and Multi-Step Chained.  This document works with\n   \"Benchmarking Methodology for Large Language Model Serving\"\n   [LLM-METHOD].  It specifies the workloads that the methodology's\n   tests SHOULD be run against.</p>"
