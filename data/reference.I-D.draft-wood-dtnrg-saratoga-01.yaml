abstract:
- language: en
  script: Latn
  content: "<p>Saratoga is a simple, lightweight UDP-based transport protocol intended
    for use in moving files between immediately neighbouring peers which have sporadic,
    intermittent connectivity using dedicated IP links. Saratoga focuses on high link
    utilization for fast file transfers. Loss recovery is implemented via a simple
    ARQ mechanism. Saratoga is proposed for use as a convergence layer by Delay-Tolerant
    Networking for deep-space and ad-hoc networking scenarios. Saratoga is not intended
    for use over shared paths, so transport congestion control is unnecessary, although
    it could be optionally implemented at the sender to provide rate control of packet
    output. Saratoga is in continuous operational use by the IP-based Disaster Monitoring
    Constellation satellites in Low Earth Orbit (LEO) for mission-critical transfer
    of remote-sensing imagery.</p>"
