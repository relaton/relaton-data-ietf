abstract:
- language: en
  script: Latn
  content: <p>This document defines an IRIS "service lookup system" registry (slsreg)
    schema, and IRIS queries/responses to support looking up network service records
    (NSRs) based on a registered tag (or label). The NSR will include URIs for set
    types of network services.</p>
