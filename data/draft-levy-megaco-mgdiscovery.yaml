abstract:
- language: en
  script: Latn
  content: "<p>This document addresses the need for a Media Gateway Controller (MGC)
    to be informed from the media resources of its Media Gateways (MG) in the context
    of the Megaco/H.248 protocol. The draft discusses alternative solutions for an
    effective media gateway resources discovery mechanism. The document is provided
    as an informational draft for discussion within the Megaco Working Group.</p>"
