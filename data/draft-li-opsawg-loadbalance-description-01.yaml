abstract:
- language: en
  script: Latn
  content: "<p>This document presents a functional description of the load balancer.
    The Load Balancer (LB) is a network device to distribute workload across multiple
    servers, network links, central processing units, disk drives, or other resources,
    to achieve optimal resource utilization, maximize throughput, minimize response
    time, and avoid overload.</p>"
