abstract:
- language: en
  script: Latn
  content: "<p>This document defines Source Origin Authorization (SOA), a new object\n   in the Resource Public Key Infrastructure (RPKI), for publishing an\n   AS-level service profile used by inter-AS source address protection\n   services.  An SOA object is a digitally signed artifact that carries\n   the publisher AS, its service role, a service descriptor, and the\n   bootstrap information needed to authenticate a private\n   synchronization channel, such as an endpoint address, an optional\n   port, an optional protocol identifier, and a public key.  An SOA does\n   not itself create a subscriber-provider service relation, authorize\n   arbitrary protected prefixes, or carry legitimate predecessor AS\n   sets.  A concrete service relation is established only after\n   discovery, bilateral request validation, and provider acceptance.\n   Routing-dependent data and subsequent updates are exchanged over the\n   authenticated private channel rather than being stored in the RPKI\n   repository.</p>"
