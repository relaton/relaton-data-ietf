abstract:
- language: en
  script: Latn
  content: |-
    <p>This document defines Source Origin Authorization (SOA), a new object
       in the Resource Public Key Infrastructure (RPKI), for publishing an
       AS-level service profile used by inter-AS source address protection
       services.  An SOA object is a digitally signed artifact that carries
       the publisher AS, its service role, a service descriptor, and the
       bootstrap information needed to authenticate a private
       synchronization channel, such as an endpoint address, an optional
       port, an optional protocol identifier, and a public key.  An SOA does
       not itself create a subscriber-provider service relation, authorize
       arbitrary protected prefixes, or carry legitimate predecessor AS
       sets.  A concrete service relation is established only after
       discovery, bilateral request validation, and provider acceptance.
       Routing-dependent data and subsequent updates are exchanged over the
       authenticated private channel rather than being stored in the RPKI
       repository.</p>
