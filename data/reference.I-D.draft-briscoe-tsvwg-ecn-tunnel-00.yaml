abstract:
- language: en
  script: Latn
  content: "<p>This document redefines how the explicit congestion notification (ECN)
    field of the outer IP header of a tunnel should be constructed. It brings all
    IP in IP tunnels (v4 or v6) into line with the way IPsec tunnels now construct
    the ECN field, ensuring that the outer header reveals any congestion experienced
    so far on the path. It specifies the default ECN tunneling behaviour for any Diffserv
    per- hop behaviour (PHB), but also gives general principles to guide the design
    of alternate congestion marking behaviours for specific PHBs and for lower layer
    congestion notification schemes.</p>"
