abstract:
- language: en
  script: Latn
  content: "<p>This document describes an extension for OAM packet such as IP Ping
    (ICMP [RFC0792] or ICMPv6 [RFC4443]) and MPLS LSP Ping [RFC8029], which can be
    used within an IOAM domain, allowing the IOAM encapsulating node to acquire IOAM
    configuration data of each IOAM transit node and/or IOAM decapsulating node easily
    and dynamically.</p>"
