abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an extension to MPLS Operation, Administration,
    and Maintenance (OAM) to operate an MPLS Transport    Profile(MPLS-TP) Label Switched
    Path (LSP) in loopback mode for management purpose. This extension can be used
    to loop either all traffic (i.e, data and control traffic) or only OAM traffic
    up to certain LSR on the path of the MPLS-TP LSP back to the source.</p>"
