- language: en
  script: Latn
  content: "<p>This document deprecates the use of the RSASHA1 and RSASHA1-NSEC3-SHA1
    algorithms for the creation of DNSKEY and RRSIG records. It updates RFC4034 and
    RFC5155 as it deprecates the use of these algorithms.</p>"
