abstract:
- language: en
  script: Latn
  content: "<p>This document describes the way in which the Internet White Pages Service
    is best exploited using today's experience, today's protocols, today's products
    and today's procedures.  This document specifies an Internet Best Current Practices
    for the Internet Community, and requests discussion and suggestions for improvements.</p>"
