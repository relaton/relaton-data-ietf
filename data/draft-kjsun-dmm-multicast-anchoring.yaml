abstract:
- language: en
  script: Latn
  content: "<p>In this draft, we define multicast support functions in a Distributed
    Mobility Management (DMM) environment. Based on the decomposed mobility management
    functions in [RFC7429], each defined multicast support function can be located
    and operated with DMM functions.</p>"
