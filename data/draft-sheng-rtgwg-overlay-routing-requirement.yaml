- language: en
  script: Latn
  content: "<p>Overlay routing is essential during the enterprise networks' evolution
    from the interconnection among multiple on-premise branch sites to more advanced
    ones, such as the interconnection to multi- clouds. This document analyzes the
    technical requirements and challenges of overlay routing for SD-WAN in these scenarios.</p>"
