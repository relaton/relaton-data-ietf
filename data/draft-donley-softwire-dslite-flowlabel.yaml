abstract:
- language: en
  script: Latn
  content: "<p>This document extends the use of Dual-Stack Lite to identify discrete\n   traffic flows using the IPv6 Flow Label.  The identification of\n   discrete traffic flows allows for the application of Quality of\n   Service (QoS) classification and prioritization of traffic traversing\n   Dual-Stack Lite tunnels.</p>"
