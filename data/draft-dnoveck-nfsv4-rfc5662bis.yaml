abstract:
- language: en
  script: Latn
  content: "<p>This document provides the External Data Representation Standard (XDR)
    description for Network File System version 4 (NFSv4) minor version 1. It includes
    protocol extensions made as part of the respecification effort for NFS Minor Version
    1. It obsoletes and replaces RFC5662.</p>"
