abstract:
- language: en
  script: Latn
  content: "<p>The document has proposed an approach of NAT64-CPE mode, which would
    give residential service opportunities to be accessed by remote subscribers going
    through IPv6 networks.  The document captures the fundamental NAT64 functionalities
    with special cares to fit into CPE scenarios and don't need cooperate with DNS64
    any more.  It will compatible with legacy residential servers and no further updates
    requirements to DNS.</p>"
