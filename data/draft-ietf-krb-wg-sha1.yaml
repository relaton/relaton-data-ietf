- language: en
  script: Latn
  content: "<p>The Kerberos cryptosystem specification requires a profile detailing
    several operations for a new checksum type for ensuring the integrity of data
    in Kerberos and related protocol exchanges. This document specifies the use of
    a simple unkeyed checksum type based on SHA-1.</p>"
