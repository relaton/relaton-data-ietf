abstract:
- language: en
  script: Latn
  content: "<p>Mapping of addresses to names is a feature of DNS. Many sites implement
    it, many others do not. Some applications attempt to use it as a part of a security
    strategy. The goal of this document is to encourage proper deployment of address
    to name mappings, and provide guidance for their use.</p>"
