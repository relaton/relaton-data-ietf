abstract:
- language: en
  script: Latn
  content: "<p>At the IETF 77 Clouds Bar BoF, it was suggested that an internet draft
    on survey of standard organizations and working groups that are focusing on cloud-based
    systems and services be prepared.  The objective is to take a snapshot of industry
    activities related to cloud features and functions for the purpose of creating
    a gap analysis.  This document is that survey on industry work items.  At the
    end of this survey a section on work item analysis is presented.</p>"
