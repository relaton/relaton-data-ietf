abstract:
- language: en
  script: Latn
  content: "<p>There is a growing demand for routable IP addresses to support large
    wireless user base today. Wireless operators are looking for ways to leverage
    the IPv6 address space to meet the ever increasing number of wireless data users.
    The operators who has network based IPv4 mobility solutions can leverage the same
    scheme to provide mobility access service with larger address pool using IPv6
    addressing. This document defines such a mechanism.</p>"
