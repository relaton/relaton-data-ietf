abstract:
- language: en
  script: Latn
  content: "<p>This document describes LDP extensions to signal Resilient MPLS Ring\n   (RMR) Label Switched Paths (LSPs).  An RMR LSP is a multipoint to\n   point LSP signaled using LDP (Label Distribution Protocol). RMR\n   Architecture document - draft-ietf-mpls-rmr-02 - describes why and\n   how MPLS should be used in ring topologies.</p>"
