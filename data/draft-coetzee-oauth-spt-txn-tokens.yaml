title:
- language: en
  script: Latn
  content: Transaction-Bound Authorization Tokens for Software and AI Agents (SPT-Txn)
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-coetzee-oauth-spt-txn-tokens-03
