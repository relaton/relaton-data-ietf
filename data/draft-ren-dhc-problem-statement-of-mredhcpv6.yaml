abstract:
- language: en
  script: Latn
  content: "<p>The manageability, security, privacy protection, and traceability of
    networks can be supported by extending DHCPv6 protocol. This document analyzes
    current extension practices and typical DHCP server software on extensions, defines
    a DHCP general model, discusses some extension points, and present extension cases.</p>"
