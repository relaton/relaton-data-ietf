- language: en
  script: Latn
  content: |-
    <p>This document extends the current Management Information Base (MIB)
       defined for BGP in RFC 4273 to provide support for BGP Origin
       Validation.  In particular, it describes manage objects used for
       managing BGP Origin validation state within BGP protocol.</p>
