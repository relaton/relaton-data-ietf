abstract:
- language: en
  script: Latn
  content: "<p>This document defines new Dynamic Host Configuration Protocol (DHCPv4
    and DHCPv6) options that contain a list IP addresses and a list of domain names
    that can be mapped to ANDSF (Access Network    Discovery and Selection Function)
    entities in an IP network. ANDSF is being developed in 3GPP (Release-8) and provides
    inter-system mobility policies and access network specific information to the
    mobile nodes(MNs) [3GPPTS23.402].</p>"
