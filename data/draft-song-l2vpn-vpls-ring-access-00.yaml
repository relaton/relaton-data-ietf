abstract:
- language: en
  script: Latn
  content: "<p>This document introduces a new method to access VPLS network using
    ring techonology. This method can improve VPLS access reliability. Fast switch
    can be done within 50 ms after link failure detection. It not only can be used
    in normal VPLS, but also can be used in VPLS PBB network.</p>"
