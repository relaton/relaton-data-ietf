abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Multi-Vantage Path Snapshot (MVPS) domain\n   profile for video surveillance: fleets of IP cameras, NVR/VMS\n   recorders, and cloud video-surveillance-as-a-service (VSaaS)\n   endpoints treated as MVPS vantages.  Its target threat is the\n   feed-replay (loop) attack -- an on-path adversary that substitutes a\n   live camera stream with previously recorded footage so that operators\n   and single-camera analytics see nothing wrong.\n\n   The profile re-establishes the bounded-joint-skew axiom A1 under the\n   video pipeline (camera NTP/PTP residual, encoder and GOP buffering,\n   recorder jitter buffer, frame-interval quantization), gives a\n   closed-form maximum pipeline budget, and proves the headline result:\n   with capture timestamps authenticated at the sensor, any replayed\n   loop older than a closed-form, strictly positive minimum age leaves\n   the coherence ball and is flagged by core Theorem T2.  The core\n   detection and Byzantine theorems are inherited via the MVPS\n   Architecture-Invariance Theorem.\n\n   The profile is DEFENSIVE: it detects coherence anomalies (feed\n   replay, loop, tamper, rogue ingest).  It defines no facial\n   recognition, biometric, tracking, or identification function.  All\n   properties are validated by scripts/validate_video_surveillance.py\n   (7/7 PASS, exit 0) and recorded in\n   evidence/video_surveillance_receipt.json.</p>"
