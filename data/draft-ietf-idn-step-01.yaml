abstract:
- language: en
  script: Latn
  content: "<p>This document describes an Internationalized Domain Name (IDN) Encoding
    method with US-ASCII [a-z0-9] characters, preserving the primary sound value of
    such names users want, and technically feasible, linguistically demanding once
    mechanism to represent the names of multi-scripts with language tags defined by
    [ISO 639] in the required DNS way, such that the encoded names can be used as
    valid domain name identifiers.</p>"
