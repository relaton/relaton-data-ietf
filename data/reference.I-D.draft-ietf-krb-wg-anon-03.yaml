abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the Kerberos protocol for the Kerberos
    client to authenticate the Kerberos Key Distribution Center and the Kerberos server,
    without revealing the client's identity. These extensions can be used to secure
    communication between the anonymous client and the server.</p>"
