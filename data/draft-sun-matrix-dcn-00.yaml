abstract:
- language: en
  script: Latn
  content: "<p>This document introduces describes the requirement of today's data
    centers and a new type of network topology called MatrixDCN (matrix data center
    network). MatrixDCN is used to deploy large scale data center network, which can
    support more than 100 thousands of servers in one data center without network
    bandwidth bottleneck.</p>"
