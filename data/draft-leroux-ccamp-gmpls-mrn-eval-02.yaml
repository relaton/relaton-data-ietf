abstract:
- language: en
  script: Latn
  content: "<p>This document provides an evaluation of Generalized Multi-Protocol
    \n   Label Switching (GMPLS) protocols and mechanisms against the \n   requirements
    for Multi-Layer Networks (MLN) and Multi-Region Networks \n   (MRN). In addition,
    this document identifies areas where additional \n   protocol extensions or procedures
    are needed to satisfy these \n   requirements, and provides guidelines for potential
    extensions.</p>"
