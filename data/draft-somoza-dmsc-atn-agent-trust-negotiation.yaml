abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Agent Trust Negotiation (ATN) protocol.\n   ATN sits above whatever mechanism is used to discover an agent\n   identity and answers questions that discovery alone cannot: what is\n   the agent permitted to do, under whose authority, with what\n   provenance, and how do two agents reach a verifiable working\n   agreement.\n\n   ATN binds four artifacts to a discovered agent identity:</p>"
