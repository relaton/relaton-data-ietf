abstract:
- language: en
  script: Latn
  content: "<p>This draft describes the scope, set of use-cases and requirements for
    a distributed routing based solution to establish end-to-end intent- aware paths
    spanning multi-domain packet networks. The document focuses on BGP given its predominant
    use in inter-domain routing deployments, however the requirements may also apply
    to other solutions.</p>"
