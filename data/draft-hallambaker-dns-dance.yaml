abstract:
- language: en
  script: Latn
  content: "<p>This is a discussion document prepared for the DANCE Working Group\n   presenting possible convergence between the DNS Handles\n   authentication approach based on OAUTH being used in the ATmosphere\n   and the DANCE approach.\n\n   User experience and architectural requirements for using TLS Client\n   Authentication in a DNS Handles based environment are discussed.</p>"
