- language: en
  script: Latn
  content: "<p>This is a discussion document prepared for the DANCE Working Group
    presenting possible convergence between the DNS Handles authentication approach
    based on OAUTH being used in the ATmosphere and the DANCE approach. User experience
    and architectural requirements for using TLS Client Authentication in a DNS Handles
    based environment are discussed.</p>"
