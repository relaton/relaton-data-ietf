abstract:
- language: en
  script: Latn
  content: "<p>Multi-Protocol Label Switching (MPLS) Label Switched Path (LSP) Ping
    and Traceroute mechanisms are commonly used to detect and isolate data plane failures
    in all MPLS LSPs including Pseudowire (PW) LSPs. The PW LSP Ping and Traceroute
    elements, however, are not specified for IPv6 address usage.  Specifically, the
    Pseudowire FEC sub-TLVs for the Target FEC Stack in the LSP Ping and Traceroute
    mechanism are implicitly defined only for IPv4 Provider Edge (PEs) routers, and
    are not applicable for the case where PEs use IPv6 addresses.  There is, additionally,
    a degree of potential ambiguity in the specification of these sub-TLVs since the
    address family is not explicitly specified but it is to be inferred from the sub-TLV
    length.  This document updates RFC4379 to explicitly constraint these existing
    PW FEC sub-TLVs for IPv4 LDP sessions, and extends Pseudowire LSP Ping to the
    IPv6 scenario where an IPv6 LDP session is used to signal the Pseudowire (i.e.,
    where the Sender's and Receiver's IP addresses are IPv6 addresses.)  This is done
    by defining two new LSP Ping sub- TLVs for IPv6 Pseudowire FECs.</p>"
