abstract:
- language: en
  script: Latn
  content: "<p>This extension to the IPFIX protocol is intended to provide a mechanism
    for IPFIX exporters which export private information elements to also transmit
    information to the collectors. The mechanism is designed to be able to send a
    URI with information about the private information elements via an options template.</p>"
