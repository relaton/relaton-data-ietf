abstract:
- language: en
  script: Latn
  content: |-
    <p>Computing-Aware Traffic Steering (CATS) inherits potential security
       vulnerabilities from the network, computing node as well as workflows
       of CATS procedures.  This document describes various threats and
       security concerns related to CATS networks and existing approaches to
       solve these threats.</p>
