abstract:
- language: en
  script: Latn
  content: "<p>This document defines an efficient IP multicast performance monitoring
    method through packet loss and packet delay measurement. It has the characteristics
    of monitoring real IP multicast stream with the measurement packets following
    the actual multicast forwarding path and it enables the fault detection and isolation
    in IP multicast network.</p>"
