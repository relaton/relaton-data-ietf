abstract:
- language: en
  script: Latn
  content: "<p>Existing agent-security work concentrates on identity: who an agent\n   is, what credentials it holds, and which tools it may reach.  This\n   document addresses the complementary question: whether a specific\n   proposed action, with specific argument values, may be performed now,\n   and under what conditions.  It defines the Agent Action Decision\n   Protocol (AADP), a two-phase wire contract between a Policy Decision\n   Point (PDP) that authorizes agent actions and the Policy Enforcement\n   Points (PEPs) that perform them.  AADP specifies verdicts with\n   machine-readable reasons, obligations that fail closed, budget\n   reservation semantics, approval and idempotency behavior, evidence\n   requirements, and a set of evaluation invariants that any conformant\n   decision point must observe -- including the rule that an\n   irreversible action is never executed autonomously.  The protocol is\n   transport-agnostic and is designed so that decision points and\n   enforcement points can be implemented independently, in different\n   languages, by different parties.</p>"
