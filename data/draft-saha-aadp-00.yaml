abstract:
- language: en
  script: Latn
  content: |-
    <p>Existing agent-security work concentrates on identity: who an agent
       is, what credentials it holds, and which tools it may reach.  This
       document addresses the complementary question: whether a specific
       proposed action, with specific argument values, may be performed now,
       and under what conditions.  It defines the Agent Action Decision
       Protocol (AADP), a two-phase wire contract between a Policy Decision
       Point (PDP) that authorizes agent actions and the Policy Enforcement
       Points (PEPs) that perform them.  AADP specifies verdicts with
       machine-readable reasons, obligations that fail closed, budget
       reservation semantics, approval and idempotency behavior, evidence
       requirements, and a set of evaluation invariants that any conformant
       decision point must observe -- including the rule that an
       irreversible action is never executed autonomously.  The protocol is
       transport-agnostic and is designed so that decision points and
       enforcement points can be implemented independently, in different
       languages, by different parties.</p>
