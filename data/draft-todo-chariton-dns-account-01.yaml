  script: Latn
  content: "<p>This document specifies a new challenge type for the Automated Certificate
    Management Environment (ACME) protocol which allows an ACME client to respond
    to a domain control validation challenge presented by an ACME server with a DNS
    resource that is keyed by the ACME account identification.</p>"
