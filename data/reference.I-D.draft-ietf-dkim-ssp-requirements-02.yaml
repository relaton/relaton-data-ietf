abstract:
- language: en
  script: Latn
  content: "<p>DomainKeys Identified Mail [DKIM] [I-D.ietf-dkim-base] provides a cryptographic
    mechanism for domains to assert responsibility for the messages they handle. A
    related mechanism would allow an administrator to publish various statements about
    their DKIM signing practices. This draft defines the requirement for this mechanism.</p>"
