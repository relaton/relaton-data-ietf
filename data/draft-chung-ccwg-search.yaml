title:
- language: en
  script: Latn
  content: SEARCH -- a New Slow Start Algorithm for TCP and QUIC
source:
- type: src
  content: https://datatracker.ietf.org/doc/html/draft-chung-ccwg-search-10
docidentifier:
- content: draft-chung-ccwg-search
  type: Internet-Draft
