abstract:
- language: en
  script: Latn
  content: "<p>This specification defines JWT claims for including authorization evidence
    and audit trail information in OAuth 2.0 access tokens. These claims enable cryptographic
    proof of user consent, supporting accountability, compliance, and dispute resolution
    in scenarios where autonomous agents act on behalf of users.</p>"
