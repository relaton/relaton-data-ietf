abstract:
- language: en
  script: Latn
  content: "<p>This specification contains a description of a variety of methods to
    increase the lifetime of symmetric keys.  It provides external and internal re-keying
    mechanisms that can be used with such modes of operations as CTR, GCM, CBC, CFB,
    OFB and OMAC.</p>"
