abstract:
- language: en
  script: Latn
  content: "<p>Caller-ID spoofing remains a significant problem in telephony, particularly
    across inter-domain and international call paths where identity frameworks may
    not yet be fully deployed. This document defines *Caller-ID Vouching and Vetting
    (CIDVV)*, a lightweight verification mechanism that lets the called party ask
    a simple question:</p>"
