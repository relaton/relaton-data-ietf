abstract:
- language: en
  script: Latn
  content: "<p>This document proposes a YANG data model for monitoring On-Path network
    performance information to be published in YANG notifications. The Alternate-Marking
    Method and In-situ Operations, Administration, and Maintenance (IOAM) are the
    On-Path hybrid measurement methods considered in this document.</p>"
