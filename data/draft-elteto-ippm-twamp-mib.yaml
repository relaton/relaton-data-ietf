abstract:
- language: en
  script: Latn
  content: "<p>This document defines a portion of the Management Information Base\n   (MIB) for use with network management protocols in the Internet\n   community.  In particular, it defines Management Information Base of\n   Two-Way Active Measurement Protocol [RFC5357] for both Control and\n   Test protocols.</p>"
