title:
- language: en
  script: Latn
  content: Signaling DHCPv6 Prefix per Client Availability to Hosts
  format: text/plain
docidentifier:
- content: draft-ietf-6man-pio-pflag
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: <p>This document defines a "P" flag in the Prefix Information Option (PIO)
    of IPv6 Router Advertisements (RAs). The flag is used to indicate that the network
    prefers that clients use the RFC9663 deployment model instead of using individual
    adresses in the on-link prefix assigned using Stateless Address Autoconfiguration
    (SLAAC) or DHCPv6 address assignment. This document updates RFC4862 to indicate
    that the Autonomous flag in a PIO needs to be ignored if the PIO has the P flag
    set. It also updates RFC4861 to specify that the P flag indicates DHCPv6 Prefix
    Delegation support for clients.</p>
  format: text/html
