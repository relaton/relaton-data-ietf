abstract:
- language: en
  script: Latn
  content: <p>A Virtual Private LAN Service (VPLS) is used to interconnect systems
    across a wide-area or metropolitan-area network, making it appear that they are
    on a private LAN.  The systems that are interconnected may themselves be LAN switches.  If,
    however, they are IP hosts or IP routers, certain simplifications to the operation
    of the VPLS are possible.  We call this simplified type of VPLS an "IP-only LAN                      Service"
    (IPLS).  In an IPLS, as in a VPLS, LAN interfaces are run in promiscuous mode,
    and frames are forwarded based on their destination Media Access Control (MAC)
    addresses.  However, the maintenance of the MAC forwarding tables is done via
    signaling, rather than via the MAC address learning procedures specified in the
    IEEE's "Media Access Control            (MAC) Bridges".  This document specifies
    the protocol extensions and procedures for support of the IPLS service.</p>
- language: en
  script: Latn
  content: "<p>The original intent was to provide an alternate solution to VPLS for
    those Provider Edge (PE) routers that were not capable of learning MAC addresses
    through data plane.  This became a non-issue with newer hardware.  The concepts
    put forth by this document are still valuable and are adopted in one form or other
    by newer work such as Ethernet VPN in L2VPN working group and possible data center
    applications.  At this point, no further action is planned to update this document
    and it is published simply as a historic record of the ideas.</p>"
