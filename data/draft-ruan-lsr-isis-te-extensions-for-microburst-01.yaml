abstract:
- language: en
  script: Latn
  content: "<p>This document defines IS-IS and OSPF sub-TLVs and a BGP-Link State
    (BGP-LS) Link Attribute TLV for advertising aggregated measurements of microburst
    activity on a unidirectional link. The information is reported for an identified
    traffic class and includes event, packet- drop, and queue-occupancy statistics.
    An Anomalous (A) bit carries a locally determined anomaly indication. This document
    specifies the encoding and distribution of the information. Microburst detection,
    loss attribution, threshold selection, and actions taken by a consumer are outside
    the scope of this document.</p>"
