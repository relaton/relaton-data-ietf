abstract:
- language: en
  script: Latn
  content: "<p>This document describes general requirements for Session PEERing for
    Multimedia INTerconnect and defines the minimum set of requirements applicable
    to SIP session peering for VoIP interconnects. In its current form, the document
    is a first draft based on the SPEERMINT mailing list's discussions on requirements.
    The main objectives are to generate consensus on what categories of requirements
    should be covered, and to start more discussions on the technical protocol requirements
    that apply to VoIP interconnects.</p>"
