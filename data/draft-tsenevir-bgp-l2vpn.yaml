abstract:
- language: en
  script: Latn
  content: "<p>Membership and configuration discovery is a key component in Layer 2\nVPN infrastructure. This document presents use of BGP-MP extensions\nfor VPLS Membership and configuration discovery. More specifically,\nthis document adapts generic VPN discovery methods presented in [2]\nfor VPLS Membership and Configuration discovery.</p>"
