abstract:
- language: en
  script: Latn
  content: "<p>Post-quantum cryptography presents new challenges for device manufacturers,
    application developers, and service providers. This document highlights the unique
    characteristics of applications and offers best practices for implementing quantum
    ready usage profiles in applications that use TLS and key supporting protocols
    such as DNS.</p>"
