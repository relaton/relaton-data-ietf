- language: en
  script: Latn
  content: "<p>This document provides the requirements for implementing a Framework
    for Service Personalization (FSP) in OPES intermediaries. This document provides
    a summary of modifications and required protocols that need to be supported by
    OPES intermediaries in order to allow for the development, deployment, and execution
    of a Service Personalization (SP) call-out server.</p>"
