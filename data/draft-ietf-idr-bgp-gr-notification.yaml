id: draftietfidrbgpgrnotification
schema_version: v1.5.6
title:
- language: en
  script: Latn
  content: Notification Message Support for BGP Graceful Restart
  format: text/plain
docidentifier:
- content: draft-ietf-idr-bgp-gr-notification
  type: Internet-Draft
  primary: true
date:
- type: published
  at: '2018-11-27'
abstract:
- language: en
  script: Latn
  content: "<p>The BGP Graceful Restart mechanism defined in RFC 4724 limits the usage
    of BGP Graceful Restart to BGP messages other than BGP NOTIFICATION messages.
    This document updates RFC 4724 by defining an extension that permits the Graceful
    Restart procedures to be performed when the BGP speaker receives a BGP NOTIFICATION
    message or the Hold Time expires. This document also defines a new subcode for
    BGP Cease NOTIFICATION messages; this new subcode requests a full session restart
    instead of a Graceful Restart.</p>"
  format: text/html
