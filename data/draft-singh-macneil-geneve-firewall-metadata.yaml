abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a mechanism for embedding security-related\n   metadata within the Geneve header (RFC 8926).  It allows a security\n   Enforcement Point to attach a cryptographically signed, verifiable\n   attestation of how it handled a packet, so that downstream\n   Enforcement Points and tunnel endpoints can confirm that security\n   policy was actually executed on the data path -- detecting policy\n   bypasses and divergence between Enforcement Points that should agree\n   -- while each Enforcement Point continues to enforce its own policy\n   independently.  This validation of execution complements the\n   management plane's validation of intent.  The document presents two\n   operational models.  The primary model is the \"End-to-End Attestation\n   Model\", fully compliant with RFC 8926, where an ingress tunnel\n   endpoint adds and cryptographically signs metadata, and an egress\n   endpoint verifies it.  This enables downstream nodes to verify and\n   audit that policy was executed consistently, while still applying\n   their own policy independently.  The second part of this document\n   presents a proposal for a future extension to the Geneve standard.\n   This proposed extension would allow trusted transit devices to\n   participate in the metadata chain, enabling a hop-by-hop \"chain of\n   custody\" for enhanced, real-time security responsiveness within the\n   data center fabric.</p>"
