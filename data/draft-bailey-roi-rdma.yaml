abstract:
- language: en
  script: Latn
  content: "<p>This document defines a Remote Direct Memory Protocol (iWarp) to\nrun on the Direct Data Placement Protocol (DDPP) [DDPP].  This\ninitial draft is an incomplete sketch of iWarp to be used only as\nthe basis of discussion of protocol and architectural issues with\nDDPP and RDMA.</p>"
