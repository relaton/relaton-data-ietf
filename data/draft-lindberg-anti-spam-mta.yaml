abstract:
- language: en
  script: Latn
  content: "<p>This memo gives a number of implementation recommendations for SMTP,
    MTAs (Mail Transfer Agents, e.g.  sendmail,) to make them more capable of reducing
    the impact of spam.  This document specifies an Internet Best Current Practices
    for the Internet Community, and requests discussion and suggestions for improvements.</p>"
