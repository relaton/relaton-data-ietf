abstract:
- language: en
  script: Latn
  content: "<p>A registered domain name can change its authoritative DNS operator
    while the registrant also migrates service endpoints, such as web, API, CDN, mail,
    or cloud-hosted services. In this situation, service RRsets such as A, AAAA, CNAME,
    MX, SRV, SVCB, and HTTPS RRsets can change at the same time as the parent-side
    delegation changes. The parent-side delegation change is not observed by all recursive
    resolvers at the same instant. During the transition, some resolvers can continue
    to query the losing DNS operator while others query the gaining DNS operator.
    If the losing operator continues to serve stale service RRsets, or if it stops
    serving the zone too early, users can receive different answers depending on resolver
    cache state and can experience intermittent service failure. This document provides
    operational guidance for authoritative DNS operator changes with service endpoint
    migration for registered domain names. It recommends a registrant-authorized change
    plan, a consistency profile for in-scope service RRsets, synchronized provisioning
    or a common source of truth, a hold period during which the losing DNS operator
    continues to serve target or otherwise equivalent data, and verification points
    that directly compare the losing and gaining authoritative servers and classify
    observed states as planned, service-risk, or unexpected-delegation conditions.</p>"
