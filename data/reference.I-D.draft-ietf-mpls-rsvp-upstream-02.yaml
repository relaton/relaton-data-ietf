- language: en
  script: Latn
  content: "<p>This document describes procedures for distributing upstream-assigned
    labels for Resource Reservation Protocol - Traffic Engineering (RSVP- TE).  It
    also describes how these procedures can be used for avoiding branch LSR traffic
    replication on a LAN for RSVP-TE point-to- multipoint (P2MP)LSPs.</p>"
