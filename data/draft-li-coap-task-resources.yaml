abstract:
- language: en
  script: Latn
  content: "<p>Many operations on constrained devices cannot complete within a single
    CoAP request and response exchange. Examples include firmware installation, diagnostic
    procedures, commissioning, calibration, and physical actuation. This document
    defines a common lifecycle model for representing such operations as addressable
    CoAP Task Resources. It specifies task creation, state monitoring, discovery,
    cancellation, terminal-state retention, and eventual removal. It also defines
    a four-part request payload model, identified by the existing CoAP Content-Format
    Option, for carrying resource operations together with task execution controls.
    No new CoAP Option is defined.</p>"
