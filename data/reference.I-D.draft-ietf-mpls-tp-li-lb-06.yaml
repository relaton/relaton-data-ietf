abstract:
- language: en
  script: Latn
  content: "<p>This document specifies one function and describes a second function
    which are applicable to MPLS transport networks. The first function enables an
    operator to lock a transport path while the second enables an operator to set,
    in loopback, a given node along a transport path. This document also defines the
    extension to MPLS operation, administration, and maintenance (OAM) to perform
    the lock function. This document updates RFC 6371 section 7.1.1.</p>"
