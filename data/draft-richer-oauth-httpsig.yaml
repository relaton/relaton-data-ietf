abstract:
- language: en
  script: Latn
  content: "<p>This extension to the OAuth 2.0 authorization framework defines a method
    for using HTTP Message Signatures to bind access tokens to keys held by OAuth
    2.0 clients. Discussion Venues This note is to be removed before publishing as
    an RFC. Discussion of this document takes place on the Web Authorization Protocol
    Working Group mailing list (oauth@ietf.org), which is archived at https://mailarchive.ietf.org/arch/browse/oauth/.
    Source for this draft and an issue tracker can be found at https://github.com/jricher/draft-richer-oauth-httpsig.</p>"
