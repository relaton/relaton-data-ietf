abstract:
- language: en
  script: Latn
  content: "<p>This document discusses the difference between intended configuration
    and applied configuration of a device and how intended and applied configuration
    relate to the operational state of a device. The document defines the necessary
    terminology and identifies requirements enabling visibility into the difference
    of intended configuration and applied configuration.</p>"
