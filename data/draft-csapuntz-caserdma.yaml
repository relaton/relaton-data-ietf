abstract:
- language: en
  script: Latn
  content: "<p>The end-to-end performance of IP networks for bulk data transfer is
    often limited by data copying overhead in the end systems. Even when end systems
    can sustain the bandwidth of high-speed networks, copying overheads often limit
    their ability to carry out other processing tasks.</p>"
