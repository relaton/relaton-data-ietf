- language: en
  script: Latn
  content: "<p>For SFC, it's generally transmitted over an overlay network.A Service
    Function Chain is an overlay carried over by an underlay network.This document
    defines necessary interworking stand-alone Network Virtual Edge and Service Forwarding
    Function entities to ensure proper handling of SFC traffic by the underlay network.</p>"
