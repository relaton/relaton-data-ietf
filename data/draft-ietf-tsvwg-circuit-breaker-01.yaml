abstract:
- language: en
  script: Latn
  content: <p>This document explains what is meant by the term "network transport
    circuit breaker" (CB). It describes the need for circuit breakers when using network
    tunnels, and other non-congestion controlled applications. It also defines requirements
    for building a circuit breaker and the expected outcomes of using a circuit breaker
    within the Internet.</p>
