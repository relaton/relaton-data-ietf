abstract:
- language: en
  script: Latn
  content: "<p>This document defines a framework to enable the host-network collaboration
    for high-speed and high-throughput data transmission, coupled with fast completion
    time and newtork utilization of High Performance Wide Area Networks (HP-WAN).
    It particularly enhances the congestion control by introducing signaling mechanisms
    and collaborative functions, including rate negotiation, traffic scheduling, resource
    reservation, admission control and rate control to meet job-level objectives.</p>"
