abstract:
- language: en
  script: Latn
  content: <p>This document supplements RFC 3279. It specifies algorithm identifiers,
    and ASN.1 encoding rules for the Digital Signature Algorithm (DSA) and Elliptic
    Curve Digital Signature Algorithm (ECDSA) digital signatures when using SHA-224,
    SHA-256, 384 or SHA-512 as hashing algorithm. This specification applies to the
    Internet X.509 Public Key Infrastructure (PKI) when digital signatures are used
    to sign certificates and certificate revocation list (CRLs). The key words "MUST",
    "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT", "SHOULD", "SHOULD NOT", "RECOMMENDED",
    "MAY", and "OPTIONAL" in this document are to be interpreted as described in [RFC
    2119].</p>
