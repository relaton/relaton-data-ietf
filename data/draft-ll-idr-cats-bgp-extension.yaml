abstract:
- language: en
  script: Latn
  content: "<p>CATS (Computing-Aware Traffic Steering) is a traffic engineering approach
    that takes into account the dynamic nature of computing resources and network
    state to optimize service-specific traffic forwarding towards a service contact
    instance. This document defines the control plane BGP extension for CATS (Computing-Aware
    Traffic Steering).</p>"
