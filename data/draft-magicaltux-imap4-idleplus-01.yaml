- language: en
  script: Latn
  content: "<p>This document describes a new extension for IMAP4 servers. This new
    extension aims to extend the functions provided by the existing IDLE extension
    (RFC 2177) to better fit needs of current IMAP4 clients by allowing monitoring
    of multiple folders. Comments are solicited and should be addressed to the author.</p>"
