abstract:
- language: en
  script: Latn
  content: <p>This internet draft is a critique of RFC 9583, "Application Scenarios
    for the Quantum Internet". Section 3.2 of that document presents network clock
    synchronization as application for quantum internet. The present internet draft
    argues why it is not.</p>
