abstract:
- language: en
  script: Latn
  content: "<p>This document describes a format for distributing collections of security
    policy statments as static documents. Individual security policy statements are
    expressed in a HTTP compatible header syntax. Lists of security policy statements
    are signed for exchange. Strong references to static data objects are formed using
    Named Information (ni) URI specifiers.</p>"
