abstract:
- language: en
  script: Latn
  content: "<p>The IP Mobility Protocol [RFC3344] describes multicast and broadcast
    packet transmission between the mobile node and the home network or visited network.
    Reverse Tunneling for Mobile IP [RFC3024] includes support for reverse tunneling
    of multicast and broadcast packets to the home network using the encapsulating
    delivery style between mobile nodes and the foreign agent. However, [RFC3024]
    says that once the encapsulated delivery style is negotiated, all packets must
    be encapsulated. In particular, this imposition prevents direct delivery of unicast
    packets. This causes tunnel overhead in the (typically) wireless medium between
    the mobile and the foreign agent. This document removes this imposition It also
    provides alternatives of direct delivery of multicast/broadcast packets between
    a foreign agent and a mobile node if allowed by the underlying link-layer.</p>"
