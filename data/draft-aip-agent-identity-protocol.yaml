abstract:
- language: en
  script: Latn
  content: "<p>This document defines the Agent Identity Protocol (AIP), an open\n   standard for verifiable identity and policy enforcement for\n   artificial intelligence (AI) agents.\n\n   Agent Identity Protocol (AIP) addresses the problem of AI agents\n   operating with unbounded permissions -- running as users, inheriting\n   full API key access, and executing tool calls with no verifiable\n   identity boundary between human and non-human actors.\n\n   The protocol is structured as two cooperating layers.  Layer 1\n   (Identity) gives every agent a unique identifier and a key pair\n   registered with an AIP Registry; the agent signs every outbound\n   action with that key.  Layer 2 (Enforcement) interposes a proxy\n   between the AI client and every tool server that verifies the\n   signature, evaluates a declarative policy, and produces an allow,\n   deny, or hold decision before any tool is reached.</p>"
