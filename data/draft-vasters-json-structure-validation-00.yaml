abstract:
- language: en
  script: Latn
  content: "<p>The JSON Structure Validation extension provides schema authors with
    additional means to constrain instance data. These keywords are applied in conjunction
    with the constructs defined in JSON Structure Core. The keywords defined herein
    include numeric, string, array, and object validation keywords as well as conditional
    validations.</p>"
