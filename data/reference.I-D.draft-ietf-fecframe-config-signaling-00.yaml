abstract:
- language: en
  script: Latn
  content: <p>FEC Framework document [FECARCH] defines the FEC Framework Configuration
    Information necessary for the FEC framework operation. This document describes
    one signaling protocol to determine and dynamically communicate the Configuration
    information between sender(s) and receiver(s).  Conventions used in this document  In
    examples, "C:" and "S:" indicate lines sent by the client and server respectively.</p>
