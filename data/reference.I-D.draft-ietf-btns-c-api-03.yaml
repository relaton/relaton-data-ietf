abstract:
- language: en
  script: Latn
  content: "<p>IPsec based security is usually transparent for applications and and
    they have no standard APIs for gathering information about protected network connections
    and for detecting the underlying security mechanisms.  This document specifies
    an API that increases the visibility of IPsec to applications.  The API allows
    applications to allow BTNS extensions, control the channel bindigs, and control
    also other security properties related to IPsec.</p>"
