abstract:
- language: en
  script: Latn
  content: "<p>This document defines an HTTP authentication scheme that can be used\n   by clients to redeem Privacy Pass tokens with an origin.  It can also\n   be used by origins to challenge clients to present an acceptable\n   Privacy Pass token.\n\nDiscussion Venues\n\n   This note is to be removed before publishing as an RFC.\n\n   Source for this draft and an issue tracker can be found at\n   https://github.com/tfpauly/privacy-proxy.</p>"
