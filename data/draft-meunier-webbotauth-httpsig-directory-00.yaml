  script: Latn
  content: "<p>This document describes a method for clients using [HTTP-MESSAGE-SIGNATURES]
    to advertise their signing keys. It defines a key directory format based on JWKS
    as defined in Section 5 of [JWK], as well as a new HTTP Method Context for in-band
