abstract:
- language: en
  script: Latn
  content: <p>This document defines the terminology regarding the usage of expressions
    such as "IPv6-Only" and "IPv6-Mostly", in order to avoid confusions when using
    them in IETF and other documents. The goal is that the reference to "IPv6-Only"
    describes the actual native functionality being used, not the actual protocol
    support.</p>
