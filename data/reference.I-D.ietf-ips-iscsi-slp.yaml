abstract:
- language: en
  script: Latn
  content: "<p>The iSCSI protocol provides a way for hosts to access SCSI devices
    over an IP network. This document defines the use of the Service Location Protocol
    (SLP) by iSCSI hosts, devices, and management services, along with the SLP service
    type templates that describe the services they provide.</p>"
