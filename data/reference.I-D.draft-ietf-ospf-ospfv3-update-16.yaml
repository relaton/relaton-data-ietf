abstract:
- language: en
  script: Latn
  content: "<p>This document describes the modifications to OSPF to support version
    6 of the Internet Protocol (IPv6). The fundamental mechanisms of OSPF (flooding,
    Designated Router (DR) election, area support, SPF calculations, etc.) remain
    unchanged. However, some changes have been necessary, either due to changes in
    protocol semantics between IPv4 and IPv6, or simply to handle the increased address
    size of IPv6. Changes between OSPF for IPv4 and this document include the following.
    Addressing semantics have been removed from OSPF packets and the basic LSAs. New
    LSAs have been created to carry IPv6 addresses and prefixes. OSPF now runs on
    a per-link basis rather than on a per-IP-subnet basis. Flooding scope for LSAs
    has been generalized. Authentication has been removed from the OSPF protocol and
    instead relies on IPv6's Authentication Header and Encapsulating Security Payload.
    Even with larger IPv6 addresses, most packets in OSPF for IPv6 are almost as compact
    as those in OSPF for IPv4. Most fields and packet- size limitations present in
    OSPF for IPv4 have been relaxed. In addition, option handling has been made more
    flexible. All of OSPF for IPv4's optional capabilities, including demand circuit
    support, Not-So-Stubby Areas (NSSAs), and the multicast extensions to OSPF (MOSPF)
    are also supported in OSPF for IPv6.</p>"
