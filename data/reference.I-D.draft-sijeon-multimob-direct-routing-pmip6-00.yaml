abstract:
- language: en
  script: Latn
  content: "<p>To support IP multicasting in PMIPv6 domain, [I-D.ietf-multimob- pmipv6-base-solution]
    has been determined as a base solution. This solution requires all the LMA to
    forward multicast packets to MAG via PMIPv6 tunnel. This approach creates a tunnel
    convergence problem. To resolve the issue, the current MULTIMOB WG charter is
    trying to draw a solution about how to separate multicasting routing from a mobility
    anchor. As an effective solution, we propose the direct routing approach that
    makes the direct connection between MAG and multicast router. The advantages of
    the proposed direct routing solution are compared with the base solution and dedicated
    LMA approach. This draft is derived and revised from [I-D.sijeon-multimob-mms-pmip6]
    as re-chartered MULTIMOB WG description.</p>"
