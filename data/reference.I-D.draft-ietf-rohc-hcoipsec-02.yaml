abstract:
- language: en
  script: Latn
  content: "<p>Internet Protocol security mechanisms, such as IP Security (IPsec)
    [IPSEC], provide various security services for IP traffic. However, the benefits
    of IPsec come at the cost of increased overhead. This document defines a framework
    for integrating Header Compression (HC) over IPsec (HCoIPsec). By compressing
    the inner headers of IP packets, HCoIPsec proposes to reduce the amount of overhead
    associated with the transmission of traffic over IPsec security associations.</p>"
