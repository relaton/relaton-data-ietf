abstract:
- language: en
  script: Latn
  content: "<p>Content Delivery Networks (CDNs) are commonly used for improving the
    footprint and the end-user experience of a content delivery service, at a reasonable
    cost.  This document outlines real world use-cases (not technical solutions) for
    interconnecting CDNs.  The intention is to motivate CDN Interconnection and to
    support the case for formation of a Working Group, which would work on the definition
    of standardized, inter-operable method(s) for interconnecting CDNs.</p>"
