abstract:
- language: en
  script: Latn
  content: "<p>This draft describes the methodology for benchmarking MPLS Protection
    mechanisms for link and node protection as defined in [MPLS-FRR-EXT]. The  benchmarking
    \ and  terminology  [TERM-ID]  are  to  be  used  for benchmarking  MPLS  based
    \ protection  mechanisms  [MPLS-FRR-EXT].  This document provides test methodologies
    and test-bed setup for measuring failover times while considering all dependencies
    that might impact faster recovery of real time services riding on MPLS based primary
    tunnel.  The terms used in the procedures included in this document are defined
    in [TERM-ID].</p>"
