- language: en
  script: Latn
  content: |-
    <p>This document describes a URN namespace to identify immutable octet-
    stream resources using content-based unique identifiers.  The naming
    scheme relies on an algorithm that computes identifiers from media
    types and cryptographic hashes without a central authority.</p>
