abstract:
- language: en
  script: Latn
  content: "<p>This document defines a mechanism of using BGP for the discovery of
    L2VPN membership information. The L2VPN membership information can be used by
    a L2VPN signaling protocol to set up pseudowires for L2VPNs, such as VPWS and
    VPLS.</p>"
