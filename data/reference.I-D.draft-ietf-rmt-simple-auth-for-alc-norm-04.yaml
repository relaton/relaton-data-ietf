abstract:
- language: en
  script: Latn
  content: "<p>This document introduces four schemes that provide per-packet authentication,
    integrity and anti-replay services in the context of the ALC and NORM protocols.
    \ The first scheme is based on digital signatures.  The second scheme relies on
    the Elliptic Curve Digital Signature Algorithm (ECDSA).  The third scheme relies
    on a group Message Authentication Code (MAC).  Finally, the fourth scheme merges
    the digital signature and group group schemes.  These schemes have different target
    use cases and they do not all provide the same service.</p>"
