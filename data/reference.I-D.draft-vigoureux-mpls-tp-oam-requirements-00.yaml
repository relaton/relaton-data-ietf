abstract:
- language: en
  script: Latn
  content: "<p>This document specifies requirements for OAM (Operations and Management)
    functionality in MPLS networks that are used for packet transport services and
    network operations. The use of the term MPLS in this document refers to both MPLS
    PSNs and pseudowire technologies.  These requirements are derived from the set
    of requirements specified by ITU-T and first published in the ITU-T Supplement
    Y.Sup4 [6].</p>"
