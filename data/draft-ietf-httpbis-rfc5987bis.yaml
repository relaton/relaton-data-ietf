- language: en
  script: Latn
  content: Indicating Character Encoding and Language for HTTP Header Field Parameters
  format: text/plain
docidentifier:
- content: draft-ietf-httpbis-rfc5987bis
  type: Internet-Draft
  primary: true
abstract:
- language: en
  script: Latn
  content: "<p>By default, header field values in Hypertext Transfer Protocol (HTTP)
    messages cannot easily carry characters outside the US-ASCII coded character set.
    RFC 2231 defines an encoding mechanism for use in parameters inside Multipurpose
    Internet Mail Extensions (MIME) header field values. This document specifies an
    encoding suitable for use in HTTP header fields that is compatible with a simplified
    profile of the encoding defined in RFC 2231. This document obsoletes RFC 5987.</p>"
  format: text/html
