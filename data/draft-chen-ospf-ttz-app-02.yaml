abstract:
- language: en
  script: Latn
  content: <p>This document discusses the applicability of "OSPF Topology- Transparent
    Zone". It briefs the protocol and its operations first, and then illustrates the
    application scenarios of OSPF Topology- Transparent Zone. In addition, guidelines
    for deployment are presented and limitations of the protocol are indicated. This
    document is intended for accompanying "OSPF Topology-Transparent Zone" to the
    Internet standards track.</p>
