abstract:
- language: en
  script: Latn
  content: "<p>With the global deployment of RPKI, a lot of concerns from technical,
    economic and political aspects have and will be raised. In this draft, we collect
    and analyze the problems have been appeared or will appear during the RPKI deployment,
    and give the alternative solutions to address or mitigate these problems.</p>"
