abstract:
- language: en
  script: Latn
  content: "<p>This document discusses Virtual Machine (VM) mobility solutions that
    are commonly used in overlay-based Data Center (DC) networks. The objective is
    to describe the solutions and their impact on moving VMs (and applications) from
    one rack to another connected by the Overlay networks. For layer 2 networks, it
    is based on using an NVA (Network Virtualization Authority) - NVE (Network Virtualization
    Edge) protocol to update the ARP (Address Resolution Protocol) table or neighbor
    cache entries after a VM (virtual machine) moves from an Old NVE to a New NVE.
    For Layer 3, it is based on migration of address and connection after the move.</p>"
