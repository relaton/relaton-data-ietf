abstract:
- language: en
  script: Latn
  content: "<p>Collections of related objects are defined in MIB modules.  It may
    be useful to define the acceptable lower-bounds of implementation, along with
    the actual level of implementation achieved.  It is the purpose of this document
    to define the notation used for these purposes. [STANDARDS-TRACK]</p>"
