abstract:
- language: en
  script: Latn
  content: "<p>IOTMP (Internet of Things Message Protocol) is a compact, binary,\n   application-layer protocol for bidirectional communication between\n   IoT devices and servers over persistent connections.  It provides a\n   resource-oriented model with native support for remote procedure\n   calls, real-time data streaming, and API introspection.  IOTMP uses\n   PSON (Packed Sensor Object Notation) as its data encoding format,\n   achieving significantly lower wire overhead than text-based\n   alternatives.  The protocol is designed for constrained devices with\n   limited memory and bandwidth, while remaining expressive enough for\n   complex IoT applications.  IOTMP operates over TCP, TLS, or WebSocket\n   transports and supports symmetric operation where both clients and\n   servers may expose and invoke resources.</p>"
