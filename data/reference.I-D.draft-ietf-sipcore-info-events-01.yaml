abstract:
- language: en
  script: Latn
  content: "<p>This document provides new semantics for the SIP INFO method of RFC
    2976.  These new semantics defined here are fully backwards compatible with the
    old semantics.  Core to the new semantics is a mechanism for defining, indicating
    support of, and exchanging Info Packages that use the INFO method.  Applications
    that need to exchange application information within a SIP invite usage dialog
    (RFC 5057), can use these Info Packages.  This document replaces RFC 2976 but
    still allows existing legacy INFO usages as defined in RFC 2976.</p>"
