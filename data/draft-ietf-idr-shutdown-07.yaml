abstract:
- language: en
  script: Latn
  content: |-
    <p>This document enhances the BGP Cease NOTIFICATION message
       "Administrative Shutdown" and "Administrative Reset" subcodes for
       operators to transmit a short freeform message to describe why a BGP
       session was shutdown or reset.  This document updates RFC 4486.</p>
