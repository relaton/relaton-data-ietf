abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a new Home Agent Redirect mechanism, where
    an initially contacted Home Agent can let the Mobile Node knows that it needs
    to connect to an alternate Home Agent to get mobility services for overload prevention
    and/or load balancing purposes.  This document proposes a new error code for the
    binding acknowledgement message and a new mobility option to be carried on the
    binding acknowledgement message for this purpose.</p>"
