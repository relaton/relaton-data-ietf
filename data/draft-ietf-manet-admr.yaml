abstract:
- language: en
  script: Latn
  content: "<p>The Adaptive Demand-Driven Multicast Routing protocol (ADMR) has been\ndesigned specifically for use in the ad hoc network environment.\nMulticast routing state in ADMR is dynamically established and\nmaintained only for groups that have at least one receiver and\none active sender in the network.</p>"
