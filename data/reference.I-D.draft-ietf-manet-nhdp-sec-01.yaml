abstract:
- language: en
  script: Latn
  content: "<p>This document specifies a security extension to the MANET Neighbor
    Discovery Protocol (NHDP).  The extension introduces the use of Integrity Check
    Values (ICVs) and Timestamps in HELLO messages in order to counter a selection
    of security threats to NHDP.</p>"
