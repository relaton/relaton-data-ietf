abstract:
- language: en
  script: Latn
  content: "<p>This memo defines a portion of the Management Information Base (MIB)
    for use with network management protocols in the Internet community. In particular,
    it describes managed objects used for retrieving a subtree of MIB objects without
    the overshoot problems of the SNMP GetBulkRequest operation.</p>"
