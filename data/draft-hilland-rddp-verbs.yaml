- language: en
  script: Latn
  content: "<p>This document describes an abstract interface to a RDMA enabled NIC
    (RNIC). This interface is implemented as a combination of the RNIC, its associated
    firmware, and host software. It provides access to the RNIC queuing and memory
    management resources, as well as the underlying networking layers.</p>"
