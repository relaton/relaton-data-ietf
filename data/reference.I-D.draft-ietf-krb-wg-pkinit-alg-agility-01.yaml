abstract:
- language: en
  script: Latn
  content: "<p>The PK-INIT protocol have in several places hard coded crypto algorithms.
    The protocol specification needs to be updated so it can support negotiation to
    upgrading to newer versions of crypto algorithms. This document addresses this
    issue.</p>"
