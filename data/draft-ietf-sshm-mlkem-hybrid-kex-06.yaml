abstract:
- language: en
  script: Latn
  content: "<p>This document defines Post-Quantum Traditional (PQ/T) Hybrid key exchange
    methods based on the quantum-resistant the Module-Lattice- Based Key-Encapsulation
    Mechanism (ML-KEM) standard and traditional Elliptic-curve Diffie–Hellman (ECDH)
    key exchange schemes. These methods are defined for use in the SSH Transport Layer
    Protocol.</p>"
