abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Multi-Vantage Path Snapshot (MVPS) bundle\n   format, a focused envelope for traceroute observations collected in\n   coordination from two or more network vantages towards a common\n   destination.  MVPS defines a JSON serialization, a YANG 1.1 module,\n   and a deterministic path-fingerprint algorithm enabling bit-\n   reproducible auditing and cross-implementation interoperability.\n\n   MVPS is intentionally minimal in scope: it specifies a wire format\n   and the algorithms required to produce it deterministically.\n   Analytical metrics derived from MVPS bundles are out of scope.\n\n   MVPS complements the AURA architecture defined by RFC 9198, which\n   specifies a measurement architecture but does not normatively specify\n   the result format.  MVPS is intended as one possible result format\n   for AURA-style coordinated measurements.  MVPS is also positioned\n   relative to existing single-operator reporting formats (RIPE Atlas\n   measurement JSON, CAIDA warts), which are not standardised and which\n   do not provide a deterministic cross-implementation path identity.</p>"
