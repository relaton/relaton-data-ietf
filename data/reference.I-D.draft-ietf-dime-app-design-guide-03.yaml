abstract:
- language: en
  script: Latn
  content: "<p>The Diameter Base protocol provides updated rules on how to extend
    Diameter by modifying and/or deriving from existing applications or creating entirely
    new applications. This is a companion document to the Diameter Base protocol which
    further explains and/or clarify these rules. It is meant as a guidelines document
    and therefore it does not add, remove or change existing rules.</p>"
