abstract:
- language: en
  script: Latn
  content: "<p>The Multi-Vantage Path Snapshot (MVPS) bundle format\n   [I-D.melegassi-ippm-mvps-bundle] specifies a deterministic wire\n   envelope but defers cryptographic binding of vantage reports.\n   This document specifies the MVPS Trust Profile, named\n   Coherent-Witness Trust (CWT), which closes that gap with\n   minimal cryptographic overhead: HMAC-SHA256 per-snapshot\n   authentication under an epoch-bound vantage session key,\n   anchored every epoch by an Ed25519-signed Operator Epoch\n   Manifest, and cosigned by independent witnesses on a bundle\n   Merkle checkpoint.\n\n   The measured per-snapshot crypto cost is 2.1 us -- strictly\n   less than the 4.2 us required to parse the JSON snapshot it\n   protects.  At N = 1000 vantages and 1 Hz tick, the total\n   verification load is 0.21 % of one CPU core.\n\n   The profile inherits the full MVPS v4.0 theorem catalogue\n   and proves two theorems not available in simpler per-snapshot\n   signature designs: T-COAL-1 (multi-operator coalition\n   resistance via witness independence) and T-SPLIT-1 (collector\n   split-view resistance via cosignature quorum).  Numerical\n   receipts are in evidence/mvps_cwt_overhead_receipt.json and\n   scripts/validate_cwt_theorems.py (12/12 PASS).\n\n   The design draws on two production precedents: the HMAC-\n   personalized authentication of the Tesla vehicle-command\n   protocol [TESLA-VEHICLE-CMD] and the witness-cosignature\n   model of the Sigsum / tlog-witness ecosystem\n   [C2SP-TLOG-WITNESS].  Neither codebase is reused; constructs\n   are independently composed for the multi-vantage measurement\n   setting.</p>"
