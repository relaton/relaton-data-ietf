abstract:
- language: en
  script: Latn
  content: "<p>In some IPv6/IPv4 translation scenarios it is necessary for an IPv6
    host to know the IPv6 prefix used by its NAT64.  In some of the IPv6/ IPv4 translation
    proposals, the prefix is not fixed; that is, the prefix is chosen by the network
    operator.  This specification provides two methods for a host learn its NAT64's
    IPv6 prefix and length.</p>"
