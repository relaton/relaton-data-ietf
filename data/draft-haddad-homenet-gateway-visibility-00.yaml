- language: en
  script: Latn
  content: "<p>This memo describes a mechanism designed to increase the home gateway
    visibility on the home network that it is serving. This includes knowledge of
    all IPv6 addresses configured using prefixes assigned by the home gateway and
    advertised by router(s) attached to it.</p>"
