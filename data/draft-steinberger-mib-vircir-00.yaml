abstract:
- language: en
  script: Latn
  content: |-
    <p>This memo defines an extension of the Management Information Base
    (MIB) for use with network management protocols in TCP/IP-based
    internets.  In particular, it defines objects to allow management of
    remote network monitoring in networks containing virtual circuits.</p>
