- language: en
  script: Latn
  content: "<p>This document describes a framework for providing multicast as a service
    via Bit Index Explicit Replication (BIER) [RFC7279], and specifies a few enhancements
    to [draft-ietf-bier-idr-extensions] [RFC8279] [RFC8401] [RFC8444] to enable multicast/BIER
    as a service.</p>"
