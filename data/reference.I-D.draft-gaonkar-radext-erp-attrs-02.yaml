abstract:
- language: en
  script: Latn
  content: "<p>This document specifies the Key-Request and Key-Response attributes
    in Remote Authentication and Dial-In User Service (RADIUS).  These attributes
    can be used by a visited network entity to request a key from the home network
    and the home domain to deliver the key to the visited network entity; the request
    and response may be piggy-backed on the EAP authentication or EAP Re-authentication
    bootstrapping exchange between the user and the user's home RADIUS server or may
    be part of a separate exchange.</p>"
