- language: en
  script: Latn
  content: "<p>PSI-02 specifies a privacy-preserving cryptographic attestation that
    a registered NDIS service provider's operational evidence satisfies the NDIS Practice
    Standards. The attestation binds a canonicalised evidence digest to an Ed25519
    signature without disclosing participant data or commercially sensitive material.</p>"
