- language: en
  script: Latn
  content: "<p>This document specifies a diagnostic payload format to be returned
    in TCP RST segments. Such payloads are used to share with the endpoints the reasons
    for which a TCP connection has been reset. This is meant to ease diagnostic and
    troubleshooting.</p>"
