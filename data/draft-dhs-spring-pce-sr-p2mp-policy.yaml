- language: en
  script: Latn
  content: "<p>SR P2MP policies are set of policies that enable architecture for P2MP
    service delivery. This document specifies extensions to the Path Computation Element
    Communication Protocol (PCEP) that allow a stateful PCE to compute and initiate
    P2MP paths from a Root to a set of Leaves.</p>"
