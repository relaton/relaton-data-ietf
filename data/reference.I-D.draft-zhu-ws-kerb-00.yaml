abstract:
- language: en
  script: Latn
  content: "<p>This document defines extensions to the Kerberos protocol and the GSS-API
    Kerberos mechanism that enable a GSS-API Kerberos client to exchange messages
    with the KDC using the GSS-API server as the proxy, by encapsulating the Kerberos
    messages inside GSS-API tokens. With these extensions, Kerberos is suitable for
    securing communication between the client and web services over the Internet</p>"
