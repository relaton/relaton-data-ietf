- language: en
  script: Latn
  content: "<p>This document describes an OPTIONAL feature for active performance
    measurement protocols that allows use of the Precision Time Protocol timestamp
    format defined in IEEE 1588v2, as an alternative to the Network Time Protocol
    that is currently used.</p>"
