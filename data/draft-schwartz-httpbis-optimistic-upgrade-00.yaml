abstract:
- language: en
  script: Latn
  content: "<p>The HTTP/1.1 Upgrade mechanism allows the client to request a change
    to a new protocol. This document discusses the security considerations that apply
    to data sent by the client before this request is confirmed, and updates RFC 9298
    to avoid related security issues.</p>"
