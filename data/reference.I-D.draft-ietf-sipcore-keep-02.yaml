abstract:
- language: en
  script: Latn
  content: <p>This specification defines a new Session Initiation Protocol (SIP) header
    field parameter, "keep", that SIP entities can use to negotiate explicit support
    of the NAT keep-alive mechanisms defined in the SIP Outbound specification.  The
    parameter is defined for cases where the SIP Outbound mechanism is not supported,
    or in cases where it cannot be applied.</p>
