abstract:
- language: en
  script: Latn
  content: "<p>Currently a Pseudowire (PW) uses two reverse unidirectional LSPs as
    Packet Switching Network (PSN) tunnels, and each PE of a PW or segment of MS-PW
    selects PSN tunnels independently. In contrast MPLS-TP requires support for both
    bidirectional and unidirectional LSPs. In addition some transport services may
    require bidirectional traffic follows with congruent paths. Therefore, PWs may
    be required to use PSN tunnels with congruent paths.  This document specifies
    some extensions to LDP that ensures both ends of a PW (or segment PW) select and
    bind to the same bidirectional LSP or use unidirectional LSPs with congruent paths.</p>"
