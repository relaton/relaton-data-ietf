abstract:
- language: en
  script: Latn
  content: "<p>This document provides a framework for applying Generalized Multi-
    Protocol Label Switching (GMPLS) and the Path Computation Element (PCE) architecture
    to the control of wavelength switched optical networks (WSON).  In particular,
    it examines the Routing and Wavelength Assignment (RWA) problem.  This document
    focuses on topological elements and path selection constraints that are common
    across different WSON environments as such it does not address optical impairments
    in any depth.</p>"
