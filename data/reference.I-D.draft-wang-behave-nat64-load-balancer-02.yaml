  script: Latn
  content: "<p>[STANDBY] has discussed how to achieve load-balancing among a group
    of NAT64 devices. However, it doesn't explore the issues with achieving load-balancing
    with load-balancers. In this memo, we propose our investigation on this topic.</p>"
