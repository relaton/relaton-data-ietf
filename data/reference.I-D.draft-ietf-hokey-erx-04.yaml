abstract:
- language: en
  script: Latn
  content: "<p>The extensible authentication protocol (EAP) is a generic framework
    supporting multiple types of authentication methods. In systems where EAP is used
    for authentication, it is desirable to not repeat the entire EAP exchange with
    another authenticator. This document specifies, EAP Reauthentication Extensions
    (ERX), extensions to EAP and EAP keying hierarchy to support a EAP method-independent
    protocol for efficient Re-authentication between the peer and the server through
    an authenticator.</p>"
