abstract:
- language: en
  script: Latn
  content: "<p>This document describes a mechanism called TCP In-Band Single Packet\n   Authentication (TCP-SPA).  A client that wishes to open a TCP\n   connection to a protected server embeds a compact Message\n   Authentication Code (MAC) inside the TCP SYN packet itself, carried\n   as an experimental TCP option (kind 253, per [RFC6994]), with an ExID\n   (Experiment Identifier) value of TBD to be assigned by IANA.  The\n   server verifies the MAC at the earliest possible point in the network\n   stack — before a socket is allocated or the TCP handshake proceeds —\n   and drops the SYN if verification fails.\n\n   This approach differs from existing Single Packet Authentication\n   (SPA) systems in that no out-of-band authentication packet is\n   required: authentication and connection establishment are a single\n   atomic step.</p>"
