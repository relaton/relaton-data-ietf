abstract:
- language: en
  script: Latn
  content: "<p>This document describes a Transport Model for the Simple Network Management
    Protocol (SNMP), that uses the Datagram Transport Layer Security (DTLS) protocol.
    \ The DTLS protocol provides authentication and privacy services for SNMP applications.
    \ This document describes how the DTLS Transport Model (DTLSTM) implements the
    needed features of a SNMP Transport Subsystem to make this protection possible
    in an interoperable way.  This transport model is designed to meet the security
    and operational needs of network administrators, operate in environments where
    a connectionless (e.g.  UDP or SCTP) transport is preferred, and integrates well
    into existing public keying infrastructures.  This document also defines a portion
    of the Management Information Base (MIB) for monitoring and managing the DTLS
    Transport Model for SNMP.</p>"
