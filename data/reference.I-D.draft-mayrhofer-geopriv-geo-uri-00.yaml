abstract:
- language: en
  script: Latn
  content: "<p>This document specifies an Uniform Resource Identifier (URI) for geographic
    locations using the 'geo' scheme name.  A 'geo' URI provides latitude, longitude
    and optionally altitude of a physical location in a compact, simple, human-readable,
    and protocol independent way.</p>"
