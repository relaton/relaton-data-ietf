abstract:
- language: en
  script: Latn
  content: "<p>This memo proposes a reference model for energy consumption monitoring
    and control.  It claims that the only basic extension of conventional network
    management models is the concept of power interfaces of managed entities.  Power
    interfaces can be treated similarly to network interfaces.  They have different
    modes (outlet, inlet, probe) and their connections to transmission media (lines)
    define a power supply topology among the involved managed entities. This memo
    elaborates an information model for power interfaces that meets the requirements
    for energy management.</p>"
