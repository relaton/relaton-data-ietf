abstract:
- language: en
  script: Latn
  content: "<p>The Unheaded Protocol defines a mapped data bus model that transforms\n   IPv6 packets into addressable memory by encoding a small register\n   file directly in the IPv6 Hop-by-Hop Options extension header.\n\n   We introduce a 20-byte Monad (register file) that carries program\n   state through the network.  At each hop, a BPF program (the Shim)\n   performs computation on the Monad.  The packet itself becomes the\n   working memory, using exponent-encoded fields to pack rich metadata\n   into the IPv6 option while remaining fully backward-compatible with\n   existing networks.\n\n   To support programs larger than what fits in a single Monad, we\n   introduce Wotan, a memory and I/O bus that bridges Monad computation\n   to per-flow ring-buffer storage and external topics.  This decouples\n   the Monad (pure, 20-byte compute) from memory (Wotan's configurable\n   data planes).\n\n   This memo extends the packet format with two additional capabilities:\n   (1) Kingdom Mode Address Reclamation, which recovers up to 224 bits\n   of deterministic address space from IPv6 addresses within a\n   controlled L2 fabric for use as extended computational and\n   cryptographic registers; and (2) Post-Quantum Cryptographic Identity\n   Binding, which cryptographically binds each service identifier in the\n   Monad to a post-quantum keypair via the Sophia dictionary system,\n   providing quantum-resistant authentication of per-packet metadata\n   without increasing wire overhead.\n\n   This memo defines the normative packet format, exponent-encoding\n   scheme, per-hop processing semantics, address reclamation model,\n   post-quantum identity binding, optional chaos injection for\n   resilience testing, and the complete computational model (Turing-\n   complete with memory paging).</p>"
