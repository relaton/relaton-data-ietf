abstract:
- language: en
  script: Latn
  content: <p>This document defines the "Payment" HTTP authentication scheme, enabling
    HTTP resources to require a payment challenge to be fulfilled before access. The
    scheme extends HTTP Authentication, using the HTTP 402 "Payment Required" status
    code. The protocol is payment-method agnostic, supporting any payment network
    or currency through registered payment method identifiers. Specific payment methods
    are defined in separate payment method specifications.</p>
