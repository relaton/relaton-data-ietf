abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines a mechanism for an OAuth 2.0 authorization
       server to obtain the metadata of an OAuth 2.0 client, including its
       endpoint locations and capabilities without the need for registration
       of the client.

    Discussion Venues

       This note is to be removed before publishing as an RFC.

       Source for this draft and an issue tracker can be found at
       https://github.com/mattrglobal/draft-looker-oauth-client-discovery.</p>
