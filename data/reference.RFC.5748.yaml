abstract:
- language: en
  script: Latn
  content: "<p>This document updates IANA registries to support the SEED block cipher
    algorithm for the Secure Real-time Transport Protocol (SRTP) and the secure Real-time
    Transport Control Protocol (SRTCP) in Multimedia Internet KEYing (MIKEY).  This
    document is not an Internet  Standards Track specification; it is published for
    informational purposes.</p>"
