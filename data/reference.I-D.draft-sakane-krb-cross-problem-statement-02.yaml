abstract:
- language: en
  script: Latn
  content: "<p>There are some issues when the cross-realm operation of the Kerberos
    Version 5 [RFC4120] is employed into the specific systems. This document describes
    some manners of the real example, and lists requirements of the operation in such
    real system. Then it clarifies issues when we apply the cross-realm operation
    to such specific system.</p>"
