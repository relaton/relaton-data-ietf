abstract:
- language: en
  script: Latn
  content: |-
    <p>OSCORE group communication can secure CoAP group communication across
       untrusted proxies, but in doing so sidesteps the proxies' caching
       abilities.  This restores cachability of requests by introducing
       consensus requests which any client in a group can send.</p>
