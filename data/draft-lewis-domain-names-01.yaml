abstract:
- language: en
  script: Latn
  content: "<p>This document states a definition of Domain Name beyond the use of
    the term within the Domain Name System. The document includes a survey of the
    diverse ways Domain Names have been interpreted within various protocols over
    time. The purpose of this is to give a solid foundation for work on Domain Names
    across all protocols making use of Domain Names.</p>"
