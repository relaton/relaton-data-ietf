abstract:
- language: en
  script: Latn
  content: "<p>Advanced models can propose operations that produce physical effects.
    Model-to-Matter defines an executor-owned profile that composes model, safety,
    institutional, domain, screening, and human evidence over one canonical action
    before single-use execution. This revision also profiles post-execution Outcome
    Binding. An executor effect statement remains one source claim; required independent
    observers sign separately bound observations. Missing outcome evidence is indeterminate,
    not success or failure. The profile standardizes evidence custody and reconciliation;
    it does not perform screening, determine scientific safety, certify a facility,
    or establish physical truth.</p>"
