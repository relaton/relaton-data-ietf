abstract:
- language: en
  script: Latn
  content: "<p>This document describes leveraging UDP encapsulation for IPsec, using
    ESP NULL encryption in order for intermediary devices to inspect the IPsec packets.
    Currently in the IPsec standard, there is no way to differentiate between ESP
    encryption and ESP NULL encryption by simply examining a packet.</p>"
