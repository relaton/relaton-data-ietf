abstract:
- language: en
  script: Latn
  content: "<p>This document defines a BGP Extended Community, the Link Bandwidth
    Extended Community, which carries bandwidth information to enable weighted load-balancing
    in multipath scenarios. It specifies the format and processing rules for this
    extended community type.</p>"
