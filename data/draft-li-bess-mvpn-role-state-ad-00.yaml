  script: Latn
  content: <p>The document defines and uses a new BGP attribute called the "Role Discovery
    attribute" to advertise the role and corresponding primary/ backup state for Multicast
    in MPLS/BGP IP VPNs [RFC6514]. The role- based state advertisement can help optimization
    of process in MPLS/ BGP Multicast VPN.</p>
