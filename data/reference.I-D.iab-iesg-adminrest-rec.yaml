abstract:
- language: en
  script: Latn
  content: "<p>This document describes a joint recommendation of the Internet Architecture
    Board and the Internet Engineering Steering Group for administrative restructuring
    of the Internet Engineering Task Force. This recommendation will be discussed
    on the IETF list (ietf@ietf.org), and the IETF leadership will attempt to determine
    if there is IETF consensus in going forward with this plan through a Last Call
    process.</p>"
