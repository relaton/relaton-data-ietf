abstract:
- language: en
  script: Latn
  content: |-
    <p>This specification defines an EAP method, EAP-AKA', a small revision
       of the EAP-AKA method.  EAP-AKA' provides a key derivation function
       that binds the keys derived within the method to the name of the
       access network.  The key derivation mechanism has been defined in the
       3rd Generation Partnership Project (3GPP).  This specification allows
       its use in EAP in an interoperable manner.  In addition, EAP-AKA'
       employs SHA-256 instead of SHA-1.

       This specification also updates RFC 4187 EAP-AKA to prevent bidding
       down attacks from EAP-AKA'.

       This version of the EAP-AKA' specification provides updates to
       specify the protocol behaviour for 5G deployments as well.</p>
