abstract:
- language: en
  script: Latn
  content: "<p>This document defines schema and behavioral rules which are \nnecessary
    to fully accommodate the use of internationalized domain \nnames as UTF-8 sequences
    in LDAP. Specifically, this document \ndefines an internationalized domain component
    attribute, email \naddress attribute, URI syntax, and several related object classes,
    \nand also discusses their usage considerations.</p>"
