abstract:
- language: en
  script: Latn
  content: "<p>This document describes the procedures for a Service Provider to offer
    Virtual Private Network Services to its customers by provisioning the CE devices
    on behalf of the customer. The IPsec technology is used to protect the customer
    traffic, and the HTTP protocol is used to autodiscover the CEs' VPN configuration
    information.</p>"
